<html>

<head>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
    }

    td {
      font-size: 15px;
      vertical-align: top;
    }

    .logo,
    .nabh-logo {
      width: 100%;
      height: 100%;
    }

    .logo-fit {
      width: 100%;
      height: 100px;
    }

    * {
      font-family: sans-serif;
    }

    .facilityname {
      font-size: 20px !important;
    }

    .head_data .address1 {
      font-size: 13px !important;
    }

    .head_data {
      position: relative;
      top: 10px;
    }

    .logo-fit {
      position: relative;
      top: 10px;
      left: 10px;
    }

    .header-details {
      padding-left: 25px !important;
      position: relative;
      top: 0px;
    }

    .nabh-logo-fit {
      width: 90%;
      height: 120px;
    }

  </style>
</head>
<div class="header-details">
  <table>
    <tr>
      <td style="width: 20%;">
        <div class="logo-fit">
          <img class="logo" src="data:image/png;base64,{{data.Preferences.Facilitylogo}}" />
        </div>
      </td>
      <td>
        <div class="head_data" align="center">
          {{{data.Preferences.reportheader}}}
        </div>
      </td>
      <td style="width: 20%;">
        <div class="nabh-logo-fit">
          <img class="logo" src="data:image/png;base64,{{data.Preferences.NABHlogo}}" />
        </div>
      </td>
    </tr>
  </table>
</div>

</html>
