
<div>{{#if data.SectionValues.Condition.Data}}
    <div class="left"style="background-color: lightgrey;"><b>Condition</b></div> 
    <table class="size" style="width:90%">
        <tr>
            <th style="width:30%" align="left">Condition Type</th>
            <th style="width:40%" align="left">Name</th>
        </tr>                
        {{#each data.SectionValues.Condition.Data}}
            <tr>
                <td style="width:30%">{{ConditionType.Description}}</td>
                <td style="width:40%">{{DiagnosisName}}</td>
            </tr>
        {{/each}}
    </table>
    {{/if}}
</div>
