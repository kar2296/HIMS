<html>

<head>
  <style>
    .table1 {
      border: 1px solid black;
      font-size: 8px;
    }
    
    .table2 {
      border: 1px solid black;
      border-top: 0px solid black;
      font-size: 8px;
    } 
    {{include '/Templates/assets/css/core.css'}}
  </style>
</head>

<body>
  <div id="pageHeader">
    {{{include '/Templates/appasamy/common/header.tpl.html' 'tpl'}}}
  </div> 
    <div style="text-align:center;font-size: 16px;"><b>Billing Groups Report</b></div>
     
  </br>
    <table class="table1" style="width:100%;">
      <tr>
        <td style="width:20;">S.NO</td>
        <td style="width:20%;"><b>Code</b></td>
        <td style="width:20%"><b>Billing Group</b></td>
        <td style="width:20%"><b>Display Order</b></td>
        <td style="width:20%"><b>Print Order</b></td>
      </tr>
    </table>
    <table class="table2" style="width:100%;">
      {{#each data.ServiceCategory}}
      <tr>
        <td style="width:20%;">{{inc @index}}</td>
        <td style="width:20%">{{ServiceCategoryCode}}</td>
        <td style="width:20%">{{ServiceCategoryName}}</td>
        <td style="width:20%">{{DisplayOrder}}</td>
        <td style="width:20%">{{PrintOrder}}</td>
      </tr>{{/each}}
    </table> 

  </body>
  <div style="width:100%; font-size:8px;">Printed On: {{now}}</div>

</html>s
