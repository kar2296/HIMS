sonar.projectKey=my-react-app
sonar.projectName=My React App
sonar.projectVersion=1.0

# Source paths
sonar.sources=.

sonar.sourceEncoding=UTF-8

# Read credentials from environment variables (set in .env or CI pipeline)
sonar.host.url=${env.SONAR_HOST_URL}
sonar.token=${env.SONAR_TOKEN}

# Only scan React/TypeScript source files - exclude everything else
sonar.inclusions=\
  src/**/*.ts,\
  src/**/*.tsx,\
  src/**/*.js,\
  src/**/*.jsx,\
  api/src/**/*.ts,\
  api/src/**/*.js

# Broad exclusions for all legacy, vendor, and build artifacts
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.scannerwork/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/*.css,\
  **/Templates/**,\
  **/vendor/**,\
  **/public/**,\
  **/bower_components/**,\
  src/Server/**,\
  api/src/Server/Templates/**
