<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="attachmenttype"
                translate="registration.attachmentcontrol.attachmenttype.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="cvm.item.AttachmentTypeId" name="attachmenttype"
                    ng-change="cvm.attachmentTypeChange($select.selected)">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in cvm.lookup.AttachmentType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="registration.attachmentcontrol.selectfile.lbl"></label>
            <div class="col-sm-12">
                <input type="file" style="border: 0px !important;border-radius: 0px;background: none !important;"
                    ngf-select ng-model="cvm.currentcontext.file" name="file" ngf-max-size="200MB"
                    ngf-change="cvm.fileSelected()" />
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="name"
                translate="registration.attachmentcontrol.attachmentname.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="name" ng-model="cvm.item.AttachmentName" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="registration.attachmentcontrol.comments.lbl"></label>
            <div class="col-sm-12">
                <commentscontrol comments="cvm.item.Comments"></commentscontrol>
            </div>
        </div>
    </form>
</div>
<div class="row">
    <custom-table config="cvm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="pull-right">
            <button type="button" class="draftbutton" translate="common.saveaction.lbl"
                ng-click="cvm.saveItem()"></button>
        </div>
    </div>
</div>
