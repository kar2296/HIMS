<ui-select ng-model="cvm.countryid" ng-change="cvm.setCountryInfo($select.selected)" name="country" ng-disabled="cvm.candisable">
    <ui-select-match>
        {{$select.selected.Text | limitTo : 20 : 0}}
        <span ng-if="$select.selected.Text.length>20">...</span>
    </ui-select-match>
    <ui-select-choices repeat="lookupitem.Id as lookupitem in cvm.countrys | filter: { Text: $select.search }">
        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
    </ui-select-choices>
</ui-select>
