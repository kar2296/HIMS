<style>

        top: -10px;
        left: 20px;
        width: 20px;
        height: 15px;
        background-color: #fff;
        color: #333;
        font-size: 11px;
    }

    #dropdownctrl .btn-default {

        background-image: -moz-linear-gradient(top, #ee5f5b, #bd362f);
        background-repeat: repeat-x;
        border-color: #bd362f #bd362f #802420;
        border-color: rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.25);

.fontctrl{ color: #ffffff; text-shadow: 0 1px 1px #194B7E;}

 <a href="" class="btn btn-default btn-xs" ng-click="cvm.patientalerts()" uib-tooltip="{{'common.patientalert.lbl' | translate }}"
