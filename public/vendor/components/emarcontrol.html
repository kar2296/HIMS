        font-size: 12px;
    }

    table.table.table-hover.table-responsive.table-bordered.immunization_tbl td span:first-child {
        /* background: #D77; */
        color: #0984f7;
        cursor: pointer;
        font-weight: 600;
    }

    table.table.table-hover.table-responsive.table-bordered.immunization_tbl td span:first-child:hover {
        color: #000;
    }

    table.table.table-hover.table-responsive.table-bordered.immunization_tbl span {
        color: #fff;
    }

    table.table.table-hover.table-responsive.table-bordered.immunization_tbl tr {
        border: none;
        padding: 0px !important;
    }

    .table>thead>tr>th {
        padding: 8px 8px;
    }

    table.table.table-hover.table-responsive.table-bordered.immunization_tbl td {
        padding: 4px;
        /* font-size: 15px; */
        /* border:none; */
        /* text-align: center; */
    }

    table.table.table-hover.table-responsive.table-bordered.immunization_tbl tr td:hover {
        /* border:1px solid red !important;
        padding:2px; */
        padding: 4px !important;
    }

    table.table.table-hover.table-responsive.table-bordered.immunization_tbl>thead>tr>th {
        padding: 8px 2px;
        text-align: center;
        margin: 0 auto;
    }

    @media screen and (max-width:1024px) {
        .formRoot {
            overflow: scroll;
        }
    }

    @media screen and (max-width:768px) {
        .col-sm-4 {
            width: 33.3333%;
        }

        .modal-header.custom-modal-header {
            margin-top: 4%;
        }

        .col-sm-12.immunozation_footer p {
            font-size: 10px;
        }
    }

    @media screen and (max-width:414px) {
        .col-sm-12.immunozation_footer.clearfix {
            display: none;
        }

        .col-sm-12.formRoot {
            height: 611px !important;
        }

        .modal-header.custom-modal-header {
            margin-top: 2%;
        }

        h4.col-sm-6.modal-title.custom-modal-title {
            display: block;
            float: left;
        }
    }

    }

    .lefcol3 span {

        font-weight: 600;
    }

        min-width: 10px;
        background-color: #14b3c370 !important;
    }

        margin-left: -18px;
        margin-top: 2%;
    }

        width: 25%;
    }

        margin-bottom: 9px;

        width: 25%;
        background: #14b3c33b;
    }

    .col-sm-12.fontbold {
        color: black;
        font-weight: 600;
        margin-left: 13%;
    }

    span.drug.ng-binding {
        color: #2609c5;
        font-weight: 600;
        text-decoration: underline;
    }

    .table th {
        min-width: 10px;
        background-color: #14b3c370 !important;
        color: black !important;
    }

    div#patientlabresult {
        overflow-y: unset !important;
        height: unset !important;

    .table>tbody>tr>td>* {

    }

    span.col-sm-1 {
        width: 10%;

<div class="">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-12">
            <div id="chartroot">
                <div class="emar table">
                    <table class="table table-hover table-responsive table-bordered">
                        <thead class="bg-subhead">
                            <tr>
                                <th rowspan="2">
                                    <span translate="Prescription"></span>
                                </th>
                                <th colspan="4" ng-repeat="header in cvm.HeaderDrugInfo">
                                    <div class="thead">
                                        <div>
                                            <displaydate date-val="header.drgDate"></displaydate>
                                        </div>
                                        <div class="col-sm-12">
                                            <div class="col-sm-3" translate="STAT"></div>
                                            <div class="col-sm-3" translate="Morning"></div>
                                            <div class="col-sm-3" translate="Noon"></div>
                                            <div class="col-sm-3" translate="Night"></div>
                                        </div>
                                    </div>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr ng-repeat="items in cvm.drugdetails">
                                <td>{{items.drugName}} </td>
                                <td colspan="4" ng-repeat="header in cvm.HeaderDrugInfo">
                                    <div class="col-sm-12 tbody">
                                        <div class="col-sm-3">
                                            <img class="doseimg"
                                                ng-src="{{cvm.CanShowStat(items.drugName,header.drgDate).img}}"
                                                ng-click="cvm.openadminister(cvm.CanShowStat(items.drugName,header.drgDate).Id)">
                                        </div>
                                        <div class="col-sm-3">
                                            <img class="doseimg"
                                                ng-src="{{cvm.CanShowMorning(items.drugName,header.drgDate).img}}"
                                                ng-click="cvm.openadminister(cvm.CanShowMorning(items.drugName,header.drgDate).Id)">
                                        </div>
                                        <div class="col-sm-3">
                                            <img class="doseimg"
                                                ng-src="{{cvm.CanShowNoon(items.drugName,header.drgDate).img}}"
                                                ng-click="cvm.openadminister(cvm.CanShowNoon(items.drugName,header.drgDate).Id)">
                                        </div>
                                        <div class="col-sm-3">
                                            <img class="doseimg"
                                                ng-src="{{cvm.CanShowNight(items.drugName,header.drgDate).img}}"
                                                ng-click="cvm.openadminister(cvm.CanShowNight(items.drugName,header.drgDate).Id)">
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td colspan="11">
                                    <span class="col-sm-1"> <button style="padding: 0px 8px;margin-right: 4px;"
                                            class="administered">A</button> Administered</span>
                                    <span class="col-sm-1"> <button style="padding: 0px 8px;margin-right: 4px;"
                                            class="currentdose">C</button>Current Dose</span>
                                    <span class="col-sm-1"> <button style="padding: 0px 8px;margin-right: 4px;"
                                            class="futuredose">F</button>Future Dose </span>
                                    <span class="col-sm-1"> <button style="padding: 0px 8px;margin-right: 4px;"
                                            class="discontinued">D</button>Discontinued</span>
                                    <span class="col-sm-1"> <button style="padding: 0px 8px;margin-right: 4px;"
                                            class="hold">H</button> Hold</span>
                                    <span class="col-sm-1" style="width: 20%;"> <button
                                            style="padding: 0px 8px;margin-right: 4px; margin-left: -8px; width: 18%;"
                                            class="clinicalmani">CM</button> Clinical Manifestation</span>
                                    <span class="col-sm-1"> <button
                                            style="padding: 0px 8px;margin-right: 4px;margin-left: 24%;"
                                            class="refusal">R</button> Refusal</span>
                                    <span class="col-sm-1" style="width: 19%;"> <button
                                            style="padding: 0px 8px;margin-right: 4px;margin-left: 15px; width: 18%;"
                                            class="notadmin">NA</button> Not Administered</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
