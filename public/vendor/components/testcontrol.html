<ui-select ng-model="cvm.testid" ng-change="cvm.setItemInfo($select.selected)" name="test">
    <ui-select-match>
        <span ng-if="$select.selected.Text">{{$select.selected.Code + "-" + $select.selected.Text | limitTo : 20 : 0}}</span>
        <span ng-if="$select.selected.Text.length>20">...</span>
    </ui-select-match>
    <ui-select-choices refresh="cvm.searchItem($select.search)" repeat="lookupitem.Id as lookupitem in cvm.items | filter: { Text: $select.search.Text, Code: $select.search.Code }">
        <div>
            <span ng-bind-html="lookupitem.Code | highlight: $select.search"></span>
            <span ng-if="lookupitem.Id != -1">-</span>
            <span ng-bind-html="lookupitem.Text | highlight: $select.search"></span>
        </div>
    </ui-select-choices>
</ui-select>
