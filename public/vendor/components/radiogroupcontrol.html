<div class="btn-group col-sm-12" role="group" data-toggle="buttons">
    <label class="btn btn-sm width btn-custom-radio {{item.btnclass}} {{item.Text}}" ng-repeat="item in cvm.currentcontext.items"
        ng-model="cvm.itemid" uib-btn-radio="{{item.Id}}" ng-change="cvm.selectItem(item)"
        ng-disabled="cvm.isdisabled">
        <div class="feedback-icon"></div>
    <span ng-style="{color: item.Color}">{{item.Text}}</span>
    </label>
</div>
