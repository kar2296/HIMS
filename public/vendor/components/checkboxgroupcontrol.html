<style>
    .btn-custom-radio {
        margin: 2px !important;
        border-radius: 4px !important;
        -moz-border-radius: 4px !important;
        -webkit-border-radius: 4px !important;
    }

    .btn.btn-default {
        border: 1px solid #797272 !important;
    }
</style>
<div class="btn-group" role="group" data-toggle="buttons">
    <label class="btn btn-sm btn-custom-radio {{item.btnclass}}"ng-repeat="item in cvm.currentcontext.items"
        ng-model="cvm.rstitems[item.Id]" uib-btn-checkbox="{{item.Id}}" ng-disabled="cvm.isdisabled">{{item.Text}}</label>
</div>
