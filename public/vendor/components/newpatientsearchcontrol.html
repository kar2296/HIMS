<script type="text/ng-template" id="patientsearchPopupTemplate.html">
  <div class="custom-popup-wrapper"
       ng-style="{top: position().top+'px', left: position().left+'px'}"
       style="display: block;"
       ng-show="isOpen() && !moveInProgress"
       aria-hidden="{{!isOpen()}}">


      <table class="table table-bordered table-condensed" role="listbox">
        <thead>
            <td class="td-title">Title</td>
            <td class="td-name">Name</td>
            <td class="td-dob">DOB</td>
            <td class="td-age">Age/Gender</td>
            <td class="td-mrn">MRN</td>
            <td class="td-mrn">Mobile #</td>
            <!-- <td class="td-visitid">Visit#</td> -->
        </thead>
        <tbody>
          <tr class="uib-typeahead-match" ng-repeat="match in patients" ng-class="{active: isActive($index) }"
            ng-mouseenter="selectActive($index)" ng-click="selectMatch($index)" role="option" id="{{::match.model.Id}}">

            <td class="td-title">{{match.model.TitleDesc}}</td>
            <td class="td-name">{{match.model.PatientName}}</td>
            <td class="td-dob"><displaydate date-val='match.model.DOB' style="white-space: nowrap !important;"></displaydate></td>
            <td class="td-age">{{match.model.Age}}/{{match.model.GenderCode}}</td>
            <td class="td-mrn">{{match.model.MRN}}</td>
            <td class="td-mrn">{{match.model.Mobile}}</td>
            <!-- <td class="td-visitid">{{match.model.VisitIdentifier}}</td> -->
          </tr>
        </tbody>
      </table>
    </div>
  </script>
