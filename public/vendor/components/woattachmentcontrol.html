<div ng-show="cvm.config.readonly != true">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="row">
            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label" translate="lis.attachmentcontrol.selectfile.lbl"></label>
                <div class="col-sm-12">
                    <div class="serach">
                        <input name="name" class="form-control" ngf-select ng-model="cvm.currentcontext.file"
                            name="file" style="height: 32px;" placeholder="Upload Your file here"
                            ng-model="cvm.item.AttachmentName">
                        <button class="btnupload"><i class="lni lni-upload" ngf-select
                                ng-model="cvm.currentcontext.file" name="file" ngf-max-size="200MB"
                                ngf-change="cvm.fileSelected()"></i></button>
                    </div>
                </div>
            </div>
            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label pd0" for="name"
                    translate="lis.attachmentcontrol.attachmentname.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="name" ng-model="cvm.item.AttachmentName"
                        placeholder="">
                </div>
            </div>
            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label" translate="lis.attachmentcontrol.comments.lbl"></label>
                <div class="col-sm-12">
                    <commentscontrol comments="cvm.item.Comments"></commentscontrol>
                </div>
            </div>
            <div class="form-group col-sm-3">
                <div class="pull-right" style="margin-top: 13px;">
                    <button type="button" class="draftbutton" translate="common.saveaction.lbl"
                        ng-click="cvm.saveItem()"></button>
                </div>
            </div>
        </div>
    </form>
</div>
