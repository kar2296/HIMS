<style>
    button.settingbtn {
        background: #272d8c;
    }
    
    div#favoritebtncolorcontroler label {
        margin: 0;
    }
    
    div#favoritebtncolorcontroler {
        margin: 5px;
    }
    
    .btn-default:active,
    .btn-default.active,
    .open>.dropdown-toggle.btn-default {
        color: #000000 !important;
    }
    
    button.btn.btn-default.dropdown-toggle {
        border-left: 0px;
        font-size: 10px;
    }
    
    button.btn.btn-default.dropdown-toggle:focus {
        border: 1px solid !important;
        border-left: 0 !important;
        background: white;
    }
    
    .modal-full {
        width: 55% !important;
        height: 95%;
        margin: auto;
    }
    
    .modal-content {
        position: relative;
        top: 10%;
    }
    
    button.btn.btn-default.dropdown-toggle {
        height: 34px;
    }
    /* .btn-default:active,
    .btn-default.active {
        color: #ffffff;
        background-color: #03A9F4;
    } */
</style>
<div class="col-sm-12">
    <div class="col-sm-10">
        <div class="btn-group">
            <label class="btn btn-secondary top-option opt-selected" ng-repeat="ticksheet in cvm.ticksheets" ng-model="cvm.selectedticksheet" uib-btn-radio="{{ticksheet.Id}}" ng-click="cvm.ticksheetClick(ticksheet)">{{ticksheet.TickSheetName}}</label>
        </div>
    </div>
    <div class="col-sm-2">
        <button class="btn-add" ng-click="cvm.openTicksheet()" uib-tooltip="{{ 'common.addaction.lbl' | translate }}" tooltip-placement="bottom">
            <i class="fa fa-plus" aria-hidden="true"></i>
        </button>
        <button class="drhms-billing-btn settingbtn" uib-tooltip="Manage Order Favourite" tooltip-placement="bottom" ng-click="cvm.openTicksheet(cvm.selectedticksheet)">
            <i class="fa fa-cog" aria-hidden="true"></i>
        </button>
    </div>
</div>
<div class="col-sm-12">
    <div ng-repeat="ticksheet in cvm.ticksheets">
        <div ng-show="ticksheet.Id==cvm.selectedticksheet" id="listalignctrl">
            <fieldset class="" ng-repeat="group in ticksheet.groups">
                <legend class="">
                    <span>{{group}}</span>
                </legend>

                <div class="btn-group ticksheet-item width-control" id="favoritebtncolorcontroler" ng-repeat="tsdetail in ticksheet.TickSheetMasterDetails" ng-if="tsdetail.GroupName == group">
                    <label class="btn btn-default" ng-model="cvm.listmodel[tsdetail.Id]" uib-btn-checkbox uib-tooltip="{{tsdetail.ItemName}} / {{tsdetail.ItemStoreMaster.MrPrice}} / {{tsdetail.ItemStoreMaster.StockItem.Quantity }}" tooltip-placement="bottom">
                        <span>{{tsdetail.ItemName}}</span>
                    </label>
                    <button class="btn btn-default dropdown-toggle" type="button" ng-click="cvm.caretClicked(tsdetail)">
                        <i class="fa fa-info-circle" aria-hidden="true"></i>
                    </button>
                </div>

            </fieldset>
        </div>
    </div>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="pull-right">
            <button type="button" class="draftbutton" translate="common.nextaction.lbl" ng-click="cvm.saveTickSheets()"></button>
        </div>
    </div>
</div>
