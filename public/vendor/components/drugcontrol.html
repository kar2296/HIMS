<ui-select ng-model="cvm.drugid" ng-change="cvm.setDrugInfo($select.selected)" name="drug">
    <ui-select-match>
        {{$select.selected.Text | limitTo : 20 : 0}}
        <span ng-if="$select.selected.Text.length>20">...</span>
    </ui-select-match>
    <ui-select-choices refresh="cvm.searchDrug($select.search)" repeat="lookupitem.Id as lookupitem in cvm.drugs | filter: { Text: $select.search }">
        <div>
            <span ng-bind-html="lookupitem.Text | highlight: $select.search"></span>
        </div>
    </ui-select-choices>
</ui-select>
