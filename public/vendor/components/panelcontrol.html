<div class="form-group">
    <ui-select ng-model="cvm.templateid" ng-change="cvm.savePanels($select.selected)" name="test">
        <ui-select-match>
            <span ng-if="$select.selected.Name">{{$select.selected.Name | limitTo : 20 : 0}}</span>
            <span ng-if="$select.selected.Name.length>20">...</span>
        </ui-select-match>
        <ui-select-choices refresh="cvm.searchItem($select.search)"
            repeat="lookupitem.Id as lookupitem in cvm.list | filter: { Name: $select.search.Name }">
            <div>
                <span ng-bind-html="lookupitem.Name | highlight: $select.search"></span>
            </div>
        </ui-select-choices>
    </ui-select>
</div>
