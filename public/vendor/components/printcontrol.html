<style>
    .drhms-common-btn {
        
    background: linear-gradient(270deg, #698700 0%, #c61f1f 100%);
        border-radius: 0px;
        border: 0;
        color: #fff;
        padding: 0px 10px;
        height: 30px;
        margin: 6px 3px;
    }
    .f-left {
        float: left;
    }
    /* .modal-dialog {
        width: 500px;
        margin: 30px auto;
    } */
</style>
<script type="text/ng-template" id="printConfirmModal.html">
    <div class="modal-header custom-modal-header">
        <div class="col-sm-6">
            <h4 class="modal-title custom-modal-title" translate="Original Print"></h4>
        </div>
        <div class="col-sm-6">
            <div class="filters">
                <img src="../../../../../assets/svg/close.svg" ng-click="cvm.closePrintModal()">
            </div>
        </div>
    </div>
    <div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-6 form-group">
            <label class="col-sm-12 control-label" for="comments">Reason</label>
            <div class="col-sm-12">
                    <textarea rows="3" cols="50" name="comments" ng-model="cvm.Comments" required></textarea>
            </div>
        </div>
        <div class="col-sm-12">
            <div class="pull-right">
            <button type="button" class="drhms-common-btn" ng-click="cvm.proceedPrint()" translate="common.printaction.lbl"></button>
            <!-- <button class="draftbutton" type="button" ng-click="cvm.closePrintModal()">Cancel</button> -->
        </div>
    </form>
</div>
</script>
<button type="button" class="drhms-common-btn f-left" ng-click="cvm.printaction()"><i class="fa fa-print"></i> Preview
    Print</button>
<button type="button" class="drhms-common-btn f-left" ng-click="cvm.originalprintaction()"><i class="fa fa-print"></i>
    Original Print
</button>
<div class="col-sm-3 pd0 d-flex-btn">
    <div class="col-sm-2">
        <input type="checkbox" id="withheader" class="custom-checkbox" ng-model="cvm.WithHeader"
            ng-change="cvm.checkHeader(1)">
    </div>
    <label class="col-sm-10 control-label m-0" for="header" translate="With Header"></label>
</div>
<div class="col-sm-3 pd0 d-flex-btn">
    <div class="col-sm-2">
        <input type="checkbox" id="withoutheader" class="custom-checkbox" ng-model="cvm.WithoutHeader"
            ng-change="cvm.checkHeader(2)">
    </div>
    <label class="col-sm-10 pd0 m-0" for="header" translate="WithOut Header"></label>
</div>
