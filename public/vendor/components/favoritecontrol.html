<style>
    .form-horizontal .form-group {
        height: 67px;
    }
</style>
<div class="row">
    <div class="col-sm-6">
        <h4 class="mto" style="margin: 0;" translate="Favourites"></h4>
    </div>
    <div class="col-sm-6"> <button class="btn-add" ng-click="emrfavouritesettings()"
            uib-tooltip="{{ 'patientemr.favoritecontrol.tooltipnamefavorite.lbl' | translate }}"
            tooltip-placement="left">
            <i class="fa fa-plus" aria-hidden="true"></i>
        </button>
    </div>
</div>
<div class="row">
    <div ng-if="cvm.CanFavGrouped()">
        <div class="row fav-row" ng-repeat="group in cvm.groups">
            <div class="col-sm-2 group">
                {{group}}
            </div>
            <div class="col-sm-10">
                <span class="btn-group btn-favorite" id="favoritebtncolorcontroler" ng-repeat="detail in cvm.list"
                    uib-tooltip="{{detail.DisplayName}}" tooltip-placement="bottom" ng-if="group == detail.GroupName">
                    <label class="btn btn-default" ng-model="cvm.listmodel[detail.ItemId]"
                        ng-click="cvm.caretClicked(detail)" uib-btn-checkbox>{{detail.DisplayName}}</label>

                    <!-- <button class="btn btn-default dropdown-toggle" type="button"  ng-click="cvm.caretClicked(detail)">
                                <span class="caret" ></span>
                            </button> -->
                </span>
            </div>
        </div>
    </div>
    <div class="col-sm-12" ng-if="!cvm.CanFavGrouped()">
        <span class="btn-group btn-favorite" id="favoritebtncolorcontroler" ng-repeat="detail in cvm.list"
            uib-tooltip="{{detail.DisplayName}}" tooltip-placement="bottom">
            <label class="btn btn-default" ng-model="cvm.listmodel[detail.ItemId]" ng-click="cvm.caretClicked(detail)"
                uib-btn-checkbox>{{detail.DisplayName}}</label>

            <!-- <button class="btn btn-default dropdown-toggle" type="button"  ng-click="cvm.caretClicked(detail)">
                            <span class="caret" ></span>
                        </button> -->
        </span>
    </div>
</div>
<div class="fooder-bgs">
    <div class="pull-right">
        <button type="button" class="draftbutton" translate="common.saveaction.lbl"
            ng-click="cvm.saveFavorites()"></button>
    </div>
</div>
