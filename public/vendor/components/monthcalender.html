<div class="col-sm-12">
    <div class="col-sm-6">
        <ui-select ng-model="cvm.selectedmonth" ng-change="cvm.monthchange($select.selected)" class="filter-combo">
            <ui-select-match>
                {{$select.selected.Text | limitTo : 8 : 0}}
                <span ng-if="$select.selected.Text.length>8">...</span>
            </ui-select-match>
            <ui-select-choices repeat="lookupitem.Id as lookupitem in cvm.Month | filter: { Text: $select.search }">
                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
            </ui-select-choices>
        </ui-select>
    </div>
    <div class="col-sm-6">
        <ui-select ng-model="cvm.selectedyear" ng-change="cvm.yearchange($select.selected)" class="filter-combo">
            <ui-select-match>
                {{$select.selected.Text | limitTo : 8 : 0}}
                <span ng-if="$select.selected.Text.length>8">...</span>
            </ui-select-match>
            <ui-select-choices repeat="lookupitem.Id as lookupitem in cvm.Year | filter: { Text: $select.search }">
                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
            </ui-select-choices>
        </ui-select>
    </div>
</div>
