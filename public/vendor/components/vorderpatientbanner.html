<style>
    .bodybox ul li .pimg img {
        width: 50px;
        height: 50px;
        border-radius: 50%;

    }

    .bodybox ul li {
        border: 1px solid #80808052;
        width: 100%;
        list-style: none !important;
        padding: 10px 4px;
        text-align: center;
        vertical-align: middle;
    }

    .bodybox ul {
        display: flex;
    }

    .profile-header {
        clear: both;
        height: 55px !important;
        background: white !important;
        border: 0px !important;
        margin-bottom: 15px;
    }

    .bodybox ul li span {
        width: 100%;
        display: block;
    }

    .bodybox ul li:first-child {
        background: #477694;
        color: white !important;
        padding: 10px 15px !important;
    }

    .bodybox ul li em {
        border: 1px solid gray;
        color: gray;
        padding: 7px;
        border-radius: 50%;
    }

    .bodybox ul li:last-child {
        background: #cde7e4;
        color: #1d6090;
    }

    .bodybox ul {
        padding: 0px;
    }

    #emrbannerdetails tr td:nth-child(odd) {
        background: white !important;
        color: GRAY !important;
    }

    .center-block {
        /* display: block;
    margin-left: auto;
    margin-right: auto; */
        border-radius: 47px !important;
    }

    #bannerdetails .fa {
        border: 1px solid;
        border-radius: 19px;
    }

    img.patient-img {
        width: 73px;
        border-radius: 68px;
        height: 66px;
    }

    span.ng-binding.ng-scope {
        white-space: nowrap !important;
    }
</style>
<div class="row page-header">
    <div class="col-sm-12">
        <div class="header">

            <table id="emrbannerdetails" style="width:101%;margin-bottom: 15px;">
                <ul>
                    <td style="width: 24%; BACKGROUND: #3e4b7a !important;color: white;padding: 0px 46px !important;">
                        <div class="col-sm-5" style="margin-left: -25%; width: 86px;">
                            <span class="pimg"> <img ng-show="cvm.patientinfo.PhotoPath"
                                    data-ng-src="data:image/png;base64,{{cvm.currentcontext.Photo}}"
                                    class="patient-img" /></span>
                            <span class="pimg" ng-show="!cvm.patientinfo.PhotoPath">
                                <img src="app/img/main/no-img-female.png" ng-if="cvm.patientinfo.GenderId == 2"
                                    class="img-responsive image-height-control img-thumbnail center-block ">
                                <img src="app/img/main/no-img-icon.png" ng-if="cvm.patientinfo.GenderId != 2"
                                    class="img-responsive image-height-control img-thumbnail center-block ">
                            </span>
                        </div>
                        <div class="col-sm-6" style="margin-top: 14px;color: white;white-space: nowrap !important;">
                            <span>{{cvm.patientinfo.Title.Description}} {{cvm.patientinfo.FirstName}}
                                {{cvm.patientinfo.LastName}}</span>
                            <div class="cpl-sm-12">
                                <span>
                                    <agedisplay dob="cvm.patientinfo.DOB"></agedisplay>
                                    {{cvm.patientinfo.Gender}}
                                </span>

                            </div>
                        </div>
                    </td>
                    <td style="width: 100px;">
                        <div class="col-sm-12">
                            <span>Conatct No.</span>
                        </div>
                        <div class="col-sm-12" style="COLOR: BLACK;font-weight: 600;"> <span>{{cvm.patientinfo.Mobile}}
                            </span></div>

                    </td>
                    <td style="width: 100px;">
                        <div class="col-sm-12">
                            <span class="col-sm-12">Patient Id</span>
                        </div>
                        <div class="col-sm-12">
                            <span style="font-weight: 600;color: #615f5f;" class="col-sm-12">{{cvm.patientinfo.MRN}}
                            </span>
                        </div>
                </ul>
        </div>
    </div>
</div>
</div>
