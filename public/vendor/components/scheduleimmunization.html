<style>
    .doseimg {
        width: 40px;
        height: 40px;
    }

    .adm {
        background-color: green;
    }

    .due {
        /* background-color: red;*/
        background: #D77;
    }

    .notadm {
        background-color: white;
    }

    .tdbgclass {
        background-color: white;
    }

    .overflowVisible {
        /* overflow:visible !important; */
    }

    table.table.table-hover.table-responsive.table-bordered.immunization_tbl thead {
        background: #2B2B2B;
        font-size: 12px;
    }

    table.table.table-hover.table-responsive.table-bordered.immunization_tbl td span:first-child {
        /* background: #D77; */
        color: #0984f7;
        cursor: pointer;
        font-weight: 600;
    }

    table.table.table-hover.table-responsive.table-bordered.immunization_tbl td span:first-child:hover {
        color: #000;
    }

    table.table.table-hover.table-responsive.table-bordered.immunization_tbl span {
        color: #fff;
    }

    table.table.table-hover.table-responsive.table-bordered.immunization_tbl tr {
        border: none;
        padding: 0px !important;
    }

    .table>thead>tr>th {
        padding: 8px 8px;
    }

    table.table.table-hover.table-responsive.table-bordered.immunization_tbl td {
        padding: 4px;
        /* font-size: 15px; */
        /* border:none; */
        /* text-align: center; */
    }

    table.table.table-hover.table-responsive.table-bordered.immunization_tbl tr td:hover {
        /* border:1px solid red !important;
        padding:2px; */
        padding: 4px !important;
    }

    table.table.table-hover.table-responsive.table-bordered.immunization_tbl>thead>tr>th {
        padding: 8px 2px;
        text-align: center;
        margin: 0 auto;
    }

    @media screen and (max-width:1024px) {
        .formRoot {
            overflow: scroll;
        }
    }

    @media screen and (max-width:768px) {
        .col-sm-4 {
            width: 33.3333%;
        }

        .modal-header.custom-modal-header {
            margin-top: 4%;
        }

        .col-sm-12.immunozation_footer p {
            font-size: 10px;
        }
    }

    @media screen and (max-width:414px) {
        .col-sm-12.immunozation_footer.clearfix {
            display: none;
        }

        .col-sm-12.formRoot {
            height: 611px !important;
        }

        .modal-header.custom-modal-header {
            margin-top: 2%;
        }

        h4.col-sm-6.modal-title.custom-modal-title {
            display: block;
            float: left;
        }
    }

    .lefcol2 span {
        /* color:#0000ff; */
        color: #007cff !important;
        font-weight: 600;
    }

    .lefcol3 span {
        /* color:#097909; */
        color: #da5809 !important;
        font-weight: 600;
    }
</style>
<div class="row filter-area">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-12 formRoot" set-form-height>
            <div id="chartroot">
                <!-- Patient Banner -->
                <div>
                    <div class="lefcol2">
                        <strong class="lefcol2">{{cvm.patientInfo.Title.Description}} {{cvm.patientInfo.FirstName}}
                            {{cvm.patientInfo.LastName}}
                            | {{cvm.patientInfo.MRN}} | {{cvm.patientInfo.Gender.Description}} |
                            <agedisplay class="lefcol3" dob="cvm.patientInfo.DOB"></agedisplay> |
                            <displaydate class="lefcol3" date-val='cvm.patientInfo.DOB'></displaydate>
                        </strong>
                    </div>
                    <div class="lefcol5">
                        {{cvm.patientInfo.Encounters[0].DoctorName}}
                    </div>
                </div>

                <table class="table table-hover table-responsive table-bordered immunization_tbl">
                    <thead>
                        <tr>
                            <th>
                                <span style="font-weight:bold;">Vaccine</span>
                            </th>
                            <th ng-repeat="duration in cvm.scheduleflag">
                                <span style="font-weight:bold;">{{duration.Text}}</span>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="vaccine in cvm.vaccines">
                            <td class="tdbgclass">
                                <a ng-click="cvm.checkLink(vaccine.url)"> <span>{{vaccine.Name}} </span> </a>
                            </td>
                            <td ng-class="item.bgclass" ng-repeat="item in vaccine.Doses">
                                <div>
                                    <img class="doseimg" ng-src="{{item.imgsrc}}" ng-click="cvm.openImmunizaation(item)"
                                        ng-if="item.imgsrc">
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </form>
</div>
