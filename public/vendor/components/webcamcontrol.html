<style>
#thumbnail{padding: 247px 4px 0px 122px;}
#thumbnail img{ width: 38px; height: 27px;}
div#webcam .btn-primary {
    color: #00273c;
    background-color: #97d7ff !important;
    /* border-color: #5899eb; */
}
</style>


<div class="col-sm-6">
    <div id="webcam">
        <webcam channel="cvm.webcam.channel" on-streaming="cvm.webcam.onSuccess()" on-error="cvm.webcam.onError(err)"
            on-stream="cvm.webcam.onStream(stream)"></webcam>
        <button type="button" class="btn btn-primary btn-sm" ng-click="cvm.webcam.makeSnapshot()"
            uib-tooltip="{{ 'common.captureaction.lbl' | translate }}" tooltip-placement="right"> <i
                class="fa fa-camera-retro" aria-hidden="true"></i></button>
        <canvas ng-hide="true" id="snapshot" width="200" height="200"></canvas>
    </div>
</div>
<div class="col-sm-6" id="thumbnail">
    <img data-ng-src="{{'data:' + cvm.fotoContentType + ';base64,' + cvm.photo}}" style="max-height: 100px;"
        ng-if="cvm.photo" />
</div>
