<ui-select ng-model="cvm.pincodeid" ng-change="cvm.setPincodeInfo($select.selected)" name="area" ng-disabled="cvm.candisable" required>
    <ui-select-match>
        {{$select.selected.Text | limitTo : 20 : 0}}
        <span ng-if="$select.selected.Text.length>20">...</span>
    </ui-select-match>
    <ui-select-choices refresh="cvm.searchPincode($select.search)" repeat="lookupitem.Id as lookupitem in cvm.pincodes | filter: { Text: $select.search }">
        <div>
            <span ng-bind-html="lookupitem.Text | highlight: $select.search"></span>
            <span ng-bind-html="lookupitem.Area | highlight: $select.search"></span>
        </div>
    </ui-select-choices>
</ui-select>
