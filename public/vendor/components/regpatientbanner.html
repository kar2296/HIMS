<style>
  #dropdownctrl>a>.label {
    top: -10px;
    left: 20px;
    width: 20px;
    height: 15px;
    background-color: #fff;
    color: #333;
    font-size: 11px;
  }

  table {
    border-collapse: collapse;
    border: 1px solid black;
  }

  th,
  td {
    border: 1px solid black;
    padding: 10px;
  }

  table {
    table-layout: fixed;
    width: 100%;
  }

  .col-sm-11.fontctrl span.ng-scope {
    border-right: 2px solid;
  }

  .fontctrl span.ng-scope {
    margin: 0px !important;
    padding: 0px 38px !important;
  }

  #dropdownctrl .btn-default {
    text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.25);
    background-color: #da4f49;
    color: #fff;
    background-image: -webkit-gradient(linear, 0 0, 0 100%, from(#ee5f5b), to(#bd362f));
    background-image: -webkit-linear-gradient(top, #ee5f5b, #bd362f);
    background-image: -o-linear-gradient(top, #ee5f5b, #bd362f);
    background-image: linear-gradient(to bottom, #ee5f5b, #bd362f);
    background-image: -moz-linear-gradient(top, #ee5f5b, #bd362f);
    background-repeat: repeat-x;
    border-color: #bd362f #bd362f #802420;
    border-color: rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.25);
  }

  #dropdownctrl .placement {
    position: absolute;
    top: 5px;
    left: 25px
  }

  .fontctrl {
    color: #ffffff;
    text-shadow: unset !important;
  }

  .page-header {
    margin: 0px !important;
  }

  #bannerdetails tr td:nth-child(odd) {
    background: #a0bfd44f !important;
    color: #080364 !important;
  }

  table {
    margin: 15px;
    margin-bottom: 7px !important;
    table-layout: fixed;
    width: 97%;
    max-width: 100%;
    padding: 15px !important;
  }
</style>

<table class="tablepatient banner" ng-if="cvm.patientid" id="bannerdetails">
  <tr>
    <td>Patient Name</td>
    <td style="font-weight: 600; color:black !important;white-space: normal;"> <span
        ng-if="cvm.patientinfo.PatientName"><strong> {{ cvm.patientinfo.PatientName}}</strong></span></td>
    <td>Age/Sex</td>
    <td>
      <agedisplay dob="cvm.patientinfo.DOB"></agedisplay> / <span ng-if="cvm.patientinfo.Gender">
        {{cvm.patientinfo.Gender}}</span>
    </td>
    <td>Patient Id</td>
    <td> <span ng-if="cvm.patientinfo.MRN"><strong class="mrn-highlight"> {{cvm.patientinfo.MRN}}</strong> </span> </td>
    <td>Status</td>
    <td><span style="color: #152638;"
        ng-if="cvm.patientinfo.PatientStatus"><strong>{{cvm.patientinfo.PatientStatus}}</strong></span></td>
    <td style="width: 236px;">
      <button class="" ng-click="clinicalalertview()" ng-if="item.ReferredNewVisit"
        uib-tooltip="{{'common.clinicalalert.lbl' | translate }}" tooltip-placement="bottom"
        ng-hide="item.PatientStatusId==3">
        <span>
          <i class="fa fa-exclamation-triangle" aria-hidden="true"></i>
        </span>
      </button>
      <button type="button" class="checkout" tabindex="-1" uib-tooltip="Checkout" ng-click="checkout()"  
        uib-tooltip="Checkout" tooltip-placement="bottom">
        <span>
          <i class="fa fa-sign-out" aria-hidden="true"></i>
        </span>
      </button>
      <button id="btnSaveInactive" type="button" class="deactivate" tabindex="-1" ng-click="saveAndInactive(item)"
        uib-tooltip="Deactivate" tooltip-placement="bottom">
        <span>
          <i class="fa fa-close" aria-hidden="true"></i>
        </span>
      </button>
      <button type="button" class="paper" tabindex="-1" uib-tooltip="Attachments" ng-click="openattachments()"
        tooltip-placement="bottom">&nbsp;&nbsp;
        <i class="fa fa-paperclip fa-xs" tabindex="-1" aria-hidden="true">({{currentcontext.attachmentcount}})</i>
      </button>
      <button type="button" class="barcode" uib-tooltip="{{'Barcode'}}" tooltip-placement="bottom"
        ng-click="printRegistrationIdlabel()">
        <i class="fa fa-barcode" aria-hidden="true"></i>
      </button>
    </td>
  </tr>
</table>
