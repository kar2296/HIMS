<div class="row" ng-show="cvm.config.readonly != true">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-6">
            <label class="col-sm-12 control-label" translate="lis.observationcontrol.comments.lbl"></label>
            <div class="col-sm-12">
                <commentscontrol comments="cvm.item.Comments"></commentscontrol>
            </div>
        </div>
        <div class="col-sm-6">
            <div class="pull-right">
                <button type="button" style="margin-top: 30px;" class="draftbutton" translate="common.saveaction.lbl"
                    ng-click="cvm.saveItem()"></button>
            </div>
        </div>
    </form>
</div>
<div class="row">
    <custom-table config="cvm.gridConfig"></custom-table>
</div>
