<ui-select ng-model="cvm.areaid" ng-change="cvm.setAreaInfo($select.selected)" name="area" ng-disabled="cvm.candisable">
    <ui-select-match>
        {{$select.selected.Text | limitTo : 20 : 0}}
        <span ng-if="$select.selected.Text.length>20">...</span>
    </ui-select-match>
    <ui-select-choices refresh="cvm.searchArea($select.search)" repeat="lookupitem.Id as lookupitem in cvm.areas | filter: { Text: $select.search }">
        <div>
            <span ng-bind-html="lookupitem.Text | highlight: $select.search"></span>
        </div>
    </ui-select-choices>
</ui-select>
