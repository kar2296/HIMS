<div class="fs-8 text-center">
    <span>Created by</span> 
    <label class="specific-blue">
        <span ng-if='cvm.item.CreatedUser.Title && cvm.item.CreatedUser.Title.Description'>{{cvm.item.CreatedUser.Title.Description}}&nbsp;</span> 
        <span>{{cvm.item.CreatedUser.FirstName}}</span>&nbsp;<span>{{cvm.item.CreatedUser.LastName}}</span>
    </label> 
    <span>Created on</span> <label class="specific-blue">&nbsp;{{cvm.item.CreatedAt | date : 'dd-MMM-yyyy'}}.&nbsp;&nbsp;</label> 
    <span>Last Updated by</span> 
    <label class="specific-blue">
        <span ng-if='cvm.item.UpdatedUser.Title && cvm.item.UpdatedUser.Title.Description'>{{cvm.item.UpdatedUser.Title.Description}}&nbsp;</span> 
        <span>{{cvm.item.UpdatedUser.FirstName}}</span>&nbsp;<span>{{cvm.item.UpdatedUser.LastName}}</span>
    </label>  
    <span>Updated on</span> <label class="specific-blue"> {{cvm.item.UpdatedAt | date : 'dd-MMM-yyyy'}}.&nbsp;</label>
</div>
