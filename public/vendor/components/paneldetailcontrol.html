<ui-select ng-model="cvm.itemid" ng-change="cvm.setSelectedItemInfo($select.selected)" name="drug">
    <ui-select-match>
        {{$select.selected.Text | limitTo : 20 : 0}}
        <span ng-if="$select.selected.Text.length>20">...</span>
    </ui-select-match>
    <ui-select-choices refresh="cvm.searchItem($select.search)" repeat="lookupitem.Id as lookupitem in cvm.items | propsFilter: { Text: $select.search, Code : $select.search }">
        <div>
            <span ng-bind-html="lookupitem.Code | highlight: $select.search"></span>
            <span ng-bind-html="lookupitem.Text | highlight: $select.search"></span>
        </div>
    </ui-select-choices>
</ui-select>
