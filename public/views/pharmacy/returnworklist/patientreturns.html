<style>
    .form-group {
        height: 44px;
    }
</style>
<div class="row">
    <div class="form-group col-sm-4">
        <label class="col-sm-4" for="fromdate" translate="From Date"></label>
        <div class="col-sm-8">
            <div class="datepicker">
                <input type="text" class="form-control" name="fromdate" ng-change="getList()"
                    datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                    is-open="fromdatePopup.opened" ng-model="currentfilter.FromDate">
                <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
        </div>
    </div>
    <div class="form-group col-sm-4">
        <label class="col-sm-4" for="todate" translate="To Date"></label>
        <div class="col-sm-8">
            <div class="datepicker">
                <input type="text" class="form-control" name="todate" ng-change="getList()"
                    datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
                    is-open="todatePopup.opened" ng-model="currentfilter.ToDate">
                <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
        </div>
    </div>
    <!-- <div class="form-group col-sm-4">
        <label class="col-sm-4 control-label" for="dispensereturndatetime"
            translate="billing.patientreturns.dispensereturndatetime.lbl"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" name="dispensereturndatetime" ng-change="getList()" ng-date-object
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="dispensereturndatetimePopup = { opened: true }" is-open="dispensereturndatetimePopup.opened"
                ng-model="currentfilter.DispenseReturnDateTime">
        </div>
    </div> -->
    <div class="form-group col-sm-4">
        <label class="col-sm-4 control-label" for="patientreturnnumber"
            translate="billing.patientreturns.returnno.lbl"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.PatientReturnNumber"
                translate translate-attr-placeholder="billing.patientreturns.returnno.lbl">
        </div>
    </div>
    <div class="form-group col-sm-4">
        <label class="col-sm-4 control-label" for="dispensereturnnumber" translate="Patient/MRN"></label>
        <div class="col-sm-8">
            <input type="text" id="pid" class="form-control" on-enter="getList()" ng-model="currentfilter.PatientName"
                placeholder="NAME/MRN">
        </div>
    </div>
    <div class="form-group col-sm-4">
        <label class="col-sm-4 control-label" for="mystore" translate="billing.patientreturns.mystore.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.StoreMasterId" ng-change="getList()" name="mystore" required>
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 30 : 0}}
                    <span ng-if="$select.selected.Text.length>30">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.UserStores | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-4">
        <label class="col-sm-4 control-label" for="ward" translate="patientrequest.ward.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.WardId" ng-change="getList()" ng-change="getRoomLookUp()">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 30 : 0}}
                    <span ng-if="$select.selected.Text.length>30">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.Ward | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-4">
        <label class="col-sm-4 control-label" for="dispensereturnstatus"
            translate="billing.patientreturns.dispensereturnstatus.lbl"></label>
        <div class="col-sm-8">
            <multiselectchk list="lookup.DispenseReturnStatus" selected="currentfilter.DispenseReturnStatusId"
                change="getList()"></multiselectchk>
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
    <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize"
        start-index="vm.gridConfig.pagerObj.startIndex" ng-model="vm.gridConfig.pagerObj.currentPage"
        ng-change="getList()"></ul>
</div>
