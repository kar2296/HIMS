<div class="row">
    <div class="form-group col-sm-4">
        <label class="col-sm-4" translate="Store"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.StoreMasterId" tabindex="-1" ng-disabled="RdoStoreMasterId"
                ng-change="getList()" name="storemaster">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.UserStores | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-4">
        <label class="col-sm-4" translate="Doctor"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.DoctorId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.Doctor | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-4">
        <label class="col-sm-4" translate="From Date"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" name="fromdate" ng-change="getList()"
                datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="fromdatePopup = { opened: true }" is-open="fromdatePopup.opened"
                ng-model="currentfilter.FromDate">
        </div>
    </div>
    <div class="form-group col-sm-4">
        <label class="col-sm-4" translate="To Date"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" name="todate" ng-change="getList()"
                datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="todatePopup = { opened: true }" is-open="todatePopup.opened" ng-model="currentfilter.ToDate">
        </div>
    </div>

        <div class="col-sm-8">

            </ui-select>
        </div>
    </div> -->
    <div class="form-group col-sm-4">
        <label class="col-sm-4" translate="appmanager.specialitys.filter_status.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.DispenseStatusId" ng-change="getList()" class="filter-combo">

                    {{$select.selected.Text | limitTo : 20 : 0}}

                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.DispenseStatus | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>

            </ui-select>
        </div>
    </div>
</div>
