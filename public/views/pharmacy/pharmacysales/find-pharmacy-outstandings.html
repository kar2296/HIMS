<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="billing.pharmacy-outstandings-list.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row" ng-if="IsPicker">
    <dynamicform modeldata="modeldata" schema="schema"></dynamicform>
    <div class="form-group col-sm-3">
        <button type="button" class="draftbutton  {{action.cls}}" ng-repeat="action in schema.actions"
            ng-click="actionClick(action.type)" translate="{{action.translate}}"></button>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
    <div class="">
        <div class="total-countt-data-table"><span>Total Due: {{currentcontext.TotalOutstanding}}</span></div>
    </div>
    <div class="">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
