<style>
    .table-uigrid.ui-grid .ui-grid-cell.ui-grid-row-header-cell {
        background: #23b7e5;
    }

    .table-uigrid.ui-grid .ui-grid-row.ui-grid-row-selected>[ui-grid-row]>.ui-grid-cell {
        background-color: lightgreen;
    }

    .ui-grid-cell.ui-grid-disable-selection.ui-grid-row-header-cell {
        pointer-events: all;
    }

    .ui-grid-render-container-left .ui-grid-viewport {
        width: 30px;
        height: 429px !important;
    }

    .ui-select-multiple.ui-select-bootstrap {
        height: auto;
        padding: 3px 3px 0 3px;
        max-height: 30px;
        overflow: visible;
    }

    .padding-top1 {
        padding-top: 1px;
    }

    .page-header h4 {
        margin-bottom: 6px !important;
    }

    .page-calendar1 .b-greensea {
        border-color: #ff902b !important;
    }

    .page-calendar1 .event-name {
        padding: 1px;
        background: #467cac;
        margin: 2px 0px;
        color: #fff;
        padding-left: 0px;
        font-size: 13px;
        border-left: 3px solid;
        height: 21px;
        float: left;
        margin-left: 5px;
        text-overflow: ellipsis;
        width: 100%;
        white-space: nowrap;
        overflow: hidden;
    }

    .page-calendar1 .col-sm-4 {
        padding-left: 3px;
        padding-right: 3px;
    }

    .padding-top1 .col-sm-4 {
        padding-left: 2px;
        padding-right: 2px;
    }

    .page-header h4 {
        font-size: 16px !important;
    }

    #appoinmentsheight .table-uigrid {
        height: 420px !important;
    }

    .ui-grid-render-container-left .ui-grid-viewport {
        height: 395px !important;
    }

    .bill_nmbr {
        padding-left: 48px;
        padding-right: 0px;
    }

    .form-horizontal .control-label {
        text-align: right;
    }

    .sale_coll {
        padding-left: 15px !important;
        margin-bottom: 8px;
    }

    .sale_col2 {
        padding-left: 15px !important;

    }

    @media screen and (max-width:1024px) {
        .form-horizontal .control-label {
            padding: 0px;
        }

        .form-horizontal .control-label {
            text-align: left;
        }

        .bill_nmbr {
            padding-left: 23px;
        }

        /*.fooder-bg{width:80% !important;left:187px;}*/
    }

    .table-uigrid.ui-grid .ui-grid-viewport {
        height: 415px !important;
        scroll-snap-type: mandatory;
        /* older spec implementation */
        scroll-snap-destination: 0% 100%;
        scroll-snap-points-x: repeat(100%);
        -webkit-overflow-scrolling: touch;
        /* Keyword values */
        scroll-behavior: auto;
        scroll-behavior: smooth;
    }

    /* @media (min-height: 637px) and (min-width: 1200px){

}} */

        /* .table-uigrid.ui-grid .ui-grid-viewport{
        min-height: 520px;

        .table-uigrid.ui-grid .ui-grid-viewport {
            height: 72vh !important;
            min-height: 72vh;
        }
    }

    .table-uigrid.ui-grid .ui-grid-viewport {
        height: 67vh !important;
        min-height: 67vh;

<div class="row">
    <table id="bannerdetails">
        <tr>
            <td translate="billing.pharmacy-billdetails.fromdate.lbl"></td>
            <td> <input type="text" class="form-control" datepicker-options="datePickerOptions"
                    show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                    is-open="fromdatePopup.opened" ng-model="currentfilter.FromBillDate" ng-change="getPharmacyBills()">
            </td>
            <td translate="billing.pharmacy-billdetails.todate.lbl"></td>
            <td> <input type="text" class="form-control" datepicker-options="datePickerOptions"
                    show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
                    is-open="todatePopup.opened" ng-change="getPharmacyBills()" ng-model="currentfilter.ToBillDate">
            </td>
            <td translate="billing.opbilling-list.ScheduleType.lbl"></td>
            <td>
                <ui-select ng-model="currentfilter.ScheduleTypeId" tabindex="-1" name="ScheduleType"
                    ng-change="getPharmacyBills()">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ScheduleType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </td>

            <td translate="billing.opbilling-list.store.lbl"></td>
            <td>
                <ui-select ng-model="currentfilter.StoreMasterId" tabindex="-1" ng-disabled="RdoStoreMasterId"
                    ng-change="getPharmacyBills()" name="storemaster">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.UserStores | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </td>
            <!-- <td></td>
                            <td></td>
                            <td></td>
                            <td>  <button id="btnSearch" type="button" class="draftbutton" translate="billing.pharmacy-billdetails.loadbill.lbl"
                                ng-click="getPharmacyBills()"></button></td> -->
        </tr>
    </table>
</div>
