<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title">{{currentfilter.title}} {{currentfilter.itemname}} {{'['}}
            {{currentfilter.itemcode}} {{']'}}</h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="backToList()">
        </div>
    </div>
</div>


<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-12">
            <div class="col-sm-6"><b><span translate="LASA"></span></b>:</div>
            <div class="col-sm-6 testname">{{Item.LASA}}</div>
        </div>
        <div class="col-sm-12">
            <div class="col-sm-6"><b><span translate="Emergency"></span></b>:</div>
            <div class="col-sm-6 testname">{{Item.Emergency}}</div>
        </div>
        <div class="col-sm-12">
            <div class="col-sm-6"><b><span translate="HighAlert"></span></b>:</div>
            <div class="col-sm-6 testname">{{Item.HighAlert}}</div>
        </div>
        <div class="col-sm-12">
            <div class="col-sm-6"><b><span translate="Schedule Type"></span></b>:</div>
            <div class="col-sm-6 testname">{{Item.ScheduleType}}</div>
        </div>
    </form>
</div>
