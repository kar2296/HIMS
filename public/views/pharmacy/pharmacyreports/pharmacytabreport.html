<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="reports.pagetitle2.lbl"></h4>
    <div class="col-sm-6">
        <button type="button" tabindex="-1" class="btn-add" ng-click="backtoReport()" uib-tooltip="Dashboard" tooltip-placement="bottom">
            <i class="fa fa-home" aria-hidden="true"> </i>
        </button>
        <!-- <i class="fa fa-home" align="right" style="float: right;" ng-click="backtoReport()" uib-tooltip="Dashboard"
            tooltip-placement="bottom"></i> -->
    </div>
</div>
<div class="row tablebox" id="tablebox">
    <div class="col-sm-12">
        <uib-tabset active="active" id="assettabs">
            <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)"
                disable="tab.canDisable">
            </uib-tab>
        </uib-tabset>
        <div ui-view class="tabview"></div>
    </div>
</div>
<style>
    table#reportdetails td {
        border: unset !important;
        text-decoration: underline;
        display: inline-block;
    }
</style>
