<link rel="stylesheet" href="app/css/drhms.css">
<style>
    .drhms-receipt span {
        font-size: 12px;
    }
    patientsearch.logo .custom-popup-wrapper {
        margin-left: -200px;
    }
</style>
<div class="row">
    <div class="drhms-filters">
        <div class="col-sm-10">
            <h4 translate="registration.updatepatient.pagetitle.lbl"></h4>
        </div>
        <div class="col-sm-6">
            <patientsearch  style="float: right;" ng-keyup="moveHeaderFocus('pid')"
                patientid="currentfilter.Patientinfo" class="col-sm-8 logo" name="txtpatientsearch"
                patientinfo="selectedPatient" patientchange="getList()" tabindex="tabindexmap.patienttabindex"
                isdisabled="" filterconfig=""></patientsearch>
        </div>
    </div>
</div>
<div class="row">
    <div class="form-group col-sm-4">
        <label class="col-sm-3" translate="registration.updatepatient.date.lbl"></label>
        <div class="col-sm-8">
            <div class="datepicker">
                <input type="text" class="form-control" name="regdate" ng-change="getList()"
                    datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="regdatePopup = { opened: true }"
                    is-open="regdatePopup.opened" ng-model="currentfilter.RegisteredDate"><i class="fa fa-calendar"
                    aria-hidden="true"></i>
            </div>
        </div>
    </div>
    <div class="form-group col-sm-4">
        <label class="col-sm-3" translate="registration.updatepatient.status.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.PatientStatusId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 8 : 0}}
                    <span ng-if="$select.selected.Text.length>8">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.PatientStatus | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
    <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize"
        start-index="vm.gridConfig.pagerObj.startIndex" ng-model="vm.gridConfig.pagerObj.currentPage"
        ng-change="getList()"></ul>
</div>
