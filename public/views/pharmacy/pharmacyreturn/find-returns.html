<style>
    .modal-lg {
        width: 82%;
    }
</style>

<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="billing.pharmacy-return.findreturns.lbl"></h4>
</div>
<div class="bg-pattern">
    <div class="row container-fluid filter-area " id="calendercontrol">
        <div class="row form-group">
            <div class="col-sm-4">
                <div class="form-group">
                    <label class="col-sm-5 control-label" for="type"
                        translate="billing.pharmacy-return.fromdate.lbl"></label>
                    <div class="col-sm-7 input-group"><span></span>
                        <input type="text" class="form-control" name="dateofbirth1" ng-change="getList()"
                            datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                            placeholder="{{datePickerOptions.placeholder}}"
                            ng-click="dateofbirth1Popup = { opened: true }" is-open="dateofbirth1Popup.opened"
                            ng-model="currentfilter.dateofbirth1">
                        <span class="input-group-addon"> <i class="fa fa-calendar"></i> </span>
                    </div>
                </div>
            </div>
            <div class="col-sm-4">
                <div class="form-group">
                    <label class="col-sm-5 control-label" for="type"
                        translate="billing.pharmacy-return.patientname.lbl"></label>
                    <div class="col-sm-7 input-group">
                        <span class="input-group-addon"> <i class="fa fa-pencil"></i> </span>
                        <input type="text" class="form-control" name="idnumber" ng-model="item.Comments"
                            placeholder=""><span></span>
                    </div>
                </div>
            </div>
            <div class="col-sm-4">
                <div class="form-group">
                    <label class="col-sm-5 control-label" for="type"
                        translate="billing.pharmacy-return.returnnum.lbl"></label>
                    <div class="col-sm-7">
                        <input type="text" class="form-control" name="idnumber" ng-model="item.GuarantorName"
                            placeholder="">
                    </div>
                </div>
            </div>
        </div>
        <div class="row form-group">
            <div class="col-sm-4">
                <div class="form-group">
                    <label class="col-sm-5 control-label" for="type"
                        translate="billing.pharmacy-return.todate.lbl"></label>
                    <div class="col-sm-7 input-group"><span></span>
                        <input type="text" class="form-control" name="dateofbirth2" ng-change="getList()"
                            datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                            placeholder="{{datePickerOptions.placeholder}}"
                            ng-click="dateofbirth2Popup = { opened: true }" is-open="dateofbirth2Popup.opened"
                            ng-model="currentfilter.dateofbirth2">
                        <span class="input-group-addon"> <i class="fa fa-calendar"></i> </span>
                    </div>
                </div>
            </div>
            <div class="col-sm-4">
                <div class="form-group">
                    <label class="col-sm-5 control-label" for="type"
                        translate="billing.pharmacy-return.consdoctors.lbl"></label>
                    <div class="col-sm-7 input-group">
                        <span class="input-group-addon"> <i class="fas fa-search"></i> </span>
                        <input type="text" class="form-control" name="idnumber" ng-model="item.Comments"
                            placeholder=""><span></span>
                    </div>
                </div>
            </div>
            <div class="col-sm-4">
                <div class="form-group">
                    <label class="col-sm-5 control-label" for="idnumber"
                        translate="billing.pharmacy-return.returnstatus.lbl"></label>
                    <div class="col-sm-7">
                        <ui-select ng-model="item.CardHolderId" name="type">
                            <ui-select-match placeholder="--- Return status ---">
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.CardHolder | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>
            </div>
        </div>
        <div class="row form-group">
            <div class="col-sm-4">
                <div class="form-group">
                    <label class="col-sm-5 control-label" for="idnumber"
                        translate="billing.pharmacy-return.mrno.lbl"></label>
                    <div class="col-sm-7 input-group"><span></span>
                        <input type="text" class="form-control" name="idnumber" ng-model="item.Comments" placeholder="">
                        <span class="input-group-addon"> <i class="fa fa-pencil"></i> </span>
                    </div>
                </div>
            </div>
            <div class="col-sm-4">
                <div class="form-group">
                    <label class="col-sm-5 control-label" for="idnumber"
                        translate="billing.pharmacy-return.billnumber.lbl"></label>
                    <div class="col-sm-7 input-group">
                        <span class="input-group-addon"> <i class="fa fa-pencil"></i> </span>
                        <input type="text" class="form-control" name="idnumber" ng-model="item.Comments"
                            placeholder=""><span></span>
                    </div>
                </div>
            </div>
            <div class="col-sm-4">
                <div class="form-group">
                    <label class="col-sm-5 control-label" for="idnumber"
                        translate="billing.pharmacy-return.facility.lbl"></label>
                    <div class="col-sm-7">
                        <input type="text" class="form-control" name="idnumber" ng-model="item.Comments" placeholder=""
                            disabled>
                    </div>
                </div>
            </div>

            <div class="col-sm-12">
                <div class="col-sm-12 padding-top5">
                    <div class="pull-right">
                        <button type="button" class="btn bt-color3 btn-xs pull-right" ng-click="">
                            <i class="fas fa-search" aria-hidden="true"></i> <span
                                translate="billing.pharmacy-return.search.lbl"></span></button>
                        <!-- <button type="button" class="btn btn-success btn-xs" ng-click="">
                        <i class="fa fa-plus" aria-hidden="true"></i>
                    </button>-->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="table-height" id="mainresponsivetablecontrol" style="height: 350px; overflow-y: auto;">

        <table class="table table-hover table-responsive table-bordered">
            <thead class="bg-subhead">
                <tr>
                    <th><span translate="billing.pharmacy-return.returnnum.lbl"></span> </th>
                    <th><span translate="billing.pharmacy-return.patientname.lbl"></span> </th>
                    <th><span translate="billing.pharmacy-return.returndate.lbl"></span> </th>
                    <th><span translate="billing.pharmacy-return.consdoctors.lbl"></span> </th>
                    <th><span translate="billing.pharmacy-return.status.lbl"></span> </th>
                    <th><span translate="billing.pharmacy-return.returnamound.lbl"></span> </th>
                    <th><span translate="billing.pharmacy-return.issueno.lbl"></span> </th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="10">
                        <span style="padding-left: 465px;"> No records to display!</span>
                    </td>

                </tr>
            </tbody>
        </table>
    </div>

    <div class="fooder-bg ">
        <div class="pull-right">
            <div class="col-sm-12">
                <button type="button"   class="draftbutton" translate="common.saveaction.lbl"
                    ng-click="save()"></button>
                <button id="btnCancelForm" type="button" class="draftbutton" ng-click="cancelCallback()"
                    translate="common.cancelaction.lbl"></button>
            </div>
        </div>
    </div>
</div>
