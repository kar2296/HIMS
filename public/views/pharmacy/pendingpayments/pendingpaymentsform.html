<style>
.pager-div{float:right; right:0; box-sizing: border-box;position: fixed;box-sizing: border-box;}
.form-group {
        margin-bottom: 7px !important;
}
</style>
<div class="row page-header">
    <div class="col-sm-12">
        <h4 class="mt0 col-sm-6" translate="billing.pharmacypayments.pagetitle.lbl"></h4>
    </div>
</div>
<div class="row filter-area">
    <div class="col-sm-12">
        <div class="col-sm-3 col-md-3">
            <div class="form-group">
                <label class="col-sm-6 col-md-4 col-lg-4 control-label text-right filter-lbl"
                translate="billing.findbill-list.mystore.lbl"></label>
                <div class="input-group col-sm-7 col-md-9 col-lg-6">
                    <ui-select ng-model="currentfilter.StoreMasterId" ng-change="getList()" class="filter-combo">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 8 : 0}}
                            <span ng-if="$select.selected.Text.length>8">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.UserStores | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
        </div>

        <div class="col-sm-3 col-md-3">
            <div class="form-group">
                <label class="col-sm-6 col-md-4 col-lg-4 control-label text-right filter-lbl"
                translate="billing.findbill-list.patientname.lbl"></label>
                <div class="input-group col-sm-7 col-md-9 col-lg-6">
                    <input type="text" class="form-control" autofocus on-enter="getList()"
                    ng-model="currentfilter.PatientName"
                    translate translate-attr-placeholder="billing.findbill-list.patientname.lbl">
                </div>
            </div>
        </div>

        <div class="col-sm-3 col-md-3">
            <div class="form-group">
                <label class="col-sm-6 col-md-4 col-lg-4 control-label text-right filter-lbl"
                translate="billing.findbill-list.billnumber.lbl"></label>
                <div class="input-group col-sm-7 col-md-9 col-lg-6">
                    <input type="text" class="form-control" autofocus on-enter="getList()"
                    ng-model="currentfilter.BillNumber"
                    translate translate-attr-placeholder="billing.findbill-list.billnumber.lbl">
                </div>
            </div>
        </div>

        <div class="col-sm-3 col-md-3">
            <div class="form-group">
                <label class="col-sm-5 control-label filter-lbl"
                translate="billing.findbill-list.fromdate.lbl"></label>
                <div class="col-sm-7">
                    <input type="text" class="form-control" ng-disabled="item.billdate"
                        ng-change="getList()" ng-date-object
                        datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}"
                        ng-click="FromDatePopup = { opened: true }"
                        is-open="FromDatePopup.opened"
                        ng-model="currentfilter.FromDate" tabindex="-1">
                </div>
            </div>
        </div>
    </div>
</div>
<div class="container-fluid single-filter">
    <div ui-grid="vm.gridConfig" class="table-uigrid">
    </div>
    <div class="site-footer">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()">
        </ul>
    </div>
</div>
