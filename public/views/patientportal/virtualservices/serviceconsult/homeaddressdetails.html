<style>
    .con {
        border: 1px solid gainsboro;
        height: 195px;
        width: 79%;
        margin-left: 149px;
        padding: 20PX;
        box-shadow: 0px 0px 4px 2px gainsboro;
        margin-bottom: 18px;
    }

    .form-group.col-sm-6 {
        margin-bottom: 22px;
        font-size: 14px;
    }

    .content-wrapper.ng-scope.ng-fadeInUp {
        margin-top: 0px;
        background: white !IMPORTANT;
    }

<main class="dec">
    <div class="head">
        <h2>
            Booking Conformation
        </h2>
    </div>
    <div class="album text-muted">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="con">
                <!-- <div class="form-group col-sm-6">
                    <label class="col-sm-12 control-label" translate="Address"></label>
                    <div class="col-sm-10" style="padding:0;">
                        <input type="text" id="googleaddopt" class="form-control" ng-disabled="disablegoogleaddopt" gm-places-autocomplete="autocompleteOptions" ng-model="autocompleteModel" />
                    </div>
                    <div class="col-sm-1 col-md-1 col-lg-1">
                        <input type="checkbox" name="googleaddressoption" class="custom-checkbox" ng-click="enablegoogleaddopt()" ng-model="chkgoogleaddopt">
                    </div>
                </div> -->
                <div class="form-group col-sm-6">
                    <label class="col-sm-12 control-label" translate="registration.fullregistration.googleaddress.lbl"></label>
                    <div class="col-sm-10">
                        <input type="text" id="googleaddopt" tabindex="17" ng-disabled="disablegoogleaddopt" class="form-control" gm-places-autocomplete="autocompleteOptions"
                            ng-model="autocompleteModel" />
                    </div>
                    <div class="col-sm-1 col-md-1 col-lg-1">
                        <input type="checkbox" name="googleaddressoption" class="custom-checkbox" tabindex="18" ng-click="enablegoogleaddopt()" ng-model="chkgoogleaddopt">
                    </div>
                </div>
                <div class="form-group col-sm-6">
                    <label class="col-sm-12 control-label" translate="registration.registrationcumvisit.address.lbl"></label>
                    <div class="col-sm-12" style="padding:0;">
                        <input type="text" id="Manualadd" class="form-control" name="addressline" ng-model="item.Address" ng-disabled="item.candisable"
                            placeholder="">
                    </div>
                </div>
                <div class="form-group col-sm-6">
                    <label class="col-sm-12 control-label" for="landmark" translate="Landmark"></label>
                    <div class="col-sm-12 " style="padding:0;">
                        <input type="text" name="landmark" class="form-control" ng-model="item.Landmark" required uppercase>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <div class="col-sm-12">
        <div class="pull-right">
            <button type="submit" class="ui button" ng-click="next()" style="border-radius: 20px; padding: 14px; font-size: 15px; 
                    min-width: 150px; background: linear-gradient( -90deg, #bbbbbb, #2196F3); 
                    color: white;">Next</button>
        </div>
    </div>
    <script>
        $("img.smallicon").click(function () {
            $("img.smallicon").each(function () {

                $(this).removeClass("active");
            });
            $(this).addClass("active");
        });
    </script>
