<div class="row page-header" align="center">
    <h4 class="col-sm-12 col-xs-12" translate="Select Lab Center"></h4>
    <div class="col-xs-12 col-sm-10 search">
        <div class="col-sm-4"></div>
        <div class="col-sm-4"></div>
        <div class="col-sm-4">
            <input type="text" class="searchtype" on-enter="getList()" ng-model="currentcontext.name"
                placeholder="Search Lab Center....">
            <i class="fas fa-search" aria-hidden="true"></i>
        </div>
    </div>
</div>
<div class="pharma-details">
    <div class="col-sm-12">
        <div class="card" ng-repeat="item in items | filter">
            <div class="pharmacy" ng-click="selectlab(item)">
                <div class="col-sm-12 col-xs-12">
                    <div class="pharm-img">
                        <strong>{{item.FacilityName}}</strong>
                    </div>
                </div>
                <div class="col-sm-9 col-xs-9">
                    <div class="col-sm-12 pharamname">{{item.AddressLine1}}</div>

                    <div class="col-sm-12 ava">
                        <div class="days">{{item.AddressLine2}}</div>
                    </div>
                    <div class="col-sm-12 ava">
                        <div class="days">{{item.Area}}</div>
                    </div>
                </div>
                <div class="col-sm-3 col-xs-3 km">
                    <i class="fa fa-map-marker" aria-hidden="true"></i> &nbsp;{{item.km |number}} Kms
                </div>
            </div>
        </div>
    </div>
    <div class="fooder-bgs" style="margin-bottom: 1px;">
    </div>
</div>
