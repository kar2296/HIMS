<style>
    div#topnavbut {
        margin-top: 10px;
    }

    @media screen and (max-width: 500px) and (min-width: 300px) {
        div#topnavbut {
            margin-top: 61px;
        }

        .row {
            margin-left: -16px;
            margin-right: -15px;
            margin-top: -16px;
        }
    }

    @media screen and (max-width: 500px) and (min-width: 300px) {
        /* div#topnavbut {
            margin-top: 61px !important;
        } */

        div#tablebox {
            position: relative;
            bottom: 0px !important;
        }

        div#assettabs ul li a:before {
            display: none;
        }

        .nav-tabs>li>a>span {
            display: block !important;
        }

        li.uib-tab.ng-scope.ng-isolate-scope,
        li.uib-tab.ng-scope.ng-isolate-scope.active {
            width: 38% !important;
        }
    }

    .row.page-header {
        height: unset;
    }

    div#tablebox {
        position: relative;
        bottom: 0px;
    }

    div#tablebox {
        position: relative;
        bottom: 0 px;
        top: 25 px;
    }

    .layout-fixed .wrapper>.aside {
        display: none;
    }

    .aside-collapsed .wrapper>section,
    .aside-collapsed .wrapper>footer {
        margin-left: 0px !important;
    }
</style>
<div class="row page-header" id="assets">
    <div class="col-12 col-sm-12 col-lg-12" id="topnavbut">
        <div class="col-xs-8 col-sm-8 col-lg-8">
            <h4 class="col-sm-6 mt0 active" translate="Order Tracking"></h4>
        </div>
        <div class="col-xs-4 col-sm-4 col-lg-4">
            <button class="btn btn-default portal_btn btn-xs pull-right" id="homebut" ng-click="home()"
                uib-tooltip="Dashboard" tooltip-placement="bottom">
                <span class="fa fa-home"></span>
            </button>

        </div>
    </div>
</div>
<div class="row tablebox" id="tablebox">
    <div class="col-sm-12">
        <uib-tabset active="active" id="assettabs">
            <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)"
                disable="tab.canDisable">
            </uib-tab>
        </uib-tabset>
        <div ui-view></div>
    </div>
</div>
