<div class="layover" ng-if="currentfilter.showFilterTab"></div>
<div class="col-sm-5 col-xs-12">
    <div class="col-xs-9 title" translate="Documents"></div>
    <div class="col-xs-2">
        <!-- <button class="addbutton mobileview" ng-click="addNew()"><i class="fa fa-plus"></i></button> -->
    </div>
</div>
<div class="col-sm-2 datepicker">
    <input type="text" class="form-control" name="from" ng-change="getList()" ng-date-object
        uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
        ng-click="fromPopup = { opened: true }" is-open="fromPopup.opened" ng-model="currentcontext.FromDate">
    <i class="fa fa-calendar" aria-hidden="true" style="padding: 0px 12px;"></i>
</div>
<div class="col-sm-2 datepicker">
    <input type="text" class="form-control" name="to" ng-change="getList()" ng-date-object
        uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
        ng-click="toPopup = { opened: true }" is-open="toPopup.opened" ng-model="currentcontext.ToDate">
    <i class="fa fa-calendar" aria-hidden="true" style="padding: 0px 12px;"></i>
</div>
<div class="col-sm-1 col-xs-1">

    <button class="addbutton webview" ng-click="addNew()"><i class="fa fa-plus"></i></button>
</div>
<div class="row">
    <div class="col-sm-12 col-xs-12 shopping-cart">
        <div class="">
            <div class="item col-sm-12 col-xs-12" ng-repeat="item in Document">
                <div class=" col-sm-6 col-xs-6 description ">
                    <span>
                        <b class="ptname ">
                            {{item.DocumentType.Description}}</b> &nbsp;&nbsp;
                        <!-- <i class="lni lni-ticket-alt "></i>{{order.OrderNumber}} </span> -->
                        <span>
                            <i aria-hidden="true " class="fa fa-hospital-o "></i>{{item.Name}}
                        </span>
                </div>
                <div class="col-sm-6 col-xs-6 total-price ">
                    <div class="description ">
                        <span>
                            <displaydate date-val="item.CreatedDate"></displaydate>
                        </span>
                        <span class="mart">

                            <div class="view ">
                                <div class="results">
                                    <i class="fas fa-upload" ng-click="downloadFile(item)" uib-tooltip="Download"
                                        tooltip-placement="bottom"></i>
                                    <i class="fa fa-trash" ng-click="delete(item)"></i>
                                </div>
                            </div>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(function () {
            $(".fold-table tr.view ").on("click ", function () {
                $(this).toggleClass("open ").next(".fold ").toggleClass("open ");
            });
        });
