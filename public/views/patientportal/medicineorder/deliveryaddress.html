<style>
    .page-path.active {
        margin-bottom: 12px;
        color: #00bda6;
    }
    
    button.deliverybtn {
        width: 26%;
        padding: 8px;
        border: 1px;
        background: #38afa4;
        color: white;
        border-radius: 2px;
    }
    
    button.deliverybtn.ng-scope {
        margin-top: 27px;
        margin-bottom: 5px;
    }
    
    .form-group.pull-right {
        width: 100%;
        text-align: center;
    }
    
    @media (max-width: 768px) {
        .col-sm-12.delivery {
            width: 106%;
            position: relative;
            left: -4%;
        }
        .col-sm-12.delivery {
            border: 1px solid gainsboro;
            height: 100%;
            padding: 0px 4px 0px 1px;
            border-radius: 7px;
            padding: 0;
            margin: 0;
        }
        button.deliverybtn {
            width: 77%;
            padding: 8px;
            border: 1px;
            background: #38afa4;
            color: white;
            border-radius: 2px;
            position: relative;
            right: 12px;
        }
        .fooder-bgs {
            margin-bottom: 55px !important;
            height: 1% !important;
            margin-top: 2px;
        }
        label.col-xs-12.col-sm-12.control-label.ng-scope {
            display: flex;
        }
        /* span.page-path.active.ng-scope {
            display: flex !important;
            padding: 0 !IMPORTANT;
        } */
    }
    
    .col-sm-12.delivery {
        height: auto !important;
    }
</style>
<div class="path">
    <span class="page-path" ng-click="DeliveryAddress()">Attach Precription</span>
    <span translate="patientportal.medicineorder.delivaryaddress.lbl" class="page-path active"> </span>
</div>

                <div class="form-group col-sm-4 col-xs-12">
                    <label class="col-xs-12 col-sm-12 control-label" for="orderdate" translate="patientportal.medicineorder.orderdate.lbl"></label>
                    <div class="col-sm-12 col-xs-12">
                        <input type="text" class="text-box form-control" name="orderdate" ng-date-object datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}" uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                            ng-click="startPopup = { opened: true }" is-open="startPopup.opened" ng-model="item.MedicineOrderDate" tabindex="tabindexmap.patienttabindex" ng-change="CheckOrderDate(item)" required>
                    </div>
                </div>
                <div class="form-group col-sm-4 col-xs-12">
                    <label class="col-xs-12 col-sm-12 control-label" translate="patientportal.medicineorder.deliverydate.lbl"></label>
                    <div class="col-sm-12 col-xs-12">
                        <input type="text" class="text-box form-control" ng-date-object datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}" uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                            ng-click="deliverydatePopup = { opened: true }" is-open="deliverydatePopup.opened" ng-model="item.DeliveryDate" tabindex="tabindexmap.patienttabindex">
                    </div>
                </div>
                <div class="form-group col-sm-4 col-xs-12">
                    <label class="col-xs-12 col-sm-12 control-label" translate="registration.fullregistration.googleaddress.lbl"></label>
                    <div class="col-sm-10 col-xs-10">
                        <input type="text" id="googleaddopt" tabindex="17" ng-disabled="disablegoogleaddopt" class="form-control" gm-places-autocomplete="autocompleteOptions" ng-model="autocompleteModel" />
                    </div>
                    <div class="col-sm-1 col-md-1 col-xs-1">
                        <input type="checkbox" name="googleaddressoption" class="custom-checkbox" tabindex="18" ng-click="enablegoogleaddopt()" ng-model="chkgoogleaddopt">
                    </div>
                </div>
                <div class="form-group col-sm-4 col-xs-12">
                    <label class="col-xs-12 col-sm-12 control-label" for="address" translate="patientportal.medicineorder.address.lbl"></label>
                    <div class="col-sm-12 col-xs-12">
                        <input type="text" class="form-control" name="address" ng-model="item.DeliveryAddress" placeholder="" required uppercase>
                    </div>
                </div>

                    <label class="col-xs-12 col-sm-12 control-label" for="" translate="patientportal.medicineorder.landmark.lbl"></label>
                    <div class="col-sm-12 col-xs-12">
