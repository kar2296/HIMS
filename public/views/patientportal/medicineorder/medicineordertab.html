<style>
    .tabview {

        }

    .nav-tabs>li>a {
        background: #8dc51fbf;

    }

    .tabview {
        border: 1px solid #f3f3f3;
        margin-top: 0px;
        padding: 11px;
        position: absolute;
        width: 96%;
    }

    .main-content.ng-scope {
        width: 100%;
    }

    .row {
        padding: 0px;
        margin-top: 0;
    }

    h3.col-sm-5.mt0.active.ng-scope {
        margin: 0;
    }

    .page-header {
        background-color: #f3f3f3 !important;
    }

        background: #f3f3f3 !important;
    }

    @media only screen and (min-width: 768px) {

        .aside-collapsed .wrapper>section,
        .aside-collapsed .wrapper>footer {
            margin-left: 2px !important;
        }
    }

    @media screen and (max-width: 500px) and (min-width: 300px) {
        .nav-tabs>li>a>span {
            display: block !important;
        }

        .aside-collapsed .wrapper>section,
        .aside-collapsed .wrapper>footer {
            margin-left: 2px !important;
        }

            width: 48%;
        }

            margin-left: 0% !important;
        }

        .layout-fixed .wrapper>section {
            margin-top: 69px !important;
        }

        li.uib-tab.ng-scope.ng-isolate-scope,
        li.uib-tab.ng-scope.ng-isolate-scope.active {
            width: 44%;
        }

        li.uib-tab.ng-scope.ng-isolate-scope.active {
            margin: 0px 0px 0px -14px;
            display: flex !important;
        }

        .nav-tabs>li>a {
            display: flex !important;
        }
    }

    .col-sm-12.pager-div {
        background: transparent !important;
    }

    ul.pagination.pagination-sm a {
        background: transparent !important;
    }

    .nav-tabs>li.active:after {
        content: unset !important;
    }

    .layout-fixed .wrapper>.aside {
        display: none;
    }

    .layout-fixed .wrapper>section {
        margin-top: 69px;
    }

    .row.ng-scope {
        padding-top: 19px;
        padding-left: 16px;
    }

    .tabview {
        position: relative;
    }

    header.topnavbar-wrapper>header {
        padding-top: 16px !important;
    }

    span.page-path:after {
        content: "\f054 ";

        font-weight: 100 !important;
        padding: 10px;
    }

    span.page-path {
        font-size: 14px;
    }

    .col-sm-12.delivery {
        height: 42vh !important;
        margin-top: 16px !important;
    }

    .card {
        min-height: 114px !important;
        margin-top: 10px !important;
    }

    .card:hover {
        background: #a7f5ea;
    }

    div,
    span,
    a,
    button,
    b,
    strong {
        font-family: 'Poppins', sans-serif;
        font-weight: 600;
        font-size: 14px;
    }

    .page-path.active {
        color: #00bda6 !important;
    }
