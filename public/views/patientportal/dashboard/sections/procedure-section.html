<style>
    img.imagaecaress {
    width: 30px !important;
}
</style>
<div ng-app id="ng-app" class="panel {{currentcontext.paneltype}} portlet-panel" ng-controller="procedureSectionController as vm">
<div class="layover" ng-if="currentfilter.showFilterTab"></div> 
   <div class="panel-heading portlet-panel-heading"ng-click="openFilterTab()">
    <div class="col text-center">
          <div class="cn-img">
        <img class="imagaecaress" src="app/img/icon/procedures_icon.png">
         </div>
        <div>
            <center>
                <strong translate="patientemr.patientdashboard.procedures.lbl"></strong> 
            </center>
        </div>
     </div>
       <!-- <a ng-click="handleEvents('list')" class="pull-right lnk-portlet-header-action "   uib-tooltip="{{ 'common.moredetailsaction.lbl' | translate }}" tooltip-placement="top">
            <i class="fa fa-info btn-circle" aria-hidden="true"></i>
        </a>
        <a  ng-click="handleEvents('add')" class="pull-right lnk-portlet-header-action"   uib-tooltip="{{ 'common.addnewaction.lbl' | translate }}" tooltip-placement="top">
            <i class="fa fa-plus btn-circle" aria-hidden="true"></i>
        </a>
        <i ng-model="collapsed" ng-click="collapsed=!collapsed" class="fa fa-angle-down cust_downarrow vcommon_arrow pull-right"></i> -->
    </div>
    <div class="panel-wrapper"ng-if="currentfilter.showFilterTab">
             <div class="panel-body portlet-panel-body">
             <div class="pull-right">
                <i class="fa fa-times" aria-hidden="true" ng-click="openFilterTab()"></i>
            </div>
            <div class="table-responsives"> 
            <table class="table table-hover table-responsive table-bordered ">
                <tr>
                    <th>Procedure Name</th>
                    <th>Procedure Type</th>
                    <th>Performed Date</td>
                </tr>
                <tbody>
                    <tr class="portlet-tr" ng-repeat="item in items"> 
                        <td class="lefcol2">{{item.Procedure.ProcedureName}}</td>
                        <td class="lefcol1">{{item.ProcedureType.Description}}</td>
                        <td class="lefcol3">
                            <ngformatdate date-val='item.PerformedDate'></ngformatdate>
                        </td>
                        <!--
                        <td class="td-action">
                            <a ng-click="handleEvents('edit', item)" class="lnk-portlet-action"  uib-tooltip="{{ 'common.editaction.lbl' | translate }}" tooltip-placement="left" >
                                <i class="fa fa-pencil-square-o btn btn-success btn-rounded" aria-hidden="true"></i>
                            </a>
                            <a ng-click="handleEvents('delete', item)" class="lnk-portlet-action"  uib-tooltip="{{ 'common.deleteaction.lbl' | translate }}" tooltip-placement="left">
                                <i class="fa fa-times-circle btn btn-danger btn-rounded" aria-hidden="true"></i>
                            </a>
                        </td>
                        -->
                    </tr>
                </tbody>
            </table>
            </div>
        </div>
    </div>
</div>
