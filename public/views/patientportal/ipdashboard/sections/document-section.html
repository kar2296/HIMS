<div  class="col-xs-12 col-sm-12 col-md-12 col-lg-12">

    <div   class="panel {{currentcontext.paneltype}} portlet-panel" data-toggle="modal" data-target="#section5" >
       <div class="panel-heading portlet-panel-heading">
         
         <div class="col text-center">
            <img class="imagaecare" src="app/img/care img/records.png">
            <div >
                <center>
                    <strong translate="patientemr.patientdashboard.documents.lbl"></strong> 
                </center>
            </div>
         </div>
       </div>
       <div class="modal fade"  id="section5" tabindex="-1" role="dialog" aria-labelledby="basicModal" aria-hidden="true" >
           <div class="modal-dialog modal-lg">
             <div class="modal-content">

               <div class="modal-header">
                   <h4 class="modal-title" id="myModalLabel">Documents </h4>
                   
                 <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                   <span aria-hidden="true">&times;</span>
                 </button>
               </div>
               <div ng-app id="ng-app" class="modal-body" ng-controller="documentSectionController">
                <table class="table table-striped table-condensed">
                    <tbody>
                        <tr class="portlet-tr" ng-repeat="item in items | limitTo: currentcontext.recordcount">
                            <td>
                                <span class="lefcol1">
                                    <b class="text">{{item.CreatedDate|date:'dd:MM:yyyy'}}{{item.CreatedDate|date:'HH:mm'}}</b>
                                    <span class="lefcol8">{{item.DocumentType.Description}}</span>
                                <span class="lefcol3">{{item.Name}}</span>
                                <span><a ng-click="handleEvents('download', item)" class="lnk-portlet-action">
                                <i class="" aria-hidden="true">View</i></a>
                                </span>
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
               </div>
               
             </div>
           </div>
         </div>
     </div>
