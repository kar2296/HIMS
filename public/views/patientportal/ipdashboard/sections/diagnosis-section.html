<style>
    .vame {
        color: #058e0d;
    }

    .text {
        color: #2719b9;
    }

    .code {
        color: #062073;
    }
    .text-highlight4 {
    background-color: #ff9900;
    border-radius: 2px;
    color: white;
    padding-left: 2px;
    padding-right: 2px;
}
</style>
<div ng-app id="ng-app" class="panel {{currentcontext.paneltype}} portlet-panel" ng-controller="diagnosisSectionController as vm">
    <div class="panel-heading portlet-panel-heading">
        <strong translate="patientemr.ipdashboard.diagnosis.lbl"></strong>
        <i ng-model="collapsed" ng-click="collapsed=!collapsed" class="fa fa-angle-down cust_downarrow vcommon_arrow pull-right"></i>
    </div>
    <div class="panel-wrapper">
        <div class="panel-body portlet-panel-body" ng-show="!collapsed">
            <div class="table-responsive">
                <table class="table table-striped table-condensed">
                    <tbody>
                        <tr class="portlet-tr" ng-repeat="item in items | limitTo: currentcontext.recordcount">
                            
                              
                                    <!--<b class="text">{{item.ConditionDate|date:'dd:MM:yyyy'}}{{item.ConditionDate|date:'HH:mm'}}</b>&nbsp;&nbsp;&nbsp;-->
                                <td class="lefcol2">{{item.DiagnosisName}}</td>
                                <td class="lefcol1">({{item.Code}})</td>
                                <td class=""><span class="text-highlight4">{{item.ConditionType.Description}}</span></td>
                               
                            
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
