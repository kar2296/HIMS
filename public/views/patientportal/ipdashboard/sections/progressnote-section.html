<style>
    .notestatus {
        color: #f00;
    }

    .text {
        color: #2719b9;
    }
    .text-highlight3 {
    background-color: #090;
    border-radius: 2px;
    color: white;
    padding-left: 2px;
    padding-right: 2px;
}
.text-highlight5 {
    background-color: #F90;
    border-radius: 2px;
    color: white;
}
</style>
<div ng-app id="ng-app" class="panel {{currentcontext.paneltype}} portlet-panel" ng-controller="progressSectionController as vm">
    <div class="panel-heading portlet-panel-heading">
        <strong translate="patientemr.ipdashboard.progressnote.lbl"></strong>
        <i ng-model="collapsed" ng-click="collapsed=!collapsed" class="fa fa-angle-down cust_downarrow vcommon_arrow pull-right"></i>
    </div>
    <div class="panel-wrapper">
        <div class="panel-body portlet-panel-body" ng-show="!collapsed">
            <div class="table-responsive">
                <table class="table table-striped table-condensed">
                    <tbody>
                        <tr class="portlet-tr" ng-repeat="item in items | limitTo: currentcontext.recordcount">
                            
                                <td class="lefcol3">
                                    {{item.CapturedOn|date:'dd:MM:yyyy'}}{{item.CapturedOn|date:'HH:mm'}}</td>
                                    <td class=""><span class="text-highlight3 plain-text">{{item.Note.Description}}</span></td>
                                <td class=""><span class="text-highlight5 plain-text">{{item.CapturedUser.Title.Description}} {{item.CapturedUser.FirstName}} {{item.CapturedUser.LastName}}</span></td>
                                <td class="status">{{item.NoteStatus.Description}}</td>
                                <!--<span><a ng-click="handleEvents('edit', item)" class="lnk-portlet-action">
                                <i class="" aria-hidden="true">View</i></a>-->
                                </span>
                                </span>
                            
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
