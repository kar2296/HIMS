<div  class="col-xs-12 col-sm-12 col-md-12 col-lg-12">

    <div   class="panel {{currentcontext.paneltype}} portlet-panel" data-toggle="modal" data-target="#section5" >
       <div class="panel-heading portlet-panel-heading">
         
         <div class="col text-center">
            <img class="imagaecare" src="app/img/care img/nutrition.png">
            <div >
                <center>
                    <strong translate="patientemr.ipdashboard.dietorder.lbl"></strong> 
                </center>
            </div>
         </div>
       </div>
       <div class="modal fade"  id="section5" tabindex="-1" role="dialog" aria-labelledby="basicModal" aria-hidden="true" >
           <div class="modal-dialog modal-lg">
             <div class="modal-content">

               <div class="modal-header">
                   <h4 class="modal-title" id="myModalLabel">Dietorder </h4>
                   
                 <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                   <span aria-hidden="true">&times;</span>
                 </button>
               </div>
               <div ng-app id="ng-app" class="modal-body" ng-controller="dietSectionController">
                <table class="table table-striped table-condensed">
                    <tbody>
                        <tr class="portlet-tr" ng-repeat="item in items | limitTo: currentcontext.recordcount">
                            <td>
                                <span class="lefcol1">DietType:</span>&nbsp;<span class="unit">{{item.DietTypes.Description}}</span>;&nbsp;&nbsp;
                                <span class="lefcol1">DietPreferrence:</span>&nbsp;<span class="unit">{{item.DietPreferrence.Description}}</span>;&nbsp;&nbsp;
                                <span class="lefcol1">FoodPreference:</span>&nbsp;<span class="unit">{{item.FoodPreference.Description}}</span>;&nbsp;&nbsp;
                                <span class="lefcol1">TherapeuticDiet:</span>&nbsp;<span class="unit">{{item.TherapeuticDiet.Description}}</span>&nbsp;&nbsp;
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
               </div>
               
             </div>
           </div>
         </div>
     </div>
