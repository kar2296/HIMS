<style>
    .date {
        color: #b71b42;
    }

    .vname {
        color: #671e05;
    }

    .value {
        color: #ac19b9;
    }

    .text {
        color: #2719b9;
    }

    .unit {
        color: #EE7723;
    }
</style>
<div ng-app id="ng-app" class="panel {{currentcontext.paneltype}} portlet-panel" ng-controller="vitalSectionController as vm">
    <div class="panel-heading portlet-panel-heading">
        <strong translate="patientemr.ipdashboard.vitals.lbl"></strong>
        <i ng-model="collapsed" ng-click="collapsed=!collapsed" class="fa fa-angle-down cust_downarrow vcommon_arrow pull-right"></i>
    </div>
    <div class="panel-wrapper">
        <div class="panel-body portlet-panel-body" ng-show="!collapsed">
            <div class="table-responsive">
                <table class="table table-striped table-condensed"> 
                    <tbody>
                        <tr class="portlet-tr" ng-repeat="item in items | limitTo: currentcontext.recordcount">
                            <td class="lefcol3">
                                {{item.PerformedDate|date:'dd:MM:yyyy'}}{{item.PerformedDate|date:'HH:mm'}}
                                  
                            </td>
                            <td class="lefcol2">
                            <span class="">{{item.VitalName}}</span>&nbsp;
                            - <span class="value">{{item.VitalValue}}</span>&nbsp;&nbsp;<span class="unit">{{item.UOM}}</span>
                           </td>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
