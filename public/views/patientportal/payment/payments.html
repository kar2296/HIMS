<div class="row page-header">
    <div class="col-xs-6 col-sm-6">
    <h4 class="mt0" translate="patientportal.payment.pagetitle.lbl"></h4>
</div>
<div class="cl-sm-6">
        <button class="btn pull-right btn-xs bgportalbk" ng-click="home()" uib-tooltip="Back" tooltip-placement="bottom">
                <i class="fa fa-chevron-circle-left"></i>
            </button>
	 <!-- <button class="btn bt-color2 btn-xs pull-right back_but" ng-click="home()">
       <i class="fa fa-arrow-left"></i>&nbsp;&nbsp;<span class="ng-scope">Back</span>
      </button> -->
    </div>
</div>
<div class="row filter-area">
    <div class="col-sm-12">
        <div class="col-sm-3 filter-lbl">
            <div class="form-group">
                <label class="sr-only0 col-sm-5 col-md-4 control-label filter-lbl" translate="patientportal.payment.encountertype.lbl"></label>
                <div class="input-group col-sm-7 col-md-8">
                    <div class="input-group-addon"><i class="fas fa-search" aria-hidden="true"></i></div>
 <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.mrn" placeholder="">
                </div>
            </div>
        </div>
        <div class="col-sm-3 filter-lbl xsdnone">
            <div class="form-group">
                <label class="sr-only0 col-sm-5 col-md-4 control-label filter-lbl " translate="patientportal.payment.orderingdoctor.lbl"></label>
                <div class="input-group col-sm-7 col-md-8">
                    <div class="input-group-addon"><i class="fas fa-search" aria-hidden="true"></i></div>
                    <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.patientname" placeholder="">
                </div>
            </div>
        </div>
        <div class="col-sm-3 filter-lbl xsdnone">
            <label class="col-sm-5 col-md-4 control-label filter-lbl" translate="patientportal.payment.fromdate.lbl"></label>
            <div class="col-sm-7 col-md-8">
                <input type="text" class="form-control" name="dateofbirth" ng-change="getList()" datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}" ng-click="dateofbirthPopup = { opened: true }"
                    is-open="dateofbirthPopup.opened" ng-model="currentfilter.dateofbirth">
            </div>
        </div>
        <div class="col-sm-3 filter-lbl">
            <label class="col-sm-5 col-md-4 control-label filter-lbl" translate="patientportal.payment.todate.lbl"></label>
            <div class="col-sm-7 col-md-8">
                <input type="text" class="form-control" name="dateofbirth" ng-change="getList()" datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}" ng-click="dateofbirthPopup = { opened: true }"
                    is-open="dateofbirthPopup.opened" ng-model="currentfilter.dateofbirth">
            </div>
        </div>
    </div>
</div>
    <div class="container-fluid onerow-filterport">
		<div ui-grid="vm.gridConfig" class="table-uigrid"></div>
		<div class="fooder-bgs">
		<div class="row">
			<ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
        ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
	    </div>
		</div>
	</div>
