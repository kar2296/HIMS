<style>
    .formRoot {
        overflow: inherit;
    }

    .formactionbar {
        margin: 0px;
    }
</style>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form0" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
            <div class="formRoot">
                <div class="panel-body form-panel">
                    <div class="col-sm-12">

                        <div class="col-sm-1"></div>
                        <div class="col-sm-10">
                            <div class="well">
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="facility" translate="patientportal.appointmentrequest-form.facility.lbl"></label>
                                    <div class="col-sm-8">
                                        <ui-select id="facility" ng-model="item.FacilityId" name="facility" ng-change="" required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="department" translate="patientportal.appointmentrequest-form.department.lbl"></label>
                                    <div class="col-sm-6 col-md-8 toprighttext">
                                        <ui-select ng-model="item.DepartmentId" name="department" required ng-change="departmentChange()" tabindex="8" ng-disabled="canDisableDepartment()">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in currentcontext.selecteddept | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="doctor" translate="patientportal.appointmentrequest-form.doctor.lbl"></label>
                                    <div class="col-sm-8 toprighttext2">
                                        <autosearch itemid="item.DoctorId" iteminfo="vm.doctorcontrolconfig.iteminfo" rowdata="" config="vm.doctorcontrolconfig"
                                            itemchange="onDoctorSelected($select.selected)" tabindex="-1"></autosearch>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="appointmentdate" translate="patientportal.appointmentrequest-form.appointmentdate.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="appointmentdate" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                            placeholder="{{datePickerOptions.placeholder}}" ng-click="appointmentdatePopup = { opened: true }" is-open="appointmentdatePopup.opened"
                                            ng-model="item.AppointmentDate">                                        
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="comments" translate="patientportal.appointmentrequest-form.comments.lbl"></label>
                                    <div class="col-sm-8">
                                        <commentscontrol comments="item.RequestMessage"></commentscontrol>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-1"></div>
                    </div>
                </div>
            </div>
            <div class="panel-footer formactionbar">
                <div class="pull-right">
                    <button type="submit" class="draftbutton" translate="common.saveaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
