<link rel="stylesheet" href="app/css/patientportal.css" data-ng-if="!app.layout.isRTL">
<style>
    .cards img {
        width: 45%;
    }

    .row.health {
        margin-top: 17px;
        margin-bottom: 9px !important;
    }

    .col-sm-12.bot div {
        white-space: break-spaces;
        position: relative;
        top: 10px;
        font-size: 13px !important;
        white-space: nowrap;
        right: 0px;
        color: #042e71;
        font-weight: 500;
    }

    .col-md-3.col-sm-4.col-xs-6.col-lg-3.cards {
        text-align: center;
        border-radius: 10px;
        background: #ffffff;
        padding: 8px 18px;
        width: 16%;
        margin: 14px;
        border: 1px solid #ececec;
        height: 96px;
        border-radius: 21px;
    }

    .banner {
        position: absolute;
        width: 100%;
        height: 68%;
    }

    .banner-content {
        background: url(app/img/icon/banner-user@2x.png) !important;
        height: 100%;
        background-size: cover !IMPORTANT;
        min-height: 100%;
        max-height: 100%;
    }

    h1.banner-font {
        font-size: 30px !important;
        font-weight: 700 !important;
        color: #042e71;
    }

    .col-sm-6.col-xs-6.col-md-6.col-lg-6.banner-fonts {
        padding: 47px 0px 0 116px;
        text-align: center;
    }

    h1.banner-font a {
        color: #4AB6EA;
        font-weight: 500;
    }

    .banner-contents-words {
        background: #042e71;
        width: 100%;
        height: 100%;
        position: relative;
        min-height: 100%;
        float: left;
    }

    .banner-contents-words img {
        width: 75px;
        padding-top: 5px;
    }

    .banner-contents-words h3.ng-binding {
        text-transform: capitalize;
        font-size: 10px !important;
        color: white !IMPORTANT;
        letter-spacing: 1px;
        font-weight: 300 !important;
        padding-top: 10px;
    }

    .col-sm-12.copy {
        position: relative;
        top: 0px;
        font-size: 10px;
        padding: 10px;
        color: white;
        text-align: end;
    }

    .adblock {
        display: block;
        margin-bottom: 0px;
    }

    .footer-content.ng-scope .col-sm-12.copy {
        position: relative;
        top: 0px;
        font-size: 10px;
        padding: 10px;
        color: white;
        text-align: center;
    }

    .col-sm-6.col-xs-12.col-md-6.col-lg-6.banner-fonts {
        padding: 24px 0px 0px 114px;
        text-align: center;
    }

    @media (max-width:767px) {
        .banner-content {
            background: url(app/img/icon/banner-user@2x.png) !important;
            height: 100%;
            background-size: cover !IMPORTANT;
            min-height: 143px;
            max-height: 100%;
            float: left;
            margin-bottom: 31px;
        }

        .banner {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .layout-fixed .wrapper>section {
            margin-top: 0px !important;
        }

        footer.ng-scope {
            z-index: 9999;
            background: #ffffff !important;
            position: absolute;
            right: 17px !IMPORTANT;
            left: 0px;
        }

        .footer-content.ng-scope {
            padding: 6px 0px;
            left: 0px;
        }

        .col-sm-6.col-xs-12.col-md-6.col-lg-6.banner-fonts {
            padding: 24px 0px 0px 24px;
            text-align: center;
        }
    }

    .col-sm-11.col-xs-11.col-lg-11.col-md-11.user-info span a img {
        display: none;
    }

    span.banner-font {
        text-align: center;
        font-size: 30px !important;
        font-weight: 700 !important;
        color: #042e71;
    }

    span.banner-font a {
        color: #4AB6EA;
        font-weight: 500;
    }

    .content-wrapper.ng-scope.ng-fadeInUp {
        margin-top: 35px !important;
        margin-bottom: 85px !important;
    }

    @media only screen and (max-width: 320px) {
        .col-md-3.col-sm-4.col-xs-6.col-lg-3.cards {
            width: 40% !important;
        }

        .col-md-3.col-sm-4.col-xs-6.col-lg-3.cards {
            padding: 8px 9px !important;
        }
    }

    .Consultations,
    .Clinics\/Hospitals,
    .Oxygen.Booking,
    .Diagnostics,
    .Vaccines {
        display: none;
    }

    @media (max-width: 767px) {
        .col-md-3.col-sm-4.col-xs-6.col-lg-3.cards {
            text-align: center;
            border-radius: 10px !important;
            background: #ffffff;
            padding: 8px 18px !important;
            width: 45%;
            margin: 7px !important;
            border: 1px solid #ececec;
            height: 96px !important;
            border-radius: 21px !important;
        }
    }
</style>
<div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 no-pad">
    <div class="col-xs-12 col-sm-9 col-md-9 col-lg-9">

        <div id="cemr_dashboard" style="width: 100%;" class="ng-scope">

            <div class="">
                <div class="row health">
                    <div class="col-md-3 col-sm-4 col-xs-6  col-lg-3 cards" ng-click="prescriptionlist()">
                        <img src="app/img/icon/prescription_icon.png">
                        <div class="col-sm-12 bot">
                            <span>
                                <div translate="Prescriptions"></div>
                            </span>
                        </div>
                    </div>

                    <div class="col-md-3 col-sm-4 col-xs-6  col-lg-3 cards" ng-click="document()">
                        <img src="app/img/icon/documents_icon.png">
                        <div class="col-sm-12 bot">
                            <span>
                                <div translate="Documents"></div>
                            </span>
                        </div>
                    </div>

                    <div class="col-md-3 col-sm-4 col-xs-6  col-lg-3 cards" ng-click="laborders()">
                        <img src="app/img/icon/prescription_icon.png">
                        <div class="col-sm-12 bot">
                            <span>
                                <div translate="">Clinic Orders</div>
                            </span>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-4 col-xs-6  col-lg-3 cards" ng-click="labresult()">
                        <img src="app/img/icon/lab_results_icon.png">
                        <div class="col-sm-12 bot">
                            <span>
                                <div translate="">Lab Results</div>
                            </span>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-4 col-xs-6  col-lg-3 cards" ng-click="radiology()">
                        <img src="app/img/icon/ct-scan.png">
                        <div class="col-sm-12 bot">
                            <span>
                                <div translate="Radiologyresults"></div>
                            </span>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-4 col-xs-6  col-lg-3 cards" ng-click="medicalhistory()">
                        <img src="app/img/icon/history_icon.png">
                        <div class="col-sm-12 bot">
                            <span>
                                <div translate="History"></div>
                            </span>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-4 col-xs-6  col-lg-3 cards" ng-click="dischargesummary()">
                        <img src="app/img/icon/history_icon.png">
                        <div class="col-sm-12 bot">
                            <span>
                                <div translate="Discharge Summary"></div>
                            </span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
        <div class="col-sm-12 col-xs-12 col-md-12 col-lg-12 banner">
            <div class="col-sm-6 col-xs-12 col-md-6 col-lg-6 banner-content">
                <!-- <img src="app/img/icon/banner-user@2x.png" class="virtual-con"/> -->
            </div>
            <div class="col-sm-6 col-xs-12 col-md-6 col-lg-6 banner-fonts">
                <span class="banner-font" translate="Your Health"></span>
                <span class="banner-font">
                    <a translate="is an"></a>
                </span>
                <br>
                <span class="banner-font">
                    <span translate="Investment"></span></span>
                <br>
                <span class="banner-font">
                    <a translate="not an"></a>
                </span>
                <span class="banner-font">
                    <span translate="Expense"></span>
                </span>
            </div>
        </div>
    </div>
    <div class="col-xs-12 col-sm-3 col-md-3 col-lg-3">
        <aside id="sidebar">
            <div class="banner-contents-words">
                <div class="col-xs-6 col-sm-6 col-md-6 col-lg-6">
                    <img src="app/img/icon/white logo@2x.png" />
                </div>
                <div class="col-xs-6 col-sm-6 col-md-6 col-lg-6">
                    <h3> {{item.Content}}</h3>
                </div>
                <div class="col-sm-12 copy" align="center">&copy; <span translate="patientportals.swostha.title"></span>
                </div>
            </div>
            <div class="adblock">
                <img class="item-logo-img" ng-show="!!currentcontext.file" ngf-thumbnail="currentcontext.file" />
                <img class="item-logo-img" ng-show="!currentcontext.file && item.Attachment"
                    data-ng-src="data:image/png;base64,{{currentcontext.Image}}" />
            </div>
            <div class="col-sm-12" style="padding: 0;">
                <img src="app/img/svg/apple.svg" </div> </aside> </article> </div> </div> <div class="fooder-bgs"></div>
            <script>
                $(function () {
                    $(".fold-table tr.view").on("click", function () {
                        $(this).toggleClass("open").next(".fold").toggleClass("open");
                    });
                });
            </script>
            <style>
                .fooder-bgs {
                    margin-bottom: 26px !important;
                    height: 1% !important;
                    margin-top: 2px;
                }

                table th,
                table td {
                    padding: 7px;
                    font-size: 12px;
                }

                td {
                    border: 1px solid gainsboro;
                }

                table th {
                    text-align: left;
                    border-bottom: 1px solid #ccc;
                }

                th {
                    background: #00689f;
                    color: white;
                }

                @import url("https://netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.css");

                .pcs:after {
                    content: " pcs";
                }

                i.fa.fa-eye {
                    height: 25px;
                    background: #ffffff;
                    width: 23px;
                    padding: 5px 5px 4px 3px;
                    border-radius: 5px;
                    color: #2c4964 !important;
                }

                * {
                    box-sizing: border-box;
                }

                table {
                    width: 100%;
                }

                table th {
                    text-align: left;
                    border-bottom: 1px solid #ccc;
                }

                table th,
                table td {
                    padding: .4em;
                }

                table.fold-table>tbody>tr.view td,
                table.fold-table>tbody>tr.view th {
                    cursor: pointer;
                }

                table.fold-table>tbody>tr.view td:first-child,
                table.fold-table>tbody>tr.view th:first-child {
                    position: relative;
                    padding-left: 20px;
                }

                /* table.fold-table > tbody > tr.view td:first-child:before,
table.fold-table > tbody > tr.view th:first-child:before {
  position: absolute;
  top: 50%;
  left: 5px;
  width: 9px;
  height: 16px;
  margin-top: -8px;
  font: 16px fontawesome;
  color: #999;
  content: "\f0d7";
  transition: all .3s ease;
} */

                table th,
                table td {
                    padding: 8px;
                }

                table.fold-table>tbody>tr.view:nth-child(4n-1) {
                    background: #eee;
                }

                table.fold-table>tbody>tr.view:hover {
                    background: #fff;
                }

                table.fold-table>tbody>tr.view.open {
                    background: tomato;
                    color: white;
                }

                table.fold-table>tbody>tr.view.open td:first-child:before,
                table.fold-table>tbody>tr.view.open th:first-child:before {
                    transform: rotate(-180deg);
                    color: #333;
                }

                table.fold-table>tbody>tr.fold {
                    display: none;
                }

                table.fold-table>tbody>tr.fold.open {
                    display: table-row;
                }

                .fold-content {
                    padding: .5em;
                }

                .fold-content h3 {
                    margin-top: 0;
                }

                .fold-content>table {
                    border: 2px solid #ccc;
                }

                .fold-content>table>tbody tr:nth-child(even) {
                    background: #eee;
                }
            </style>
