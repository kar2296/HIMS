<style>
    .img {
        border: 1px solid #e6e0e0;
        height: 200px;
        width: 43%;
    }

    .item-logo-img {
    width: 435px !important;
    height: 194px !important;
}

    button.cnlbutton {
        background: #fafafa;
        color: #f05050;
        border: 2px solid #ff902b;
        border-radius: 46px;
        height: auto;
        width: 34px;
        margin-top: 0px;
        padding: 1px 4px !important;
        width: auto;
        position: relative;
        top: -9px;
        right: 26px;
    }

    i.fa.fa-times {
        padding: 3px;
    }
    .form-group.col-sm-12.ng-scope {
    margin-bottom: 12px;
}
textarea {
    width: 100%;
    height: 90px;
}
.col-sm-12.ban {
    margin-top: 20px;
    margin-bottom: 12px;
    margin: 8px 7px 16px 17px;
}   
.content-wrapper.ng-scope.ng-fadeInUp {
    background: white;
    height: -webkit-fill-available;
    position: absolute;
    border: unset;
    overflow: -moz-scrollbars-none;
    overflow: unset !IMPORTANT;
    overflow-x: hidden;
}
.header {
    margin-top: 52px;
}
</style>
<div class="row page-header">
    <h4 class="col-sm-8" translate="virtualhealth.successstory.pagetitle1.lbl"></h4>
</div>
<div class="form-group col-sm-6">
    <label class="col-sm-4 control-label" for="name" translate="virtualhealth.successstory.category.lbl"></label>
    <div class="col-sm-8">
       {{item.SuccessCategory}}
    </div>
</div>
<div class="form-group col-sm-6">
    <label class="col-sm-4 control-label" for="name" translate="virtualhealth.successstory.description.lbl"></label>
    <div class="col-sm-8">
        {{item.SuccessStory}}
    </div>
</div>
<div class="form-group col-sm-6">
    <label class="col-sm-4 control-label" for="name" translate="virtualhealth.successstory.title.lbl"></label>
    <div class="col-sm-8">
        {{item.Title}}
    </div>
</div>
<div class="form-group col-sm-6">
    <label class="col-sm-4 control-label" for="name" translate="virtualhealth.successstory.updateddate.lbl"></label>
    <div class="col-sm-8">
        {{item.CreatedDate}}
    </div>
</div>
<div class="form-group col-sm-6">
    <label class="col-sm-4 control-label" for="name" translate="virtualhealth.successstory.updatedby.lbl"></label>
    <div class="col-sm-8">
        {{item.CreatedUser.Title.Description}} {{item.CreatedUser.FirstName}}  {{item.CreatedUser.LastName}}
    </div>
</div>
<div class="form-group col-sm-6">
    <label class="col-sm-4 control-label" for="name" translate="virtualhealth.successstory.status.lbl"></label>
    <div class="col-sm-8">
        {{item.ActiveStatus.Description}}
    </div>
</div>
<div class="col-sm-12 ban">
    <div class="col-sm-4 img">
        <img class="item-logo-img" ng-show="!!currentcontext.file" ngf-thumbnail="currentcontext.file" />
        <img class="item-logo-img" ng-show="!currentcontext.file && item.Attachment" data-ng-src="data:image/png;base64,{{currentcontext.Image}}"
        />
    </div>
    <!-- <div class="col-sm-4">
        <button type="button" ng-disabled="SaveCompleted" style="    padding: 5px;" class="cnlbutton" tabindex="-1" ng-click="clearimage()"
            uib-tooltip="Clear" tooltip-placement="bottom">
            <img class="drhms-edit-button" src="assets/svg/delete.svg" alt="">
        </button>
    </div> -->
    
<div class="form-group col-sm-12">
    <!-- <label class="col-sm-12 control-label" translate="appmanager.dept.logo.lbl"></label> -->
    <div class="col-sm-12">
        <input type="file" ngf-select ng-model="currentcontext.file" name="file" ngf-max-size="200MB" />
    </div>
</div>
</div>

<div class="fooder-bgs" style="margin-bottom: 1px;">
    <button type="button" class="btn btn-sm pyr-color10" ng-click="backToList()"><i class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button>
    <div class="pull-right">
        <!-- <button type="button" class="draftbutton" ng-click="saveandApprove()" translate="common.saveaction.lbl"></button> -->
        <!-- <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                        ng-click="saveandApprove()"></button> -->
    </div>
</div>
