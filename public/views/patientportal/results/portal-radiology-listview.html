<style>
.layout-fixed .wrapper>section {
            background: #fff;
            height: 87vh;
            min-height: 87vh;
            overflow: scroll;
            overflow-x: hidden;
        }
        @media only screen and (max-width:768px){.labdetails {font-size:12px;}}
        .labdetails{font-size: 15px;}
    </style>

<div class="row page-header healthrec_title0">
    <div class="col-xs-6 col-sm-6">
        <h4 translate="" style="color: black !important;">Lab Result</h4>
    </div>
    <div class="col-sm-6">
        <button class="btn pull-right btn-xs bgportalbk" ng-click="back()" uib-tooltip="Back" tooltip-placement="bottom">
            <i class="fa fa-chevron-circle-left"></i>
        </button>

        <button class="btn btn-default portal_btn btn-xs pull-right" ng-click="Home()" uib-tooltip="Dashboard" tooltip-placement="bottom">
            <span class="fa fa-home"></span>
        </button>

    </div>
</div>

<div class="row filter-area custom_searchbox">
    <div class="col-sm-12 ">
        <div class="col-xs-12 col-sm-4 col-md-4 col-lg-4">
            <label class="col-sm-4 control-label filter-lbl result_order" translate="patientportal.patient-lab-result.filter_orderno.lbl"></label>
            <div class="col-sm-8">
                <input type="text" class="form-control" name="order" on-enter="getList()" ng-model="currentfilter.orderno"
                    placeholder="Order No.">
            </div>
        </div>

        <div class="col-xs-12 col-sm-4 col-md-4 col-lg-4">
            <label class="col-sm-4 control-label filter-lbl" translate="patientportal.patient-lab-result.filter_from.lbl"></label>
            <div class="col-sm-8">
                <input type="text" class="form-control" name="from" ng-change="getList()" ng-date-object
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                    ng-click="fromPopup = { opened: true }" is-open="fromPopup.opened" ng-model="currentfilter.fromdate">
            </div>
        </div>
        <div class="col-xs-12 col-sm-4 col-md-4 col-lg-4">
            <label class="col-sm-4 control-label filter-lbl" translate="patientportal.patient-lab-result.filter_to.lbl"></label>
            <div class="col-sm-8">
                <input type="text" class="form-control" name="to" ng-change="getList()" ng-date-object
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                    ng-click="toPopup = { opened: true }" is-open="toPopup.opened" ng-model="currentfilter.todate">
            </div>
        </div>

    </div>

</div>
<div class="container-fluid port_body">


    <div id="portal_mobile">

        <div class="content1 col-sm-12 col-md-12 col-lg-12 mgt6" id="listgraybg">
            <div class="pat_tab  custom_pat_bottom  col-xs-12 col-sm-12 col-lg-12 clearfix list" ng-click="radiologydetails()">
                <div class="custom_pat_height col-xs-1 col-sm-1 col-lg-1 portal_dashicon">

                    <img class="img-responsive portal_labimg" src="app/img/clinical/Profile.jpg" alt="lab">

                </div>
                <div class="custom_pat_height col-xs-10 col-sm-10 col-md-9 col-lg-10">
                    <!-- <h4 translate="patientportal.patientdashboard.ehealthsummary.lbl">eHealthSummary</h4> -->
                    <div class="col-xs-4 col-sm-2 col-lg-2 labdetails">18-12-2018</div>
                    <div class="col-xs-4 col-sm-2 col-lg-2 labdetails">KANNAN</div>
                    <div class="col-xs-4 col-sm-2 col-lg-2 labdetails">OP</div>
                    <a>
                        <i class="pat_icon fa fa-chevron-right fa-2x"></i>

                    </a>
                </div>
            </div>



        </div>

    </div>
</div>

<!----portal-mobile-ends-->
