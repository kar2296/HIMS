<style>
    .col-sm-12.head_btm{margin-bottom: 4%;margin-top: 1%;}
    .top-option{background: #6495ed;color:#fff;}
    .btn:active, .btn.active{background: #dc143c;color:#fff;}
    @media screen and (max-width:768px){.growth_chart{margin-top:4%;}
    svg#vital_growthchart{height: -webkit-fill-available;width:99% !important;}
}
@media only screen and (max-width:375px){.col-sm-12.head_btm{padding:0px;}}
</style>
<div class="growth_chart">
    <div class="col-sm-12 head_btm">
        <label class="btn btn-secondary top-option bscrum_active" ng-repeat="option in growthcharttabs" ng-model="currentcontext.growthchartselected"
            uib-btn-radio="option.key" ng-click="growhtchartChange(option)">{{option.name}}</label>
            <button type="button" class="btn bt-color2 btn-xs pull-right back_but">
                <a href="/www/index.html#/patientportal/patientportal/"><i class="fa fa-arrow-left"></i>&nbsp;&nbsp;<span class="ng-scope">Back</span></a>
              </button>
    </div>
    <div set-form-height reduce-height="50">
        <growthchart chartconfig="growthchartconfig"></growthchart>
    </div>
</div>
