

<div ng-app id="ng-app" class="panel {{currentcontext.paneltype}} portlet-panel" ng-controller="appointmentSectionController as vm">
    <div class="panel-heading portlet-panel-heading">
        <strong translate="patientemr.patientdashboard.appointments.lbl"></strong> 
        <!--
        <a ng-click="handleEvents('list')" class="pull-right lnk-portlet-header-action "   uib-tooltip="{{ 'common.moredetailsaction.lbl' | translate }}" tooltip-placement="bottom">
            <i class="fa fa-info btn-circle" aria-hidden="true"></i>
        </a>
        <a  ng-click="handleEvents('add')" class="pull-right lnk-portlet-header-action"   uib-tooltip="{{ 'common.addnewaction.lbl' | translate }}" tooltip-placement="bottom">
            <i class="fa fa-plus btn-circle" aria-hidden="true"></i>
        </a> -->
        <i ng-model="collapsed" ng-click="collapsed=!collapsed" class="fa fa-angle-down cust_downarrow vcommon_arrow pull-right"></i>
    </div>
    <div class="panel-wrapper">
        <div class="panel-body portlet-panel-body" ng-show="!collapsed"> 
            <div class="table-responsive">
            <table class="table table-hover table-responsive table-bordered ">
                <tbody>
                    <tr class="portlet-tr" ng-repeat="item in items"> 
                        <div class="row">
                            <td class="col-sm-5 lefcol1"> {{item.Remark.Remarks}} </td> 
                            <td class="col-sm-3 lefcol6">
                                <div ng-if='item.ResourceMaster'>
                                    <span>{{item.ResourceMaster.ResourceName}}</span>
                                </div>
                                <div ng-if='item.User'>
                                    <span ng-if='item.User.Title && item.User.Title.Description'>{{item.User.Title.Description}}&nbsp;</span>
                                    <span>{{item.User.FirstName}}</span>&nbsp;<span>{{item.User.LastName}}</span>
                                </div>
                            </td>
                            <td class="col-sm-2 lefcol3">
                                <ngformatdate date-val='item.AppointmentDate'></ngformatdate>
                            </td>
                           
                            <!--
                            <td class="td-action col-sm-2">
                                <a ng-click="handleEvents('edit', item)" class="lnk-portlet-action"  uib-tooltip="{{ 'common.editaction.lbl' | translate }}" tooltip-placement="left" >
                                    <i class="fa fa-pencil-square-o btn btn-success btn-rounded" aria-hidden="true"></i>
                                </a>
                                <a ng-click="handleEvents('delete', item)" class="lnk-portlet-action"  uib-tooltip="{{ 'common.deleteaction.lbl' | translate }}" tooltip-placement="left">
                                    <i class="fa fa-times-circle btn btn-danger btn-rounded" aria-hidden="true"></i>
                                </a>
                            </td>
                            -->
                        </div>
                    </tr>
                </tbody>
            </table>
            </div>
        </div>
    </div>
</div>
