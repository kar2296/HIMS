<div class="row page-header">
    <div class="col-xs-10 col-sm-6">
        <h4 class=" mt0" translate="medicalcertificate.dischargesummary-list.pagetitle.lbl"></h4>
    </div>

      </button> -->
    <div class="col-sm-6">
        <button class="btn pull-right btn-xs bgportalbk" ng-click="records()" uib-tooltip="Back"
            tooltip-placement="bottom">
            <i class="fa fa-chevron-circle-left"></i>
        </button>
    </div>
</div>

<div class="container-fluid" id="patientsearchheight">
    <table class="table table-responsive table-bordered table portaltbl">
        <thead class="thead-cstmbg">
            <tr>
                <th><span translate="admissions.admissionon.lbl"></span></th>
                <th><span translate="admissions.admissionno.lbl"></span></th>
                <th><span translate="admissions.ward.lbl"></span></th>
                <th><span translate="admissions.roomdetails.lbl"></span></th>
                <th><span translate="mrd.dod.lbl"></span></th>
                <th><span translate="admissions.admittedby.lbl"></span></th>
                <th><span translate="admissions.department.lbl"></span></th>
                <th><span translate="admissions.status.lbl"></span></th>
                <th><span translate="common.actions_col.lbl"></span></th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="item in DisSummary">
                <td>
                    <displaydate datetime-val="item.AdmissionDate"></displaydate>
                </td>
                <td>{{item.VisitIdentifier}}</td>
                <td>{{item.WardMaster.WardName}}</td>
                <td>{{item.WardRoomBedMaster.BedNo}}</td>
                <td>
                    <displaydate datetime-val="item.DischargeDate"></displaydate>
                </td>
                <td>{{item.Doctor.Title.Description}} {{item.Doctor.FirstName}} {{item.Doctor.LastName}}</td>
                <td>{{item.Department.DepartmentName}}</td>
                <td>{{item.AdmissionStatus.Description}}</td>
                <td>
                    <button class="btn btn-default btn-xs" tabindex="-1" ng-click="view(item)">
                        <img class="drhms-edit-button" src="assets/svg/edit.svg" alt="">
                    </button>
                </td>
            </tr>


        </tbody>
    </table>
