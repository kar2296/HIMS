<link href="app/css/regbilling.css" rel="stylesheet">
<style>
    #list {
        flex-wrap: wrap;
        display: flex;
    }

    .ipform-btn {
        position: relative;
        display: inline-block;
        margin: 5px;
        padding: 4px;
        text-align: center;
        font-size: 14px;
        letter-spacing: 0px;
        text-decoration: none;
        color: #999999;
        background: #ffffff;
        border: 2px solid #999999;
        cursor: pointer;
        transition: ease-out 0.5s;
        -webkit-transition: ease-out 0.5s;
        -moz-transition: ease-out 0.5s;
    }

    .ipform-btn::after,
    .ipform-btn::before {
        position: absolute;
        content: "";
        width: 0%;
        height: 0%;
        visibility: hidden;
    }

    .ipform-btn::after {
        bottom: -3px;
        right: -3px;
        border-left: 3px solid #222222;
        border-bottom: 3px solid #222222;
        transition: width .1s ease .1s, height .1s ease, visibility 0s .2s;
    }

    .ipform-btn::before {
        top: -3px;
        left: -3px;
        border-top: 3px solid #222222;
        border-right: 3px solid #222222;
        transition: width .1s ease .3s, height .1s ease .2s, visibility 0s .4s;
    }

    .ipform-btn:hover {
        animation: pulse 1s ease-out .4s;
        color: #222222;
    }

    .ipform-btn:hover::after,
    .ipform-btn:hover::before {
        width: calc(100% + 6px);
        height: calc(100% + 3px);
        visibility: visible;
        transition: width .1s ease .2s, height .1s ease .3s, visibility 0s .2s;
    }

    .ipform-btn:hover::after {
        transition: width .1s ease .2s, height .1s ease .3s, visibility 0s .2s;
    }

    .ipform-btn:hover::before {
        transition: width .1s ease, height .1s ease .1s;
    }
    .content-wrapper {
        padding: 5px !important;
    }
</style>
<div class="row">

                <div class="drhms-search-icon"><i class="fas fa-search" aria-hidden="true"></i></div>
            </div>
        </div>
    </div>
</div>

<script>
    // JavaScript code
    function search_ipforms() {
        let input = document.getElementById('searchbar').value
        input = input.toLowerCase();
        let x = document.getElementsByClassName('ipform-btn');

        for (i = 0; i < x.length; i++) {
            if (!x[i].innerHTML.toLowerCase().includes(input)) {
                x[i].style.display = "none";
            }
            else {
                x[i].style.display = "list-item";
            }
        }
    }

</script>
