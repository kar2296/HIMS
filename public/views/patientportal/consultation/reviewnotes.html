<script type="text/ng-template" id="cn-prescription-section.html">
    <div ng-if="sectionData.prescriptions[0].PrescriptionDetails[0].DrugName" class="row">
        <div class="col-sm-12" style="margin-top:0px;background:#add8e6;">
            <div class="form-group">
                <div class="col-sm-4 form-group">
                    <h4 class="control-label fontgreen mar_z" translate="patientportal.reviewnotes.prescription.lbl"></h4>
                </div>

        </div>
    </div>
    <div ng-if="sectionData.prescriptions.length > 0" ng-repeat="item in sectionData.prescriptions">
        <div class="row">
            <!-- <div class="col-sm-3 fontpink">
                <ngformatdate date-val='item.PrescriptionDate'></ngformatdate>
            </div> -->
            <table class="table table-responsive table-bordered">
                <thead>
                <tr>
                    <th class="col-sm-2 lefcol8">Drugs</th>
                    <th class="col-sm-2 lefcol8">Dosage</th>
                    <th class="col-sm-2 lefcol8">Route</th>
                    <th class="col-sm-2 lefcol8">Frequency</th>
                    <th class="col-sm-2 lefcol8">Duration</th>
                </tr>
            </thead>
            <tbody>
               <tr ng-repeat="detail in item.PrescriptionDetails">
                    <td class="col-sm-2"><span class="lefcol1">{{detail.DrugName}}({{detail.DrugCode}})</span></td>
                    <td class="col-sm-2"><span class="lefcol2">{{detail.Dosage}}</span></td>
                    <td class="col-sm-2"><span class="lefcol4">{{detail.DrugRoute.Description}}</span></td>
                    <td class="col-sm-2"><span class="lefcol3">{{detail.DrugFrequency.Name}}</span></td>
                    <td class="col-sm-2"><span class="lefcol5">{{detail.Duration}} {{detail.DurationPeriod.Description}}</span></td>
               </tr>
            </tbody>
            </table>
        </div>
    </div>

<script type="text/ng-template" id="cn-question-section.html">
    <div class="row" class="rev_items">
        <div class="col-sm-12" style="background:#add8e6" ;>
            <h4 class="control-label section-lable" style="">{{sectionData[item.sectionid].sectionName}}</h4>
        </div>
        <div ng-repeat="category in  sectionData[item.sectionid].cat" style="height:130px">
            <div class="row">
                <div class="col-sm-12" style="background:add8e6" ;>
                    <h5 class="control-label mar_z category-lable" style="">{{category.CategoryName}}</h5>
                </div>
            </div>
            <div class="row" ng-repeat="concept in category.concepts">
                <div class="concept-lable" ng-if="concept.ValueTypeId !=3" ng-show="concept.Result">
                    <span class="col-sm-3 lefcol1"style="margin-left: -26px;">{{concept.ConceptName}}</span>
                    <span class="col-sm-9 lefcol2">{{concept.Result}}</span>
                </div>
                <div class="concept-lable" ng-if="concept.ValueTypeId ==3 && concept.IsMultiple == false" ng-show="concept.Result">
                    <span class="col-sm-3 lefcol1"style="margin-left: -26px;">{{concept.ConceptName}}</span>
                    <span class="col-sm-9 lefcol2">{{concept.Result}}</span>
                </div>
                <div class="concept-lable" ng-if="concept.ValueTypeId ==3 && concept.IsMultiple == true" ng-show="concept.Terms && concept.Terms.length > 0">
                    <div class="col-sm-3 lefcol1"style="margin-left: -26px;">{{concept.ConceptName}}</div>
                    <div class="col-sm-9 lefcol2">
                        <span ng-repeat="term in concept.Terms">
                            {{term.TermName}}
                            <span ng-if="$index != concept.Terms.length-1">,</span>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</script>
<script type="text/ng-template" id="cn-followup-section.html">
    <div  ng-if="sectionData.followup.length > 0" class="row">
        <div class="col-sm-12" style="background:#add8e6;">

        </div>
    </div>
    <div  ng-if="sectionData.followup.length > 0" class="row" ng-repeat="item in sectionData.followup">
        <div class="col-sm-12" ng-hide="item.TrackerStatusId==3">
                <span style="color: maroon;font-size: 15px;" class="col-sm-3">Refer To</span>
                <span style="color:blue;" class="col-sm-3">{{item.AttendUser.Title.Description}} {{item.AttendUser.FirstName}} {{item.AttendUserLastName}}</span>
        </div>
        <div class="col-sm-12">
                <span style="color: maroon;font-size: 15px;" class="col-sm-3">Clinical Status</span>
                <span style="color:blue;" class="col-sm-3">{{item.ReferrerClinicalStatus.Description}}</span>
        </div>
        <div class="col-sm-12">
                <span style="color: maroon;font-size: 15px;" class="col-sm-3">Followup On</span>
                <span style="color:blue;margin-left: -6px;font-size: 14px;font-weight: 500" class="col-sm-3"><ngformatdate date-val='item.FollowupAppointmentOn'></ngformatdate>
                </span>
        </div>
        <div class="col-sm-12">
            <span style="color: maroon;font-size: 15px;" class="col-sm-3">Comments</span>
            <span style="color:blue;margin-left: -6px;font-size: 14px;font-weight: 500" class="col-sm-3">{{item.TrackerComments}}</span>
    </div>
    </div>
</script>
