<style>
    .consult-modal-body {
        height: 150px;
    }

    .tab-content-div {
        padding-left: 0px !important;
        padding-right: 0px !important;
    }

    .sidetab-content-div {
        z-index: 9999;
    }

    .modal.modal-slide-in-right .modal-dialog {
        opacity: 0;
        -webkit-transform: translate(50%, 50%);
        -ms-transform: translate(50%, 50%);
        -o-transform: translate(50%, 50%);
        transform: translate(50%, 50%);
        -webkit-transition: all .1s cubic-bezier(.25, .5, .5, .9) 0s;
        -o-transition: all .1s cubic-bezier(.25, .5, .5, .9) 0s;
        transition: all .1s cubic-bezier(.25, .5, .5, .9) 0s;
    }

    .modal.modal-slide-in-right.in .modal-dialog {
        opacity: 1;
        -webkit-transform: translate(0px, 0px);
        -ms-transform: translate(0px, 0px);
        -o-transform: translate(0px, 0px);
        transform: translate(0px, 0px);
    }

    #tab-sidebar {
        overflow-y: auto !important;
        overflow-x: hidden !important;
    }

    .side_popup .right-tab a {
        background: red;
        color: #fff;
        padding-left: 0px;
        padding-right: 0px;
    }

    .side_popup .right-tab a:hover {
        background: gray;
        color: #fff;
    }

    div#tab-sidebar {
        background: #DAD5D5;
        padding: 0px;
    }

    div#tab-sidebar ul {
        right: 15px;
        top: 6px;
    }

    .custom-modal-header {
        margin-bottom: 2px !important;
        background-color: #193858;
        color: #fff;
    }

    .panel-footer.formactionbar {
        width: 87%;
        text-align: center;
        margin: 0px auto;
        position: fixed;
        bottom: 0px;
        left: 13%;
        z-index: 999;
    }

    .aside-collapsed .panel-footer.formactionbar {
        width: 97.8% !important;
        left: 2% !important;
        text-align: center;
        margin: 0px auto;
        position: fixed !important;
        bottom: 0px;
    }

    .header {
        color: #592be2;
        text-align: center;
        margin: 0px auto;
        font-size: 16px;
        font-weight: 500;
        text-align: left;
    }

    .status {
        color: #ec2424;
        font-size: 18px;
        font-weight: 600;
    }

    .header span {
        font-weight: 700;
        font-size: 15px;
        padding: 0px 4px;
    }

    /* .modal-dialog.modal-lg{margin:0px auto;} */

    .panel-favorite .panel-body {
        /* height: auto; */
        height: 140px;
    }

    .con_hdate {
        color: #13D;
    }

    .con_hname {
        color: #05a4f3;
    }

    .con_hdesc {
        color: #13D;
    }

    .con_hmaster {
        color: #05a4f3;
    }

    .hnotes {
        background: #a52a2a;
        color: #fff;
    }

    label.col-sm-2.control-label {
        color: #1190dd !important;
        font-weight: 500;
        font-variant-caps: all-petite-caps;
        font-size: 18px;
        padding-right: 0px;
        padding-left: 0px;
    }

    .side_popup {
        height: 460px;
        overflow-x: scroll;
        overflow-x: hidden;
    }

    @media (device-width:100vw) and (device-height:100vh) {
        .side_popup {
            height: 550px;
            overflow-x: hidden;
        }
    }

    .icon_home {
        width: 2.5%;
        float: right;
    }

    .icon_emrboard {
        width: 2.5%;
        float: right;
        margin-right: 8px;
        margin-left: 1%;
    }

    @media (min-width:1200px) {
        .side_popup {
            min-height: 406px;
            height: 407px;
        }
    }

    @media (min-width:1360px) {
        .side_popup {
            min-height: 460px;
            height: 460px;
        }
    }
    .col-sm-12.tab-content-div {
        border: 1px solid gainsboro;
    padding-left: 0px;
    margin-top: 7px;
}
</style>

<div class="col-md-12" style="padding: 5px; border: 1px solid gray;border-radius: 5px;">
    <div class="col-sm-4 form-group">
        <label class="col-sm-5 control-label" translate="patientemr.consultation.profile.lbl"></label>
        <div class="col-sm-7">
            <ui-select ng-disabled= "consultationloaded"  ng-model="profileinfo.profileid" ng-change="profilePrefChanged($select.selected)">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Profile | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="col-sm-4">
        <button class="btn btn-primary btn-xs" type="button" ng-disabled= "consultationloaded" ng-click="saveItem()">Save</button>
        <button class="btn btn-danger btn-xs" type="button" ng-disabled= "!consultationloaded" ng-click="deleteItem()">Delete</button>
    </div>
    <div class="col-sm-4">
    </div>
</div>
