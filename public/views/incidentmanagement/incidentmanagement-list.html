<link rel="stylesheet" href="app/css/drhms.css">
<div class="row page-header">
    <div class="col-sm-10">
        <h4 class="mt0" translate="taskmanagement.incidentmanagement.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <button class="btn-add" ng-click="addNew()" uib-tooltip="{{ 'Add Incident' }}"
            tooltip-placement="bottom">
            <i class="fa fa-plus" aria-hidden="true"></i>
        </button>
    </div>
</div>
<div class="row">
    <div class="col-sm-3">
        <label class="col-sm-12 control-label" for="fromdate" translate="taskmanagement.from.lbl"></label>
        <div class="col-sm-12">
            <input type="text" class="form-control" name="fromdate" ng-change="getList()" datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                is-open="fromdatePopup.opened" ng-model="currentfilter.FromDate">
        </div>
    </div>
    <div class="col-sm-3">
        <label class="col-sm-12 control-label" for="date" translate="taskmanagement.to.lbl"></label>
        <div class="col-sm-12">
            <input type="text" class="form-control" name="todate" ng-change="getList()" datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
                is-open="todatePopup.opened" ng-model="currentfilter.ToDate">
        </div>
    </div>
    <div class="col-sm-3">
        <label class="col-sm-12 control-label" for="status" translate="taskmanagement.status.lbl"></label>
        <div class="col-sm-12">
            <ui-select ng-model="currentfilter.IncidentStatusId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.IncidentStatus | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="col-sm-3">
        <label class="col-sm-12 control-label" for="status" translate="taskmanagement.department.lbl"></label>
        <div class="col-sm-12">
            <ui-select ng-model="currentfilter.DepartmentId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>

</div>

<div class="fooder-bgs">
    <div class="row">
        <custom-table config="vm.gridConfig"></custom-table>
        <customreport-table config="vm.gridConfig"></customreport-table>
        <customreport-table config="vm.gridConfig"></customreport-table>
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
