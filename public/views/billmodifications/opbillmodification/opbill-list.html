<table id="bannerdetails">
    <tr>
        <td translate="billmodifications.ipbillmodification.filter_billnumber.lbl"></td>
        <td> <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.BillNumber" translate
                translate-attr-placeholder="billmodifications.ipbillmodification.filter_billnumber.lbl"></td>
        <td translate="billmodifications.ipbillmodification.filter_patientname.lbl"></td>
        <td> <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.NameMrn"
                placeholder="NAME/MRN"></td>
        <td translate="billmodifications.ipbillmodification.billdate.lbl"></td>
        <td> <input type="text" class="form-control" name="billdatetime" ng-change="getList()"
                datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="billdatetimePopup = { opened: true }" is-open="billdatetimePopup.opened"
                ng-model="currentfilter.BillDateTime"></td>
    </tr>
</table>
