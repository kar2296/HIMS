<style>
    .modal-lg {
        width: 65%;
    }

    label.ng-binding {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .modal-content {
        width: 160vh;
        position: relative;
        right: 15px;
    }

    /**@media screen and (min-width:1360px){.fooder-bg.ipbill_footer{position: absolute;
    top: 141px;left: -5px !important;
    width: 100% !important;}}**/
</style>

<script type="text/javascript">
    $(document).ready(function () {
        $("#itembtn").click(function () {
            $(".items").toggle();
        });
    });
    $(document).ready(function () {
        $("#categorybtn").click(function () {
            $(".catogories").toggle();
        });
    });
</script>

<style>
    table#mainresponsivetablecontrol .table>tbody>tr>td,
    #mainresponsivetablecontrol .table>thead:first-child>tr:first-child>td {
        height: auto !important;
        background: unset;
        color: #080364 !important;
    }
</style>
<div class="modal-header custom-modal-header">
    <h4 class="col-sm-10 modal-title custom-modal-title">Pharmacy Bill Modify Details({{ServiceCategoryName}})</h4>
    <div class="col-sm-2">
        <button id="btnCancelForm" type="button" class="btn btn-danger btn-sm pull-right" ng-click="cancelCallback()"
            translate="X"></button>
    </div>
</div>
<div class="bg-pattern">
    <patientbanner patientid="PatientId"></patientbanner>

    <div class=" table-control">
        <div class="table-height" id="">
            <table class="table table-hover table-responsive table-bordered" style="width: 98%;">
                <thead class="bg-subhead">
                    <tr>
                        <th><span translate="billing.supplementary-details.serviceitem.lbl"></span> </th>
                        <th><span translate="billing.supplementary-details.date.lbl"></span> </th>
                        <th><span translate="billing.supplementary-details.qty.lbl"></span> </th>
                        <th><span translate="billing.supplementary-details.rate.lbl"></span> </th>
                        <th><span translate="billing.supplementary-details.doctor.lbl"></span> </th>
                        <th><span translate="billing.supplementary-details.discount.lbl"></span> </th>
                        <th><span translate="billing.supplementary-details.net.lbl"></span> </th>
                        <th class="col-sm-1">
                            <span translate="billing.supplementary-details.action.lbl"></span>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="bill in PatientBillDetails" ng-if="bill.Status == 1">
                        <td>
                            <label>{{bill.ServiceName}}</label>
                        </td>
                        <td>
                            <input type="text" class="form-control" name="billdatetime" ng-date-object
                                datetime-picker="{{datePickerOptions.dateTimeFormat}}"
                                placeholder="{{datePickerOptions.placeholder}}"
                                ng-click="modifiedbilldatetimePopup = { opened: true }"
                                is-open="modifiedbilldatetimePopup.opened" ng-model="bill.BillDateTime">
                        </td>
                        <td>
                            <input type="text" min="0" ng-keypress="numberonly($event)" class="form-control"
                                ng-model="bill.Quantity" placeholder="" ng-change="computeAmount($index, bill)">
                        </td>
                        <td>
                            <input type="text" min="0" ng-keypress="numberonly($event)" class="form-control"
                                ng-model="bill.Rate" placeholder="" ng-change="computeAmount($index, bill)">
                        </td>
                        <td>
                            <label>{{bill.User.FirstName}}&nbsp;{{bill.User.LastName}}</label>
                        </td>
                        <td>
                            <input type="text" min="0" ng-keypress="numberonly($event)" class="form-control"
                                ng-model="bill.DiscountAmount" placeholder="" ng-change="computeAmount($index, bill)">
                        </td>
                        <td class="currency-align">
                            <label>{{bill.NetAmount | displaycurrency}}</label>
                        </td>
                        <td class="text-center">
                            <button type="button" class="btn btn-danger btn-xs" ng-click="deleteBill($index, bill)">
                                <img class="drhms-edit-button" src="assets/svg/delete.svg" alt="">
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
            <table class="table table-hover table-responsive table-bordered" id="bannerdetails">
                <tbody>
                    <tr>
                        <td><span translate="Total Received Amount"></span> </td>
                        <td> <label>{{ReceiveAMT}}</label> </td>
                        <td><span translate="Net Amount"></span> </td>
                        <td> <label>{{AfterReducedTotalAmt}}</label> </td>
                    </tr>
                    <tr>
                        <td><span translate="Previous Amount"></span> </td>
                        <td> <label>{{CategoryTotalAmt}}</label> </td>
                        <td><span translate="Reduced Net Amount"></span> </td>
                        <td> <label>{{ReducedTotalAmt}}</label> </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
<div class="fooder-bg ipbill_footer ">
    <div class="pull-right">
        <div class="col-sm-12">
            <button type="button" id="btnsubmit" class="draftbutton" ng-click="update()"> Update </button>

        </div>
    </div>
</div>
