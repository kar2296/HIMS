<div class="row">
    <div class="col-sm-4">
        <label class="col-sm-4" translate="billmodifications.ipbillmodification.filter_billnumber.lbl"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.BillNumber" translate
                translate-attr-placeholder="billmodifications.ipbillmodification.filter_billnumber.lbl">
        </div>
    </div>
    <div class="col-sm-4">
        <label class="col-sm-4" translate="billmodifications.ipbillmodification.filter_patientname.lbl"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.NameMrn"
                placeholder="NAME/MRN">
        </div>
    </div>
    <div class="col-sm-4">
        <label class="col-sm-4" translate="billmodifications.ipbillmodification.billdate.lbl"></label>
        <div class="col-sm-8">
            <div class="datepicker" id="datepicker">
                <input type="text" class="form-control" name="billdatetime" ng-change="getList()"
                    datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="billdatetimePopup = { opened: true }"
                    is-open="billdatetimePopup.opened" ng-model="currentfilter.BillDateTime">
                <i class="fa fa-calendar"></i>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
