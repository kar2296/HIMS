<style>
    .nameinfo {
        font-size: 13px;
        font-weight: 700;
        color: #337ab7;
    }

    .nameinfo.mrninfo {
        color: black
    }

    .contactinfo {
        font-size: 10px;
        color: #808080
    }

    .block {
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
    }

    .linkstyle {
        font-weight: 700;
        text-align: right;
    }

    .statusinfo {
        font-size: 13px;
    }

    .countbg {
        background-color: #fff;
        padding: 0px 7px;
        border: 1px solid #d4c8c8;
        border-radius: 6px;
    }

    .form-group {
        margin-bottom: 7px !important;
    }

    .sr-only {
        height: 22px !important;
    }

    .well {
        padding: 5px;
    }

    @media only screen and (min-width: 993px) {
        .table-uigrid {
            margin-left: 10px;
            margin-right: 10px;
            height: 390px !important;
        }
    }
</style>

<table id="bannerdetails">
    <tr>
        <td  translate="billmodifications.ipbillmodification.filter_billnumber.lbl"></td>
        <td>   <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.BillNumber" translate translate-attr-placeholder="billmodifications.ipbillmodification.filter_billnumber.lbl"></td>
        <td translate="billmodifications.ipbillmodification.billdate.lbl"></td>
        <td>  <input type="text" class="form-control" name="billdatetime" ng-change="getList()" datepicker-options="datePickerOptions"
                    show-button-bar="{{datePickerOptions.showButtonBar}}" uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="billdatetimePopup = { opened: true }" is-open="billdatetimePopup.opened"
                    ng-model="currentfilter.BillDateTime"></td>
        <td translate="billmodifications.ipbillmodification.filter_patientname.lbl"></td>
        <td>  <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.NameMrn" placeholder="NAME/MRN"></td>
        <td translate="billmodifications.ipbillmodification.filter_visitnumber.lbl"></td>
        <td>   <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.VisitNumber" translate translate-attr-placeholder="billmodifications.ipbillmodification.filter_visitnumber.lbl"></td>
    </tr>
</table>
