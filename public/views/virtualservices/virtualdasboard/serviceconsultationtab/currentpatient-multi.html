<style>
    /*  bhoechie tab */
    div.bhoechie-tab-container {
        z-index: 10;
        background-color: #ffffff;
        padding: 0 !important;
        border-radius: 4px;
        -moz-border-radius: 4px;
        border: 1px solid #ddd;
        margin-top: 0px;

        -webkit-box-shadow: 0 6px 12px rgba(0, 0, 0, .175);
        box-shadow: 0 6px 12px rgba(0, 0, 0, .175);
        -moz-box-shadow: 0 6px 12px rgba(0, 0, 0, .175);
        background-clip: padding-box;
        opacity: 0.97;
        filter: alpha(opacity=97);
    }

    div.bhoechie-tab-menu {
        padding-right: 0;
        padding-left: 0;
        padding-bottom: 0;
    }

    div.bhoechie-tab-menu div.list-group {
        margin-bottom: 0;
    }

    div.bhoechie-tab-menu div.list-group>.col-sm-12.innertabs a label.btn {
        margin-bottom: 0;
    }

    div.bhoechie-tab-menu div.list-group>.col-sm-12.innertabs a label.btn .glyphicon,
    div.bhoechie-tab-menu div.list-group>.col-sm-12.innertabs a label.btn .fa {
        color: #5A55A3;
    }

    div.bhoechie-tab-menu div.list-group>.col-sm-12.innertabs a label.btn:first-child {
        border-top-right-radius: 0;
        -moz-border-top-right-radius: 0;
    }

    div.bhoechie-tab-menu div.list-group>.col-sm-12.innertabs a label.btn:last-child {
        border-bottom-right-radius: 0;
        -moz-border-bottom-right-radius: 0;
    }

    div.bhoechie-tab-menu div.list-group>.col-sm-12.innertabs a label.btn.active,
    div.bhoechie-tab-menu div.list-group>.col-sm-12.innertabs a label.btn.active .glyphicon,
    div.bhoechie-tab-menu div.list-group>.col-sm-12.innertabs a label.btn.active .fa {
        background-color: #5A55A3;
        background-image: #5A55A3;
        color: #ffffff;
    }

    div.bhoechie-tab-menu div.list-group>.col-sm-12.innertabs a label.btn:after {
        content: '';
        position: absolute;
        left: 100%;
        top: 50%;
        margin-top: -13px;
        border-left: 0;
        border-bottom: 13px solid transparent;
        border-top: 13px solid transparent;
        border-left: 10px solid #5A55A3;
    }

    div.bhoechie-tab-content {
        background-color: #ffffff;
        /* border: 1px solid #eeeeee; */
        padding-left: 20px;
        padding-top: 4px !important;
        padding-bottom: 4px !important;
    }

    .innertabs .btn-group.col-sm-12 {
        display: flex;
        flex-direction: column !important;
    }

    .btn-custom-radio {
        margin: 4px !important;
        border-radius: 4px !important;
        height: 40px !important;
        vertical-align: middle !important;
        -moz-border-radius: 4px !important;
        -webkit-border-radius: 4px !important;
        padding: 6px !important;
    }

    .btn-success.active {
        margin-bottom: 0px !important;
    }

    div.bhoechie-tab-menu div.list-group>.col-sm-12.innertabs a label.btn {
        width: 100% !important;
        color: #164360;
        background-color: #90baef;
        border-color: #eaeaea;
        color: #164360;
        width: 100% !important;
        margin-bottom: 10px !important;
        font-size: 17px !important;
    }

    .list-group .list-group-item {
        padding: 6px;
    }

    .bhoechie-tab {
        height: 100% !important;
        overflow-y: auto;
        margin-top: 10px !important;
    }

    .contentview {
        border: 1px solid;
        padding: 20px;
        margin-bottom: 60px !important;
    }

    .card p {
        background-color: rgba(226, 214, 155, .65);
        position: relative;
        width: fit-content;
    }

    .card {
        min-height: auto !important;
    }

    .bhoechie-tab-content.card.ng-scope h3 {
        margin-top: 0px !important;
    }

    h5.orderno.ng-binding {
        font-size: 17px !important;
        color: #164360;
        font-weight: 600 !important;
    }

    span.ng-binding.ng-scope {
        font-size: 16px;
    }

    h5.patientname.ng-binding {
        font-size: 17px !important;
        font-weight: 600 !important;
    }

    h6.categoryname.ng-binding {
        font-size: 15px !important;
        color: #164360;
    }

    h4.scheduledate {
        background: #1716167d;
        color: white !important;
        width: fit-content;
        padding: 0px 8px;
    }

    h4.scheduledate i {
        margin-right: 10px !important;
    }

    h6.orderstatus.ng-binding {
        font-size: 17px !important;
        color: purple;
    }

    .col-sm-12.innertabs {
        padding: 0px !important;
    }

    .list-group-item {

        border: 1px solid #16436082 !important;
    }

    .glyphicon {

        margin: 0px !important;
    }

    .titlediv h4 {
        font-size: 15px !important;
        font-weight: 600 !important;
        color: #ffffff;
        padding: 0 10px;
    }

    .titlediv {
        background: #164360;
        padding: 0.5px;
        margin-bottom: 9px;

    }

    h4.scheduledate span.ng-binding {
        font-size: 16px !important;
        color: white !important;
    }

    .modal-full {
        width: 80%;
    }

    @media (min-width: 1200px) {
        .col-lg-10 {
            width: 83% !important;
        }
    }

    div#outsearch input#pid {
        background: #ff902b38 !important;
        width: 100% !important;
        margin-top: -4px;
        margin-right: 7px;
    }

    @media (min-width: 992px) {
        .col-md-10 {
            width: 80.333333% !important;
        }
    }

    @media (min-width: 767px) {
        .desktop {
            display: block;
        }

        .mobile {
            display: none;
            ;
        }
    }

    @media (max-width: 767px) {
        .desktop {
            display: none;
        }

        .mobile {
            display: block;
            ;
        }
    }

    @media (max-width:930px) {
        h4.glyphicon.glyphicon-plane+h4 {
            display: none;
        }

        div.bhoechie-tab-menu div.list-group {
            margin-bottom: 0;
            width: 100%;
        }

        .list-group .list-group-item:nth-child(1) h4.glyphicon.glyphicon-plane+h4 {
            display: block !important;
        }

        .list-group .list-group-item {
            width: 100%;
        }
    }

    @media (max-width:1100px) {
        .list-group {
            display: inline-flex;
        }
    }

    @media screen and (max-width: 500px) and (min-width: 300px) {
        .col-xs-5.col-sm-5 {
            width: 97%;
            padding: 0;

        }

        .col-xs-2 {
            width: 32.666667%;
            padding: 0;
        }

        .col-xs-2 {

<div id="checkedinpatients" class="doct_checkedinpatients">


    <table id="bannerdetails">
        <tr>
            <td translate="Date"></td>
            <td>
                <div class="datepicker" id="datepicker">
                    <input type="text" class="form-control cwidth" ng-change="getList()"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="scheduledatePopup = { opened: true }"
                        is-open="scheduledatePopup.opened" ng-model="currentfilter.scheduledate">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </td>
            <td translate="billing.servicebilldiscounts.approvalstatus.lbl"></td>
            <td>
                <ui-select ng-model="currentfilter.consultationstatusid" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length > 20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ConsultationStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </td>

            <td>
                <div class="search">
                    <input type="text" id="pid" class="form-control" on-enter="getList()"
                        ng-model="currentfilter.patientname" translate
                        translate-attr-placeholder="registration.checkedinpatients.namemrn.lbl"><i class="fas fa-search"
                        aria-hidden="true"></i>
                </div>
            </td>
        </tr>
    </table>
    <div class="desktop">
        <custom-table config="vm.gridConfig"></custom-table>
        <div class="container-fluid ">
            <div class="fooder-bgs ">
                <div class="row">
                    <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
                        items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                        ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
                </div>
            </div>
        </div>
    </div>
    <div class="mobile">

        <div class="row" style="margin-top:0px;">
            <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 bhoechie-tab-container">

                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 bhoechie-tab">
                    <div class="titlediv">
                        <h4>Order Details</h4>
                    </div>
                    <div class="bhoechie-tab-content card" ng-repeat="ctgry in PendingOrders">

                        <div class="col-md-12 col-sm-12">
                            <div class="col-xs-2 col-sm-2">
                                <h5 class="orderno">{{ctgry.VirtualOrder.OrderNumber}}</h5>
                                <h6 class="orderdate">
                                    <displaydate date-val="ctgry.VirtualOrder.OrderRequestDate">
                                    </displaydate>
                                </h6>
                            </div>
                            <div class="col-xs-5 col-sm-5">
                                <h5 class="patientname">{{ctgry.Patient.Title.Description}} .
                                    {{ctgry.Patient.FirstName}}&nbsp;{{ctgry.Patient.LastName}} | <span
                                        style="font-weight: 600;color: #164360;">{{ctgry.Patient.MRN}}</span></h5>
                                <h6 class="categoryname">
                                    <div class='ui-grid-cell-contents'>
                                        <div ng-if='ctgry.VirtualOrder.OrderConsultTypeId==1'>
                                            <span>Call</span>
                                        </div>
                                        <div ng-if='ctgry.VirtualOrder.OrderConsultTypeId==2'>
                                            <span>Video</span>
                                        </div>
                                    </div>
                                </h6>
                            </div>
                            <div class="col-xs-3 col-sm-3">
                                <h4 class="scheduledate"><i class="fa fa-clock" aria-hidden="true"></i>
                                    {{ctgry.ConsultationStatus.Description}}
                                </h4>

                            </div>
                            <div class="col-xs-2 col-sm-2">
                                <!-- <h4>{{ctgry.StartDate}}</h4> -->
                                <div class="ui-grid-cell-contents">
                                    <span class="grid-action" ng-click="handleEvents('attend',entity)"
                                        ng-show="entity.EncounterDoctorStatus==1" tooltip-placement="top">
                                        <i class="fas fa-hospital-user" uib-tooltip="Attend"  aria-hidden="true"></i></span>
                                    <span class="grid-action" ng-click="handleEvents('emr',entity)"
                                        ng-hide="entity.EncounterDoctorStatus==1" tooltip-placement="top">
                                        <i class="fas solid fa-laptop-medical" uib-tooltip="EMR" aria-hidden="true"></i></span>
                                </div>


                            </div>
                        </div>


                    </div>

                </div>
            </div>
        </div>
    </div>
    <script>
        $(document).ready(function () {

            function contenttab() {

            }
            $("div.bhoechie-tab-menu>div.list-group>.col-sm-12.innertabs a label.btn").click(function (e) {
                e.preventDefault();
                $(this).siblings('a.active').removeClass("active");
                $(this).addClass("active");
                var index = $(this).index();
                $("div.bhoechie-tab>div.bhoechie-tab-content").removeClass("active");
                $("div.bhoechie-tab>div.bhoechie-tab-content").eq(index).addClass("active");
            });
        });
    </script>


</div>

</div>

    input#pid {
        width: 100% !important;
    }

    .col-sm-12.pager-div {
        display: inline-block;
        width: 100% !important;
    }
