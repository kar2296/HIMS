<style>
    @media (max-width:500px) and (min-width:300px) {
        .nav-tabs>li>a>span {
            display: block;
            font-size: 11px;
            white-space: break-spaces;
        }

        li.uib-tab.ng-scope.ng-isolate-scope,
        li.uib-tab.ng-scope.ng-isolate-scope.active {
            width: 33% !important;
            padding: 0px 1px !important;
            text-align: center;
        }

        .nav-tabs>li>a {
            height: 37px;
        }

        div#assettabs ul li a:before {
            display: none;
        }
    }
</style>
<div class="row page-header" id="assets">
    <h4 class="col-sm-6 mt0 active" translate="appointment.homecaremanagement.doctorconsultant.lbl"></h4>
    <div class="col-sm-6">
        <div class="">
            <span class="drhms-billing-btn drhms-outstandingbill-btn" uib-tooltip="Dashboard"
                tooltip-placement="bottom">
                <i class="fas fa-th-large" aria-hidden="true"></i>
            </span>
        </div>
    </div>
    <div class="row tablebox" id="tablebox">
        <div class="col-sm-12">
            <uib-tabset active="active" id="assettabs">
                <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)"
                    disable="tab.canDisable">
                </uib-tab>
            </uib-tabset>
            <div ui-view></div>
        </div>
    </div>
