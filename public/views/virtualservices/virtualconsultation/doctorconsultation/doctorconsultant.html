<link href="app/css/dashboard.css" rel="stylesheet">
<meta charset="UTF-12">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!DOCTYPE html>
<style>
    .col-md-3.col-sm-3 {
        -webkit-transition: .3s ease;
        transition: .5s;
        border: 1px solid #f2f2f2;
        display: inline-block;
        position: relative;
        border-radius: 4px;
        color: rgba(0, 0, 0, .87);
        background: #fff;
        box-shadow: 0 2px 2px 0 rgba(0, 0, 0, .14), 0 3px 1px -2px rgba(0, 0, 0, .2), 0 1px 5px 0 rgba(0, 0, 0, .12);
        margin: 3px;
        border: 1px solid #d2c7c7;
        cursor: pointer;
        width: 18.8%;
        height: 200px;
        min-height: auto;
        padding: 0px;
        margin: 6px;
    }


    img.imagaecare {
        width: 50%;
        margin-left: 0%;
        margin-bottom: 0%;
        margin-top: 0%;
    }

    .imgdiv {
        text-align: center !important;
    }

    span.fontbold {
        font-weight: 600;
    }

    .panel.panel-default {
        width: 114%;
        margin-left: -7%;
    }

    div#cemr_dashboard {
        background: #f3f3f3;
    }

    img.dentist {
        width: 63%;
        margin-bottom: 9px;
        margin-left: 27px;
        margin-top: 8px;
    }

    div#topbacklist .nav-tabs {
        font-size: 13px;
        width: 100%;
        margin: 0 auto;
        border: none;
    }

    .nav-tabs>li>a {
        margin: unset;
        border: unset;
        border-radius: 0;
        padding: unset;
        background: unset;
        color: unset;
        background: unset !important;
        color: unset;
        border-right: unset !important;
        border-width: unset;
        border-radius: unset;
        border-top: unset !important;
        border-left: unset !important;
        border-right: unset !important;
        border-bottom: unset !important;
        border-top-left-radius: unset !important;
        border-top-right-radius: unset !important;
    }

    div#topbacklist .nav-tabs {
        border-bottom: 1px solid #dee2e6;
    }

    div#topbacklist .nav {
        display: flex;
        flex-wrap: wrap;
        padding-left: 0;
        margin-bottom: 0;
        list-style: none;
    }

    div#topbacklist dl,
    ol,
    p,
    ul {
        margin-top: 0;
        margin-bottom: 1rem;
    }

    div#topbacklist .nav-tabs li {
        width: 33%;
        text-align: center;
        position: relative;
        display: flex;
        align-items: center;
    }

    div#topbacklist ol li,
    ul li {
        font-family: 'Open Sans', sans-serif;
    }

    div#topbacklist li {
        list-style: none;
    }

    div#topbacklist .nav-tabs>li>a {
        border: 0;
        background-color: transparent;
    }

    div#topbacklist .chosen-results>li,
    .featured-restaurant-box,
    .gallery-bx>h3,
    .gallery-info-btns,
    .ingradient-list,
    .log-popup,
    .logo,
    .logo>h1 img,
    .news-btns,
    .newsletter-popup-wrapper,
    .owl-dots>div,
    .owl-nav>div,
    .payment-popup-wrapper,
    .popular-dish-thumb>a img,
    .rate-share,
    .rating-box>span,
    .responsive-logomenu>span,
    .responsive-menu,
    .responsive-menu>span,
    .restaurants-wrapper>li,
    .sign-popup,
    .switch-slider,
    .toggle-item,
    .toggle-item>h4,
    .toggle-item>h4 i,
    .topbar,
    .your-order-popup,
    :after,
    :before,
    a,
    button,
    input,
    label,
    nav ul ul,
    nav>div>ul>li,
    nav>div>ul>li span,
    textarea {
        transition: all .3s linear !important;
    }

    div#topbacklist a,
    a:active,
    a:focus,
    a:hover {
        color: inherit;
        outline: 0;
        -webkit-text-decoration: none;
        -ms-text-decoration: none;
        -o-text-decoration: none;
        text-decoration: none;
    }

    div#topbacklist .nav-tabs li .active i {
        background: #ffbe00;
        color: #fff;
        border-color: transparent;
    }

    div#topbacklist .nav-tabs i {
        background: 0 0;
        width: 50px;
        height: 50px;
        border-radius: 100%;
        line-height: 50px;
        text-align: center;
        display: block;
        font-size: 21px;
        margin: 10px auto;
        border: 1px solid #ddd;
    }

    div#topbacklist .fa {
        display: inline-block;
        font: 14px/1 FontAwesome;
        font-size: inherit;
        text-rendering: auto;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    .fa-cutlery:before {
        content: "\f0f0";
    }

    .chosen-results>li,
    .featured-restaurant-box,
    .gallery-bx>h3,
    .gallery-info-btns,
    .ingradient-list,
    .log-popup,
    .logo,
    .logo>h1 img,
    .news-btns,
    .newsletter-popup-wrapper,
    .owl-dots>div,
    .owl-nav>div,
    .payment-popup-wrapper,
    .popular-dish-thumb>a img,
    .rate-share,
    .rating-box>span,
    .responsive-logomenu>span,
    .responsive-menu,
    .responsive-menu>span,
    .restaurants-wrapper>li,
    .sign-popup,
    .switch-slider,
    .toggle-item,
    .toggle-item>h4,
    .toggle-item>h4 i,
    .topbar,
    .your-order-popup,
    :after,
    :before,
    a,
    button,
    input,
    label,
    nav ul ul,
    nav>div>ul>li,
    nav>div>ul>li span,
    textarea {
        transition: all .3s linear !important;
    }

    div#topbacklist .nav-tabs li:not(:first-child):before,
    .nav-tabs li:not(:last-child):after {
        content: "";
        position: relative;
        flex: 1;
        margin: 2.5rem -30px 0;
        ;
        height: 1px;
        background-color: rgba(0, 0, 0, .1);
        top: -12px;
    }

    div#topbacklist .nav-tabs li:not(:first-child):before {
        margin: 2.5rem 102px 0;
    }

    .fa-star:before {
        content: "\f0fa";
    }

    div#topbacklist {
        background: white;
        margin-bottom: 16px;
    }

    li#middletab:after {
        margin: 2.5rem -59px 0 !important;
    }

    li#lasttab:before {
        margin: 2.5rem -16px 0 !important;
    }

    li#middletab a.show {
        left: -233px;
    }

    h3.col-sm-10.header.ng-scope {
        color: black;
    }

    .nav-tabs>li.active>a,
    .nav-tabs>li.active>a:hover {
        font-size: unset;
        border: unset;
        color: unset !important;
        background-color: unset !important;
        height: 36px;
        border-left: unset !important;
        border-right: unset !important;
        border-top-right-radius: unset !important;
        border-top-left-radius: unset !important;
        border-top: unset !important;
        border-bottom: unset !important;
        /* border: 1px solid #3e3737 !important; */
        border-bottom-color: unset !important;
        margin-bottom: unset;
        border-bottom: unset;
    }

    @media screen and (min-width: 300px) and (max-width: 823px) {
        div#cemr_dashboard {
            margin-top: 0px;
        }

        .col-md-3.col-sm-3 {
            width: 32% !important;
        }

        div#cemr_dashboard {
            margin-top: 0px !important;
        }
    }

    @media screen and (min-width: 1200px) {

        .layout-fixed.aside-collapsed .col-md-3.col-sm-3 {
            -webkit-transition: .3s ease;
    transition: .5s;
    border: 1px solid #f2f2f2;
    display: inline-block;
    position: relative;
    border-radius: 4px;
    color: rgba(0, 0, 0, .87);
    background: #fff;
    box-shadow: 0 2px 2px 0 rgba(0, 0, 0, .14), 0 3px 1px -2px rgba(0, 0, 0, .2), 0 1px 5px 0 rgba(0, 0, 0, .12);
    margin: 3px;
    border: 1px solid #d2c7c7;
    cursor: pointer;
    width: 15.5% !important;
    height: 163px;
    min-height: auto;
    padding: 0px;
    margin: 6px;
        }

        .layout-fixed  .col-md-3.col-sm-3 {
            -webkit-transition: .3s ease;
            transition: .5s;
            border: 1px solid #f2f2f2;
            display: inline-block;
            position: relative;
            border-radius: 4px;
            color: rgba(0, 0, 0, .87);
            background: #fff;
            box-shadow: 0 2px 2px 0 rgba(0, 0, 0, .14), 0 3px 1px -2px rgba(0, 0, 0, .2), 0 1px 5px 0 rgba(0, 0, 0, .12);
            margin: 3px;
            border: 1px solid #d2c7c7;
            cursor: pointer;
            width: 18.8% !important;
            height: 180px;
            min-height: auto;
            padding: 0px;
            margin: 6px;
        }

    }

    @media screen and (max-width: 823px) and (min-width: 300px) {
        .col-md-3.col-sm-3 {
            cursor: pointer;
            min-height: 138px;
            font-size: 10px;
            border: 1px solid #d4d0d0;
            width: 31%;
            margin: 4px;
            border-radius: unset !IMPORTANT;
            float: left;
        }
        img.imagaecare {
    width: 50%;
    margin-left: 0%;
    margin-bottom: 0%;
    margin-top: 6%;
}
        div#topnavbut {
            margin-top: 23px;
        }.text-muted {
    color: #164360 !important;
    font-weight: 800 !important;
    margin-top: 3px !important ;
}
    }

    div#cemr_dashboard {
        background: #ffffff !important;
    }

    .text-muted {
        color: #164360 !important;
        font-weight: 800 !important;
    }

    /* span.fontbold {
        font-weight: bolder !important;
        color: #164360 !important;
        font-size: 17px !important;
        font-weight: 800 !important;
    } */

    @media screen and (min-width: 823px) {
        img.imagaecare {
            width: 49%;
            margin-left: 0%;
            margin-bottom: 0%;
            margin-top: 4%;
        }
        .col-md-3.col-sm-3 {
                width: 23% !important;
        }
    }
</style>
<html>
<div id="cemr_dashboard" class="cemrconsaltant" style="width: 100%;">

    <div class="">
        <div class="row">

            <div class="col-xs-12 col-sm-12 col-lg-12" id="topnavbut">
                <div class="col-xs-6 col-sm-8 col-lg-8">
                    <h3 class="text-muted" translate="Select Sub Category"></h3>
                </div>
                <div class="col-xs-6 col-sm-4 col-lg-4">
                    <button class="btn pull-right btn-xs bgportalbk" id="backbut" ng-click="backToList()"
                        uib-tooltip="Back" tooltip-placement="bottom">
                        <i class="fa fa-chevron-circle-left"></i>
                    </button>
                    <button class="btn btn-default portal_btn btn-xs pull-right" id="homebut" ng-click="backToList()"
                        uib-tooltip="Dashboard" tooltip-placement="bottom">
                        <span class="fa fa-home"></span>
                    </button>

                </div>
            </div>
        </div>
    </div>
    <div class="">
        <div class="">
            <div class="col-sm-12">

                <div class="col-md-3 col-sm-3" ng-repeat="items in VirtualSubCategory | filter:{Status:1}">
                    <div style="vertical-align: middle !important;">
                    <div class="imgdiv" ng-click="selectorderInfo(items)">
                        <img class="imagaecare {{items.SubCategoryName}}" ng-show="items.Imagepath"
                            data-ng-src="data:image/png;base64,{{items.Image}}" />
                        <!-- <img class="imagaecare" src="app/img/care img/doctor-consunlant.png"> -->
                        <div class="bot" style="margin-top: 24px ;">
                            <center>
                                <span class="align fontbold">{{items.SubCategoryName}}</span>
                            </center>
                        </div>
                    </div>
                    </div>
                </div>
                <div class="fooder-bgs" style="height: 1%;">
                    <div class="pull-left">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
