<style>
    .col-md-3.col-sm-3 {
        -webkit-transition: .3s ease;
    transition: .5s;
    border: 1px solid #f2f2f2;
    float: left;
    position: relative;
    color: rgba(0, 0, 0, .87);
    background: #fff;
    box-shadow: 0 2px 2px 0 rgba(0, 0, 0, .14), 0 3px 1px -2px rgba(0, 0, 0, .2), 0 1px 5px 0 rgba(0, 0, 0, .12);
    border: 1px solid #d2c7c7;
    cursor: pointer;
    width: 14.8%;
    height: 146px;
    padding: 0px;
    margin: 6px;
    }

    img.imagaecare {
        width: 45%;
        margin-left: 30%;
        margin-bottom: -6%;
        margin-top: 9%;
    }

    span.align {
        margin-left: 24%;
    }

    span.fontbold {
        font-weight: 500;
    }

    .container {
        background: #f3f3f3;
    }

    .panel.panel-default {
        width: 114%;
        margin-left: -7%;
    }

    .content-wrapper.ng-scope.ng-fadeInUp {
        background: white !important;
    }

    img.imagaecar {
        width: 61%;
        margin-left: 18%;
        margin-bottom: -6%;
        margin-top: 9%;
    }

    .col-sm-12.bot {
        margin-top: 20px !important;
    }
    .bot .title{
    font-size: 17px;
    }
    h4.col-sm-12.mt0.ng-scope {
    color: #164360 !important;
    font-weight: 800 !important;
    font-size: 20px !important;
}
    @media screen and (max-width: 823px) and (min-width: 300px) {
        .col-md-3.col-sm-3 {
            cursor: pointer;
            min-height: 104px;
            font-size: 10px;
            border: 1px solid #d4d0d0;
            width: 31%;
        }

        img.imagaecare {
            width: 74%;
        }


    }

    @media screen and (max-width: 823px) and (min-width: 300px) {
        .col-sm-12.bot {
            margin-top: 17% !important;
            padding: 0;
            font-weight: 500;
            font-size: 12px;
            color: #090965;
        }

        div#cemr_dashboard {
            margin-top: 0px;
        }

        .col-sm-12.bot.Medicines {
            margin-top: 9px !IMPORTANT;
        }
    }
</style>
<meta charset="UTF-12">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!DOCTYPE html>
<html>
<div class="">
    <h4 class="col-sm-12 mt0" translate="Manage Orders"></h4>
</div>
<div id="cemr_dashboard" style="width: 100%;height: 100%;">
    <div class="">
        <div class="category">
            <div class="col-sm-12">
               
                <div class="col-md-3 col-sm-3" ng-repeat="items in VirtualCategory | orderBy:'Id' |filter:{Status:1}">
                    <div class="" ng-click="getvirtualsubcategory(items)">
                        <div class="col-sm-12">
                            <img class="imagaecare {{items.CategoryName}}" ng-show="items.Imagepath"
                                data-ng-src="data:image/png;base64,{{items.Image}}" />
                        </div>
                        <div class="col-sm-12 bot {{items.CategoryName}}" style="margin-top: 38px ;"
                            ng-click="checkedinpatients()">
                            <center>
                                <span class="title {{items.CategoryName}}">{{items.CategoryName}}</span>
                            </center>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<div class="fooder-bgs" style="height: 1%;margin-bottom: 0px !important;">
    <div class="pull-left">
    </div>
</div>
