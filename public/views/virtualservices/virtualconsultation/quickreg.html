<link href="app/css/dashboard.css" rel="stylesheet">
<meta charset="UTF-12">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!DOCTYPE html>
<style>
    .col-sm-6.card {
        padding: 8px 0 10px;
        -webkit-transition: .3s ease;
        min-height: 168px;
        transition: .5s;
        border: 1px solid #f2f2f2;
        display: inline-block;
        position: relative;
        width: 58%;
        border-radius: 4px;
        color: rgba(0, 0, 0, .87);
        background: #fff;
        box-shadow: 0 2px 2px 0 rgba(0, 0, 0, .14), 0 3px 1px -2px rgba(0, 0, 0, .2), 0 1px 5px 0 rgba(0, 0, 0, .12);
        margin-left: 16px;
        margin-top: 18px;
        margin-bottom: 20px;
        border: 1px solid #d2c7c7;
        cursor: pointer;
    }

    img.imagaecare {
        width: 216%;
        margin-left: -36%;
        margin-bottom: 7%;
        height: 76px;
    }

    span.align {
        margin-left: 24%;
    }

    span.fontbold {
        font-weight: 500;
    }

    span.col-sm-12.doc {
        color: #393084d1;
        font-size: 19px;
        font-weight: 500;
    }

    span.col-sm-12.exp {
        color: #0f3f79e0;
    }

    span.days {
        font-weight: 700;
        color: #121294c7;
    }

    span.col-sm-12.ava {
        color: #0f3f79e0;
    }

    span.col-sm-12.time {
        color: #0f3f79e0;
    }

    .alignright {
        margin-left: 169% !important;
    }

    del {
        margin-right: 10px;
        color: red;
    }

    .col-sm-12.save {
        margin-left: 163%;
        color: #0f3f79e0;
        font-weight: 500;
        font-size: 17px;
    }

    span.currency {
        color: #0f3f79e0;
        font-weight: 500;
        font-size: 17px;
    }

    .col-md-12.col-sm-12 {
        margin-bottom: 20px;
        border-bottom: 1px solid gainsboro;
        padding: 4px 6px;
        width: 97%;
        margin-left: 2%;
    }

    img.smallicon {
        height: 24px;
        margin-right: 9px;
        margin-left: 12px;
    }

    .appointbtn {
        background-color: #212e80e3 !important;
        border-radius: 7px;
        width: 148px;
        height: 31px;
        float: right;
        color: white;
    }

    .panel.panel-default {
        width: 108%;
        margin-left: -7%;
        height: 62px;
        margin-bottom: -7px;
    }

    button.slotbtn {
        border: 1px;
        padding: 7px 7px;
        background: #217e88ad;
        color: white;
        border-radius: 4px;
        margin-bottom: 14px;
    }

    span.available {
        width: 21px;
        background: #68a7ae;
        height: 8px;
        color: black;
        position: absolute;
        margin-left: -40px !important;
        margin-top: 6px;
    }

    span.booked {
        width: 21px;
        background: #2b4379;
        height: 8px;
        color: black;
        position: absolute;
        margin-left: -40px !important;
        margin-top: 6px;
    }

    button.selectbtn {
        float: right;
        border: 1px;
        background: #f3f3f3;
        padding: 3px 20px;
        border-radius: 6px;
        color: #7d7575;
        border: 1px solid #e6dede;
    }

    span.mrn {
        color: #ca822b;
    }

    span.call {
        color: gray;
        margin-right: 8px;
    }

    span.mrn {
        color: #ca822b;
        margin-right: 2%;
    }

    span.doc {
        color: #004fff;
    }

    img.imagaecare1 {
        width: 150%;
        margin-left: 2%;
        margin-bottom: 7%;
        height: 80px;
        border-radius: 6px;
    }

    input.form-control {
        border-radius: 0px;
        border: 1px solid #bfb7b7;
    }

    .search i {
        position: unset !important;
        margin-left: -41px;
        margin-top: -2px;
        padding: 3px 5px;
        color: #fff;
        transition: 0.3s;
        background: #1919ad;
        border-radius: 7px;
        height: 25px;
    }

    button.newentry {
        border: 1px;
        margin-left: 3%;
        padding: 8px;
        background: #2b6a96;
        color: white;
        border-radius: 5px;
    }

    span.date {
        color: #2b6a96;
        font-size: 16px;
        font-weight: 700;
    }

    .container {
        background: #f3f3f3;
    }

    .form-group.col-sm-12 {
        margin-bottom: 2%;
    }

    img.smallicon {
        border: 1px solid #008fff;
        padding: 3px;
        height: 30px;
    }

    div+p {
        color: red;
    }

    input[type=radio] {
        display: none;
    }

    input[type=radio]+label {
        display: inline-block;
        margin: -2px;
        padding: 4px 12px;
        margin-bottom: 0;
        font-size: 14px;
        line-height: 20px;
        color: #333;
        text-align: center;
        vertical-align: middle;
        cursor: pointer;
        background-color: #f5f5f5;
        background-image: -moz-linear-gradient(top, #fff, #e6e6e6);
        background-image: -webkit-gradient(linear, 0 0, 0 100%, from(#fff), to(#e6e6e6));
        background-image: -webkit-linear-gradient(top, #fff, #e6e6e6);
        background-image: -o-linear-gradient(top, #fff, #e6e6e6);
        background-image: linear-gradient(to bottom, #fff, #e6e6e6);
        background-repeat: repeat-x;
        border: 1px solid #ccc;
        border-color: #e6e6e6 #e6e6e6 #bfbfbf;
        border-color: rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.25);
        border-bottom-color: #b3b3b3;
        filter: progid:DXImageTransform.Microsoft.gradient(startColorstr='#ffffffff', endColorstr='#ffe6e6e6', GradientType=0);
        filter: progid:DXImageTransform.Microsoft.gradient(enabled=false);
        -webkit-box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.05);
        -moz-box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.05);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.05);
        border-radius: 2px;
    }

    input[type=radio]:checked+label {
        background-image: none;
        outline: 0;
        -webkit-box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
        -moz-box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
        background-color: #5fb55c;
        color: white;
    }

    input.form-control.add {
        border: 1px solid #d0c9c9;
        margin-bottom: 11px !important;
        border-radius: 4px;
        height: 36px !important;
        width: 106%;
       
        margin-right: 65% !important;
    }

    img.homeicon {
        height: 17px;
        margin-right: 4%;
        width: 6%;
        margin-top: -8px;
    }

    img.smallicons {
        height: 27px;
    }

    span.hover:hover {
        color: #1e711e;
        font-size: 15px;
        font-weight: 500;
    }

    input.form-control {
        border-radius: 4px !important;
    }

    .panel.panel-default {
        width: 114%;
        margin-left: -7%;
    }

    label.col-sm-12.control-label1.ng-scope {
        font-size: 18px;
    }

    input.form-control2 {
        width: 120%;
        /* margin-right: 7%; */
        border: 1px solid #c1b8b8;
    }

    label.col-sm-12.control-label0.ng-scope {
        font-weight: 600;
        color: #696363;
    }

    .form-group.col-sm-4 {
        margin-bottom: 2%;
    }

    div#cemr_dashboard {
        background: #f3f3f3;
    }
</style>
<html>
<div class="row page-header second_nav">
    <h4 class="col-sm-12 mt0" translate="Quick Registration"></h4>
</div>
<div id="cemr_dashboard" style="width: 100%;">
    <div class="">
        <div class="">
            <div class="col-sm-12">
                <div class="row">
                    <form id="item_form" name="item_form" class="form-horizontal" role="form">
                        <div class="col-sm-6 card">
                            <label class="col-sm-12 control-label1" translate="Registration"></label>
                            <div class="col-sm-12" style=" margin-bottom: 2%; margin-top: 2%;">
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label0" for="tittle" translate="Saluation"
                                        required></label>
                                    <div class="col-sm-12">
                                        <ui-select id="title" ng-model="item.TitleId" name="tittle"
                                            ng-change="fillGenderInfo()" tabindex="tabindexmap.patienttabindex"
                                            required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices
                                                repeat="lookupitem.Id as lookupitem in lookup.Title | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label0" for="patientname"
                                        translate="First Name"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="patientname"
                                            ng-model="item.FirstName" placeholder="" required uppercase>
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label0" for="lastname"
                                        translate="Last Name"></label>
                                    <div class="col-sm-12">
                                        <input type="text" tabindex="3" class="form-control" name="lastname"
                                            ng-model="item.LastName" placeholder="Last Name" required uppercase>
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label0" for="gender" translate="Gender"></label>
                                    <div class="col-sm-12">
                                        <ui-select ng-model="item.GenderId" name="gender" required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices
                                                repeat="lookupitem.Id as lookupitem in lookup.Gender | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label0" translate="Blood Group"></label>
                                    <div class="col-sm-12">
                                        <ui-select ng-model="item.BloodGroupId" tabindex="11">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length > 20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices
                                                repeat="lookupitem.Id as lookupitem in lookup.BloodGroup | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                                                </div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label0" for="age" translate="Date of Birth"></label>
                                    <div class="col-sm-4">
                                        <input type="text" class="form-control2" name="age" ng-model="item.Age"
                                            placeholder="" ng-change="calculateDOB()" required>
                                    </div>
                                    <div class="col-sm-8">
                                        <div class="datepicker">
                                            <input type="text" class="form-control" name="dob" ng-date-object
                                                datepicker-options="datePickerOptions"
                                                show-button-bar="{{datePickerOptions.showButtonBar}}"
                                                uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                                placeholder="{{datePickerOptions.placeholder}}"
                                                ng-click="dobPopup = { opened: true }" is-open="dobPopup.opened"
                                                ng-model="item.DOB" ng-change="calculateAge()"
                                                tabindex="tabindexmap.patienttabindex">
                                            <i class="fa fa-calendar" aria-hidden="true"></i>
                                        </div>
                                    </div>
                                </div>

                            </div>
                            <label class="col-sm-12 control-label1" for="mobile" translate="Contact Details"></label>
                            <div class="col-sm-12" style=" margin-bottom: 2%; margin-top: 2%;">
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label0" for="mobile"
                                        translate="Registered Mobile"></label>
                                    <div class="col-sm-12">
                                        <input type="text" tabindex="14"
                                            ng-keyup="keyPress($event, 0, 'contactnr', 'aadharnr')" class="form-control"
                                            id="contactnr" MINLENGTH="10" MAXLENGTH="10" size="10" value=""
                                            name="mobile" onChange="numberonly($event)" onKeyUp="numberonly($event)"
                                            ng-keypress="numberonly($event)" ng-model="item.Mobile" required>
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label0" for="landline" translate="Home"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" MINLENGTH="10" MAXLENGTH="10" size="10"
                                            name="landline" onChange="numberonly($event)" onKeyUp="numberonly($event)"
                                            ng-keypress="numberonly($event)" ng-model="item.LandLine">
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label0" translate="Registered Email"></label>
                                    <div class="col-sm-12">
                                        <input type="email" class="form-control" name="email" tabindex="-1"
                                            ng-model="item.Email" placeholder="">
                                    </div>
                                </div>
                            </div>
                            <label class="col-sm-12 control-label1" for="contactname"
                                translate="Emergency Contact Details"></label>
                            <div class="col-sm-12" style=" margin-bottom: 2%; margin-top: 2%;">
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label0" for="contactname"
                                        translate="Contact Name"></label>
                                    <div class="col-sm-12">
                                        <input type="text" tabindex="3" class="form-control" name="contactname"
                                            ng-model="item.EmergencyContactName" placeholder="Contact Name" uppercase>
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label0" for="contactnr"
                                        translate="Contact Number"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" MINLENGTH="10" MAXLENGTH="10" size="10"
                                            value="" name="contactnr" onChange="numberonly($event)"
                                            onKeyUp="numberonly($event)" ng-keypress="numberonly($event)"
                                            ng-model="item.EmergencyContactNumber">
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label0" for="relation" translate="Relation"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control2" name="relation"
                                            ng-model="item.Relation" placeholder="">
                                    </div>
                                </div>

                            </div>
                            <label class="col-sm-12 control-label1" for=""
                                translate="Corporate Customer Details"></label>
                            <div class="form-group col-sm-12">
                                <div class="col-sm-12" style="margin-top: 10px;">
                                    <input type="checkbox" class="col-sm-2" ng-model="item.IsCorporateCustomer">
                                    <label class="col-sm-5 control-label0"
                                        translate="Are you a Corporate Customer ?"></label>
                                </div>
                            </div>

                        </div>
                        <div class="col-sm-6 card" style="width: 36%;">
                            <div class="form-group col-sm-12" style="display: flex;">
                                <label class="col-sm-12 control-label" translate="Enter Location"
                                    style="width: 35%;"></label>
                                <div class="col-sm-7" style="width:61%;">
                                    <input type="text" id="googleaddopt" tabindex="17" ng-disabled="disablegoogleaddopt"
                                        class="form-control" gm-places-autocomplete="autocompleteOptions"
                                        ng-model="autocompleteModel" />
                                </div>
                                <div class="col-sm-1 col-md-1 col-lg-1">
                                    <input type="checkbox" name="googleaddressoption" class="custom-checkbox"
                                        tabindex="18" ng-click="enablegoogleaddopt()" ng-model="chkgoogleaddopt">
                                </div>
                            </div>
                            <div class="form-group col-sm-12">
                                <div class="col-sm-12" >
                                    <iframe
                                        src="https://www.google.com/maps/embed?pb=@13.0480438,79.928808,10z/data=!3m1!4b1!4m5!3m4!1s0x3a5265ea4f7d3361:0x6e61a70b6863d433!Chennai,+Tamil+Nadu,+India8m2!3d13.0826802!4d80.2707184?hl=en-US"
                                        width="350" height="250" frameborder="0" style="border:0"
                                        allowfullscreen></iframe>

                                </div>
                                <div class="col-sm-12">
                                    <div class="col-sm-6">
                                        <input type="text" ng-model="item.AddressLine1" class="form-control add"
                                            placeholder="Address">
                                    </div>
                                    <div class="col-sm-6">
                                        <input type="text"  class="form-control add"
                                            ng-model="item.Area" placeholder="Area">
                                    </div>
                                    <div class="col-sm-6">
                                        <input type="text" class="form-control add" ng-model="item.City"
                                            placeholder="City">
                                    </div>
                                    <div class="col-sm-6">
                                        <input type="text"  class="form-control add"
                                            ng-model="item.State" placeholder="State">
                                    </div>
                                    <div class="col-sm-6">
                                        <input type="text" class="form-control add" ng-model="item.Country"
                                            placeholder="Country">
                                    </div>
                                    <div class="col-sm-6">
                                        <input type="text"  class="form-control add"
                                            ng-model="item.Pincode" placeholder="Pincode">
                                    </div>
                                </div>
                                <div class="col-sm-12">
                                    <label class="col-sm-12" style="text-align: center;" translate="Tag As"></label>
                                    <div class="col-sm-12">
                                        <span class="hover" style="margin-right: 22px;">
                                            <img class="homeicon" src="app/img/care img/home.png">Home </span>|
                                        <span class="hover" style="margin-right: 22px;  margin-left: 17px;"> <img
                                                class="smallicons" src="app/img/care img/bag.png">Office</span> |
                                        <span class="hover" style="margin-left: 17px;"> <i
                                                class="fas fa-map-marker-alt"></i>Others </span>
                                    </div>
                                </div>
                                <div class="col-sm-12" style="margin-top: 18px;">
                                    <input type="text"
                                        style="margin-left: 1% !important;width: 97%;"
                                        class="form-control add" placeholder="Home" required>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <div class="fooder-bgs">
                <div class="pull-left">
                    <button class="btn pyr-color10 btn-sm" type="button" ng-click="backToList()">
                        <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                        <span class="btn-fontsize" translate="common.backaction.lbl"></span>
                    </button>
                </div>
                <div class="pull-right">
                    <button class="draftbutton" type="button" ng-click="savePatientInfo()"
                        style="margin-left: -57%; width: 100%;">
                        <strong class="btn-fontsize" translate="Activate"></strong>&nbsp;&nbsp;
                        <!-- <i class="fas fa-shopping-cart"></i> -->
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBVWaKrjvy3MaE7SQ74_uJiULgl1JY0H2s&sensor=false">
</script>
<script src="js/google-map.js"></script>
<link href="https://fonts.googleapis.com/css?family=Work+Sans:100,200,300,400,500,600,700,800,900" rel="stylesheet">
