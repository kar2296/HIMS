<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Manage Virtual Category"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="backToList()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="facility"
                translate="inventory.itemcategory.facilityId.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.FacilityId" name="facility" ng-disabled="item.isDisabled" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="code" translate="Category Code"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="code" ng-model="item.CategoryCode"
                    ng-disabled="item.isDisabled" placeholder="" required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="name" translate="Category Name"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="name" ng-model="item.CategoryName"
                    ng-disabled="item.isDisabled" placeholder="Category Name" required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="inventory.itemcategory.description.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="description" ng-model="item.CategoryDescription"
                    ng-disabled="item.isDisabled" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="type" translate="Consultancy Type"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.ConsultancyTypeId" name="type" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ConsultancyType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                        </div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="inventory.itemcategory.isactive.lbl"></label>
            <div class="col-sm-12">
                <input type="checkbox" class="custom-checkbox" name="isactive" ng-model="item.IsActive"
                    ng-checked="item.IsActive == 1">
            </div>
        </div>
        <div class="col-sm-12">
            <img class="item-logo-img" ng-show="!!currentcontext.file" ngf-thumbnail="currentcontext.file" />
            <img class="item-logo-img" ng-show="!currentcontext.file && item.Imagepath"
                data-ng-src="data:image/png;base64,{{currentcontext.Image}}" />
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="appmanager.dept.logo.lbl"></label>
            <div class="col-sm-12">
                <input style="border: 0; background: 0; border-radius: 0;" type="file" ngf-select
                    ng-model="currentcontext.file" name="file" ngf-max-size="200MB" />
            </div>
        </div>
        <div class="">
            <!-- <button type="button" class="btn btn-sm pyr-color10" ng-click="backToList()"><i class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button> -->
            <div class="pull-right">
                <button type="button" class="draftbutton" ng-click="save()"
                    translate="common.saveaction.lbl"></button>
                <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                    ng-click="saveandApprove()"></button>
            </div>
        </div>
    </form>
</div>
