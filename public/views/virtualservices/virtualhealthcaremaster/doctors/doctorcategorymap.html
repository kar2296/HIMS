<style>
    /* .ui-select-multiple {
        height: 150px !important;
    } */
    .ui-select-multiple.ui-select-bootstrap input.ui-select-search {
        border: none !important;
    }
</style>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="form-group">
                <label class="col-sm-2 control-label" translate="virtualhealth.doctors.categorymap.lbl"></label>
                <div class="col-sm-6">
                    <ui-select multiple ng-model="item.map" class="ui-select-multiple" ng-map-control
                        pivot-prop="UserId" map-prop="CategoryId" pivot-prop-val="{{currentcontext.id}}">
                        <ui-select-match>{{$item.Text}}</ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.VirtualCategory | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="fooder-bgs">
                <div class="pull-left">
                    <button type="button" class="btn btn-sm pyr-color10" ng-click="backToList()"><i
                            class="fa fa-angle-left"></i>&nbsp;&nbsp;<span
                            translate="common.backaction.lbl"></span></button>
                </div>
                <div class="pull-right">
                    <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                        ng-click="saveItem()"></button>
                </div>
            </div>
        </form>
    </div>
</div>
