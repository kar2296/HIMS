<link href="app/css/billing-pharmacy-customs.css" rel="stylesheet">
<div class="row">
    <button class="btn-add" ng-click="addNew()" uib-tooltip="{{'Traffic Details' | translate }}"
        tooltip-placement="bottom">
        <i class="fa fa-plus" aria-hidden="true"></i>
    </button>
</div>
<div class="row">

    <table class="table table-hover table-responsive table-bordered">
        <thead class="bg-subhead">
            <tr>
                <th class="col-sm-2">
                    <span translate="clinicalmaster.serviceitemtariffdetail-list.type.lbl"></span>
                    <span class="mandatory-asterix">*</span>
                </th>
                <th class="col-sm-2">
                    <span for="rate" translate="clinicalmaster.serviceitemtariffdetail-list.rate.lbl"></span>
                    <span class="mandatory-asterix">*</span>
                </th>
                <th class="col-sm-1">
                    <span translate="clinicalmaster.serviceitemtariffdetail-list.doctor.lbl"></span>
                </th>
                <th class="col-sm-1"><span translate="virtualhealth.docconsult.discountmode.lbl"></span></th>
                <th class="col-sm-2"><span translate="virtualhealth.docconsult.discount.lbl"></span></th>
                <th class="col-sm-1">
                    <span translate="clinicalmaster.serviceitemtariffdetail-list.active.lbl"></span>
                </th>
                <th class="col-sm-1">
                    <span translate="common.actions_col.lbl"></span>
                </th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="item in vm.items | filter:{Status:1}">
                <td>
                    <ui-select ng-if="item.Id > 0" ng-disabled="item.Id > 0" ng-model="item.ServiceRateCategoryId"
                        class="ui-select-grid">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.ServiceRateCategory | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                    <ui-select ng-if="item.Id == 0" ng-model="item.ServiceRateCategoryId" class="ui-select-grid">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in item.ServiceRtCat | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </td>
                <td align="center">
                    <input type="text" class="form-control" name="rate" ng-model="item.Rate" placeholder=""
                        ng-pattern="/^\d+$/" ng-keypress="numberonly($event)" required>
                </td>
                <td>
                    <input type="text" class="form-control" ng-model="item.DoctorShare" placeholder="">
                </td>
                <td>
                    <ui-select ng-model="item.DiscountModeId" class="ui-select-grid">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.DiscountMode | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </td>
                <td>
                    <input type="text" class="form-control" ng-model="item.Discount" placeholder="">
                </td>
                <td align="center">
                    <input type="checkbox" class="custom-checkbox" ng-model="item.StatusId">
                </td>
                <td align="center">
                    <button type="button" class="drhms-edit-button" ng-click="deleteItem($index,item)">
                        <img src="assets/svg/delete.svg" alt="">
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="pull-left">
            <button type="button" class="pull-left btn btn-sm pyr-color10" ng-click="backToList()">
                <i class="fa fa-angle-left"></i>&nbsp;&nbsp;
                <span translate="common.backaction.lbl"></span>
            </button>
        </div>
        <div class="pull-right">
            <button id="btnSaveForm" type="button" class="draftbutton" translate="common.saveaction.lbl"
                ng-click="saveItem()"></button>
        </div>
    </div>
</div>
