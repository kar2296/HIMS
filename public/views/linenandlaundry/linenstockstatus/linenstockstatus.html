<div class="row page-header">
    <h4 class="mt0 col-sm-6" translate="linenandlaundry.linenstockstatus.pagetitle.lbl"></h4>
    <div class="col-sm-6 text-right">
        <span>
            <span ng-click="linendashboard()" ng-hide="context == 'emr'">
                <img src="app/img/icons/laundry.png" class="img-responsive emr-drdashicon" alt="home" uib-tooltip="{{'Linen Dashboard'| translate}} "
                    tooltip-placement="bottom">
            </span>
        </span>
    </div>
</div>
<div class="row filter-area">
    <div class="col-sm-12">
        <div class="col-sm-3">
            <label class="col-sm-4 control-label filter-lbl" translate="linenandlaundry.linenstockstatus.department.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.DepartmentId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-5 control-label filter-lbl" translate="linenandlaundry.linenstockstatus.itemname.lbl"></label>
            <div class="col-sm-7">
                <autosearch itemid="currentfilter.LinenItemMasterId" iteminfo="" rowdata="" config="vm.linenitemmastercontrolconfig" itemchange="getList()"
                    on-enter="getList()"></autosearch>
            </div>
        </div>
    </div>
</div>
<div id="im_stkstshg">
    <div class="container-fluid im_linenstockstatus" id="linenstockstatus">
        <div ui-grid="vm.gridConfig" class="table-uigrid custom_grid "></div>
        <div class=" col-sm-12 footerbar pd0">
            <div class="col-sm-12 well total_footer">

                <div class="col-sm-9 ">
                </div>
                <div class="col-sm-3 ">
                    <div class="col-sm-6 text-right">
                        <label class="control-label" for="totalquantity">Total Quantity</label>
                    </div>
                    <div class="col-sm-6">
                        <input type="text" class="form-control" name="totalquantity" ng-model="TotalQuantity" placeholder="0.00" id="disabledInput"
                            disabled>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="fooder-bg custom_stock_footer">
    <div class=" col-sm-12">
        <div class=" col-sm-11">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
        <!-- <div class=" col-sm-1">
            <button type="button"   class="pull-right btn btn-inverse btn-sm" translate="common.printaction.lbl" ng-click="print()"></button>
        </div> -->
    </div>
</div>
