<div class="row page-header">

        </div>

            <span>
                <!-- <span ng-click="OTdashboard()" ng-hide="context == 'emr'">
                    <img src="app/img/icons/laundry.png" class="img-responsive emr-drdashicon" alt="home" uib-tooltip="{{'otrequest-list.OTdashboard.lbl'| translate}} "

                    </span> -->

            </span>
        </div>
    </div>
</div>
<div class="row filter-area">
    <table id="bannerdetails">
        <tbody>
            <tr>
<td>
    <label class="control-label" for="stockingpoint" translate="linenandlaundry.dhobiissuebook.stockingpoint1.lbl"></label>
</td>
<td>
    <ui-select ng-model="currentfilter.FromDepartmentId" ng-change="getList()" name="stockingpoint">
        <ui-select-match>
            {{$select.selected.Text | limitTo : 20 : 0}}
            <span ng-if="$select.selected.Text.length>20">...</span>
        </ui-select-match>
        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
        </ui-select-choices>
    </ui-select>
</td>
<td>
    <label class="control-label" for="transactionno" translate="linenandlaundry.dhobiissuebook.issueno.lbl"></label>
</td>
<td>
    <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.LinenStockTransferNo" translate translate-attr-placeholder="linenandlaundry.dhobiissuebook.issueno.lbl">
</td>
            </tr>
            <tr>
                <td>
                    <label class="control-label" for="diposeddate" translate="linenandlaundry.dhobiissuebook.date.lbl"></label>
                </td>
                <td>
                    <input type="text" class="form-control" name="diposeddate" ng-date-object datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                    ng-click="expirydatePopup = { opened: true }" is-open="expirydatePopup.opened" ng-model="currentfilter.LinenStockTransferDate"
                    ng-change="getList()">
                </td>
                <td>
                    <label class="control-label" for="status" translate="linenandlaundry.dhobiissuebook.status.lbl"></label>
                </td>
                <td>
                    <ui-select ng-model="currentfilter.LinenStockTransferStatusId" ng-change="getList()" name="status">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.LinenStockTransferStatus | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </td>
            </tr>
        </tbody>
    </table>
   
</div>
