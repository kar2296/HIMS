<style>
    .dash_icons {
        position: relative;
        top: 6px;
        width: 80px;
        text-align: center;
        margin: 0px auto;
        height: 75px;
    }

    .whitebox {
        margin: 2.4px;
        background-color: #fff;
        text-align: center;
        padding: 10px;
        margin: 25px 15px 1px 15px;
        border-radius: 2px;
        min-height: auto;
        box-shadow: -2px 0px 10px #332d2da3;
        color: #747474;
        font-size: 14px;
    }

    .dashboard-div a {
        color: #fff;
        text-decoration: none;
    }

    #cemr_dashboard h4 {
        font-style: oblique;
        clear: both;
        display: inline-block;
        color: #0a5bb3f5;
        white-space: nowrap;
        overflow: hidden;
    }

    .layout-fixed .wrapper {
        height: 98vh;
        overflow: scroll;
        overflow-x: hidden;
    }

    .patientname {
        color: #000;
    }

    .emr-patientsdetails {
        font-size: 15px;
        margin-bottom: 3px;
        font-weight: 600;
    }

    .bg-round p {
        bottom: 50px;
        position: absolute;
        right: -22px;
        width: 100%;
    }

    @media (max-width:800px) {
        .dash_icons {
            height: 70px;
            padding: 0px;
        }
    }

    .layout-fixed .wrapper>section {
        background: #fff;
    }
</style>
<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-xs-8 col-sm-8 col-md-8">
            <h4 class="page-header mt0">Linen Dashboard</h4>
        </div>
        <div class="col-xs-4 col-sm-4 col-md-4 emr_dicon text-right">
        </div>
    </div>
</div>
<div id="emrdashboard" data-spy="scroll" data-target=".navbar" data-offset="50">
    <div class="container-fluid" id="cemr_dashboard">
        <div class="col-sm-12 col-md-12 col-lg-12 clearfix">
            <div class="col-xs-5 col-sm-3 col-lg-2 whitebox clearfix" ng-click="linenstockentry()">
                <div class="col-sm-12 bg-round  pull-right">
                    <img class="img-responsive dash_icons" src="app/img/clinical/registration.png">
                    <p class="col-xs-2 col-sm-2 h3 text-right mg0 ng-binding">{{Items.StockEntryCount}}</p>
                </div>
                <h4 class="smfont">Linen Stock Entry</h4>
            </div>
            <div class="col-xs-5 col-sm-3 col-lg-2 whitebox clearfix">
                <div class="col-sm-12 bg-round  pull-right" ng-click="dhobiissuebook()">
                    <img class="img-responsive dash_icons" src="app/img/clinical/stockindent.png">
                    <p class="col-xs-2 col-sm-2 h3 text-right mg0 ng-binding">{{Items.IssueBookCount}}</p>
                </div>
                <h4 class="smfont">Dhobi Issue Book</h4>
            </div>
            <div class="col-xs-5 col-sm-3 col-lg-2 whitebox clearfix">
                <div class="col-sm-12 bg-round  pull-right" ng-click="dhobireceipt()">
                    <img class="img-responsive dash_icons" src="app/img/clinical/stockissue.png">
                    <p class="col-xs-2 col-sm-2 h3 text-right mg0 ng-binding">{{Items.ReceiptCount}}</p>
                </div>
                <h4 class="smfont">Dhobi Receipt</h4>
            </div>
            <div class="col-xs-5 col-sm-3 col-lg-2 whitebox clearfix" ng-click="linenstockstatus()">
                <div class="col-sm-12 bg-round  pull-right">
                    <img class="img-responsive dash_icons" src="app/img/clinical/worklist.png">
                    <p class="col-xs-2 col-sm-2 h3 text-right mg0 ng-binding">{{Items.StatusCount}}</p>
                </div>
                <h4 class="smfont">Linen Stock Status</h4>
            </div>
        </div>
    </div>
</div>
<div class="fooder-bg cfooter">
    <div class="row">
    </div>
</div>

</html>
