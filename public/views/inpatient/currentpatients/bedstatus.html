<link rel="stylesheet" href="app/css/drhms.css">
<style>
    #banner td, th {
    padding: 4px;
}
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Bed Status">
        </h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <table id="bannerdetails">
            <thead>
                <th class="" style="width: 300px;">
                    <span translate="Bed Occupancy"></span>
                </th>
                <th class="cus-col tbl-header tab2">
                    <span translate="dashboard.available.lbl"></span>
                </th>
                <th class="cus-col tbl-header tab2">
                    <span translate="dashboard.occupied.lbl"></span>
                </th>
                <th class="cus-col tbl-header tab2">
                    <span translate="dashboard.other.lbl"></span>
                </th>
                <th class="cus-col tbl-header tab2">
                    <span translate="Total"></span>
                </th>
            </thead>
            <tbody>
                <tr ng-repeat="ward in Wards">
                    <td class="cus-col tbl-header"><span>{{ward.WardName}}</span></td>
                    <td>{{ward.AvailableBeds}}</td>
                    <td>{{ward.OccupiedBeds}}</td>
                    <td>{{ward.OtherBeds}}</td>
                    <td>{{ward.BedsCount}}</td>
                </tr>
                <!-- <tr ng-repeat="ward in Wards">
                        <td class="cus-col tbl-header"><span>{{ward.WardName}}</span></td>
                        <td>{{ward.BedsCount}}</td>
                        <td>{{ward.OccupiedBeds}}</td>
                        <td>{{ward.AvailableBeds}}</td>
                        <td>{{ward.OtherBeds}}</td>
                    </tr> -->
                <tr ng-if="Wards.length>0" class="totalcolor">
                    <td class="cus-col tbl-header cust_total0 ">
                        <span><strong>Total</strong></span>
                    </td>
                    <td class="cus-col tbl-header cust_total0 ">
                        <strong>{{wardtotal.AvailableBeds}}</strong>
                    </td>
                    <td class="cus-col tbl-header cust_total0 ">
                        <strong>{{wardtotal.OccupiedBeds}}</strong>
                    </td>
                    <td class="cus-col tbl-header cust_total0 ">
                        <strong>{{wardtotal.OtherBeds}}</strong>
                    </td>
                    <td class="cus-col tbl-header cust_total0 ">
                        <strong>{{wardtotal.BedsCount}}</strong>
                    </td>
                </tr>
                <tr ng-if="Wards.length==0">
                    <td colspan="5">No Data Available</td>
                </tr>
            </tbody>
        </table>
    </form>
</div>
