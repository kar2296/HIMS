<style>
    .custom-modal-header h4 { margin:4px 0px; font-size: 14px;}
</style>
<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="mlc-form.Investigation Handling Officer's Details.lbl"></h4>
</div>

<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
            <div>
                <div class="">
                    <div class="panel-heading">&nbsp;</div>
                    <div class="panel-body form-panel">
                        <div class="col-sm-12">
                            <div class="well">
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="officername" translate="mlc-list.officername1.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="officername" ng-model="item.OfficerName" placeholder="" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="designation" translate="mlc-list.designation.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="designation" ng-model="item.Designation" placeholder="">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="contactnumber" translate="mlc-list.contactnumber1.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="contactnumber" ng-model="item.ContactNo" placeholder="" ng-minlength="10" ng-pattern="/^\d+$/" required>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="panel-footer formactionbar">

                <div class="pull-right">
                    <button type="submit" class="draftbutton" translate="common.saveaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
