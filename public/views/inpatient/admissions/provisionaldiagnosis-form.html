<style>
    .panel-body {
        padding: 15px;
        margin-left: 0px;
        margin-top: -26px;
        margin-right: 0px;
        margin-bottom: 0px;
        background-image: url(app/img/bg-body.jpg);
        background-repeat: repeat;
        overflow: auto;
    }

    .well {
        min-height: 20px;
        padding: 19px;
        margin-bottom: 0px;
        border: 1px solid #ededed;
        border-radius: 4px;
        background: rgb(233, 246, 253);
        /* Old browsers */
        background: -moz-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* FF3.6-15 */
        background: -webkit-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, rgb(250, 250, 250) 0%, rgb(247, 252, 253) 100%);
        /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid: DXImageTransform.Microsoft.gradient(startColorstr='#e9f6fd', endColorstr='#d3eefb', GradientType=0);
        /* IE6-9 */
        box-shadow: 4px 2px 13px -7px rgba(0, 0, 0, 0.75);
    }

    .formactionbar {
        padding: 5px 15px;
        height: 40px;
        background-color: #ccecf5;
    }

    .custom-modal-header {
        margin-bottom: 10px;
        background-color: #597a9a;
        color: #fff;
    }

    .modal-content {
        -webkit-box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        box-shadow: -1px 3px 20px 7px rgba(249, 244, 244, 0.5);
    }

    .padding1 {
        padding: 13px;
    }

    .modal-header {
        padding: 4px 10px;
        border-bottom: 1px solid #e5e5e5;
    }
</style>
<!--<ul class="breadcrumb">
    <li><a ng-click="backToList()" translate="referredby-form-form.parentpagetitle.lbl"></a></li>
    <li class="active" translate="referredby-form-form.pagetitle.lbl"></li>
</ul>	-->
<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="diagnosis-form.pagetitle.lbl"></h4>
</div>

<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
            <div>
                <div class="panel panel-default">
                    <div class="panel-heading"></div>
                    <div class="panel-body form-panel">
                        <div class="col-sm-12">
                            <!-- leftpanel -->
                            <div class="col-sm-6">
                                <div class="col-sm-12 well">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="codescheme"
                                            translate="diagnosis-form.codescheme.lbl"></label>
                                        <div class="col-sm-8">
                                            <ui-select ng-model="item.DiagnosisCodeSchemeId" name="codescheme"
                                                ng-change="fillMasterInfo($select.selected)">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices
                                                    repeat="lookupitem.Id as lookupitem in lookup.DiagnosisCodeScheme | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                                                    </div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="code"
                                            translate="diagnosis-form.code.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="code" ng-model="item.Code"
                                                placeholder="" required>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="name"
                                            translate="diagnosis-form.name.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="name"
                                                ng-model="item.DiagnosisName" placeholder="" required>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="description"
                                            translate="diagnosis-form.description.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="description"
                                                ng-model="item.Description" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="version"
                                            translate="diagnosis-form.version.lbl"></label>
                                        <div class="col-sm-8">
                                            <ui-select ng-model="item.DiagnosisVersionId" name="version">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices
                                                    repeat="lookupitem.Id as lookupitem in lookup.DiagnosisVersion | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                                                    </div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="coderegion"
                                            translate="diagnosis-form.coderegion.lbl"></label>
                                        <div class="col-sm-8">
                                            <ui-select ng-model="item.CodeRegionId" name="coderegion">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices
                                                    repeat="lookupitem.Id as lookupitem in lookup.CodeRegion | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                                                    </div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="speciality"
                                            translate="diagnosis-form.speciality.lbl"></label>
                                        <div class="col-sm-8">
                                            <ui-select multiple ng-model="item.Speciality" name="speciality"
                                                class="ui-select-multiple" ng-multi-tag>
                                                <ui-select-match>{{$item.Text }}</ui-select-match>
                                                <ui-select-choices
                                                    repeat="lookupitem.Id as lookupitem in lookup.Speciality | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                                                    </div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>


                                </div>
                            </div>

                            <!-- rightpanel -->
                            <div class="col-sm-6 ">
                                <div class="col-sm-12 well ">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="synonym"
                                            translate="diagnosis-form.synonym.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="synonym"
                                                ng-model="item.Synonym" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="referrencelink"
                                            translate="diagnosis-form.referrencelink.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="referrencelink"
                                                ng-model="item.ReferrenceLink" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="lengthofstay"
                                            translate="diagnosis-form.lengthofstay.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="lengthofstay"
                                                ng-model="item.LengthOfStay" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="bodysite"
                                            translate="diagnosis-form.bodysite.lbl"></label>
                                        <div class="col-sm-8">
                                            <ui-select multiple ng-model="item.BodySite" name="bodysite"
                                                class="ui-select-multiple" ng-multi-tag>
                                                <ui-select-match>{{$item.Text }}</ui-select-match>
                                                <ui-select-choices
                                                    repeat="lookupitem.Id as lookupitem in lookup.BodySite | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                                                    </div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <div class="col-sm-6">
                                            <label class="col-sm-9 control-label" for="isactive"
                                                translate="diagnosis-form.isactive.lbl"></label>
                                            <div class="col-sm-2">
                                                <input type="checkbox" name="isactive" class="custom-checkbox"
                                                    ng-model="item.IsActive">
                                            </div>
                                        </div>
                                        <div class="col-sm-6">
                                            <label class="col-sm-9 control-label" for="isnotifibale"
                                                translate="diagnosis-form.isnotifiable.lbl"></label>
                                            <div class="col-sm-2">
                                                <input type="checkbox" name="isnotifibale" class="custom-checkbox"
                                                    ng-model="item.IsNotifibale">
                                            </div>
                                        </div>

                                    </div>
                                    <div class="form-group">

                                        <div class="col-sm-6">
                                            <label class="col-sm-9 control-label" for="issensitive"
                                                translate="diagnosis-form.issensitive.lbl"></label>
                                            <div class="col-sm-2">
                                                <input type="checkbox" name="issensitive" class="custom-checkbox"
                                                    ng-model="item.IsSensitive">
                                            </div>
                                        </div>
                                        <div class="col-sm-6">
                                            <label class="col-sm-9 control-label" for="isbillable"
                                                translate="diagnosis-form.isbillable.lbl"></label>
                                            <div class="col-sm-2">
                                                <input type="checkbox" name="isbillable" class="custom-checkbox"
                                                    ng-model="item.IsBillable">
                                            </div>
                                        </div>

                                    </div>
                                    <div class="form-group padding1">

                                    </div>




                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
            <div class="panel-footer formactionbar">

                <div class="pull-right">
                    <button type="submit" class="btn btn-primary btn-sm" translate="common.saveaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()"
                        translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
