<style>
    .form-group {
        height: 72px;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="clinicalmaster.diagnosis-form.pnldiagnosis.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="codescheme"
                translate="clinicalmaster.diagnosis-form.codescheme.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.DiagnosisCodeSchemeId" name="codescheme">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.DiagnosisCodeScheme | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="code"
                translate="clinicalmaster.diagnosis-form.code.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="code" ng-model="item.Code" placeholder="" required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="name"
                translate="clinicalmaster.diagnosis-form.name.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="name" ng-model="item.DiagnosisName" placeholder=""
                    required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="description"
                translate="clinicalmaster.diagnosis-form.description.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="description" ng-model="item.Description" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="lengthofstay"
                translate="clinicalmaster.diagnosis-form.lengthofstay.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="lengthofstay" ng-model="item.LengthOfStay" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <div class="col-sm-12">
                <label class="col-sm-10 control-label" for="isactive"
                    translate="clinicalmaster.diagnosis-form.isactive.lbl"></label>
                <div class="col-sm-12">
                    <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
                </div>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="bodysite"
                translate="clinicalmaster.diagnosis-form.bodysite.lbl"></label>
            <div class="col-sm-12">
                <ui-select multiple ng-model="item.BodySite" name="bodysite" class="ui-select-multiple" ng-multi-tag>
                    <ui-select-match>{{$item.Text }}</ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.BodySite | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="clinicalmaster.diagnosis-form.comments.lbl"></label>
            <div class="col-sm-12">
                <textarea rows="3" name="comments" ng-model="item.Comments" maxlength="4000" style="width:100%;"
                    class="notes-textarea"></textarea>
            </div>
        </div>
    </form>
    <!--<button class="btn btn-sm pyr-color10" ng-click="backToList()"><i class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button>-->
</div>
<div class="row">
    <div class="pull-right">
        <button type="button" class="draftbutton" ng-click="save()"
            translate="common.saveaction.lbl"></button>
        <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
            ng-click="saveAndApprove()"></button>
        <!-- <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                <button id="btnCancelForm" type="button" class="draftbutton" ng-click="cancelCallback()" translate="common.cancelaction.lbl"></button> -->
    </div>
</div>
