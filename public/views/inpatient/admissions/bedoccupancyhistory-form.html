<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Tariff Details"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="col-sm-4 form-group">
                <label class="col-sm-12 control-label" for="" translate="Tariff Type"></label>
                <div class="col-sm-12">
                    <ui-select ng-model="item.ServiceRateCategoryId" ng-disabled="item.isFrom">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.ServiceRateCategory | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="col-sm-4 form-group">
                <label class="col-sm-12 control-label" for="" translate="admission.billstart.lbl"></label>
                <div class="col-sm-12">
                    <div class="datepicker" id="datepicker">
                        <input type="text" class="form-control" name="startdateDate" ng-date-object
                            datetime-picker="{{dateTimePickerOptions.dateTimeFormat}}"
                            placeholder="{{datePickerOptions.placeholder}}" ng-click="startdatePopup = { opened: true }"
                            is-open="startdatePopup.opened" ng-change="checkstartdate(item)"
                            ng-model="item.BillingStartDate" required>
                        <i class="fa fa-calendar"></i>
                    </div>
                </div>
            </div>
            <div class="col-sm-4 form-group">
                <label class="col-sm-12 control-label" for="contactnumber" translate="admission.billend.lbl"></label>
                <div class="col-sm-12">
                    <div class="datepicker" id="datepicker">
                        <input type="text" class="form-control" name="enddateDate" ng-date-object
                            datetime-picker="{{dateTimePickerOptions.dateTimeFormat}}"
                            placeholder="{{datePickerOptions.placeholder}}" ng-click="enddatePopup = { opened: true }"
                            is-open="enddatePopup.opened" ng-change="checkenddate(item)" ng-model="item.BillingEndDate"
                            required>
                        <i class="fa fa-calendar"></i>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="">
        <div class="pull-right">
            <button style="margin-top: 10px;" type="submit" class="draftbutton" ng-click="saveItem()" translate="Update"></button>
        </div>
    </div>
</div>
