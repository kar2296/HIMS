<div class="modal-header custom-modal-header">
    <div class="col-sm-6">
        <h4 class="modal-title custom-modal-title" translate="Comments"></h4>
    </div>
    <div class="col-sm-6">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-4 form-group">
            <label class="col-sm-12" translate="Comments Type"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.CommentsTypeId" name="cmnttype" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.CommentsType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12" translate="billing.billlock.comments.lbl"></label>
            <div class="col-sm-12">
                <textarea rows="3" name="" ng-model="item.Comments" maxlength="4000" style="width: 100%;height: 7vh;"
                    class="notes-textarea"></textarea>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <button type="button" style="margin-top: 30px;" class="draftbutton" translate="Save"
                ng-click="saveItem()"></button>
        </div>
    </form>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
