<style>
    .modal-content .panel-body {
        overflow: auto;
    }
</style>
<div class="col-sm-12 custom-modal-header">
    <div class="col-sm-6">
        <h4 translate="bedcharges.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-6">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>

</div>

<div class="row">
    <div class="col-sm-12">
        <label class="control-label col-sm-4" translate="bedcharges.roomdetails.lbl"></label>
        <span class="col-sm-8"> :
            {{BedInfo.WardMaster.WardName}}/{{BedInfo.WardRoomMaster.RoomNo}}/{{BedInfo.BedNo}}</span>
    </div>
    <div class="col-sm-12">
        <div class="panel-body">
            <table class="table table-hover table-responsive table-bordered" style="margin-left: 1px;">
                <thead class="bg-subhead">
                    <tr>
                        <th style="width: 50%;"><span translate="bedcharges.associateservice.lbl"></span> </th>
                        <th><span translate="bedcharges.optariff.lbl"></span> </th>
                        <th><span translate="bedcharges.iptariff.lbl"></span> </th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="item in BedInfo.ServiceItemCharges">
                        <td><span>{{item.ServiceName}}</span></td>
                        <td ng-repeat="tariff in item.TariffDetails">{{tariff.Rate |displaycurrency}}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
