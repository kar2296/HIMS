<style>
    .panel-body {
        padding: 15px;
        margin-left: 0px;
        margin-top: -26px;
        margin-right: 0px;
        margin-bottom: 0px;
        background-image: url(app/img/bg-body.jpg);
        background-repeat: repeat;
        overflow: auto;
    }

    .padding {
        padding: 5px;
    }

    .well {
        min-height: 20px;
        padding: 19px;
        margin-bottom: 0px;
        border: 1px solid #ededed;
        border-radius: 4px;
        background: rgb(233, 246, 253);
        /* Old browsers */
        background: -moz-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* FF3.6-15 */
        background: -webkit-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, rgb(250, 250, 250) 0%, rgb(247, 252, 253) 100%);
        /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid: DXImageTransform.Microsoft.gradient( startColorstr='#e9f6fd', endColorstr='#d3eefb', GradientType=0);
        /* IE6-9 */
        box-shadow: 4px 2px 13px -7px rgba(0, 0, 0, 0.75);
    }

    .formactionbar {
        padding: 5px 15px;
        height: 40px;
        background-color: #ccecf5;
    }

    .custom-modal-header {
        margin-bottom: 10px;
        background-color: #597a9a;
        color: #fff;
    }

    .modal-content {
        -webkit-box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        box-shadow: -1px 3px 20px 7px rgba(249, 244, 244, 0.5);
    }

    .modal-header {
        padding: 4px 10px;
        border-bottom: 1px solid #e5e5e5;
    }
</style>
<!--<ul class="breadcrumb">
    <li><a ng-click="backToList()" translate="guarantor-form-form.parentpagetitle.lbl"></a></li>
    <li class="active" translate="guarantor-form-form.pagetitle.lbl"></li>
</ul>	-->
<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="guarantor-form.pagetitle.lbl"></h4>
</div>

<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
            <div>
                <div class="panel panel-default">
                    <div class="panel-heading"></div>
                    <div class="panel-body form-panel">
                        <div class="col-sm-12">
                            <!-- leftpanel -->
                            <div class="col-sm-6">
                                <div class="col-sm-12 well">

                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="facility" translate="generalmaster.wardmaster-form.facility.lbl"></label>
                                        <div class="col-sm-8">
                                            <ui-select ng-disabled="true" ng-model="item.FacilityId" name="facility" required>
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="code" translate="guarantor-form.code.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="code" ng-model="item.Code" placeholder="" required>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="guarantorname" translate="guarantor-form.guarantorname.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="guarantorname" ng-model="item.GuarantorName" placeholder="" required>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="guarantortype" translate="guarantor-form.guarantortype.lbl"></label>
                                        <div class="col-sm-8">
                                            <ui-select ng-model="item.GuarantorTypeId" name="guarantortype" required>
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.GuarantorType | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="creditlimit" translate="guarantor-form.creditlimit.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="creditlimit" ng-model="item.CreditLimit" placeholder="" required>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="availablelimit" translate="guarantor-form.availablelimit.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="availablelimit" ng-model="item.AvailableLimit" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="contractdate" translate="guarantor-form.contractdate.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="contractdate" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                                placeholder="{{datePickerOptions.placeholder}}" ng-click="contractdatePopup = { opened: true }"
                                                is-open="contractdatePopup.opened" ng-model="item.ContractDate" required>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="contractexpirydate" translate="guarantor-form.contractexpirydate.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="contractexpirydate" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                                placeholder="{{datePickerOptions.placeholder}}" ng-click="contractexpirydatePopup = { opened: true }"
                                                is-open="contractexpirydatePopup.opened" ng-model="item.ContractExpiryDate" required>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="tpaname" translate="guarantor-form.tpaname.lbl"></label>
                                        <div class="col-sm-8">
                                            <ui-select ng-model="item.TPAId" name="tpaname">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.TPA | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="serviceratecategory" translate="guarantor-form.serviceratecategory.lbl"></label>
                                        <div class="col-sm-8">
                                            <ui-select ng-model="item.ServiceRateCategoryId" name="serviceratecategory" required>
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ServiceRateCategory | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="clienttype" translate="guarantor-form.clienttype.lbl"></label>
                                        <div class="col-sm-8">
                                            <ui-select ng-model="item.GuarantorClientTypeId" name="clienttype">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.GuarantorClientType | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="phone" translate="guarantor-form.phone.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="mobile" ng-model="item.Mobile" placeholder="" ng-minlength="10" ng-pattern="/^\d+$/"
                                                required> </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="IsAllFacility" translate="IsAllFacility"></label>
                                        <div class="col-sm-8">
                                            <input type="checkbox" name="IsAllFacility" class="custom-checkbox" ng-model="item.IsAllFacility">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="isactive" translate="guarantor-form.isactive.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
                                        </div>
                                    </div>


                                </div>
                            </div>

                            <!-- rightpanel -->
                            <div class="col-sm-6 ">
                                <div class="col-sm-12 well ">
                                    <address addressline1="item.AddressLine1" addressline2="item.AddressLine2" pincodeid="item.PinCodeId" pincode="item.Pincode"
                                        area="item.Area" city="item.City" cityid="item.CityId" state="item.State" stateid="item.StateId"
                                        country="item.Country" countryid="item.CountryId"></address>



                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="email" translate="guarantor-form.email.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="email" class="form-control" name="email" ng-model="item.Email" placeholder="" ng-required="false">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="businessdevelopmentmanager" translate="guarantor-form.businessdevelopmentmanager.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="businessdevelopmentmanager" ng-model="item.BusinessDevelopmentManager" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="creditaccountno" translate="guarantor-form.creditaccountno.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="creditaccountno" ng-model="item.CreditAccountNo" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="debitaccountno" translate="guarantor-form.debitaccountno.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="debitaccountno" ng-model="item.DebitAccountNo" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group padding">
                                    </div>


                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
            <div class="panel-footer formactionbar">

                <div class="pull-right">
                    <button type="submit" class="btn btn-primary btn-sm" translate="common.saveaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
