<link href="app/css/dashboard.css" rel="stylesheet">
<meta charset="UTF-12">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!DOCTYPE html>
<html>
<div class="col-sm-12 page-header">
    <h4 class="col-sm-12 mt0" translate="Cathlab Dashboard"></h4>
</div>
<div id="cemr_dashboard" style="width: 100%;">
    <!-- <div class=""> -->
    <div class="">
        <div class="col-sm-12">
            <div class="card-flex-box-appointment">
                <div class="card-box-item box-bg-color1" 
                    ng-if="HasAccess('SurgeryDashboard', 'SurgerySchedule')">
                    <div class="card-box-header"><i class="fa fa-calendar"></i>
                        <div translate="Today Scheduled"></div>
                    </div>
                    <div>{{Items.TodayScheduleCount}}</div>
                </div>
                <div class="card-box-item box-bg-color3"
                    ng-if="HasAccess('SurgeryDashboard', 'OT_Procedure_Entries')">
                    <div class="card-box-header">
                        <div><i class="fas fa-file-invoice"></i></div>
                        <div translate="Today Cathlab Entries"></div>
                    </div>
                    <div>{{Items.TodayEntriesCount}}</div>
                </div>
                <!-- <div>{{Items.dischargedcount}}</div> -->
                <div class="card-box-item box-bg-color7" ng-click="cathlabreports()"
                    ng-if="HasAccess('CathLabDashboard', 'Report')">
                    <div class="card-box-header">
                        <div><i class="fa fa-file-text-o"></i></div>
                        <div translate="surgeryschedule-list.report.lbl"></div>
                    </div>
                </div>
                <!-- <div>{{Items.dischargedcount}}</div> -->
            </div>
        </div>
    </div>
</div>
<div class="col-sm-12">
    <div class="col-sm-6">
        <table id="bannerdetails" style="margin-bottom: 12px; margin-top: 20px;background: #5d9cec;">
            <tr>
                <td style="color: #fff;">
                    <span translate="Today CathLab Scheduled"></span>
                </td>
            </tr>
        </table>
        <table id="bannerdetails" style="background: antiquewhite;">
            <tr ng-repeat="item in todaysurgeryData| limitTo: 6">
                <td style="border: 1px solid white !important;"><strong>{{item.patientname}} |</strong>
                    {{item.warddetails}} | {{item.doctorname}} | {{item.ProcedureName}} | {{item.OTRoomName}}
                </td>
            </tr>
        </table>

    </div>
    <div class="col-sm-6">
        <table id="bannerdetails" style="margin-bottom: 12px; margin-top: 20px;background: #5d9cec;">
            <tr>
                <td style="color: #fff;"><span translate="Today Completed CathLab"></span></td>
            </tr>
        </table>
        <table id="bannerdetails" style="background: antiquewhite;">
            <tr ng-repeat="item in todaysurgerycompletedData| limitTo: 6">
                <td style="border: 1px solid white !important;"><strong>{{item.patientname}} |</strong>
                    {{item.warddetails}} | {{item.doctorname}} | {{item.ProcedureName}} | {{item.OTRoomName}}
                </td>
            </tr>
        </table>
    </div>
    <div class="fooder-bgs">
        <div class="row ">
            <div class="col-sm-12">
                <div class="pull-left">
                </div>
            </div>
        </div>
    </div>
</div>
<!-- </div> -->


</html>
