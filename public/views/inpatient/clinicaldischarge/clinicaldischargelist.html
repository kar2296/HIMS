<link rel="stylesheet" href="app/css/drhms.css">
<style>
    .grid {
        width: 500px;
        height: 200px;
    }

    .green {
        background-color: #2dff07;
        color: #006400;
    }

    .ui-grid-cell-contents.billing-list-icon.ng-scope {
        display: flex;
    }

    .blue {
        background-color: #1fe0f0;
        color: #153ff0;
    }

    custom-table .ui-grid-cell-contents {
        white-space: normal;
    }

    .d-flex-items {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        margin: 13px 0;
    }

    .d-flex-item {
        box-shadow: rgba(0, 0, 0, 0.16) 0px 1px 4px;
        width: 12%;
        padding: 8px;
        border-radius: 0px;
        background: #fdfdfd;
    }

    .d-flex-item-box {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        position: relative;
    }

    p.Title-name {
        font-size: 12px;
        font-weight: 600;
    }

    .icons i {
        color: #fff;
        padding: 8px;
        border-radius: 0px;
        position: absolute;
        right: 0;
        bottom: 8px;
    }

    p.count {
        font-weight: 700;
        font-size: 14px;
    }

    .item1 {
        color: #5d9cec;
    }

    .item2 {
        color: #ff902c;
    }

    .item3 {
        color: #B97C3B;
    }

    .item4 {
        color: #5EBE28;
    }

    .item5 {
        color: #e91e63;
    }

    .item6 {
        color: #8c5be4;
    }

    .item7 {
        color: #e84646;
    }


    .item1 i {
        background: #5d9cec;
    }

    .item2 i {
        background: #ff902c;
    }

    .item3 i {
        background: #B97C3B;
    }

    .item4 i {
        background: #5EBE28;
    }

    .item5 i {
        background: #e91e63cc;
    }

    .item6 i {
        background: #8c5be4e8;
    }

    .item7 i {
        background: #e84646;
    }

    .active {
        background-color: #75efff59;
    }

    span.user-icon i {
        box-shadow: rgba(0, 0, 0, 0.16) 0px 1px 4px;
        padding: 10px;
        border-radius: 50px;
        border: 2px solid #dc7e9e;
        font-size: 14px;
    }

    .patient-name {
        color: #E91E63;
        font-weight: 500 !important;
    }

    span.lable-name {
        color: #000;
        font-weight: 500;
    }

    .doctor-icon {
        color: #00125a;
        font-weight: 600 !important;
    }

    .action-button a {
        padding-right: 30px;
        font-size: 16px;
    }

    .inpatient-table-list {
        box-shadow: rgba(0, 0, 0, .25) 0px 1px 2px;
        border: 1px solid #cccccc4a;
    }

    tr.inpatient-table-list td {
        border: unset !important;
    }

    .pager-div {
        text-align: left;
    }

    .table>tbody>tr>td {
        white-space: normal;
    }
</style>
<div class="row">
    <div class="drhms-header-name" translate="Clinical Discharge Patient list"></div>
</div>
<div class="row">
    <table id="bannerdetails">
        <tr>
            <td translate="reports.fromdate.lbl"></td>
            <td>
                <div class="datepicker">
                    <input type="text" class="form-control" name="from" datepicker-options="datePickerOptions"
                        show-button-bar="{{datePickerOptions.showButtonBar}}" ng-change="getList()"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                        is-open="fromdatePopup.opened" ng-model="currentfilter.admissiondateFromAdm">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </td>
            <td translate="reports.todate.lbl"></td>
            <td>
                <div class="datepicker">
                    <input type="text" class="form-control" name="from" datepicker-options="datePickerOptions"
                        show-button-bar="{{datePickerOptions.showButtonBar}}" ng-change="getList()"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}" 
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
                        is-open="todatePopup.opened" ng-model="currentfilter.admissiondateToAdm">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
            </td>
        </tr>
    </table>
</div>

<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
