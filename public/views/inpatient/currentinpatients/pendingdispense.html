<style>
.patientprofile-img {width : 70px !important; height : 70px !important;}

    min-height: 18px;
    color: #fff;
    background: -moz-linear-gradient(top,#fff 0,#f3f3f3 50%,#ededed 100%,#fff 100%);
    -moz-box-shadow: 7px 5px 15px -9px rgba(0,0,0,.75);
    box-shadow: 7px 5px 15px -9px rgba(0,0,0,.75);
    background: url(app/img/header-bg.jpg) repeat-x left top;
}
.ui-grid-viewport { height: 190px!important;}
.table-uigrid { height: 198px !important;}
.custom-modal-header {padding:0px 7px !important;}

.custom-modal-header h4 { margin:4px 0px; font-size: 14px;}
.panel-body .well { padding: 0px 19px !important;}
.panel {margin-bottom: 0;}

{

}}

<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
   <div class="row">
        <div class="col-sm-12">
            <!--<div class="col-sm-4">
            <h4 class=" mt0 " translate="admissionrequest.pagetitle.lbl"></h4>
        </div>-->
         
            <div class="col-sm-8">
                    <h4 class="col-sm-12 active mt0">
                            <span ng-module="currentcontext.patinfo"  class="forpadd">
                             <span>{{Patient.Title.Description}} {{Patient.FirstName}}</span> |
                            <span>{{Patient.MRN}} </span> |
                            <span> {{Patient.Gender.Description}}</span> |
                            <span> {{Patient.Age}}  Years </span> |
                            <span>{{Patient.DOB | date : 'dd/MMM/yyyy' }} </span>

                             </span>
                            </span>
                        </h4>
                        </div>
                    <div class="col-sm-4">
                            <button type="button" class="btn btn-danger btn-sm pull-right" translate="x"
                            ng-click="cancelCallback()"></button>
                            </div>
                </div>
        </div>
    </div>

</div>
