<style>
    .form-horizontal .form-group {
        height: 62px;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" ng-module="currentcontext.patinfo"> <span class="forpadd">
                <span>{{Patient.Title.Description}} {{Patient.FirstName}}</span> |
                <span>{{Patient.MRN}} </span> |
                <span> {{Patient.Gender.Description}}</span> |
                <span> {{Patient.Age}} Years </span> |
                <span>{{Patient.DOB | date : 'dd/MMM/yyyy' }} </span>
                <span ng-click="patientprofiledetails()"><i class="fas fa-info-circle"></i>
                </span>
            </span></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <h4 class="header" translate="Dischage Advice">
    </h4>
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-3">
            <label class="col-sm-12 control-label" for="facility"
                translate="currentinpatient.dischargetype.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.DischargeTypeId" name="facility">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.DischargeType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-3">
            <label class="col-sm-12 control-label" for="encountertype"
                translate="currentinpatient.tentativedischargedate.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="transferredon" ng-date-object
                    datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="transationfromPopup = { opened: true }"
                    is-open="transationfromPopup.opened" ng-model="item.Tentativedischargedate">

            </div>
        </div>

        <div class="form-group col-sm-3">
            <label class="col-sm-12 control-label" for="primarycategory"
                translate="currentinpatient.advicedby.lbl"></label>
            <div class="col-sm-12">
                <autosearch itemid="item.DoctorId" iteminfo="" rowdata="" IsRequired="true"
                    config="vm.doctorcontrolconfig" itemchange="doctorChange()"></autosearch>
            </div>
        </div>
        <div class="form-group col-sm-3">
            <label class="col-sm-12 control-label" for="primarycategory"
                translate="currentinpatient.clinicalstatus.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.ClicalDischargeId" name="primarycategory">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ClinicalStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-3">
            <label class="col-sm-12 control-label" for="comments" translate="currentinpatient.comments.lbl"></label>
            <div class="col-sm-12">
                <textarea rows="3" name="comments" ng-disabled="item.isRequested" ng-model="item.Comments"
                    maxlength="4000" style="width:100%;" class="notes-textarea"></textarea>
            </div>
        </div>
        <div class="form-group col-sm-3" ng-if="item.DischargeTypeId == 2">
            <label class="col-sm-12 control-label" for="death"
                translate="Death Date"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="death" ng-date-object
                    datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="transationfromPopupdeath = { opened: true }"
                    is-open="transationfromPopupdeath.opened" ng-model="item.DeathDate" required>
            </div>
        </div>
        <div class="form-group col-sm-3" ng-if="item.DischargeTypeId == 2">
            <label class="col-sm-12 control-label" for="isDeathConfirmed" translate="Is Death Confirmed"></label>
            <div class="col-sm-12">
                <input type="checkbox" name="isDeathConfirmed" class="custom-checkbox" ng-model="item.IsDeathConfirmed" required>
            </div>
        </div>
        <div class="form-group col-sm-3" ng-if="item.DischargeTypeId == 2">
            <label class="col-sm-12 control-label" for="dethcomm" translate="Death Comments"></label>
            <div class="col-sm-12">
                <input type="text" name="dethcomm" class="form-control" ng-model="item.DeathComments">
            </div>
        </div>
    </form>
</div>
<div class="">
    <div class="row">
        <div class="pull-right">
            <button type="button" class="draftbutton" ng-click="save()">Save</button>
        </div>
    </div>
</div>
