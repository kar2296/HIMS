<div class="row">
    <patientbanner patientid="item.PatientId"></patientbanner>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group finalize col-sm-4">
            <label class="col-sm-12 control-label" for="doctorid"
                translate="currentinpatient.dischargedoctor.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.DoctorId" ng-change="doctorChange($select.selected)" name="doctorid"
                    ng-disabled="true" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Doctor | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group finalize col-sm-4">
            <label class="col-sm-12 control-label" for="isdefault"
                translate="currentinpatient.clinicalstatus.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.Clicaldischargeid" name="primarycategory">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ClinicalStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group finalize col-sm-4">
            <label class="col-sm-12 control-label" for="comments" translate="currentinpatient.comments.lbl"></label>
            <div class="col-sm-12">
                <textarea rows="3" name="comments" ng-disabled="item.isRequested" ng-model="item.Comments"
                    maxlength="4000" style="width:100%;" class="notes-textarea"></textarea>
            </div>
        </div>
        <div class="form-group finalize col-sm-4">
            <label class="col-sm-12 control-label" for="facility"
                translate="currentinpatient.dischargetype.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.Dischargetypeid" name="facility">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.DischargeType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group finalize col-sm-4">
            <label class="col-sm-12 control-label" for="dischargedate" translate="Discharge Date & Time"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="dischargedate" ng-date-object
                    datetime-picker="{{datePickerOptions.datetimeFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="dischargedatePopup = { opened: true }"
                    is-open="dischargedatePopup.opened" ng-model="item.DischargeDate">
            </div>
        </div>
        <div class="form-group finalize col-sm-4" ng-show="item.DischargeTypeId==2">
            <label class="col-sm-12 control-label" translate="Death Date"></label>
            <div class="col-sm-12">
                <displaydate date-val="item.DeathDate"></displaydate>
            </div>
        </div>
        <div>
            <button type="button" class="btn deceased-color btn-sm" translate="common.deseased-actions.lbl"
                ng-show="item.DischargeTypeId==2" ng-click="recordDeathInfo()"></button>
        </div>
    </form>
</div>
<div class="row">
    <div class="pull-right">
        <button type="button" class="draftbutton" ng-click="save()">Save</button>
    </div>
</div>
