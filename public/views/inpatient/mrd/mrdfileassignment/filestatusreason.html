<style>
    .modal-dialog.modal-lg {
        width: 38%;
    }

    .modal-content .panel-body {
        height: 123px;
        overflow: inherit;
    }
</style>
<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" ng-if="currentcontext.statusid==7" translate="filestatus.misremarks.lbl"></h4>
    <h4 class="modal-title custom-modal-title" ng-if="currentcontext.statusid==8" translate="filestatus.damageremarks.lbl"></h4>
</div>
<div class="">
    <patientbanner patientid="currentcontext.pid"></patientbanner>
</div>
<div class="row">
    <div class="col-sm-12" style="margin-top: 10px;">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="panel-body form-panel outer_border">
                <div class="panel panel-default">
                    <div class="col-sm-12" style="margin-top:22px;" ng-if="currentcontext.statusid==7">
                        <label class="col-sm-4 control-label" translate="filestatus.misremarks.lbl"></label>
                        <div class="col-sm-5">
                            <textarea rows="3" name="reason" ng-model="item.MisplacedReason" maxlength="4000" style="width:150%;"></textarea>
                        </div>
                    </div>
                    <div class="col-sm-12" style="margin-top:22px;" ng-if="currentcontext.statusid==8">
                        <label class="col-sm-4 control-label" translate="filestatus.damageremarks.lbl"></label>
                        <div class="col-sm-5">
                            <textarea rows="3" name="reason" ng-model="item.DamagedReason" maxlength="4000" style="width:150%;"></textarea>
                        </div>
                    </div>
                </div>
            </div>

        </form>
    </div>
</div>
<div class="panel-footer formactionbar">
    <div class="pull-left">
        <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="ReverseFileStatus()" translate="Reverse Status"></button>
    </div>
    <div class="pull-right">
        <button type="button" class="draftbutton" ng-click="UpdateFileStatus()" translate="UpdateFileStatus"></button>
    </div>
</div>
