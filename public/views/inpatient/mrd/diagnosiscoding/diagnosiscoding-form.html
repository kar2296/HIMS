<style>
    .modal-content .panel-body {
        overflow: inherit;
    }
    
    .formRoot {
        overflow: inherit;
    }
    
    .custom-modal-header {
        padding: 0px 7px !important;
    }
    
    .custom-modal-header {
        padding: 0px 11px;
    }
    
    .custom-modal-header h4 {
        margin: 4px 0px;
        font-size: 14px;
    }
    
    .top {
        margin: 4px !important;
    }
    
    .autosearch-div>input {
        background: url(app/img/patterns-bg/search.png) 102.2% center no-repeat #fff;
        background-size: 15.7%!important;
        z-index: 777777;
    }
    
    table > tbody > tr > td {
        vertical-align: initial !important;
    }
    
    .custom-popup-wrapper > .table > thead > tr > td:nth-child(3) {
        width: 32% !important;
    }
    
    .custom-popup-wrapper > .table > tbody > tr > td:nth-child(3) > span {
        width: 30% !important;
        position: absolute;
        text-overflow: ellipsis;
        overflow: hidden;
        white-space: nowrap;
    }
    
    .custom-popup-wrapper>table>tbody>tr:nth-child(even) {
        background-color: #fff;
    }
    
    .table-condensed>thead>tr>td {
        padding: 1px 10px;
        white-space: nowrap;
    }
    
    .autosearch-div>input {
        background: url(app/img/patterns-bg/search.png) 102.2% center no-repeat #fff;
        background-size: 15.7%!important;
        z-index: 777777;
    }
    
    table > tbody > tr > td {
        vertical-align: initial !important;
    }
    
    .custom-popup-wrapper > .table > thead > tr > td:nth-child(3) {
        width: 32% !important;
    }
    
    .custom-popup-wrapper > .table > tbody > tr > td:nth-child(3) > span {
        width: 30% !important;
        position: absolute;
        text-overflow: ellipsis;
        overflow: hidden;
        white-space: nowrap;
    }
    
    .custom-popup-wrapper>table>tbody>tr:nth-child(even) {
        background-color: #fff;
    }
    
    .table-condensed>thead>tr>td {
        padding: 1px 0px;
        white-space: nowrap;
    }
    
    .autosearch-div .custom-popup-wrapper {
        position: absolute;
        width: 222% !important;
    }
    
    .custom-popup-wrapper > .table > thead > tr > td:nth-child(3) {
        width: 8% !important;
    }
    
    .custom-popup-wrapper > .table > thead > tr > td:nth-child(4) {
        width: 12% !important;
    }
    .form-group {
        margin: 0px !important;
        height: 70px;
    }
</style>
<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="patientemr.patientcondition-form.pagetitle.lbl"></h4>
</div>
 <div class="col-sm-12">
            <patientbanner patientid="currentcontext.pid"></patientbanner>
        </div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
            <div class="formRoot">
                <div class="panel-body form-panel">
                    <div class="col-sm-12">
                        <!-- leftpanel -->
                        <div class="col-sm-6">
                            <div class="well">
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="conditiontype" translate="mrd.type.lbl"></label>
                                    <div class="col-sm-8">
                                        <ui-select ng-model="item.ConditionTypeId" name="conditiontype" required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ConditionType | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="condition" translate="mrd.condition.lbl"></label>
                                    <div class="col-sm-8">
                                         <autosearch itemid="item.DiagnosisId" iteminfo="item.selectedItem" rowdata="" name="'condition'" config="vm.diagnosiscontrolconfig" itemchange="getDiagnosis()" ng-change="fillMasterInfo($select.selected)" isrequired="true"></autosearch>
                                        <!--<ui-select ng-model="item.DiagnosisId" ng-disabled="item.isRequested" name="diagnosis" ng-change="fillMasterInfo($select.selected)"
                                            required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}({{$select.selected.Code | limitTo : 20 : 0}})
                                                <span ng-if="$select.selected.Text($select.selected.Code).length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Diagnosis | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                <div ng-bind-html="lookupitem.Code | highlight: $select.search"></div>
                                            </ui-select-choices>
                                            </ui-select>-->
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="code" translate="mrd.code.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="code" ng-model="item.Code" placeholder="" disabled>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="description" translate="mrd.description.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="description" ng-model="item.Description" placeholder="" disabled>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="conditiondate" translate="mrd.conditiondate.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="conditiondate" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                            placeholder="{{datePickerOptions.placeholder}}" ng-click="conditiondatePopup = { opened: true }"
                                            is-open="conditiondatePopup.opened" ng-model="item.Date" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="conditionstatus" translate="mrd.status.lbl"></label>
                                    <div class="col-sm-8">
                                        <ui-select ng-model="item.ConditionStatusId" name="conditionstatus">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ConditionStatus | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="sameaddress" translate="mrd.primary.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="checkbox" name="" class="custom-checkbox" ng-model="item.IsPrimary">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="comments" translate="mrd.comments.lbl"></label>
                                    <div class="col-sm-8">
                                        <commentscontrol comments="item.Comments"></commentscontrol>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- rightpanel -->
                        <div class="col-sm-6">
                        </div>
                    </div>
                </div>
            </div>
            <div class="panel-footer formactionbar">
                <div class="pull-right">
                    <button type="submit" class="draftbutton" translate="common.saveaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
