<style>
    autosearch.logo .custom-popup-wrapper {
        margin-left: -200px;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Diagnosis Codification"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <patientbanner patientid="item.PatientId"></patientbanner>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-3" ng-if="currentcontext.EncType == 2">
            <label class="col-sm-12 control-label" for="facility"
                translate="currentinpatient.dischargetype.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.DischargeTypeId" name="facility">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.DischargeType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-3">
            <label class="col-sm-12 control-label" for="primarycategory"
                translate="currentinpatient.advicedby.lbl"></label>
            <div class="col-sm-12">
                <autosearch itemid="item.DoctorId" iteminfo="" rowdata="" config="vm.doctorcontrolconfig"
                    itemchange="doctorChange()"></autosearch>
            </div>
        </div>
        <div class="form-group col-sm-3">
            <label class="col-sm-12 control-label" for="diagnosis" translate="mrd.diagnosis.lbl"></label>
            <div class="col-sm-12">
                <autosearch itemid="item.DiagnosisId" iteminfo="item.selectedItem" rowdata=""
                    config="vm.diagnosiscontrolconfig" itemchange="getDiagnosis()"
                    ng-change="fillMasterInfo($select.selected)"></autosearch>
            </div>
        </div>
        <div class="form-group col-sm-3">
            <label class="col-sm-12 control-label" for="diagnosis" translate="mrd.secdiagnosis.lbl"></label>
            <div class="col-sm-12">
                <autosearch itemid="item.Diagnosis2Id" iteminfo="item.selectedItem" rowdata=""
                    config="vm.diagnosiscontrolconfig" itemchange="getDiagnosis()"
                    ng-change="fillMasterInfo($select.selected)"></autosearch>
            </div>
        </div>
        <div class="form-group col-sm-3">
            <label class="col-sm-12 control-label" for="diagnosis" translate="mrd.thirddiagnosis.lbl"></label>
            <div class="col-sm-12">
                <autosearch class="logo" itemid="item.Diagnosis3Id" iteminfo="item.selectedItem" rowdata=""
                    config="vm.diagnosiscontrolconfig" itemchange="getDiagnosis()"
                    ng-change="fillMasterInfo($select.selected)"></autosearch>
            </div>
        </div>
        <div class="form-group col-sm-3">
            <label class="col-sm-12 control-label" translate="admission.otherdiagnosis.lbl"></label>
            <div class="col-sm-12 filter-lbl">
                <input type="text" class="form-control" name="otherdiagnosis" ng-model="item.OtherDiagnosis"
                    placeholder="" tabindex="-1">
            </div>
        </div>
        <div class="form-group col-sm-3" ng-if="currentcontext.EncType == 2">
            <label class="col-sm-12 control-label" for="primarycategory"
                translate="currentinpatient.clinicalstatus.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.ClicalDischargeId" name="primarycategory">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ClinicalStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-3">
            <label class="col-sm-12 control-label" for="diagnosis" translate="CPT"></label>
            <div class="col-sm-12">
                <autosearch class="logo" itemid="item.CPTDiagnosisId" iteminfo="item.selectedItem" rowdata=""
                    config="vm.ctpdiagnosiscontrolconfig" itemchange="getDiagnosis()"
                    ng-change="fillMasterInfo($select.selected)"></autosearch>
            </div>
        </div>
        <div class="form-group col-sm-3" ng-if="currentcontext.EncType == 2">
            <label class="col-sm-12 control-label" for="comments" translate="currentinpatient.comments.lbl"></label>
            <div class="col-sm-12">
                <textarea rows="3" name="comments" ng-disabled="item.isRequested" ng-model="item.Comments"
                    maxlength="4000" style="width:100%;" class="notes-textarea"></textarea>
            </div>
        </div>
    </form>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="pull-right">
            <button type="button" class="draftbutton" ng-click="saveItem()">Save</button>
            <!-- <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button> -->
        </div>
    </div>
</div>
