<style>
    #opbillingcontrol .formRoot {
        min-height: 397px !important;
    }

    .filter-area {
        margin-top: 5px;
    }

    .mt0 {
        margin-top: 0px !important;
        font-size: initial !important;
    }

    .table>tbody>tr>td {
        vertical-align: middle !important;
    }
    td.col-sm-2.ng-scope{
        color: #000;
    }
</style>
<link href="app/css/billing-pharmacy-customs.css" rel="stylesheet">
<div id="opbillingcontrol">
    <div class="row page-header">
        <div class="col-sm-12">
            <h4 class="mt0 col-sm-6" translate="dummyvisit.pagetitle.lbl"></h4>
        </div>
    </div>
    <div class="row">
        <div class="col-sm-12">
            <uib-tabset active="active">
                <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)" disable="tab.canDisable">
                </uib-tab>
            </uib-tabset>
            <div ui-view></div>
        </div>
    </div>
</div>
