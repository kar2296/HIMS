<style>
    #opbillingcontrol .formRoot {
        min-height: 397px !important;
    }

    .filter-area {
        margin-top: 5px;
    }

    .mt0 {
        margin-top: 0px !important;
        font-size: initial !important;
    }

    .table>tbody>tr>td {
        vertical-align: middle !important;
    }

    td.col-sm-2.ng-scope {
        color: #000;
    }

    .ui-select-bootstrap .ui-select-match-text span {
        width: 100% !important;
        overflow: hidden !important;
    }
</style>
<link href="app/css/billing-pharmacy-customs.css" rel="stylesheet">
<div id="opbillingcontrol">
    <div class="row filter-area">
        <div class="col-sm-12">
            <div class="col-sm-3">
                <label class="col-sm-5 col-md-4 control-label filter-lbl"
                    translate="dummyvisit.filter_date.lbl"></label>
                <div class="col-sm-7 col-md-8">
                    <input type="text" class="form-control" name="datetime" datepicker-options="datePickerOptions"
                        show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="billdatetimePopup = { opened: true }"
                        is-open="billdatetimePopup.opened" ng-model="currentcontext.AdmissionDate">
                </div>
            </div>
            <div class="col-sm-3">
                <label class="col-sm-5 col-md-4 control-label filter-lbl"
                    translate="dummyvisit.filter_transdate.lbl"></label>
                <div class="col-sm-7 col-md-8">
                    <input type="text" class="form-control" name="datetime" datepicker-options="datePickerOptions"
                        show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="transdatetimePopup = { opened: true }"
                        is-open="transdatetimePopup.opened" ng-model="currentcontext.TransactionDate">
                </div>
            </div>
            <div class="col-sm-3">
                <label class="col-sm-4 col-md-5 control-label filter-lbl"
                    translate="dummyvisit.filter_type.lbl"></label>
                <div class="col-sm-8 col-md-7">
                    <ui-select ng-model="currentcontext.TypeId" class="filter-combo">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 15 : 0}}
                            <span ng-if="$select.selected.Text.length > 15">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.Type | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="col-sm-3">
                <label class="col-sm-5 col-md-4 control-label filter-lbl" translate=""></label>
                <div class="col-sm-7 col-md-8">
                    <button type="button" class="draftbutton" style="margin-right:3px;"
                        ng-click="getList()" translate="dietmultipleorders.load_filter.lbl"></button>
                </div>
            </div>
        </div>

    </div>
    <div class="bg-pattern">
        <div class="table-height formRoot" id="mainresponsivetablecontrol" style="margin-left:10px;">

            <div class="col-sm-12">
                <div class="col-sm-6">
                    <table class="table table-responsive table-bordered table-hover">
                        <thead class="bg-subhead">
                            <tr>
                                <th class="col-sm-1"><span translate=""></span></th>
                                <th class="col-sm-3"><span translate="dummyvisit.ipno.lbl"></span></th>
                                <th class="col-sm-4"><span translate="dummyvisit.patientname.lbl"></span></th>
                                <th class="col-sm-4"><span translate="dummyvisit.ward.lbl"></span></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr ng-repeat="enc in Encounter">
                                <td class="col-sm-1">
                                    <input type="checkbox" tabindex="-1" name="type" class="custom-checkbox"
                                        ng-model="enc.Status" tabindex="-1" />
                                </td>
                                <td>
                                    {{enc.VisitIdentifier}}
                                </td>
                                <td>
                                    {{enc.Patient.MRN}} / {{enc.Patient.Title.Description}} {{enc.Patient.FirstName}}
                                </td>
                                <td>
                                    {{enc.WardMaster.WardName}}
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="col-sm-3 row">
                    <div class="col-sm-12">
                        <autosearch itemid="item.TestId" name="'test'" controlid="item.itemidxdesc"
                            iteminfo="item.SelectedItem" rowdata="item" config="vm.testcontrolconfig"
                            itemchange="testChanged($index,item)" class="inputsearchlogo" candisable="IsDisabled"
                            isrequired="true" tabindex="item.tabindex"></autosearch>
                    </div>
                    <div class="col-sm-12">
                        <table class="table table-responsive table-bordered table-hover">
                            <thead class="bg-subhead">
                                <tr>
                                    <th colspan="2" class="col-sm-4"><span
                                            translate="dummyvisit.investigation.lbl"></span></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="inv in Investigation | filter: { Status : 1 } ">
                                    <td>
                                        {{inv.Description}}
                                    </td>
                                    <td>
                                        <button type="button" class="btn btn-danger btn-xs" tabindex="-1"
                                            ng-click="deleteInvestigation($index,inv)">
                                            <i class="fa fa-trash" aria-hidden="true"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="col-sm-3">
                    <table class="table table-responsive table-bordered table-hover">
                        <thead class="bg-subhead">
                            <tr>
                                <th class="col-sm-3"><span translate="dummyvisit.subdepartment.lbl"></span></th>
                                <th class="col-sm-3"><span translate="dummyvisit.actual.lbl"></span></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr ng-repeat="sdept in SubDepartment">
                                <td>
                                    {{sdept.DepartmentName}}
                                </td>
                                <td>
                                    {{sdept.FreeCount}}
                                </td>
                            </tr>
                            <tr>
                                <td> Total :
                                </td>
                                <td>
                                    {{TotalFreeCount}}
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>


        </div>
    </div>
</div>

<div class="container-fluid onerow-filter">
    <div class="filter fooder-bg">
        <div class="row">
            <div class="col-sm-12">
                <div class="pull-left">
                    <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()"> <i
                            class="fa fa-angle-left" aria-hidden="true"></i><strong class="btn-fontsize"> &nbsp;
                            Back</strong></button>
                </div>
                <div class="pull-right">
                    <button id="btnSaveApprove" type="button" class="btn dem-color4 text-white btn-sm"
                        translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                    <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clearItem()"
                        translate="common.clearaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()"
                        translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </div>
    </div>
</div>
