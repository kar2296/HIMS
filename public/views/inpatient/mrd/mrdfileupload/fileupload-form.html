<style>
    .form-horizontal .form-group {
        height: 62px;
    }

    patientsearch.logo .custom-popup-wrapper {
        margin-left: -200px;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="patientemr.mrdfilesdownloadupload.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>
<div class="col-sm-4" style="float: right;">
    <!-- <patientsearch class="logo" ng-disabled="item.isAdmitted" name="txtpatientsearch" patientinfo="selectedPatient"
        patientchange="patientChange()" tabindex="tabindexmap.patienttabindex" filterconfig="patientfilterconfig"
        required></patientsearch> -->
    <patientsearch controlid="'pid'" ng-keyup="moveHeaderFocus('pid')" patientid="item.PatientId" class="col-sm-8 logo"
        name="txtpatientsearch" patientinfo="selectedPatient" patientchange="patientChange()" tabindex="tabindexmap.patienttabindex"
        isdisabled="" filterconfig="patientfilterconfig"></patientsearch>
</div>
<div class="col-sm-12">
    <patientbanner patientid="currentcontext.pid"></patientbanner>
</div>
<div class="col-sm-12">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="visitidentifier" translate="patientemr.mrdfilesdownloadupload.visitidentifier.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="visitidentifier" ng-model="item.VisitIdentifier" placeholder="{{ 'patientemr.mrdfilesdownloadupload.visitidentifier.lbl' | translate }}">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="enctype" translate="patientemr.mrdfilesdownloadupload.encountertype.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.EncounterTypeId" name="enctype" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.EncounterType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="patientemr.mrdfilesdownloadupload.capturedate.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="admissiondate" ng-date-object datetime-picker="{{datePickerOptions.dateTimeFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="admissiondate = { opened: true }" is-open="admissiondate.opened"
                    ng-model="item.CapturedDate">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="documenttype" translate="patientemr.mrdfilesdownloadupload.mrdfiletype.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.MRDFileTypeId" name="documenttype" class="filter-combo" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.MRDFileType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="patientemr.mrdfilesdownloadupload.selectfile.lbl"></label>
            <div class="col-sm-12">
                <input type="file" ngf-select ng-model="currentcontext.file" name="file" ngf-max-size="200MB" ngf-change="fileSelected()"
                    style="background: 0;border: 0;border-radius: 0;" />
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label pdl0" for="name" translate="patientemr.mrdfilesdownloadupload.attachmentname.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" ng-disabled="true" name="name" ng-model="item.AttachmentName" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="patientemr.mrdfilesdownloadupload.comments.lbl"></label>
            <div class="col-sm-12">
                <textarea name="textarea" ng-model="item.Comments" class="form-control notes-textarea"></textarea>
            </div>
        </div>
    </form>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="pull-right">
            <button type="button" class="draftbutton" ng-click="saveItem()" translate="Upload"></button>
        </div>
    </div>
</div>
