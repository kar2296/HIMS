<style>
    .modal-dialog.modal-lg {
        width: 38%;
    }

    .modal-content .panel-body {
        height: 123px;
        overflow: inherit;
    }
</style>
<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="filestatus.locassignment.lbl"></h4>
</div>
<div class="">
    <patientbanner patientid="currentcontext.pid"></patientbanner>
</div>
<div class="row">
    <div class="col-sm-12" style="margin-top: 10px;">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="panel-body form-panel outer_border">
                <div class="panel panel-default">
                    <div class="col-sm-12" style="margin-top:22px;">
                        <label class="col-sm-5 control-label" for="">
                            <span translate="filestatus.rack.lbl"></span>:</label>
                        <div class="col-sm-5">
                            <ui-select id="dept" ng-model="item.RackId" name="fromdept" class="filter-combo" focus-if>
                                <ui-select-match>
                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                </ui-select-match>
                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.FileRack | filter: { Text: $select.search }">
                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                </ui-select-choices>
                            </ui-select>
                        </div>
                    </div>
                    <div class="col-sm-12" style="margin-top:22px;">
                        <label class="col-sm-5 control-label" for="">
                            <span translate="filestatus.self.lbl"></span>:</label>
                        <div class="col-sm-5">
                            <input type="text" class="form-control" name="self" ng-model="item.Self" placeholder="">
                        </div>
                    </div>
                </div>
            </div>

        </form>
    </div>
</div>
<div class="panel-footer formactionbar">
    <div class="pull-right">
        <button type="button" class="draftbutton" ng-click="savelocation()" translate="common.saveaction.lbl"></button>
    </div>
</div>
