<div class="modal-header custom-modal-header">
    <h4 class=" col-sm-6 mt0" translate="frequest.appointmentlist.lbl"></h4>
    <div class=" col-sm-6">
        <button type="button" class=" btn btn-xs btn-danger float-right" ng-click="cancelCallback()" aria-label="Close">
            <span aria-hidden="true">X</span>
        </button>
    </div>
</div>
<div class="row">
  <form id="item_form" name="item_form" class="form-horizontal" role="form" >
    <div class="col-sm-12">
        <label class="col-sm-5 control-label" for="frmdeptid" translate="frequest.frmdeptid.lbl"></label>
        <div class="col-sm-7">
            <ui-select ng-model="currentcontext.FrmDeptId" name="frmdeptid" autofocus required>
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="col-sm-12">
        <label class="col-sm-5 control-label" for="todeptid" translate="frequest.todeptid.lbl"></label>
        <div class="col-sm-7">
            <ui-select ng-model="currentcontext.ToDeptId" name="todeptid" autofocus required>
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="col-sm-12">
        <label class="col-sm-5 control-label" for="priority" translate="frequest.priority.lbl"></label>
        <div class="col-sm-7">
            <ui-select ng-model="currentcontext.PriorityId" name="priority" autofocus required>
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Priority | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="col-sm-12">
        <label class="col-sm-5 control-label" for="reqtype" translate="frequest.reqtype.lbl"></label>
        <div class="col-sm-7">
            <ui-select ng-model="currentcontext.RequestTypeId" name="reqtype" autofocus required>
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.MRDRequestType | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
   </form>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="col-sm-12">
            <div class="col-sm-6">
                <div class="row">

                </div>
            </div>
            <div class="col-sm-6">
                <div class="pull-right">
                    <button type="button"   class="draftbutton" translate="common.saveaction.lbl"
                        ng-if="!item.isRequested" ng-click="save()"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="cancelCallback()"
                        translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </div>
    </div>
</div>
