<div class="modal-header custom-modal-header">
    <h4 class=" col-sm-6 mt0" translate="frequest.appointmentlist.lbl"></h4>
    <div class=" col-sm-6">
        <button type="button" class=" btn btn-xs btn-danger float-right" ng-click="cancelCallback()" aria-label="Close">
            <span aria-hidden="true">X</span>
        </button>
    </div>
</div>
<div class="row filter-area">
    <div class="col-sm-12">

        <div class="col-sm-3">
            <label class=" sr-only  col-sm-4 control-label filter-lbl" translate="assetmanagement.warranty-list.fromdate.lbl"></label>
            <div class="col-sm-8">

                <input type="text" class="form-control" name="date" ng-change="getList()" datepicker-options="datePickerOptions"
                    show-button-bar="{{datePickerOptions.showButtonBar}}" uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="dateofbirthPopup = { opened: true }"
                    is-open="dateofbirthPopup.opened" ng-model="currentfilter.FromDate">
            </div>
        </div>
        <div class="row col-sm-3">
            <label class="col-sm-4 control-label" translate="assetmanagement.warranty-list.todate.lbl" for="date"></label>
            <div class="col-sm-8">
                <input type="text" class="form-control" name="dweate" ng-change="getList()" datepicker-options="datePickerOptions"
                    show-button-bar="{{datePickerOptions.showButtonBar}}" uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="activetoPopup = { opened: true }" is-open="activetoPopup.opened"
                    ng-model="currentfilter.ToDate">
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-4 control-label filter-lbl" translate="ordermanagement.orderacknowledgement-form.department.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.DepartmentId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="row col-sm-2">
            <label class="col-sm-4 control-label filter-lbl" translate="otrequest-list.admittingdoctor.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.DoctorId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Doctor | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>

    </div>
</div>
<div class="panel-body">
    <patientbanner patientid="currentcontext.pid"></patientbanner>
    <div class="col-sm-12">
        <div ui-grid="vm.gridConfig" class="table-uigrid"></div>
        <div class="site-footer">
            <div class="col-sm-6">
                <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize"
                    start-index="vm.gridConfig.pagerObj.startIndex" ng-model="vm.gridConfig.pagerObj.currentPage"
                    ng-change="getList()"></ul>
            </div>
            <div class="col-sm-6">
                <div class="pull-right">
                    <button type="button"   class="draftbutton" translate="common.saveaction.lbl"
                        ng-if="vm.gridConfig && vm.gridConfig.data && vm.gridConfig.data.length > 0"
                        ng-click="save()"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="cancelCallback()"
                        translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </div>
    </div>
</div>
