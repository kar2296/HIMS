<div class="row page-header">
    <div class="col-sm-12">
        <h4 class="col-sm-6 mt0" translate="bedmanagement-grid.pagetitle.lbl"></h4>
        <div class="col-sm-6">
            <div class="filters">
                <button class="btn-add" ng-click="bedstatus()" >
                    <i class="fa fa-info" uib-tooltip="BedStatus"
                    tooltip-placement="bottom"></i>
                </button> 
                <button class="btn-add" ng-click="backtoList()" >
                    <i class="fa fa-home" uib-tooltip="BedStatus"
                    tooltip-placement="bottom"></i>
                </button>               
            </div>
        </div>
    </div>
</div>
<div id="receipt_tab">
    <div class="row tablebox" id="tablebox">
        <div class="col-sm-12">
            <uib-tabset active="active" id="assettabs">
                <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)"
                    disable="tab.canDisable">
                </uib-tab>
            </uib-tabset>
            <div ui-view></div>
        </div>
    </div>
</div>
