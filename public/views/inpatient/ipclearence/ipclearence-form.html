<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="IP Clearence"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">

        <div class="row">
            <fieldset class="" ng-disabled="item.IsBackToSameBed">

                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" for="ward" translate="Patient Name"></label>
                    <div class="col-sm-12">
                        {{item.PatientName}}
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" for="ward" translate="Visit No"></label>
                    <div class="col-sm-12">
                        {{item.VisitNo}}
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" for="room" translate="Ward"></label>
                    <div class="col-sm-12">
                        {{item.WardMaster.WardName}}
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" for="room" translate="Room Bed"></label>
                    <div class="col-sm-12">
                        {{item.WardRoomMaster.RoomNo}}&nbsp; {{item.WardRoomBedMaster.BedNo}}
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" for="Bed" translate="Admission Status"></label>
                    <div class="col-sm-12">
                        {{item.Encounter.AdmissionStatus.Description}}
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" for="Bed" translate="Doctor"></label>
                    <div class="col-sm-12">
                        {{item.DoctorName}}
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" for="Bed" translate="Department"></label>
                    <div class="col-sm-12">
                        {{item.Department.DepartmentName}}
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" for="comments" translate="Remarks"></label>
                    <div class="col-sm-12">
                        <textarea rows="3" name="comments" ng-model="item.Comments" maxlength="4000" class="notes-textarea"></textarea>
                    </div>
                </div>
            </fieldset>
        </div>
        <div class="pull-right">
            <button id="btnSave" type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
        </div>
    </form>
</div>
