<link rel="stylesheet" href="app/css/drhms.css">
<style>
    button.addbtn i {
        margin-right: 10px;
        position: relative;
        top: 3px;
    }

    button.addbtn {
        background-color: #0a97f4;
        border: unset;
        padding: 10px;
        border-radius: 10px;
        color: white;
    }
</style>
<div class="row page-header">
    <div class="col-sm-12">
        <h4 class="mt0" translate="Admission Request"></h4>
    </div>
</div>
<emrpatientbanner patientid="currentcontext.pid" encounterid="currentcontext.eid">
</emrpatientbanner>
<div class="row">
    <div class="col-sm-3">
        <label class="col-sm-12" for="fromdate" translate="From Date"></label>
        <div class="col-sm-12">
            <div class="datepicker">
                <input type="text" class="form-control" name="fromdate" ng-change="getList()" datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                    is-open="fromdatePopup.opened" ng-model="currentfilter.FromDate">
                <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
        </div>
    </div>
    <div class="col-sm-3">
        <label class="col-sm-12" for="todate" translate="To Date"></label>
        <div class="col-sm-12">
            <div class="datepicker">
                <input type="text" class="form-control" name="todate" ng-change="getList()" datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
                    is-open="todatePopup.opened" ng-model="currentfilter.ToDate">
                <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
        </div>
    </div>
    <div class="col-sm-3">
        <label class="col-sm-12 control-label" translate="admissionrequests.filter_requestedno.lbl"></label>
        <div class="col-sm-12">
            <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.RequestedNo" placeholder="Requested No">
        </div>
    </div>
    <div class="col-sm-3">
        <label class="col-sm-12 control-label" for="type" translate="admissionrequests.filter_admissionrequesttype.lbl"></label>
        <div class="col-sm-12">
            <ui-select ng-model="currentfilter.AdmissionRequestTypeId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.AdmissionRequestType | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="col-sm-3">
        <label class="col-sm-12 control-label" for="status" translate="admissionrequests.filter_status.lbl"></label>
        <div class="col-sm-12">
            <ui-select ng-model="currentfilter.admissionstatusid" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.AdmissionRequestStatus | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="col-sm-3" align="center">
        <button class="addbtn" ng-click="addNew()" style="margin-top: 20px;" uib-tooltip="{{ 'Add Admission Request' }}" tooltip-placement="bottom">
            <i class="fa fa-plus" aria-hidden="true"></i>Admission Slip
        </button>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
