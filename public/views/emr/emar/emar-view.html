<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-6">
            <label class="col-sm-4" translate="billing.servicebilldiscounts.approvalstatus.lbl"></label>
            <div class="col-sm-6">
                <ui-select ng-model="currentfilter.AdministerStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length > 20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.AdministerStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </form>
</div>
<div class="row">
    <emarcontrol patientid="currentcontext.pid" prescriptionid="currentcontext.presid"
