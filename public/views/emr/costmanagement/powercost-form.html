<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="costmanagement.powercost-list.tooltip.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="backToList()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="costmanagement.powercost-list.equipmentname.lbl"
                for="AssetName"></label>
            <div class="col-sm-12">
                <autosearch itemid="item.AssetId" iteminfo="item.selecteditem" rowdata=""
                    config="vm.servicerequestcontrolconfig" itemchange="getList()"></autosearch>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="costmanagement.powercost-list.wattage.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.WattageId">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Wattage | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="costmanagement.powercost-list.batterybackup.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.BatteryBackupId">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.BatteryBackup | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="costmanagement.powercost-list.powerphase.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.PowerPhaseId">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.PowerPhase | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="costmanagement.powercost-list.kwhunit.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" ng-model="item.KWHunit" ng-change="computeAmount(item)"
                    placeholder="">
            </div>
        </div>
        <!--<div class="form-group col-sm-4">
                                <label class="col-sm-12 control-label" translate="costmanagement.powercost-list.kwhcost.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="text" class="form-control" ng-model="item.KWHCost" ng-change="computeAmount(item)" placeholder="">
                                </div>
                            </div>-->
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="costmanagement.powercost-list.cphour.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" ng-model="item.Cost" placeholder="" disabled>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="costmanagement.powercost-list.avgprocedure.lbl"></label>
            <div class="col-sm-12">
                <input type="number" class="form-control" ng-model="item.AvgProcedure"
                    ng-change="computepowercost(item)" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="costmanagement.powercost-list.powercost.lbl"></label>
            <div class="col-sm-12">
                <input type="number" class="form-control" ng-model="item.PowerCost" placeholder="" disabled>

            </div>
        </div>
    </form>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="pull-right">
            <button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl"
                ng-if="!item.isRequested" ng-click="save()"></button>
            <!--<button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
            <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>-->
        </div>
    </div>
</div>
