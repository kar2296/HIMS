<div class="row">
    <div class="pull-right">
        <button class="btn-add" ng-click="addNew()"
            uib-tooltip="{{ 'costmanagement.powercost-list.tooltip.lbl' | translate}}" tooltip-placement="bottom">
            <i class="fa fa-plus" aria-hidden="true"></i></button>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="row">
    <div class="col-sm-7"></div>
    <div class="col-sm-5">
        <table>
            <tr>
                <td class="totallabel">
                    Power Cost
                </td>
                <td>
                    <input type="text" class="form-control" value="{{TotalAmount | displaycurrency}}" disabled>
                </td>
            </tr>
            <tr>
                <td class="totallabel">
                    Average Power Costs
                </td>
                <td>
                    <input type="text" class="form-control" value="{{TotalPowerCost | displaycurrency}}" disabled>
                </td>
            </tr>
            <tr>
                <td class="totallabel">
                    Total
                </td>
                <td>
                    <input type="text" class="form-control" value="{{TotalAmount | displaycurrency}}" disabled>
                </td>
            </tr>
        </table>
    </div>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="pull-left">
            <button type="button" class="btn btn-sm pyr-color10" ng-click="backToForm()"><i
                    class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button>
        </div>
    </div>
</div>
