<style>
    .panel-ticksheet {
        margin: 10px !important;
    }

    .ticksheet-name {
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 10px;
    }

    .ticksheet-item {
        margin-bottom: 7px !important;
    }

    #tabctrl .btn-default {
        color: #333333;
        background-color: #d8d1d1;
        border-color: #eaeaea;
        padding: 3px 11px;
    }

    #tabctrl .btn .btn-default {
        border-color: #9E9E9E;
    }

    /* ui style start*/

    .btn-favorite {
        margin: 2px 10px;
    }

    #favoritebtncolorcontroler label {
        text-overflow: ellipsis;
        overflow: hidden;
        width: 80px;
    }

    #favoritebtncolorcontroler .btn-default {
        display: inline-block;
        padding: 4px 8px;
        margin-right: -6px;
        font-size: 14px;
        line-height: 20px;
        color: #333333;
        text-align: center;
        text-shadow: 0 1px 1px rgba(255, 255, 255, 0.75);
        vertical-align: middle;
        cursor: pointer;
        background-color: #f5f5f5;
        background-image: -webkit-gradient(linear, 0 0, 0 100%, from(#ffffff), to(#e6e6e6));
        background-image: -webkit-linear-gradient(top, #ffffff, #e6e6e6);
        background-image: -o-linear-gradient(top, #ffffff, #e6e6e6);
        background-image: linear-gradient(to bottom, #ffffff, #e6e6e6);
        background-image: -moz-linear-gradient(top, #ffffff, #e6e6e6);
        background-repeat: repeat-x;
        border: 1px solid #bbbbbb;
        border-color: rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.25);
        border-color: #e6e6e6 #e6e6e6 #bfbfbf;
        border-bottom-color: #a2a2a2;
        -webkit-border-radius: 4px;
        -moz-border-radius: 4px;
        border-radius: 4px;
        filter: progid:dximagetransform.microsoft.gradient(startColorstr='#ffffffff', endColorstr='#ffe6e6e6', GradientType=0);
        filter: progid:dximagetransform.microsoft.gradient(enabled=false);
        -webkit-box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.05);
        -moz-box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.05);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    #favoritebtncolorcontroler .btn-default.active {
        background-color: #95ce95;
        background-color: #D9D9D9 9;
        color: #fff;
        background-image: none;
        outline: 0;
        -webkit-box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
        -moz-box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    #tabctrl .btn-default.active {
        background-color: #5089b6;
        background-color: #D9D9D9 9;
        color: #fff;
    }

    #favoritebtncolorcontroler .btn-success {
        background-color: #95ce95;
        background-color: #D9D9D9 9;
        color: #fff;
        background-image: none;
        outline: 0;
        -webkit-box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
        -moz-box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .panel-ticksheet .panel-body {
        height: 434px;
        overflow: auto;
    }

    .width-control {
        float: left;
        margin: 1px 25px !important;
    }

    /* ui style end*/

    .panel-body .well {
        padding: 3px !important;
        margin-top: 3px;
    }

    .panel-body {
        padding: 1px;
    }

    .bg-pattern .col-sm-12 {
        padding-left: 8px;
        padding-right: 8px;
    }

    .table {
        margin-bottom: 1px !important;
    }

    .table>thead>tr>th {
        padding: 5px 8px !important;
        color: #888;
    }

    table>tbody>tr>td {
        padding-left: 20px;
        color: #888383 !important;
        padding: 2px 14px !important;
    }

    table>tbody>tr>td {
        font-size: 14px;
        font-weight: 700;
        border-top: 1px solid #fdf9f9 !important;
    }

    

    .well {
        min-height: 20px;
        padding: 5px !important;
    }

    .layout-fixed .wrapper>section {
        margin-top: 100px;
    }

    button.btn.pyr-color10.btn-sm {
        float: left;
        margin-left: 5%;
    }

    
    .icon_emrboard {
    width: 5%;
    float: right;
    margin-right: 1%;
   
}
.icon_home{
        width: 5%;
    float: right;
    }
    #emr_pat_fdbk{
        height:160px !important;
    }
    label.btn.btn-sm.btn-custom-radio.btn-default {
    border: 1px solid #23d84f;
    color: #000;
}
table tbody td span{
    color:#000;
}
</style>
