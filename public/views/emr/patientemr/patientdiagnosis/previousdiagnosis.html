<style>
    .container-fluid {
        margin-left: 0px;
        margin-right: 0px;
        margin-bottom: 0px;
        background-image: url(app/img/bg-body.jpg);
        background-repeat: repeat;
    }

    .modal-header {
        padding: 9px 10px;
        background-color: #597a9a;
        color: #fff;
    }

    .custom-modal-header {
        margin-bottom: 10px !important;
    }

    .panel-footer {
        padding: 2px 15px !important;
        ;
    }

    .modal-content {
        height: 450px !important;
    }

    .modal-lg {
        width: 1200px !important;
    }

    }
    .doctor {

    }
    .tbl-header {

    }*/

        width: 120px !important;
        padding-left: 3px !important;
    }*/

    /* .modal-content #mainresponsivetablecontrol {
        height: 404px !important;
    } */

    .custom-table {
        margin-bottom: 0px !important;
    }

    pre {
        display: block;
        padding: 2px;
        margin: 0 0 10.5px;
        font-size: 12px;
        line-height: 1.52857143;
        word-break: break-all;
        word-wrap: break-word;
        color: #a70808;
        /* background-color: #7f6cb9; */
        /* border: 1px solid #cccccc; */
        /* border-radius: 4px; */
    }

    b,
    strong {
        font-weight: 700;
        color: darkblue;
    }
</style>

    <div class="modal-header custom-modal-header">
        <div class="col-sm-6">
    <h4 class="modal-title custom-modal-title" translate="patientemr.patientdiagnosis-list.historytitle.lbl"></h4>
        </div>
    <div class="col-sm-6">
            <div class="filters">
                <img src="../../../../../assets/svg/close.svg"  ng-click="cancelCallback()">
            </div>
        </div>
</div>
<patientbanner patientid="currentcontext.pid"></patientbanner>
<div class="col-sm-12">
    <div class="table-responsive" id="mainresponsivetablecontrol" >
        <table class="table table-hover table-responsive table-bordered custom-table" style="width: 192vh;">
            <thead class="bg-subhead">
                <tr style="height: 42px;">
                    <td class="cus-col tbl-header" style="padding: 10px 42px;     background: #2196F3 !important;"><span translate="Date"></span></td>
                    <td class="cus-col tbl-header" style="padding: 10px 42px;     background: #2196F3 !important;"><span translate="Doctor"></span></td>
                    <td class="cus-col tbl-header" style="padding: 10px 42px;     background: #2196F3 !important;"><span translate="Description"></span></td>
                    <td class="cus-col tbl-header" style="padding: 10px 42px;     background: #2196F3 !important;"><span translate="Diagnosis"></span></td>
                    <td class="cus-col tbl-header" style="padding: 10px 42px;     background: #2196F3 !important;"><span translate="Other"></span></td>
                    <!-- <td class="cus-col tbl-header" style="padding: 10px 42px;     background: #2196F3 !important;"><span translate="Status"></span></td> -->
                    </tr>
            </thead>
            <thead>
                <tr ng-repeat="item in items">
                        <td>
                            <ngformatdate datetime-val='item.ConditionDate'></ngformatdate>
                        </td>
                    <td class="cus-col ">

                        <span> {{item.Encounter.DoctorName}}</span>
                    </td>
                    <td><b class="condition">{{item.ConditionType.Description}}</b></td>
                    <td class="cus-col ">
                        <span class="name" style="    white-space: normal;">{{item.DiagnosisName}}</span>
                        <span class="code">({{item.Code}})</span>
                    </td>
                    <td class="cus-col doctor"><b class="plain-text1">
                        {{item.OtherDiagnosis}}
                        </b></td>
                    <!-- <td class="cus-col " style="color: red;"> {{item.ConditionStatus.Description}}</td> -->
                    <!-- <td class="cus-col "><b style="color: red;">Pending</b></td> -->
                </tr>
            </thead>
        </table>
    </div>
</div>
