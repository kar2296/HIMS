<link href="app/css/emr.css" rel="stylesheet">
<style>
    ul.nav.nav-pills.nav>li>a {
         background: #46761b;
        color: #fafafa;
        border-radius: 0;
        padding: 4px;
        height: 32px;
    }

    .nav.nav-pills .active>a {
        color: #006c9a !important;
        background: #fff !important;
        border: 1px solid #006c9a;
        box-shadow: rgb(50 50 93 / 25%) 0px 2px 5px -1px, rgb(0 0 0 / 30%) 0px 1px 3px -1px;
        height: unset;
    }

    .nav>li>a:hover,
    .nav>li>a:focus {
         background: #46761b;
    }
</style>
<div class="col-sm-12">
    <div class="col-sm-4">
        <ul class="nav nav-pills row">
            <li><a data-toggle="pill" ng-click="adddiagnosis()"><i class="fas fa-diagnoses"></i>
                    Add Diagnosis</a></li>
            <li class="active"><a data-toggle="pill" ng-click="favoriteDiagnosis()"><i class="fas fa-star"></i>
                    Favorites</a></li>
        </ul>
    </div>
</div>
<div class="row">
    <favoritecontrol config="favconfig" saveclick="loadDiagnosisList()"></favoritecontrol>
</div>
