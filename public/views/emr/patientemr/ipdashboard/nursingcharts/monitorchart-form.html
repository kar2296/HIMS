<style>
    .form-horizontal .form-group {
        height: 60px;
    }

    table.uib-timepicker {
        margin-top: -12px;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="patientemr.criticalcharts.managemonitor.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="patientemr.criticalcharts.date.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="fromdate" ng-date-object
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                    is-open="fromdatePopup.opened" ng-model="item.MonitorChartDate" required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="patientemr.criticalcharts.time.lbl"></label>
            <div class="col-sm-12">
                <uib-timepicker name="gracetime" ng-model="item.MonitorChartTime" ng-time-object></uib-timepicker>
            </div>
        </div>
        <div class="">
            <div class="col-sm-12">
                <div class="col-sm-12">
                    <h4 class="control-label" translate="patientemr.criticalcharts.cvs.lbl"></h4>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" for="rate"
                        translate="patientemr.criticalcharts.pulse.lbl"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="rate" ng-model="item.Pulse" ng-pattern="/^\d+$/"
                            placeholder="" required>
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" for="tv"
                        translate="patientemr.criticalcharts.bp.lbl"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="tv" ng-model="item.BP" placeholder="" required>
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" for="temperature"
                        translate="patientemr.criticalcharts.temperature.lbl"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="temperature" ng-model="item.Temperature"
                            placeholder="" required>
                    </div>
                </div>
            </div>
            <div class="col-sm-12">
                <div class="col-sm-12">
                    <h4 class="col-sm-12 control-label" translate="patientemr.criticalcharts.rs.lbl"></h4>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" for="mv"
                        translate="patientemr.criticalcharts.rate.lbl"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="mv" ng-model="item.Rate" ng-pattern="/^\d+$/"
                            placeholder="" required>
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" for="ps"
                        translate="patientemr.criticalcharts.ls.lbl"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="ps" ng-model="item.LS" placeholder="">
                    </div>
                </div>
            </div>
            <div class="">
                <div class="col-sm-12">
                    <h4 class="col-sm-12 control-label" translate="patientemr.criticalcharts.cns.lbl"></h4>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" for="peakpress"
                        translate="patientemr.criticalcharts.grade.lbl"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="peakpress" ng-model="item.Grade" placeholder=""
                            required>
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" for="rightpupils"
                        translate="patientemr.criticalcharts.rightpupils.lbl"></label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" name="rightpupils" ng-model="item.RightPupil"
                            placeholder="" required>
                    </div>
                    <div class="col-sm-2">
                        <ui-select ng-model="item.RightPupilPercentId" name="discount" ng-disabled="true">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.DiscountMode | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" for="leftpupils"
                        translate="patientemr.criticalcharts.leftpupils.lbl"></label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" name="leftpupils" ng-model="item.LeftPupil"
                            placeholder="" required>
                    </div>
                    <div class="col-sm-2">
                        <ui-select ng-model="item.LeftPupilPercentId" name="discount" ng-disabled="true">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.DiscountMode | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" for="fio2"
                        translate="patientemr.criticalcharts.git.lbl"></label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" name="fio2" ng-model="item.GIT" placeholder="" required>
                    </div>
                    <div class="col-sm-2">
                        <ui-select ng-model="item.GITPercentId" name="discount" ng-disabled="true">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.DiscountMode | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" for="spo2"
                        translate="patientemr.criticalcharts.spo2.lbl"></label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" name="spo2" ng-model="item.SPO2" placeholder=""
                            required>
                    </div>
                    <div class="col-sm-2">
                        <ui-select ng-model="item.SPO2PercentId" name="discount" ng-disabled="true">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.DiscountMode | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" for="issuction"
                        translate="patientemr.criticalcharts.remarks.lbl"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="suction" ng-model="item.Remarks" placeholder=""
                            required>
                    </div>
                </div>
                <!-- <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="reason" translate="patientemr.criticalcharts.comments.lbl"></label>
                <div class="col-sm-12">
                    <textarea rows="10" name="reason" ng-model="item.Comments" maxlength="4000" class="notes-textarea" style="width: 250px;
                                height: 70px;"></textarea>
                </div>
            </div> -->
            </div>
        </div>
    </form>
</div>

<div class="">
    <div class="row">
        <div class="pull-right">
            <button type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
            <!-- <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button> -->
        </div>
    </div>
</div>
