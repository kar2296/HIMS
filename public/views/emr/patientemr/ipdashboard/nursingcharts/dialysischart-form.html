<style>
    .form-horizontal .form-group {
        height: 60px;
    }

    table.uib-timepicker {
        margin-top: -12px;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="patientemr.criticalcharts.managedialysis.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="patientemr.criticalcharts.date.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="fromdate" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }" is-open="fromdatePopup.opened"
                    ng-model="item.DialysisChartDate">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-4 control-label" translate="patientemr.criticalcharts.time.lbl"></label>
            <div class="col-sm-12">
                <uib-timepicker name="gracetime" ng-model="item.DialysisChartTime" ng-time-object></uib-timepicker>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-4 control-label" translate="Start Time"></label>
            <div class="col-sm-12">
                <uib-timepicker name="gracetime" ng-model="item.StartTime" ng-time-object></uib-timepicker>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-4 control-label" translate="End Time"></label>
            <div class="col-sm-12">
                <uib-timepicker name="gracetime" ng-model="item.EndTime" ng-time-object></uib-timepicker>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="pre" translate="Pre Dialysis Wt"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="pre" size="10" value="" onChange="numberonly($event)" onKeyUp="numberonly($event)"
                    ng-keypress="numberonly($event)" ng-model="item.PreDialysisWt" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="post" translate="Post Dialysis Wt"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="post" size="10" value="" onChange="numberonly($event)" onKeyUp="numberonly($event)"
                    ng-keypress="numberonly($event)" ng-model="item.PostDialysisWt" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="Examinations" translate="Examinations"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="Examinations" ng-model="item.Examinations" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="bp" translate="patientemr.criticalcharts.bp.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="bp" size="10" value="" onChange="numberonly($event)" onKeyUp="numberonly($event)"
                    ng-keypress="numberonly($event)" ng-model="item.BP" placeholder="" required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="Pulse" translate="Pulse"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="Pulse" onChange="numberonly($event)" onKeyUp="numberonly($event)" ng-keypress="numberonly($event)"
                    ng-model="item.Pulse" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="Resp" translate="Resp"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="Resp" onChange="numberonly($event)" onKeyUp="numberonly($event)" ng-keypress="numberonly($event)"
                    ng-model="item.Resp" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="Temp" translate="Temp"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="Temp" onChange="numberonly($event)" onKeyUp="numberonly($event)" ng-keypress="numberonly($event)"
                    ng-model="item.Temp" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="BI Flow" translate="BI Flow"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="BI Flow" onChange="numberonly($event)" onKeyUp="numberonly($event)" ng-keypress="numberonly($event)"
                    ng-model="item.BIFlow" placeholder="">
            </div>
        </div>

        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="Negative" translate="Negative Pressure(NP)"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="Negative" onChange="numberonly($event)" onKeyUp="numberonly($event)" ng-keypress="numberonly($event)"
                    ng-model="item.NegativePressure" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="Venuse" translate="Venus Pressure(VP)"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="Venuse" onChange="numberonly($event)" onKeyUp="numberonly($event)" ng-keypress="numberonly($event)"
                    ng-model="item.VenusePressure" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="Haparin" translate="Heparin"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="Haparin" onChange="numberonly($event)" onKeyUp="numberonly($event)" ng-keypress="numberonly($event)"
                    ng-model="item.Haparin" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="Salin" translate="Salin"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="Salin" onChange="numberonly($event)" onKeyUp="numberonly($event)" ng-keypress="numberonly($event)"
                    ng-model="item.Salin" placeholder="">
            </div>
        </div>

        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="patientemr.criticalcharts.capturedby.lbl"></label>
            <div class="col-sm-12">
                <autosearch itemid="item.CapturedBy" iteminfo="" rowdata="" config="vm.usercontrolconfig" itemchange="doctorChange()" candisable="IsDisabled"></autosearch>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="sugar" translate="patientemr.criticalcharts.sugar.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" size="10" value="" onChange="numberonly($event)" onKeyUp="numberonly($event)" ng-keypress="numberonly($event)"
                    name="sugar" ng-model="item.Sugar" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="traetmenthour" translate="patientemr.criticalcharts.traetmenthour.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" size="10" value="" onChange="numberonly($event)" onKeyUp="numberonly($event)" ng-keypress="numberonly($event)"
                    name="traetmenthour" ng-model="item.TreatmentHours" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="signatory" translate="patientemr.criticalcharts.signatory.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="signatory" ng-model="item.Signatory" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="comments" translate="patientemr.criticalcharts.comments.lbl"></label>
            <div class="col-sm-12">
                <commentscontrol comments="item.Comments"></commentscontrol>
            </div>
        </div>
    </form>
</div>

<div class="">
    <div class="row">
        <div class="pull-right">
            <button type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
            <!-- <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button> -->
        </div>
    </div>
</div>
