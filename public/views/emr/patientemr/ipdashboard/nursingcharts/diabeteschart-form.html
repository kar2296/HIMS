<style>
    .form-horizontal .form-group {
        height: 60px;
    }

    table.uib-timepicker {
        margin-top: -12px;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="patientemr.criticalcharts.managediabetes.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
        <div class="col-sm-12">
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" translate="patientemr.criticalcharts.date.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="fromdate" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }" is-open="fromdatePopup.opened"
                        ng-model="item.DiabetesChartDate" required>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-4 control-label" translate="patientemr.criticalcharts.time.lbl"></label>
                <div class="col-sm-12">
                    <uib-timepicker name="gracetime" ng-model="item.DiabetesChartTime" ng-time-object></uib-timepicker>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="method" translate="patientemr.criticalcharts.orderby.lbl"></label>
                <div class="col-sm-12">
                    <!-- <ui-select ng-model="item.DoctorId" ng-disabled="IsDisabled">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Doctor | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select> -->
                    <autosearch itemid="item.DoctorId" iteminfo="" rowdata="" name="'doctorid'" config="vm.doctorcontrolconfig" itemchange="doctorChange()"
                        candisable="IsDisabled" isrequired="true"></autosearch>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="method" translate="patientemr.criticalcharts.method.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="method" ng-model="item.Method" placeholder="">
                </div>
            </div>
        </div>
        <div class="col-sm-12">
            <div class="col-sm-12">
                <h4 class="col-sm-12 control-label" translate="patientemr.criticalcharts.bloodsugar.lbl"></h4>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="bfasting" translate="patientemr.criticalcharts.fasting.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="bfasting" ng-model="item.BloodSugarFasting" placeholder="">
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="bpp" translate="patientemr.criticalcharts.pp.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="bpp" ng-model="item.BloodSugarPP" placeholder="" uppercase>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="brandom" translate="patientemr.criticalcharts.random.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="brandom" ng-model="item.BloodSugarRandom" placeholder="" uppercase>
                </div>
            </div>
        </div>
        <div class="col-sm-12">
            <div class="col-sm-12">
                <h4 class="col-sm-12 control-label" translate="patientemr.criticalcharts.urinesugar.lbl"></h4>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="ufasting" translate="patientemr.criticalcharts.fasting.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="ufasting" ng-model="item.UrineSugarFasting" placeholder="">
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="upp" translate="patientemr.criticalcharts.pp.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="upp" ng-model="item.UrineSugarPP" placeholder="" uppercase>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="urandom" translate="patientemr.criticalcharts.random.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="urandom" ng-model="item.UrineSugarRandom" placeholder="" uppercase>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="HBA1C" translate="HbA1C"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="HBA1C" ng-model="item.HBA1C" placeholder="">
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="eag" translate="Estimate Average Glucose"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="eag" ng-model="item.EAG" placeholder="" uppercase>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="micalb" translate="Micro Albumin"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="micalb" ng-model="item.MicroAlbumin" placeholder="" uppercase>
                </div>
            </div>
        </div>
        <div class="col-sm-12">
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="comments" translate="Insulin Dose Given"></label>
                <div class="col-sm-12">
                    <textarea rows="3" name="comments" ng-model="item.Comments" maxlength="4000"></textarea>
                </div>
            </div>

            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="micalb" translate="Entered By"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="micalb" ng-model="item.EnteredBy" placeholder="" uppercase>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="micalb" translate="Cross Checked By"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="micalb" ng-model="item.CheckedBy" placeholder="" uppercase>
                </div>
            </div>
        </div>
    </form>
</div>
<div class="">
    <div class="row">
        <div class="pull-right">
            <button type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
            <!-- <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button> -->
        </div>
    </div>
</div>
