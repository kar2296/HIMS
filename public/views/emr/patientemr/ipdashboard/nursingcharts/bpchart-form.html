<style>
    .form-horizontal .form-group {
        height: 60px;
    }

    table.uib-timepicker {
        margin-top: -12px;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="patientemr.criticalcharts.managebpcharts.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
        <div class="row">
            <div class="col-sm-4 form-group">
                <label class="col-sm-12 control-label" translate="patientemr.criticalcharts.date.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="fromdate" ng-date-object
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                        is-open="fromdatePopup.opened" ng-model="item.BPChartDate" required>
                </div>
            </div>
            <div class="col-sm-4 form-group">
                <label class="col-sm-12 control-label" translate="patientemr.criticalcharts.time.lbl"></label>
                <div class="col-sm-12">
                    <uib-timepicker name="gracetime" ng-model="item.BPChartTime" ng-time-object></uib-timepicker>
                </div>
            </div>
            <div class="col-sm-4 form-group">
                <label class="col-sm-12 control-label" for="signature"
                    translate="patientemr.criticalcharts.signature.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="signature" ng-model="item.Signatory" placeholder="">
                </div>
            </div>
        </div>
        <div class="row">
            <table class="table table-hover table-responsive table-bordered">
                <thead>
                    <tr>
                        <th style="text-align: center;">
                        </th>
                        <th colspan="3" class="arms">
                            <span translate="patientemr.criticalcharts.rightarm.lbl"></span>
                        </th>
                        <th colspan="3" class="arms">
                            <span translate="patientemr.criticalcharts.leftarm.lbl"></span>
                        </th>
                        <th colspan="1" class="arms">
                            <span translate="patientemr.criticalcharts.pulserate.lbl"></span>
                        </th>
                    </tr>
                    <tr>
                        <th style="text-align: center;">
                        </th>
                        <th class="tabhead">
                            <span translate="patientemr.criticalcharts.supine.lbl"></span>
                        </th>
                        <th class="tabhead">
                            <span translate="patientemr.criticalcharts.sitting.lbl"></span>
                        </th>
                        <th class="tabhead">
                            <span translate="patientemr.criticalcharts.standing.lbl"></span>
                        </th>
                        <th class="tabhead">
                            <span translate="patientemr.criticalcharts.supine.lbl"></span>
                        </th>
                        <th class="tabhead">
                            <span translate="patientemr.criticalcharts.sitting.lbl"></span>
                        </th>
                        <th class="tabhead">
                            <span translate="patientemr.criticalcharts.standing.lbl"></span>
                        </th>
                        <th style="text-align: center;">
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="params">
                            <span translate="patientemr.criticalcharts.chartbp.lbl"></span>
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.RightArmBPSupine" placeholder=""
                                required>
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.RightArmBPSitting" placeholder=""
                                required>
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.RightArmBPStanding" placeholder=""
                                required>
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.LeftArmBPSupine" placeholder=""
                                required>
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.LeftArmBPSitting" placeholder=""
                                required>
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.LeftArmBPStanding" placeholder=""
                                required>
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.BPPulseRate" placeholder="" required>
                        </td>
                    </tr>
                    <tr>
                        <td class="params">
                            <span translate="patientemr.criticalcharts.pp.lbl"></span>
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.RightArmPPSupine" placeholder=""
                                required>
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.RightArmPPSitting" placeholder=""
                                required>
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.RightArmPPStanding" placeholder=""
                                required>
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.LeftArmPPSupine" placeholder=""
                                required>
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.LeftArmPPSitting" placeholder=""
                                required>
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.LeftArmPPStanding" placeholder=""
                                required>
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.PPPulseRate" placeholder="" required>
                        </td>
                    </tr>
                    <tr>
                        <td class="params">
                            <span translate="patientemr.criticalcharts.map.lbl"></span>
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.RightArmMAPSupine" placeholder=""
                                required>
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.RightArmMAPSitting" placeholder=""
                                required>
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.RightArmMAPStanding" placeholder=""
                                required>
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.LeftArmMAPSupine" placeholder=""
                                required>
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.LeftArmMAPSitting" placeholder=""
                                required>
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.LeftArmMAPStanding" placeholder=""
                                required>
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.MAPPulseRate" placeholder=""
                                required>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </form>
</div>
<div class="">
    <div class="row">
        <div class="pull-right">
            <button type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
            <!-- <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button> -->
        </div>
    </div>
</div>
