<style>
    .form-horizontal .form-group {
        height: 60px;
    }

    table.uib-timepicker {
        margin-top: -12px;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="patientemr.criticalcharts.manageabg.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="patientemr.criticalcharts.date.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="fromdate" ng-date-object
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                    is-open="fromdatePopup.opened" ng-model="item.ABGChartDate" required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="issuction"
                translate="patientemr.criticalcharts.signatory.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="suction" ng-model="item.Signatory" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="patientemr.criticalcharts.time.lbl"></label>
            <div class="col-sm-12">
                <uib-timepicker name="gracetime" ng-model="item.ABGChartTime" ng-time-object>
                </uib-timepicker>
            </div>
        </div>
        <div class="form-group col-sm-4" ng-repeat="item in abgparameters1">
            <!-- <div class="col-sm-12"> -->
            <label class="col-sm-12">
                {{item.ABGParameters}}
            </label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="tv" ng-model="item.ParameterValues" placeholder="">
            </div>
            <!-- </div> -->
        </div>
        <div class="form-group col-sm-4" ng-repeat="item in abgparameters2">
            <!-- <div class="col-sm-12"> -->
            <label class="col-sm-12">
                {{item.ABGParameters}}
            </label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="tv" ng-model="item.ParameterValues" placeholder="">
            </div>
            <!-- </div> -->
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="reason"
                translate="patientemr.criticalcharts.comments.lbl"></label>
            <div class="col-sm-12">
                <textarea rows="3" name="reason" ng-model="item.Comments" maxlength="4000"></textarea>
            </div>
        </div>
    </form>
</div>
<div class="">
    <div class="row">
        <div class="pull-right">
            <button type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
        </div>
    </div>
</div>
