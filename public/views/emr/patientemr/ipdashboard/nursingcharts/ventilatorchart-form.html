<style>
    .form-horizontal .form-group {
        height: 60px;
    }

    table.uib-timepicker {
        margin-top: -12px;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="patientemr.criticalcharts.pnltile.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="patientemr.criticalcharts.date.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="fromdate" ng-date-object
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                    is-open="fromdatePopup.opened" ng-model="item.VentilatorDate" required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="patientemr.criticalcharts.time.lbl"></label>
            <div class="col-sm-12">
                <uib-timepicker name="gracetime" ng-model="item.VentilatorTime" ng-time-object></uib-timepicker>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="mode" translate="patientemr.criticalcharts.mode.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.VentilatorModeId" name="mode">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.VentilatorMode | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="rate" translate="patientemr.criticalcharts.rate.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="rate" ng-model="item.Rate" ng-pattern="/^\d+$/"
                    placeholder="" required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="tv" translate="patientemr.criticalcharts.tv.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="tv" ng-model="item.TV" ng-pattern="/^\d+$/" placeholder=""
                    required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="mv" translate="patientemr.criticalcharts.mv.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="mv" ng-model="item.MV" ng-pattern="/^\d+$/" placeholder=""
                    required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="ps" translate="patientemr.criticalcharts.ps.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="ps" ng-model="item.PS" ng-pattern="/^\d+$/" placeholder=""
                    required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="peakpress"
                translate="patientemr.criticalcharts.peakpress.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="peakpress" ng-model="item.PeakPress" ng-pattern="/^\d+$/"
                    placeholder="" required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="peep" translate="patientemr.criticalcharts.peep.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="peep" ng-model="item.Peep" ng-pattern="/^\d+$/"
                    placeholder="" required uppercase>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="meanpress"
                translate="patientemr.criticalcharts.meanpress.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="meanpress" ng-model="item.MeanPress" placeholder=""
                    ng-keypress="numberonly($event)" required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="fio2" translate="patientemr.criticalcharts.fio2.lbl"></label>
            <div class="col-sm-8">
                <input type="text" class="form-control" name="fio2" ng-model="item.FIO2" placeholder="" required>
            </div>
            <div class="col-sm-2">
                <ui-select ng-model="item.FIO2PercentId" name="discount" ng-disabled="true">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.DiscountMode | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="issuction"
                translate="patientemr.criticalcharts.suction.lbl"></label>
            <div class="col-sm-12">
                <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsSuction">
                <!-- <input type="text" class="form-control" name="suction" ng-model="item.Suction" ng-pattern="/^\d+$/" placeholder=""
                    required> -->
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="posture"
                translate="patientemr.criticalcharts.posture.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="posture" ng-model="item.Posture" placeholder="" uppercase
                    required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="signatory"
                translate="patientemr.criticalcharts.signatory.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" ng-model="item.Signatory" ng-pattern="/^\d+$/" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="powerscore"
                translate="patientemr.criticalcharts.powerscore.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" ng-model="item.PowerScore" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="reason"
                translate="patientemr.criticalcharts.comments.lbl"></label>
            <div class="col-sm-12">
                <textarea rows="3" name="reason" ng-model="item.Comments" maxlength="4000"></textarea>
            </div>
        </div>
    </form>
</div>
<div class="">
    <div class="row">
        <div class="pull-right">
            <button type="button" class="draftbutton" translate="common.saveaction.lbl"
                ng-click="saveAndApprove()"></button>
            <!-- <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button> -->
        </div>
    </div>
</div>
