<div class="row">
    <div class="col-sm-8">
        <h4 class="mt0" translate="Bill Services"></h4>
    </div>
    <div class="col-sm-4">
        <div class="pull-right">
            <span class="drhms-billing-btn drhms-outstandingbill-btn" ng-click="doctor_dashboard()"
                uib-tooltip="{{'patientemr.mock.emrdashboard.lbl' | translate}}" tooltip-placement="bottom">
                <i class="fas fa-th-large" aria-hidden="true"></i>
            </span>

            <!-- <img class="imgsrc" src="app/img/main/check-list.png" ng-click="previousOrders()"
                        uib-tooltip="{{'PreviousOrders' | translate}}" tooltip-placement="bottom"
                        style="margin-top: -3px;width: 35px;">

                    <img class="imgsrc" src="app/img/main/appointment.png" ng-click="ipbillingprofiles()"
                        uib-tooltip="{{'Add New' | translate}}" tooltip-placement="bottom"
                        style="margin-top: -3px;width: 35px;"> -->

            <!-- <img class="imgsrc" src="app/img/main/speedometer.png" ng-click="doctor_dashboard()"
                        uib-tooltip="{{'patientemr.pmhxdashboard.doctordashboard.lbl' | translate}}"
                        tooltip-placement="bottom" style="margin-top: -3px;width: 35px;"> -->

            <!-- <img class="imgsrc" src="app/img/main/hospital.png" ng-click="currentpatient()"
                        uib-tooltip="{{'bedmanagement-grid.pagetitle.lbl' | translate}}" tooltip-placement="bottom"
                        style="margin-top: 3px;width: 29px;"> -->
        </div>
    </div>
</div>
<div class="row">
    <ippatientbanner patientid="currentcontext.pid" encounterid="currentcontext.id"></ippatientbanner>
</div>
<div class="col-sm-12" style="text-align: right;margin: 10px 0;">
    <div class="col-sm-3">
        <label class="col-sm-4" for="FromDate" translate="From Date"></label>
        <div class="col-sm-8">
            <div class="datepicker" id="datepicker">
                <input type="text" class="form-control" name="FromDate" ng-date-object
                    datetime-picker="{{dateTimePickerOptions.dateTimeFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="FromDatePopup = { opened: true }"
                    ng-change="getList()" is-open="FromDatePopup.opened" ng-model="currentfilter.FromDate"
                    required>
                <i class="fa fa-calendar"></i>
            </div>
        </div>
    </div>
    <div class="col-sm-3">
        <label class="col-sm-4" for="ToDate" translate="To Date"></label>
        <div class="col-sm-8">
            <div class="datepicker" id="datepicker">
                <input type="text" class="form-control" name="ToDate" ng-date-object
                    datetime-picker="{{dateTimePickerOptions.dateTimeFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="ToDatePopup = { opened: true }"
                    ng-change="getList()" is-open="ToDatePopup.opened" ng-model="currentfilter.ToDate"
                    required>
                <i class="fa fa-calendar"></i>
            </div>
        </div>
    </div>
    <span class="col-sm-6">
        <button class="draftbutton" ng-click="previousOrders()">
            Previous Orders</button>
        <button class="draftbutton" ng-click="ipbillingprofiles()">
            Add New
        </button>
        <button class="draftbutton" ng-click="ipbillingorders()">
            Add Lab Services
        </button>
    </span>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="row">
    <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
        items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
        ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
</div>
<div class="row">
    <table class="table table-bordered bordered table-striped table-condensed datatable ng-isolate-scope rz-table">
        <thead class="bg-subhead">
            <tr>
                <th id="billservice" class="col-sm-4" style="width: 35% !IMPORTANT;">
                    <span translate="billing.billing-details.itemname.lbl"></span>
                </th id="billservice">
                <th style="width: 13% !IMPORTANT;">
                    <span translate="billing.billing-details.qty.lbl"></span>
                </th>
                <th class="col-sm-2" style="width: 35% !IMPORTANT;">
                    <span translate="billing.billing-details.doctor.lbl"></span>
                </th id="billservice">
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="item in PatientBillDetails | filter: billingFilter">
                <td>
                    <autosearch itemid="item.ServiceId" iteminfo="item.SelectedItem" rowdata="item"
                        config="vm.serviceitemcontrolconfig" itemchange="getServiceItem($index, item)"
                        candisable="true">
                    </autosearch>
                </td>
                <td>
                    <input type="text" class="form-control" ng-model="item.Quantity" disabled>
                </td>
                <td>
                    <ui-select ng-model="item.DoctorId" ng-change="" name="" ng-disabled="true">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.Doctor | filter: { Text: $select.search }">
                            <span ng-bind-html="lookupitem.Title.Description | highlight: $select.search"></span>
                            <span ng-bind-html="lookupitem.Text | highlight: $select.search"></span>
                        </ui-select-choices>
                    </ui-select>
                </td>
                <!-- <td class=" " align="center">
                                    <span disabled>{{item.DoctorShare || 0 | displaycurrency}}</span>
                                </td>
                                <td>
                                    <span disabled>{{item.DiscountAmount || 0 | displaycurrency}}</span>
                                </td>
                                <td>
                                    <span disabled>{{item.NetAmount || 0 | displaycurrency}}</span>
                                    <input type="" value="{{amountConversion(item.NetAmount) || 0}}" class="inputbox form-control" disabled>
                                </td> -->

            </tr>
        </tbody>
    </table>
</div>
