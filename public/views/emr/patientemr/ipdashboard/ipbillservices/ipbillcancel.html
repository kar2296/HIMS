<style>
    .modal-dialog.modal-full {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .modal-content {
        width: 500px;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Do you want to cancel this bill?"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="backToList()">
        </div>
    </div>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-12">
            <textarea type="text" class="form-control" ng-model="currentfilter.CancelReason" placeholder="Reason" style="height: 100px !important;"></textarea>
        </div>

    </form>

</div>
<div class="row">
        <div class="pull-left">
            <button type="button" class="draftbutton" translate="No" ng-click="backToList()"></button>
        </div>
        <div class="pull-right">
            <button type="button" class="draftbutton" translate="Yes" ng-click="onCancelConfirmed()"></button>
        </div>
    </div>
