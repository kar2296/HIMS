<style>
    .contactinfo {
        font-size: 15px;
        color: crimson;
    }

    .block {
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
    }

    .surgery {
        color: crimson;
        font-size: 13px;
    }

    .staus {
        background: #b94a48;
        border: none;
    }

    .linkstyle {
        font-weight: 700;
        text-align: right;
    }

    .label {
        display: inline;
        padding: 3px;
        font-size: 100%;
        border-radius: 0;
        text-overflow: inherit;
    }

    .statusinfo {
        font-size: 13px;
    }

    .form-group {
        margin-bottom: 7px !important;
    }

    .sr-only {
        height: 22px !important;
    }

    .custom-grid-btn {
        width: 60px !important;
    }

    .page-header {
        margin: 0px !important;
    }

    .displaydate {
        color: #ca5dec;
        font-size: 14px;
        font-weight: 600;
    }

    b.text-highlightstatus.plain-text.ng-binding {
        background-color: seagreen;
        color: #fff;
        border-radius: 2px;
        font-size: 14px;
        padding: 2px;
    }

    .label {
        display: inline;
        padding: 3px;
        font-size: 82%;
        border-radius: 0;
        text-overflow: inherit;
    }

    a.text-white.btn.btn-schedule.btn-xs {
        background-color: #ce4e9e;
    }

    .type {
        color: blueviolet;
        font-weight: 800;
        font-size: 15px;
    }

    .priority {
        color: #ce4e9e;
        font-weight: 500;
        font-size: 14px;
    }

    .number {
        color: tomato;
        font-weight: 500;
        font-size: 16px;
    }

    .ui-grid-viewport {
        height: 495px!important;
    }

    @media screen and (max-width: 768px) and (orientation: portrait) {
        .layout-fixed .wrapper>section {
            margin-top: 41px !important;
        }
        .wrapper>.aside .aside-inner {
            padding-top: 58px !important;
        }
    }

    @media only screen and (max-width: 360px) {
        .patientstatus_search {
            display: none;
        }
    }

    /* .icon_home {
        width: 3%;
        float: right;
    }

    .icon_emrboard {
        width: 3%;
        float: right;
        margin-right: 1%;
    } */

    @media only screen and (max-width:414px) {
        #patientsearchheight .ui-grid-viewport {
            height: 346px !important;
            min-height: 377px;

        }
        .top-option {
            font-size: 13px;
        }
        .opt-selected {
            font-size: 13px;
        }
        .icon_bed {
            width: 6%;
        }
        .icon_home {
            width: 6%;
        }
    }

    @media screen and (max-width: 414px) and (orientation: portrait) {
        .layout-fixed .wrapper>section {
            margin-top: 60px !important;
        }
    }

    @media screen and (max-width: 736px) and (orientation: landscape) {
        .layout-fixed .wrapper>section {
            margin-top: 59px !important;
        }
    }

    @media screen and (max-width:1024px) {
        .control-label.filter-lbl.ng-scope {
            padding: 0px;
            margin: 0px;
        }
    }

    .patientsearchprofilebg .table-uigrid.ui-grid .ui-grid-cell {
        min-height: 52px !important;
        background: #fff;
        background: -moz-linear-gradient(top, #fff 0, #f3f3f3 50%, #ededed 100%, #fff 100%);
        background: -webkit-linear-gradient(top, #fff 0, #f3f3f3 50%, #ededed 100%, #fff 100%);
        background: linear-gradient(to bottom, #fff 0, #f3f3f3 50%, #ededed 100%, #fff 100%);
        -webkit-box-shadow: 7px 5px 15px -9px rgba(0, 0, 0, .75);
        -moz-box-shadow: 7px 5px 15px -9px rgba(0, 0, 0, .75);
        box-shadow: 7px 5px 15px -9px rgba(0, 0, 0, .75);
    }
    @media (min-height: 637px) and (min-width: 1200px){
        #patientsearchheight .ui-grid-viewport {
    height: 390px;
    min-height: 430px;
}}
    @media (min-height: 675px) and (min-width: 1360px){
        #patientsearchheight .ui-grid-viewport{
    height: 440px;
    min-height: 465px;
}}
@media (device-height:100vh) and (device-width:100vw){
    #patientsearchheight .ui-grid-viewport{
        min-height: 560px;
    }
}
</style>

<div class="row page-header sample">
    <div class="col-sm-6">
    <h4 class="mt0 col-sm-12" translate="otregister-list.pagetitle.lbl" style="width:60%;float:left;"></h4>
    </div>
    <div class="col-sm-6">
    <span ng-click="doctor_dashboard()">
        <img src="app/img/main/download.png" class="img-responsive icon_home" alt="home"  uib-tooltip=" Doctor Dashboard "
            tooltip-placement="bottom">
    </span>
    <span ng-click="patient_dashboard()">
        <img src="app/img/main/patdash.png" class="img-responsive icon_emrboard" alt="home"  uib-tooltip="Patient Dashboard"
            tooltip-placement="bottom">
    </span>
</div>
    <!-- <button class="btn-add" ng-click="addNewOrder()" uib-tooltip="{{ 'otregister-list.pagetitle.lbl' | translate }}"
        tooltip-placement="bottom">
        <i class="fa fa-plus" aria-hidden="true"></i>
        
    </button> -->
</div>

<div class="container-fluid patientsearchprofilebg" id="patientsearchheight">
    <div ui-grid="vm.gridConfig" class="table-uigrid height-control"></div>
    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
<script type="text/ng-template" id="otnotesTemplate.html">
    <div class="patientprofilebg">
        <div class="col-sm-12 block">
            <div class="ui-grid-cell-contents">
                <div class="col-sm-3">
                    <div>
                        <span class="displaydate"><displaydate datetime-val="row.entity.OTRegisteredOn"></displaydate></span>&nbsp;|&nbsp;
                        <span class="number">{{row.entity.OTIdentifier}}</span>
                    </div>
                    <div><span><b class="text-highlight5 plain-text">{{row.entity.Doctor.Title.Description}} {{row.entity.Doctor.FirstName}}
                        {{row.entity.Doctor.LastName}}&nbsp;</b></span> &nbsp;|&nbsp;<span class="surgery">{{row.entity.OrderFrom.DepartmentName}}</span></div>
                </div>
                <div class="col-sm-3">
                    <div style="margin-left: 22px;">
                        <span class="priority">{{row.entity.Procedure.ProcedureName}}&nbsp;|&nbsp;</span>
                        <span><b class="type">{{row.entity.OTRoom.RoomNo}} &nbsp;</b></span></div>
                        <div class="col-sm-3">
                            <div><span><b class="type">{{row.entity.ProcedureCategory.Description}} &nbsp;</b>&nbsp;|&nbsp;</span>
                                <span class="priority">{{row.entity.AnaesthesiaType.Description}}</span></div>
                        </div>
                </div>
                <div class="col-sm-3">
                    <div><span><b class="text-highlightstatus plain-text">{{row.entity.OTRegisterStatus.Description}} </div>
                </div>
                <div class="col-sm-3 ">
                    <button class="btn btn-default btn-xs ip_in" ng-click="grid.appScope.handleEvents('view',row)"
                    uib-tooltip="{{'View'}}" tooltip-placement="left"style="margin-top:12px;margin-left: 107px;">
                        <i class ="fa fa-chevron-right" aria-hidden="true"></i></button>
                </div>
            </div>
        </div>
    </div>
</script>
