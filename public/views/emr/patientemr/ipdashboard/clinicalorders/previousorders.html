<div class="row">
    <div class="col-sm-4" ng-hide="currentcontext.option=='currentvisits'">
        <label class="col-sm-4 col-md-4 col-lg-4 control-label filter-lbl"
            translate="patientemr.patientvital-list.filter_from.lbl"></label>
        <div class="col-sm-8 col-md-8 col-lg-8">
            <!-- <input type="text" class="form-control" name="from" ng-change="getList(tab)" ng-date-object
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="fromPopup = { opened: true }" is-open="fromPopup.opened" ng-model="currentfilter.From"> -->
            <div class="datepicker" id="datepicker">
                <input type="text" class="form-control" name="from" ng-change="getList(tab)" ng-date-object
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="fromPopup = { opened: true }"
                    is-open="fromPopup.opened" ng-model="currentfilter.From">
                <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
        </div>
    </div>
    <div class="col-sm-4" ng-hide="currentcontext.option=='currentvisits'">
        <label class="col-sm-4 col-md-4 col-lg-4 control-label filter-lbl"
            translate="patientemr.patientvital-list.filter_to.lbl"></label>
        <div class="col-sm-8 col-md-8 col-lg-8 custom_align">
            <div class="datepicker" id="datepicker">
                <input type="text" class="form-control" name="to" ng-change="getList()" ng-date-object
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="toPopup = { opened: true }"
                    is-open="toPopup.opened" ng-model="currentfilter.To">
                <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <div class="lisdrpctrl">
        <table class="table table-bordered bordered table-striped table-condensed datatable ng-isolate-scope rz-table">
            <thead class="bg-subhead">
                <tr>
                    <th class="cus-col tbl-header">
                        <span translate="patientemr.patientorder-list.select.lbl"></span>
                    </th>
                    <!-- <th class="cus-col tbl-header rxname"><span
                            translate="patientemr.patientorder-list.procedurecode.lbl"></span></th>
                    <th class="cus-col tbl-header rxname"><span
                            translate="patientemr.patientorder-list.procedurename.lbl"></span></th>
                    <th class="cus-col tbl-header"><span translate="patientemr.patientorder-list.quantity.lbl"></span>
                    </th> -->
                    <th class="cus-col tbl-header">
                        <span translate="patientemr.patientorder-list.ordernumber.lbl"></span>
                    </th>
                    <th class="cus-col tbl-header">
                        <span translate="patientemr.patientorder-list.date.lbl"></span>
                    </th>
                    <th class="cus-col tbl-header">
                        <span translate="patientemr.patientorder-list.doctor.lbl"></span>
                    </th>
                    <th class="cus-col tbl-header">
                        <span translate="patientemr.patientorder-list.department.lbl"></span>
                    </th>
                    <th class="cus-col tbl-header">
                        <span translate="patientemr.previousorder-list.status.lbl"></span>
                    </th>
                    <!-- <th class="cus-col tbl-header " ><span translate="common.actions_col.lbl"></span></th> -->
                </tr>
            </thead>
            <thead>
                <tr ng-repeat="item in items" ng-repeat="detail in item.PatientOrderDetails">
                    <td>
                        <button style="float: right;" type="button" class="drhms-billing-btn drhms-add-btn"
                            ng-click="toggleCanShowDetails(item)">
                            <i class="fa fa-plus" aria-hidden="true" ng-show="!item.CanShowDetails"></i>
                            <i class="fa fa-minus" aria-hidden="true" ng-show="item.CanShowDetails"></i>
                        </button>

                        <i class="fa fa-check select" aria-hidden="true" ng-click="loadOrderDatas(item)"></i>
                    </td>
                    <!-- <td class="cus-col">
                        <span><b class="plain-text">{{detail.TestCode}}</b></span>
                    </td>
                    <td class="cus-col">
                        <span><b class="plain-text">{{detail.TestName}}</b></span>
                    </td>
                    <td class="cus-col"><b class="plain-text">{{detail.Quantity}}</b></td> -->
                    <td class="cus-col">
                        <span>{{item.OrderNumber}}</span>
                    </td>
                    <td class="cus-col">
                        <ngformatdate datetime-val='item.OrderRequestDate'></ngformatdate>
                    </td>
                    <td class="cus-col doctor"><b class="plain-text1">
                            <displayuserlbl user="item.User"></displayuserlbl>
                        </b></td>
                    <td class="cus-col">{{item.OrderFrom.DepartmentName}}</td>
                    <td class="cus-col"><b style="color: red;">{{item.OrderStatus.DisplayName}}</b></td>
                </tr>
            </thead>
        </table>
        <table class="table table-hover table-responsive table-bordered custom-table">
            <tbody>
                <tr ng-repeat="item in items">
                    <td>
                        <table class="table table-hover table-responsive table-bordered custom-table details">
                            <thead class="bg-subhead" ng-show="item.CanShowDetails">
                                <tr>
                                    <td class="cus-col tbl-header rxname"><span
                                            translate="patientemr.patientorder-list.procedurecode.lbl"></span></td>
                                    <td class="cus-col tbl-header rxname"><span
                                            translate="patientemr.patientorder-list.procedurename.lbl"></span></td>
                                    <td class="cus-col tbl-header"><span
                                            translate="patientemr.patientorder-list.quantity.lbl"></span></td>
                                    <td class="cus-col tbl-header"><span
                                            translate="patientemr.patientorder-list.instructions.lbl"></span></td>

                                </tr>
                            </thead>
                            <tbody ng-show="item.CanShowDetails">
                                <tr ng-repeat="detail in item.PatientOrderDetails">
                                    <td class="cus-col rxname">
                                        <span><b class="plain-text">{{detail.TestCode}}</b></span>
                                    </td>
                                    <td class="cus-col rxname">
                                        <span><b class="plain-text">{{detail.TestName}}</b></span>
                                    </td>
                                    <td class="cus-col"><b class="plain-text">{{detail.Quantity}}</b></td>
                                    <!-- <td class="cus-col"><b class="plain-text">{{detail.ProcedureInstructions}}</b></td> -->
                                </tr>
                            </tbody>
                        </table>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <!-- <div class="panel-footer formactionbar">
        <div class="row">
            <div class="col-sm-12">

                </div>
                <div class="pull-right">

                        translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </div>
    </div> -->
</div>
