<style>
    .contactinfo {
        font-size: 15px;
        color: crimson;
    }

    .block {
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
    }

    .surgery {
        color: crimson;
        font-size: 13px;
    }

    .staus {
        background: #b94a48;
        border: none;
    }

    .linkstyle {
        font-weight: 700;
        text-align: right;
    }

    .label {
        display: inline;
        padding: 3px;
        font-size: 100%;
        border-radius: 0;
        text-overflow: inherit;
    }

    .statusinfo {
        font-size: 13px;
    }

    .form-group {
        margin-bottom: 7px !important;
    }

    .sr-only {
        height: 22px !important;
    }

    .custom-grid-btn {
        width: 60px !important;
    }

    .page-header {
        margin: 0px !important;
    }

    .displaydate {
        color: #ca5dec;
        font-size: 14px;
        font-weight: 600;
    }

    b.text-highlightstatus.plain-text.ng-binding {
        background-color: seagreen;
        color: #fff;
        border-radius: 2px;
        font-size: 14px;
        padding: 2px;
    }

    .label {
        display: inline;
        padding: 3px;
        font-size: 82%;
        border-radius: 0;
        text-overflow: inherit;
    }

    a.text-white.btn.btn-schedule.btn-xs {
        background-color: #ce4e9e;
    }

    .font {
        color: #b94a48;
    }

    .type {
        color: blueviolet;
        font-weight: 800;
        font-size: 15px;
    }

    .priority {
        color: orangered;
        font-weight: 500;
        font-size: 14px;
    }

    .number {
        color: teal;
        font-weight: 500;
        font-size: 16px;
    }

    .ui-grid-viewport {
        height: 495px!important;
    }

    @media screen and (max-width: 768px) and (orientation: portrait) {
      
        .wrapper>.aside .aside-inner {
            padding-top: 58px !important;
        }
    }

    @media only screen and (max-width: 360px) {
        .patientstatus_search {
            display: none;
        }
    }

    @media only screen and (max-width:414px) {
        #patientsearchheight .ui-grid-viewport {
            height: 346px !important;
            min-height: 377px;

        }
        .top-option {
            font-size: 13px;
        }
        .opt-selected {
            font-size: 13px;
        }
      
    }

    @media screen and (max-width: 414px) and (orientation: portrait) {
        .layout-fixed .wrapper>section {
            margin-top: 60px !important;
        }
    }

    @media screen and (max-width: 736px) and (orientation: landscape) {
        .layout-fixed .wrapper>section {
            margin-top: 59px !important;
        }
    }

    @media screen and (max-width:1024px) {
        .control-label.filter-lbl.ng-scope {
            padding: 0px;
            margin: 0px;
        }
    }

    .patientsearchprofilebg .table-uigrid.ui-grid .ui-grid-cell {
        min-height: 52px !important;
        background: #fff;
        background: -moz-linear-gradient(top, #fff 0, #f3f3f3 50%, #ededed 100%, #fff 100%);
        background: -webkit-linear-gradient(top, #fff 0, #f3f3f3 50%, #ededed 100%, #fff 100%);
        background: linear-gradient(to bottom, #fff 0, #f3f3f3 50%, #ededed 100%, #fff 100%);
        -webkit-box-shadow: 7px 5px 15px -9px rgba(0, 0, 0, .75);
        -moz-box-shadow: 7px 5px 15px -9px rgba(0, 0, 0, .75);
        box-shadow: 7px 5px 15px -9px rgba(0, 0, 0, .75);
    }
    @media (min-height: 637px) and (min-width: 1200px){
    #patientsearchheight .ui-grid-viewport {
    height: 390px !important;
    min-height: 387px;
}}
    @media (min-height: 675px) and (min-width: 1360px){
    #patientsearchheight .ui-grid-viewport {
    height: 440px;
    min-height: 427px;
}}
@media (device-height:100vh) and (device-width:100vw){
    #patientsearchheight .ui-grid-viewport{
        min-height: 516px;
    }
}
</style>

<div class="row page-header sample clearfix">
    <div class="col-xs-6 col-sm-7 col-md-6 col-lg-6">
    <h4 class="mt0 col-sm-12" translate="patientemr.pastvisit-list.pagetitle.lbl" style="width:60%;float:left;"></h4>
</div>
<div class="col-xs-6 col-sm-5 col-md-6 col-lg-6">
    <span ng-click="doctor_dashboard()">
        <img src="app/img/main/download.png" class="img-responsive icon_home" alt="home" uib-tooltip=" Doctor Dashboard " tooltip-placement="bottom">
    </span>
    <span ng-click="patient_dashboard()">
        <img src="app/img/main/patdash.png" class="img-responsive icon_emrboard" alt="home" uib-tooltip="Patient Dashboard" tooltip-placement="bottom">
    </span>
</div>
</div>

<div class="row filter-area">
    <div class="col-sm-12 clearfix">
        <div class="col-sm-5 col-md-7 col-lg-8"></div>
        <div class="col-sm-7 col-md-5 col-lg-4 text-right">
            <button type="button" ng-click="changeencountertype(-1)" class="btn btn-primary">All</button>
            <button type="button" ng-click="changeencountertype(1)" class="draftbutton">OP</button>
            <button type="button" ng-click="changeencountertype(2)" class="btn btn-info">IP</button>
            <button type="button" ng-click="changeencountertype(3)" class="btn btn-warning">A&E</button>
            <button class="patientstatus_search" type="button">
                <i class="fas fa-search"></i>
            </button>
        </div>
    </div>
</div>
<div class="container-fluid patientsearchprofilebg" id="patientsearchheight">
    <div ui-grid="vm.gridConfig" class="table-uigrid height-control emr_pastvisits"></div>
    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
<script type="text/ng-template" id="pastvisitTemplate.html">
    <div class="patientprofilebg">
        <div class="col-sm-12 block">
            <div class="ui-grid-cell-contents">
                <div class="col-sm-3">
                    <div>
                      <span class="displaydate"><displaydate datetime-val="row.entity.CreatedAt"></displaydate></span>
                    </div>
                    <div>
                        <span><b class="text-highlight5 plain-text">{{row.entity.Encounter.DoctorName}} &nbsp;</b></span> &nbsp;|&nbsp;
                        <span class="surgery">{{row.entity.Encounter.Department.DepartmentName}}</span>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div>
                        <span><b class="number">{{row.entity.Encounter.VisitIdentifier}} &nbsp;</b>&nbsp;|&nbsp;</span>
                        <span><b class="number">{{row.entity.Encounter.EncounterType.Description}} &nbsp;</b>&nbsp;|&nbsp;</span>
                        <span class="font"><strong>Reason :</strong></span>
                            <span class="priority">{{row.entity.Encounter.VisitReason.Remarks}}</span>
                    </div>
                    <div>
                        <span class="displaydate"><displaydate datetime-val="row.entity.Encounter.AdmissionDate"></displaydate></span>
                        <span ng-if="row.entity.Encounter.DischargeDate">to</span>
                        <span class="displaydate"><displaydate datetime-val="row.entity.Encounter.DischargeDate"></displaydate></span>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div>
                        <span>
                            <span class="label-success" ng-if="row.entity.Encounter.EncounterStatusId==1&&row.entity.Encounter.EncounterTypeId==1">Checked In</span>
                        </span>
                        <span>
                            <span class="label-danger" ng-if="row.entity.Encounter.EncounterStatusId==2&&row.entity.Encounter.EncounterTypeId==1">Checked Out</span>
                        </span>
                        <span><b class="text-highlightstatus plain-text" ng-if="row.entity.Encounter.EncounterTypeId==2">
                            {{row.entity.Encounter.AdmissionStatus.Description}}</b></span>
                     </div>
                </div>
                <div class="col-sm-3 pull-right">
                    <button class="btn btn-default btn-xs ip_in" ng-click="grid.appScope.handleEvents('encounter',row)"
                    uib-tooltip="{{'View'}}" tooltip-placement="left"style="margin-top:12px;margin-left: 107px;">
                        <i class ="fa fa-chevron-right" aria-hidden="true"></i></button>
                        <button class="btn btn-default btn-xs ip_in" ng-if="row.entity.Encounter.EncounterTypeId==1" ng-click="grid.appScope.handleEvents('reviewnote',row)"
                        uib-tooltip="{{'ReviewNotes'}}" tooltip-placement="left" style="margin-top:12px">
                                <i class="btn btn-warning btn-rounded fa fa-list" aria-hidden="true"></i></button>
                </div>
            </div>
        </div>
    </div>
</script>
