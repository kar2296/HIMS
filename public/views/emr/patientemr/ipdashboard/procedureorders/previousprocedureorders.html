<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Previous Orders"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <table class="table table-bordered bordered table-striped table-condensed datatable ng-isolate-scope rz-table">
        <thead class="bg-subhead">
            <tr>
                <th class="cus-col tbl-header">
                    <span translate="patientemr.patientorder-list.select.lbl"></span>
                </th>
                <!-- <th class="cus-col tbl-header rxname"><span
                        translate="patientemr.patientorder-list.procedurecode.lbl"></span></th>
                <th class="cus-col tbl-header rxname"><span
                        translate="patientemr.patientorder-list.procedurename.lbl"></span></th>
                <th class="cus-col tbl-header"><span translate="patientemr.patientorder-list.quantity.lbl"></span>
                </th>
                <th class="cus-col tbl-header"><span
                        translate="patientemr.patientorder-list.instructions.lbl"></span></th>
                <th class="cus-col tbl-header"> -->
                <span translate="patientemr.patientorder-list.ordernumber.lbl"></span></th>
                <th class="cus-col tbl-header">
                    <span translate="patientemr.patientorder-list.date.lbl"></span>
                </th>
                <th class="cus-col tbl-header">
                    <span translate="patientemr.patientorder-list.doctor.lbl"></span>
                </th>
                <th class="cus-col tbl-header">
                    <span translate="patientemr.patientorder-list.department.lbl"></span>
                </th>
                <th class="cus-col tbl-header">
                    <span translate="patientemr.previousorder-list.status.lbl"></span>
                </th>
                <!-- <td class="cus-col tbl-header"><span translate="common.actions_col.lbl"></span></td> -->
            </tr>
        </thead>
        <thead>
            <tr ng-repeat="item in items">
                <td>
                    <button style="float: right;" type="button" class="drhms-billing-btn drhms-add-btn"
                        ng-click="toggleCanShowDetails(item)">
                        <i class="fa fa-plus" aria-hidden="true" ng-show="!item.CanShowDetails"></i>
                        <i class="fa fa-minus" aria-hidden="true" ng-show="item.CanShowDetails"></i>
                    </button>

                    <i class="fa fa-check select" aria-hidden="true" ng-click="loadProcedureOrderDetails(item)"></i>
                </td>
                <!-- <td class="cus-col rxname">
                    <span><b class="plain-text">{{item.ProcedureCode}}</b></span>
                </td>
                <td class="cus-col rxname">
                    <span><b class="plain-text">{{item.ProcedureName}}</b></span>
                </td>
                <td class="cus-col"><b class="plain-text">{{item.Quantity}}</b></td>
                <td class="cus-col"><b class="plain-text">{{item.ProcedureInstructions}}</b></td> -->
                <td class="cus-col">

                    <span>{{item.OrderNumber}}</span>
                </td>
                <td class="cus-col">
                    <ngformatdate datetime-val='item.OrderRequestDate'></ngformatdate>
                </td>
                <td class="cus-col doctor"><b class="plain-text1">
                        <displayuserlbl user="item.User"></displayuserlbl>
                    </b></td>
                <td class="cus-col">{{item.OrderFrom.DepartmentName}}</td>
                <td class="cus-col"><b style="color: red;">{{item.OrderStatus.DisplayName}}</b></td>
            </tr>
        </thead>
    </table>
</div>
<div class="row">
    <table class="table table-hover table-responsive table-bordered custom-table">
        <tbody>
            <tr ng-repeat="item in items">
                <td>
                    <table class="table table-hover table-responsive table-bordered custom-table">
                        <thead class="bg-subhead" ng-show="item.CanShowDetails">
                            <tr>
                                <td class="cus-col tbl-header rxname"><span
                                        translate="patientemr.patientorder-list.procedurecode.lbl"></span></td>
                                <td class="cus-col tbl-header rxname"><span
                                        translate="patientemr.patientorder-list.procedurename.lbl"></span></td>
                                <td class="cus-col tbl-header"><span
                                        translate="patientemr.patientorder-list.quantity.lbl"></span></td>
                                <td class="cus-col tbl-header"><span
                                        translate="patientemr.patientorder-list.instructions.lbl"></span></td>

                            </tr>
                        </thead>
                        <thead ng-show="item.CanShowDetails">
                            <tr ng-repeat="detail in item.ProcedureOrderDetails">
                                <td class="cus-col rxname">
                                    <span><b class="plain-text">{{detail.ProcedureCode}}</b></span>
                                </td>
                                <td class="cus-col rxname">
                                    <span><b class="plain-text">{{detail.ProcedureName}}</b></span>
                                </td>
                                <td class="cus-col"><b class="plain-text">{{detail.Quantity}}</b></td>
                                <td class="cus-col"><b class="plain-text">{{detail.ProcedureInstructions}}</b></td>
                            </tr>
                        </thead>
                    </table>
                </td>
            </tr>
        </tbody>
    </table>
</div>
