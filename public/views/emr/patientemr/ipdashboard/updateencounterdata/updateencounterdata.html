<style>
    .modal-dialog.modal-lg {
        width: 38%;
    }

    .modal-content .panel-body {
        height: 123px;
        overflow: inherit;
    }
</style>
<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="mlc-list.updateencdata.lbl"></h4>
</div>
<div class="">
    <patientbanner patientid="currentcontext.pid"></patientbanner>
</div>
<div class="row">
    <div class="col-sm-12" style="margin-top: 10px;">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="panel-body form-panel outer_border">
                <div class="panel panel-default">
                    <div class="col-sm-12" style="margin-top:22px;">
                        <label class="col-sm-4 control-label" translate="mlc-list.ismlc.lbl"></label>
                        <div class="col-sm-5">
                            <input type="checkbox" class="custom-checkbox" name="ismlc" ng-model="item.IsMLC">
                        </div>
                    </div>
                    <div class="col-sm-12" style="margin-top:22px;">
                        <label class="col-sm-4 control-label" translate="mlc-list.isoscc.lbl"></label>
                        <div class="col-sm-5">
                            <input type="checkbox" class="custom-checkbox" name="isoscc" ng-model="item.IsOscc">
                        </div>
                    </div>
                </div>
            </div>

        </form>
    </div>
</div>
<div class="panel-footer formactionbar">
    <div class="pull-right">
        <button type="button" class="draftbutton" ng-click="UpdateEncData()" translate="common.saveaction.lbl"></button>
    </div>
</div>
