<style>
    .notestatus {
        color: #f00;
    }

    .text {
        color: #2719b9;
    }
    div#otsurgery_toogle{
        /* background: rgb(91, 132, 9); */
    }
</style>
<div class="panel {{currentcontext.paneltype}} portlet-panel" ng-controller="surgerydetailSectionController as vm">
    <div class="panel-heading portlet-panel-heading" id="otsurgery_toogle" ng-click="">
            <!-- <div class="col-xs-12 col-sm-5 col-md-5 col-lg-5 bg-round resp_img pull-right">
                    <img class="img-responsive dash_icons" ng-src="app/img/emr/M_30.png">
                </div>
                <h4 class="ip_dashbname">
        <strong translate="patientemr.ipdashboard.register.lbl"></strong></h4>
        <button class="emr_vmore info btn-md pull-right">View more...</button> -->
        <strong translate="patientemr.ipdashboard.register.lbl"></strong>
         <i class="fa fa-angle-down cust_downarrow otsurcommon_arrow" ></i>
        <i class="fa fa-angle-right cust_rightarrow otsur2common_arrow"></i> 
        <a ng-click="handleEvents('list')" class="pull-right lnk-portlet-header-action " uib-tooltip="{{ 'common.moredetailsaction.lbl' | translate }}"
            tooltip-placement="bottom">
            <i class="fa fa-info btn-circle" aria-hidden="true"></i>
        </a>
        <a ng-click="handleEvents('add')" class="pull-right lnk-portlet-header-action" uib-tooltip="{{ 'common.addnewaction.lbl' | translate }}"
            tooltip-placement="bottom">
            <!-- <i class="fa fa-plus btn-circle" aria-hidden="true"></i> -->
         </a>
    </div>
     <div class="panel-wrapper">
        <div class="panel-body portlet-panel-body otsurgery_toggle">
            <div class="table-responsive">
                <table class="table table-striped table-condensed">
                    <tbody>
                        <tr class="portlet-tr" ng-repeat="item in items | limitTo: currentcontext.recordcount">
                            <td>
                                <span class="lefcol3">
                                    <b class="text">{{item.OTStartedate|date:'dd:MM:yyyy'}} {{item.OTStartedate|date:'HH:mm'}}</b>&nbsp;&nbsp;&nbsp;
                                    <span class="lefcol6"> {{item.ChiefSurgeon.Title.Description}} {{item.ChiefSurgeon.FirstName}} {{item.ChiefSurgeon.LastName}}</span>&nbsp;&nbsp;&nbsp;
                                <span>&nbsp;&nbsp;&nbsp;</span>
                                <span class="text-highlight3 plain-text">{{item.Procedure.ProcedureName}}</span>
                                </span>
                            </td>
                            <!-- <td>
                                <a ng-click="handleEvents('edit', item)" class="lnk-portlet-action" uib-tooltip="{{ 'common.editaction.lbl' | translate }}"
                                    tooltip-placement="left">
                                    <i class="fa fa-eye btn btn-default btn-rounded" aria-hidden="true"></i>
                                </a>
                            </td> -->
                         </tr>
                    </tbody>
                </table>
            </div>
            <!-- <button type="button" class="btn btn-danger" style="position:relative;top:25px;padding:0px;float:right;">View more > ></button> -->
        </div>
    </div> 
</div>
<script>
        $(document).ready(function(){
         $(".otsurcommon_arrow").click(function(){
            
                $(".otsurgery_toggle").toggle("slow");
              
               });
           });
      
        </script>
        <style>
        .otsurgery_toggle{
            height:150px;
            width:100%;
        }
        .otsurcommon_arrow{
            float: right;
            padding-left: 47px;
            font-size:24px
        } 
      .otsur2common_arrow{display: none;}
        </style>
