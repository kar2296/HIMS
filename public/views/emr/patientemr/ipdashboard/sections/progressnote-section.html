<style>
    .notestatus {
        color: #f00;
    }

    .text {
        color: #2719b9;
    }
    div#progress_toogle{
        /* background: rgb(243, 156, 18); */
    }
</style>
<div class="panel {{currentcontext.paneltype}} portlet-panel" ng-controller="progressSectionController as vm">
    <div class="panel-heading portlet-panel-heading" id="progress_toogle" ng-click="">
            <!-- <div class="col-xs-12 col-sm-5 col-md-5 col-lg-5 bg-round resp_img pull-right">
                    <img class="img-responsive dash_icons" ng-src="app/img/emr/M_42.png">
                </div>
                <h4 class="ip_dashbname">
        <strong translate="patientemr.ipdashboard.progressnote.lbl"></strong> </h4>
        <button class="emr_vmore info btn-md pull-right">View more...</button> -->
        <strong translate="patientemr.ipdashboard.progressnote.lbl"></strong>
        <i class="fa fa-angle-down cust_downarrow progcommon_arrow" ></i>
        <i class="fa fa-angle-right cust_rightarrow prog2common_arrow"></i> 
        <a ng-click="handleEvents('list')" class="pull-right lnk-portlet-header-action " uib-tooltip="{{ 'common.moredetailsaction.lbl' | translate }}"
            tooltip-placement="bottom">
            <i class="fa fa-info btn-circle" aria-hidden="true"></i>
        </a>
        <a ng-click="handleEvents('add')" class="pull-right lnk-portlet-header-action" uib-tooltip="{{ 'common.addnewaction.lbl' | translate }}"
            tooltip-placement="bottom">
            <i class="fa fa-plus btn-circle" aria-hidden="true"></i>
        </a> 
    </div>
     <div class="panel-wrapper">
        <div class="panel-body portlet-panel-body progress_toggle">
            <div class="table-responsive">
                <table class="table table-striped table-condensed">
                    <tbody>
                        <tr class="portlet-tr" ng-repeat="item in items | limitTo: currentcontext.recordcount">
                            <td>
                                <span class="date">
                                    <b class="text">{{item.CapturedOn|date:'dd:MM:yyyy'}}{{item.CapturedOn|date:'HH:mm'}}</b>&nbsp;&nbsp;&nbsp;<span class="text-highlight3 plain-text">{{item.Note.Description}}</span>&nbsp;&nbsp;&nbsp;
                                <span class="text-highlight5 plain-text">{{item.CapturedUser.Title.Description}} {{item.CapturedUser.FirstName}} {{item.CapturedUser.LastName}}</span>&nbsp;&nbsp;&nbsp;
                                <span class="notestatus">{{item.NoteStatus.Description}}</span>
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!-- <button type="button" class="btn btn-danger" style="position:relative;top:25px;padding:0px;float:right;">View more > ></button>   -->
        </div>
    </div> 
</div>
<script>
        $(document).ready(function(){
         $(".progcommon_arrow").click(function(){
            
                $(".progress_toggle").toggle("slow");
              
               });
           });
      
        </script>
        <style>
        .progress_toggle{
            height:150px;
          
            width:100%;
        }
       
        .progcommon_arrow{
            float: right;
            padding-left: 47px;
            font-size:24px
        } 
      .prog2common_arrow{display: none;}
        </style>
