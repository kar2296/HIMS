<style>
    .modal-content .panel-body {
        overflow: inherit;
    }

    .modal-dialog.modal-lg #clinical {
        overflow: auto;
        min-height: min-content;
    }

    .modal-dialog.modal-lg #dropdownctrl>a>.label {
        left: 12px;
    }

    /* table.table.table-bordered.table-condensed.dropdown-menu {
    height: 397px !important;
    overflow-x: unset;
} */
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-12">
        <h4 class="mt0 col-sm-12 mb0" translate="patientemr.mrdfilesdownloadupload.pagetitle.lbl"></h4>
    </div>
</div>
<div class="col-sm-12 fullreg-profiles">
    <patientbanner patientid="currentcontext.pid"></patientbanner>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="panel panel-default bg-pattern">
                <!--<div class="panel-heading"><h3 class="panel-title" translate="lis.containertype.pnlcontainertype.lbl"></h3></div>!-->
                <div class="panel-body form-panel">
                    <div id="">
                        <div class="col-sm-12">
                            <!-- leftpanel -->
                            <div class="col-sm-6" style="height:221px;">
                                <div class="col-sm-12 well">
                                    <!-- <div class="form-group">
                                        <label class="col-sm-5 control-label" for="patientname" translate="patientemr.mrdfilesdownloadupload.patienname.lbl"></label>
                                        <div class="col-sm-7">
                                            <input type="text" class="form-control" name="patientname" ng-model="item.PatienName" placeholder="{{ 'patientemr.mrdfilesdownloadupload.patienname.lbl' | translate }}">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-5 control-label" for="mrn" translate="patientemr.mrdfilesdownloadupload.mrn.lbl"></label>
                                        <div class="col-sm-7">
                                            <input type="text" class="form-control" name="mrn" ng-model="item.MRN" placeholder="{{ 'patientemr.mrdfilesdownloadupload.mrn.lbl' | translate }}"
                                                required>
                                        </div>
                                    </div> -->
                                    <div class="form-group">
                                        <label class="col-sm-5 control-label" for="visitidentifier"
                                            translate="patientemr.mrdfilesdownloadupload.visitidentifier.lbl"></label>
                                        <div class="col-sm-7">
                                            <input type="text" class="form-control" name="visitidentifier"
                                                ng-model="item.VisitIdentifier"
                                                placeholder="{{ 'patientemr.mrdfilesdownloadupload.visitidentifier.lbl' | translate }}"
                                                required>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-5 control-label" for="enctype"
                                            translate="patientemr.mrdfilesdownloadupload.encountertype.lbl"></label>
                                        <div class="col-sm-7">
                                            <ui-select ng-model="item.EncounterTypeId" name="enctype"
                                                class="filter-combo" required>
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 8 : 0}}
                                                    <span ng-if="$select.selected.Text.length>8">...</span>
                                                </ui-select-match>
                                                <ui-select-choices
                                                    repeat="lookupitem.Id as lookupitem in lookup.EncounterType | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                                                    </div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-5 control-label"
                                            translate="patientemr.mrdfilesdownloadupload.admissiondate.lbl"></label>
                                        <div class="col-sm-7">
                                            <input type="text" class="form-control" name="admissiondate" ng-date-object
                                                datetime-picker="{{datePickerOptions.dateTimeFormat}}"
                                                placeholder="{{datePickerOptions.placeholder}}"
                                                ng-click="admissiondate = { opened: true }"
                                                is-open="admissiondate.opened" ng-model="item.AdmissionDate">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-5 control-label" for="documenttype"
                                            translate="patientemr.mrdfilesdownloadupload.mrdfiletype.lbl"></label>
                                        <div class="col-sm-7">
                                            <ui-select ng-model="item.MRDFileTypeId" name="documenttype"
                                                class="filter-combo" required>
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 8 : 0}}
                                                    <span ng-if="$select.selected.Text.length>8">...</span>
                                                </ui-select-match>
                                                <ui-select-choices
                                                    repeat="lookupitem.Id as lookupitem in lookup.MRDFileType | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                                                    </div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- Rightpanel -->
                            <div class="col-sm-6">
                                <div class="col-sm-12 well">
                                    <!-- <div class="form-group">
                                        <label class="col-sm-5 control-label" for="documenttype" translate="patientemr.mrdfilesdownloadupload.mrdfiletype.lbl"></label>
                                        <div class="col-sm-7">
                                            <ui-select ng-model="item.MRDFileTypeId" name="documenttype" class="filter-combo" required>
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 8 : 0}}
                                                    <span ng-if="$select.selected.Text.length>8">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.MRDFileType | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div> -->
                                    <div class="form-group">
                                        <label class="col-sm-5 control-label"
                                            translate="patientemr.mrdfilesdownloadupload.selectfile.lbl"></label>
                                        <div class="col-sm-7">
                                            <input type="file" ngf-select ng-model="currentcontext.file" name="file"
                                                ngf-max-size="200MB" ngf-change="fileSelected()" style="width:100%" />
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-5 control-label pdl0" for="name"
                                            translate="patientemr.mrdfilesdownloadupload.attachmentname.lbl"></label>
                                        <div class="col-sm-7">
                                            <input type="text" class="form-control" ng-disabled="true" name="name"
                                                ng-model="item.AttachmentName" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-5 control-label"
                                            translate="patientemr.mrdfilesdownloadupload.comments.lbl"></label>
                                        <div class="col-sm-7">
                                            <textarea name="textarea" ng-model="item.Comments"
                                                class="form-control notes-textarea"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div class="site-footer panel-footer">
    <button id="btnCancelForm" type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()">
        <i class="fa fa-angle-left"></i>&nbsp;&nbsp;
        <span translate="common.backaction.lbl"></span>
    </button>
    <div class="footer-right">
        <button type="button" class="draftbutton" ng-click="saveItem()" translate="common.saveaction.lbl"></button>
        <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()"
            translate="common.clearaction.lbl"></button>
    </div>
</div>
