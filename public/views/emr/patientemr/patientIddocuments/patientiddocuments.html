<style>
    .filter-area {
        border: 0px;
        box-shadow: none;
    }

    .item-logo-img {
        width: 200px !important;
        height: 150px !important;
        margin-top: 5px;
    }

    .addnew-text span {
        color: #000000 !important;
    }

    input[type="file"] {
        display: none;
    }

    .inputfile-1+label {
        color: #f1e5e6;
        /* width: 75%; */
        border-radius: 3px;
        margin: 1px 9px;
        cursor: pointer;
        background-color: #23b7e5;
    }

    .identity {
        font-size: 17px;
        font-style: initial;
        color: purple;
        font-weight: 500;
    }
</style>
<div id="patientidentitiesnewheight">
    <div id="mainresponsivetablecontrol">
        <div class="formRoot  bg-pattern">
            <div class="panel-body form-panel col-sm-12">
                <div class="col-sm-12">
                    <div ng-repeat="item in vm.items">
                        <div class="identity">
                            <span>{{item.PatientIdentityType.Description}}</span>&nbsp;({{item.IDNumber}}) &nbsp;
                        </div>
                        <div class="row">
                            <div class="col-sm-4" style="width: 38.333333%;margin-left: 30px;margin-bottom: 14px;">
                                <img class="item-logo-img" ng-show="!!currentcontext.file" ngf-thumbnail="currentcontext.file" />
                                <img class="item-logo-img" ng-show="!currentcontext.file && item.ImagePath" data-ng-src="data:image/png;base64,{{currentcontext.Photo}}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="fooder-bgs">
        <div class="row ">
        </div>
    </div>
</div>
