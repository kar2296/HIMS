<div class=" container-fluid " id="patientauditlogheight">
    <div class="table-uigrid table-uigrid-tab bg-pattern">
        <div class="col-md-12 " id="mainresponsivetablecontrol">
           <h3 class="text-center">Conming Soon AOE</h3>
        </div>
    </div>
    <div class="fooder-bgs">
        <div class=" ">
            <div class="col-sm-12">
                <div class="col-sm-4 col-md-4">
                    <div class="pull-left">
                        <button type="button" class="btn pyr-color10 btn-sm" ng-if="canUpdatePatientEMR()" ng-click="addNewFull()"><i class="fa fa-angle-left" aria-hidden="true" ></i>&nbsp;&nbsp;<span class="btn-fontsize"  translate="common.backaction.lbl"></span></button>
                        <button id="btnSaveInactive" ng-if="canUpdatePatientEMR()" type="button" class="btn btn-primary btn-sm" translate="common.saveinactive-action.lbl" ng-click="saveAndInactive()"></button>
                    </div>
                </div>
                <div class="col-sm-8 col-md-8">
                    <div class="pull-right">
                        <button type="button"  class="draftbutton" ng-click="print()" translate="common.printaction.lbl"></button>
                        <button id="btnSave" ng-if="canUpdatePatientEMR()" type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
                        <button id="btnSaveApprove" type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveactivate-action.lbl"
                          ng-if="canUpdatePatientEMR()"  ng-click="saveAndApprove()"></button>
                        <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                        <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
