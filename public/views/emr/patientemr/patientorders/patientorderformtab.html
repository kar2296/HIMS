<style>
    .nav > li.disabled > a:hover,
    .nav > li.disabled > a:focus {
        color: #000000 !important;
        text-decoration: none;
        background-color: #3c5a76;
        cursor: not-allowed;
    }
    
    .nav-tabs > li.active > a,
    .nav-tabs > li.active > a:hover {
        color: #000000 !important;
        border-bottom-color: #fff;
        background-color: #3c5a76 !important;
    }
    .nav-tabs > li > a  {
    padding: 4px 15px; 
 }
</style> 
<div id="patientorderform" class="tabsizetopcontroller">
<div class="row page-header" >
    <div class="col-sm-12">
        <div class="col-sm-5 col-md-5">
          <h4 class="page-header mt0" translate="patientemr.patientorder-form.pagetitle.lbl"></h4>
        </div>
        <div class="col-sm-7 col-md-7 ">
            <div class="pull-right">
        <button type="button"  class="btn btn-success btn-xs" ng-click="" translate="patientemr.patientorder-form.pendingorders.lbl"></button>
        <button type="button"  class="text-white btn adm-color7  btn-xs" ng-click="previousorders()" translate="patientemr.patientorder-form.previousorders.lbl"></button>
        <button type="button"  class=" text-white btn dem-color4  btn-xs hidden-sm" ng-click="patientallergy()" translate="patientemr.patientprescription-list.allergies.lbl"></button>
        <button type="button"  class=" text-white btn prv-color12 btn-xs hidden-sm" ng-click="vital()" translate="patientemr.patientprescription-list.vitals.lbl"></button>
        <button class="btn bt-color2 btn-xs" ng-if="canUpdatePatientEMR()" ng-click="addNewOrder()"   uib-tooltip="{{ 'patientemr.patientorder-form.addmoreorders.lbl' | translate }}" tooltip-placement="bottom">
               <i class="fa fa-plus" aria-hidden="true"></i><strong class="btn-fontsize ng-scope" translate="common.addaction.lbl"><span class="ng-scope">Add New</span></strong>
        </button>
        
            <!--<button class="btn btn-sm"><i class="glyphicon glyphicon-search"></i>
                        </button>  -->
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-sm-12">
        <uib-tabset active="active">
            <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)" disable="tab.canDisable">
            </uib-tab>
        </uib-tabset>

        <div ui-view></div>
    </div>
</div>
</div>
