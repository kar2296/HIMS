<style>
    .priority {
        background-color: rgba(241, 208, 63, 0.34);
    }

    .icon_emrboard {
        width: 5%;
        float: right;
        margin-right: 1%;
    }

    .icon_home {
        width: 5%;
        float: right;
    }

    @media (min-height: 637px) and (min-width: 1200px) {
        #patientsearchheight .ui-grid-viewport {
            height: 388px !important;
            min-height: 420px;
        }
    }

    @media (min-height: 675px) and (min-width: 1360px) {
        #patientsearchheight .ui-grid-viewport {
            height: 440px;
            min-height: 447px;
        }
    }

    @media (device-height:100vh) and (device-width:100vw) {
        #patientsearchheight .ui-grid-viewport {
            min-height: 520px;
        }
    }

    .nopad {
        padding: 0px;
    }
</style>
<div id="prescriptionpagecontrol">
    <div class="row page-header">
        <div class="col-sm-12">
            <div class="col-sm-6">
                <h4 class="page-header mt0" translate="patientemr.patientorder-list.pagetitle.lbl"></h4>
            </div>
            <div class="col-sm-6">
                <div class="filters">
                    <div class="search">

                            ng-model="currentfilter.patient" translate
                            translate-attr-placeholder="patientemr.patientorder-list.filter_patient.lbl">
                        <i class="fas fa-search" aria-hidden="true"></i>
                    </div>
                    <!-- <button class="btn bt-color3 btn-xs pull-right btn-filter" ng-click="openAdvancedFilter()" uib-tooltip="{{'clinicalmaster.serviceitem-list.filter-tooltip.lbl' | translate }}"

                    <span translate="clinicalmaster.serviceitem-list.filter.lbl"></span>
                </button> -->

                        tooltip-placement="bottom">
                        <i class="fa fa-plus" aria-hidden="true"></i>
                        <!--  -->
                    </button>

                </div>
            </div>
        </div>
    </div>
    <table id="bannerdetails">
        <tr>
            <td translate="patientemr.patientorder-list.filter_priority.lbl"></td>
            <td> <ui-select ng-model="currentfilter.orderpriorityid" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.OrderPriority | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select></td>
            <td translate="patientemr.patientorder-form.orderdateandtime.lbl"></td>
            <td>
                <input type="text" class="form-control" ng-disabled="item.isAdmitted" name="admissiondate"
                    ng-change="getList()" ng-date-object datepicker-options="datePickerOptions"
                    show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="OrderDateDatePopup = { opened: true }"
                    is-open="OrderDateDatePopup.opened" ng-model="currentfilter.OrderDate" tabindex="-1">
            </td>
            <td translate="patientemr.patientorder-list.filter_status.lbl"></td>
            <td>
                <ui-select ng-model="currentfilter.orderstatusid" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.OrderStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </td>
        </tr>
    </table>
