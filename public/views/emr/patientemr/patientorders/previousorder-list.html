<style>
    .container-fluid {
        margin-left: 0px;
        margin-right: 0px;
        margin-bottom: 0px;
        background-image: url(app/img/bg-body.jpg);
        background-repeat: repeat;
    }
     .modal-header {
        padding: 9px 10px;
        background-color: #597a9a;
        color: #fff;
    }
   
    .custom-modal-header {
        margin-bottom: 10px  !important;
    }
    .panel-footer {
        padding: 2px 15px !important;;
    }
    .modal-content{
        height : 500px !important;
    }
    
    .modal-lg {
        width: 1200px !important;
    }
    
    .cus-col {
        width : 120px !important;
        padding-left : 3px !important;

    }
    .custom-table {
        margin-bottom: 0px !important;
    }
</style>
<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="patientemr.previousorder-list.pagetitle.lbl"></h4>
</div>
    
<div class="col-sm-12">    
    <div class="table-responsive"   id="mainresponsivetablecontrol" style="height:400px;">
	    <table class="table table-hover table-responsive table-bordered custom-table">
            <thead class="bg-subhead">
                <tr>
                    <td class="cus-col tbl-header"><span translate="patientemr.previousorder-list.number.lbl"></span></td>
                    <td class="cus-col tbl-header"><span translate="patientemr.previousorder-list.ordereddate.lbl"></span></td>
                    <td class="cus-col tbl-header"><span translate="patientemr.previousorder-list.ordertype.lbl"></span></td>
                    <td class="cus-col tbl-header rxname"><span translate="patientemr.previousorder-list.testnames.lbl"></span></td>
                    <td class="cus-col tbl-header"><span translate="patientemr.previousorder-list.priority.lbl"></span></td>
                    <td class="cus-col tbl-header doctor"><span translate="patientemr.previousorder-list.orderedby.lbl"></span></td>
                    <td class="cus-col tbl-header"><span translate="patientemr.previousorder-list.orderto.lbl"></span></td>
                    <td class="cus-col tbl-header"><span translate="patientemr.previousorder-list.status.lbl"></span></td>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="item in items">
                    <td colspan="9">
                        <table class="table table-hover table-responsive table-bordered custom-table">
                            <thead>
                                <tr>
                                    <td class="cus-col ">
                                        <button class="btn btn-default btn-xs" style="float: right;" ng-click="toggleCanShowDetails(item)">
                                            <i class="fa fa-plus" aria-hidden="true" ng-show="!item.CanShowDetails"></i>
                                            <i class="fa fa-minus" aria-hidden="true" ng-show="item.CanShowDetails"></i>
                                        </button>
                                        <span>{{item.OrderNumber}}</span>
                                    </td>
                                    <td class="cus-col " ><ngformatdate datetime-val='item.OrderRequestDate'></ngformatdate></td>
                                    <td class="cus-col"><span>{{item.TESTMASTERTYP.Description}}</span></td>
                                    <td class="cus-col rxname"></td>
                                    <td class="cus-col " ><b class="text-highlight5 plain-text">{{item.OrderPriority.Description}}</b></td>
                                    <td class="cus-col doctor"><b class="plain-text1"><displayuserlbl user="item.User"></displayuserlbl></b></td>
                                    <td class="cus-col " >{{item.OrderTo.DepartmentName}}</td>
                                    <td class="cus-col " ><b class="text-highlight8 plain-text">{{item.OrderStatus.DisplayName}}</b></td>
                                    </td>
                                </tr>
                            </thead>
                            <tbody ng-show="item.CanShowDetails">
                                <tr ng-repeat="detail in item.PatientOrderDetails">
                                        <td class="cus-col pno"></td>
                                        <td class="cus-col"></td>
                                        <td class="cus-col"></td>
                                        <td class="cus-col rxname">
                                            <span>{{detail.TestName}}</span>
                                        </td>
                                        <td class="cus-col " ><b class="text-highlight5 plain-text">{{detail.OrderPriority.Description}}</b></td>
                                        <td class="cus-col doctor"><b class="plain-text1"><displayuserlbl user="item.User"></displayuserlbl></b></td>
                                        <td class="cus-col " >{{item.OrderTo.DepartmentName}}</td>
                                        <td class="cus-col " ><b class="text-highlight8 plain-text">{{item.OrderStatus.Description}}</b></td>
                                    </tr> 
                            </tbody>
                        </table>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="fooder-bgs">
        <div class="row ">
            <div class="col-sm-12">
                <div class="pull-left">
                   
                </div>
                <div class="pull-right">
                   <button id="btnCancelForm" type="button" class="draftbutton" ng-click="cancelCallback()" translate="common.cancelaction.lbl"></button>						
                </div>
            </div>
        </div>
    </div>		
</div>
