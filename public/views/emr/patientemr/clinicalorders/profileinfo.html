<style>
    .primary {
        color: white;
        background: #23B7E5;
        border-radius: 3px
    }
    
    .patientprofile-img {
        width: 70px !important;
        height: 70px !important;
    }
    
    .panel-body .well {
        height: 586px;
        width: 869px;
    }
    /* .col-sm-6 {
        width: 30%;
    } */
    
    .fullreg-profiles2 {
        min-height: 22px;
        color: #fff;
        background: -moz-linear-gradient(top, #fff 0, #f3f3f3 50%, #ededed 100%, #fff 100%);
        -moz-box-shadow: 7px 5px 15px -9px rgba(0, 0, 0, .75);
        box-shadow: 7px 5px 15px -9px rgba(0, 0, 0, .75);
        background: url(app/img/header-bg.jpg) repeat-x left top;
    }
    /* .cus-col {
        width: 120px !important;
        padding-left: 3px !important;
    } */
    
    .popup_content .col-sm-12 {
        padding: 6px;
    }
    
    .outer_border {
        border: 1px solid;
        box-shadow: 2px 11px 19px #888888;
    }
    /* .col-sm-4{border-right:1px solid;} */
    
    .outer_border .col-sm-12 {
        border-bottom: 1px solid lightgray;
    }
    
    .col-sm-6.testname {
        color: #131314;
        font-weight: 500;
        font-size: 13px;
    }
</style>

<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <h4 class="modal-title custom-modal-title col-sm-10"> {{item.Name}}-({{item.Code}})</h4>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="backToList()">
        </div>
        <!-- <button id="btnCancelForm" style="float: right;" type="button" class="draftbutton" ng-click="backToList()" translate="X"></button> -->
    </div>
</div>


<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div>
                <div class="panel panel-default">
                    <div class="col-sm-12 popup_content">
                        <div class="col-sm-12">
                            <div class="col-sm-12">
                                <b>Analyte(s)</b>
                            </div>
                            <div class="col-sm-12 testname" ng-repeat="item in testanalyte" ng-if="item.TestAnalyteName==null">{{item.Analytemaster.Name}}({{item.Analytemaster.Code}})
                            </div>
                            <div class="col-sm-12 testname" ng-repeat="item in testanalyte;" ng-if="item.TestAnalyteName!=null">{{item.TestAnalyteName.Name}}({{item.TestAnalyteName.Code}})
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
