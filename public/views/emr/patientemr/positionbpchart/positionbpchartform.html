<style>
    .modal-lg {
        width: 1000px;
    }

    .panel-body {
        padding: 15px;
        margin-left: 0px;
        margin-top: -53px;
        margin-right: 0px;
        margin-bottom: 0px;
        background-image: url(app/img/bg-body.jpg);
        background-repeat: repeat;
        overflow: auto;
    }

    .modal-content .panel-body {
        overflow: inherit;
    }

    .col-sm-2 {
        width: 25.666667%;
    }

    .well {
        min-height: 20px;
        padding: 19px;
        margin-bottom: 0px;
        border: 1px solid #ededed;
        border-radius: 4px;
        background: rgb(233, 246, 253);
        /* Old browsers */
        background: -moz-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* FF3.6-15 */
        background: -webkit-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, rgb(250, 250, 250) 0%, rgb(247, 252, 253) 100%);
        /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid: DXImageTransform.Microsoft.gradient( startColorstr='#e9f6fd', endColorstr='#d3eefb', GradientType=0);
        /* IE6-9 */
        box-shadow: 4px 2px 13px -7px rgba(0, 0, 0, 0.75);
    }

    /* .formactionbar {
        padding: 5px 15px;
        height: 40px;
        background-color: #ccecf5;
    } */

    .custom-modal-header {
        margin-bottom: 10px;
        background-color: #597a9a;
        color: #fff;
    }

    .modal-content {
        -webkit-box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        box-shadow: -1px 3px 20px 7px rgba(249, 244, 244, 0.5);
    }

    .modal-header {
        padding: 4px 10px;
        border-bottom: 1px solid #e5e5e5;
    }

    .params {
        text-align: center;
        width: 100px;
        color: teal;
        font-size: 15px;
    }

    .arms {
        text-align: center;
        color: tomato !important;
        font-weight: 700;
        font-style: italic;
        font-size: 16px;
    }

    .tabhead {
        text-align: center;
        color: blueviolet !important;
        font-size: 14px;
        font-weight: 700;
    }

    td.form-group.uib-time.minutes {
        border: unset !important;
    }

    td.uib-separator {
        border: unset !important;
    }

    td.form-group.uib-time.hours {
        border: unset !important;
    }

    td.form-group.uib-time.hours>input {
        width: 53px;
        border: 0.9px dashed !important;
    }

    td.form-group.uib-time.minutes>input {
        width: 58px;
        border: 0.9px dashed;
    }
    td>span {
    display: flex;
}
input.form-control {
    width: 100%;
}
.custom-popup-wrapper {
    position: relative;
    right: 0;
}
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-12 ">
        <div class="col-sm-6">
            <h4 class="modal-title custom-modal-title" translate="Manage Position BP Chart"></h4>
        </div>
        <div class="col-sm-6">
            <button type="button" class="btn btn-danger btn-sm pull-right" translate="x" ng-click="cancelCallback()"></button>
        </div>
    </div>

</div>
