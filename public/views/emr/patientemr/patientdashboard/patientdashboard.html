<style>
    #workorder {
        min-height: auto;
    }
    
    .tab {
        float: left;
        /* border: 1px solid #ccc; */
        /* background-color: #f4f4f4; */
        box-shadow: rgb(230 218 218) 0px 4px 12px;
        width: 30%;
        padding: 10px;
        overflow: auto;
        height: 100vh;
        border-radius: 10px;
        margin: 3px;
    }
    /* .tab button {
        background: #fff;
        color: #000000;
        border: 1px solid;
        width: 100%;
        display: flex;
        padding: 10px 4px;
        margin-bottom: 5px;
        border-radius: 3px;
        font-size: 12px;
        justify-content: space-between;
        align-items: center;
    } */
    
    .tab button {
        background: #f1f3f4;
        color: #000000;
        border: 0;
        border-right: 3px solid;
        border-left: 3px solid;
        border-radius: 0px 20px 0px 20px !important;
        width: 100%;
        display: flex;
        padding: 10px 4px;
        margin-bottom: 5px;
        border-radius: 0px;
        font-size: 12px;
        justify-content: space-between;
        align-items: center;
    }
    /* Change background color of buttons on hover */
    
    .tab button:hover {
        background-color: #5c6bc0;
        color: #fff;
    }
    /* Create an active/current "tab button" class */
    
    .tab button.active {
        background-color: #1d6090;
        color: #fff;
    }
    /* Style the tab content */
    
    .tabcontent {
        float: left;
        padding: 0px 10px;
        border-radius: 10px;
        width: 68%;
        box-shadow: rgb(230 218 218) 0px 4px 12px;
        border-left: none;
        overflow: auto;
        height: 100vh;
        margin: 3px;
    }
    
    .emr_labresults {
        height: 100vh;
        overflow: auto;
    }
    
    #patient_res td,
    th {
        /* border: none !important; */
        border-bottom: 1px solid #ccc !important;
    }
    
    .lbl-test {
        text-transform: uppercase;
        color: #c70808 !important;
    }
    
    .dr-name {
        font-weight: 400;
    }
    
    .mb-5 {
        margin-bottom: 50px;
    }
    
     ::-webkit-scrollbar {
        width: 3px;
    }
    
    .pull-right.footer_reg_align {
        margin: 14px 0;
    }
    
    .fooder-bgs .pull-right {
        margin-top: 10px;
    }
    
    .label-name {
        padding-left: 14px;
        line-height: 3;
        color: #F44336 !important;
        font-weight: 500 !important;
    }
</style>

<div class="tab" style="margin-top: 16px;">
    <div ng-repeat="item in ConsultList">
        <button class="tablinks" ng-click="getCurrentConsultation(item)" id="defaultOpen">
            <div>
                <displaydate datetime-val='item.CreatedAt'></displaydate>
            </div>
            <div>{{item.Encounter.VisitReason.Remarks}}</div>
            <!-- <div><span class="dr-name">{{item.Encounter.DoctorName}} / {{item.ProfileMaster.Name}}</span>
            </div> -->
            <div ng-if="currentfilter.ProfileId != 7"><span class="dr-name">{{item.Doc.Title.Description}}
                    {{item.Doc.FirstName}} {{item.Doc.LastName}} / {{item.ProfileMaster.Name}}</span>
            </div>
            <div ng-if="currentfilter.ProfileId == 7"><span class="dr-name">{{item.Doctor.Title.Description}}
                    {{item.Doctor.FirstName}} {{item.Doctor.LastName}} / {{item.Department.DepartmentName}}</span>
            </div>
            <div>
                <span ng-if="item.ProgressNoteStatusId==1">{{item.CreatedUser.Title.Description}}
                    {{item.CreatedUser.FirstName}} {{item.CreatedUser.LastName}}</span>
                <span ng-if="item.ProgressNoteStatusId==2">{{item.ApprovedUser.Title.Description}}
                    {{item.ApprovedUser.FirstName}} {{item.ApprovedUser.LastName}}</span>
                <span ng-show="currentfilter.ProfileId == 7">{{item.AprovedUser.Title.Description}}
                    {{item.AprovedUser.FirstName}} {{item.AprovedUser.LastName}}</span>
            </div>
        </button>
    </div>
</div>

<script type="text/ng-template" id="cn-prescription-section.html">

            <h4 class="control-label section-lable pdl15">
                <span>Prescription</span>
            </h4>
        </div>
    </div>
    <div ng-if="sectionData.prescriptions.length > 0" ng-repeat="item in sectionData.prescriptions">
        <div class="row innerdata" style="margin-left: 15px !important;">
            <!-- <div class="col-sm-3 fontpink">
                <ngformatdate date-val='item.PrescriptionDate'></ngformatdate>
            </div> -->
            <table class="table table-responsive table-bordered innerdata" id="prescriptiontable">
                <thead>
                    <tr>
                        <th class="col-sm-2 lefcol8">Drugs</th>
                        <th class="col-sm-2 lefcol8">Dosage</th>
                        <th class="col-sm-2 lefcol8">Route</th>
                        <th class="col-sm-2 lefcol8">Frequency</th>
                        <th class="col-sm-2 lefcol8">Duration</th>
                        <th class="col-sm-2 lefcol8">Drug Instruction</th>
                        <th class="col-sm-2 lefcol8">Stat</th>
                        <th class="col-sm-2 lefcol8">Notes</th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="detail in item.PrescriptionDetails">
                        <td class="col-sm-4"><span class="lefcol12">{{detail.DrugName}}({{detail.DrugCode}})</span></br>
                            <span class="genclass">{{detail.GenericMaster.GenericName}}</span></td>
                        <td class="col-sm-1"><span class="lefcol2">{{detail.Dosage}}</span></td>
                        <td class="col-sm-2"><span class="lefcol2">{{detail.Morning}}&nbsp;-&nbsp;{{detail.Noon}}&nbsp;-&nbsp;{{detail.Night}}&nbsp;</span></td>
                        <td class="col-sm-2"><span class="lefcol2">{{detail.Duration}} {{detail.DurationPeriod.Description}}</span></td>
                        <td class="col-sm-2"><span class="lefcol2">{{detail.DrugInstruction.Description}}</span></td>
                        <td class="col-sm-2"><span class="lefcol2" ng-if="detail.STAT">Yes</span>
                            <span class="lefcol2" ng-if="!detail.STAT">No</span></td>
                        <td class="col-sm-2"><span class="lefcol2">{{detail.Notes}}</span></td>
                    </tr>
                </tbody>
            </table>
            <div class="col-sm-12" ng-if="sectionData.prescriptions[0].Diagnosis">
                <div class="col-sm-3 lefcol1 innerdata 4x no-pad">Diagnosis</div>
                <div style="" class="col-sm-9">{{item.Diagnosis}}</div>
            </div>
            <div class="col-sm-12" ng-if="sectionData.prescriptions[0].Comments">
                <div class="col-sm-3 lefcol1 innerdata 4x no-pad">Advice/Instrunction</div>
                <div style="" class="col-sm-9">{{item.Comments}}</div>
            </div>
            <div class="col-sm-12" ng-if="sectionData.prescriptions[0].ReviewDate">
                <div class="col-sm-3 lefcol1 innerdata 4x no-pad">Review Date</div>
                <div style="" class="col-sm-9">
                    <ngformatdate date-val='item.ReviewDate'></ngformatdate>
                </div>
            </div>
            <div class="col-sm-12" ng-if="sectionData.prescriptions[0].Physiotheraphy">
                <div class="col-sm-3 lefcol1 innerdata 4x no-pad">Physiotheraphy</div>
                <div style="" class="col-sm-9">{{item.Physiotheraphy}}</div>
            </div>
        </div>
    </div>
