<style>
    div#surgical_toogle {
    /* background: #076d6d; */
}
</style>
<div class="panel {{currentcontext.paneltype}} portlet-panel" ng-controller="surgicalSectionController as vm">
    <div class="panel-heading portlet-panel-heading" id="surgical_toogle">
            <!-- <div class="col-xs-12 col-sm-5 col-md-5 col-lg-5 bg-round resp_img pull-right">
                    <img class="img-responsive dash_icons" ng-src="app/img/emr/M_48.png">
                </div>
                <h4 class="ip_dashbname">
        <strong translate="patientemr.patientdashboard.surgicals.lbl"></strong>  </h4>
        <button class="emr_vmore info btn-md pull-right">View more...</button> -->
        <strong translate="patientemr.patientdashboard.surgicals.lbl"></strong> 
         <!-- <button class="emr_vmore info btn-md pull-right">View more...</button> -->
        <i class="fa fa-angle-down cust_downarrow psurcommon_arrow" ></i>
        <i class="fa fa-angle-right cust_rightarrow psur2common_arrow"></i>
       <a ng-click="handleEvents('list')" class="pull-right lnk-portlet-header-action "   uib-tooltip="{{ 'common.moredetailsaction.lbl' | translate }}" tooltip-placement="top">
            <i class="fa fa-info btn-circle" aria-hidden="true"></i>
        </a>
        <a  ng-click="handleEvents('add')" class="pull-right lnk-portlet-header-action"   uib-tooltip="{{ 'common.addnewaction.lbl' | translate }}" tooltip-placement="top">
            <i class="fa fa-plus btn-circle" aria-hidden="true"></i>
        </a>    
    </div>
    <div class="panel-wrapper">
        <div class="panel-body portlet-panel-body surgical_toggle">
            <div class="table-responsive">
            <table class="table table-striped table-condensed">
                <tbody>
                    <tr class="portlet-tr" ng-repeat="item in items | limitTo: currentcontext.recordcount"> 
                        <td class="lefcol1">{{item.ProcedureType.Description}}</td>
                        <td class="lefcol2">{{item.Procedure.ProcedureName}}</td>
                        <td class="lefcol3">
                            <ngformatdate date-val='item.PerformedDate'></ngformatdate>
                        </td>
                        <!-- <td class="td-action">
                            <a ng-click="handleEvents('edit', item)" class="lnk-portlet-action"  uib-tooltip="{{ 'common.editaction.lbl' | translate }}" tooltip-placement="left" >
                                <i class="fa fa-pencil-square-o btn btn-success btn-rounded" aria-hidden="true"></i>
                            </a>
                            <a ng-click="handleEvents('delete', item)" class="lnk-portlet-action"  uib-tooltip="{{ 'common.deleteaction.lbl' | translate }}" tooltip-placement="left">
                                <i class="fa fa-times-circle btn btn-danger btn-rounded" aria-hidden="true"></i>
                            </a>
                        </td> -->
                     </tr>
                </tbody>
            </table>
            </div> 
             <!-- <button type="button" class="btn btn-danger" style="position:relative;top:25px;padding:0px;float:right;">View more > ></button>   -->
         </div>
    </div>
</div>
<script>
        $(document).ready(function(){
         $(".psurcommon_arrow").click(function(){
           
                $(".surgical_toggle").toggle("slow");
               
               });
           });
      
        </script>
        <style>
        .surgical_toggle{
            height:150px;
          
            width:100%;
        }
       
        .psurcommon_arrow{
            float: right;
            padding-left: 47px;
            font-size:24px;
           
        } 
      .psur2common_arrow{display: none;}
        </style>
