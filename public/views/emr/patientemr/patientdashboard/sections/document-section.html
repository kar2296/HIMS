<style>
    div#document_toogle {
    /* background: #ff4500; */
}
</style>
<div class="panel {{currentcontext.paneltype}} portlet-panel" ng-controller="documentSectionController as vm">
    <div class="panel-heading portlet-panel-heading" id="document_toogle" ng-click="open_documents()">
            <!-- <div class="col-xs-12 col-sm-5 col-md-5 col-lg-5 bg-round resp_img pull-right">
                    <img class="img-responsive dash_icons" ng-src="app/img/emr/M_45.png" >
                </div>
                <h4 class="ip_dashbname">
        <strong translate="patientemr.patientdashboard.documents.lbl"></strong> </h4>
        <button class="emr_vmore info btn-md pull-right">View more...</button> -->
        <strong translate="patientemr.patientdashboard.documents.lbl"></strong>
         <i class="fa fa-angle-down cust_downarrow doccommon_arrow"></i>
        <i class="fa fa-angle-right cust_rightarrow doc2common_arrow"></i> 
        <a ng-click="handleEvents('list')" class="pull-right lnk-portlet-header-action " uib-tooltip="{{ 'common.moredetailsaction.lbl' | translate }}"
            tooltip-placement="bottom">
            <i class="fa fa-info btn-circle" aria-hidden="true"></i>
        </a>
        <a  ng-click="handleEvents('add')" class="pull-right lnk-portlet-header-action"   uib-tooltip="{{ 'common.addnewaction.lbl' | translate }}" tooltip-placement="bottom">
            <i class="fa fa-plus btn-circle" aria-hidden="true"></i>
        </a> 
    </div>
     <div class="panel-wrapper">
        <div class="panel-body portlet-panel-body document_toggle">
            <div class="table-responsive">
            <table class="table table-striped table-condensed">
                <tbody>
                    <tr class="portlet-tr" ng-repeat="item in items | limitTo: currentcontext.recordcount"> 
                        <td class="lefcol1">{{item.DocumentType.Description}}</td>
                        <td class="lefcol8">
                            {{item.Name}}
                        </td>
                        <td class="lefcol3">
                            <ngformatdate date-val='item.CreatedDate'></ngformatdate>
                        </td>
                            <td class="lefcol3">
                                <a ng-click="handleEvents('download', item)" class="lnk-portlet-action">
                                    <img class="drhms-edit-button" src="assets/svg/edit.svg" alt="">
                                </a>
                            </td>
                        <!-- <td class="td-action">
                            <a ng-click="handleEvents('download', item)" class="lnk-portlet-action" >
                                <i class="" aria-hidden="true">View</i>
                            </a>
                            <a ng-click="handleEvents('delete', item)" class="lnk-portlet-action"  uib-tooltip="{{ 'common.deleteaction.lbl' | translate }}" tooltip-placement="left">
                                <i class="fa fa-times-circle btn btn-danger btn-rounded" aria-hidden="true"></i>
                            </a>
                        </td> -->
                     </tr>
                </tbody>
            </table>
            </div> 
             <!-- <button type="button" class="btn btn-danger" style="position:relative;top:25px;padding:0px;float:right;">View more > ></button>   -->
        </div>
    </div> 
</div>
<script>
    $(document).ready(function () {
        $(".doccommon_arrow").click(function () {
           
                $(".document_toggle").toggle("slow");
               
               });
           });
      
        </script>
        <style>
        .document_toggle{
            height:150px;
          
            width:100%;
        }
       
        .doccommon_arrow{
            float: right;
            padding-left: 47px;
            font-size:24px;
           
        } 
      .doc2common_arrow{display: none;}
        </style>
