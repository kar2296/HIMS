<style>
    #mainresponsivetablecontrol {
        height: 400px;
        overflow: auto;
    }
    
    .formRoot {
        min-height: 385px;
    }
</style>
<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="patientemr.pastlab-form.pagetitle.lbl"></h4>
</div>
<div class="row filter-area">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="col-sm-6">
                <div class="col-sm-12">
                    <div class="form-group">
                        <label class="col-sm-4 control-label filter-lbl" for="orderno" translate="patientemr.pastlab-form.orderno.lbl"></label>
                        <div class="col-sm-8 input-group">
                            <div class="input-group-addon"><i class="fas fa-search" aria-hidden="true"></i></div>
                            <input type="text" class="form-control" translate translate-attr-placeholder="patientemr.pastlab-form.orderno.lbl" name="orderno"
                                ng-model="item.Orderid" placeholder="" ng-pattern="/^\d+$/" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-4 control-label filter-lbl" translate="patientemr.pastlab-form.orderedby.lbl"></label>
                        <div class="col-sm-8 input-group">
                            <div class="input-group-addon"><i class="fas fa-search" aria-hidden="true"></i></div>
                            <input type="text" class="form-control" translate translate-attr-placeholder="patientemr.pastlab-form.orderedby.lbl" ng-model="item.Orderedbyname"
                                placeholder="">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-4 control-label filter-lbl" translate="patientemr.pastlab-form.approvedby.lbl"></label>
                        <div class="col-sm-8 input-group">
                            <div class="input-group-addon"><i class="fas fa-search" aria-hidden="true"></i></div>
                            <input type="text" class="form-control" translate translate-attr-placeholder="patientemr.pastlab-form.approvedby.lbl" ng-model="item.Approvedbyname"
                                placeholder="">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-4 control-label filter-lbl" translate="patientemr.pastlab-form.attachment.lbl"></label>
                        <div class="col-sm-8 input-group">
                            <input type="file" ngf-select ng-model="currentcontext.file" name="file" ngf-max-size="200MB" ngf-change="fileSelected()"
                            />
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="col-sm-12">
                    <div class="form-group">
                        <label class="col-sm-4 control-label filter-lbl" translate="patientemr.pastlab-form.orderedon.lbl"></label>
                        <div class="col-sm-8 input-group">
                            <input type="text" class="form-control" name="POdate" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                placeholder="{{datePickerOptions.placeholder}}" ng-click="orderPopup = { opened: true }" is-open="orderPopup.opened"
                                ng-model="item.Ordereddate">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-4 control-label filter-lbl" translate="patientemr.pastlab-form.reportedon.lbl"></label>
                        <div class="col-sm-8 input-group">
                            <input type="text" class="form-control" name="POdate" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                placeholder="{{datePickerOptions.placeholder}}" ng-click="poPopup = { opened: true }" is-open="poPopup.opened"
                                ng-model="item.Reporteddate">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-4 control-label filter-lbl" translate="patientemr.pastlab-form.labtestname.lbl"></label>
                        <div class="col-sm-8 input-group">
                            <div class="input-group-addon"><i class="fas fa-search" aria-hidden="true"></i></div>
                            <input type="text" class="form-control" translate translate-attr-placeholder="patientemr.pastlab-form.labtestname.lbl" ng-model="item.LabName"
                                placeholder="">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-4 control-label filter-lbl" translate="patientemr.pastlab-form.releasetopatient.lbl"></label>
                        <div class="col-sm-8 input-group">
                            <radiogroupcontrol itemid="item.YesNoId" items="lookup.YesNo"></radiogroupcontrol>
                        </div>
                    </div>
                </div>
            </div>
            <!--<button class="btn bt-color3 btn-xs pull-right btn-filter" ng-click="" uib-tooltip="{{ 'appmanager.users.advancefilter-tooltip.lbl' | translate  }}"
                tooltip-placement="bottom"><i class="fa fa-filter" aria-hidden="true"></i>&nbsp;&nbsp;<span translate="clinicalmaster.serviceitem-list.filter.lbl"></span></button>-->
            <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addNew()" uib-tooltip="{{ 'patientemr.pastlab-form.tooltip.lbl' | translate}}"
                tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i><span translate="clinicalmaster.serviceitem-list.addnew.lbl"></span></button>
    </div>
</div>
<div class="filter-area row">
    <div class="col-sm-12">

        <!-- first row -->


    </div>
</div>


<div class=" table-control  bg-pattern">
    <div class="table-height formRoot" id="mainresponsivetablecontrol">
        <!-- grid area starts -->
        <table class="table table-hover table-responsive table-bordered">
            <thead class="bg-subhead">
                <tr>
                    <th class="col-sm-2"><span translate="patientemr.pastlab-form.testname.lbl"></th>
                        <th class="col-sm-2"><span translate="patientemr.pastlab-form.result.lbl"></span></th>
                    <th class="col-sm-2"><span translate="patientemr.pastlab-form.uom.lbl"></span></th>
                    <th class="col-sm-1"><span translate="patientemr.pastlab-form.reference.lbl"></th>
                         <th class="col-sm-1"><span translate="common.actions_col.lbl"></span></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="item in pastlabresultDetails | filter:{Status:1}">
                    <td>
                       <autosearch itemid="item.TestId" iteminfo="item.selectedItem" rowdata="item" name="'testid'" config="vm.testcontrolconfig"
                                                itemchange="getTest()" isrequired="true"></autosearch>
                    </td>

                    <td>
                        <input type="text" class="form-control" name="result" ng-model="item.Resultvalue" placeholder="" required>

                    </td>
                    <td align="center">

                        <input type="text" class="form-control" name="uom" ng-model="item.Uom" placeholder="" required>
                    </td>
                    <td align="center">

                        <input type="text" class="form-control" name="reference" ng-model="item.Reference" placeholder="">
                    </td>

                    <td>
                        <!--<td><button class="btn btn-success btn-xs" ng-click="">
                                <i class="fa fa-pencil" aria-hidden="true"></i> -->
                        <button class="btn btn-danger btn-xs" style="margin-left:3px;" ng-click="deleteItem($index,item)">
                        <i class="fa fa-trash" aria-hidden="true"></i>
                    </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</div>
<div class="fooder-bgs">
    <div class="row ">
        <div class="col-sm-12">
            <div class="col-sm-4 col-md-4">
                <div class="pull-left">
                    <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()"><i class="fa fa-angle-left" aria-hidden="true" ></i>&nbsp;&nbsp;<span class="btn-fontsize"  translate="common.backaction.lbl"></span></button>
                </div>
            </div>
            <div class="col-sm-8 col-md-8">
                <div class="pull-right">

                    <button type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="saveItem()"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </div>
    </div>
</div>
