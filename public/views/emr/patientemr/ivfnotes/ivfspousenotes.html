<style>
  .product__grid {
    display: flex;
    justify-content: flex-start;
    flex-wrap: wrap;
  }

  .image i {
    color: #000000;
  }

  .product__container {
    margin: 0px 10px;
    border: 1px solid #d4d4d4;
    background: #fff;
    padding: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    border-radius: 0px;
    box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 12px;
    width: 30%;
    margin-bottom: 10px;
  }

  .product__title {
    font-size: 16px;
    font-weight: 400;
  }

  .product__price {
    font-size: 14px;
    text-align: center;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    width: 100%;
    text-overflow: ellipsis;
  }

  .product__button {
    background: transparent;
    border: 0;
    padding: 2px 10px;
  }

  .product__container:hover {
    background: #f5f5f5;
    border: 1px solid #5d9cec;
  }

  .product__created {
    color: #f05050;
  }
</style>

</div>

<div class="col-sm-12">
  <div class="product__grid">
    <div class="product__container" uib-tooltip="{{test.DailyNote}}" tooltip-placement="top" ng-repeat="test in Details">
      <div class="image">
        <i class="fa fa-user patientimg" aria-hidden="true"></i>
      </div>
      <span class="product__title">{{test.CapturedOn | date : 'dd-MMM-yyyy'}}</span>
      <span class="product__price">{{test.DailyNote}}</span>
      <span class="product__price">{{test.DailyNote.Note.Description}}</span>
      <span class="product__created"> {{test.CapturedUser.Title.Description}}
        {{test.CapturedUser.FirstName}} {{test.CapturedUser.LastName}}</span>
      <span class="d-flex-btn">
        <button class="product__button" uib-tooltip="Edit" tooltip-placement="bottom" ng-click="testtat(test)"><img
            class="drhms-edit-button" src="assets/svg/edit.svg" alt=""></button>
        <button class="product__button" ng-click="handleEvents(\'delete\',entity)"> <img class="drhms-edit-button"
            src="assets/svg/delete.svg" alt=""></button>
      </span>
    </div>
  </div>
</div>
