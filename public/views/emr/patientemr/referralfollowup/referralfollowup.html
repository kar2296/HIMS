<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="form-group col-sm-6">
                <label class="col-sm-12 control-label" for="assignto" translate="registration.patienttracker.assignto.lbl"></label>
                <div class="col-sm-12">
                    <radiogroupcontrol itemid="item.AssignTo" items="vm.AssignToOptions">
                    </radiogroupcontrol>
                </div>
            </div>
            <div class="form-group col-sm-6">
                <label class="col-sm-12 control-label" translate="ClinicalStatus"></label>
                <div class="col-sm-12">
                    <radiogroupcontrol itemid="item.ClinicalStatusId" items="lookup.ReferrerClinicalStatus">
                    </radiogroupcontrol>
                </div>
            </div>
            <!-- <div class="form-group col-sm-6" ng-show="canShowFacility()">

                    <ui-select ng-model="item.FacilityId" name="facility">

            <div class="form-group col-sm-6" ng-show="canShowGroup()">
                <label class="col-sm-12 control-label" for="group" translate="registration.patienttracker.group.lbl"></label>
                <div class="col-sm-12">
                    <ui-select ng-model="item.AssignedGroupId" name="group" ng-change="onGroupChange($select.selected)">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Group | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="form-group col-sm-6" ng-show="canShowDept()">
                <label class="col-sm-12 control-label" for="group" translate="Department"></label>
                <div class="col-sm-12">
                    <ui-select ng-model="item.AssignedUserDepartmentId" name="group">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="form-group col-sm-6" ng-show="canShowUser()">
                <label class="col-sm-12 control-label" for="user" translate="Doctor"></label>
                <div class="col-sm-12">
                    <ui-select ng-model="item.AssignedUserId" name="user" ng-change="onUserChange($select.selected)">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Doctor | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>

                    </ui-select>
                </div>
            </div> -->
            <div class="form-group col-sm-6">
                <label class="col-sm-12 control-label" for="notes" translate="registration.patienttracker.notes.lbl"></label>
                <div class="col-sm-12">
                    <textarea class="form-control" ng-model="item.TrackerNotes"></textarea>
                </div>
            </div>

                    </div>

            <div class="form-group col-sm-6">
                <label class="col-sm-12 control-label" translate="registration.patienttracker.followupappointments.lbl"></label>
                <!-- <div class="col-sm-12"> -->
                <div class="col-sm-6">
                    <input type="text" style="width: 100% !important;" class="form-control durationtxt" ng-model="item.Duration" placeholder="">
                </div>
                <div class="col-sm-6">
                    <ui-select ng-model="item.DurationPeriodId" class="ui-select-period col-sm-12 12d0" ng-change="onDurationPeriodChange($select.selected)">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.DurationPeriod | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
                <!-- </div> -->
            </div>
            <div class="form-group col-sm-6">
                <label class="col-sm-12 control-label" for="comments" translate="registration.patienttracker.comments.lbl"></label>

                </div>
            </div>

                </div>
            </div> -->
