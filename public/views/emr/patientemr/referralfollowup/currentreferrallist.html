<link href="app/css/emr.css" rel="stylesheet">
<style>
    /* body {
      padding: 20px;
   } */
    
    .accordion_icon {
        float: right;
    }
    
    .btn-round {
        border-radius: 0px;
    }
    
    .panel-body p {
        Color: blue;
    }
    
    .panel-default>.panel-heading {
        background-color: #ddd;
        height: 30px;
    }
    
    button.editbtn {
        color: blue !important;
        background: #0a68f3;
        border-radius: 19px;
        padding: 2px 5px;
        border: 1px;
        margin: 0px 5px;
        float: right;
    }
    
    button.deletebtn {
        background: red;
        border-radius: 19px;
        padding: 1px 6px;
        border: 1px;
        float: right;
    }
    /* .nav-pills>li.active>a,
   .nav-pills>li.active>a:focus,
   .nav-pills>li.active>a:hover {
      color: #fff;
      background-color: #b4d7e8;
   } */
    
    .nav-pills>li>a {
        margin-left: -25px;
        background: #ddd;
        text-align: center;
    }
    
    .nav-pills>li+li {
        margin-left: 0px;
    }
    /* .nav-pills>li.active>a {
      color: #ffff;
      background-color: #b4d7e8;
      border-bottom: 3px solid #29902b;
      text-align: center;
   } */
    /* .btn-success {
      border-radius: 7px !important;
      width: 106px;
      height: 31px;
   } */
    
    .btn-group .btn-select {
        color: #333;
        background-color: #ccc;
        border-color: #999;
    }
    
    a.btn.btn-select:focus,
    a.btn.btn-select:hover {
        color: #fff;
        background-color: #337ab7;
        border-color: #2e6da4;
    }
    
    .btn-group-justified {
        top: 5px;
    }
    
    span {
        cursor: pointer;
    }
    
    .number {
        display: flex;
    }
    
    .number .minus,
    .plus {
        background: #d9edf7;
        border-radius: 0px;
        padding: 6px 14px;
        border: 1px solid #ddd;
        display: inline-block;
        vertical-align: middle;
        text-align: center;
    }
    
    .number input {
        height: 34px;
        width: 70px;
        text-align: center;
        font-size: 20px;
        border: 1px solid #ddd;
        border-radius: 0px;
        display: inline-block;
        vertical-align: middle;
    }
    
    .sec-tab th h4 {
        margin-top: -3rem;
    }
    
    .sec-tab th h6 {
        color: red;
        text-decoration: underline;
    }
    
    .sec-tab th h5 {
        color: #0a0a0a;
        font-weight: 500;
    }
    
    .sec-tab td h4 {
        color: orange
    }
    
    .sec-tab td h5 {
        color: #000
    }
    
    .sec-tab td .fa-trash {
        color: red
    }
    
    .sec-tab td .fa-edit {
        color: #449d44
    }
    
    .form-control {
        height: 40px;
        padding: 2px 16px;
        margin-bottom: 10px;
    }
    
    .table th {
        min-width: 10px;
        background-color: #ffffff !important;
    }
    
    table.table td {
        border: 0px !important;
    }
    
    table.table {
        border: 1px solid;
    }
    
    table.table tr {
        border: 1px solid #dddddd;
    }
    /* button.btn.btn-success {
      padding: 10px;
      height: auto;
      width: 100px;
      border-radius: 0px !important;
      background: transparent;
      color: #19a29c !important;
      border: 1px solid;
      margin-top: 15px;
   }

   button.btn.btn-success:hover {
      padding: 10px;
      height: auto;
      width: 100px;
      border-radius: 0px !important;
      background: #19a29c !important;
      color: white !important;
      border: 1px solid;
      margin-top: 15px;
   } */
    
    .table>thead>tr>th {
        padding: 0px 1px;
        color: #888;
    }
    
    h4.title {
        color: #477694;
        font-size: 15px;
    }
    
    h4.status {
        color: #9e2c2c;
        font-size: 15px;
    }
    
    a:hover,
    a:focus {
        color: #ffffff !important;
        text-decoration: underline;
    }
    /* .nav.nav-pills .active>a {
      background-color: #b4d7e8 !important;
   } */
    
    .vl {
        border-left: 3px solid gray;
        height: 100%;
    }
    
    i.fa.fa-times.icon {
        height: 21px;
        background: red;
        width: 25px;
        padding: 5px;
        border-radius: 5px;
        color: white;
    }
    
    td.col-sm-3 {
        border: unset !important;
    }
    
    i.fa.fa-times.icon {
        padding: 2px 6px !important;
    }
    
    table td {
        border: unset !important;
        border-bottom: 1px #80808070 solid !important;
    }
    
    .nav-tabs>li {
        margin-top: -6px !important;
    }
</style>
<div class="panel-group" aria-multiselectable="true">
    <div class="panel panel-default">
        <div class="panel-heading">
            <div class="row innerdata" ng-repeat="item in items">
                <div class="col-sm-12" ng-hide="item.TrackerStatusId==3">
                    <div class="col-sm-3 lefcol1 innerdata 4x">Refer To</div>
                    <span style="" class="col-sm-3">{{item.AttendUser.Title.Description}} {{item.AttendUser.FirstName}} {{item.AttendUserLastName}}</span>
                </div>
                <div class="col-sm-12 innerdata">
                    <div class="col-sm-3 lefcol1 innerdata 4x">Clinical Status</div>
                    <span style="" class="col-sm-3">{{item.ReferrerClinicalStatus.Description}}</span>
                </div>
                <div class="col-sm-12 innerdata">
                    <div class="col-sm-3 lefcol1 innerdata 4x">Followup On</div>
                    <span style="margin-left: -6px;font-size: 12px;font-weight: 500;" class="col-sm-3"><ngformatdate date-val='item.FollowupAppointmentOn'></ngformatdate>
                    </span>
                </div>
                <div class="col-sm-12 innerdata">
                    <div class="col-sm-3 lefcol1 innerdata 4x">Comments</div>
                    <span style="margin-left: -6px;font-size: 12px;font-weight: 500;" class="col-sm-3">{{item.TrackerComments}}</span>
                </div>
            </div>
        </div>
    </div>
</div>
