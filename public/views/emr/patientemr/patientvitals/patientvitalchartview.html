<div class="row">
    <div class="col-sm-4">
        <label class="col-sm-4 col-md-4 col-lg-4 control-label filter-lbl"
            translate="patientemr.patientvital-list.filter_from.lbl"></label>
        <div class="col-sm-8 col-md-8 col-lg-8">
            <div class="datepicker" id="datepicker">
                <input type="text" class="form-control" name="from" ng-change="getList()" ng-date-object
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="fromPopup = { opened: true }"
                    is-open="fromPopup.opened" ng-model="currentfilter.From">
                <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
        </div>
    </div>
    <div class="col-sm-4">
        <label class="col-sm-4 col-md-4 col-lg-4 control-label filter-lbl"
            translate="patientemr.patientvital-list.filter_to.lbl"></label>
        <div class="col-sm-8 col-md-8 col-lg-8 custom_align">
            <div class="datepicker" id="datepicker">
                <input type="text" class="form-control" name="to" ng-change="getList()" ng-date-object
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="toPopup = { opened: true }"
                    is-open="toPopup.opened" ng-model="currentfilter.To">
                <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
        </div>
    </div>
</div>
<div class="tabsizetopcontroller ptvitalchartview">
    <div id=''>
        <div class="col-sm-12" set-grid-height reduce-height="50">
            <vitalchart patientid="currentcontext.pid" vitalid="currentfilter.VitalId" from="currentfilter.From"
                to="currentfilter.To"></vitalchart>
        </div>
    </div>
</div>
<div class="fooder-bgs"></div>
