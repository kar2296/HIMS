<style>
    .side_popup {
        overflow: hidden;
    }

    @media (min-height: 637px) and (min-width: 1200px) {
        .ui-grid-viewport {
            height: 390px !important;
            min-height: 430px;
        }
    }

    @media (min-height: 675px) and (min-width: 1360px) {
        .ui-grid-viewport {
            height: 440px;
            min-height: 465px;
        }
    }

    @media (device-height:100vh) and (device-width:100vw) {
        .ui-grid-viewport {
            min-height: 560px;
        }
    }
</style>
<div class="row page-header">
    <div class="col-sm-9">
        <h4 class="page-header mt0" translate="patientemr.patientdocument-list.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-3">
        <span class="drhms-billing-btn drhms-outstandingbill-btn" ng-click="doctor_dashboard()"
            uib-tooltip="Doctor Dashboard" tooltip-placement="bottom">
            <i class="fas fa-th-large" aria-hidden="true"></i>
        </span>
        <span ng-click="bedboard()">
            <a href="/www/index.html#/EMR/emrdashboard//">
                <img src="app/img/main/patdash.png" class="img-responsive icon_emrboard" alt="home"
                    uib-tooltip="Patient Dashboard" tooltip-placement="bottom">
            </a>
        </span>
        <!--<button class="btn bt-color3 btn-xs pull-right" uib-tooltip="{{ 'clinicalmaster.serviceitem-list.filter-tooltip.lbl' | translate }}"
                    tooltip-placement="bottom"><i class="fa fa-search fa-xs " aria-hidden="true"></i>&nbsp;&nbsp;<span translate="clinicalmaster.serviceitem-list.filter.lbl"></span>
              </button>-->
        <button ng-if="canUpdatePatientEMR()" class="btn-add" ng-click="addNew()"
            uib-tooltip="{{ 'patientemr.patientdocument-list.addnew-tooltip.lbl' | translate }}"
            tooltip-placement="bottom"><i class="fa fa-plus" aria-hidden="true"></i>
        </button>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="pull-left">
            <button class="text-white btn prv-color12 btn-sm pull-left" ng-click="dashboard()"><i
                    class="fa fa-tachometer" aria-hidden="true"></i>&nbsp;&nbsp;<span class="btn-fontsize ng-scope"
                    translate="patientemr.mock.emrdashboard.lbl"></span></button>
        </div>
    </div>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
