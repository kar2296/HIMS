<style>
    .label-form {
        margin-top: -10px;
    }

    .form-grp {
        margin-top: 5px;
    }

</style>

<div id="fullregistrationheight2">
    <div class="row" id="fullregistrationheight">
        <div class="col-sm-12" style="min-height: 485px;">
            <form id="item_form" name="item_form" class="form-horizontal" role="form">
                <div class="formRoot emr_otrequestform otmanag_otreqform">
                    <div class="panel0 panel-default">
                        <div class="panel-body form-panel bg-pattern">
                            <div class="col-sm-12 well" style="min-height: 485px;box-shadow:none;border:none;">
                                <div class="form-group">
                                    <label class="col-sm-3 control-label" for="isorderable"
                                        translate="patientemr.bloodbank.component.lbl"></label>
                                    <div class="col-sm-6">
                                        <input type="checkbox" style="float: left;margin-top:10px" name="isorderable"
                                            class="custom-checkbox" ng-model="item.IsWhiteBlood">
                                        <label class="col-sm-3 control-label label-form" for="israteeditable"
                                            translate="patientemr.bloodbank.whitblood.lbl"></label>
                                        <div class="col-sm-5" style="margin-left: 45px;">
                                            <input type="text" class="form-control" name="roomtypename"
                                                ng-model="item.WhiteBloodComments" placeholder="Comments"
                                                ng-disabled="item.IsWhiteBlood==0">
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div class="col-sm-3"></div>
                                    <div class="col-sm-6">
                                        <input type="checkbox" style="float: left;" name="isorderable"
                                            class="custom-checkbox" ng-model="item.IsPackedCell">
                                        <label class="col-sm-3 control-label label-form" for="israteeditable"
                                            translate="patientemr.bloodbank.packedcell.lbl"></label>
                                        <div class="col-sm-5" style="margin-left: 45px;margin-bottom:5px;">
                                            <input type="text" class="form-control" name="roomtypename"
                                                ng-model="item.PackedCellComments" placeholder="Comments"
                                                ng-disabled="item.IsPackedCell==0">
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div class="col-sm-3"></div>
                                    <div class="col-sm-6">
                                        <input type="checkbox" style="float: left;" name="isorderable"
                                            class="custom-checkbox" ng-model="item.IsPlatelet">
                                        <label class="col-sm-3 control-label label-form" for="israteeditable"
                                            translate="patientemr.bloodbank.platelet.lbl"></label>
                                        <div class="col-sm-5" style="margin-left: 45px;margin-bottom:5px;">
                                            <input type="text" class="form-control" name="roomtypename"
                                                ng-model="item.PlateletComments" placeholder="Comments"
                                                ng-disabled="item.IsPlatelet==0">
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div class="col-sm-3"></div>
                                    <div class="col-sm-6">
                                        <input type="checkbox" style="float: left;" name="isorderable"
                                            class="custom-checkbox" ng-model="item.IsFFP">
                                        <label class="col-sm-3 control-label label-form" for="israteeditable"
                                            translate="patientemr.bloodbank.ffp.lbl"></label>
                                        <div class="col-sm-5" style="margin-left: 45px;margin-bottom:5px;">
                                            <input type="text" class="form-control" name="roomtypename"
                                                ng-model="item.FFPComments" placeholder="Comments"
                                                ng-disabled="item.IsFFP==0">
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div class="col-sm-3"></div>
                                    <div class="col-sm-6">
                                        <input type="checkbox" style="float: left;" name="isorderable"
                                            class="custom-checkbox" ng-model="item.IsOthers">
                                        <label class="col-sm-3 control-label label-form" for="israteeditable"
                                            translate="patientemr.bloodbank.others.lbl"></label>
                                        <div class="col-sm-5" style="margin-left: 45px;margin-bottom:5px;">
                                            <input type="text" class="form-control" name="roomtypename"
                                                ng-model="item.OthersComments" placeholder="Comments"
                                                ng-disabled="item.IsOthers==0">
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-3 control-label" for="roomtypename" style="margin-top: -3px !important;"
                                        translate="patientemr.bloodbank.priority.lbl"></label>
                                    <div class="col-sm-4" style="display: flex; justify-content: space-between;">
                                        <!-- Basic -->


                                        <!-- Before -->
                                        <div class="form-grp">
                                            <input type="checkbox" style="float: left;margin-top: -3px !important;" class="custom-checkbox box">
                                            <label class="col-sm-3 control-label label-form form-label">Urgent</label>
                                        </div>
                                        <div class="form-grp">
                                            <input type="checkbox" style="float: left;margin-top: -3px !important;" class="custom-checkbox">
                                            <label class="col-sm-3 control-label label-form form-label">NonUrgent</label>
                                        </div>
                                        <div class="form-grp">
                                            <input type="checkbox" style="float: left;margin-top: -3px !important;" class="custom-checkbox">
                                            <label class="col-sm-3 control-label label-form form-label">Reserved</label>
                                        </div>

                                        <!-- 
                                        <radiogroupcontrol itemid="item.BloodPriorityId" items="lookup.BloodPriority">
                                        </radiogroupcontrol>  -->
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-3 control-label" for="code"
                                        translate="patientemr.bloodbank.volumerequested.lbl"></label>
                                    <div class="col-sm-4">
                                        <input type="text" class="form-control" name="code"
                                            ng-model="item.RequestedVolume" placeholder="">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-3 control-label" for="code"
                                        translate="patientemr.bloodbank.dateandtime.lbl"></label>
                                    <div class="col-sm-4">
                                        <input type="text" class="form-control" name="startdateandtime" ng-date-object
                                            datetime-picker="{{datePickerOptions.dateTimeFormat}}"
                                            placeholder="{{datePickerOptions.placeholder}}"
                                            ng-click="startdateandtimePopup = { opened: true }"
                                            is-open="startdateandtimePopup.opened" ng-model="item.BloodRequestDate">
                                        <!-- <input type="text" class="form-control" name="activefrom" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                            placeholder="{{datePickerOptions.placeholder}}" ng-click="activefromPopup = { opened: true }"
                                            is-open="activefromPopup.opened" ng-model="item.BloodRequestDate"> -->
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-3 control-label" for="type"
                                        translate="patientemr.bloodbank.bloodbankname.lbl"></label>
                                    <div class="col-sm-4">
                                        <input type="text" class="form-control" name="code"
                                            ng-model="item.BloodBankName" placeholder="">
                                        <!-- <ui-select ng-model="item.RoomClassificationTypeId" name="type">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.RoomClassificationType | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select> -->
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-3 control-label"
                                        translate="patientemr.bloodbank.remarks.lbl"></label>
                                    <div class="col-sm-4">
                                        <textarea class="form-control notes-textarea" rows="3" maxlength="4000"
                                            name="description" ng-model="item.RequirementRemarks"
                                            placeholder=""></textarea>
                                        <!--<input type="text" class="form-control" name="description" ng-model="item.Description" placeholder="">-->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="fooder-bgs">
                        <div class="row">
                            <div class="col-sm-12">
                                <div class="pull-left">
                                    <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()">
                                        <i class="fa fa-angle-left" aria-hidden="true"></i>
                                        <span class="btn-fontsize"> &nbsp; Back</span>
                                    </button>
                                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="Cancel()"
                                        ng-show="CanShowCancel" translate="common.cancelaction.lbl"></button>

                                </div>
                                <div class="pull-right">
                                    <button id="btnSave" type="button" class="draftbutton"
                                        translate="common.saveaction.lbl" ng-click="save()"></button>
                                    <button id="btnSaveApprove" type="button" class="btn draftbutton text-white btn-sm"
                                        translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                                    <button id="btnClearForm" type="button" class="btn draftbutton btn-sm"
                                        ng-click="clear()" translate="common.clearaction.lbl"></button>
                                </div>
                            </div>
                        </div>
                    </div>
            </form>
        </div>
    </div>
</div>
