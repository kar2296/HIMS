<style>
    .image2{
        background-color: #ff0003;
    padding: 5px 10px;
    color: #fff;
    float: right;
    border: 0px;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    /* color: black; */
    margin-right: 2px;     
    }
    .image{
        background-color: #f05050;
    padding: 5px 7px;
    color: #fff;
    float: right;
    border: 0px;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    /* color: black; */
    margin-right: 2px;
    }

</style>
<div class="row page-header">
        <div class="col-sm-9">
            <h4 class="page-header mt0"
                translate="patientemr.bloodbank.pagetitle.lbl"></h4>
        </div>
        <div class="col-sm-3">
            <div class="filters">
            <span ng-click="doctor_dashboard()" class="image">
                <i class="fa fa-home" aria-hidden="true"
                    class="img-responsive icon_home"
                    alt="home" uib-tooltip=" Doctor Dashboard"
                    tooltip-placement="bottom"></i>
            </span>
            <span ng-click="patient_dashboard()" class="image2" style="display: none;">
                <i class="fas fa-clipboard" aria-hidden="true"
                    class="img-responsive icon_emrboard"
                    alt="home"
                    uib-tooltip="Patient Dashboard"
                    tooltip-placement="bottom"
                   ></i>
            </span>
            <button class="btn-add" ng-click="addNew()"
                uib-tooltip="{{ 'patientemr.bloodbank.pagetitle.lbl' | translate }}"
                tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
            </button>
        </div>
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize"
            start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage"
            ng-change="getList()"></ul>
    </div>
</div>
