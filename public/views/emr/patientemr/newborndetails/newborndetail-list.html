    <div class="col-sm-4">
        <label class="col-sm-4 control-label filter-lbl"
            translate="patientemr.newborndetails-list.deliverydate.lbl"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" name="dateofbirth" ng-change="getList()"
                datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="dateofbirthPopup = { opened: true }" is-open="dateofbirthPopup.opened"
                ng-model="currentfilter.deliverydate">

        </div>
    </div>
    <div class="col-sm-4">
        <label class="col-sm-5 control-label filter-lbl"
            translate="patientemr.newborndetails-list.modeofdelivery.lbl"></label>
        <div class="col-sm-7">
            <ui-select ng-model="currentfilter.ModeOfDeliveryId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 8 : 0}}
                    <span ng-if="$select.selected.Text.length>8">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.ModeOfDelivery | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="col-sm-4">
        <label class="col-sm-4 control-label filter-lbl" translate="patientemr.newborndetails-list.Status.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.NewBornStatusId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 8 : 0}}
                    <span ng-if="$select.selected.Text.length>8">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.NewBornStatus | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
</div>

<div class="row">
    <div class="fooder-bgs">
        <div class="row">
            <custom-table config="vm.gridConfig"></custom-table>
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
                items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
