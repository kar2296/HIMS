        padding: 2px;
    }

    #pvisit_custom {
        width: 100% !important;
        left: 0px !important;
    }

    .ui-grid-header-cell:last-child .ui-grid-column-resizer.right {
        border: none;
    }

    .modal-dialog.modal-full #patientsearchheight .ui-grid-viewport {

<div class="row page-header">
    <div class="col-xs-6 col-sm-6 col-md-6 col-lg-6">
        <h4 class="col-sm-6 mt0" translate="patientemr.pastvisit-list.pagetitle.lbl"></h4>
    </div>
    <div class="col-xs-6 col-sm-6 col-md-6 col-lg-6">
        <span ng-click="doctor_dashboard()">
            <img src="app/img/main/check-in.png" class="img-responsive icon_home" alt="home"
                uib-tooltip=" Doctor Dashboard " tooltip-placement="bottom">

        </span>
        <span class="drhms-billing-btn drhms-outstandingbill-btn" ng-click="patient_dashboard()"
            alt="home" uib-tooltip="Patient Dashboard" tooltip-placement="bottom">
            <i class="fas fa-th-large" aria-hidden="true"></i>
        </span>
        <!-- <span ng-click="patient_dashboard()">

        </span> -->
    </div>
</div>

<div class="container-fluid onerow-filter" id="patientsearchheight">
    <!-- <div ui-grid="vm.gridConfig" class="table-uigrid height-control"></div> -->
    <custom-table config="vm.gridConfig"></custom-table>
    <div class="fooder-bgs" id="pvisit_custom">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
                items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
