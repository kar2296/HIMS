    <div class="row filter-area care_path_form">
        <div class="col-sm-12">
            <div class="col-sm-6 col-md-6 col-lg-6">

                <div class="col-sm-8 col-md-8 col-lg-8">
                    <ui-select ng-model="currentfilter.Id" ng-change="getCarePathInfo()" class="filter-combo">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 8 : 0}}
                            <span ng-if="$select.selected.Text.length>8">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.CarePath | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="col-sm-6 col-md-6 col-lg-6">

                </div>
            </div>
        </div>
        <div class="col-sm-12">
            <div class="col-sm-5 col-md-5 col-lg-6">

                </div>
