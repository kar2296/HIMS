<div ng-switch="modalConfig.params.tablist"> 
        <h4 class="page-header mt0">{{PageTitle}}</h4> 
</div>

<div class="row">
    <div class="col-sm-12">
        <commentscontrol comments="cvm.item.Comments"></commentscontrol>
    </div>
</div>
<div class="panel-footer">
    <div class="panel-footer formactionbar">

                <button type="button" class="draftbutton" ng-click="save()" translate="common.saveaction.lbl"></button>

            </div>
        </div>
    </div>
