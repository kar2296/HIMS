<style>
    .nameinfo {
        font-size: 13px;
        font-weight: 700;
        color: #337ab7;
    }
    
    .nameinfo.mrninfo {
        color: black
    }
    
    .contactinfo {
        font-size: 10px;
        color: #808080
    }
    
    .block {
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
    }
    
    #usersheight .ui-grid-viewport {
        width: 100%;
        height: 460px!important;
    }
    
    .table-uigrid {
        margin-left: 10px;
        margin-right: 10px;
        height: 488px!important;
    }
    
    .linkstyle {
        font-weight: 700;
        text-align: right;
    }
    
    .statusinfo {
        font-size: 13px;
    }
    
    .form-group {
        margin-bottom: 7px !important;
    }
    
    .sr-only {
        height: 22px !important;
    }
    
    .col-sm-5 {
        padding-left: 5px !important;
    }
    .modal-dialog.modal-lg #usersheight .ui-grid-viewport{
        height: 404px!important;
        min-height: 427px;
    }
    .modal-dialog.modal-lg #usersheight table>tbody>tr>td{
        padding:2px !important;
    }
    .modal-dialog.modal-lg .container-fluid{
        padding: 0px !important;
    }
</style>

<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="assetmanagement.servicerequest.pagetitle.lbl"></h4>
    <div class="col-sm-6">
       
    </div>
</div>

<div class="row filter-area">
    <div class="col-sm-12">
        <!--<div class="col-sm-3">
            <label class="col-sm-4 control-label filter-lbl" translate="assetmanagement.servicerequest.fromdepartment.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.FromDepartmentId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>-->
        <div class="col-sm-4">
            <label class="col-sm-6 control-label filter-lbl" translate="assetmanagement.servicerequest.type.lbl"></label>
            <div class="col-sm-6">
                <ui-select ng-model="currentfilter.ServiceTypeId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ServiceType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4">
            <div class="form-group">
                <label class=" sr-only col-sm-5 col-md-4  col-lg-6 control-label filter-lbl" translate="assetmanagement.servicerequest.request#.lbl"></label>
                <div class="input-group col-sm-7 col-md-8 col-lg-6">
                    <div class="input-group-addon"><i class="fas fa-search" aria-hidden="true"></i></div>
                    <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.TicketNumberIdentifier" placeholder="">
                </div>
            </div>
        </div>
        <div class="col-sm-4">
            <div class="form-group">
                <label class=" sr-only col-sm-5 col-md-4 col-lg-6 control-label filter-lbl" translate="assetmanagement.servicerequest.date.lbl"></label>
                <div class="input-group col-sm-7 col-md-4 col-lg-6">
                    <div class="input-group-addon"><i class="fas fa-search" aria-hidden="true"></i></div>
                  <input type="text" class="form-control" name="date" ng-change="getList()" datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}" ng-click="dateofbirthPopup = { opened: true }"
                    is-open="dateofbirthPopup.opened" ng-model="currentfilter.ExpectedDate">
                </div>
            </div>
        </div>
         <div class="col-sm-4">
        <label class="col-sm-4 col-lg-6 control-label filter-lbl" translate="assetmanagement.assignment-list.department.lbl"></label>
        <div class="col-sm-8 col-lg-6">
            <ui-select ng-model="currentfilter.FromDepartmentId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 8 : 0}}
                    <span ng-if="$select.selected.Text.length>8">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
        </div>

        <div class="col-sm-4">
            <label class="col-sm-4 col-lg-6 control-label filter-lbl" translate="assetmanagement.assets.filter_status.lbl"></label>
            <div class="col-sm-8 col-lg-6">
                <ui-select ng-model="currentfilter.ServiceRequestStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ServiceRequestStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>

    </div>
</div>

<div class="container-fluid" id="usersheight">
    <div ui-grid="vm.gridConfig" class="table-uigrid table-uigrid-tab "></div>

    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
