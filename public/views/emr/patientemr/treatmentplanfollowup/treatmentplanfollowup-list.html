<link href="app/css/regbilling.css" rel="stylesheet">

<div class="row">
    <div class="col-sm-6">
        <h4 class="mt0" translate="TreatmentPlan Followup Trackers"></h4>
    </div>
    <div class="col-sm-6">
        <div class="filters">
            <div class="search">
                <input type="text" id="pid" class="form-control bill" name="filter_billnumber" on-enter="getList()"
                    ng-model="currentfilter.PatWoNum" translate placeholder="Name/UHID">
                <div class="drhms-search-icon"><i class="fas fa-search" aria-hidden="true"></i></div>
            </div>
            <!-- <div class="search">
                <input type="text" id="pid" class="form-control bill" name="filter_billnumber" on-enter="getList()" ng-model="currentfilter.OrderBillNo" translate placeholder="Order#/Bill#">
                <div class="drhms-search-icon"><i class="fas fa-search" aria-hidden="true"></i></div>
            </div> -->
        </div>
    </div>
</div>
<div class="row">
    <div class="drhms-list-filters">
        <!-- <div class="col-sm-4">
            <label class="col-sm-4" translate="Date"></label>
            <div class="col-sm-8">
                <div class="datepicker">
                    <input type="text" class="form-control" name="filter_fromdate" ng-change="getList()" ng-date-object
                        datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}"
                        ng-click="filter_fromdatePopup = { opened: true }" is-open="filter_fromdatePopup.opened"
                        ng-model="currentfilter.Ordereddate"><i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </div>
        </div> -->
        <div class="form-group col-sm-3">
            <label class="col-sm-4 control-label" for="date" translate="From Date"></label>
            <div class="col-sm-8">
                <div class="datepicker">
                    <input type="text" class="form-control" name="fromdate" ng-change="getList()" datepicker-options="datePickerOptions"
                        show-button-bar="{{datePickerOptions.showButtonBar}}" uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }" is-open="fromdatePopup.opened"
                        ng-model="currentfilter.FromDate">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </div>
        </div>
        <div class="form-group col-sm-3">
            <label class="col-sm-4 control-label" for="date" translate="To Date"></label>
            <div class="col-sm-8">
                <div class="datepicker">
                    <input type="text" class="form-control" name="todate" ng-change="getList()" datepicker-options="datePickerOptions"
                        show-button-bar="{{datePickerOptions.showButtonBar}}" uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }" is-open="todatePopup.opened"
                        ng-model="currentfilter.ToDate">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </div>
        </div>
        <div class="form-group col-sm-3">
            <label class="col-sm-4" translate="ordermanagement.myorderprocess-list.filter_status.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.FollowupStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.OrderFollowupStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-3">
            <label class="col-sm-4" translate="Department"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.DepartmentId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
