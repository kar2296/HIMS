<style>
    .modal-dialog {
        width: 950px;
        margin: 30px auto;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Manage Treatment Plan"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="backToList()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="notetype" translate="Treatment Name"></label>
            <div class="col-sm-12">
                <autosearch controlid="'serviceid'" itemid="item.ServiceItemId" iteminfo="item.SelectedItem"
                    rowdata="item" config="vm.serviceitemcontrolconfig" itemchange="serviceChanged(item)" required
                    class="inputsearchlogo" isrequired="true">
                </autosearch>
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="daystotal" translate="Total Days"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" for="daystotal" ng-model="item.NoOfDays" placeholder=""
                    ng-change="computedays(item)" required>
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="intervaldays" translate="Interval Days"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" for="intervaldays" ng-model="item.IntervalDays" placeholder=""
                    ng-change="computedays(item)">
            </div>
        </div>
        <div class="form-group col-sm-6">
            <div ng-repeat="service in SelectedServices">
                <div>
                    <i class="fa fa-times" ng-click="removeService(item, service.ServiceItemId)" aria-hidden="true"></i>
                    <span>{{service.ServiceName}}({{service.ServiceCode}})</span> &nbsp;
                    <span>-</span>&nbsp;<span>{{service.ServicePrice}}</span>
                </div>
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="fromdate" translate="From Date"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="fromdate"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                    is-open="fromdatePopup.opened" ng-model="item.PlanScheduledFrom">
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="todate" translate="To Date"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="todatte"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="todattePopup = { opened: true }"
                    is-open="todattePopup.opened" ng-model="item.PlanScheduledTo">
            </div>
        </div>
        <!-- <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="cost" translate="Cost"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" ng-model="item.ServicePrice" placeholder="" disabled>
            </div>
        </div> -->
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="comments" translate="Comments"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" ng-model="item.Comments" placeholder="">
            </div>
        </div>
        <!-- <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="comments" translate="Additional Comments"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" ng-model="item.Comments" placeholder="">
            </div>
        </div> -->
    </form>
</div>
<div class="row">
    <div class="pull-right">
        <button type="button" id="btnsubmit" class="draftbutton" translate="Create" ng-click="create()"></button>
    </div>
</div>
