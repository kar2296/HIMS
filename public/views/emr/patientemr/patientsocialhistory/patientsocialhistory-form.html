<ul class="breadcrumb" ng-if="!currentcontext.ismodal">
    <li><a ng-click="backToList()" translate="patientemr.patientsocialhistory-form.parentpagetitle.lbl"></a></li>
    <li class="active" translate="patientemr.patientsocialhistory-form.pagetitle.lbl"></li>
</ul>
<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <div class="col-sm-6">
        <h4 class="modal-title custom-modal-title" translate="patientemr.patientsocialhistory-form.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-6">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form0" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="socialtype"
                translate="patientemr.patientsocialhistory-form.socialtype.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.SocialTypeId" name="socialtype" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.SocialType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="frequency"
                translate="patientemr.patientsocialhistory-form.frequency.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.SocialFrequencyId" name="frequency" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.SocialFrequency | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="status"
                translate="patientemr.patientsocialhistory-form.status.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.SocialHistoryStatusId" name="status">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.SocialHistoryStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="comments"
                translate="patientemr.patientsocialhistory-form.comments.lbl"></label>
            <div class="col-sm-12">
                <commentscontrol comments="item.Comments"></commentscontrol>
            </div>
        </div>
    </form>
</div>
<div class="row">
    <div class="pull-right">
        <button type="submit" class="draftbutton" ng-click="saveItem()" translate="common.saveaction.lbl"></button>
    </div>
</div>
