<ul class="breadcrumb" ng-if="!currentcontext.ismodal">
    <li><a ng-click="backToList()" translate="patientemr.patientcondition-form.parentpagetitle.lbl"></a></li>
    <li class="active" translate="patientemr.patientcondition-form.pagetitle.lbl"></li>
</ul>
<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="patientemr.patientcondition-form.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="backToList()">
        </div>
    </div>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form0" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="conditiontype"
                    translate="patientemr.patientcondition-form.conditiontype.lbl"></label>
                <div class="col-sm-12">
                    <ui-select id="conditiontype" ng-model="item.ConditionTypeId" name="conditiontype" required>
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.ConditionType | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="Diagnosis"
                    translate="patientemr.patientcondition-form.diagnosis.lbl"></label>
                <div class="col-sm-12">
                    <autosearch itemid="item.DiagnosisId" iteminfo="item.SelectedItem" rowdata="item"
                        config="vm.diagnosiscontrolconfig" name="'Diagnosis'" itemchange="getDiagnosis(item)">
                    </autosearch>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="conditiondate"
                    translate="patientemr.patientcondition-form.date.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="conditiondate" ng-date-object
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="conditiondatePopup = { opened: true }"
                        is-open="conditiondatePopup.opened" ng-model="item.ConditionDate" required>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="conditionstatus"
                    translate="patientemr.patientcondition-form.conditionstatus.lbl"></label>
                <div class="col-sm-12">
                    <ui-select ng-model="item.ConditionStatusId" name="conditionstatus">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.ConditionStatus | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="comments"
                    translate="patientemr.patientcondition-form.comments.lbl"></label>
                <div class="col-sm-12">
                    <commentscontrol comments="item.Comments"></commentscontrol>
                </div>
            </div>
        </form>
    </div>
</div>
<div class="row">
    <div class="pull-right">
        <button type="submit" ng-if="canUpdatePatientEMR()" ng-click="saveItem()" class="draftbutton"
            translate="common.saveaction.lbl"></button>
    </div>
</div>
