<style>
    .panel-favorite .panel-body {
        height: 175px;
    }

    .tabsizetopcontroller .ui-grid-viewport {
        height: 140px !important;
    }

    @media (device-width:100vw) and (device-height:100vh) {
        .panel-favorite .panel-body {
            height: 200px;
        }

        .tabsizetopcontroller .ui-grid-viewport {
            height: 253px !important;
        }
    }
</style>
<div class="tabsizetopcontroller">
    <div class="row page-header">
        <div class="col-sm-12">
            <div class="col-sm-6 col-md-6 col-lg-6">
                <h4 class="page-header mt0" translate="patientemr.patientcondition-list.pagetitle.lbl"></h4>
            </div>
            <div class="col-sm-6 col-md-6 col-lg-6">
                <span ng-click="doctor_dashboard()">
                    <img src="app/img/main/download.png" class="img-responsive icon_home" style="width:4.5%;" alt="home"
                        uib-tooltip=" Doctor Dashboard " tooltip-placement="bottom">
                </span>
                <span ng-click="patient_dashboard()">
                    <!-- <i class="bedicon pull-right" uib-tooltip="Bed Management " tooltip-placement="bottom"></i> -->
                    <img src="app/img/main/patdash.png" class="img-responsive icon_emrboard" style="width:4.5%;"
                        alt="home" uib-tooltip="Patient Dashboard" tooltip-placement="bottom">
                </span>
                <!--  <button class="btn bt-color3 btn-xs pull-right" uib-tooltip="{{ 'clinicalmaster.serviceitem-list.filter-tooltip.lbl' | translate }}"
             tooltip-placement="bottom"> <i class="fa fa-filter fa-xs " aria-hidden="true"></i>&nbsp;&nbsp;<span translate="clinicalmaster.serviceitem-list.filter.lbl"></span>
           </button>-->

                <button class="btn-add" ng-if="canUpdatePatientEMR()" ng-click="addNew()"
                    uib-tooltip="{{ 'patientemr.patientcondition-list.pagetitle.lbl' | translate }}"
                    tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i><strong class="btn-fontsize"
                        translate="common.addaction.lbl"></strong>
                </button>

            </div>
        </div>
    </div>
    <div class="row filter-area">
        <div class="col-sm-12">
            <div class="col-sm-4">
                <label class="col-sm-4 control-label filter-lbl"
                    translate="patientemr.patientcondition-list.filter_conditiontype.lbl"></label>
                <div class="col-sm-8">
                    <ui-select ng-model="currentfilter.ConditionTypeId" ng-change="getList()" class="filter-combo">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 8 : 0}}
                            <span ng-if="$select.selected.Text.length>8">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.ConditionType | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="col-sm-4">
                <label class="col-sm-4 control-label filter-lbl"
                    translate="patientemr.patientcondition-list.conditionname.lbl"></label>
                <div class="input-group col-sm-8">
                    <span class="input-group-addon"> <i class="fas fa-search"></i> </span>
                    <input type="text" class="form-control" name="conditionname" on-enter="getList()"
                        ng-model="currentfilter.Name" translate
                        translate-attr-placeholder="patientemr.patientcondition-list.conditionname.lbl">
                </div>
            </div>
            <div class="col-sm-4">
                <div class="form-group">
                    <label class="col-sm-4 control-label" for="conditionstatus"
                        translate="patientemr.patientcondition-form.conditionstatus.lbl"></label>
                    <div class="col-sm-8">
                        <ui-select ng-model="currentfilter.ConditionStatusId" name="conditionstatus">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.ConditionStatus | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <favoritecontrol config="favconfig" ng-if="canUpdatePatientEMR()" addclick="addFavorite()"
            saveclick="saveFavorites()"></favoritecontrol>
    </div>
    <div class="row">
        <custom-table config="vm.gridConfig"></custom-table>
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
    <div class="fooder-bgs">
        <div class="col-sm-2">
            <button class="text-white btn prv-color12 btn-sm pull-left " ng-click="dashboard()"><i
                    class="fa fa-tachometer" aria-hidden="true"></i>&nbsp;&nbsp;<strong class="btn-fontsize ng-scope"
                    translate="patientemr.mock.emrdashboard.lbl"></strong></button>
        </div>
    </div>
</div>
