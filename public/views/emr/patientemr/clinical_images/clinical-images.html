<style>
    .display-clinical-image {
        text-align: center;
        box-shadow: rgb(0 0 0 / 10%) 0px 4px 12px;
        height: 200px;
        display: grid;
        align-items: center;
        justify-content: center;
        margin: 10px 0px 10px 0px;
        padding: 0px 6px;
    }

    img.clinical {
        width: 100px;
        height: 100px;
        object-fit: contain;
    }

    span.file-name {
        /* font-weight: 500;
        font-size: 13px;
        color: #000000; */
        font-weight: 500;
        font-size: 13px;
        color: #000000;
        width: 140px;
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    span.date-pic {
        font-weight: 300;
        color: #9e9e9e;
    }
</style>
<div class="row">
    <div class="page-header">
        <div class="col-sm-8">
            <h4 class="page-header mt0" translate="Clinical Images"></h4>
        </div>
        <div class="col-sm-4">
            <div class="pull-right">
                <!-- <span class="drhms-billing-btn drhms-outstandingbill-btn" ng-click="doctor_dashboard()"
                    uib-tooltip="{{'patientemr.pmhxdashboard.doctordashboard.lbl' | translate}}"
                    tooltip-placement="bottom">
                    <i class="fas fa-th-large" aria-hidden="true"></i>
                </span> -->
                <button type="button" class="drhms-billing-btn drhms-add-btn" ng-click="addNew()"
                    uib-tooltip="Add Clinical Images" tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <ippatientbanner patientid="currentcontext.pid"></ippatientbanner>
</div>

<div class="row">
    <div class="col-sm-2" ng-repeat="item in items">
        <div class="display-clinical-image">
            <div class="img">
                <img data-ng-src="data:image/png;base64,{{item.Image}}" ng-click="changeimage(item)" class="clinical" />
            </div>
            <p><span class="file-name">{{item.Name}} </span><br>
                <span class="date-pic">
                    <displaydate class="date-list" date-val="item.CreatedDate"></displaydate>
                </span>
            </p>
        </div>
    </div>
</div>
