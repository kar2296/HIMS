<div class="panel-group" aria-multiselectable="true">
    <div class="panel panel-default" ng-repeat="item in items">
       <div class="panel-heading">
          <!-- <h4 class="panel-title"> -->
          <!-- <a data-toggle="collapse" data-parent="#accordion" aria-expanded="true" aria-controls="collapseOne"> -->
          <div class="col-sm-12" style="margin-top: -8px;color: #1414ab;">
             <div class="col-sm-2">
                <ngformatdate datetime-val='item.OrderRequestDate'></ngformatdate>
             </div>
             <div class="col-sm-2">
                <span>{{item.OrderNumber}}</span>
             </div>
             <div class="col-sm-4">
                <displayuserlbl user="item.User"></displayuserlbl>
             </div>
             <div class="col-sm-2">
                {{item.OrderFrom.DepartmentName}}
             </div>
             <div class="col-sm-1">
                <a ng-click="handleEvents('repeat',item)" class="editbtn"
                   uib-tooltip="{{ 'Repeat' }}" tooltip-placement="bottom">
                   <i class="fa fa-edit" aria-hidden="true"></i>
                   </a>
                   <i class="fa fa-print" style="font-size: 17px; " aria-hidden="true"></i>
                <!-- <button class="btn btn-default btn-xs edit" ng-click="getprescribeDetailById(item)">
                   <i class="fa fa-edit" aria-hidden="true"></i>
                </button> -->
             </div>
             <div class="col-sm-1">
                <button type="button" class="btn btn-default btn-xs" ng-click="toggleCanShowDetails(item)">
                    <i class="fa fa-angle-down" aria-hidden="true" ng-show="!item.CanShowDetails"></i>
                    <i class="fa fa-angle-up" aria-hidden="true" ng-show="item.CanShowDetails"></i>
                </button>

                <!-- <i class="fa fa-check select" style="width: 26px;padding: 4px;
            " aria-hidden="true" ng-click="loadProcedureOrderDetails(item)"></i>-->
             </div> 
          </div>
          <!-- </h4> -->
       </div>
       <div class="panel" ng-show="item.CanShowDetails">
          <div class="panel-body">
             <div class="container">
                <div class="row" style="margin-top: -20px;margin-bottom: -22px;">
                   <table style="margin-left: 3% !important; width: 87%">
                      <tbody >
                      <tr ng-repeat="detail in item.ProcedureOrderDetails" >
                         <td class="col-sm-3">
                          <span class="drugname">  {{detail.ProcedureCode}}</span>
                         </td>
                         <td class="col-sm-3">
                            <span class="duration">
                                {{detail.ProcedureName}}
                        </span>
                         </td>
                         <td class="col-sm-3">
                           <span class="description">{{detail.Quantity}}</span> 
                         </td>
                         <td class="col-sm-3">
                            <span class="description">{{detail.Comments}}</span> 
                          </td>
                      </tr>
                      </tbody>
                   </table>
                </div>
             </div>
          </div>
       </div>
    </div>
 </div>
