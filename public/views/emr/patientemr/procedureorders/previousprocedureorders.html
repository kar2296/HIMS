<div class="col-sm-12" style="margin-top: -47px;">
    <div class="col-sm-4"  ng-hide="currentcontext.option=='currentvisits'">
        <label class="col-sm-4 col-md-4 col-lg-4 control-label filter-lbl"
            translate="patientemr.patientvital-list.filter_from.lbl"></label>
        <div class="col-sm-8 col-md-8 col-lg-8">
            <input type="text" class="form-control" name="from" ng-change="getList(tab)" ng-date-object
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="fromPopup = { opened: true }" is-open="fromPopup.opened" ng-model="currentfilter.From">
        </div>
    </div>
    <div class="col-sm-4"  ng-hide="currentcontext.option=='currentvisits'">
        <label class="col-sm-4 col-md-4 col-lg-4 control-label filter-lbl"
            translate="patientemr.patientvital-list.filter_to.lbl"></label>
        <div class="col-sm-8 col-md-8 col-lg-8 custom_align">
            <input type="text" class="form-control" name="to" ng-change="getList()" ng-date-object
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="toPopup = { opened: true }" is-open="toPopup.opened" ng-model="currentfilter.To">
        </div>
    </div>
</div>
<div class="panel-group" aria-multiselectable="true" style="margin-top: 51px;">
    <div class="panel panel-default" ng-repeat="item in items">
       <div class="panel-heading">
          <div class="col-sm-12" style="margin-top: -8px;color: #1414ab;">
             <div class="col-sm-2">
                <ngformatdate datetime-val='item.OrderRequestDate'></ngformatdate>
             </div>
             <div class="col-sm-2">
                <span>{{item.OrderNumber}}</span>
             </div>
             <div class="col-sm-4">
                <displayuserlbl user="item.User"></displayuserlbl>
             </div>
             <div class="col-sm-2">
                {{item.OrderFrom.DepartmentName}}
             </div>
             <div class="col-sm-1">
                <a ng-click="handleEvents('repeat',item)" class="editbtn"
                   uib-tooltip="{{ 'Repeat' }}" tooltip-placement="bottom">
                   <i class="fa fa-edit" aria-hidden="true"></i>
                 </a>
                 <i class="fa fa-print" style="font-size: 17px; " aria-hidden="true"></i>
             </div>
             <div class="col-sm-1">
                <button type="button" style="float: right;" class="btn btn-default btn-xs" ng-click="toggleCanShowDetails(item)">
                    <i class="fa fa-angle-down" aria-hidden="true" ng-show="!item.CanShowDetails"></i>
                    <i class="fa fa-angle-up" aria-hidden="true" ng-show="item.CanShowDetails"></i>
                </button>
             </div> 
          </div>
       </div>
       <div class="panel" ng-show="item.CanShowDetails">
          <div class="panel-body">
             <div class="container">
                <div class="row" style="margin-top: -20px;margin-bottom: -22px;">
                   <table style="margin-left: 2% !important; width: 87%; ">
                      <tbody >
                      <tr ng-repeat="detail in item.ProcedureOrderDetails" >
                         <td class="col-sm-3">
                          <span class="drugname">{{detail.ProcedureCode}}</span>
                         </td>
                         <td class="col-sm-3">
                            <span class="duration">
                                {{detail.ProcedureName}}
                        </span>
                         </td>
                         <td class="col-sm-3">
                           <span class="description">{{detail.Quantity}}</span> 
                         </td>
                         <td class="col-sm-3">
                           <span class="description">{{detail.Comments}}</span> 
                         </td>
                      </tr>
                      </tbody>
                   </table>
                </div>
             </div>
          </div>
       </div>
    </div>
 </div>
