<style>
    /* ui style start*/

    .btn-favorite {
        margin: 2px 10px;
    }

    #favoritebtncolorcontroler label {
        text-overflow: ellipsis;
        overflow: hidden;
        width: 135px;
    }

    #favoritebtncolorcontroler .btn-default {
        display: inline-block;
        padding: 4px 14px;
        margin-right: -6px;
        font-size: 14px;
        line-height: 20px;
        color: #333333;
        text-align: center;
        text-shadow: 0 1px 1px rgba(255, 255, 255, 0.75);
        vertical-align: middle;
        cursor: pointer;
        background-color: #f5f5f5;
        background-image: -webkit-gradient(linear, 0 0, 0 100%, from(#ffffff), to(#e6e6e6));
        background-image: -webkit-linear-gradient(top, #ffffff, #e6e6e6);
        background-image: -o-linear-gradient(top, #ffffff, #e6e6e6);
        background-image: linear-gradient(to bottom, #ffffff, #e6e6e6);
        background-image: -moz-linear-gradient(top, #ffffff, #e6e6e6);
        background-repeat: repeat-x;
        border: 1px solid #bbbbbb;
        border-color: rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.25);
        border-color: #e6e6e6 #e6e6e6 #bfbfbf;
        border-bottom-color: #a2a2a2;
        -webkit-border-radius: 4px;
        -moz-border-radius: 4px;
        border-radius: 4px;
        filter: progid:dximagetransform.microsoft.gradient(startColorstr='#ffffffff', endColorstr='#ffe6e6e6', GradientType=0);
        filter: progid:dximagetransform.microsoft.gradient(enabled=false);
        -webkit-box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.05);
        -moz-box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.05);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    #favoritebtncolorcontroler .btn-default.active {
        background-color: #95ce95;
        background-color: #D9D9D9 9;
        color: #fff;
        background-image: none;
        outline: 0;
        -webkit-box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
        -moz-box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .site-footer {
        position: inherit !important;
        margin-left: 0px !important;
    }

    .fav-row {
        margin-left: 0px;
        margin-right: 0px;
    }

    .panel-favorite .panel-body {
        background-image: url(../../app/img/patterns-bg/paper-fibers.png)!important;
        height: 300px;
        overflow-y: auto;
        padding: 6px 5px;
    }

    .top-option {
        background-color: #d4c9c9;
    }

    .top-option:nth-child(1) {
        background: #ff002d;
        color: #fff;
    }

    .top-option:nth-child(2) {
        background: #003380;
        color: #fff;
    }

    /* ui style end*/
</style>
<div class="panel panel-default panel-favorite">
    <div class="modal-header custom-modal-header">
        <div class="row">
            <div class="col-sm-6">
                <h4 class="modal-title custom-modal-title" translate="patientemr.eyehistorysections.patientallergy.lbl"></h4>
            </div>
            <div class="col-sm-6">
                <button class=" text-white btn res-color14 btn-xs pull-right" ng-click="emrfavouritesettings()" uib-tooltip="{{ 'patientemr.favoritecontrol.tooltipnamefavorite.lbl' | translate }}"
                    tooltip-placement="left">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </div>
    <div>
        <label class="btn btn-secondary top-option" ng-repeat="option in options" ng-click="getList()" ng-model="currentcontext.option"
            uib-btn-radio="option.key">{{option.name}}</label>
    </div>
    <div class="panel-body">
        <div ng-if="currentcontext.option == 'favorites'">
            <div class="row fav-row">
                <div class="col-sm-10">
                    <span class="btn-group btn-favorite" id="favoritebtncolorcontroler" ng-click="caretClicked(detail)" ng-repeat="detail in list"
                        uib-tooltip="{{detail.DisplayName}}" tooltip-placement="bottom">
                        <label class="btn btn-default" ng-model="listmodel[detail.ItemId]" uib-btn-checkbox>{{detail.DisplayName}}</label>
                        <button class="btn btn-default dropdown-toggle" type="button" ng-click="caretClicked(detail)">
                            <span class="caret"></span>
                        </button>
                    </span>
                </div>
            </div>
        </div>
        <div ng-if="currentcontext.option == 'detail'">
            <form id="item_form0" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
                <div class="formRoot">
                    <div class="panel-body form-panel">
                        <div class="col-sm-12">
                            <!-- leftpanel -->
                            <div class="col-sm-6">
                                <div class="well">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="allergy" translate="patientemr.patientallergy-form.allergy.lbl"></label>
                                        <div class="col-sm-8">
                                            <ui-select id="allergy" ng-model="item.AllergyId" name="allergy" ng-change="fillMasterInfo($select.selected)" required>
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Allergy | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="type" translate="patientemr.patientallergy-form.type.lbl"></label>
                                        <div class="col-sm-8">
                                            <ui-select ng-model="item.AllergyTypeId" name="type" required>
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.AllergyType | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="allergyname" translate="patientemr.patientallergy-form.allergyname.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="allergyname" ng-model="item.AllergyName" placeholder="" required>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="startdate" translate="patientemr.patientallergy-form.startdate.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="startdate" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                                placeholder="{{datePickerOptions.placeholder}}" ng-click="startdatePopup = { opened: true }"
                                                is-open="startdatePopup.opened" ng-model="item.StartDate" required>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="enddate" translate="patientemr.patientallergy-form.enddate.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="enddate" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                                placeholder="{{datePickerOptions.placeholder}}" ng-click="enddatePopup = { opened: true }"
                                                is-open="enddatePopup.opened" ng-model="item.EndDate">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="source" translate="patientemr.patientallergy-form.source.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="source" ng-model="item.AllergySource" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="comments" translate="patientemr.patientallergy-form.comments.lbl"></label>
                                        <div class="col-sm-8">
                                            <commentscontrol comments="item.Comments"></commentscontrol>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- rightpanel -->
                            <div class="col-sm-6">
                                <div class="well">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="symptom" translate="patientemr.patientallergy-form.symptom.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="symptom" ng-model="item.Symptom" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="adrstatus" translate="patientemr.patientallergy-form.adrstatus.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="adrstatus" ng-model="item.ADRStatus" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="adrscore" translate="patientemr.patientallergy-form.adrscore.lbl"></label>
                                        <div class="col-sm-8">
                                            <ui-select ng-model="item.ADRScoreId" name="adrscore">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ADRScore | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="severity" translate="patientemr.patientallergy-form.severity.lbl"></label>
                                        <div class="col-sm-8">
                                            <ui-select ng-model="item.AllergySeverityId" name="severity">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.AllergySeverity | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="status" translate="patientemr.patientallergy-form.status.lbl"></label>
                                        <div class="col-sm-8">
                                            <ui-select ng-model="item.PatientAllergyStatusId" name="status">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.PatientAllergyStatus | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="panel-footer formactionbar">
        <div class="pull-right">
            <button type="button" class="draftbutton" ng-click="saveItem()" translate="common.saveaction.lbl"></button>
            <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
        </div>
    </div>
</div>
