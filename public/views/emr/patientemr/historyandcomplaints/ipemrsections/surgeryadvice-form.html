<style>
    .modal-content .panel-body {
        overflow: inherit;
    }

    .formRoot {
        overflow: inherit;
    }

    .modal-content {
        width: 825px !important;
        margin-left: -75px;
    }

    .modal-dialog.modal-lg {
        width: 50%;
    }

    .ui-select-multiple {
        height: 45px !important;
    }

    .autosearch-div>input {
        background-size: 10.7% !important;
    }

    .formactionbar {
        margin: 0px;
    }

    .autosearch-div .custom-popup-wrapper>.dropdown-menu {
        width: 55% !important;
        overflow-x: hidden !important;
    }

    table.table.table-bordered.table-condensed.dropdown-menu thead tr td {
        background: linear-gradient(to bottom, rgba(30, 87, 153, 1) 0, rgba(41, 137, 216, 1) 44%, rgba(32, 124, 202, 1) 46%, rgba(125, 185, 232, 1) 100%);
        border-radius: unset;
    }

    table.table.table-bordered.table-condensed.dropdown-menu tbody tr td {
        border-radius: unset;
    }
</style>
<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="patientemr.eyeconsultsystems.surgeryadvice.lbl"></h4>
</div>

<div class="row">
    <div class="col-sm-12">
        <form id="item_form0" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
            <div class="formRoot">
                <div class="panel-body form-panel">
                    <div class="col-sm-12">
                        <!-- leftpanel -->
                        <div class="">
                            <div class="well">
                                <div class="form-group">
                                    <label class="col-sm-3 control-label" for="surgeryname" translate="patientemr.eyeconsultsystems.surgeryname.lbl"></label>
                                    <div class="col-sm-8">
                                        <span>{{item.SurgeryName}}</span>
                                        <!-- <input type="text" class="form-control" name="surgeryname" ng-model="item.SurgeryName" placeholder="" required> -->
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-3 control-label" for="side" translate="patientemr.eyeconsultsystems.side.lbl"></label>
                                    <div class="col-sm-8">
                                        <radiogroupcontrol itemid="item.SideId" items="lookup.EyeSide"></radiogroupcontrol>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-3 control-label" for="apnmtdate" translate="patientemr.eyeconsultsystems.apnmtdate.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="apnmtdate" ng-date-object required datetime-picker="{{datePickerOptions.dateTimeFormat}}"
                                            placeholder="{{datePickerOptions.placeholder}}" ng-click="apnmtdatePopup = { opened: true }"
                                            is-open="apnmtdatePopup.opened" ng-model="item.AppointmentDate">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-3 control-label" for="comment" translate="patientemr.eyeconsultsystems.comment.lbl"></label>
                                    <div class="col-sm-8">
                                        <textarea rows="6" name="comment" ng-model="item.Comments" maxlength="4000" style="width:100%;"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="panel-footer formactionbar" style="width:100%;left:0px;position:initial;">
        <div class="pull-right">
            <button type="submit" class="draftbutton" ng-click="saveItem()" translate="common.saveaction.lbl"></button>
            <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
        </div>
    </div>
</div>
