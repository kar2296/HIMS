<style>
    .modal-dialog.modal-lg {
        width: 50%;
    }

    .modal-content {
        margin-top: 125px;
    }
</style>
<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <h4 class="modal-title custom-modal-title" translate="patientemr.eyehistorysections.gnrlhstry.lbl"></h4>
</div>


<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="panel-body form-panel outer_border">
                <div class="panel panel-default">
                    <div class="table-responsive hm_dashboard top_logo">
                        <div id="dash-board">
                            <!-- <div class="form-group"> -->
                            <label class="col-sm-5 control-label" for="">
                                <span translate="patientemr.eyehistorysections.gnrlhstry.lbl" style="padding-right:10px;"></span>:</label>
                            <div class="col-sm-5">
                                <textarea rows="6" name="gnrlhstry" ng-model="item.GeneralHistory" maxlength="4000" style="width:100%;"></textarea>
                            </div>
                            <!-- </div> -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="panel-footer formactionbar">
                <div class="pull-right">
                    <button type="button" class="draftbutton" ng-click="saveItem()" translate="common.saveaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
