<style>
    /* ui style start*/

    .btn-favorite {
        margin: 2px 10px;
    }

    #favoritebtncolorcontroler label {
        text-overflow: ellipsis;
        overflow: hidden;
        width: 135px;
    }

    #favoritebtncolorcontroler .btn-default {
        display: inline-block;
        padding: 4px 14px;
        margin-right: -6px;
        font-size: 14px;
        line-height: 20px;
        color: #333333;
        text-align: center;
        text-shadow: 0 1px 1px rgba(255, 255, 255, 0.75);
        vertical-align: middle;
        cursor: pointer;
        background-color: #f5f5f5;
        background-image: -webkit-gradient(linear, 0 0, 0 100%, from(#ffffff), to(#e6e6e6));
        background-image: -webkit-linear-gradient(top, #ffffff, #e6e6e6);
        background-image: -o-linear-gradient(top, #ffffff, #e6e6e6);
        background-image: linear-gradient(to bottom, #ffffff, #e6e6e6);
        background-image: -moz-linear-gradient(top, #ffffff, #e6e6e6);
        background-repeat: repeat-x;
        border: 1px solid #bbbbbb;
        border-color: rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.25);
        border-color: #e6e6e6 #e6e6e6 #bfbfbf;
        border-bottom-color: #a2a2a2;
        -webkit-border-radius: 4px;
        -moz-border-radius: 4px;
        border-radius: 4px;
        filter: progid:dximagetransform.microsoft.gradient(startColorstr='#ffffffff', endColorstr='#ffe6e6e6', GradientType=0);
        filter: progid:dximagetransform.microsoft.gradient(enabled=false);
        -webkit-box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.05);
        -moz-box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.05);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    #favoritebtncolorcontroler .btn-default.active {
        background-color: #95ce95;
        background-color: #D9D9D9 9;
        color: #fff;
        background-image: none;
        outline: 0;
        -webkit-box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
        -moz-box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .site-footer {
        position: inherit !important;
        margin-left: 0px !important;
    }

    .fav-row {
        margin-left: 0px;
        margin-right: 0px;
    }

    .panel-favorite .panel-body {
        background-image: url(../../app/img/patterns-bg/paper-fibers.png)!important;
        height: 300px;
        overflow-y: auto;
        padding: 6px 5px;
    }

    .top-option {
        background-color: #d4c9c9;
    }

    .top-option:nth-child(1) {
        background: #ff002d;
        color: #fff;
    }

    .top-option:nth-child(2) {
        background: #003380;
        color: #fff;
    }

    /* ui style end*/
</style>
<div class="panel panel-default panel-favorite">
    <div class="modal-header custom-modal-header">
        <div class="row">
            <div class="col-sm-6">
                <h4 class="modal-title custom-modal-title" translate="patientemr.eyehistorysections.managecomplaints.lbl"></h4>
            </div>
            <div class="col-sm-6">
                <button class=" text-white btn res-color14 btn-xs pull-right" ng-click="emrfavouritesettings()" uib-tooltip="{{ 'patientemr.favoritecontrol.tooltipnamefavorite.lbl' | translate }}"
                    tooltip-placement="left">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </div>
    <div>
        <label class="btn btn-secondary top-option" ng-repeat="option in options" ng-click="getList()" ng-model="currentcontext.option"
            uib-btn-radio="option.key">{{option.name}}</label>
    </div>
    <div class="panel-body">
        <div ng-if="currentcontext.option == 'favorites'">
            <div class="row fav-row">
                <div class="col-sm-10">
                    <span class="btn-group btn-favorite" id="favoritebtncolorcontroler" ng-click="caretClicked(detail)" ng-repeat="detail in list"
                        uib-tooltip="{{detail.DisplayName}}" tooltip-placement="bottom">
                        <label class="btn btn-default" ng-model="listmodel[detail.ItemId]" uib-btn-checkbox>{{detail.DisplayName}}</label>
                        <button class="btn btn-default dropdown-toggle" type="button" ng-click="caretClicked(detail)">
                            <span class="caret"></span>
                        </button>
                    </span>
                </div>
            </div>
        </div>
        <div ng-if="currentcontext.option == 'detail'">
            <form id="item_form0" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
                <div class="formRoot">
                    <div class="col-sm-12">
                        <!-- leftpanel -->
                        <div class="" style="height: 343px;">
                            <!-- <div class="well"> -->
                            <div class="form-group">
                                <label class="col-sm-4 control-label" style="margin-left: -82px;" for="managecomplaints" translate="patientemr.eyehistorysections.managecomplaints.lbl"></label>
                                <div class="col-sm-6">
                                    <ui-select ng-model="item.SymptomId" name="managecomplaints" required>
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                        </ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ChiefComplaint | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="col-sm-12">
                                    <div class="col-sm-4"></div>
                                    <div class="col-sm-4">
                                        <label style="font-size: 15px;font-weight: 500font-style: initial;" class="col-sm-3 control-label" for="left" translate="patientemr.eyehistorysections.left.lbl"></label>
                                    </div>
                                    <div class="col-sm-4">
                                        <label style="font-size: 15px;font-weight: 500font-style: initial;" class="col-sm-3 control-label" for="right" translate="patientemr.eyehistorysections.right.lbl"></label>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="col-sm-12">
                                    <div class="col-sm-4">
                                        <label style="margin-left:91px;" for="frequency" translate="patientemr.eyehistorysections.duration.lbl"></label>
                                    </div>
                                    <div class="col-sm-4" style="margin-left: -97px;">
                                        <div class="col-sm-6">
                                            <input type="text" class="form-control" name="duration" ng-model="item.LDuration" placeholder="">
                                        </div>
                                        <div class="col-sm-6">
                                            <ui-select ng-model="item.LDurationPeriodId" name="duration">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.DurationPeriod | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="col-sm-4">
                                        <div class="col-sm-6">
                                            <input type="text" class="form-control" name="duration" ng-model="item.RDuration" placeholder="">
                                        </div>
                                        <div class="col-sm-6">
                                            <ui-select ng-model="item.RDurationPeriodId" name="duration">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.DurationPeriod | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="col-sm-12">
                                    <div class="col-sm-4">
                                        <label style="margin-left:91px;" for="onset" translate="patientemr.eyehistorysections.onset.lbl"></label>
                                    </div>
                                    <div class="col-sm-4" style="margin-left: -97px;">
                                        <div class="col-sm-12">
                                            <input type="text" class="form-control" name="onset" ng-model="item.LOnset" placeholder="">
                                        </div>
                                    </div>
                                    <div class="col-sm-4">
                                        <div class="col-sm-12">
                                            <input type="text" class="form-control" name="onset" ng-model="item.ROnset" placeholder="">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="col-sm-12">
                                    <div class="col-sm-4">
                                        <label style="margin-left:91px;" for="progression" translate="patientemr.eyehistorysections.progression.lbl"></label>
                                    </div>
                                    <div class="col-sm-4" style="margin-left: -97px;">
                                        <div class="col-sm-12">
                                            <input type="text" class="form-control" name="progression" ng-model="item.LProgression" placeholder="">
                                        </div>
                                    </div>
                                    <div class="col-sm-4">
                                        <div class="col-sm-12">
                                            <input type="text" class="form-control" name="progression" ng-model="item.RProgression" placeholder="">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="col-sm-12">
                                    <div class="col-sm-4">
                                        <label style="margin-left:64px;" for="treatmenttaken" translate="patientemr.eyehistorysections.treatmenttaken.lbl"></label>
                                    </div>
                                    <div class="col-sm-4" style="margin-left: -97px;">
                                        <div class="col-sm-12">
                                            <textarea rows="3" name="treatmenttaken" ng-model="item.LTreatmentTaken" maxlength="4000" style="width:100%;"></textarea>
                                        </div>
                                    </div>
                                    <div class="col-sm-4">
                                        <div class="col-sm-12">
                                            <textarea rows="3" name="treatmenttaken" ng-model="item.RTreatmentTaken" maxlength="4000" style="width:100%;"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="col-sm-12">
                                    <div class="col-sm-4">
                                        <label style="margin-left:91px;" for="severity" translate="patientemr.eyehistorysections.severity.lbl"></label>
                                    </div>
                                    <div class="col-sm-4" style="margin-left: -97px;">
                                        <div class="col-sm-12">
                                            <ui-select ng-model="item.LSeverityId" name="severity">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Severity | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="col-sm-4">
                                        <div class="col-sm-12">
                                            <ui-select ng-model="item.RSeverityId" name="severity">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Severity | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- </div> -->
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="panel-footer formactionbar">
        <div class="pull-right">
            <button type="button" class="draftbutton" ng-click="saveItem()" translate="common.saveaction.lbl"></button>
            <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
        </div>
    </div>
</div>
