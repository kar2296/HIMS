<style>
    div#social_toogle {
        /* background: rgb(125, 122, 15); */
    }
</style>
<div class="panel {{currentcontext.paneltype}} portlet-panel" ng-controller="FamilyConditionSectionController as vm">
    <div class="panel-heading portlet-panel-heading" id="familycon_toogle">
        <strong translate="patientemr.patientdashboard.familyconditions.lbl"></strong>
        <i class="fa fa-angle-down cust_downarrow fconcommon_arrow"></i>
        <i class="fa fa-angle-right cust_rightarrow fcon2common_arrow"></i>
        <a ng-click="handleEvents('add')" class="pull-right lnk-portlet-header-action" uib-tooltip="{{ 'common.addnewaction.lbl' | translate }}"
            tooltip-placement="top">
            <i class="fa fa-plus btn-circle" aria-hidden="true"></i>
        </a>
    </div>
    <div class="panel-wrapper clearfix">
        <div class="panel-body portlet-panel-body familycon_toggle">
            <div class="table-responsive">
                <table class="table table-striped table-condensed">
                    <tbody>
                        <tr class="portlet-tr" ng-repeat="item in items | limitTo: currentcontext.recordcount">
                            <td class="lefcol2">{{item.DiagnosisName}}</td>
                            <td class="lefcol4">{{item.Relationship.Description}}</td>
                            <td class="td-action">
                                <a ng-click="handleEvents('edit', item)" class="lnk-portlet-action" uib-tooltip="{{ 'common.editaction.lbl' | translate }}"
                                    tooltip-placement="left">
                                    <i class="fa fa-pencil-square-o btn btn-default btn-rounded" aria-hidden="true"></i>
                                </a>
                                <a ng-click="handleEvents('delete', item)" class="lnk-portlet-action" uib-tooltip="{{ 'common.deleteaction.lbl' | translate }}"
                                    tooltip-placement="left">
                                    <i class="fa fa-times-circle btn btn-default btn-rounded" aria-hidden="true"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
    $(document).ready(function () {
        $(".fconcommon_arrow").click(function () {

            $(".familycon_toggle").toggle("slow");

        });
    });

</script>
<style>
    .familycon_toggle {
        height: 150px;

        width: 100%;
    }

    .fconcommon_arrow {
        float: right;
        padding-left: 47px;
        font-size: 24px;

    }

    .fcon2common_arrow {
        display: none;
    }
</style>
