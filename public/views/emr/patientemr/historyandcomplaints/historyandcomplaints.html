<div id="emrdashboard">
    <div class="row page-header">
        <div class="col-sm-12">
            <div class="col-xs-5 col-sm-4 col-md-7">
                <h4 class="page-header mt0" translate="patientemr.eyehistorysections.pagetitle.lbl"></h4>

            </div>
            <div class="col-xs-7 col-sm-8 col-md-5 pull-right">
                <span>
                    <span ng-click="doctor_dashboard()">
                        <img src="app/img/main/download.png" class="img-responsive icon_home" style="width:5%;" alt="home" uib-tooltip=" Doctor Dashboard "
                            tooltip-placement="bottom">
                    </span>
                    <span ng-click="patient_dashboard()">
                        <img src="app/img/main/patdash.png" class="img-responsive icon_emrboard" style="width:5%" alt="home" uib-tooltip="Patient Dashboard"
                            tooltip-placement="bottom">
                    </span>
                    <button class="text-white btn res-color14 btn-xs pull-right" ng-click="configuration()" uib-tooltip="{{ 'patientemr.emrconfiguration.tooltiptitle.lbl' | translate }}"
                        tooltip-placement="bottom">
                        <i class="fa fa-cog" aria-hidden="true"></i>
                    </button>
                    <button class="btn btn-xs pull-right btn-filter" id="expand_all" ng-click="addNew()" style="background:rgba(10, 140, 216, 0.83);"
                        uib-tooltip="" tooltip-placement="bottom">
                        <i class="fa fa-" aria-hidden="true"></i>&nbsp;&nbsp;
                        <span translate="" class="ng-scope">
                            <span class="ng-scope">Expand All</span>
                        </span>
                    </button>
                    <button class="btn btn-xs pull-right btn-filter" id="collapse_hide" ng-click="addNew()" style="background:#6fb944;" uib-tooltip=""
                        tooltip-placement="bottom">
                        <i class="fa fa-" aria-hidden="true"></i>&nbsp;&nbsp;
                        <span translate="" class="ng-scope">
                            <span class="ng-scope">Collapse All</span>
                        </span>
                    </button>
                </span>
            </div>
        </div>
    </div>
    <div class=" dashboard-div pmh_resp pmh_dashbooard">
        <div class="col-sm-12 col-md-12 col-lg-12">
            <div ng-repeat="section in sections" class="col-xs-12 col-sm-12 col-md-12 col-lg-12" ng-include="section.tmpl"></div>
        </div>

    </div>
    <div class="panel-footer formactionbar">
        <div class="row">
            <div class="col-sm-12">
                <div class="col-sm-3 col-md-6 col-lg-6">
                    <div class="pull-left">
                        <button type="button" class=" text-white btn prv-color12 btn-sm" ng-click="openPreviousAppointment()" translate="patientemr.patientdashboard.pastvisit.lbl"
                            ng-click="openPreviousAppointment()"></button>
                    </div>
                </div>
                <div class="col-sm-9 col-md-6 col-lg-6">
                    <div class="pull-right">
                        <button type="button" id="btndischarge" type="button" ng-show="canShowDischargeBtn&&Encounter.AdmissionStatusId!==5" class="btn pyr-color10 btn-sm"
                            ng-click="fitfordischarge()" translate="admission.fitdischarge-action.lbl"></button>
                        <button id="btndischarge" type="button" ng-show="canShowDischargeBtn&&Encounter.AdmissionStatusId!==5" class="btn btn-warning  btn-sm"
                            ng-click="clinicalDischarge()" translate="admission.clinicaldischarge.lbl"></button>
                        <button id="btndischarge" type="button" ng-show="canShowDischargeBtn&&Encounter.AdmissionStatusId==5" class="draftbutton"
                            ng-click="patientDischarge()" translate="admission.discharge-action.lbl"></button>
                        <button type="button" style="margin-right: 30px;background:#000;"  class="draftbutton" ng-click="print()" translate="common.printaction.lbl"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
<script>
    $(document).ready(function () {
        $("#collapse_hide").click(function () {

            $(".panel-body").hide("slow")


        });
        $("#expand_all").click(function () {

            $(".panel-body").show("slow");


        });
    });
</script>
