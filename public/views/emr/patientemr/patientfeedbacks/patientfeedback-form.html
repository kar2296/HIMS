<style>
    table {
        margin-bottom: 10px;
    }

    form td {
        border: unset !important;
    }

    .description b {
        color: #006b99;
        font-weight: bolder !important;
        font-size: 14px;
    }

    .btn-group label:hover {
        border-radius: 5px !important;
        /*  background: #46761b; */
        color: white;
    }

    .feedback {
        font-weight: 500;
        color: black;
        font-size: 14px;
    }

    .well {
        box-shadow: unset;
        margin-bottom: -8px;
        /* background-color: rgba(253, 255, 228, .75) !important; */
        border: unset;
    }

    legend.legendStyle {
        font-size: 90%;
        color: #38579c !important;
        background-color: transparent;
        font-weight: 500;
        box-shadow: unset;
        border-radius: 2px;
        padding-left: 5px;
        padding-right: 5px;
        padding: 6px;
        font-size: 17px;
        margin-bottom: 14px !important;
    }

    .POOR .feedback-icon::before {
        content: "\f119";
        font-family: 'Font Awesome 5 Free';
    }

    .SATISFACTORY .feedback-icon::before {
        content: "\f11a";
        font-family: 'Font Awesome 5 Free';
    }

    .GOOD .feedback-icon::before {
        content: "\f118";
        font-family: 'Font Awesome 5 Free';
    }

    .EXCELLENT .feedback-icon::before {
        content: "\f587";
        font-family: 'Font Awesome 5 Free';
    }

    .feedback-icon {
        font-size: 24px;
    }

    label.btn.btn-sm.width.btn-custom-radio {
        margin: 0 !important;
        padding: 0px !important;
        width: auto !important;
        margin-right: 5px !important;
        padding-left: 14px !important;
        padding-right: 14px !important;
    }

    label.btn.btn-sm.width.btn-custom-radio span {
        font-weight: 500 !important;
    }

    .btn-group label.POOR:hover {
        border-radius: 5px !important;
        color: #e30f0f;
    }

    .btn-group label.SATISFACTORY:hover {
        border-radius: 5px !important;
        color: #FFC107;
    }

    .btn-group label.GOOD:hover {
        border-radius: 5px !important;
        color: #2196F3;
    }

    .btn-group label.EXCELLENT:hover {
        border-radius: 5px !important;
        color: #7edb11;
    }

    .btn-feedback-selected {
        color: #ffffff;
        background-color: unset !important;
        border-color: unset !important;
        border-radius: 4px !important;
        border: unset !important;
    }

    .btn-group .btn-feedback-selected:hover {
        background: unset !important;
    }

    .btn-feedback-selected.POOR,
    .btn-group .btn-feedback-selected.POOR:hover {
        color: #e30f0f !important;
    }

    .btn-feedback-selected.SATISFACTORY,
    .btn-group .btn-feedback-selected.SATISFACTORY:hover {
        color: #FF9800 !important;
    }

    .btn-feedback-selected.GOOD,
    .btn-group .btn-feedback-selected.GOOD:hover {
        color: #2196F3 !important;
    }

    .btn-feedback-selected.EXCELLENT,
    .btn-group .btn-feedback-selected.EXCELLENT:hover {
        color: #7edb11 !important;
    }

    label.btn.btn-sm.width.btn-custom-radio {
        border: unset !important;
    }

    label.btn.btn-sm.width.btn-custom-radio.btn-feedback-selected.POOR {
        border: 1px solid #e30f0f !important;
    }

    label.btn.btn-sm.width.btn-custom-radio.btn-feedback-selected.SATISFACTORY {
        border: 1px solid #FF9800 !important;
    }

    label.btn.btn-sm.width.btn-custom-radio.btn-feedback-selected.GOOD {
        border: 1px solid #2196F3 !important;
    }

    label.btn.btn-sm.width.btn-custom-radio.btn-feedback-selected.EXCELLENT {
        border: 1px solid #7edb11 !important;
    }

    h3.ng-binding {
        padding: 0px 0px !important;
        color: #274994 !important;
        margin-bottom: 0px;
        margin-top: 0px;
        font-size: 20px;
        font-family: 'Poppins', sans-serif;
        font-weight: 600 !important;
        font-size: 17px !important;
    }

    .item-center {
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .FAIR .feedback-icon::before {
        content: "\f118";
        font-family: 'Font Awesome 5 Free';
    }
    .btn-group label.FAIR:hover {
        border-radius: 5px !important;
        color: blue;
    }

    .btn-feedback-selected.FAIR,
    .btn-group .btn-feedback-selected.FAIR:hover {
        color: blue !important;
    }
    label.btn.btn-sm.width.btn-custom-radio.btn-feedback-selected.FAIR {
        border: 1px solid blue !important;
    }

</style>
<div class="row page-header" id="assets">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="patientemr.patientfeedbacks-form.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <!-- <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div> -->
    </div>
</div>
<div class="row">
    <patientbanner patientid="item.PatientId"></patientbanner>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-12" ng-repeat="item in FeedbackDetails">
            <div class="header">
            </div>
            <div class="row" ng-repeat="feedback in item.Feedbacks | filter:{FeedbackCategoryId:item.Id}">
                <div class="col-sm-7">
                    <h3>{{item.Text ||item.FeedbackCategory}}</h3>
                    <div class="feedback">{{feedback.Text||feedback.FeedbacksMaster.Feedbacks}}
                        <span class="description">
                            <b>({{feedback.Description}})</b>
                        </span>
                    </div>
                </div>
                <div class="col-sm-5 item-center">
                    <radiogroupcontrol itemid="feedback.RatingId" items="lookup.Rating" isdisabled="IsCompleted">
                    </radiogroupcontrol>
                </div>
            </div>
            <!-- <div class="col-sm-12">
                <table>
                    <tr ng-repeat="feedback in item.Feedbacks | filter:{FeedbackCategoryId:item.Id}">
                        <td style="width: 70%;">
                            <div class="feedback">{{feedback.Text||feedback.FeedbacksMaster.Feedbacks}}
                                <span class="description">
                                    <b>({{feedback.Description}})</b>
                                </span>
                            </div>

                        </td>
                        <td class="col-sm-10 col-lg-6 col-xs-8">
                            <radiogroupcontrol itemid="feedback.RatingId" items="lookup.Rating"
                                isdisabled="IsCompleted"></radiogroupcontrol>
                        </td>
                    </tr>
                </table>
            </div> -->
        </div>
        <div>
            <fieldset class="well">
                <legend class="legendStyle">
                    <span>Signature</span>
                </legend>
                <div class="col-sm-6">
                    <img ng-if="item.signimagedata" height="100" width="250" ng-src="{{item.signimagedata}}">
                    <img height="100" width="250" ng-if="!item.signimagedata && item.SignPath"
                        data-ng-src="data:image/png;base64,{{currentcontext.SignPhoto}}" />
                </div>
                <div class="col-sm-8">
                    <button type="button" class="btn btn-info btn-xs" translate="appmanager.user.signaction.lbl"
                        ng-click="openSignModal()"></button>
                </div>
            </fieldset>
            <textarea type="text" class="form-control" translate translate-attr-placeholder="Remarks"
                ng-model="item.Remarks" placeholder="Message" style="height: 100px !important;"></textarea>
        </div>
    </form>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="pull-left">
            <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()">
                <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                <span class="btn-fontsize" translate="common.backaction.lbl"></span>
            </button>
        </div>
        <div class="pull-right">
            <!--<button type="button"  class="draftbutton" ng-if="IsDisabled || item.OrderStatusId==3 ||item.OrderStatusId==4||item.OrderStatusId==5||item.OrderStatusId==6||item.OrderStatusId==7||item.OrderStatusId==8||item.OrderStatusId==9||IsDisabled0"
                            ng-click="print()" translate="common.printaction.lbl"></button>-->
            <!-- <button type="button" class="draftbutton" ng-if="EnableSave" translate="common.saveaction.lbl" ng-click="savedraft()"></button> -->
            <button type="button" class="draftbutton" ng-if="EnableApprove" translate="Save"
                ng-click="saveapprove()"></button>
            <!-- <button type="button" class="btn dem-color4 text-white btn-sm" ng-if="EnableReview" translate="patientemr.patientfeedbacks-form.review-action.lbl"
                        ng-click="confirmation(3)"></button> -->

            <!-- <button id="btnClearForm" type="button" class="draftbutton" ng-if="EnableClear" ng-click="clear()" translate="common.clearaction.lbl"></button> -->
        </div>
    </div>
</div>
