<style>
    .fooder-bgs {
        margin-bottom: 0px !important;
        height: 1% !important;
        margin-top: 2px;
    }

    tr td {
        border: unset !important;
    }

    /* table td[class*="col-"],
    table th[class*="col-"] {
        border-bottom: 1px solid gainsboro !important;
    } */

    table {
        margin: 0px 0px;
        margin-bottom: 7px !important;
        table-layout: fixed;
        width: 100%;
        max-width: 100%;
        padding: 0px !important;
        border: none !important;
        border-bottom: 1px solid !important;
    }

    label.btn.btn-sm.width {
        /* margin-left: 20px !important;
        padding: 15px;
        border-radius: 32px !important;
        width: 15% !important; */
        margin-left: 5px !important;
        padding: 12px;
        border-radius: 11px !important;
        width: 14% !important;
    }

    label.btn.btn-sm.btn-custom-radio.ng-not-empty.active.btn-success {
        padding: 12px;
        border-radius: 11px !important;
        width: 14% !important;
        height: 45px;
    }

    #bannerdetails tr td:nth-child(odd) {
        font-size: 12px;
    }

    table {
        border-collapse: collapse;
        border: 1px solid #b1acac !important;
    }

    table#bannerdetails {
        WIDTH: 100% !important;
    }

    .row {
        padding-left: 0px !important;
    }

    .btn-feedback {
        width: 100px;
        height: 50px;
        border: 1px solid #979797;
        box-sizing: border-box;
        border-radius: 29px;
    }

    .btn-custom-radio.btn-success {
        width: 100px;
        height: 50px;
        border: 1px solid #979797;
        box-sizing: border-box;
        border-radius: 29px;
    }

    .facilitylogo img {
        margin-top: 5px !important;
        /* width: 20%;
        float: right; */
    }

    .facilitylogo h4 {
        margin-top: 5px;
    }

    /*hide sidebar*/
    .layout-fixed .wrapper>.aside>.aside-inner,
    .layout-fixed .wrapper .topnavbar-wrapper,
    .aside-collapsed .wrapper>.aside>.aside-inner,
    em.fa.fa-navicon {
        display: none !important;
    }

    /* .aside-collapsed .wrapper>.aside>.aside-inner {
        display: none !important;
    }

    em.fa.fa-navicon {
        display: none;
    } */

    .aside-collapsed .wrapper>section,
    .aside-collapsed .wrapper>footer {
        margin-left: 0px !important;
    }

    .wrapper>.aside {
        width: 0px;
    }

    .wrapper>section,
    .wrapper>footer {
        margin-left: 0px !important;
    }

    .aside-collapsed .wrapper>.aside,
    .aside-collapsed .wrapper>.aside>.aside-inner {
        width: 0px;
    }

    /*hide sidebar*/
    .wrapper>section {
        height: 100%;
    }

    .signature.ng-isolate-scope {
        border: 1px solid;
        width: 100% !important;
        max-width: 41% !important;
        height: 150px;
        max-height: 150px !important;
        float: right;
        margin-right: 7%;
    }

    .btn-custom-radio.btn-success:nth-child(1) {
        background: #f97979 !important;
        border: 1px solid #8080807a !important
    }

    .btn-custom-radio.btn-success:nth-child(2) {
        background: #ed904c !important;
        border: 1px solid #8080807a !important
    }

    .btn-custom-radio.btn-success:nth-child(3) {
        background: #918080 !important;
        border: 1px solid #8080807a !important
    }

    .btn-custom-radio.btn-success:nth-child(4) {
        background: #b3f55f !important;
        border: 1px solid #8080807a !important
    }

    .btn-custom-radio.btn-success:nth-child(5) {
        background: #15c947 !important;
        border: 1px solid #8080807a !important
    }

    .layout-fixed .wrapper>section {
        margin-top: 0px;
    }

    @media (max-width:1024px) {
        input.login-ip {
            width: 70%;
        }

        .btn-right {
            margin-right: 11%;
        }

        .starrating {
            line-height: 120px;
        }

        .page-header {
            padding-top: 0px;
        }

        .signature {
            max-width: 55% !important;
        }
    }

    @media(max-width:800px) {
        label.btn.btn-sm.width {
            margin-left: 4px !important;
            padding: 8px;

            width: 16% !important;
        }

        table#bannerdetails {
            WIDTH: 99% !important;
        }
    }

    @media(max-width:768px) {
        .login.card {
            padding: 0px;
        }

        .layout-fixed .wrapper>section {
            margin-top: 0px !important;
        }

        .page-header {
            padding-top: 0px;
        }

        label.btn.btn-sm.width {
            width: 18%;
        }

        .footer {
            position: absolute;
            bottom: 13%;
            left: 5%;
        }
    }

    .footer-content,
    footer {
        display: none;
    }

    .btn-btn-info {
        width: 130px;
    }

    .page-header h3 {
        line-height: 0px;
        color: #0076CC;
    }

    #bannerdetails tr td:nth-child(odd) {
        height: 55px;
    }

    .description b {
        color: #006c9a;
        font-size: 13px;
    }

    .feedback {
        color: black;
        font-weight: 500;
        font-size: 14px;
    }

    .btn-group .btn-custom-radio:hover {
         background: #46761b;
        color: white !important;
        border-radius: 6px !important;
    }

    .well {
        box-shadow: unset;
        margin-bottom: -8px;
        /* background-color: rgba(253, 255, 228, .75) !important; */
        border: unset;
    }

    legend.legendStyle {
        font-size: 90%;
        color: #38579c !important;
        background-color: transparent;
        font-weight: 500;
        box-shadow: unset;
        border-radius: 2px;
        padding-left: 5px;
        padding-right: 5px;
        padding: 6px;
        font-size: 17px;
        margin-bottom: 14px !important;
    }
</style>
<!-- <div class="col-sm-12">
    <h3 class="panel-title" translate="In-Patient Feedback"></h3>
</div> -->
<div class="row page-header">

    <div class="col-sm-6 col-md-6 col-lg-6` facilitylogo">
        <div class="col-sm-3 col-md-3 col-lg-2">
            <img class="img img-responsive " src="../../../../../app/img/idea.jpg">
        </div>
        <div class="col-sm-9 col-md-9 col-lg-9" style="padding: 0px;">
            <h3>Patient Feedback</h3>
        </div>
        <!-- <button type="button" class="btn btn-danger btn-sm pull-right" translate="x" ng-click="cancelCallback()"></button> -->
    </div>
    <div class="col-sm-6">
        <button type="button" class="btn btn-sm pull-right" ng-click="home()">
            <i class="fa fa-home" aria-hidden="true"></i>
        </button>
    </div>

</div>
<patientbanner patientid="item.PatientId"></patientbanner>
<form id="item_form" name="item_form" class="form-horizontal" role="form">
    <div class="col-sm-12" ng-repeat="item in FeedbackDetails">

        <div class="header">
            <h3>{{item.Text ||item.FeedbackCategory}}</h3>
        </div>
        <div class="col-sm-12">
            <table>
                <tr ng-repeat="feedback in item.Feedbacks | filter:{FeedbackCategoryId:item.Id}">
                    <td class="col-sm-4 col-lg-6 col-xs-4">
                        <div>{{feedback.Text||feedback.FeedbacksMaster.Feedbacks}}</div>
                        <div><b>({{feedback.Description}})</b></div>
                    </td>
                    <td class="col-sm-8 col-lg-6 col-xs-8">
                        <radiogroupcontrol itemid="feedback.RatingId" items="lookup.Rating" isdisabled="IsCompleted">
                        </radiogroupcontrol>
                    </td>
                </tr>
            </table>
        </div>
    </div>
    <div class="col-sm-12">
        <div class="signdiv">
            <signature-pad accept="accept" clear="clear" height="220" width="568" dataurl="dataurl"></signature-pad>
        </div>
    </div>

    <div class="fooder-bgs">
        <div class="row ">
            <div class="col-sm-6">

            </div>
            <div class="col-sm-6">
                <div class="pull-right btn-right">
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backTootp()">
                        <i class="fa fa-arrow-left" aria-hidden="true"></i> &nbsp;
                        <strong translate="common.backaction.lbl"></strong>
                    </button>
                    <button type="button" class="btn btn-info btn-md" translate="common.saveaction.lbl"
                        ng-click="saveItem(); doneAction()"></button>

                </div>
            </div>
        </div>
    </div>
</form>

<form id="item_form" name="item_form" class="form-horizontal" role="form">


    <div class="fooder-bgs">
        <div class="row ">
            <div class="col-sm-6">

            </div>
            <div class="col-sm-6">
                <div class="pull-right">

                    <button type="button" class="draftbutton" ng-if="EnableSave" translate="common.saveaction.lbl"
                        ng-click="savedraft()"></button>
                    <button type="button" class="btn btn-info btn-sm" ng-if="EnableApprove"
                        translate="common.saveapprove-action.lbl" ng-click="saveapprove()"></button>

                </div>
            </div>
        </div>
    </div>
</form>
