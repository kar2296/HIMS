<link href="app/css/emr.css" rel="stylesheet">
<style>
    /* label.btn.btn-sm.width.btn-custom-radio.btn-default-tab {
         background: #46761b;
        color: #fff;
        margin-right: 2px;
    } */

    .form-horizontal .form-group {
        margin-bottom: 6px;
        height: 60px;
    }

    textarea {
        height: 40px;
    }
</style>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-12">
            <label class="history" translate="Symptoms"></label>
        </div>
        <div class="col-sm-12">
            <div class="form-group">
                <label class="col-sm-12 control-label" for="illnesstype"
                    translate="patientemr.clinicalnotes.illnesstype.lbl"></label>
                <div class="col-sm-12" id="btn-symptoms">
                    <radiogroupcontrol itemid="item.IllnessTypeId" items="lookup.IllnessType" name="illnesstype"
                        isrequired="true" required></radiogroupcontrol>
                </div>
            </div>
            <div class="form-group col-sm-4" id="cheifdrop">
                <label class="col-sm-12 control-label" for="complaints"
                    translate="patientemr.clinicalnotes.complaints.lbl"></label>
                <div class="col-sm-10">
                    <ui-select ng-model="item.ComplaintId" ng-change="getComplaints()" name="complaints">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.ChiefComplaint | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
                <div class="col-sm-2">
                    <button type="button" class="btn-add" tabindex="tabindexmap.patienttabindex"
                        ng-click="addcomplaints()"
                        uib-tooltip="{{ 'patientemr.clinicalnotes.addcomplaint.lbl' | translate }}"
                        tooltip-placement="top">
                        <i class="fa fa-plus" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="complaints" translate="Chief Complaints"></label>
                <div class="col-sm-12">
                    <textarea class="textarea" rows="1" name="details" ng-model="item.ChiefComplaints"
                        maxlength="4000"></textarea>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" translate="patientemr.clinicalnotes.examinations.lbl"></label>
                <div class="col-sm-10">
                    <ui-select ng-model="item.ExaminationId" ng-change="getExaminations()" name="facility">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.ExaminationMaster | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
                <div class="col-sm-2">
                    <button type="button" class="btn-add" tabindex="tabindexmap.patienttabindex"
                        ng-click="addexaminations()"
                        uib-tooltip="{{ 'patientemr.clinicalnotes.addexamination.lbl' | translate }}"
                        tooltip-placement="top">
                        <i class="fa fa-plus" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="complaints" translate="Examinations"></label>
                <div class="col-sm-12">
                    <textarea class="textarea" rows="1" name="details" ng-model="item.Examinations"
                        maxlength="4000"></textarea>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" translate="patientemr.clinicalnotes.comment.lbl"></label>
                <div class="col-sm-12">
                    <textarea class="textarea" rows="1" name="details" ng-model="item.TreatmentComments"
                        maxlength="4000"></textarea>
                </div>
            </div>

            <div class="col-sm-12 labelillness">
                <label class="history" translate="patientemr.clinicalnotes.historyofillness.lbl"></label>
            </div>
            <div class="form-group col-sm-6">
                <label class="col-sm-3 control-label" for="illnessduration"
                    translate="patientemr.patientchiefcomplaint-list.illnessduration.lbl"></label>
                <div class="col-sm-9">
                    <div class="col-sm-3 nopad">
                        <input type="text" class="form-control" onChange="numberonly($event)"
                            onKeyUp="numberonly($event)" ng-keypress="numberonly($event)" name="illnessduration"
                            ng-model="item.DurationCount" required>
                    </div>
                    <label class="col-sm-3" for="IllnessDurationType"
                        translate="patientemr.patientchiefcomplaint-list.illnessdurationperiod.lbl"></label>
                    <div class="col-sm-4 nopad">
                        <ui-select id="IllnessDurationType" ng-model="item.IllnessDurationTypeId"
                            name="IllnessDurationType" tabindex="tabindexmap.patienttabindex" required>
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.IllnessDurationType | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>
            </div>
            <div class="form-group col-sm-6">
                <label class="col-sm-3 control-label"
                    translate="patientemr.patientchiefcomplaint-list.location.lbl"></label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" ng-model="item.Location">
                </div>
            </div>
            <div class="form-group col-sm-6">
                <label class="col-sm-3 control-label"
                    translate="patientemr.patientchiefcomplaint-list.quality.lbl"></label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" ng-model="item.Quality">
                </div>
            </div>
            <div class="form-group col-sm-6">
                <label class="col-sm-3 control-label"
                    translate="patientemr.patientchiefcomplaint-list.severity.lbl"></label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" ng-model="item.Severity">
                </div>
            </div>
            <div class="form-group col-sm-6">
                <label class="col-sm-3 control-label"
                    translate="patientemr.patientchiefcomplaint-list.timing.lbl"></label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" ng-model="item.Timing">
                </div>
            </div>
            <div class="form-group col-sm-6">
                <label class="col-sm-3 control-label"
                    translate="patientemr.patientchiefcomplaint-list.context.lbl"></label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" ng-model="item.Context">
                </div>
            </div>
            <div class="form-group col-sm-6">
                <label class="col-sm-3 control-label"
                    translate="patientemr.patientchiefcomplaint-list.modifyingfactors.lbl"></label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" ng-model="item.ModifyingFactors">
                </div>
            </div>
        </div>
    </form>
</div>
</div>
<div class="fooder-bgs">
    <!-- <div class="row "> -->
    <div class="col-sm-12">
        <div class="text-left">
            <!-- <button type="button" style="color: black;float: left;" class="btn pyr-color10 btn-sm"
                ng-click="backToList()">
                <i class="fa fa-angle-left" aria-hidden="true"></i>
                <strong class=""> &nbsp; Back</strong>
            </button> -->
        </div>
        <div class="text-right">
            <button id="btnSave" type="button" class="draftbutton"
                ng-hide="currentcontext.encounter.EncounterStatusId==2" translate="common.saveaction.lbl"
                ng-click="saveItem()"></button>
        </div>
    </div>
    <!-- </div> -->
</div>
