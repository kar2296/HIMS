<link href="app/css/emr.css" rel="stylesheet">
<style>
    ul.nav.nav-pills.nav>li>a {
         background: #46761b;
        color: #fafafa;
        border-radius: 0;
        padding: 4px;
        height: 32px;
    }

    .nav.nav-pills .active>a {
        color: #006c9a !important;
        background: #fff !important;
        border: 1px solid #006c9a;
        box-shadow: rgb(50 50 93 / 25%) 0px 2px 5px -1px, rgb(0 0 0 / 30%) 0px 1px 3px -1px;
        height: unset;
    }

    .nav>li>a:hover,
    .nav>li>a:focus {
         background: #46761b;
    }
</style>
<div class="row">
    <div class="col-sm-12">
        <h4 class="page-header mt0" translate="Notifiable Diseases"></h4>
    </div>
</div>
<emrpatientbanner ng-if="context=='emr'||context=='vorders'" patientid="currentcontext.pid" encounterid="currentcontext.eid">
</emrpatientbanner>
<ippatientbanner ng-if="context=='ipemr'||context=='aeemr'||context=='surgery'" patientid="currentcontext.pid" encounterid="currentcontext.eid">
</ippatientbanner>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-4">

        </div>
        <div class="col-sm-12">
            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label" for="diseasetype" translate="Type"></label>
                <div class="col-sm-12">
                    <ui-select id="diseasetype" ng-model="item.NotifiableDiseaseTypeId" name="diseasetype" required>
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.NotifiableDiseaseType | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label" for="disease" translate="Notifiable Disease"></label>
                <div class="col-sm-12">
                    <ui-select ng-model="item.NotifiableDiseaseId" name="disease" on-select="SelectedDisease($select.selected)" required>
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.NotifiableDisease | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label" for="notes" translate="Additional Notes"></label>
                <div class="col-sm-12">
                    <textarea rows="3" name="notes" ng-model="item.Notes" maxlength="1000"></textarea>
                </div>
            </div>
        </div>
        <div class="col-sm-12">
            <div class="col-sm-3 form-group">
                <label class="col-sm-12" translate="Created At"></label>
                <div class="col-sm-12">
                    <div class="datepicker">
                        <input type="text" class="form-control" name="performdate" ng-date-object datepicker-options="datePickerOptions" uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}" ng-click="performdatePopup = { opened: true }"
                            is-open="performdatePopup.opened" ng-model="item.PerformedDate">
                        <i class="fa fa-calendar" aria-hidden="true"></i>
                    </div>
                </div>
            </div>
            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label" for="disease" translate="Created By"></label>
                <div class="col-sm-12">
                    <ui-select ng-model="item.CreatedBy" name="disease" ng-disabled="true">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.User | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label" for="isactive" translate="clinicalmaster.allergy-form.isactive.lbl"></label>
                <div class="col-sm-12">
                    <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
                </div>
            </div>
        </div>
        <div class="col-sm-12" style="margin-top: 10px;">
            <div class="pull-right">
                <button type="submit" class="draftbutton" ng-click="saveItem()" translate="common.saveaction.lbl"></button>
            </div>
        </div>
    </form>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex" ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
