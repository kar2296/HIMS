<link href="app/css/emr.css" rel="stylesheet">
<style>
    td.lefcol2 {
        width: 43% !important;
    }
</style>
<div class="panel {{currentcontext.paneltype}} portlet-panel" ng-controller="DoctorNotesSectionController as vm">
    <div class="panel-heading portlet-panel-heading0" id="condition_toggle" ng-click="">
        <strong translate="Doctor Notes"></strong>
        <a ng-click="handleEvents('list')" class="pull-right lnk-portlet-header-action"
            uib-tooltip="{{ 'common.moredetailsaction.lbl' | translate }}" tooltip-placement="bottom">
            <i id="condition_toggle1" class="fa fa-info btn-circle" aria-hidden="true"></i>
        </a>

    </div>
    <div class="panel-wrapper">
        <div class="panel-body portlet-panel-body condition_toggle" id="content2">
            <div class="table-responsive">
                <table class="table table-hover table-bordered ">
                    <thead>
                        <th>Date</th>
                        <th>Doctor</th>
                        <th>Notes</th>
                    </thead>
                    <tbody>
                        <tr class="portlet-tr" ng-repeat="item in items | limitTo: currentcontext.recordcount">
                            <td class="lefcol1">
                                <ngformatdate date-val='item.CapturedOn'>{{item.CapturedOn}}</ngformatdate>
                            </td>
                            <td class="lefcol2"><span class="sub-lef2">{{item.CapturedUser.Title.Description}}
                                    &nbsp;{{item.CapturedUser.FirstName}} &nbsp;{{item.CapturedUser.LastName}}</span>
                            </td>
                            <td class="lefcol3">
                                <span class="sub-lef1">{{item.DailyNote}}</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</script>
