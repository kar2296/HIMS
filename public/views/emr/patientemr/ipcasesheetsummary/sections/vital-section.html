<style>
    font {
        padding: 0px 5px 1px 1px;
    }

    div#vital_toogle {
        /* background: rgb(0, 185, 230); */
        background: #553ce487;
    }

    th.lefcol3.ng-binding {
        color: black !important;
        border: unset !important;
    }

    th.fs-12.col-sm-3 {
        background: #0073bc !important;
    }

    th.fs-12.col-sm-2 {
        background: #0073bc !important;
    }

    th.fs-12.col-sm-4 {
        background: #0073bc !important;
    }

    th.fs-12.col-sm-1 {
        background: #0073bc !important;
    }

    .table>thead>tr>th {
        padding: 10px 8px !important;
        /* color: #888; */
    }

    th.cell-align-center {
        background: #0073bc !important;
    }

    th.lefcol3.ng-binding {
        color: #e4650a !important;
        border: unset !important;
        background: white !important;
    }
</style>

<div class="panel {{currentcontext.paneltype}} portlet-panel" ng-controller="vitalSectionController as vm">
    <div class="panel-heading portlet-panel-heading0" id="vital_toogle">
        <strong translate="patientemr.patientdashboard.vitals.lbl"></strong>
        <a ng-click="handleEvents('list')" class="pull-right lnk-portlet-header-action "
            uib-tooltip="{{ 'common.moredetailsaction.lbl' | translate }}" tooltip-placement="top">
            <i id="vital_toggle1" class="fa fa-info btn-circle" aria-hidden="true"></i>
        </a>
    </div>
    <div class="panel-wrapper">
        <div class="panel-body portlet-panel-body vital_toggle" id="content2">
            <div class="table-responsive">
                <table class="table table-striped table-condensed">
                    <tbody>
                        <tr class="portlet-tr" ng-repeat="item in items | limitTo: currentcontext.recordcount">

                            <th class="lefcol3" style="width:12%;">{{item.PerformedDate}}</th>
                            <td class="lefcol2">
                                <p data-ng-bind-html="item.Vitalinfo"></p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

</div>

<script>
    $(document).ready(function () {
        $(".vcommon_arrow").click(function () {

            $(".vital_toggle").toggle("slow")
            //  $(this).find('i').toggleClass("fa fa-angle-down fa fa-angle-right")
        });
    });
</script>
<style>
    .vital_toggle {
        height: 150px;
        width: 100%;
    }

    .vcommon_arrow {
        float: right;
        padding-left: 47px;
        font-size: 24px
    }

    .v2common_arrow {
        display: none;
    }
</style>
