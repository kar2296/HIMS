<script type="text/ng-template" id="sh_single.html">
    <div class="col-sm-{{question.cls}}">
        <div class="btn-group quest-btn-group">
            <label ng-repeat="option in question.options" class="btn btn-default btn-xs" ng-model="question.answers" uib-btn-radio="'{{option.code}}'">
                     <span ng-bind-html="option.text"></span>
            </label>
            </div>
    </div>
</script>

<script type="text/ng-template" id="sh_combo.html">
    <div class="col-sm-{{question.cls}} sh_combo">
        <ui-select ng-model="question.answers">
            <ui-select-match>
                {{$select.selected.text | limitTo : 20 : 0}}
                <span ng-if="$select.selected.text.length>20">...</span>
            </ui-select-match>
            <ui-select-choices repeat="lookupitem.code as lookupitem in question.options | filter: { text: $select.search }">
                <div ng-bind-html="lookupitem.text | highlight: $select.search"></div>
            </ui-select-choices>
        </ui-select>
    </div>
</script>

<script type="text/ng-template" id="sh_display.html">
    <div class="col-sm-{{question.cls}} quest-display">
        <span>{{question.display}}</span>
    </div>
</script>

<script type="text/ng-template" id="sh_text.html">
    <div class="col-sm-{{question.cls}} quest-text">
        <input type="text" class="form-control" ng-model="question.answers">
    </div>
</script>

<script type="text/ng-template" id="sh_textarea.html">
    <div class="col-sm-{{question.cls}} quest-text">
        <textarea rows="2" cols="50" class="form-control" ng-model="question.answers"></textarea>
    </div>
</script>


<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="patientemr.shoulderassessment.pagetitle.lbl"></h4>
    <div class="col-sm-6 col-md-6 col-lg-6">
            <span ng-click="doctor_dashboard()">
                <img src="app/img/main/download.png" class="img-responsive icon_home" style="width:4.5%;float:right;" alt="home" uib-tooltip=" Doctor Dashboard "
                    tooltip-placement="bottom">
            </span>
            <span ng-click="patient_dashboard()">
                <img src="app/img/main/patdash.png" class="img-responsive icon_emrboard" style="width:4.5%;margin-right:0.5%;float:right;" alt="home"
                    uib-tooltip="Patient Dashboard" tooltip-placement="bottom">
            </span>
            <span ng-click="checkedinpatients()">
                    <img src="app/img/main/checkedin.png" class="img-responsive icon_bed" style="width:4.5%;margin-right:1%;" alt="chckdpat" uib-tooltip="Checkedin Patients"
                        tooltip-placement="bottom">
                </span>
        </div>
</div>

<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot shoulder-body" set-form-height0>
                <div class="panel-body form-panel">
                    <div class="col-sm-12 ">
                        <div class="section-div" ng-repeat="item in workarea.Items">
                            <div class="row">
                                <div class="col-12 div-section-info all-border" ng-if="item.info">
                                    <div ng-bind-html="item.info"></div>
                                </div>
                            </div>
                            <div class="row" ng-repeat="row in item.rows">
                                <div class="col-sm-{{col.cls}} all-border" ng-repeat="col in row.cols"> 
                                    <div class="div-qn-lbl" ng-if="col.type == 'label'">
                                        <span ng-bind-html="col.display"></span>
                                    </div>
                                    <div ng-if="col.type == 'composite'">
                                        <div ng-repeat="question in col.questions" ng-include="question.type"></div>
                                    </div>
                                    <div class="div-qn-text" ng-if="col.type == 'text'">
                                        <input type="text" class="form-control" ng-model="col.answers">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

           
        </form>

    </div>
</div>
<div class="fooder-bgs">
    <div class="pull-left">
            <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()">
                    <i class="fa fa-angle-left" aria-hidden="true"></i>
                    <span class="btn-fontsize"> &nbsp; Back</span>
                </button>
    </div>
                <div class="pull-right">
                    <button type="button" class="btn btn-secondary btn-sm" translate="common.printaction.lbl" ng-click="print()"></button>
                    <button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl" ng-click="saveItem()"></button>
                    <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                </div>
            </div>
