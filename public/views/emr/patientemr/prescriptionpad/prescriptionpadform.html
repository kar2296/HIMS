<style>
    .modal-dialog {
        width: 97%;
        margin: auto;
    }
</style>
<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Prescription Pad"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="backToList()">
        </div>
    </div>
</div>


<div class="row">
    <form id="item_form0" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="prespadtype" translate="Prescription Type"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.PrescriptionTypeId" name="prespadtype">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.PrescriptionType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="createddate"
                translate="patientemr.patientdocument-form.createddate.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="startdateandtime" ng-date-object
                    datetime-picker="{{datePickerOptions.dateTimeFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="createddatePopup = { opened: true }"
                    is-open="createddatePopup.opened" ng-model="item.PrescribedOn">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <button type="button" tabindex="-1" class="drhms-billing-btn drhms-add-btn" ng-click="openprescribepad()"
                uib-tooltip="Add Prescriptions" tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
            </button>
        </div>
        <div class="col-sm-12">
            <div class="signdiv">
                <h4 translate="Prescribe"></h4>
                <div class="col-sm-12">
                    <img ng-if="item.PrescriptionData" height="350" width="1100" ng-src="{{item.PrescriptionData}}">
                    <img height="350" width="1000" ng-if="!item.PrescriptionData "
                        data-ng-src="data:image/png;base64,{{currentcontext.PrescriptionPhoto}}" />
                </div>
            </div>
        </div>
    </form>
</div>
<div class="row">
    <div class="pull-right">
        <button type="submit" ng-if="canUpdatePatientEMR()" class="draftbutton"
            translate="common.saveaction.lbl"></button>
    </div>
</div>
