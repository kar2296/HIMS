<link rel="stylesheet" href="app/css/drhms.css">
<div class="row">
    <div class="page-header">
        <div class="col-sm-8">
            <h4 class="page-header mt0" translate="Local Well Medicine"></h4>
        </div>
        <div class="col-sm-4">
            <div class="pull-right">
                <span class="drhms-billing-btn drhms-outstandingbill-btn" alt="home" ng-click="doctor_dashboard()"
                    uib-tooltip="{{'patientemr.mock.emrdashboard.lbl' | translate}}" tooltip-placement="bottom">
                    <i class="fas fa-th-large" aria-hidden="true"></i>
                </span>
                <button class="btn-add" ng-click="addNew()" uib-tooltip="{{ 'Add Local Well Medicine' | translate }}"
                    tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <ippatientbanner patientid="currentcontext.pid" encounterid="currentcontext.eid"></ippatientbanner>
</div>
<div class="row" ng-hide="context=='emr'">
    <!-- grid area starts -->
    <table class="editable-table table-striped table-bordered">
        <thead class="bg-subhead">
            <tr>
                <th style="width: 5%;">
                    <span translate="inventory.purchaserequest.sno.lbl"></span>
                </th>
                <th style="width: 30%;">
                    <span translate="Medicine Name"></span>&nbsp;*
                </th>
                <th style="width: 15%;">
                    <span translate="Sale Rate"></span>
                </th>
                <th style="width: 15%;">
                    <span translate="patientrequest.qty.lbl"></span>&nbsp;*
                </th>
                <th style="width: 10%;">Image</th>
                <th style="width: 10%;">
                    <span translate="Action"></span>
                </th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="patientstockrequest in ProductDetails track by patientstockrequest.rowId">
                <td class="fs-12">
                    <span>{{$index + 1}}</span>
                </td>
                <td class="fs-12">
                    <autosearch itemid="patientstockrequest.medicine_id" iteminfo="patientstockrequest.SelectedItem"
                        rowdata="patientstockrequest" config="vm.pharmacyitemcontrolconfig"
                        itemchange="onItemSelected($index, patientstockrequest)" class="inputsearchlogo"
                        isrequired="true" tabindex="patientstockrequest.tabindex"></autosearch>
                </td>
                <td class="fs-12">
                    <span>{{patientstockrequest.sale_rate}}</span>
                </td>
                <td class="fs-12">
                    <input type="number" min="0" class="form-control" ng-model="patientstockrequest.RequestedQuantity"
                        name="requestedquantity" tabindex="patientstockrequest.tabindex" placeholder=""
                        ng-pattern="/^\d+$/" ng-keypress="numberonly($event)">
                </td>
                <td class="text-center">
                    <img ng-if="patientstockrequest.front_medicine_image_url"
                        ng-src="{{patientstockrequest.front_medicine_image_url}}"
                        alt="{{patientstockrequest.medicine_name}}" style="height:40px;width:auto;border-radius:4px;" />
                </td>
                <td class="text-center">
                    <!-- <button class="btn btn-danger btn-xs" tabindex="-1" > -->
                    <i ng-click="deletePatientRequestDetail($index,patientstockrequest)" class="fa fa-trash"
                        aria-hidden="true"></i>
                    <!-- </button> -->
                </td>
            </tr>
        </tbody>
    </table>
</div>
<div class="footerbar">
    <div class="col-sm-12">
        <div class="col-sm-4 pull-left footer">
            <span class="col-sm-4 control-label" for="comments" translate="Order Notes"></span>
            <div class="col-sm-8">
                <input type="text" class="form-control field-height inputheightctrl" ng-disabled="commentsDisabled"
                    name="comments" ng-model="item.OrderNotes" placeholder="">
            </div>
        </div>
    </div>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="pull-left">
            <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()">
                <i class="fa fa-angle-left" aria-hidden="true"></i>
                <span class="btn-fontsize"> &nbsp; Back</span>
            </button>
        </div>
        <div class="pull-right">
            <button type="button" class="draftbutton" translate="Order" ng-click="SaveandApprove()"></button>
        </div>
    </div>
</div>
