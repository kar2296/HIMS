<div class="row">
    <div class="page-header">
        <div class="col-sm-8">
            <h4 class="page-header mt0" translate="Local Well Medicine Orders"></h4>
        </div>
        <div class="col-sm-4">
            <div class="pull-right">
                <span class="drhms-billing-btn drhms-outstandingbill-btn" ng-show="context=='emr'"
                    ng-click="doctor_dashboard()" uib-tooltip="Doctor Dashboard" tooltip-placement="bottom">
                    <i class="fas fa-th-large" aria-hidden="true"></i>
                </span>
                <button class="btn-add" ng-click="addNew()" uib-tooltip="{{ 'Add Local Well Medicine' | translate }}"
                    tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                </button>
                <span class="drhms-billing-btn drhms-home-btn" ng-hide="context=='emr'" ng-click="openAdvancedFilter()"
                    uib-tooltip="{{ 'clinicalmaster.serviceitem-list.filter-tooltip.lbl' | translate }}"
                    tooltip-placement="bottom">
                    <i class="fas fa-search"></i>
                </span>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <ippatientbanner patientid="currentcontext.pid" encounterid="currentcontext.eid"></ippatientbanner>
</div>
<div class="row" ng-hide="context=='main'">
    <div class="col-sm-4">
        <label class="col-sm-4" for="fromdate" translate="From"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" name="date" ng-change="getLocalWellOrderList()"
                datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="FromPopup = { opened: true }" is-open="FromPopup.opened" ng-model="currentfilter.From">
        </div>
    </div>
    <div class="col-sm-4">
        <label class="col-sm-4" translate="To"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" name="date" ng-change="getLocalWellOrderList()"
                datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="ToPopup = { opened: true }" is-open="ToPopup.opened" ng-model="currentfilter.To">
        </div>
    </div>
    <!-- <div class="col-sm-4">
        <label class="col-sm-4" for="patientrequeststatus" translate="patientrequests.status.lbl"></label>
        <div class="col-sm-8">
            <multiselectchk list="lookup.PatientRequestStatus" selected="currentfilter.PatientRequestStatusId"
                change="getList()"></multiselectchk>
        </div>
    </div> -->
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getLocalWellOrderList()"></ul>
    </div>
</div>
