<link href="app/css/emr.css" rel="stylesheet">
<div class="row">
    <div class="page-header">
        <div class="col-sm-8">
            <h4 class="page-header mt0" translate="patientemr.lensprescription.pagetitlerx.lbl"></h4>
        </div>
        <div class="col-sm-4">
            <div class="pull-right">
                <!-- <span class="drhms-billing-btn drhms-outstandingbill-btn" ng-click="doctor_dashboard()"
                    uib-tooltip="{{'patientemr.pmhxdashboard.doctordashboard.lbl' | translate}}"
                    tooltip-placement="bottom">
                    <i class="fas fa-th-large" aria-hidden="true"></i>
                </span>
                <span class="drhms-billing-btn drhms-home-btn" ng-click="checkedinpatients()" ng-if="context=='emr'"
                    uib-tooltip="{{'patientemr.pmhxdashboard.oplist.lbl' | translate}}" tooltip-placement="bottom">
                    <i class="fas fa-user-injured"></i>
                </span> -->
                <button class="btn-add" ng-click="addNew()"
                    uib-tooltip="{{ 'patientemr.lensprescription.pagetitlerx.lbl' | translate }}"
                    tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </div>
</div>
<emrpatientbanner patientid="currentcontext.pid" encounterid="currentcontext.eid">
</emrpatientbanner>

<div class="row">

    <div class="container-fluid " id="onerow-filter-emrprofile">
        <table>
            <tbody>
                <tr class="tbl_head">
                    <td rowspan="5" class="indication">R</td>
                    <td>Sph.</td>
                    <td>Cyl.</td>
                    <td>Axis</td>
                    <td>Prism</td>
                    <td>Base</td>
                    <td colspan="4"></td>
                    <td>Sph.</td>
                    <td>Cyl.</td>
                    <td>Axis</td>
                    <td>Prism</td>
                    <td>Base</td>
                    <td rowspan="5" class="indication">L</td>
                </tr>
                <tr>
                    <td>
                        <input type="text" class="form-control" ng-model="item.RightDistanceSph">
                    </td>
                    <td>
                        <input type="text" class="form-control" ng-model="item.RightDistanceCyl">
                    </td>
                    <td>
                        <input type="text" class="form-control" ng-model="item.RightDistanceAxis">
                    </td>
                    <td>
                        <input type="text" class="form-control" ng-model="item.RightDistancePrism">
                    </td>
                    <td>
                        <input type="text" class="form-control" ng-model="item.RightDistanceBase">
                    </td>

                    <td colspan="4" class="reading">DISTANCE</td>
                    <td>
                        <input type="text" class="form-control" ng-model="item.LeftDistanceSph">
                    </td>
                    <td>
                        <input type="text" class="form-control" ng-model="item.LeftDistanceCyl">
                    </td>
                    <td>
                        <input type="text" class="form-control" ng-model="item.LeftDistanceAxis">
                    </td>
                    <td>
                        <input type="text" class="form-control" ng-model="item.LeftDistancePrism">
                    </td>
                    <td>
                        <input type="text" class="form-control" ng-model="item.LeftDistanceBase">
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="text" class="form-control" ng-model="item.RightReadingSph">
                    </td>
                    <td>
                        <input type="text" class="form-control" ng-model="item.RightReadingCyl">
                    </td>
                    <td>
                        <input type="text" class="form-control" ng-model="item.RightReadingAxis">
                    </td>
                    <td>
                        <input type="text" class="form-control" ng-model="item.RightReadingPrism">
                    </td>
                    <td>
                        <input type="text" class="form-control" ng-model="item.RightReadingBase">
                    </td>
                    <td colspan="4" class="reading">READING</td>
                    <td>
                        <input type="text" class="form-control" ng-model="item.LeftReadingSph">
                    </td>
                    <td>
                        <input type="text" class="form-control" ng-model="item.LeftReadingCyl">
                    </td>
                    <td>
                        <input type="text" class="form-control" ng-model="item.LeftReadingAxis">
                    </td>
                    <td>
                        <input type="text" class="form-control" ng-model="item.LeftReadingPrism">
                    </td>
                    <td>
                        <input type="text" class="form-control" ng-model="item.LeftReadingBase">
                    </td>

                </tr>
                <tr>
                    <td colspan="7">ADD
                        <input type="text" class="form-control add_dec" ng-model="item.RightAdd">
                    </td>
                    <td colspan="7">ADD
                        <input type="text" class="form-control add_dec" ng-model="item.LeftAdd">
                    </td>
                </tr>
                <tr>
                    <td colspan="7">DEC
                        <input type="text" class="form-control add_dec" ng-model="item.RightDec">
                    </td>
                    <td colspan="7">DEC
                        <input type="text" class="form-control add_dec" ng-model="item.LeftDec">
                    </td>
                </tr>
                <tr>
                    <td>FORM</td>
                    <td colspan="7">FORM
                        <input type="text" class="form-control add_dec" ng-model="item.LensForm">
                    </td>
                    <td>TINT</td>
                    <td colspan="7">
                        <input type="text" class="form-control add_dec" ng-model="item.LensTint">
                    </td>
                </tr>
                <tr>
                    <td>TYPE OF LENS</td>
                    <td colspan="15">
                        <input type="text" class="form-control add_dec" ng-model="item.TypeOfLens">
                    </td>
                </tr>
                <tr>
                    <td>SEG DETAILS</td>
                    <td colspan="15">
                        <input type="text" class="form-control add_dec" ng-model="item.SegDetails">
                    </td>
                </tr>
                <tr>
                    <td>Lens Size</td>
                    <td colspan="3">
                        <input type="text" class="form-control lens_size" ng-model="item.LensSize">
                    </td>
                    <td>Lens Shape</td>
                    <td colspan="3">
                        <input type="text" class="form-control lens_size" ng-model="item.LensShape">
                    </td>
                    <td>Distance Centres</td>
                    <td colspan="3">
                        <input type="text" class="form-control lens_size" ng-model="item.DistanceCentres">
                    </td>
                    <td>Near Centres</td>
                    <td colspan="3">
                        <input type="text" class="form-control lens_size" ng-model="item.NearCentres">
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="col-sm-4 form-group0 pdl0">
            <label class="col-sm-12 control-label" for="orderinstructions"
                translate="patientemr.patientorder-form.orderinstructions.lbl" style="margin-top:20px;">
                <span class="ng-scope">Advice/Instructions</span>
            </label>
            <div class="col-sm-12">
                <textarea rows="1" name="details" ng-model="item.Instructions" maxlength="4000" style="height: 40px;"
                    class="notes-textarea"></textarea>
            </div>
        </div>
    </div>
</div>
<div class="fooder-bgs">
    <div class="pull-left">
        <button type="button" class="btn pyr-color10 btn-sm" tabindex="-1" ng-click="backToList()">
            <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
            <i class="btn-fontsize ng-scope" translate="common.backaction.lbl">
                <span class="ng-scope">Back</span>
            </i>
        </button>
        <button ng-show="item.LensPrescriptionStatusId==2" type="button" class="draftbutton" ng-click="Cancel()"
            translate="common.cancelaction.lbl"></button>
    </div>
    <div class="pull-right">
        <button type="submit" class="draftbutton"
            ng-hide="item.LensPrescriptionStatusId==2||item.LensPrescriptionStatusId==3" ng-click="save()"
            translate="common.saveaction.lbl"></button>
        <button type="button" ng-hide="item.LensPrescriptionStatusId==3" class="draftbutton"
            translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
        <button type="button" class="draftbutton" translate="Print" ng-click="print()"></button>
        <!-- <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button> -->
    </div>
</div>
