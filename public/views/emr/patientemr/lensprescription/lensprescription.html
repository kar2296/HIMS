<div class="row">
    <div class="col-sm-4">
        <label class="col-sm-4" translate="patientemr.patientprescription-list.filter_doctor.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.DoctorId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.Doctor | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="col-sm-4">
        <label class="col-sm-4" translate="patientemr.prescription-form.date.lbl"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control cwidth" ng-change="getList()"
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="fromdatePopup = { opened: true }" is-open="fromdatePopup.opened"
                ng-model="currentfilter.LensPrescriptionDate">
        </div>
    </div>
    <div class="col-sm-4">
        <label class="col-sm-4" translate="patientemr.patientprescription-list.filter_prescriptionstatus.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.LensPrescriptionStatusId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.LensPrescriptionStatus | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
