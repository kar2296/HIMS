<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="clinicalmaster.diet-form.pnldiet.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="displayid"
                translate="clinicalmaster.diet-form.Code.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="displayid" ng-model="item.DietItemCode" placeholder=""
                    required>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="allergyname"
                translate="clinicalmaster.diet-form.dietitem.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="allergyname" ng-model="item.DietName" placeholder=""
                    required>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="description"
                translate="clinicalmaster.diet-form.description.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="description" ng-model="item.Description" placeholder="">
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" translate="clinicalmaster.diagnosis-form.comments.lbl"></label>
            <div class="col-sm-12">
                <textarea rows="3" name="comments" ng-model="item.Comments" maxlength="4000" style="width:100%;"
                    class="notes-textarea"></textarea>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="DietItemType"
                translate="clinicalmaster.allergy-form.type.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.DietItemTypeId" name="DietItemType" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.DietItemType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="DietCategory"
                translate="clinicalmaster.diet-form.category.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.DietCategoryId" name="DietCategory" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.DietCategory | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="DietFrequency"
                translate="clinicalmaster.diet-form.frequency.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.DietFrequencyId" nmae="DietFrequency" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.DietFrequency | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="isactive"
                translate="clinicalmaster.diet-form.isactive.lbl"></label>
            <div class="col-sm-12">
                <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="isactive"
                translate="clinicalmaster.diet-form.isattender.lbl"></label>
            <div class="col-sm-12">
                <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsAttender">
            </div>
        </div>
    </form>
</div>
