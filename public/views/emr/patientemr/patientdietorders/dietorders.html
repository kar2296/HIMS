<link href="app/css/emr.css" rel="stylesheet">
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="patientemr.patientdietorder-form.dietorders.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="col-sm-12">
    <div class="table-responsive" id="mainresponsivetablecontrol">
        <table class="table table-hover table-responsive table-bordered custom-table">
            <thead class="bg-subhead">
                <tr>
                    <td class="cus-col tbl-header"><span translate="patientemr.previousorder-list.number.lbl"></span>
                    </td>
                    <td class="cus-col tbl-header"><span
                            translate="patientemr.previousorder-list.ordereddate.lbl"></span></td>
                    <td class="cus-col tbl-header rxname"><span
                            translate="patientemr.patientdietorder-form.diet.lbl"></span></td>
                    <td class="cus-col tbl-header"><span translate="patientemr.previousorder-list.priority.lbl"></span>
                    </td>
                    <td class="cus-col tbl-header doctor"><span
                            translate="patientemr.previousorder-list.orderedby.lbl"></span></td>
                    <td class="cus-col tbl-header"><span translate="patientemr.previousorder-list.orderto.lbl"></span>
                    </td>
                    <td class="cus-col tbl-header"><span translate="patientemr.previousorder-list.status.lbl"></span>
                    </td>
                </tr>
            </thead>
            <tr ng-repeat="item in items">
                <td class="cus-col ">
                    <button style="float: right;" class="btn btn-default btn-xs" ng-click="toggleCanShowDetails(item)">
                        <i class="fa fa-plus" aria-hidden="true" ng-show="!item.CanShowDetails"></i>
                        <i class="fa fa-minus" aria-hidden="true" ng-show="item.CanShowDetails"></i>
                    </button>
                    <span>{{item.OrderNumber}}</span>
                </td>
                <td class="cus-col ">
                    <ngformatdate datetime-val='item.OrderRequestDate'></ngformatdate>
                </td>
                <!--<td class="cus-col"><span>{{item.TESTMASTERTYP.Description}}</span></td>-->
                <td class="cus-col rxname"></td>
                <td class="cus-col "><b class="text-highlight5 plain-text">{{item.OrderPriority.Description}}</b>
                </td>
                <td class="cus-col doctor"><b class="plain-text1">
                        <displayuserlbl user="item.User"></displayuserlbl>
                    </b></td>
                <td class="cus-col ">{{item.OrderTo.DepartmentName}}</td>
                <td class="cus-col "><b class="text-highlight8 plain-text">{{item.OrderStatus.DisplayName}}</b></td>
                </td>
            </tr>
            <tbody ng-show="item.CanShowDetails">
                <tr ng-repeat="detail in item.PatientDietOrderDetails">
                    <td class="cus-col pno"></td>
                    <td class="cus-col"></td>
                    <td class="cus-col rxname">
                        <span>{{detail.DietName}}</span>
                    </td>
                    <td class="cus-col "><b class="text-highlight5 plain-text">{{detail.OrderPriority.Description}}</b>
                    </td>
                    <td class="cus-col doctor"><b class="plain-text1">
                            <displayuserlbl user="item.User"></displayuserlbl>
                        </b></td>
                    <td class="cus-col ">{{item.OrderTo.DepartmentName}}</td>
                    <td class="cus-col "><b class="text-highlight8 plain-text">{{item.OrderStatus.Description}}</b></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<div class="fooder-bgs">
    <!-- <div class="pull-right">
                <button id="btnCancelForm" type="button" class="draftbutton" ng-click="cancelCallback()"
                    translate="common.cancelaction.lbl"></button>
            </div> -->
</div>
