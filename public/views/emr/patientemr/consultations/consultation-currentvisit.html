<div class="row">
    <div class="col-sm-3">
        <label class="col-sm-12 control-label"
            translate="patientemr.patientvital-list.filter_from.lbl"></label>
        <div class="col-sm-12">
            <input type="text" class="form-control" name="from" ng-change="getList(tab)" ng-date-object
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="fromPopup = { opened: true }" is-open="fromPopup.opened" ng-model="currentfilter.From">
        </div>
    </div>
    <div class="col-sm-3">
        <label class="col-sm-12 control-label"
            translate="patientemr.patientvital-list.filter_to.lbl"></label>
        <div class="col-sm-12">
            <input type="text" class="form-control" name="to" ng-change="getList()" ng-date-object
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="toPopup = { opened: true }" is-open="toPopup.opened" ng-model="currentfilter.To">
        </div>
    </div>
    <div class="col-sm-3">
        <label class="col-sm-12 control-label" translate="Template"></label>
        <div class="col-sm-12">
            <ui-select ng-model="currentfilter.ProfileId" name="note" ng-change="getList()">
                <ui-select-match>
                    {{$select.selected.Name | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Name.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.SelectedProfile | filter: { Name: $select.search }">
                    <div ng-bind-html="lookupitem.Name | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="col-sm-3">
        <button class="emr-btn-add" ng-click="addNew()" uib-tooltip="Add Notes" tooltip-placement="bottom">
            <i class="fa fa-plus" aria-hidden="true"></i>
        </button>
    </div>
</div>
<div class="fooder-bgs">
    <div class="row">
        <custom-table config="vm.gridConfig"></custom-table>
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
