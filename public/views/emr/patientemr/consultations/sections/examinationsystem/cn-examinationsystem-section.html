<link rel="stylesheet" type="text/css" href="app/css/helpdesk.css">
<div class="tabsizetopcontroller">
    <div class="row page-header">
        <div class="col-sm-12">
            <div class="col-sm-6 col-md-9">
                <h4 class="page-header mt0" translate="patientemr.eyeconsultsystems.examinationtitle.lbl"></h4>
            </div>
            <div class="col-sm-6 col-md-3">
                <!-- <button class="btn-add" ng-click="addNew()" uib-tooltip="{{ 'patientemr.eyeconsultsystems.examinationtitle.lbl' | translate }}"
                    tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                    
                </button> -->
                <button class=" text-white btn res-color14 btn-xs pull-right" ng-click="emrfavouritesettings()" uib-tooltip="{{ 'patientemr.favoritecontrol.tooltipnamefavorite.lbl' | translate }}"
                    tooltip-placement="left">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </div>
    <div class="container-fluid" ng-hide="data.Data.length>0">
        <div class="panel-body" style=" height: 100px;">
            <div class="row fav-row">
                <div class="col-sm-10">
                    <span class="btn-group btn-favorite" id="favoritebtncolorcontroler" ng-click="caretClicked(detail)" ng-repeat="detail in list"
                        uib-tooltip="{{detail.DisplayName}}" tooltip-placement="bottom">
                        <label class="btn btn-default" ng-model="listmodel[detail.ItemId]" uib-btn-checkbox>{{detail.DisplayName}}</label>
                        <button class="btn btn-default dropdown-toggle" type="button" ng-click="caretClicked(detail)">
                            <span class="caret"></span>
                        </button>
                    </span>
                </div>
            </div>
            <div class="pull-right">
                <button type="button" class="btn btn-success btn-xs" ng-click="saveFavorites()" translate="common.saveaction.lbl"></button>
            </div>
        </div>
    </div>
    <table class="table table-bordered hlptbl">
        <thead>
            <tr>

                <th scope="col">
                    <span translate="patientemr.eyeconsultsystems.system.lbl"></span>
                </th>
                <th scope="col">
                    <span translate="patientemr.eyeconsultsystems.findings.lbl"></span>
                </th>
                <th scope="col">
                    <span translate="patientemr.eyeconsultsystems.lefteye.lbl"></span>
                </th>
                <th scope="col">
                    <span translate="patientemr.eyeconsultsystems.righteye.lbl"></span>
                </th>
                <th scope="col">
                    <span translate="patientemr.eyeconsultsystems.annotation.lbl"></span>
                </th>
                <th class="col-sm-1" scope="col">
                    <span translate="patientemr.eyeconsultsystems.action.lbl"></span>
                </th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="item in SystemData| filter:{Status:1}">
                <td>{{item.System}}</td>
                <td>
                    <ui-select ng-model="item.FindingsId" name="templatename">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ClinicalFindings | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </td>
                <td>
                    <input type="text" class="form-control" name="code" ng-model="item.LeftEye" placeholder="">
                </td>
                <td>
                    <input type="text" class="form-control" name="code" ng-model="item.RightEye" placeholder="">
                </td>
                <td>
                    <a tabindex="-1" ng-click="closed($index,item)">
                        <!-- <i class="fa fa-remove" aria-hidden="true"></i> -->
                        <span>Annotate</span>
                    </a>
                </td>
                <td>
                    <button type="button" class="btn btn-danger btn-xs" tabindex="-1" ng-click="closed($index,item)">
                        <i class="fa fa-remove" aria-hidden="true"></i>
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
    <!-- <div ui-grid="vm.gridConfig" class="table-uigrid"></div> -->
    <div class="panel-footer formactionbar">
        <div class="pull-right">
            <button type="button" class="draftbutton" ng-click="saveItem()" translate="common.saveaction.lbl"></button>
            <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
        </div>
    </div>
    <!-- </div> -->
</div>
