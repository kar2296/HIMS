<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <div class="col-sm-12 ">
        <h4 class="col-sm-8 modal-title custom-modal-title" translate="Previous Notes"></h4>
        <button type="button" class="btn btn-xs btn-danger float-right" ng-click="cancelCallback()" aria-label="Close">
            <span aria-hidden="true">X</span>
        </button>
    </div>
</div>
<div ng-if="currentcontext.ismodal">
    <patientbanner patientid="currentcontext.pid"></patientbanner>
</div>
<div class="well formRoot reviewnoteheight emr_reviewnotes pd0" set-form-height reduce-height="10"
    style="overflow: scroll;overflow-x:hidden;padding-top:0px;">
    <div class="col-sm-12 borderbtm">
        <div ng-include="item.tmpl" ng-repeat="item in currentcontext.sections"></div>
    </div>

</div>
</div>
<script type="text/ng-template " id="cn-allergy-section.html ">
    <div ng-if="sectionData.allergy[0].AllergyName " class="row ">
        <div class="col-sm-12 " style="margin-top:0px;">
            <div class="form-group ">
                <div class="col-sm-12 form-group mb0">
                    <h4 class="control-label fontgreen mar_z " translate="patientemr.reviewnotes.allergy.lbl "></h4>
                </div>
            </div>
        </div>
    </div>
    <div ng-if="sectionData.allergy[0].AllergyName " class="row " ng-repeat="item in sectionData.allergy ">
        <span class="col-sm-3 lefcol1 ">{{item.AllergyType.Description}}</span>
        <span class="col-sm-3 lefcol2 ">{{item.AllergyName}}</span>
         <div class="col-sm-3 lefcol3">
            <ngformatdate date-val='item.StartDate'></ngformatdate>
        </div>
    </div>
</script>
<script type="text/ng-template " id="cn-chiefcomplaint-section.html ">
    <div ng-if="sectionData.ChiefComplaints.length> 0" class="row">
		<div class="col-sm-12" style="margin-top:0px;">
			<div class="form-group">
				<div class="col-sm-12 form-group mb0">
					<h4 class="control-label fontgreen mar_z" translate="patientemr.reviewnotes.chiefcomplaints.lbl"></h4>
				</div>
			</div>
		</div>
	</div>
	<div ng-if="sectionData.ChiefComplaints.length > 0" class="row" ng-repeat="item in sectionData.ChiefComplaints">
		<div class="col-sm-3 fontpink">
			<ngformatdate date-val='item.StartDate'></ngformatdate>
		</div>
		<span class="col-sm-9 fontgreen">{{item.ChiefComplaint}}</span>
	</div>
</script>
<script type="text/ng-template" id="cn-condition-section.html">
    <div ng-if="sectionData.conditions[0].DiagnosisName" class="row">
        <div class="col-sm-12" >
            <div class="form-group">
                <div class="col-sm-12 form-group">
                    <h4 class="control-label mar_z" translate="patientemr.reviewnotes.condition.lbl"></h4>
                </div>
            </div>
        </div>
    </div>
    <div ng-if="sectionData.conditions[0].DiagnosisName" class="row" ng-repeat="item in sectionData.conditions">
        <span style="color: #1d6090;font-size: 15px;" class="col-sm-3">{{item.ConditionType.Description}}</span>
        <span style="color:gray;" class="col-sm-6">{{item.DiagnosisName}}<span style="color:red;">({{item.Code}})</span></span>
    </div>
</script>
<script type="text/ng-template" id="cn-vital-section.html">
    <div ng-if="sectionData.vitals[0].Vitalinfo" class="row">
        <div class="col-sm-12" style="margin-top:0px;   ">
            <div class="form-group">
                <div class="col-sm-12 form-group mb0">
                    <h4 class="control-label fontgreen mar_z normal_cnotes" translate="patientemr.reviewnotes.vital.lbl"></h4>
                </div>
            </div>
        </div>
    </div>
    <div ng-if="sectionData.vitals[0].Vitalinfo" class="row innerdata" ng-repeat="item in sectionData.vitals">
        <span class="col-sm-9 lefcol2"><p data-ng-bind-html="item.Vitalinfo"></p></span>
    </div>
</script>
<script type="text/ng-template" id="cn-procedure-section.html">
    <div ng-if="sectionData.procedures[0].Procedure.ProcedureName" class="row">
        <div class="col-sm-12" >
            <div class="form-group ">
                <div class="col-sm-12 form-group mb0">
                    <h4 class="control-label mar_z x" translate="patientemr.reviewnotes.procedure.lbl"></h4>
                </div>
            </div>
        </div>
    </div>
    <div ng-if="sectionData.procedures[0].Procedure.ProcedureName" class="row" ng-repeat="item in sectionData.procedures">
        <span style="color:"class="col-sm-3 lefcol1">{{item.ProcedureType.Description}}</span>
        <span class="col-sm-8 lefcol2">{{item.Procedure.ProcedureName}}({{item.Code}})</span>
    </div>
</script>
<script type="text/ng-template" id="cn-documents-section.html">
    <div ng-if="sectionData.documents[0].Name" class="row">
        <div class="col-sm-12" >
            <div class="form-group">
                <div class="col-sm-12 form-group">
                    <h4 class="control-label fontviolet mar_z" translate="patientemr.reviewnotes.documents.lbl"></h4>
                </div>
            </div>
        </div>
    </div>
    <div ng-if="sectionData.documents[0].Name" class="row" ng-repeat="item in sectionData.documents">
        <div class="col-sm-3 lefcol3">
            <ngformatdate date-val='item.CreatedDate'></ngformatdate>
        </div>
        <span class="col-sm-3 lefcol2">{{item.Name}}</span>
    </div>
</script>
<script type="text/ng-template" id="cn-familycondition-section.html">
    <div ng-if="sectionData.familyconditions[0].DiagnosisName" class="row">
        <div class="col-sm-12 clearfix" style="b ">
            <div class="form-group">
                <div class="col-sm-4 form-group mb0">
                    <h4 class="control-label control-label mar_z" translate="patientemr.reviewnotes.familycondition.lbl"></h4>
                </div>
            </div>
        </div>
    </div>
    <div ng-if="sectionData.familyconditions[0].DiagnosisName" class="row" ng-repeat="item in sectionData.familyconditions">
        <div class="col-sm-3 lefcol3">
            <ngformatdate date-val='item.ConditionDate'></ngformatdate>
        </div>
        <span class="col-sm-3 lefcol2" style="text-transform:uppercase;">{{item.DiagnosisName}}</span>
        <span class="col-sm-3 lefcol2" style="text-transform:uppercase;">{{item.ConditionType.Description}}</span>
        <span class="col-sm-3 lefcol1">{{item.Relationship.Description}}</span>
    </div>
</script>
<script type="text/ng-template" id="cn-socialhistory-section.html">
    <div ng-if="sectionData.socialHistory[0].SocialType.Description" class="row">
        <div class="col-sm-12" style=">
            <div class="form-group">
                <div class="">
                    <h4 class="control-label mar_z"  translate="patientemr.reviewnotes.socialhistory.lbl" style="margin-left:2%;"></h4>
                </div>
            </div>
        </div>
    </div>
    <div ng-if="sectionData.socialHistory[0].SocialType.Description" class="row" ng-repeat="item in sectionData.socialHistory">
        <div class="lefcol3 col-sm-3">
            <ngformatdate date-val='item.ReviewDate'></ngformatdate>
        </div>
        <span class="lefcol2 col-sm-3">{{item.SocialType.Description}}</span>
        <span class="lefcol2 col-sm-3">{{item.SocialFrequency.Description}}</span>
    </div>
</script>
<script type="text/ng-template" id="cn-familysocialhistory-section.html">
    <div ng-if="sectionData.FamilySocHistory[0].SocialType.Description" class="row">
        <div class="col-sm-12" style=">
            <div class="form-group">
                <div class="col-sm-4 form-group mb0">
                    <h4 class="control-label fontbrown mar_z" translate="patientemr.reviewnotes.familysocialhistory.lbl"></h4>
                </div>
            </div>
        </div>
    </div>
    <div ng-if="sectionData.FamilySocHistory[0].SocialType.Description" class="row" ng-repeat="item in sectionData.FamilySocHistory">
        <div class="lefcol3 col-sm-3">
            <ngformatdate date-val='item.ReviewDate'></ngformatdate>
        </div>
        <span class="lefcol2 col-sm-3">{{item.SocialType.Description}}</span>
        <span class="lefcol3 col-sm-3">{{item.Relationship.Description}}</span>
    </div>
</script>
<script type="text/ng-template" id="cn-immunization-section.html">
    <div ng-if="sectionData.Immunizations[0].ImmunizationName" class="row">
        <div class="col-sm-12">
            <div class="form-group">
                <div class="col-sm-4 form-group mb0">
                    <h4 class="control-label mar_z" translate="patientemr.reviewnotes.immunization.lbl"></h4>
                </div>
            </div>
        </div>
    </div>
    <div ng-if="sectionData.Immunizations[0].ImmunizationName" class="row" ng-repeat="item in sectionData.Immunizations">
        <div class="col-sm-3 lefcol3">
            <ngformatdate date-val='item.PerformedDate'></ngformatdate>
        </div>
        <span class="col-sm-3 lefcol2">{{item.ImmunizationName}}</span>
        <span class="col-sm-3 lefcol1">{{item.SiteOrRoute}}</span>
    </div>
</script>
<script type="text/ng-template" id="cn-prescription-section.html">
    <div ng-if="sectionData.prescriptions[0].PrescriptionDetails[0].DrugName" class="row">
        <div class="col-sm-12" style="margin-top:0px;">
            <div class="form-group">
                <div class="col-sm-4 form-group mb0">
                    <h4 class="control-label fontgreen mar_z" translate="patientemr.reviewnotes.prescription.lbl"></h4>
                </div>
            </div>
        </div>
    </div>
    <div ng-if="sectionData.prescriptions.length > 0" ng-repeat="item in sectionData.prescriptions">
        <div class="row">
            <table class="table table-responsive table-bordered">
                <thead>
					<tr>
						<th class="col-sm-2 lefcol8">Drugs</th>
						<th class="col-sm-2 lefcol8">Dosage</th>
						<th class="col-sm-2 lefcol8">Route</th>
						<th class="col-sm-2 lefcol8">Frequency</th>
						<th class="col-sm-2 lefcol8">Duration</th>
						<th class="col-sm-2 lefcol8">Drug Instruction</th>
					</tr>
				</thead>
				<tbody>
				   <tr ng-repeat="detail in item.PrescriptionDetails">
						<td class="col-sm-2"><span class="lefcol1">{{detail.DrugName}}({{detail.DrugCode}})</span></td>
						<td class="col-sm-2"><span class="lefcol2">{{detail.Dosage}}</span></td>
						<td class="col-sm-2"><span class="lefcol4">{{detail.DrugRoute.Description}}</span></td>
						<td class="col-sm-2"><span class="lefcol3">{{detail.DrugFrequency.Name}}</span></td>
						<td class="col-sm-2"><span class="lefcol5">{{detail.Duration}} {{detail.DurationPeriod.Description}}</span></td>
						<td class="col-sm-2"><span class="lefcol5">{{detail.DrugInstruction.Description}}</span></td>
				   </tr>
				</tbody>
            </table>
            <div class="col-sm-12"ng-if="sectionData.prescriptions[0].Diagnosis">
                    <span style="color: #1d6090;font-size: 15px;" class="col-sm-3">Diagnosis</span>
                    <span style="color:gray;" class="col-sm-3">{{item.Diagnosis}}</span>
            </div>
            <div class="col-sm-12"ng-if="sectionData.prescriptions[0].Comments">
                    <span style="color: #1d6090;font-size: 15px;" class="col-sm-3">Advice/Instrunction</span>
                    <span style="color:gray;" class="col-sm-3">{{item.Comments}}</span>
            </div>
            <div class="col-sm-12"ng-if="sectionData.prescriptions[0].ReviewDate">
                    <span style="color: #1d6090;font-size: 15px;" class="col-sm-3">Review Date</span>
                    <span style="color:gray;" class="col-sm-3"><ngformatdate date-val='item.ReviewDate'></ngformatdate></span>
            </div>
            <div class="col-sm-12"ng-if="sectionData.prescriptions[0].Physiotheraphy">
                    <span style="color: #1d6090;font-size: 15px;" class="col-sm-3">Physiotheraphy</span>
                    <span style="color:gray;" class="col-sm-3">{{item.Physiotheraphy}}</span>
            </div>
        </div>
    </div>
</script>
<script type="text/ng-template" id="cn-order-section.html">
    <div ng-if="sectionData.orders.length > 0" class="row">
        <div class="col-sm-12" style="margin-top:0px;">
            <div class="form-group">
                <div class="col-sm-4 form-group mb0">
                    <h4 class="control-label fontgreen mar_z" translate="patientemr.reviewnotes.orders.lbl"></h4>
                </div>
            </div>
        </div>
    </div>
    <div ng-if="sectionData.orders.length > 0" ng-repeat="item in sectionData.orders">
        <div class="row innerdata">
            <div class="col-sm-3">
            <span class="lefcol1 innerdata" style="color:;" class="col-sm-3 lefcol2">{{item.TESTMASTERTYP.Description}}</span>

            </div>
            <div class="col-sm-9">
            <span ng-repeat="detail in item.PatientOrderDetails" class="lefcol2">{{detail.TestName}}({{detail.TestCode}}) ;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

                <span class="lefcol1 innerdata">{{detail.Side.Description}};
                </span>
            </span>
            </div>
        </div>
    </div>
</script>
<script type="text/ng-template" id="cn-question-section.html">
    <div ng-if="sectionData[item.sectionid].cat.length>0"class="row" class="rev_items">
        <div class="col-sm-12" style= ;>
            <h4 class="control-label section-lable pdl15" style="text-transform:uppercase;">{{sectionData[item.sectionid].sectionName}}</h4>
        </div>
        <div ng-repeat="category in  sectionData[item.sectionid].cat" style="height:100%">
            <div class="row">
                <div class="col-sm-12" style="background:#3e5fd6c4";>
                    <h4 class="align-left control-label mar_z category-lable mg0" style="">{{category.CategoryName}}</h4>
                </div>
            </div>
            <div class="row innerdata" ng-repeat="concept in category.concepts">
                <div class="concept-lable" ng-if="concept.ValueTypeId !=3 && concept.ValueTypeId !=12 && concept.ValueTypeId != 8" ng-show="concept.Result">
                    <span class="col-sm-3 lefcol1 4x"style="margin-left: -26px;">{{concept.ConceptName}}</span>
                    <span class="col-sm-9 lefcol2"style="word-wrap: break-word;">{{concept.Result}}</span>
                </div>
                <div class="concept-lable" ng-if="concept.ValueTypeId == 12 || concept.ValueTypeId == 8" ng-show="concept.Result">
                    <span class="col-sm-3 lefcol1 4x"style="margin-left: -26px;">{{concept.ConceptName}}</span>
                    <span class="col-sm-9 lefcol2"style="word-wrap: break-word;" ng-bind-html="concept.Result"></span>
                </div>
                <div class="concept-lable" ng-if="concept.ValueTypeId ==3 && concept.IsMultiple == false" ng-show="concept.Result">
                    <span class="col-sm-3 lefcol1 5x"style="margin-left: -26px;">{{concept.ConceptName}}</span>
                    <span class="col-sm-9 lefcol2">{{concept.Result}}<span ng-if="concept.Comments"> - {{concept.Comments}}</span></span>
                </div>
                <div class="concept-lable" ng-if="concept.ValueTypeId ==3 && concept.IsMultiple == true" ng-show="concept.Terms && concept.Terms.length > 0">
                    <div class="col-sm-3 lefcol1 6x"style="margin-left: -26px;">{{concept.ConceptName}}</div>
                    <div class="col-sm-9 lefcol2">
                        <span ng-repeat="term in concept.Terms">
                            {{term.TermName}}
                            <span ng-if="term.Comments"> - {{term.Comments}}</span>
                            <span ng-if="$index != concept.Terms.length-1">,</span>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</script>
<script type="text/ng-template" id="cn-followup-section.html">
    <div  ng-if="sectionData.followup.length > 0" class="row">
        <div class="col-sm-12" >
            <div class="form-group">
                <div class="col-sm-12 form-group mb0">
                    <h4 class="control-label mar_z" translate="FollowUp/Referral"></h4>
                </div>
            </div>
        </div>
    </div>
    <div  ng-if="sectionData.followup.length > 0" class="row" ng-repeat="item in sectionData.followup">
        <div class="col-sm-12" ng-hide="item.TrackerStatusId==3">
                <span style="color: #1d6090;font-size: 15px;" class="col-sm-3">Refer To</span>
                <span style="color:gray;" class="col-sm-3">{{item.AttendUser.Title.Description}} {{item.AttendUser.FirstName}} {{item.AttendUserLastName}}</span>
        </div>
        <div class="col-sm-12">
                <span style="color: #1d6090;font-size: 15px;" class="col-sm-3">Clinical Status</span>
                <span style="color:gray;" class="col-sm-3">{{item.ReferrerClinicalStatus.Description}}</span>
        </div>
        <div class="col-sm-12">
                <span style="color: #1d6090;font-size: 15px;" class="col-sm-3">Followup On</span>
                <span style="color:gray;margin-left: -6px;font-size: 14px;font-weight: bolder;" class="col-sm-3"><ngformatdate date-val='item.FollowupAppointmentOn'></ngformatdate>
                </span>
        </div>
        <div class="col-sm-12">
            <span style="color: #1d6090;font-size: 15px;" class="col-sm-3">Comments</span>
            <span style="color:gray;margin-left: -6px;font-size: 14px;font-weight: bolder;" class="col-sm-3">{{item.TrackerComments}}</span>
		</div>
    </div>
</script>
<script type="text/ng-template" id="cn-labresult-section.html">
    <div  ng-repeat="order in sectionData.labresult" ng-if="order.PatientWorkorders.length > 0" class="row">
        <div class="col-sm-12" >
