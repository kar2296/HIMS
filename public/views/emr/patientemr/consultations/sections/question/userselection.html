<style>
    th.Select.align {
        width: 80px !important;
    }

    th.Type.align {
        width: 200px;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Notes"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>
<div class="row">
    <div class="dynamicform-content">
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="Doctor"></label>
            <div class="col-sm-12">
                <autosearch itemid="item.DoctorId" controlid="'docid'" config="vm.usercontrolconfig"
                    itemchange="onDoctorSelected(item)">
                </autosearch>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-sm-12">
        <h3>{{DocName}}</h3>
    </div>
    <div style="float: right;">
        <button type="button" class="draftbutton" ng-click="loadInfo()" translate="Load"></button>
    </div>
</div>
