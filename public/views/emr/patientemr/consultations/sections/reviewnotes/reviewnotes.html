<style>
    .billing-update {
        color: #f44336;
    }

    .draftbutton {
        margin: 2px;
    }

    p table {
        width: 100%;
    }

    p table td {
        width: 15%;
        color: black;
    }

    p table td:nth-child(2) {
        color: black;
        width: 10%;
        text-align: center;
    }

    p table td:nth-child(3) {
        color: black;
        width: 10%;
        text-align: center;
    }

    span.genclass {
        margin-left: 50px;
    }

    .d-flex-left * {
        margin-right: 6px !important;
    }

    .d-flex-left {
        display: flex;
    }
</style>
<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Summary"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>
<div class="row" ng-if="currentcontext.ismodal">
    <patientbanner patientid="currentcontext.pid"></patientbanner>
</div>
<div id="summarynotes">
    <div class="row">
        <!-- <div class="col-sm-12">Createdby : <span class="billing-update">{{item.Encounter.DoctorName}}</span></div> -->
        <div class="col-sm-12">
            <div class="col-sm-6">Createdby : <span class="billing-update">{{item.CreatedUser.Title.Description}}
                    {{item.CreatedUser.FirstName}}</span></div>
            <div class="col-sm-6">Created Date : <span class="billing-update">
                    <displaydate datetime-val="item.CreatedAt"></displaydate>
                </span></div>
        </div>
        <div class="col-sm-12">
            <div class="col-sm-6">Type : <span class="billing-update">{{item.VisitType.Description}}</span></div>
            <div class="col-sm-6">Doctor Name : <span class="billing-update">{{item.Doc.Title.Description}}
                    {{item.Doc.FirstName}}</span></div>
        </div>
        <div ng-include="item.tmpl" ng-repeat="item in currentcontext.sections"></div>
    </div>

    <script type="text/ng-template" id="cn-allergy-section.html">
        <div ng-if="sectionData.allergy[0].AllergyName" class="row">
            <div class="col-sm-12">
                <div class="form-group">
                    <div class="col-sm-12 form-group mb0">
                        <span class="d-flex-left">
                            <input type="checkbox" tabindex="-1" ng-model="item.IsAllOrderSelected"
                        ng-click="IsAllOrderSelectedChange(item.title, item.sectionid)">
                        <h4 class="control-label fontgreen mar_z" translate="patientemr.reviewnotes.allergy.lbl"></h4>
                        </span>
                    </div>
                </div>
            </div>
        </div>
        <div ng-if="sectionData.allergy[0].AllergyName" class="row" ng-repeat="item in sectionData.allergy">
            <span class="col-sm-3 lefcol1">{{item.AllergyType.Description}}</span>
            <span class="col-sm-3 lefcol2">{{item.AllergyName}}</span>
            <div class="col-sm-3 lefcol3">
                <ngformatdate date-val='item.StartDate'></ngformatdate>
            </div>
        </div>
    </script>
    <script type="text/ng-template" id="cn-chiefcomplaint-section.html">

        <div ng-if="sectionData.ChiefComplaints.length > 0" class="row">
            <div class="col-sm-12" style="margin-top:0px;">
                <div class="form-group">
                    <div class="col-sm-12 form-group mb0">
                        <span class="d-flex-left">
                            <input type="checkbox" tabindex="-1" ng-model="item.IsAllOrderSelected"
                        ng-click="IsAllOrderSelectedChange(item, item.sectionid)">
                        <h4 class="control-label fontgreen mar_z" translate="patientemr.reviewnotes.chiefcomplaints.lbl"></h4>
                        </span>
                    </div>
                </div>
            </div>
        </div>
        <div ng-if="sectionData.ChiefComplaints.length > 0" class="row innerdata" ng-repeat="item in sectionData.ChiefComplaints">
            <div class="col-sm-3 fontpink">
                <ngformatdate date-val='item.StartDate'></ngformatdate>
            </div>
            <span class="col-sm-9 fontgreen">{{item.ChiefComplaint}}</span>
        </div>
    </script>


    <script type="text/ng-template" id="cn-condition-section.html">

        <div ng-if="sectionData.conditions[0].DiagnosisName" class="row">
            <div class="col-sm-12">
                <div class="form-group">
                    <div class="col-sm-12 form-group">
                        <span class="d-flex-left">
                            <input type="checkbox" tabindex="-1" ng-model="item.IsAllOrderSelected"
                        ng-click="IsAllOrderSelectedChange(item, item.sectionid)">
                        <h4 class="control-label mar_z" translate="patientemr.reviewnotes.condition.lbl"></h4>
                        </span>
                    </div>
                </div>
            </div>
        </div>
        <div ng-if="sectionData.conditions[0].DiagnosisName" class="row innerdata" ng-repeat="item in sectionData.conditions">
            <!-- <div class="col-sm-3">
            <ngformatdate date-val='item.ConditionDate'></ngformatdate>
        </div> -->
            <div class="col-sm-3 lefcol1 innerdata 4x no-pad">{{item.ConditionType.Description}}</div>
            <div style="" class="col-sm-9">{{item.DiagnosisName}}<span style="color:;">({{item.Code}})</span></div>
        </div>
    </script>

    <script type="text/ng-template" id="cn-vital-section.html">

        <div ng-if="sectionData.vitals[0].Vitalinfo" class="row">

            <div class="col-sm-12 form-group mb0">
                <span class="d-flex-left">
                    <input type="checkbox" tabindex="-1" ng-model="item.IsAllOrderSelected"
                        ng-click="IsAllOrderSelectedChange(item, item.sectionid)">
                        <h4 class="control-label fontgreen mar_z normal_cnotes" translate="patientemr.reviewnotes.vital.lbl"></h4>
                </span>
            </div>
        </div>
        <div ng-if="sectionData.vitals[0].Vitalinfo" class="row innerdata" ng-repeat="item in sectionData.vitals">
            <!-- <div class="col-sm-3 fontpink">
            <ngformatdate date-val='item.PerformedDate'></ngformatdate>
        </div> -->
            <span class="col-sm-9 lefcol2 innerdata">
            <p data-ng-bind-html="item.Vitalinfo"></p>
            </span>
        </div>
    </script>
    <script type="text/ng-template" id="cn-procedure-section.html">

        <div ng-if="sectionData.procedures[0].Procedure.ProcedureName" class="row">
            <div class="col-sm-12 summarynotes">
                <span class="d-flex-left">
                    <input type="checkbox" tabindex="-1" ng-model="item.IsAllOrderSelected"
                        ng-click="IsAllOrderSelectedChange(item, item.sectionid)">
                        <h4 class="control-label fontgreen mar_z normal_cnotes" translate="patientemr.reviewnotes.procedure.lbl"></h4>
                </span>
            </div>
        </div>
        <div ng-if="sectionData.procedures[0].Procedure.ProcedureName" class="row innerdata" ng-repeat="item in sectionData.procedures">
            <!-- <div class="col-sm-3">
            <ngformatdate class="fontpink" date-val='item.PerformedDate'></ngformatdate>
        </div> -->
            <span style="color:" class="col-sm-3 lefcol1 innerdata">{{item.ProcedureType.Description}}</span>
            <span class="col-sm-8 lefcol2 innerdata">{{item.Procedure.ProcedureName}}({{item.Code}})</span>
        </div>
    </script>


    <script type="text/ng-template" id="cn-documents-section.html">

        <div ng-if="sectionData.documents[0].Name" class="row">
            <div class="col-sm-12">
                <div class="form-group">
                    <div class="col-sm-12 form-group">
                        <span class="d-flex-left">
                            <input type="checkbox" tabindex="-1" ng-model="item.IsAllOrderSelected"
                        ng-click="IsAllOrderSelectedChange(item, item.sectionid)">
                        <h4 class="control-label fontgreen mar_z normal_cnotes" translate="patientemr.reviewnotes.documents.lbl"></h4>
                        </span>
                    </div>
                </div>
            </div>
        </div>
        <div ng-if="sectionData.documents[0].Name" class="row innerdata" ng-repeat="item in sectionData.documents">
            <div class="col-sm-3 lefcol3 innerdata">
                <ngformatdate date-val='item.CreatedDate'></ngformatdate>
            </div>
            <span class="col-sm-3 lefcol2 innerdata">{{item.Name}}</span>
        </div>
    </script>

    <script type="text/ng-template" id="cn-familycondition-section.html">

        <div ng-if="sectionData.familyconditions[0].DiagnosisName" class="row">
            <div class="col-sm-12 clearfix" style="background: #add8e6;">
                <div class="form-group">
                    <div class="col-sm-4 form-group mb0">
                        <span class="d-flex-left">
                            <input type="checkbox" tabindex="-1" ng-model="item.IsAllOrderSelected"
                        ng-click="IsAllOrderSelectedChange(item, item.sectionid)">
                        <h4 class="control-label fontgreen mar_z normal_cnotes" translate="patientemr.reviewnotes.familycondition.lbl"></h4>
                        </span>
                    </div>
                </div>
            </div>
        </div>
        <div ng-if="sectionData.familyconditions[0].DiagnosisName" class="row innerdata" ng-repeat="item in sectionData.familyconditions">
            <div class="col-sm-3 lefcol3 innerdata">
                <ngformatdate date-val='item.ConditionDate'></ngformatdate>
            </div>
            <span class="col-sm-3 lefcol2 innerdata" style="text-transform:uppercase;">{{item.DiagnosisName}}</span>
            <span class="col-sm-3 lefcol2 innerdata" style="text-transform:uppercase;">{{item.ConditionType.Description}}</span>
            <span class="col-sm-3 lefcol1 innerdata">{{item.Relationship.Description}}</span>
        </div>
    </script>

    <script type="text/ng-template" id="cn-socialhistory-section.html">

        <div ng-if="sectionData.socialHistory[0].SocialType.Description" class="row">
            <div class="col-sm-12" style="background: #add8e6;">
                <div class="form-group">
                    <div class="">
                        <span class="d-flex-left">
                            <input type="checkbox" tabindex="-1" ng-model="item.IsAllOrderSelected"
                        ng-click="IsAllOrderSelectedChange(item, item.sectionid)">
                        <h4 class="control-label fontgreen mar_z normal_cnotes" translate="patientemr.reviewnotes.socialhistory.lbl" style="margin-left:2%;"></h4>
                        </span>
                    </div>
                </div>
            </div>
        </div>
        <div ng-if="sectionData.socialHistory[0].SocialType.Description" class="row innerdata" ng-repeat="item in sectionData.socialHistory">
            <div class="lefcol3 col-sm-3 innerdata">
                <ngformatdate date-val='item.ReviewDate'></ngformatdate>
            </div>
            <span class="lefcol2 col-sm-3 innerdata">{{item.SocialType.Description}}</span>
            <span class="lefcol2 col-sm-3 innerdata">{{item.SocialFrequency.Description}}</span>
        </div>
    </script>

    <script type="text/ng-template" id="cn-familysocialhistory-section.html">

        <div ng-if="sectionData.FamilySocHistory[0].SocialType.Description" class="row">
            <div class="col-sm-12" style="background: #add8e6;">
                <div class="form-group">
                    <div class="col-sm-4 form-group mb0">
                        <span class="d-flex-left">
                            <input type="checkbox" tabindex="-1" ng-model="item.IsAllOrderSelected"
                            ng-click="IsAllOrderSelectedChange(item, item.sectionid)">
                            <h4 class="control-label fontgreen mar_z normal_cnotes" translate="patientemr.reviewnotes.familysocialhistory.lbl"></h4>
                        </span>
                    </div>
                </div>
            </div>
        </div>
        <div ng-if="sectionData.FamilySocHistory[0].SocialType.Description" class="row innerdata" ng-repeat="item in sectionData.FamilySocHistory">
            <div class="lefcol3 col-sm-3 innerdata">
                <ngformatdate date-val='item.ReviewDate'></ngformatdate>
            </div>
            <span class="lefcol2 col-sm-3 innerdata">{{item.SocialType.Description}}</span>
            <span class="lefcol3 col-sm-3 innerdata">{{item.Relationship.Description}}</span>
        </div>
    </script>

    <script type="text/ng-template" id="cn-immunization-section.html">

        <div ng-if="sectionData.Immunizations[0].ImmunizationName" class="row">
            <div class="col-sm-12">
                <div class="form-group">
                    <div class="col-sm-4 form-group mb0">
                        <span class="d-flex-left">
                            <input type="checkbox" tabindex="-1" ng-model="item.IsAllOrderSelected"
                        ng-click="IsAllOrderSelectedChange(item, item.sectionid)">
                        <h4 class="control-label fontgreen mar_z normal_cnotes" translate="patientemr.reviewnotes.immunization.lbl"></h4>
                        </span>
                    </div>
                </div>
            </div>
        </div>
        <div ng-if="sectionData.Immunizations[0].ImmunizationName" class="row innerdata" ng-repeat="item in sectionData.Immunizations">
            <div class="col-sm-3 lefcol3 innerdata">
                <ngformatdate date-val='item.PerformedDate'></ngformatdate>
            </div>
            <span class="col-sm-3 lefcol2 innerdata">{{item.ImmunizationName}}</span>
            <span class="col-sm-3 lefcol1 innerdata">{{item.SiteOrRoute}}</span>
        </div>
    </script>

    <script type="text/ng-template" id="cn-prescription-section.html">

        <div ng-if="sectionData.prescriptions[0].PrescriptionDetails[0].DrugName" class="row">
            <div class="col-sm-12 summarynotes" style="margin-top:0px;">
                <span class="d-flex-left">
                    <input type="checkbox" tabindex="-1" ng-model="item.IsAllOrderSelected"
                        ng-click="IsAllOrderSelectedChange(item, item.sectionid)">
                        <h4 class="control-label fontgreen mar_z normal_cnotes">Prescription
                        </h4>
                </span>
            </div>
        </div>
        <div ng-if="sectionData.prescriptions.length > 0" ng-repeat="item in sectionData.prescriptions">
            <div class="row innerdata" style="margin-left: 0px">
                <!-- <div class="col-sm-3 fontpink">
                <ngformatdate date-val='item.PrescriptionDate'></ngformatdate>
            </div> -->
                <table class="table table-responsive table-bordered innerdata" id="prescriptiontable">
                    <thead>
                        <tr>
                            <th class="col-sm-4 lefcol8">Drugs</th>
                            <th class="col-sm-1 lefcol8">Dosage</th>
                            <th class="col-sm-2 lefcol8">Route</th>
                            <th class="col-sm-2 lefcol8">Frequency</th>
                            <th class="col-sm-2 lefcol8">Duration</th>
                            <th class="col-sm-2 lefcol8">Drug Instruction</th>
                            <th class="col-sm-2 lefcol8">Stat</th>
                            <th class="col-sm-2 lefcol8">Notes</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="detail in item.PrescriptionDetails">
                            <td class="col-sm-4"><span class="lefcol12"><b>{{detail.DrugName}}({{detail.DrugCode}})</b></span></br>
                                <span class="genclass">{{detail.GenericMaster.GenericName}}</span></td>
                            <td class="col-sm-1"><span class="lefcol2">{{detail.Dosage}}</span></td>
                            <td class="col-sm-1"><span class="lefcol2">{{detail.DrugRoute.Description}}</span></td>
                            <td class="col-sm-2">
                                <span class="lefcol2" ng-hide="detail.DrugFrequencyId>0">
                                {{detail.Morning}}&nbsp;-&nbsp;{{detail.Noon}}&nbsp;-&nbsp;{{detail.Night}}&nbsp;</span>
                                <span ng-if="detail.DrugFrequencyId>0">{{detail.DrugFrequency.Name}}</span>
                            </td>
                            <td class="col-sm-2"><span class="lefcol2">{{detail.Duration}} {{detail.DurationPeriod.Description}}</span></td>
                            <td class="col-sm-2"><span class="lefcol2">{{detail.DrugInstruction.Description}}</span></td>
                            <td class="col-sm-2"><span class="lefcol2" ng-if="detail.STAT">Yes</span>
                                <span class="lefcol2" ng-if="!detail.STAT">No</span></td>
                            <td class="col-sm-2"><span class="lefcol2">{{detail.Notes}}</span></td>
                        </tr>
                        <tr ng-show="item.AdviceInstructions">
                            <td>
                                <div style="width:100%">
                                    <div style="white-space:nowrap;text-align:left;margin-bottom: 5px;">
                                        <span style="text-decoration: underline;">Advice:</span>
                                    </div>
                                    <div style="white-space:nowrap;text-align:left;margin-bottom: 5px;">
                                        <b> {{item.AdviceInstructions}}
                                  </b>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="col-sm-12" ng-if="sectionData.prescriptions[0].Diagnosis">
                    <div class="col-sm-3 lefcol1 innerdata 4x no-pad">Diagnosis</span>
                        <div style="" class="col-sm-9">{{item.Diagnosis}}</div>
                    </div>
                    <div class="col-sm-12" ng-if="sectionData.prescriptions[0].Comments">
                        <div class="col-sm-3 lefcol1 innerdata 4x no-pad">Advice/Instrunction</div>
                        <div style="" class="col-sm-9">{{item.Comments}}</div>
                    </div>
                    <div class="col-sm-12" ng-if="sectionData.prescriptions[0].ReviewDate">
                        <div class="col-sm-3 lefcol1 innerdata 4x no-pad">Review Date</div>
                        <div style="" class="col-sm-9">
                            <ngformatdate date-val='item.ReviewDate'></ngformatdate>
                        </div>
                    </div>
                    <div class="col-sm-12" ng-if="sectionData.prescriptions[0].Physiotheraphy">
                        <div class="col-sm-3 lefcol1 innerdata 4x no-pad">Physiotheraphy</div>
                        <div style="" class="col-sm-9">{{item.Physiotheraphy}}</div>
                    </div>
                </div>
            </div>
    </script>

    <script type="text/ng-template" id="cn-order-section.html">

        <div ng-if="sectionData.orders.length > 0" class="row">
            <div class="col-sm-12" style="margin-top:0px;padding-left:0px;">
                <div class="form-group">
                    <div class="col-sm-4 form-group mb0">
                        <span class="d-flex-left">
                            <input type="checkbox" tabindex="-1" ng-model="item.IsAllOrderSelected"
                        ng-click="IsAllOrderSelectedChange(item, item.sectionid)">
                        <h4 class="control-label fontgreen mar_z" translate="Investigations"></h4>
                        </span>
                    </div>
                </div>
            </div>
        </div>
        <!-- <table class="table table-responsive" ng-if="sectionData.orders.length > 0" ng-repeat="item in sectionData.orders">
        <thead>
            <tr>
                <th>{{item.TESTMASTERTYP.Description}}</th>
            </tr>

        </thead>
        <tbody>
            <tr>
                <tr ng-repeat="detail in item.PatientOrderDetails">{{detail.TestName}}({{detail.TestCode}})</tr>
                <td>{{detail.Side.Description}}</td>
            </tr>
        </tbody>
    </table> -->
        <div ng-if="sectionData.orders.length > 0" ng-repeat="item in sectionData.orders">

            <div class="row innerdata" style="margin-left:0px">
                <!-- <div class="col-sm-3">
                    <span class="lefcol12 innerdata">{{item.TESTMASTERTYP.Description}}</span>

                </div> -->
                <div class="col-sm-9 lefcol2 innerdata">
                    <!-- <span class="labtests" ng-repeat="detail in item.PatientOrderDetails" class="lefcol2 innerdata">
                        {{detail.TestName}}({{detail.TestCode}})

                <span class="lefcol1 innerdata">{{detail.Side.Description}}
                </span>
                    </span> -->
                    <table class="table table-responsive table-bordered innerdata" id="prescriptiontable">
                        <thead>
                            <tr>
                                <th class="col-sm-4 lefcol8">Test Name</th>
                                <th class="col-sm-1 lefcol8">Type</th>
                                <th class="col-sm-2 lefcol8">Quantity</th>
                                <th class="col-sm-2 lefcol8">Instruction</th>
                                <th class="col-sm-2 lefcol8">Clinical Data</th>
                                <th class="col-sm-2 lefcol8">Test Taken On</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr ng-repeat="detail in item.PatientOrderDetails">
                                <td class="col-sm-4"><span class="lefcol12">{{detail.TestName}}({{detail.TestCode}})</span></td>
                                <td class="col-sm-1"><span class="lefcol2">{{detail.TESTMASTERTYP.Description}}</span></td>
                                <td class="col-sm-2"><span class="lefcol2">{{detail.Quantity}}&nbsp;</span></td>
                                <td class="col-sm-2"><span class="lefcol2">{{detail.TestInstruction}}</span></td>
                                <td class="col-sm-2"><span class="lefcol2">{{detail.ClinicalData}}</span></td>
                                <td class="col-sm-2"><span class="lefcol2">{{detail.Duration}} {{detail.DurationPeriod.Description}}</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </script>

    <script type="text/ng-template" id="cn-question-section.html">

        <div ng-if="sectionData[item.sectionid].cat.length>0" class="row" class="rev_items">
            <div class="col-sm-12 summarynotes">
                <span class="d-flex-left">
                    <input type="checkbox" tabindex="-1" ng-model="item.IsAllOrderSelected"
                        ng-click="IsAllOrderSelectedChange(item, item.sectionid)">
                        <h4 class="control-label fontgreen mar_z normal_cnotes" style="text-transform:uppercase;">{{sectionData[item.sectionid].sectionName}}</h4>
                </span>
            </div>
            <div ng-repeat="category in  sectionData[item.sectionid].cat" style="height:100%">
                <div class="row innerdata">
                    <div class="col-sm-12">
                        <h4 class="align-left control-label mar_z category-lable mg0" style="">{{category.CategoryName}}</h4>
                    </div>
                </div>
                <div class="row innerdata" ng-repeat="concept in category.concepts">

                    <div class="concept-lable" ng-if="concept.ValueTypeId !=3 && concept.ValueTypeId !=12 && concept.ValueTypeId != 8" ng-show="concept.Result">
                        <div class="col-sm-12">
                            <div class="col-sm-3 lefcol1 innerdata 4x">{{concept.ConceptName}}</div>
                            <div class="col-sm-9 lefcol2 innerdata" style="word-wrap: break-word;"><span class="btnspan2">{{concept.Result}}</span></div>
                        </div>
                    </div>
                    <div class="concept-lable" ng-if="concept.ValueTypeId == 12 || concept.ValueTypeId == 8" ng-show="concept.Result">
                        <div class="col-sm-12">
                            <div class="col-sm-3 lefcol1 innerdata 4x">{{concept.ConceptName}}</div>
                            <div class="col-sm-9 lefcol2 innerdata" style="word-wrap: break-word;" ng-bind-html="concept.Result"></div>
                        </div>
                    </div>
                    <div class="concept-lable" ng-if="concept.ValueTypeId ==3 && concept.IsMultiple == false" ng-show="concept.Result">
                        <div class="col-sm-12">
                            <div class="col-sm-3 lefcol1  innerdata 5x">{{concept.ConceptName}}</div>
                            <div class="col-sm-6 lefcol2 innerdata"><span class="btnspan1">{{concept.Result}}</span><span class="btnspan" ng-if="concept.Comments"> - {{concept.Comments}}</span></div>
                        </div>
                    </div>
                    <div class="concept-lable" ng-if="concept.ValueTypeId ==3 && concept.IsMultiple == true" ng-show="concept.Terms && concept.Terms.length > 0">
                        <div class="col-sm-9 lefcol2 innerdata">{{concept.Result}}<span ng-if="concept.Comments"> - {{concept.Comments}}</span></div>
                        <div class="col-sm-12 symptoms">
                            <div class="col-sm-3 lefcol1 innerdata 6x">{{concept.ConceptName}}</div>
                            <div class="col-sm-6 lefcol2 innerdata">
                                <span class="btnspan3" ng-repeat="term in concept.Terms">
                            {{term.TermName}}
                            <span class="btnspan4" ng-if="term.Comments"> - {{term.Comments}}</span>
                                <span class="btnspan5" ng-if="$index != concept.Terms.length-1">,</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </script>
    <script type="text/ng-template" id="cn-followup-section.html">

        <div ng-if="sectionData.followup.length > 0" class="row">
            <div class="col-sm-12">
                <div class="form-group">
                    <div class="col-sm-12 form-group mb0">
                        <span class="d-flex-left">

                    <div class="col-sm-12 form-group mb0">
                        <span class="d-flex-left">
                            <input type="checkbox" tabindex="-1" ng-model="currentcontext.selectall"
                                ng-click="isAllOrderSelectedChange(sectionData[item.sectionid], item.sectionid)">
                                <h4 class="control-label fontgreen mar_z" ng-if="sectionData.ExecutableProcedure.length> 0" translate="patientemr.executableprocedure.pagetitle.lbl"></h4>
                        </span>
                    </div>
                </div>
            </div>
        </div>
        <div ng-if="sectionData.ExecutableProcedure.length > 0" class="row" ng-repeat="item in sectionData.ExecutableProcedure">
            <div class="row innerdata">
                <div class="col-sm-12">
                    <div class="col-sm-3 lefcol1 innerdata 4x no-pad">Procedure: </div>
                    <div style="" class="col-sm-9">{{item.ServiceName}}</div>
                </div>
                <div class="col-sm-12">
                    <div class="col-sm-3 lefcol1 innerdata 4x no-pad" ng-if="item.Comments">Remarks: </div>
                    <div style="" class="col-sm-9" ng-if="item.Comments">{{item.Comments}}</div>
                </div>

            </div>
        </div>
    </script>
    <script type="text/ng-template" id="cn-executableprocedures-section.html">

        <div ng-if="sectionData.ProcedureOrders.length > 0" class="row">
            <div class="col-sm-12" style="margin-top:0px;">
                <div class="form-group">
                    <div class="col-sm-4 form-group mb0">
                        <span class="d-flex-left">
                            <input type="checkbox" tabindex="-1" ng-model="currentcontext.selectall"
                                ng-click="isAllOrderSelectedChange(sectionData[item.sectionid], item.sectionid)">
                                <h4 class="control-label fontgreen mar_z" translate="patientemr.reviewnotes.procedureorders.lbl"></h4>
                        </span>
                    </div>
                </div>
            </div>
        </div>
        <div ng-if="sectionData.ProcedureOrders.length > 0" ng-repeat="item in sectionData.ProcedureOrders">
            <div class="row innerdata" style=" margin-left: 79px !important;">

                <div class="col-sm-9">
                    <span ng-repeat="detail in item.ProcedureOrderDetails" class="lefcol12" ">{{detail.ProcedureName}}({{detail.ProcedureCode}})

                <span class="lefcol2 " style="margin-left: 36px; ">{{detail.ServiceCategoryName}}
                </span>
            </span>
            </div>
        </div>
    </div>
</script>

    <script type="text/ng-template " id="cn-advicemedications-section.html ">

    <div ng-if="sectionData.Advicemedications[0].DrugName " class="row ">
    <div class="col-sm-12 " style="margin-top:0px; ">
        <div class="form-group ">
            <div class="col-sm-4 form-group mb0 " style="padding:0; ">
                <span class="d-flex-left">
                    <input type="checkbox" tabindex="-1" ng-model="currentcontext.selectall"
                        ng-click="isAllOrderSelectedChange(sectionData[item.sectionid], item.sectionid)">
                        <h4 class="control-label fontgreen mar_z "   style="padding:0; "translate="Advice Medications "></h4>
                </span>
            </div>
        </div>
    </div>
</div>
<div ng-if="sectionData.Advicemedications.length> 0">
                    <div class="row" style="padding:19px 30px">
                        <!-- <div class="col-sm-3 fontpink">
                <ngformatdate date-val='item.PrescriptionDate'></ngformatdate>
            </div> -->
                        <table class="table table-responsive table-bordered">
                            <thead>
                                <tr>
                                    <th class="col-sm-2 lefcol8">Drugs</th>
                                    <th class="col-sm-2 lefcol8">Dosage</th>
                                    <th class="col-sm-2 lefcol8">Frequency</th>
                                    <th class="col-sm-2 lefcol8">Duration</th>
                                    <th class="col-sm-2 lefcol8">Drug Instruction</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="item in sectionData.Advicemedications">
                                    <td class="col-sm-2">
                                        <span class="lefcol1">{{item.DrugName}}</span>
                                    </td>
                                    <td class="col-sm-2">
                                        <span class="lefcol2">{{item.Dosage}}</span>
                                    </td>
                                    <td class="col-sm-2">
                                        <span class="lefcol3">
                            <span ng-if="item.MorningFrequency==true">1</span>
                                        <span ng-if="item.MorningFrequency==false">0</span>&nbsp;-&nbsp;
                                        <span ng-if="item.AfterNoonFrequency==true">1</span>
                                        <span ng-if="item.AfterNoonFrequency==false">0</span>&nbsp;-&nbsp;
                                        <span ng-if="item.EveningFrequency==true">1</span>
                                        <span ng-if="item.EveningFrequency==false">0</span>&nbsp;-&nbsp;
                                        <span ng-if="item.NightFrequency==true">1</span>
                                        <span ng-if="item.NightFrequency==false">0</span>
                                        </span>
                                    </td>
                                    <td class="col-sm-2">
                                        <span class="lefcol5">{{item.Duration}} {{item.DurationPeriod.Description}}</span>
                                    </td>
                                    <td class="col-sm-2">
                                        <span class="lefcol5">{{item.DrugInstruction.Description}}</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <div>
                            Diet Advice:&nbsp; {{sectionData.Advicemedications[0].DietAdvice}}
                        </div>
                    </div>
                </div>
    </script>
    <div class="fooder-bgs">
        <div class="row">
            <div class="pull-left">
                <ul class="nav navbar-nav pull-left">
                    <li uib-dropdown="" class="dropdown dropdown-list custom-li">
                        <button uib-dropdown-toggle="" class="draftbutton" ng-disabled="">
                            <span translate="Previous Notes"></span>&nbsp;&nbsp;
                        </button>
                        <ul class="dropdown-menu top" role="menu" aria-labelledby="dLabel">
                            <li ng-repeat="item in sectionData.consultlist| limitTo: 5" style="border: 1px solid;">
                                <a class="" ng-click="viewConsultation(item)">
                                    <span>
                                        <i class="fa fa-clock-o" aria-hidden="true"></i>
                                    </span>&nbsp;&nbsp;
                                    <!-- <span class="dr_name0">{{item.Encounter.DoctorName}} - </span> -->
                                    <span class="dr_name0">{{item.Doc.Title.Description}}. {{item.Doc.FirstName}} -
                                    </span>
                                    <displaydate class="disp_date0" datetime-val="item.CreatedAt"></displaydate>
                                    <span class="dr_profile0"> - {{item.ProfileMaster.Name}}</span>
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>

            <div class="pull-right">
                <button type="button" class="draftbutton"
                    ng-hide="item.ProgressNoteStatusId==2||item.ProgressNoteStatusId==3"
                    ng-click="approveConsultation()">
                    <span translate="patientemr.reviewnotes.approve.lbl"></span>
                </button>&nbsp;&nbsp;
                <button ng-click="printConsultation()" class="draftbutton pull-right" hotkey="{'alt+p': print}">
                    <span translate="With Header"></span>&nbsp;
                    <span>
                        <i class="fa fa-print" aria-hidden="true"></i>
                    </span>
                </button>&nbsp;&nbsp;
                <button ng-click="printConsultation2()" class="draftbutton pull-right" hotkey="{'alt+p': print}">
                    <span translate="Without Header"></span>&nbsp;
                    <span>
                        <i class="fa fa-print" aria-hidden="true"></i>
                    </span>
                </button>&nbsp;&nbsp;
            </div>
        </div>
    </div>
</div>
