<style>
    table {
        width: 100%;
    }
</style>
<div class="row">
    <div class="col-sm-10">
        <label class="btn btn-secondary top-option" ng-repeat="option in options" ng-model="currentcontext.option" uib-btn-radio="option.key">{{option.name}}</label>

    </div>
    <div class="col-sm-2" style="float: right;">
        <button type="button" class="btn-add" uib-tooltip="Add New Orders" tooltip-placement="bottom" ng-click="addNew()"> <i class="fa fa-plus"></i></button>

        <!-- <a class="pull-right" ng-click="addNew()" href="">Add New Orders</a> -->
    </div>
</div>
<div class="row" ng-show="canShowOrdersArea()">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-12">
            <div class="col-sm-3 form-group">
                <label class="col-sm-12 control-label" for="sel1">Select Template</label>
                <div class="col-sm-12">
                    <panelcontrol config="panelconfig" saveclick="savePanels()" changeev="savePanels()">
                    </panelcontrol>
                </div>
            </div>
            <div class="col-sm-3 form-group">
                <label class="col-sm-12 control-label" translate="Procedure Name"></label>
                <div class="col-sm-12">
                    <autosearch itemid="item.ServiceItemId" controlid="'testid'" name="'service'" controlid="item.itemidxdesc" iteminfo="item.SelectedItem" rowdata="item" config="vm.serviceitemcontrolconfig" itemchange="serviceChanged($index,item)" class="inputsearchlogo"
                        candisable="IsDisabled" isrequired="true" tabindex="item.tabindex">
                    </autosearch>
                </div>
            </div>
            <div class="col-sm-3 form-group">
                <label class="col-sm-12 control-label" translate="Qty"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" ng-model="item.Quantity" ng-disabled="IsDisabled" placeholder="" ng-change="computeNetAmount(item)" tabindex="-1">
                </div>
            </div>
            <div class="col-sm-3 form-group">
                <label class="col-sm-12 control-label" translate="Priority"></label>
                <div class="col-sm-12">
                    <ui-select ng-model="item.OrderPriorityId" ng-disabled="IsDisabled" tabindex="-1" on-select="OnPrioritySelected($select.selected)">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.OrderPriority | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="col-sm-12 form-group" style="margin-top: 8px;">
                <button type="button" class="btn-add tool" uib-tooltip="Add
                    Investigation" tooltip-placement="bottom" ng-disabled="ConsultData.ProgressNoteStatusId==2" ng-click="addOrder()"> <i class="fa fa-plus"></i></button>
            </div>
        </div>
        <div class="col-sm-12" style="margin-top: 20px;">
            <div class="drhms-table-height">
                <table border="1" class="drhms-responsive-table">
                    <thead class="bg-subhead">
                        <tr>
                            <td>S.NO</td>
                            <td><span translate="patientemr.patientorder-form.test.lbl" for="test"></span></td>
                            <td>Type </td>
                            <td>Qty</td>
                            <!-- <td>Price</td> -->
                            <td>Priority</td>
                            <td>Instructions </td>
                            <td ng-hide="IsDisabled">Action </td>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="item in details | filter:{Status:1}">
                            <td>{{$index+1}}</td>
                            <td>{{item.ServiceName}}</td>
                            <td>{{item.OrderType}} </td>
                            <td>{{item.Quantity}}</td>
                            <!-- <td>{{item.TestPrice}}</td> -->
                            <td>{{item.OrderPriority}}</td>
                            <td><input type="text" class="form-control" ng-model="item.OrderComments" ng-disabled="IsDisabled" placeholder="" tabindex="-1"></td>
                            <!-- <td>{{item.Comments}}</td> -->
                            <td ng-hide="IsDisabled">
                                <button type="button"  class="drhms-edit-button">
                                    <img src="assets/svg/edit.svg" alt="">
                                </button>
                                <button  type="button"class="drhms-edit-button">
                                    <img src="assets/svg/delete.svg" alt="">
                                </button>
                                <!-- <button class="btn btn-danger btn-xs edit">
                                    <i class="fa fa-edit" aria-hidden="true"></i>
                                </button>
                                <button class="btn btn-danger btn-xs del">
                                    <i class="fa fa-trash" aria-hidden="true"></i>
                                </button> -->

                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="fooder-bgs">
            <div class="row">
                <div class="pull-left">
                    <button type="button" class="btn pyr-color10 btn-sm" tabindex="-1" ng-click="backToList()" ng-if="!currentcontext.ismodal">
                        <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                        <span class="btn-fontsize" translate="common.backaction.lbl"></span>
                    </button>
                    <button tabindex="-1" type="button" class="draftbutton" ng-show="CanShowCancel" ng-click="saveCancelled()" translate="patientemr.patientorder-form.cancelorder.lbl"></button>
                </div>
                <div class="pull-right">
                    <printcontrol ng-if="canShowPrint()" printclick="print()" entity="'Order'" originalprintclick="originalprint()" reason="currentcontext.printreason"></printcontrol>
                    <button type="button" class="draftbutton" translate="patientemr.patientorder-form.orderaction.lbl" ng-show="CanShowOrder" ng-hide="currentcontext.encounter.EncounterStatusId==2" ng-disabled="ConsultData.ProgressNoteStatusId==2" ng-click="createOrder()"></button>
                </div>
            </div>
        </div>
    </form>
</div>
<div ng-show="canShowTickSheetArea()">
    <ticksheetcontrol config="ticksheetconfig" addclick="addTickSheet()" saveclick="saveTickSheets()">
    </ticksheetcontrol>
</div>
