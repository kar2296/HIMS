    <div aria-multiselectable="true">
        <div class="" ng-repeat="item in items">
            <div class="col-sm-12">
                <div class="col-sm-1">
                    Select All
                    <span>
                        <input type="checkbox" class="custom-checkbox" ng-model="item.Select"
                            ng-disabled="item.cnDisabled" />
                    </span>
                </div>

                <div class="col-sm-2">
                    <span>
                        <ngformatdate datetime-val='item.CreatedAt'></ngformatdate>
                    </span>
                </div>
                <div class="col-sm-4">
                    {{item.OrderNumber}}
                </div>
                <div class="col-sm-3 hidencontent">
                    <span> {{item.DoctorName}}</span>

                </div>
                <div class="col-sm-1 hidencontent">
                    <span>{{item.OrderStatus.DisplayName}}</span>

                </div>
                <div class="col-sm-1">
                    <button type="button" class="btn btn-default btn-xs" ng-click="toggleCanShowDetails(item)">
                        <i class="fa fa-angle-down" aria-hidden="true" ng-show="!item.CanShowDetails"></i>
                        <i class="fa fa-angle-up" aria-hidden="true" ng-show="item.CanShowDetails"></i>
                    </button>
                </div>
            </div>
            <div class="null" ng-show="item.CanShowDetails">
                <div class="panel-body">
                    <div class="">
                        <div class="row">
                            <table style="width: 98%;margin-left: 1%;">
                                <tr ng-repeat="dtl in item.PatientOrderDetails">
                                    <td>{{dtl.TestName}}</td>
                                    <td>{{dtl.OrderType}} </td>
                                    <td>{{dtl.Quantity}}</td>
                                    <!-- <td>{{dtl.TestPrice}}</td> -->
                                    <td>{{dtl.OrderPriority.Description}}</td>

                            </table>
                        </div>
                    </div>
                </div>
            </div>
