<style>     
        
        /* Style the buttons inside the tab */
        .tablinks {
    margin-top: 12px !IMPORTANT;
    margin-left: 11px !IMPORTANT;
    background: none;
    border: none;
}
        
        /* Change background color of buttons on hover */
        .tab button:hover {
          background-color: #ddd;
        }
        
        /* Create an active/current tablink class */
        .tab button.active {
    background-color: #fff;
    border-bottom: 2px solid #2196f3;
}
.fooder-bgs {
    margin-bottom: 50px !important;
    height: 1% !important;
    margin-top: 12px;
}
button.dropdown-toggle.btn-btnpast.text-white.btn-sm {
    background: #ff902b !important;
    border: unset;
    padding-top: 5px;
    border-radius: 4px;
    color: white;
}
        </style>
<div class="tab">
    <button class="tablinks" onclick="openCity(event, 'Procedures')" id="defaultOpen">Procedures</button>
    <button class="tablinks" onclick="openCity(event, 'Favourites')">Favourites</button>
  </div>
  <div id="Procedures" class="tabcontent">      
    <div class="row page-header">
            <div class="col-sm-12">
                <div class="col-sm-6 col-md-9">
                    <h4 class="page-header mt0" translate="patientemr.patientprocedure-list.pagetitle.lbl"></h4>
                </div>
                <div class="col-sm-6 col-md-3">
    
                      <button class="btn-add" ng-click="addNew()" uib-tooltip="{{ 'patientemr.patientprocedure-list.pagetitle.lbl' | translate }}"
                        tooltip-placement="bottom">
                        <i class="fa fa-plus" aria-hidden="true"></i>
                        </button>
    
                </div>
            </div>
        </div>
    <custom-table config="vm.gridConfig"></custom-table>
  </div>
  <div id="Favourites" class="tabcontent">
    <favoritecontrol config="favconfig" addclick="addFavorite()" saveclick="saveFavorites()"></favoritecontrol>
  </div>

  
  <div class="fooder-bgs">
        <div class="col-sm-12">
            <button type="button" class="btn pyr-color10 btn-sm pull-left" tabindex="-1" ng-click="backToList()">
                <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                <span class="btn-fontsize" translate="common.backaction.lbl"></span>
            </button>
            <ul class="nav navbar-nav pull-left" id="pastnotes">
                <li uib-dropdown="" class="dropdown dropdown-list custom-li">
                    <button uib-dropdown-toggle="" class="draftbutton" ng-disabled="">
                        <span translate="Previous Notes"></span>&nbsp;&nbsp;&nbsp;
                        <!-- <span>
                                    <i class="fa fa-caret-up" aria-hidden="true"></i>
                                </span> -->
                    </button>
                    <ul class="dropdown-menu top" role="menu" aria-labelledby="dLabel">
                        <li ng-repeat="item in consultlist| limitTo: currentcontext.recordcount">
                            <a class=" " ng-click="viewConsultation(item) ">
                                <span>
                                    <i class="fa fa-angle-right " aria-hidden="true "></i>
                                </span>&nbsp;&nbsp;&nbsp;
                                <span class="dr_name0 ">{{item.Encounter.DoctorName}} - </span>
                                <displaydate class="disp_date0 " datetime-val="item.CreatedAt "></displaydate>
                                <span class="dr_profile0 "> - {{item.ProfileMaster.Name}}</span>
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
        <!-- <div class="col-sm-12">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div> -->
    </div>

    <script>
            function openCity(evt, cityName) {
              var i, tabcontent, tablinks;
              tabcontent = document.getElementsByClassName("tabcontent");
              for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
              }
              tablinks = document.getElementsByClassName("tablinks");
              for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
              }
              document.getElementById(cityName).style.display = "block";
              evt.currentTarget.className += " active";
            }
            
            // Get the element with id="defaultOpen" and click on it
            document.getElementById("defaultOpen").click();
            </script>
