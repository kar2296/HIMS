<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="patientemr.consultation-list.consultation_notes.lbl"></h4>
</div>

<div class="col-sm-12">
    <div class="table-responsive" id="mainresponsivetablecontrol">
        <table class="table table-hover table-responsive table-bordered custom-table">
            <tbody>
                <tr>
                    <td colspan="9">
                        <table class="table table-hover table-responsive table-bordered custom-table">
                            <thead class="bg-subhead">
                                <tr>
                                    <th>
                                        Select All
                                        <input type="checkbox" class="custom-checkbox"
                                            ng-model="currentcontext.SelectAll" ng-click="SelectAllItems()" />
                                    </th>
                                    <th>
                                        <span>Date</span>
                                    </th>
                                    <th>
                                        <span>VitalName</span>
                                    </th>
                                    <th>
                                        <span>VitalValue</span>
                                    </th>
                            </thead>
                            <tbody>
                                <tr ng-repeat="item in items">
                                    <td class="cus-col">
                                        <center>
                                            <input type="checkbox" class="custom-checkbox" ng-model="item.Select"
                                                ng-disabled="item.cnDisabled" />
                                        </center>
                                    </td>
                                    <td class="cus-col date">
                                        <ngformatdate datetime-val='item.CreatedAt'></ngformatdate>
                                    </td>
                                    <td class="cus-col">
                                        <div>
                                            <span class="doctor">{{item.VitalName}}</span>
                                        </div>
                                    </td>
                                    <td class="cus-col">
                                        <div>
                                            <span class="doctor">{{item.VitalValue}}&nbsp;&nbsp;{{item.UOM}}</span>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="pull-right">
            <button id="btnCancelForm" type="button" class="draftbutton" ng-click="saveToNotes()"
                translate="common.saveaction.lbl"></button>
            <button id="btnCancelForm" type="button" class="draftbutton" ng-click="cancelCallback()"
                translate="common.cancelaction.lbl"></button>
        </div>
    </div>
</div>
