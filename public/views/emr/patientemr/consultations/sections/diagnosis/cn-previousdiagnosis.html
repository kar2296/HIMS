<link href="app/css/emr.css" rel="stylesheet">
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="patientemr.patientdiagnosis-list.history.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>
<div class="row">
    <div aria-multiselectable="true">
        <div ng-repeat="item in Prescriptions">
            <div class="col-sm-12 previoucolor">
                <div class="col-sm-1" style="width: 9%;">
                    Select All
                    <input type="checkbox" class="custom-checkbox" ng-model="currentcontext.SelectAll"
                        ng-click="SelectAllItems()" />
                </div>

                <div class="col-sm-1">
                    <span>Date</span>
                </div>
                <div class="col-sm-2">
                    Doctor/Type
                </div>
                <div class="col-sm-3 hidencontent">
                    <span>Diagnosis</span>

                </div>
                <div class="col-sm-1">
                    <span> Other Diagnosis</span>

                </div>
            </div>
            <div class="" ng-show="item.CanShowDetails">
                <div class="panel-body">
                    <div class="">
                        <div class="row">
                            <table style="width: 98%;margin-left: 1%;">
                                <tr ng-repeat="item in items">
                                    <td class="cus-col">
                                        <center>
                                            <input type="checkbox" class="custom-checkbox" ng-model="item.Select"
                                                ng-disabled="item.cnDisabled" />
                                        </center>
                                    </td>
                                    <td class="cus-col date">
                                        <ngformatdate datetime-val='item.ConditionDate'></ngformatdate>
                                    </td>
                                    <td class="cus-col">
                                        <div>
                                            <span class="doctor">{{item.Encounter.DoctorName}}</span>&nbsp;|&nbsp;
                                            <span>
                                                <b class="condition">{{item.ConditionType.Description}}</b>
                                            </span>
                                            <!-- <span class="type">{{item.Encounter.EncounterType.Description}}</span> -->
                                        </div>
                                    </td>
                                    <td class="cus-col">
                                        <div>
                                            <span class="name">{{item.DiagnosisName}}</span>
                                            <span class="code" ng-if="item.DiagnosisName">({{item.Code}})</span>
                                        </div>
                                    </td>
                                    <td class="cus-col date">
                                        <span class="name">{{item.OtherDiagnosis}}</span>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="fooder-bgs">
    <div class="row ">
        <div class="pull-right">
            <button id="btnCancelForm" type="button" class="draftbutton" ng-click="saveToNotes()"
                translate="common.saveaction.lbl"></button>
            <!-- <button id="btnCancelForm" type="button" class="draftbutton" ng-click="cancelCallback()"
                        translate="common.cancelaction.lbl"></button> -->
        </div>
    </div>
</div>
