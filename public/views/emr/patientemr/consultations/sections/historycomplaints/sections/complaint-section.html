<style>
    table tbody tr,
    .table td,
    .table-responsive {
        border: 1px solid !important;
    }

    table,
    td,
    th {
        border: 1px solid #595959;
        border-collapse: collapse;
    }

    td,
    th {
        padding: 3px;
        width: 30px;
        height: 25px;
    }

    th {
        background: #f0e6cc;
    }

    .even {
        background: #fbf8f0;
    }

    .odd {
        background: #fefcf9;
    }

    /* div#family_toogle{background: #035d2b;} */
</style>
<div class="panel {{currentcontext.paneltype}} portlet-panel" ng-controller="ComplaintSectionController as vm">
    <div class="panel-heading portlet-panel-heading" id="social_toogle" ng-click="">
        <strong translate="patientemr.eyehistorysections.complaints.lbl"></strong>
        <i class="fa fa-angle-down cust_downarrow soccommon_arrow"></i>
        <i class="fa fa-angle-right cust_rightarrow soc2common_arrow"></i>
        <a ng-click="handleEvents('add')" class="pull-right lnk-portlet-header-action" uib-tooltip="{{ 'common.addnewaction.lbl' | translate }}"
            tooltip-placement="top">
            <i class="fa fa-plus btn-circle" aria-hidden="true"></i>
        </a>
    </div>
    <div class="panel-wrapper">
        <div class="panel-body portlet-panel-body social_toggle">
            <div class="table-responsive">
                <table class="table table-striped table-condensed">
                    <tbody>
                        <tr class="portlet-tr" ng-repeat="item in items | limitTo: currentcontext.recordcount">
                            <td rowspan="2">{{item.ChiefComplaint.ChiefComplaint}}</td>
                            <td colspan="2" style="text-align:center;">
                                <span style="color:brown;" translate="patientemr.eyehistorysections.duration.lbl"></span>
                            </td>
                            <td colspan="2" style="text-align:center;">
                                <span style="color:brown;" translate="patientemr.eyehistorysections.onset.lbl"></span>
                            </td>
                            <td colspan="2" style="text-align:center;">
                                <span style="color:brown;" translate="patientemr.eyehistorysections.progression.lbl"></span>
                            </td>
                            <td rowspan="2">
                                <a ng-click="handleEvents('edit', item)" class="lnk-portlet-action" uib-tooltip="{{ 'common.editaction.lbl' | translate }}"
                                    tooltip-placement="left">
                                    <i class="fa fa-pencil-square-o btn btn-default btn-rounded" aria-hidden="true"></i>
                                </a>
                                <a ng-click="handleEvents('delete', item)" class="lnk-portlet-action" uib-tooltip="{{ 'common.deleteaction.lbl' | translate }}"
                                    tooltip-placement="left">
                                    <i class="fa fa-trash btn btn-default btn-rounded" aria-hidden="true"></i>
                                </a>
                            </td>
                        </tr>
                        <tr class="portlet-tr" ng-repeat="item in items | limitTo: currentcontext.recordcount">
                            <td>
                                <span style="color: #ef0a3d;font-weight: 700;">L:&nbsp;</span>{{item.LDuration}} {{item.LDurationPeriod.Description}}</td>
                            <td>
                                <span style="color: #ef0a3d;font-weight: 700;">R:&nbsp;</span>{{item.RDuration}} {{item.RDurationPeriod.Description}}</td>
                            <td>
                                <span style="color: #ef0a3d;font-weight: 700;">L:&nbsp;</span>{{item.LOnset}}</td>
                            <td>
                                <span style="color: #ef0a3d;font-weight: 700;">R:&nbsp;</span>{{item.ROnset}}</td>
                            <td>
                                <span style="color: #ef0a3d;font-weight: 700;">L:&nbsp;</span>{{item.LProgression}}</td>
                            <td>
                                <span style="color: #ef0a3d;font-weight: 700;">R:&nbsp;</span>{{item.RProgression}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
    $(document).ready(function () {
        $(".soccommon_arrow").click(function () {

            $(".social_toggle").toggle("slow");

        });
    });

</script>
<style>
    .social_toggle {
        height: 150px;

        width: 100%;
    }

    .soccommon_arrow {
        float: right;
        padding-left: 47px;
        font-size: 24px;

    }

    .soc2common_arrow {
        display: none;
    }
</style>
