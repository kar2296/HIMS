<style>
    /* div#family_toogle{background: #035d2b;} */
</style>
<div class="panel {{currentcontext.paneltype}} portlet-panel" ng-controller="GeneralHistorySectionController as vm">
    <div class="panel-heading portlet-panel-heading" id="social_toogle" ng-click="">
        <strong translate="patientemr.eyehistorysections.gnrlhstry.lbl"></strong>
        <i class="fa fa-angle-down cust_downarrow soccommon_arrow"></i>
        <i class="fa fa-angle-right cust_rightarrow soc2common_arrow"></i>
        <a ng-click="handleEvents('add')" class="pull-right lnk-portlet-header-action" uib-tooltip="{{ 'common.addnewaction.lbl' | translate }}"
            tooltip-placement="top">
            <i class="fa fa-plus btn-circle" aria-hidden="true"></i>
        </a>
    </div>
    <div class="panel-wrapper">
        <div class="panel-body portlet-panel-body social_toggle">
            <div class="table-responsive">
                <table class="table table-striped table-condensed">
                    <tbody>
                        <tr class="portlet-tr" ng-repeat="item in items | limitTo: currentcontext.recordcount">
                            <td class="lefcol2">{{item.GeneralHistory}}</td>
                            <td class="td-action">
                                <a ng-click="handleEvents('edit', item)" class="lnk-portlet-action" uib-tooltip="{{ 'common.editaction.lbl' | translate }}"
                                    tooltip-placement="left">
                                    <i class="fa fa-pencil-square-o btn btn-default btn-rounded" aria-hidden="true"></i>
                                </a>
                                <a ng-click="handleEvents('delete', item)" class="lnk-portlet-action" uib-tooltip="{{ 'common.deleteaction.lbl' | translate }}"
                                    tooltip-placement="left">
                                    <i class="fa fa-trash btn btn-default btn-rounded" aria-hidden="true"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
    $(document).ready(function () {
        $(".soccommon_arrow").click(function () {

            $(".social_toggle").toggle("slow");

        });
    });

</script>
<style>
    .social_toggle {
        height: 150px;

        width: 100%;
    }

    .soccommon_arrow {
        float: right;
        padding-left: 47px;
        font-size: 24px;

    }

    .soc2common_arrow {
        display: none;
    }
</style>
