<style>
    .lefcol1 {
        width: 28%
    }

    .lefcol4 {
        width: 40%;
    }

    div#social_toogle {
        /* background: rgb(125, 122, 15); */
    }
</style>
<div class="panel {{currentcontext.paneltype}} portlet-panel" ng-controller="FamilySocialHistorySectnController as vm">
    <div class="panel-heading portlet-panel-heading" id="family_toogle">
        <strong translate="patientemr.patientdashboard.familysocialhistory.lbl"></strong>
        <i class="fa fa-angle-down cust_downarrow famcommon_arrow"></i>
        <i class="fa fa-angle-right cust_rightarrow fam2common_arrow"></i>
        <a ng-click="handleEvents('add')" class="pull-right lnk-portlet-header-action" uib-tooltip="{{ 'common.addnewaction.lbl' | translate }}"
            tooltip-placement="top">
            <i class="fa fa-plus btn-circle" aria-hidden="true"></i>
        </a>
    </div>
    <div class="panel-wrapper">
        <div class="panel-body portlet-panel-body family_toggle">
            <div class="table-responsive">
                <table class="table table-striped table-condensed">
                    <tbody>
                        <tr class="portlet-tr" ng-repeat="item in items | limitTo: currentcontext.recordcount">
                            <td class="lefcol1">{{item.SocialType.Description}}</td>
                            <td class="lefcol4">{{item.Relationship.Description}}</td>
                            <td class="td-action">
                                <a ng-click="handleEvents('edit', item)" class="lnk-portlet-action" uib-tooltip="{{ 'common.editaction.lbl' | translate }}"
                                    tooltip-placement="left">
                                    <i class="fa fa-pencil-square-o btn btn-default btn-rounded" aria-hidden="true"></i>
                                </a>
                                <a ng-click="handleEvents('delete', item)" class="lnk-portlet-action" uib-tooltip="{{ 'common.deleteaction.lbl' | translate }}"
                                    tooltip-placement="left">
                                    <i class="fa fa-times-circle btn btn-default btn-rounded" aria-hidden="true"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
    $(document).ready(function () {
        $(".famcommon_arrow").click(function () {

            $(".family_toggle").toggle("slow");

        });
    });

</script>
<style>
    .family_toggle {
        height: 150px;
        width: 100%;
    }

    .famcommon_arrow {
        float: right;
        padding-left: 47px;
        font-size: 24px;
    }

    .fam2common_arrow {
        display: none;
    }
</style>
