    <div class="col-sm-12">
        <h4 class="mt0" translate="Notes"></h4>

<emrpatientbanner ng-if="Context=='emr'||Context=='vorders'" patientid="currentcontext.pid" encounterid="currentcontext.eid">
</emrpatientbanner>
<ippatientbanner ng-if="Context=='ipemr'||context=='aeemr'" patientid="currentcontext.pid" encounterid="currentcontext.eid">
</ippatientbanner>

<div class="row">
    <!-- <div class="col-sm-12">
        <div class="header">
            <emrpatientbanner ng-if="Context=='emr'" patientid="currentcontext.pid" encounterid="currentcontext.eid">
            </emrpatientbanner>
            <ippatientbanner ng-if="Context=='ipemr'" patientid="currentcontext.pid" encounterid="currentcontext.eid">
            </ippatientbanner>
            <div class="col-sm-7 pull-right">
            </div>
        </div>
    </div> -->

    <div ng-show="cncontext.canshowaddnew">
        <div class="col-md-12" style="padding: 5px; border: 1px solid gray;border-radius: 5px;">
            <div class="col-sm-3 form-group">
                <label class="col-sm-5 control-label" translate="patientemr.consultation.profile.lbl"></label>
                <div class="col-sm-7">
                    <ui-select ng-model="item.ProfileId">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.Profile | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="col-sm-3 form-group">
                <label class="col-sm-5 control-label" translate="patientemr.consultation.consultationname.lbl"></label>
                <div class="col-sm-7">
                    <input type="text" class="form-control" name="cosultationname" ng-model="item.Name" placeholder="">
                </div>
            </div>
            <div class="col-sm-6">
                <button ng-if="canUpdatePatientEMR()" class="btn btn-primary btn-xs" type="button"
                    ng-click="saveItem()">Save</button>
                <button class="btn btn-danger btn-xs" type="button" ng-click="closeConsultModal()">Cancel</button>
            </div>
        </div>
    </div>
    <div ng-show="cncontext.canshowuserpref">
        <div class="col-md-12" style="padding: 5px; border: 1px solid gray;border-radius: 5px;">
            <div class="col-sm-4 form-group">
                <label class="col-sm-5 control-label" translate="patientemr.consultation.profile.lbl"></label>
                <div class="col-sm-7">
                    <ui-select ng-model="prefcontext.profileid" ng-change="profilePrefChanged($select.selected)">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.Profile | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="col-sm-4">
                <button ng-if="canUpdatePatientEMR()" class="btn btn-primary btn-xs" type="button"
                    ng-click="saveUserPref()">Save</button>
                <button class="btn btn-danger btn-xs" type="button" ng-click="closeUserPref()">Cancel</button>
            </div>
            <div class="col-sm-4">
            </div>
        </div>
    </div>
</div>
<div id="receipt_tab">
    <div class="row">
        <div class="col-sm-12">
            <uib-tabset active="active">
                <uib-tab index="$index" ng-repeat="item in cncontext.tabstop" heading="{{item.title}}"
                    ng-click="switchTopTab(item)"></uib-tab>
            </uib-tabset>
            <tab ng-show="cncontext.currentsection" currentsection="cncontext.currentsection"></tab>
        </div>
    </div>
</div>
