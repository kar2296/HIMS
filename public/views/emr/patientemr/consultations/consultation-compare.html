<script type="text/ng-template" id="cn-labresult-section.html">
    <div class="panel portlet-panel">
        <div class="panel-heading portlet-panel-heading text-white">            
            <strong translate="patientemr.consultation-compare.labresult.lbl"></strong>
        </div>
        <div class="panel-wrapper">
            <div class="panel-body portlet-panel-body" >
                <div class="table-responsive">
                    <div ng-repeat="order in items">
                        <div id='workorder' ng-repeat="wo in order.PatientWorkorders">
                            <table class="table table-hover table-responsive table-bordered">
                                <tbody ng-repeat="test in wo.woDetails">
                                    <tr ng-if="test.RootProfileName">
                                        <td colspan="9">
                                            <span class="lbl-profile">{{test.RootProfileName}}</span>
                                        </td>
                                    </tr>
                                    <tr ng-if="test.ProfileName">
                                        <td colspan="9">
                                            <span class="lbl-profile">{{test.ProfileName}}</span>
                                        </td>
                                    </tr>
                                    <tr ng-hide="test.details.length == 1 && test.Testname.toLowerCase() == test.details[0].Analytename.toLowerCase()">
                                        <td colspan="9"><span class=" btn btn-primary btn-xs"> {{test.Testname}}</span>
                                        </td>
                                    </tr>
                                    <tr ng-repeat="item in test.details | filter:{Status:1}">
                                        <td class="col-sm-3">
                                            <span style="margin-left:24px;  vertical-align: super; color: #0dbef1; font-weight: 700; white-space: nowrap; text-overflow: ellipsis; overflow: auto;">{{item.Analytename}}</span>
                                        </td>
                                        <td class="col-sm-3" colspan="{{item.TestValueType == 3 ? '3' : '1'}}">
                                            <span> {{item.Resultvalue}} </span>
                                        </td>
                                        <td class="col-sm-3" ng-if="item.TestValueType != 3">
                                            <span ng-model="item.AnalyteUOM">{{item.AnalyteUOM}}</span>
                                        </td>
                                        <td class="col-sm-3" ng-if="item.TestValueType != 3">
                                            <span class="pull-left">{{item.Analyterange}}</span>
                                            <span class="pull-right" style="color: #ff902b; font-weight: 700;">{{item.Qualifier}}</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div> 
            </div>
        </div>
    </div>
</script>

<script type="text/ng-template" id="cn-question-section.html">
    <div class="panel portlet-panel">
        <div class="panel-heading portlet-panel-heading text-white">            
            <strong>{{items.sectionName}}</strong>
        </div>
        <div class="panel-wrapper">
            <div class="panel-body portlet-panel-body" >
                <div ng-repeat="category in  items.cat" style="height:100%">
                    <div class="row">
                        <div class="col-sm-12">
                            <h4 class="align-left control-label category-lable" style="">{{category.CategoryName}}</h4>
                        </div>
                    </div>
                    <div class="row portlet-tr" ng-repeat="concept in category.concepts">

                        <div class="concept-lable" ng-if="concept.ValueTypeId !=3 && concept.ValueTypeId !=12 && concept.ValueTypeId != 8" ng-show="concept.Result">
                            <span class="col-sm-3 lefcol1 4x">{{concept.ConceptName}}</span>
                            <span class="col-sm-9 lefcol2"style="word-wrap: break-word;">{{concept.Result}}</span>
                        </div>
                        <div class="concept-lable" ng-if="concept.ValueTypeId == 12 || concept.ValueTypeId == 8" ng-show="concept.Result">
                            <span class="col-sm-3 lefcol1 4x">{{concept.ConceptName}}</span>
                            <span class="col-sm-9 lefcol2"style="word-wrap: break-word;" ng-bind-html="concept.Result"></span>
                        </div>
                        <div class="concept-lable" ng-if="concept.ValueTypeId ==3 && concept.IsMultiple == false" ng-show="concept.Result">
                            <span class="col-sm-3 lefcol1 5x">{{concept.ConceptName}}</span>
                            <span class="col-sm-9 lefcol2">{{concept.Result}}<span ng-if="concept.Comments"> - {{concept.Comments}}</span></td>
                        </div>
                        <div class="concept-lable" ng-if="concept.ValueTypeId ==3 && concept.IsMultiple == true" ng-show="concept.Terms && concept.Terms.length > 0">
                            <span class="col-sm-3 lefcol1 6x">{{concept.ConceptName}}</span>
                            <span class="col-sm-9 lefcol2">
                                <span ng-repeat="term in concept.Terms">
                                    {{term.TermName}}
                                    <span ng-if="term.Comments"> - {{term.Comments}}</span>
                                    <span ng-if="$index != concept.Terms.length-1">,</span>
                                </span>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div> 
    </div>
</script>
