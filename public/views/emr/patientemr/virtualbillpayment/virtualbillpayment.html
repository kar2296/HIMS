<emrpatientbanner patientid="currentcontext.pid" encounterid="currentcontext.eid">
</emrpatientbanner>
<div class="row">
    <div class="col-sm-12">
        <div class="col-xs-12 col-sm-5 col-lg-8">
            <div class="col-xs-6 col-sm-6 col-lg-6">
                <div class="datepicker">
                    <input type="text" class="form-control cwidth" ng-change="getPendingBills()"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="orderDatePopup = { opened: true }"
                        is-open="orderDatePopup.opened" ng-model="currentfilter.BillDate">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </div>
            <div class="col-xs-6 col-sm-6 col-lg-6">
                <ui-select ng-model="currentfilter.VirtualOrderStatusId" ng-change="getPendingBills()"
                    class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length > 20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.VirtualOrderStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </div>
    <div class="col-12 col-sm-8 col-lg-5">
        <ul class="list-group">
            <div class="bhoechie-tab-content card" ng-repeat="item in PendingBills">
                <div class="col-md-12 col-sm-12">
                    <div class="col-sm-2">
                        <label class="col-sm-12 control-label0" translate="Bill #"></label>
                        <div class="col-sm-12">
                            {{item.BillNumber}}
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <label class="col-sm-12 control-label0" translate="Bill Date"></label>
                        <div class="col-sm-12">
                            <displaydate datetime-val="item.BillDateTime"></displaydate>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <label class="col-sm-12 control-label0" translate="Service Type"></label>
                        <div class="col-sm-12">
                            {{item.ConsultancyType.Description}}
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <label class="col-sm-12 control-label0" translate="Doctor Name"></label>
                        <div class="col-sm-12">
                            {{item.DoctorName}}
                        </div>
                    </div>
                    <div class="col-sm-1">
                        <a ng-click="viewinfo(item)">View</a>
                        <a ng-click="paymentcollect(item)">Payment</a>
                    </div>
                    <!-- <div class="col-xs-6 col-sm-2">
                        <h5 class="orderno">{{item.BillNumber}}</h5>
                        <h6 class="orderdate">
                            <displaydate datetime-val="item.BillDateTime">
                            </displaydate>
                        </h6>
                    </div>
                    <div class="col-xs-6 col-sm-4">
                        <h5 class="highlight">{{item.ConsultancyType.Description}}<span
                                style="font-weight: 600;color: #164360;">{{item.DoctorName}}</span>
                        </h5>
                        <h6 class="categoryname">{{item.VirtualBillStatus.Description}}</h6>
                    </div>
                    <div class="col-xs-6 col-sm-2">
                        <div class="viewbuttom" ng-click="viewinfo(item)">
                            <a>View</a>
                            <a>Payment</a>
                        </div>
                    </div> -->
                </div>
            </div>
        </ul>
    </div>
</div>
