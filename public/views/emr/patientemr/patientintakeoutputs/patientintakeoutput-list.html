<style>
.view-btn-text {
    color : black;
}
 #chart-io
{
    width : 90%;
    height: 500px;
}
.prvnew-color12 {
    background-color: #C51162!important;
}
@media (min-height: 637px) and (min-width: 1200px){
    .ui-grid-viewport {
    height: 390px !important;
    min-height: 430px;
}}
    @media (min-height: 675px) and (min-width: 1360px){
    .ui-grid-viewport {
    height: 440px;
    min-height: 465px;
}}
@media (device-height:100vh) and (device-width:100vw){
    .ui-grid-viewport{
        min-height: 560px;
    }
}
</style>
<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-4 col-md-4 col-lg-4 smmg9">
         <h4 class="page-header mt0" translate="patientemr.patientintakeoutput-list.pagetitle.lbl"></h4>
        </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <button class="btn res-color14 btn-xs " ng-click="chartview()">
                      <i class="fa fa-bar-chart" aria-hidden="true"></i>&nbsp;&nbsp;<span  translate="patientemr.patientintakeoutput-list.chartview.lbl"></span>
         </button>
         <button class="btn  prvnew-color12 btn-xs " ng-click="listview()">
                      <i class="fa fa-list-ul" aria-hidden="true"></i>&nbsp;&nbsp;<span translate="patientemr.patientintakeoutput-list.listview.lbl"></span>
         </button>
        </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
                <span ng-click="doctor_dashboard()">

                        <img src="app/img/main/download.png" class="img-responsive icon_home"  alt="home" uib-tooltip=" Doctor Dashboard " tooltip-placement="bottom">

                    </span>
                <span ng-click="patient_dashboard()">
                        <!-- <i class="bedicon pull-right" uib-tooltip="Bed Management " tooltip-placement="bottom"></i> -->

                            <img src="app/img/main/patdash.png" class="img-responsive icon_emrboard"  alt="home" uib-tooltip="Patient Dashboard" tooltip-placement="bottom">

                    </span>
            <button class="btn bt-color3 btn-xs pull-right btn-filter" ng-click="openAdvancedFilter()" uib-tooltip="{{ '  clinicalmaster.serviceitem-list.filter-tooltip.lbl' | translate }}"
                tooltip-placement="bottom"><i class="fas fa-search" aria-hidden="true"></i>&nbsp;&nbsp; <span translate="clinicalmaster.serviceitem-list.filter.lbl"></span>                </button>
                <!--<button class="btn btn-success  btn-xs pull-right" ng-click="review()">
                      <i class="fa fa-check" aria-hidden="true"></i>&nbsp;&nbsp;<strong class="btn-fontsize" translate="patientemr.patientintakeoutput-list.review.lbl"></strong></button>-->
                <button class="btn-add" ng-click="addNew()" uib-tooltip="{{ 'patientemr.patientintakeoutput-list.addnew-tooltip.lbl' | translate }}"
                    tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                    </button>

        </div>

    </div>
</div>

<div class="container-fluid" ng-show="canShowListArea()">
    <div ui-grid="vm.gridConfig" class="table-uigrid" style="height: 478px !important"></div>
    <div class="fooder-bgs">
        <div class="col-sm-2">
            <button class="text-white btn prv-color12 btn-sm pull-left " ng-click="dashboard()"><i class="fa fa-tachometer" aria-hidden="true"></i>&nbsp;&nbsp;<strong class="btn-fontsize ng-scope" translate="patientemr.mock.emrdashboard.lbl"></strong></button>
        </div>
        <div class="col-sm-10">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>

<div ng-show="canShowChartArea()">
    <div id="chart-io" set-form-height reduce-height="-20"></div>
     <div class="fooder-bgs">
         <div class="col-sm-2">
                <button class="text-white btn prv-color12 btn-sm pull-left " ng-click="dashboard()"><i class="fa fa-tachometer" aria-hidden="true"></i>&nbsp;&nbsp;<strong class="btn-fontsize ng-scope" translate="patientemr.mock.emrdashboard.lbl"></strong></button>
            </div>
            <div class="col-sm-10">
        </div>
        </div>
</div>
