<style>
  .col-sm-12.popover-title {
    margin-bottom: 2px !important;
    background: #0073bc !important;
    color: #fff;
    border-top-left-radius: 4px;
    border-top-right-radius: 4px;
}
.modal-content {
    width: 183%;
    margin-top: 50%;
    height: 43vh;
}
.form-group {
    margin: 3px !important;
    border-bottom: unset !important;
    margin-top: 76px !important;
}
.mt0 {
    margin-top: 5px !important;
    color: white !important;
}
</style>
<div class="popover-inner">
    <div class="col-sm-12 popover-title">
        <div class="col-sm-10">
    <h3 class="mt0">
    <strong>Add comment</strong>
</h3>
</div>
<div class="col-sm-2">
    <button id="btn-fechar" class="draftbutton" ng-click="cancelCallback()">X</button>
</h3>
</div>
    </div>
    <div class="popover-content">
    <div class="form-group">
            <label class="col-sm-4 control-label" for="termcomments" translate="patientemr.consultation.termcomments.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentcontext.termcommentid" name="termcomments" ng-change="termCommentsChange($select.selected)">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in currentcontext.termcomments | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <p>
            <textarea name="textarea4" rows="3" ng-model="currentcontext.comments" style="width:98%;" class="notes-textarea"></textarea>
            <br>        	
           
        </p>
    </div>
</div>    
<div class="fooder-bgs">
    <div class="pull-right">
        <button id="btn-fechar" class="draftbutton" ng-click="saveItem()">Save</button>&nbsp;&nbsp;
       
    </div>
</div>
