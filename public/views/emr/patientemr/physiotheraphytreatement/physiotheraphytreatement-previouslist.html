<link href="app/css/emr.css" rel="stylesheet">
<div class="row">
    <div class="col-sm-4">
        <div class="col-sm-8 col-md-8 col-lg-8">
            <input type="text" class="form-control" name="from" ng-change="getList()" ng-date-object
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="fromPopup = { opened: true }" is-open="fromPopup.opened" ng-model="currentfilter.From">
        </div>
    </div>
    <div class="col-sm-4">
        <div class="col-sm-8 col-md-8 col-lg-8 custom_align">
            <input type="text" class="form-control" name="to" ng-change="getList()" ng-date-object
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="toPopup = { opened: true }" is-open="toPopup.opened" ng-model="currentfilter.To">
        </div>
    </div>
    <div class="col-sm-3">
        <ui-select ng-model="currentfilter.TreatementModalityId" ng-change="getList()">
            <ui-select-match>
                {{$select.selected.Text | limitTo : 20 : 0}}
                <span ng-if="$select.selected.Text.length>20">...</span>
            </ui-select-match>
            <ui-select-choices
                repeat="lookupitem.Id as lookupitem in lookup.TreatementModality | filter: { Text: $select.search }">
                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
            </ui-select-choices>
        </ui-select>
        <!-- <ui-select ng-model="currentfilter.TreatementModalityId" ng-change="getList()">
            <ui-select-match>
                {{$select.selected.Text | limitTo : 20 : 0}}
                <span ng-if="$select.selected.Text.length>20">...</span>
            </ui-select-match>
            <ui-select-choices
                repeat="lookupitem.Id as lookupitem in lookup.TreatementModality | filter: { Text: $select.search }">
                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
            </ui-select-choices>
        </ui-select> -->
    </div>
    <button class="btn-add" ng-click="addNew()"
        uib-tooltip="{{ 'patientemr.physiotheraphy.addtreatementmod.lbl' | translate }}" tooltip-placement="bottom">
        <i class="fa fa-plus" aria-hidden="true"></i>
        <!--  -->
    </button>
</div>
<div class="fooder-bgs">
    <div class="row">
        <custom-table config="vm.gridConfig"></custom-table>
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
