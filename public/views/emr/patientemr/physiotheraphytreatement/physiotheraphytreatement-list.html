<style>
    .side_popup {

    @media (min-height: 637px) and (min-width: 1200px) {

    div#assettabs ul {

    div#assettabs {

    .nav-tabs>li.active>a,

        background: #dcdcdc70 !important;

    }

    .nav-tabs>li>a {
        background: white !important;
    }

    ul.nav.nav-tabs {
        background: white !important;
        border: unset !important;
        margin-bottom: 4px;
    }

    .nav-tabs>li.active>a,

        color: black !important;
        /* border-bottom-color: #e81841; */
        border-top: 2px solid #272a75;
        border-left: 2px solid white;
        border-right: 2px solid white;
        border-top-right-radius: 18px;
        border-top-left-radius: 18px;
    }

    .nav-tabs>li>a {
        background: white !important;
        text-align: center;
        padding: 10px !important;
        border-color: white !important;
    }

    div#assettabs ul li a:before {
        color: darkgreen;
        font: normal normal normal 14px/1 FontAwesome;
        font-size: 25px !important;
        margin-right: 10px;
        position: relative;
        top: 5px;
    }

    .nav-tabs>li.active>a:before,

    }

    div#tablebox h4.col-sm-6.mg0.ng-scope {

    }

    div#tablebox .prv-color12 {
        background-color: #006400c7 !important;
        padding: 5px 25px;
        border-radius: 6px !important;
    }

    .logoimgg {
        height: 150px;
        width: 150px;
        border-radius: 50%;
        background: #fff;
        border: 10px solid #d4e4e7;
        box-shadow: 0px 0px 2px 6px #0064005c;
    }

    .aside-collapsed .fooder-bg {
        width: 100% !important;
        left: 0% !important;
        margin-top: 30px;
        background: #d1e3e6 !important;
    }

    h4.mg0.ng-scope {
        padding: 10px;
    }

    footer.ng-scope {
        z-index: 9999 !important;
    }

    .nav>li.disabled>a {

        height: 49px !important;
    }

    #findassets {
        height: 40px;
        width: 80% !important;
        border-radius: 10px;

    }

    .nav-tabs>li.active>a,
    .nav-tabs>li.active>a:hover,
    .nav-tabs>li.active>a:focus {
        color: #424141 !important;
        background-color: #9e9e9e3d !important;
        height: 37px;
    }

    .nav-tabs>li>a {
        padding: 4px 15px;
        color: #424141 !important;
    }

    #patient_res .dr-name {
        font-weight: 600;
        color: #fff;
    }

    .btn:active,
    .btn.active {
        font-variant: small-caps;
        font-size: 12px;
        border: 1px solid #000;
        color: #424141 !important;
        background-color: #9e9e9e3d !important;
        height: 36px;
        border-left: 2px solid #4583d0 !important;
        border-right: 2px solid #3F51B5 !important;
        border-top-right-radius: 8px !important;
        border-top-left-radius: 8px !important;
        border-top: 1px solid blue !important;
        border-bottom: 1px solid white !important;
        border-bottom-color: #fdfdfd !important;
        border-bottom: unset;
    }
</style>

<div class="col-sm-12">

    <div class="col-sm-3">
        <label class="btn btn-secondary top-option" ng-repeat="option in options" ng-click="getList()"
            ng-model="currentcontext.option" uib-btn-radio="option.key">{{option.name}}</label>
        <div ui-view></div>
        <!-- <a class="pull-left" ng-click="Addtreatementmodality()" href="">Add Treatement Modality</a> -->
    </div>
    <div class="col-sm-9">
        <div class="col-sm-4">
            <div class="col-sm-8 col-md-8 col-lg-8">
                <input type="text" class="form-control" name="from" ng-change="getList(tab)" ng-date-object
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="fromPopup = { opened: true }"
                    is-open="fromPopup.opened" ng-model="currentfilter.From">
            </div>
        </div>
        <div class="col-sm-4">
            <div class="col-sm-8 col-md-8 col-lg-8 custom_align">
                <input type="text" class="form-control" name="to" ng-change="getList()" ng-date-object
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="toPopup = { opened: true }"
                    is-open="toPopup.opened" ng-model="currentfilter.To">
            </div>
        </div>
        <div class="col-sm-3">
            <ui-select ng-model="currentfilter.TreatementModalityId" ng-change="getList()">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.TreatementModality | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
        <button class="btn-add" ng-click="addNew()"
            uib-tooltip="{{ 'patientemr.physiotheraphy.addtreatementmod.lbl' | translate }}" tooltip-placement="bottom">
            <i class="fa fa-plus" aria-hidden="true"></i>
            <!--  -->
        </button>
    </div>
</div>
<custom-table config="vm.gridConfig"></custom-table>
<div class="container-fluid single-filter">

    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
                items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
