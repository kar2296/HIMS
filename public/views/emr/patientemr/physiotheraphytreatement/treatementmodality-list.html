<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="patientemr.physiotheraphy.addtreatementmod.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <button type="button" tabindex="-1" class="btn-add" ng-click="addNew()"
                uib-tooltip="{{ 'patientemr.physiotheraphy.pagetitle.lbl' | translate}}" tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</div>

<div class="modal-header custom-modal-header" ng-if="!currentcontext.ismodal">
    <div class="col-sm-12">
        <div class="col-sm-8">
            <h4 class="modal-title custom-modal-title" translate="patientemr.physiotheraphy.addtreatementmod.lbl"></h4>
        </div>
        <div class="col-sm-4">
            <div class="">
                <button type="button" tabindex="-1" class="btn-add" style="margin: 0px -11px !important"
                    ng-click="addNew()" uib-tooltip="{{ 'patientemr.physiotheraphy.pagetitle.lbl' | translate}}"
                    tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </div>
</div>
<div class="tablemain">
    <table class="table table-hover table-responsive table-bordered">
        <thead class="bg-subhead">
            <tr>
                <th class="col-sm-1"><span translate="patientemr.physiotheraphy.sno.lbl"></span></th>
                <th class="col-sm-2"><span translate="patientemr.physiotheraphy.modalityname.lbl"></span><span
                        class="mandatory-asterix">*</span></th>
                <th class="col-sm-1"><span translate="patientemr.physiotheraphy.status.lbl"></span></th>
                <th class="col-sm-1"><span translate="common.actions_col.lbl"></span></th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="item in vm.items | filter:{Status:1}">

                <td>
                    <span> {{ item.SNo }}</span>
                </td>
                <td>
                    <input type="text" class="form-control" uppercase ng-model="item.ModalityName" placeholder="">
                </td>
                <td align="center">
                    <input type="checkbox" class="custom-checkbox" ng-model="item.IsActive">
                </td>
                <td align="center">
                    <button class="drhms-edit-button" ng-click="deleteItem($index,item)">
                        <img  src="assets/svg/delete.svg" alt=""></button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
<div class="col-sm-12">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="row">
    <div class="pull-right">
        <button type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="Save()"></button>

    </div>
</div>
