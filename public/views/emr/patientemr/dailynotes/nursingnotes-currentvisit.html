<div class="row">
    <div class="col-sm-3" ng-hide="currentcontext.option=='currentvisits'">
        <label class="col-sm-12 control-label" translate="patientemr.patientvital-list.filter_from.lbl"></label>
        <div class="col-sm-12">
            <input type="text" class="form-control" name="from" ng-change="getList(tab)" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                placeholder="{{datePickerOptions.placeholder}}" ng-click="fromPopup = { opened: true }" is-open="fromPopup.opened"
                ng-model="currentfilter.From">
        </div>
    </div>
    <div class="col-sm-3" ng-hide="currentcontext.option=='currentvisits'">
        <label class="col-sm-12 control-label" translate="patientemr.patientvital-list.filter_to.lbl"></label>
        <div class="col-sm-12">
            <input type="text" class="form-control" name="to" ng-change="getList()" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                placeholder="{{datePickerOptions.placeholder}}" ng-click="toPopup = { opened: true }" is-open="toPopup.opened"
                ng-model="currentfilter.To">
        </div>
    </div>
    <div class="col-sm-6">
        <button class="emr-btn-add" ng-click="addNew()" uib-tooltip="Add Notes" tooltip-placement="bottom">
            <i class="fa fa-plus" aria-hidden="true"></i>
        </button>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
    <div class="">
        <button class="pull-right" ng-click="print()">Print</button>
    </div>
</div>
