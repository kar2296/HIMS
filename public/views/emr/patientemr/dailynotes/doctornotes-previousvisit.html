<div class="row">
    <style>
        .nameinfo {
            font-size: 13px;
            font-weight: normal;
            color: #515253;
        }

        .textinfo {
            font-size: 15px;
            color: #515253;
        }

        .contactinfo {
            font-size: 15px;
            color: #821e1e;
        }

        .block {
            white-space: normal;
            text-overflow: ellipsis;
            overflow: hidden;
        }

        .form-group {
            margin-bottom: 7px !important;
        }

        .col-sm-2 {
            width: 16.666667%;
        }

        .col-sm-1 {
            width: 8.333333%;
        }

        .col-sm-7 {
            width: 54.333333%;
        }

        .table-uigrid.ui-grid .ui-grid-row {
            min-height: 27px;
            min-width: 100%;
            max-width: 100%;
        }

        .grid1489396352676 .ui-grid-coluiGrid-00AE {
            min-width: 100% !important;
            max-width: 100% !important;
        }

        .onoffswitch {
            position: relative;
            width: 65px;
            height: 21px;
            padding-top: 0px;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .onoffswitch-checkbox {
            display: none;
        }

        .onoffswitch-label {
            display: block;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid #999999;
            border-radius: 20px;
        }

        .onoffswitch-inner {
            display: block;
            width: 200%;
            margin-left: -100%;
            transition: margin 0.3s ease-in 0s;
        }

        .onoffswitch-inner:before,
        .onoffswitch-inner:after {
            display: block;
            float: left;
            width: 50%;
            height: 20px;
            padding: 0;
            line-height: 21px;
            font-size: 14px;
            color: white;
            font-family: 'Poppins', sans-serif;
            ;
            font-weight: 700;
            box-sizing: border-box;
        }

        .onoffswitch-inner:before {
            content: "ON";
            padding-left: 10px;
            background-color: #34A7C1;
            color: #FFFFFF;
        }

        .onoffswitch-inner:after {
            content: "OFF";
            padding-right: 6px;
            background-color: #EEEEEE;
            color: #999999;
            text-align: right;
        }

        label {
            display: inline-block;
            max-width: 80%;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .margin-left-12 {
            margin-left: 50px !important;
            height: 34px;
            padding: 15px;
        }

        .onoffswitch-switch {
            display: block;
            width: 14px;
            height: 15px;
            margin: 5px;
            background: #FFFFFF;
            position: absolute;
            top: 0;
            bottom: 0;
            right: 43px;
            border: 2px solid #999999;
            border-radius: 20px;
            transition: all 0.3s ease-in 0s;
        }

        .onoffswitch-checkbox:checked+.onoffswitch-label .onoffswitch-inner {
            margin-left: 0;
        }

        .onoffswitch-checkbox:checked+.onoffswitch-label .onoffswitch-switch {
            right: 10px;
        }

        .onoffswitch input[type="checkbox"] {
            display: none;
        }

        pre {
            display: inline-table;
            padding: 0px;
            margin: 0 0 0px;
            font-size: 13px;
            line-height: 1.52857143;
            word-break: break-all;
            word-wrap: break-word;
            color: #0a35ec;
            background-color: #bf78ae;
            border: 1px solid #cccccc;
            border-radius: 10px;
        }

        .switch_align {
            text-align: center;
            margin: 0px auto;
        }

        .text-muted.text-small {
            padding: 5px;
        }

        .icon_emrboard {
            width: 7%;
            float: right;
            margin-right: 1%;
            /* border: 1px solid #056def; */
        }

        .icon_home {
            width: 7%;
            float: right;
        }
    </style>

    <div class="row">
        <div class="col-sm-4">
            <label class="col-sm-4 col-md-4 col-lg-4 control-label filter-lbl" translate="patientemr.patientvital-list.filter_from.lbl"></label>
            <div class="col-sm-8 col-md-8 col-lg-8">
                <input type="text" class="form-control" name="from" ng-change="getList()" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="fromPopup = { opened: true }" is-open="fromPopup.opened"
                    ng-model="currentfilter.From">
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-4 col-md-4 col-lg-4 control-label filter-lbl" translate="patientemr.patientvital-list.filter_to.lbl"></label>
            <div class="col-sm-8 col-md-8 col-lg-8 custom_align">
                <input type="text" class="form-control" name="to" ng-change="getList()" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="toPopup = { opened: true }" is-open="toPopup.opened"
                    ng-model="currentfilter.To">
            </div>
        </div>
        <div class="pull-right">
            <button type="button" tabindex="-1" class="drhms-billing-btn drhms-add-btn" ng-click="addNew()" uib-tooltip="Add Notes" tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
            </button>
        </div>
    </div>
    <div class="row">
        <custom-table config="vm.gridConfig"></custom-table>
    </div>
    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
        <div class="" ng-show="vm.gridConfig.data.length>0">
            <button class="draftbutton pull-right" ng-click="print()">Print</button>
        </div>
    </div>
