<style>
    .nav > li.disabled > a:hover,
    .nav > li.disabled > a:focus {
        color: #000000 !important;
        text-decoration: none;
        background-color: #3c5a76;
        cursor: not-allowed;
    }
    
    .nav-tabs > li.active > a,
    .nav-tabs > li.active > a:hover {
        color: #000000 !important;
        border-bottom-color: #fff;
        background-color: #3c5a76 !important;
    }
    .nav-tabs > li > a {
    padding: 4px 15px;
}
.fontctrl {color: #fff;}
</style>
<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-6 col-md-7 col-lg-8">
            <h4 class="page-header mt0" translate="aeregistration.pagetitle.lbl"></h4>
        </div>
        <div class="col-sm-6 col-md-5 col-lg-4">
       <!--<button class="btn-add" ng-click="addNewFull()">
        <i class="fa fa-plus" aria-hidden="true"></i><strong class="btn-fontsize" translate="registration.fullregistration.buttonfullreg.lbl"></strong>
      </button>-->

      <button class="btn bt-color1 btn-xs pull-right" ng-click="addNewQuick()">
        <i class="fa fa-tablet" aria-hidden="true"></i>&nbsp;&nbsp;<strong class="btn-fontsize"  translate="registration.quickregistration.buttonquickreg.lbl"></strong>
     </button>
    
       <button class="btn bt-color3 btn-xs pull-right" ng-click="pickPatient()">
        <i class="fas fa-search" aria-hidden="true"></i>&nbsp;&nbsp;<strong class="btn-fontsize" translate="registration.fullregistration.action-pickpatient.lbl"></strong>
        </button>
    </div>
    </div>
</div>
<patientbanner patientid="currentcontext.PatientId"></patientbanner>
<div class="col-sm-12 fullreg-profiles">
    <div class="col-sm-8  fullreg-profiles">
        <div class="col-sm-4">
            <span translate="admissions.admissionon.lbl"></span> : <span>{{Encounter.AdmissionDate|date:'dd-MMM-yyyy'}}&nbsp;{{Encounter.AdmissionDate|date:'HH:mm'}}</span>
        </div>
        <div class="col-sm-4">
            <span translate="admissions.admissionno.lbl"></span> : <span>{{Encounter.VisitIdentifier}}</span>
        </div>
        <div class="col-sm-4">
            <span translate="admissions.admissionstatus.lbl"></span> : <span>{{Encounter.AdmissionStatus.Description}} </span>
        </div>
    </div>
    <div class="col-sm-4">
        <span translate="admissions.createdby.lbl"></span> : <span>{{Encounter.Created.Title.Description}}&nbsp;{{Encounter.Created.FirstName}}&nbsp;{{Encounter.Created.LastName}}</span>
    </div>
</div>
<div class="row">
    <div class="col-sm-12">
        <uib-tabset active="active">
            <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)" disable="tab.canDisable">
            </uib-tab>
        </uib-tabset>

        <div ui-view></div>
    </div>
</div>
