<div class="row page-header" id="assets">
    <h4 class="col-sm-6 mt0 active" translate="Emergency Patient List"></h4>
    <div class="col-sm-6">
        <span class="drhms-billing-btn drhms-outstandingbill-btn" ng-click="doctor_dashboard()" uib-tooltip="Dashboard"
            tooltip-placement="bottom">
            <i class="fas fa-th-large" aria-hidden="true"></i>
        </span>
    </div>
</div>
<div id="receipt_tab">
    <div class="row">
        <div class="col-sm-12">
            <uib-tabset active="active" id="assettabs">
                <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)"
                    disable="tab.canDisable">
                </uib-tab>
            </uib-tabset>
            <div ui-view class="tabview"></div>
        </div>
    </div>
</div>
