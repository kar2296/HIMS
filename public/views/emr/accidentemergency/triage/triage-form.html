<style>
 #casualtyheight>.aside-collapsed,
    .fooder-bg {
        position: static !important;
        width: 100%!important;
        left: 0 !important;
    }

    .modal-title.panel-body {
        overflow: inherit;
    }
</style>
<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="triage.form_title.lbl"></h4>
</div>
<div class="row" id="casualtyheight">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot">
                <div class="panel panel-default">
                    <div class="panel-body form-panel bg-pattern ">
                        <div class="col-sm-12">

                            <!-- leftpanel -->

                            <div class="col-sm-12 well" ng-if="FormType==1">
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" translate="triage.triagelevel.lbl"></label>
                                    <div class="col-sm-7">
                                        <ui-select ng-model="triagelevel">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.triagelevel | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="needtoresusccitate" translate="triage.needtoresusccitate.lbl"></label>
                                    <div class="col-sm-7">
                                        <radiogroupcontrol itemid="" items="lookup.YesNo"></radiogroupcontrol>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="equipments" translate="triage.equipments.lbl"></label>
                                    <div class="col-sm-7">
                                        <radiogroupcontrol itemid="" items="lookup.YesNo"></radiogroupcontrol>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="equipments1" translate="triage.equipments1.lbl"></label>
                                    <div class="col-sm-7">
                                        <radiogroupcontrol itemid="" items="lookup.YesNo"></radiogroupcontrol>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="isotherservice" translate="triage.isotherservice.lbl"></label>
                                    <div class="col-sm-7">
                                        <radiogroupcontrol itemid="" items="lookup.YesNo"></radiogroupcontrol>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="isrequiredadmission" translate="triage.isrequiredadmission.lbl"></label>
                                    <div class="col-sm-7">
                                        <radiogroupcontrol itemid="" items="lookup.YesNo"></radiogroupcontrol>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="isrequiredsurgery" translate="triage.isrequiredsurgery.lbl"></label>
                                    <div class="col-sm-7">
                                        <radiogroupcontrol itemid="" items="lookup.YesNo"></radiogroupcontrol>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="comments" translate="triage.comments.lbl"></label>
                                    <div class="col-sm-7">
                                        <commentscontrol comments="item.Comments"></commentscontrol>
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-12 well" ng-if="FormType==2">
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="isrequiredsurgery" translate="triage.comascalee.lbl"></label>
                                    <div class="col-sm-7">
                                        <radiogroupcontrol itemid="ComaScaleE" items="lookup.ClinicalStatus"></radiogroupcontrol>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="isrequiredsurgery" translate="triage.comascalev.lbl"></label>
                                    <div class="col-sm-7">
                                        <radiogroupcontrol itemid="ComaScaleV" items="lookup.ClinicalStatus"></radiogroupcontrol>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="isrequiredsurgery" translate="triage.comascalem.lbl"></label>
                                    <div class="col-sm-7">
                                        <radiogroupcontrol itemid="ComaScaleM" items="lookup.ClinicalStatus"></radiogroupcontrol>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="fooder-bgs">
                <div class="row ">
                    <div class="col-sm-12">
                        <div class="pull-right">
                            <button id="btnSave" type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
                            <!--<button id="btnSaveApprove" type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl"
                                ng-click="saveAndApprove()"></button>
                            <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>-->
                            <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
