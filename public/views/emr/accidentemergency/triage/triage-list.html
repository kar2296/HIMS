<style>
    .td-action {
        text-align: right !important;
    }

    .lnk-portlet-action {
        margin-left: 10px !important;
        text-decoration: none;
    }

    .lnk-portlet-header-action {
        margin-left: 15px !important;
        color: white;
    }

    .portlet-panel-heading {
        height: 25px !important;
        padding: 2px 10px !important;
    }

    .portlet-tr td {
        padding-top: 0px !important;
        padding-bottom: 0px !important;
    }

    .portlet-panel-body {
        overflow: auto !important;
        overflow-y: scroll;
        min-height: 200px;
        margin-bottom: 8px;
        margin-top: 8px;
        padding: 1px 6px !important;
    }

    .panel {
        margin-bottom: 10px;
        box-shadow: 1px -1px 12px -3px rgba(109, 98, 98, 0.5);
    }

    .table>tbody>tr>td,
    .table>tfoot>tr>td {
        border-bottom: 2px solid #fff !important;
        color: #5b5b60 !important;
        border-top: none;
    }

    .table>tbody>tr>td {
        padding: 0px 5px !important;
        border-bottom: 1px solid #e2e2e4;
        line-height: 1.228571;
    }

    .table td {
        background: #f3f0f1;
        filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#f3f0f1', endColorstr='#eeeeee', GradientType=0);
        padding-top: 3px !important;
        padding-bottom: 3px !important;
        position: relative;
    }

    

    .table td:last-child {
        border-top-right-radius: 9px;
        border-bottom-right-radius: 10px;
        border-right: none;
    }

    .table td:last-child:before {
        width: 0px;
    }

    .table td:before {
        content: '';
        width: 1px;
        background: #e2e2e4;
        right: 0;
        top: 5px;
        bottom: 5px;
        position: absolute;
    }

    .btn-rounded {
        width: 17px;
        height: 17px;
        text-align: center;
        padding: 0px 2px;
        font-size: 12px;
        line-height: 1.428571429;
        border-radius: 3px;
    }

    .btn-circle {
        text-align: center;
        padding: 1px 2px;
        font-size: 12px;
        line-height: 1.428571429;
        padding: 1px 2px;
        color: #ccc !important;
        background-color: #000000 !important;
    }

    .dashboard-div {
        margin-left: 0px;
        margin-right: 0px;
        margin-bottom: 0px;
        background-image: url(app/img/bg-body.jpg);
        background-repeat: repeat;
        overflow: auto;
        padding-top: 7px;
        height: 550px;
    }

    .panel-wrapper .panel {
        height: 150px;
    }

    .panel-label {
        padding: 15px;
    }
</style>
<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-6">
            <h4 class="mt0" translate="triage.pagetitle.lbl"></h4>
        </div>
    </div>
</div>
<div class=" dashboard-div">
    <div class="col-md-12">
        <div class="col-sm-6">
            <div class="panel-info">
                <div class="panel-heading portlet-panel-heading">
                    <strong translate="triage.vitals.lbl"></strong>
                    <a ng-click="handleEvents('list')" class="pull-right lnk-portlet-header-action" uib-tooltip="{{ 'common.moredetailsaction.lbl' | translate }}"
                        tooltip-placement="bottom"><i class="fa fa-info btn-circle" aria-hidden="true"></i></a>
                    <a ng-click="handleEvents('add')" class="pull-right lnk-portlet-header-action" uib-tooltip="{{ 'common.addnewaction.lbl' | translate }}"
                        tooltip-placement="bottom"><i class="fa fa-plus btn-circle" aria-hidden="true"></i></a>
                    <a ng-click="handleEvents('chart')" class="pull-right lnk-portlet-header-action" uib-tooltip="{{ 'patientemr.patientdashboard.vitalchart.lbl' | translate }}"
                        tooltip-placement="bottom"><i class="fa fa-line-chart btn-circle" aria-hidden="true"></i></a>
                </div>
                <div class="panel-wrapper">
                    <div class="panel panel-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-condensed">
                                <tbody>
                                    <tr class="portlet-tr" ng-repeat="item in Vitals | limitTo: currentcontext.recordcount">
                                        <td>
                                            <span>
                                                <b class="text">{{item.PerformedDate|date:'dd:MM:yyyy'}}{{item.PerformedDate|date:'HH:mm'}}</b>:&nbsp;&nbsp;&nbsp;<span class="vname">{{item.VitalName}}</span>&nbsp;
                                            - <span class="value">{{item.VitalValue}}</span>&nbsp;&nbsp;<span class="unit">{{item.UOM}}</span>
                                            </span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6">
            <div class="panel-info">
                <div class="panel-heading portlet-panel-heading">
                    <strong translate="triage.emergencyserviceindex.lbl"></strong>
                    <a ng-click="" class="pull-right lnk-portlet-header-action" uib-tooltip="{{ 'common.moredetailsaction.lbl' | translate }}"
                        tooltip-placement="bottom"><i class="fa fa-info btn-circle" aria-hidden="true"></i></a>
                    <a ng-click="service(1)" class="pull-right lnk-portlet-header-action" uib-tooltip="{{ 'common.addnewaction.lbl' | translate }}"
                        tooltip-placement="bottom"><i class="fa fa-plus btn-circle" aria-hidden="true"></i></a>
                </div>
                <div class="panel-wrapper">
                    <div class="panel panel-body form-panel">
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-12">
        <div class="col-sm-6">
            <div class="panel-info">
                <div class="panel-heading portlet-panel-heading">
                    <strong translate="triage.conditions.lbl"></strong>
                    <a ng-click="" class="pull-right lnk-portlet-header-action" uib-tooltip="{{ 'common.moredetailsaction.lbl' | translate }}"
                        tooltip-placement="top">
            <i class="fa fa-info btn-circle" aria-hidden="true"></i>
        </a>
                    <a ng-click="" class="pull-right lnk-portlet-header-action" uib-tooltip="{{ 'common.addnewaction.lbl' | translate }}" tooltip-placement="top">
            <i class="fa fa-plus btn-circle" aria-hidden="true"></i>
        </a>
                </div>
                <div class="panel-wrapper">
                    <div class="panel panel-body">

                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6">
            <div class="panel-info">
                <div class="panel-heading portlet-panel-heading">
                    <strong translate="triage.glascowcomascale.lbl"></strong>
                    <a ng-click="" class="pull-right lnk-portlet-header-action" uib-tooltip="{{ 'common.moredetailsaction.lbl' | translate }}"
                        tooltip-placement="top">
            <i class="fa fa-info btn-circle" aria-hidden="true"></i>
        </a>
                    <a ng-click="service(2)" class="pull-right lnk-portlet-header-action" uib-tooltip="{{ 'common.addnewaction.lbl' | translate }}" tooltip-placement="top">
            <i class="fa fa-plus btn-circle" aria-hidden="true"></i>
        </a>
                </div>
                <div class="panel-wrapper">
                    <div class="panel panel-body">

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="col-sm-12">
            <div class="col-sm-4 col-md-4">
                <div class="pull-left">
                    <button type="button" class=" text-white btn prv-color12 btn-sm" ng-click="openPreviousAppointment()" translate="patientemr.patientdashboard.pastvisit.lbl"
                        ng-click="openPreviousAppointment()"></button>
                    <button type="button" class="btn btn-info btn-sm" ng-click="prescribe()" translate="patientemr.prescription-form.prescribe-action.lbl"></button>
                    <button type="button" id="btnsubmit" class="draftbutton" translate="patientemr.patientorder-list.clinicalorders.lbl"
                        ng-click="patientorders()"></button>
                </div>
            </div>
            <div class="col-sm-8 col-md-8">
                <div class="pull-right">
                    <button id="btndischarge" type="button" ng-show="canShowDischargeBtn&&Encounter.AdmissionStatusId!==5" class="btn pyr-color10 btn-sm"
                        ng-click="fitfordischarge()" translate="admission.fitdischarge-action.lbl"></button>
                    <button id="btndischarge" type="button" ng-show="canShowDischargeBtn&&Encounter.AdmissionStatusId!==5" class="btn btn-warning  btn-sm"
                        ng-click="clinicalDischarge()" translate="admission.clinicaldischarge.lbl"></button>
                    <button id="btndischarge" type="button" ng-show="canShowDischargeBtn&&Encounter.AdmissionStatusId==5" class="draftbutton"
                        ng-click="patientDischarge()" translate="admission.discharge-action.lbl"></button>
                    <button type="button"  class="draftbutton" ng-click="print()" translate="common.printaction.lbl"></button>
                </div>
            </div>
        </div>
    </div>
</div>
