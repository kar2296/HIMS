<style>
#casualtyheight .well{min-height: 480px;}
</style>
<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-5 col-md-4">
            <h3 class="panel-title" translate="masscasualty.pagetitle.lbl"></h3>
        </div>
    </div>
</div>
<div class="row" id="casualtyheight">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">	
            <div class="formRoot">
                <div class="panel panel-default">
                    <div class="panel-body form-panel bg-pattern ">	
                        <div class="col-sm-12">			
                            
                            <!-- leftpanel -->
                            <div class="col-sm-7">
                                    <div class="col-sm-12 well">
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="" translate="masscasualty.adult.lbl"></label>
                                    <div class="row col-sm-8">
                                        <div class="">
                                          <div class="col-sm-6 form-group">  
                                         <label class="col-sm-5 control-label" for="" translate="masscasualty.male.lbl"></label>
                                         <div class="col-sm-7">
                                         <input type="number" class="form-control" name="" min="0">
                                         </div>
                                          </div>
                                          <div class="col-sm-6 form-group">
                                         <label class="col-sm-5 control-label" for="" translate="masscasualty.female.lbl"></label>
                                         <div class="col-sm-7">
                                         <input type="number" class="form-control" name="" min="0">
                                         </div>
                                          </div>
                                          <div class="col-sm-6 form-group">
                                         <label class="col-sm-5 control-label" for="" translate="masscasualty.unknown.lbl"></label>
                                         <div class="col-sm-7">
                                         <input type="number" class="form-control" name="" min="0">
                                         </div>
                                          </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="" translate="masscasualty.children.lbl"></label>
                                    <div class="row col-sm-8">
                                        <div class="">
                                             <div class="col-sm-6 form-group">
                                         <label class="col-sm-5 control-label" for="" translate="masscasualty.male.lbl"></label>
                                         <div class="col-sm-7">
                                         <input type="number" class="form-control" name="" min="0">
                                         </div>
                                             </div>
                                             <div class="col-sm-6 form-group">
                                         <label class="col-sm-5 control-label" for="" translate="masscasualty.female.lbl"></label>
                                         <div class="col-sm-7 pull-right">
                                         <input type="number" class="form-control" name="" min="0">
                                         </div>
                                             </div>
                                         <div class="col-sm-6 form-group">
                                         <label class="col-sm-5 control-label" for="" translate="masscasualty.unknown.lbl"></label>
                                         <div class="col-sm-7 pull-right">
                                         <input type="number" class="form-control" name="" min="0">
                                         </div>
                                         </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="disaster" translate="masscasualty.disaster.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="disaster" ng-model="" placeholder="">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" translate="masscasualty.modeofarrival.lbl"></label>
                                    <div class="col-sm-8">
                                        <ui-select ng-model="ertype">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Title | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" translate="masscasualty.emergencytype.lbl"></label>
                                    <div class="col-sm-8">
                                        <ui-select ng-model="ertype">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Title | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" translate="masscasualty.locations.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="" ng-model="" placeholder="">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="comments" translate="masscasualty.remarks.lbl"></label>
                                    <div class="col-sm-8">
                                        <commentscontrol comments="item.Comments"></commentscontrol>
                                    </div>
                                </div>
                            </div>
                            </div>
                            <!-- rightpanel -->
                            <div class="col-sm-6">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
                       <div class="fooder-bgs">
                <div class="row ">
                    <div class="col-sm-12">
                        <div class="pull-left">
                            <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()"><i class="fa fa-angle-left" aria-hidden="true" ></i>&nbsp;&nbsp;<span class="btn-fontsize"  translate="common.backaction.lbl"></span></button>

                        </div>
                        <div class="pull-right">
                            <button id="btnSave" type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
                            <button id="btnSaveApprove" type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl"
                                ng-click="saveAndApprove()"></button>
                            <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                            <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                        </div>
                    </div>
                </div>
            </div>
        </form>		
    </div>
</div>
