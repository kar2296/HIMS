<link href="app/css/billing-pharmacy-customs.css" rel="stylesheet">
<style>
    .profile-header {
        min-height: 67px !important;
    }

    .page-header input[type=text] {
        width: 100%;
        height: 23px;
    }

    .text-primary {
        color: #fff;
    }

    .ui-select-bootstrap>.ui-select-choices {
        width: 130%;
        height: auto;
        max-height: 200px;
        overflow-x: hidden;
        margin-top: -1px;
    }

    .input-group[class*="col-"] {
        float: left;
        padding-left: 0px;
        padding-right: 10px;
    }

    element.style {
        height: 290px;
    }

    .bgfoot {
        margin: 6px;
    }

    .footerbar {
        background-image: url(app/img/patterns-bg/paper-fibers.png) !important;
        height: auto;
    }

    .fullreg-profiles {
        min-height: 22px;
        padding-top: 1px;
        background: linear-gradient(to bottom, #ececec 0, #e8e4e4 50%, #cec0cc 100%, #fff 100%);
        border: 1px solid #ccc;
        box-shadow: none;
    }

    .filter-area .btn {
        padding: 3px;
    }

    .mt0 {
        margin-top: 5px !important;
        font-size: 15px;
    }

    .durationtxt {
        width: 50px !important;
        float: left;
        margin-right: 5px;
    }

    .countbg {
        background-color: #fff;
        padding: 0px 7px;
        border: 1px solid #d4c8c8;
        border-radius: 6px;
    }

    fieldset {
        padding-bottom: 0px;
        margin-bottom: 0px;
    }

    .table {
        margin-bottom: 1px;
    }

    .well {
        box-shadow: 4px 2px 13px -7px rgba(0, 0, 0, .75);
        margin-bottom: -8px;
        background-color: rgba(253, 255, 228, 0.75) !important;
    }

    .forpadd span {
        padding: 1px 5px;
    }

    .bgfoot .ui-select-match-text {
        width: 42px;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .paddingright {
        padding-right: 5px;
    }

    .paddingtop {
        padding-top: 8px;
    }

    #opbillingcontrol .panel-body {
        height: 435px !important;
    }

    .page-calendar .b-greensea {
        border-color: #ff902b !important;
    }

    .page-calendar .event-name {
        padding: 1px;
        background: #467cac;
        margin: 2px 0px;
        color: #fff;
        padding-left: 8px;
        font-size: 13px;
        border-left: 3px solid;
        height: 21px;
        text-overflow: ellipsis;
        width: 100%;
        white-space: nowrap;
        overflow: hidden;
    }

    .padding-top1 {
        padding-top: 1px;
    }

    .page-header h4 {
        padding-top: 0px;
        height: 7px;
    }

    .page-calendar1 .b-greensea {
        border-color: #ff902b !important;
    }

    .page-calendar1 .event-name {
        padding: 1px;
        background: #467cac;
        margin: 2px 0px;
        color: #fff;
        padding-left: 0px;
        font-size: 13px;
        border-left: 3px solid;
        height: 21px;
        float: left;
        margin-left: 5px;
        text-overflow: ellipsis;
        width: 100%;
        white-space: nowrap;
        overflow: hidden;
    }

    .page-calendar1 .col-sm-4 {
        padding-left: 3px;
        padding-right: 3px;
    }

    .padding-top1 .col-sm-4 {
        padding-left: 2px;
        padding-right: 2px;
    }

    .toprighttext .dropdown-menu {
        top: -58px !important;
        left: 15px !important;
    }

    .cke_reset {
        min-height: 290px !important;
    }
</style>

<div id="opbillingcontrol">
    <div class="row page-header">
        <h4 class="col-sm-2 mt0" translate="medicalcertificate.fitnesscertificate.pagetitle.lbl"></h4>
    </div>
    <div class="">
        <patientbanner patientid="item.PatientId"></patientbanner>
    </div>
    <div class="row">
        <div class="col-sm-12">
            <form id="item_form" name="item_form" class="form-horizontal" role="form">
                <div class="filter-area row">
                    <div class="col-sm-12">
                        <div class="col-sm-3">

                            <label class="col-sm-4 control-label" translate="admissionrequest.patient.lbl"></label>
                            <div class="col-sm-8">
                                <autosearch itemid="item.PatientId" iteminfo="item.SelectedItem" rowdata="item" config="vm.patientconfig" itemchange="getPatientinfo()"
                                    class="inputsearchlogo"></autosearch>
                            </div>

                        </div>
                        <div class="col-sm-3">

                            <label class="col-sm-4 control-label" for="doctor" translate="billing.opbilling-list.doctor.lbl"></label>
                            <div class="col-sm-8">
                                <autosearch itemid="item.DoctorId" iteminfo="" rowdata="" config="vm.doctorcontrolconfig" ng-disabled="item.isCompleted"
                                    itemchange="doctorChange()" name="'doctor'" candisable="item.isCompleted" isrequired="true"></autosearch>
                            </div>

                        </div>
                        <div class="col-sm-3">

                            <label class="col-sm-4 control-label" for="templatename" translate="medicalcertificate.dischargesummary-form.templatename.lbl"></label>
                            <div class="col-sm-8">
                                <ui-select ng-model="item.NoteTemplateId" name="templatename" ng-disabled="item.isCompleted" ng-change="onNoteTemplateChange()"
                                    required>
                                    <ui-select-match>
                                        {{$select.selected.Text | limitTo : 20 : 0}}
                                        <span ng-if="$select.selected.Text.length>20">...</span>
                                    </ui-select-match>
                                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.NoteTemplate | filter: { Text: $select.search }">
                                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                    </ui-select-choices>
                                </ui-select>
                            </div>

                        </div>
                        <div class="col-sm-3">

                            <label class="col-sm-5 control-label" for="type" translate="clinicalmaster.notetemplate-list.template.lbl"></label>
                            <div class="col-sm-7">
                                <ui-select ng-model="item.TemplateTypeId" ng-disabled="true">
                                    <ui-select-match>
                                        {{$select.selected.Text | limitTo : 20 : 0}}
                                        <span ng-if="$select.selected.Text.length>20">...</span>
                                    </ui-select-match>
                                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.NoteType | filter: { Text: $select.search }">
                                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                    </ui-select-choices>
                                </ui-select>
                            </div>

                        </div>

                    </div>
                </div>
        </div>
        <div class="panel-body form-panel bg-pattern">
            <div class="col-sm-12">
                <!-- leftpanel -->
                <richtexteditor richtext="item.DataTemplate" ng-disabled="item.isCompleted"></richtexteditor>
            </div>
        </div>
        </form>
    </div>
</div>

<div class="fooder-bgs">
    <div class="col-sm-12">
        <div class="pull-left">
            <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()">
                <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                <span class="btn-fontsize" translate="common.backaction.lbl"></span>
            </button>
            <button type="button" class=" btn btn-info btn-sm" ng-show="canShowReverseBtn" ng-click="reverse()" translate="medicalcertificate.dischargesummary-form.reverse.lbl"></button>
            <button type="button" class="text-white btn prv-color12 btn-sm" ng-click="releasedtopatient()" ng-show="canShowReleasedBtn"
                translate="medicalcertificate.dischargesummary-form.releasedtopatient.lbl"></button>
        </div>
        <div class="pull-right ">
            <button type="button"  class="draftbutton" ng-click="print()" ng-show="canprintBtn" translate="common.printaction.lbl"></button>
            <button type="button" class="draftbutton" translate="common.saveaction.lbl" ng-show="canShowSaveBtn" ng-click="save()"></button>
            <button type="button" class="btn dem-color4 text-white btn-sm" translate="medicalcertificate.dischargesummary-form.saveandactive.lbl"
                ng-show="canShowSaveactiveBtn" ng-click="saveandActive()"></button>
            <button type="button" class="btn btn-warning btn-sm" ng-show="canShowSaveandApproveBtn" ng-click="approve()" translate="medicalcertificate.dischargesummary-form.Approve.lbl"></button>
            <button id="btnCancelForm" type="button" class="draftbutton" ng-click="cancel()" ng-show="canShowcancelBtn" translate="common.cancelaction.lbl"></button>
            <button type="button" class="btn btn-warning btn-sm hidden-sm " ng-click="clear()" ng-show="canShowClearBtn" translate="common.clearaction.lbl"></button>
        </div>
    </div>
</div>
</div>
