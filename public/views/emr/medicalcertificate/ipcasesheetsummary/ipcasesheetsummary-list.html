<div class="container-fluid cpadz" id="consultationlistheight">
    <div ui-grid="vm.gridConfig" class="table-uigrid height-control"></div>
    <div class="fooder-bg apperance_footer">
        <div class="col-sm-12">
            <div class="col-sm-2">
                <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()"><i class="fa fa-angle-left"
                        aria-hidden="true"></i>&nbsp;&nbsp;<strong class="btn-fontsize"
                        translate="common.backaction.lbl"></strong></button>
            </div>
            <div class="col-sm-10">
                <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
                    items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                    ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
            </div>
        </div>
    </div>

<script type="text/ng-template" id="ipcasesheetListTemplate.html">
    <div class="consultationlistitem">
    <div class="col-sm-12" style="padding:0px;">
        <div class="ui-grid-cell-contents">
            <div class="col-sm-4">
                <!-- <displaydate class="disp_date" datetime-val="row.entity.Date"></displaydate> -->
                <span class="disp_date">{{row.entity.Date}} {{row.entity.Time}} </span>
                <div>
                    <span class="dr_name">{{row.entity.DoctorName}} </span>
                </div>
            </div>
            <div class="col-sm-3">
                <!-- <displaydate class="disp_date" datetime-val="row.entity.Encounter.AdmissionDate"></displaydate> -->
                <div class="dr_profile">Template Name :{{row.entity.sectionName}}</div>
                <div class="dr_user" >Created By: {{row.entity.CreatedBy}}</div>
            </div>

            <div class="col-sm-4 col-md-4 col-lg-4 emr_consul_detailicon">
                    <button class="btn btn-inverse btn-xs pull-right" ng-click="grid.appScope.handleEvents('print', row)">
                            <i class="fa fa-print" uib-tooltip="print" tooltip-placement="left" aria-hidden="true"></i>
                        </button>
                <button class="reviewbtn btn btn-xs pull-right" ng-click="grid.appScope.handleEvents('view', row)">
                    <i class="fa fa-eye" uib-tooltip="view" tooltip-placement="left" aria-hidden="true"></i>
                </button>
                <!-- <button class="editbtn btn btn-xs pull-right" ng-click="grid.appScope.handleEvents('edit', row)">
                    <i class="fa fa-chevron-right" aria-hidden="true"></i>
                </button> -->
            </div>
        </div>
    </div>
</div>
</script>
