<style>
    .modal-content .panel-body {
        overflow: inherit;
    }

    .formRoot {
        overflow: inherit;
    }

    .modal-full {
        width: 91%!important;
    }

    .btn-addpanel {
        background-color: #71c2e8;
        color: #fff;
        border-color: black;
    }

    .modal-dialog.modal-full #patientvitalscontrols .ui-grid-viewport {
        height: 335px!important;
        min-height: 372px;
    }

    button.reviewbtn.btn.btn-xs.pull-right {
        margin-left: 18px;
        margin-right: 11px;
        background-color: #2060af;
        color: #fff;
    }

    button.btn.pyr-color10.btn-sm {
        margin-left: 13px;
        display: initial !important;
    }

    .text-white span {
        color: #000000 !important;
    }

    .toprow {
        margin: 0px !important;
    }

    .btn-group>.btn,
    .btn-group-vertical>.btn {
        border: 1px solid #ccc;
    }

    .lefcol1,
    .lefcol2,
    .lefcol4 {
        /* text-transform: uppercase; */
        font-weight: 500;
        /* font-style: oblique; */
        letter-spacing: 1px;
    }

    th.col-sm-2.lefcol8 {
        padding: 0px 0px;
    }

    .ip_csheettbl table {
        width: auto !important;
        border: 1px solid lightslategray;
    }

    .ip_csheettbl table td {
        border: 1px solid lightslategray;
        text-align: center;
    }

    /* .ip_csheettbl .table td:first-child,.table td:last-child{
    border:1px solid;
} */

    .ip_csheettbl table tr:first-child td {
        color: #000;
        /* background: #1867e061; */
        background: #dbde6261;
    }

    .ip_csheettbl span.col-sm-2.lefcol1 {
        margin: 3px auto;
        white-space: nowrap;
    }

    span.col-sm-10.lefcol2.ng-binding {
        /* text-align: center; */
    }

    .lefcol1,
    .lefcol2,
    .lefcol4 {
        /* white-space: nowrap; */
        text-overflow: ellipsis;
        overflow: hidden;
        display: block;
    }

    .table td:first-child,
    .table td:last-child {
        border-radius: 0px;
    }

    .ip_csheettbl .table td:first-child {
        color: darkmagenta;
    }

    .lefcol4 {
        text-align: center;
        background: #29ace0;
        color: #fff;
    }

    @media (min-height: 637px) and (min-width: 1200px) {
        .ipcasesht {
            overflow-x: hidden !important;
            /* min-height: 0px !important; */
            height: 0px !important;
        }
    }

    .table-uigrid.ui-grid .ui-grid-cell,
    .table-uigrid.ui-grid .ui-grid-row {
        min-height: 60px !important;
        padding-top: 1px;
        border-radius: 5px;
    }

    .ul-data {
        list-style-type: none;
    }

    .status {
        background-color: #b94a48;
    }

    button.reviewbtn.btn.btn-xs.pull-right {
        margin-left: 18px;
        margin-right: 11px;
        background-color: #2060af;
        color: #fff;
    }

    .dr_name {
        color: #1240f1;
        font-weight: 500;
        font-size: 15px;
    }

    .dr_profile {
        color: #018c33;
        font-weight: 500;
        font-size: 16px;
    }

    .dr_user {
        color: #e417dc;
        font-weight: 500;
        font-size: 15px;
    }

    .disp_date {
        color: rgb(255, 73, 0);
        font-weight: 500;
    }

    .table-uigrid.ui-grid .ui-grid-row {
        border: 1px solid #ccc;
        background-color: #f7f0f0 !important;
    }

    .table-uigrid.ui-grid .ui-grid-row:hover .editbtn {
        color: #000;
    }

    .table-uigrid.ui-grid .ui-grid-row:hover {
        cursor: pointer;
    }

    .ui-grid-cell-contents {
        width: 100% !important;
    }

    .ui-grid-cell-contents {
        padding: 5px;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        box-sizing: border-box;
        white-space: nowrap;
        -ms-text-overflow: ellipsis;
        -o-text-overflow: ellipsis;
        text-overflow: ellipsis;
        overflow: inherit;
        height: 100%;
    }

    .table-uigrid.ui-grid .ui-grid-cell,
    .table-uigrid.ui-grid .ui-grid-row {
        min-height: 60px !important;
        padding-top: 1px;
        border-radius: 5px;
        min-width: 100%;
    }
    .ui-grid-viewport {
        min-height: 161px !important;
    }
</style>

<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot">
                <div class="panel-body0 form-panel pdr0">
                    <div class="row filter-area toprow">
                        <div class="col-sm-4">
                            <label class="col-sm-6 control-label filter-lbl" translate="patientemr.criticalcharts.from.lbl"></label>
                            <div class="col-sm-6 input_custom">
                                <input type="text" class="form-control cwidth" ng-change="getCurrentConsultation()" uib-datepicker-popup="{{dateFormat}}"
                                    placeholder="{{placeholder}}" ng-click="fromdatePopup = { opened: true }" is-open="fromdatePopup.opened"
                                    ng-model="currentfilter.FromDate">

                            </div>
                        </div>
                        <div class="col-sm-4">
                            <label class="col-sm-6 control-label filter-lbl" translate="patientemr.criticalcharts.to.lbl"></label>
                            <div class="col-sm-6 input_custom">
                                <input type="text" class="form-control cwidth" ng-change="getCurrentConsultation()" uib-datepicker-popup="{{dateFormat}}"
                                    placeholder="{{placeholder}}" ng-click="todatePopup = { opened: true }" is-open="todatePopup.opened"
                                    ng-model="currentfilter.ToDate">

                            </div>
                        </div>
                        <div class="col-sm-2">
                            <!-- <button class="reviewbtn btn btn-xs pull-right" ng-click="handleEvents('listView', category, $index)" uib-tooltip="{{ 'List View' | translate }}"
                                tooltip-placement="left">
                                <i class="fa fa-list" aria-hidden="true"></i>&nbsp;&nbsp;
                            </button> -->
                            <button class="btn-add" ng-click="handleEvents('add', null, 0,null)" uib-tooltip="{{ 'ipcasesheet.addcasesheets.addcasesheets.lbl' | translate }}"
                                tooltip-placement="left" ng-show='currentcontext.view == "tableview"'>
                                <i class="fa fa-plus" aria-hidden="true"></i>
                                <span translate="lis.containertypes.addnew.lbl" class="text-white"></span>
                            </button>
                            <button class="btn-add" ng-click="handleEvents('addlist', null, 0,null)" uib-tooltip="{{ 'ipcasesheet.addcasesheets.addcasesheets.lbl' | translate }}"
                                tooltip-placement="left" ng-show='currentcontext.view == "listview"'>
                                <i class="fa fa-plus" aria-hidden="true"></i>
                                <span translate="lis.containertypes.addnew.lbl" class="text-white"></span>
                            </button>
                            <button class="btn bt-color3 btn-xs pull-right" uib-tooltip="{{ 'patientemr.patientvital-list.listview.lbl' | translate }}"
                                tooltip-placement="bottom" ng-click="listView()" ng-show='currentcontext.view == "tableview"'>
                                <i class="fa fa-list-ul" aria-hidden="true"></i>
                            </button>
                            <button class="btn bt-color3 btn-xs pull-right" uib-tooltip="{{ 'patientemr.patientvital-list.listview.lbl' | translate }}"
                                tooltip-placement="bottom" ng-click="tableview()" ng-show='currentcontext.view == "listview"'>
                                <i class="fa fa-list-ul" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-sm-12 borderbtm ipcasesht" style="height:360px;overflow:scroll;" ng-show='currentcontext.view == "tableview"'>
                        <div ng-include="item.tmpl" ng-repeat="item in currentcontext.sections"></div>
                    </div>
                    <script type="text/ng-template" id="cn-question-section.html" ng-show='currentcontext.view == "tableview"'>
                        <div ng-if="sectionData[item.sectionid].cat.length>0"class="row" class="rev_items" ng-show='currentcontext.view == "tableview"'>
                            <table class="table table-hover table-responsive table-bordered ip_csheettbl" ng-show='currentcontext.view == "tableview"'>
                                    <thead class="bg-subhead">
                                    <tr>
                                        <th class="col-sm-1 lefcol8">Date</th>
                                        <th class="col-sm-1 lefcol8">Time</th>
                                        <th class="col-sm-9 lefcol8">Details</th>
                                        <th class="col-sm-1 lefcol8">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                   <tr ng-repeat="category in  sectionData[item.sectionid].cat | orderBy:'CreatedAt'">
                                        <td class="col-sm-1"><span class="lefcol1">{{category.Date}}  </span></td>
                                        <td class="col-sm-1"><span class="lefcol2">{{category.Time}} </span></td>
                                        <td class="col-sm-7">
                                            <span class="lefcol4"ng-if="category.concepts.length>0">{{category.CategoryName}}</span>
                                            <div class="row" ng-repeat="concept in category.concepts">
                                                <div class="concept-lable" ng-if="concept.ValueTypeId !=3 && concept.ValueTypeId !=12 && concept.ValueTypeId != 8" ng-show="concept.Result">
                                                    <span class="col-sm-2 lefcol1 4x" uib-tooltip="{{concept.ConceptName}}" tooltip-placement="bottom">{{concept.ConceptName}}</span>
                                                    <span class="col-sm-10 lefcol2 ali"style="word-wrap: break-word;">{{concept.Result}}</span>
                                                </div>
                                                <div class="concept-lable" ng-if="concept.ValueTypeId == 12 || concept.ValueTypeId == 8" ng-show="concept.Result">
                                                    <span class="col-sm-2 lefcol1 4x" uib-tooltip="{{concept.ConceptName}}" tooltip-placement="bottom">{{concept.ConceptName}}</span>
                                                    <span class="col-sm-10 lefcol2"style="word-wrap: break-word;" ng-bind-html="concept.Result"></span>
                                                </div>
                                                <div class="concept-lable" ng-if="concept.ValueTypeId ==3 && concept.IsMultiple == false" ng-show="concept.Result">
                                                    <span class="col-sm-2 lefcol1 5x" uib-tooltip="{{concept.ConceptName}}" tooltip-placement="bottom">{{concept.ConceptName}}</span>
                                                    <span class="col-sm-10 lefcol2">{{concept.Result}}<span ng-if="concept.Comments"> - {{concept.Comments}}</span></span>
                                                </div>
                                                <div class="concept-lable" ng-if="concept.ValueTypeId ==3 && concept.IsMultiple == true" ng-show="concept.Terms && concept.Terms.length > 0">
                                                    <div class="col-sm-2 lefcol1 6x" uib-tooltip="{{concept.ConceptName}}" tooltip-placement="bottom">{{concept.ConceptName}}</div>
                                                    <div class="col-sm-10 lefcol2">
                                                        <span ng-repeat="term in concept.Terms">
                                                            {{term.TermName}}
                                                            <span ng-if="term.Comments"> - {{term.Comments}}</span>
                                                            <span ng-if="$index != concept.Terms.length-1">,</span>
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="col-sm-3">
                                            <button class="drhms-edit-button" tabindex="-1" style="vertical-align: super;"
                                                ng-if="category.IPCasesheetId > 0" ng-click="handleEvents('delete', category, $index,null)">
                                                  <i class="fa fa-trash" aria-hidden="true"></i>
                                            </button>
                                            <button class="btn btn-success btn-xs" tabindex="-1" style="vertical-align: super;"
                                              ng-if="category.IPCasesheetId > 0" ng-click="handleEvents('edit', category, $index,null)">
                                                <i class="fa fa-pencil" aria-hidden="true"></i>
                                            </button>
                                            <button class="btn btn-inverse btn-xs" tabindex="-1" style="vertical-align: super;"
                                              ng-if="category.IPCasesheetId > 0" ng-click="handleEvents('print', category, $index,null)">
                                                <i class="fa fa-print" aria-hidden="true"></i>
                                            </button>
                                        </td>
                                      </tr>
                                   </tbody>
                                </table>
                              </div>
                          </script>
                    <div id='listview' ng-show='currentcontext.view == "listview"'>
                        <div class="container-fluid cpadz">
                            <div ui-grid="vm.gridConfig" class="table-uigrid height-control"></div>
                            <div class="fooder-bg apperance_footer">
                                <div class="col-sm-12">
                                    <div class="col-sm-2">
                                        <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()">
                                            <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                                            <span class="btn-fontsize" translate="common.backaction.lbl"></span>
                                        </button>
                                    </div>
                                    <div class="col-sm-10">
                                        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                                            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <script type="text/ng-template" id="ipcasesheetListTemplate.html" ng-show='currentcontext.view == "listview"'>
                    <div class="consultationlistitem">
                            <div class="col-sm-12 ui-grid-cell-contents">
                                <div class="col-sm-4">
                                    <span class="disp_date">{{row.entity.Date}} {{row.entity.Time}} </span>
                                    <div>
                                        <span class="dr_name">{{row.entity.DoctorName}} </span>
                                    </div>
                                </div>
                                <div class="col-sm-3">
                                    <div class="dr_profile">Template Name :{{row.entity.sectionName}}</div>
                                    <div class="dr_user">Created By: {{row.entity.CreatedBy}}</div>
                                </div>
                                <div class="col-sm-4 col-md-4 col-lg-4 emr_consul_detailicon">
                                    <button class="btn btn-inverse btn-xs pull-right"
                                      ng-if="row.entity.IPCasesheetId > 0"
                                      ng-click="grid.appScope.handleEvents('printlist',null,0, row)">
                                        <i class="fa fa-print" uib-tooltip="print" tooltip-placement="left" aria-hidden="true"></i>
                                    </button>&nbsp;&nbsp;&nbsp;
                                    <button class="reviewbtn btn btn-xs pull-right"
                                         ng-if="row.entity.IPCasesheetId > 0"
                                         ng-click="grid.appScope.handleEvents('view',null,0, row)">
                                        <i class="fa fa-eye" uib-tooltip="view" tooltip-placement="left" aria-hidden="true"></i>
                                    </button>&nbsp;&nbsp;&nbsp;
                                    <button class="btn btn-xs pull-right"
                                        ng-if="row.entity.IPCasesheetId > 0"
                                        ng-click="grid.appScope.handleEvents('delete',null,0, row)">
                                        <i class="fa fa-trash" uib-tooltip="delete" tooltip-placement="left" aria-hidden="true"></i>
                                   </button>
                                </div>
                            </div>
                        </div>
                    </script>
                </div>
            </div>
            <div class="panel-footer formactionbar">
                <div class="pull-left">
                    <button type="button" class="btn pyr-color10 btn-sm" tabindex="-1" ng-click="backToList()">
                        <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                        <i class="btn-fontsize" translate="common.backaction.lbl"></i>
                    </button>
                </div>
                <div class="pull-right">
                    <div class="col-sm-2">
                        <button type="button " id="btnsubmit " class="btn btn-inverse btn-sm pull-right text-white" translate="common.printaction.lbl"
                            ng-click="printIPCasesheet() "></button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
