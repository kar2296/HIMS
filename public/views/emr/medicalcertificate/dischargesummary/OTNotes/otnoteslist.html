<style>
    .modal-content .panel-body {
        overflow: inherit;
    }

    .formRoot {
        overflow: inherit;
    }

    .modal-dialog.modal-lg {
        width: 70%;
    }

    .autosearch-div>input {
        background-size: 10.7% !important;
    }

    .formactionbar {
        margin: 0px;
    }

    .autosearch-div .custom-popup-wrapper>.dropdown-menu {
        width: 34% !important;
        overflow-x: hidden !important;
    }

    table.table.table-bordered.table-condensed.dropdown-menu thead tr td {
        background: linear-gradient(to bottom, rgba(30, 87, 153, 1) 0, rgba(41, 137, 216, 1) 44%, rgba(32, 124, 202, 1) 46%, rgba(125, 185, 232, 1) 100%);
        border-radius: unset;
    }

    table.table.table-bordered.table-condensed.dropdown-menu tbody tr td {
        border-radius: unset;
    }
</style>
<ul class="breadcrumb" ng-if="!currentcontext.ismodal">
    <li>
        <a ng-click="backToList()" translate="patientemr.patientdiagnosis-form.parentpagetitle.lbl"></a>
    </li>
    <li class="active" translate="patientemr.patientdiagnosis-form.otnotes.lbl"></li>
</ul>
<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <h4 class="modal-title custom-modal-title" translate="patientemr.patientdiagnosis-form.otnotes.lbl"></h4>
</div>

<div class="row">
    <div class="col-sm-12">
        <form id="item_form0" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
            <div class="formRoot">
                <div class="panel-body form-panel">
                    <div class="col-sm-12">
                        <div class="">
                            <div class="well">
                                <div class="form-group">
                                    <div class="col-sm-12">
                                        <react-component name="RichTextEditor" props="{ richtext: item.DataTemplate, onContentChange: onRteChange, height: 420 }"></react-component>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="panel-footer formactionbar">
                <div class="pull-right">
                    <button type="submit" class="draftbutton" translate="common.saveaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
