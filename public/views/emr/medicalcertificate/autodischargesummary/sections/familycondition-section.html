<style>
    div#familycon_toogle {
    /* background: #1155cce6; */
    background: #0073bc !important;
}
</style>
<div class="panel {{currentcontext.paneltype}} portlet-panel" ng-controller="disfamilyConditionSectionController as vm">
    <div class="panel-heading portlet-panel-heading" id="familycon_toogle">
        <strong translate="{{panelheading}}"></strong>
         <i class="fa fa-angle-down cust_downarrow fconcommon_arrow" ></i>
        <i class="fa fa-angle-right cust_rightarrow fcon2common_arrow"></i>
        <a ng-click="handleEvents('list')" class="pull-right lnk-portlet-header-action "   uib-tooltip="{{ 'common.moredetailsaction.lbl' | translate }}" tooltip-placement="top">
            <i class="fa fa-info btn-circle" aria-hidden="true"></i>
        </a>
        <a  ng-click="handleEvents('add')" class="pull-right lnk-portlet-header-action"   uib-tooltip="{{ 'common.addnewaction.lbl' | translate }}" tooltip-placement="top">
            <i class="fa fa-plus btn-circle" aria-hidden="true"></i>
        </a>
    </div>
     <div class="panel-wrapper">
        <div class="panel-body portlet-panel-body familycon_toggle">
            <div class="table-responsive">
            <table class="table table-striped table-condensed">
                <tbody>
                    <tr class="portlet-tr" ng-repeat="item in items | limitTo: currentcontext.recordcount">
                        <td class="lefcol1">{{item.ConditionType.Description}}</td>
                        <td class="lefcol2">{{item.DiagnosisName}}</td>
                        <td class="lefcol4">{{item.Relationship.Description}}</td>
                        <td class="lefcol3">
                            <ngformatdate date-val='item.ConditionDate'></ngformatdate>
                        </td>
                        <!-- <td class="td-action">
                            <a ng-click="handleEvents('edit', item)" class="lnk-portlet-action"  uib-tooltip="{{ 'common.editaction.lbl' | translate }}" tooltip-placement="left" >
                                <i class="fa fa-pencil-square-o btn btn-success btn-rounded" aria-hidden="true"></i>
                            </a>
                            <a ng-click="handleEvents('delete', item)" class="lnk-portlet-action"  uib-tooltip="{{ 'common.deleteaction.lbl' | translate }}" tooltip-placement="left">
                                <i class="fa fa-times-circle btn btn-danger btn-rounded" aria-hidden="true"></i>
                            </a>
                        </td> -->
                     </tr>
                </tbody>
            </table>
            </div>
         <button type="button" class="btn btn-danger" style="position:relative;top:25px;padding:0px;float:right;">View more > ></button>
        </div>
    </div>
</div>
<script>
        $(document).ready(function(){
         $(".fconcommon_arrow").click(function(){

                $(".familycon_toggle").toggle("slow");

               });
           });

        </script>
        <style>
        .familycon_toggle{
            height:150px;

            width:100%;
        }

        .fconcommon_arrow{
            float: right;
            padding-left: 47px;
            font-size:24px;

        }
      .fcon2common_arrow{display: none;}
        </style>
