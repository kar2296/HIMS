<style>
    div#allergy_toogle{
        /* background: rgba(220, 20, 60, 0.98); */
    }
    /* #allergy_toogle h4{
        display: block;
        float: left;
    } */
</style>
<div class="panel {{currentcontext.paneltype}} portlet-panel" ng-controller="dischiefcomplaintSectionController as vm">
    <div class="panel-heading portlet-panel-heading" id="allergy_toogle" ng-click="">
        <strong translate="{{panelheading}}"></strong>
         <i class="fa fa-angle-down cust_downarrow allecommon_arrow" ></i>
        <i class="fa fa-angle-right cust_rightarrow alle2common_arrow"></i>
        <a  ng-click="handleEvents('add')" class="pull-right lnk-portlet-header-action"   uib-tooltip="{{ 'common.addnewaction.lbl' | translate }}" tooltip-placement="bottom">
            <i class="fa fa-plus btn-circle" aria-hidden="true"></i>
        </a>
    </div>
        <div ng-if="sectionData.ChiefComplaints.length > 0" class="row" ng-repeat="item in sectionData.ChiefComplaints">
            <div class="col-sm-3 fontpink">
                <ngformatdate date-val='item.StartDate'></ngformatdate>
            </div>
            <span class="col-sm-9 fontgreen">{{item.ChiefComplaint}}</span>
        </div>
</div>
<script>
        $(document).ready(function(){
         $(".allecommon_arrow").click(function(){

                $(".allergy_toggle").toggle("slow");

               });
           });

        </script>
        <style>
        .allergy_toggle{
            height:150px;

            width:100%;
        }

        .allecommon_arrow{
            float: right;
            padding-left: 47px;
            font-size:24px
        }
      .alle2common_arrow{display: none;}
        </style>
