<style>
    div#allergy_toogle{
        /* background: rgba(220, 20, 60, 0.98); */
    }
    /* #allergy_toogle h4{
        display: block;
        float: left;
    } */
</style>
<div class="panel {{currentcontext.paneltype}} portlet-panel" ng-controller="disfollowupSectionController as vm">
    <div class="panel-heading portlet-panel-heading" id="allergy_toogle" ng-click="">
        <strong translate="{{panelheading}}"></strong>
         <i class="fa fa-angle-down cust_downarrow allecommon_arrow" ></i>
        <i class="fa fa-angle-right cust_rightarrow alle2common_arrow"></i>
       <a ng-click="handleEvents('list')" class="pull-right lnk-portlet-header-action "   uib-tooltip="{{ 'common.moredetailsaction.lbl' | translate }}" tooltip-placement="bottom">
            <i class="fa fa-info btn-circle" aria-hidden="true"></i>
        </a>
        <a  ng-click="handleEvents('add')" class="pull-right lnk-portlet-header-action"   uib-tooltip="{{ 'common.addnewaction.lbl' | translate }}" tooltip-placement="bottom">
            <i class="fa fa-plus btn-circle" aria-hidden="true"></i>
        </a>
    </div>

    <div  ng-if="sectionData.followup.length > 0" class="row" ng-repeat="item in sectionData.followup">
        <div class="col-sm-12">
                <span style="color: maroon;font-size: 15px;" class="col-sm-3">Refer To</span>
                <span style="color:blue;" class="col-sm-3">{{item.AttendUser.Title.Description}} {{item.AttendUser.FirstName}} {{item.AttendUserLastName}}</span>
        </div>
        <div class="col-sm-12">
                <span style="color: maroon;font-size: 15px;" class="col-sm-3">Clinical Status</span>
                <span style="color:blue;" class="col-sm-3">{{item.ReferrerClinicalStatus.Description}} {{item.Days}}</span>
        </div>
        <div class="col-sm-12">
                <span style="color: maroon;font-size: 15px;" class="col-sm-3">Followup On</span>
                <span style="color:blue;margin-left: -6px;font-size: 14px;font-weight: 500" class="col-sm-3"><ngformatdate date-val='item.FollowupAppointmentOn'></ngformatdate>
                </span>
        </div>

</div>
<script>
        $(document).ready(function(){
         $(".allecommon_arrow").click(function(){

                $(".allergy_toggle").toggle("slow");

               });
           });

        </script>
        <style>
        .allergy_toggle{
            height:150px;

            width:100%;
        }

        .allecommon_arrow{
            float: right;
            padding-left: 47px;
            font-size:24px
        }
      .alle2common_arrow{display: none;}
        </style>
