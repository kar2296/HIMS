<style>
    div#allergy_toogle {
        /* background: rgba(220, 20, 60, 0.98); */
    }

    /* #allergy_toogle h4{
        display: block;
        float: left;
    } */
</style>
<div class="panel {{currentcontext.paneltype}} portlet-panel" ng-controller="disQuestionSectionController as vm">
    <div class="panel-heading portlet-panel-heading" id="allergy_toogle" ng-click="">
        <strong translate="{{panelheading}}"></strong>
        <i class="fa fa-angle-down cust_downarrow allecommon_arrow"></i>
        <i class="fa fa-angle-right cust_rightarrow alle2common_arrow"></i>
        <a ng-click="handleEvents('add')" class="pull-right lnk-portlet-header-action" uib-tooltip="{{ 'common.addnewaction.lbl' | translate }}"
            tooltip-placement="bottom">
            <i class="fa fa-plus btn-circle" aria-hidden="true"></i>
        </a>
    </div>

        <div ng-repeat="category in  sectionData[item.sectionid].cat" >
            <div class="row">
                <div class="col-sm-12" style="background:#121c67b8">
                    <h5 class="control-label mar_z category-lable" style="">{{category.CategoryName}}</h5>
                </div>
            </div>
            <div class="row" ng-repeat="concept in category.concepts">
                <div class="concept-lable" ng-if="concept.ValueTypeId !=3" ng-show="concept.Result">
                    <span class="col-sm-3 fontpink">{{concept.ConceptName}}</span>
                    <span class="col-sm-9 fontblue">{{concept.Result}}</span>
                </div>
                <div class="concept-lable" ng-if="concept.ValueTypeId ==3 && concept.IsMultiple == false" ng-show="concept.Result">
                    <span class="col-sm-3 fontpink">{{concept.ConceptName}}</span>
                    <span class="col-sm-9 fontblue">{{concept.Result}}</span>
                </div>
                <div class="concept-lable" ng-if="concept.ValueTypeId ==3 && concept.IsMultiple == true" ng-show="concept.Terms && concept.Terms.length > 0">
                    <div class="col-sm-3 fontpink">{{concept.ConceptName}}</div>
                    <div class="col-sm-9 fontblue">
                        <span ng-repeat="term in concept.Terms">
                            {{term.TermName}}
                            <span ng-if="$index != concept.Terms.length-1">,</span>
                        </span>
                    </div>
                </div>
            </div>
        </div>


</div>

<script>
    $(document).ready(function () {
        $(".allecommon_arrow").click(function () {

            $(".allergy_toggle").toggle("slow");

        });
    });

</script>
<style>
    .allergy_toggle {
        height: 150px;

        width: 100%;
    }

    .allecommon_arrow {
        float: right;
        padding-left: 47px;
        font-size: 24px
    }

    .alle2common_arrow {
        display: none;
    }
</style>
