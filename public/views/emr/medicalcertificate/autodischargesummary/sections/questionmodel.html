<style>
    .res_button button {

    }

    }

    .cust_btnouter {

        text-shadow: 0 1px 1px rgba(255, 255, 255, 0.75);
        vertical-align: middle !important;
        cursor: pointer;
        background-color: #f5f5f5 !important;
        background-repeat: repeat-x !important;
        border: 1px solid #bbbbbb !important;
        border-color: #e6e6e6 #e6e6e6 #bfbfbf;
        border-bottom-color: #a2a2a2 !important;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.05);
        /* background: #ccc; *button-color-overwrite*/
    }

    /* button.btn.btn-mini .active{
        background: blue;
    }
    .btn.active{
        background: red;
    }
    button.btn.btn-mini.active{
        background: blue;
    } */

    .form-group.col-sm-12.chief_compliants.ng-scope {
        border-bottom: 1px solid #ccc;
    }

    button,
    input,
    optgroup,
    select,
    textarea {
        color: #000;
        /* background-color: #f5f5f5; */
        background-image: -webkit-gradient(linear, 0 0, 0 100%, from(#ffffff), to(#e6e6e6));
        border: 1px solid #bbbbbb;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    /* .cust_btnouter{

        background-image: none;
    } */

    .btn-primary {
        background: #95ce95 !important;
        border: 1px solid #ccc;
        color: #fff;
    }

    .cust_btnouter {
        background: #f3f3f3;
        border: 1px solid #ccc;
        vertical-align: unset;
    }

    button.btn.btn-mini {
        padding: 4px 16px;
    }

    .custlbl {
        color: #3663E9 !important;
    }

    .contheight {
        height: auto;
        overflow: auto;
    }

    .form-group {
        margin: 3px !important;
        border-bottom: 1px solid #ccc;
    }

    .cheif_compliants {
        height: 423px !important;
        overflow: auto;
    }

    .col-sm-10.cust_vitalsbtn {
        overflow: inherit;
    }

    label.col-sm-2.control-label.custlbl.ng-binding {
        padding: 0px;
    }

    .term_name label {
        margin-bottom: 8px;
        margin-right: 3px;
    }

    textarea.notes-textarea {
        border: 1px solid #ccc;
        background: url(mock/assets/img/notes_textarea_bg.jpg) repeat top #FFF;
        resize: none;
        line-height: 16px;
        outline: none !important;
        -webkit-appearance: none !important;
        -moz-outline-style: none;
    }

    input {
        margin-bottom: 5px;
    }

    .date_cal {
        position: absolute;
        top: 7px;
        right: 20px;
    }

    .cn_mainhead span {
        /* background:#1ea9d0; */
        width: 10%;
        color: #000;
        font-style: oblique;
        font-weight: 600;
        box-shadow: 1px 3px 5px -1px #756f6f;
        border-radius: 2px;
        padding-left: 5px;
        padding-right: 5px;
    }

    .panel {
        margin-bottom: 0px;
    }

    span.lefcol4.ng-binding {
        background: yellowgreen;
        width: 100%;
    }

    .autosearch-div .custom-popup-wrapper>.dropdown-menu {
        width: 75% !important;
        overflow-x: hidden !important;
        height: 151px;
        position: absolute;
        top: -185px;
        border-radius: unset !important;
    }

    i.fa.fa-times {
        color: red;
    }

    .table td:first-child,
    .table td:last-child {
        border-top-left-radius: 0px !important;
        border-bottom-left-radius: 0px !important;
        border-left: none !important;
    }

    .table td {
        border-top-left-radius: 0px !important;
        border-bottom-left-radius: 0px !important;
        border-left: none !important;
    }

    .table-condensed>thead>tr>td {
        padding: 0px;
    }

    /* table.table.table-bordered.table-condensed.dropdown-menu {
        border: 1px solid #ccc;
        margin-top: 0px;
        padding-top: 0px;
    } */

    .table td:last-child {
        border-top-left-radius: 0px !important;
        border-bottom-left-radius: 0px !important;
        border-left: none !important;
    }

    .autosearch-div {
        padding-left: 8px;
    }
</style>
<!--control templates starts-->
<script type="text/ng-template" id="qn-text.html">
    <div class="form-group col-sm-12">
        <label class="col-sm-2 control-label">{{item.ConceptName}}</label>
        <div class="col-sm-4">
            <input type="text" class="form-control" ng-model="modeldata[item.model].resultvalue">
        </div>
    </div>
</script>
<script type="text/ng-template" id="qn-email.html">
    <div class="form-group col-sm-12">
        <label class="col-sm-2 control-label">{{item.ConceptName}}</label>
        <div class="col-sm-4">
            <input type="email" class="form-control" style="border:1px solid;" ng-model="modeldata[item.model].resultvalue">
        </div>
    </div>
</script>
<script type="text/ng-template" id="qn-select.html">
    <div class="form-group col-sm-12">
        <label class="col-sm-6 control-label">{{item.ConceptName}}</label>
        <div class="col-sm-6">
            <ui-select ng-model="modeldata[item.model].resultvalue">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in item.options | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
</script>
<script type="text/ng-template" id="qn-date.html ">
    <div class="form-group col-sm-12">
        <label class="col-sm-2 control-label">{{item.ConceptName}}</label>
        <div class="col-sm-4">
            <input type="text" class="form-control" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="datePopup = { opened: true }" is-open="datePopup.opened" ng-model="modeldata[item.model].resultvalue">
            <i class="fa fa-calendar date_cal" aria-hidden="true" ng-click="datePopup = { opened: true }"></i>

        </div>
    </div>
</script>
<script type="text/ng-template" id="qn-textarea.html">
    <div class="form-group col-sm-12">
        <label class="col-sm-2 control-label">{{item.ConceptName}}</label>
        <div class="col-sm-6">
            <textarea rows="3" cols="30" class="textarea" ng-model="modeldata[item.model].resultvaluerichtext"></textarea>
        </div>
    </div>
</script>
<script type="text/ng-template" id="qn-checkbox.html">
    <div class="form-group col-sm-12">
        <label class="col-sm-2 control-label" style="padding-top: 6px !important;">{{item.ConceptName}}</label>
        <div class="col-sm-4">
            <input type="checkbox" class="custom-checkbox" ng-model="modeldata[item.model].resultvalue">
        </div>
    </div>
</script>
<script type="text/ng-template" id="qn-boolean.html">
    <div class="form-group col-sm-12">
        <label class="col-sm-4 control-label" >{{item.ConceptName}}</label>
        <div class="col-sm-8">
            <radiogroupcontrol itemid="modeldata[item.model].resultvalue" items="booleanValues"></radiogroupcontrol>
        </div>
    </div>
</script>

<script type="text/ng-template" id="qn-termbased-single.html">
    <div class="form-group col-sm-12 chief_compliants">
        <label class="col-sm-4 control-label custlbl">{{item.ConceptName}}</label>
        <div class="col-sm-8 cust_vitalsbtn">

            <div uib-tooltip="{{term.TermName}}" tooltip-placement="top" class="btn-group cust_btnouter" ng-repeat="term in item.Terms"
                ng-model="modeldata[item.model].resultvalue" uib-btn-radio="'{{term.Code}}'" title="{{term.TermName}}">
                <button class="btn btn-xl active style="width:120px;text-overflow:ellipsis;overflow:hidden;white-space: nowrap;border:none;background:none;"><span>{{term.TermName}}</span></button>
                <button ng-click="openCommentsModal(item)" class="btn btn-xl active" style="background:#f3f3f3;padding-left:7px;border:none;width:26px;box-shadow: inset 0 3px 5px rgba(0, 0, 0, 0.125)"><span class="icon-remove" style="background-position: -240px -120px;"></span>

                    </button>


                <!-- <button data-toggle="dropdown" data-placement="bottom" class="btn comment-popover btn-addon"><i class="icon-comment"></i></button> -->
                <!-- <label class="btn btn-default category-button" ng-repeat="term in item.Terms" ng-model="modeldata[item.model].resultvalue"
                    uib-btn-radio="'{{term.Code}}'" title="{{term.TermName}}">{{term.TermName}}</label> -->

            </div>

        </div>


    </div>

</script>
<script type="text/ng-template" id="qn-termbased-multiple.html ">
    <div class="form-group col-sm-12">
        <label class="col-sm-4 control-label">{{item.ConceptName}}</label>
        <div class="col-sm-8 term_name">
            <div class="">
                <div class="btn-group cust_btnouter" uib-tooltip="{{term.TermName}}" tooltip-placement="top" ng-repeat="term in item.Terms"
                    ng-model="modeldata[term.model].resultvalue" uib-btn-checkbox="{{term.Code}}" title="{{term.TermName}}">
                    <button class="btn btn-default cust_termbtn" style="width:120px;text-overflow:ellipsis;overflow:hidden;white-space: nowrap;border:none;background:none;padding-bottom:0px;padding-top:3px;"><span>{{term.TermName}}</span>
                </button>
                    <button ng-click="openCommentsModal(term)" class="btn btn-xl active" style="background:#f3f3f3;padding-left:7px;border:none;width:26px;border-left:1px solid #ccc;"><span class="icon-remove" style="background-position: -240px -120px;"></span>

                    </button>

                </div>
            </div>
        </div>
    </div>
</script>
<script type="text/ng-template" id="qn-cpt.html">
    <div class="row cpt-icd">
        <label class="col-sm-2 control-label">
            {{item.ConceptName}}
        </label>
        <div class="col-sm-3">
            <autosearch itemid="item.procedureId" config="vm.procedureconfig" iteminfo="item.selectedcptvalue" itemchange="procedureChange(item)"></autosearch>
        </div>
        <div class="col-sm-3">
        </div>
    </div>
    <div class="row">
        <div class="col-sm-2"></div>
        <div class="col-sm-8">
            <div ng-repeat="proc in modeldata[item.model].resultvaluejson">
                <div>
                    <i class="fa fa-times" ng-click="removeProcedure(item.model,proc.ProcedureId)" aria-hidden="true"></i>
                    {{proc.ProcedureName}}
                </div>
            </div>
        </div>
    </div>
</script>
<script type="text/ng-template" id="qn-rating.html">
    <div class="row form-group col-sm-12">
        <label class="col-sm-2 control-label">{{item.ConceptName}}</label>
        <div class="col-sm-3">
            <slider class="bs-slider slider-horizontal" ng-model="modeldata[item.model].resultvalue" min="modeldata[item.model].attr.Min" max="modeldata[item.model].attr.Max" step="modeldata[item.model].attr.Step" orientation="horizontal"></slider>
        </div>
        <div class="col-sm-3"></div>
    </div>
</script>
<script type="text/ng-template" id="qn-icd.html">
    <div class="row cpt-icd form-group">
        <label class="col-sm-2 control-label">
            {{item.ConceptName}}
        </label>
        <div class="col-sm-4">
            <autosearch class="ml12" config="vm.diagnosisconfig" role="listbox" iteminfo="item.selectedicdvalue" itemchange="diagnosisChange(item)"></autosearch>
        </div>
        <div class="col-sm-3"></div>
    </div>
    <div class="row">
        <div class="col-sm-4"></div>
        <div class="col-sm-8">
            <div ng-repeat="diag in modeldata[item.model].resultvaluejson">
                <div>
                    <i class="fa fa-times" ng-click="removeDiagnosis(item.model, diag.DiagnosisId)" aria-hidden="true"></i>
                    {{diag.DiagnosisName}}
                </div>
            </div>
        </div>
    </div>
</script>
<script type="text/ng-template" id="qn-ckeditor.html">
    <div class="form-group col-sm-12">
        <label class="col-sm-4 control-label">{{item.ConceptName}}</label>
        <div class="col-sm-8 term_name">
            <div class="ckeditor-value">
                <div ng-bind-html="modeldata[item.model].resultvaluerichtext"></div>
            </div>
            <div style="padding: 10px 0;">
            <a class="editer-btn" ng-click="openRichTextEditor(item.model)" tooltip-placement="bottom">
                <i class="" aria-hidden="true">Open Editor</i>
            </a>
        </div>
        </div>
    </div>
</script>
<!-- rating, slider, master lookup -->

<div class="row0">
    <div class="panel panel-default">
        <h4 class="custom-modal-headerz cn_mainhead" style="margin-top:0px !important;box-shadow: none;"><span

        <div class="row filter-area">
            <div class="col-sm-4">
                <label class="col-sm-6 control-label filter-lbl" for="Date" translate="Date"></label>
                <div class="col-sm-6 input_custom">
                    <input type="text" class="form-control" name="Date" ng-date-object
                        datetime-picker="{{datePickerOptions.dateTimeFormat}}" datepicker-append-to-body="false"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="collectedDatePopup = { opened: true }"
                        is-open="collectedDatePopup.opened" ng-model="currentfilter.DateTime">
                </div>
            </div>
            <!-- <div class="col-sm-4">
                            <label class="col-sm-6 control-label filter-lbl" translate="Time"></label>
                            <div class="col-sm-6 input_custom">
                                <input type="text" class="form-control cwidth" uib-datepicker-popup="{{datePickerOptions.timeFormat}}"
                                    placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
                                    is-open="todatePopup.opened" ng-model="currentfilter.Time">

                            </div>
                        </div> -->
            <div class="col-sm-4">

    <!-- set-form-height reduce-height="100" -->
    <div class="col-sm-12 cheif_compliants ipcasesht" class="formRoot">
        <div class="panel panel-default contheight" ng-repeat="category in currentcontext.categories"
            style="padding-top: 10px;">
            <h4 class="custom-modal-headerz cn_mainhead"><span>{{category.CategoryName}}</span></h4>
            <div class="panel-body">
                <div ng-repeat="item in category.Concepts" ng-include="item.tmpl"></div>
            </div>
        </div>
    </div>
</div>
<div class="panel-footer formactionbar" style="width:100%;left:0px;margin-bottom: 0px;">
    <div class="pull-left">
        <button type="button bckbtn" class="btn pyr-color10 btn-sm" tabindex="-1" ng-click="backTohome()">
            <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
            <span class="btn-fontsize" translate="common.backaction.lbl"></span>
        </button>
    </div>
    <div class="pull-right res_button">
        <button type="button" class="draftbutton" translate="common.saveaction.lbl"
            ng-click="saveItem()"></button>
    </div>

</div>
