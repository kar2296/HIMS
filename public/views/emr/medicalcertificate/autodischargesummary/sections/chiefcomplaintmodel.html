<style>
    .aside-collapsed .fooder-bg {
        display: -webkit-box !important;
    }

    .modal-dialog .modal-content .tabsizetopcontroller favoritecontrol .panel .panel-body #favoritebtncolorcontroler .btn-default {
        padding: 2px 5px;
    }

    @media only screen and (min-width: 993px) {

        .aside-collapsed .modal-content .tabsizetopcontroller .fooder-bg,
        .modal-content .tabsizetopcontroller .fooder-bg {
            position: relative !important;
            min-width: 98% !important;
            left: 8px !important;
        }
    }

    .fooder-bg {
        z-index: 999;
    }

    .panel-favorite .panel-body {
        height: 250px;
    }

    .col-sm-11.tab-content-div {
        height: 445px;
        overflow: auto;
    }

    .res_button button {
        margin-left: 4px;
    }

    .panel-heading {
        display: none;
    }

    .form-group button {
        margin: 2px;
    }

    .clbl-pad {
        padding: 0px;
    }

    .tabsizetopcontroller .ui-grid-viewport {
        min-height: 244px;
    }
</style>
<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <h4 class="modal-title custom-modal-title" translate="patientemr.patientchiefcomplaint-list.pagetitle.lbl"></h4>
</div>
<div class="col-sm-12">
    <div class="col-sm-6"></div>
    <div class="col-sm-6">
        <div class="form-group">
            <div class="col-sm-10">
                <label class="col-sm-4 control-label clbl-pad" for="cc"
                    translate="patientemr.patientchiefcomplaint-list.chiefcomplaint.lbl"></label>
                <div class="col-sm-8">
                    <autosearch itemid="currentcontext.chiefComplaintId" config="vm.chiefcomplaintconfig"
                        iteminfo="currentcontext.selectedCC" itemchange="chiefComplaintChange()"></autosearch>
                </div>
            </div>
            <button class="btn bt-color3 btn-xs pull-right" uib-tooltip="List View" tooltip-placement="bottom"
                ng-click="listView()">
                <i class="fa fa-list-ul" aria-hidden="true"></i>
            </button>
            <button class=" text-white btn res-color14 btn-xs pull-right" ng-click="emrfavouritesettings()"
                uib-tooltip="Add New Favorites" tooltip-placement="left">
                <i class="fa fa-cog" aria-hidden="true"></i>
            </button>
        </div>
    </div>

    <!-- <div class="col-sm-8"></div> -->
</div>
<div class="tabsizetopcontroller">
    <div class="row">
        <favoritecontrol config="favconfig" addclick="addFavorite()" saveclick="saveFavorites()"
            class="header-panel-body"></favoritecontrol>
    </div>
    <div class="row">
        <custom-table config="vm.gridConfig"></custom-table>
    </div>
    <div class="fooder-bgs">
        <div class="pull-left">
            <button type="button" class="btn pyr-color10 btn-sm" tabindex="-1" ng-click="backTohome()">
                <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                <span class="btn-fontsize" translate="common.backaction.lbl"></span>
            </button>
        </div>
        <div class="pull-right res_button">
            <button type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="saveItem()"></button>
        </div>
    </div>
</div>
