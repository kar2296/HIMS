<style>
    .diet {
        color: #b7af52;
    }

    .prefer {
        color: #671f55;
    }

    .food {
        color: #ac1849;
    }

    .text {
        color: #2719b9;
        font-weight:bold;
    }

    .unit {
    color: rgb(0, 0, 0);
    font-weight: 700;
}
    div#diet_toogle {
    /* background: #02a292; */
}
</style>
<div class="panel {{currentcontext.paneltype}} portlet-panel" ng-controller="disdietSectionController as vm">
    <div class="panel-heading portlet-panel-heading" id="diet_toogle" ng-click="">
        <strong translate="{{panelheading}}"></strong>
        <i class="fa fa-angle-down cust_downarrow dietcommon_arrow" ></i>
        <i class="fa fa-angle-right cust_rightarrow diet2common_arrow"></i>
        <a ng-click="handleEvents('list')" class="pull-right lnk-portlet-header-action " uib-tooltip="{{ 'common.moredetailsaction.lbl' | translate }}"
            tooltip-placement="bottom">
            <i class="fa fa-info btn-circle" aria-hidden="true"></i>
        </a>
        <a ng-click="handleEvents('add')" class="pull-right lnk-portlet-header-action" uib-tooltip="{{ 'common.addnewaction.lbl' | translate }}"
            tooltip-placement="bottom">
            <i class="fa fa-plus btn-circle" aria-hidden="true"></i>
        </a>
    </div>
     <div class="panel-wrapper">
        <div class="panel-body portlet-panel-body diet_toggle">
            <div class="table-responsive">
                <table class="table table-striped table-condensed">
                    <tbody>
                        <tr class="portlet-tr" ng-repeat="item in items | limitTo: currentcontext.recordcount">
                            <td>
                                <span class="lefcol1">Diet Type:</span>&nbsp;<span class="unit">{{item.DietType.Description}}</span>;&nbsp;&nbsp;
                                <span class="lefcol1">Diet Preferrence:</span>&nbsp;<span class="unit">{{item.DietPreferrence.Description}}</span>;&nbsp;&nbsp;
                                <span class="lefcol1">Food Preference:</span>&nbsp;<span class="unit">{{item.FoodPreference.Description}}</span>;&nbsp;&nbsp;
                                <span class="lefcol1">Therapeutic Diet:</span>&nbsp;<span class="unit">{{item.TherapeuticDiet.Description}}</span>&nbsp;&nbsp;
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
             <button type="button" class="btn btn-danger" style="position:relative;top:25px;padding:0px;float:right;">View more > ></button>
         </div>
    </div>
</div>
<script>
        $(document).ready(function(){
         $(".dietcommon_arrow").click(function(){

                $(".diet_toggle").toggle("slow");

               });
           });

        </script>
        <style>
        .diet_toggle{
            height:150px;

            width:100%;
        }

        .dietcommon_arrow{
            float: right;
            padding-left: 47px;
            font-size:24px;

        }
      .diet2common_arrow{display: none;}
        </style>
