<style>
       font{padding:0px 5px 1px 1px;}
       div#vital_toogle {
    /* background: rgb(0, 185, 230); */
    background: #553ce487;
}
    </style>
<div class="panel {{currentcontext.paneltype}} portlet-panel" ng-controller="disvitalSectionController as vm">
    <div class="panel-heading portlet-panel-heading" id="vital_toogle">
        <strong translate="{{panelheading}}"></strong>
         <i class="fa fa-angle-down cust_downarrow vcommon_arrow" ></i>
        <!-- <i class="fa fa-angle-right cust_rightarrow v2common_arrow"></i> -->
         <a ng-click="handleEvents('list')" class="pull-right lnk-portlet-header-action "   uib-tooltip="{{ 'common.moredetailsaction.lbl' | translate }}" tooltip-placement="top">
            <i id="vital_toggle1" class="fa fa-info btn-circle" aria-hidden="true"></i>
        </a>
        <a  ng-click="handleEvents('add')" class="pull-right lnk-portlet-header-action"   uib-tooltip="{{ 'common.addnewaction.lbl' | translate }}" tooltip-placement="top">
            <i id="vital_toggle1" class="fa fa-plus btn-circle" aria-hidden="true"></i>
        </a>
         <a ng-click="handleEvents('chart')"  class="pull-right lnk-portlet-header-action "   uib-tooltip="{{ 'patientemr.patientdashboard.vitalchart.lbl' | translate }}" tooltip-placement="top">
           <i class="fa fa-line-chart btn-circle" aria-hidden="true"></i>
        </a>
    </div>
     <div class="panel-wrapper">
        <div class="panel-body portlet-panel-body vital_toggle" id="content2">
            <div class="table-responsive">
            <table class="table table-striped table-condensed">
                <tbody>
                    <tr class="portlet-tr" ng-repeat="item in items | limitTo: currentcontext.recordcount">

                            <th class="lefcol3" style="width:12%;">{{item.PerformedDate}}</th>
                            <td class="lefcol2"><p data-ng-bind-html="item.Vitalinfo"></p></td>
                    </tr>
                </tbody>
            </table>
            </div>
             <button type="button" class="btn btn-danger" style="position:relative;top:25px;padding:0px;float:right;" ng-click="list()">View more > ></button>
         </div>

    </div>

</div>

<script>
        $(document).ready(function(){
         $(".vcommon_arrow").click(function(){

            $(".vital_toggle").toggle("slow")
          //  $(this).find('i').toggleClass("fa fa-angle-down fa fa-angle-right")
             });
        });

        </script>
      <style>
         .vital_toggle {
            height: 150px;
            width: 100%;
        }
        .vcommon_arrow {
            float: right;
            padding-left: 47px;
            font-size: 24px
        }
        .v2common_arrow {
            display: none;
        }
      </style>
