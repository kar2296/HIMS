 <div class="row page-header" id="assets">
              <h4 class="active col-sm-6 mt0" translate="registration.patientfollowup.pagetitle.lbl"></h4>
   <div class="col-sm-6">
                <button class="btn-add" ng-click="addNew()" uib-tooltip="{{ 'registration.patientfollowup.pagetitle.lbl' | translate }}"
                    tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                    <!-- <span translate="common.addaction.lbl"></span> -->
                </button>
            </div>
        </div>
   <div class="row tablebox"  id="tablebox">
       <div class="col-sm-12">
            <uib-tabset active="active" id="assettabs">
               <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)" disable="tab.canDisable">
               </uib-tab>
           </uib-tabset>
           <div ui-view></div>
       </div>
   </div>
