<div id="fullregistrationheight2">
    <div class="row" id="fullregistrationheight">

        <div class="col-sm-12 mlc_formgroup">
            <form id="item_form" name="item_form" class="form-horizontal" role="form">
                <div class="formRoot">
                    <div class="panel panel-default">
                        <div class="panel-body form-panel bg-pattern pad0">
                            <div class="col-sm-12 pad0">
                                <!-- leftpanel -->
                                <div class="col-sm-6 pad0">
                                    <div class="col-sm-12 pad0">
                                        <fieldset class="fsStyle well">
                                            <legend class="legendStyle">
                                                <span translate="mlc-list.mlcdetails.lbl"></span>
                                            </legend>

                                            <div class="form-group">
                                                <label class="col-sm-4 control-label" for="escorttype" translate="mlc-list.escorttype.lbl"></label>
                                                <div class="col-sm-8">
                                                    <ui-select ng-model="item.EscortTypeId" name="escorttype" ng-disabled="!item.IsMLC" ng-checked="item.IsMlc == 1" required>
                                                        <ui-select-match>
                                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                                        </ui-select-match>
                                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.EscortType | filter: { Text: $select.search }">
                                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                        </ui-select-choices>
                                                    </ui-select>
                                                </div>
                                            </div>
                                            <div class="form-group">
                                                <label class="col-sm-4 control-label" translate="mlc-list.escortedby.lbl"></label>
                                                <div class="col-sm-8">
                                                    <ui-select ng-model="item.EscortUserId" ng-disabled="!item.IsMLC" ng-change="getEscortName($select.selected)">
                                                        <ui-select-match>
                                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                                        </ui-select-match>
                                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.EscortUser | filter: { Text: $select.search }">
                                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                        </ui-select-choices>
                                                    </ui-select>
                                                </div>
                                            </div>
                                            <div class="form-group">
                                                <label class="col-sm-4 control-label" translate="mlc-list.vehicleref.no.lbl"></label>
                                                <div class="col-sm-8">
                                                    <input type="text" class="form-control"ng-disabled="!item.IsMLC" ng-model="item.VeichleNo" placeholder="">
                                                </div>
                                            </div>
                                            <div class="form-group">
                                                <label class="col-sm-4 control-label" translate="mlc-list.mlcno.lbl"></label>
                                                <div class="col-sm-8">
                                                    <input type="text" class="form-control" ng-model="item.MLCNo" ng-disabled="true" placeholder="">
                                                </div>
                                            </div>
                                            <div class="form-group">
                                                <label class="col-sm-4 control-label" for="mlc-listfacility" translate="mlc-list.ismlc.lbl"></label>
                                                <div class="col-sm-8">
                                                    <input type="checkbox" class="custom-checkbox" name="IsMLC" ng-model="item.IsMLC">
                                                </div>
                                            </div>
                                            <div class="form-group">
                                                <label class="col-sm-4 control-label" for="mlc-listAccidentType" translate="mlc-list.typeofaccident.lbl"></label>
                                                <div class="col-sm-8">
                                                    <ui-select ng-model="item.AccidentTypeId"ng-disabled="!item.IsMLC" name="mlc-listAccidentType" required>
                                                        <ui-select-match>
                                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                                        </ui-select-match>
                                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.AccidentType | filter: { Text: $select.search }">
                                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                        </ui-select-choices>
                                                    </ui-select>
                                                </div>
                                            </div>

                                            <div class="form-group">
                                                <label class="col-sm-4 control-label" translate="mlc-list.datetimeofincident.lbl"></label>
                                                <div class="col-sm-8">

                                                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                                                    ng-click="activefromPopup = { opened: true }" is-open="activefromPopup.opened"
                                                    ng-model="item.IncidentDate" >-->
                                                    <input type="text" class="form-control" name="admissiondate" name="admissiondate" ng-change="populateEstimateDisDate()" datepicker-options="datePickerOptions"
                                                        show-button-bar="{{datePickerOptions.showButtonBar}}" datetime-picker="{{datePickerOptions.dateTimeFormat}}"
                                                        placeholder="{{datePickerOptions.placeholder}}" ng-click="AdmissionDatePopup = { opened: true }"
                                                        is-open="AdmissionDatePopup.opened" ng-model="item.IncidentDate" ng-disabled="!item.IsMLC" required>

                                                </div>
                                            </div>
                                            <div class="form-group">
                                                <label class="col-sm-4 control-label " for="mlc-listmlc-listidentificationmar" translate="mlc-list.identificationmark.lbl "></label>
                                                <div class="col-sm-8">
                                                    <input type="text" class="form-control" name="mlc-listmlc-listidentificationmark" ng-model="item.IdentificationMark " placeholder=" ">
                                                </div>
                                            </div>
                                            <div class="form-group">
                                                <label class="col-sm-4 control-label" for="doctorid" translate="billing.opbilling-list.doctor.lbl"></label>
                                                <div class="col-sm-8">
                                                    <autosearch itemid="item.DoctorId" iteminfo="" rowdata="" name="'doctorid'" config="vm.doctorcontrolconfig" itemchange="doctorChange()"
                                                    candisable="!item.IsMLC" isrequired="true"></autosearch>
                                                </div>
                                            </div>
                                            <div class="form-group">
                                                <label class="col-sm-4 control-label" for="mlc-listpatientstatus" translate="mlc-list.patientstatus.lbl"></label>
                                                <div class="col-sm-8">
                                                    <ui-select ng-model="item.MLCPatientStatus" name="mlc-listpatientstatus" ng-disabled="!item.IsMLC" required>
                                                        <ui-select-match>
                                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                                        </ui-select-match>
                                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.PatientStatus | filter: { Text: $select.search }">
                                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                        </ui-select-choices>
                                                    </ui-select>
                                                </div>
                                            </div>
                                            <address addressline1="item.AddressOfAcident" addressline2="item.AddressOfAcident2" pincodeid="item.PinCodeId" pincode="item.Pincode"
                                                area="item.Area" city="item.City" cityid="item.CityId" state="item.State" stateid="item.StateId"
                                                country="item.Country" countryid="item.CountryId" ng-disabled="!item.IsMLC">
                                            </address>

                                            <!--
                                        <div class="form-group">
                                            <label class="col-sm-4 control-label" translate="mlc-list.addressofincident.lbl"></label>
                                            <div class="col-sm-7 filter-lbl">
                                                <input type="text" class="form-control" name="addressofincident" ng-model="item.AddressOfAcident"   placeholder="">
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label class="col-sm-4 control-label" translate="mlc-list.country.lbl" ></label>
                                            <div class="col-sm-7">
                                                <ui-select ng-model="item.CountryId" >
                                                    <ui-select-match>
                                                        {{$select.selected.Text | limitTo : 20 : 0}}
                                                        <span ng-if="$select.selected.Text.length>20">...</span>
                                                    </ui-select-match>
                                                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Country | filter: { Text: $select.search } ">
                                                        <div ng-bind-html="lookupitem.Text | highlight: $select.search "></div>
                                                    </ui-select-choices>
                                                </ui-select>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label class="col-sm-4 control-label" translate="mlc-list.state.lbl" ></label>
                                            <div class="col-sm-7">
                                                <ui-select ng-model="item.StateId" >
                                                    <ui-select-match>
                                                        {{$select.selected.Text | limitTo : 20 : 0}}
                                                        <span ng-if="$select.selected.Text.length>20">...</span>
                                                    </ui-select-match>
                                                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.State | filter: { Text: $select.search } ">
                                                        <div ng-bind-html="lookupitem.Text | highlight: $select.search "></div>
                                                    </ui-select-choices>
                                                </ui-select>
                                            </div>
                                        </div>-->
                                            <div class="form-group">
                                                <label class="col-sm-4 control-label" for="AccidentName" translate="mlc-list.breifdetailofincident.lbl"></label>
                                                <div class="col-sm-8">
                                                    <textarea rows="3" ng-model="item.BriefOfAccident" maxlength="4000" name="AccidentName" style="width:100%;" class="notes-textarea"
                                                        required></textarea>
                                                </div>
                                            </div>
                                        </fieldset>
                                    </div>
                                </div>

                                <!-- rightpanel -->
                                <div class="col-sm-6 pad0">

                                    <div class="col-sm-12 pad0">
                                        <fieldset class="fsStyle well">
                                            <legend class="legendStyle">
                                                <span translate="mlc-list.policedetails.lbl"></span>
                                            </legend>

                                            <div class="form-group">
                                                <label class="col-sm-4 control-label" translate="mlc-list.policestation.lbl"></label>
                                                <div class="col-sm-7">
                                                    <input type="text" class="form-control" name="policestation" ng-model="item.PoliceStation" ng-disabled="!item.IsMLC"
                                                    placeholder="">
                                                </div>
                                            </div>
                                            <div class="form-group">
                                                <label class="col-sm-4 control-label" translate="mlc-list.datetime.lbl"></label>
                                                <div class="col-sm-7">
                                                    <!--<input type="text" class="form-control" name="Chequedate" ng-date-object datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                                                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                                                    ng-click="activefromPopup = { opened: true }" is-open="activefromPopup.opened"
                                                    ng-model="item.IncidentDate" >-->
                                                    <input type="text" class="form-control" name="admissiondate" name="admissiondate" ng-change="populateEstimateDisDate()" datepicker-options="datePickerOptions"
                                                        show-button-bar="{{datePickerOptions.showButtonBar}}" datetime-picker="{{datePickerOptions.dateTimeFormat}}"
                                                        placeholder="{{datePickerOptions.placeholder}}" ng-click="AdmissionPopup = { opened: true }"
                                                        is-open="AdmissionPopup.opened" ng-model="item.PoliceCertificateDate"
                                                        ng-disabled="!item.IsMLC" required>

                                                </div>
                                            </div>
                                            <div class="form-group">
                                                <label class="col-sm-4 control-label" translate="mlc-list.certificateno.lbl"></label>
                                                <div class="col-sm-7">
                                                    <input type="text" class="form-control" name="policestation" ng-model="item.CertificateNo" ng-disabled="!item.IsMLC" placeholder="">
                                                </div>
                                            </div>

                                            <div class="form-group">
                                                <label class="col-sm-4 control-label" translate="mlc-list.buckleno.lbl"></label>
                                                <div class="col-sm-7">
                                                    <input type="text" class="form-control" name="policestation" ng-model="item.BuckleNo"ng-disabled="!item.IsMLC" placeholder="">
                                                </div>
                                            </div>
                                            <div class="form-group">
                                                <label class="col-sm-4 control-label" for="mobile" translate="mlc-list.contactnumber.lbl"></label>
                                                <div class="col-sm-7">
                                                    <input type="text" class="form-control" name="mobile" ng-model="item.ContactNo" placeholder="" ng-minlength="10" ng-pattern="/^\d+$/"
                                                    ng-disabled="!item.IsMLC" required>
                                                </div>
                                                <!--<div class="col-sm-1" ng-if="item.IsMLC">
                                                <button class="btn btn-success btn-xs pull-right" type="button" ng-click="addNewMLCOfficer()" uib-tooltip="{{'mlc-list.addnew-tooltip3.lbl' | translate }}"
                                                    tooltip-placement="left"><i class="fa fa-plus"  aria-hidden="true" ></i></button>
                                            </div>-->
                                                <!--<div class="col-sm-1"></div>-->

                                                <div class="col-sm-1" ng-if="item.IsMLC">
                                                    <button class="btn btn-success btn-xs pull-right" type="button" ng-click="addNewMLCOfficer()" ng-disabled="!item.IsMLC" uib-tooltip="{{'mlc-list.addnew-tooltip3.lbl' | translate }}"
                                                        tooltip-placement="top">
                                                        <i class="fa fa-plus" aria-hidden="true"></i>
                                                    </button>

                                                </div>

                                            </div>
                                            <div class="form-group">
                                                <div class="col-sm-4"></div>

                                            </div>
                                            <div class="container-fluid">
                                                <div ui-grid="vm.gridConfig" class="table-uigrid"></div>
                                            </div>
                                        </fieldset>


                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
        </div>
    </div>
    <div class="fooder-bgs">
        <div class="row ">
            <div class="col-sm-12">
                <div class="pull-left">
                    <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()">
                        <i class="fa fa-angle-left" aria-hidden="true"></i>
                        <span class="btn-fontsize"> &nbsp; Back</span>
                    </button>
                    <ul class="nav navbar-nav pull-left" id="pastnotes">
                            <li uib-dropdown="" class="dropdown dropdown-list custom-li">
                                <button uib-dropdown-toggle="" class="draftbutton" ng-disabled="">
                                    <span translate="Previous Notes"></span>
                                    <!-- <span>
                                            <i class="fa fa-caret-up" aria-hidden="true"></i>
                                        </span> -->
                                </button>
                                <ul class="dropdown-menu top" role="menu" aria-labelledby="dLabel">
                                    <li ng-repeat="item in consultlist| limitTo: currentcontext.recordcount">
                                        <a class=" " ng-click="viewConsultation() ">
                                            <span>
                                                <i class="fa fa-angle-right " aria-hidden="true "></i>
                                            </span>&nbsp;&nbsp;&nbsp;
                                            <span class="dr_name0 ">{{item.Encounter.DoctorName}} - </span>
                                            <displaydate class="disp_date0 " datetime-val="item.CreatedAt "></displaydate>
                                            <span class="dr_profile0 "> - {{item.ProfileMaster.Name}}</span>
                                        </a>
                                    </li>
                                </ul>
                            </li>
                        </ul>
                        <button id="btn" type="button" class="btn bt-color3 btn-sm"   ng-click="labresult()" uib-tooltip="{{ 'medicalcertificate.dischargesummary-form.labresult.lbl' | translate }}"
                tooltip-placement="top">
                    <i class="fa fa-flask" ></i>
            </button>
        <button id="btn" type="button" class="btn bt-color1 btn-sm"
            ng-click="radiologyresult()" uib-tooltip="{{ 'medicalcertificate.dischargesummary-form.radiology.lbl' | translate }}"
            tooltip-placement="top"><i class="fa fa-file-image-o"></i></button>
                </div>
                <div class="pull-right">
                    <!-- <button type="button"  class="draftbutton" ng-hide="item.MLCStatusId!=1" ng-click="print()" translate="common.printaction.lbl"></button> -->
                    <button id="btnSave" type="button" class="draftbutton" ng-hide="item.AdmissionStatusId==6" translate="common.saveaction.lbl"
                        ng-click="saveItem()"></button>

                </div>
            </div>
        </div>
    </div>
    </form>
</div>
</div>
