<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <h4 class="modal-title custom-modal-title" translate="patientemr.patientchiefcomplaint-list.pagetitle.lbl"></h4>
</div>
<div class="col-sm-12">
    <div class="col-sm-6"></div>
    <div class="col-sm-6">
        <div class="form-group">
            <div class="col-sm-10">
                <label class="col-sm-4 control-label clbl-pad" for="cc"
                    translate="patientemr.patientchiefcomplaint-list.chiefcomplaint.lbl"></label>
                <div class="col-sm-8">
                    <autosearch itemid="currentcontext.chiefComplaintId" config="vm.chiefcomplaintconfig"
                        iteminfo="currentcontext.selectedCC" itemchange="chiefComplaintChange()"></autosearch>
                </div>
            </div>
            <button class="btn bt-color3 btn-xs pull-right" uib-tooltip="List View" tooltip-placement="bottom"
                ng-click="listView()">
                <i class="fa fa-list-ul" aria-hidden="true"></i>
            </button>
            <button class=" text-white btn res-color14 btn-xs pull-right" ng-click="emrfavouritesettings()"
                uib-tooltip="Add New Favorites" tooltip-placement="left">
                <i class="fa fa-cog" aria-hidden="true"></i>
            </button>
        </div>
    </div>

    <!-- <div class="col-sm-8"></div> -->
</div>

<div class="row">
    <favoritecontrol config="favconfig" addclick="addFavorite()" saveclick="saveFavorites()" class="header-panel-body">
    </favoritecontrol>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row ">
        <div class="col-sm-12">
            <div class="pull-left">
                <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()">
                    <i class="fa fa-angle-left" aria-hidden="true"></i>
                    <span class="btn-fontsize"> &nbsp; Back</span>
                </button>
                <ul class="nav navbar-nav pull-left" id="pastnotes">
                    <li uib-dropdown="" class="dropdown dropdown-list custom-li">
                        <button uib-dropdown-toggle="" class="draftbutton" ng-disabled="">
                            <span translate="Previous Notes"></span>
                            <!-- <span>
                                            <i class="fa fa-caret-up" aria-hidden="true"></i>
                                        </span> -->
                        </button>
                        <ul class="dropdown-menu top" role="menu" aria-labelledby="dLabel">
                            <li ng-repeat="item in consultlist| limitTo: currentcontext.recordcount">
                                <a class=" " ng-click="viewConsultation() ">
                                    <span>
                                        <i class="fa fa-angle-right " aria-hidden="true "></i>
                                    </span>&nbsp;&nbsp;&nbsp;
                                    <span class="dr_name0 ">{{item.Encounter.DoctorName}} - </span>
                                    <displaydate class="disp_date0 " datetime-val="item.CreatedAt "></displaydate>
                                    <span class="dr_profile0 "> - {{item.ProfileMaster.Name}}</span>
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
                <button id="btn" type="button" class="btn bt-color3 btn-sm" ng-click="labresult()"
                    uib-tooltip="{{ 'medicalcertificate.dischargesummary-form.labresult.lbl' | translate }}"
                    tooltip-placement="top">
                    <i class="fa fa-flask"></i>
                </button>
                <button id="btn" type="button" class="btn bt-color1 btn-sm" ng-click="radiologyresult()"
                    uib-tooltip="{{ 'medicalcertificate.dischargesummary-form.radiology.lbl' | translate }}"
                    tooltip-placement="top"><i class="fa fa-file-image-o"></i></button>


            </div>
            <div class="pull-right">
                <!-- <button type="button"  class="draftbutton" ng-hide="item.MLCStatusId!=1" ng-click="print()" translate="common.printaction.lbl"></button> -->
                <button id="btnSave" type="button" class="draftbutton" translate="common.saveaction.lbl"
                    ng-click="saveItem()" ng-disabled="Disabled"></button>

            </div>
        </div>
    </div>
</div>
