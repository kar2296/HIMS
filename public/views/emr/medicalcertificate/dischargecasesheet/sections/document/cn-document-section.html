<div class="row page-header">
    <div class="col-sm-10">
        <h4 class="page-header mt0" translate="patientemr.patientdocument-list.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <!-- <button class="btn bt-color3 btn-xs pull-right" uib-tooltip="{{ 'clinicalmaster.serviceitem-list.filter-tooltip.lbl' | translate }}"
                        tooltip-placement="bottom"><i class="fa fa-search fa-xs " aria-hidden="true"></i>&nbsp;&nbsp;<span translate="clinicalmaster.serviceitem-list.filter.lbl"></span>
                </button> -->
        <button class="btn-add" ng-click="addNew()"
            uib-tooltip="{{ 'patientemr.patientdocument-list.addnew-tooltip.lbl' | translate }}"
            tooltip-placement="bottom">
            <i class="fa fa-plus" aria-hidden="true"></i>
        </button>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>

<div class="fooder-bgs">
    <div class="row">
        <div class="pull-left">
            <button type="button" class="btn pyr-color10 btn-sm pull-left" tabindex="-1" ng-click="backToList()">
                <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                <span class="btn-fontsize" translate="common.backaction.lbl"></span>
            </button>
            <ul class="nav navbar-nav pull-left" id="pastnotes">
                <li uib-dropdown="" class="dropdown dropdown-list custom-li">
                    <button uib-dropdown-toggle="" class="draftbutton" ng-disabled="">
                        <span translate="Previous Notes"></span>
                        <!-- <span>
                            <i class="fa fa-caret-up" aria-hidden="true"></i>
                        </span> -->
                    </button>
                    <ul class="dropdown-menu top" role="menu" aria-labelledby="dLabel">
                        <li ng-repeat="item in consultlist| limitTo: currentcontext.recordcount">
                            <a class=" " ng-click="viewConsultation() ">
                                <span>
                                    <i class="fa fa-angle-right " aria-hidden="true "></i>
                                </span>&nbsp;&nbsp;&nbsp;
                                <span class="dr_name0 ">{{item.Encounter.DoctorName}} - </span>
                                <displaydate class="disp_date0 " datetime-val="item.CreatedAt "></displaydate>
                                <span class="dr_profile0 "> - {{item.ProfileMaster.Name}}</span>
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</div>
