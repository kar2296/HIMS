    <div class="container-fluid">
        <favoritecontrol config="favconfig" addclick="addFavorite()" saveclick="saveFavorites()"
            class="header-panel-body"></favoritecontrol>
    </div>
    <div class="row">
        <custom-table config="vm.gridConfig"></custom-table>
    </div>
    <!-- <div ui-grid="vm.gridConfig" class="table-uigrid"></div> -->

    <div class="fooder-bgs">
        <div class="col-sm-6 text-left">
            <button type="button" class="btn pyr-color10 btn-sm pull-left" tabindex="-1" ng-click="backToList()">
                <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                <i class="btn-fontsize" translate="common.backaction.lbl"></i>
            </button>
            <ul class="nav navbar-nav pull-left" id="pastnotes">
                <li uib-dropdown="" class="dropdown dropdown-list custom-li">
                    <button uib-dropdown-toggle="" class="draftbutton" ng-disabled="">
                        <span translate="Previous Notes"></span>
                        <!-- <span>
                                        <i class="fa fa-caret-up" aria-hidden="true"></i>
                                    </span> -->
                    </button>
                    <ul class="dropdown-menu top" role="menu" aria-labelledby="dLabel">
                        <li ng-repeat="item in consultlist| limitTo: currentcontext.recordcount">
                            <a class=" " ng-click="viewConsultation(item) ">
                                <span>
                                    <i class="fa fa-angle-right " aria-hidden="true "></i>
                                </span>&nbsp;&nbsp;&nbsp;
                                <span class="dr_name0 ">{{item.Encounter.DoctorName}} - </span>
                                <displaydate class="disp_date0 " datetime-val="item.CreatedAt "></displaydate>
                                <span class="dr_profile0 "> - {{item.ProfileMaster.Name}}</span>
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>
            <button id="btn" type="button" class="btn bt-color3 btn-sm pull-left" ng-click="labresult()"
                uib-tooltip="{{ 'medicalcertificate.dischargesummary-form.labresult.lbl' | translate }}"
                tooltip-placement="top">
                <i class="fa fa-flask"></i>
            </button>
            <button id="btn" type="button" class="btn bt-color1 btn-sm pull-left ml10" ng-click="radiologyresult()"
                uib-tooltip="{{ 'medicalcertificate.dischargesummary-form.radiology.lbl' | translate }}"
                tooltip-placement="top"><i class="fa fa-file-image-o"></i></button>


        </div>
        <div class="col-sm-6">
            <!-- <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                    ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul> -->
        </div>
    </div>
</div>
