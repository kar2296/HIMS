<!-- <div class="fooder-bg panel-footer formactionbar"> -->
<div class="fooder-bgs">
    <div class="pull-left">
        <button type="button" class="pull-left btn pyr-color10 btn-sm" ng-click="backToList()">
            <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
            <span class="btn-fontsize" translate="common.backaction.lbl"></span>
        </button>
        <ul class="nav navbar-nav pull-left" id="pastnotes">
            <li uib-dropdown="" class="dropdown dropdown-list custom-li">
                <button uib-dropdown-toggle="" class="draftbutton" ng-disabled="">
                    <span translate="Previous Notes"></span>
                    <!-- <span>
                                    <i class="fa fa-caret-up" aria-hidden="true"></i>
                                </span> -->
                </button>
                <ul class="dropdown-menu top" role="menu" aria-labelledby="dLabel">
                    <li ng-repeat="item in sectionData.consultlist| limitTo: currentcontext.recordcount">
                        <a class=" " ng-click="viewConsultation(item) ">
                            <span>
                                <i class="fa fa-angle-right " aria-hidden="true "></i>
                            </span>&nbsp;
                            <span class="dr_name0 ">{{item.Encounter.DoctorName}} - </span>
                            <displaydate class="disp_date0 " datetime-val="item.CreatedAt "></displaydate>
                            <span class="dr_profile0 "> - {{item.ProfileMaster.Name}}</span>
                        </a>
                    </li>
                </ul>
            </li>
        </ul>
        <!-- <button id="btn" type="button" class="btn bt-color3 btn-sm" ng-click="labresult()" uib-tooltip="{{ 'medicalcertificate.dischargesummary-form.labresult.lbl' | translate }}"
                    tooltip-placement="top">
                    <i class="fa fa-flask"></i>
                </button>
                <button id="btn" type="button" class="btn bt-color1 btn-sm" ng-click="radiologyresult()" uib-tooltip="{{ 'medicalcertificate.dischargesummary-form.radiology.lbl' | translate }}"
                    tooltip-placement="top">
                    <i class="fa fa-file-image-o"></i>
                </button> -->
    </div>
    <div class="pull-right">
        <button type="button" class="draftbutton" ng-if="item.ProgressNoteStatusId==2" ng-click="releaseToPatient() ">
            <span translate="patientemr.reviewnotes.releasetopatient.lbl "></span>
        </button>&nbsp;&nbsp;
        <button type="button" class="draftbutton" ng-hide="item.ProgressNoteStatusId==2||item.ProgressNoteStatusId==3"
            ng-click="ApproveNotes() ">
            <span translate="patientemr.reviewnotes.approve.lbl "></span>
        </button>&nbsp;&nbsp;
        <ul class="pull-right nav navbar-nav" id="print">
            <li uib-dropdown="" class="dropdown dropdown-list custom-li">
                <button uib-dropdown-toggle="" class="draftbutton" ng-disabled="" hotkey="{'alt+p': print}">
                    <span translate="common.printaction.lbl"></span>&nbsp;&nbsp;
                    <!-- <span>
                        <i class="fa fa-caret-up" aria-hidden="true"></i>
                    </span> -->
                </button>
                <ul class="dropdown-menu top" role="menu" aria-labelledby="dLabel">
                    <li>
                        <a class="" ng-click="printConsultation2()">
                            <span>
                                <i class="fa fa-angle-right" aria-hidden="true"></i>
                            </span>&nbsp;&nbsp;
                            <span translate="Without Header"></span>
                        </a>
                    </li>
                    <li>
                        <a ng-click="printConsultation()">
                            <span>
                                <i class="fa fa-angle-right" aria-hidden="true"></i>
                            </span>&nbsp;&nbsp;
                            <span translate="With Header"></span>
                        </a>
                    </li>
                </ul>
            </li>
        </ul>
        <!-- <button type="button " id="btnsubmit " class="pull-right btn btn-inverse btn-sm " translate="common.printaction.lbl
                                        " ng-click="printConsultation() "></button> -->
        <button id="btnSave" type="button" class="draftbutton" ng-show="DisplayDCAFPrint" ng-click="printDCAFForm()"
            translate="DCAF"></button>&nbsp;&nbsp;
        <button id="btnSave" type="button" class="draftbutton" ng-show="DisplayOCAFPrint" ng-click="printOCAFForm()"
            translate="OCAF"></button>&nbsp;&nbsp;
        <button id="btnSave" type="button" class="draftbutton" ng-show="DisplayUCAFPrint" ng-click="printUCAFForm()"
            translate="UCAF"></button>&nbsp;&nbsp;
        <button id="btnSave" type="button" class="draftbutton" ng-show="DisplayDCAFPrint"
            ng-click="printDCAFFormWithLabel()" translate="With Label-DCAF"></button>&nbsp;&nbsp;
        <button id="btnSave" type="button" class="draftbutton" ng-show="DisplayOCAFPrint"
            ng-click="printOCAFFormWithLabel()" translate="With Label-OCAF"></button>&nbsp;&nbsp;
        <button id="btnSave" type="button" class="draftbutton" ng-show="DisplayUCAFPrint"
            ng-click="printUCAFFormWithLabel()" translate="With Label-UCAF"></button>&nbsp;&nbsp;
        <button id="btnSave" type="button" class="draftbutton" ng-show="DisplayUCAFVisitPrint"
            ng-click="printUCAFFormVisit()" translate="UCAF Visit"></button>&nbsp;&nbsp;
        <button id="btnSave" type="button" class="draftbutton" ng-show="DisplayDCAFVisitPrint"
            ng-click="printDCAFFormVisit()" translate="DCAF Visit"></button>
    </div>
</div>

                </div>

        </div>

<script type="text/ng-template" id="cn-prescription-section.html">
    <div ng-if="sectionData.prescriptions[0].PrescriptionDetails[0].DrugName" class="row">
        <div class="col-sm-12" style="margin-top:0px;padding:0;">
            <div class="form-group" style="padding:0;">
                <div class="col-sm-4 form-group mb0" style="padding:0;">
                    <h4 class="control-label fontgreen mar_z"   style="padding:0;"translate="patientemr.reviewnotes.prescription.lbl"></h4>
                </div>
            </div>
        </div>
    </div>
    <div ng-if="sectionData.prescriptions.length > 0" ng-repeat="item in sectionData.prescriptions">
        <div class="row" style="padding:9px">
            <!-- <div class="col-sm-3 fontpink">
                <ngformatdate date-val='item.PrescriptionDate'></ngformatdate>
            </div> -->
            <table class="table table-responsive table-bordered">
                <thead ng-if="$index == 0">
                <tr>
                    <th class="col-sm-2 lefcol8">Drugs</th>
                    <th class="col-sm-2 lefcol8">Dosage</th>
                    <!-- <th class="col-sm-2 lefcol8">Route</th> -->
                    <th class="col-sm-2 lefcol8">Frequency</th>
                    <th class="col-sm-2 lefcol8">Duration</th>
                    <th class="col-sm-2 lefcol8">Drug Instruction</th>
                    <th class="col-sm-2 lefcol8">Notes</th>
                </tr>
            </thead>
            <tbody>
               <tr ng-repeat="detail in item.PrescriptionDetails">
                    <td class="col-sm-2"><span class="lefcol1">{{detail.DrugName}}({{detail.DrugCode}})</span></td>
                    <td class="col-sm-2"><span class="lefcol2">{{detail.Dosage}}</span></td>
                    <!-- <td class="col-sm-2"><span class="lefcol4">{{detail.DrugRoute.Description}}</span></td> -->
                    <!-- <td class="col-sm-2"><span class="lefcol3">{{detail.DrugFrequency.Name}}</span></td> -->
                    <td class="col-sm-2"><span class="lefcol3">{{detail.Morning}} - {{detail.Noon}} - {{detail.Night}}</span></td>
                    <td class="col-sm-2"><span class="lefcol5">{{detail.Duration}} {{detail.DurationPeriod.Description}}</span></td>
                    <td class="col-sm-2"><span class="lefcol5">{{detail.DrugInstruction.Description}}</span></td>
                    <td class="col-sm-2"><span class="lefcol5">{{detail.Notes}}</span></td>
               </tr>
               <tr ng-show="item.AdviceInstructions">
                <td>
                  <div style="width:100%">
                    <div style="white-space:nowrap;text-align:left;margin-bottom: 5px;">
                      <span style="text-decoration: underline;">Advice Notes:</span>
                    </div>
                    <div style="white-space:nowrap;text-align:left;margin-bottom: 5px;">
                      <b> {{item.AdviceInstructions}}
                      </b>
                    </div>
                  </div>
                </td>
              </tr>
            </tbody>
            </table>
            <div class="col-sm-12"ng-if="sectionData.prescriptions[0].Diagnosis">
                    <span style="font-size: 15px;" class="col-sm-3">Diagnosis</span>
                    <span class="col-sm-3 fontbold">{{item.Diagnosis}}</span>
