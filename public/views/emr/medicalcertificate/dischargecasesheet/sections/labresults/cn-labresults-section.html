<div class="row page-header">
    <h4 class="mt0" translate="ordermanagement.labresult-list.pagetitle.lbl"></h4>
</div>
</div>
<div class="row">
    <div class="drhms-table-height">
        <table class="table table-hover table-responsive table-bordered">
            <thead class="bg-subhead">
                <tr>
                    <th class="col-sm-1"><span translate="ordermanagement.labresult-list.date.lbl"></span></th>
                    <th class="col-sm-2"><span translate="ordermanagement.labresult-list.profile.lbl"></span>
                    </th>
                    <th class="col-sm-3"><span translate="ordermanagement.labresult-list.testparameters.lbl"></span>
                    </th>
                    <th class="col-sm-4" colspan="2"><span translate="ordermanagement.labresult-list.values.lbl"></span>
                    </th>
                    <th class="col-sm-1"><span translate="ordermanagement.labresult-list.includecasesheet.lbl"></span>
                    </th>
                </tr>
            </thead>
            <tbody ng-repeat="test in currentcontext.woDetails">
                <tr ng-repeat="item in test.details | filter:{Status:1}">
                    <td>
                        <span ng-if="item.ApprovalSubmisdate">
                            <displaydate datetime-val='item.ApprovalSubmisdate'></displaydate>
                        </span>
                    </td>
                    <td>
                        <span ng-if="item.heading" class="btn btn-primary btn-xs">{{item.heading}}</span>
                    </td>
                    <td>
                        <span style="margin-left:24px;  vertical-align: super;
                     color: black; font-weight: 700; white-space:
                      nowrap; text-overflow: ellipsis; overflow: auto;">{{item.Analytename}}</span>
                    </td>
                    <!-- <td colspan="{{item.TestValueType == 3 ? '3' : '1'}}"> -->
                    <td colspan="2">
                        <span style="color: #ff0000; font-weight: 700;"
                            ng-if="item.TestValueType != 3  && item.QualifierId > 1">
                            {{item.Resultvalue}}
                        </span>
                        <span ng-if="item.TestValueType != 3 && (item.QualifierId == null || item.QualifierId == 1)">
                            {{item.Resultvalue}}
                        </span>
                        <span ng-if="item.TestValueType != 3"> &nbsp;&nbsp;&nbsp; {{item.AnalyteUOM}}</span>
                        <span ng-if="item.TestValueType == 3">
                            <span ng-bind-html="item.Resultvalue"></span>
                        </span>
                    </td>
                    <td>
                        <input type="checkbox" class="custom-checkbox" ng-model="item.IsIncludeDischargeSheet">
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="fooder-bgs">
    <div class="row">
        <div class="pull-left">
            <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()">
                <i class="fa fa-angle-left" aria-hidden="true"></i>
                <span class="btn-fontsize"> &nbsp; Back</span>
            </button>
        </div>
        <div class="pull-right">
            <button id="btnSave" type="button" class="draftbutton" translate="common.saveaction.lbl"
                ng-click="saveItem()" ng-disabled="Disabled"></button>

        </div>
    </div>
</div>
