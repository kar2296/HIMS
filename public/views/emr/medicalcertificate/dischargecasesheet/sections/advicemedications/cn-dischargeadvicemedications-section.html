<style>
    button.btn-default-select.ng-pristine.ng-valid {
        background: #F44336;
        border: 0;
        color: #fff;
        border-radius: 4px;
    }

    button.btn-success-select.ng-pristine.ng-valid {
        background: #4CAF50;
        border: 0;
        color: #fff;
        border-radius: 4px;
    }

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div id="" class="emr_manageprescription">
            <table class="table table-hover table-responsive table-bordered">
                <thead class="bg-subhead">
                    <tr>
                        <th class="fs-12 col-sm-3">
                            <span translate="patientemr.dischargesections.drugname.lbl"></span>
                        </th>
                        <th class="fs-12 col-sm-1 cell-align-center">
                            <span translate="patientemr.dischargesections.isfreetext.lbl"></span>
                        </th>
                        <th class="fs-12 col-sm-1">
                            <span translate="patientemr.prescription-form.dosage.lbl"></span>
                            <span class="mandatory-asterix">*</span>
                        </th>
                        <th class="fs-12 ">
                            <span translate="patientemr.prescription-form.frequency.lbl"></span>
                            <span class="mandatory-asterix">*</span>
                        </th>
                        <th class="fs-12 col-md-4 col-lg-2">
                            <span translate="patientemr.prescription-form.duration.lbl"></span>
                            <span class="mandatory-asterix">*</span>
                        </th>
                        <th class="fs-12">
                            <span translate="Route"></span>
                        </th>
                        <th class="fs-12 col-sm-1 cell-align-center">
                            <span translate="patientemr.prescription-form.druginstruct.lbl"></span>
                        </th>
                        <th class="fs-12">
                            <span translate="Notes"></span>
                            <span class="mandatory-asterix">*</span>
                        </th>
                        <th class="fs-12 col-sm-1">
                            <span translate="patientemr.prescription-form.action.lbl"></span>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="item in AdviceMedications | filter:{Status:1}">
                        <td class="fs-12 iconsize">
                            <autosearch controlid="'dgname'" itemid="item.DrugId" iteminfo="item.SelectedItem"
                                name="'drug'" rowdata="item" config="vm.drugcontrolconfig" ng-if="!item.IsFreeText"
                                itemchange="drugChanged($index,item)" class="inputsearchlogo" candisable="IsDisabled"
                                isrequired="true" focus-if>
                            </autosearch>
                            <input type="text" class="form-control" ng-if="item.IsFreeText" ng-disabled="IsDisabled"
                                ng-model="item.DrugName" placeholder="">
                        </td>
                        <td class="fs-12">
                            <input type="checkbox" class="custom-checkbox" ng-click="addNewLineItem()"
                                ng-model="item.IsFreeText" ng-disabled="IsDisabled">
                        </td>
                        <td class="fs-12">
                            <input type="text" class="form-control" ng-disabled="IsDisabled" ng-model="item.Dosage"
                                placeholder="">
                        </td>
                        <td class="fs-12">
                            <input type="text" class="form-control" ng-model="item.FrequencyFreeText"
                                placeholder="">
                        </td>
                        <!-- <td class="fs-12 ">
                            <button class="btn-default-select" ng-if="item.MorningFrequency==false"
                                ng-model="item.MorningFrequency" ng-click="mornfreq(item)">
                                <strong>M</strong>
                            </button>
                            <button class="btn-success-select" ng-if="item.MorningFrequency==true"
                                ng-model="item.MorningFrequency" ng-click="mornfreq(item)">
                                <strong>M</strong>
                            </button>
                            <button class="btn-default-select" ng-if="item.AfterNoonFrequency==false"
                                ng-model="item.AfterNoonFrequency" ng-click="aftfreq(item)">
                                <strong>A</strong>
                            </button>
                            <button class="btn-success-select" ng-if="item.AfterNoonFrequency==true"
                                ng-model="item.AfterNoonFrequency" ng-click="aftfreq(item)">
                                <strong>A</strong>
                            </button>
                            <button class="btn-default-select" ng-if="item.EveningFrequency==false"
                                ng-model="item.EveningFrequency" ng-click="evefreq(item)">
                                <strong>E</strong>
                            </button>
                            <button class="btn-success-select" ng-if="item.EveningFrequency==true"
                                ng-model="item.EveningFrequency" ng-click="evefreq(item)">
                                <strong>E</strong>
                            </button>
                            <button class="btn-default-select" ng-if="item.NightFrequency==false"
                                ng-model="item.NightFrequency" ng-click="nightfreq(item)">
                                <strong>N</strong>
                            </button>
                            <button class="btn-success-select" ng-if="item.NightFrequency==true"
                                ng-model="item.NightFrequency" ng-click="nightfreq(item)">
                                <strong>N</strong>
                            </button>
                        </td> -->
                        <td class="fs-12 input_width1">
                            <input type="text" class="form-control" ng-model="item.Duration" placeholder=""
                                ng-disabled="IsDisabled">
                        </td>
                        <td class="fs-12 input_width1">
                            <input type="text" class="form-control" ng-model="item.Route" placeholder=""
                                ng-disabled="IsDisabled">
                        </td>
                        <!-- <td class="fs-12 input_width1">
                            <ui-select ng-model="item.DurationPeriodId" class="ui-select-period"
                                ng-disabled="IsDisabled">
                                <ui-select-match>
                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                </ui-select-match>
                                <ui-select-choices
                                    repeat="lookupitem.Id as lookupitem in lookup.DurationPeriod | filter: { Text: $select.search }">
                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                </ui-select-choices>
                            </ui-select>
                        </td> -->
                        <td class="fs-12">
                            <ui-select ng-model="item.DrugInstructionId" ng-disabled="IsDisabled"
                                class="ui-select-grid">
                                <ui-select-match>
                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                </ui-select-match>
                                <ui-select-choices
                                    repeat="lookupitem.Id as lookupitem in lookup.DrugInstruction | filter: { Text: $select.search }">
                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                </ui-select-choices>
                            </ui-select>
                        </td>
                        <td class="fs-12 input_width1">
                            <input type="text" class="form-control" ng-model="item.Notes" placeholder=""
                                ng-disabled="IsDisabled">
                        </td>
                        <td>
                            <!--<button class="btn-success-select btn-xs" tabindex="-1" ng-click="editPrescriptionDetail(item)">
                                        <i class="fa fa-pencil" aria-hidden="true"></i>
                                    </button>-->
                            <button class="drhms-edit-button" tabindex="-1"
                                ng-click="deletePrescriptionDetail($index,item)" ng-disabled="IsDisabled">
                                <img src="assets/svg/delete.svg" alt="">
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="">
            <div class="col-sm-6 form-group">
                <label class="col-sm-12 control-label ng-scope active_instruction h4" for="advice"
                    translate="Comments">
                </label>
                <div class="col-sm-8">
                    <textarea rows="3" name="details" ng-model="item.Comments" maxlength="4000"
                        class="notes-textarea"></textarea>
                </div>
            </div>
        </div>
    </form>
</div>

            <button type="button" class="btn pyr-color10 btn-sm" tabindex="-1" ng-click="backToList()">
                <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                <span class="btn-fontsize" translate="common.backaction.lbl"></span>
            </button>

            tooltip-placement="top">
            <i class="fa fa-flask"></i>
        </button>
        <button id="btn" type="button" class="btn bt-color1 btn-sm" ng-click="radiologyresult()" uib-tooltip="{{ 'medicalcertificate.dischargesummary-form.radiology.lbl' | translate }}"

            <i class="fa fa-file-image-o"></i>
        </button> -->
        </div>
        <div class="pull-right">
            <button id="btnSave" type="button" class="draftbutton" translate="common.saveaction.lbl"
                ng-click="saveItem()"></button>
        </div>
    </div>
</div>
