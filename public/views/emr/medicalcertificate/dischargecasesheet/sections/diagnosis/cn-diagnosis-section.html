    <div class="row">
        <div class="panel-body form-panel pd5">
            <div class="row">
                <div class="col-sm-12">
                    <div class="form-group col-sm-4">
                        <label class="col-sm-12 control-label" for="otherdiagnosis"
                            translate="patientemr.patientdiagnosis-list.otherdiagnosis.lbl"></label>
                        <div class="col-sm-12">
                            <textarea rows="3" name="otherdiagnosis" ng-model="item.OtherDiagnosis"
                                maxlength="1000"></textarea>
                        </div>
                    </div>
                    <div class="form-group col-sm-4">
                        <label class="col-sm-12 control-label filter-lbl"
                            translate="patientemr.patientdiagnosis-list.icd.lbl"></label>
                        <div class="col-sm-12">
                            <autosearch id='provisionaldiagnosis' itemid="item.DiagnosisId" iteminfo="item.selectedItem"
                                rowdata="item" config="vm.diagnosiscontrolconfig" itemchange="" tabindex="-1">
                            </autosearch>
                        </div>
                    </div>

                    <div class="form-group col-sm-4">
                        <label class="col-sm-12 control-label" for="conditiontype"
                            translate="patientemr.patientcondition-form.conditiontype.lbl"></label>
                        <div class="col-sm-12">
                            <ui-select id="conditiontype" ng-model="item.ConditionTypeId" name="conditiontype">
                                <ui-select-match>
                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                </ui-select-match>
                                <ui-select-choices
                                    repeat="lookupitem.Id as lookupitem in lookup.ConditionType | filter: { Text: $select.search }">
                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                </ui-select-choices>
                            </ui-select>
                        </div>
                    </div>
                </div>
                <div class="col-sm-12">
                    <div class="pull-right">
                        <button type="submit" class="draftbutton" ng-click="AddPatientCondition()"
                            ng-disabled="ConsultData.ProgressNoteStatusId==2 || Disabled"
                            translate="common.saveaction.lbl"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <custom-table config="vm.gridConfig"></custom-table>
    <div class="container-fluid">
        <!-- <div ui-grid="vm.gridConfig" class="table-uigrid"></div> -->
        <div class="fooder-bgs" style="margin-bottom: 8px !important;">
            <div class="row">
                <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
                    items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                    ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
            </div>
        </div>
    </div>
</div>
