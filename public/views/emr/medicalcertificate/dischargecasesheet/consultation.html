<link rel="stylesheet" href="app/css/drhms.css">
<style>
    .field {
        height: 40px;
    }

    .nav-tabs {
        border-bottom: unset !important;
        display: flex;
        justify-content: flex-start;
        flex-wrap: wrap;
    }
</style>
<script type="text/ng-template" id="cn-dummy.html">
    <div class="col-sm-12">
        No data found!
    </div>
</script>

<div class="row page-header">
    <!-- <h4 class="mt0" translate="patientemr.consultation-list.dischargesummary.lbl"></h4>-->
    <h4 class="mt0" translate="patientemr.consultation-list.dischargenotes.lbl"></h4>
</div>
<div class="row">
    <ippatientbanner patientid="currentcontext.pid" encounterid="currentcontext.eid">
    </ippatientbanner>
</div>
<div class="row">
    <div class="col-sm-4 field">
        <label class="col-sm-4" for="doa" translate="DOA"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control doaupdate" name="doa" ng-date-object
                datetime-picker="{{datePickerOptions.dateTimeFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-model="item.AdmissionDate" ng-click="dobPopup = { opened: true }" is-open="dobPopup.opened">
        </div>
    </div>
    <div class="col-sm-4 field">
        <label class="col-sm-4" for="drname" translate="Doctor"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" name="drname" ng-disabled="true" ng-model="item.Doctor">
        </div>
    </div>
    <div class="col-sm-4 field">
        <label class="col-sm-4" for="dos" translate="DOS"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" name="dos" ng-date-object
                datetime-picker="{{datePickerOptions.dateTimeFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-model="item.SurgeryDate" ng-click="dobPopup1 = { opened: true }" is-open="dobPopup1.opened">
        </div>
    </div>
    <div class="col-sm-4 field">
        <label class="col-sm-4" for="dod" translate="DOD"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" name="dod" ng-date-object
                datetime-picker="{{datePickerOptions.dateTimeFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-model="item.DischargeDate" ng-click="dobPopup2 = { opened: true }" is-open="dobPopup2.opened">
        </div>
    </div>
    <div class="col-sm-4 field">
        <label class="col-sm-4" for="dischargetype" translate="Discharge Type"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" name="dischargetype" ng-disabled="true"
                ng-model="item.DischargeType.Description">
        </div>
    </div>

    <div class="col-sm-4 field">
        <label class="col-sm-4" for="status" translate="Status"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" name="status" ng-disabled="true"
                ng-model="item.ProgressNoteStatus.Description">
        </div>
    </div>
    <button class="btn-add" ng-if="canUpdatePatientEMR()" uib-tooltip="Discharge Notes Update"
        tooltip-placement="bottom" ng-click="addNew()">
        <i class="fa fa-refresh" aria-hidden="true"></i>
    </button>
    <span class="drhms-billing-btn drhms-outstandingbill-btn" ng-click="doctor_dashboard()"
        uib-tooltip="Doctor Dashboard" tooltip-placement="bottom">
        <i class="fas fa-th-large" aria-hidden="true"></i>
    </span>
</div>
<div ng-show="cncontext.canshowaddnew">
    <div class="row" style="padding: 5px; border: 1px solid gray;border-radius: 5px;">
        <div class="col-sm-4 form-group">
            <label class="col-sm-5 control-label" translate="patientemr.consultation.profile.lbl"></label>
            <div class="col-sm-7">
                <ui-select ng-model="item.ProfileId">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Profile | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-5 control-label" translate="patientemr.consultation.consultationname.lbl"></label>
            <div class="col-sm-7">
                <input type="text" class="form-control" name="cosultationname" ng-model="item.Name" placeholder="">
            </div>
        </div>
        <div class="col-sm-4">
            <button ng-if="canUpdatePatientEMR()" class="draftbutton" type="button" ng-click="saveItem()">Save</button>
            <button class="draftbutton" type="button" ng-click="closeConsultModal()">Cancel</button>
        </div>
    </div>
</div>
<div ng-show="cncontext.canshowuserpref">
    <div class="row" style="padding: 5px; border: 1px solid gray;border-radius: 5px;">
        <div class="col-sm-4 form-group">
            <label class="col-sm-5 control-label" translate="patientemr.consultation.profile.lbl"></label>
            <div class="col-sm-7">
                <ui-select ng-model="prefcontext.profileid" ng-change="profilePrefChanged($select.selected)">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Profile | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4">
            <button ng-if="canUpdatePatientEMR()" class="draftbutton" type="button"
                ng-click="saveUserPref()">Save</button>
            <button class="draftbutton" type="button" ng-click="closeUserPref()">Cancel</button>
        </div>
        <div class="col-sm-4">
        </div>
    </div>
</div>
<div class="row">
    <div class="col-sm-12">
        <div class="col-sm-12">
            <uib-tabset active="active">
                <uib-tab index="$index" ng-repeat="item in cncontext.tabstop" heading="{{item.title}}"
                    ng-click="switchTopTab(item)"></uib-tab>
            </uib-tabset>
        </div>
        <div class="col-sm-12 side_popup">
            <div class="col-sm-12 tab-content-div">
                <tab ng-show="cncontext.currentsection" currentsection="cncontext.currentsection"></tab>
            </div>
        </div>
    </div>
</div>
