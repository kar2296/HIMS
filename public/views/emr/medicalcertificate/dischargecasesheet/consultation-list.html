<div class="row page-header">
    <div class="col-sm-6">
        <h4 class=" mt0" translate="patientemr.dischargecasesheetlist.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-6">
        <span class="drhms-billing-btn drhms-outstandingbill-btn" ng-click="doctor_dashboard()"
            uib-tooltip="{{'patientemr.pmhxdashboard.doctordashboard.lbl' | translate}}" tooltip-placement="bottom">
            <i class="fas fa-th-large" aria-hidden="true"></i>
        </span>
        <button class="btn-add" ng-if="canUpdatePatientEMR()" uib-tooltip="Discharge Notes" tooltip-placement="bottom"
            ng-click="addNew()">
            <i class="fa fa-plus" aria-hidden="true"></i>
        </button>
        <span class="drhms-billing-btn drhms-home-btn" ng-click="currentpatient()"
            uib-tooltip="{{'bedmanagement-grid.pagetitle.lbl' | translate}}" tooltip-placement="bottom">
            <i class="fas fa-hospital-alt"></i>
        </span>
    </div>
</div>
<div class="row">
    <ippatientbanner patientid="currentcontext.pid" encounterid="currentcontext.eid"></ippatientbanner>
</div>
<div class="row">
    <div class="col-sm-4">
        <label class="col-sm-4" translate="ordermanagement.labresult-list.filter_from.lbl"></label>
        <div class="col-sm-8">
            <div class="datepicker">
                <input type="text" class="form-control" name="from" datepicker-options="datePickerOptions"
                    show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}" ng-change="getList()"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                    is-open="fromdatePopup.opened" ng-model="currentfilter.fromdate">
                <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
        </div>
    </div>
    <div class="col-sm-4">
        <label class="col-sm-4" translate="ordermanagement.labresult-list.filter_to.lbl"></label>
        <div class="col-sm-8">
            <div class="datepicker">
                <input type="text" class="form-control" name="to" datepicker-options="datePickerOptions"
                    show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}" ng-change="getList()"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
                    is-open="todatePopup.opened" ng-model="currentfilter.todate">
                <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
