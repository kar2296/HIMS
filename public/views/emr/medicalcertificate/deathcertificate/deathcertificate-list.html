<style>
    .pl-3 {
        padding-left: 3%;
    }
</style>
<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="medicalcertificate.dischargesummary-form.deathcertificate.lbl"></h4>
    <div class="col-sm-6">
        <button class="btn bt-color3 btn-xs pull-right btn-filter" ng-click="" uib-tooltip="{{ '  clinicalmaster.serviceitem-list.filter-tooltip.lbl' | translate}}"
            tooltip-placement="bottom"><i class="fa fa-filter" aria-hidden="true"></i>&nbsp;&nbsp;<span translate="clinicalmaster.serviceitem-list.filter.lbl"></span></button>
        <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addNew()" uib-tooltip="{{'Death Certificate' }}" tooltip-placement="bottom"><i class="fa fa-plus" aria-hidden="true"></i><span translate="clinicalmaster.serviceitem-list.addnew.lbl"></span></button>
    </div>
</div>
<div class="row filter-area">
    <div class="col-sm-12">
        <div class="col-sm-3">
            <div class="form-group">
       <label class="sr-only col-sm-5 control-label filter-lbl" translate="medicalcertificate.dischargesummary-list.name/mrn.lbl"></label>
                <div class="input-group col-sm-7">
                    <div class="input-group-addon"><i class="fas fa-search" aria-hidden="true"></i></div>
                    <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.namemrn" placeholder=" NAME/MRN">
                </div>
            </div>
        </div>
        <div class="col-sm-3">
            <div class="form-group">
                <label class="sr-only col-sm-5 col-md-4 control-label filter-lbl" translate="medicalcertificate.dischargesummary-list.ipno.lbl"></label>
                <div class="input-group col-sm-7 col-md-8">
                    <div class="input-group-addon"><i class="fas fa-search" aria-hidden="true"></i></div>
                    <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.visitid" placeholder="IP No">
                </div>
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-5 col-md-4 control-label filter-lbl" translate="medicalcertificate.dischargesummary-list.filter_dateofdischarge.lbl"></label>
            <div class="col-sm-7 col-md-8">
                <input type="text" class="form-control" name="dateofbirth" ng-change="getList()" datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}" ng-click="dateofbirthPopup = { opened: true }"
                    is-open="dateofbirthPopup.opened" ng-model="currentfilter.DischargeDate">
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-5 col-md-4 control-label filter-lbl" translate="registration.patientsearch.filter_status.lbl"></label>
            <div class="col-sm-7 col-md-8">
                <ui-select ng-model="currentfilter.CertificateStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.CertificateStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </div>
    <div class="col-sm-12 searchpadding ">
        <div class="col-sm-3">
            <div class="form-group">
                <label class=" sr-only col-sm-5 control-label filter-lbl" translate="registration.patientsearch.filter_phoneno.lbl"></label>
                <div class="input-group col-sm-7">
                    <div class="input-group-addon"><i class="fas fa-search" aria-hidden="true"></i></div>
                    <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.phoneno" placeholder="Phone No">
                </div>
            </div>
        </div>
        <div class="col-sm-3">
            <div class="form-group">
            <label class="col-sm-5 col-md-4 control-label filter-lbl" translate="medicalcertificate.dischargesummary-list.filter_doctor.lbl"></label>
            <div class="input-group col-sm-7 col-md-8">
                <ui-select ng-model="currentfilter.DoctorId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Doctor | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
     </div>
        <div class="col-sm-3">
            <label class="col-sm-5 col-md-4 control-label filter-lbl" translate="medicalcertificate.dischargesummary-list.adminstatus.lbl"></label>
            <div class="col-sm-7 col-md-8">
                <ui-select ng-model="currentfilter.admissionstatusid" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.AdmissionStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-5 col-md-4 control-label filter-lbl" translate="medicalcertificate.dischargesummary-list.ward.lbl"></label>
            <div class="col-sm-7 col-md-8">
                <ui-select ng-model="currentfilter.WardId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Ward | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <!--<div class="col-sm-2">
                    <button class="btn btn-default btn-sm pull-right" ng-click="addNew()">
                        <i class="fa fa-plus" aria-hidden="true"></i>
                    </button>
                    <button class="btn btn-default btn-sm pull-right btn-filter">
                        <i class="fa fa-filter" aria-hidden="true"></i>
                    </button>-->
    </div>
</div>
<div class="container-fluid onerow-filter" id="patientsearchheight">
    <div ui-grid="vm.gridConfig" class="table-uigrid height-control"></div>
    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage"></ul>
        </div>
    </div>
</div>
