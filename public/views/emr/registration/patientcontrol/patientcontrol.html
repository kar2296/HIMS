<style>
    .search-container {
        height: 400px;
        width: 100%;
        background: url(app/img/doctor.jpg) center;
        background-size: cover;
        background-repeat-x: no-repeat;
    }

    .overlay {
        background: #0000006b;
        height: 400px;
    }

    .item-center-row {
        height: 400px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: absolute;
        width: 100%;
        top: 0;
        flex-direction: column;
    }

    .d-flex {
        display: flex;
    }

    input[type="text"] {
        border: unset !important;
        border-radius: unset;
    }

    .d-flex.ip {
        background: white;
        width: 700px;
        align-items: center;
    }

    .d-flex.ip input:nth-child(4) {
        width: 35%;
    }

    .d-flex.ip input:nth-child(2) {
        width: 100%;
        border-right: 1px solid !important;
    }

    .d-flex.ip input {
        margin: 5px !important;
        background: white !important;
        box-shadow: unset !important;
    }

    .thumb-img {
        width: 75px;
        height: 75px;
    }

    .thumb-img img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 50%;
    }

    .detail h3 {
        margin: 0 !important;
        font-size: 16px !important;
        font-weight: 600 !important;
        color: black !important;
        text-align: left;
        padding: 0 !important;
    }

    h4 {
        font-size: 14px !IMPORTANT;
        color: #938c8c;
    }

    p.highlight {
        background: #FF9800;
        color: white;
        text-align: center;
        font-size: 16px !important;
        border-radius: 13px;
    }

    h5 {
        font-size: 12px !important;
        text-align: center;
        font-weight: 600 !IMPORTANT;
        color: gray;
    }

    .vitals p {
        font-size: 11px;
        font-weight: 600;
    }

    .card {
        margin: 10px;
    }

    i.fa.fa-map-marker {
        color: #e14747;
        margin-right: 15px;
        margin-left: 15px;
    }

    i.fa.fa-search {
        color: #4c7593;
        margin-right: 15px;
        margin-left: 15px;
    }

    .city {
        background: white;
        width: 700px;
        margin: 0;
        height: 40px;
    }

    .flex {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .d-flex.ip {
        box-shadow: 0px 3px 4px 0px #dcdbdb;
        z-index: 999;
    }

    .flex span {
        font-weight: 600;
        padding-left: 10px;
        padding-top: 4px;
    }
    .vitals {
    text-align: center;
}
</style>
<section class="patientcontrol">
    <div class="search-container">
        <div class="overlay"></div>
        <div class="item-center-row">
            <div class="d-flex ip">
                <i class="fa fa-search"></i> <input type="text" name="" id="" placeholder="search..">
                <i class="fa fa-map-marker"></i><input type="text" name="" id="" placeholder="Location">
            </div>
            <div class="row city">
                <div class="col-sm-3">
                    <div class="flex">
                        <input type="checkbox" name="" id=""> <span> Chennai </span>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="flex">
                        <input type="checkbox" name="" id=""> <span> Bangalore </span>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="flex">
                        <input type="checkbox" name="" id=""> <span> Coimbatore </span>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="flex">
                        <input type="checkbox" name="" id=""> <span> Mumbai </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="pat-info">
        <div class="row">
            <div class="col-sm-4" ng-repeat="item in patientdetails">
                <div class="card">
                    <div class="row">
                        <div class="col-sm-3">
                            <div class="thumb-img">
                                <img src="app/img/care img/pat3.png" alt="">
                            </div>
                        </div>
                        <div class="col-sm-5">
                            <div class="detail">
                                <h3>{{item.Patient.FirstName}}</h3>
                                <h4>{{item.Patient.City}}</h4>
                                <h4>Diabetic Stage 3</h4>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <p class="highlight">Normal</p>
                            <h5>Admitted</h5>
                            <h4 align="center">
                                <displaydate date-val="item.AdmissionDate"></displaydate>
                            </h4>
                        </div>
                    </div>
                    <hr>
                    <div class="row vitals">
                        <div class="col-sm-3">
                            <p>Heart rate</p>
                            <div>
                                <img src="app/img/heart-beat.png" alt="">
                            </div>
                            <div>120</div>
                        </div>
                        <div class="col-sm-3">
                            <p>Blood Pressure</p>
                            <div>
                                <img src="app/img/blood-pressure.png" alt="">
                            </div>
                            <div>120</div>
                        </div>
                        <div class="col-sm-3">
                            <p>Temprature</p>
                            <div>
                                <img src="app/img/thermometer.png" alt="">
                            </div>
                            <div>120</div>
                        </div>
                        <div class="col-sm-3">
                            <p>Blood Glucose</p>
                            <div>
                                <img src="app/img/glucose-meter.png" alt="">
                            </div>
                            <div>120</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<div class="fooder-bgs">

</div>
