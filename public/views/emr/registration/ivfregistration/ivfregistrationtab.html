<style>
    .patient-options {
    border: 1px solid #B6B6B6;
    height: 102px;
    display: flex;
    align-items: center;
    margin-left: -12px;
    justify-content: center;
}
.patient-options button {
    margin-right: 10px;
}
</style>
<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-8 col-md-8 col-lg-8">
            <h4 class="page-header mt0" translate="IVF Registration"></h4>
        </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <div class="filters">
                <div class="search">
                    <patientsearch controlid="'pidreg'" ng-keyup="moveHeaderFocus('pid')" patientid="item.PatientId"
                        class="logo list" name="txtpatientsearch" patientinfo="selectedPatient"
                        patientchange="patientChange()" aria-placeholder="Patient Search"
                        tabindex="tabindexmap.patienttabindex" isdisabled="{{SaveCompleted}}"
                        filterconfig="patientfilterconfig"></patientsearch>
                    <div class="drhms-search-icon"><i class="fas fa-search" aria-hidden="true"></i></div>
                </div>
                <button class="btn-add" tabindex="-1" ng-click="addNewFull()">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </div>
</div>
<div id="receipt_tab">
    <div class="row">
        <div class="col-sm-12">
            <uib-tabset active="active">
                <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)"
                    disable="tab.canDisable">
                </uib-tab>
            </uib-tabset>

            <div ui-view></div>
        </div>
    </div>
</div>
