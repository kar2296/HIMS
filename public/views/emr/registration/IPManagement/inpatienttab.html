<style>
    .tab-content {
        margin-bottom: 0 !important;
    }
</style>
<div class="row page-header" id="assets">
    <h3 class="col-sm-10 mt0 active" translate="registration.inpatients.pagetitle.lbl"></h3>
    <div class="col-sm-2">
        <span class="drhms-billing-btn drhms-outstandingbill-btn" ng-click="doctor_dashboard()"
            uib-tooltip="Doctor Dashboard" tooltip-placement="bottom">
            <i class="fas fa-th-large" aria-hidden="true"></i>
        </span>

        <!-- <img src="app/img/main/speedometer.png" ng-click="doctor_dashboard()" class="drhms-dashboard-icon" alt="home"
            uib-tooltip=" Doctor Dashboard " tooltip-placement="bottom"> -->
    </div>
</div>
<div id="receipt_tab">
    <div class="row">
        <div class="col-sm-12">
            <uib-tabset active="active" id="assettabs">
                <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)"
                    disable="tab.canDisable">
                </uib-tab>
            </uib-tabset>
            <div ui-view></div>
        </div>
    </div>
</div>
