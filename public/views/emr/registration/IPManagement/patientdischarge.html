<div class="row">
    <div class="form-group col-sm-3">
        <label class="col-sm-12 control-label" translate="Name"></label>
        <div class="col-sm-12">
            <div class="search">
                <input type="text" id="pid" class="form-control" on-enter="getList()" ng-model="currentfilter.patientnamemrn" placeholder="NAME/MRN">
                <i class="fas fa-search" aria-hidden="true"></i>
            </div>
        </div>
    </div>
    <!-- <div class="form-group col-sm-4">
        <label class="col-sm-12 control-label" translate="DOD"></label>
        <div class="col-sm-12">
            <div id="datepicker">
                <input type="text" class="form-control" name="dateofbirth" ng-change="getList()"
                    datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="dateofbirthPopup = { opened: true }"
                    is-open="dateofbirthPopup.opened" ng-model="currentfilter.DOD">
            </div>
        </div>
    </div> -->
    <div class="form-group col-sm-3">
        <label class="col-sm-12 control-label" for="from" translate="From"></label>
        <div class="col-sm-12">
            <div id="datepicker">
                <input type="text" class="text-box form-control" ng-date-object datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}" uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="targetfrom = { opened: true }" is-open="targetfrom.opened" ng-disabled="isViewMode" ng-model="currentfilter.From" ng-change="getList()" tabindex="tabindexmap.patienttabindex">
            </div>
        </div>
    </div>
    <div class="form-group col-sm-3">
        <label class="col-sm-12 control-label" for="to" translate="To"></label>
        <div class="col-sm-12">
            <div id="datepicker">
                <input type="text" class="form-control" name="to" ng-change="getList()" datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}" ng-click="toPopup = { opened: true }"
                    is-open="toPopup.opened" ng-model="currentfilter.To">
            </div>
        </div>
    </div>
    <div class="form-group col-sm-3">
        <label class="col-sm-12 control-label" translate="Ward"></label>
        <div class="col-sm-12">
            <ui-select ng-model="currentfilter.WardId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Ward | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
</div>
<div class="fooder-bgs">
    <div class="row">
        <custom-table config="vm.gridConfig"></custom-table>
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
