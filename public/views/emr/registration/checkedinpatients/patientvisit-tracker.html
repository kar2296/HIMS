<style>
    .durationtxt {
        width: 50px !important;
        float: left;
        margin-right: 5px;
    }

    .popup_tracker_scroll {
        overflow: inherit !important;
    }

    .followupdropdown ul {
        max-height: 90px !important;
    }

    ul.uib-datepicker-popup.dropdown-menu {
        overflow: inherit;
    }

    .modal-dialog.modal-lg ul.uib-datepicker-popup.dropdown-menu.ng-scope {
        left: 328px !important;
        display: block;
        overflow: inherit;
        position: fixed;
        top: 249px !important;
        width: 385px;
    }
    th, td {
    border: 1px solid black;
    padding: 0px !important;
}
</style>
<div class="modal-header custom-modal-header 1">
    <h4 class="modal-title custom-modal-title" translate="registration.patienttracker.pagetitle.lbl"></h4>
</div>
<patientbanner patientid="currentcontext.pid"></patientbanner>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot">
                <div class="panel-body form-panel popup_tracker_scroll">
                    <div class="col-sm-12">
                        <div class="col-sm-12">
                            <div class="well">
                                <!--
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="assignto" translate="Present User"></label>
                                    <div class="doct col-sm-8">
                                        {{currentcontext.DoctorName}}
                                    </div>
                                </div>
                                -->
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="assignto"
                                        translate="registration.patienttracker.newconsultationto.lbl"></label>
                                    <div class="col-sm-8">
                                        <radiogroupcontrol itemid="item.AssignTo" items="vm.AssignToOptions">
                                        </radiogroupcontrol>
                                    </div>
                                </div>
                                <div class="form-group" ng-show="canShowDoctor()">
                                    <label class="col-sm-4 control-label" for="doctor"
                                        translate="registration.patienttracker.doctor.lbl"></label>
                                    <div class="col-sm-8">
                                        <ui-select ng-model="item.AssignedUserId" name="doctor"
                                            ng-change="onUserChange($select.selected)">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices
                                                repeat="lookupitem.Id as lookupitem in lookup.User | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group" ng-show="canShowDepartment()">
                                    <label class="col-sm-4 control-label" for="department"
                                        translate="registration.patienttracker.department.lbl"></label>
                                    <div class="col-sm-8">
                                        <ui-select ng-model="item.DepartmentId" name="department">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices
                                                repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group" ng-show="canShowRoom()">
                                    <label class="col-sm-4 control-label" for="room"
                                        translate="registration.patienttracker.room.lbl"></label>
                                    <div class="col-sm-8">
                                        <ui-select ng-model="item.AssignedRoomId" name="room"
                                            ng-change="onRoomChange($select.selected)">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices
                                                repeat="lookupitem.Id as lookupitem in lookup.Room | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="notes"
                                        translate="registration.patienttracker.notes.lbl"></label>
                                    <div class="col-sm-8">
                                        <textarea class="form-control" ng-model="item.TrackerNotes"></textarea>
                                    </div>
                                </div>
                                <!--
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="comments" translate="registration.patienttracker.comments.lbl"></label>
                                    <div class="col-sm-8">
                                        <commentscontrol comments="item.TrackerComments"></commentscontrol>
                                    </div>
                                </div>
                                -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div class="footer-bgs" style="margin-bottom: 43px;margin-right: 7px;">
    <div class="pull-right">
        <button type="button" ng-click="saveItem()" class="draftbutton"
            translate="common.saveaction.lbl"></button>
        <!-- <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()"
            translate="common.cancelaction.lbl"></button> -->
    </div>
</div>
