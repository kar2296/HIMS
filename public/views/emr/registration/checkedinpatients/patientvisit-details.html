<style>
    .filter-area {
        padding-top: 0px !important;
    }

    #mainresponsivetablecontrol .height-controler {
        height: 250px;
    }

    patientbanner .col-sm-11.fontctrl span {
        color: #fff;
    }

    .panel-favorite .panel-body,
    .ui-grid-viewport {
        box-shadow: unset !important;
    }

    #mainresponsivetablecontrol .bg-subhead,
    .ui-grid-header-viewport {
        background: #2c6875 !important;
    }
</style>

<div class="modal-header custom-modal-header">
    <!-- <strong>
        <span class="modal-title custom-modal-title" translate="registration.findpreviousvisits.pagetitle.lbl"></span>
    </strong> -->
    <div class="col-sm-6">
        <h4 class="mt0 col-sm-12" translate="registration.findpreviousvisits.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-6">
            <div class="filters">
                <img src="../../../../../assets/svg/close.svg"  ng-click="cancelCallback()">
            </div>
        </div>
</div>
<div class="bg-pattern  padding-top5">
    <div class="row  container-fluid filter-area">
        <patientbanner patientid="currentcontext.pid"></patientbanner>
    </div>
    <div class="row  container-fluid filter-area" id="mainresponsivetablecontrol">
        <div class="height-controler">
            <table class="table table-hover table-responsive table-bordered">
                <thead class="bg-subhead">
                    <tr>
                        <!--
                        <th class="col-sm-1">
                            <span translate="registration.findpreviousvisits.visitno.lbl"></span>
                        </th>
                        -->
                        <th class="col-sm-1">
                            <span translate="registration.findpreviousvisits.visitdate.lbl"></span>
                        </th>
                        <!--
                        <th class="col-sm-1">
                            <span translate="registration.findpreviousvisits.claimno.lbl"></span>
                        </th>
                        -->
                        <th class="col-sm-2">
                            <span translate="registration.findpreviousvisits.doctor.lbl"></span>
                        </th>
                        <th class="col-sm-2">
                            <span translate="registration.findpreviousvisits.department.lbl"></span>
                        </th>
                        <th class="col-sm-3">
                            <span translate="registration.findpreviousvisits.cheifcomplaint.lbl"></span>
                        </th>
                        <th class="col-sm-3">
                            <span translate="registration.findpreviousvisits.diagnosis.lbl"></span>
                        </th>
                        <th class="col-sm-1">
                            <span translate="registration.findpreviousvisits.action.lbl"></span>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="visit in PastVisits">
                        <!--
                        <td>
                            <span class="form-control input-sm pull-left">{{ visit.VisitIdentifier }}</span>
                        </td>
                        -->
                        <td>
                            <span class="form-control input-sm pull-left">{{ visit.AdmissionDate &nbsp;|&nbsp; date :
                                'dd-MMM-yyyy' }}</span>
                        </td>
                        <!--
                        <td>
                            <span class="form-control input-sm pull-right">{{ visit.ClaimNo }}</span>
                        </td>
                        -->
                        <td>
                            <span class="form-control input-sm pull-right">{{ visit.DoctorName }}</span>
                        </td>
                        <td>
                            <span class="form-control input-sm pull-right">{{ visit.Department.DepartmentName }}</span>
                        </td>
                        <td>
                            <span class="form-control input-sm pull-right">{{ visit.complaints }}</span>
                        </td>
                        <td>
                            <span class="form-control input-sm pull-right">{{ visit.OtherDiagnosis }}</span>
                        </td>
                        <td>
                            <span class="form-control input-sm pull-right"><input type="checkbox"
                                    class="custom-checkbox" ng-model="visit.IsMLC" /></span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="row">
            <div class="col-sm-12 fullreg-profiles">
            </div>
        </div>
    </div>
    <div class="fooder-bgs" style="margin-bottom:52px">
        <div class="col-sm-12">
            <div class="col-sm-6">
                <div class="pull-left">
                    <button id="btnNotShownForm" type="button" class="draftbutton" ng-click="notshown()"
                        translate="common.notshownkey.lbl"></button>
                    <button id="btnNewConsultationForm" style="    width: 121px;" type="button"
                        class="draftbutton" ng-click="newconsultation()"
                        translate="common.newconsultationkey.lbl"></button>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="pull-right">
                    <button id="btnYesForm" type="button" class="draftbutton" ng-click="yes()"
                        translate="common.yeskey.lbl"></button>
                    <!-- <button id="btnCancelForm" type="button" class="draftbutton" ng-click="cancelCallback()"
                        translate="common.cancelaction.lbl"></button> -->
                </div>
            </div>
        </div>
    </div>
</div>
