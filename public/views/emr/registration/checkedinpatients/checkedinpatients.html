    <script type="text/ng-template" id="checkedinPatientsTemplate.html">
        <div class="custom_scroll">
        <div class="patientprofilebg">
            <div class="col-sm-12 block resp_pad">
                <div class="ui-grid-cell-contents">
                    <div class="col-xs-2 col-sm-2 col-md-1 col-lg-1 pat_img ">
                        <span ng-show="!row.entity.Patient.PhotoPath">
                            <img src="app/img/main/no-img-female.png" class="img-responsive image-height pat_imgg" ng-if="row.entity.Patient.GenderId == 2">
                            <img src="app/img/main/no-img-icon.png" class="img-responsive image-height" ng-if="row.entity.Patient.GenderId != 2">
                        </span>
                        <img class="img-responsive image-height" ng-show="row.entity.Patient.PhotoPath && row.entity.Patient.Photo" data-ng-src="data:image/png;base64,{{row.entity.Patient.Photo}}"
                        />
                    </div>
                    <div class="col-xs-8 col-sm-7 col-md-7 col-lg-4 block cont_padding">
                        <div class="nameinfo"> {{row.entity.Patient.Title.Description}} {{row.entity.Patient.FirstName}} {{row.entity.Patient.LastName}}</div>
                        <div class="nameinfo">
                            <span class="nameinfo mrninfo">MRN - {{row.entity.Patient.MRN ? row.entity.Patient.MRN : 'N/A' }}</span> &nbsp; | &nbsp; {{row.entity.Patient.Gender.Description
                            ? row.entity.Patient.Gender.Description : 'N/A'}} &nbsp; | &nbsp; {{row.entity.Patient.Age ?
                            ((row.entity.Patient.Age
                            <=1 ) ? row.entity.Patient.Age + 'Yr': row.entity.Patient.Age + ' Yrs') : 'N/A' }} &nbsp; | &nbsp; {{row.entity.Patient.DOB
                                ? (row.entity.Patient.DOB| date : 'dd-MMM-yyyy') : 'N/A'}} </div>
                                <div class="contactinfo" ng-if='row.entity.Patient.AddressLine1 || row.entity.Patient.AddressLine2'>
                                    <i class="fa fa-envelope text-address"></i> : &nbsp; {{row.entity.Patient.AddressLine1 + ',' }} {{row.entity.Patient.AddressLine2
                                    ? row.entity.Patient.AddressLine2 + ',' : ""}} {{row.entity.Patient.Area ? row.entity.Patient.Area
                                    + ',' : ""}} {{row.entity.Patient.City ? row.entity.Patient.City + ',' : ""}} {{row.entity.Patient.State
                                    ? row.entity.Patient.State + ',' : ""}} {{row.entity.Patient.Country ? row.entity.Patient.Country
                                    : ""}}
                                </div>
                                <div class="contactinfo" ng-if='!row.entity.Patient.AddressLine1 && !row.entity.Patient.AddressLine2'>
                                    <i class="fa fa-envelope text-address"></i> : &nbsp; N/A
                                </div>
                                <div class="contactinfo">
                                    <i class="fa fa-phone-square text-cell"></i> : {{row.entity.Patient.LandLine}} &nbsp; | &nbsp; NRIC - {{row.entity.Patient.NationalityIdentifier
                                    ? row.entity.Patient.NationalityIdentifier : 'N/A'}}
                                </div>
                        </div>
                        <div class="col-lg-3 col-sm-3 col-md-3 col-lg-3 dr_pdng">
                            <ul class="timeline-xs">
                                <li class="timeline-item success">
                                    <div class="margin-left-15 dr_hide">
                                        <div class="text-muted text-small">
                                            Reason :
                                            <span class="text-primary">{{ row.entity.AdmitReason }}</span>
                                            <div style="color:#5590da; font-weight:bold;">
                                                <displaydate datetime-val="row.entity.Encounter.AdmissionDate"></displaydate>
                                                &nbsp; | &nbsp;{{row.entity.Encounter.VisitIdentifier}}
                                            </div>
                                        </div>

                                    </div>

    <script type="text/ng-template" id="scheduledPatientsTemplate.html">

                        <div class="col-sm-1 col-md-1 col-lg-1">
                            <span ng-show="!row.entity.Patient.PhotoPath">
                                <img src="app/img/main/no-img-female.png" class="img-responsive image-height" ng-if="row.entity.Patient.GenderId == 2">

                            </span>
                            <img class="img-responsive image-height" ng-show="row.entity.Patient.PhotoPath && row.entity.Patient.Photo" data-ng-src="data:image/png;base64,{{row.entity.Patient.Photo}}"
                            />
                        </div>
                        <div class="col-sm-4 col-md-4 col-lg-4 block">
                            <div class="nameinfo"> {{row.entity.Patient.Title.Description}} {{row.entity.Patient.FirstName}} {{row.entity.Patient.LastName}}</div>
                            <div class="nameinfo">
                                <span class="nameinfo mrninfo">MRN - {{row.entity.Patient.MRN ? row.entity.Patient.MRN : 'N/A' }}</span> &nbsp; | &nbsp;
                                {{row.entity.Patient.Gender.Description ? row.entity.Patient.Gender.Description : 'N/A'}}
                                &nbsp; | &nbsp; {{row.entity.Patient.Age ? ((row.entity.Patient.Age
                                <=1 ) ? row.entity.Patient.Age + 'Yr': row.entity.Patient.Age + ' Yrs') : 'N/A' }} &nbsp; | &nbsp; {{row.entity.Patient.DOB
                                    ? (row.entity.Patient.DOB| date : 'dd-MMM-yyyy') : 'N/A'}} </div>
                                    <div class="contactinfo" ng-if='row.entity.Patient.AddressLine1 || row.entity.Patient.AddressLine2'>
                                        <i class="fa fa-envelope text-address"></i> : &nbsp; {{row.entity.Patient.AddressLine1 + ',' }} {{row.entity.Patient.AddressLine2
                                        ? row.entity.Patient.AddressLine2 + ',' : ""}} {{row.entity.Patient.Area ? row.entity.Patient.Area
                                        + ',' : ""}} {{row.entity.Patient.City ? row.entity.Patient.City + ',' : ""}} {{row.entity.Patient.State
                                        ? row.entity.Patient.State + ',' : ""}} {{row.entity.Patient.Country ? row.entity.Patient.Country
                                        : ""}}
                                    </div>
                                    <div class="contactinfo" ng-if='!row.entity.Patient.AddressLine1 && !row.entity.Patient.AddressLine2'>
                                        <i class="fa fa-envelope text-address"></i> : &nbsp; N/A
                                    </div>
                                    <div class="contactinfo">
                                        <i class="fa fa-phone-square text-cell"></i> : {{row.entity.Patient.LandLine}} &nbsp; | &nbsp; NRIC - {{row.entity.Patient.NationalityIdentifier
                                        ? row.entity.Patient.NationalityIdentifier : 'N/A'}}
                                    </div>
                            </div>

                                <ul class="timeline-xs">
                                    <li class="timeline-item">
