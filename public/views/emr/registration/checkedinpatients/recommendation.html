<style>
    .modal-content .panel-body {
        padding: 1px;
        background-image: url(../../app/img/bg-body.jpg) !important;
        background-repeat: repeat;
        overflow: visible;
        margin: -2px 0 5px;
    }

    .modal-lg {
        width: 500px;
    }

    .bt-color16 {
        color: white;
        background-color: rgba(138, 43, 226, 0.53);
    }

    #dropdownctrl>a>.label {
        left: 12px !important;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-12 ">
        <h3 class="panel-title" translate="registration.checkedinpatients.recommendtitle.lbl"></h3>
    </div>
</div>
<div class="panel-body">
    <patientbanner patientid="currentcontext.pid"></patientbanner>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div>
                <div class="">
                    <div class="panel-body form-panel">
                        <div class="col-sm-12">
                            <!-- leftpanel -->
                            <div class="col-sm-12 well">
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="issurgery"
                                        translate="registration.checkedinpatients.issurgery.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="checkbox" name="issurgery" class="custom-checkbox"
                                            ng-model="item.IsSurgery">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="isadmission"
                                        translate="registration.checkedinpatients.isadmission.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="checkbox" name="isadmission" class="custom-checkbox"
                                            ng-model="item.IsAdmission">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="procedure"
                                        translate="registration.checkedinpatients.procedure.lbl"></label>
                                    <div class="col-sm-7">
                                        <autosearch itemid="item.ProcedureId" iteminfo="" rowdata=""
                                            name="'surgeryname'" config="vm.procedurecontrolconfig"
                                            itemchange="getSurgeryName()" candisable="item.isRequested"
                                            isrequired="true"></autosearch>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="comments"
                                        translate="patientemr.patientdocument-form.comments.lbl"></label>
                                    <div class="col-sm-8">
                                        <commentscontrol comments="item.Comments"></commentscontrol>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="panel-footer formactionbar">
                <div class="pull-right">
                    <button id="btnCall" type="button" class="draftbutton" translate="common.saveaction.lbl"
                        ng-click="saveItem()"></button>

                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()"
                        translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
