<div class="row">
    <div class="form-group col-sm-3">
        <label class="col-sm-12 control-label" translate="Name"></label>
        <div class="col-sm-12">
            <div class="search">
                <input type="text" id="pid" class="form-control" on-enter="getList()"
                    ng-model="currentfilter.patientname" translate
                    translate-attr-placeholder="registration.checkedinpatients.namemrn.lbl"><i class="fas fa-search"
                    aria-hidden="true"></i>
            </div>
        </div>
    </div>
    <div class="form-group col-sm-3">
        <label class="col-sm-12 control-label" translate="doctorpayment-list.filter_doctorname.lbl"></label>
        <div class="col-sm-12">
            <autosearch itemid="currentfilter.DoctorId" iteminfo="" rowdata="" config="vm.doctorcontrolconfig"
                itemchange="getList()" onenter="getList()"></autosearch>
        </div>
    </div>
    <div class="form-group col-sm-3">
        <label class="col-sm-12 control-label" translate="Date"></label>
        <div class="col-sm-12">
            <div id="datepicker">
                <input type="text" class="form-control cwidth" ng-change="getList()"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="visitdatePopup = { opened: true }"
                    is-open="visitdatePopup.opened" ng-model="currentfilter.visitdate">
            </div>
        </div>
    </div>
</div>
<div class="fooder-bgs">
    <div class="row">
        <custom-table config="vm.gridConfig"></custom-table>
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
