<style>
    .nav > li.disabled > a:hover,
    .nav > li.disabled > a:focus {
        color: #000000 !important;
        text-decoration: none;
        background-color: #3c5a76;
        cursor: not-allowed;
    }

    .nav-tabs > li.active > a,
    .nav-tabs > li.active > a:hover {
        color: #000000 !important;
        border-bottom-color: #fff;
        background-color: #3c5a76 !important;
    }

    .nav-tabs > li > a {
        padding: 4px 15px;
    }

    .page-header {
        margin: 0px 0px 0px 0px !important;
    }
</style>
<div class="row page-header">
    <h4 class="active col-sm-6 mt0" translate="registration.patientfollowup.pagetitle.lbl"></h4>
    <!-- <label class="col-sm-3 mt0 active" translate="{{$state.params.StoreCode}} - {{$state.params.StoreName}}"></label> -->
</div>
<div class="row">
    <div class="col-sm-12">
        <uib-tabset active="active">
            <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)" disable="tab.canDisable">
            </uib-tab>
        </uib-tabset>
        <div ui-view></div>
    </div>
</div>
