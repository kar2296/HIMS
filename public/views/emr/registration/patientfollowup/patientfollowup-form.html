<style>
    .align_left {
        text-align: left !important;
    }

    .name {
        color: green;
        font-size: small;
        margin-left: 30px;
    }

    .number {
        color: fuchsia;
        font-size: 16px;
        font-weight: 700;
    }
</style>

<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="registration.patientfollowup.followup.lbl"></h4>


</div>
<patientbanner patientid="item.PatientId"></patientbanner>
<div id="">
    <div class="">
        <div class="col-sm-12">
            <b>
                <span class="name" translate="Doctor Name :"></span>
            </b>
            <span class="number">{{item.DoctorName}}</span>
            <b>
                <span class="name" translate="Recomended Procedure :"></span>
            </b>
            <span class="number">{{item.RecomendedProcedure}}</span>
            <b>
                <span class="name" translate="Unit/Location :"></span>
            </b>
            <span class="number">{{item.UserTeam}}</span>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
            <div class="panel panel-default bg-pattern">
                <!--<div class="panel-heading"><h3 class="panel-title" translate="registration.patientfollowup.pnlcontainertype.lbl"></h3></div>!-->
                <div class="panel-body form-panel">
                    <div id="clinical">
                        <div class="col-sm-12" style="height:300px;">

                            <!-- leftpanel -->
                            <div class="col-sm-6 well" style="height: 270px;">
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="type" translate="registration.patientfollowup.followuptype.lbl"></label>
                                    <div class="col-sm-7">
                                        <ui-select ng-model="item.FollowupTypeId">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.FollowupType | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="type" translate="registration.patientfollowup.status.lbl"></label>
                                    <div class="col-sm-7">
                                        <ui-select ng-model="item.FollowupStatusId">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.FollowupStatus | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div>
                                    <div class="col-sm-12" style="color:  #241ab7eb;font-size: 14px;">
                                        <label class="col-sm-4 control-label" translate="registration.patientfollowup.firstfollowup.lbl"></label>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="FirstFollowupDate" translate="registration.patientfollowup.date.lbl"></label>
                                        <div class="col-sm-7">
                                            <input type="text" class="form-control" name="FirstFollowupDate" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                                placeholder="{{datePickerOptions.placeholder}}" ng-click="FirstFollowupDatePopup = { opened: true }"
                                                is-open="FirstFollowupDatePopup.opened" ng-model="item.FirstFollowupDate">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="firstcomments" translate="registration.patientfollowup.comments.lbl"></label>
                                        <div class="col-sm-7">
                                            <input type="text" class="form-control" name="firstcomments" ng-model="item.FirstComments" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="FirstAdmitedDate" translate="registration.patientfollowup.expadmdate.lbl"></label>
                                        <div class="col-sm-7">
                                            <input type="text" class="form-control" name="FirstAdmitedDate" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                                placeholder="{{datePickerOptions.placeholder}}" ng-click="FirstAdmitedDatePopup = { opened: true }"
                                                is-open="FirstAdmitedDatePopup.opened" ng-model="item.FirstAdmitedDate">
                                        </div>
                                    </div>
                                </div>

                            </div>


                            <!-- rightpanel -->
                            <div class="col-sm-6 well" style="height: 270px;">
                                <div>
                                    <div class="col-sm-12" style="color:  #241ab7eb;font-size: 14px;">
                                        <label class="col-sm-12 control-label align_left" translate="registration.patientfollowup.secondfollowup.lbl"></label>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="SecondFollowupDate" translate="registration.patientfollowup.date.lbl"></label>
                                        <div class="col-sm-7">
                                            <input type="text" class="form-control" name="SecondFollowupDate" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                                placeholder="{{datePickerOptions.placeholder}}" ng-click="SecondFollowupDatePopup = { opened: true }"
                                                is-open="SecondFollowupDatePopup.opened" ng-model="item.SecondFollowupDate">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="SecondComments" translate="registration.patientfollowup.comments.lbl"></label>
                                        <div class="col-sm-7">
                                            <input type="text" class="form-control" name="SecondComments" ng-model="item.SecondComments" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="SecondAdmitedDate" translate="registration.patientfollowup.expadmdate.lbl"></label>
                                        <div class="col-sm-7">
                                            <input type="text" class="form-control" name="SecondAdmitedDate" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                                placeholder="{{datePickerOptions.placeholder}}" ng-click="SecondAdmitedDatePopup = { opened: true }"
                                                is-open="SecondAdmitedDatePopup.opened" ng-model="item.SecondAdmitedDate">
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <div class="col-sm-12" style="color:  #241ab7eb;font-size: 14px;">
                                        <label class="col-sm-12 control-label align_left" translate="registration.patientfollowup.thirdfollowup.lbl"></label>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="ThirdFollowupDate" translate="registration.patientfollowup.date.lbl"></label>
                                        <div class="col-sm-7">
                                            <input type="text" class="form-control" name="ThirdFollowupDate" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                                placeholder="{{datePickerOptions.placeholder}}" ng-click="ThirdFollowupDatePopup = { opened: true }"
                                                is-open="ThirdFollowupDatePopup.opened" ng-model="item.ThirdFollowupDate">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="ThirdComments" translate="registration.patientfollowup.comments.lbl"></label>
                                        <div class="col-sm-7">
                                            <input type="text" class="form-control" name="ThirdComments" ng-model="item.ThirdComments" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="ThirdAdmitedDate" translate="registration.patientfollowup.expadmdate.lbl"></label>
                                        <div class="col-sm-7">
                                            <input type="text" class="form-control" name="ThirdAdmitedDate" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                                placeholder="{{datePickerOptions.placeholder}}" ng-click="ThirdAdmitedDatePopup = { opened: true }"
                                                is-open="ThirdAdmitedDatePopup.opened" ng-model="item.ThirdAdmitedDate">
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>


                    <div class="site-footer panel-footer">
                        <!-- <button id="btnCancelForm" type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()">
                    <i class="fa fa-angle-left"></i>&nbsp;&nbsp;
                    <span translate="common.backaction.lbl"></span>
                </button> -->
                        <div class="footer-right">
                            <button type="button" class="draftbutton" ng-click="save()" translate="common.saveaction.lbl"></button>
                            <button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                            <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                            <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                        </div>
                    </div>
                </div>
        </form>
        </div>
    </div>
