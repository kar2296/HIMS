<style>
        .pager-div {
            float: right;
            right: 0;
            box-sizing: border-box;
            position: fixed;
            box-sizing: border-box;
        }

        .single-filter .ui-grid-render-container-body .ui-grid-viewport {
            margin-left: 0 !important;
            margin-right: 0 !important;
            height: 464px !important;
        }
    </style>
    <div class="row page-header">

        <h4 class="col-sm-6 mt0" translate="registration.patientfollowup.followup.lbl"></h4>

        <!-- <div class="col-sm-6">

                      <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addNew()" uib-tooltip="{{ 'registration.patientfollowup.clients.lbl' | translate }}"
                          tooltip-placement="bottom">
                          <i class="fa fa-plus" aria-hidden="true"></i>
                          <span translate="registration.patientfollowup.addnew.lbl"></span>
                      </button>
                  </div> -->
    </div>

    <div class="row filter-area">
        <div class="col-sm-12">

            <div class="col-sm-3">
                <label class="col-sm-4 control-label filter-lbl" translate="registration.patientfollowup.name/mrn.lbl"></label>
                <div class="input-group col-sm-7 col-md-8">
                    <div class="input-group-addon">
                        <i class="fas fa-search" aria-hidden="true"></i>
                    </div>
                    <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.PatientName" placeholder="Name/MRN">
                </div>
            </div>

            <div class="col-sm-3">
                <label class="col-sm-5 control-label filter-lbl" translate="registration.patientfollowup.referdoctor.lbl"></label>
                <div class="col-sm-7">
                    <autosearch itemid="currentfilter.DoctorId" iteminfo="" rowdata="" name="'doctorid'" config="vm.doctorcontrolconfig" itemchange="onDoctorSelected($select.selected)"
                        isrequired="true"></autosearch>
                </div>
            </div>
            <div class="col-sm-3">
                <label class="col-sm-4 control-label filter-lbl" translate="registration.patientfollowup.department.lbl"></label>
                <div class="col-sm-8">
                    <ui-select ng-model="currentfilter.DepartmentId" ng-change="getList()" class="filter-combo">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 8 : 0}}
                            <span ng-if="$select.selected.Text.length>8">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="col-sm-3">
                <label class="col-sm-4 control-label filter-lbl" translate="registration.patientfollowup.unit.lbl"></label>
                <div class="col-sm-8">
                    <ui-select ng-model="currentfilter.UnitId" ng-change="getList()" class="filter-combo">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 8 : 0}}
                            <span ng-if="$select.selected.Text.length>8">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Team | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
        </div>
        <div class="col-sm-12">
            <div class="col-sm-3">
                <label class="col-sm-4 control-label filter-lbl" translate="registration.patientfollowup.date.lbl"></label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" name="admissiondate" ng-change="getList()" datepicker-options="datePickerOptions"
                        show-button-bar="{{datePickerOptions.showButtonBar}}" uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="admissiondatePopup = { opened: true }" is-open="admissiondatePopup.opened"
                        ng-model="currentfilter.AdmissionDate">
                </div>
            </div>
            <div class="col-sm-3">
                <label class="col-sm-5 control-label filter-lbl" translate="registration.patientfollowup.mobileno.lbl"></label>
                <div class="col-sm-7">
                    <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.MobileNo" placeholder="Mobile No">
                </div>
            </div>

            <div class="col-sm-3">
                <label class="col-sm-4 control-label filter-lbl" translate="registration.patientfollowup.followuptype.lbl"></label>
                <div class="col-sm-8">
                    <ui-select ng-model="currentfilter.FollowupTypeId" ng-change="getList()" class="filter-combo">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 8 : 0}}
                            <span ng-if="$select.selected.Text.length>8">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.FollowupType | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>

            <div class="col-sm-3">
                <label class="col-sm-4 control-label filter-lbl" translate="registration.patientfollowup.status.lbl"></label>
                <div class="col-sm-8">
                    <ui-select ng-model="currentfilter.FollowupStatusId" ng-change="getList()" class="filter-combo">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 8 : 0}}
                            <span ng-if="$select.selected.Text.length>8">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.FollowupStatus | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>

        </div>
    </div>
    <div class="container-fluid" id="patientsearchheight xcx">
        <div ui-grid="vm.gridConfig" class="table-uigrid height-control"></div>
        <div class="site-footer">
            <div class="col-md-12 padding-top5">
                <div class="col-sm-9 ng-isolate-scope ng-not-empty ng-valid" uib-pagination="" total-items="vm.gridConfig.pagerObj.totalItems"
                    items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex" ng-model="vm.gridConfig.pagerObj.currentPage"
                    ng-change="getList()">
                </div>
            </div>
        </div>
    </div>
