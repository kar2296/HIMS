    width: 100%;

<div class=" container-fluid " id="patientauditlogheight">
    <div class="table-uigrid table-uigrid-tab bg-pattern">
        <div class="col-md-12 no-pad" id="mainresponsivetablecontrol">
            <table class="table table-hover table-responsive table-bordered">
                <thead class="bg-subhead">
                    <tr>
                        <td>Field Name </td>
                        <td>Old Value</td>
                        <td>New Value</td>
                        <td>Modified Date</td>
                        <td>Modified By</td>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Rajesh</td>
                        <td>125</td>
                        <td>85685</td>
                        <td>15 -02- 16</td>
                        <td>Ramesh</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="fooder-bgs">
        <div class=" ">
            <div class="col-sm-12">
                <div class="col-sm-4 col-md-4">
                    <div class="pull-left">
                        <button type="button" ng-if="canUpdatePatientInfo()" class="btn pyr-color10 btn-sm" ng-click="addNewFull()"><i class="fa fa-angle-left" aria-hidden="true" ></i>&nbsp;&nbsp;<span class="btn-fontsize"  translate="common.backaction.lbl"></span></button>
                        <button id="btnSaveInactive" type="button" class="btn btn-primary btn-sm" translate="common.saveinactive-action.lbl" ng-click="saveAndInactive()"></button>
                    </div>
                </div>
                <div class="col-sm-8 col-md-8">
                    <div class="pull-right">
                        <button type="button"  class="draftbutton" ng-click="print()" translate="common.printaction.lbl"></button>
                        <button id="btnSave" ng-if="canUpdatePatientInfo()" type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
                        <button id="btnSaveApprove" ng-if="canUpdatePatientInfo()" type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveactivate-action.lbl"
                            ng-click="saveAndApprove()"></button>
                        <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                        <button id="btnCancelForm" type="button" class="draftbutton" ng-click="saveCancelled()" translate="common.cancelaction.lbl"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
