<link href="app/css/regbilling.css" rel="stylesheet">
<style>
    .form-horizontal .form-group {
        height: 62px;
    }

    .token-num input {
        border-radius: 103px;
        width: 46px;
        height: 46px !important;
        text-align: center;
        font-size: 13px;
        color: #2196f3;
    }

    autosearch .custom-popup-wrapper {
        margin-left: -236px;
    }
    .full-reg-footer-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 14px;
        margin-bottom: 24px;
        padding: 0;
        width: 100%;
        box-sizing: border-box;
    }

    .full-reg-footer-right {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .full-reg-footer-right .draftbutton {
        height: 32px !important;
        padding: 0 18px !important;
        font-size: 12.5px !important;
        font-weight: 600 !important;
        border-radius: 6px !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05) !important;
        cursor: pointer !important;
        transition: all 0.15s ease !important;
    }

    #btnSave {
        background: #2563eb !important;
        border: 1px solid #1d4ed8 !important;
        color: #ffffff !important;
    }

    #btnSave:hover {
        background: #1d4ed8 !important;
    }

    #btnSaveApprove {
        background: var(--hims-primary, #21008d) !important;
        border: 1px solid #18006b !important;
        color: #ffffff !important;
    }

    #btnSaveApprove:hover {
        background: #18006b !important;
    }
</style>

<div ng-if="canShowPatientBanner" style="margin-bottom: 12px; display: flex; gap: 12px; align-items: center;">
    <div style="flex: 1; min-width: 0;">
        <patientbanner patientid="currentcontext.id"></patientbanner>
    </div>
    <div style="flex-shrink: 0;">
        <react-component name="FullRegistrationPatientOptions" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
    </div>
</div>

<div style="width: 100%;">
    <form id="item_form" name="item_form" class="form-horizontal" role="form" style="width: 100%; margin: 0; padding: 0;">
        <react-component name="FullRegistrationScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
    </form>
</div>

<div class="full-reg-footer-container">
    <div>
        <react-component name="FullRegistrationFooter" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
    </div>
    <div class="full-reg-footer-right">
        <button id="btnSave" ng-if="canUpdatePatientInfo()" type="button" class="draftbutton"
            translate="common.saveaction.lbl" hotkey="{'alt+t': save}" ng-click="save()"></button>
        <button id="btnSaveApprove" ng-if="canUpdatePatientInfo()" type="button" class="draftbutton"
            ng-disabled="currentcontext.canDisableApprove" translate="common.saveactivate-action.lbl"
            ng-click="saveAndApprove()" hotkey="{'alt+a': saveAndApprove}"></button>
    </div>
</div>
