<link href="app/css/regbilling.css" rel="stylesheet">
<style>
    .form-horizontal .form-group {
        height: 62px;
    }

    .token-num input {
        border-radius: 103px;
        width: 46px;
        height: 46px !important;
        text-align: center;
        font-size: 13px;
        color: #2196f3;
    }

    autosearch .custom-popup-wrapper {
        margin-left: -236px;
    }
</style>

<div class="row">
    <div class="col-sm-9">
        <patientbanner patientid="currentcontext.id"></patientbanner>
    </div>
    <div class="col-lg-3">
        <react-component name="FullRegistrationPatientOptions" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
    </div>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <react-component name="FullRegistrationScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
        <div class="form-group col-lg-3">
            <label class="col-lg-12 control-label" translate="registration.fullregistration.occupation.lbl"></label>
            <div class="col-lg-10">
                <autosearch itemid="item.OccupationId" iteminfo="" rowdata="" name="'occupation'"
                    config="vm.occupationcontrolconfig" itemchange="" candisable="item.isAdmitted">
                </autosearch>
            </div>
            <div class="col-lg-2">
                <button type="button" class="btn-add" tabindex="-1" ng-click="addOccupation()"
                    uib-tooltip="{{ 'registration.fullregistration.occupation.lbl' | translate }}"
                    tooltip-placement="top">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </form>
</div>
<div class="fooder-bgs">
    <div class="pull-left footer_reg_align">
        <react-component name="FullRegistrationFooter" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
    </div>
    <div class="pull-right footer_reg_align">
        <button id="btnSave" ng-if="canUpdatePatientInfo()" type="button" class="draftbutton"
            translate="common.saveaction.lbl" hotkey="{'alt+t': save}" ng-click="save()"></button>
        <button id="btnSaveApprove" ng-if="canUpdatePatientInfo()" type="button" class="draftbutton"
            ng-disabled="currentcontext.canDisableApprove" translate="common.saveactivate-action.lbl"
            ng-click="saveAndApprove()" hotkey="{'alt+a': saveAndApprove}"></button>
    </div>
</div>
