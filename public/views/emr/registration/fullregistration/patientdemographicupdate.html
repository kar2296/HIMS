<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="registration.fullregistration.demographicupdate.lbl"></h4>
</div>
<div class="row">
    <div class="col-sm-12">
        <!-- The real <agedisplay> AngularJS component (already itself backed
             internally by the React AgeDisplay component) stays native here,
             per the REUSABLE SUB-WIDGET PATTERN. It renders as a sibling
             before the mount rather than interleaved inside the banner row
             (the same layout trade-off already used for the native <address>
             directive on other migrated screens in this folder). -->
        <span class="forpadd"><agedisplay dob="item.DOB"></agedisplay></span>
        <react-component name="PatientDemographicUpdateScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
        <!-- The real <address> Angular directive stays native (REUSABLE
             SUB-WIDGET PATTERN) -- its field-name mapping is unchanged from
             the original template. -->
        <address addressline1="item.AddressLine1" addressline2="item.AddressLine2" pincodeid="item.PinCodeId" pincode="item.Pincode"
            area="item.Area" city="item.City" cityid="item.CityId" state="item.State" stateid="item.StateId"
            country="item.Country" countryid="item.CountryId" class="upercase"></address>
    </div>
</div>
