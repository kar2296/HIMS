<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="registration.fullregistration.demographicupdate.lbl"></h4>
</div>
<div class="col-sm-12 fullreg-profiles">
    <div class="col-sm-8 page-calendar ">
        <span class="forpadd"> 
                <span>{{item.Title.Description}} {{item.FirstName}}</span> |
        <span>{{item.MRN}} </span> |
        <span> {{item.Gender.Description}}</span> |
        <agedisplay dob="item.DOB"></agedisplay> |
        <span>{{item.DOB | date : 'dd/MMM/yyyy' }} </span>
        <span ng-click="patientprofiledetails()"><i class="icon-info-sign"></i></span>
    </div>

</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="panel-body form-panel">
                <div class="col-sm-12">

                    <!-- leftpanel -->
                    <div class="col-sm-12 well">
                        <div class="col-sm-8">

                            <div class="form-group">
                                <label class="col-sm-4 control-label" for="firstname" translate="registration.fullregistration.firstname.lbl"></label>
                                <div class="col-sm-8">
                                    <input type="text" class="form-control" name="firstname" ng-model="item.FirstName" tabindex="tabindexmap.patienttabindex"
                                        placeholder="" required uppercase>
                                </div>
                            </div>



                            <!--<div class="form-group">
                                        <label class="col-sm-4 control-label" translate="registration.fullregistration.mrn.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="mrn" ng-model="item.MRN" placeholder="" disabled>
                                        </div>
                                    </div>-->


                            <div class="form-group" ng-if="canShowApproxAge()">
                                <label class="col-sm-4 control-label" translate="registration.fullregistration.approxage.lbl"></label>
                                <div class="col-sm-8 approxagediv">
                                    <div class="col-sm-4">
                                        <input type="text" class="form-control" ng-model="item.ApproxAgeDays" placeholder="Days" ng-change="calculateDOB(item.ApproxAgeDays, 'days')">
                                    </div>
                                    <div class="col-sm-4">
                                        <input type="text" class="form-control" ng-model="item.ApproxAgeMonths" placeholder="Months" ng-change="calculateDOB(item.ApproxAgeMonths, 'months')">
                                    </div>
                                    <div class="col-sm-4">
                                        <input type="text" class="form-control" ng-model="item.Age" placeholder="Years" tabindex="-1" ng-change="calculateDOB(item.Age, 'years')">
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-4 control-label" translate="registration.fullregistration.age.lbl"></label>
                                <div class="col-sm-2">
                                    <input type="text" class="form-control" name="age" ng-model="item.Age" placeholder="" ng-change="calculateDOB(item.Age, 'years')">
                                </div>
                                <label class="col-sm-2 control-label" for="dob" translate="registration.fullregistration.dob.lbl"></label>
                                <div class="col-sm-4">
                                    <input type="text" class="form-control" name="dob" ng-date-object datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                                        ng-click="dobPopup = { opened: true }" is-open="dobPopup.opened" ng-model="item.DOB"
                                        ng-change="calculateAge()" required>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-4 control-label" for="gender" translate="registration.fullregistration.gender.lbl"></label>
                                <div class="col-sm-8">
                                    <ui-select ng-model="item.GenderId" name="gender" required>
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                        </ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Gender | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-4 control-label" for="nationality" translate="registration.fullregistration.nationality.lbl"></label>
                                <div class="col-sm-8">
                                    <ui-select ng-model="item.NationalityId" name="nationality" required>
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                        </ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Nationality | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                            </div>


                            <div class="form-group">
                                <label class="col-sm-4 control-label" for="mobile" translate="registration.fullregistration.mobile.lbl"></label>
                                <div class="col-sm-8">
                                    <input type="text" class="form-control" name="mobile" ng-model="item.Mobile" placeholder="" ng-minlength="10" ng-pattern="/^\d+$/">
                                </div>
                            </div>
                            <address addressline1="item.AddressLine1" addressline2="item.AddressLine2" pincodeid="item.PinCodeId" pincode="item.Pincode"
                                area="item.Area" city="item.City" cityid="item.CityId" state="item.State" stateid="item.StateId"
                                country="item.Country" countryid="item.CountryId" class="upercase"></address>

                        </div>
                    </div>

                    <!-- rightpanel -->

                </div>
            </div>
            <div class="panel-footer formactionbar">
                <div class="pull-right">
                    <!--<button id="btnSave" type="button" class="draftbutton" translate="common.saveaction.lbl" hotkey="{'alt+t': save}"
                        ng-click="save()"></button>-->

                    <button id="btnSaveApprove" type="button" class="draftbutton" translate="registration.fullregistration.update.lbl"
                        ng-click="saveAndApprove()" hotkey="{'alt+a': saveAndApprove}"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" tabindex="-1" ng-click="cancelCallback()" translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
