<!-- Add-member action bar reimplemented in React (FamilyLinkActionBar). -->
<react-component name="FamilyLinkActionBar" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
<div class="col-sm-12 drhms-defaultservices">
    <!-- Grid body left as native Angular -- per-row <autosearch> is a shared,
         config/callback-driven directive instantiated once per ng-repeat row and
         cannot be safely rendered inside a React row (see familylinking.js for the
         full rationale, consistent with the Doctor autosearch in
         registrationcumvisit.html). Unchanged from the original below. -->
    <table class="table table-hover table-responsive table-bordered">
        <thead class="bg-subhead">
            <tr>
                <th class="col-sm-3"><span translate="registration.familylink.members.lbl"></span></th>
                <th><span translate="registration.familylink.age.lbl"></span></th>
                <th><span translate="registration.familylink.gender.lbl"></span></th>
                <th><span translate="registration.familylink.mrn.lbl"></span></th>
                <th><span translate="registration.familylink.relation.lbl"></span>*</th>
                <th><span translate="registration.familylink.national.lbl"></span></th>
                <th><span translate="common.actions_col.lbl"></span></th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="item in vm.items | filter:{Status:1}">
                <td>
                    <autosearch itemid="item.MemberId" iteminfo="item.SelectedItem" rowdata="item"
                        config="vm.patientconfig" itemchange="PatientChanged($index,item)" class="inputsearchlogo">
                    </autosearch>
                </td>
                <td>
                    <input type="text" class="form-control" ng-model="item.Age" placeholder="" disabled>
                </td>
                <td>
                    <input type="text" class="form-control" ng-model="item.Gender" placeholder="" disabled>
                </td>
                <td>
                    <input type="text" class="form-control" ng-model="item.MRN" placeholder="" disabled>
                </td>
                <td>
                    <ui-select ng-model="item.RelationshipId" name="type">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.Relationship | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </td>
                <td align="center">
                    <input type="text" class="form-control" ng-model="item.NationalId" placeholder="" disabled>
                </td>
                <td align="center">
                    <button class="drhms-edit-button" ng-click="deleteItem($index,item)">
                        <img  src="assets/svg/delete.svg" alt="">
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
<!-- Footer reimplemented in React (FamilyLinkFooter). saveCancelled() is preserved
     verbatim as a dispatched call though it is not defined anywhere in this
     controller's scope chain (same UNDEFINED-FUNCTION-ON-BUTTON class already
     found on patientidentity-list's Cancel button -- a real, silent no-op). -->
<react-component name="FamilyLinkFooter" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
