<link rel="stylesheet" href="app/css/drhms.css">
<style>
    patientsearch#drhms-patinet-search-box .custom-popup-wrapper {
        margin-left: -180px;
    }
</style>
<link href="app/css/regbilling.css" rel="stylesheet">
<div class="page-header-list">
    <div class="col-lg-8">
        <h4 class="mt0" translate="registration.fullregistration.ipregistration.lbl"></h4>
    </div>
    <div class="col-lg-4">
        <div class="filters">
            <div class="search">
                <patientsearch id="drhms-patinet-search-box" ng-keyup="moveHeaderFocus('pid')"
                    patientid="item.PatientId" name="txtpatientsearch" patientinfo="selectedPatient"
                    patientchange="patientChange()" aria-placeholder="Patient Search"
                    tabindex="tabindexmap.patienttabindex" isdisabled="{{SaveCompleted}}"
                    filterconfig="patientfilterconfig"></patientsearch>
                <div class="drhms-search-icon"><i class="fas fa-search" aria-hidden="true"></i></div>
            </div>
            <!-- <span class="drhms-search-icon"><i class="fas fa-search" aria-hidden="true"></i></span> -->
            <button class="btn-add" tabindex="-1" ng-click="addNewFull()">
                <i class="fa fa-plus" aria-hidden="true"></i>
            </button>
        </div>
    </div>

</div>
<div id="receipt_tab">
    <div class="row">
        <div class="col-sm-12">
            <uib-tabset active="active">
                <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)"
                    disable="tab.canDisable">
                </uib-tab>
            </uib-tabset>
            <div ui-view></div>
        </div>
    </div>
</div>
