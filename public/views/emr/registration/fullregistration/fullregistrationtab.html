<!-- Fully reimplemented in React (FullRegistrationTabScreen), except
     <patientsearch> (real, shared, async-fetching directive -- REUSABLE
     SUB-WIDGET PATTERN, untouched) and the nested <div ui-view> that renders
     each child tab's own already-migrated screen. See fullregistrationtab.js
     for the real bridge wiring. -->
<link rel="stylesheet" href="app/css/drhms.css">
<style>
    patientsearch#drhms-patinet-search-box .custom-popup-wrapper {
        margin-left: -180px;
    }
</style>
<link href="app/css/regbilling.css" rel="stylesheet">
<div class="filters" style="display: flex; justify-content: flex-end; align-items: center; margin-bottom: 8px;">
    <div class="search">
        <patientsearch id="drhms-patinet-search-box" ng-keyup="moveHeaderFocus('pid')"
            patientid="item.PatientId" name="txtpatientsearch" patientinfo="selectedPatient"
            patientchange="patientChange()" aria-placeholder="Patient Search"
            tabindex="tabindexmap.patienttabindex" isdisabled="{{SaveCompleted}}"
            filterconfig="patientfilterconfig"></patientsearch>
        <div class="drhms-search-icon"><i class="fas fa-search" aria-hidden="true"></i></div>
    </div>
</div>
<react-component name="FullRegistrationTabScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
<div id="receipt_tab" class="hims-theme-registration">
    <div class="row">
        <div class="col-sm-12">
            <div ui-view></div>
        </div>
    </div>
</div>
