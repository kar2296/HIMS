<style>
    .modal-lg {
        width: 450px;
    }

    input[type="file"] {
        display: block;
        width: 100%;
    }

    .inputfile-1+label {
        color: #f1e5e6;
        width: 75%;
        border-radius: 3px;
        margin: 1px 9px;
        cursor: pointer;
        background-color: #d3394c!important;
    }

    .inputfile+label i {
        margin: 4px 7px;
    }

    .img-thumbnail {
        /* padding: 40px; */
        line-height: 1.52857143;
        background-color: #e1e2e3;
        border: 1px solid #e1e2e3;
        border-radius: 3px;
        -webkit-transition: all 0.2s ease-in-out;
        -o-transition: all 0.2s ease-in-out;
        transition: all 0.2s ease-in-out;
        display: inline-block;
        max-width: 100%;
        height: auto;
    }
</style>
<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="registration.patientidentity-list.documents.lbl"></h4>
</div>

<div class="row" style="height: 200px;">
    <div class="col-sm-10">
        <img class="item-logo-img" ng-show="!!currentcontext.file" ngf-thumbnail="currentcontext.file" />
        <img class="item-logo-img" ng-show="!currentcontext.file && item.ImagePath" data-ng-src="data:image/png;base64,{{currentcontext.Photo}}">
    </div>
    <div class="col-sm-2">
        <div class="box1">
            <input type="file" ngf-select ng-model="currentcontext.file" tabindex="-1" name="file" id="file-1" class="inputfile inputfile-1"
                ngf-max-size="200MB" ngf-change="photoFileChanged()" />
            <label for="file-1" uib-tooltip="Upload" tooltip-placement="bottom" ng-hide="!currentcontext.file && item.ImagePath">
                <i class=" fa fa-cloud-upload " aria-hidden="true "></i>
            </label>
        </div>
    </div>
</div>

<div class="panel-footer formactionbar ">
    <div class="pull-right ">
        <button type="button " id="btnsubmit " class="draftbutton" translate="common.saveaction.lbl
                " ng-click="save() "></button>
        <!-- <button type="button " id="btnsubmit " class="draftbutton" translate="Punch Out " ng-click="punchout() "></button> -->
        <button id="btnCancelForm " type="button " class="btn btn-danger btn-sm " ng-click="backToList() " translate="common.cancelaction.lbl "></button>
    </div>
</div>
