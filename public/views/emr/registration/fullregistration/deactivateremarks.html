<style>
    .modal-content {
        width: 800px;
        margin: 30px auto;
    }

    textarea {
        height: 15vh !important;
    }
</style>
<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Deactivate Remarks"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-12">
            <label class="col-sm-12 control-label" for="">
                <span translate="appointment.appointment-form.remarks.lbl"></span>:</label>
            <div class="col-sm-12">
                <textarea rows="5" name="reason" ng-model="item.DeactivateRemarks" maxlength="4000"></textarea>
            </div>
        </div>
    </form>
</div>
<div class="fooder-bgs">
