<div class="modal-header custom-modal-header">
    <h4 class="col-sm-11 modal-title custom-modal-title" translate="registration.patientkin-form.pagetitle.lbl"></h4>
    <div class="col-sm-1">
        <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="X"></button>
    </div>
</div>
<div class="row">
    <div class="col-sm-12">
        <react-component name="PatientKinFormScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
        <!-- The real composite <address> Angular directive stays native (REUSABLE
             SUB-WIDGET PATTERN) -- its field-name mapping (Ward/District/etc.) is
             unchanged from the original template. -->
        <address addressline1="item.AddressLine1" tabindex="tabindexmap.patienttabindex" addressline2="item.AddressLine2" pincodeid="item.PinCodeId"
        pincode="item.Pincode" area="item.Ward" areaid="item.WardId" city="item.City" district="item.District" districtid="item.DistrictId"
        cityid="item.CityId" state="item.State" stateid="item.StateId" country="item.Country" countryid="item.CountryId"
        class="upercase" pintext="item.Pincode"></address>
    </div>
</div>
