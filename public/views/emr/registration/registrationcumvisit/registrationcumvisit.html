<style>
    /* .filter-area {
        background-image: url(app/img/patterns-bg/patter2.png)!important;
    } */

    .filter-area {
        box-shadow: 1px 4px 18px -10px rgba(0, 0, 0, .75);
        padding-bottom: 4px;
    }

    .typeahead-demo>input {
        background: url(app/img/patterns-bg/search.png) 102.2% center no-repeat #fff;
        background-size: 10.7%!important;
    }

    .form-group {
        margin-bottom: 5px!important;
    }

    .well.custom_padtop {
        padding-top: 0px !important;
    }

    fieldset.fsStyle {
        border: 1px solid;
        padding: 0px 4px !important;
    }

    .print_dropdown {
        top: initial;
        bottom: 100%;
        margin-bottom: 5px;
        background: #1e7d9a !important;

    }

    .print_dropdown span {
        color: #fff;
        /* background: #ad1414 ; */
    }

    /* .print_dropdown span:hover{
       color:#fff;

    } */

    .print_dropdown li :hover {
        background: #ad1414 !important;
        color: #000000 !important;
    }

    ul#print {
        margin-right: 3px;
    }

    .panel-body.form-panel.bg-pattern {
        overflow: scroll;
        /* height: 460px; */
        height: 470px;
        overflow-x: hidden;
    }

    .filter-area.row {
        clear: both;
    }

    textarea.form-control.notes-textarea.ng-pristine.ng-valid.ng-empty.ng-touched {
        border: 1px solid gray;
    }

    .link_close {
        margin-top: 0px;
        z-index: 999;
        position: relative;
        top: 26px;
        right: 62px;
        font-size: 51px;
        opacity: 1;
    }

    @media (device-width:100vw) and (device-height:100vh) {
        .panel-body.form-panel.bg-pattern {
            height: 590px;
        }
    }
</style>
<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-6">
            <h4 class="page-header mt0" translate="registration.registrationcumvisit.pagetitle.lbl"></h4>
        </div>
        <div class="col-sm-6">
            <button class="btn-xs pull-right" style="background:#fff;border:1px solid green;" uib-tooltip="{{ 'clinicalmaster.serviceitem-list.USERMANUAL.lbl' | translate }}"
                tooltip-placement="bottom">
                <a href="mock/usermanual/registration/Registration.pdf" target="_blank" id="btnShow" ;>
                    <img src="app/img/documents/7-128.png" style="width:25px;height:auto;">
                </a>
            </button>

            <button class="btn-xs pull-right" id="myBtn" uib-tooltip="{{ 'clinicalmaster.serviceitem-list.PROCESSFLOW.lbl' | translate }}"
                tooltip-placement="bottom" style="padding:0px;margin:0px;-webkit-transform: rotate(270deg);border:1px solid crimson"
                ng-click="showprocessflow()">
                <img src="app/img/documents/2.png" ng-click="showprocessflow()" style="width:26px;height:auto;">
            </button>
            <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addNew()" uib-tooltip="{{ 'registration.registrationcumvisit.pagetitle.lbl' | translate
}}" tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
                <span translate="clinicalmaster.serviceitem-list.addnew.lbl"></span>
            </button>
        </div>
    </div>
</div>
<div id="myModal" class="modal">

    <!-- Modal content -->
    <div class="modal-content" style="width:88%;margin:0 auto; left:6%;">

        <div class="modal-body">
            <span ng-click="hideprocessflow()" class="close link_close">&times;</span>
            <img src="mock/usermanual/registration/Registration.jpg" class="img-responsive"></img>


        </div>

    </div>

</div>

<patientbanner patientid="item.PatientId"></patientbanner>
<form id="item_form" name="item_form" class="form-horizontal" role="form">
    <div class="filter-area row">
        <div class="col-sm-12">
            <!-- first row -->
            <div class="col-sm-5">
                <div class="form-group">
                    <label class="col-sm-4 control-label" translate="registration.registrationcumvisit.patient.lbl"></label>
                    <patientsearch patientid="item.PatientId" class="col-sm-8 logo" name="txtpatientsearch" patientinfo="selectedPatient" patientchange="patientChange()"
                        tabindex="tabindexmap.patienttabindex" isdisabled="" filterconfig="patientfilterconfig"></patientsearch>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-sm-12">
            <div class="formRoot">
                <div class="panel panel-default">
                    <div class="panel-body form-panel bg-pattern reg_cumvisit">
                        <div class="well custom_padtop">
                            <!-- Fields below reimplemented in React (RegistrationCumVisitScreen); see
                                 src/react-components/RegistrationCumVisitScreen.tsx for full field-by-field
                                 fidelity notes (address-binding quirks, District's real disconnected
                                 behavior, Mobile/LandLine's genuine duplicate id="landline"/name="landline"
                                 in the original, etc). Doctor (native autosearch, kept below) is the one
                                 real field left untouched, matching the REUSABLE-SUB-WIDGET precedent. -->
                            <react-component name="RegistrationCumVisitScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
                            <fieldset class="fsStyle  col6control" style="height: auto;" id="doctorctrlmaster">
                                <div class="col-sm-12">
                                    <div class="col-sm-6">
                                        <div class="form-group">
                                            <label class="col-sm-4 control-label" for="doctor" translate="registration.registrationcumvisit.doctor.lbl"></label>
                                            <div class="col-sm-8">
                                                <autosearch itemid="item.DoctorId" iteminfo="" rowdata="" name="'doctor'" config="vm.doctorcontrolconfig" candisable="item.isAdmitted"
                                                    isrequired="true"></autosearch>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </fieldset>
                        </div>
                    </div>
                </div>
            </div>

            <div class="fooder-bgs">
                <div class="row ">
                    <div class="col-sm-12">
                        <div class="pull-left footer_reg_align">
                            <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()" tabindex="-1" hotkey="{'alt+b': backToList}">
                                <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                                <span class="btn-fontsize" translate="common.backaction.lbl"></span>
                            </button>
                            <!-- OPDBill/Vitals/VisitPrint reimplemented in React (RegistrationCumVisitFooter).
                                 item.PatientStatusId/currentcontext.isTempPatient are never set anywhere in
                                 registrationcumvisit.js, so their real ng-disabled/ng-hide guards are always
                                 no-ops today; see RegistrationCumVisitScreen.tsx for the disclosure. -->
                            <react-component name="RegistrationCumVisitFooter" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
                        </div>
                        <div class="pull-right footer_reg_align">
                            <ul class="nav navbar-nav" id="print" ng-if="Vitals">
                                <li uib-dropdown="" class="dropdown dropdown-list custom-li">
                                    <button uib-dropdown-toggle="" class="draftbutton" ng-disabled="" hotkey="{'alt+p': print}">
                                        <span translate="common.printaction.lbl"></span>&nbsp;&nbsp;&nbsp;
                                        <span>
                                            <i class="fa fa-caret-up" aria-hidden="true"></i>
                                        </span>
                                    </button>
                                    <ul class="dropdown-menu top print_dropdown" role="menu" aria-labelledby="dLabel">
                                        <li>
                                            <a class="" ng-click="print()">
                                                <span>
                                                    <i class="fa fa-angle-right" aria-hidden="true"></i>
                                                </span>&nbsp;&nbsp;&nbsp;
                                                <span translate="registration.fullregistration.print_registration.lbl"></span>
                                            </a>
                                        </li>
                                        <li>
                                            <a ng-click="print2()">
                                                <span>
                                                    <i class="fa fa-angle-right" aria-hidden="true"></i>
                                                </span>&nbsp;&nbsp;&nbsp;
                                                <span translate="registration.fullregistration.print_registrationlabel.lbl"></span>
                                            </a>
                                        </li>
                                        <li>
                                            <a ng-click="print3()">
                                                <span>
                                                    <i class="fa fa-angle-right" aria-hidden="true"></i>
                                                </span>&nbsp;&nbsp;&nbsp;
                                                <span translate="registration.fullregistration.print_registrationid.lbl"></span>
                                            </a>
                                        </li>
                                        <li>
                                            <a ng-click="requestprint()">
                                                <span>
                                                    <i class="fa fa-angle-right" aria-hidden="true"></i>
                                                </span>&nbsp;&nbsp;&nbsp;
                                                <span translate="registration.fullregistration.print_requestform.lbl"></span>
                                            </a>
                                        </li>
                                        <li>
                                            <a ng-click="printPatientLabel()">
                                                <span>
                                                    <i class="fa fa-angle-right" aria-hidden="true"></i>
                                                </span>&nbsp;&nbsp;&nbsp;
                                                <span
                                                    translate="registration.fullregistration.print_patientlable.lbl"></span>
                                            </a>
                                        </li>
                                    </ul>
                                </li>
                            </ul>
                            <button id="btnSave" type="button" class="draftbutton" translate="common.saveaction.lbl" hotkey="{'alt+t': save}"
                                ng-click="save()" ng-show="EnableSave"></button>

                            <button id="btnSaveApprove" type="button" class="btn dem-color4 text-white btn-sm" ng-disabled="currentcontext.canDisableApprove"
                                translate="common.saveactivate-action.lbl" ng-click="saveAndApprove()" hotkey="{'alt+a': saveAndApprove}"></button>
                            <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" tabindex="-1" ng-click="clear()" translate="common.clearaction.lbl"
                                ng-hide="item.PatientStatusId==2" ng-disabled="isPatientDeactivated"></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
