<link rel="stylesheet" href="app/css/drhms.css">
<style>
    .modal-dialog {
        width: 600px;
        margin: 30px auto;
    }
</style>
<!--
    The old label.btn.btn-sm.width.btn-custom-radio.btn-feedback-selected /
    ...btn-feedback-notselected rules that used to live here targeted the
    native <radiogroupcontrol> markup this screen used to render for its
    Assign-To picker. That markup is now rendered by PatientTrackerScreen.tsx
    (React, styled from the shared design tokens), so those rules are no
    longer referenced by anything on this page and are not carried forward --
    see PatientTrackerScreen.tsx's header comment for the full disclosure of
    this and every other real bug/dead-code path found during migration.
-->
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="registration.patienttracker.pagetitle.lbl"
            ng-show="from == 0"></h4>
        <h4 class="modal-title custom-modal-title" translate="FollowUp Tracker" ng-show="from == 1"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <react-component name="PatientTrackerScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>

        <!-- Real, live server-searched autosearch directive -- kept NATIVE
             and unchanged, per the "no live-search directive
             re-implementation" rule (see FamilyLinkScreen.tsx /
             DeathRecordFormScreen.tsx precedent). Same ng-show condition and
             the exact same attributes as the original, including its own
             pre-existing bugs (candisable="SaveCompleted" and
             tabindex="tabindexmap.patienttabindex" both reference $scope
             properties that are never defined anywhere in this controller,
             and isrequired="true" is duplicated on this tag) -- all disclosed
             in PatientTrackerScreen.tsx's header comment, none fixed here. -->
        <div class="form-group col-sm-12" ng-show="canShowUser()">
            <label class="col-sm-12 control-label" for="user" translate="registration.patienttracker.user.lbl"></label>
            <div class="col-sm-12">
                <autosearch class="auto-search" controlid="'DoctorId'" itemid="item.AssignedUserId"
                    tabindex="tabindexmap.patienttabindex" iteminfo="" itemchange="onUserChange($select.selected)"
                    rowdata="" name="'doctor'" isrequired="true" config="vm.doctorcontrolconfig"
                    candisable="SaveCompleted" isrequired="true" placeholder="'Doctor'">
                </autosearch>
            </div>
        </div>
    </form>
</div>
