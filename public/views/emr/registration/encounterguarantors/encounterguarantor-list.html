<style>
    .table-uigrid {
        width : 100% !important;
    }
    i.fa.fa-trash.btn.btn-danger.btn-rounded {
    display: none;
}
.panel-body.form-panel{
    overflow-x: hidden;
}
</style>
<div class="modal-header custom-modal-header ng-scope">
<h4 class="modal-title custom-modal-title ng-scope" translate="registration.encounterguarantor-list.pagetitle.lbl"></h4>
</div>
  <div class="row filter-area">
    <div class="col-sm-12">
        <div class="col-sm-4">
            <label class="col-sm-4 control-label filter-lbl" translate="registration.encounterguarantor-list.filter_guarantortype.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.guarantortype" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.GuarantorType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-4 control-label filter-lbl" translate="registration.encounterguarantor-list.filter_status.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.status" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
       
        <div class="col-sm-4">
            <button class="pull-right btn bt-color2 btn-xs" ng-click="addNew()"
                        uib-tooltip="{{ 'registration.encounterguarantor-list.addnew-tooltip.lbl' | translate }}" tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
            </button>
            <button class="btn bt-color3 btn-xs pull-right btn-filter">
                <i class="fa fa-filter" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</div>

<div class="panel-body form-panel">    
    <div ui-grid="vm.gridConfig" class="table-uigrid" set-grid-height></div>
    <div class="col-sm-12 panel-footer formactionbar mb0 pdb0">
    <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
            </div>
</div>
