<div class="row filter-area">
    <div class="col-sm-12">
        <div class="col-sm-6 col-lg-3">
            <div class="form-group">
                <label class="sr-only col-sm-5 col-md-4 control-label filter-lbl" translate="registration.patientsearch.filter_mrn.lbl"></label>
                <div class="input-group col-sm-7 col-md-8">
                    <div class="input-group-addon">
                        <i class="fas fa-search" aria-hidden="true"></i>
                    </div>
                    <!-- <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.mrn" placeholder=" MRN/NRIC"> -->
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="form-group">
                <label class="sr-only col-sm-6 col-md-4 control-label filter-lbl" translate="registration.patientsearch.filter_patientname.lbl"></label>
                <div class="input-group col-sm-6 col-md-8">
                    <div class="input-group-addon">
                        <i class="fas fa-search" aria-hidden="true"></i>
                    </div>
                    <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.patientname" placeholder="Patient Name">
                </div>
            </div>
        </div>
        <div class="col-sm-3 pat_search_col2">
            <label class="col-sm-5 col-md-4 control-label filter-lbl" translate="registration.patientsearch.filter_dateofbirth.lbl"></label>
            <div class="col-sm-7 col-md-8 pat_search_col2">
                <input type="text" class="form-control" id="pid" name="dateofbirth" ng-change="getList()" datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}" ng-click="dateofbirthPopup = { opened: true }"
                    is-open="dateofbirthPopup.opened" ng-model="currentfilter.dateofbirth">
            </div>
        </div>
        <div class="col-sm-3 pat_search_col2">
            <label class="col-sm-5 col-md-4 control-label filter-lbl" translate="registration.patientsearch.filter_status.lbl"></label>
            <div class="col-sm-7 col-md-8">
                <ui-select ng-model="currentfilter.status" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.PatientStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </div>
    <div class="col-sm-12 searchpadding pat_search_col2 ">
        <div class="col-sm-3">
            <div class="form-group">
                <label class=" sr-only col-sm-5 col-md-4 control-label filter-lbl" translate="registration.patientsearch.filter_phoneno.lbl"></label>
                <div class="input-group col-sm-7 col-md-8">
                    <div class="input-group-addon">
                        <i class="fas fa-search" aria-hidden="true"></i>
                    </div>
                    <input type="text" class="form-control" on-enter="getList()"  id="pid"  ng-model="currentfilter.phoneno" placeholder="Phone No">
                </div>
            </div>
        </div>
        <div class="col-sm-3 pat_search_col2">
            <div class="form-group">
                <label class=" sr-only col-sm-5 col-md-4 control-label filter-lbl" translate="registration.patientsearch.filter_visitid.lbl"></label>
                <div class="input-group col-sm-7 col-md-8">
                    <div class="input-group-addon">
                        <i class="fas fa-search" aria-hidden="true"></i>
                    </div>
                    <input type="text" class="form-control" on-enter="getList()"  id="pid" ng-model="currentfilter.visitid" placeholder="ID (OP/IP/ER)">
                </div>
            </div>
        </div>
        <div class="col-sm-3 pat_search_col2">
            <label class="col-sm-5 col-md-4 control-label filter-lbl" translate="registration.patientsearch.filter_registereddate.lbl"></label>
            <div class="col-sm-7 col-md-8">
                <input type="text" class="form-control" name="registereddate"  id="pid"  ng-change="getList()" datepicker-options="datePickerOptions"
                    show-button-bar="{{datePickerOptions.showButtonBar}}" uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="registereddatePopup = { opened: true }" is-open="registereddatePopup.opened"
                    ng-model="currentfilter.registereddate">
            </div>
        </div>
        <div class="col-sm-3 pat_search_col2">
            <label class="col-sm-5 col-md-4 control-label filter-lbl" translate="registration.patientsearch.filter_istemp.lbl"></label>
            <div class="col-sm-3 col-md-3">
                <input type="checkbox" class="custom-checkbox form-control"  id="pid"  ng-change="getList()" ng-model="currentfilter.istemp">
            </div>
            <label class="pat_search_ckbox filter-lbl">Other</label>
            <div class="col-sm-3 col-md-3">
                <input type="checkbox" class="custom-checkbox form-control"  id="pid"  ng-change="getList()" ng-model="currentfilter.isOtherFacility">
            </div>
        </div>
        <!--<div class="col-sm-2">
                    <button class="btn btn-default btn-sm pull-right" ng-click="addNew()">
                        <i class="fa fa-plus" aria-hidden="true"></i>
                    </button>
                    <button class="btn btn-default btn-sm pull-right btn-filter">
                        <i class="fa fa-filter" aria-hidden="true"></i>
                    </button>-->
    </div>
</div>
</div>

<script type="text/ng-template" id="patientListTemplate.html">
<div class="row patientprofilebg">
    <div class="col-sm-12 block0 clearfix">
        <div class="ui-grid-cell-contents">
            <div class="col-sm-1 col-md-1 col-lg-1">
                <span ng-show="!row.entity.PhotoPath">
                    <img src="app/img/no-img-female.png" class="img-responsive image-height" ng-if="row.entity.GenderId == 2">
                    <img src="app/img/no-img-icon.png" class="img-responsive image-height" ng-if="row.entity.GenderId != 2">
                </span>
                <img class="img-responsive image-height" ng-show="row.entity.PhotoPath && row.entity.Photo" data-ng-src="data:image/png;base64,{{row.entity.Photo}}"
                />
            </div>
            <div class="col-sm-5 col-md-6 col-lg-4 block">
                <div class="nameinfo"> {{row.entity.Title.Description}} {{row.entity.FirstName}} {{row.entity.LastName}}</div>
                <div class="nameinfo">
                    <span class="nameinfo mrninfo">MRN - {{row.entity.MRN ? row.entity.MRN : 'N/A' }}</span> &nbsp; | &nbsp; {{row.entity.Gender.Description
                    ? row.entity.Gender.Description : 'N/A'}} &nbsp; | &nbsp;
                    <agedisplay dob="row.entity.DOB"></agedisplay> &nbsp; | &nbsp; {{row.entity.DOB ? (row.entity.DOB| date : 'dd-MMM-yyyy') : 'N/A'}} </div>
                <div class="contactinfo" ng-if='row.entity.AddressLine1 || row.entity.AddressLine2'>
                    <i class="fa fa-envelope text-address"></i> : &nbsp; {{row.entity.AddressLine1 + ',' }} {{row.entity.AddressLine2 ? row.entity.AddressLine2
                    + ',' : ""}} {{row.entity.Area ? row.entity.Area + ',' : ""}} {{row.entity.City ? row.entity.City + ','
                    : ""}} {{row.entity.State ? row.entity.State + ',' : ""}} {{row.entity.Country ? row.entity.Country :
                    ""}}
                </div>
                <div class="contactinfo" ng-if='!row.entity.AddressLine1 && !row.entity.AddressLine2'>
                    <i class="fa fa-envelope text-address"></i> : &nbsp; N/A
                </div>
                <div class="contactinfo">
                    <i class="fa fa-phone-square text-cell"></i> : {{row.entity.LandLine}} {{row.entity.Mobile}} &nbsp; | &nbsp; NRIC - {{row.entity.NationalityIdentifier
                    ? row.entity.NationalityIdentifier : 'N/A'}}
                    <a ng-click="grid.appScope.handleEvents('update',row)" uib-tooltip="{{ 'registration.patientsearch.patientdemographicsaction.lbl' | translate }} "
                        tooltip-placement="bottom">
                        <i class="icon-info-sign"></i>
                    </a>
                    {{row.entity.Facility.FacilityName}}
                </div>
            </div>
            <div class="col-sm-3 col-md-3 col-lg-4 pat_search_col2">
                <ul class="timeline-xs">
                    <li class="timeline-item success">
                        <div class="margin-left-15">
                            <div class="text-muted text-small">
                                Registration :
                                <span class="text-primary"> {{row.entity.PatientStatus.Description}} </span>
                            </div>
                            <p style="color:#909fa7;">{{row.entity.RegisteredDate| date : 'dd-MMM-yyyy' }}|
                                <span class="text-muted text-small" ng-if="row.entity.Encounters[0].EncounterTypeId == 2 && !(row.entity.Encounters[0].DischargeDate)"
                                    style="color:#15862b;">{{row.entity.Encounters[0].PatientGuarantor.GuarantorName}}</span>
                                <span class="text-muted text-small" ng-if="row.entity.Encounters[0].EncounterTypeId == 1" style="color:#15862b;">{{row.entity.Encounters[0].PatientGuarantor.GuarantorName}}</span>
                            </p>
                        </div>
                    </li>
                    <li class="timeline-item">
                        <div class="margin-left-15">
                            <div class="text-muted text-small" ng-if="row.entity.LatestAppointment.AppointmentStatus.Description">
                                Appointment :
                                <span class="text-primary" ng-if="row.entity.Encounters[0].EncounterStatusId > 0">Checked In</span>
                                <span class="text-primary" ng-if="row.entity.Encounters.length==0 && row.entity.Appointments.length > 0">
                                    {{row.entity.Appointments[0].AppointmentStatus.Description}}
                                </span>
                                <p>
                                    <displaydate ng-if="row.entity.LatestEncounter.AdmissionDate" datetime-val="row.entity.LatestEncounter.AdmissionDate"></displaydate>
                                    <span ng-if="!row.entity.LatestEncounter.AdmissionDate">
                                        {{row.entity.LatestAppointment.AppointmentDate | date : 'dd-MMM-yyyy'}} {{row.entity.LatestAppointment.StartTime}}
                                    </span>&nbsp;
                                    <span class="visit">{{row.entity.LatestEncounter.VisitIdentifier}}</span>
                                </p>
                            </div>
                            <div class="text-muted text-small" ng-if="row.entity.Encounters[0].EncounterTypeId == 2 && !(row.entity.Encounters[0].DischargeDate)">
                                Ward / Bed / Room :
                                <span class="text-primary">
                                    {{ row.entity.Encounters[0].WardMaster.WardName }} / {{ row.entity.Encounters[0].WardRoomBedMaster.BedNo }} / {{ row.entity.Encounters[0].WardRoomMaster.RoomNo
                                    }}
                                </span>
                                <p>
                                    <displaydate ng-if="row.entity.Encounters[0].AdmissionDate" datetime-val="row.entity.Encounters[0].AdmissionDate"></displaydate>
                                    <span ng-if="!row.entity.Encounters[0].AdmissionDate">
                                        {{row.entity.Encounters[0].AppointmentDate | date : 'dd-MMM-yyyy'}} {{row.entity.Encounters[0].StartTime}}
                                    </span>&nbsp;
                                    <span class="visit">{{row.entity.Encounters.VisitIdentifier}}</span>
                                </p>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>


            <div class="col-sm-6 col-md-5 col-lg-3 linkstyle clearfix">
                <div class=" col-sm-2 patientmenu pdl0">
                    <a ng-click="grid.appScope.handleEvents('edit',row)" uib-tooltip="{{ 'registration.patientsearch.patientdemographicsaction.lbl' | translate }} "
                        tooltip-placement="bottom" class=" text-white btn dem-color4  btn-sm" ng-if="grid.appScope.HasPrivilege('Patient', 'PATIENT-DEM')">
                        <strong translate="registration.patientsearch.dem.lbl"></strong>
                    </a>
                    <a ng-click="grid.appScope.handleEvents('newvisit',row)" uib-tooltip="{{ 'registration.patientsearch.patientnewvisit.lbl' | translate }} "
                        tooltip-placement="right" class="text-white new-color5 btn btn-sm" ng-disabled="row.entity.PatientStatusId == 3 || row.entity.PatientStatusId == 1"
                        ng-if="grid.appScope.HasPrivilege('Patient', 'PATIENT-NEW') && row.entity.MRNTypeId != 1">
                        <strong translate="registration.patientsearch.new.lbl"></strong>
                    </a>
                    <a ng-click="grid.appScope.handleEvents('appointments',row)" uib-tooltip="{{ 'registration.patientsearch.patientappoinment.lbl' | translate }} "
                        tooltip-placement="top" class=" text-white app-color6 btn btn-success btn-sm" ng-disabled="row.entity.PatientStatusId == 3 || row.entity.PatientStatusId == 1"
                        ng-if="grid.appScope.HasPrivilege('Patient', 'PATIENT-APP') && row.entity.MRNTypeId != 1">
                        <strong translate="registration.patientsearch.app.lbl"></strong>
                    </a>
                </div>
                <div class="col-sm-2 patientmenu pdl0">
                    <a ng-click="grid.appScope.handleEvents('admissionlink',row)" uib-tooltip="{{ 'registration.patientsearch.patientadmission.lbl' | translate }} "
                        tooltip-placement="bottom" class=" text-white btn adm-color7  btn-sm" ng-disabled="row.entity.PatientStatusId == 3 || row.entity.PatientStatusId == 1"
                        ng-if="grid.appScope.HasPrivilege('Patient', 'PATIENT-ADM') && row.entity.MRNTypeId != 1">
                        <strong translate="registration.patientsearch.adm.lbl"></strong>
                    </a>
                    <a ng-click="grid.appScope.handleEvents('opbillinglist',row)" uib-tooltip="{{ 'registration.patientsearch.patientopbill.lbl' | translate }}"
                        tooltip-placement="left" class=" text-white btn  opb-color8 btn-sm" ng-disabled="row.entity.PatientStatusId == 3 || row.entity.PatientStatusId == 1"
                        ng-if="grid.appScope.HasPrivilege('Patient', 'PATIENT-OPB') && row.entity.MRNTypeId != 1">
                        <strong>
                            <strong translate="registration.patientsearch.opb.lbl"></strong>
                        </strong>
                    </a>
                    <a ng-click="grid.appScope.handleEvents('ipbillinglink',row)" uib-tooltip="{{ 'registration.patientsearch.patientdgbill.lbl' | translate }}"
                        tooltip-placement="right" class=" text-white btn btn-success btn-sm" ng-disabled="row.entity.PatientStatusId == 3 || row.entity.PatientStatusId == 1"
                        ng-if="grid.appScope.HasPrivilege('Patient', 'PATIENT-DGB')">
                        <strong translate="registration.patientsearch.dgb.lbl"></strong>
                    </a>
                </div>
                <div class="col-sm-2 patientmenu pdl0">
                    <a ng-click="grid.appScope.handleEvents('outstandingbillsview',row)" uib-tooltip="{{ 'registration.patientsearch.patientoutstanding.lbl' | translate }}"
                        tooltip-placement="bottom" class=" text-white btn due-color9  btn-sm" ng-disabled="row.entity.PatientStatusId == 3 || row.entity.PatientStatusId == 1"
                        ng-if="grid.appScope.HasPrivilege('Patient', 'PATIENT-DUE') && row.entity.MRNTypeId != 1">
                        <strong translate="registration.patientsearch.due.lbl"></strong>
                    </a>
