<!-- <link href="app/css/checkbox-radiobuttons.css" rel="stylesheet"> -->

<div class="appt-root-div">
    <div class="col-sm-12 custom-modal-header">
        <h4>Print</h4>
    </div>
    <patientbanner patientid="currentcontext.pid"></patientbanner>
    <div class="panel-body">
        <div class="col-sm-12" id="boostraptablecontrol">
            <table class="table table-hover table-bordered">
                <thead>
                    <tr>
                        <th>Print Template</th>
                        <th>&nbsp;</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Registration</td>
                        <td>
                            <button type="button " class="btn btn-inverse btn-xs" ng-click="registrationprint()" uib-tooltip="{{ 'common.printaction.lbl' | translate}}"
                                tooltip-placement="left">
                                <i class="fa fa-print" aria-hidden="true"></i>
                            </button>
                        </td>
                    </tr>
                    <tr>
                        <td>Registration Label</td>
                        <td>
                            <button type="button " class="btn btn-inverse btn-xs" ng-click="registrationlabel()" uib-tooltip="{{ 'common.printaction.lbl' | translate}}"
                                tooltip-placement="left">
                                <i class="fa fa-print" aria-hidden="true"></i>
                            </button>
                        </td>
                    </tr>
                    <tr>
                        <td>Patient ID Card</td>
                        <td>
                            <button type="button " class="btn btn-inverse btn-xs" ng-click="patientidcard()" uib-tooltip="{{ 'common.printaction.lbl' | translate}}"
                                tooltip-placement="left">
                                <i class="fa fa-print" aria-hidden="true"></i>
                            </button>
                        </td>
                    </tr>
                    <tr>
                        <td>MRD Label</td>
                        <td>
                            <button type="button " class="btn btn-inverse btn-xs" ng-click="mrdlabel()" uib-tooltip="{{ 'common.printaction.lbl' | translate}}"
                                tooltip-placement="left">
                                <i class="fa fa-print" aria-hidden="true"></i>
                            </button>
                        </td>
                    </tr>
                    <tr>
                        <td>Patient Label</td>
                        <td>
                            <button type="button " class="btn btn-inverse btn-xs" ng-click="patientlabel()" uib-tooltip="{{ 'common.printaction.lbl' | translate}}"
                                tooltip-placement="left">
                                <i class="fa fa-print" aria-hidden="true"></i>
                            </button>
                        </td>
                    </tr>
                    <tr>
                        <td>Visit Slip</td>
                        <td>
                            <button type="button " class="btn btn-inverse btn-xs" ng-click="visitprint()" uib-tooltip="{{ 'common.printaction.lbl' | translate}}"
                                tooltip-placement="left">
                                <i class="fa fa-print" aria-hidden="true"></i>
                            </button>
                        </td>
                    </tr>
                    <tr>
                        <td>OP Bill</td>
                        <td>
                            <button type="button " class="btn btn-inverse btn-xs" ng-click="opbill()" uib-tooltip="{{ 'common.printaction.lbl' | translate}}"
                                tooltip-placement="left">
                                <i class="fa fa-print" aria-hidden="true"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="panel-footer">
        <div class="panel-footer formactionbar">
            <div class="col-sm-12">
                <div class="pull-right">
                    <button class="btn btn-inverse btn-sm ng-scope" translate="common.printaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="cancelCallback()" translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </div>
    </div>
    </form>
</div>
