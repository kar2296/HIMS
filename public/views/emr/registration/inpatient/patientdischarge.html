<style>
    .nameinfo {
        font-size: 13px;
        font-weight: 700;
        color: #337ab7;
    }

    .nameinfo.mrninfo {
        color: black
    }

    .contactinfo {
        font-size: 10px;
        color: #808080;
    }

    .block {
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
    }

    .linkstyle {
        font-weight: 700;
        text-align: right;
    }

    .statusinfo {
        font-size: 13px;
    }

    .form-group {
        margin-bottom: 7px !important;
    }

    .sr-only {
        height: 22px !important;
    }

    .custom-grid-btn {
        width: 60px !important;
    }

    .page-header {
        margin: 0px !important;
    }

    .token {
        color: purple;
        font-size: 16px;
        font-weight: 500;
    }

    @media screen and (max-width: 768px) and (orientation: portrait) {
        .layout-fixed .wrapper>section {
            margin-top: 41px !important;
        }

        .wrapper>.aside .aside-inner {
            padding-top: 58px !important;
        }
    }

    @media screen and (max-width: 414px) and (orientation: portrait) {
        .layout-fixed .wrapper>section {
            margin-top: 60px !important;
        }
    }

    @media screen and (max-width: 736px) and (orientation: landscape) {
        .layout-fixed .wrapper>section {
            margin-top: 59px !important;
        }
    }

    @media screen and (max-width:1024px) {
        .control-label.filter-lbl.ng-scope {
            padding: 0px;
            margin: 0px;
        }

        .smdnone {
            display: none;
        }
    }

    .top-option {
        padding: 5px 70px !important;
    }

    .top-option:nth-child(1) {
        background: #312e63;
        color: #fff;
        height: 44px;
        font-size: 14px;
        font-weight: 700 !important;
        padding: 11px !important;
        width: 22%;
    }

    .top-option:nth-child(2) {
        background: #312e63;
        color: #fff;
        height: 44px;
        font-size: 14px;
        font-weight: 700 !important;
        padding: 11px !important;
        width: 22%;
    }

    .opt-selected {
        background: crimson !important;
        color: #000000 !important;
        font-size: 16px;
        background: #99c2c7 !important;
        height: 44px;
        border-bottom: 4px solid #006400 !important;
        width: 22%;
    }


    /* .icon_bed {
        width: 8%;
        display: block;
        float: right;
        margin-right: 2%;
    } */

    /* .icon_home {
        width: 8%;
        float: right;
    } */

    /* @media only screen and (max-width:1024px) {
        .icon_home {
            width: 11% !important;
        }
        .icon_bed {
            width: 11% !important;
        }
    } */

    @media only screen and (max-width:768px) {
        .aside-collapsed .fooder-bg {
            position: fixed !important;
        }

        #patientsearchheight .ui-grid-viewport {
            height: 770px !important;
            min-height: 770px;
        }

    }

    @media only screen and (max-width:414px) {
        .sidebar-toggle {
            left: 66% !important;
        }

        .top-option {
            width: 100%;
        }

        /* .icon_home {
            width: 30% !important;
        }
        .icon_bed {
            width: 30% !important;
        } */
        #patientsearchheight .ui-grid-viewport {
            height: 482px !important;
        }
    }

    @media only screen and (max-width:360px) {
        .sidebar-toggle {
            left: 60% !important;
        }

        .icon_home {
            width: 40% !important;
        }

        .icon_bed {
            width: 40% !important;
        }
    }

    .ip_in {
        background-color: #1dafa1;
        color: #fff;
    }

    .ip_in:hover {
        border: 1px solid crimson;
    }

    @media (min-width: 1200px) {
        #patientsearchheight .ui-grid-viewport {
            height: 404px !important;
            min-height: 405px;
            scroll-behavior: smooth;
            overflow: scroll !important;
            overflow-x: hidden !important;
        }
    }

    @media (min-width: 1360px) {
        #patientsearchheight .ui-grid-viewport {
            height: 404px !important;
            min-height: 411px;
            scroll-behavior: smooth;
            overflow: scroll !important;
            overflow-x: hidden !important;
        }
    }

    @media (device-width:100vw) and (device-height:100vh) {
        #patientsearchheight .ui-grid-viewport {
            height: 404px !important;
            min-height: 535px !important;
            scroll-behavior: smooth;
            overflow: scroll !important;
            overflow-x: hidden !important;
        }
    }

    .menu a {
        display: block;
        float: left;
        clear: both;
        font-size: 14px;
        line-height: 10px;
        width: 65px;
        color: #9b9b9f;
        font-weight: 600;
        padding-left: 3px;
        margin-bottom: 2px;
        margin-left: -11px;
    }

    .res-colortrack {
        background-color: #33b994 !important;
    }

    .content-wrapper {
        height: 86vh;
        min-height: 86vh;
        /* overflow-y: scroll; */
    }

    .pl-3 {
        padding-left: 2%;
    }
</style>

<div class="">
    <div class="col-sm-12">
        <div class="col-sm-4">
            <label class="col-sm-2 control-label filter-lbl" translate="Name"></label>
            <div class="col-sm-8">
                <div class="search">
                    <input type="text" id="pid" class="form-control" on-enter="getList()"
                        ng-model="currentfilter.patientnamemrn" placeholder="NAME/MRN"> <i class="fas fa-search"
                        aria-hidden="true"></i>
                </div>
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-5 col-md-4 control-label filter-lbl" translate="DOD"></label>
            <div class="col-sm-7 col-md-8">
                <div id="datepicker">
                <input type="text" class="form-control" name="dateofbirth" ng-change="getList()" datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}" ng-click="dateofbirthPopup = { opened: true }"
                    is-open="dateofbirthPopup.opened" ng-model="currentfilter.DOD">
            </div>
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-5 control-label filter-lbl" translate="Ward"></label>
            <div class="col-sm-7">
                <ui-select ng-model="currentfilter.WardId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Ward | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <!-- <div class="col-sm-4">
            <label class="col-sm-5 control-label filter-lbl" translate="bedmanagement-grid.filter_status.lbl"></label>
            <div class="col-sm-7">
                <multiselectchk list="lookup.AdmissionStatus" selected="currentfilter.admissionstatusid"
                    change="getList()"></multiselectchk>
            </div>
        </div> -->
    </div>
</div>
<custom-table config="vm.gridConfig"></custom-table>
<div class="container-fluid" id="patientidentitiesheight">
    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
                items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
