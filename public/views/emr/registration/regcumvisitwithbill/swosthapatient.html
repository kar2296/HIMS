<style>
    .modal-content {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, 75%);
    width: 35%;
    height: 32vh !important;
}
button#btnsubmit {
    position: relative;
    right: 20px;
    top: 15px;
}
input.autosearch-input {
    width: 96%;
}
/* #hospitaltab table.table.table-bordered.table-condensed.dropdown-menu {
    overflow-y: auto !important;
    overflow-x: unset !important;
} */
.modal-header.custom-modal-header h3, .h3 {
    font-size: 20px;
    color: white;
    text-align: inherit;
    margin-top: 3px !important;
    position: relative;
    right: 0;
    top: 0px;
    margin-bottom: 7px;
    left: 0;
}

<div class="modal-header custom-modal-header">
    <div class="col-sm-6">
            <h3 class="panel-title" translate="Hospital"></h3>
        </div>
        <div class="col-sm-6">
            <button type="button" class="btn btn-danger btn-sm pull-right" translate="x"
                ng-click="cancelCallback()"></button>
        </div>
</div>

<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
            <div class="formRoot">
                <div class="panel panel-default">
                    <div class="panel-body form-panel">
                        <div class="col-sm-12 " id="hospitaltab">
                            <!-- <autosearch itemid="item.PatientMRN" iteminfo="item.SelectedItem"
                                config="vm.facilityitemcontrolconfig" tabindex="1" placeholder="'HospitalName'">
                            </autosearch> -->
                            <label class="col-sm-12 control-label" for="patientmrn"
                                            translate="common.findswostha-mrn.lbl"></label>
                            <input type="text" name="patientmrn" class="form-control" tabindex="2"
                                                ng-model="item.PatientMRN" placeholder="Patient MRN" required >

                        </div>
                    </div>
                </div>

            </div>
            <div class="fooder-bgs" style="margin-bottom: 10px !important;">
                <div class="pull-right">
                <!-- <button type="button" id="cancelbutton" tabindex="-1" class="cancelbutton btn-danger text-white"
                    ng-click="cancelCallback()">Cancel</button> -->
                <button type="button" style="margin-top: -6px;" id="btnsubmit" class="draftbutton"
                    translate="Submit" ng-click="findItem()"></button>
                </div>
            </div>
        </form>
    </div>
</div>
