<script type="text/javascript">
    $(document).ready(function () {
        $("#calenderid").click(function () {
            $("i", this).toggleClass("fa fa-calendar fa fa-list");
        });
    });
</script>

<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-5 col-md-7">
            <h4 class="page-header mt0" translate="appointment.appointment-list.pagetitle.lbl"></h4>
        </div>
    </div>
</div>

<div class="container-fluid filter" id="appoinmentsheight">
    <div ui-grid="vm.gridConfig" class="table-uigrid" ui-grid-selection ng-show="!vm.appointment.ShowCalendar"></div>
    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
