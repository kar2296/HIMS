<style>
    .panel-body {
        padding: 15px;
        margin-left: 0px;
        margin-top: -26px;
        margin-right: 0px;
        margin-bottom: 0px;
        background-image: url(app/img/bg-body.jpg);
        background-repeat: repeat;
        overflow: auto;
    }

    .padding {
        padding: 5px;
    }

    .well {
        min-height: 20px;
        padding: 19px;
        margin-bottom: 0px;
        border: 1px solid #ededed;
        border-radius: 4px;
        background: rgb(233, 246, 253);
        /* Old browsers */
        background: -moz-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* FF3.6-15 */
        background: -webkit-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, rgb(250, 250, 250) 0%, rgb(247, 252, 253) 100%);
        /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid: DXImageTransform.Microsoft.gradient( startColorstr='#e9f6fd', endColorstr='#d3eefb', GradientType=0);
        /* IE6-9 */
        box-shadow: 4px 2px 13px -7px rgba(0, 0, 0, 0.75);
    }

    .formactionbar {
        padding: 5px 15px;
        height: 40px;
        background-color: #ccecf5;
    }

    .custom-modal-header {
        margin-bottom: 10px;
        background-color: #597a9a;
        color: #fff;
    }

    .modal-content {
        -webkit-box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        box-shadow: -1px 3px 20px 7px rgba(249, 244, 244, 0.5);
    }

    .modal-header {
        padding: 4px 10px;
        border-bottom: 1px solid #e5e5e5;
    }

    .head_font th span {
        color: #fff;
    }
</style>
<!--<ul class="breadcrumb">
        <li><a ng-click="backToList()" translate="guarantor-form-form.parentpagetitle.lbl"></a></li>
        <li class="active" translate="guarantor-form-form.pagetitle.lbl"></li>
    </ul>	-->
<div class="modal-header custom-modal-header">
    <div class="col-sm-6">
        <h4 class="modal-title custom-modal-title pull-left" translate="doctor-transfer.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-6">
        <button id="btnCancelForm" type="button" class="draftbutton" ng-click="cancelCallback()" translate="X"></button>
    </div>
</div>

<div class="row">
    <div class="col-sm-12">
        <div class="pull-right">
            <button class="btn-add" ng-click="addNew()" uib-tooltip="{{ 'admissions.addnew-tooltip.lbl' | translate }}"
                tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
            </button>
        </div>
    </div>
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="panel-body">
                <div class=" table-control">
                    <div class="formRoot">
                        <table class="table table-hover table-responsive table-bordered">
                            <thead class="bg-subhead head_font">
                                <tr>
                                    <th translate="doctor-transfer.doctorname.lbl"> </th>
                                    <th translate="doctor-transfer.department.lbl"> </th>
                                    <th translate="doctor-transfer.fromdate.lbl"> </th>
                                    <th translate="doctor-transfer.isprimary.lbl"> </th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="item in DoctorDetails">
                                    <td>
                                        <autosearch itemid="item.DoctorId" iteminfo="item.SelectedDoctor" rowdata="item" name="'doctor'" itemchange="doctorChange(item)"
                                            config="vm.doctorcontrolconfig" candisable="item.IsDisabled" isrequired="true"></autosearch>
                                    </td>
                                    <td>
                                        <ui-select ng-model="item.DepartmentId" name="departmentid" required ng-change="departmentChange()" ng-disabled="true">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </td>
                                    <td>
                                        <input type="text" class="form-control" name="StartDate" ng-date-object datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                                            datetime-picker="{{datePickerOptions.dateTimeFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                                            ng-click="StartDatePopup = { opened: true }" is-open="StartDatePopup.opened" ng-disabled="item.IsDisabled"
                                            ng-model="item.StartDate">
                                    </td>
                                    <td class="text-center">
                                        <input type="checkbox" class="custom-checkbox" ng-disabled="true" ng-model="item.IsPrimary">
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="fooder-bgs" style="margin-bottom: 49px !important;">

                <div class="pull-right">
                    <button type="button" class="draftbutton" ng-hide="currentcontext.AdmissionStatusId==5||currentcontext.AdmissionStatusId==6"
                        translate="common.saveaction.lbl" ng-click="saveItem()"></button>
                </div>
            </div>
        </form>
    </div>
</div>
