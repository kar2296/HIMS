<style>
    .nameinfo {
        font-size: 13px;
        font-weight: 700;
        color: #337ab7;
    }

    .nameinfo.mrninfo {
        color: black
    }

    .contactinfo {
        font-size: 10px;
        color: #808080;
    }

    .block {
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
    }

    .linkstyle {
        font-weight: 700;
        text-align: right;
    }

    .statusinfo {
        font-size: 13px;
    }

    .form-group {
        margin-bottom: 7px !important;
    }

    .sr-only {
        height: 22px !important;
    }

    .custom-grid-btn {
        width: 60px !important;
    }

    .page-header {
        margin: 0px !important;
    }

    .label {
        display: inline;
        padding: 3px;
        font-size: 82%;
        border-radius: 0;
        text-overflow: inherit;
    }

    .ui-grid-viewport {
        height: 495px!important;
    }

    @media screen and (max-width: 768px) and (orientation: portrait) {
        .layout-fixed .wrapper>section {
            margin-top: 41px !important;
        }
        .wrapper>.aside .aside-inner {
            padding-top: 58px !important;
        }
        #patientsearchheight .ui-grid-viewport{
            height:856px !important;
            min-height: 856px !important;
        }
    }

    @media screen and (max-width: 414px) and (orientation: portrait) {
        .layout-fixed .wrapper>section {
            margin-top: 60px !important;
        }
    }

    @media screen and (max-width: 736px) and (orientation: landscape) {
        .layout-fixed .wrapper>section {
            margin-top: 59px !important;
        }
    }

    @media screen and (max-width:1024px) {
        .control-label.filter-lbl.ng-scope {
            padding: 0px;
            margin: 0px;
        }
        #patientsearchheight .ui-grid-viewport {
    height: 564px !important;
    min-height:564px;
}
    }

    float: right;
}
.icon_bed {
    width: 2.5%;
    display: block;
    float: right;
    margin-right: 1%;
    margin-left: 1%;
} */
.ip_in {
    background-color: #1dafa1;
    color: #fff;
}
.ip_in:hover {
    border: 1px solid crimson;
}
#patientsearchheight .ui-grid-viewport{
    height: 436px !important;
}
@media (min-height: 675px) and (min-width: 1360px){
#patientsearchheight .ui-grid-viewport {
    height: 440px;
    min-height: 482px;
}}
</style>

<div class="row page-header sample">
    <div class="col-sm-6 col-md-6 col-lg-6">
    <h4 class="mt0 col-sm-12" translate="patientemr.patientprescription-list.pagetitle.lbl" style="width:60%;float:left;"></h4>
</div>
    <!-- <button class="btn bt-color2 btn-xs pull-right back_but">
        <a href="/www/index.html#/app/doctordashboard">
            <i class="fa fa-arrow-left"></i>&nbsp;&nbsp;
            <span class="ng-scope">Back</span>
        </a>
      </button> -->
      <div class="col-sm-6 col-md-6 col-lg-6">
      <span ng-click="doctor_dashboard()">   
                       
        <img src="app/img/main/download.png" class="img-responsive icon_home" alt="home"  uib-tooltip=" Doctor Dashboard " tooltip-placement="bottom">
   
    </span>      
<span ng-click="bed_management()">

<img src="app/img/main/235797.png" class="img-responsive icon_bed" alt="bed" uib-tooltip="  Bed Management " tooltip-placement="bottom">

</span> 
    <button class="btn-add" ng-click="addNew()" uib-tooltip="{{ 'patientemr.patientprescription-list.pagetitle.lbl' | translate }}"
        tooltip-placement="bottom">
        <i class="fa fa-plus" aria-hidden="true"></i>
        
    </button>
    </div>
</div>

<div>
    <label class="btn btn-secondary top-option" ng-repeat="option in options" ng-click="getList()" ng-model="currentcontext.option"
        uib-btn-radio="option.key">{{option.name}}</label>
</div>

<div class="row filter-area">
    <div class="col-sm-12">
        <div class="col-sm-4 ip_label_width">
            <div class="form-group">
                <label class="sr-only col-sm-5 col-md-4 control-label filter-lbl ip_label_hide" translate="registration.checkedinpatients.filter_patientname.lbl"></label>
                <div class="input-group col-sm-7 col-md-8 ip_inner_width">
                    <div class="input-group-addon"><i class="fas fa-search" aria-hidden="true"></i></div>
                    <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.patient" placeholder="Patient Name">
                </div>
            </div>
        </div>
        <div class="col-sm-4 ip_hide">
            <label class="col-sm-2 control-label filter-lbl" translate="patientemr.prescription-form.date.lbl"></label>
            <div class="col-sm-6">
                <input type="text" class="form-control" ng-change="getList()" uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                    ng-click="visitdatePopup = { opened: true }" is-open="visitdatePopup.opened" ng-model="currentfilter.PrescriptionDate">
            </div>
        </div>
        <div class="col-sm-4 ip_hide">
            <label class="col-sm-4 control-label filter-lbl" translate="registration.inpatients.filter_admissionstatus.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.PrecriptionStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.PrecriptionStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </div>
</div>
<div class="container-fluid patientsearchprofilebg" id="patientsearchheight">
    <div ui-grid="vm.gridConfig" class="table-uigrid height-control"></div>
    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
<script type="text/ng-template" id="prescriptionTemplate.html">
    <div class="patientprofilebg">
        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 block">
            <div class="ui-grid-cell-contents">
                <div class="col-xs-2 col-sm-2 col-md-1 col-lg-1 ip_pat_img">
                    <span ng-show="!row.entity.Patient.PhotoPath">
                    <img src="app/img/main/no-img-female.png" class="img-responsive image-height" ng-if="row.entity.Patient.GenderId == 2">
                    <img src="app/img/main/no-img-icon.png" class="img-responsive image-height" ng-if="row.entity.Patient.GenderId != 2">
                </span>
                    <img class="img-responsive image-height" ng-show="row.entity.Patient.PhotoPath && row.entity.Patient.Photo" data-ng-src="data:image/png;base64,{{row.entity.Patient.Photo}}"
                    />
                </div>
                <div class="col-xs-8 col-sm-8 col-md-4 col-lg-4 block">
                    <div class="nameinfo"> {{row.entity.Patient.Title.Description}} {{row.entity.Patient.FirstName}} {{row.entity.Patient.LastName}}</div>
                    <div class="nameinfo">
                        <span class="nameinfo mrninfo">MRN - {{row.entity.Patient.MRN ? row.entity.Patient.MRN : 'N/A' }}</span>                        &nbsp; | &nbsp; {{row.entity.Patient.Gender.Description ? row.entity.Patient.Gender.Description :
                        'N/A'}} &nbsp; | &nbsp; {{row.entity.Patient.Age ? ((row.entity.Patient.Age
                        <=1 ) ? row.entity.Patient.Age + 'Yr': row.entity.Patient.Age + ' Yrs') : 'N/A' }} &nbsp; | &nbsp; {{row.entity.Patient.DOB
                            ? (row.entity.Patient.DOB| date : 'dd-MMM-yyyy') : 'N/A'}} </div>
                            <div class="contactinfo" ng-if='row.entity.Patient.AddressLine1 || row.entity.Patient.AddressLine2'>
                                <i class="fa fa-envelope text-address"></i> : &nbsp; {{row.entity.Patient.AddressLine1 +
                                ',' }} {{row.entity.Patient.AddressLine2 ? row.entity.Patient.AddressLine2 + ',' : ""}} {{row.entity.Patient.Area
                                ? row.entity.Patient.Area + ',' : ""}} {{row.entity.Patient.City ? row.entity.Patient.City
                                + ',' : ""}} {{row.entity.Patient.State ? row.entity.Patient.State + ',' : ""}} {{row.entity.Patient.Country
                                ? row.entity.Patient.Country : ""}}
                            </div>
                            <div class="contactinfo" ng-if='!row.entity.Patient.AddressLine1 && !row.entity.Patient.AddressLine2'>
                                <i class="fa fa-envelope text-address"></i> : &nbsp; N/A
                            </div>
                            <div class="contactinfo">
                                <i class="fa fa-phone-square text-cell"></i> : {{row.entity.Patient.LandLine}} &nbsp; | &nbsp;
                                NRIC - {{row.entity.Patient.NationalityIdentifier ? row.entity.Patient.NationalityIdentifier
                                : 'N/A'}}
                            </div>
                    </div>
                    <div class="col-xs-3 col-sm-3 col-md-3 col-lg-3 ip_hide">
                        <ul class="timeline-xs">
                            <li class="timeline-item">
                                <div class="margin-left-15">
                                    <div class="text-muted text-small">
                                        <label class="label label-warning">{{ row.entity.Identifier }}</label>
                                        <div class="text-primary">
                                            <displaydate datetime-val="row.entity.PrescriptionDate"></displaydate>&nbsp;
                                            <div>
                                                <label class="label label-success"> {{row.entity.PrecriptionStatus.Description}}</label>|
                                                {{row.entity.PrescriptionPriority.Description}}
                                            </div>
                                        </div>
                                    </div>
                            </li>
                        </ul>
                        </div>
                        <div class="col-xs-3 col-sm-3 col-md-3 col-lg-3 ip_hide">
                            <ul class="timeline-xs">
                                <li class="timeline-item">
                                    <div class="margin-left-15">
                                        <div class="text-muted text-small">
                                            <div style="height: 24px;">&nbsp;</div>
                                            <div style="font-size: 13px;">
                                                <span class="text-primary">{{row.entity.Doctor.Title.Description}}</span>
                                                <span class="text-primary"></span>
                                                <span class="text-primary">{{row.entity.Doctor.FirstName}}</span>
                                                <span class="text-primary"></span>
                                                <span class="text-primary">{{row.entity.Doctor.LastName}}</span>
                                            </div>
                                        </div>
                                    </div>
                                </li>
                            </ul>
                        </div>
                        <div class="col-xs-1 col-sm-1 col-md-1 col-lg-1 ">
                            <button class="btn btn-default btn-xs ip_in" ng-click="grid.appScope.handleEvents('edit',row)" style="margin-top:25px;"><i class ="fa fa-chevron-right" aria-hidden="true"></i></button>
                        </div>
                    </div>
                </div>
            </div>
</script>
