<style>
    .durationtxt {
        width: 50px !important;
        float: left;
        margin-right: 5px;
    }

    .ui-select-grid {
        width: 100% !important;
        max-width: 100% !important;
    }

    .header-panel {
        margin-bottom: 5px !important;
    }

    div#prescriptionpagecontrol {
        margin-top: -53px;
    }

    /* ra css start */

    .fooderr-bg {
        background-color: #009ea1 !important;
        background-image: none !important;
    }

        position: fixed;
        bottom: 0;

        text-align: center;
        margin: 0px auto;
        position: fixed;
        bottom: 0px;
        left: 13%;
    }

    .fooderr-bg {
        width: 98%;
        text-align: center;
        margin: 0px auto;
    }

        height: 40px;
        padding: 5px !important;
        background-image: url(../../app/img/patterns-bg/weather.png) !important;

        margin-top: 0px;
    }

        height: 140px;
    }

    .pres-header {
        padding-left: -15px !important;
    }

    .pres-pag-header {
        padding-top: 5px !important;
    }

        width: inherit !important;
    }



    .header-panel-body {
        padding: 0px !important;
        padding-top: 6px !important;
    }

    table>tbody>tr>td {
        vertical-align: inherit !important;
    }

    .iconsize .autosearch-div>input {
        background-size: 20.7% !important;
    }

    .modal-content .panel-body {
        overflow: inherit;
    }

    .layout-fixed .wrapper>section {
        margin-top: 100px;
    }

    .btn-previouspres {
        height: 30px !important;
        width: 30px !important;
    }

    .btn-pp {
        padding: 7px;
    }

    .allergyAlert {
        color: #ff0000;
        margin-left: 20%;
    }

   

    .ui-select-bootstrap>.ui-select-choices,
    .ui-select-bootstrap>.ui-select-no-choice {
        max-height: 166px;
    }

        overflow-x: hidden;
    }

    /* table.table.table-bordered.table-condensed.dropdown-menu {
        width: 556px !important;
        max-width: 545px;
        overflow-x: hidden;
    } */

    .table>tbody>tr.active>th,
    .table>tbody>tr>td.active,
    .table>tbody>tr>th.active,
    .table>tfoot>tr.active>td,
    .table>tfoot>tr.active>th,
    .table>tfoot>tr>td.active,
    .table>tfoot>tr>th.active,

    .table>thead>tr>td.active,
    .table>thead>tr>th.active {
        color: #000000 !important;
    }

    #dropdownctrl>a>.label {
        left: 15px !important;
    }

    .table td {
        background: none !important;
    }

    .table>tbody>tr.active>td {
        background-color: #ea1c1c !important;
    }

    .table>tbody>tr>td {
        line-height: 1.528571 !important;
    }

    .table-condensed>thead>tr>td {
        padding: 0px;
    }

    .table td:first-child {
        border-top-left-radius: 0px !important;
        border-bottom-left-radius: 0px !important;

    }

    .table td:last-child {
        border-top-right-radius: 0px !important;
        border-bottom-right-radius: 0px !important;

    }

    .con_hdate {
        color: #13D;
    }

    .con_hname {
        color: #05a4f3;
    }

    .con_hdesc {
        color: #13D;
    }

    .con_hmaster {
        color: #05a4f3;
    }

    .hnotes {
        background: #a52a2a;
        color: #fff;
    }

    .formactionbar {
        margin: 0px;
    }

    div#mainresponsivetablecontrol {
      
        height: 222px !important;
    }

    .pres_comments {
        border: 1px solid #bdb9b9
    }

  

    .pres_comments .form-group0 label span {
      
        border: 1px solid #ccc;
        background: #645c00;
        font-size: 14px;
        border: 2px solid #697542;
        border-style: dotted;
        color: #000000 !important;
    }

    @media only screen and (max-width:414px) {
        div#mainresponsivetablecontrol {
            height: 381px !important;
        }
        .page-header button {
            margin: 0px;
        }
        #mainresponsivetablecontrol .bg-subhead {
            font-size: 12px;
        }
        .mpop_btn2 {
            margin-left: 0px !important;
        }
       
    }

    .col-sm-12.clearfix.pres_comments {
        position: inherit !important;
    }

    .modal-dialog.modal-full .col-sm-12.clearfix.pres_comments {
        height: 105px;
    }

    .fooder-bg {
        clear: both;
    }

    @media only screen and (max-width:1024px) {
      
        .cheader {
            padding-top: 5px;
        }
        .mpop_btns {
            padding: 0px !important;
        }
    }

    @media only screen and (max-width:768px) {
        div#prescriptionpagecontrol {
            margin-top: -10px;
        }
        .wrapper>.aside .aside-inner {
            padding-top: 42px!important;
        }
    }
</style>
<div id="prescriptionpagecontrol" class="tabsizetopcontroller">
    <react-component name="DoctorPrescribeFormHeader" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
    <patientbanner patientid="item.PatientId"></patientbanner>
    <div class="row">
        <div class="col-sm-12">
            <form id="item_form0" name="item_form" class="form-horizontal" role="form">
                <react-component name="DoctorPrescribeFormTabs" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>

                <div ng-show="canShowPrescriptionArea()">
                    <div class="panel panel-default header-panel mprescription_form">
                        <div class="panel-body form-panel header-panel-body">
                            <div class="col-sm-12">
                                <!-- first row -->
                                <div class="col-sm-4">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="patient" translate="patientemr.patientorder-form.patient.lbl"></label>
                                        <div class="col-sm-8">
                                            <patientsearch patientid="item.PatientId" ng-disabled="item.isAdmitted" class="" name="txtpatientsearch" patientinfo="selectedPatient"
                                                patientchange="patientChange()" tabindex="tabindexmap.patienttabindex" filterconfig="patientfilterconfig"
                                                required></patientsearch>
                                        </div>
                                    </div>
                                </div>
                                <react-component name="DoctorPrescribeFormFieldsRow1" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
                            </div>
                            <div class="col-sm-12">
                                <div class="col-sm-4">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="physician" translate="patientemr.prescription-form.physician.lbl"></label>
                                        <div class="col-sm-8">
                                            <autosearch itemid="item.DoctorId" iteminfo="" rowdata="" name="'doctorid'" config="vm.doctorcontrolconfig" itemchange="doctorChange()"
                                                candisable="IsDisabled" isrequired="true"></autosearch>
                                        </div>
                                    </div>
                                </div>
                                <react-component name="DoctorPrescribeFormFieldsRow2" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
                            </div>
                        </div>
                    </div>
                    <!-- grid area starts -->
                    <div id="mainresponsivetablecontrol" class="prescriptionheight doct_manageprescription">
                        <table class="table table-hover table-responsive table-bordered">
                            <thead class="bg-subhead">
                                <tr>
                                    <th class="fs-12 col-sm-2">
                                        <span translate="patientemr.prescription-form.rxname.lbl" for="generic"></span>
                                        <span class="mandatory-asterix">*</span>
                                    </th>
                                    <th class="fs-12 col-sm-2">
                                        <span translate="patientemr.prescription-form.generic.lbl"></span>
                                    </th>
                                    <th class="fs-12 col-sm-1">
                                        <span translate="patientemr.prescription-form.dosage.lbl"></span>
                                        <span class="mandatory-asterix">*</span>
                                    </th>
                                    <th class="fs-12 col-sm-1">
                                        <span translate="patientemr.prescription-form.route.lbl"></span>
                                        <span class="mandatory-asterix">*</span>
                                    </th>
                                    <th class="fs-12 col-sm-1">
                                        <span translate="patientemr.prescription-form.frequency.lbl"></span>
                                        <span class="mandatory-asterix">*</span>
                                    </th>
                                    <th class="fs-12 col-md-1">
                                        <span translate="patientemr.prescription-form.duration.lbl"></span>
                                        <span class="mandatory-asterix">*</span>
                                    </th>
                                    <th class="fs-12 col-sm-1">
                                        <span translate="patientemr.prescription-form.duration.lbl"></span>
                                        <span class="mandatory-asterix">*</span>
                                    </th>
                                    <th class="fs-12 col-sm-1 cell-align-center">
                                        <span translate="patientemr.prescription-form.qty.lbl"></span>
                                        <span class="mandatory-asterix">*</span>
                                    </th>
                                    <th class="fs-12 col-sm-1 cell-align-center">
                                        <span translate="patientemr.prescription-form.price.lbl"></span>
                                    </th>
                                    <th class="fs-12 col-sm-1 cell-align-center">
                                        <span translate="patientemr.prescription-form.availqty.lbl"></span>
                                    </th>
                                    <th class="fs-12 col-sm-1 cell-align-center">
                                        <span translate="patientemr.prescription-form.druginstruct.lbl"></span>
                                    </th>
                                    <th class="fs-12 col-sm-2 cell-align-center">
                                        <span translate="patientemr.prescription-form.action.lbl"></span>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="item in prescriptionDetails | filter:{Status:1}">
                                    <td class="fs-12 iconsize">
                                        <autosearch controlid="'dgname'" itemid="item.DrugId" iteminfo="item.SelectedItem" name="'drug'" rowdata="item" config="vm.drugcontrolconfig"
                                            ng-if="!item.IsGeneric" itemchange="drugChanged($index,item)" class="inputsearchlogo"
                                            candisable="IsDisabled" isrequired="true"></autosearch>

                                        <!--<autosearch itemid="item.GenericId" iteminfo="item.SelectedItem" name="'generic'" rowdata="item"
                                                         config="vm.genericcontrolconfig" ng-if="item.IsGeneric" itemchange="drugChanged($index,item)"
                                                         class="inputsearchlogo" isrequired="true"></autosearch>-->

                                        <!--<drugcontrol drugid="item.DrugId" drugrouteid="item.DrugRouteId" rxname="item.RxName"
                                                        drugfrequencyid="item.DrugFrequencyId" changeev="drugChanged($index,item)"
                                                        ng-show="!item.IsGeneric"></drugcontrol>-->

                                        <!--<genericcontrol genericid="item.GenericId" changeev="drugChanged($index,item)" rxname="item.RxName" ng-disabled="IsDisabled"
                                                        ng-show="item.IsGeneric"></genericcontrol>-->
                                    </td>
                                    <td class="fs-12 cstm_batch">
                                        <span uib-tooltip="{{item.DrugGenericName}}" tooltip-placement="bottom">{{item.DrugGenericName}}</span>
                                        <button ng-if="item.DrugGenericId" type="button" class="btn btn-info btn-xs pull-right0" tabindex="-1" ng-click="alternateDetails($index, item)"
                                            ng-disabled="IsDisabled">
                                            <i class="fa fa-calendar-check-o" aria-hidden="true"></i>
                                        </button>
                                    </td>
                                    <td class="fs-12">
                                        <input id='dgdoesage{{$index}}' type="text" class="form-control" ng-disabled="IsDisabled" ng-model="item.Dosage" placeholder="">
                                    </td>
                                    <td class="fs-12">
                                        <ui-select id='dgroute{{$index}}' ng-model="item.DrugRouteId" name="screen" ng-disabled="IsDisabled" class="ui-select-grid">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.DrugRoute | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </td>
                                    <td class="fs-12">
                                        <ui-select id='dgfreq{{$index}}' ng-model="item.DrugFrequencyId" ng-disabled="IsDisabled" class="ui-select-grid" ng-change="computeQuantity(item)">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.DrugFrequency | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </td>
                                    <td class="fs-12 input_width1">
                                        <input id='dgduration{{$index}}' type="text" class="form-control" ng-model="item.Duration" placeholder="" ng-disabled="IsDisabled"
                                            ng-change="computeQuantity(item)">
                                    </td>
                                    <td class="fs-12 input_width1">
                                        <ui-select id='dgduraperiod{{$index}}' ng-model="item.DurationPeriodId" class="ui-select-period" ng-disabled="IsDisabled"
                                            ng-change="computeQuantity(item)">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.DurationPeriod | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </td>
                                    <td class="fs-12 cell-align-center">
                                        <input id='Quantity{{$index}}' type="text" class="form-control" ng-disabled="IsDisabled" ng-model="item.Quantity" placeholder="">
                                    </td>
                                    <td class="fs-12 cell-align-center">
                                        <span>{{item.Price}}</span>
                                    </td>
                                    <td class="fs-12 cell-align-center">
                                        <span>{{item.AvailQuantity}}</span>
                                    </td>
                                    <td class="fs-12 cell-align-center">
                                        <ui-select id='dgfreq{{$index}}' ng-model="item.DrugInstructionId" ng-disabled="IsDisabled" class="ui-select-grid" ng-change="computeQuantity(item)">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.DrugInstruction | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </td>
                                    <td class="fs-12 cell-align-center">
                                        <button  class="drhms-edit-button" tabindex="-1" ng-click="editPrescriptionDetail(item)">
                                            <img  src="assets/svg/edit.svg" alt="">
                                            <!-- <i class="fa fa-pencil" aria-hidden="true"></i> -->
                                        </button>
                                        <!--<button class="btn btn-danger btn-xs" ng-click="deletePrescriptionDetail($index,item)" ng-disabled="isDisabled">
                                                        <i class="fa fa-trash" aria-hidden="true"></i>
                                                    </button>-->
                                        <button  class="drhms-edit-button" tabindex="-1" ng-click="deletePrescriptionDetail($index,item)" ng-disabled="isDisabled"
                                            ng-hide="IsDisabled && currentcontext.ismodal && canShowPatientControl">
                                            <img src="assets/svg/delete.svg" alt="">
                                            <!-- <i class="fa fa-trash" aria-hidden="true"></i> -->
                                        </button>
                                        <button class="btn btn-info btn-xs" ng-click="drugprofiledetails(item.DrugId)" style="background-color: orange;" ng-if="item.DrugId>0"
                                            uib-tooltip="{{ 'patientemr.patientorder-form.druginfo.lbl' | translate }}" tooltip-placement="bottom">
                                            <i class="icon-info-sign" aria-hidden="true"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <react-component name="DoctorPrescribeFormNotesSection" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
                    <!-- grid area ends -->
                    <react-component name="DoctorPrescribeFormFooter" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
                </div>
                <div ng-show="canShowTickSheetArea()">
                    <ticksheetcontrol config="ticksheetconfig" addclick="addTickSheet()" storeid="item.PharmacyId" saveclick="saveTickSheets()"></ticksheetcontrol>
                </div>
                <div ng-show="canShowPanelsArea()">
                    <panelcontrol config="panelconfig" saveclick="savePanels()"></panelcontrol>
                </div>

            </form>
        </div>
    </div>
</div>
