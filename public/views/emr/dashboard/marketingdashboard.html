    }

        overflow: auto;

        display: inline-block;
        position: relative;
        width: 100%;
        border-radius: 4px;
        color: rgba(0, 0, 0, .87);

<div class="row">
    <div class="background-color">
        <div class="container-fluid">
            <div class="row page-titles">

                            </ol>
                        </div>
                    </div>
                </div>
            </div> 
            <div id="dash-board">
                <div class="col-sm-6 clearfix" style=" margin-top: 18px;">
                   
                    <div class="col-sm-12 col-md-6 col-lg-6 info_table" style=" margin-top: 18px;">
                        <div class="card-box section-item">
                            <table class="card-body" id="bannerdetails">
                                <thead>
                                    <th class="" style="width: 165px;">
                                        <span translate="Referral Doctor"></span>
                                    </th>
                                    <th class="cus-col tbl-header tab2 currencyAlign">
                                        <span translate="OP"></span>
                                    </th>
                                    <th class="cus-col tbl-header tab2 currencyAlign">
                                        <span translate="IP"></span>
                                    </th>
                                    <th class="cus-col tbl-header tab2 currencyAlign">
                                        <span translate="Total"></span>
                                    </th>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="ref in ReferralDoctor">
                                        <td class="cus-col tbl-header"><span>{{ref.Referral}}</span></td>
                                        <td class="currencyAlign">{{ref.OpCount}}</td>
                                        <td class="currencyAlign">{{ref.IpCount}}</td>
                                        <td class="currencyAlign">{{ref.TotalCount}}</td>
                                    </tr>
                                    <tr class="backgroundColor-propertity">
                                        <td class="cus-col tbl-header cust_total0 ">
                                            Total
                                        </td>
                                        <td class="cus-col tbl-header cust_total0 currencyAlign">
                                            {{TotOP}}
                                        </td>
                                        <td class="cus-col tbl-header cust_total0 currencyAlign">
                                            {{TotIP}}
                                        </td>
                                        <td class="cus-col tbl-header cust_total0 currencyAlign">
                                            {{TotTotCount}}
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 clearfix" style=" margin-top: 18px;">
                   
                    <div class="col-sm-12 col-md-6 col-lg-6 info_table" style=" margin-top: 18px;">

                            <table class="card-body" id="bannerdetails">
                                <thead>
                                    <th class="" style="width: 165px;">

                                    </th>
                                    <th class="cus-col tbl-header tab2 currencyAlign">

                                    <th class="cus-col tbl-header tab2 currencyAlign">

                                        <td class="currencyAlign">{{ins.ContractExpiryDate}}</td> 
                                    </tr> 
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
