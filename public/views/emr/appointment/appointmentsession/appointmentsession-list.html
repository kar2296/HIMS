<div class="row">
    <div class="drhms-list-filters">
        <div class="col-sm-4">
            <label class="col-sm-3"
                translate="appointment.appointmentsession-list.filter_appointmentsessiontype.lbl"></label>
            <div class="col-sm-9">
                <ui-select ng-model="currentfilter.AppointmentSessionTypeId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.AppointmentSessionType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-3" translate="appointment.appointmentsession-list.doctortype.lbl"></label>
            <div class="col-sm-9">
                <ui-select ng-model="currentfilter.DoctorId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Doctor | filter: { Text: $select.search }">
                        <span ng-bind-html="lookupitem.Title.Description | highlight: $select.search"></span>
                        <!--<span ng-bind-html="lookupitem.LastName | highlight: $select.search"></span>-->
                        <span ng-bind-html="lookupitem.Text | highlight: $select.search"></span>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-3" translate="appointment.appointmentsession-list.filter_status.lbl"></label>
            <div class="col-sm-9">
                <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </div>
</div>
<div class="fooder-bgs" style="margin-bottom: 200px !important;">
    <div class="row">
        <custom-table config="vm.gridConfig"></custom-table>
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
