<link href="app/css/regbilling.css" rel="stylesheet">
<style>
    .form-group {
        height: 72px;
    }

    .bottom {
        height: 80px !important;
    }

    /* table.table.table-bordered.table-condensed.dropdown-menu.align {
        margin-left: -80px;
    } */
</style>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
        <div class="row">
            <div class="form-group col-lg-3">
                <label class="col-lg-12 control-label" for="appointmentsessiontype"
                    translate="appointment.appointmentsession-form.appointmentsessiontype.lbl"></label>
                <div class="col-lg-12">
                    <ui-select ng-model="item.AppointmentSessionTypeId" name="appointmentsessiontype" required>
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.AppointmentSessionType | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="form-group col-lg-3">
                <label class="col-lg-12 control-label" for="clinics"
                    translate="appointment.appointmentsession-form.clinics.lbl"></label>
                <div class="col-lg-12">
                    <ui-select ng-model="item.ClinicId" name="clinics" required>
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.Clinic | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="form-group col-lg-3" ng-show="canShowPhysicianArea()">
                <label class="col-lg-12 control-label" for="doctor"
                    translate="appointment.appointmentsession-form.doctor.lbl"></label>
                <div class="col-lg-12">
                    <autosearch itemid="item.DoctorId" iteminfo="" rowdata="" config="vm.doctorcontrolconfig"
                        itemchange="doctorChange()"></autosearch>
                </div>
            </div>
            <div class="form-group col-lg-3" ng-show="canShowResourceArea()">
                <label class="col-lg-12 control-label" for="resource"
                    translate="appointment.appointmentsession-form.resource.lbl"></label>
                <div class="col-lg-12">
                    <ui-select ng-model="item.ResourceId" name="resource">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.Resource | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="form-group col-lg-3">
                <label class="col-lg-12 control-label" for="sessiontype"
                    translate="appointment.appointmentsession-form.sessiontype.lbl"></label>
                <div class="col-lg-12">
                    <ui-select ng-model="item.SessionTypeId" name="sessiontype" required>
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.SessionType | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>

            <div class="form-group col-lg-3">
                <label class="col-lg-12 control-label" for="startdate"
                    translate="appointment.appointmentsession-form.startdate.lbl"></label>
                <div class="col-lg-12">
                    <input type="text" class="form-control" name="Chequedate" ng-date-object
                        datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="activefromPopup = { opened: true }"
                        is-open="activefromPopup.opened" ng-model="item.StartDate">

                </div>
            </div>
            <div class="form-group col-lg-3">
                <label class="col-lg-12 control-label" for="enddate"
                    translate="appointment.appointmentsession-form.enddate.lbl"></label>
                <div class="col-lg-12 bottomleft">
                    <input type="text" class="form-control" name="enddate" ng-date-object required
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="enddatePopup = { opened: true }"
                        is-open="enddatePopup.opened" ng-model="item.EndDate">
                </div>
            </div>
            <div class="form-group col-lg-6">
                <div class="col-lg-3">
                    <label class="col-lg-8 control-label" for="monday"
                        translate="appointment.appointmentsession-form.monday.lbl"></label>
                    <div class="col-lg-4">
                        <input type="checkbox" name="monday" class="custom-checkbox" ng-model="item.IsMonday">
                    </div>
                </div>
                <div class="col-lg-3">
                    <label class="col-lg-8 control-label" for="tuesday"
                        translate="appointment.appointmentsession-form.tuesday.lbl"></label>
                    <div class="col-lg-4">
                        <input type="checkbox" name="tuesday" class="custom-checkbox" ng-model="item.IsTuesday">
                    </div>
                </div>
                <div class="col-lg-3">
                    <label class="col-lg-8 control-label" for="wednesday"
                        translate="appointment.appointmentsession-form.wednesday.lbl"></label>
                    <div class="col-lg-4">
                        <input type="checkbox" name="wednesday" class="custom-checkbox" ng-model="item.IsWednesday">
                    </div>
                </div>
                <div class="col-lg-3">
                    <label class="col-lg-8 control-label" for="thursday"
                        translate="appointment.appointmentsession-form.thursday.lbl"></label>
                    <div class="col-lg-4">
                        <input type="checkbox" name="thursday" class="custom-checkbox" ng-model="item.IsThursday">
                    </div>
                </div>
                <div class="col-lg-3">
                    <label class="col-lg-8 control-label" for="friday"
                        translate="appointment.appointmentsession-form.friday.lbl"></label>
                    <div class="col-lg-4">
                        <input type="checkbox" name="friday" class="custom-checkbox" ng-model="item.IsFriday">
                    </div>
                </div>
                <div class="col-lg-3">
                    <label class="col-lg-8 control-label" for="saturday"
                        translate="appointment.appointmentsession-form.saturday.lbl"></label>
                    <div class="col-lg-4">
                        <input type="checkbox" name="saturday" class="custom-checkbox" ng-model="item.IsSaturday">
                    </div>
                </div>
                <div class="col-lg-3">
                    <label class="col-lg-8 control-label" for="sunday"
                        translate="appointment.appointmentsession-form.sunday.lbl"></label>
                    <div class="col-lg-4">
                        <input type="checkbox" name="sunday" class="custom-checkbox" ng-model="item.IsSunday">
                    </div>
                </div>
                <div class="col-lg-3">
                    <label class="col-lg-8 control-label" for="all"
                        translate="appointment.appointmentsession-form.all.lbl"></label>
                    <div class="col-lg-4">
                        <input type="checkbox" name="all" class="custom-checkbox" ng-model="item.IsAll"
                            ng-change="allChkChanged()">
                    </div>
                </div>
            </div>
            <div class="form-group col-lg-3">
                <label class="col-lg-12 control-label" for="isactive"
                    translate="clinicalmaster.chiefcomplaint-form.isactive.lbl"></label>
                <div class="col-lg-12">
                    <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
                </div>
            </div>
            <div class="form-group col-lg-3">
                <label class="col-lg-12 control-label" for="slottype"
                    translate="appointment.appointmentsession-form.slottype.lbl"></label>
                <div class="col-lg-12">
                    <ui-select ng-model="item.AppointmentSlotTypeId" name="slottype" required>
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.AppointmentSlotType | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="form-group col-lg-3">
                <label class="col-lg-12 control-label" for="duration"
                    translate="appointment.appointmentsession-form.duration.lbl"></label>
                <div class="col-lg-12">
                    <input type="text" class="form-control" name="duration" ng-model="item.SlotDuration" placeholder=""
                        required>
                </div>
            </div>
            <div class="form-group col-lg-3">
                <label class="col-lg-12 control-label" for="maxslotperday"
                    translate="appointment.appointmentsession-form.maxslotperday.lbl"></label>
                <div class="col-lg-12">
                    <input type="text" class="form-control" name="maxslotperday" ng-model="item.MaxSlotPerDay"
                        placeholder="">
                </div>
            </div>
            <div class="col-lg-12 no-pad">
                <div class="form-group col-lg-3 bottom">
                    <label class="col-lg-12 control-label" for="starttime"
                        translate="appointment.appointmentsession-form.starttime.lbl"></label>
                    <div class="col-lg-12">
                        <uib-timepicker name="starttime" ng-model="item.StartTime" ng-time-object
                            required></uib-timepicker>
                    </div>
                </div>
                <div class="form-group col-lg-3 bottom">
                    <label class="col-lg-12 control-label" for="endtime"
                        translate="appointment.appointmentsession-form.endtime.lbl"></label>
                    <div class="col-lg-12">
                        <uib-timepicker name="endtime" ng-model="item.EndTime" ng-time-object required>
                        </uib-timepicker>
                    </div>
                </div>
                <div class="form-group col-lg-3 bottom">
                    <label class="col-lg-12 control-label" for="breakfrom"
                        translate="appointment.appointmentsession-form.breakfrom.lbl"></label>
                    <div class="col-lg-12">
                        <uib-timepicker name="breakfrom" ng-model="item.BreakFrom" ng-time-object>
                        </uib-timepicker>
                    </div>
                </div>
                <div class="form-group col-lg-3 bottom">
                    <label class="col-lg-12 control-label" for="breakto"
                        translate="appointment.appointmentsession-form.breakto.lbl"></label>
                    <div class="col-lg-12">
                        <uib-timepicker name="breakto" ng-model="item.BreakTo" ng-time-object>
                        </uib-timepicker>
                    </div>
                </div>
            </div>
            <div class="form-group col-lg-3">
                <label class="col-lg-12 control-label" for="noofscheduleappt"
                    translate="appointment.appointmentsession-form.noofscheduleappt.lbl"></label>
                <div class="col-lg-12">
                    <input type="text" class="form-control" name="noofscheduleappt" ng-model="item.NoofScheduleAppt"
                        placeholder="">
                </div>
            </div>
            <div class="form-group col-lg-3">
                <label class="col-lg-12 control-label" for="noofwalkinpatient"
                    translate="appointment.appointmentsession-form.noofwalkinpatient.lbl"></label>
                <div class="col-lg-12">
                    <input type="text" class="form-control" name="noofwalkinpatient" ng-model="item.NoofWalkInPatient"
                        placeholder="">
                </div>
            </div>
            <div class="form-group col-lg-3">
                <label class="col-lg-12 control-label" for="holidayfrom"
                    translate="appointment.appointmentsession-form.holidayfrom.lbl"></label>
                <div class="col-lg-12 topright">
                    <input type="text" class="form-control " name="holidayfrom" ng-date-object
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="holidayfromPopup = { opened: true }"
                        is-open="holidayfromPopup.opened" ng-model="item.HolidayFrom">
                </div>
            </div>
            <div class="form-group col-lg-3">
                <label class="col-lg-12 control-label" for="holidayto"
                    translate="appointment.appointmentsession-form.holidayto.lbl"></label>
                <div class="col-lg-12 topright">
                    <input type="text" class="form-control " name="holidayto" ng-date-object
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="holidaytoPopup = { opened: true }"
                        is-open="holidaytoPopup.opened" ng-model="item.HolidayTo">
                </div>
            </div>

        </div>

        <div class="fooder-bgs">
            <div class="row ">
                <div class="col-sm-12">
                    <div class="pull-left">
                        <button class="btn pyr-color10 btn-sm" type="button" ng-click="backToList()">
                            <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                            <span class="btn-fontsize" translate="common.backaction.lbl"></span>
                        </button>
                    </div>
                    <div class="pull-right">
                        <button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl"
                            ng-click="save()"></button>
                        <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                            ng-click="saveAndApprove()"></button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
