<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-5 col-md-4">
            <h3 class="panel-title" translate="appointment.appointmentcategory-form.pnlappointmentcategory.lbl"></h3>
        </div>
        <div class="col-sm-7 col-md-8">
    <button class="btn-add" ng-click="backToList()" uib-tooltip="{{ 'appointment.appointmentcategory-list.pagetitle.lbl' | translate }}"
                tooltip-placement="bottom">
        <i class="fa fa-plus" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</div>

<div class="row" id="breadcrumpheader-height">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot">
                <div class="panel panel-default  bg-pattern">
                    <div class="panel-body form-panel">
                        <div class="col-sm-12">

                            <!-- leftpanel -->
<div class="col-sm-6 well">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="facility" translate="appointment.appointmentcategory-form.facility.lbl">*</label>
                                        <div class="col-sm-8">
                                            <ui-select ng-model="item.FacilityId" name="facility" required>
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="appointmentcategorytype" translate="appointment.appointmentcategory-form.appointmentcategorytype.lbl"></label>
                                        <div class="col-sm-8">
                                            <ui-select ng-model="item.AppointmentCategoryTypeId" name="appointmentcategorytype">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.AppointmentCategoryType | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="name" translate="appointment.appointmentcategory-form.name.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="name" ng-model="item.Name" placeholder="" required>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="color" translate="appointment.appointmentcategory-form.color.lbl"></label>
                                        <div class="col-sm-6">
                                            <input type="text" colorpicker class="form-control" name="color" ng-model="item.Color" required>
                                        </div>
                                        <div style='height:33px;background:{{item.Color}}' class='col-sm-2'>
</div>
</div>
<div class="form-group">
    <label class="col-sm-4 control-label" for="isactive" translate="appointment.appointmentcategory-form.isactive.lbl"></label>
    <div class="col-sm-8">
        <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
    </div>
</div>
<div class="form-group">
    <label class="col-sm-4 control-label" for="description" translate="appointment.appointmentcategory-form.description.lbl"></label>
    <div class="col-sm-8">
        <input type="text" class="form-control" name="description" ng-model="item.Description" placeholder="">
    </div>
</div>
</div>
</div>
 </div>
                </div>
            </div>
            <div class="fooder-bgs">
                <div class="row ">
                    <div class="col-sm-12">
                        <div class="col-sm-4 col-md-4">
                            <div class="pull-left">
                                <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()"><i class="fa fa-angle-left" aria-hidden="true" ></i>&nbsp;&nbsp;<span class="btn-fontsize"  translate="common.backaction.lbl"></span></button>
                            </div>
                        </div>
                        <div class="col-sm-8 col-md-8">
                            <div class="pull-right">
                                <button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
                                <button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                                <button id="btnClearForm" type="button" class="btn btn-warning btn-sm ng-scope" ng-click="clear()" translate="common.clearaction.lbl"></button>
                                <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
