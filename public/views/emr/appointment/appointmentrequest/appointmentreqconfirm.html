<style>
    .modal-content .panel-body {
        overflow: inherit;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-12 ">

        <h3 class="panel-title" translate="appointment.apptreqtconfirm.pagetitle.lbl"></h3>
    </div>

</div>
</div>

<div class="row" id="depheight">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot">
                <div class="panel panel-default">
                    <div class="">
                        <div class="col-sm-12">

                            <div class="col-sm-12">
                                <div class="col-sm-12">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="facility" translate="appointment.apptreqtconfirm.patientname.lbl"></label>
                                        <div class="col-sm-8">
                                            <span> <strong> {{item.PatientName}} / {{item.MRN}} / {{item.Age}} yrs / {{item.DOB}} </strong> </span>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="facility" translate="appointment.apptreqtconfirm.mobilenr.lbl"></label>
                                        <div class="col-sm-8">
                                            <span> <strong> {{item.MobileNr}} </strong> </span>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" translate="appointment.apptreqtconfirm.date.lbl"></label>
                                        <div class="col-sm-8">
                                            <span> <strong> {{item.ApptDispDate}}</strong> </span>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" translate="appointment.apptreqtconfirm.doctor.lbl"></label>
                                        <div class="col-sm-8">
                                            <span> <strong> {{item.DoctorName}}</strong> </span>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" translate="appointment.apptreqtconfirm.status.lbl"></label>
                                        <div class="col-sm-8">
                                            <span> <strong> {{item.AppointmentRequestStatus}}</strong> </span>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" translate="appointment.apptreqtconfirm.reason.lbl"></label>
                                        <div class="col-sm-8">
                                            <span> <strong> {{item.Reason}}</strong> </span>
                                        </div>
                                    </div>

                                </div>
                            </div>



                        </div>
                    </div>
                </div>
            </div>
            <div class="fooder-bgs">
                <div class="row ">
                    <div class="col-sm-12">
                        <div class="pull-left">

                        </div>
                        <div class="pull-right">
                            <button id="btnSchedule" type="button" class="draftbutton" ng-if="notsubmitted && item.AppointmentRequestStatusId <= 1"
                                translate="appointment.apptreqtconfirm.schedule.lbl" ng-click="SaveItem(schedule, 1)"></button>
                            <button id="btnConfirm" type="button" class="btn dem-color4 text-white btn-sm" ng-if="notsubmitted && item.AppointmentRequestStatusId <= 2"
                                translate="appointment.apptreqtconfirm.confirm.lbl" ng-click="SaveItem(confirm, 2)"></button>
                            <button id="btnCancel" type="button" class="btn btn-warning btn-sm" ng-if="notsubmitted && item.AppointmentRequestStatusId <= 3"
                                translate="appointment.apptreqtconfirm.cancel.lbl" ng-click="SaveItem(cancel, 3)"></button>
                            <button id="btnCancelForm" type="button" class="draftbutton" translate="appointment.apptreqtconfirm.exit.lbl"
                                ng-click="backToList()"></button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
