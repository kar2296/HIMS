<style>
.table-uigrid.ui-grid .ui-grid-viewport{
    height: 70vh !important;
    min-height: 70vh;
}
</style>
<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="appointment.appointmentreq-list.pagetitle.lbl"></h4>
    <div class="col-sm-6">

    </div>
</div>
<div class="row filter-area">
    <div class="col-sm-12">
        <div class="col-sm-4 col-md-3 col-lg-4 clearfix ">
            <label class="col-sm-4  col-lg-4 control-label filter-lbl" translate="appointment.appointment-list.filter_doctor.lbl"></label>
            <div class="col-sm-8 col-md-8 col-lg-8 drop_width">
                <multiselectchk list="lookup.Doctor" selected="currentfilter.DoctorId" change="getList()"></multiselectchk>
            </div>
        </div>
        <div class="col-sm-4 col-md-3 col-lg-4">
            <label class="col-sm-4 control-label filter-lbl" translate="appointment.appointment-form.appointmentdate.lbl"></label>
            <div class="col-sm-8 bottomlefttext">
                <input type="text" class="form-control" name="appointmentdate" ng-change="getList()" datepicker-options="datePickerOptions"
                    show-button-bar="{{datePickerOptions.showButtonBar}}" uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="appointmentdatePopup = { opened: true }"
                    is-open="appointmentdatePopup.opened" ng-model="currentfilter.appointmentdate">
            </div>
        </div>
        <div class="col-sm-4 col-md-3 col-lg-4">
            <label class="col-sm-6 col-md-4 col-lg-4 control-label filter-lbl" translate="appointment.appointment-list.filter_appointmentstatus.lbl"></label>
            <div class="col-sm-6 col-md-7 col-lg-8 drop_width">
                <multiselectchk list="lookup.AppointmentRequestStatus" selected="currentfilter.AppointmentRequestStatusId" change="getList()"></multiselectchk>
            </div>
        </div>
    </div>
</div>
<div class="container-fluid" id="depsheight">
    <div ui-grid="vm.gridConfig" class="table-uigrid table-uigrid-tab "></div>

    <div class="fooder-bgs">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize"
            start-index="vm.gridConfig.pagerObj.startIndex" ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
