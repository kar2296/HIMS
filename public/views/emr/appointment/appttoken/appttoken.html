<style>
    .modal-lg {
        width: 500px;
        margin: 30px auto;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="ordermanagement.token.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="backToList()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <react-component name="AppttokenFormPanel" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
    </form>
</div>

<div class="">
    <react-component name="AppttokenFooter" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
</div>
