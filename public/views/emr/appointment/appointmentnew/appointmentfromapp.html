<style>
    .modal-lg {
        width: 85% !important;
    }

    .appt-top-label {
        margin-top: 5px !important;
    }

    .modal-content {
        -webkit-box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        box-shadow: -1px 3px 20px 7px rgba(249, 244, 244, 0.5);
    }

    .modal-header {
        padding: 4px 10px;
        border-bottom: 1px solid #e5e5e5;
    }

    .custom-modal-header {
        padding: -1px;
        background-color: #597a9a;
        color: #fff;
    }

    .panel-footer {
        padding: 4px 15px;
        background-color: #bdd8fb;
        border-top: 1px solid #bdd8fb;
        border-bottom-right-radius: 3px;
        border-bottom-left-radius: 3px;
    }

    .panel-body {
        padding: 1px;
        height: 346px !important;
        overflow-y: auto;
        margin-right: 0px;
        margin-bottom: 0px;
        background-image: url(app/img/bg-body.jpg);
        background-repeat: repeat;
        overflow: auto;
    }

    .custom-modal-header {
        margin-bottom: 0px;
    }

    @media (max-width: 768px) {
        .modal-dialog {
            margin: 6px 10px 10px 22px !important;
        }

        .custom-modal-header {
            padding: 0px;
            padding-top: 7px !important;
        }
    }

    @media (max-width: 1360px) {
        .custom-modal-header {
            padding: 0px;
            padding-top: 3px;
        }
    }

    .uib-daypicker th,
    td {
        border: 1px solid black;
        padding: 1px 3px !important;
    }

    .uib-datepicker.ng-scope.ng-isolate-scope {
        width: 342px !important;
    }

    /* .btn-sm, .btn-group-sm > .btn {
    padding: 0px 0px;
} */
</style>
