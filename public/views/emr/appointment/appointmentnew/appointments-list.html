<style>
    .table-uigrid.ui-grid .ui-grid-cell.ui-grid-row-header-cell {
        background: #23b7e5;
    }

    .table-uigrid.ui-grid .ui-grid-row.ui-grid-row-selected>[ui-grid-row]>.ui-grid-cell {
        background-color: lightgreen;
    }

    .ui-grid-cell.ui-grid-disable-selection.ui-grid-row-header-cell {
        pointer-events: all;
    }

    .ui-grid-render-container-left .ui-grid-viewport {
        width: 30px;
        height: 402px !important;
    }

    .ui-select-multiple.ui-select-bootstrap {
        height: auto;
        padding: 3px 3px 0 3px;
        max-height: 30px;
        overflow: visible;
    }

    .bottomlefttext .dropdown-menu {
        top: 26px !important;
        left: -93px !important;
    }

    .drop_width multiselectchk button {
        width: 100%;
    }

    .grid-action-icon {
        margin-left: 1px;
    }

    div#scheduler {
        height: 443px !important;
    }

    .custom_align {
        padding-right: 11px;
        padding-left: 10px;
    }

    .col-sm-10.col-md-10.col-lg-10.drop_width {
        padding-left: 57px;
    }

    .col-sm-8.col-md-8.col-lg-8.input-group {
        padding-left: 9px;
        padding-right: 7px;
    }

    .link_close {
        margin-top: 0px;
        z-index: 999;
        position: relative;
        top: 26px;
        right: 62px;
        font-size: 51px;
        opacity: 1;
    }

    .app_dept {
        padding-left: 10px;
        padding-right: 12px;
    }

    button.dropdown-toggle.ng-binding.btn.btn-default {
        padding-right: 26px;
        padding-top: 3px;
        padding-bottom: 3px;
    }

    /* .icon_home {
        width: 5%;
        float: right;
    } */

    .app_ckout span {
        color: #000000 !important;
    }

    .table-uigrid.ui-grid .ui-grid-viewport {
        height: 402px !important;
    }

    @media only screen and (max-width:1024px) {
        div#contentscheduler {
            height: 100%;
        }

        .fooder-bg {
            left: 18%;
        }

        .ui-grid-viewport.ng-isolate-scope {
            height: 800px !important;
            min-height: 800px !important;
        }
    }

    @media only screen and (max-width:768px) {
        div#contentscheduler {
            height: 100%;
            min-height: 100%;
        }

        .smdnone {
            display: none;
        }

        #appoinmentsheight #scheduler {
            height: 810px !important;
        }
    }
</style>
