<link rel="stylesheet" href="app/css/drhms.css">
<div class="page-header-list">
    <h4 class="header-name-litle" translate="Appointments"></h4>
    <div class="search-list-right">
        <button class="btn-add" ng-click="addNew()" uib-tooltip="{{ 'Appointments' | translate }}"
            tooltip-placement="bottom">
            <i class="fas fa-plus" aria-hidden="true"></i>
        </button>
        <span class="drhms-billing-btn drhms-home-btn"><i
            class="fas fa-home" ng-click="backtodashboard()" uib-tooltip="Dashboard"
            tooltip-placement="bottom"></i></span>
    </div>
</div>

<div id="receipt_tab">
<!-- <div class="row tablebox" id="tablebox"> -->
    <div class="row">
        <div class="col-sm-12">
            <uib-tabset active="active" id="assettabs">
                <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)"
                    disable="tab.canDisable">
                </uib-tab>
            </uib-tabset>
            <div ui-view class="tabview"></div>
        </div>
    </div>
</div>
