    }

    i.fas.fa-edit {
        color: #fff;
        background: #3ecc01;

    i.fas.fa-clock {

    }

    button.dropdown-toggle.ng-binding.btn.btn-default {

        width: 100%;
        background-color: #f8f8f8 !important;
        border-radius: 10px;
    }

    i.fa.fa-pencil-square-o {

        background: #3ecc01;

    }

        margin-bottom: 100px;
    }

    th.Patient.Name.align {
        width: 24%;
        white-space: normal;
    }
    
    patientsearch.logo .custom-popup-wrapper {
        margin-left: -200px;
    }

<script type="text/javascript">
    $(document).ready(function () {
        $("#calenderid").click(function () {
            $("i", this).toggleClass("fa fa-calendar fa fa-list");
        });
    });
</script>
<div class="row">
    <div class="col-sm-8"></div>
    <div class="col-sm-3">
        <div class="search-box">
            <patientsearch patientid="currentfilter.PatientId" class="logo" name="txtpatientsearch" patientinfo="selectedPatient" patientchange="getList()"
                aria-placeholder="Patient Search" issearch="nopatinetsearch">
            </patientsearch>
            <i class="fas fa-search" aria-hidden="true"></i>
        </div>
    </div>
    <div class="col-sm-1">
        <button class="add-btn" ng-click="toggleView()">
            <i class="fas fa-calendar" aria-hidden="true"></i>
        </button>
    </div>
</div>
<div class="row">
    <div class="list-filter" ng-show="!vm.appointment.ShowCalendar">
        <div class="col-sm-2">
            <label class="col-sm-12" translate="From Date"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="fromdate" ng-change="getList()" datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                    is-open="fromdatePopup.opened" ng-model="currentfilter.fromdate">
            </div>
        </div>
        <div class="col-sm-2">
            <label class="col-sm-12" translate="To Date"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="todate" ng-change="getList()" datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
                    is-open="todatePopup.opened" ng-model="currentfilter.todate">
            </div>
        </div>
        <div class="col-sm-2">
            <label class="col-sm-12" translate="appointment.appointment-list.filter_type.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="currentfilter.AppointmentTypeId" ng-change="appointmenttypechange()" class="filter-combo" ng-disabled="currentcontext.candisableappttype">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.AppointmentType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-2">
            <label class="col-sm-12" translate="appointment.appointment-list.filter_doctor.lbl"></label>
            <div class="col-sm-12">
                <multiselectchk list="lookup.Doctor" selected="currentfilter.DoctorId" change="doctorFilterChange()">
                </multiselectchk>
            </div>
        </div>
        <div class="col-sm-2">
            <label class="col-sm-12" translate="appointment.appointment-list.filter_appointmentstatus.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="currentfilter.AppointmentStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.AppointmentStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </div>
</div>
<div id="myModal" class="modal">
    <div class="modal-content" style="width:100%;margin:0 auto; left:6%;">
        <div class="modal-body">
            <span ng-click="hideprocessflow()" class="close link_close">&times;</span>
            <img src="mock/usermanual/appointments/Appointments.jpg" class="imag-responsive"></img>
        </div>
    </div>
</div>
<div class="row" ng-show="!vm.appointment.ShowCalendar">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs" ng-show="!vm.appointment.ShowCalendar">
    <!-- <custom-table config="vm.gridConfig"></custom-table> -->
    <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
        ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>

    <!-- <div class="fooder-bgs" style="margin-top: 22px;margin-bottom: 34px;">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
                items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div> -->
</div>
<div class="row">
    <jqx-scheduler jqx-settings="settings" id="scheduler" ng-show="vm.appointment.ShowCalendar"></jqx-scheduler>
</div>
