<style>
.nav > li.disabled > a:hover,
    .nav > li.disabled > a:focus {
        color: #000000 !important;
        text-decoration: none;
        background-color: #3c5a76;
        cursor: not-allowed;
    }
    
    .nav-tabs > li.active > a,
    .nav-tabs > li.active > a:hover {
        color: #000000 !important;
        border-bottom-color: #fff;
        background-color: #3c5a76 !important;
    }
    .nav-tabs > li > a {
    padding: 4px 15px;}
    .ui-select-bootstrap > .ui-select-choices, .ui-select-bootstrap > .ui-select-no-choice {
    /* width: 100%; */
    width: auto;
    min-width: 100%;
    height: auto;
    max-height: 200px;
    overflow-x: hidden;
    margin-top: -1px;
    width: 100%;
}
</style>
<ul class="breadcrumb">
    <li>
        <a ui-sref="app.appointments" translate="appointment.appointmenttab.parentpagetitle.lbl"></a>
    </li>
    <li class="active" translate="appointment.appointmenttab.pagetitle.lbl"></li>
</ul>

<div class="row">
    <div class="col-sm-12">
        <uib-tabset active="active">
            <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)" disable="tab.canDisable">
            </uib-tab>
        </uib-tabset>

        <div ui-view></div>
    </div>
</div>
