<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="appointment.appointment-history.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>
<div class="row">
    <patientbanner patientid="currentcontext.pid"></patientbanner>
</div>

<div class="row">
    <div class="col-sm-4">
        <label class="col-sm-4 control-label filter-lbl" translate="patientemr.previousorder.fromdate.lbl"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" name="from" ng-change="getList()" ng-date-object
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="fromPopup = { opened: true }" is-open="fromPopup.opened" ng-model="currentfilter.From">
        </div>
    </div>
    <div class="col-sm-4">
        <label class="col-sm-4 control-label filter-lbl" translate="patientemr.previousorder.todate.lbl"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" name="to" ng-change="getList()" ng-date-object
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="toPopup = { opened: true }" is-open="toPopup.opened" ng-model="currentfilter.To">
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
    <!-- <div ui-grid="vm.gridConfig" class="table-uigrid"></div> -->
</div>
<div class="fooder-bgs">

                translate="common.cancelaction.lbl"></button>
        </div>
    </div> -->
</div>
