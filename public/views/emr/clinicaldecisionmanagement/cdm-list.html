<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="appointment.clinicalmanagement.pagetitle.lbl"></h4>
    <div class="col-sm-6">

            <button class="btn btn-success btn-sm pull-right btn-filter" ng-click="addNew()" uib-tooltip="{{ 'appointment.clinicalmanagement.addnew-tooltip.lbl' | translate
}}" tooltip-placement="bottom"><i class="fa fa-plus" aria-hidden="true"></i><span translate="New Search"></span></button>
    </div>
</div>
<div class="row filter-area">
    <div class="col-sm-12">
        <div class="col-sm-4">
            <label class="col-sm-4 control-label filter-lbl" translate="appointment.clinicalmanagement.groupby.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.GroupId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        
       
        

       
       


    </div>
</div>

<div class="container-fluid onerow-filter">
    <div ui-grid="vm.gridConfig" class="table-uigrid"></div>
    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
