<link href="app/css/emr.css" rel="stylesheet">
<div class="row page-header">
    <div class="col-sm-8">
        <h4 class="mt0" translate="Tooth Chart"></h4>
    </div>
    <div class="col-sm-4">
        <div class="pull-right">
            <span class="drhms-billing-btn drhms-outstandingbill-btn" ng-click="doctor_dashboard()"
                uib-tooltip="{{'patientemr.mock.emrdashboard.lbl' | translate}}" tooltip-placement="bottom">
                <i class="fas fa-th-large" aria-hidden="true"></i>
            </span>
            <span class="drhms-billing-btn drhms-home-btn" ng-click="currentpatient()"
                uib-tooltip="{{'patientemr.pmhxdashboard.oplist.lbl' | translate}}" tooltip-placement="bottom">
                <i class="fas fa-user-injured"></i>
            </span>
        </div>
    </div>
</div>
<div class="row tablebox" id="receipt_tab">
    <div class="col-sm-12">
        <uib-tabset active="active">
            <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)"
                disable="tab.canDisable">
            </uib-tab>
        </uib-tabset>
        <div ui-view></div>
    </div>
</div>
