<style>
    .modal-content .panel-body { overflow: inherit;}
</style>
<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="generalmaster.roomtype-form.pagetitle.lbl"></h4>
</div>

<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div>
                <div class="">
                    <div class="panel-body form-panel">
                        <div class="col-sm-12">
                              <div class="well">
                            <div class="form-group">
                                <label class="col-sm-3 control-label" for="facility" translate="generalmaster.roomtype-form.facility.lbl"></label>
                                <div class="col-sm-6">
                                    <ui-select ng-model="item.FacilityId" name="facility" required>
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                        </ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                                <div class="col-sm-3"></div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-3 control-label" for="roomtypename" translate="generalmaster.roomtype-form.pnlroomtype.lbl"></label>
                                <div class="col-sm-6">
                                    <input type="text" class="form-control" name="roomtypename" ng-model="item.RoomTypeName" placeholder="" required>
                                </div>
                                <div class="col-sm-3"></div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-3 control-label" for="code" translate="generalmaster.roomtype-form.code.lbl"></label>
                                <div class="col-sm-6">
                                    <input type="text" class="form-control" name="code" ng-model="item.Code" placeholder="" required>
                                </div>
                                <div class="col-sm-3"></div>
                            </div>                           
                            <div class="form-group">
                                <label class="col-sm-3 control-label" for="type" translate="generalmaster.roomtype-form.roomclassificationtype.lbl"></label>
                                <div class="col-sm-6">
                                    <ui-select ng-model="item.RoomClassificationTypeId" name="type" required>
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                        </ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.RoomClassificationType | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                                <div class="col-sm-3"></div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-3 control-label" translate="generalmaster.roomtype-form.description.lbl"></label>
                                <div class="col-sm-6">
                                    <textarea class="form-control notes-textarea" rows="3" maxlength="4000" name="description" ng-model="item.Description" placeholder=""></textarea>
                                    <!--<input type="text" class="form-control" name="description" ng-model="item.Description" placeholder="">-->
                                </div>
                                <div class="col-sm-3"></div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-3 control-label" for="category" translate="generalmaster.roomtype-form.category.lbl"></label>
                                <div class="col-sm-6">
                                    <ui-select ng-model="item.ServiceRateCategoryId" name="category" required>
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                        </ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ServiceRateCategory | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                                <div class="col-sm-3"></div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-3 control-label" translate="generalmaster.roomtype-form.isactive.lbl"></label>
                                <div class="col-sm-6">
                                    <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
                                </div>
                                <div class="col-sm-3"></div>
                            </div>


                              </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="panel-footer formactionbar">
                <div class="pull-right">
                    <button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
                    <button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
