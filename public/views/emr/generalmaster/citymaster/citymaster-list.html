    .nameinfo {
        font-size: 13px;
        font-weight: 700;
        color: #337ab7;

        WIDTH: 98%;
        margin-left: 10px;
    }

<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-5">
            <h4 class="col-sm-6 mt0 " translate="generalmaster.countrymaster-list.pagetitle2.lbl"></h4>
        </div>
        <div class="col-sm-7">
            <div class="filters">
                <div class="search">
                    <input type="text" id="pid" class="form-control" on-enter="getList()"
                        ng-model="currentfilter.CityCode"
                        placeholder="{{'generalmaster.districtmaster-list.citycode.lbl'|translate}}"> <i
                        class="fas fa-search" aria-hidden="true"></i>

                </div>
                <button type="button" tabindex="-1" class="btn-add"
                    ng-click="addNew()"
                    uib-tooltip="{{ 'generalmaster.countrymaster-list.pagetitle2.lbl' | translate }}"
                    tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                    <!-- <span translate="clinicalmaster.serviceitem-list.addnew.lbl " class="text-white"></span> -->
                </button>
                <button type="button" tabindex="-1" class="btn-add" ng-click="backtoList()" uib-tooltip="Dashboard" tooltip-placement="bottom">
                    <i class="fa fa-home" aria-hidden="true"> </i>
                </button>

                <!-- <i class="fa fa-home" align="right" ng-click="backtoList()" uib-tooltip="Dashboard"
                    tooltip-placement="bottom"></i> -->
            </div>
        </div>
    </div>
</div>
<table id="bannerdetails">
    <tr>
        <td translate="generalmaster.districtmaster-list.districtname.lbl"></td>
        <td>
            <autosearch itemid="currentfilter.DistrictId" itemchange="getList()" onenter="getList()"
                iteminfo="item.SelectedItem" rowdata="item" config="vm.districtcontrolconfig" class="inputsearchlogo"
                isrequired="true"></autosearch>
        </td>
        <td translate="generalmaster.districtmaster-list.districtname.lbl"></td>
        <td>
            <autosearch itemid="currentfilter.DistrictId" itemchange="getList()" onenter="getList()"
                iteminfo="item.SelectedItem" rowdata="item" config="vm.districtcontrolconfig" class="inputsearchlogo"
                isrequired="true"></autosearch>
        </td>
        <td translate="generalmaster.statemaster-list.statename.lbl"></td>
        <td>
            <autosearch itemid="currentfilter.StateId" itemchange="getList()" onenter="getList()"
                iteminfo="item.SelectedItem" rowdata="item" config="vm.statecontrolconfig" class="inputsearchlogo"
                isrequired="true"></autosearch>
        </td>
    </tr>
    <tr>
        <td translate="generalmaster.countrymaster-list.countryname.lbl"></td>
        <td>
            <autosearch itemid="currentfilter.CountryId" itemchange="getList()" onenter="getList()"
                iteminfo="item.SelectedItem" rowdata="item" config="vm.countrycontrolconfig" class="inputsearchlogo"
                isrequired="true"></autosearch>
        </td>
        <td translate="generalmaster.countrymaster-list.status.lbl"></td>
        <td>
            <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 8 : 0}}
                    <span ng-if="$select.selected.Text.length>8">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </td>
        <td></td>
        <td></td>
    </tr>
</table>
