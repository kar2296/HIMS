<style>
    .card {
        background: #fff;
        min-height: 118px;
        box-shadow: none;
        position: relative;
        transition: .5s;
        border: 1px solid #f2f2f2;
        border-radius: 0
    }
    
    #mainresponsivetablecontrol .table>tbody>tr>td,
    #mainresponsivetablecontrol .table>thead:first-child>tr:first-child>td {
        border-top: 0;
        padding: 0px !important;
    }
    
    .card .title {
        position: relative;
        z-index: 1;
        border-left: 5px solid #01c0c8;
        padding: 1px 0 0px 38px;
        color: #01c0c8;
        font-size: 34px;
        font-weight: 600;
        text-transform: uppercase
    }
    
    .card .title span {
        font-size: 13px;
        display: block;
        margin: 0;
        line-height: 18px;
        font-weight: 600;
        color: #444
    }
    
    .card .title .msg {
        font-size: 13px;
        color: #666;
        display: block;
        margin: 0;
        padding: 0;
        font-weight: normal;
        line-height: 18px;
        margin-top: 10px;
        text-transform: none
    }
    
    .fontsize {
        font-size: 16px;
        font-weight: 700;
        padding: 0px 7px
    }
    
    .bgfoot .btn-sm,
    .btn-group-sm>.btn {
        padding: 0px 6px;
        font-size: 10px;
        line-height: 1.5;
        border-radius: 3px
    }
    
    .topright .dropdown-menu {
        top: -60px !important;
        left: 15px !important;
        max-height: 120px
    }
    
    .padding-top1 {
        padding-top: 1px
    }
    
    .page-header h4 {
        padding-top: 2px;
        height: 7px;
        padding-left: 17px
    }
    /* #opbillingcontrol .formRoot {
        height: 476px !important
    }

    #opbillingcontrol .table-control {
        height: 478px !important;
        overflow: auto
    } */
    
    .container {
        width: 100%;
    }
    
    #cndropdownctrl .ui-select-bootstrap>.ui-select-choices {
        width: 100%;
        height: auto;
        height: 85px;
        overflow-x: hidden;
        margin-top: -1px;
    }
    
    #mainresponsivetablecontrol>.table>tbody>tr:nth-child(1)>td>autosearch>.autosearch-div>.custom-popup-wrapper>.dropdown-menu {
        background-color: rgba(245, 249, 238, 0) !important;
        border: 0px solid #ccc !important;
    }
    
    .custom-popup-wrapper>.table>thead>tr>td:nth-child(3) {
        width: 30% !important;
    }
    
    .custom-popup-wrapper>.table>tbody>tr>td:nth-child(3)>span {
        width: 25% !important;
    }
    
    .bgfoot .ui-select-match-text {
        width: 98px !important;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    
    .fs-12 input[type=text] {
        margin-bottom: 13px;
    }
    
    .ui-select-container {
        padding: 4px 0px 0px 2px;
    }
    
    .ui-select-bootstrap .ui-select-match-text span {
        display: unset !important;
    }
    
    .layout-fixed .wrapper>section {
        height: 85vh;
        min-height: 86vh;
        overflow-y: scroll;
        overflow-x: hidden;
    }
    
    table th {
        min-width: 10px;
        background-color: #5d9cec !important;
        color: #101010 !important;
        font-size: 16px;
        text-align: center !important;
        border: 1px solid #101010 !important;
    }
    
    .content-wrapper.ng-scope.ng-fadeInUp {
        background: white;
        height: -webkit-fill-available;
        position: absolute;
        border: unset;
        overflow: -moz-scrollbars-none;
        overflow: unset;
    }
</style>


<link href="app/css/billing-pharmacy-customs.css" rel="stylesheet">

<!---Header-->
<div class="row">
    <div class="col-sm-12">

        <button class="btn-add" ng-click="addNew()" uib-tooltip="{{'Ward Tariff Map' | translate }}" tooltip-placement="bottom">
            <i class="fa fa-plus" aria-hidden="true"></i>
        </button>
    </div>
</div>

<table class="table table-hover table-responsive table-bordered">
    <thead class="bg-subhead">
        <tr>
            <th class="col-sm-2">
                <span translate="Payer Type"></span>
                <span class="mandatory-asterix">*</span>
            </th>
            <th class="col-sm-2">
                <span translate="Tariff Type"></span>
                <span class="mandatory-asterix">*</span>
            </th>
            <th class="col-sm-2">
                <span translate="Payer"></span>
                <span class="mandatory-asterix">*</span>
            </th>
            <th class="col-sm-1">
                <span translate="common.actions_col.lbl"></span>
            </th>
        </tr>
    </thead>
    <tbody>
        <tr ng-repeat="item in vm.items | filter:{Status:1}">
            <td align="center">
                <ui-select ng-model="item.GuarantorTypeId" class="ui-select-grid" ng-change="getGuarantor(item,index)">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.GuarantorType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </td>
            <td>
                <ui-select ng-model="item.RateTypeId" class="ui-select-grid">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ServiceRateCategory | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </td>
            <td>
                <ui-select ng-model="item.InsuranceId" class="ui-select-grid">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Guarantor | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </td>

            <td align="center">
                <img src="assets/svg/delete.svg" ng-click="deleteItem($index,item)">
            </td>
        </tr>
    </tbody>
</table>
</div>
</div>
<div class="fooder-bgs">
    <div class="pull-left">
        <button type="button" class="pull-left btn btn-sm pyr-color10" ng-click="backToList()">
            <i class="fa fa-angle-left"></i>&nbsp;&nbsp;
            <span translate="common.backaction.lbl"></span>
        </button>
    </div>
    <div class="pull-right">
        <button id="btnSaveForm" type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="saveItem()"></button>
    </div>

</div>
