<div class="row page-header">
    <div class="col-sm-5">
        <h4 class="mt0" translate="generalmaster.wardmaster-list.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-4">
        <label class="col-sm-4 control-label" translate="generalmaster.wardmaster-list.filter_status.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="col-sm-3">
        <div class="filters">
            <div class="search">
                <input type="text" id="pid" class="form-control" on-enter="getList()" ng-model="currentfilter.WardName"
                    placeholder="{{'generalmaster.wardmaster-list.filter_name.lbl'|translate}}">
                <i class="fas fa-search" aria-hidden="true"></i>

            </div>
            <button class="btn-add" ng-click="addNew()"
                uib-tooltip="{{ 'generalmaster.wardmaster-list.pagetitle.lbl' | translate }}"
                tooltip-placement="bottom">
                <i class="fas fa-plus" aria-hidden="true"></i></button>
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
