<style>
    .form-horizontal .form-group {
        height: 62px;
    }
</style>
<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <h4 class="modal-title custom-modal-title" translate="generalmaster.wardmaster.pagetitle.lbl"></h4>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="type"
                    translate="generalmaster.wardmaster-form.type.lbl"></label>
                <div class="col-sm-12">
                    <ui-select ng-model="item.WardTypeId" name="type" required>
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.WardType | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="mastertype"
                    translate="generalmaster.wardmaster-form.mastertype.lbl"></label>
                <div class="col-sm-12">
                    <ui-select ng-model="item.WardMasterTypeId" name="mastertype" required>
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.WardMasterType | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                    <!-- <radiogroupcontrol itemid="item.WardMasterTypeId" items="lookup.WardMasterType"></radiogroupcontrol> -->
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="code"
                    translate="generalmaster.wardmaster-form.code.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="code" ng-model="item.Code" placeholder="" required>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="name"
                    translate="generalmaster.wardmaster-form.name.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="name" ng-model="item.WardName" placeholder=""
                        required>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" translate="generalmaster.wardmaster-form.category.lbl"></label>
                <div class="col-sm-12">
                    <ui-select ng-model="item.ServiceRateCategoryId" name="category">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.ServiceRateCategory | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="location"
                    translate="generalmaster.wardmaster-form.location.lbl"></label>
                <div class="col-sm-12">
                    <ui-select ng-model="item.LocationId" name="location" required>
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.Location | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="dept"
                    translate="generalmaster.wardmaster-form.department.lbl"></label>
                <div class="col-sm-12">
                    <ui-select ng-model="item.DepartmentId" name="storemaster">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="storemaster"
                    translate="generalmaster.wardmaster-form.defaultstore.lbl"></label>
                <div class="col-sm-12">
                    <ui-select ng-model="item.StoreMasterId" name="storemaster">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.StoreMaster | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="displayorder"
                    translate="generalmaster.wardmaster-form.display.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="displayorder" ng-model="item.DisplayOrder"
                        placeholder="">
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="isactive"
                    translate="generalmaster.wardmastertab.isactive.lbl"></label>
                <div class="col-sm-12">
                    <input type="checkbox" class="custom-checkbox" name="isactive" ng-model="item.IsActive">
                </div>
            </div>
        </form>
    </div>
    <div class="fooder-bgs">
        <div class="pull-left">
            <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()">
                <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                <span class="btn-fontsize" translate="common.backaction.lbl"></span>
            </button>
        </div>
        <div class="pull-right">
            <!-- <button id="btnSave" type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button> -->
            <button id="btnSaveApprove" type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                ng-click="saveAndApprove()"></button>
            <!-- <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button> -->
            <!-- <button id="btnCancelForm" type="button" class="cancelbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button> -->
        </div>
    </div>
</div>
