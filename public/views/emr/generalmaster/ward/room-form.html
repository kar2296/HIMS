<style>
    /* .modal-dialog {
        width: 800px;
        margin: 30px auto;
    } */

    .form-horizontal .form-group {
        height: 62px;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="generalmaster.wardmastertab.pnlroomtitle.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>


<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="roomno"
                translate="generalmaster.wardmastertab.roomno.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="roomno" ng-model="item.RoomNo" placeholder="" required>
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" translate="generalmaster.wardmastertab.description.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="description" ng-model="item.Description" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label"
                translate="generalmaster.roomtype-form.roomclassificationtype.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.RoomTypeId" theme="bootstrap">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.RoomTypeMaster | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="category"
                translate="generalmaster.wardmastertab.serviceratecategory.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.ServiceRateCategoryId" name="category" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ServiceRateCategory | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" translate="generalmaster.wardmastertab.status.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.ActiveStatusId">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="graceperiod"
                translate="generalmaster.wardmastertab.graceperiod.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="graceperiod" ng-model="item.GracePeriod" placeholder=""
                    ng-pattern="/^\d+$/">
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="beds" translate="generalmaster.wardmastertab.beds.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="beds" ng-model="item.NoOfBed" placeholder="" required
                    ng-pattern="/^\d+$/">
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="frombed"
                translate="generalmaster.wardmastertab.frombed.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="frombed" ng-model="item.BedStartNo" placeholder=""
                    ng-pattern="/^\d+$/" required>
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="prefix"
                translate="generalmaster.wardmastertab.prefix.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="prefix" ng-model="item.Prefix" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="halfday"
                translate="generalmaster.wardmastertab.halfday.lbl"></label>
            <div class="col-sm-12">
                <input type="checkbox" class="custom-checkbox" name="halfday" ng-model="item.HalfDay">
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" translate="appmanager.user.imageupload.lbl"></label>
            <div class="col-sm-12">
                <input type="file" ngf-select ng-model="currentcontext.file" name="file" ngf-max-size="200MB" />
            </div>
        </div>
        <div class="col-sm-12">
            <img class="item-logo-img" ng-show="!!currentcontext.file" ngf-thumbnail="currentcontext.file" />
            <img class="item-logo-img" ng-show="!currentcontext.file && item.PhotoPath"
                data-ng-src="data:image/png;base64,{{currentcontext.Photo}}" />
        </div>
    </form>
    <div class="pull-right">
        <button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl"
            ng-click="save()"></button>
    </div>
</div>
