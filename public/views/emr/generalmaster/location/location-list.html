<div class="row page-header">
        <div class="col-sm-12">
            <div class="col-sm-3">
                    <h4 class="col-sm-12 mt0 ng-scope" translate="Location Master"><span class="ng-scope"></span></h4>
                </div>
                <div class="col-sm-3 filter-lbl">
                        <label class="col-sm-4 control-label filter-lbl" style="color: black;" translate="generalmaster.location-list.filter_status.lbl"></label>
                        <div class="col-sm-8">
                            <ui-select ng-model="currentfilter.activestatusid" ng-change="getList()" class="filter-combo">
                                <ui-select-match>
                                    {{$select.selected.Text | limitTo : 8 : 0}}
                                    <span ng-if="$select.selected.Text.length>8">...</span>
                                </ui-select-match>
                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                </ui-select-choices>
                            </ui-select>
                        </div>
                    </div>
            <div class="col-sm-4">
                <div class="filters">
                    <div class="search" style=" width: 100%;">
                        <input type="text" id="pid" class="form-control"  on-enter="getList()" ng-model="currentfilter.locationname"
                         placeholder="{{'generalmaster.location-list.filter_location.lbl'|translate}}"> <i class="fas fa-search" aria-hidden="true"></i>
    
                    </div>
                    <button class="btn-add" ng-click="addNew()" uib-tooltip="{{ 'generalmaster.location-list.pagetitle.lbl' | translate }}"
            tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i></button>
                </div>
            </div>
        </div>
    </div>

<custom-table config="vm.gridConfig"></custom-table>	  
<div class="container-fluid onerow-filter">
    <!-- <div ui-grid="vm.gridConfig" class="table-uigrid"></div> -->
    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
