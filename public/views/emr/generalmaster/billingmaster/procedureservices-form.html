<style>
    .card {
        background: #fff;
        min-height: 118px;
        box-shadow: none;
        position: relative;
        transition: .5s;
        border: 1px solid #f2f2f2;
        border-radius: 0
    }

    .card .title {
        position: relative;
        z-index: 1;
        border-left: 5px solid #01c0c8;
        padding: 1px 0 0px 38px;
        color: #01c0c8;
        font-size: 34px;
        font-weight: 600;
        text-transform: uppercase
    }

    .card .title span {
        font-size: 13px;
        display: block;
        margin: 0;
        line-height: 18px;
        font-weight: 600;
        color: #444
    }

    .card .title .msg {
        font-size: 13px;
        color: #666;
        display: block;
        margin: 0;
        padding: 0;
        font-weight: normal;
        line-height: 18px;
        margin-top: 10px;
        text-transform: none
    }

    .fontsize {
        font-size: 16px;
        font-weight: 700;
        padding: 0px 7px
    }

    .bgfoot .btn-sm,
    .btn-group-sm>.btn {
        padding: 0px 6px;
        font-size: 10px;
        line-height: 1.5;
        border-radius: 3px
    }

    .topright .dropdown-menu {
        top: -60px !important;
        left: 15px !important;
        max-height: 120px
    }

    .padding-top1 {
        padding-top: 1px
    }

    .page-header h4 {
        padding-top: 2px;
        height: 7px;
        padding-left: 17px
    }

    #opbillingcontrol .formRoot {
        height: 476px !important
    }

    #opbillingcontrol .table-control {
        height: 507px !important;
        overflow: auto
    }



    .container {
        width: 100%;
    }

    #cndropdownctrl .ui-select-bootstrap>.ui-select-choices {
        width: 100%;
        height: auto;
        height: 85px;
        overflow-x: hidden;
        margin-top: -1px;
    }

    .bgfoot .ui-select-match-text {
        width: 98px !important;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .fs-12 input[type=text] {
        margin-bottom: 13px;
    }

    .ui-select-container {
        padding: 4px 0px 0px 2px;
    }

    #mainresponsivetablecontrol>.table>tbody>tr>td>autosearch>.autosearch-div>.custom-popup-wrapper>.dropdown-menu {
        overflow-x: hidden;
    }

    #opbillingcontrol .formRoot {
        overflow-x: hidden;
    }

    input[type=text] {
        text-overflow: ellipsis;
        overflow: hidden;
    }

    .cust_servicename .autosearch-div>input,
    .form-group patientsearch.logo {
        /* background-size: 23.7% !important;
         background-position: 190px !important; */
        background-size: 18.7% !important;
        /* background-position: 220px !important; */
        background-position: right;
        background-position-x: 106%;
    }

    /* @media (device-width:100vw) and (device-height:100vh) {
        .cust_servicename .autosearch-div>input, .form-group patientsearch.logo{
       background-position: 155px;}
    } */
    #opbillingcontrol .formRoot {
        height: 506px !important;
    }
</style>


<link href="app/css/billing-pharmacy-customs.css" rel="stylesheet">

<!---Header-->
<div id="opbillingcontrol">
    <div class="row page-header">
        <h4 class="col-sm-6 mt0" translate="billingmaster.procedureservice-form.pagetitle.lbl"></h4>
        <div class="col-sm-6">
            <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addNew()"
                uib-tooltip="{{'clinicalmaster.serviceitemalias-list.addnew-tooltip.lbl' | translate }}"
                tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i><span
                    translate="clinicalmaster.serviceitem-list.addnew.lbl"></span></button>
            <h4 class="col-sm-8 mt0 active" style="margin-left: -153px;" translate="{{$state.params.ProcedureName}}">
            </h4>

        </div>
    </div>
    <div class="row filter-area">
        <div class="col-sm-12">
            <div class=" table-control">
                <div class=" bg-pattern">
                    <div class="table-height formRoot " id="mainresponsivetablecontrol">
                        <table class="table table-hover table-responsive table-bordered cust_dropdwn">
                            <thead class="bg-subhead">
                                <tr>
                                    <th style="width:20%"><span
                                            translate="billingmaster.procedureservice-form.servicename.lbl"></span>
                                        <span class="mandatory-asterix">*</span>
                                    </th>
                                    <!-- <th><span translate="billingmaster.procedureservice-form.facility.lbl"></span></th> -->
                                    <th style="width:5%"><span
                                            translate="billingmaster.procedureservice-form.isprocedure.lbl"></span></th>
                                    <th style="width:5%"><span
                                            translate="billingmaster.procedureservice-form.percent.lbl"></span></th>
                                    <th><span for="rate"
                                            translate="billingmaster.procedureservice-form.doctordisplay.lbl"></span>
                                    </th>
                                    <th><span translate="billingmaster.procedureservice-form.status.lbl"></span></th>
                                    <th><span translate="common.actions_col.lbl"></span></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="item in vm.items | filter:{Status:1}">
                                    <td class="cust_servicename">

                                        <autosearch itemid="item.ServiceItemId" iteminfo="item.SelectedItem"
                                            name="'service'" rowdata="item" config="vm.serviceitemcontrolconfig"
                                            itemchange="ServiceItemChanged(item)" class="inputsearchlogo"
                                            candisable="item.RdoServiceId" isrequired="true" tabindex="item.tabindex">
                                            <!-- <ui-select-match>
                                                {{$select.selected.Text | limitTo : 10 : 0}}
                                                <span ng-if="$select.selected.Text.length> 10">...</span>
                                            </ui-select-match> -->
                                        </autosearch>
                                    </td>
                                    <!-- <td>
                                        <ui-select ng-model="item.FacilityId">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </td> -->
                                    <td class="text-center">
                                        <div><input type="checkbox" class="custom-checkbox"
                                                ng-model="item.IsProcedureCharge" disabled></div>
                                    </td>
                                    <td>
                                        <div><input type="text" class="form-control" name="rate"
                                                ng-disabled="vm.procedurecount==0" ng-model="item.Percent"
                                                placeholder="" ng-pattern="/^\d+$/" ng-keypress="numberonly($event)"
                                                required></div>
                                    </td>
                                    <td>
                                        <div class="form-group">
                                            <input type="checkbox" class="custom-checkbox"
                                                ng-model="item.IsCheifSurgeon">
                                            <label class="control-label"> IsChief Surg.</label>
                                            <input type="checkbox" class="custom-checkbox"
                                                ng-model="item.IsAssistantSurgeon">
                                            <label class="control-label"> IsAssistant Surg.</label>
                                            <input type="checkbox" class="custom-checkbox"
                                                ng-model="item.IsAssociateSurgeon">
                                            <label class="control-label"> IsAssociate Surg.</label>
                                            <input type="checkbox" class="custom-checkbox"
                                                ng-model="item.IsAnesthetist">
                                            <label class="control-label"> IsAnesthetist</label>
                                        </div>
                                    </td>
                                    <td align="center">
                                        <input type="checkbox" class="custom-checkbox" ng-model="item.IsActive">
                                    </td>
                                    <td align="center">
                                        <button type="button" class="drhms-edit-button"
                                            ng-click="deleteDetail(item)">
                                            <img src="assets/svg/delete.svg" alt="">
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <!-- grid area ends -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="fooder-bgs">
    <div class="col-sm-12">
        <div class="pull-left">
            <button type="button" class="btn pyr-color10 btn-sm" tabindex="-1" ng-click="backToList()"> <i
                    class="fa fa-angle-left" aria-hidden="true"></i><span class="btn-fontsize"> &nbsp;
                    Back</span></button>
        </div>
        <div class="pull-right">
            <button id="btnSaveForm" type="button" class="draftbutton" translate="common.saveaction.lbl"
                ng-click="saveItem()"></button>
            <!--<button type="button" class="btn btn-primary btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>-->
            <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()"
                translate="common.clearaction.lbl"></button>
            <!-- <button id="btnCancelForm" type="button" class="draftbutton" ng-click="back()" translate="common.cancelaction.lbl"></button> -->
        </div>
    </div>
</div>

</div>
