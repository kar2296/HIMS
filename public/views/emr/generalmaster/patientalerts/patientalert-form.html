<style>
    #btnAddMember {
        margin-left : 15px;
        margin-top : -12px;
    }
    .panel-body {
        padding: 15px;
        margin-left: 0px;
        margin-top: -53px;
        margin-right: 0px;
        margin-bottom: 0px;
        background-image: url(app/img/bg-body.jpg);
        background-repeat: repeat;
        overflow: auto;
    }
    .modal-content .panel-body { overflow: inherit;}
    .table-uigrid-members {
        height : 200px !important;
    }
        .well {
        min-height: 20px;
        padding: 19px;
        margin-bottom: 0px;
        border: 1px solid #ededed;
        border-radius: 4px;
        background: rgb(233, 246, 253);
        /* Old browsers */
        background: -moz-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* FF3.6-15 */
        background: -webkit-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, rgb(250, 250, 250) 0%, rgb(247, 252, 253) 100%);
        /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid: DXImageTransform.Microsoft.gradient( startColorstr='#e9f6fd', endColorstr='#d3eefb', GradientType=0);
        /* IE6-9 */
        box-shadow: 4px 2px 13px -7px rgba(0, 0, 0, 0.75);
    }
    
    .formactionbar {
        padding: 5px 15px;
        height: 40px;
        background-color: #ccecf5;
    }
    
    .custom-modal-header {
        margin-bottom: 10px;
        background-color: #597a9a;
        color: #fff;
    }
    
    .modal-content {
        -webkit-box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        box-shadow: -1px 3px 20px 7px rgba(249, 244, 244, 0.5);
    }
    
    .modal-header {
        padding: 4px 10px;
        border-bottom: 1px solid #e5e5e5;
    
    }
    .grid-root {
        padding-right : 0px;
        padding-left : 0px;
    }
</style>
<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="generalmaster.patientalert-form.managealerts.lbl"></h4>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class=" panel panel-body panel-default">
    <div class="page-header">
        <h3 class="panel-title" translate="generalmaster.patientalert-form.pnlpatientinfo.lbl"></h3>
    </div>
                <div class="col-sm-12">
                    <!-- leftpanel -->
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="col-sm-4 control-label" translate="generalmaster.patientalert-form.searchpatient.lbl"></label>
                            <div class="col-sm-8">
                                <patientsearch patientid="item.PatientId" filterconfig="patientfilterconfig" patientinfo="selectedPatient"></patientsearch>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-4 control-label" translate="generalmaster.patientalert-form.mrn.lbl"></label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="mrn" ng-model="selectedPatient.MRN" placeholder="" disabled>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-4 control-label" translate="generalmaster.patientalert-form.name.lbl"></label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="name" ng-model="selectedPatient.FirstName" placeholder="" disabled>
                            </div>
                        </div>
                    </div>
                    <!-- rightpanel -->
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="col-sm-4 control-label" translate="generalmaster.patientalert-form.gender.lbl"></label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="name" ng-model="selectedPatient.Gender.Description" placeholder="" disabled>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-4 control-label" translate="generalmaster.patientalert-form.dob.lbl"></label>
                            <div class="col-sm-8">
                                <div class="col-sm-6" style="padding-left:0px">
<input type="text" class="form-control" name="dob" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
    placeholder="{{datePickerOptions.placeholder}}" ng-click="dobPopup = { opened: true }" is-open="dobPopup.opened" ng-model="selectedPatient.DOB"
    disabled />
</div>
<div class="col-sm-6" style="padding-right:0px !important">
<label class="col-sm-4 control-label" translate="generalmaster.patientalert-form.age.lbl"></label>
<div class="col-sm-8" style="padding-right:0px !important">
<input type="text" class="form-control" name="age" ng-model="selectedPatient.Age" placeholder="" disabled>
</div>
</div>
</div>
</div>
<div class="form-group">
    <label class="col-sm-4 control-label" translate="generalmaster.patientalert-form.mobileno.lbl"></label>
    <div class="col-sm-8">
        <input type="text" class="form-control" name="mobileno" ng-model="selectedPatient.Mobile" placeholder="" disabled>
    </div>
</div>
</div>
</div>
</div>
<div class="panel panel-body panel-default">
    <div class="page-header">
        <h3 class="panel-title" translate="generalmaster.patientalert-form.pnlappointmentinfo.lbl"></h3>
    </div>
    <div class="">
        <div class="col-sm-12">

            <!-- leftpanel -->
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label" for="alerttype" translate="generalmaster.patientalert-form.alerttype.lbl"></label>
                    <div class="col-sm-8">
                        <ui-select ng-model="item.AlertTypeId" name="alerttype"required>
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.AlertType | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-4 control-label" for="severity" translate="generalmaster.patientalert-form.severity.lbl"></label>
                    <div class="col-sm-8">
                        <ui-select ng-model="item.SeverityId"name="severity" required>
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Severity | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-4 control-label" for="priority" translate="generalmaster.patientalert-form.priority.lbl"></label>
                    <div class="col-sm-8">
                        <ui-select ng-model="item.PriorityId" name="priority"required>
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Priority | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-4 control-label"for="dept" translate="generalmaster.patientalert-form.department.lbl"></label>
                    <div class="col-sm-8">
                        <ui-select ng-model="item.DepartmentId"name="dept"required>
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                    <!--<div class="col-sm-8">
                        <ui-select multiple ng-model="item.DepartmentId" name="dept" class="ui-select-multiple" ng-map-control pivot-prop="ReferralId"
                            map-prop="UserId" pivot-prop-val="{{currentcontext.id}}" required>
                            <ui-select-match>{{$item.Text }}</ui-select-match>
                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>-->
                </div>
            </div>

            <!-- rightpanel -->
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label" for="onset" translate="generalmaster.patientalert-form.onsetdate.lbl"></label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" name="onsetdate" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                            placeholder="{{datePickerOptions.placeholder}}" ng-click="onsetdatePopup = { opened: true }" is-open="onsetdatePopup.opened"
                            ng-model="item.OnsetDate"name="onset"required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-4 control-label" translate="generalmaster.patientalert-form.closuredate.lbl"></label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" name="closuredate" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                            placeholder="{{datePickerOptions.placeholder}}" ng-click="closuredatePopup = { opened: true }" is-open="closuredatePopup.opened"
                            ng-model="item.ClosureDate">
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-4 control-label" for="alert" translate="generalmaster.patientalert-form.alertdesc.lbl"></label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" name="alert" ng-model="item.AlertDescription" placeholder=""required>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</form>
</div>
</div>
<div class="panel-footer formactionbar">
    <div class="pull-right">
        <button type="submit" class="draftbutton" ng-click="save()" translate="common.saveaction.lbl"></button>
        <button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
        <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
    </div>
</div>
