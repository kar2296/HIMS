<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-5">
            <h4 class="col-sm-6 mt0 " translate="generalmaster.districtmaster-list.pagetitle.lbl"></h4>
        </div>
        <div class="col-sm-5">
            <div class="filters">
                <div class="search">
                    <input type="text" id="pid" class="form-control" on-enter="getList()" ng-model="currentfilter.DistrictCode"
                     placeholder="{{'generalmaster.districtmaster-list.code.lbl'|translate}}"> <i class="fas fa-search" aria-hidden="true"></i>

                </div>
                <button type="button" tabindex="-1" class="btn-add"
                    ng-click="addNew()" uib-tooltip="{{ 'generalmaster.districtmaster-list.pagetitle.lbl' | translate }}"
                    tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                    <!-- <span translate="clinicalmaster.serviceitem-list.addnew.lbl " class="text-white"></span> -->
                </button>
            </div>
        </div>
    </div>
</div>
