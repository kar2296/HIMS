    </div>
    <div class="col-sm-6">
        <button type="button" class="btn btn-danger btn-sm pull-right" translate="x" ng-click="backToList()"></button>
    </div>

</div>

            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label0" for="code"
                    translate="generalmaster.guarantor-form.code.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="code" ng-model="item.Code" placeholder="" required>
                </div>
            </div>
            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label0" for="guarantorname"
                    translate="generalmaster.guarantor-form.guarantorname.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="guarantorname" ng-model="item.GuarantorName"
                        placeholder="" required>
                </div>
            </div>
            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label0" for="guarantortype"
                    translate="generalmaster.guarantor-form.guarantortype.lbl"></label>
                <div class="col-sm-12">
                    <ui-select ng-model="item.GuarantorTypeId" name="guarantortype" required>
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.GuarantorType | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label0" for="creditlimit"
                    translate="generalmaster.guarantor-form.creditlimit.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="creditlimit" ng-model="item.CreditLimit"
                        placeholder="" required>
                </div>
            </div>
            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label0" for="availablelimit"
                    translate="generalmaster.guarantor-form.availablelimit.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="availablelimit" ng-model="item.AvailableLimit"
                        placeholder="">
                </div>
            </div>
            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label0" for="contractdate"
                    translate="generalmaster.guarantor-form.contractdate.lbl"></label>
                <div class="col-sm-12">
                    <div class="datepicker">
                        <input type="text" class="form-control" name="contractdate" ng-date-object
                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                            placeholder="{{datePickerOptions.placeholder}}"
                            ng-click="contractdatePopup = { opened: true }" is-open="contractdatePopup.opened"
                            ng-model="item.ContractDate" required>
                        <i class="fa fa-calendar" aria-hidden="true"></i>
                    </div>
                </div>
            </div>
            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label0" for="contractexpirydate"
                    translate="generalmaster.guarantor-form.contractexpirydate.lbl"></label>
                <div class="col-sm-12">
                    <div class="datepicker">
                        <input type="text" class="form-control" name="contractexpirydate" ng-date-object
                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                            placeholder="{{datePickerOptions.placeholder}}"
                            ng-click="contractexpirydatePopup = { opened: true }"
                            is-open="contractexpirydatePopup.opened" ng-model="item.ContractExpiryDate" required>
                        <i class="fa fa-calendar" aria-hidden="true"></i>
                    </div>
                </div>
            </div>
            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label0" for="tpaname"
                    translate="generalmaster.guarantor-form.tpaname.lbl"></label>
                <div class="col-sm-12">
                    <ui-select ng-model="item.TPAId" name="tpaname">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}

                        </ui-select-match>
                        <ui-select-choices

                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label0" for="address" translate="appmanager.org.address1.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" id="Manualadd" class="form-control" name="address" ng-model="item.AddressLine1"
                        ng-disabled="item.candisable" placeholder="Address">
                </div>
            </div>

            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label0" for="address" translate="appmanager.org.address2.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" id="Manualadd" class="form-control" name="address" ng-model="item.AddressLine2"
                        ng-disabled="item.candisable" placeholder="Address">
                </div>
            </div>
            <address addressline1="item.AddressLine1" tabindex="tabindexmap.patienttabindex"
                addressline2="item.AddressLine2" pincodeid="item.PinCodeId" pincode="item.Pincode" area="item.Ward"
                areaid="item.WardId" city="item.City" district="item.District" districtid="item.DistrictId"
                cityid="item.CityId" state="item.State" stateid="item.StateId" country="item.Country"
                countryid="item.CountryId" class="upercase" pintext="item.Pincode">
            </address>
            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label0" for="serviceratecategory"
                    translate="generalmaster.guarantor-form.serviceratecategory.lbl"></label>
                <div class="col-sm-12">
                    <ui-select ng-model="item.ServiceRateCategoryId" name="serviceratecategory">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.ServiceRateCategory | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>

                                        <label class="col-sm-12 control-label0" for="clienttype" translate="generalmaster.guarantor-form.clienttype.lbl"></label>

            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label0" for="phone"
                    translate="generalmaster.guarantor-form.phone.lbl"></label>
                <div class="col-sm-12">
                    <!-- <input type="text" class="form-control" name="phone" ng-model="item.Phone" placeholder="" ng-minlength="10" ng-pattern="/^\d+$/"
                                                required> -->
                    <input type="text" class="form-control" id="Phone" MINLENGTH="10" MAXLENGTH="10" size="10"
                        name="Phone" onChange="numberonly($event)" onKeyUp="numberonly($event)"
                        ng-keypress="numberonly($event)" ng-model="item.Phone" required>
                </div>
            </div>
            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label0" for="email"
                    translate="generalmaster.guarantor-form.email.lbl"></label>
                <div class="col-sm-12">
                    <input type="email" class="form-control" name="email" ng-model="item.Email" placeholder="">
                </div>
            </div>
            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label0" for="businessdevelopmentmanager"

                <div class="col-sm-12">
                    <input type="text" class="form-control" name="businessdevelopmentmanager"

                </div>
            </div>
            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label0" for="copay" translate="Co-Pay(%)"></label>

            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label0"

                <div class="col-sm-2">
                    <input type="checkbox" class="custom-checkbox" ng-model="item.IsIPBedTariff">
                </div>
            </div>
            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label" for="IsAllFacility" translate="IsAllFacility"></label>
                <div class="col-sm-12">
                    <input type="checkbox" name="IsAllFacility" class="custom-checkbox" ng-model="item.IsAllFacility">
                </div>
            </div>
            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label0" for="isactive"
                    translate="generalmaster.guarantor-form.isactive.lbl"></label>
                <div class="col-sm-12">
                    <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
                </div>
            </div>
            <div class="form-group col-sm-3">
                <label class="col-sm-12 control-label0" for="salesmargin"

                <div class="col-sm-12">
                    <input type="checkbox" name="salesmargin" class="custom-checkbox"

            </div>

<div class="fooder-bgs">
    <div class="row">
        <div class="pull-left">
            <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()">
                <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                <span class="btn-fontsize" translate="common.backaction.lbl"></span>
            </button>
            <button type="button" class="draftbutton" tabindex="-1" ng-click="openattachments()">
                <i class="fa-solid fa-paperclip" aria-hidden="true"></i>
                <span class="btn-fontsize"> &nbsp; Attachment</span>
            </button>
            
            <!-- <button type="button" class="draftbutton" uib-tooltip="Attachments" ng-click="openattachments()"
                        tooltip-placement="top">&nbsp;&nbsp;
                        <i class="fa fa-paperclip fa-xs" aria-hidden="true">({{currentcontext.attachmentcount}})</i>
                    </button> -->

        </div>
        <div class="pull-right footer">

            <button id="btnSave" type="button" class="draftbutton" translate="common.saveaction.lbl"
                ng-click="save()"></button>
            <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                ng-click="saveAndApprove()"></button>
            <!-- <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button> -->

        </div>
    </div>
</div>
