<style>
    .modal-lg {
        width: 500px;
    }

    .panel-body {
        padding: 15px;
        margin-left: 0px;
        margin-top: -53px;
        margin-right: 0px;
        margin-bottom: 0px;
        background-image: url(app/img/bg-body.jpg);
        background-repeat: repeat;
        overflow: auto;
    }

    .modal-content .panel-body {
        overflow: inherit;
    }

    .well {
        min-height: 20px;
        padding: 19px;
        margin-bottom: 0px;
        border: 1px solid #ededed;
        border-radius: 4px;
        background: rgb(233, 246, 253);
        /* Old browsers */
        background: -moz-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* FF3.6-15 */
        background: -webkit-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, rgb(250, 250, 250) 0%, rgb(247, 252, 253) 100%);
        /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid: DXImageTransform.Microsoft.gradient( startColorstr='#e9f6fd', endColorstr='#d3eefb', GradientType=0);
        /* IE6-9 */
        box-shadow: 4px 2px 13px -7px rgba(0, 0, 0, 0.75);
    }

    .formactionbar {
        padding: 5px 15px;
        height: 40px;
        background-color: #ccecf5;
    }

    .custom-modal-header {
        margin-bottom: 10px;
        /* background-color: #597a9a; */
        color: #fff;
    }

    .modal-content {
        -webkit-box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        box-shadow: -1px 3px 20px 7px rgba(249, 244, 244, 0.5);
    }

    .modal-header {
        padding: 4px 10px;
        border-bottom: 1px solid #e5e5e5;
    }

    .btn-favorite {
        margin: 2px 10px;
    }

    #favoritebtncolorcontroler label {
        text-overflow: ellipsis;
        overflow: hidden;
        width: 160px;
    }

    #favoritebtncolorcontroler .btn-default {
        display: inline-block;
        padding: 8px 8px;
        margin-right: -15px;
        font-size: 7px;
        line-height: 20px;
        color: #333333;
        text-align: center;
        text-shadow: 0 1px 1px rgba(255, 255, 255, 0.75);
        vertical-align: middle;
        cursor: pointer;
        background-color: #f5f5f5;
        background-image: -webkit-gradient(linear, 0 0, 0 100%, from(#ffffff), to(#e6e6e6));
        background-image: -webkit-linear-gradient(top, #ffffff, #e6e6e6);
        background-image: -o-linear-gradient(top, #ffffff, #e6e6e6);
        background-image: linear-gradient(to bottom, #ffffff, #e6e6e6);
        background-image: -moz-linear-gradient(top, #ffffff, #e6e6e6);
        background-repeat: repeat-x;
        border: 1px solid #bbbbbb;
        border-color: rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.25);
        border-color: #e6e6e6 #e6e6e6 #bfbfbf;
        border-bottom-color: #a2a2a2;
        -webkit-border-radius: 4px;
        -moz-border-radius: 4px;
        border-radius: 4px;
        filter: progid:dximagetransform.microsoft.gradient(startColorstr='#ffffffff', endColorstr='#ffe6e6e6', GradientType=0);
        filter: progid:dximagetransform.microsoft.gradient(enabled=false);
        -webkit-box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.05);
        -moz-box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.05);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    #favoritebtncolorcontroler .btn-default.active {
        background-color: #95ce95;
        background-color: #D9D9D9 9;
        color: #fff;
        background-image: none;
        outline: 0;
        -webkit-box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
        -moz-box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    #tabctrl .btn-default.active {
        background-color: #5089b6;
        background-color: #D9D9D9 9;
        color: #fff;
    }

    #favoritebtncolorcontroler .btn-success {
        background-color: #95ce95;
        background-color: #D9D9D9 9;
        color: #fff;
        background-image: none;
        outline: 0;
        -webkit-box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
        -moz-box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .panel-ticksheet .panel-body {
        height: 434px;
        overflow: auto;
    }

    .width-control {
        width: 55.3% !important;
        float: left;
        margin: 1px 2px !important;
    }
</style>
<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="generalmaster.guarantortab.tabcustomer.lbl"></h4>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div>
                <div class="">
                    <div class="panel-body form-panel">
                        <div class="col-sm-12">
                            <div class="form-group col-sm-6">
                                <label class="col-sm-12 control-label0" for="customertype" translate="generalmaster.customer.customertype.lbl"></label>
                                <div class="col-sm-12">
                                    <ui-select ng-model="item.CustomerTypeId" name="customertype">
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                            <span ng-if="$select.selected.Text.length > 20">...</span>
                                        </ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.CustomerType | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                            </div>
                            <div class="form-group col-sm-6">
                                <label class="col-sm-12 control-label0" for="customercode" translate="generalmaster.customer.customercode.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="text" class="form-control" ng-model="item.CustomerCode" placeholder="Customer Code">
                                </div>
                            </div>
                            <div class="form-group col-sm-6">
                                <label class="col-sm-12 control-label0" for="customername" translate="generalmaster.customer.customername.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="text" class="form-control" ng-model="item.CustomerName" placeholder="Customer Name">
                                </div>
                            </div>
                            <!--
                            <div class="form-group col-sm-6">
                                <label class="col-sm-12 control-label0" translate="generalmaster.customer.name.lbl"></label>
                                <div class="col-sm-12">
                                    <ui-select multiple ng-model="item.CardNameId" name="speciality" class="ui-select-multiple" ng-multi-tag>
                                        <ui-select-match>{{$item.Text }}</ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in currentcontext.selectedname track by $index">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                            </div>
                            -->
                            <div class="form-group col-sm-6">
                                <label class="col-sm-12 control-label0" for="policyno" translate="generalmaster.customer.policyno.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="text" class="form-control" ng-model="item.PolicyNo" placeholder="Policy No#">
                                </div>
                            </div>
                            <div class="form-group col-sm-6">
                                <label class="col-sm-12 control-label0" for="policyname" translate="generalmaster.customer.policyname.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="text" class="form-control" ng-model="item.PolicyName" placeholder="Policy Name">
                                </div>
                            </div>
                            <div class="form-group col-sm-6">
                                <label class="col-sm-12 control-label0" for="creditlimit" translate="generalmaster.customer.creditlimit.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="text" class="form-control" name="creditlimit" ng-model="item.CreditLimit" placeholder="Credit Limit">
                                </div>
                            </div>
                            <div class="form-group col-sm-6">
                                <label class="col-sm-12 control-label0" for="approvallimit" translate="generalmaster.customer.approvallimit.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="text" class="form-control" name="approvallimit" ng-model="item.ApprovalLimit" placeholder="Approval Limit">
                                </div>
                            </div>
                            <div class="form-group col-sm-6">
                                <label class="col-sm-12 control-label0" for="fromdate" translate="generalmaster.customer.activefrom.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="text" class="form-control" name="fromdate" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                        placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                                        is-open="fromdatePopup.opened" ng-model="item.ActiveFrom">
                                </div>
                            </div>
                            <div class="form-group col-sm-6">
                                <label class="col-sm-12 control-label0" translate="generalmaster.customer.activeto.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="text" class="form-control" name="date" ng-date-object datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                                        ng-click="activetoPopup = { opened: true }" is-open="activetoPopup.opened" ng-model="item.ActiveTo">
                                </div>
                            </div>
                            <div class="form-group col-sm-6">
                                <label class="col-sm-12 control-label0" translate="assetmanagement.asset.isactive.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="fooder-bgs">
                <div class="pull-right">
                    <button type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
                    <button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveandapprove()"></button>
                    <button type="button" class="btn btn-warning btn-sm" translate="common.clearaction.lbl" ng-click="clear()"></button>
                    <button type="button" class="draftbutton" translate="common.cancelaction.lbl" ng-click="backToList()"></button>
                </div>
            </div>
        </form>
    </div>
</div>
