<style>
    .panel-footer {
        padding: 4px 15px;
        background-color: #ccecf5;
        border-top: 1px solid #eeeeee;
        border-bottom-right-radius: 3px;
        border-bottom-left-radius: 3px;
        margin: 0px -5px;
    }

    .panel-body .well {
        min-height: 425px;
    }

    .formRoot {
        overflow: inherit;
    }

    .modal-content .panel-body {
        overflow: inherit;
    }

    .uib-datepicker-popup.dropdown-menu {
        top: -251px !important;
    }

    .modal-dialog.modal-lg #assetdashboard .col-sm-3,
    .col-sm-8 {
        padding: 0px 15px;
    }
    th.col-sm-1 {
    /* background: #65c4ca; */
    z-index: 0;
}
th.col-sm-1 {
    /* background: #65c4ca; */
    z-index: 0;
}
</style>
<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="generalmaster.guarantortab.tabcustomercard.lbl"></h4>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot">
                <div class=" panel-default">
                    <div class="panel-body form-panel">
                        <div class="col-sm-12">
                                    <div class="form-group col-sm-4">
                                        <label class="col-sm-12 control-label0" translate="generalmaster.customercard.customer.lbl" for="guarantorcustomerId"></label>
                                        <div class="col-sm-12">
                                            <!--<autosearch itemid="item.GuarantorCustomerId" iteminfo="" rowdata="" config="vm.guarantorcustomercontrolconfig" itemchange="onGuarantorCustomerSelect()"
                                                candisable="false"></autosearch>-->
                                            <ui-select ng-model="item.GuarantorCustomerId" name="guarantorcustomerId" autofocus required on-select="onGuarantorCustomerSelect($select.selected)">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length > 20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.GuarantorCustomer | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group col-sm-4">
                                        <label class="col-sm-12 control-label0" for="guarantorcardtype" translate="generalmaster.customercard.cardname.lbl"></label>
                                        <div class="col-sm-12">
                                            <ui-select ng-model="item.GuarantorCardTypeId" name="guarantorcardtype" autofocus required on-select="onGuarantorCardSelected($select.selected)">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length > 20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.GuarantorCardType | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group col-sm-4">
                                        <label class="col-sm-12 control-label0" for="policyno" translate="generalmaster.customercard.policyno.lbl"></label>
                                        <div class="col-sm-12">
                                            <input type="text" class="form-control" name="policyno" ng-model="item.PolicyNo" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group col-sm-4">
                                        <label class="col-sm-12 control-label0" for="policyname" translate="generalmaster.customercard.policyname.lbl"></label>
                                        <div class="col-sm-12">
                                            <input type="text" class="form-control" name="policyname" ng-model="item.PolicyName" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group col-sm-4">
                                        <label class="col-sm-12 control-label0" for="cardmastertype" translate="generalmaster.customercard.cardmastertype.lbl"></label>
                                        <div class="col-sm-12">
                                            <ui-select ng-model="item.CardMasterTypeId" name="cardmastertype">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length > 20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.CardMasterType | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group col-sm-4">
                                        <label class="col-sm-12 control-label0" for="creditlimit" translate="generalmaster.customercard.creditlimit.lbl"></label>
                                        <div class="col-sm-12">
                                            <input type="text" class="form-control" name="creditlimit" ng-model="item.CreditLimit" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group col-sm-4">
                                        <label class="col-sm-12 control-label0" for="approvallimit" translate="generalmaster.customercard.approvallimit.lbl"></label>
                                        <div class="col-sm-12">
                                            <input type="text" class="form-control" name="approvallimit" ng-model="item.ApprovalLimit" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group col-sm-4">
                                        <label class="col-sm-12 control-label0" for="deductableload" translate="generalmaster.customercard.deductableload.lbl"></label>
                                        <div class="col-sm-12">
                                            <ui-select ng-model="item.DeductableLoadId" name="deductableload" autofocus required on-select="onDeductableLoadSelected($select.selected)">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length > 20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.DeductableLoad | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group col-sm-4">
                                        <label class="col-sm-12 control-label0" translate="generalmaster.customercard.deductablelimit.lbl"></label>
                                        <div class="col-sm-12">
                                            <input type="text" class="form-control" name="CreditDays" ng-model="item.DeductableLimit" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group col-sm-4">
                                        <label class="col-sm-12 control-label0" for="activefrom" translate="generalmaster.customercard.activefrom.lbl"></label>
                                        <div class="col-sm-12">
                                            <input type="text" class="form-control" name="activefrom" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                                placeholder="{{datePickerOptions.placeholder}}" ng-click="activefromPopup = { opened: true }"
                                                is-open="activefromPopup.opened" ng-model="item.ActiveFrom">
                                        </div>
                                    </div>
                                    <div class="form-group col-sm-4">
                                        <label class="col-sm-12 control-label0" translate="generalmaster.customercard.activeto.lbl"></label>
                                        <div class="col-sm-12">
                                            <input type="text" class="form-control" name="activeto" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                                placeholder="{{datePickerOptions.placeholder}}" ng-click="activetoPopup = { opened: true }"
                                                is-open="activetoPopup.opened" ng-model="item.ActiveTo">
                                        </div>
                                    </div>
                                    <div class="form-group col-sm-4">
                                        <label class="col-sm-12 control-label0" for="isactive" translate="generalmaster.customercard.isactive.lbl"></label>
                                        <div class="col-sm-12">
                                            <input type="checkbox" class="custom-checkbox" name="isactive" ng-model="item.IsActive" autofocus>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row page-header">
                    <div class="col-sm-12">
                <table class="table table-hover table-responsive table-bordered">
                    <thead class="bg-subhead">
                        <tr>
                            <th class="col-sm-6">
                                <span translate="generalmaster.customercard.servicecategory.lbl"></span>
                            </th>
                            <th class="col-sm-3">
                                <span translate="generalmaster.customercard.deductload.lbl"></span>
                            </th>
                            <th class="col-sm-3">
                                <span translate="generalmaster.customercard.deductamount.lbl"></span>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="item in Details | filter:{Status:1}">
                            <td>
                                {{item.ServiceCategoryName}}
                            </td>
                            <td>
                                <ui-select ng-model="item.DeductableLoadId" name="deductableload">
                                    <ui-select-match>
                                        {{$select.selected.Text | limitTo : 20 : 0}}
                                        <span ng-if="$select.selected.Text.length > 20">...</span>
                                    </ui-select-match>
                                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.DeductableLoad | filter: { Text: $select.search }">
                                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                    </ui-select-choices>
                                </ui-select>
                            </td>
                            <td>
                                <input type="number" class="form-control" ng-model="item.DeductableAmount" min="0" placeholder="" ng-required="false">
                            </td>
                        </tr>
                    </tbody>
                </table>
                    </div>
                <div class="fooder-bgs">
                        <div class="col-sm-12">
                            <div class="pull-right">
                                <button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
                                <button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveandapprove()"></button>
                                <button id="btnClearForm" type="reset" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                                <button id="btnCancelForm" type="button" class="btn btn-danger btn-sm ng-scope" ng-click="cancelCallback()" translate="common.cancelaction.lbl"></button>
                            </div>
                        </div>
                    </div>
            </div>
        </form>
    </div>
</div>
