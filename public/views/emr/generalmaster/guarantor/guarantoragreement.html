        <div class="col-sm-6 form-group">
            <label class="col-sm-4 control-label" for="completedid"
                translate="generalmaster.agreement.activefrom.lbl"></label>
            <div class="col-sm-7">
                <input type="text" class="form-control" name="activefrom" ng-date-object
                    datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="activefromPopup = { opened: true }"
                    is-open="activefromPopup.opened" ng-model="item.ActiveFrom">
            </div>
        </div>
        <div class="col-sm-6 form-group">
            <label class="col-sm-4 control-label" for="nextschedule"
                translate="generalmaster.agreement.activeto.lbl"></label>
            <div class="col-sm-7">
                <input type="text" class="form-control" name="activeto" ng-date-object
                    datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="activetoPopup = { opened: true }"
                    is-open="activetoPopup.opened" ng-model="item.ActiveTo">
            </div>
        </div>
    </div>
    </fieldset>
</div>
<link href="app/css/billing-pharmacy-customs.css" rel="stylesheet">
<div class="row">
    <div class="col-sm-12 ">
        <div class=" table-control">
            <div class=" bg-pattern">
                <div class="table-height formRoot " id="mainresponsivetablecontrol">
                    <table class="table table-hover table-responsive table-bordered">
                        <thead class="bg-subhead">
                            <tr>
                                <th class="col-sm-2">
                                    <span translate="generalmaster.agreement.category.lbl"></span>
                                </th>
                                <th class="col-sm-2">
                                    <span translate="OP Discount(%)"></span>
                                </th>
                                <th class="col-sm-2">
                                    <span translate="OP Discount(Rs.)"></span>
                                </th>
                                <th class="col-sm-2">
                                    <span translate="IP Discount(%)"></span>
                                </th>
                                <th class="col-sm-2">
                                    <span translate="IP Discount(Rs.)"></span>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr ng-repeat="item in Details | filter:{Status:1}">
                                <td>
                                    {{item.ServiceCategoryName}}
                                </td>
                                <td>
                                    <input type="number" class="form-control" ng-model="item.OPDiscount" min="0"
                                        placeholder=" " ng-required="false">
                                </td>
                                <td>
                                    <input type="number" class="form-control" ng-model="item.OPDiscountRate" min="0"
                                        placeholder="" ng-required="false">
                                </td>
                                <td>
                                    <input type="number" class="form-control" ng-model="item.IPDiscount" min="0"
                                        placeholder=" " ng-required="false">
                                </td>
                                <td>
                                    <input type="number" class="form-control" ng-model="item.IPDiscountRate" min="0"
                                        placeholder="" ng-required="false">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <custom-table config="vm.gridConfig"></custom-table>
        <div class="fooder-bgs">
            <div class="col-sm-12">
                <button type="button" class="pull-left btn btn-sm pyr-color10" ng-click="backToList()">
                    <i class="fa fa-angle-left"></i>&nbsp;&nbsp;
                    <span translate="common.backaction.lbl"></span>
                </button>
                <div class="pull-right">
                    <button id="btnSaveForm" type="button" class="draftbutton" translate="common.saveaction.lbl"
                        ng-click="save()"></button>
                    <button id="btnClearForm" type="button" class="draftbutton" ng-click="clear()"
                        translate="common.clearaction.lbl"></button>
                </div>
            </div>
        </div>
    </div>
</div>
