<style>
/* Css*/
    #fullregistrationheight .formRoot{height:506px}
    #fullregistrationheight .well {
    min-height: 450px !important;
}
/* Css end*/
</style>
<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <h4 class="modal-title custom-modal-title" translate="generalmaster.guarantorgst-form.pagetitle.lbl"></h4>
</div>
<div class="row " id="fullregistrationheight">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
            <div class="formRoot">
                <div class="panel panel-default">
                    <div class="panel-body form-panel bg-pattern">
                        <div class="col-sm-12">
                                     <div class="form-group col-sm-6">
                                        <label class="col-sm-12 control-label0" for="isgstregistered" translate="generalmaster.guarantorgst-form.isgstregistered.lbl"></label>
                                        <div class="col-sm-12">
                                            <input type="checkbox" name="isgstregistered" class="custom-checkbox" ng-model="item.IsGSTRegistered" ng-change="gstRegister()">
                                        </div>
                                    </div>
                                     <div class="form-group col-sm-6">
                                        <label class="col-sm-12 control-label0" for="gstid" translate="generalmaster.guarantorgst-form.gstid.lbl"></label>
                                        <div class="col-sm-12">
                                            <input type="text" class="form-control" name="gstid" ng-model="item.GSTId" placeholder="" ng-disabled="!item.IsGSTRegistered">
                                        </div>
                                    </div>
                                     <div class="form-group col-sm-6">
                                        <label class="col-sm-12 control-label0" for="businessregno" translate="generalmaster.guarantorgst-form.businessregno.lbl"></label>
                                        <div class="col-sm-12">
                                            <input type="text" class="form-control" name="businessregno" ng-model="item.BusinessRegNo" placeholder="" ng-disabled="!item.IsGSTRegistered">
                                        </div>
                                    </div>
                                     <div class="form-group col-sm-6">
                                        <label class="col-sm-12 control-label0" for="businessname" translate="generalmaster.guarantorgst-form.businessname.lbl"></label>
                                        <div class="col-sm-12">
                                            <input type="text" class="form-control" name="businessname" ng-model="item.BusinessName" placeholder="" ng-disabled="!item.IsGSTRegistered">
                                        </div>
                                    </div>
                                     <div class="form-group col-sm-6">
                                        <label class="col-sm-12 control-label0" for="businessaddress" translate="generalmaster.guarantorgst-form.businessaddress.lbl"></label>
                                        <div class="col-sm-12">
                                            <input type="text" class="form-control" name="businessaddress" ng-model="item.BusinessAddress" placeholder="" ng-disabled="!item.IsGSTRegistered">
                                        </div>
                                    </div>
                                     <div class="form-group col-sm-6">
                                        <label class="col-sm-12 control-label0" for="taxcode" translate="generalmaster.guarantorgst-form.taxcode.lbl"></label>
                                        <div class="col-sm-12">
                                            <input type="text" class="form-control" name="taxcode" ng-model="item.TaxCode" placeholder="" ng-disabled="!item.IsGSTRegistered">
                                        </div>
                                    </div>
                                     <div class="form-group col-sm-6">
                                        <label class="col-sm-12 control-label0" for="activefrom" translate="generalmaster.guarantorgst-form.activefrom.lbl"></label>
                                        <div class="col-sm-12">
                                            <input type="text" class="form-control" name="activefrom" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                                placeholder="{{datePickerOptions.placeholder}}" ng-click="activefromPopup = { opened: true }"
                                                is-open="activefromPopup.opened" ng-model="item.ActiveFrom" ng-disabled="!item.IsGSTRegistered">
                                        </div>
                                    </div>
                                     <div class="form-group col-sm-6">
                                        <label class="col-sm-12 control-label0" for="activeto" translate="generalmaster.guarantorgst-form.activeto.lbl"></label>
                                        <div class="col-sm-12">
                                            <input type="text" class="form-control" name="activeto" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                                placeholder="{{datePickerOptions.placeholder}}" ng-click="activetoPopup = { opened: true }"
                                                is-open="activetoPopup.opened" ng-model="item.ActiveTo" ng-disabled="!item.IsGSTRegistered">
                                        </div>
                                    </div>
                        </div>
                    </div>
                    <div class="fooder-bgs">
                            <div class="row ">
                                <div class="col-sm-12">
                                    <div class="pull-left">
                                        <button type="button" class="btn pyr-color10 btn-sm" ng-click="back()"><i class="fa fa-angle-left" aria-hidden="true" ></i>&nbsp;&nbsp;<span class="btn-fontsize"  translate="common.backaction.lbl"></span></button>
            
                                    </div>
                                    <div class="pull-right">
            
                                        <button id="btnSave" type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="saveItem()"></button>
                                        <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                                        <button id="btnCancelForm" type="button" class="cancelbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                </div>
            </div>
        </form>
    </div>
</div>
