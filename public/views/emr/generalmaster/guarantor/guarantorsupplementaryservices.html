<link href="app/css/billing-pharmacy-customs.css" rel="stylesheet">

<!---Header-->
<div class="row">
    <div class="table-height formRoot">
        <table class="table table-hover table-responsive table-bordered">
            <thead class="bg-subhead">
                <tr>
                    <th class="col-sm-2">
                        <span translate="generalmaster.supplementary.itemcode.lbl"></span>
                    </th>
                    <!-- <th class="col-sm-2">
                                        <span translate="generalmaster.supplementary.facility.lbl"></span>
                                    </th> -->
                    <th class="col-sm-2">
                        <span translate="generalmaster.supplementary.category.lbl"></span>
                    </th>
                    <th class="col-sm-2">
                        <span translate="generalmaster.supplementary.qty.lbl"></span>
                    </th>
                    <th class="col-sm-2">
                        <span translate="generalmaster.supplementary.printorder.lbl"></span>
                    </th>
                    <th class="col-sm-2">
                        <span translate="generalmaster.supplementary.status.lbl"></span>
                    </th>
                    <th class="col-sm-1">
                        <span translate="common.actions_col.lbl"></span>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="item in Details | filter:{Status:1}">
                    <td>
                        <autosearch itemid="item.ServiceItemId" iteminfo="item.SelectedItem" name="'service'"
                            rowdata="item" config="vm.serviceitemcontrolconfig" itemchange="ServiceItemChanged(item)"
                            class="inputsearchlogo" candisable="item.RdoServiceId" isrequired="true"></autosearch>
                    </td>
                    <!-- <td>
                                        <ui-select ng-model="item.FacilityId" class="ui-select-grid">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </td> -->
                    <td>
                        <ui-select ng-model="item.ServiceCategoryId" class="ui-select-grid">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.ServiceCategory | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </td>
                    <td>
                        <input type="text" class="form-control" ng-model="item.Quantity" placeholder=""
                            ng-keypress="numberonly($event)">
                    </td>
                    <td>
                        <input type="text" class="form-control" ng-model="item.PrintOrder" placeholder=""
                            ng-keypress="numberonly($event)">
                    </td>
                    <td align="center">
                        <input type="checkbox" class="custom-checkbox" ng-model="item.GuarantorSupplementaryStatus">
                    </td>
                    <td align="center">
                        <img src="assets/svg/delete.svg" ng-click="deleteDetail(item)">
                    </td>
                </tr>
            </tbody>
        </table>
        <!-- grid area ends -->
    </div>
    <div class="row">
        <custom-table config="vm.gridConfig"></custom-table>
    </div>
    <div class="fooder-bgs">
        <div class="col-sm-12">
            <button type="button" class="pull-left btn btn-sm pyr-color10" ng-click="backToList()">
                <i class="fa fa-angle-left"></i>&nbsp;&nbsp;
                <span translate="common.backaction.lbl"></span>
            </button>
            <div class="pull-right">
                <button id="btnSaveForm" type="button" style="color: rgb(65, 14, 14) !important;"
                    class="draftbutton" translate="common.saveaction.lbl" ng-click="saveItem()"></button>
                <!--<button type="button" class="btn btn-primary btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>-->
                <!-- <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button> -->
                <!--<button id="btnCancelForm" type="button" class="draftbutton" ng-click="back()" translate="common.cancelaction.lbl"></button>-->
            </div>
        </div>
    </div>
</div>
