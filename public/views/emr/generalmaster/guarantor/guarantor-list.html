<link href="app/css/regbilling.css" rel="stylesheet">

<div class="row">
    <div class="col-sm-9">
        <h4 class="mt0" translate="generalmaster.guarantor-list.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-3">
        <div class="filters">
            <button type="button" tabindex="-1" class="btn-add" ng-click="addNew()"
                uib-tooltip="{{ 'lis.externalprovidermaster.pagetitle.lbl' | translate}}" tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</div>
<div class="row">
    <div class="drhms-list-filters">
        <div class="col-sm-4">
            <label class="col-sm-3" translate="generalmaster.guarantor-list.filter_guarantortype.lbl"></label>
            <div class="col-sm-9">
                <ui-select ng-model="currentfilter.GuarantorTypeId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 15 : 0}}
                        <span ng-if="$select.selected.Text.length>15">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.GuarantorType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-3" translate="generalmaster.guarantor-list.filter_status.lbl"></label>
            <div class="col-sm-9">
                <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 15 : 0}}
                        <span ng-if="$select.selected.Text.length>15">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-3" translate="Search"></label>
            <div class="col-sm-9">
                <div class="filters">
                    <div class="search">
                        <input type="text" id="pid" class="form-control" on-enter="getList()"
                            ng-model="currentfilter.GuarantorName"
                            placeholder="{{'generalmaster.guarantor-list.filter_guarantorcodename.lbl'|translate}}">
                        <div class="drhms-search-icon"><i class="fas fa-search" aria-hidden="true"></i></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<custom-table config="vm.gridConfig"></custom-table>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
