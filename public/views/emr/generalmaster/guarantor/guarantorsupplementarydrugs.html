<link href="app/css/billing-pharmacy-customs.css" rel="stylesheet">

<!---Header-->
<div class="row">
    <div class="col-sm-6 form-group">
        <label class="col-sm-4 control-label" translate="generalmaster.supplementary.itemname.lbl"></label>
        <div class="col-sm-8">
            <div class="search">
                <autosearch currentfilter="ItemMasterId" iteminfo="item.SelectedItem" name="'drug'" rowdata="item"
                    config="vm.drugitemcontrolconfig" itemchange="getItem()" on-enter="getItem()"
                    class="inputsearchlogo" candisable="item.RdoItemMasterId" isrequired="true"></autosearch>
                <div class="drhms-search-icon"><i class="fas fa-search" aria-hidden="true"></i></div>
            </div>
        </div>
    </div>
    <div class="col-sm-6 form-group">
        <label class="col-sm-4 control-label"
            translate="generalmaster.supplementary.category.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.ItemCategoryId" ng-change="getItem()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.ItemCategory | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
</div>
<div class="row">
    <div class="table-height formRoot">
        <table class="table table-hover table-responsive table-bordered">
            <thead class="bg-subhead">
                <tr>
                    <th class="col-sm-2">
                        <span translate="generalmaster.supplementary.itemcode.lbl"></span>
                    </th>
                    <th class="col-sm-2">
                        <span translate="generalmaster.supplementary.category.lbl"></span>
                    </th>
                    <th class="col-sm-2">
                        <span translate="generalmaster.supplementary.qty.lbl"></span>
                    </th>
                    <th class="col-sm-2">
                        <span translate="generalmaster.supplementary.printorder.lbl"></span>
                    </th>
                    <th class="col-sm-1">
                        <span translate="common.actions_col.lbl"></span>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="item in Details | filter:{Status:1}">
                    <td>
                        <autosearch itemid="item.ItemMasterId" iteminfo="item.SelectedItem" name="'drug'" rowdata="item"
                            config="vm.drugitemcontrolconfig" itemchange="DrugItemChanged(item)" class="inputsearchlogo"
                            candisable="item.RdoItemMasterId" isrequired="true">
                        </autosearch>
                    </td>
                    <td>
                        <ui-select ng-model="item.ItemCategoryId" class="ui-select-grid">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.ItemCategory | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </td>
                    <td>
                        <input type="text" class="form-control" ng-model="item.Quantity" placeholder=""
                            ng-keypress="numberonly($event)">
                    </td>
                    <td>
                        <input type="text" class="form-control" ng-model="item.PrintOrder" placeholder=""
                            ng-keypress="numberonly($event)">
                    </td>
                    <!-- <td align="center">
                                    <input type="checkbox" class="custom-checkbox" ng-model="item.GuarantorSupplementaryStatus">
                                </td> -->
                    <td align="center">
                        <img src="assets/svg/delete.svg" ng-click="deleteDetail(item)">
                    </td>
                </tr>
            </tbody>
        </table>
        <!-- grid area ends -->
    </div>
    <div class="row">
        <custom-table config="vm.gridConfig"></custom-table>
    </div>
    <div class="fooder-bgs">
        <div class="col-sm-12">
            <button type="button" class="pull-left btn btn-sm pyr-color10" ng-click="backToList()">
                <i class="fa fa-angle-left"></i>&nbsp;&nbsp;
                <span translate="common.backaction.lbl"></span>
            </button>
            <div class="pull-right">
                <button id="btnSaveForm" type="button" class="draftbutton" translate="common.saveaction.lbl"
                    ng-click="saveItem()"></button>
            </div>
        </div>
    </div>
</div>
