<style>
    .panel-ticksheet {
        margin: 10px !important;
    }

    .ticksheet-name {
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 10px;
    }

    .ticksheet-item {
        margin-bottom: 7px !important;
    }

    #tabctrl .btn-default {
        color: #333333;
        background-color: #d8d1d1;
        border-color: #eaeaea;
        padding: 3px 11px;
    }

    #tabctrl .btn .btn-default {
        border-color: #9E9E9E;
    }

    /* ui style start*/

    .btn-favorite {
        margin: 2px 10px;
    }

    #favoritebtncolorcontroler label {
        text-overflow: ellipsis;
        overflow: hidden;
        width: 160px;
    }

    #favoritebtncolorcontroler .btn-default {
        display: inline-block;
        padding: 4px 8px;
        margin-right: -6px;
        font-size: 14px;
        line-height: 20px;
        color: #333333;
        text-align: center;
        text-shadow: 0 1px 1px rgba(255, 255, 255, 0.75);
        vertical-align: middle;
        cursor: pointer;
        background-color: #f5f5f5;
        background-image: -webkit-gradient(linear, 0 0, 0 100%, from(#ffffff), to(#e6e6e6));
        background-image: -webkit-linear-gradient(top, #ffffff, #e6e6e6);
        background-image: -o-linear-gradient(top, #ffffff, #e6e6e6);
        background-image: linear-gradient(to bottom, #ffffff, #e6e6e6);
        background-image: -moz-linear-gradient(top, #ffffff, #e6e6e6);
        background-repeat: repeat-x;
        border: 1px solid #bbbbbb;
        border-color: rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.1) rgba(0, 0, 0, 0.25);
        border-color: #e6e6e6 #e6e6e6 #bfbfbf;
        border-bottom-color: #a2a2a2;
        -webkit-border-radius: 4px;
        -moz-border-radius: 4px;
        border-radius: 4px;
        filter: progid:dximagetransform.microsoft.gradient(startColorstr='#ffffffff', endColorstr='#ffe6e6e6', GradientType=0);
        filter: progid:dximagetransform.microsoft.gradient(enabled=false);
        -webkit-box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.05);
        -moz-box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.05);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    #favoritebtncolorcontroler .btn-default.active {
        background-color: #95ce95;
        background-color: #D9D9D9 9;
        color: #fff;
        background-image: none;
        outline: 0;
        -webkit-box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
        -moz-box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    #tabctrl .btn-default.active {
        background-color: #5089b6;
        background-color: #D9D9D9 9;
        color: #fff;
    }

    #favoritebtncolorcontroler .btn-success {
        background-color: #95ce95;
        background-color: #D9D9D9 9;
        color: #fff;
        background-image: none;
        outline: 0;
        -webkit-box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
        -moz-box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .panel-ticksheet .panel-body {
        /* height: 434px;
        overflow: auto; */
        height: 547px !important;
    overflow: auto;
    min-height: 598px;
    }

    .width-control {
        width: 16.3% !important;
        float: left;
        margin: 1px 2px !important;
    }

    /* ui style end*/

    .panel-body .well {
        padding: 3px !important;
        margin-top: 3px;
    }

    .panel-body {
        padding: 1px;
    }

    .bg-pattern .col-sm-12 {
        padding-left: 8px;
        padding-right: 8px;
    }
</style>

<div class="panel panel-default panel-ticksheet">
    <div class="panel-body bg-pattern">
        <div class="col-sm-12">
            <div>
                <div id="listalignctrl">
                    <fieldset class="well">
                        <div class="btn-group ticksheet-item width-control" id="favoritebtncolorcontroler" ng-repeat="item in cardname">
                            <label class="btn btn-default" ng-model="item[item.Id]" uib-btn-checkbox uib-tooltip="{{item.CardName}}" tooltip-placement="bottom">{{item.CardName}}</label>
                            <button class="btn btn-default dropdown-toggle" type="button" ng-click="caretClicked(item)">
                                <span class="caret"></span>
                            </button>
                        </div>

                    </fieldset>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="fooder-bgs">
    <div class="col-sm-12">
        <div class="col-sm-4 col-md-4">
        </div>
        <div class="col-sm-8 col-md-8">
            <div class="pull-right">
                <button type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="saveItem()"></button>
            </div>
        </div>
    </div>
</div>
