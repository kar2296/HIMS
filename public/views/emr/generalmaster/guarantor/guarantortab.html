<div class="row page-header" id="assets">
    <h4 class="col-sm-6 mt0" translate="generalmaster.guarantortab.pagetitle.lbl"></h4>
    <div class="col-sm-6">
        <button class="btn-add" ng-click="addNew()"
            uib-tooltip="{{ 'generalmaster.guarantortab.pagetitle.lbl' | translate }}" tooltip-placement="bottom">
            <i class="fa fa-plus" aria-hidden="true"></i>
            <!-- <span translate="common.addaction.lbl"></span> -->
        </button>
        <!-- <span ng-click="Asset_dashboard()" class="text-right" style="float:right;">
                    <em  class="fa fa-home fa-lg dashboardicon" ></em>
                </span> -->
    </div>
</div>
<div id="receipt_tab">
    <div class="row tablebox" id="tablebox">
        <div class="col-sm-12">
            <uib-tabset active="active" id="assettabs">
                <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)"
                    disable="tab.canDisable">
                </uib-tab>
            </uib-tabset>
            <div ui-view class="tabview"></div>
        </div>
    </div>
</div>
