<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="generalmaster.clinicalremarks.parentpagetitle.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="backToList()">
        </div>
    </div>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="facility"
                translate="generalmaster.clinicalremarks.facility.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.FacilityId" name="facility" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="remarktype"
                translate="generalmaster.clinicalremarks.remarktype.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.ClinicalRemarkTypeId" name="remarktype" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ClinicalRemarkType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="code" translate="generalmaster.clinicalremarks.code.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="code" ng-model="item.Code" placeholder="" required>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="remarks"
                translate="generalmaster.clinicalremarks.remarks.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="remarks" ng-model="item.ClinicalRemarks" placeholder=""
                    required>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" translate="generalmaster.clinicalremarks.isactive.lbl"></label>
            <div class="col-sm-12">
                <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
            </div>
        </div>
    </form>
</div>
<div class="">
    <div class="row">
        <div class="pull-right">
            <button type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
            <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                ng-click="saveAndApprove()"></button>
        </div>
    </div>
</div>
