<style>
  img.pc-user-image {
    width: 100px;
    border: 1px solid #EEEEEE;
    height: 100px;
    border-radius: 50px;
  }

  a.pc-btn.accent {
    /* background: #8196ec;
    color: #00125a; */
    background: #0598f6;
    color: #fff;
    width: 100px;
    font-weight: 600;
    display: inline-block;
    text-align: center;
    border-radius: 16px;
    padding: 3px;
  }

  .profile-card {
    display: flex;
    align-items: center;
    justify-content: space-around;
    box-shadow: rgba(0, 0, 0, 0.16) 0px 3px 6px, rgba(0, 0, 0, 0.23) 0px 3px 6px;
    margin: 10px;
    border-radius: 20px;
    padding: 5px;
  }

  a.pc-btn.accent:hover {
    color: #fff;
    background-color: #dce512;
  }

  /* table.table.table-bordered.table-condensed.dropdown-menu.align {
    margin-left: -410px;
  } */

  i.fa-solid {
    font-family: 'Font Awesome 5 Pro';
  }

  a.pc-btn.accent i {
    display: flex;
    flex-wrap: nowrap;
    align-content: center;
    justify-content: center;
    align-items: center;
  }

  a.pc-btn.accent {
    background: #0598f6;
    color: #fff;
    width: 28px;
    font-weight: 600;
    display: inline-block;
    text-align: center;
    border-radius: 16px;
    padding: 0;
    height: 28px;
    padding-top: 4px;
  }
  autosearch.logo .custom-popup-wrapper {
    margin-left: -440px;
}
</style>
<div class="row page-header">
  <h4 class="col-sm-6 mt0" translate="OP Patient Feedback"></h4>
  <div class="col-sm-6">
    <div class="filters">
      <div class="search">
        <autosearch class="logo" itemid="item.EncounterId" iteminfo="item.SelectedItem" rowdata="item"
          config="vm.patientcontrolconfig" itemchange="patientChanged()" name="'patient'" isrequired="true"
          candisable="item.SurgeryEntryStatusId==3" placeholder="'Patient'" focus-if>
        </autosearch>
        <i class="fas fa-search" aria-hidden="true"></i>
      </div>
    </div>
  </div>
</div>
<div class="profile-card" ng-show="item.PatientId>0">
  <div class="pc-user">
    <img data-ng-src="data:image/png;base64,{{currentcontext.Photo}}" tabindex="-1" class="pc-user-image" />
    <!-- <div class="pc-user-image">
      <img src="app/img/care img/doc1.png">
    </div> -->
  </div>
  <div class="pc-user-info">
    <div class="col-sm-12">
      <div class="col-sm-2">Patient name</div>
      <div class="col-sm-10">:
        {{item.Title}}.{{item.FirstName}}&nbsp;{{item.LastName}}
      </div>
    </div>
    <div class="col-sm-12">
      <div class="col-sm-2">Age/DOB</div>
      <div class="col-sm-10">:
        {{item.Age}}{{item.DOB}}
      </div>
    </div>
    <div class="col-sm-12">
      <div class="col-sm-2">MRN</div>
      <div class="col-sm-10">:
        {{item.MRN}}
      </div>
    </div>
    <div class="col-sm-12">
      <div class="col-sm-2">Phone No</div>
      <div class="col-sm-10">:
        {{item.Mobile}}
      </div>
    </div>
  </div>
  <div class="pc-user-buttons">
    <!-- <a class="pc-btn accent" ng-click="feedbackmodal()"  uib-tooltip="{{ 'pop-up' | translate }}" tooltip-placement="bottom"><i class="fa-solid fa-comment-dots"></i></a> -->
    <a class="pc-btn accent" ng-click="feedbackpage()"
      tooltip-placement="bottom"><i class="fa-solid fa-comment-dots"></i></a>
  </div>
</div>
