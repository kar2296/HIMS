<style>
    #banner td,
    th {
        padding: 5px !important;
        border: 1px solid #c1b9b9 !important;
        /* border: 1px; */
    }

    th,
    td {
        border: 1px solid black;
        padding: 6px;
    }

    @media(max-width:768px) {
        input#googleaddopt {
            width: 178px;
        }
    }

    @media (max-width:800px) {
        .form-horizontal .form-group {
            margin-left: 0px;
            margin-right: 0px;
        }

            width: 80px;
        }

        input#googleaddopt {
            width: 190px;
        }
    }

    @media only screen and (min-width: 1224px) {
        #quickregistration-height .image-height-control {
            height: 93px;

        }

        margin-bottom: 281px;
    }

    .btn-cancel {
        border-radius: 7px;
        width: 92px;
        height: 31px;
    }

    /*hide sidebar*/
    .layout-fixed .wrapper>.aside>.aside-inner {
        display: none !important;
    }

    .aside-collapsed .wrapper>.aside>.aside-inner {
        display: none !important;
    }

    em.fa.fa-navicon,

        display: none;
    }

    .aside-collapsed .wrapper>section,
    .aside-collapsed .wrapper>footer {
        margin-left: 0px !important;
    }

    .wrapper>.aside {
        width: 0px;
    }

    .wrapper>section,
    .wrapper>footer {
        margin-left: 0px !important;
    }

    .aside-collapsed .wrapper>.aside,
