<style>
    #btnAddMember {
        margin-left : 15px;
        margin-top : -12px;
    }
    .panel-body {
        padding: 15px;
        margin-left: 0px;
        margin-top: -53px;
        margin-right: 0px;
        margin-bottom: 0px;
        background-image: url(app/img/bg-body.jpg);
        background-repeat: repeat;
        overflow: auto;
    }
    .modal-content .panel-body{ overflow: inherit;}
    .table-uigrid-members {
        height : 200px !important;
    }
        .well {
        min-height: 20px;
        padding: 19px;
        margin-bottom: 0px;
        border: 1px solid #ededed;
        border-radius: 4px;
        background: rgb(233, 246, 253);
        /* Old browsers */
        background: -moz-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* FF3.6-15 */
        background: -webkit-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, rgb(250, 250, 250) 0%, rgb(247, 252, 253) 100%);
        /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid: DXImageTransform.Microsoft.gradient( startColorstr='#e9f6fd', endColorstr='#d3eefb', GradientType=0);
        /* IE6-9 */
        box-shadow: 4px 2px 13px -7px rgba(0, 0, 0, 0.75);
    }
    
    .formactionbar {
        padding: 5px 15px;
        height: 40px;
        background-color: #ccecf5;
    }
    
    .custom-modal-header {
        margin-bottom: 10px;
        background-color: #597a9a;
        color: #fff;
    }
    
    .modal-content {
        -webkit-box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        box-shadow: -1px 3px 20px 7px rgba(249, 244, 244, 0.5);
    }
    
    .modal-header {
        padding: 4px 10px;
        border-bottom: 1px solid #e5e5e5;
    
    }
    .grid-root {
        padding-right : 0px;
        padding-left : 0px;
    }
    /**/
    .custom-checkbox{margin-top: 0px !important;}
</style>
<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="generalmaster.researchproject-form.pagetitle.lbl"></h4>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class=" panel panel-body panel-default">
                <div class="col-sm-12">
                    <!-- Left panel-->
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="col-sm-4 control-label" for="facility" translate="generalmaster.researchproject-form.facility.lbl"></label>
                            <div class="col-sm-8">
                                <ui-select ng-model="item.FacilityId" name="facility" required>
                                    <ui-select-match>
                                        {{$select.selected.Text | limitTo : 20 : 0}}
                                        <span ng-if="$select.selected.Text.length>20">...</span>
                                    </ui-select-match>
                                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                    </ui-select-choices>
                                </ui-select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-4 control-label" for="projecttype" translate="generalmaster.researchproject-form.type.lbl"></label>
                            <div class="col-sm-8">
                                <ui-select ng-model="item.ProjectTypeId" name="projecttype" required>
                                    <ui-select-match>
                                        {{$select.selected.Text | limitTo : 20 : 0}}
                                        <span ng-if="$select.selected.Text.length>20">...</span>
                                    </ui-select-match>
                                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ProjectType | filter: { Text: $select.search }">
                                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                    </ui-select-choices>
                                </ui-select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-4 control-label" for="projectcode" translate="generalmaster.researchproject-form.projectcode.lbl"></label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="projectcode" ng-model="item.ProjectCode" placeholder="" required uppercase>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-4 control-label" for="projectname" translate="generalmaster.researchproject-form.projectname.lbl"></label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="projectname" ng-model="item.ProjectName" placeholder="" required uppercase>
                            </div>
                        </div>
                    </div>
                    <!--Right Panel-->
                    <!-- rightpanel -->
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label class="col-sm-4 control-label" translate="generalmaster.researchproject-form.startdate.lbl"></label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="startdate" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                    placeholder="{{datePickerOptions.placeholder}}" ng-click="startdatePopup = { opened: true }"
                                    is-open="startdatePopup.opened" ng-model="item.StartDate">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-4 control-label" translate="generalmaster.researchproject-form.enddate.lbl"></label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" name="enddate" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                    placeholder="{{datePickerOptions.placeholder}}" ng-click="enddatePopup = { opened: true }"
                                    is-open="enddatePopup.opened" ng-model="item.EndDate">
                            </div>
                        </div>
                        <!--
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" translate="generalmaster.researchproject-form.isactive.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="checkbox" name="isactive" class="custom-checkbox"
                                            ng-model="item.IsActive">
                                    </div>
                                </div>
                                -->
                        <div class="form-group">
                            <label class="col-sm-4 control-label" translate="generalmaster.researchproject-form.comments.lbl"></label>
                            <div class="col-sm-8">
                                    <textarea rows="3" name="comments" ng-model="item.Comments" maxlength="4000" style="width:100%;" class="notes-textarea"></textarea>
                                
                            </div>
                        </div>
                        <div class="form-group">
                                <label class="col-sm-4 control-label" translate="generalmaster.researchproject-form.isactive.lbl"></label>
                                <div class="col-sm-8">
                                    <input type="checkbox" class="custom-checkbox" name="active" ng-model="item.IsActive">
                                </div>
                            </div>
                    </div>
                </div>
            </div>
            <div class="panel panel-body panel-default" ng-show="currentcontext.id>0">
                <div class="page-header">
                    <h3 class="panel-title" translate="generalmaster.researchprojectmember-form.pnlmembers.lbl"></h3>
                </div>
                <div class="row filter-area">
                    <div class="col-sm-6 ">
                        <label class="col-sm-6 control-label" translate="generalmaster.researchprojectmember-form.projectmember.lbl"></label>
                        <div class="col-sm-6">
                            <ui-select ng-model="projectmember.UserId">
                                <ui-select-match>
                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                </ui-select-match>
                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.User | filter: { Text: $select.search }">
                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                </ui-select-choices>
                            </ui-select>
                        </div>
                    </div>
                    <div class="col-sm-4">
                        <div class="form-group">
                            <label class="col-sm-8 control-label" translate="generalmaster.researchprojectmember-form.isprojectincharge.lbl"></label>
                            <div class="col-sm-4">
                                <input type="checkbox" name="isprojectincharge" class="custom-checkbox" ng-model="projectmember.IsIncharge">
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-1">
                        <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addMember()" uib-tooltip="{{ 'generalmaster.researchprojectmember-form.addnewtooltip.lbl' | translate }}"
                            tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i><span translate="common.addaction.lbl"></span></button>
                    </div>
                </div>
                <div class="col-sm-12 grid-root">
                    <div ui-grid="vm.gridConfig" class="table-uigrid table-uigrid-members"></div>
                </div>
                
            </div>
    </div>
    </form>
</div>
</div>
<div class="panel-footer formactionbar">
    <div class="pull-right">
        <button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
        <button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
        <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
    </div>
</div>
