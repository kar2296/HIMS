<style>
    .nameinfo {
        font-size: 13px;
        font-weight: 700;
        color: #337ab7;
    }
    .nameinfo.mrninfo {
        color: black
    }
    .contactinfo {
        font-size: 10px;
        color: #808080
    }
    .block {
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
}
    .linkstyle {
        font-weight: 700;
        text-align: right;
    }
    .statusinfo {
        font-size: 13px;
    }
    .sr-only {
    height: 22px !important;}
    .filter-area{padding-top:0px !important;}
   
</style>
<div class="row page-header ">
    <h4 class="col-sm-6 mt0 ng-scope" translate="generalmaster.researchproject-list.pagetitle.lbl"></h4>
    <div class="col-sm-6">
        <!-- <button class="btn bt-color3 btn-xs pull-right" uib-tooltip="{{ 'clinicalmaster.serviceitem-list.filter-tooltip.lbl' | translate }}"
            tooltip-placement="bottom" ng-click="openAdvancedFilter()"> <i class="fa fa-filter fa-xs " aria-hidden="true"></i>&nbsp;&nbsp;<span translate="clinicalmaster.serviceitem-list.filter.lbl"></span>
            </button> -->
        <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addNew()" uib-tooltip="{{ 'generalmaster.researchproject-list.pagetitle.lbl' | translate }}"
            tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i><span translate="generalmaster.patientalert-list.addnew.lbl"></span></button>
    </div>
</div>

<div class="row filter-area">
    <div class="col-sm-12">
        <div class="col-sm-3 filter-lbl">
            <label class="col-sm-4 control-label filter-lbl" translate="generalmaster.researchproject-list.filter_facility.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.FacilityId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-3 filter-lbl">
            <label class="col-sm-4 control-label filter-lbl" translate="generalmaster.researchproject-list.filter_projecttype.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.ProjectTypeId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ProjectType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-3 filter-lbl">
            <label class="col-sm-4 control-label filter-lbl" translate="generalmaster.researchproject-list.filter_projectname.lbl"></label>
            <div class="col-sm-8 input-group">
                <div class="input-group-addon"><i class="fas fa-search" aria-hidden="true"></i></div>
                <input type="text" class="form-control" name="filter_projectname" on-enter="getList()" ng-model="currentfilter.ProjectName"
                    placeholder="" translate translate-attr-placeholder="generalmaster.researchproject-list.filter_projectname.lbl">
            </div>
        </div>
        <div class="col-sm-3 filter-lbl">
            <label class="col-sm-4 control-label filter-lbl" translate="generalmaster.researchproject-list.filter_status.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </div>
</div>

<div class="container-fluid onerow-filter">
    <div ui-grid="vm.gridConfig" class="table-uigrid"></div>
    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
