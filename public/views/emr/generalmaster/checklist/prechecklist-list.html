<style>
    .nameinfo {
        font-size: 13px;
        font-weight: 700;
        color: #337ab7;
    }
    .nameinfo.mrninfo {
        color: black
    }
    .contactinfo {
        font-size: 10px;
        color: #808080
    }
    .block {
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
}
    .linkstyle {
        font-weight: 700;
        text-align: right;
    }
    .statusinfo {
        font-size: 13px;
    }
    .sr-only {
    height: 22px !important;}
    .filter-area{padding-top:0px !important;}

</style>
<!--  start -->
<div class="row page-header ">
    <h4 class="col-sm-6 mt0 ng-scope" translate="generalmaster.checklist.pagetitle.lbl"><span class="ng-scope">Service Items</span></h4>
    <div class="col-sm-6">
        <button class="btn bt-color3 btn-xs pull-right btn-filter" ng-click="" uib-tooltip="Advance Filter" tooltip-placement="bottom"><i class="fa fa-filter" aria-hidden="true"></i>&nbsp;&nbsp;<span translate="clinicalmaster.serviceitem-list.filter.lbl"></span></button>
        <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addNew()" uib-tooltip="{{ 'generalmaster.feedbackmasters.pagetitle.lbl' | translate }}"
            tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i><span translate="Add New"></span></button>
    </div>
</div>
<!--  end -->
<div class="row filter-area">
    <div class="col-sm-12">
     <div class="form-group">
        <div class="col-sm-3 col-md-3 filter-lbl">
            <label class="col-sm-4 control-label filter-lbl" translate="generalmaster.feedbackmasters.filter_facility.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.FacilityId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-3 col-md-3 filter-lbl">
            <label class="col-sm-4 control-label filter-lbl" translate="generalmaster.feedbackmasters.filter_type.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.CheckListTypeId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.CheckListType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-3 col-md-3 filter-lbl">
            <label class="col-sm-4 control-label filter-lbl" translate="generalmaster.feedbackmasters.filter_category.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.CheckListCategoryId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.CheckListCategory| filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-3 col-md-3 filter-lbl">
            <label class="col-sm-4 control-label filter-lbl" translate="generalmaster.feedbackmasters.filter_status.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
      </div>
    </div>
</div>

<div class="container-fluid onerow-filter">
    <div ui-grid="vm.gridConfig" class="table-uigrid"></div>

    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage"></ul>
        </div>
    </div>
</div>
