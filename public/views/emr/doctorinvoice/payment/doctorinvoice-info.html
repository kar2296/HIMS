<style>
    .profileinput {
        height: 19px !important;
        padding-bottom: 1px !important;
    }

    .fullreg-profiles label {
        margin-bottom: -2px;
    }

    .ui-grid-viewport {
        height: 212px !important;
    }

    .table-uigrid {
        height: 260px!important;
    }

    .custom-modal-header {
        margin-bottom: -1px;
    }

    .panel-body {
        overflow: visible !important
    }

    .autosearch-div .custom-popup-wrapper {
        position: absolute;
        width: 600px !important;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-12">
        <div class="col-sm-10">
            <div class="modal-title custom-modal-title">
                <div class="event-name b-greensea" ng-module="item">
                    <span class="forpadd" uib-tooltip="{{ item.DoctorInvoiceIdentifier }}" tooltip-placement="bottom"> 
                        <span>{{item.DoctorName}}</span>&nbsp;|&nbsp;
                    <span>{{item.DoctorInvoiceIdentifier}}</span>&nbsp;|&nbsp;
                    <span>{{item.InvoiceDateTime | date : 'dd-MMM-yyyy'}}&nbsp;{{item.InvoiceDateTime | date : 'HH:mm' }}</span>
                    </span>
                </div>
            </div>
        </div>
        <div class="col-sm-2">
            <!-- <button id="btnCancelForm" type="button" class="draftbutton"
             ng-click="closeModal()" translate="common.closeaction.lbl"></button> -->
            <button type="button" class="btn btn-danger btn-sm pull-right" translate="x"
                ng-click="closeModal()"></button>
        </div>
    </div>
</div>
