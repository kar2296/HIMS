<link rel="stylesheet" href="app/css/drhms.css">
<div class="row">
    <div class="drhms-filters">
        <div class="col-sm-10">
            <h4 translate="doctorpayment-list.pagetitle.lbl"></h4>
        </div>
        <div class="col-sm-4">
            <autosearch itemid="item.DoctorId" iteminfo="" rowdata="" name="'doctorid'" config="vm.doctorcontrolconfig"
                itemchange="loadBills()" candisable="" isrequired="true">
            </autosearch>
        </div>
        <div class="col-sm-1">
            <button type="button" class="drhms-billing-btn drhms-add-btn" ng-click="addNew()"
                uib-tooltip="{{ 'doctorpayment-list.addnew_tooltip.lbl' | translate }}" tooltip-placement="bottom">
                <i class="fa fa-plus"></i>
            </button>
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
    <div class="drhms-table-top-header">
        <div class="drhms-table-head-border">
            <div class="col-sm-12">
                <label class="col-sm-4" for="facility" translate="doctorpayment-list.filter_facility.lbl"></label>
                <div class="col-sm-8">
                    <ui-select ng-model="currentfilter.FacilityId" ng-change="getList()" name="facility"
                        ng-disabled="item.isDisabled" required>
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="col-sm-12">
                <label class="col-sm-4" translate="doctorpayment-list.filter_paymentno.lbl"></label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" on-enter="getList()"
                        ng-model="currentfilter.DoctorPaymentNo" translate
                        translate-attr-placeholder="patientrequests.number.lbl">
                </div>
            </div>
        </div>
        <div class="drhms-table-head-border">
            <div class="col-sm-12">
                <label class="col-sm-4" for="usertype" translate="doctorpayment-list.filter_generatedby.lbl"></label>
                <div class="col-sm-8">
                    <autosearch itemid="currentfilter.GeneratedById" iteminfo="" rowdata=""
                        config="vm.usercontrolconfig" itemchange="getList()" onenter="getList()"></autosearch>
                </div>
            </div>
            <div class="col-sm-12">
                <label class="col-sm-4" for="doctor" translate="doctorpayment-list.filter_doctorname.lbl"></label>
                <div class="col-sm-8">
                    <autosearch itemid="currentfilter.DoctorId" iteminfo="" rowdata="" config="vm.doctorcontrolconfig"
                        itemchange="getList()" onenter="getList()"></autosearch>
                </div>
            </div>
        </div>
        <div class="drhms-table-head-border">
            <div class="col-sm-12">
                <label class="col-sm-5" translate="doctorpayment-list.filter_paymentdate.lbl"></label>
                <div class="col-sm-7">
                    <input type="text" class="form-control" name="invoicedate" ng-change="getList()"
                        datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}"
                        ng-click="appointmentdatePopup = { opened: true }" is-open="appointmentdatePopup.opened"
                        ng-model="currentfilter.PaymentDate">
                </div>
            </div>
            <div class="col-sm-12">
                <label class="col-sm-5" translate="patientrequests.status.lbl"></label>
                <div class="col-sm-7">
                    <ui-select ng-model="currentfilter.PaymentStatusId" ng-change="getList()" class="filter-combo">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 25 : 0}}
                            <span ng-if="$select.selected.Text.length>25">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.DoctorPaymentStatus | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
        </div>
    </div>
    </form>
</div>
<div class="fooder-bgs">
    <div class="row">
        <custom-table config="vm.gridConfig"></custom-table>
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage"></ul>
    </div>
</div>
