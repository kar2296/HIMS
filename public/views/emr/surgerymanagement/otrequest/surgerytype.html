<style>
    /* Css*/
    
    #fullregistrationheight .formRoot {
        height: 506px; }    
    #fullregistrationheight .well {
        min-height: 450px !important;}
    .border{margin:2px;}
    /* Css end*/
</style>
<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="surgerytype.pagetitle.lbl"></h4>
</div>
<div class="row" id="fullregistrationheight">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot">
                <div class="panel panel-default">
                    <div class="panel-body form-panel bg-footer">
                        <div class="col-sm-12">
                            <div class="col-sm-6 well">
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" translate="surgerytype.surgerycategory.lbl"></label>
                                    <div class="col-sm-8">
                                        <ui-select ng-model="item.WardId" ng-disabled="item.isRequested" ng-change="getRoomLookUp()" required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Ward | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" translate="surgerytype.suergery_subcategory.lbl"></label>
                                      <div class="col-sm-10">
                                      <div class="btn-term" data-toggle="buttons">
                                        <label class="btn btn-success border"><input type="radio">Cervical Cerclage</label>
                                        <label class="btn btn-success border"><input type="radio">Vulvectomy</label>
                                        <label class="btn btn-success border"><input type="radio">Oophorectomy</label>
                                        <label class="btn btn-success border"><input type="radio">Cystostomy</label>
                                        <label class="btn btn-success border"><input type="radio">Fasciotomy</label>
                                        <label class="btn btn-success border"><input type="radio">Escharotomy</label>
                                        <label class="btn btn-success border"><input type="radio">Phlebotomy</label>
                                        <label class="btn btn-success border"><input type="radio">Laparotomy</label>
                                        <label class="btn btn-success border"><input type="radio">Endarterectomy</label>
                                        <label class="btn btn-success border"><input type="radio">Synovectomy</label>
                                        <label class="btn btn-success border"><input type="radio">Colectomy</label>
                                        <a href="#"><button type="button" class="btn btn-default btn-sm btn-success"><i class="glyphicon glyphicon-plus"></i></button></a>
                                      </div>
                                      </div>
                                 </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="fooder-bgs">
                <div class="row ">
                    <div class="col-sm-12">
                        <div class="pull-left">
                            <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()"><i class="fa fa-angle-left" aria-hidden="true" ></i>&nbsp;&nbsp;<span class="btn-fontsize"  translate="common.backaction.lbl"></span></button>
                        </div>
                        <div class="pull-right">
                            <button id="btnSave" type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
                            <button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                            <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                            <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
