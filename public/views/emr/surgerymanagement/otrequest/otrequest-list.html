<style>
    .pl-3 {
        padding-left: 3%;
    }

    .icon_home {
        width: 5%;
        float: right;
    }

    @media only screen and (max-width:414px) {
        #patientsearchheight .ui-grid-viewport {
            height: 346px !important;
            min-height: 377px;

        }
        .top-option {
            font-size: 13px;
        }
        .opt-selected {
            font-size: 13px;
        }
        .icon_bed {
            width: 6%;
        }
        .icon_home {
            width: 6%;
        }
    }

        #patientsearchheight .ui-grid-viewport {

<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="otrequest-list.pagetitle.lbl"></h4>
    <div class="col-sm-6">
        <span ng-click="doctor_dashboard()" ng-if="userid == 2">
            <img src="app/img/download.png" class="img-responsive icon_home" alt="home" uib-tooltip=" Doctor Dashboard " tooltip-placement="bottom">
        </span>
        <button class="btn bt-color3 btn-xs pull-right btn-filter" ng-click="openAdvancedFilter()" uib-tooltip="{{'clinicalmaster.serviceitem-list.filter-tooltip.lbl' | translate }}"
            tooltip-placement="bottom">
            <i class="fas fa-search" aria-hidden="true"></i>&nbsp;&nbsp;
                    <span translate="clinicalmaster.serviceitem-list.filter.lbl"></span>
           </button>

 }}" tooltip-placement="bottom"><i class="fa fa-filter" aria-hidden="true"></i>&nbsp;&nbsp;<span translate="clinicalmaster.serviceitem-list.filter.lbl"></span></button>!-->
        <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addNew()" uib-tooltip="{{'otrequest-list.addnew-tooltip.lbl' | translate }}"
            tooltip-placement="bottom">
            <i class="fa fa-plus" aria-hidden="true"></i>
            <span translate="clinicalmaster.serviceitem-list.addnew.lbl"></span>
        </button>
    </div>
</div>

        <div class="col-sm-3" ng-if="context=='main'">

                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
