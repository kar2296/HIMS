<link href="app/css/emr.css" rel="stylesheet">
<style>
    .col-sm-12.tab-content-div {
        border: 1px solid gainsboro;
        padding-left: 0px;
        margin-top: 7px;
    }

    .nav-tabs>li {
        float: left;
        margin-bottom: 5px;
        margin-right: 4px;
        z-index: 999999;
        background: #e0dada;
        height: 29px;
        border-radius: 3px;
    }

    #notestabs .nav-tabs>li a span {
        font-weight: 500;
        font-size: 13px;
        padding: 0;
        position: relative;
        bottom: 3px;
    }

    #notestabs .nav-tabs>li.active:after {
        bottom: -17px !important;
    }

    li.uib-tab a {
        border: unset !IMPORTANT;
    }

    .btn-group.col-sm-12 {
        margin-bottom: 7px;
    }
</style>

<div class="col-md-12">
    <div class="col-sm-4 form-group">
        <label class="col-sm-5 control-label" translate="patientemr.consultation.profile.lbl"></label>
        <div class="col-sm-21">
            <ui-select ng-disabled="consultationloaded" ng-model="profileinfo.profileid"
                ng-change="profilePrefChanged($select.selected)">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.Profile | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="col-sm-4" style="margin-top: 34px;">
        <button class="draftbutton" type="button" ng-disabled="consultationloaded"
            ng-click="saveItem()">Save</button>
        <button class="btn btn-danger" type="button" ng-disabled="!consultationloaded"
            ng-click="deleteItem()">Delete</button>
    </div>
    <div class="col-sm-4">
    </div>
</div>
