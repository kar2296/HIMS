                        <td>
                            <label class="control-label" for="storemaster"
                                translate="patientreturn.tostore.lbl"></label>
                        </td>
                        <td>
                            <ui-select ng-model="item.StoreMasterId" name="storemaster"
                                ng-disabled="item.CanDisableHeader">
                                <ui-select-match>
                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                </ui-select-match>
                                <ui-select-choices
                                    repeat="lookupitem.Id as lookupitem in lookup.UserStores | filter: { Text: $select.search }">
                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                </ui-select-choices>
                            </ui-select>
                        </td>
                        <td>
                            <label class="control-label" for="returnnumber"
                                translate="billing.patientdispense-form.returnnumber.lbl"></label>
                        </td>
                        <td>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" name="returnnumber"
                                    ng-model="item.DispenseReturnNumber" placeholder="Return Number" id="disabledInput"
                                    disabled>
                            </div>
                            <div class="col-sm-1">
                                <button class="infosummary" ng-click="patientreturndetails()">

                                    tooltip-placement="bottom">
                                    <i class="icon-info-sign" aria-hidden="true"></i>

                            </div>
                        </td>
                    </tr>
                </table>

                <div class=" table-control  bg-pattern">
                    <div class="table-height formRoot" id="mainresponsivetablecontrol">
                        <table class="table table-hover table-responsive table-bordered">
                            <thead class="bg-subhead">
                                <tr>
                                    <th class="fs-12 col-sm-1">
                                        <span translate="inventory.stocktransfer.sno.lbl"></span>
                                    </th>
                                    <th class="fs-12 col-sm-3">
                                        <span translate="patientreturn.itemname.lbl"></span>
                                    </th>
                                    <th class="fs-12 col-sm-1">
                                        <span translate="patientreturn.billedqty.lbl"></span>
                                    </th>
                                    <th class="fs-12 col-sm-1">
                                        <span translate="patientreturn.returnedqty.lbl"></span>
                                    </th>
                                    <th class="fs-12 col-sm-1">
                                        <span translate="patientreturn.returnqty.lbl"></span>
                                    </th>
                                    <th class="fs-12 col-sm-1">
                                        <span translate="patientreturn.price.lbl"></span>
                                    </th>
                                    <th class="fs-12 col-sm-1">
                                        <span translate="patientreturn.amount.lbl"></span>
                                    </th>
                                    <th class="fs-12 col-sm-2">
                                        <span translate="patientreturn.action.lbl"></span>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="patientreturn in PatientStockReturnDetails | filter:{Status:1}">
                                    <td class="fs-12 col-sm-1">
                                        <span> {{ patientreturn.SNo }}</span>
                                    </td>
                                    <td class="fs-12 col-sm-3">
                                        <span> {{ patientreturn.ItemName }}</span>
                                    </td>
                                    <td class="fs-12 col-sm-1">
                                        <span> {{ patientreturn.BilledQuantity }}</span>
                                    </td>
                                    <td class="fs-12 col-sm-1">
                                        <span> {{ patientreturn.ReturnedQuantity }}</span>
                                    </td>
                                    <td class="fs-12 col-sm-1">
                                        <input type="number" min="0" class="form-control"
                                            ng-model="patientreturn.ReturnQuantity" name="returnquantity"
                                            ng-disabled="patientreturn.CanDisableDetails"
                                            ng-change="computeAmount(patientreturn)" tabindex="patientreturn.tabindex"
                                            placeholder="" ng-pattern="/^\d+$/" ng-keypress="numberonly($event)">
                                    </td>
                                    <td class="fs-12 col-sm-1">
                                        <span>{{ patientreturn.Mrp | displaycurrency }}</span>
                                    </td>
                                    <td class="fs-12 col-sm-1">
                                        <span>{{ patientreturn.NetAmount | displaycurrency }}</span>
                                    </td>
                                    <td class="text-center">
                                        <button type="button" class="btn btn-info texthover btn-xs ng-scope"
                                            tabindex="-1" uib-tooltip="History" tooltip-placement="top"
                                            ng-click="History(patientreturn, $index)">
                                            <i class="fa fa-history fa-xs" aria-hidden="true"></i>
                                        </button>
                                        <button type="button" class="text-white btn dem-color4 btn-xs " tabindex="-1"
                                            uib-tooltip="Stock" tooltip-placement="top"
                                            ng-click="Stock(patientreturn,$index)">
                                            <i class="fa fa-database fa-xs" aria-hidden="true"></i>
                                        </button>
                                        <button type="button" class="btn btn-danger btn-xs" tabindex="-1"
                                            uib-tooltip="Delete" tooltip-placement="top"
                                            ng-click="deletePatientReturnDetail(patientreturn,$index)"
                                            ng-disabled="item.IsDisabled">
                                            <i class="fa fa-trash" aria-hidden="true"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class=" col-sm-12 footerbar stock_transfercont" style="padding: 0px">
                    <div class="col-sm-12">
                        <div class="col-sm-4 pull-left">
                            <label class="col-sm-4 control-label" tabindex="-1" for="comments"
                                translate="inventory.stockadjustments.comments.lbl"></label>
                            <div class="col-sm-8">
                                <input type="text" tabindex="-1" class="form-control field-height inputheightctrl"
                                    name="comments" ng-model="item.Comments" ng-disabled="item.IsDisabled"
                                    placeholder="Comments">
                            </div>
                        </div>
                        <div class="col-sm-4 pull-right">
                            <span class="col-sm-4 control-label" tabindex="-1" for="total"
                                translate="inventory.stocktransfer.total.lbl"></span>
                            <div class="col-sm-8">
                                <input type="text" tabindex="-1" value="{{(item.TotalNetAmount | displaycurrency)}}"
                                    class="inputbox form-control" disabled>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-12 fooder-bgs">
                    <div class="pull-left">
                        <button type="button" class="btn pyr-color10 btn-sm" tabindex="-1" ng-click="backToList()">
                            <i class="fa fa-angle-left" aria-hidden="true"></i>
                            <span class="btn-fontsize"> &nbsp; Back</span>
                        </button>
                        <button type="button" class="draftbutton" tabindex="-1"
                            uib-tooltip="Attachments" tooltip-placement="top" ng-click="openAttachments()">
                            <i class="fa fa-paperclip fa-xs" aria-hidden="true">&nbsp;&nbsp;(0)</i>
                        </button>
                        <button type="button" class="btn btn-info texthover btn-sm ng-scope" tabindex="-1"
                            uib-tooltip="History" ng-show="canShowHistoryBtn" tooltip-placement="top"
                            ng-click="history()">
                            <i class="fa fa-history fa-xs" aria-hidden="true"></i>
                        </button>
                        <button type="button" id="btnCancelForm" class="btn btn-warning btn-sm"
                            ng-show="canShowCancelBtn" translate="common.cancelaction.lbl"
                            ng-click="CancelReturn()"></button>
                    </div>
                    <div class="pull-right">
                        <button type="button" tabindex="-1" id="btnprint"  class="draftbutton"
                            ng-show="canShowPrintBtn" translate="common.printaction.lbl" ng-click="print()"></button>
                        <button type="button" tabindex="-1" id="btndmprint" class="draftbutton"
                            ng-show="canShowPrintBtn" ng-click="dmPrint()">DM Print</button>
                        <button type="button" id="btnDispense" class="draftbutton"
                            ng-show="canShowReturnBtn" translate="common.return-action.lbl"
                            ng-click="Return()"></button>
                        <button type="button" id="btnClearForm" class="btn btn-warning btn-sm" ng-show="canShowClearBtn"
                            translate="common.clearaction.lbl" ng-click="Clear()"></button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
