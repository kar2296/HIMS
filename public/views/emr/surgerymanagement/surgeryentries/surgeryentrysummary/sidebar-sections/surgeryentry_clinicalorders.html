<div class="col-sm-12">
    <div class="col-sm-10">
        <h3 class="title" style="color: black !important;" translate="patientemr.patientorder-list.pagetitle.lbl"></h3>
    </div>
    <div class="col-sm-2">
        <span class="drhms-billing-btn drhms-outstandingbill-btn" ng-click="surgerydashboard()"
            uib-tooltip="{{'surgeryschedule-list.pagetitle1.lbl' | translate}}" tooltip-placement="bottom">
            <i class="fas fa-th-large" aria-hidden="true"></i>
        </span>

        <!-- <img class="imgsrc" src="app/img/main/speedometer.png" ng-click="surgerydashboard()"
            uib-tooltip="{{'surgeryschedule-list.pagetitle1.lbl' | translate}}" tooltip-placement="bottom"
            style="width: 35px;"> -->
    </div>
</div>
<div class="col-sm-12">
    <ippatientbanner patientid="item.PatientId"></ippatientbanner>
</div>
<div class="col-sm-12" style="margin-top: 10px;">
    <button type="button" class="btn-add" uib-tooltip="Add New Orders" tooltip-placement="bottom"
            ng-click="addNew()"> <i class="fa fa-plus"></i></button>
    <!-- <div class="col-sm-2" style="float: right;">
        <a class="pull-right" ng-click="addNew()" href="">Add New Orders</a>
    </div> -->
</div>
<div class="col-sm-12">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-12">
            <div class="col-sm-4 ip_label_width">
                <div class="form-group">
                    <label for="sel1">Select Template</label>
                    <div class="col-sm-12" style="width: 100%;">
                        <panelcontrol config="panelconfig" saveclick="savePanels()" changeev="savePanels()">
                        </panelcontrol>
                    </div>
                </div>
            </div>
            <div class="col-sm-4 ip_label_width" ng-hide="IsDisabled">
                <div class="form-group">
                    <label class="col-sm-12 col-md-12 control-label filter-lbl ip_label_hide"
                        translate="Test Name"></label>
                    <div class="col-sm-12" id="tablesearch">
                        <autosearch itemid="item.TestId" name="'test'" controlid="'testid'" iteminfo="item.SelectedItem"
                            rowdata="item" config="vm.testcontrolconfig" itemchange="testChanged($index,item)"
                            class="inputsearchlogo" candisable="IsDisabled" isrequired="true" tabindex="item.tabindex"
                            placeholder="'Tests'"></autosearch>
                    </div>
                </div>
            </div>
            <div class="col-sm-4 ip_label_width" ng-hide="IsDisabled">
                <div class="form-group">
                    <label class="col-sm-12 col-md-12 control-label filter-lbl ip_label_hide" translate="Qty"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" ng-model="item.Quantity" ng-disabled="IsDisabled"
                            tabindex="-1">
                    </div>
                </div>
            </div>
            <div class="col-sm-4 ip_label_width" ng-hide="IsDisabled">
                <div class="form-group">
                    <label class="col-sm-12 col-md-12 control-label filter-lbl ip_label_hide"
                        translate="Priority"></label>
                    <div class="col-sm-12">
                        <ui-select ng-model="item.OrderPriorityId" ng-disabled="IsDisabled" tabindex="-1"
                            on-select="OnPrioritySelected($select.selected)">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.OrderPriority | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>
            </div>
            <div class="col-sm-4 ip_label_width" ng-hide="IsDisabled"></div>
            <div class="col-sm-4 ip_label_width" ng-hide="IsDisabled">
                <div class="form-group">
                    <label class="col-sm-12 col-md-12 control-label filter-lbl ip_label_hide"></label>
                    <div class="col-sm-12">
                        <button class="btn btn-success btn-sm ng-scope" type="button" id="hello"
                            ng-click="addOrder()">Add
                            Investigation</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-12" id="orderlisttb">
            <table border="1" style="border: solid 1px black">
                <thead>
                    <tr>
                        <td>S.NO</td>
                        <td><span translate="patientemr.patientorder-form.test.lbl" for="test"></span></td>
                        <td>Type </td>
                        <td>Qty</td>
                        <td>Priority</td>
                        <td>Instructions </td>
                        <td ng-hide="IsDisabled">Action </td>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="item in details | filter:{Status:1}">
                        <td>{{$index+1}}</td>
                        <td>{{item.TestName}}</td>
                        <td>{{item.TestType}} </td>
                        <td>{{item.Quantity}}</td>
                        <td>{{item.OrderPriority}}</td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.TestInstruction"
                                ng-disabled="IsDisabled" placeholder="" tabindex="-1">
                        </td>
                        <td ng-hide="IsDisabled">
                            <button class="drhms-edit-button" ng-click="getOrderDetailById(item)"
                                ng-hide="currentcontext.orderid>0||IsDisabled">
                                <img src="assets/svg/edit.svg" alt="">
                            </button>
                            <button class="drhms-edit-button" style="margin-right: 19% !important;"
                                ng-click="deleteorderdetails($index,item)" ng-hide="IsDisabled">
                                <img src="assets/svg/delete.svg" alt="">
                            </button>

                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="fooder-bgs">
            <div class="col-sm-12 col-md-12 col-lg-12">
                <div class="row ">
                    <div class="col-sm-6 text-left">
                        <button id="btnCancelForm" tabindex="-1" type="button" class="draftbutton"
                            ng-show="CanShowCancelOrder" ng-click="saveCancelled()"
                            translate="patientemr.patientorder-form.cancelorder.lbl"></button>
                    </div>
                    <div class="col-sm-6 text-right">
                        <button type="button" id="btnsubmit"  class="draftbutton" ng-click="print()"
                            ng-show="canShowPrint">
                            <span><i class="fa fa-print" aria-hidden="true"></i></span>
                            <span translate="Print"></span>
                        </button>
                        <button type="button" class="draftbutton"
                            translate="patientemr.patientorder-form.orderaction.lbl"
                            ng-if="IsDisabled||currentcontext.encounter.EncounterStatusId!=2" ng-show="CanShowOrder"
                            ng-click="createOrder()"></button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
<div ng-show="canShowTickSheetArea()">
    <ticksheetcontrol config="ticksheetconfig" addclick="addTickSheet()" saveclick="saveTickSheets()">
    </ticksheetcontrol>
</div>
