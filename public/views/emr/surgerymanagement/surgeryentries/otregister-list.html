<table id="bannerdetails">
    <tr>
        <td translate="otregister-list.date.lbl"></td>
        <td>  <input type="text"  class="form-control" name="registereddate" ng-change="getList()" datepicker-options="datePickerOptions"
            show-button-bar="{{datePickerOptions.showButtonBar}}" uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
            placeholder="{{datePickerOptions.placeholder}}" ng-click="registereddatePopup = { opened: true }" is-open="registereddatePopup.opened"
            ng-model="currentfilter.otregisteredon"></td>
        <td translate="otregister-list.filter_surgeon.lbl"></td>
        <td> <ui-select ng-model="currentfilter.ChiefSurgeonId" ng-change="getList()">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Doctor | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select></td>
      <td translate="otregister-list.otrooms.lbl"></td>
        <td> <ui-select ng-model="currentfilter.ChiefSurgeonId" ng-change="getList()">
            <ui-select-match>
                {{$select.selected.Text | limitTo : 20 : 0}}
                <span ng-if="$select.selected.Text.length>20">...</span>
            </ui-select-match>
            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Doctor | filter: { Text: $select.search }">
                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
            </ui-select-choices>
        </ui-select></td>
        <td translate="otregister-list.filter_status.lbl"></td>
        <td> <multiselectchk list="lookup.OTRegisterStatus" selected="currentfilter.OTRegisterStatusId" change="getList()"></multiselectchk>
           </td>
        
    </tr>
</table>
