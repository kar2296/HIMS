<style>
    .durationtxt {
        width: 50px !important;
        float: left;
        margin-right: 5px;
    }

    .popup_tracker_scroll {
        overflow: hidden !important;
    }

    .followupdropdown ul {
        max-height: 90px !important;
    }
    .btn-success, button.btn-success:hover{
        color:#fff !important;
    }
</style>

<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot">
                <div class="panel-body form-panel popup_tracker_scroll">
                    <div class="col-sm-12">

                        <!-- leftpanel -->
                        <div class="col-sm-12">
                            <div class="form-group">
                                <label class="col-sm-4 control-label" for="assignto" translate="registration.patienttracker.assignto.lbl"></label>
                                <div class="col-sm-8">
                                    <radiogroupcontrol itemid="item.AssignTo" items="vm.AssignToOptions"></radiogroupcontrol>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-4 control-label" translate="ClinicalStatus"></label>
                                <div class="col-sm-8">
                                    <radiogroupcontrol itemid="item.ClinicalStatusId" items="lookup.ReferrerClinicalStatus"></radiogroupcontrol>
                                </div>
                            </div>
                            <div class="form-group" ng-show="canShowFacility()">
                                <label class="col-sm-4 control-label" for="facility" translate="registration.patienttracker.facility.lbl"></label>
                                <div class="col-sm-8">
                                    <ui-select ng-model="item.FacilityId" name="facility">
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                        </ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                            </div>
                            <div class="form-group" ng-show="canShowGroup()">
                                <label class="col-sm-4 control-label" for="group" translate="registration.patienttracker.group.lbl"></label>
                                <div class="col-sm-8">
                                    <ui-select ng-model="item.AssignedGroupId" name="group" ng-change="onGroupChange($select.selected)">
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                        </ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Group | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                            </div>
                            <div class="form-group" ng-show="canShowUser()">
                                <label class="col-sm-4 control-label" for="user" translate="registration.patienttracker.user.lbl"></label>
                                <div class="col-sm-8">
                                    <ui-select ng-model="item.AssignedUserId" name="user" ng-change="onUserChange($select.selected)">
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                        </ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.User | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                            </div>
                            <div class="form-group" ng-show="canShowRoom()">
                                <label class="col-sm-4 control-label" for="room" translate="registration.patienttracker.room.lbl"></label>
                                <div class="col-sm-8">
                                    <ui-select ng-model="item.AssignedRoomId" name="room" ng-change="onRoomChange($select.selected)">
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                        </ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Room | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-4 control-label" for="notes" translate="registration.patienttracker.notes.lbl"></label>
                                <div class="col-sm-8">
                                    <textarea class="form-control" ng-model="item.TrackerNotes"></textarea>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-4 control-label" for="duration" translate="registration.patienttracker.followupappointments.lbl"></label>
                                <div class="col-sm-2" style="margin-right: -77px;">
                                    <input type="text" class="form-control durationtxt" ng-model="item.Duration" placeholder="">
                                </div>
                                <div class="col-sm-6 followupdropdown">
                                    <ui-select ng-model="item.DurationPeriodId" class="ui-select-period" ng-change="onDurationPeriodChange($select.selected)">
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                        </ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.DurationPeriod | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                            </div>
                            <!-- <div class="form-group">
                                <!-- alignment 26.9.2017 --
                            <div class="col-sm-4"></div>
                            <div class="col-sm-8 followupdropdown">

                                <ui-select ng-model="item.DurationPeriodId" class="ui-select-period" ng-change="onDurationPeriodChange($select.selected)">
                                    <ui-select-match>
                                        {{$select.selected.Text | limitTo : 20 : 0}}
                                        <span ng-if="$select.selected.Text.length>20">...</span>
                                    </ui-select-match>
                                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.DurationPeriod | filter: { Text: $select.search }">
                                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                    </ui-select-choices>
                                </ui-select>
                            </div>
                        </div> -->
                            <div class="form-group">
                                <label class="col-sm-4 control-label" for="comments" translate="registration.patienttracker.comments.lbl"></label>
                                <div class="col-sm-8">
                                    <commentscontrol comments="item.TrackerComments"></commentscontrol>
                                </div>
                            </div>
                            <div class="form-group" ng-show="canShowReviewNotes()">
                                <label class="col-sm-4 control-label" for="includereviewnotes" translate="registration.patienttracker.includereviewnotes.lbl"></label>
                                <div class="col-sm-8">
                                    <input type="checkbox" name="includereviewnotes" class="custom-checkbox" ng-model="item.IncludeReviewNotes">
                                </div>
                            </div>
                        </div>

                        <!-- rightpanel -->
                        <!--<div class="col-sm-3">
                            </div>-->

                    </div>
                </div>
            </div>
    </div>
</div>
<div class="panel-footer formactionbar">
    <div class="col-sm-2 pull-left">
        <button type="button" class="btn pyr-color10 btn-sm" tabindex="-1" ng-click="backToList()">
            <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
            <span class="btn-fontsize" translate="common.backaction.lbl"></span>
        </button>
    </div>
    <div class="pull-right">
        <button type="button" ng-click="Save()" class="draftbutton" translate="common.saveaction.lbl"></button>
        <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
    </div>
</div>
</form>
</div>
</div>
