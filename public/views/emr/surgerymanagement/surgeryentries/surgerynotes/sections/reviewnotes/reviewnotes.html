<script type="text/ng-template" id="cn-question-section.html">
    <div ng-if="sectionData[item.sectionid].cat.length>0"class="row" class="rev_items">
        <div class="col-sm-12">
            <h4 class="control-label section-lable">{{sectionData[item.sectionid].sectionName}}</h4>
        </div>
        <div ng-repeat="category in  sectionData[item.sectionid].cat" style="height:100%">
            <div class="row">
                <div class="col-sm-12 pd0">
                    <h4 class="custom-modal-headerz cn_mainhead casesheets_emr cn_mainhead mg0">{{category.CategoryName}}</h4>
                </div>
            </div>
            <div class="row" ng-repeat="concept in category.concepts">
                <div ng-if="concept.Result && concept.Result.length > 0" >
                    <div class="concept-lable" ng-if="concept.ValueTypeId !=3" ng-show="concept.Result">
                        <span class="col-sm-4 lefcol1">{{concept.ConceptName}}</span>
                        <span class="col-sm-8 lefcol2"style="word-wrap: break-word;">{{concept.Result}}</span>
                    </div>

                    <div class="concept-lable" ng-if="concept.ValueTypeId ==3 && concept.IsMultiple == false" ng-show="concept.Result">
                        <span class="col-sm-4 lefcol1">{{concept.ConceptName}}</span>
                        <span class="col-sm-8 lefcol2">{{concept.Result}}</span>
                    </div>
                </div>
                <div ng-show="concept.Terms && concept.Terms.length > 0">
                    <div class="concept-lable" ng-if="concept.ValueTypeId ==3 && concept.IsMultiple == true" ng-show="concept.Terms && concept.Terms.length > 0">
                        <div class="col-sm-4 lefcol1">{{concept.ConceptName}}</div>
                        <div class="col-sm-8 lefcol2">
                            <span ng-repeat="term in concept.Terms">
                                {{term.TermName}}
                                <span ng-if="$index != concept.Terms.length-1">,</span>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</script>
<script type="text/ng-template" id="cn-followup-section.html">
    <div  ng-if="sectionData.followup.length > 0" class="row">
        <div class="col-sm-12" style="">
            <div class="form-group">
                <div class="col-sm-12 form-group">
                    <h4 class="control-label mar_z" translate="FollowUp/Referral"></h4>
                </div>
            </div>
        </div>
    </div>
    <div  ng-if="sectionData.followup.length > 0" class="row" ng-repeat="item in sectionData.followup">
        <div class="col-sm-12" ng-hide="item.TrackerStatusId==3">
                <span style="color: maroon;font-size: 15px;" class="col-sm-3">Refer To</span>
                <span style="color:blue;" class="col-sm-3">{{item.AttendUser.Title.Description}} {{item.AttendUser.FirstName}} {{item.AttendUserLastName}}</span>
        </div>
        <div class="col-sm-12">
                <span style="color: maroon;font-size: 15px;" class="col-sm-3">Clinical Status</span>
                <span style="color:blue;" class="col-sm-3">{{item.ReferrerClinicalStatus.Description}}</span>
        </div>
        <div class="col-sm-12">
                <span style="color: maroon;font-size: 15px;" class="col-sm-3">Followup On</span>
                <span style="color:blue;margin-left: -6px;font-size: 14px;font-weight: 500" class="col-sm-3"><ngformatdate date-val='item.FollowupAppointmentOn'></ngformatdate>
                </span>
        </div>
        <div class="col-sm-12">
            <span style="color: maroon;font-size: 15px;" class="col-sm-3">Comments</span>
            <span style="color:blue;margin-left: -6px;font-size: 14px;font-weight: 500" class="col-sm-3">{{item.TrackerComments}}</span>
    </div>
    </div>
</script>
<script type="text/ng-template" id="cn-labresult-section.html">
    <div  ng-if="sectionData.labresult.length > 0" class="row">
        <div class="col-sm-12" style="">
            <div class="form-group">
                <div class="col-sm-12 form-group">
                    <h4 class="control-label mar_z" translate="Lab Result"></h4>
                </div>
            </div>
        </div>
    </div>
    <div ng-if="sectionData.labresult.length > 0" class="row">
        <div ng-repeat="order in sectionData.labresult">
            <div id='workorder' ng-repeat="wo in order.PatientWorkorders">
                <table class="table table-hover table-responsive table-bordered">
                    <tbody ng-repeat="test in wo.woDetails">
                        <tr ng-if="test.RootProfileName">
                            <td colspan="9">
                                <span class="lbl-profile">{{test.RootProfileName}}</span>
                            </td>
                        </tr>
                        <tr ng-if="test.ProfileName">
                            <td colspan="9">
                                <span class="lbl-profile">{{test.ProfileName}}</span>
                            </td>
                        </tr>
                        <tr ng-hide="test.details.length == 1 && test.Testname.toLowerCase() == test.details[0].Analytename.toLowerCase()">
                            <td colspan="9"><span class=" btn btn-primary btn-xs"> {{test.Testname}}</span>
                            </td>
                        </tr>
                        <tr ng-repeat="item in test.details | filter:{Status:1}">
                            <td class="col-sm-3">
                                <span style="margin-left:24px;  vertical-align: super; color: #0dbef1; font-weight: 700; white-space: nowrap; text-overflow: ellipsis; overflow: auto;">{{item.Analytename}}</span>
                            </td>
                            <td class="col-sm-3" colspan="{{item.TestValueType == 3 ? '3' : '1'}}">
                                <span> {{item.Resultvalue}} </span>
                            </td>
                            <td class="col-sm-3" ng-if="item.TestValueType != 3">
                                <span ng-model="item.AnalyteUOM">{{item.AnalyteUOM}}</span>
                            </td>
                            <td class="col-sm-3" ng-if="item.TestValueType != 3">
                                <span class="pull-left">{{item.Analyterange}}</span>
                                <span class="pull-right" style="color: #ff902b; font-weight: 700;">{{item.Qualifier}}</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</script>
