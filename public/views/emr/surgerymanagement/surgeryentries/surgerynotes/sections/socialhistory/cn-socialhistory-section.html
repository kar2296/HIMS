<div class="tabsizetopcontroller">
    <div class="row page-header">
        <div class="col-sm-12">
            <div class="col-sm-6 col-md-9">
                <h4 class="page-header mt0" translate="patientemr.patientsocialhistory-list.pagetitle.lbl"></h4>
            </div>
            <div class="col-sm-6 col-md-3">


                <button class="btn bt-color3 btn-xs pull-right"
                    uib-tooltip="{{ 'clinicalmaster.serviceitem-list.filter-tooltip.lbl' | translate }}"
                    tooltip-placement="bottom">
                    <i class="fa fa-filter fa-xs " aria-hidden="true"></i>&nbsp;&nbsp;
                    <span translate="clinicalmaster.serviceitem-list.filter.lbl"></span>
                </button>

                <button class="btn-add" ng-click="addNew()"
                    uib-tooltip="{{ 'patientemr.patientsocialhistory-list.pagetitle.lbl' | translate }}"
                    tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i>

                </button>

            </div>
        </div>
    </div>

    <div class="container-fluid">
        <favoritecontrol config="favconfig" addclick="addFavorite()" saveclick="saveFavorites()"></favoritecontrol>
        <div class="fooder-bgs">
            <div class="row">
                <custom-table config="vm.gridConfig"></custom-table>
                <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
                    items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                    ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
            </div>
            <div class="pull-left">
                <button type="button" class="btn pyr-color10 btn-sm" tabindex="-1" ng-click="backToList()">
                    <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                    <span class="btn-fontsize" translate="common.backaction.lbl"></span>
                </button>
            </div>
        </div>
