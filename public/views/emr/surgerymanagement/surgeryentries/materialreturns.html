<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="Medicine Returns"></h4>
    <div class="col-sm-6">
        <button class="btn-add" ng-click="addNew()" uib-tooltip="{{ 'Medicine Returns' | translate }}"
            tooltip-placement="bottom">
            <i class="fa fa-plus" aria-hidden="true"></i>
        </button>
    </div>
</div>
<div class="row">
    <div class="col-sm-12">
        <table id="bannerdetails">
            <tbody ng-hide="context=='emr'">
                <tr>
                    <td>
                        <label class="control-label" for="mystore"
                            translate="billing.patientreturns.mystore.lbl"></label>
                    </td>
                    <td>
                        <ui-select ng-model="currentfilter.StoreMasterId" ng-change="getList()" name="mystore" required>
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.UserStores | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </td>
                    <td>
                        <label class="control-label" for="dispensereturnnumber"
                            translate="billing.patientreturns.dispensereturnnumber.lbl"></label>
                    </td>
                    <td>
                        <input type="text" class="form-control" on-enter="getList()"
                            ng-model="currentfilter.DispenseReturnNumber" translate
                            translate-attr-placeholder="billing.patientreturns.dispensereturnnumber.lbl">
                    </td>
                    <td>
                        <label class="control-label" for="dispensereturndatetime"
                            translate="billing.patientreturns.dispensereturndatetime.lbl"></label>
                    </td>
                    <td>
                        <input type="text" class="form-control" name="dispensereturndatetime" ng-change="getList()"
                            ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                            placeholder="{{datePickerOptions.placeholder}}"
                            ng-click="dispensereturndatetimePopup = { opened: true }"
                            is-open="dispensereturndatetimePopup.opened"
                            ng-model="currentfilter.DispenseReturnDateTime">
                    </td>
                    <td>
                        <label class="control-label" for="dispensereturnstatus"
                            translate="billing.patientreturns.dispensereturnstatus.lbl"></label>
                    </td>
                    <td>
                        <multiselectchk list="lookup.DispenseReturnStatus"
                            selected="currentfilter.DispenseReturnStatusId" change="getList()"></multiselectchk>
                    </td>



                </tr>
            </tbody>
        </table>
    </div>
</div>
