<style>
    /* Style the tab */

    .tab {
        overflow: hidden;
        border: 1px solid #ccc;
        margin-top: 10px;
        /* background-color: #00125a !important; */
    }

    /* Style the buttons inside the tab */

    .tab button {
        background-color: inherit;
        float: left;
        border: none;
        outline: none;
        cursor: pointer;
        padding: 7px 16px;
        transition: 0.3s;
        font-size: 17px;
        background: transparent;
        /* color: #000000 !important; */
        width: 100%;
        text-align: left;
    }

    /* Create an active/current tablink class */

    .tab button.active {
        background-color: transparent;
    }

    /* Style the tab content */

    .tabcontent {
        display: none;
        padding: 6px 12px;
        border: 1px solid #ccc;
        border-top: none;
        margin-bottom: 20px;
    }

    /* Style the close button */

    .topright {
        float: right;
        cursor: pointer;
        font-size: 28px;
    }

    .tablinks:after {
        content: "\f077";
        float: right;
        font-family: 'Font Awesome 5 Free';
    }

    .tablinks.active:after {
        transform: rotate(180deg);
    }

    .topright {
        height: 17px;
        width: 15px;
        position: relative;
        bottom: 39px;
        right: 20px;
        font-size: 1px;
    }

    .form-horizontal .form-group {
        height: 62px;
    }

    div#srugery,
    div#procedure1 {
        display: block !important;
    }

    .form-group.cmt {
        height: 100px;
    }

    .tab {
        overflow: hidden;
        border: 1px solid #ccc;
        margin-top: 10px;
        color: #00125a;
        font-weight: 600;
    }


    autosearch.logo .custom-popup-wrapper {
        margin-left: -250px;
    }

    autosearch .custom-popup-wrapper {
        margin-left: 0;
    }

    /* .topright:hover {color: red;} */
</style>

                <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;

            </button>
        </div>
        <div class="pull-right">
            <button type="button" class="draftbutton" ng-click="print()" ng-show="CanShowPrint">
                <span>
                    <i class="fa fa-print" aria-hidden="true"></i>
                </span>
                <span translate="Print"></span>
            </button>
            <button id="btnSave" type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"
                ng-show="CanShowSave"></button>
            <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                ng-click="saveAndApprove()" ng-show="CanShowApprove"></button>
            <button type="button" class="draftbutton" ng-show="CanShowAuthorize" translate="Authorize"
                ng-click="Completed()"></button>
            <button id="btnCancelForm" type="button" class="draftbutton" ng-disabled="item.SurgeryEntryStatusId == 3"
                ng-click="OTCancel()" ng-show="CanShowCancel" translate="common.cancelaction.lbl"></button>
        </div>
    </div>
</div>
<script>
    function openprocedure(evt, surgerytab) {
        var i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("tabcontent");
        for (i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = "none";
        }
        tablinks = document.getElementsByClassName("tablinks");
        for (i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(" active", "");
        }
        document.getElementById(surgerytab).style.display = "block";
        evt.currentTarget.className += " active";
    }
</script>
