<style>
    input#pid {
        width: 250px;
    }
</style>
<div class="row page-header">
    <div class="col-sm-4">
        <h4 class="mt0" translate="surgeryroommaster.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-8">
        <div class="filters">
            <div class="search">
                <input type="text" id="pid" class="form-control ng-pristine ng-valid ng-empty ng-touched"
                    on-enter="getList()" ng-model="currentfilter.CodeName" placeholder="Code/Name"
                    name="currentfilter.CodeName"> <i class="fas fa-search" aria-hidden="true"></i>
            </div>
            <button class="btn-add" ng-click="addNew()" uib-tooltip="Add Room" tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-4">
            <label class="col-sm-4" translate="Type"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.SurgeryRoomTypeId" ng-disabled="item.isAdmitted"
                    ng-change="getList()">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length > 20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.SurgeryRoomType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-4" translate="Status"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.ActiveStatusId" ng-disabled="item.isAdmitted" ng-change="getList()">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length > 20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </form>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
