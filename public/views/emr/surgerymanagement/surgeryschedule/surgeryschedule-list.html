<link rel="stylesheet" href="app/css/drhms.css">
<style>
    .form-group {
    height: 72px;
}
</style>
<div class="row">
    <div class="drhms-filters">
        <div class="col-sm-10">
            <h4 translate="otschedule-list.pagetitle.lbl"></h4>
        </div>
        <div class="col-sm-4">
            <input type="text" id="pid" class="form-control" on-enter="getList()" ng-model="currentfilter.patientnamemrn" placeholder="NAME/MRN">
            <span class="drhms-search-icon">
                <i class="fas fa-search" aria-hidden="true"></i>
            </span>
        </div>
        <div class="col-sm-2">
            <button type="button" tabindex="-1" class="drhms-billing-btn drhms-add-btn" ng-click="addNew()" uib-tooltip="{{'Surgery Schedule'}}"
                tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
            </button>
            <span class="drhms-billing-btn drhms-home-btn">
                <i class="fas fa-home" ng-click="backtoList()" uib-tooltip="Dashboard" tooltip-placement="bottom"></i>
            </span>
        </div>
    </div>
</div>
<div class="row">
    <div class="form-group col-sm-2">
        <label class="col-sm-12 control-label" for="date" translate="From Date"></label>
        <div class="col-sm-12">
            <div class="datepicker">
                <input type="text" class="form-control" name="fromdate" ng-change="getList()" datepicker-options="datePickerOptions"
                    show-button-bar="{{datePickerOptions.showButtonBar}}" uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }" is-open="fromdatePopup.opened"
                    ng-model="currentfilter.FromDate">
                <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
        </div>
    </div>
    <div class="form-group col-sm-2">
        <label class="col-sm-12 control-label" for="date" translate="To Date"></label>
        <div class="col-sm-12">
            <div class="datepicker">
                <input type="text" class="form-control" name="todate" ng-change="getList()" datepicker-options="datePickerOptions"
                    show-button-bar="{{datePickerOptions.showButtonBar}}" uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }" is-open="todatePopup.opened"
                    ng-model="currentfilter.ToDate">
                <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
        </div>
    </div>
    <div class="form-group col-sm-2">
        <label class="col-sm-12 control-label" for="filter_doctor" translate="otschedule-list.surgen.lbl"></label>
        <div class="col-sm-12">
            <!-- <ui-select ng-model="currentfilter.DoctorId" ng-change="getList()">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Doctor | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select> -->
            
            <!-- <autosearch controlid="'surgeon1id'" class="inputsearchlogo" tabindex="1"
                itemid="currentfilter.ChiefSurgeonId" iteminfo="" rowdata=""
                name="'surgeon1id'" config="vm.doctorcontrolconfig" itemchange="getList()" onenter="onenter()" candisable="item.isDisabled"
                isrequired="true" placeholder="'Supplier'"></autosearch> -->
                <autosearch controlid="'vendorid'" class="inputsearchlogo" tabindex="1"
                ng-keyup="moveHeaderFocus('vendorid')" itemid="currentfilter.DoctorId" iteminfo="" rowdata=""
                name="'vendorid'" config="vm.doctorcontrolconfig" itemchange="getList()" onenter="onenter()" candisable="item.isDisabled"
                isrequired="true" placeholder="'Supplier'"></autosearch>
        </div>
    </div>
    <div class="form-group col-sm-2">
        <label class="col-sm-12 control-label" for="otroom" translate="otschedule-list.otroom.lbl"></label>
        <div class="col-sm-12">
            <ui-select ng-model="currentfilter.OTRoomId" ng-change="getList()">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.SurgeryRoom | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-2">
        <label class="col-sm-12 control-label" for="status" translate="otschedule-list.status.lbl"></label>
        <div class="col-sm-12">
            <ui-select ng-model="currentfilter.OTScheduleStatusId" ng-change="getList()" name="otroom" required>
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.OTScheduleStatus | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
