<style>
    .status-legend {
        display: flex;
        gap: 1rem;
        padding: 10px 15px;
        background-color: #f5f5f5;
        border-radius: 6px;
        margin-bottom: 10px;
    }

    .status-card {
        display: flex;
        align-items: center;
        padding: 5px 10px;
        border-radius: 4px;
        font-size: 14px;
        color: #fff;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .status-card:hover {
        transform: scale(1.05);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .status-scheduled {
        background-color: #f39c12;
    }

    .status-confirmed {
        background-color: #00c0ef;
    }

    .status-cancelled {
        background-color: #dd4b39;
    }

    .status-completed {
        background-color: #00a65a;
    }

    .status-all {
        background-color: #290be9;
    }

    input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        background-color: #00ffff;
        border: 1px solid #ccc;
        border-radius: 4px;
        width: 16px;
        height: 16px;
        cursor: pointer;
        position: relative;
    }

    /* input[type="checkbox"]:checked {
        background-color: red;
        border-color: red;
    } */
    label.Scheduled input[type="checkbox"]:checked {
        background-color: #00c0ef;
        border-color: #00c0ef;
    }

    label.Confirmed input[type="checkbox"]:checked {
        background-color: #00c0ef;
        border-color: #00c0ef;
    }

    label.Cancelled input[type="checkbox"]:checked {
        background-color: #dd4b39;
        border-color: #dd4b39;
    }

    label.Completed input[type="checkbox"]:checked {
        background-color: #00a65a;
        border-color: #00a65a;
    }

    label.All input[type="checkbox"]:checked {
        background-color: #0027ff;
        border-color: #0027ff;
    }

    input[type="checkbox"]:checked::after {
        content: '✔';
        color: rgb(255, 255, 255);
        position: absolute;
        top: -3px;
        left: 2px;
        font-size: 14px;
    }

    input:focus-visible {
        border: unset !important;
        outline: unset !important;
    }

    input:focus {
        outline: unset !important;
        border: unset !important;
    }

    .status-checkboxes label {
        display: flex;
        align-items: center;
        height: 24px;
    }

    .status-checkboxes label input {
        margin-right: 9px;
    }

    .fooder-bgs {
        margin-bottom: 150px !important;
        min-height: 0%;
    }

    .fc-toolbar.fc-header-toolbar {
        width: 100%;
        /* position: fixed;
        margin-top: -50px; */
        /* left: 50px; */
        background: #f3f4f5;
        padding: 10px;
        border-bottom: 1px solid #e0e0e0 !important;
        z-index: 99;
    }

    /* .fc-left .fc-button-group {
        margin-left: 100px !important;
    } */

    /* button.ui-datepicker-current.ui-state-default.ui-priority-secondary.ui-corner-all {
        position: fixed;
        margin-top: -306px;
        z-index: 999;
    } */

    .fc-left .fc-button-group button {
        background: unset;
        box-shadow: unset !important;
        background-image: unset;
        border: unset !important;
        text-shadow: unset !important;
    }

    .fc-toolbar .fc-center {
        display: block;
    }

    .fc-toolbar .fc-center h2 {
        display: block;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        text-transform: capitalize !important;
        font-size: 1.4em !important;
        color: #4f5964 !important;
        margin-top: 4px;
    }

    th.fc-day-header {
        text-align: -webkit-center;
    }

    th.fc-widget-header span {
        display: block;
        width: 40%;
        font-size: 15px !important;
        font-weight: 400;
    }

    .fc-view-container td {
        border: 1px solid #ddd !important;
    }

    td.fc-more-cell {
        line-height: 10px;
        text-align: center;
        border: unset !important;
    }

    a.fc-more {
        color: gray;
    }
</style>
<div class="row">
    <div class="col-sm-7">
        <h4 class="page-header mt0" translate="Surgery Schedule Calendar"></h4>
    </div>
    <div class="col-sm-3">
        <label class="col-sm-12" translate="Doctor"></label>
        <div class="col-sm-12">
            <multiselectchk list="lookup.Doctor" selected="currentfilter.DoctorId">
            </multiselectchk>
        </div>
    </div>
    <div class="col-sm-2">
        <label class="col-sm-12" translate="Click"></label>
        <div class="col-sm-12">
            <button type="button" class="draftbutton" translate="Fetch" ng-click="getList()"></button>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-sm-2">
        <label class="col-sm-12" translate="Choose a Date"></label>
        <div id="datepicker" style="margin-top: 43px;"></div>
        <!-- Ot Rooms -->
        <label class="col-sm-12 mt10" translate="OT Rooms" style="color: #033cb8;font-size: 20px;"></label>
        <div class="col-sm-12" style="max-height: 200px; overflow-y: auto;">
            <div ng-repeat="room in lookup.SurgeryRoom" ng-if="room.Id !== -1">
                <label>
                    <input type="checkbox" ng-checked="currentfilter.OTRoomId.indexOf(room.Id) > -1"
                        ng-click="toggleRoomSelection(room.Id)">
                    {{ room.Name }}
                </label>
            </div>
        </div>
        <div class="col-sm-12" style="max-height: 200px; overflow-y: auto;">
            <label translate="Surgery Status" style="color: #023199;font-size: 20px;"></label>
            <div class="status-checkboxes">
                <div ng-repeat="status in statusOptions">
                    <label class="{{status.name}}">
                        <input type="checkbox" ng-model="status.selected" ng-change="updateStatusFilters()">
                        {{status.name}}
                    </label>
                </div>
            </div>
        </div>
    </div>
    <div class="col-sm-10">
        <div id="calendar" calendar></div>
    </div>
</div>
<div class="fooder-bgs">
