<link rel="stylesheet" href="views/emr/surgerymanagement/Surgeryorderset/surgeryorder-modern.css">

<div class="so-modal-wrapper">
    <!-- Executive Modal Header -->
    <div class="so-modal-header">
        <div class="so-modal-header-left">
            <div class="so-modal-header-icon">
                <i class="fa fa-stethoscope"></i>
            </div>
            <div>
                <h3 class="so-modal-title" translate="surgeryorder.pagetitle2.lbl">Surgery Order Set</h3>
                <div class="so-modal-subtitle" ng-if="currentcontext.ProcedureName">
                    <span>Procedure:</span>
                    <span class="so-modal-proc-tag">{{currentcontext.ProcedureName}}</span>
                </div>
            </div>
        </div>
        <button type="button" class="so-modal-close-btn" ng-click="cancelCallback()" title="Close dialog" aria-label="Close">
            <i class="fa fa-times"></i>
        </button>
    </div>

    <!-- Modal Body -->
    <div class="so-modal-body">
        <div class="so-modal-table-container">
            <table class="so-modal-table">
                <thead>
                    <tr>
                        <th style="width: 32%;">
                            <span translate="surgeryorder.billing.lbl">BILLING SERVICE</span>
                            <span class="mandatory-asterix" style="color: #ef4444; font-weight: bold;">*</span>
                        </th>
                        <th style="width: 6%; text-align: center;">
                            <span translate="surgeryorder.y/n.lbl">Y/N</span>
                        </th>
                        <th style="width: 12%;">
                            <span translate="surgeryorder.charge%.lbl">CHARGE %</span>
                            <span class="mandatory-asterix" style="color: #ef4444; font-weight: bold;">*</span>
                        </th>
                        <th style="width: 13%;">
                            <span translate="Doc.Share(%)">DOC. SHARE (%)</span>
                        </th>
                        <th style="width: 31%;">
                            <span translate="surgeryorder.doc.lbl">DOCTOR & OT ALLOCATIONS</span>
                        </th>
                        <th style="width: 6%; text-align: center;">
                            <span>ACTION</span>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="item in vm.items | filter:{Status:1}">
                        <td>
                            <div class="so-modal-search-wrap">
                                <autosearch itemid="item.ServiceItemId" iteminfo="item.SelectedItem" name="'service'"
                                    rowdata="item" config="vm.serviceitemcontrolconfig"
                                    itemchange="ServiceItemChanged(item)" class="inputsearchlogo"
                                    candisable="item.RdoServiceId" isrequired="true" tabindex="item.tabindex"
                                    placeholder="'Service Name or Code'">
                                </autosearch>
                            </div>
                        </td>
                        <td style="text-align: center;">
                            <input type="checkbox" class="custom-checkbox" ng-model="item.IsProcedureCharge" disabled title="Is Procedure Charge">
                        </td>
                        <td>
                            <div class="so-input-percent-wrap">
                                <input type="text" class="so-input-percent" name="rate" ng-model="item.Percent"
                                    placeholder="100" ng-pattern="/^\d+$/" ng-keypress="numberonly($event)" required>
                                <span class="so-input-percent-suffix">%</span>
                            </div>
                        </td>
                        <td>
                            <div class="so-input-percent-wrap">
                                <input type="text" class="so-input-percent" name="doctorShare" ng-model="item.DoctorSharePercent"
                                    placeholder="0" ng-pattern="/^\d+$/" ng-keypress="numberonly($event)">
                                <span class="so-input-percent-suffix">%</span>
                            </div>
                        </td>
                        <td>
                            <div class="so-roles-group">
                                <label class="so-role-pill" ng-class="{'active': item.IsCheifSurgeon}">
                                    <input type="checkbox" ng-model="item.IsCheifSurgeon">
                                    <span>Surgeon</span>
                                </label>
                                <label class="so-role-pill" ng-class="{'active': item.IsAssistantSurgeon}">
                                    <input type="checkbox" ng-model="item.IsAssistantSurgeon">
                                    <span>2nd Surgeon</span>
                                </label>
                                <label class="so-role-pill" ng-class="{'active': item.IsAnesthetist}">
                                    <input type="checkbox" ng-model="item.IsAnesthetist">
                                    <span>Anesthetist</span>
                                </label>
                                <label class="so-role-pill" ng-class="{'active': item.IsOTHourlyCharge}" ng-if="item.ServiceItem.IsOTHourlyCharge == true">
                                    <input type="checkbox" ng-model="item.IsOTHourlyCharge">
                                    <span>OT Charge</span>
                                </label>
                                <label class="so-role-pill" ng-class="{'active': item.IsActive}">
                                    <input type="checkbox" ng-model="item.IsActive">
                                    <span>Active</span>
                                </label>
                            </div>
                        </td>
                        <td style="text-align: center;">
                            <button type="button" class="so-btn-del-line" ng-click="deleteDetail(item)" title="Remove service line">
                                <i class="fa fa-trash-o"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Footer -->
    <div class="so-modal-footer">
        <div>
            <button type="button" class="so-btn-add-line" ng-click="addNew()">
                <i class="fa fa-plus"></i> Add Line Item
            </button>
        </div>
        <div class="so-modal-footer-actions">
            <button type="button" class="so-btn-cancel" ng-click="cancelCallback()">Cancel</button>
            <button type="button" class="so-btn-save" ng-click="saveItem()">
                <i class="fa fa-check"></i>
                <span translate="common.saveapprove-action.lbl">Approve</span>
            </button>
        </div>
    </div>
</div>
