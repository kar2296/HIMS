<div class="row">
    <div class="col-sm-12">
        <div class=" table-control">
            <div class=" bg-pattern">
                <table class="table table-hover table-responsive table-bordered cust_dropdwn">
                    <thead class="bg-subhead">
                        <tr>
                            <th style="width:29%"><span translate="surgeryorder.billing.lbl"></span>
                                <span class="mandatory-asterix">*</span>
                            </th>
                            <th style="width:5%"><span translate="surgeryorder.y/n.lbl"></span></th>
                            <th style="width: 13%;"><span translate="surgeryorder.charge%.lbl"></span>
                                <span class="mandatory-asterix">*</span>
                            </th>
                            <th style="width: 13%;"><span for="rate" translate="Doc.Share(%)"></span>
                            <th><span for="rate" translate="surgeryorder.doc.lbl"></span>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="item in vm.items | filter:{Status:1}">
                            <td class="cust_servicename">

                                <autosearch itemid="item.ServiceItemId" iteminfo="item.SelectedItem" name="'service'"
                                    rowdata="item" config="vm.serviceitemcontrolconfig"
                                    itemchange="ServiceItemChanged(item)" class="inputsearchlogo"
                                    candisable="item.RdoServiceId" isrequired="true" tabindex="item.tabindex">
                                </autosearch>
                            </td>
                            <td class="text-center">
                                <input type="checkbox" class="custom-checkbox" ng-model="item.IsProcedureCharge"
                                    disabled>
                            </td>
                            <td>
                                <input type="text" class="form-control" name="rate" ng-model="item.Percent"
                                    placeholder="" ng-pattern="/^\d+$/" ng-keypress="numberonly($event)" required>
                            </td>
                            <td>
                                <input type="text" class="form-control" name="rate" ng-model="item.DoctorSharePercent"
                                    placeholder="" ng-pattern="/^\d+$/">
                            </td>
                            <td>
                                <div class="form-group col-sm-3">
                                    <label class="col-sm-12 control-label"> Surgeon</label>
                                    <div class="col-sm-2">
                                        <input type="checkbox" class="custom-checkbox" ng-model="item.IsCheifSurgeon">
                                    </div>
                                </div>
                                <div class="form-group col-sm-3">
                                    <label class="col-sm-12 control-label">Second Surgeon</label>
                                    <div class="col-sm-2">
                                        <input type="checkbox" class="custom-checkbox"
                                            ng-model="item.IsAssistantSurgeon">
                                    </div>
                                </div>
                                <div class="form-group col-sm-3">
                                    <label class="col-sm-12 control-label"> Anesthetist</label>
                                    <div class="col-sm-2">
                                        <input type="checkbox" class="custom-checkbox" ng-model="item.IsAnesthetist">
                                    </div>
                                </div>
                                <div class="form-group col-sm-3" ng-if="item.ServiceItem.IsOTHourlyCharge == true">
                                    <label class="col-sm-12 control-label"> OT Charge</label>
                                    <div class="col-sm-2">
                                        <input type="checkbox" class="custom-checkbox" ng-model="item.IsOTHourlyCharge">
                                    </div>
                                </div>
                                <div class="form-group col-sm-3">
                                    <label class="col-sm-12 control-label"> IsActive</label>
                                    <div class="col-sm-2">
                                        <input type="checkbox" class="custom-checkbox" ng-model="item.IsActive">
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<!-- </div> -->

<div class="row">
    <div class="pull-right">
        <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
            ng-click="saveItem()"></button>
    </div>
</div>
