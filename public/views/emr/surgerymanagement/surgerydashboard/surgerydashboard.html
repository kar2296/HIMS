<link href="app/css/dashboard.css" rel="stylesheet">
<meta charset="UTF-12">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!DOCTYPE html>
<html>
<div class="col-sm-12 page-header">
    <h4 class="col-sm-12 mt0" translate="surgeryschedule-list.pagetitle1.lbl"></h4>
</div>
<div id="cemr_dashboard" style="width: 100%;">
    <!-- <div class=""> -->
    <div class="">
        <div class="col-sm-12">
            <div class="card-flex-box-appointment">
                <div class="card-box-item box-bg-color1" ng-click="surgeryschedule()"
                    ng-if="HasAccess('SurgeryDashboard', 'SurgerySchedule')">
                    <div class="card-box-header"><i class="fa fa-calendar"></i>
                        <div translate="surgeryschedule-list.pagetitle.lbl"></div>
                    </div>
                    <!-- <div>{{Items.checkedincount}}</div> -->
                </div>
                <div class="card-box-item box-bg-color2" ng-click="scheduleconfirmed()"
                    ng-if="HasAccess('SurgeryDashboard', 'SurgeryConfirmation')">
                    <div class="card-box-header">
                        <div><i class="far fa-calendar-alt"></i></div>
                        <div translate="surgeryschedule-list.scheduleconfirmed.lbl"></div>
                    </div>
                    <!-- <div>{{Items.inpatientcount}}</div> -->
                </div>
                <div class="card-box-item box-bg-color3" ng-click="procedure()"
                    ng-if="HasAccess('SurgeryDashboard', 'OT_Procedure_Entries')">
                    <div class="card-box-header">
                        <div><i class="fas fa-file-invoice"></i></div>
                        <div translate="surgeryschedule-list.procedure.lbl"></div>
                    </div>
                    <!-- <div>{{Items.appoinmentCount}}</div> -->
                </div>
                <div class="card-box-item box-bg-color4" ng-click="inpatientlist()"
                    ng-if="HasAccess('SurgeryDashboard', 'InPatients')">
                    <div class="card-box-header">
                        <div><i class="fa fa-list"></i></div>
                        <div translate="surgeryschedule-list.inpatientlist.lbl"></div>
                    </div>
                    <!-- <div>{{Items.otschedulecount}}</div> -->
                </div>
                <div class="card-box-item box-bg-color5" ng-click="stockindents()"
                    ng-if="HasAccess('SurgeryDashboard', 'StockIndent')">
                    <div class="card-box-header">
                        <div><i class="fas fa-indent"></i></div>
                        <div translate="surgeryschedule-list.stockindents.lbl"></div>
                    </div>
                    <!-- <div>{{Items.directbilling}}</div> -->
                </div>
                <div class="card-box-item box-bg-color6" ng-click="stockreceives()"
                    ng-if="HasAccess('SurgeryDashboard', 'StockReceive')">
                    <div class="card-box-header">
                        <div><i class="fas fa-briefcase"></i></div>
                        <div translate="surgeryschedule-list.stockreceives.lbl"></div>
                    </div>
                </div>
                <!-- <div>{{Items.dischargedcount}}</div> -->
                <div class="card-box-item box-bg-color7" ng-click="report()"
                    ng-if="HasAccess('SurgeryDashboard', 'Report')">
                    <div class="card-box-header">
                        <div><i class="fa fa-file-text-o"></i></div>
                        <div translate="surgeryschedule-list.report.lbl"></div>
                    </div>
                </div>
                <!-- <div>{{Items.dischargedcount}}</div> -->
            </div>
        </div>
    </div>
</div>
<div class="col-sm-12">
    <div class="col-sm-6">
        <table id="bannerdetails" style="margin-bottom: 12px; margin-top: 20px;background: #5d9cec;">
            <tr>
                <td style="color: #fff;">
                    <span translate="surgeryschedule-list.schedulesurgery.lbl"></span>
                </td>
            </tr>
        </table>
        <table id="bannerdetails" style="background: antiquewhite;">
            <tr ng-repeat="item in todaysurgeryData">
                <td style="border: 1px solid white !important;"><strong>{{item.patientname}} |</strong>
                    {{item.warddetails}} | {{item.doctorname}} | {{item.ProcedureName}} | {{item.OTRoomName}}
                </td>
            </tr>
        </table>

    </div>
    <div class="col-sm-6">
        <table id="bannerdetails" style="margin-bottom: 12px; margin-top: 20px;background: #5d9cec;">
            <tr>
                <td style="color: #fff;"><span translate="surgeryschedule-list.completedsurgery.lbl"></span></td>
            </tr>
        </table>
        <table id="bannerdetails" style="background: antiquewhite;">
            <tr ng-repeat="item in todaysurgerycompletedData">
                <td style="border: 1px solid white !important;"><strong>{{item.patientname}} |</strong>
                    {{item.warddetails}} | {{item.doctorname}} | {{item.ProcedureName}} | {{item.OTRoomName}}
                </td>
            </tr>
        </table>
    </div>
    <div class="fooder-bgs">
        <div class="row ">
            <div class="col-sm-12">
                <div class="pull-left">
                </div>
            </div>
        </div>
    </div>
</div>
<!-- </div> -->


</html>
