<style>
    .container {
        position: relative;
        width: 100%;
        margin-top: 4px
    }

    .container:after,
    .container:before {
        content: " ";
        display: table
    }

    .fooder-bg {
        width: 100%;
        text-align: center;
        margin: 0px auto;
        position: fixed;
        bottom: 0px;
        left: 13%;
    }

    .fontsize {
        font-size: 14.5px;
        font-weight: 700;
        padding: 0px
    }

    .dem-color5 {
        background: teal;
    }

    .bgfoot .btn-sm,
    .btn-group-sm>.btn {
        padding: 0 6px;
        font-size: 10px;
        line-height: 1.5;
        border-radius: 3px
    }

    .col-lg-3 {
        width: 31%;
    }

    .toprighttext .dropdown-menu {
        top: 1px!important;
        left: 15px!important;
        max-height: 103px
    }

    .padding-top1 .col-sm-4 {
        padding-left: 2px;
        padding-right: 2px
    }

    #mainresponsivetablecontrol .table>tbody {
        box-shadow: none
    }

    #mainresponsivetablecontrol .bg-subheadtop {
        background-color: #a29365;
        color: #fff;
        font-size: 14px
    }

    #mainresponsivetablecontrol .bg-subheaddrowp {
        background-color: #f9ebc3;
        font-size: 14px
    }

    .col6control label {
        margin-bottom: 1px !important;
    }

    .toprighttextnew .dropdown-menu {
        top: -69px!important;
        left: 15px!important;
        max-height: 138px;
    }

    #print .dropdown-menu {
        top: initial;
        margin-bottom: 6px;
        bottom: 100%;
        background-color: #1e7d9a !important;
        left: -41px;
        min-width: 160px;
    }

    #print .dropdown-menu>li {
        border-bottom: 1px solid #fff;
    }

    #print .dropdown-menu>li>a {
        color: #000000 !important;
    }

    .dropdown-menu>li>a:hover,
    .dropdown-menu>li>a:focus {
        background-color: #ad1414 !important;
        text-decoration: none;
        color: #fff;
    }

    .bgfoot .ui-select-match-text {
        width: 100px !important;
    }

    #widthctrl .ui-select-container .ui-select-match .ui-select-toggle .ui-select-match-text {
        width: 42px !important;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    #widthctrl>.ui-select-container>.dropdown-menu {
        top: 27px !important;
    }

    #opbillingcontrol .table-control {
        height: 424px!important;
        overflow: auto
    }

    .card .title {
        z-index: 0;
        font-size: 45px;
    }

    .discharge_btn button:nth-child(1) {
        width: 6%;
        float: left;
        display: block;
        position: fixed;
    }

    @media screen and (max-width:1024px) {
        .text-white.btn.dem-color4.btn-sm {
            padding: 5px 5px;
        }
        .col-sm-2.col-md-2.col-lg-2 {
            width: 168px !important;
        }
        .discharge_btn {
            padding-right: 0px;
        }
    }

    .but_print button {
        padding-right: 0px;
    }

    .discharge_btn button:nth-child(2) {
        width: 43%;
        float: left !important;
        margin-left: 5px;
    }

    button.pull-right.btn.btn-xs.btn-primary.col-sm-1.custom_info_summary {
        padding: 0px 2px;
    }

    .pharm_btn_last {
        position: fixed;
        right: 69px;
    }

    .round_off {
        text-align: center;
        margin: 0px;
        background-color: #ece4be;
        margin-bottom: 50px;

    }

    .card {
        padding-top: 0px;
    }

    h4.round_off {
        font-size: 16px !important;
    }

    .lab1 {
        float: left;
    }

    tr.ng-scope {
        color: #000;
        font-weight: 600;
    }

    .inner_popup {
        height: 250px;
    }

    button.btn.btn-warning.btn-rounded.ng-scope {
        width: 20px;
        height: 18px;
        border: 1px solid;
    }

    button.btn.btn-danger.btn-rounded.ng-scope {
        width: 20px;
        height: 18px;
        border: 1px solid;
    }

    .bg-pattern.ng-scope {
        height: 291px;
    }

    .col-sm-12.fullreg-profiles {

        bottom: 0;
        width: 99%;
        margin: 0px;
        padding: 0px;
    }
    table.table.table-bordered.table-condensed.dropdown-menu thead tr{
        background-color:#0073bc !important
    }
    /* table.table.table-bordered.table-condensed.dropdown-menu{
        height: 243px !important;
    } */
    patientsearch table.table.table-bordered.table-condensed.dropdown-menu {
    width: 100% !important;
    overflow: auto;
    height: 243px !IMPORTANT;
}
patientsearch table thead tr td{
background-color:#0073bc !important
}
 
    #mainresponsivetablecontrol .table>tbody>tr>td, #mainresponsivetablecontrol .table>thead:first-child>tr:first-child>td{padding:0px;}
</style>

<link href="app/css/billing-pharmacy-customs.css" rel="stylesheet">
<table id="bannerdetails">
    <tr>
        <td>
            <label class="col-sm-3 control-label" translate="billing.patientadjustmentinfo.patientsearch.lbl"></label>
        </td>
        <td>
            <patientsearch controlid="'pid'" ng-keyup="moveHeaderFocus('pid')" patientid="currentfilter.PatientId" class="col-sm-8 logo"
            name="txtpatientsearch" patientinfo="selectedPatient" patientchange="patientChange()"
            tabindex="tabindexmap.patienttabindex" isdisabled="" filterconfig="patientfilterconfig"></patientsearch>
        </td>
        <td>
            <label class="col-sm-5 control-label" for="fromdate" translate="billing.patientadjustmentinfo.fromdate.lbl"></label>
        </td>
        <td>
            <input type="text" class="form-control" name="fromdate" ng-change="getList()" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
            placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
            is-open="fromdatePopup.opened" ng-model="currentfilter.FromDate">
        </td>
        <td>
            <label class="col-sm-5 control-label" for="todate" translate="billing.patientadjustmentinfo.todate.lbl"></label>
        </td>
        <td>
            <input type="text" class="form-control" name="todate" ng-change="getList()" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
            placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
            is-open="todatePopup.opened" ng-model="currentfilter.ToDate">
        </td>
    </tr>

</table>
<div id="patientrevenuecontrol">
    <div class="row">
        <div class="col-sm-12">
           
            <form id="item_form" name="item_form" class="form-horizontal" role="form">
                
                <div class="table-control">
                    <div class="bg-pattern">
                        <div class="table-height formRoot bill_patrevenueinfo" id="mainresponsivetablecontrol">
                            <table class="table table-hover table-responsive table-bordered">
                                <thead class="bg-subhead">
                                    <tr>
                                        <th class="col-sm-3">
                                            <span translate="billing.patientrevenueinfo.transactiondate.lbl"></span>
                                        </th>
                                        <th class="col-sm-3">
                                            <span translate="billing.patientrevenueinfo.revenuecategory.lbl"></span>
                                        </th>
                                        <th class="col-sm-3">
                                            <span translate="billing.patientrevenueinfo.credit.lbl"></span>
                                        </th>
                                        <th class="col-sm-3">
                                            <span translate="billing.patientrevenueinfo.debit.lbl"></span>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="category in ServiceCategories | filter:{Status:1}">
                                        <td>
                                            {{category.TransactionDate}}
                                        </td>
                                        <td>
                                            {{category.ServiceCategoryName}}
                                        </td>
                                        <td>
                                            <label class="pull-right">{{category.CreditAmount | displaycurrency}}</label>
                                        </td>
                                        <td>
                                            <label class="pull-right">{{category.DebitAmount | displaycurrency}}</label>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="filter-area0 col-sm-12 fullreg-profiles">
                            <div class="col-sm-9"></div>
                            <div class="col-sm-3">
                                <table id="opbillingfooter">
                                    <tr>
                                        <td>
                                            Total
                                        </td>
                                        <td>
                                            {currentcontext.TotalCredit | displaycurrency}}
                                        </td>
                                        <td>
                                            {{currentcontext.TotalDebit | displaycurrency}}
                                        </td>
                                    </tr>
                                </table>
                            </div>
                           
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
