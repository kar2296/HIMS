<style>
    .modal-title {
        font-size: 13px !important;
    }

    .pull-right {
        margin: 6px auto;
    }

    .modal-dialog {
        width: 600px;
        margin: 30px auto;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="appmanager.changepassword.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
            <div class="col-sm-12 pass">
                <div class="form-group">
                    <label class="col-sm-12 control-label0 filter-lbl" for="oldpassword"
                        translate="appmanager.changepassword.oldpassword.lbl"></label>
                    <div class="col-sm-12">
                        <input type="password" class="form-control" name="oldpassword" required
                            ng-model="item.OldPassword" placeholder="">
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-12 control-label0 filter-lbl" for="newpassword"
                        translate="appmanager.changepassword.newpassword.lbl"></label>
                    <div class="col-sm-12">
                        <input type="password" class="form-control" name="newpassword" required
                            ng-model="item.NewPassword" placeholder="">
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-12 control-label0 filter-lbl" for="confirmpassword"
                        translate="appmanager.changepassword.confirmpassword.lbl"></label>
                    <div class="col-sm-12">
                        <input type="password" class="form-control" name="confirmpassword" required
                            ng-model="item.ConfirmPassword" ng-fab-match="item.NewPassword" placeholder="">
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-sm-12" ng-show="currentcontext.pwd"><br>
                        <strong>Password Criteria:</strong>
                        <div class="pwd-rules">
                            <label class="control-label">* Password should contain minimum of
                                {{currentcontext.pwd.MinPwdLength}} character(s).</label>
                            <label class="control-label">* Password should not exceed
                                {{currentcontext.pwd.MaxPwdLength}} character(s).</label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="footer-bgs">
                <div class="pull-right">
                    <button type="submit" class="draftbutton" translate="common.saveaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
