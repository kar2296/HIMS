<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="registration.patientidentity-form.pagetitle.lbl"></h4>
</div>

<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
            <div>
                <div class="">
                    <div class="panel-heading">&nbsp;</div>
                    <div class="panel-body form-panel">
                        <div class="col-sm-12">
                            <div class="well">
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="type" translate="registration.patientidentity-form.type.lbl"></label>
                                    <div class="col-sm-8">
                                        <ui-select ng-model="item.PatientIdentityTypeId" name="type">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.PatientIdentityType | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="idnumber" translate="registration.patientidentity-form.idnumber.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="idnumber" ng-model="item.IDNumber" placeholder="">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="comments" translate="registration.patientidentity-form.comments.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="comments" ng-model="item.Comments" placeholder="">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="panel-footer formactionbar">
                <div class="pull-right">
                    <button type="submit" class="btn btn-primary btn-sm" translate="common.saveaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
