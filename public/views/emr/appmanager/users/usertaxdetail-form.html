<style>
    .user-img {
        width : 80px !important;
        height : 80px !important;
    }
  
   #depheight .well {
    min-height: 400px;
} 
 #depheight .well1 {
    min-height: 184px;
} 
#depheight .formRoot {
    overflow: auto;
    height: 507px !important;
}
.panel-body .well1 {
    min-height: 20px;
    padding: 19px;
    margin-bottom: 0;
    border: 1px solid #ededed;
    border-radius: 4px;
    background: #e9f6fd;
    background: -moz-linear-gradient(top,rgba(233,246,253,1) 0,rgba(211,238,251,1) 100%);
    background: -webkit-linear-gradient(top,rgba(233,246,253,1) 0,rgba(211,238,251,1) 100%);
    background: linear-gradient(to bottom,#fafafa 0,#f7fcfd 100%);
    filter: progid: DXImageTransform.Microsoft.gradient( startColorstr='#e9f6fd', endColorstr='#d3eefb', GradientType=0);
    box-shadow: 4px 2px 13px -7px rgba(0,0,0,.75);
}
</style>
<div class="row">
    <div class="col-sm-12" id="depheight">
        <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">	
            <div class="formRoot">
                <div class="panel panel-default">
                    <div class="panel-heading"><h3 class="panel-title" translate="appmanager.usertaxdetail-form.pnlgeneral.lbl"></h3></div>
                    <div class="panel-body form-panel bg-pattern">	
                        <div class="col-sm-12">			
                            
                            <!-- leftpanel -->
                            <div class="col-sm-6">
                                                                                                                        <div class="col-sm-12 well">

                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="isgstregistered" translate="appmanager.usertaxdetail-form.isgstregistered.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="checkbox" name="isgstregistered" class="custom-checkbox"
                                            ng-model="item.IsGSTRegistered">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="gstid" translate="appmanager.usertaxdetail-form.gstid.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="gstid" ng-model="item.GSTId" placeholder="" ng-disabled="!item.IsGSTRegistered">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="businessregno" translate="appmanager.usertaxdetail-form.businessregno.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="businessregno" ng-model="item.BusinessRegNo" placeholder="" ng-disabled="!item.IsGSTRegistered">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="businessname" translate="appmanager.usertaxdetail-form.businessname.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="businessname" ng-model="item.BusinessName" placeholder="" ng-disabled="!item.IsGSTRegistered">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="businessaddress" translate="appmanager.usertaxdetail-form.businessaddress.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="businessaddress" ng-model="item.BusinessAddress" placeholder="" ng-disabled="!item.IsGSTRegistered">
                                    </div>
                                </div>
                              <div class="form-group">
                                    <label class="col-sm-4 control-label" translate="appmanager.dept.activefrom.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="activefrom" ng-date-object
                                                datepicker-options="datePickerOptions" 
                                                show-button-bar="{{datePickerOptions.showButtonBar}}" 
                                                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" 
                                                placeholder="{{datePickerOptions.placeholder}}" 
                                                ng-click="activefromPopup = { opened: true }" 
                                                is-open="activefromPopup.opened" ng-model="currentfilter.ActiveFrom"   ng-disabled="!item.IsGSTRegistered">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="activeto" translate="appmanager.usertaxdetail-form.activeto.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="activeto" ng-date-object 
                                                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" 
                                                placeholder="{{datePickerOptions.placeholder}}" 
                                                ng-click="activetoPopup = { opened: true }" 
                                                is-open="activetoPopup.opened" ng-model="item.ActiveTo" 
                                                ng-disabled="!item.IsGSTRegistered">
                                    </div>
                                </div>
                            </div>
                            </div>
                            <!-- rightpanel -->
                            <div class="col-sm-6">
                            </div>
                        </div>
                    </div>
                </div>
            </div>    
             <div class="fooder-bgs">
                <div class="row ">
                    <div class="col-sm-12">
                        <div class="pull-left">
                            <button id="btnCancelForm"  type="button" class="btn pyr-color10 btn-sm " ng-click="backToList()"><i class="fa fa-angle-left" aria-hidden="true" ></i>&nbsp;&nbsp;<span class="btn-fontsize"  translate="common.backaction.lbl"></span></button>
                            
                        </div>
                        <div class="pull-right">
                            <button id="btnSave" type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
                            <button id="btnSaveApprove" type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl"
                                ng-click="saveAndApprove()"></button>
                            <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                            <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                        </div>
                    </div>
                </div>
            </div>
        </form>		
    </div>
</div>
