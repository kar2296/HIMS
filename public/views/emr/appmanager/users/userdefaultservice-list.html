<div class="row">
    <button class="btn-add" ng-click="addNew()" uib-tooltip="Hospital" tooltip-placement="bottom">
        <i class="fas fa-plus" aria-hidden="true"></i>
    </button>
</div>
<!-- set-tab-grid-height reduce-height="-40" -->
<div class="col-sm-12 drhms-defaultservices">
    <table class="table table-hover table-responsive table-bordered">
        <thead class="bg-subhead">
            <tr>
                <th class="col-sm-2"><span translate="appmanager.userdefaultservicelist.servicename.lbl"></span><span
                        class="mandatory-asterix">*</span></th>
                <th class="col-sm-1"><span translate="appmanager.userdefaultservicelist.qty.lbl"></span><span
                        class="mandatory-asterix">*</span></th>
                <th class="col-sm-1"><span translate="appmanager.userdefaultservicelist.patienttype.lbl"></span><span
                        class="mandatory-asterix">*</span></th>
                <th class="col-sm-2"><span translate="appmanager.userdefaultservicelist.visittype.lbl"></span></th>
                <th class="col-sm-1"><span translate="appmanager.userdefaultservicelist.guarantortype.lbl"></span><span
                        class="mandatory-asterix">*</span></th>
                <th class="col-sm-2"><span translate="appmanager.userdefaultservicelist.guarantorname.lbl"><span
                            class="mandatory-asterix">*</span></span></th>
                <th class="col-sm-1"><span
                        translate="appmanager.userdefaultservicelist.eligibledaysfrom.lbl"></span><span
                        class="mandatory-asterix">*</span></th>
                <th class="col-sm-1"><span translate="appmanager.userdefaultservicelist.eligibledays.lbl"></span><span
                        class="mandatory-asterix">*</span></th>
                <th class="col-sm-1"><span translate="appmanager.userdefaultservicelist.noofvisitfree.lbl"></span><span
                        class="mandatory-asterix">*</span></th>
                <th class="col-sm-1"><span translate="clinicalmaster.serviceitemalias-list.status.lbl"></span></th>
                <th class="col-sm-1"><span translate="common.actions_col.lbl"></span></th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="item in vm.items | filter:{Status:1}">
                <td>
                    <autosearch itemid="item.ServiceItemId" iteminfo="item.SelectedItem" rowdata="item"
                        config="vm.serviceitemcontrolconfig" itemchange="" class="inputsearchlogo"
                        candisable="item.RdoServiceId"></autosearch>
                </td>
                <td>
                    <input type="text" class="form-control" ng-model="item.Quantity" placeholder="">
                </td>
                <td>
                    <ui-select ng-model="item.PatientTypeId" class="ui-select-grid">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.EncounterType | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </td>
                <td>
                    <ui-select ng-model="item.VisitTypeId" class="ui-select-grid">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.VisitType | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </td>
                <td>
                    <ui-select ng-model="item.GuarantorTypeId" class="ui-select-grid"
                        ng-change="guarantorTypeChange(item)">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.GuarantorType | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </td>
                <td>
                    <ui-select ng-model="item.GuarantorId" class="ui-select-grid">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.Guarantor | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </td>
                <td>
                    <input type="text" class="form-control" ng-model="item.EligibleDaysFrom" placeholder="">
                </td>
                <td>
                    <input type="text" class="form-control" ng-model="item.EligibleDays" placeholder="">
                </td>
                <td>
                    <input type="text" class="form-control" ng-model="item.NooFVisitFree" placeholder="">
                </td>
                <td align="center">
                    <input type="checkbox" class="custom-checkbox" ng-model="item.StatusId">
                </td>
                <td align="center">
                    <button class="drhms-edit-button" ng-click="deleteItem($index,item)">
                        <img class="drhms-edit-button" src="assets/svg/delete.svg" alt="">
                </td>
            </tr>
        </tbody>
    </table>
</div>
<div class="fooder-bgs">
    <div class="pull-left">
        <button type="button" class=" btn btn-sm pyr-color10" ng-click="backToList()"><i
                class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button>
    </div>
    <div class="pull-right">
        <button id="btnSaveForm" type="button" class="draftbutton" translate="common.saveaction.lbl"
            ng-click="saveItem()"></button>
    </div>
</div>
