<style>
    .modal-lg {
        width: 500px;
    }

    .panel-body {
        padding: 15px;
        margin-left: 0px;
        margin-top: 40px;
        margin-right: 0px;
        margin-bottom: 0px;
        background-image: url(app/img/bg-body.jpg);
        background-repeat: repeat;
        overflow: auto;
    }

    .well {
        min-height: 20px;
        padding: 19px;
        margin-bottom: 0px;
        border: 1px solid #ededed;
        border-radius: 4px;
        background: rgb(233, 246, 253);
        /* Old browsers */
        background: -moz-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* FF3.6-15 */
        background: -webkit-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, rgb(250, 250, 250) 0%, rgb(247, 252, 253) 100%);
        /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid: DXImageTransform.Microsoft.gradient( startColorstr='#e9f6fd', endColorstr='#d3eefb', GradientType=0);
        /* IE6-9 */
        box-shadow: 4px 2px 13px -7px rgba(0, 0, 0, 0.75);
    }

    .formactionbar {
        padding: 5px 15px;
        height: 40px;
        background-color: #ccecf5;
    }

    .custom-modal-header {
        margin-bottom: 10px;
        background-color: #597a9a;
        color: #fff;
    }

    .modal-content {
        -webkit-box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        box-shadow: -1px 3px 20px 7px rgba(249, 244, 244, 0.5);
    }

    .modal-header {
        padding: 4px 10px;
        border-bottom: 1px solid #e5e5e5;
    }

    .pwd-rules {
        margin-left: 15px;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-12 ">
        <h3 class="panel-title" translate="appmanager.securitypincheck.pagetitle.lbl"></h3>
    </div>
</div>
</div>
<div class="row">
    <div class="col-sm-12 ">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div>
                <div class="">
                    <div class="panel-body form-panel">
                        <div class="col-sm-12">
                            <!-- leftpanel -->
                            <div class="col-sm-12 well">
                                <div class="col-sm-12">
                                    <div class="form-group">
                                        <label class="col-sm-7 col-md-5 control-label" translate="appmanager.securitypincheck.username.lbl"> : </label>
                                        <span class="col-sm-5 col-md-7 control-label">{{item.UserName}} </span>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-7 col-md-5 control-label" for="securitypin" translate="appmanager.securitypincheck.securitypin.lbl"></label>
                                        <div class="col-sm-5 col-md-7">
                                            <input type="password" class="form-control" id="securitypin" name="securitypin" on-enter="saveItem()" ng-model="item.SecurityPin"
                                                placeholder="" required>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="panel-footer formactionbar">
                    <div class="pull-right">
                        <button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveaction.lbl" ng-click="saveItem()"></button>
                        <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                        <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                    </div>
                </div>
        </form>
        </div>
    </div>
