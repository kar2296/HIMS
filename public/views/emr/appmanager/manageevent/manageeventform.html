<style>
    .user-img {
        width: 80px !important;
        height: 80px !important;
    }
    
    #depheight .well {
        min-height: 430px;
    }
    
    #depheight .well1 {
        min-height: 184px;
    }
    
    #depheight .formRoot {
        overflow: auto;
        height: 540px !important;
    }
    
    .panel-body .well1 {
        min-height: 20px;
        padding: 19px;
        margin-bottom: 0;
        border: 1px solid #ededed;
        border-radius: 4px;
        background: #e9f6fd;
        background: -moz-linear-gradient(top, rgba(233, 246, 253, 1) 0, rgba(211, 238, 251, 1) 100%);
        background: -webkit-linear-gradient(top, rgba(233, 246, 253, 1) 0, rgba(211, 238, 251, 1) 100%);
        background: linear-gradient(to bottom, #fafafa 0, #f7fcfd 100%);
        filter: progid: DXImageTransform.Microsoft.gradient( startColorstr='#e9f6fd', endColorstr='#d3eefb', GradientType=0);
        box-shadow: 4px 2px 13px -7px rgba(0, 0, 0, .75);
    }
    
    #breadcrumpheader-height .panel-body {
        height: 490px !important;
    }
</style>


<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="appmanager.manageeventform.pagetitle.lbl"></h4>
</div>
<div class="row" id="breadcrumpheader-height">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot">
                <!--<div class="panel panel-default">-->
                <div class="panel-body form-panel">
                    <div class="col-sm-12">
                        <!-- leftpanel -->
                        <div class="col-sm-6">

                            <div class="form-group">
                                <label class="col-sm-2 control-label" for="facility" translate="appmanager.manageeventform.facility.lbl"></label>
                                <div class="col-sm-8">
                                    <ui-select ng-model="item.FacilityId" name="facility" required>
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                        </ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-12">
                            <div class="form-group">
<div class="col-sm-2">
                                 <legend class="legendStyle"
                                             translate="appmanager.manageeventform.triggerpoint.lbl">
                                        </legend>
                                        </div>

                                <!--<label class="col-sm-2 control-label" for="associatedwithcc" translate="appmanager.manageeventform.triggerpoint.lbl"></label>-->

                                <label class="col-sm-1 control-label" for="associatedwithcc" translate="appmanager.manageeventform.registration.lbl"></label>
                                <div class="col-sm-1">
                                    <input type="checkbox" name="associatedwithcc" class="custom-checkbox" ng-model="item.Isregistration">
                                </div>
                                <label class="col-sm-1 control-label" for="associatedwithcc" translate="appmanager.manageeventform.appointment.lbl"></label>
                                <div class="col-sm-1">
                                    <input type="checkbox" name="associatedwithcc" class="custom-checkbox" ng-model="item.IsAppointment">
                                </div>
                                <label class="col-sm-1 control-label" for="associatedwithcc" translate="appmanager.manageeventform.billing.lbl"></label>
                                <div class="col-sm-1">
                                    <input type="checkbox" name="associatedwithcc" class="custom-checkbox" ng-model="item.Isbilling">
                                </div>
                                <label class="col-sm-1 control-label" for="associatedwithcc" translate="appmanager.manageeventform.labresult.lbl"></label>
                                <div class="col-sm-1">
                                    <input type="checkbox" name="associatedwithcc" class="custom-checkbox" ng-model="item.Islabresult">
                                </div>
                                <label class="col-sm-1 control-label" for="associatedwithcc" translate="appmanager.manageeventform.radiologyresult.lbl"></label>
                                <div class="col-sm-1">
                                    <input type="checkbox" name="associatedwithcc" class="custom-checkbox" ng-model="item.Isradiologyresult">
                                </div>
                                <!--<label class="col-sm-1 control-label" for="associatedwithcc" translate="appmanager.manageeventform.triggerpoint.lbl"></label>
                                        <div class="col-sm-1">
                                            <input type="checkbox" name="associatedwithcc" class="custom-checkbox" ng-model="item.IsAssociatedWithCC">
                                        </div>-->


                            </div>
                            
                            <div class="form-group">
<div class="col-sm-2">
                                <legend class="legendStyle"
                                             translate="appmanager.manageeventform.trigger.lbl">
                                        </legend>
                                        </div>
                                <!--<label class="col-sm-2 control-label" for="active" translate="appmanager.manageeventform.trigger.lbl"></label>-->
                                <label class="col-sm-1 control-label" for="associatedwithcc" translate="appmanager.manageeventform.create.lbl"></label>

                                <div class="col-sm-1">
                                    <input type="checkbox" name="active" class="custom-checkbox" ng-model="item.Iscreate">
                                </div>
                                <label class="col-sm-1 control-label" for="associatedwithcc" translate="appmanager.manageeventform.approve.lbl"></label>
                                <div class="col-sm-1">
                                    <input type="checkbox" name="associatedwithcc" class="custom-checkbox" ng-model="item.Isapprove">
                                </div>
                                <label class="col-sm-1 control-label" for="associatedwithcc" translate="appmanager.manageeventform.update.lbl"></label>
                                <div class="col-sm-1">
                                    <input type="checkbox" name="associatedwithcc" class="custom-checkbox" ng-model="item.Isupdate">
                                </div>
                                <label class="col-sm-1 control-label" for="associatedwithcc" translate="appmanager.manageeventform.cancel.lbl"></label>
                                <div class="col-sm-1">
                                    <input type="checkbox" name="associatedwithcc" class="custom-checkbox" ng-model="item.Iscancel">
                                </div>
                                
                            </div>
                            <div class="form-group">
                                <div class="col-sm-2">
                                <legend class="legendStyle"
                                             translate="appmanager.manageeventform.eventtype.lbl">
                                        </legend>
                                        </div>


                                <!--<label class="col-sm-2 control-label" for="associatedwithcc" translate="appmanager.manageeventform.eventtype.lbl"></label>-->
                                <label class="col-sm-1 control-label" for="associatedwithcc" translate="appmanager.manageeventform.sms.lbl"></label>
                                <div class="col-sm-1">
                                    <input type="checkbox" name="associatedwithcc" class="custom-checkbox" ng-model="item.Issms">
                                </div>
                                <label class="col-sm-1 control-label" for="associatedwithcc" translate="appmanager.manageeventform.email.lbl"></label>
                                <div class="col-sm-1">
                                    <input type="checkbox" name="associatedwithcc" class="custom-checkbox" ng-model="item.IsEmail">
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="col-sm-2">
                                <legend class="legendStyle"
                                             translate="appmanager.manageeventform.eventssendto.lbl">
                                        </legend>
                                        
</div>

                                <!--<label class="col-sm-2 control-label" for="active" translate="appmanager.manageeventform.eventssendto.lbl"></label>-->

                                <label class="col-sm-1 control-label" for="active" translate="appmanager.manageeventform.patient.lbl"></label>
                                <div class="col-sm-1">
                                    <input type="checkbox" name="active" class="custom-checkbox" ng-model="item.IsPatient">
                                </div>
                                <label class="col-sm-1 control-label" for="active" translate="appmanager.manageeventform.doctor.lbl"></label>
                                <div class="col-sm-1">
                                    <input type="checkbox" name="active" class="custom-checkbox" ng-model="item.IsDoctor">
                                </div>
                                <label class="col-sm-1 control-label" for="active" translate="appmanager.manageeventform.vendor.lbl"></label>
                                <div class="col-sm-1">
                                    <input type="checkbox" name="active" class="custom-checkbox" ng-model="item.IsVendor">
                                </div>
                                <label class="col-sm-1 control-label" for="active" translate="appmanager.manageeventform.user.lbl"></label>
                                <div class="col-sm-1">
                                    <input type="checkbox" name="active" class="custom-checkbox" ng-model="item.IsUser">
                                </div>
                                <label class="col-sm-1 control-label" for="active" translate="appmanager.manageeventform.technician.lbl"></label>
                                <div class="col-sm-1">
                                    <input type="checkbox" name="active" class="custom-checkbox" ng-model="item.IsTechnician">
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-12">
                            <div class="col-sm-8">
                                <div class="col-sm-12">

                                    <label class="col-sm-1 control-label" for="active" translate="appmanager.manageeventform.content.lbl"></label>

                                    <div class="col-sm-10">

                                        <textarea class="form-control" name="reason" ng-model="item.Content" maxlength="4000" style="width: 115%; margin-top: 10px; margin-bottom: 0px; height: 300px;"
                                            class="notes-textarea ng-pristine ng-valid ng-empty ng-valid-maxlength ng-touched"></textarea>

                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-4">
                                <div class="col-sm-12 well">
                                    <fieldset class="fsStyle well">
                                        <legend class="legendStyle">
                                            <span translate="appmanager.manageeventform.clicktomove.lbl"></span>
                                        </legend>
                                        <div class="col-sm-12">
                                            <input type="button" value="Patient Name" class="btn btn-link"   ng-click="getbutton( item.Ispatientname,'$Patient Name$')" ng-model="item.Ispatientname"></button>


                                            <!--<a href="" ng-change="getclick( item.Ispatientname,'Patient Name')" ng-model="item.Ispatientname"><< </a>Patient Name-->
                                        </div>
                                        <div class="col-sm-12">
                                            <input type="button" value="MRN" class="btn btn-link" ng-click="getbutton( item.IsMRN,'$MRN$')" ng-model="item.IsMRN">                                            </div>
                                        <div class="col-sm-12">
                                            <input type="button" value="Current User" class="btn btn-link"  ng-click="getbutton( item.Isuser,'$Current User$')" ng-model="item.Isuser">                                            </div>
                                        <div class="col-sm-12">
                                            <input type="button" value="Doctor Name" class="btn btn-link"  ng-click="getbutton( item.Isdoctor,'$Doctor Name$')" ng-model="item.Isdoctor">
                                        </div>
                                        <div class="col-sm-12">
                                            <input type="button" value="Today" class="btn btn-link"  ng-click="getbutton( item.Istoday,'$Today$')" ng-model="item.Istoday">
                                        </div>
                                        <div class="col-sm-12">
                                            <input type="button" value="Appointment Time" class="btn btn-link"  ng-click="getbutton( item.Istime,'$Appointment Time$')" ng-model="item.Istime">
                                        </div>
                                        <div class="col-sm-12">
                                            <input type="button" value="Register Date" class="btn btn-link"  ng-click="getbutton( item.Isdate,'$Register Date$')" ng-model="item.Isdate">
                                        </div>
                                        <div class="col-sm-12">
                                            <input type="button" value="Vendor Name" class="btn btn-link"   ng-click="getbutton( item.Isvendor,'$Vendor Name$')" ng-model="item.Isvendor">
                                                    <div></div>
                                                    <div></div>
                                                     <input type="button" value="PO Date" class="btn btn-link"   ng-click="getbutton( item.Ispodate,'$PO Date$')" ng-model="item.Ispodate">
                                                    <div></div>
                                                     <input type="button" value="PO Number" class="btn btn-link"   ng-click="getbutton( item.Isponumber,'$PO Number$')" ng-model="item.Isponumber">
                                                    <div></div>
                                                     <input type="button" value="Facility Name" class="btn btn-link"  ng-click="getbutton( item.Isfacility,'$Facility Name$')" ng-model="item.Isfacility">
                                        </div>
                                    </fieldset>
                                </div>
                            </div>
                        </div>
                    </div>




                </div>


                <!--</div>-->

                <div class="site-footer panel-footer">
                    <button type="button" class="btn btn-sm pyr-color10" ng-click="backToList()"><i class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button>
                    <div class="footer-right">
                        <button type="button" class="draftbutton" ng-click="saveAndApprove()" translate="common.saveaction.lbl"></button>
                        <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
