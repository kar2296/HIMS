<style>
    .user-img {
        width : 80px !important;
        height : 80px !important;
    }
 
   #specialityheight .well {
    min-height: 419px;
} 
 #specialityheight .well1 {
    min-height: 184px;
} 
#specialityheight .formRoot {
    overflow: auto;
    height: 540px;
}
.panel-body .well1 {
    min-height: 20px;
    padding: 19px;
    margin-bottom: 0;
    border: 1px solid #ededed;
    border-radius: 4px;
    background: #e9f6fd;
    background: -moz-linear-gradient(top,rgba(233,246,253,1) 0,rgba(211,238,251,1) 100%);
    background: -webkit-linear-gradient(top,rgba(233,246,253,1) 0,rgba(211,238,251,1) 100%);
    background: linear-gradient(to bottom,#fafafa 0,#f7fcfd 100%);
    filter: progid: DXImageTransform.Microsoft.gradient( startColorstr='#e9f6fd', endColorstr='#d3eefb', GradientType=0);
    box-shadow: 4px 2px 13px -7px rgba(0,0,0,.75);
}
</style>	

<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-5 col-md-4">
            <h3 class="panel-title" translate="appmanager.speciality.pagetitle.lbl"></h3>
        </div>
        <div class="col-sm-7 col-md-8">
            <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addNew()" uib-tooltip="{{ 'appmanager.specialitys.addnew-tooltip.lbl' | translate
}}" tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i><span translate="clinicalmaster.serviceitem-list.addnew.lbl"></span></button>
 
        </div>
    </div>
</div>
<div class="row">
    <div class="col-sm-12" id="specialityheight">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">	
            <div class="formRoot" >
                <div class="panel panel-default">
                 <!--    <div class="panel-heading"><h3 class="panel-title" translate="appmanager.speciality.pnlgeneral.lbl"></h3></div> -->
                    <div class="panel-body form-panel bg-pattern">	
                        <div class="col-sm-12">			
                            
                            <!-- leftpanel -->
                            <div class="col-sm-6">
                                <div class="col-sm-12 well">
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="code" translate="appmanager.speciality.code.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="code" ng-model="item.SpecialityCode" placeholder="" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="specialityname" translate="appmanager.speciality.name.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="specialityname" ng-model="item.SpecialityName" placeholder="" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" translate="appmanager.speciality.description.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="description" ng-model="item.Description" placeholder="">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" translate="appmanager.speciality.parentspeciality.lbl"></label>
                                    <div class="col-sm-8">
                                        <ui-select ng-model="item.ParentSpecialityId">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Speciality | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="specialitytype" translate="appmanager.speciality.type.lbl"></label>
                                    <div class="col-sm-8">
                                        <ui-select ng-model="item.SpecialityTypeId" name="specialitytype" required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.SpecialityType | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="facilityname" translate="appmanager.speciality.facilityname.lbl"></label>
                                    <div class="col-sm-8">
                                        <ui-select ng-model="item.FacilityId" name="facilityname" required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" translate="appmanager.speciality.active.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="checkbox" name="active" class="custom-checkbox"
                                            ng-model="item.IsActive" ng-checked="item.IsActive == 1">
                                    </div>
                                </div>
                            </div>
                            </div>
                            <!-- rightpanel -->
                            <div class="col-sm-6">
                            </div>
                        </div>
                    </div>
                </div>
            </div><div class="fooder-bgs">
                <div class="row ">
                    <div class="col-sm-12">
                        <div class="pull-left">
                            <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()"><i class="fa fa-angle-left" aria-hidden="true" ></i>&nbsp;&nbsp;<span class="btn-fontsize"  translate="common.backaction.lbl"></span></button>
                             
                        </div>
                        <div class="pull-right">
                            <button id="btnSave" type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
                            <button id="btnSaveApprove" type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl"
                                ng-click="saveAndApprove()"></button>
                            <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                            <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                        </div>
                    </div>
                </div>
            </div>
        </form>		
    </div>
</div>
