<style>
    .modal-dialog {
        width: 600px;
        margin: 30px auto;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="appmanager.sequencemasters-form.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="backToList()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" translate="appmanager.sequencemasters-form.seqprefix.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" ng-model="item.SeqPrefix" placeholder="" autofocus>
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="seqsuffix" translate="appmanager.sequencemasters-form.seqsuffix.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="seqsuffix" ng-model="item.SeqStartId" placeholder="">
            </div>
        </div>
    </form>
</div>
<div class="">
    <div class="row">
        <div class="pull-right">
            <button type="submit" class="draftbutton" ng-click="save()" translate="common.saveaction.lbl"></button>
        </div>
    </div>
</div>
