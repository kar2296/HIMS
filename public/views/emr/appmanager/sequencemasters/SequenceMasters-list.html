<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="appmanager.sequencemasters-list.pagetitle.lbl"></h4>
    <div class="col-sm-3">
        <label class="col-sm-4 control-label filter-lbl" translate="Facility"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.FacilityId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="pull-right">
        <button type="button" class="default-color2" ng-click="redistosqlConfirm()">
            <span translate="appmanager.sequencemasters-list.redistosql.lbl"></span>
        </button>
        <button type="button" ng-if="CurrentUserId == 1" class="default-color2" ng-click="sqltoredisConfirm()">
            <span translate="appmanager.sequencemasters-list.sqltoredis.lbl"></span>
        </button>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
