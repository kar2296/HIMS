<style>
   .nameinfo {
        font-size: 13px;
        font-weight: 700;
        color: #337ab7;
    }
    
    .nameinfo.mrninfo {
        color: black
    }
    
    .contactinfo {
        font-size: 10px;
        color: #808080
    }
    .block {
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
}

    #depsheight .ui-grid-viewport {
        width: 100%;
        /* height: 550px!important; */
    }

.table-uigrid {
    margin-left: 10px;
    margin-right: 10px;
    height: 488px!important;
}
    
    .linkstyle {
        font-weight: 700;
        text-align: right;
    }
    
    .statusinfo {
        font-size: 13px;
    }
    
    
    
    .form-group {
        margin-bottom: 7px !important;
    }
    
    .sr-only {
    height: 22px !important;
}
</style>



<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="appmanager.modules.pagetitle.lbl"></h4>


    <div class="col-sm-6">
        <button class="btn bt-color3 btn-xs pull-right btn-filter" ng-click="" uib-tooltip="{{ '      appmanager.modules.advancefilter-tooltip.lbl' | translate


 }}" tooltip-placement="bottom"><i class="fa fa-filter" aria-hidden="true"></i>&nbsp;&nbsp;<span translate="clinicalmaster.serviceitem-list.filter.lbl"></span></button>
        <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addNew()" uib-tooltip="{{ 'appmanager.modules.addnew-tooltip.lbl' | translate
}}" tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i><span translate="clinicalmaster.serviceitem-list.addnew.lbl"></span></button>
    </div>
</div>
  <div class="row filter-area">
        <div class="col-sm-12">
           <div class="col-sm-2">
                    <label class="col-sm-5 control-label filter-lbl" translate="appmanager.modules.code.lbl"></label>
                  
                       <div class="input-group col-sm-7">
                    <div class="input-group-addon"><i class="fas fa-search" aria-hidden="true"></i></div>
                    <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.modulecode" translate translate-attr-placeholder="appmanager.modules.code.lbl">
                </div>                  
                </div>
           
                 <div class="col-sm-4">
            
                <label class="col-sm-6 control-label filter-lbl" translate="appmanager.modules.modulename.lbl"></label>
                <div class="input-group col-sm-6">
                    <div class="input-group-addon"><i class="fas fa-search" aria-hidden="true"></i></div>
                    <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.modulename" translate translate-attr-placeholder="appmanager.modules.modulename.lbl">
                </div>
            
        </div>    
          <div class="col-sm-3">
                    <label class="col-sm-4 control-label filter-lbl" translate="appmanager.modules.status.lbl"></label>
                    <div class="col-sm-8">
                        <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 8 : 0}}
                                <span ng-if="$select.selected.Text.length>8">...</span>
                            </ui-select-match>
                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>                    
                </div>    
        </div>
</div>

<div class="container-fluid" id="depsheight">
    <div ui-grid="vm.gridConfig" class="table-uigrid table-uigrid-tab "></div>

   <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
