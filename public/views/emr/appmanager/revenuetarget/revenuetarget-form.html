<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Revenue Target"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="backToList()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="Finance" translate="Finance Year"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.YearId" name="Finance" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.FinancialYear | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="Month" translate="Month"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.MonthId" name="Month" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Month | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" translate="Revenue Target"></label>
            <div class="col-sm-12">
                <textarea rows="3" name="Revenue" ng-model="item.RevenueTarget" maxlength="4000" style="width:100%;" class="notes-textarea"></textarea>
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" translate="Description"></label>
            <div class="col-sm-12">
                <textarea rows="3" name="Description" ng-model="item.Description" maxlength="4000" style="width:100%;" class="notes-textarea"></textarea>
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="isactive" translate="clinicalmaster.diet-form.isactive.lbl"></label>
            <div class="col-sm-12">
                <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
            </div>
        </div>
    </form>
</div>

<div class="">
    <div class="row">
        <div class="pull-right">
            <button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>

            <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl" ng-click="SaveandApprove()"></button>
            <!-- <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button> -->
        </div>
    </div>
</div>
