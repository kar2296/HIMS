<div class="row page-header">
    <div class="col-sm-6">
        <h3 class="panel-title" translate="appmanager.org.pagetitle.lbl"></h3>
    </div>
    <div class="col-sm-6">
        <button class="btn-add" ng-click="addNew()" uib-tooltip="{{ 'appmanager.orgs.addnew-tooltip.lbl' | translate
}}" tooltip-placement="bottom">
            <i class="fa fa-plus" aria-hidden="true"></i>
        </button>

    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="code" translate="appmanager.org.code.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="code" ng-model="vm.item.OrgCode" placeholder="" required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="organizationname"
                translate="appmanager.org.organizationname.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="organizationname" ng-model="vm.item.OrgName"
                    placeholder="" required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="address" translate="appmanager.org.address1.lbl"></label>
            <div class="col-sm-12">
                <input type="text" id="Manualadd" class="form-control" name="address" ng-model="vm.item.AddressLine1"
                    ng-disabled="vm.item.candisable" placeholder="Address">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="address" translate="appmanager.org.address2.lbl"></label>
            <div class="col-sm-12">
                <input type="text" id="Manualadd" class="form-control" name="address" ng-model="vm.item.AddressLine2"
                    ng-disabled="vm.item.candisable" placeholder="Address">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="area" translate="Area"></label>
            <div class="col-sm-12">
                <input type="text" id="Manualadd" class="form-control" name="area" ng-model="vm.item.Area"
                    ng-disabled="vm.item.candisable" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="country" translate="appmanager.org.country.lbl"></label>
            <div class="col-sm-12">
                <countrycontrol country="vm.item.Country" countryid="vm.item.CountryId">
                </countrycontrol>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="state" translate="appmanager.org.state.lbl"></label>
            <div class="col-sm-12">
                <statecontrol pincodeid="vm.item.PinCodeId" pincode="vm.item.PinCode" area="vm.item.Area"
                    city="vm.item.City" cityid="vm.item.CityId" state="vm.item.State" stateid="vm.item.StateId"
                    country="vm.item.Country" countryid="vm.item.CountryId">
                </statecontrol>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="city" translate="appmanager.org.city.lbl"></label>
            <div class="col-sm-12">
                <citycontrol pincodeid="vm.item.PinCodeId" pincode="vm.item.PinCode" area="vm.item.Area"
                    stateid="vm.item.StateId" city="vm.item.City" cityid="vm.item.CityId"></citycontrol>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="pincode" translate="appmanager.org.postcode.lbl"></label>
            <div class="col-sm-12">
                <pincodecontrol pincodeid="vm.item.PinCodeId" pincode="vm.item.PinCode" area="vm.item.Area"
                    city="vm.item.City" cityid="vm.item.CityId" state="vm.item.State" stateid="vm.item.StateId"
                    country="vm.item.Country" countryid="vm.item.CountryId" district="vm.item.District"
                    districtid="vm.item.DistrictId"></pincodecontrol>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" translate="appmanager.org.isactive.lbl"></label>
            <div class="col-sm-12">
                <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="vm.item.IsActive">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" translate="appmanager.dept.logo.lbl"></label>
            <div class="col-sm-12">
                <input style="border: 0;background: 0;border-radius: 0;" type="file" ngf-select
                    ng-model="currentcontext.file" name="file" ngf-max-size="200MB" />
            </div>
        </div>
        <div class="col-sm-6">
            <img class="item-logo-img" ng-show="!!currentcontext.file" ngf-thumbnail="currentcontext.file" />
            <img class="item-logo-img" ng-show="!currentcontext.file && vm.item.LogoPath"
                data-ng-src="data:image/png;base64,{{currentcontext.Logo}}" />
        </div>
        <div class="col-sm-6">
            <img class="item-logo-img" ng-show="!!currentcontext.file1" ngf-thumbnail="currentcontext.file1" />
            <img class="item-logo-img" ng-show="!currentcontext.file1 && vm.item.SecondLogoPath"
                data-ng-src="data:image/png;base64,{{currentcontext.SecondLogo}}" />
        </div>
    </form>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="pull-left">
            <button type="button" class="btn pyr-color10 btn-sm" ng-click="vm.backToList()"><i class="fa fa-angle-left"
                    aria-hidden="true"></i>&nbsp;&nbsp;<span class="btn-fontsize"
                    translate="common.backaction.lbl"></span></button>
        </div>
        <div class="pull-right">
            <button type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="vm.save()"></button>
            <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                ng-click="vm.saveAndApprove()"></button>
        </div>
    </div>
</div>
