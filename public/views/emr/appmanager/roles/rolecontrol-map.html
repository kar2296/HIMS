<style>
    .control-filter {
        margin-bottom: 10px;
    }

    .tree-div {
        padding-left: 30px;
    }
    .custom-modal-header {
    margin-bottom: 2px !important;
    background: #ffffff !important;
    color: #5b6c83;
    border-top-left-radius: 4px;
    border-top-right-radius: 4px;
    border: unset;
}
.search input[type="text"] {
    width: 300px !important;
    border-radius: 100px;
    padding: 12px;
    color: gray !important;
}
button#closebtn {
    color: #f44336;
    background: no-repeat;
    font-size: 26px;
    border: none;
    margin-top: -5px;
}
.alignright {
    display: flex;
    width: 100%;
    margin-left: 17%;
}
</style>
<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title col-sm-8" translate="appmanager.rolecontrol-map.pagetitle.lbl"></h4>

<div class="col-sm-4">
    <div class="alignright">
<div class="search">
    <input type="text" class="form-control control-filter"
                                            ng-model="vm.currentcontext.treeFilter" translate
                                            translate-attr-placeholder="Search Your Menu Here...">
</div>
<button type="button" id="closebtn" translate="x"
ng-click="cancelCallback()"></button>
    </div>					
</div>
</div>

<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot" set-form-height>
                <div class="">
                    <div class="panel-heading">
                        <h3 class="panel-title">{{vm.currentcontext.role}}</h3>
                    </div>
                    <div class="">
                        <div class="row">
                            <div class="col-sm-12">
                                <div class="col-sm-12 tree-div">
                                    <div ivh-treeview="vm.rCntrlDataList1" ivh-treeview-expand-to-depth="-1"
                                        ivh-treeview-filter="vm.currentcontext.treeFilter"></div>
                                </div>
                                <div class="col-sm-12 tree-div">
                                    <div ivh-treeview="vm.rCntrlDataList2" ivh-treeview-expand-to-depth="-1"
                                        ivh-treeview-filter="vm.currentcontext.treeFilter"></div>
                                </div>
                                <!-- <div class="col-sm-6">
                                </div> -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="fooder-bgs" style="margin: 5px;">
                <div class="pull-right">
                    <button type="button" ng-click="vm.saveItem()" class="draftbutton"
                        translate="common.saveaction.lbl"></button>

                </div>
            </div>
        </form>
    </div>
</div>
