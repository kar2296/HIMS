<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="code" translate="appmanager.role.code.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="code" ng-model="item.RoleCode" placeholder="" required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="rolename" translate="appmanager.role.rolename.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="rolename" ng-model="item.RoleName" placeholder=""
                    required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" translate="appmanager.role.roledetails.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="roledetails" ng-model="item.Description" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" translate="Is Active"></label>
            <div class="col-sm-1 col-md-1">
                <input type="checkbox" name="IsActive" class="custom-checkbox" ng-model="item.IsActive">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" translate="Is AllFacility"></label>
            <div class="col-sm-1 col-md-1">
                <input type="checkbox" name="AllFacility" class="custom-checkbox" ng-model="item.IsAllFacility">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="landingcontrol"
                translate="appmanager.role.landingcontrol.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.LandingControlId" name="landingcontrol">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 40 : 0}}
                        <span ng-if="$select.selected.Text.length>40">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Control | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </form>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="pull-left">
            <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()">
                <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                <span class="btn-fontsize" translate="common.backaction.lbl"></span>
            </button>

        </div>
        <div class="pull-right">
            <button type="submit" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
            <button type="button" class="draftbutton"
                translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
            <!-- <button id="btnClearForm" type="button" class="btn btn-warning btn-sm"
                                    ng-click="clear()" translate="common.clearaction.lbl"></button> -->
            <!-- <button id="btnCancelForm" type="button" class="cancelbutton"
                                    ng-click="backToList()" translate="common.cancelaction.lbl"></button> -->
        </div>
    </div>
</div>
