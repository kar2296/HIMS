<div class="row page-header">
    <h4 class="col-sm-4 mt0" translate="appmanager.referencevalue.pagetitle.lbl"></h4>
    <h4 class="col-sm-2 mt0 active" translate=" {{$state.params.groupCode}}" style="color: #f44336"></h4>
    <div class="col-sm-6">
        <div class="filters">
            <div class="search">
                <input type="text" id="pid" class="form-control" on-enter="getList()" ng-model="currentfilter.DescCode"
                    translate translate-attr-placeholder="Code/Name"> <i class="fas fa-search" aria-hidden="true"></i>
            </div>
            <button type="button" tabindex="-1" class="btn-add" ng-click="addNew()" uib-tooltip="Add Meta Value"
                tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="pull-left">
            <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()"><i class="fa fa-angle-left"
                    aria-hidden="true"></i>&nbsp;&nbsp;<span class="btn-fontsize"
                    translate="common.backaction.lbl"></span></button>
        </div>
    </div>
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
