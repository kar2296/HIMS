<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="appmanager.referencevalues.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">

        <div class="form-group col-sm-3">
            <label class="col-sm-12 control-label" for="valuecode"
                translate="appmanager.referencevalue.valuecode.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="valuecode" ng-model="item.ReferenceValueCode"
                    placeholder="" required>
            </div>
        </div>
        <div class="form-group col-sm-3">
            <label class="col-sm-12 control-label" for="description"
                translate="appmanager.referencevalue.description.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="description" ng-model="item.Description" placeholder=""
                    required>
            </div>
        </div>
        <div class="form-group col-sm-3">
            <label class="col-sm-12 control-label" for="valuecodeid"
                translate="appmanager.referencevalue.valuecodeid.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="valuecodeid" ng-model="item.ReferenceValueCodeId"
                    ng-disabled="currentcontext.id > 0" placeholder="" required ng-pattern="/^[0-9]{1,3}$/">
            </div>
        </div>
        <div class="form-group col-sm-3">
            <label class="col-sm-12 control-label" translate="appmanager.referencevalue.displayorder.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="displayorder" ng-model="item.DisplayOrder" placeholder="">
            </div>
        </div>

            </div>
        </div>
