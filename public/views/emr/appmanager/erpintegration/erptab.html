<style>
    .page-header {
    padding-top: 5px;
    padding-bottom: 1px;
    margin: 0px 0px 1px 0px !important;
}
.nav-tabs > li > a { padding: 2px 11px;}
  .profile-header img{
        border-radius:4px;
        height: 60px;
        width: 55px;
        margin-top: 2px;
    }
    .patient-action-btn {
        margin-top : 15px !important;
        margin-right : 5px !important;
    }
    .thumbnail {
     margin-bottom: 0px; }
#profileicons .nav > li > a:hover, .nav > li > a:focus {
    text-decoration: none;
    background-color: rgb(229, 158, 35);}
#profileicons .navbar-nav > li > .dropdown-menu {
    margin-top: 36px;
	padding:10px;
    border-radius: 6px;
    background-color: #255779;
	
}
.navbar-nav>li>a {
    padding-top: 1px;
    padding-bottom: 2px;
}
</style>

<div class="row page-header">
     <div class="col-sm-12">
   
     <h4 class="mt0 col-sm-6" translate="appmanager.erptab.pagetitle.lbl"></h4>
     </div>	
</div>
<div class="row">
    <div class="col-sm-12">
         <uib-tabset active="active">
            <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)" disable="tab.canDisable">
            </uib-tab>
        </uib-tabset>
		
		<div ui-view></div>
    </div>
</div>
