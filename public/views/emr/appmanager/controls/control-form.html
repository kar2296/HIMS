<style>
    .user-img {
        width: 80px !important;
        height: 80px !important;
    }
    
    set-tab-form-height {
        height: 501px !important;
    }
    
    #depheight .well {
        min-height: 378px;
    }
    
    #depheight .well1 {
        min-height: 184px;
    }
    
    #depheight .formRoot {
        overflow: auto;
        height: 538px !important;
    }
    
    .panel-body .well1 {
        min-height: 20px;
        padding: 19px;
        margin-bottom: 0;
        border: 1px solid #ededed;
        border-radius: 4px;
        background: #e9f6fd;
        background: -moz-linear-gradient(top, rgba(233, 246, 253, 1) 0, rgba(211, 238, 251, 1) 100%);
        background: -webkit-linear-gradient(top, rgba(233, 246, 253, 1) 0, rgba(211, 238, 251, 1) 100%);
        background: linear-gradient(to bottom, #fafafa 0, #f7fcfd 100%);
        filter: progid: DXImageTransform.Microsoft.gradient( startColorstr='#e9f6fd', endColorstr='#d3eefb', GradientType=0);
        box-shadow: 4px 2px 13px -7px rgba(0, 0, 0, .75);
    }
</style>
<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-5 col-md-4">
            <h3 class="panel-title" translate="appmanager.control-form.pagetitle.lbl"></h3>
        </div>
        <div class="col-sm-7 col-md-8">
           <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addNew()" uib-tooltip="{{ 'appmanager.control-list.addnew-tooltip.lbl' | translate
}}" tooltip-placement="bottom"><i class="fa fa-plus" aria-hidden="true"></i><span translate="clinicalmaster.serviceitem-list.addnew.lbl"></span></button>

        </div>
    </div>
</div>
<div class="row" id="depheight">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot">
                <div class="panel panel-default">
                    <!--   <div class="panel-heading"><h3 class="panel-title" translate="appmanager.referencevaluegroup.pnlgeneral.lbl"></h3></div> -->
                    <div class="panel-body form-panel bg-pattern">
                        <div class="col-sm-12">
                            <!-- leftpanel -->
                            <div class="col-sm-6">
                                 <div class="col-sm-12 well">
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="display" translate="appmanager.control-form.display.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="display" ng-model="item.Display" placeholder="" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="parentcontrol" translate="appmanager.control-form.parentcontrol.lbl"></label>
                                    <div class="col-sm-8">
                                        <ui-select ng-model="item.ParentControlId" name="parentcontrol">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Control | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="parentcontrolcode" translate="appmanager.control-form.parentcontrolcode.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="parentcontrolcode" ng-model="item.ParentControlCode" placeholder="">
                                    </div>
                                </div>
                                 <div class="form-group">
                                    <label class="col-sm-4 control-label" for="parentcontrolcode" translate="appmanager.control-form.controlcode.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="parentcontrolcode" ng-model="item.ControlCode" placeholder="">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="type" translate="appmanager.control-form.type.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="type" ng-model="item.ControlType" placeholder="" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="position" translate="appmanager.control-form.position.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="position" ng-model="item.ControlPosition" placeholder="" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="modulecode" translate="appmanager.control-form.modulecode.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="modulecode" ng-model="item.ModuleCode" placeholder="">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="context" translate="appmanager.control-form.context.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="context" ng-model="item.Context" placeholder="">
                                    </div>
                                </div>
                                 <div class="form-group">
                                        <label class="col-sm-4 control-label"></label>

                                        <label class="col-sm-1 control-label" translate="appmanager.control-form.emr.lbl"></label>
                                        <div class="col-sm-1" "ng-click=isEMR()">
                                            <input type="checkbox" name="sms" class="custom-checkbox" ng-change="getcheckbox( item.IsEMR,'#emr#')" ng-model="item.IsEMR">
                                        </div>
                                        <label class="col-sm-1 control-label" translate="appmanager.control-form.ipemr.lbl"></label>
                                        <div class="col-sm-1">
                                            <input type="checkbox" name="comnemail" class="custom-checkbox" ng-change="getcheckbox( item.IsIPEMR,'#ipemr#')" ng-model="item.IsIPEMR">
                                        </div>
                                         <label class="col-sm-1 control-label" translate="appmanager.control-form.portal.lbl"></label>
                                        <div class="col-sm-1">
                                            <input type="checkbox" name="sms" class="custom-checkbox" ng-change="getcheckbox( item.IsPortal,'#patientportal#')" ng-model="item.IsPortal">
                                        </div>
                                        <label class="col-sm-1 control-label" translate="appmanager.control-form.pmhx.lbl"></label>
                                        <div class="col-sm-1">
                                            <input type="checkbox" name="comnemail" class="custom-checkbox" ng-change="getcheckbox( item.IsPMHx,'#pmhx#')" ng-model="item.IsPMHx">
                                        </div>
                                    <label class="col-sm-4 control-label"></label>

 
                                          <label class="col-sm-1 control-label" translate="appmanager.control-form.main.lbl"></label>
                                         <div class="col-sm-1">
                                            <input type="checkbox" name="comnemail" class="custom-checkbox" ng-change="getcheckbox( item.IsMain,'#main#')" ng-model="item.IsMain">
                                        </div>
                                    

                                    </div>

                            </div>
                            </div>
                            
                            <!-- rightpanel -->
                            <div class="col-sm-6">
                                <div class="col-sm-12 well">
                                                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="sref" translate="appmanager.control-form.sref.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="sref" ng-model="item.SRef" placeholder="" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="iconref" translate="appmanager.control-form.iconref.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="iconref" ng-model="item.IconRef" placeholder="">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="translateref" translate="appmanager.control-form.translateref.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="translateref" ng-model="item.TranslateRef" placeholder="" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="params" translate="appmanager.control-form.params.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="params" ng-model="item.Params" placeholder="">
                                    </div>
                                </div>
                                <div class="form-group">
                                        <label class="col-sm-4 control-label" for="params" translate="appmanager.control-form.displayorder.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="params" ng-model="item.DisplayOrder"  placeholder="" ng-pattern="/^\d+$/" ng-required="false">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" translate="appmanager.control-form.isactive.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
                                        </div>
                                    </div>
                            </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="fooder-bgs">
                <div class="row ">
                    <div class="col-sm-12">
                        <div class="pull-left">
                            <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()"><i class="fa fa-angle-left" aria-hidden="true" ></i>&nbsp;&nbsp;<span class="btn-fontsize"  translate="common.backaction.lbl"></span></button>

                        </div>
                        <div class="pull-right">
                           <button type="submit" class="draftbutton" ng-click="save()"  translate="common.saveaction.lbl"></button>
                            <button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                               
                                <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
