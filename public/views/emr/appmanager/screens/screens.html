<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="appmanager.screen.pagetitle.lbl"></h4>


    <div class="col-sm-6">
        <button class="btn bt-color3 btn-xs pull-right btn-filter" ng-click="" uib-tooltip="{{ '  appmanager.roles.advancefilter-tooltip.lbl' | translate

 }}" tooltip-placement="bottom"><i class="fa fa-filter" aria-hidden="true"></i>&nbsp;&nbsp;<span translate="clinicalmaster.serviceitem-list.filter.lbl"></span></button>
        <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addNew()" uib-tooltip="View Screen" tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i><span translate="clinicalmaster.serviceitem-list.addnew.lbl"></span></button>
    </div>
</div>	

  <div class="row filter-area">
        <div class="col-sm-12">
                <div class="col-sm-10"></div>
                <div class="col-sm-2">
                    <button class="btn btn-default btn-sm pull-right" ng-click="addNew()">
                        <i class="fa fa-plus" aria-hidden="true"></i>
                    </button>
                    <button class="btn btn-default btn-sm pull-right btn-filter">
                        <i class="fa fa-filter" aria-hidden="true"></i>
                    </button>
                </div>
        </div>
</div>

<div class="container-fluid" id="depsheight">
    <div ui-grid="vm.gridConfig" class="table-uigrid table-uigrid-tab "></div>

   <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
