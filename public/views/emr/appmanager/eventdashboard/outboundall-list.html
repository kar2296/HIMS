<style>
    .pager-div {
        float: right;
        right: 0;
        box-sizing: border-box;
        position: fixed;
        box-sizing: border-box;
    }
</style>

<div class="">






</div>

<div class="row filter-area">
    <div class="col-sm-12"> 
        <div class="col-sm-4">
            <label class="col-sm-4 control-label filter-lbl" translate="appmanager.facilitys.filter_status.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.EventStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.EventStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>

        <div class="col-sm-3"> 
            <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addNew()" uib-tooltip="{{ 'appmanager.eventdashboardtab.addnew-tooltip.lbl' | translate}}"
                tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i><span translate="appmanager.eventdashboardtab.create.lbl"></span></button>
        </div>
    </div>
</div>

<div class="container-fluid single-filter">
    <!-- <div ui-grid="vm.gridConfig" class="table-uigrid"></div> -->
    <custom-table config="vm.gridConfig"></custom-table>
    <div class="fooder-bgs">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
