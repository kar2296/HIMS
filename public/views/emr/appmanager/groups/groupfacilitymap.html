<style>
    .col-sm-6.btn {
        right: 0px !important;
    }
    </style>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
                <div class="panel panel-default bg-pattern">
                <!--      <div class="panel-heading"><h3 class="panel-title" translate="appmanager.groupfacilitymap.pnlgeneral.lbl"></h3></div> -->
                    <div class="panel-body form-panel">
                                                    <div id="">

                        <div class="col-sm-12">
                            <!-- leftpanel -->
                            <div class="col-sm-12">
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" translate="Hospital"></label>
                                    <div class="col-sm-8">
                                         <ui-select multiple ng-model="item.map" class="ui-select-multiple"
                                            ng-map-control pivot-prop="GroupId" map-prop="FacilityId"
                                            pivot-prop-val="{{currentcontext.id}}">
                                            <ui-select-match>{{$item.Text }}</ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                            </div>
                            
              
                        </div>
                    </div>
                    <div class="fooder-bgs">
                        <div class="pull-left">
                            <button type="button" class="btn btn-sm pyr-color10" ng-click="backToForm()"><i class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button>
                        </div>
                            <div class="pull-right">
                                <button type="button" class="draftbutton" ng-click="save()" translate="common.saveaction.lbl"></button>
                                <button type="button" class="draftbutton text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                                <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                                <!-- <button id="btnCancelForm" type="button" class="cancelbutton" ng-click="backToForm()" translate="common.cancelaction.lbl"></button> -->
                        </div>
                    </div>
                       </div>

                </div>

        </form>
    </div>
</div>
