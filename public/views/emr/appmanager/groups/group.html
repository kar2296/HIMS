<div class="row" id="depheight">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot">
                <div class="panel panel-default">
                    <!--      <div class="panel-heading"><h3 class="panel-title" translate="appmanager.group.pnlgeneral.lbl"></h3></div> -->
                    <div class="panel-body form-panel bg-pattern">
                        <div class="col-sm-12">
                            <div class="form-group col-sm-3">
                                <label class="col-sm-12 control-label0" for="groupcode" translate="appmanager.group.groupcode.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="text" class="form-control" name="groupcode" ng-model="item.GroupCode" placeholder="" required>
                                </div>
                            </div>
                            <div class="form-group col-sm-3">
                                <label class="col-sm-12 control-label0" for="groupname" translate="appmanager.group.groupname.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="text" class="form-control" name="groupname" ng-model="item.GroupName" placeholder="" required>
                                </div>
                            </div>
                            <div class="form-group col-sm-3">
                                <label class="col-sm-12 control-label0" translate="appmanager.group.description.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="text" class="form-control" name="description" ng-model="item.Description" placeholder="">
                                </div>
                            </div>
                            <div class="form-group col-sm-3">
                                <label class="col-sm-12 control-label0" translate="appmanager.group.active.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="checkbox" name="active" class="custom-checkbox" ng-model="item.IsActive" ng-checked="item.IsActive == 1">
                                </div>
                            </div>
                            <div class="form-group col-sm-4">
                                <label class="col-sm-12 control-label0" translate="Is AllFacility"></label>
                                <div class="col-sm-1 col-md-1">
                                    <input type="checkbox" name="AllFacility" class="custom-checkbox" ng-model="item.IsAllFacility" ng-checked="item.IsDiet == 1">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="fooder-bgs">
                    <div class="row ">
                        <div class="col-sm-12">
                            <div class="pull-left">
                                <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()">
                                    <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                                    <span class="btn-fontsize" translate="common.backaction.lbl"></span>
                                </button>

                            </div>
                            <div class="pull-right">
                                <button type="submit" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
                                <button id="btnSaveApprove" type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                                    ng-click="saveAndApprove()"></button>
                                <!-- <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                                        <button id="btnCancelForm" type="button" class="cancelbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button> -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </form>
    </div>
</div>
