<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-12 ">
            <h4 class="page-header mt0" translate="appointment.appointmentsession-list.pagetitle.lbl"></h4>
        </div>
    </div>
    <div class="col-sm-12">
        <div class="col-sm-4">
            <label class="col-sm-4 control-label filter-lbl"
                translate="appointment.appointmentsession-list.filter_status.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4 ">
            <label class="col-sm-4 control-label filter-lbl" translate="Order Type"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.OrderTypeId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 15 : 0}}
                        <span ng-if="$select.selected.Text.length>15">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.VirtualSubCategory | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4">
            <div class="filters">
                <button type="button" tabindex="-1" translate="Add Slots" class="default-color2" ng-click="addNew()"
                    uib-tooltip="{{ 'Add Slots' | translate}}" tooltip-placement="bottom">
                </button>
            </div>
        </div>
    </div>
</div>

<div class="container-fluid onerow-filter filter">
    <custom-table config="vm.gridConfig"></custom-table>
    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
                items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
