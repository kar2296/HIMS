<!-- <link href="app/css/dashboard.css" rel="stylesheet"> -->
<meta charset="UTF-12">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    .user-img {
        width: 80px !important;
        height: 80px !important;
    }

    set-tab-form-height {
        height: 501px !important;
    }

    #depheight .well {
        min-height: 461px;
    }

    #depheight .well1 {
        min-height: 184px;
    }

    #depheight .formRoot {
        overflow: auto;
        /* height: 508px !important; */
    }

    .panel-body .well1 {
        min-height: 20px;
        padding: 19px;
        margin-bottom: 0;
        border: 1px solid #ededed;
        border-radius: 4px;
        background: #e9f6fd;
        background: -moz-linear-gradient(top, rgba(233, 246, 253, 1) 0, rgba(211, 238, 251, 1) 100%);
        background: -webkit-linear-gradient(top, rgba(233, 246, 253, 1) 0, rgba(211, 238, 251, 1) 100%);
        background: linear-gradient(to bottom, #fafafa 0, #f7fcfd 100%);
        filter: progid: DXImageTransform.Microsoft.gradient(startColorstr='#e9f6fd', endColorstr='#d3eefb', GradientType=0);
        box-shadow: 4px 2px 13px -7px rgba(0, 0, 0, .75);
    }

    .form-group.col-sm-4 {
        height: 70px;
    }
</style>
<div class="row page-header ng-scope" id="assets">
    <h3 class="col-sm-12 mt0 active ng-scope" translate="Manage Lab Center Profile"></h3>
</div>
<div class="row" id="depheight">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot appmanager_facility">
                <div class="panel panel-default">
                    <div class="panel-body form-panel bg-pattern">
                        <div class="form-group col-sm-4">
                            <label class="col-sm-12 control-label" for="code"
                                translate="appmanager.facility.code.lbl"></label>
                            <div class="col-sm-12">
                                <input type="text" class="form-control" name="code" uppercase
                                    ng-model="item.FacilityCode" placeholder="" required>
                            </div>
                        </div>
                        <div class="form-group col-sm-4">
                            <label class="col-sm-12 control-label" for="facilityname"
                                translate="appmanager.facility.facilityname.lbl"></label>
                            <div class="col-sm-12">
                                <input type="text" class="form-control" name="facilityname" uppercase
                                    ng-model="item.FacilityName" placeholder="" required>
                            </div>
                        </div>
                        <div class="form-group col-sm-4">
                            <label class="col-sm-12 control-label"
                                translate="registration.fullregistration.googleaddress.lbl"></label>
                            <div class="col-sm-10">
                                <input type="text" id="googleaddopt" tabindex="17" ng-disabled="disablegoogleaddopt"
                                    class="form-control" gm-places-autocomplete="autocompleteOptions"
                                    ng-model="autocompleteModel" />
                            </div>
                            <div class="col-sm-1 col-md-1 col-lg-1">
                                <input type="checkbox" name="googleaddressoption" class="custom-checkbox" tabindex="18"
                                    ng-click="enablegoogleaddopt()" ng-model="chkgoogleaddopt">
                            </div>
                        </div>
                        <div class="form-group col-sm-4">
                            <label class="col-sm-12 control-label0" for="address" translate="Address"></label>
                            <div class="col-sm-12">
                                <input type="text" id="Manualadd" class="form-control" name="address"
                                    ng-model="item.AddressLine1" ng-disabled="item.candisable" placeholder="Address">
                            </div>
                        </div>
                        <div class="form-group col-sm-4">
                            <label class="col-sm-12 control-label" for="mobile"
                                translate="registration.fullregistration.mobile.lbl"></label>
                            <div class="col-sm-12">
                                <input type="text" tabindex="14" ng-keyup="keyPress($event, 0, 'contactnr', 'aadharnr')"
                                    class="form-control" id="contactnr" MINLENGTH="10" MAXLENGTH="10" size="10" value=""
                                    name="mobile" onChange="numberonly($event)" onKeyUp="numberonly($event)"
                                    ng-keypress="numberonly($event)" ng-model="item.Mobile" required>
                            </div>
                        </div>
                        <div class="form-group col-sm-4">
                            <label class="col-sm-12 control-label0" for="resulttype" translate="Result Type"></label>
                            <div class="col-sm-12">
                                <radiogroupcontrol itemid="item.ResultFormatTypeId" items="lookup.ResultFormatType">
                                </radiogroupcontrol>
                            </div>
                        </div>
                        <div class="form-group col-sm-4">
                            <label class="col-sm-12 control-label" translate="appmanager.facility.email.lbl"></label>
                            <div class="col-sm-12">
                                <input type="email" class="form-control" name="email" ng-model="item.Email"
                                    placeholder="" ng-required="false">
                            </div>
                        </div>
                        <div class="form-group col-sm-4">
                            <label class="col-sm-12 control-label" translate="appmanager.facility.isactive.lbl"></label>
                            <div class="col-sm-12">
                                <input type="checkbox" ng-disabled="true" name="isactive" class="custom-checkbox"
                                    ng-model="item.IsActive">
                            </div>
                        </div>
                        <div class="form-group col-sm-4 ">
                            <label class="col-sm-12 control-label0" for="rescheduletime"
                                translate="Max. Reschedule Time(Mins)"></label>
                            <div class="col-sm-12">
                                <input type="text" class="form-control" name="rescheduletime"
                                    ng-model="item.MaxRescheduleTime" onChange="numberonly($event)"
                                    onKeyUp="numberonly($event)" ng-keypress="numberonly($event)" placeholder=""
                                    required>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="fooder-bgs" style="margin-bottom: 40px;">
        <div class="row ">
            <div class="col-sm-12">
                <div class="pull-right">
                    <button id="btnSave" type="button" class="draftbutton" translate="common.saveaction.lbl"
                        ng-click="save()"></button>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    $(".smallicon").click(function () {
        $(".smallicon").each(function () {

            $(this).removeClass("active");
        });
        $(this).addClass("active");
    });
</script>
