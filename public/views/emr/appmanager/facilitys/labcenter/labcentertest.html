<style>
    img.drhms-img-thumbnail {
        padding: 10px;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-12 ">
        <div class="col-sm-6">
            <h3 class="panel-title" translate="Manage Test"></h3>
        </div>
        <div class="col-sm-6">
            <div class="filters">
                <img src="../../../../../assets/svg/close.svg"  ng-click="cancelCallback()">
            </div>
            <!-- <button type="button" class="btn btn-danger btn-sm pull-right" translate="x"
                ng-click="cancelCallback()"></button> -->
        </div>
    </div>
</div>

<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="">
                <div class="row">
                    <div class="form-group col-sm-4">
                        <label class="col-sm-12 control-label0" for="itemcode"
                            translate="clinicalmaster.serviceitem-form.itemcode.lbl"></label>
                        <div class="col-sm-12">
                            <input type="text" class="form-control" name="itemcode" ng-model="item.ItemCode"
                                placeholder="" required>
                        </div>
                    </div>
                    <div class="form-group col-sm-4">
                        <label class="col-sm-12  control-label0" for="name" translate="Test Name"></label>
                        <div class="col-sm-12">
                            <input type="text" class="form-control" name="name" ng-model="item.Name" placeholder=""
                                required>
                        </div>
                    </div>
                    <div class="form-group col-sm-4">
                        <label class="col-sm-12 control-label0" for="description"
                            translate="clinicalmaster.serviceitem-form.description.lbl"></label>
                        <div class="col-sm-12">
                            <input type="text" class="form-control" name="description" ng-model="item.Description"
                                placeholder="">
                        </div>
                    </div>
                    <div class="form-group col-sm-4">
                        <label class="col-sm-12 control-label0" for="category" translate="Category"></label>
                        <div class="col-sm-12">
                            <ui-select ng-model="item.VirtualCategoryId" name="category"
                                ng-change="getvirtualsubcategory()" required>
                                <ui-select-match>
                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                </ui-select-match>
                                <ui-select-choices
                                    repeat="lookupitem.Id as lookupitem in lookup.VirtualCategory | filter: { Text: $select.search }">
                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                </ui-select-choices>
                            </ui-select>
                        </div>
                    </div>
                    <div class="form-group col-sm-4">
                        <label class="col-sm-12 control-label0" for="subcategory" translate="Sub Category"></label>
                        <div class="col-sm-12">
                            <ui-select ng-model="item.VirtualsubCategoryId" name="subcategory" required>
                                <ui-select-match>
                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                </ui-select-match>
                                <ui-select-choices
                                    repeat="lookupitem.Id as lookupitem in lookup.VirtualSubCategory | filter: { Text: $select.search }">
                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                </ui-select-choices>
                            </ui-select>
                        </div>
                    </div>
                    <div class="form-group col-sm-4">
                        <label class="col-sm-12 control-label0" for="itemcost"
                            translate="clinicalmaster.serviceitem-form.itemcost.lbl"></label>
                        <div class="col-sm-12">
                            <input type="text" class="form-control" name="itemcost" ng-model="item.ItemCost"
                                placeholder="" ng-change="computeAmount(item)" required>
                        </div>
                    </div>
                    <div class="form-group col-sm-4">
                        <label class="col-sm-12 control-label0" for="" translate="VAT(%)"></label>
                        <div class="col-sm-12">
                            <input type="text" class="form-control" name="" ng-model="item.VAT"
                                ng-change="computeAmount(item)" placeholder="">
                        </div>
                    </div>
                    <div class="form-group col-sm-4">
                        <label class="col-sm-12 control-label0" translate="appmanager.user.discountlimit.lbl"></label>
                        <div class="col-sm-12">
                            <ui-select ng-model="item.DiscountModeId" ng-change="computeAmount(item)">
                                <ui-select-match>
                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                </ui-select-match>
                                <ui-select-choices
                                    repeat="lookupitem.Id as lookupitem in lookup.DiscountMode | filter: { Text: $select.search }">
                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                </ui-select-choices>
                            </ui-select>
                        </div>
                    </div>
                    <div class="form-group col-sm-4">
                        <label class="col-sm-12 control-label0" translate="Discount"></label>
                        <div class="col-sm-12">
                            <input type="text" class="form-control" ng-model="item.DiscountAmount"
                                ng-change="computeAmount(item)" placeholder="">
                        </div>
                    </div>
                    <div class="form-group col-sm-4">
                        <label class="col-sm-12 control-label0" for="" translate="Net Price"></label>
                        <div class="col-sm-12">
                            <input type="text" class="form-control" name="" ng-model="item.NetPrice" disabled>
                        </div>
                    </div>
                    <div class="form-group col-sm-4">
                        <label class="col-sm-12 control-label0" for="isactive"
                            translate="clinicalmaster.serviceitem-form.isactive.lbl"></label>
                        <div class="col-sm-12">
                            <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
                        </div>
                    </div>
                    <div class="form-group col-sm-4" ng-show="CanShowMasterTest">
                        <label class="col-sm-12 control-label0" for="masteritem"
                            translate="clinicalmaster.serviceitem-form.masteritem.lbl"></label>
                        <div class="col-sm-12">
                            <autosearch itemid="item.MasterItemId" name="'masteritem'" iteminfo="item.SelectedItem"
                                rowdata="item" config="vm.testcontrolconfig" itemchange="testChanged($index,item)"
                                class="inputsearchlogo" candisable="IsDisabled"></autosearch>
                        </div>
                    </div>
                    <!-- <div class="col-sm-12">
                        <img class="item-logo-img" ng-show="!!currentcontext.file"
                            ngf-thumbnail="currentcontext.file" />
                        <img class="item-logo-img" ng-show="!currentcontext.file && item.Imagepath"
                            data-ng-src="data:image/png;base64,{{currentcontext.Image}}" />
                    </div>
                    <div class="form-group col-sm-4">
                        <label class="col-sm-12 control-label" translate="appmanager.dept.logo.lbl"></label>
                        <div class="col-sm-12">
                            <input type="file" ngf-select ng-model="currentcontext.file" name="file"
                                ngf-max-size="200MB" />
                        </div>
                    </div> -->

                    <div class="form-group col-sm-12">
                        <div class="row">
                            <div class="drhms-user_image">
                                <img class="patient-img drhms-img-thumbnail" ng-show="!!currentcontext.file"
                                    ngf-thumbnail="currentcontext.file" />
                                <img ng-show="!currentcontext.file && item.Imagepath"
                                    data-ng-src="data:image/png;base64,{{currentcontext.Image}}"
                                    class="patient-img drhms-img-thumbnail" />
                                <img ng-show="!currentcontext.file && !item.Imagepath" src="app/img/main/img.jpg"
                                    tabindex="-1" class="drhms-img-thumbnail ">
                            </div>
                            <div class="drhms-outer_ilayer">
                                <div class="drhms-profile-upload-btn">
                                    <input type="file" ng-disabled="SaveCompleted" ngf-select
                                        ng-model="currentcontext.file" tabindex="-1" name="file" id="drhms-input-file"
                                        class="inputfile" ngf-max-size="200MB" />
                                    <label for="file-1" class="drhms-upload-btn" ng-disabled="SaveCompleted"
                                        uib-tooltip="Upload" tooltip-placement="bottom">
                                        <span class="drhms-registration-btn">Upload</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="pull-left">
                    </div>
                    <div class="pull-right">
                        <button type="button" class="draftbutton text-white btn-sm"
                            translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
