<div class="row" id="breadcrumpheader-height">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
            <div class="formRoot">
                <div class="">
                    <div class="">
                        <!-- leftpanel -->
                        <div class="col-sm-12">
                            <div class="form-group col-sm-3">
                                <label class="col-sm-12 control-label" for="ordertype" translate="Order Type"></label>
                                <div class="col-sm-12">
                                    <ui-select ng-model="item.OrderTypeId" name="ordertype" required>
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                        </ui-select-match>
                                        <ui-select-choices
                                            repeat="lookupitem.Id as lookupitem in lookup.VirtualSubCategory | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                            </div>
                            <div class="form-group col-sm-3">
                                <label class="col-sm-12 control-label" for="sessiontype"
                                    translate="appointment.appointmentsession-form.sessiontype.lbl"></label>
                                <div class="col-sm-12">
                                    <ui-select ng-model="item.SessionTypeId" name="sessiontype"
                                        on-select="SelectedSession($select.selected)" required>
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                        </ui-select-match>
                                        <ui-select-choices
                                            repeat="lookupitem.Id as lookupitem in lookup.SessionType | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                            </div>
                            <div class="form-group col-sm-3">
                                <label class="col-sm-12 control-label" for="duration"
                                    translate="appointment.appointmentsession-form.duration.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="text" class="form-control" name="duration" ng-model="item.SlotDuration"
                                        placeholder="" required>
                                </div>
                            </div>
                            <div class="form-group col-sm-3">
                                <div class="form-group col-sm-6">
                                    <label class="col-sm-12 control-label" for="starttime"
                                        translate="appointment.appointmentsession-form.starttime.lbl"></label>
                                    <div class="col-sm-12">
                                        <uib-timepicker name="starttime" ng-model="item.StartTime" ng-time-object
                                            required>
                                        </uib-timepicker>
                                    </div>
                                </div>
                                <div class="form-group col-sm-6">
                                    <label class="col-sm-12 control-label" for="endtime"
                                        translate="appointment.appointmentsession-form.endtime.lbl"></label>
                                    <div class="col-sm-12">
                                        <uib-timepicker name="endtime" ng-model="item.EndTime" ng-time-object required>
                                        </uib-timepicker>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group col-sm-3">
                                <label class="col-sm-12 control-label" for="isactive"
                                    translate="clinicalmaster.chiefcomplaint-form.isactive.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="checkbox" name="isactive" class="custom-checkbox"
                                        ng-model="item.IsActive">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
    </div>
    <div class="fooder-bgs">
        <div class="row ">
            <div class="col-sm-12">
                <div class="pull-left">
                    <button class="btn pyr-color10 btn-sm" type="button" ng-click="backToList()">
                        <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                        <span class="btn-fontsize" translate="common.backaction.lbl"></span>
                    </button>
                </div>
                <div class="pull-right">
                    <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                        ng-click="saveAndApprove()"></button>
                    <!-- <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button> -->
                </div>
            </div>
        </div>
    </div>
    </form>
</div>
</div>
