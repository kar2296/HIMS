<style>
    .pager-div {
        float: right;
        right: 0;
        box-sizing: border-box;
        position: fixed;
        box-sizing: border-box;
    }
</style>
<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-5">
            <div class="col-sm-12 form-group">
                <label class="col-sm-4 control-label"
                    translate="clinicalmaster.serviceitem-list.filter_status.lbl"></label>
                <div class="col-sm-8">
                    <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 15 : 0}}
                            <span ng-if="$select.selected.Text.length>15">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
        </div>
        <div class="col-sm-7">
            <div class="filters">
                <div class="search">
                    <input type="text" id="pid" class="form-control" on-enter="getList()" ng-model="currentfilter.Code"
                        translate translate-attr-placeholder="Code/name">
                    <div class="drhms-search-icon"><i class="fas fa-search" aria-hidden="true"></i></div>
                </div>
                <button type="button" tabindex="-1" translate="Add Test" class="default-color2" ng-click="addNew()"
                    uib-tooltip="{{ 'Add Test' | translate}}" tooltip-placement="bottom">
                </button>
            </div>
        </div>
    </div>
</div>
<custom-table config="vm.gridConfig"></custom-table>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
