<style>
    .custom-modal-header { padding: 0px 11px !important; }
    #fullregistrationheight .well {min-height: 420px !important;}
</style>
<div class="row" id="fullregistrationheight">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot">
                <!-- leftpanel -->
                <div class="panel panel-default bg-pattern">
                    <div class="panel-body form-panel bg-pattern">
                        <div class="col-sm-12">
                            <div class="col-sm-6">
                                <div class="">
                                    <fieldset class="fsStyle well">
                                        <legend class="legendStyle">
                                            <span translate="appmanager.smssetting.smssetting.lbl"></span>
                                        </legend>
                                        <div class="form-group">
                                            <label class="col-sm-5 control-label" for="providername" translate="appmanager.smssetting.providername.lbl"></label>
                                            <div class="col-sm-7">
                                                <input type="text" class="form-control" name="providername" ng-model="item.sessiontimeout" placeholder="Provider Name">
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label class="col-sm-5 control-label" for="url" translate="appmanager.smssetting.url.lbl"></label>
                                            <div class="col-sm-7">
                                                <input type="text" class="form-control" name="url" ng-model="item.sessiontimeout" placeholder="http://boansms.aspx">
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label class="col-sm-5 control-label" for="username" translate="appmanager.smssetting.username.lbl"></label>
                                            <div class="col-sm-7">
                                                <input type="text" class="form-control" name="username" ng-model="item.sessiontimeout" placeholder="User Name">
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label class="col-sm-5 control-label" for="password" translate="appmanager.smssetting.password.lbl"></label>
                                            <div class="col-sm-7">
                                                <input type="text" class="form-control" name="password" ng-model="item.sessiontimeout" placeholder="Password">
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label class="col-sm-5 control-label" for="senderid" translate="appmanager.smssetting.senderid.lbl"></label>
                                            <div class="col-sm-7">
                                                <input type="text" class="form-control" name="senderid" ng-model="item.documentuploadsize" placeholder="Sender ID">
                                            </div>
                                        </div>
                                    </fieldset>
                                </div>
                            </div>

                            <!-- rightpanel -->
                            <div class="col-sm-6">
                                <div class="">
                                    <fieldset class="fsStyle well">
                                        <legend class="legendStyle">
                                            <span translate="appmanager.smssetting.emailsetting.lbl"></span>
                                        </legend>
                                        <div class="form-group">
                                            <label class="col-sm-5 control-label" for="providername" translate="appmanager.smssetting.providername.lbl"></label>
                                            <div class="col-sm-7">
                                                <input type="text" class="form-control" name="providername" ng-model="item.orderexpirydays" placeholder="Provider Name">
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label class="col-sm-5 control-label" for="url" translate="appmanager.smssetting.url.lbl"></label>
                                            <div class="col-sm-7">
                                                <input type="text" name="url" class="form-control" placeholder="https://app.sendgrid.com">
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label class="col-sm-5 control-label" for="username" translate="appmanager.smssetting.username.lbl"></label>
                                            <div class="col-sm-7">
                                                <input type="text" name="username" class="form-control" placeholder="User Name">
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label class="col-sm-5 control-label" for="creditnoteforbillcancellation" translate="appmanager.smssetting.password.lbl"></label>
                                            <div class="col-sm-7">
                                                <input type="text" name="password" class="form-control" placeholder="Password">
                                            </div>
                                        </div>    
                                    </fieldset>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="fooder-bgs">
                <div class="row ">
                    <div class="col-sm-12">
                        <div class="pull-left">
                            <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()"><i class="fa fa-angle-left" aria-hidden="true" ></i>&nbsp;&nbsp;<span class="btn-fontsize"  translate="common.backaction.lbl"></span></button>
                        </div>
                        <div class="pull-right">
                            <button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl" ng-if="!item.isRequested"
                                ng-click="save()"></button>
                            <button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                            <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                            <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
