<div class="row">
    <div class="col-sm-4">
        <label class="col-sm-4 control-label filter-lbl" translate="hrmaster.holiday.holidayname.lbl"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" name="leavename" on-enter="getList()"
                ng-model="currentfilter.HolidayName" placeholder="">
        </div>
    </div>
    <div class="col-sm-4">
        <label class="col-sm-4 control-label filter-lbl"
            translate="patientemr.patientfeedbacks-list.status.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 8 : 0}}
                    <span ng-if="$select.selected.Text.length>8">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="col-sm-4 ">
        <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addNew()"
            uib-tooltip="{{ 'hrmaster.leavesetting.holiday.lbl' | translate }}" tooltip-placement="bottom">
            <i class="fa fa-plus" aria-hidden="true"></i>
            <span translate="lis.containertypes.addnew.lbl"></span>
        </button>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
    <div class="pull-right">
        <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()">
            <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
            <span class="btn-fontsize" translate="common.backaction.lbl"></span>
        </button>
    </div>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
