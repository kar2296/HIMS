<style>
    .custom_item_form {
        padding-top: 10px !important;
    }

    .dynamicform-container {
        padding-top: 10px !important;
    }

    .formRoot {
        height: 480px !important;
    }

    .form-horizontal input {
        border: 1px solid #818080;
    }

    /* span.input-group-addon.cstm_findicon{
    left:4% !important;
} */
    i.fa.fa-search {
        display: none;
    }

    .btn-group label {
        background: navy;
        color: #fff;
        border: 1px solid;
    }

    .btn-group label:active:hover {
        background: crimson !important;
        color: #000000 !important;
    }
</style>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal custom_item_form" role="form">
            <div class="formRoot">
                <!-- <div class="btn-group">
                    <label class="btn btn-default" ng-repeat="cat in categories" ng-model="currentcontext.Category"
                        uib-btn-radio="'{{cat.Id}}'" ng-click="categoryClick(cat)">{{cat.Text}}</label>
                </div> -->
                <div class="col-sm-12 dynamicform-container">
                    <div class="panel-body form-panel bg-pattern">
                        <div class="col-sm-12">
                            <dynamicform modeldata="modeldata" schema="schema"></dynamicform>
                        </div>
                    </div>
                </div>
            </div>
            <div class="fooder-bgs">
                <div class="row">
                    <div class="col-sm-12">
                        <div class="pull-left">
                            <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()">
                                <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                                <span class="btn-fontsize" translate="common.backaction.lbl"></span></button>
                        </div>
                        <div class="pull-right" style="margin-right:40px;">
                            <button id="btnSave" type="button" class="draftbutton"
                                translate="common.saveaction.lbl" ng-click="saveItem()"></button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
