<style>
    .drhms-table th {
        color: #121111;
        background: #EFEFEF !important;
        border: 1px solid #D9D9D9 !important;
    }
</style>
<div class="margin-top">
    <div class="row">
        <div class="col-sm-12">
            <div class="col-sm-6">
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <button class="btn-add" ng-click="addNew()" uib-tooltip="Facility" tooltip-placement="bottom">
                        <i class="fa fa-plus" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="col-sm-12 app_defaultservices">
    <table class="drhms-table">
        <thead class="bg-subhead">
            <tr>
                <th><span translate="appmanager.facilitydefaultservice-list.servicename.lbl"></span><span
                        class="mandatory-asterix">*</span></th>
                <th><span translate="appmanager.facilitydefaultservice-list.qty.lbl"></span><span
                        class="mandatory-asterix">*</span></th>
                <th><span translate="appmanager.facilitydefaultservice-list.patienttype.lbl"></span><span
                        class="mandatory-asterix">*</span></th>
                <th><span translate="appmanager.facilitydefaultservice-list.visittype.lbl"></span>
                </th>
                <th><span translate="appmanager.facilitydefaultservice-list.guarantortype.lbl"></span><span
                        class="mandatory-asterix">*</span></th>
                <th><span translate="appmanager.facilitydefaultservice-list.guarantorname.lbl"><span
                            class="mandatory-asterix">*</span></span></th>
                <th><span translate="appmanager.facilitydefaultservice-list.eligibledaysfrom.lbl"></span><span
                        class="mandatory-asterix">*</span></th>
                <th><span translate="appmanager.facilitydefaultservice-list.eligibledays.lbl"></span><span
                        class="mandatory-asterix">*</span></th>
                <!-- <th><span translate="appmanager.facilitydefaultservice-list.noofvisitfree.lbl"></span><span class="mandatory-asterix">*</span></th> -->
                <th><span translate="clinicalmaster.serviceitemalias-list.status.lbl"></span></th>
                <th><span translate="common.actions_col.lbl"></span></th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="item in vm.items | filter:{Status:1}">
                <td>
                    <autosearch itemid="item.ServiceItemId" iteminfo="item.SelectedItem" rowdata="item"
                        config="vm.serviceitemcontrolconfig" itemchange="" class="inputsearchlogo"
                        candisable="item.RdoServiceId"></autosearch>
                </td>
                <td>
                    <input type="text" class="form-control" ng-model="item.Quantity" placeholder="">
                </td>
                <td>
                    <ui-select ng-model="item.PatientTypeId" class="ui-select-grid">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.EncounterType | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </td>
                <td>
                    <ui-select ng-model="item.VisitTypeId" class="ui-select-grid">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.VisitType | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </td>
                <td>
                    <ui-select ng-model="item.GuarantorTypeId" class="ui-select-grid"
                        ng-change="guarantorTypeChange(item)">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.GuarantorType | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </td>
                <td>
                    <ui-select ng-model="item.GuarantorId" class="ui-select-grid">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.Guarantor | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </td>
                <td>
                    <input type="text" class="form-control" ng-model="item.EligibleDaysFrom" placeholder="">
                </td>
                <td>
                    <input type="text" class="form-control" ng-model="item.EligibleDays" placeholder="">
                </td>
                <td align="center">
                    <input type="checkbox" class="custom-checkbox" ng-model="item.StatusId">
                </td>
                <td align="center">
                    <img class="drhms-edit-button" src="assets/svg/edit.svg" alt="" ng-click="deleteItem($index,item)">
                    <!-- <img src="assets/svg/delete.svg" style="width: 22px;"
                            ng-click="deleteItem($index,item)"> -->
                </td>
            </tr>
        </tbody>
    </table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="pull-left">
            <button type="button" class=" btn btn-sm pyr-color10" ng-click="backToList()"><i
                    class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button>
        </div>
        <div class="pull-right">
            <button id="btnSaveForm" type="button" class="draftbutton" translate="common.saveaction.lbl"
                ng-click="saveItem()"></button>
            <!-- <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button> -->
            <!-- <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button> -->
        </div>
    </div>
</div>
