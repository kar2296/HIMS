        <h4 class="modal-title custom-modal-title" translate="appmanager.referencevaluegroup.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">

            <div class="form-group col-sm-6">
                <label class="col-sm-12 control-label0" for="groupcode"
                    translate="appmanager.referencevaluegroup.groupcode.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="groupcode" ng-model="item.GroupCode" placeholder=""
                        required>
                </div>
            </div>
            <div class="form-group col-sm-6">
                <label class="col-sm-12 control-label0" for="groupname"
                    translate="appmanager.referencevaluegroup.groupname.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="groupname" ng-model="item.GroupName" placeholder=""
                        required>
                </div>
            </div>
            <div class="form-group col-sm-6">
                <label class="col-sm-12 control-label0"
                    translate="appmanager.referencevaluegroup.description.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="description" ng-model="item.Description"
                        placeholder="">
                </div>
            </div>
            <div class="form-group col-sm-6">
                <label class="col-sm-12 control-label0" for="activefrom"
                    translate="appmanager.referencevaluegroup.activefrom.lbl"></label>
                <div class="col-sm-12">
                    <div class="datepicker">
                        <input type="text" class="form-control" name="activefrom" ng-date-object
                            datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                            placeholder="{{datePickerOptions.placeholder}}"
                            ng-click="activefromPopup = { opened: true }" is-open="activefromPopup.opened"
                            ng-model="item.ActiveFrom" required> <i class="fa fa-calendar" aria-hidden="true"></i>
                    </div>
                </div>
            </div>
            <div class="form-group col-sm-6">
                <label class="col-sm-12 control-label0" translate="appmanager.referencevaluegroup.activeto.lbl"></label>
                <div class="col-sm-12">
                    <div class="datepicker">
                        <input type="text" class="form-control" name="activeto" ng-date-object
                            datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                            placeholder="{{datePickerOptions.placeholder}}" ng-click="activetoPopup = { opened: true }"
                            is-open="activetoPopup.opened" ng-model="item.ActiveTo"> <i class="fa fa-calendar"
                            aria-hidden="true"></i>
                    </div>
                </div>
            </div>
            <div class="form-group col-sm-6">
                <label class="col-sm-12 control-label0"
                    translate="appmanager.referencevaluegroup.sortbydescription.lbl"></label>
                <div class="col-sm-12">
                    <input type="checkbox" name="sortbydescription" class="custom-checkbox"
                        ng-model="item.IsSortByDescription" ng-checked="item.IsSortByDescription == 1">
                </div>
            </div>
            <div class="form-group col-sm-6">
                <label class="col-sm-12 control-label0" translate="appmanager.referencevaluegroup.isactive.lbl"></label>
                <div class="col-sm-12">
                    <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
                </div>
            </div>
            <!-- <div class="form-group col-sm-6">
                                <label class="col-sm-12 control-label0"

                                <div class="col-sm-12">
                                    <input type="checkbox" name="issystem" class="custom-checkbox"
                                        ng-model="item.IsSystem">
                                </div>
                            </div> -->

        </div>
        <div class="row">
            <div class="pull-right">
                <button id="btnSave" type="button" class="draftbutton" translate="common.saveaction.lbl"
                    ng-click="save()"></button>
                <button id="btnSaveApprove" type="button" class="draftbutton text-white btn-sm"
                    translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                <!-- <button id="btnClearForm" type="button" class="btn btn-warning btn-sm"
                                    ng-click="clear()" translate="common.clearaction.lbl"></button> -->
                <!-- <button id="btnCancelForm" type="button" class="cancelbutton"
                                    ng-click="backToList()" translate="common.cancelaction.lbl"></button> -->
            </div>
        </div>
    </form>
</div>
