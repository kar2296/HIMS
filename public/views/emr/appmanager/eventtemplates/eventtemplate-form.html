<div class="row page-header">
    <h4 class="mt0" translate="appmanager.eventtemplate-form.pagetitle.lbl"><span class="ng-scope">EventTemplates</span>
    </h4>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-6 form-group">
            <label class="col-sm-12 control-label" for="templatekey"
                translate="appmanager.eventtemplate-form.templatekey.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="templatekey" ng-model="item.TemplateKey" required
                    placeholder="">
            </div>
        </div>
        <div class="col-sm-6 form-group">
            <label class="col-sm-12 control-label" for="modulename"
                translate="appmanager.eventtemplate-form.modulename.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="modulename" ng-model="item.ModuleName" required
                    placeholder="">
            </div>
        </div>
        <div class="col-sm-6 form-group">
            <label class="col-sm-12 control-label" for="eventtype"
                translate="appmanager.eventtemplate-form.eventtype.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.EventTypeId" name="eventtype" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.EventType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-6 form-group">
            <label class="col-sm-12 control-label" for="smstrigger"
                translate="appmanager.eventtemplate-form.smstrigger.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="smstrigger" ng-model="item.SmsTrigger" placeholder="">
            </div>
        </div>
        <div class="col-sm-6 form-group">
            <label class="col-sm-12 control-label" for="template"
                translate="appmanager.eventtemplate-form.template.lbl"></label>
            <div class="col-sm-12">
                <textarea id="tmplcontent" rows="6" name="template" ng-model="item.TemplateContent" required
                    maxlength="4000" style="width:100%;"></textarea>
            </div>
        </div>
        <div class="col-sm-6 form-group">
            <label class="col-sm-12 control-label" for="isactive"
                translate="appmanager.eventtemplate-form.isactive.lbl"></label>
            <div class="col-sm-12">
                <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
            </div>
        </div>

<div class="fooder-bgs">
    <div class="row">
        <div class="pull-left">
            <button class="btn pyr-color10 btn-sm" type="button" ng-click="backToList()">
                <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                <span class="btn-fontsize" translate="common.backaction.lbl"></span>
            </button>
        </div>
        <div class="pull-right">
            <button id="btnSave" type="button" class="draftbutton" translate="common.saveaction.lbl"
                ng-click="save()"></button>
            <button id="btnSaveApprove" type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
