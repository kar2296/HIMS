            <div id="page-editor">    
                <table class="table table-hover table-responsive table-bordered">
                    <thead class="bg-subhead">
                        <tr>
                            <th class="col-sm-4"><span translate="clinicalmaster.drugfrequencycategory-list.category.lbl"></span><span class="mandatory-asterix">*</span></th>

                            <th class="col-sm-2"><span translate="clinicalmaster.drugfrequencycategory-list.activefrom.lbl"></span><span class="mandatory-asterix">*</span></th>
                            <th class="col-sm-4"><span translate="clinicalmaster.drugfrequencycategory-list.activeto.lbl"></span></th>
                            <th class="col-sm-1"><span translate="registration.patientidentity-list.status.lbl"></span></th>
                            <th class="col-sm-1"><span translate="common.actions_col.lbl"></span></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="item in vm.items | filter:{Status:1}">
                            <td>
                                <ui-select ng-model="item.DrugFrequencyTypeId" name="type">
                                    <ui-select-match>
                                        {{$select.selected.Text | limitTo : 20 : 0}}
                                        <span ng-if="$select.selected.Text.length>20">...</span>
                                    </ui-select-match>
                                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.DrugFrequencyType | filter: { Text: $select.search }">
                                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                    </ui-select-choices>
                                </ui-select>
                            </td>
                            <td>



                                <input type="text" class="form-control" name="activefrom" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                    placeholder="{{datePickerOptions.placeholder}}" ng-click="activefromPopup = { opened: true }"
                                    is-open="activefromPopup.opened" ng-model="currentfilter.ActiveFrom">




                            </td>

                            <td>
                                <input type="text" class="form-control" name="activeto" ng-date-object datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                                    ng-click="activetoPopup = { opened: true }" is-open="activetoPopup.opened" ng-model="item.ActiveTo">
                            </td>
                            <td align="center">
                                <input type="checkbox" class="custom-checkbox" ng-model="item.StatusId">
                            </td>
                            <td>
                                <button class="btn btn-danger btn-xs" ng-click="deleteItem($index,item)">
                        <img class="drhms-edit-button" src="assets/svg/delete.svg" alt="">
                    </button>
                            </td>
                        </tr>
                    </tbody>
                </table>

                      <div class="footer-right">
