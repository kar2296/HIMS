<div class="row page-header">
    <h4 class="col-sm-3 mt0" translate="clinicalmaster.drugfrequency-list.pagetitle.lbl"></h4>
    <div class="col-sm-4">
        <label class="col-sm-4 control-label filter-lbl"
            translate="clinicalmaster.drugfrequency-list.filter_status.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="col-sm-5">
        <div class="filters">
            <div class="search">
                <input type="text" id="pid" class="form-control" name="filter_namecode" on-enter="getList()"
                    ng-model="currentfilter.Name" translate
                    translate-attr-placeholder="clinicalmaster.drugfrequency-list.filter_namecode.lbl"> <i
                    class="fas fa-search" aria-hidden="true"></i>

            </div>
            <button type="button" tabindex="-1" class="btn-add" ng-click="addNew()"
                uib-tooltip="{{ 'clinicalmaster.drugfrequency-list.addnew-tooltip.lbl' | translate }}"
                tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
                <!-- <span translate="clinicalmaster.serviceitem-list.addnew.lbl " class="text-white"></span> -->
            </button>
            <span class="drhms-billing-btn drhms-home-btn"><i class="fas fa-home" ng-click="backtoList()"
                    uib-tooltip="Dashboard" tooltip-placement="bottom"></i></span>
        </div>
    </div>
</div>

        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
