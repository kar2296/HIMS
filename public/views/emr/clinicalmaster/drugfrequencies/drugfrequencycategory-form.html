<div class="row page-header">
  <h4 class="col-sm-6 mt0" translate="clinicalmaster.drugfrequencycategory-form.pnldrugfrequencycategory.lbl"></h4>  
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">	
            
                <div class="panel panel-default bg-pattern">
                   <!-- <div class="panel-heading"><h3 class="panel-title" translate="clinicalmaster.drugfrequencycategory-form.pnldrugfrequencycategory.lbl"></h3></div>!-->
                    <div class="panel-body form-panel">
                        <div id="clinical">	
                        <div class="col-sm-12 well">			
                            
                            <!-- leftpanel -->
                            <div class="col-sm-8">
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="category" translate="clinicalmaster.drugfrequencycategory-form.category.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <ui-select ng-model="item.FrequencyCategoryId" name="category">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.FrequencyCategory | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="activefrom" translate="clinicalmaster.drugfrequencycategory-form.activefrom.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="activefrom" ng-date-object 
                                                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" 
                                                placeholder="{{datePickerOptions.placeholder}}" 
                                                ng-click="activefromPopup = { opened: true }" 
                                                is-open="activefromPopup.opened" ng-model="item.ActiveFrom" >
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="activeto" translate="clinicalmaster.drugfrequencycategory-form.activeto.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="activeto" ng-date-object 
                                                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" 
                                                placeholder="{{datePickerOptions.placeholder}}" 
                                                ng-click="activetoPopup = { opened: true }" 
                                                is-open="activetoPopup.opened" ng-model="item.ActiveTo" >
                                    </div>
                                </div>
                            </div>
                            
                            <!-- rightpanel -->
                            
                        </div>
                    </div>
                </div>
            </div>
            <div class="site-footer panel-footer">
                <button type="button" class="btn btn-sm pyr-color10" ng-click="backToList()"><i class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button>
                <div class="footer-right">
                    <button type="button" class="draftbutton" ng-click="save()" translate="common.saveaction.lbl"></button>
                    <button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                    <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>						
                </div>
            </div>
        </form>		
    </div>
</div>
