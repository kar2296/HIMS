<div class="row page-header">
    <h4 class="col-sm-3 mt0" translate="clinicalmaster.generic-list.pagetitle.lbl"></h4>


    <!-- <div class="col-sm-6">
        <button class="btn bt-color3 btn-xs pull-right btn-filter" ng-click="openAdvancedFilter()" uib-tooltip="{{ '  clinicalmaster.serviceitem-list.filter-tooltip.lbl' | translate 

 }}" tooltip-placement="bottom"><i class="fa fa-filter" aria-hidden="true"></i>&nbsp;&nbsp;<span translate="clinicalmaster.serviceitem-list.filter.lbl"></span></button>
        <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addNew()" uib-tooltip="{{ 'clinicalmaster.generic-list.addnew-tooltip.lbl' | translate
}}" tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i><span translate="clinicalmaster.serviceitem-list.addnew.lbl"></span></button>
    </div> -->
    <div class="col-sm-4">
        <label class="col-sm-4 control-label filter-lbl" style="color: black !important;" translate="clinicalmaster.generic-list.filter_status.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 8 : 0}}
                    <span ng-if="$select.selected.Text.length>8">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="col-sm-5">
        <div class="filters">
            <div class="search">
                <input type="text" id="pid" name="filter_name" on-enter="getList()" ng-model="currentfilter.GenericName" placeholder="" translate
                    translate-attr-placeholder="clinicalmaster.generic-list.filter_name.lbl">
                <i class="fas fa-search" aria-hidden="true"></i>

            </div>
            <button type="button" tabindex="-1" class="btn-add" ng-click="addNew()" uib-tooltip="{{ 'clinicalmaster.generic-list.addnew-tooltip.lbl' | translate }}"
                tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
                <!-- <span translate="clinicalmaster.serviceitem-list.addnew.lbl " class="text-white"></span> -->
            </button>

            <span class="drhms-billing-btn drhms-home-btn"  ng-click="backtoList()" uib-tooltip="Dashboard"
                tooltip-placement="bottom">
                <i class="fas fa-home"></i>
            </span>
        </div>
    </div>

</div>
