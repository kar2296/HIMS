<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="clinicalmaster.generic-form.pnldetails.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="panel-body form-panel">
                <div class="col-sm-12">
                    <div class="form-group col-sm-4">
                        <label class="col-sm-12 control-label" for="code"
                            translate="clinicalmaster.generic-form.code.lbl"></label>
                        <div class="col-sm-12">
                            <input type="text" class="form-control" name="code" ng-model="item.Code" placeholder=""
                                required>
                        </div>
                    </div>
                    <div class="form-group col-sm-4">
                        <label class="col-sm-12 control-label" for="genericname"
                            translate="clinicalmaster.generic-form.genericname.lbl"></label>
                        <div class="col-sm-12">
                            <input type="text" class="form-control" name="genericname" ng-model="item.GenericName"
                                placeholder="" required>
                        </div>
                    </div>
                    <div class="form-group col-sm-4">
                        <label class="col-sm-12 control-label" for="description"
                            translate="clinicalmaster.generic-form.description.lbl"></label>
                        <div class="col-sm-12">
                            <input type="text" class="form-control" name="description" ng-model="item.Description"
                                placeholder="">
                        </div>
                    </div>

                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div> -->
                    <div class="form-group col-sm-4">
                        <label class="col-sm-12 control-label" for="scheduletype"
                            translate="inventory.itemmaster.scheduletypeId.lbl"></label>
                        <div class="col-sm-12">
                            <ui-select ng-model="item.ScheduleTypeId" name="scheduletype">
                                <ui-select-match>
                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                </ui-select-match>
                                <ui-select-choices
                                    repeat="lookupitem.Id as lookupitem in lookup.ScheduleType | filter: { Text: $select.search }">
                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                </ui-select-choices>
                            </ui-select>
                        </div>
                    </div>
                    <div class="form-group col-sm-4">
                        <label class="col-sm-12 control-label" for="isprescribed"
                            translate="clinicalmaster.generic-form.isprescribed.lbl"></label>
                        <div class="col-sm-12">
                            <input type="checkbox" name="isprescribed" class="custom-checkbox"
                                ng-model="item.IsPrescribed">
                        </div>
                    </div>
                    <div class="form-group col-sm-4">
                        <label class="col-sm-7 col-md-12 control-label" for="isactive"
                            translate="clinicalmaster.generic-form.isactive.lbl"></label>
                        <div class="col-sm-12">
                            <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
                        </div>
                    </div>

            </div>
        </form>
