<style>
.table > thead > tr > th {
    padding: 5px 8px  !important;
    color: #000000 !important;
}
.table > tbody > tr > td  {
    border: 1px solid #ccc !important;
}
.table > tbody {
   background-color: rgb(245, 249, 238);
    box-shadow: 1px 1px 16px -3px rgba(0, 0, 0, 0.75);
}
.formRoot {
        margin-left: 10px;
        margin-right: 10px;
        margin-bottom: 0px;
        background-repeat: repeat;
        overflow: auto;height:495px;
    }
    .sr-only{height:22px;}
    #doublepage-editor .table>thead>tr>th{
        background-color: #135;
    }
</style>
<div class="row page-header">
<h4 class="col-sm-6 mt0" translate="clinicalmaster.servicesubcategory-list.pagetitle.lbl"></h4>
<div class="col-sm-6">
    <!-- <button class="btn bt-color3 btn-xs pull-right btn-filter" ng-click="" uib-tooltip="{{'clinicalmaster.serviceitem-list.filter-tooltip.lbl' | translate }}"
    tooltip-placement="bottom"><i class="fa fa-filter" aria-hidden="true"></i>&nbsp;&nbsp;<span translate="clinicalmaster.serviceitem-list.filter.lbl"></span></button> -->
    <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addNew()"
             uib-tooltip="{{ 'clinicalmaster.servicesubcategory-list.addnew-tooltip.lbl' | translate }}" tooltip-placement="bottom">
             <i class="fa fa-plus" aria-hidden="true"></i><span translate="clinicalmaster.serviceitem-list.addnew.lbl"></span></button>
</div>
</div>
  <div class="row filter-area">
    <div class="col-sm-12">
        <div class="col-sm-4">
            <label class="col-sm-6 col-md-5 control-label text-right filter-lbl" translate="clinicalmaster.servicesubcategory-list.filter_facility.lbl"></label>
            <div class="col-sm-6 col-md-6">
                <ui-select ng-model="currentfilter.FacilityId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-6 col-md-5 text-right control-label filter-lbl" translate="clinicalmaster.servicesubcategory-list.filter_sourcetype.lbl"></label>
            <div class="col-sm-6 col-md-6">
                <ui-select ng-model="currentfilter.SourceTypeId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.SourceType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-6 col-md-5 text-right control-label filter-lbl"  translate="clinicalmaster.servicesubcategory-list.filter_name.lbl"></label>
            <div class="col-sm-6 col-md-6 input-group"><div class="input-group-addon"><i class="fas fa-search" aria-hidden="true"></i></div>
                <input type="text" class="form-control" name="filter_name" on-enter="getList()" ng-model="currentfilter.Name" 
                            translate translate-attr-placeholder="clinicalmaster.servicesubcategory-list.filter_name.lbl">
            </div>
        </div>
        </div>
        <div class="col-sm-12 searchpadding">
        <div class="col-sm-4">
            <label class="col-sm-6 col-md-5 text-right control-label filter-lbl" translate="clinicalmaster.servicesubcategory-list.filter_itemcategory.lbl"></label>
            <div class="col-sm-6 col-md-6">
                <ui-select ng-model="currentfilter.ServiceCategoryId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ServiceCategory | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-6 col-md-5 text-right control-label filter-lbl" translate="clinicalmaster.servicesubcategory-list.filter_status.lbl"></label>
            <div class="col-sm-6 col-md-6">
                <ui-select ng-model="currentfilter.StatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.OrderMasterStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </div>
      
</div>
<div id="doublepage-editor">
    <table class="table table-hover table-responsive table-bordered">
        <thead class="bg-subhead">
            <tr>
                <th class="col-sm-2"><span translate="clinicalmaster.servicesubcategory-list.facility.lbl"></span><span class="mandatory-asterix">*</span></th>
                <th class="col-sm-1"><span translate="clinicalmaster.servicesubcategory-list.code.lbl"></span><span class="mandatory-asterix">*</span></th>
                <th class="col-sm-2"><span translate="clinicalmaster.servicesubcategory-list.subcategory.lbl"></span><span class="mandatory-asterix">*</span></th>
                <th class="col-sm-2"><span translate="clinicalmaster.servicesubcategory-list.description.lbl"></span></th>
                <th class="col-sm-2"><span translate="clinicalmaster.servicesubcategory-list.category.lbl"></span><span class="mandatory-asterix">*</span></th>
                <th class="col-sm-1"><span translate="clinicalmaster.servicesubcategory-list.displayorder.lbl"></span></th>
                <th class="col-sm-1"><span translate="clinicalmaster.servicesubcategory-list.status.lbl"></span></th>
                <th class="col-sm-2"><span translate="common.actions_col.lbl"></span></th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="item in vm.items | filter:{Status:1}">
                <td>
                <ui-select ng-model="item.FacilityId" class="ui-select-grid">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                    </ui-select>
                </td>
                <td>
                    <input type="text" class="form-control" ng-model="item.ServiceCategoryCode" placeholder="">
                </td>
                <td>
                    <input type="text" class="form-control" ng-model="item.ServiceCategoryName" placeholder="">
                </td>
                <td>
                    <input type="text" class="form-control" ng-model="item.Description" placeholder="">
                </td>
                <td>
                    <ui-select ng-model="item.ParentServiceCategoryId" class="ui-select-grid" ng-change="serviceCategoryChange($select.selected, item)">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ServiceCategory | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                    </ui-select>
                </td>
                <td>
                    <input type="text" class="form-control" ng-model="item.DisplayOrder" placeholder="">
                </td>
                <td align="center">
                    <input type="checkbox" class="custom-checkbox" ng-model="item.StatusId">
                </td>
                <td align="center">
                    <button class="btn btn-success btn-xs" ng-click="moreDetails($index,item)" uib-tooltip="{{'clinicalmaster.servicesubcategory-list.more-tooltip.lbl' | translate }}" 
                    tooltip-placement="bottom"><i class="fa fa-plus" aria-hidden="true"></i>
                    </button>
                    <button class="drhms-edit-button" ng-click="deleteItem($index,item)">
                        <img src="assets/svg/delete.svg" alt="">
                    </button>    
                </td>
            </tr>
        </tbody>
        </table>
    </div>
    <div class="container-fluid">
    <div class="site-footer panel-footer">
        <div class="footer-right">
            <button type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="saveItem()"></button>
            <button type="button" class="draftbutton" ng-click="clear()" translate="common.clearaction.lbl"></button>
        </div>
    </div>
    </div>
