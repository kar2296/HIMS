 <style>
 .modal-content .panel-body{ overflow: inherit;}
 #clinical { overflow: inherit;}
 .bg-pattern { overflow: inherit;}
</style>
<div class="modal-header custom-modal-header">
     <div class="col-sm-12 ">
            <h3 class="panel-title" translate="clinicalmaster.allergyreaction-form.pnlallergyreaction.lbl"></h3>
        </div>
     </div>
 </div> 
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">	
        
                <div class="panel panel-default bg-pattern">
                    <!--<div class="panel-heading"><h3 class="panel-title" translate="clinicalmaster.allergyreaction-form.pnlallergyreaction.lbl"></h3></div>-->
                    <div class="panel-body form-panel">	
                       		
                            <div id="clinical">
                                <div class="col-sm-12">
                            <!-- leftpanel -->
                           <div class="col-sm-6 well clinical_poup">
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="displayid" translate="clinicalmaster.allergyreaction-form.displayid.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="displayid" ng-model="item.DisplayId" placeholder="" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="reactionname" translate="clinicalmaster.allergyreaction-form.reactionname.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="reactionname" ng-model="item.AllergyReactionName" placeholder="" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="type" translate="clinicalmaster.allergyreaction-form.type.lbl"></label>
                                    <div class="col-sm-8">
                                        <ui-select ng-model="item.AllergyReactionTypeId" name="type" autofocus required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.AllergyReactionType | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="referrencelink" translate="clinicalmaster.allergyreaction-form.referrencelink.lbl"></label>
                                    <div class="col-sm-5">
                                        <input type="text" class="form-control" name="referrencelink" ng-model="item.ReferrenceLink"
                                            translate translate-attr-placeholder="common.reflink-placeholder.lbl">
                                    </div>
                                    <div class="col-sm-3 linkchecker-div">
                                        <linkchecker url="item.ReferrenceLink"></linkchecker>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="description" translate="clinicalmaster.allergyreaction-form.description.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="description" ng-model="item.Description" placeholder="" >
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="isactive" translate="clinicalmaster.allergyreaction-form.isactive.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="checkbox" name="isactive" class="custom-checkbox"
                                            ng-model="item.IsActive">
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-6 cust_well">
                                    <div class="form-group">
                                            <label class="col-sm-4 control-label ng-scope"><span class="ng-scope">Comments</span></label>
                                            <div class="col-sm-8">
                                                <textarea name="comments" ng-model="item.SpecialInstruction" maxlength="4000" style="width: 100%; margin-top: 10px; margin-bottom: 0px; height: 71px;" class="notes-textarea ng-pristine ng-valid ng-empty ng-valid-maxlength ng-touched" ng-disabled="item.isl" tabindex="-1"></textarea><div class="validation ng-scope ng-hide" ng-show="attrs.required==''|| attrs.required"><ul class="list-unstyled validation-errors ng-inactive ng-hide" ng-messages="field.$error" ng-show="field.$invalid &amp;&amp; (field.$touched || field.$dirty || form.$triedSubmit)">
                                                    </ul><div class="validation-success" ng-show="field.$valid &amp;&amp; !field.$invalid">
                                                        </div></div>
                                            </div>
                                        </div>
                                       
                                       
                            </div>
                        </div>
                    </div>
                </div>
                            </div>
<div class="panel-footer formactionbar">
                <div class="pull-right">
                    <button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
                    <button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                    <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>						
                </div>
            </div>
        </form>		
    </div>
</div>
