<style>
    .panel-body.form-panel {
        overflow-x: hidden;
    }

    .form-group {
        margin-bottom: 6px;
        height: 70px;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-12 ">
        <div class="col-sm-6">
            <h3 class="panel-title" ng-hide="TempType=='medical'"
                translate="clinicalmaster.notetemplate-list.pnltitle.lbl"></h3>
            <h3 class="panel-title" ng-show="TempType=='medical'"
                translate="clinicalmaster.notetemplate-list.pnldisctitle.lbl"></h3>
        </div>
        <div class="col-sm-6">
            <div class="filters">
                <img src="../../../../../assets/svg/close.svg"  ng-click="cancelCallback()">
            </div>
        </div>
    </div>
</div>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div>
                <div class="row">
                    <div class="col-sm-4 form-group">
                        <label class="col-sm-12 control-label" for="code"
                            translate="clinicalmaster.notetemplate-list.templatecode.lbl"></label>
                        <div class="col-sm-12">
                            <input type="text" class="form-control" name="code" ng-model="item.Code" placeholder=""
                                required>
                        </div>
                    </div>
                    <div class="col-sm-4 form-group">
                        <label class="col-sm-12 control-label" for="type"
                            translate="clinicalmaster.notetemplate-list.templatetype.lbl"></label>
                        <div class="col-sm-12">
                            <ui-select ng-model="item.NoteTypeId">
                                <ui-select-match>
                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                </ui-select-match>
                                <ui-select-choices
                                    repeat="lookupitem.Id as lookupitem in lookup.NoteType | filter: { Text: $select.search }">
                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                </ui-select-choices>
                            </ui-select>
                        </div>
                    </div>
                    <div class="col-sm-4 form-group">
                        <label class="col-sm-12 control-label" translate="appmanager.user.subdepartment.lbl"></label>
                        <div class="col-sm-12">
                            <ui-select ng-model="item.SubDepartmentId" on-select="onDeptSelected($select.selected)">
                                <ui-select-match>
                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                </ui-select-match>
                                <ui-select-choices
                                    repeat="lookupitem.Id as lookupitem in lookup.SubDepartment | filter: { Text: $select.search }">
                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                </ui-select-choices>
                            </ui-select>
                        </div>
                    </div>

                    <div class="col-sm-4 form-group">
                        <label class="col-sm-12 control-label" for="name"
                            translate="clinicalmaster.notetemplate-list.templatename.lbl"></label>
                        <div class="col-sm-12">
                            <input type="text" class="form-control" name="name" ng-model="item.TemplateName"
                                placeholder="" required>
                        </div>
                    </div>
                    <div class="col-sm-4 form-group">
                        <label class="col-sm-12 control-label" for="department"
                            translate="clinicalmaster.notetemplate-list.department.lbl"></label>
                        <div class="col-sm-12">
                            <ui-select ng-model="item.DepartmentId" name="department" ng-change="getsubdeptUsers()"
                                required>
                                <ui-select-match>
                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                </ui-select-match>
                                <ui-select-choices
                                    repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                </ui-select-choices>
                            </ui-select>
                        </div>
                    </div>
                    <div class="col-sm-4 form-group">
                        <label class="col-sm-12 control-label" for="isactive"
                            translate="inventory.itemmaster.isactive.lbl"></label>
                        <div class="col-sm-12">
                            <input type="checkbox" class="custom-checkbox" name="isactive" ng-model="item.IsActive">
                        </div>
                    </div>
                </div>

                <!-- Modern Quill v2-based Rich Text Editor (replaces legacy CKEditor 4) -->
                <div class="row" style="margin-top: 8px;">
                    <div class="col-sm-12">
                        <react-component
                            name="RichTextEditor"
                            props="{ richtext: item.DataTemplate, onContentChange: onRteChange, height: 400, placeholder: 'Enter template content here…' }">
                        </react-component>
                    </div>
                </div>

                <div class="fooder-bgs" style="margin-bottom:6px;">
                    <div class="pull-right">
                        <!-- <button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button> -->

                        <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                            ng-click="saveAndApprove()"></button>
                        <!-- <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-show="item." ng-click="clear()" translate="common.clearaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>				 -->
                    </div>
                </div>
        </form>
    </div>
</div>
