<style>
.site-footer{height:40px;position:fixed;
width:100%;bottom:0;z-index:1;display:-webkit-flex;display:-ms-flexbox;display:flex;
-webkit-align-items:center;-ms-flex-align:center;
align-items:center;white-space:nowrap;background-color: #ccecf5;box-shadow: 1px 0px rgba(146, 140, 140, 0.75);z-index:10;}
.footer-right{float:right; right:0; box-sizing: border-box;position: fixed;margin: 0; padding: 20px;box-sizing: border-box;}
    .formRoot {
    overflow: auto;
    height: 495px;
}
.panel-body .well{min-height:435px;}
.panel{margin-bottom:0px;}
.formactionbar {margin-bottom:0px;}
</style>
        <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">	
            <div class="">
                <div class="panel panel-default bg-pattern">
                    <div class="row page-header"><h4 class="col-sm-6 mt0" translate="clinicalmaster.frequencycategory-form.pnlfrequencycategory.lbl"></h4></div>
                    <div class="panel-body form-panel">	
                        <div class="col-sm-12 well">			
                             <!-- leftpanel -->
                            <div class="col-sm-8">
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="category" translate="clinicalmaster.frequencycategory-form.category.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <ui-select ng-model="item.ClinicalFrequencyCategoryId" name="category">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ClinicalFrequencyCategory | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="activefrom" translate="clinicalmaster.frequencycategory-form.activefrom.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="activefrom" ng-date-object 
                                                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" 
                                                placeholder="{{datePickerOptions.placeholder}}" 
                                                ng-click="activefromPopup = { opened: true }" 
                                                is-open="activefromPopup.opened" ng-model="item.ActiveFrom" >
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="activeto" translate="clinicalmaster.frequencycategory-form.activeto.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="activeto" ng-date-object 
                                                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" 
                                                placeholder="{{datePickerOptions.placeholder}}" 
                                                ng-click="activetoPopup = { opened: true }" 
                                                is-open="activetoPopup.opened" ng-model="item.ActiveTo" >
                                    </div>
                                </div>
                            </div>
                            <!-- rightpanel -->
                            <div class="col-sm-4">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            </form>	
            <div class="site-footer panel-footer">
                <div class="footer-right">
                    <button type="submit" class="draftbutton" translate="common.saveaction.lbl" ng-click="saveItem()"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>						
                </div>
            </div>
