<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">	
            
                <div class="panel panel-default bg-pattern">
                    <div class="panel-body form-panel">	
                        <div id="clinical-tab">
                        <div class="col-sm-12">			
                            <!-- leftpanel -->
                            <div class="col-sm-6">
                             <div class="col-sm-12 well">
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="facility" translate="clinicalmaster.frequency-form.facility.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <ui-select ng-model="item.FacilityId" name="facility" required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="type" translate="clinicalmaster.frequency-form.type.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <ui-select ng-model="item.FrequencyTypeId" name="type" required autofocus>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.FrequencyType | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="code" translate="clinicalmaster.frequency-form.code.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="code" ng-model="item.Code" placeholder=""  required autofocus>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="name" translate="clinicalmaster.frequency-form.name.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="name" ng-model="item.Name" placeholder=""  required autofocus>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="description" translate="clinicalmaster.frequency-form.description.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="description" ng-model="item.Description" placeholder="" >
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="nooftimes" translate="clinicalmaster.frequency-form.nooftimes.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="nooftimes" ng-model="item.NoOfTimes" placeholder="" ng-minlength="1" ng-pattern="/^\d+$/" required autofocus>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="sigcode" translate="clinicalmaster.frequency-form.sigcode.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <ui-select ng-model="item.FrequencySIGCodeId" name="sigcode">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.FrequencySIGCode | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="startduration" translate="clinicalmaster.frequency-form.startduration.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="startduration" ng-model="item.StartDuration" placeholder="" >
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="isactive" translate="clinicalmaster.frequency-form.isactive.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="checkbox" name="isactive" class="custom-checkbox"
                                            ng-model="item.IsActive">
                                    </div>
                                </div>
                            </div>
                          </div>  
                          <div class="col-sm-6 cust_well">
                                <div class="form-group">
                                        <label class="col-sm-4 control-label ng-scope"><span class="ng-scope">Comments</span></label>
                                        <div class="col-sm-8">
                                            <textarea name="comments" ng-model="item.SpecialInstruction" maxlength="4000" style="width: 100%; margin-top: 10px; margin-bottom: 0px; height: 71px;" class="notes-textarea ng-pristine ng-valid ng-empty ng-valid-maxlength ng-touched" ng-disabled="item.isl" tabindex="-1"></textarea><div class="validation ng-scope ng-hide" ng-show="attrs.required==''|| attrs.required"><ul class="list-unstyled validation-errors ng-inactive ng-hide" ng-messages="field.$error" ng-show="field.$invalid &amp;&amp; (field.$touched || field.$dirty || form.$triedSubmit)">
                                                </ul><div class="validation-success" ng-show="field.$valid &amp;&amp; !field.$invalid">
                                                    </div></div>
                                        </div>
                                    </div>
                                   
                                   
                        </div>
                            <!-- rightpanel -->
                            </div>
                    </div>
                </div>
            </div>
            <div class="site-footer panel-footer">
                <button type="button" class="btn btn-sm pyr-color10" ng-click="backToList()"><i class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button>
                <div class="footer-right">
                    <button type="button" class="draftbutton" ng-click="saveAndApprove()" translate="common.saveaction.lbl"></button>
                    <button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                    <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>						
                </div>
            </div>
        </form>		
    </div>
</div>
