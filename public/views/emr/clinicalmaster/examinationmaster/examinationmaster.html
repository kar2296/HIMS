    .modal-content {
        width: 50%;
        margin: 30px auto;

        <h4 class="modal-title custom-modal-title" translate="clinicalmaster.examinationmaster.pnltitle.lbl">
        </h4>
    </div>

        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="backToList()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-12">
            <div class="form-group col-sm-6">
                <label class="col-sm-12 control-label" for="code"
                    translate="clinicalmaster.examinationmaster.code.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="code" ng-model="item.Code" placeholder="" required>
                </div>
            </div>
            <div class="form-group col-sm-6">
                <label class="col-sm-12 control-label" for="name"
                    translate="clinicalmaster.examinationmaster.name.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="name" ng-model="item.Name" placeholder="" required>
                </div>
            </div>
            <div class="form-group col-sm-6">
                <label class="col-sm-12 control-label" for="type"
                    translate="clinicalmaster.examinationmaster.type.lbl"></label>
                <div class="col-sm-12">
                    <ui-select ng-model="item.ExaminationMasterTypeId" name="type">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.ExaminationMasterType | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="form-group col-sm-6">
                <label class="col-sm-12 control-label" for="isactive"
                    translate="clinicalmaster.examinationmaster.isactive.lbl"></label>
                <div class="col-sm-12">
                    <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
                </div>
            </div>
        </div>
        <div class="">
            <div class="row">
                <div class="pull-right">
                    <button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl"
                        ng-click="save()"></button>
                    <!-- <button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button> -->
                    <!-- <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                        <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button> -->
                </div>
            </div>
        </div>
    </form>
</div>
