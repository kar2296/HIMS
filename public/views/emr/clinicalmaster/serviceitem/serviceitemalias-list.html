<div class="row">
    <!-- <button class="btn bt-color3 btn-xs pull-right" ng-click="" uib-tooltip="{{'clinicalmaster.serviceitem-list.filter-tooltip.lbl' | translate }}"
                            tooltip-placement="bottom">
                            <i class="fa fa-filter" aria-hidden="true"></i>&nbsp;&nbsp;
                            <span translate="clinicalmaster.serviceitem-list.filter.lbl"></span>
                        </button> -->
    <button class="btn-add" ng-click="addNew()"
        uib-tooltip="{{'clinicalmaster.serviceitemalias-list.addnew-tooltip.lbl' | translate }}"
        tooltip-placement="bottom">
        <i class="fa fa-plus" aria-hidden="true"></i>
    </button>
</div>
<div class="row">
    <table class="table table-hover table-responsive table-bordered">
        <thead class="bg-subhead">
            <tr>
                <th class="col-sm-1">
                    <span translate="Type"></span>
                    <span class="mandatory-asterix">*</span>
                </th>
                <th class="col-sm-2">
                    <span translate="Payer Name"></span>
                    <span class="mandatory-asterix">*</span>
                </th>
                <th class="col-sm-1">
                    <span translate="External Code"></span>
                    <span class="mandatory-asterix">*</span>
                </th>
                <th class="col-sm-2">
                    <span translate="Name"></span>
                    <span class="mandatory-asterix">*</span>
                </th>
                <th class="col-sm-1">
                    <span translate="clinicalmaster.serviceitemalias-list.groupname.lbl"></span>
                </th>
                <th class="col-sm-1">
                    <span translate="clinicalmaster.serviceitemalias-list.issupplementary.lbl"></span>
                </th>
                <th class="col-sm-1">
                    <span translate="clinicalmaster.serviceitemalias-list.surcharge.lbl"></span>
                </th>
                <th class="col-sm-1">
                    <span translate="clinicalmaster.serviceitemalias-list.discount.lbl"></span>
                </th>
                <th class="col-sm-1">
                    <span translate="clinicalmaster.serviceitemalias-list.status.lbl"></span>
                </th>
                <th class="col-sm-1">
                    <span translate="common.actions_col.lbl"></span>
                </th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="item in vm.items | filter:{Status:1}">
                <td>
                    <ui-select ng-model="item.AliasTypeId" class="ui-select-grid" ng-change="addDynGuarantor(item)">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.GuarantorType | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </td>
                <td>
                    <ui-select ng-model="item.ExternalProviderId" class="ui-select-grid">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in item.Guarantor | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </td>
                <td>
                    <input type="text" class="form-control" ng-model="item.AliasId" placeholder="">
                </td>
                <td>
                    <input type="text" class="form-control" ng-model="item.AliasName" placeholder="">
                </td>
                <td>
                    <ui-select ng-model="item.GroupId" class="ui-select-grid">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.Group | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </td>
                <td align="center">
                    <input type="checkbox" class="custom-checkbox" ng-model="item.IsSupplementary">
                </td>
                <td>
                    <input type="text" class="form-control" ng-model="item.Surcharge" placeholder="">
                </td>
                <td>
                    <input type="text" class="form-control" ng-model="item.Discount" placeholder="">
                </td>
                <td align="center">
                    <input type="checkbox" class="custom-checkbox" ng-model="item.StatusId">
                </td>
                <td align="center">
                    <img class="drhms-edit-button" src="assets/svg/delete.svg" alt="" ng-click="deleteItem($index,item)"> 
                </td>
            </tr>
        </tbody>
    </table>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>

<div class="fooder-bgs">
    <div class="pull-left">
        <button type="button" class="pull-left btn btn-sm pyr-color10" ng-click="backToList()">
            <i class="fa fa-angle-left"></i>&nbsp;&nbsp;
            <span translate="common.backaction.lbl"></span>
        </button>
    </div>
    <div class="pull-right">
        <button id="btnSaveForm" type="button" class="draftbutton" translate="common.saveaction.lbl"
            ng-click="saveItem()"></button>
        <!--<button type="button" class="btn btn-primary btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>-->
        <!-- <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button> -->
        <!-- <button id="btnCancelForm" type="button" class="cancelbutton" ng-click="back()" translate="common.cancelaction.lbl"></button> -->
    </div>
</div>
