<!---Header-->
<div class="row">
    <button class="btn-add" ng-click="addteamSelection()" uib-tooltip="{{'Add Team' | translate }}"
        tooltip-placement="bottom">
        <i class="fa fa-plus" aria-hidden="true"></i>
        <!-- <span translate="clinicalmaster.serviceitem-list.addnew.lbl"></span> -->
    </button>
    <button class="drhms-billing-btn drhms-delete-btn" ng-click="cancelCallback()" uib-tooltip="Cancel" tooltip-placement="bottom">
        <i class="fas fa-window-close"></i>
        <!-- <span translate="clinicalmaster.serviceitem-list.addnew.lbl"></span> -->
    </button>
    <!-- <img src="../../../../../assets/svg/add-item.svg" ng-click="cancelCallback()"> -->
</div>

<div class="row">
    <table class="table table-hover table-responsive table-bordered">
        <thead class="bg-subhead">
            <tr>
                <th class="col-sm-2">
                    <span translate="Team"></span>
                    <span class="mandatory-asterix">*</span>
                </th>
                <th class="col-sm-2">
                    <span translate="Rate Type"></span>
                    <span class="mandatory-asterix">*</span>
                </th>
                <th class="col-sm-2">
                    <span for="rate" translate="clinicalmaster.serviceitemtariffdetail-list.rate.lbl"></span>
                    <span class="mandatory-asterix">*</span>
                </th>
                <th class="col-sm-2">
                    <span translate="clinicalmaster.serviceitemperformingdoctor.doctorname.lbl"></span>
                    <!-- <span class="mandatory-asterix">*</span> -->
                </th>
                <th class="col-sm-1">
                    <span translate="Type"></span>
                </th>
                <th class="col-sm-1">
                    <span translate="Value"></span>
                </th>
                <th class="col-sm-2">
                    <span for="rate" translate="clinicalmaster.serviceitemperformingdoctor.doctorshare.lbl"></span>
                    <!-- <span class="mandatory-asterix">*</span> -->
                </th>
                <th class="col-sm-2">
                    <span for="emergency" translate="clinicalmaster.serviceitemperformingdoctor.visittype.lbl"></span>
                    <!-- <span class="mandatory-asterix">*</span> -->
                </th>
                <th class="col-sm-1">
                    <span translate="common.actions_col.lbl"></span>
                </th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="item in vm.items | filter:{Status:1}">
                <td>
                    <ui-select ng-model="item.TeamId" class="ui-select-grid">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.Team | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </td>
                <td>
                    <ui-select ng-model="item.ServiceRateCategoryId" class="ui-select-grid">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.ServiceRateCategory | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </td>
                <td align="center">
                    <input type="text" class="form-control" name="rate" ng-model="item.Rate" placeholder=""
                        ng-pattern="/^\d+$/" ng-keypress="numberonly($event)" required>
                </td>
                <td>
                    <autosearch itemid="item.DoctorId" iteminfo="item.SelectedItem" rowdata="item" name="'doctorid'"
                        config="vm.doctorcontrolconfig" itemchange="OnSelectDoctor($index,item)" candisable=""
                        isrequired="true">
                    </autosearch>
                    <!-- <ui-select ng-model="item.DoctorId" class="ui-select-grid">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Doctor | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select> -->

                </td>
                <td>
                    <ui-select ng-model="item.ShareTypeId" class="ui-select-grid">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.DiscountMode | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </td>
                <td>
                    <input type="text" class="form-control" ng-model="item.DoctorShareValue"
                        ng-change="calcDrShare(item)" placeholder="">
                </td>
                <td align="center">
                    <input type="text" class="form-control" name="rate" ng-model="item.DoctorShare" placeholder=""
                        ng-pattern="/^\d+$/" ng-keypress="numberonly($event)" required>
                </td>
                <td align="center">
                    <ui-select ng-model="item.VisitTypeId" class="ui-select-grid">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.VisitType | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </td>
                <td align="center">
                    <div class="filters">
                        <img src="assets/svg/delete.svg" ng-click="deleteItem($index,item)">
                        <input type="checkbox" class="custom-checkbox" ng-model="item.IsDisplayAllDoctors"
                            ng-click="dispdocTeam(item)">
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>

<div class="fooder-bgs">
    <div class="pull-left">
        <button type="button" class="pull-left btn btn-sm pyr-color10" ng-click="backToList()">
            <i class="fa fa-angle-left"></i>&nbsp;&nbsp;
            <span translate="common.backaction.lbl"></span>
        </button>
    </div>
    <div class="pull-right">
        <button id="btnSaveForm" type="button" class="draftbutton" translate="common.saveaction.lbl"
            ng-click="saveItem()"></button>
        <!--<button type="button" class="btn btn-primary btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>-->
        <!-- <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button> -->
        <!-- <button id="btnCancelForm" type="button" class="cancelbutton" ng-click="back()" translate="common.cancelaction.lbl"></button> -->
    </div>

</div>
