<style>
    #mainresponsivetablecontrol>.table>tbody>tr:nth-child(1)>td>autosearch>.autosearch-div>.custom-popup-wrapper>.dropdown-menu {
        background-color: rgba(245, 249, 238, 0) !important;
        border: 0px solid #ccc !important;
    }

    .custom-popup-wrapper>.table>thead>tr>td:nth-child(3) {
        width: 30% !important;
    }

    .custom-popup-wrapper>.table>tbody>tr>td:nth-child(3)>span {
        width: 25% !important;
    }

    th.col-sm-3 {
        background: #8a9cca;
    }

    th.col-sm-1 {
        background: #8a9cca;
    }

    th.col-sm-2 {
        background: #8a9cca;
    }

    div#mainresponsivetablecontrolstock {
        min-height: 367px;
        margin-top: 15px;
        overflow: auto !important;
        overflow-x: scroll !important;
    }

    #purchaseorder .formRoot {
        height: auto !important;
    }

    .autosearch-div .custom-popup-wrapper {
        position: relative !important;
    }
</style>
<div class="row">
    <div class="row">
        <button class="btn-add" ng-click="addNew()" uib-tooltip="{{'Package Map' | translate }}"
            tooltip-placement="bottom">
            <i class="fa fa-plus" aria-hidden="true"></i>
            <!-- <span translate="clinicalmaster.serviceitem-list.addnew.lbl"></span> -->
        </button>
    </div>
    <div class="row">
        <div class="table-control">
            <div class="bg-pattern im_purodrhg">
                <div class="table-height formRoot">
                    <table class="table table-hover table-responsive table-bordered">
                        <thead class="bg-subhead">
                            <tr>
                                <th class="col-sm-3"><span
                                        translate="clinicalmaster.serviceitempackagemap-list.servicename.lbl"></span>
                                </th>
                                <th class="col-sm-1"><span
                                        translate="clinicalmaster.serviceitempackagemap-list.quantity.lbl"></span></th>
                                <th class="col-sm-1"><span
                                        translate="clinicalmaster.serviceitempackagemap-list.amount.lbl"></span>
                                </th>
                                <th class="col-sm-1"><span
                                        translate="clinicalmaster.serviceitempackagemap-list.discount.lbl"></span></th>
                                <th class="col-sm-1"><span
                                        translate="clinicalmaster.serviceitempackagemap-list.netamount.lbl"></span></th>
                                <th class="col-sm-2"><span
                                        translate="clinicalmaster.serviceitempackagemap-list.discounttype.lbl"></span>
                                </th>
                                <th class="col-sm-1"><span
                                        translate="clinicalmaster.serviceitempackagemap-list.displayorder.lbl"
                                        style="white-space: nowrap;"></span></th>
                                <th class="col-sm-1"><span translate="common.actions_col.lbl"></span></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr ng-repeat="item in vm.items | filter:{Status:1}">
                                <td>
                                    <autosearch itemid="item.ServiceId" iteminfo="item.SelectedItem" rowdata="item"
                                        config="vm.serviceitemconfig" itemchange="serviceItemChanged($index,item)"
                                        class="inputsearchlogo"></autosearch>
                                </td>
                                <td>
                                    <input type="text" class="form-control" ng-model="item.Quantity" placeholder=""
                                        ng-change="computeNetAmount(item)">
                                </td>
                                <td>
                                    <input type="text" class="form-control" ng-model="item.Amount" placeholder=""
                                        ng-change="computeNetAmount(item)">
                                </td>
                                <td>
                                    <input type="text" class="form-control" ng-model="item.Discount" placeholder="">
                                </td>
                                <td>
                                    <input type="text" class="form-control" ng-model="item.NetAmount" placeholder="">
                                </td>
                                <td>
                                    <span>
                                        <ui-select ng-model="item.ServiceItemDiscountTypeId" class="ui-select-grid">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices
                                                repeat="lookupitem.Id as lookupitem in lookup.ServiceItemDiscountType | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </span>
                                </td>
                                <td align="center">
                                    <input type="text" class="form-control" ng-model="item.DisplayOrder" placeholder="">
                                </td>
                                <td align="center">
                                    <img src="assets/svg/delete.svg" ng-click="deleteItem($index,item)">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <custom-table config="vm.gridConfig"></custom-table>
    </div>
    <div class="fooder-bgs" style="margin-bottom: 300px !important;">
        <div class="pull-left">
            <button type="button" class="pull-left btn btn-sm pyr-color10" ng-click="backToList()"><i
                    class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button>
        </div>
        <div class="pull-right">
            <button id="btnSaveForm" type="button" class="draftbutton" translate="common.saveaction.lbl"
                ng-click="saveItem()"></button>
            <!--<button type="button" class="btn btn-primary btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>-->
            <!-- <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>                     -->
            <!-- <button id="btnCancelForm" type="button" class="cancelbutton" ng-click="back()" translate="common.cancelaction.lbl"></button> -->
        </div>
    </div>
</div>
