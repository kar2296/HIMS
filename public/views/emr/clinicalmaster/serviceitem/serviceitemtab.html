<div class="row page-header" id="assets">
    <h4 class="col-sm-4 mt0" translate="billing.opbilling-list.mngservicecode.lbl"></h4>
    <label class="col-sm-3 active" translate="{{$state.params.ServiceName}}"></label>
    <div class="col-sm-5">
        <button class="btn-add" ng-click="addNew()"
            uib-tooltip="{{ 'clinicalmaster.serviceitem-form.pnlserviceitem.lbl' | translate }}"
            tooltip-placement="bottom">
            <i class="fa fa-plus" aria-hidden="true"></i>
            <!-- <span translate="common.addaction.lbl"></span> -->
        </button>

    </div>
</div>
<div id="receipt_tab">
    <div class="row">
        <div class="col-sm-12">
            <uib-tabset active="active" id="assettabs">
                <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)"
                    disable="tab.canDisable">
                </uib-tab>
            </uib-tabset>
            <div ui-view class="tabview"></div>
        </div>
    </div>
</div>
