<div class="row page-header" ng-if="!currentcontext.ismodal">
    <h4 class="active mt0 col-sm-6" translate="clinicalmaster.ticksheet-form.pagetitle1.lbl"></h4>
</div>
<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="clinicalmaster.ticksheet-form.pagetitle1.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="backToList()">
        </div>
    </div>
</div>

        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="name"
                translate="clinicalmaster.ticksheet-form.favname.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="name" ng-model="item.TickSheetName" placeholder=""
                    required>
            </div>
        </div>

        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="mastertype"
                translate="clinicalmaster.ticksheet-form.mastertype.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.TickSheetMasterTypeId" name="mastertype"
                    ng-disabled="currentcontext.candisabletype" ng-change="mastertypechanged($select.selected)"
                    required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.TickSheetMasterType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="itemid"
                translate="clinicalmaster.ticksheet-form.itemid.lbl"></label>
            <div class="col-sm-10" ng-show="item.TickSheetMasterTypeId==1">
                <ticksheetitemcontrol itemtypeid="item.TickSheetMasterTypeId" selectediteminfo="selectediteminfo"
                    changeev="drugchanged(item)">
                </ticksheetitemcontrol>
            </div>
            <div class="col-sm-10" ng-show="item.TickSheetMasterTypeId!=1">
                <ticksheetitemcontrol itemtypeid="item.TickSheetMasterTypeId" selectediteminfo="selectediteminfo"
                    changeev="itemselected()">
                </ticksheetitemcontrol>

            </div>
            <div class="col-sm-2">
                <button class="btn-add" ng-click="adddetail()">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                </button>
            </div>
        </div>
        <div ng-if="item.TickSheetMasterTypeId==1" class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="clinicalmaster.panelmaster-form.dosage.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class=" col-sm-4 form-control" ng-model="item.Dosage" placeholder="">
            </div>
        </div>
        <div ng-if="item.TickSheetMasterTypeId==1" class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="Drug Instruction"></label>
            <div class="col-sm-12">
                <radiogroupcontrol itemid="item.DrugInstructionId" items="lookup.DrugInstruction">
                </radiogroupcontrol>
            </div>
        </div>
        <div ng-if="item.TickSheetMasterTypeId==1" class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="Notes"></label>
            <div class="col-sm-12">
                <input type="text" class=" col-sm-4 form-control" ng-model="item.Notes" placeholder="">
            </div>
        </div>
        <div ng-if="item.TickSheetMasterTypeId==1" class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="clinicalmaster.panelmaster-form.morning.lbl"></label>
            <div class="col-sm-12">
                <input type="number" min="0" class=" col-sm-4 form-control" ng-model="item.Morning"
                    ng-change="computeQuantity(item)" placeholder="">
            </div>
        </div>
        <div ng-if="item.TickSheetMasterTypeId==1" class="form-group col-sm-2">
            <label class="col-sm-12 control-label" translate="clinicalmaster.panelmaster-form.noon.lbl"></label>
            <div class="col-sm-12">
                <input type="number" min="0" class=" col-sm-4 form-control" ng-model="item.Noon"
                    ng-change="computeQuantity(item)" placeholder="">
            </div>
        </div>
        <div ng-if="item.TickSheetMasterTypeId==1" class="form-group col-sm-2">
            <label class="col-sm-12 control-label" translate="clinicalmaster.panelmaster-form.night.lbl"></label>
            <div class="col-sm-12">
                <input type="number" min="0" class=" col-sm-4 form-control" ng-model="item.Night"
                    ng-change="computeQuantity(item)" placeholder="">
            </div>
        </div>
        <div ng-if="item.TickSheetMasterTypeId==1" class="form-group col-sm-2">
            <label class="col-sm-12 control-label" translate="clinicalmaster.panelmaster-form.duration.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" ng-model="item.Duration" placeholder=""
                    ng-change="computeQuantity(item)">
            </div>
        </div>
        <div ng-if="item.TickSheetMasterTypeId==1" class="form-group col-sm-2">
            <label class="col-sm-12 control-label"
                translate="clinicalmaster.panelmaster-form.durationperiod.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.DurationPeriodId" class="ui-select-period"
                    on-select="onDurPeriodSelected($select.selected)" ng-change="computeQuantity(item)">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.DurationPeriod | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div ng-if="item.TickSheetMasterTypeId==1||item.TickSheetMasterTypeId==2||item.TickSheetMasterTypeId==3||item.TickSheetMasterTypeId==4"
            class="form-group col-sm-2">
            <label class="col-sm-12 control-label" translate="clinicalmaster.panelmaster-form.quantity.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" ng-model="item.Quantity" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-2">
            <label class="col-sm-12 control-label" for="isactive"
                translate="clinicalmaster.ticksheet-form.isactive.lbl"></label>
            <div class="col-sm-12">
                <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
            </div>
        </div>
    </form>
</div>

<div class="row" ng-hide="item.TickSheetMasterTypeId==1">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="row" ng-show="item.TickSheetMasterTypeId==1">
    <custom-table config="vm.druggridConfig"></custom-table>
</div>
<div class="">
    <div class="row">
        <div class="pull-left">
            <button type="button" class="btn btn-sm pyr-color10" ng-click="backToList()">
                <i class="fa fa-angle-left"></i>&nbsp;&nbsp;
                <span translate="common.backaction.lbl"></span>
            </button>
        </div>
        <div class="pull-right">
            <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                ng-click="saveAndApprove()"></button>
        </div>
    </div>
</div>
