<style>

<div class="modal-header custom-modal-header">

        <h4 class="modal-title custom-modal-title" translate="clinicalmaster.allergy-form.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>
