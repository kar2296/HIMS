<style>
    .modal-content .panel-body {
        overflow: auto;
    }

    /**
    * The dnd-list should always have a min-height,
    * otherwise you can't drop to it once it's empty
    */

    .lst ul[dnd-list] {
        height: 305px;
        padding-left: 10px;
        padding-right: 10px;
        overflow: auto;
        overflow-x: hidden;
    }

    /**
    * The dndDraggingSource class will be applied to
    * the source element of a drag operation. It makes
    * sense to hide it to give the user the feeling
    * that he's actually moving it.
    */

    .lst ul[dnd-list] .dndDraggingSource {
        display: none;
    }

    /**
    * An element with .dndPlaceholder class will be
    * added to the dnd-list while the user is dragging
    * over it.
    */

    .lst ul[dnd-list] .dndPlaceholder {
        background-color: #ddd;
        display: block;
        min-height: 42px;
    }

    .lst ul[dnd-list] li {
        background-color: #fff;
        border: 1px solid #ddd;
        border-top-right-radius: 4px;
        border-top-left-radius: 4px;
        display: block;
        padding: 3px 15px;
        margin-bottom: -1px;
        margin-top: 5px;
    }

    /**
    * Show selected elements in green
    */

    .lst ul[dnd-list] li.selected {
        background-color: #dff0d8;
        color: #3c763d;
    }

    .lst ul[dnd-list] li {
        /* padding: 3px 15px;
        margin-bottom: 6px;
        border: 1px solid #666; */
        /* box-shadow: -9px 4px cadetblue; */
        text-overflow: ellipsis;
        overflow: hidden;
        white-space: nowrap;
        color: #000;
        /* text-align: center;  */
        font-size: 15px;
        font-style: oblique;
        font-weight: 500;
        background: #d6d3d3;
        width: 108%;
        margin-left: -11px;
    }

    .body_head {
        margin-top: 6px !important;
    }

    .panel-heading h4 {
        color: #fff;
    }

    .panel.panel-info.col-sm-4.lst {
        /* box-shadow: -6px 6px darkgrey; */
        /* border: 2px solid #3c547f; */
    }

    .panel-heading {
        background-color: #3c547f !important;
        /* text-align: center; */
        margin-top: 6px;
    }

    /* .panel-heading {
        background-color: cornflowerblue !important;
        text-align: center;
        margin-top: 6px;
    } */

    li.ng-binding.ng-scope {}

    .cust_head {
        margin-bottom: 1px;
    }

    /* .selected_side.lst ul[dnd-list] li {

        background-color: mediumslateblue !important;
        box-shadow: -9px 4px darkgrey;
        color: #fff;
    } */

    .section_popup {
        /* height:316px !important; */
        height: 524px !important;
    }

}
 .modal-dialog.modal-lg{

.section_exchange{

} */

    .section_exchange {

<div class="row page-header">
    <h3 class="panel-title" translate="clinicalmaster.clinicalmasters.template.lbl"></h3>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form"></form>
    <div class="col-sm-4 form-group">
        <label class="col-sm-4" translate="clinicalmaster.section-form.name.lbl"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" name="name" ng-model="item.Name" placeholder="" required>
        </div>
    </div>
    <div class="col-sm-4 form-group">
        <label class="col-sm-4" translate="clinicalmaster.section-form.sectionnotetype.lbl"></label>
        <div class="col-sm-8">
            <multiselectchk list="lookup.SectionNoteType" selected="currentcontext.SectionNoteTypeId"
                change="changeSectionNoteTypeId()">
                <b>{{currentcontext.SectionNoteType}}</b>
            </multiselectchk>
        </div>
    </div>
    <div class="col-sm-4 form-group">
        <label class="col-sm-4" translate="clinicalmaster.section-form.sref.lbl"></label>
        <div class="col-sm-8">
            <input type="text" ng-disabled="currentcontext.id > 0" class="form-control" name="sref" ng-model="item.SRef"
                placeholder="">
        </div>
    </div>
    <div class="col-sm-4 form-group">
        <label class="col-sm-4" translate="clinicalmaster.section-form.description.lbl"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" name="description" ng-model="item.Description" placeholder="">
        </div>
    </div>
    <div class="col-sm-4 form-group">
        <label class="col-sm-4" translate="clinicalmaster.section-form.type.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="item.SectionTypeId" name="type" required>
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.SectionType | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="col-sm-4 form-group">
        <label class="col-sm-4" translate="clinicalmaster.diagnosis-form.isactive.lbl"></label>
        <div class="col-sm-8">
            <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
        </div>
    </div>
</div>
</div>
