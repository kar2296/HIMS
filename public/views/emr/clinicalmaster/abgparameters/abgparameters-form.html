<style>
    .modal-content .panel-body {
        overflow: inherit;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-12" id="popup2">

        <h3 class="panel-title" translate="clinicalmaster.abgparameters.pnltitle.lbl"></h3>
    </div>

</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div>
                <div class="">
                    <div class="panel-body form-panel">
                        <div class="col-sm-12  ">
                            <!-- leftpanel -->
                            <div class="col-sm-6 well" style="height: 333px;">
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="abgparams" translate="clinicalmaster.abgparameters.abgparams.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="text" class="form-control" name="abgparams" ng-model="item.ABGParameters" placeholder="" uppercase>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="descrption" translate="clinicalmaster.abgparameters.descrption.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="text" class="form-control" name="descrption" ng-model="item.Description" placeholder="" uppercase>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="mnemonic" translate="clinicalmaster.abgparameters.mnemonic.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="text" class="form-control" name="mnemonic" ng-model="item.Mnemonic" placeholder="" uppercase>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="loinccode" translate="clinicalmaster.abgparameters.loinccode.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="text" class="form-control" name="loinccode" ng-model="item.LoincCode" placeholder="" uppercase>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="type" translate="clinicalmaster.abgparameters.type.lbl"></label>
                                    <div class="col-sm-7">
                                        <ui-select ng-model="item.ParameterTypeId" name="type">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ParameterType | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="itemservice" translate="clinicalmaster.abgparameters.itemservice.lbl"></label>
                                    <div class="col-sm-7">
                                        <autosearch itemid="item.ItemServiceId" iteminfo="item.SelectedItem" rowdata="item" config="vm.serviceitemconfig" itemchange="">
                                            <!-- <ui-select ng-model="item.AllergyEventTypeId" name="itemservice" >
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.AllergyEventType | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select> -->
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="isactive" translate="clinicalmaster.abgparameters.isactive.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-6 well">
                                <div>
                                    <div class="col-sm-12" style="margin-left: -106px;font-size: 17px;font-weight: 700;color: blue;">
                                        <label class="col-sm-4 control-label" translate="clinicalmaster.abgparameters.normal.lbl"></label>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="normalreffrom" translate="clinicalmaster.abgparameters.reffrom.lbl"></label>
                                        <div class="col-sm-7">
                                            <input type="text" class="form-control" name="normalreffrom" ng-model="item.NormalFrom" placeholder="" ng-keypress="numberonly($event)"
                                                ng-keypress="numberonly($event)" required>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="normalrefto" translate="clinicalmaster.abgparameters.refto.lbl"></label>
                                        <div class="col-sm-7">
                                            <input type="text" class="form-control" name="normalrefto" ng-model="item.NormalTo" placeholder="" ng-keypress="numberonly($event)"
                                                required>
                                        </div>
                                    </div>
                                </div>
                                <div>
                                    <div class="col-sm-12" style="margin-left: -106px;font-size: 17px;font-weight: 700;color: blue;">
                                        <label class="col-sm-4 control-label" translate="clinicalmaster.abgparameters.low.lbl"></label>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="reffrom" translate="clinicalmaster.abgparameters.reffrom.lbl"></label>
                                        <div class="col-sm-7">
                                            <input type="text" class="form-control" name="reffrom" ng-model="item.LowFrom" placeholder="" ng-keypress="numberonly($event)"
                                                required>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="refto" translate="clinicalmaster.abgparameters.refto.lbl"></label>
                                        <div class="col-sm-7">
                                            <input type="text" class="form-control" name="refto" ng-model="item.LowTo" placeholder="" ng-keypress="numberonly($event)"
                                                required>
                                        </div>
                                    </div>
                                </div>
                                <div>
                                    <div class="col-sm-12" style="margin-left: -106px;font-size: 17px;font-weight: 700;color: blue;">
                                        <label class="col-sm-4 control-label" translate="clinicalmaster.abgparameters.high.lbl"></label>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="highreffrom" translate="clinicalmaster.abgparameters.reffrom.lbl"></label>
                                        <div class="col-sm-7">
                                            <input type="text" class="form-control" name="highreffrom" ng-model="item.HighFrom" placeholder="" ng-keypress="numberonly($event)"
                                                required>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="highrefto" translate="clinicalmaster.abgparameters.refto.lbl"></label>
                                        <div class="col-sm-7">
                                            <input type="text" class="form-control" name="highrefto" ng-model="item.HighTo" placeholder="" ng-keypress="numberonly($event)"
                                                required>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="panel-footer formactionbar">
        <div class="pull-right">
            <button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
            <button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
            <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
            <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
        </div>
    </div>
</div>
