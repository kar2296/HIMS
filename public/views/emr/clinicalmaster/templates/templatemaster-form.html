<style>
    .form-horizontal .form-group {
        height: 72px;
    }
</style>
<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="clinicalmaster.panelmaster-form.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="backToList()">
        </div>
    </div>
</div>
<div class="row" ng-hide="currentcontext.ismodal">
    <h4 class="active mt0 col-sm-6" translate="clinicalmaster.panelmaster-form.pagetitle.lbl"></h4>
</div>


<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-4" style="margin-bottom: -11px !important;">
            <label class="col-sm-12 control-label" for="type" translate="clinicalmaster.panelmaster-form.type.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.TemplateTypeId" name="type" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.TemplateType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="templatename" translate="Template Name"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="templatename" ng-model="item.Name" placeholder="" required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="searchitems" translate="clinicalmaster.panelmaster-form.searchitems.lbl"></label>
            <div class="col-sm-9">
                <paneldetailcontrol itemtypeid="item.TemplateTypeId" selectediteminfo="selectediteminfo">
                </paneldetailcontrol>
            </div>
            <div class="col-sm-3">
                <button class="btn-add" ng-click="adddetail()">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                </button>
            </div>
        </div>
        <div ng-if="item.TemplateTypeId == 4" class="form-group col-sm-1">
            <label class="col-sm-12 control-label" translate="clinicalmaster.panelmaster-form.dosage.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class=" col-sm-4 form-control" ng-model="item.Dosage" placeholder="">
            </div>
        </div>
        <div ng-if="item.TemplateTypeId == 4" class="form-group col-sm-2">
            <label class="col-sm-12 control-label" translate="clinicalmaster.panelmaster-form.morning.lbl"></label>
            <div class="col-sm-12">
                <input type="number" min="0" class=" col-sm-4 form-control" ng-model="item.Morning" ng-change="computeQuantity(item)" placeholder="">
            </div>
        </div>
        <div ng-if="item.TemplateTypeId == 4" class="form-group col-sm-1">
            <label class="col-sm-12 control-label" translate="clinicalmaster.panelmaster-form.noon.lbl"></label>
            <div class="col-sm-12">
                <input type="number" min="0" class=" col-sm-4 form-control" ng-model="item.Noon" ng-change="computeQuantity(item)" placeholder="">
            </div>
        </div>
        <div ng-if="item.TemplateTypeId == 4" class="form-group col-sm-2">
            <label class="col-sm-12 control-label" translate="clinicalmaster.panelmaster-form.night.lbl"></label>
            <div class="col-sm-12">
                <input type="number" min="0" class=" col-sm-4 form-control" ng-model="item.Night" ng-change="computeQuantity(item)" placeholder="">
            </div>
        </div>
        <div ng-if="item.TemplateTypeId == 4" class="form-group col-sm-2">
            <label class="col-sm-12 control-label" translate="clinicalmaster.panelmaster-form.duration.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" ng-model="item.Duration" placeholder="" ng-change="computeQuantity(item)">
            </div>
        </div>
        <div ng-if="item.TemplateTypeId == 4" class="form-group col-sm-2">
            <label class="col-sm-12 control-label" translate="DrugInstruction"></label>
            <div class="col-sm-12">
                <radiogroupcontrol itemid="item.DrugInstructionId" items="lookup.DrugInstruction">
                </radiogroupcontrol>
            </div>
        </div>
        <div ng-if="item.TemplateTypeId == 4" class="form-group col-sm-2">
            <label class="col-sm-12 control-label" translate="Notes"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" ng-model="item.Notes" placeholder="">
            </div>
        </div>
        <div ng-if="item.TemplateTypeId == 4" class="form-group col-sm-2" id="durationperiod">
            <label class="col-sm-12 control-label" translate="clinicalmaster.panelmaster-form.durationperiod.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.DurationPeriodId" class="ui-select-period" on-select="onDurPeriodSelected($select.selected)" ng-change="computeQuantity(item)">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.DurationPeriod | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div ng-if="item.TemplateTypeId == 4||item.TemplateTypeId == 3||item.TemplateTypeId==1" class="form-group col-sm-1">
            <label class="col-sm-12 control-label" translate="clinicalmaster.panelmaster-form.quantity.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" ng-model="item.Quantity" placeholder="">
            </div>
        </div>
        <div ng-if="item.TemplateTypeId == 3" class="form-group col-sm-2">
            <label class="col-sm-12 control-label" translate="Instruction"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" ng-model="item.TestInstruction" placeholder="">
            </div>
        </div>
        <div ng-if="item.TemplateTypeId == 3" class="form-group col-sm-2">
            <label class="col-sm-12 control-label" translate="Clinical Data"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" ng-model="item.ClinicalData" placeholder="">
            </div>
        </div>
        <div ng-if="item.TemplateTypeId == 3" class="form-group col-sm-2">
            <label class="col-sm-12 control-label" translate="TestTaken On"></label>
            <div class="col-sm-6">
                <input type="text" class="form-control" ng-model="item.Duration" placeholder="">
            </div>
            <div class="col-sm-6">
                <ui-select ng-model="item.DurationPeriodId" class="ui-select-period" on-select="onDurPeriodSelected($select.selected)" ng-change="computeQuantity(item)">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.DurationPeriod | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-1">
            <label class="col-sm-12 control-label" for="isactive" translate="clinicalmaster.panelmaster-form.isactive.lbl"></label>
            <div class="col-sm-12">
                <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
            </div>
        </div>
        <div class="form-group col-sm-1">
            <label class="col-sm-12 control-label" for="Facility" translate="All Facility"></label>
            <div class="col-sm-12">
                <input type="checkbox" name="Facility" class="custom-checkbox" ng-change="Isallfacility()" ng-model="item.IsAllFacility">
            </div>
        </div>
        <div class="form-group col-sm-1">
            <label class="col-sm-12 control-label" for="Users" translate="All Users"></label>
            <div class="col-sm-12">
                <input type="checkbox" name="Users" class="custom-checkbox" ng-change="Isalluser()" ng-model="item.IsAllUser">
            </div>
        </div>
        <div class="form-group col-sm-1">
            <label class="col-sm-12 control-label" for="Department" translate="All Department"></label>
            <div class="col-sm-12">
                <input type="checkbox" name="Department" class="custom-checkbox" ng-change="Isalldepartment()" ng-model="item.IsAllDepartment">
            </div>
        </div>
    </form>
</div>
<div class="row" ng-hide="item.TemplateTypeId == 4||item.TemplateTypeId == 3">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="row" ng-show="item.TemplateTypeId == 3">
    <custom-table config="vm.ordergridConfig"></custom-table>
</div>
<div class="row" ng-show="item.TemplateTypeId == 4">
    <custom-table config="vm.druggridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="pull-left" ng-hide="currentcontext.ismodal">
            <button class="btn pyr-color10 btn-sm" type="button" ng-click="backToList()">
                <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                <span class="btn-fontsize" translate="common.backaction.lbl"></span>
            </button>

        </div>
        <div class="pull-right">
            <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
        </div>
    </div>
</div>
