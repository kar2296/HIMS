<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="clinicalmaster.diet-list.pagetitle.lbl"></h4>
    <div class="col-sm-6">
        <div class="filters">
            <div class="search">
                <input type="text" class="form-control" name="filter_allergyname" id="pid" translate
                    translate-attr-placeholder="clinicalmaster.diet-list.filter_allergyname.lbl" on-enter="getList()"
                    ng-model="currentfilter.DietItemCode" placeholder="">
                <i class="fas fa-search" aria-hidden="true"></i>
            </div>
            <button class="btn-add" ng-click="addNew()"
                uib-tooltip="{{ 'clinicalmaster.diet-list.addnew-tooltip.lbl' | translate }}"
                tooltip-placement="bottom"><i class="fa fa-plus" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-sm-4">
        <label class="col-sm-3" translate="clinicalmaster.diet-list.filter_allergytype.lbl"></label>
        <div class="col-sm-9">
            <ui-select ng-model="currentfilter.DietItemTypeId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 15 : 0}}
                    <span ng-if="$select.selected.Text.length>15">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.DietItemType | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="col-sm-4">
        <label class="col-sm-3" translate="clinicalmaster.diet-list.filter_category.lbl"></label>
        <div class="col-sm-9">
            <ui-select ng-model="currentfilter.DietCategoryId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 15 : 0}}
                    <span ng-if="$select.selected.Text.length>15">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.DietCategory | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="col-sm-4">
        <label class="col-sm-3" translate="clinicalmaster.diet-list.filter_status.lbl"></label>
        <div class="col-sm-9">
            <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 15 : 0}}
                    <span ng-if="$select.selected.Text.length>15">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
