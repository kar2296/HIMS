    <div class="col-sm-4">
            <label class="col-sm-5 control-label" for="genericname" translate="clinicalmaster.drug-form.genericname.lbl"></label>
            <div class="col-sm-7">
                <ui-select ng-model="currentfilter.GenericId" name="genericname" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Generic | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    <div class="col-sm-6">
            <div class="filters">
                <div class="search">
                    <input type="text" id="pid"class="form-control" name="filter_drugname" on-enter="getList()" ng-model="currentfilter.DrugName" placeholder=""
                    translate translate-attr-placeholder="clinicalmaster.drug-list.filter_drugname.lbl"> <i class="fas fa-search" aria-hidden="true"></i>

                </div>
                <button type="button" tabindex="-1" class="btn-add"
                    ng-click="addNew()"  uib-tooltip="{{ 'clinicalmaster.drug-list.addnew-tooltip.lbl' | translate }}"
                    tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                    <!-- <span translate="clinicalmaster.serviceitem-list.addnew.lbl " class="text-white"></span> -->
                </button>
            </div>
        </div>
</div>

<table id="bannerdetails">
        <tr>
            <td  translate="clinicalmaster.drug-list.filter_type.lbl"></td>
            <td>    <ui-select ng-model="currentfilter.DrugTypeId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.DrugType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select></td>
            <td translate="clinicalmaster.drug-list.filter_status.lbl"></td>
            <td><ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select></td>
        </tr>
    </table>

    <!-- <div ui-grid="vm.gridConfig" class="table-uigrid"></div> -->
    <custom-table config="vm.gridConfig"></custom-table>   
    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"

        </div>
