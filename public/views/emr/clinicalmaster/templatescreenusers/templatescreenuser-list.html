<div class="row page-header">
    <h4 class="col-sm-6" translate="clinicalmaster.profileuser-form.parentpagetitle.lbl"></h4>
    <div class="col-sm-6">
        <div class="filters">
            <button class="btn-add" ng-click="addNew()" uib-tooltip="{{ 'clinicalmaster.profile-list.addnew-tooltip.lbl' | translate
                }}" tooltip-placement="bottom"><i class="fa fa-plus" aria-hidden="true"></i>
                <!-- &nbsp;&nbsp;<span translate="clinicalmaster.profile-list.addnew-tooltip.lbl"></span> -->
            </button>
            <span class="drhms-billing-btn drhms-home-btn"><i class="fas fa-home" ng-click="backtodashboard()"
                    uib-tooltip="Dashboard" tooltip-placement="bottom"></i></span>
        </div>
    </div>
</div>
