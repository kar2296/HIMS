<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="clinicalmaster.diagnosis-form.pnldiagnosis.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-hide="currentcontext.ismodal" ng-click="cancelCallback()">
        </div>
    </div>
</div>
<div class="row page-header">
    <div class="col-sm-5">
        <h3 class="panel-title" translate="clinicalmaster.diagnosis-form.pnldiagnosis.lbl"></h3>
    </div>
    <div class="col-sm-7">
        <button class="btn-add" ng-hide="currentcontext.ismodal" ng-click="addNew()"
            uib-tooltip="{{ 'clinicalmaster.diagnosis-list.addnew-tooltip.lbl' | translate}}"
            tooltip-placement="bottom">
            <i class="fa fa-plus" aria-hidden="true"></i>
            <!-- <span translate="clinicalmaster.serviceitem-list.addnew.lbl"></span> -->
        </button>
    </div>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="codescheme"
                translate="clinicalmaster.diagnosis-list.filter_codescheme.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.DiagnosisCodeSchemeId" name="codescheme">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.DiagnosisCodeScheme | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="code"
                translate="clinicalmaster.diagnosis-form.code.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="code" ng-model="item.Code" placeholder="" required>
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="name"
                translate="clinicalmaster.diagnosis-form.name.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="name" ng-model="item.DiagnosisName" placeholder=""
                    required>
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="description"
                translate="clinicalmaster.diagnosis-form.description.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="description" ng-model="item.Description" placeholder="">
            </div>
        </div>

<div class="fooder-bgs">
    <div class="row">
        <div class="pull-left">
            <button type="button" ng-hide="currentcontext.ismodal" class="btn btn-sm pyr-color10"
                ng-click="backToList()">
                <i class="fa fa-angle-left"></i>&nbsp;&nbsp;
                <span translate="common.backaction.lbl"></span>
            </button>
        </div>
        <div class="pull-right">
            <button type="button" class="draftbutton" ng-hide="item.ActiveStatusId>=2" ng-click="save()"
                translate="common.saveaction.lbl"></button>
            <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                ng-click="saveAndApprove()"></button>
