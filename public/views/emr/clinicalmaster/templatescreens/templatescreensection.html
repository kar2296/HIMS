    /**
 * The dnd-list should always have a min-height,
 * otherwise you can't drop to it once it's empty
 */

    .simpleDemo ul[dnd-list] {
        min-height: 42px;
        padding-left: 0px;
        height: 100%;
    }

    /**
 * The dndDraggingSource class will be applied to
 * the source element of a drag operation. It makes
 * sense to hide it to give the user the feeling
 * that he's actually moving it.
 */

    .simpleDemo ul[dnd-list] .dndDraggingSource {
        display: none;
    }

    .simpleDemo ul[dnd-list] li {
        background-color: #fff;
        border: 1px solid #ddd;

<div class="row page-header">
    <div class="col-sm-6">
        <h3 class="panel-title" translate="clinicalmaster.profilesection.pagetitle.lbl"></h3>

    <div class="col-sm-6">
        <!-- <span class="profilename" translate="clinicalmaster.profilesection.profilename.lbl"></span>
            <span class="profileview">{{currentcontext.name}}</span> -->
    </div>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
            <div class="formRoot prof_border clinicalmaster_profilesection">
                <div class="panel panel-default">
                    <div class="panel-body form-panel">
                        <div class="col-sm-12 clearfix">
                            <h4 class="psm_head">TAB ORDER</h4>
                            <div class="col-sm-12" style="padding:15px 0px;">
                                <div id="positionTop" class="simpleDemo">
                                    <ul dnd-list="models.lists.PositionTop">
                                        <li ng-repeat="item in models.lists.PositionTop" dnd-draggable="item"
                                            dnd-moved="models.lists.PositionTop.splice($index, 1)"
                                            dnd-effect-allowed="move" dnd-selected="models.selected = item"
                                            ng-class="{'selected': models.selected === item}">
                                            {{item.Text}}
                                        </li>
                                    </ul>
                                </div>


                            </div>
                            <div class="col-sm-12">
                                <div class="col-sm-6 psm_search">
                                    <!-- <form class="form-search ng-pristine ng-valid" novalidate="true">
                                                    <div class="input-append psm_search">
                                                        <input type="text" class="span4 search-query ng-pristine ng-valid ng-empty ng-touched" on-enter="getPatientList()" ng-model="currentfilter.mrnnricmobilenr" placeholder="Type and hit enter.." name="currentfilter.mrnnricmobilenr" style="width:80%;">
                                                        <a type="submit" class="btn" ng-click="openAdvancedFilter()" data-original-title=""><span class="fas fa-search"></span></a>
                                                    </div>
                                                </form> -->
                                    <input type="text" class="form-control" ng-model="currentcontext.searchtext"
                                        placeholder="Search sections">
                                    <!-- <a type="submit" style="background: darkslategrey;
                                                color: #ccc;" class="btn" ng-click="openAdvancedFilter()" data-original-title=""><span class="fas fa-search"></span></a> -->
                                </div>
                            </div>
                            <div class="panel panel-default cust_head">
                                <div class="panel-body form-panel">
                                    <div class="col-sm-12 sec_body">
                                        <div class="panel panel-info col-sm-8 lst" style="margin-left: 18%;">
                                            <table id="values" style="width: 100%;">
                                                <tr>
                                                    <th
                                                        style="height: 38px; background: #3c547f;color: white; text-align: center;">
                                                        TAB
                                                        ORDER</th>
                                                </tr>
                                                <tr>
                                                    <td style=" overflow-y: scroll !important;">
                                                        <ul dnd-list="models.lists.TotalList">
                                                            <li ng-repeat="item in models.lists.TotalList | filter : currentcontext.searchtext"
                                                                dnd-draggable="item" dnd-moved="itemMoved(item)"
                                                                dnd-effect-allowed="move"
                                                                dnd-selected="models.selected = item"
                                                                ng-class="{'selected': models.selected === item}">
                                                                {{item.Text}}
                                                            </li>
                                                        </ul>
                                                    </td>
                                                </tr>

                                            </table>

                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="fooder-bgs">
                <div class="pull-left">
                    <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()">

                        <span class="btn-fontsize" translate="common.backaction.lbl"></span>

                </div>

                    <button type="submit" class="draftbutton" translate="common.saveaction.lbl"></button>
                    <!-- <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()"
                        translate="common.cancelaction.lbl"></button> -->
                </div>
            </div>
        </form>

</div>
