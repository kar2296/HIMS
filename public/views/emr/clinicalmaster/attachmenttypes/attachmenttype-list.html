
<div class="row page-header">
    <h4 class="col-sm-5 mt0" translate="clinicalmaster.attachmenttype-list.pagetitle.lbl"></h4>

 }}" tooltip-placement="bottom"><i class="fa fa-filter" aria-hidden="true"></i>&nbsp;&nbsp;<span translate="clinicalmaster.serviceitem-list.filter.lbl"></span></button>
        <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addNew()" uib-tooltip="{{ 'clinicalmaster.attachmenttype-list.addnew-tooltip.lbl' | translate

                <i class="fa fa-plus" aria-hidden="true"></i><span translate="clinicalmaster.serviceitem-list.addnew.lbl"></span></button>

    <div class="col-sm-7">
            <div class="filters">
                <div class="search">
                    <input type="text" id="pid" class="form-control" name="filter_allergyname" translate translate-attr-placeholder="clinicalmaster.attachmenttype-list.filter_name.lbl" on-enter="getList()"
                     ng-model="currentfilter.Name" placeholder=""> <i class="fas fa-search" aria-hidden="true"></i>

                </div>
                <button type="button" tabindex="-1" class="btn-add"
                    ng-click="addNew()"  uib-tooltip="{{ 'Manage Attachmenttype' | translate }}"
                    tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                    <!-- <span translate="clinicalmaster.serviceitem-list.addnew.lbl " class="text-white"></span> -->
                </button>
            </div>
        </div>
</div>
  <div class="row filter-area">
    <div class="col-sm-12">
        <div class="col-sm-4">
        <label class="col-sm-4 control-label filter-lbl" translate="clinicalmaster.attachmenttype-list.filter_name.lbl"></label>
        <div class="col-sm-8 input-group"><div class="input-group-addon"><i class="fas fa-search" aria-hidden="true"></i></div>
            <input type="text" class="form-control" name="filter_allergyname" translate translate-attr-placeholder="clinicalmaster.attachmenttype-list.filter_name.lbl" 
            on-enter="getList()" ng-model="currentfilter.Name" placeholder="">
        </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-3 control-label filter-lbl" translate="clinicalmaster.attachmenttype-list.filter_department.lbl"></label>
            <div class="col-sm-5">
                <ui-select ng-model="currentfilter.DepartmentId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-4 control-label filter-lbl" translate="clinicalmaster.attachmenttype-list.filter_status.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    
    </div>
</div>
<div class="container-fluid onerow-filter">
    <div ui-grid="vm.gridConfig" class="table-uigrid"></div>
    <div class="fooder-bgs">
        <div class="row">
             <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
