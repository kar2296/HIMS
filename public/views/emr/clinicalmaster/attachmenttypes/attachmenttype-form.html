<style>
    .modal-lg{width:800px;}
    .panel-body {
        padding: 15px;
        margin-left: 0px;
        margin-top: 40px;
        margin-right: 0px;
        margin-bottom: 0px;
        background-image: url(app/img/bg-body.jpg);
        background-repeat: repeat;
        overflow: auto;
    }
    
    .well {
        min-height: 20px;
        padding: 19px;
        margin-bottom: 0px;
        border: 1px solid #ededed;
        border-radius: 4px;
        background: rgb(233, 246, 253);
        /* Old browsers */
        background: -moz-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* FF3.6-15 */
        background: -webkit-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, rgb(250, 250, 250) 0%, rgb(247, 252, 253) 100%);
        /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid: DXImageTransform.Microsoft.gradient( startColorstr='#e9f6fd', endColorstr='#d3eefb', GradientType=0);
        /* IE6-9 */
        box-shadow: 4px 2px 13px -7px rgba(0, 0, 0, 0.75);
    }
    .modal-content .panel-body{ overflow: inherit;} 
    .formactionbar {
        padding: 5px 15px;
        height: 40px;
        background-color: #ccecf5;
    }
    
    .custom-modal-header {
        margin-bottom: 10px;
        background-color: #597a9a;
        color: #fff;
    }
    
    .modal-content {
        -webkit-box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        box-shadow: -1px 3px 20px 7px rgba(249, 244, 244, 0.5);
    }
    
    .modal-header {
        padding: 4px 10px;
        border-bottom: 1px solid #e5e5e5;
    }
</style>
<div class="modal-header custom-modal-header">
     <div class="col-sm-12 ">
            <h3 class="panel-title" translate="clinicalmaster.attachmenttype-form.pnlattachmenttype.lbl"></h3>
        </div>
     </div>
</div>
<div class="row">
    <div class="col-sm-12 ">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">	
<div>
                <div class="">
                    <div class="panel-body form-panel">	
                       <div class="col-sm-12">	
                            
                            <!-- leftpanel -->
                              <div class="col-sm-7 well clinical_poup">
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="name" translate="clinicalmaster.attachmenttype-form.name.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="name" ng-model="item.Name" placeholder="" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="description" translate="clinicalmaster.attachmenttype-form.description.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="description" ng-model="item.Description" placeholder="" >
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="department" translate="clinicalmaster.attachmenttype-form.department.lbl"></label>
                                    <div class="col-sm-8">
                                        <ui-select ng-model="item.DepartmentId" name="department">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="referrencelink" translate="clinicalmaster.attachmenttype-form.referrencelink.lbl"></label>
                                    <div class="col-sm-5">
                                        <input type="text" class="form-control" name="referrencelink" ng-model="item.ReferrenceLink" 
                                        translate translate-attr-placeholder="common.reflink-placeholder.lbl" >
                                    </div>
                                    <div class="col-sm-3 linkchecker-div"><linkchecker url="item.ReferrenceLink"></linkchecker>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="isactive" translate="clinicalmaster.attachmenttype-form.isactive.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="checkbox" name="isactive" class="custom-checkbox"
                                            ng-model="item.IsActive">
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-5 cust_well">
                                    <div class="form-group">
                                            <label class="col-sm-4 control-label ng-scope"><span class="ng-scope">Comments</span></label>
                                            <div class="col-sm-8">
                                                <textarea name="comments" ng-model="item.SpecialInstruction" maxlength="4000" style="width: 100%; margin-top: 10px; margin-bottom: 0px; height: 71px;" class="notes-textarea ng-pristine ng-valid ng-empty ng-valid-maxlength ng-touched" ng-disabled="item.isl" tabindex="-1"></textarea><div class="validation ng-scope ng-hide" ng-show="attrs.required==''|| attrs.required"><ul class="list-unstyled validation-errors ng-inactive ng-hide" ng-messages="field.$error" ng-show="field.$invalid &amp;&amp; (field.$touched || field.$dirty || form.$triedSubmit)">
                                                    </ul><div class="validation-success" ng-show="field.$valid &amp;&amp; !field.$invalid">
                                                        </div></div>
                                            </div>
                                        </div>
                                       
                                       
                            </div>
                         </div>
                    </div>
                </div>
                            </div>
          <div class="panel-footer formactionbar">
                <div class="pull-right">
                    <button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
                    <button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                    <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>						
                </div>
            </div>
        </form>		
    </div>
</div>
