<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="clinicalmaster.favoritemaster-form.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="backToList()">
        </div>
    </div>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <h4 class="panel-title fav_head" translate="clinicalmaster.favoritemaster-form.pagetitle.lbl"></h4>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="type"
                translate="clinicalmaster.favoritemaster-form.type.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.FavoriteTypeId" name="type" ng-disabled="currentcontext.candisabletype"
                    required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.FavoriteType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="accessibletype"
                translate="clinicalmaster.favoritemaster-form.accessibletype.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.AccessibleTypeId" name="accessibletype" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.AccessibleType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="name" translate="Favourite Name"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="name" ng-model="item.Name" placeholder="" required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="department"
                translate="clinicalmaster.favoritemaster-form.department.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.DepartmentId" name="department">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="user"
                translate="clinicalmaster.favoritemaster-form.user.lbl"></label>
            <div class="col-sm-12">
                <autosearch itemid="item.UserId" iteminfo="" rowdata="" config="vm.usercontrolconfig"
                    isrequired="false">
                </autosearch>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="searchitems"
                translate="clinicalmaster.favoritemaster-form.searchitems.lbl"></label>
            <div class="col-sm-10">
                <favoritedetailcontrol itemtypeid="item.FavoriteTypeId" selectediteminfo="selectediteminfo">
                </favoritedetailcontrol>
            </div>
            <div class="col-sm-2">
                <button class="btn-add" ng-click="addfavoritedetail()">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </form>
</div>
<div class="row" style="margin-top: 10px;">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="pull-right">
            <button type="button" class="draftbutton" ng-click="saveAndApprove()"
                translate="common.saveaction.lbl"></button>
            <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                ng-click="saveAndApprove()"></button>
        </div>
    </div>
</div>
