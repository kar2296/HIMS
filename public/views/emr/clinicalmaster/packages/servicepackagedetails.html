<style>
    .durationtxt {
        width: 50px !important;
        float: left;
        margin-right: 5px;
    }
    
    .ui-select-grid {
        width: 100% !important;
        max-width: 100% !important;
    }
    
    .header-panel {
        margin-bottom: 5px !important;
    }
    
    .header-second-row {
        margin-bottom: -7px !important;
    }
    
    .application-table {
        width: 100%;
    }
    
    .application-table>thead>tr>th,
    .application-table>tbody>tr>th,
    .application-table>tfoot>tr>th,
    .application-table>thead>tr>td,
    .application-table>tbody>tr>td,
    .application-table>tfoot>tr>td {
        padding: 5px;
        line-height: 1.42857143;
        vertical-align: top;
        border-top: none;
    }
    
    .application-table {
        margin-top: 5px;
    }
    
    .application-table thead tr th,
    .application-table tbody tr td {
        border: 1px solid #CFCFCF;
    }
    
    .application-table.borderless tbody tr td,
    .borderless {
        border: none;
    }
    
    .bg-subhead {
        background-color: #90cbef;
        color: #3e3b3b;
        font-size: 14px;
    }
    
    .panel-footer {
        background-color: #ccecf5 !important;
    }
    
    .bg-subhead {
        background-color: #597a9a;
        color: #fff;
        font-size: 14px;
        width: 100%;
    }
    
    .autosearch-div .custom-popup-wrapper {
        position: absolute;
        width: 95% !important;
    }
    
    .row {
        margin-right: -15px;
    }
    
    .content-wrapper {
        border-top: none;
    }
    
    .header-panel-body {
        padding: 3px !important;
        background-color: #e3ecef;
    }
    
    .application-table>tbody>tr>td .dropdown {
        position: relative;
        width: 100%;
    }
    
    #prescriptionpagecontrol .application-table>tbody {
        padding: 15px;
        margin-left: 0px;
        margin-top: 0px;
        margin-right: 0px;
        margin-bottom: 0px;
        background-image: url(app/img/bg-body.jpg);
        background-repeat: repeat;
        overflow: auto;
    }
    
    .table-striped>tbody>tr:nth-of-type(even) {
        background-color: #fafbfc;
    }
    
    /* .formRoot {
        height: 400px;
    } */
    
    .application-table>tbody>tr>td:first-child>.ui-select-grid>.dropdown-menu {
        top: -101px !important;
        left: 15px !important;
        max-height: 130px;
    }
    
    .application-table>tbody>tr:nth-child(1)>td:first-child>.ui-select-grid>.dropdown-menu {
        top: -1px !important;
        left: 15px !important;
        max-height: 130px;
    }
    
    .application-table>tbody>tr:nth-child(2)>td:first-child>.ui-select-grid>.dropdown-menu {
        top: -1px !important;
        left: 15px !important;
        max-height: 130px;
    }
    
    .application-table>tbody>tr:nth-child(3)>td:first-child>.ui-select-grid>.dropdown-menu {
        top: -1px !important;
        left: 15px !important;
        max-height: 130px;
    }
    
    .modal-header {
        padding: 4px 10px;
        border-bottom: 1px solid #e5e5e5;
    }
    
    .panel-body {
        max-height: 400px;
    }
    
    .application-table {
        width: 99%;
    }
    
    button#btnCancelForm {
        width: 33px;
    }
    
    button.addbutton.btn.bt-color2.btn-xs.pull-right.btn-filter {
        margin-bottom: 13px !important;
    }
    
    .fooder-bgs {
        clear: both !important;
        padding: 2px 21px;
    }

</style>
<div class="modal-header custom-modal-header">
    <h4 class="col-sm-11 modal-title custom-modal-title" translate="clinicalmaster.package-form.serviceitem.lbl"></h4>
    <button id="btnCancelForm" type="button" class="col-sm-1 btn btn-danger btn-sm" ng-click="backToList()" translate="X"></button>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="">
            <div>
                <div class="">
                    <div class="">
                        <div class="col-sm-12">
                            <div class="col-sm-2 pull-right">
                                <button class=" addbutton btn bt-color2 btn-xs pull-right btn-filter" ng-click="addNew()" uib-tooltip="{{ 'clinicalmaster.package-form.serviceitem.lbl' | translate }}" tooltip-placement="bottom">
                                    <i class="fa fa-plus" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>
                        <div class="">
                            <div class="formRoot">
                                <!-- grid area starts -->
                                <table class="application-table table-striped table-bordered">
                                    <thead class="bg-subhead">
                                        <tr>
                                            <th class="fs-12 col-sm-4">
                                                <span translate="clinicalmaster.package-form.servicecode.lbl"></span>
                                            </th>
                                            <th class="fs-12">
                                                <span translate="clinicalmaster.package-form.quantity.lbl"></span>
                                            </th>
                                            <th class="fs-12">
                                                <span translate="clinicalmaster.package-form.rate.lbl"></span>
                                            </th>
                                            <th class="fs-12">
                                                <span translate="clinicalmaster.package-form.amount.lbl"></span>
                                            </th>
                                            <th class="fs-12">
                                                <span translate="Is Exclusion"></span>
                                            </th>
                                            <th class="fs-12">
                                                <span translate="clinicalmaster.package-form.action.lbl"></span>
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr ng-repeat="item in serviceDetails | filter:{Status:1}">
                                            <td class="fs-12 ">
                                                <autosearch itemid="item.ServiceItemId" iteminfo="item.SelectedItem" name="'service'" rowdata="item" config="vm.serviceitemcontrolconfig" itemchange="ServiceItemChanged($index,item)" class="inputsearchlogo" candisable="item.RdoServiceId" isrequired="true"></autosearch>
                                            </td>
                                            <td class="fs-12">
                                                <input type="number" class="form-control" ng-model="item.Quantity" ng-change="calAmt($index,item)">
                                            </td>
                                            <td class="fs-12 " align="center">
                                                <input type="text" class="form-control" ng-model="item.Rate" ng-change="calAmt($index,item)" placeholder="" ng-keypress="numberonly($event)">
                                            </td>
                                            <td class="fs-12 " align="center">
                                                <span disabled>{{item.Amount | displaycurrency}}</span>
                                            </td>
                                            <td class="fs-12 " align="center">
                                                <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsExclusion">
                                            </td>
                                            <td>
                                                <div class="col-sm-4"></div>
                                                <div class="col-sm-4">
                                                    <button class="drhms-edit-button" ng-click="deleteServiceDetail($index,item)">
                                                        <img src="assets/svg/delete.svg" alt="">
                                                    </button>
                                                </div>
                                                <div class="col-sm-4"></div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                                <!-- grid area ends -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="fooder-bgs" style="margin-bottom: 44px !important;">
                <div class="col-sm-4">
                    <label class="col-sm-6 col-md-5 text-right control-label filter-lbl" translate="clinicalmaster.package-form.totalamount.lbl"></label>
                    <div class="col-sm-6 col-md-6">
                        <span class="countbg">{{ TotalAmount | displaycurrency }}</span>
                    </div>
                </div>
                <div class="pull-right">
                    <button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl" ng-click="saveItem()"></button>
                </div>
            </div>
        </div>
    </form>
</div>
