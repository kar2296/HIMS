<style>
    .drhms-list-filters .form-group {
        height: 41px;
    }
</style>
<link href="app/css/regbilling.css" rel="stylesheet">
<div class="row ">
    <div class="col-sm-9">
        <h4 class="mt0" translate="clinicalmaster.package-list.pagetitle.lbl"></h4>
    </div>
    <div class="form-group col-sm-3">
        <div class="filters">
            <button type="button" tabindex="-1" class="btn-add" ng-click="addNew()"
                uib-tooltip="{{ 'clinicalmaster.package-list.addnew-tooltip.lbl' | translate }}"
                tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</div>
<div class="row">
    <div class="form-group col-sm-2">
        <label class="col-sm-12" translate="clinicalmaster.package-list.code.lbl"></label>
        <div class="col-sm-12">
            <input type="text" class="form-control" name="ippackagecode" on-enter="getList()"
                ng-model="currentfilter.IPPackageCode" placeholder="">
        </div>
    </div>
    <div class="form-group col-sm-2">
        <label class="col-sm-12" translate="clinicalmaster.package-list.guarantorname.lbl"></label>
        <div class="col-sm-12">
            <ui-select ng-model="currentfilter.GuarantorName" name="guarantorname" ng-change="getList()"
                ng-disabled="item.isDisabled" required>
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.Guarantor | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-2">
        <label class="col-sm-12" translate="clinicalmaster.package-list.guarantor.lbl"></label>
        <div class="col-sm-12">
            <ui-select ng-model="currentfilter.GuarantorTypeId" ng-change="getList()" class="filter-combo"
                ng-disabled="item.isDisabled" required>
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.GuarantorType | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-2">
        <label class="col-sm-12" translate="clinicalmaster.package-list.facility.lbl"></label>
        <div class="col-sm-12">
            <ui-select ng-model="currentfilter.FacilityId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 8 : 0}}
                    <span ng-if="$select.selected.Text.length>8">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-2">
        <label class="col-sm-12" translate="clinicalmaster.package-list.filter_status.lbl"></label>
        <div class="col-sm-12">
            <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 8 : 0}}
                    <span ng-if="$select.selected.Text.length>8">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
