<!--
    Cash Counter (app.cashcounter, CashCounterController) — React view.

    The whole template body now renders through <react-component name="CashCounterScreen">
    (src/react-components/CashCounterScreen.tsx). CashCounterController is unchanged: every
    API call, calculation and save still runs in the existing $scope functions. The React
    view gets its data from the new $scope.buildCashCounterReactProps() and sends input back
    through the new $scope.handleReactAction(), both added at the end of cashcounter.js.
    The previous AngularJS markup is in git history (commit f7d5fc21) for comparison or rollback.

    Behaviour kept exactly as before:
    - Start / Stop / Revert / Save / Submit / Print / Back call Start(), Close(), Revert(),
      Save(), Submit(), print() and backToList() with the same confirmations.
    - Typing a denomination count calls CalculateTotal(denomination), so totals, net
      count/amount and the difference are calculated by the original code. Clearing a count
      leaves its old total in place, as before.
    - Button rules use the same flags (canShowStartBtn, canShowCloseBtn, canShowRevertBtn,
      canShowSaveBtn, canShowSubmitBtn, canShowPrintBtn). The Closing heading with Stop and
      Revert shows only while canShowCloseBtn is true, so Revert is reachable only when both
      flags are true (a running counter found on load), as before.
    - Opening balance and denomination counts accept digits only (numberonly + /^\d+$/).
    - Alt+B goes back to the list.

    Controls not carried over because they never worked in the AngularJS screen:
    - Attachments button: called openattachments(), which the controller does not define,
      and showed an undefined attachment count.
    - "Denomination Other" input: had no ng-model, so nothing typed was kept or saved.
    - OPD Bill, Vitals, Visit Print and the Print dropdown: shown only when EnableOPD or
      Vitals is set, and the controller never sets either, so they never appeared.
    - The second, duplicate Back button.
-->
<react-component name="CashCounterScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
