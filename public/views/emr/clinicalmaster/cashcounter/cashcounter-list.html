<!--
    Cash Counter list (app.cashcounterlist, cashcounterlistController) — React view.

    The template body now renders through <react-component name="CashCounterListScreen">
    (src/react-components/CashCounterListScreen.tsx). cashcounterlistController is unchanged:
    lookups, the list request, the advanced-filter dialog and navigation still run in the
    existing $scope functions. The React view gets its data from the new
    $scope.buildCashCounterListReactProps() and sends input through the new
    $scope.handleReactAction(), both added at the end of cashcounter-list.js. The previous
    AngularJS markup is in git history (commit f7d5fc21).

    Behaviour kept exactly as before:
    - Changing Counters, Status or Doc# Date reloads the list (ng-change="getList()");
      Doc# No reloads on Enter (on-enter). Clearing Doc# Date drops the date from the request.
    - Paging calls getList() with the new page; page size stays 25.
    - The search button opens the same advanced-filter dialog (openAdvancedFilter()).
    - + goes to a new Cash Counter (addNew()); the edit icon opens the row (handleEvents('edit')).
    - Dates and amounts use the same formats as the grid. Rows are not coloured by status:
      the controller's rowTemplate (red for status 3) was never applied by <custom-table>.

    Known issues in the existing controller, left as they are:
    - The advanced filter does not narrow the list: its dates are read into local variables
      that the request never uses (it sends currentfilter.FromOpen/ToOpen/FromClosed/ToClosed,
      which are never set). Applying it only reloads the list.
    - The search button tooltip uses the clinical-master key "Advance Search".
    - Delete code (onDeleteConfirmed) exists but no screen control calls it, and it points at
      the purchase-order delete API.

    Display difference: the dropdowns show full option text instead of cutting it at 8
    characters ("Please S ...").
-->
<link href="app/css/regbilling.css" rel="stylesheet">
<react-component name="CashCounterListScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
