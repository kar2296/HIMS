<link href="app/css/regbilling.css" rel="stylesheet">

<div class="row">
    <h4 class="col-sm-9 mt0" translate="billing.billingcounters.pagetitle.lbl"></h4>
    <div class="col-sm-3">
        <div class="d-end">
            <button ng-click="openAdvancedFilter()"
                uib-tooltip="{{ 'clinicalmaster.serviceitem-list.filter-tooltip.lbl' | translate }}"
                tooltip-placement="bottom" class="drhms-billing-btn drhms-previousbill-btn">
                <i class="fas fa-search" aria-hidden="true"></i>
                <!-- <span translate="clinicalmaster.serviceitem-list.filter.lbl"></span> -->
            </button>
            <button type="button" tabindex="-1" class="btn-add" ng-click="addNew()"
                uib-tooltip="{{ 'billing.billingcounters.addnew-tooltip.lbl' | translate }}" tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-sm-3">
        <label class="col-sm-4" translate="billing.billingcounters.billingcounters.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.BillingCounterId" name="billingcounter" ng-change="getList()">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 8 : 0}}
                    <span ng-if="$select.selected.Text.length>8">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.BillingCounter | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="col-sm-3">
        <label class="col-sm-4" translate="billing.billingcounters.documentstatus.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.BillingCounterStatusId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 8 : 0}}
                    <span ng-if="$select.selected.Text.length>8">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.BillingCounterStatus | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="col-sm-3">
        <label class="col-sm-4" translate="billing.billingcounters.documentdate.lbl"></label>
        <div class="col-sm-8">
            <div class="datepicker">
                <input type="text" class="form-control" name="documentdate" ng-change="getList()"
                    datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="documentdatePopup = { opened: true }"
                    is-open="documentdatePopup.opened" ng-model="currentfilter.DocumentDate">
                <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
        </div>
    </div>
    <div class="col-sm-3">
        <label class="col-sm-4" translate="billing.billingcounters.documentnumber.lbl"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.DocumentNumber"
                placeholder="Document No#">
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
