<style>
    .popup_height{
        height:auto !important;
    }
</style>
<div class="modal-header custom-modal-header">
     <div class="col-sm-12 ">
            <h3 class="panel-title" translate="clinicalmaster.categorytype-form.pagetitle.lbl"></h3>
        </div>
     </div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">	
            <div class="formRoot popup_height" set-form-height>
                <div class="panel panel-default">
                    <div class="panel-body form-panel">	
                        <div class="col-sm-12">			
                            
                            <!-- leftpanel -->
                            <div class="col-sm-6">
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="name" translate="clinicalmaster.categorytype-form.name.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="name" ng-model="item.Name" ng-disabled="canDisableCategoryTypeName()" placeholder="" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="description" translate="clinicalmaster.categorytype-form.description.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="description" ng-model="item.Description" placeholder="" >
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="type" translate="clinicalmaster.categorytype-form.type.lbl"></label>
                                    <div class="col-sm-8">
                                        <ui-select ng-model="item.CategoryTypeRefId" name="type">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.CategoryTypeRef | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="associatedwithcc" translate="clinicalmaster.categorytype-form.associatedwithcc.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="checkbox" name="associatedwithcc" class="custom-checkbox"
                                            ng-model="item.IsAssociatedWithCC">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="active" translate="clinicalmaster.categorytype-form.active.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="checkbox" name="active" class="custom-checkbox"
                                            ng-model="item.IsActive">
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-6 cust_well">
                                    <div class="form-group">
                                            <label class="col-sm-4 control-label ng-scope"><span class="ng-scope">Comments</span></label>
                                            <div class="col-sm-8">
                                                <textarea name="comments" ng-model="item.SpecialInstruction" maxlength="4000" style="width: 100%; margin-top: 10px; margin-bottom: 0px; height: 71px;" class="notes-textarea ng-pristine ng-valid ng-empty ng-valid-maxlength ng-touched" ng-disabled="item.isl" tabindex="-1"></textarea><div class="validation ng-scope ng-hide" ng-show="attrs.required==''|| attrs.required"><ul class="list-unstyled validation-errors ng-inactive ng-hide" ng-messages="field.$error" ng-show="field.$invalid &amp;&amp; (field.$touched || field.$dirty || form.$triedSubmit)">
                                                    </ul><div class="validation-success" ng-show="field.$valid &amp;&amp; !field.$invalid">
                                                        </div></div>
                                            </div>
                                        </div>
                                       
                                       
                            </div>
                            
                            <!-- rightpanel -->
                            <div class="col-sm-6">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="panel-footer formactionbar">
                <div class="pull-right">
                    <button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
                    <button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>						
                </div>
            </div>
        </form>		
    </div>
</div>
