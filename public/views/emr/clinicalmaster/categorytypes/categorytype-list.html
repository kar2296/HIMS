<style>
    @media (min-height: 637px) and (min-width: 1200px){
    .ui-grid-viewport {
    height: 390px !important;
    min-height: 442px;
}}
    @media (min-height: 675px) and (min-width: 1360px){
        .ui-grid-viewport{
    height: 440px;
    min-height: 478px;
}}
@media (device-height:100vh) and (device-width:100vw){
    .ui-grid-viewport{
        min-height: 580px;
    }
}
</style>
<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="clinicalmaster.categorytype-list.pagetitle.lbl"></h4>
    <div class="col-sm-6">
        <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addNew()" uib-tooltip="{{ 'clinicalmaster.categorytype-list.addnew-tooltip.lbl' | translate
            }}" tooltip-placement="bottom">
        <i class="fa fa-plus" aria-hidden="true"></i><span translate="clinicalmaster.categorytype-list.addnew.lbl"></span></button>
    </div>
</div>

  <div class="row filter-area">
    <div class="col-sm-12">
        <div class="col-sm-4">
            <label class="col-sm-5 control-label filter-lbl" translate="clinicalmaster.categorytype-list.filter_name.lbl"></label>
            <div class="col-sm-7 input-group"><div class="input-group-addon"><i class="fas fa-search" aria-hidden="true"></i></div>
                <input type="text" class="form-control" name="filter_name" translate translate-attr-placeholder="clinicalmaster.categorytype-list.filter_name.lbl" on-enter="getList()" ng-model="currentfilter.Name" placeholder="">
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-4 control-label filter-lbl" translate="clinicalmaster.categorytype-list.filter_type.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.CategoryTypeRefId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.CategoryTypeRef | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-4 control-label filter-lbl" translate="clinicalmaster.categorytype-list.filter_status.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </div>
</div>

<div class="container-fluid">    
    <div ui-grid="vm.gridConfig" class="table-uigrid" set-grid-height></div>
    <div class="fooder-bgs">
        <div class="row">
    <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
                </div>
            </div>
            </div>
