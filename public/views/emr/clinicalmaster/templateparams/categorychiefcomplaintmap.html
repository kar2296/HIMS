<div class="row filter-area">
    <div class="col-sm-12">
        <div class="form-group">
            <label class="col-sm-4 control-label" for="cc" translate="patientemr.patientchiefcomplaint-list.chiefcomplaint.lbl"></label>
            <div class="col-sm-4">
                <autosearch itemid="currentcontext.chiefComplaintId" config="vm.chiefcomplaintconfig" iteminfo="currentcontext.selectedCC"
                    itemchange="chiefComplaintChange()"></autosearch>
            </div>
        </div>
        <div class="col-sm-8"></div>
    </div>
</div>
<div class="container-fluid onerow-filter">
    <div ui-grid="vm.gridConfig" class="table-uigrid"></div>
    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
