<style>
    .modal-lg {
        width: 700px !important;
        height: 250px !important;
    }
    
    .panel-body {
        padding: 15px;
        margin-left: 0px;
        margin-top: -53px;
        margin-right: 0px;
        margin-bottom: 0px;
        background-image: url(app/img/bg-body.jpg);
        background-repeat: repeat;
        overflow: auto;
    }
    
    .well {
        min-height: 20px;
        padding: 19px;
        margin-bottom: 0px;
        border: 1px solid #ededed;
        border-radius: 4px;
        background: rgb(233, 246, 253);
        /* Old browsers */
        background: -moz-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* FF3.6-15 */
        background: -webkit-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, rgb(250, 250, 250) 0%, rgb(247, 252, 253) 100%);
        /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid: DXImageTransform.Microsoft.gradient( startColorstr='#e9f6fd', endColorstr='#d3eefb', GradientType=0);
        /* IE6-9 */
        box-shadow: 4px 2px 13px -7px rgba(0, 0, 0, 0.75);
    }
    
    .formactionbar {
        padding: 5px 15px;
        height: 40px;
        background-color: #ccecf5;
    }
    
    .custom-modal-header {
        margin-bottom: 10px;
        background-color: #597a9a;
        color: #fff;
    }
    
    .modal-content {
        -webkit-box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        box-shadow: -1px 3px 20px 7px rgba(249, 244, 244, 0.5);
    }
    
    .modal-header {
        padding: 4px 10px;
        border-bottom: 1px solid #e5e5e5;
    }
    
    .autosearch-div .custom-popup-wrapper {
        position: absolute;
        width: 180%!important;
    }
    
    .modal-content .panel-body {
        overflow: inherit;
    }
    
    .topright .dropdown-menu {
        top: -101px !important;
        left: 15px !important;
        max-height: 130px;
    }
    
    /* .ui-select-bootstrap>.ui-select-choices {
        width: 100%;
        height: auto;
        max-height: 205px;
        overflow-x: inherit;
        margin-top: -1px;
    } */
    .ui-select-bootstrap>.ui-select-choices {
    width: 100%;
    height: auto;
    max-height: 205px;
    overflow-x: auto;
    margin-top: -1px;
}
</style>
<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="clinicalmaster.carepathprescriptions.pagetitle.lbl"></h4>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
            <div class="panel panel-default">
                <!--<div class="panel-heading"><h3 class="panel-title" translate="clinicalmaster.procedurealias-form.pnldetails.lbl"></h3></div>!-->
                <div class="panel-body form-panel">
                    <div class="col-sm-10">
                        <!-- leftpanel -->
                        <div class="form-group">
                            <label class="col-sm-5 control-label" for="drug" translate="clinicalmaster.carepathprescriptions.drugname.lbl"></label>
                            <div class="col-sm-7">
                                <!--<autosearch itemid="item.DrugId" iteminfo="item.SelectedItem" name="'drug'" rowdata="item" config="vm.drugcontrolconfig"
                                            ng-if="!item.IsGeneric" itemchange="drugChanged($index,item)" class="inputsearchlogo"
                                            candisable="IsDisabled" isrequired="true"></autosearch>-->
                                <!--<autosearch itemid="item.GenericId" iteminfo="item.SelectedItem" name="'generic'" rowdata="item" config="vm.genericcontrolconfig"ng-if="item.IsGeneric" 
                                                itemchange="drugChanged($index,item)" class="inputsearchlogo" isrequired="true"></autosearch>-->
                                <!--<drugcontrol drugid="item.DrugId" drugrouteid="item.DrugRouteId" rxname="item.RxName"                                           drugfrequencyid="item.DrugFrequencyId" changeev="drugChanged($index,item)" ng-show="!item.IsGeneric"></drugcontrol>-->
                                <!--<genericcontrol genericid="item.GenericId" changeev="drugChanged($index,item)" rxname="item.RxName" ng-disabled="IsDisabled"
                                            ng-show="item.IsGeneric"></genericcontrol>-->

                                <autosearch itemid="item.DrugId" iteminfo="" rowdata="" name="'drug'" config="vm.drugcontrolconfig" itemchange="getgenerics()" isrequired="true"></autosearch>

                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-5 control-label" for="genricname" translate="clinicalmaster.carepathprescriptions.genericname.lbl"></label>
                            <div class="col-sm-7">
                                <!--<autosearch itemid="item.GenericId" iteminfo="item.SelectedItem" name="'drug'" rowdata="item" config="vm.genericcontrolconfig"
                                            ng-if="!item.IsGeneric" itemchange="drugChanged($index,item)" class="inputsearchlogo"
                                            candisable="IsDisabled" isrequired="true"></autosearch>-->
                                <autosearch itemid="item.GenericId" iteminfo="" rowdata="" config="vm.genericcontrolconfig" itemchange=""></autosearch>
                                <!--<ui-select ng-model="item.GenericId" name="genricname" required>
                                    <ui-select-match>
                                        {{$select.selected.Text | limitTo : 20 : 0}}
                                        <span ng-if="$select.selected.Text.length>20">...</span>
                                    </ui-select-match>
                                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Generic | filter: { Text: $select.search }">
                                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                    </ui-select-choices>
                                </ui-select>-->
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-5 control-label" for="dosage" translate="clinicalmaster.carepathprescriptions.dosage.lbl"></label>
                            <div class="col-sm-7">
                                <input type="text" name="dosage" class="form-control" ng-model="item.Dosage" required>

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-5 control-label" for="quantity" translate="clinicalmaster.carepathprescriptions.quantity.lbl"></label>
                            <div class="col-sm-7">
                                <input type="number" name="quantity" class="form-control" ng-model="item.Quantity" required>

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-5 control-label" for="duration" translate="clinicalmaster.carepathprescriptions.Duration.lbl"></label>
                            <div class="col-sm-7">
                                <input type="number" name="duration" class="form-control" ng-model="item.Duration" required>

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-5 control-label" for="drugroute" translate="clinicalmaster.carepathprescriptions.drugroute.lbl"></label>
                            <div class="col-sm-7">
                                <ui-select ng-model="item.DrugRouteId" name="drugroute" required>
                                    <ui-select-match>
                                        {{$select.selected.Text | limitTo : 20 : 0}}
                                        <span ng-if="$select.selected.Text.length>20">...</span>
                                    </ui-select-match>
                                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.DrugRoute | filter: { Text: $select.search }">
                                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                    </ui-select-choices>
                                </ui-select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-5 control-label" for="drugfrequency" translate="clinicalmaster.carepathprescriptions.drugfrequency.lbl"></label>
                            <div class="col-sm-7">
                                <ui-select ng-model="item.DrugFrequencyId" name="drugfrequency" required>
                                    <ui-select-match>
                                        {{$select.selected.Text | limitTo : 20 : 0}}
                                        <span ng-if="$select.selected.Text.length>20">...</span>
                                    </ui-select-match>
                                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.DrugFrequency | filter: { Text: $select.search }">
                                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                    </ui-select-choices>
                                </ui-select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-5 control-label" for="eventtype" translate="clinicalmaster.carepathprescriptions.comments.lbl"></label>
                            <div class="col-sm-7">
                                <commentscontrol comments="item.Comments"></commentscontrol>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-5 control-label" for="eventtype" translate="clinicalmaster.carepathassessment-form.ismanditory.lbl"></label>
                            <div class="col-sm-7">
                                <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsManditory">
                            </div>
                        </div>
                        <!-- rightpanel -->

                    </div>
                </div>
            </div>
            <div class="panel-footer formactionbar">
                <div class="pull-right">
                    <button type="submit" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
