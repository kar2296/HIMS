<style>
    .btn {
        white-space: normal !important;
    }

    .ui-select-multiple {
        min-height: 100px !important;
    }

    #fullregistrationheight .well {
        min-height: 500px;
    }

    .autosearch-div .custom-popup-wrapper {
        position: absolute;
        width: 125%!important;
    }

    .panel-footer {
        padding: 16px 24px;
        background-color: #fafafa;
        border-top: 1px solid #eeeeee;
        border-bottom-right-radius: 3px;
        border-bottom-left-radius: 3px;
    }
</style>
<div class="row" id="fullregistrationheight">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot">
                <div class="panel panel-default bg-pattern">
                    <!--  <div class="panel-heading"><h3 class="panel-title" translate="clinicalmaster.carepath-form.pnldetails.lbl"></h3></div>-->
                    <div class="panel-body form-panel">
                        <div class="col-sm-12 ">

                            <!-- leftpanel -->
                            <div class="col-sm-6">
                                <div class="col-sm-12 well">

                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="code" translate="clinicalmaster.carepath-form.code.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="code" ng-model="item.Code" placeholder="" required>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="name" translate="clinicalmaster.carepath-form.name.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="name" ng-model="item.Name" placeholder="" required>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="description" translate="clinicalmaster.carepath-form.description.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="description" ng-model="item.Description" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="version" translate="clinicalmaster.carepath-form.type.lbl"></label>
                                        <div class="col-sm-8">
                                            <ui-select ng-model="item.CarePathTypeId" name="version">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.CarePathType | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="department" translate="clinicalmaster.carepath-form.departments.lbl"></label>
                                        <div class="col-sm-8">
                                            <ui-select ng-model="item.DepartmentId" name="department" required>
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" translate="appointment.appointmentsession-form.speciality.lbl"></label>
                                        <div class="col-sm-8">
                                            <ui-select ng-model="item.SpecialityId" ng-disabled="canDisableDepartment()">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Speciality | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="file" translate="patientemr.patientdocument-form.document.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="file" ngf-select ng-model="currentcontext.file" name="file" ngf-max-size="200MB" ngf-change="fileSelected()"
                                            />
                                        </div>
                                    </div>                        

                                </div>
                            </div>
                            <!-- rightpanel -->
                            <div class="col-sm-6">
                                <div class="col-sm-12 well">


                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="diagnosis" translate="clinicalmaster.carepath-form.diagnosis.lbl"></label>
                                        <div class="col-sm-8">

                                            <autosearch itemid="item.DiagnosisId" iteminfo="" rowdata="" name="'diagnosis'" config="vm.diagnosiscontrolconfig" itemchange="getDiagnosis()"
                                                tabindex="-1" isrequired="true"></autosearch>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="proceduretype" translate="clinicalmaster.carepath-form.alosdays.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" ng-model="item.Alos">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" translate="appmanager.dept.activefrom.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="activefrom" ng-date-object datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                                                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                                                ng-click="activefromPopup = { opened: true }" is-open="activefromPopup.opened"
                                                ng-model="item.Activefrom">
                                        </div>
                                    </div>
                                    <!--<div class="form-group">
                                        <label class="col-sm-4 control-label" translate="appmanager.dept.activeto.lbl"></label>
                                        <div class="col-sm-8 topright">
                                            <input type="text" class="form-control" name="activeto" ng-date-object datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                                                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                                                ng-click="activetoPopup = { opened: true }" is-open="activetoPopup.opened" ng-model="item.ActiveTo">
                                        </div>
                                    </div>-->
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" translate="appmanager.dept.activeto.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="text" class="form-control" name="activeto" ng-date-object datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                                                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                                                ng-click="activetoPopup = { opened: true }" is-open="activetoPopup.opened" ng-model="item.Activeto">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="procedureoperationtype" translate="clinicalmaster.carepath-form.specialinstruction.lbl"></label>
                                        <div class="col-sm-8">
                                            <textarea name="comments" ng-model="item.SpecialInstruction" maxlength="4000" style="width:100%;" class="notes-textarea"
                                                ng-disabled="item.isl" tabindex="-1"></textarea>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" for="isactive" translate="clinicalmaster.allergy-form.isactive.lbl"></label>
                                        <div class="col-sm-8">
                                            <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
    </div>
    <div class="site-footer panel-footer">
        <button type="button" class="btn btn-sm pyr-color10" ng-click="backToList()"><i class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button>
        <div class="footer-right">
            <button type="button" class="draftbutton" ng-click="SaveandDraft()" translate="common.saveaction.lbl"></button>
            <button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="SaveandApprove()"></button>
            <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
            <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
        </div>
    </div>
    </form>
</div>
</div>
