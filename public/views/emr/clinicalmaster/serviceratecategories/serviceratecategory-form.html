<style>
    /* .modal-dialog {
        width: 800px;
        margin: 30px auto;
    } */

    .form-horizontal .form-group {
        height: 62px;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="clinicalmaster.serviceratecategory-form.pagetitle.lbl">
        </h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="serviceratecategory"
                translate="clinicalmaster.serviceratecategory-form.serviceratecategory.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="serviceratecategory" ng-model="item.ServiceRateCategory"
                    placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="description"
                translate="clinicalmaster.serviceratecategory-form.description.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="description" ng-model="item.Description" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="encountertype"
                translate="clinicalmaster.serviceratecategory-form.encountertype.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.EncounterTypeId" name="encountertype">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.EncounterType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="primarycategory"
                translate="clinicalmaster.serviceratecategory-form.primarycategory.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.PrimaryCategoryId" name="primarycategory">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.PrimaryCategory | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="tarifftype" translate="Tariff Type"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.TariffTypeId" name="tarifftype">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.GuarantorType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="percentage"
                translate="clinicalmaster.serviceratecategory-form.percentage.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="percentage" ng-model="item.Percentage" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="isbasic"
                translate="clinicalmaster.serviceratecategory-form.isbasic.lbl"></label>
            <div class="col-sm-12">
                <input type="checkbox" name="isbasic" class="custom-checkbox" ng-model="item.IsBasic">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="isdefault"
                translate="clinicalmaster.serviceratecategory-form.isdefault.lbl"></label>
            <div class="col-sm-12">
                <input type="checkbox" name="isdefault" class="custom-checkbox" ng-model="item.IsDefault">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="isactive"
                translate="clinicalmaster.serviceratecategory-form.isactive.lbl"></label>
            <div class="col-sm-12">
                <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="IsAllFacility" translate="IsAllFacility"></label>
            <div class="col-sm-12">
                <input type="checkbox" name="IsAllFacility" class="custom-checkbox" ng-model="item.IsAllFacility">
            </div>
        </div>
    </form>
</div>
<div class="row">
    <div class="pull-right">
        <button type="button" class="draftbutton text-white btn-sm" translate="common.saveapprove-action.lbl"
            ng-click="saveAndApprove()"></button>
    </div>
</div>
