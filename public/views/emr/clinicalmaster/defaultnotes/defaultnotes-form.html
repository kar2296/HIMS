<style>
    .panel-body.form-panel {
        overflow-x: hidden;
    }
    
    .form-group {
        margin-bottom: 6px;
        height: 70px;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-12 ">
        <div class="col-sm-6">
            <h3 class="panel-title" translate="Manage Default Notes"></h3>
        </div>
        <div class="col-sm-6">
            <div class="filters">
                <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
            </div>
        </div>
    </div>
</div>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div>
                <div class="row">
                    <div class="col-sm-4 form-group">
                        <label class="col-sm-12 control-label" for="type" translate="Type"></label>
                        <div class="col-sm-12">
                            <ui-select ng-model="item.DefaultNoteTypeId">
                                <ui-select-match>
                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                </ui-select-match>
                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.DefaultNoteType | filter: { Text: $select.search }">
                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                </ui-select-choices>
                            </ui-select>
                        </div>
                    </div>
                    <div class="col-sm-4 form-group">
                        <label class="col-sm-12 control-label" for="notes" translate="Notes"></label>
                        <div class="col-sm-12">
                            <textarea rows="3" name="notes" ng-model="item.Notes" maxlength="4000" style="width:100%;" class="notes-textarea"></textarea>
                        </div>
                    </div>
                    <div class="col-sm-4 form-group">
                        <label class="col-sm-12 control-label" for="isactive" translate="inventory.itemmaster.isactive.lbl"></label>
                        <div class="col-sm-12">
                            <input type="checkbox" class="custom-checkbox" name="isactive" ng-model="item.IsActive">
                        </div>
                    </div>
                </div>
                <div class="fooder-bgs" style="margin-bottom:6px;">
                    <div class="pull-right">
                        <button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
                        <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                    </div>
                </div>
        </form>
        </div>
    </div>
