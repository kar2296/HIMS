<style>
    #clinical-tab { overflow: inherit; max-height: 465px;}
	.bg-pattern { overflow: inherit;}
</style>
<div class="row page-header">
    <h4 class="active col-sm-12 mt0" translate="clinicalmaster.ticksheet-form.pagetitle.lbl"></h4>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form" >	
                <div class="panel panel-default bg-pattern">
                    <!--<div class="panel-heading"><h3 class="panel-title" translate="clinicalmaster.ticksheet-form.pnlticksheet.lbl"></h3></div>!-->
                    <div class="panel-body form-panel">	
                       <div id="clinical">
                            <div class="col-sm-12">			
                            <!-- leftpanel -->
                            <div class="col-sm-6">
                              <div class="col-sm-12 well">
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="type" translate="clinicalmaster.ticksheet-form.type.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <ui-select ng-model="item.TickSheetTypeId" name="type" required autofocus>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.TickSheetType | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="department" translate="clinicalmaster.ticksheet-form.department.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <ui-select ng-model="item.DepartmentId" name="department" required autofocus>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="subdepartment" translate="clinicalmaster.ticksheet-form.subdepartment.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <ui-select ng-model="item.SubDepartmentId" name="subdepartment">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.SubDepartment | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="name" translate="clinicalmaster.ticksheet-form.name.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="name" ng-model="item.TickSheetName" placeholder="" required autofocus>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="mastertype" translate="clinicalmaster.ticksheet-form.mastertype.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <ui-select ng-model="item.TickSheetMasterTypeId" name="mastertype" ng-change="mastertypechanged($select.selected)" required autofocus>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.TickSheetMasterType | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="itemid" translate="clinicalmaster.ticksheet-form.itemid.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <ticksheetitemcontrol
                                                itemtypeid="item.TickSheetMasterTypeId" selectediteminfo="selectediteminfo" changeev = "itemselected()" ></ticksheetitemcontrol>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="displayorder" translate="clinicalmaster.ticksheet-form.displayorder.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="displayorder" ng-model="item.DisplayOrder" placeholder="" >
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="isactive" translate="clinicalmaster.ticksheet-form.isactive.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="checkbox" name="isactive" class="custom-checkbox"
                                            ng-model="item.IsActive">
                                    </div>
                                </div>
                            </div>
                        </div>
                            <!-- rightpanel -->
                            </div>
                    </div>
                </div>
            </div>
            <div class="site-footer panel-footer">
                <button type="button" class="btn btn-sm pyr-color10" ng-click="backToList()"><i class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button>
                <div class="footer-right">
                    <button type="button" class="draftbutton" ng-click="saveAndApprove()"" translate="common.saveaction.lbl"></button>
                    <button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                    <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>						
                </div>
            </div>
        </form>		
    </div>
</div>
