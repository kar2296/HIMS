<style>
    .modal-dialog {
        width: 500px;
        margin: 0px auto;
        margin-top: 18%;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-6">
        <h4 class="panel-title" translate="Hospital"></h4>
    </div>
    <div class="col-sm-6">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>
<div class="containet" id="facility-popup">
    <div class="row">
        <div class="col-sm-12">
            <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
                <div class="col-lg-12" align="center">
                    <!-- <ui-select id="title" ng-change="" name="facility" ng-model="item.FacilityId"> -->
                    <ui-select id="title" ng-change="setFacility(Facility)" name="facility" ng-model="Facility">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 50 : 0}}
                            <span ng-if="$select.selected.Text.length>50">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem in lookup.Facility | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                            </div>
                        </ui-select-choices>
                    </ui-select>
                </div>
                <div>
                    <div class="pull-right">
                        <!-- <button type="button" id="cancelbutton" tabindex="-1" class="cancelbutton btn-danger text-white"
                            ng-click="cancelCallback()">Cancel</button> -->
                        <button type="button" style="margin-top:20px !important;" id="" class="draftbutton" translate="Submit"
                            ng-click="saveAndApprove()"></button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
