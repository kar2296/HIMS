<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Claim Receipt"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="date" translate="Bill Amount"></label>
            {{item.PatientBill.BillNumber}}
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="date" translate="Payer Name"></label>
            {{item.PatientBill.GuarantorName}}
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="date" translate="Total Bill Amount"></label>
            {{item.PatientBill.BillAmount}}
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="date" translate="Payer Due Amount"></label>
            {{item.PatientBill.NetInsuranceAmount}}
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="date" translate="Payment Received"></label>
            {{item.ReceivedAmount}}
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="date" translate="TDS"></label>
            {{item.TDSAmount}}
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="date" translate="DisAllowance"></label>
            {{item.InsuranceName}}
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="date" translate="Remarks"></label>
            {{item.Comments}}
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="date" translate="Payment Received Date"></label>
            {{item.UpdatedAt | date : 'dd-MMM-yyyy'}}
        </div>
        </div>

</div>

        </div>

</div>
