<style>
    .signdiv {
        padding: 10px 10px 40px 10px;
        margin: 0 auto 0 auto;
    }

    .signdiv .signature {
        margin: 0 auto;
        cursor: pointer;
    }

    .signdiv .signature canvas {
        border: 1px solid #999;
        margin: 0 auto;
        cursor: pointer;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="common.signature.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>
<div class="row">
    <div class="signdiv">
        <signature-pad accept="accept" clear="clear" height="220" width="568" dataurl="dataurl"></signature-pad>
    </div>
</div>
<div class="">
    <div class="row">
        <div class="pull-right">
            <button type="button" class="draftbutton" ng-click="clear()" translate="common.clearaction.lbl"></button>
            <button type="button" class="draftbutton" ng-click="doneAction()"
                translate="common.doneaction.lbl"></button>
            <!-- <button id="btnCancelForm" type="button" class="draftbutton" ng-click="cancelCallback()" translate="common.cancelaction.lbl"></button> -->
        </div>
    </div>
</div>
