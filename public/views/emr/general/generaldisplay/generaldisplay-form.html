<style>
    .modal-lg {
        width: 500px;
    }
    
    .modal-header {
        padding: 4px 10px;
        border-bottom: 1px solid #e5e5e5;
    }
     .formRoot { overflow: inherit;}
    .modal-content .panel-body { overflow: inherit;}
</style>
<div class="modal-header custom-modal-header">
    <h4 class="panel-title" translate="appointment.generaldisplay-form.pnlgeneraldisplay.lbl"></h4>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
   
                <div class="panel-body form-panel">
                    <div class="well">
                     

                            <!-- leftpanel -->
                            <div class="form-group">
                                <label class="col-sm-4 control-label filter-lbl" translate="appointment.generaldisplay-list.filter_date.lbl"></label>
                                <div class="col-sm-8">
                                    <input type="text" class="form-control" name="dddate" ng-date-object datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                                        ng-click="activetoPopup = { opened: true }" is-open="activetoPopup.opened" ng-model="item.Displaydate"
                                        ng-disabled="item.isCompleted">

                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-4 control-label" for="location" translate="appointment.generaldisplay-form.location.lbl"></label>
                                <div class="col-sm-8">
                                    <ui-select ng-model="item.LOCATIONId" name="location" ng-change="getList()" class="filter-combo" required>
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 8 : 0}}
                                            <span ng-if="$select.selected.Text.length>8">...</span>
                                        </ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.LOCATION | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-4 control-label" for="displayno" translate="appointment.generaldisplay-form.displayno.lbl"></label>
                                <div class="col-sm-8">
                                    <ui-select ng-model="item.DisplayNoId" name="displayno" ng-change="getList()" class="filter-combo" required>
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 8 : 0}}
                                            <span ng-if="$select.selected.Text.length>8">...</span>
                                        </ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.DisplayNo | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-4 control-label" for="displaycontent" translate="appointment.generaldisplay-form.displaycontent.lbl"></label>
                                <div class="col-sm-8">
                                    <input type="text" class="form-control" name="displaycontent" ng-model="item.DisplayText" placeholder="" required>

                                </div>
                            </div>
                    </div>
                </div>

            <div class="panel-footer formactionbar">
                <div class="pull-right">
                    <button type="submit" class="draftbutton" ng-click="save()" translate="common.saveaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
