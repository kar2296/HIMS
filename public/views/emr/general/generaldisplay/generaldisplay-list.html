<style>
    .pager-div {
        float: right;
        right: 0;
        box-sizing: border-box;
        position: fixed;
        box-sizing: border-box;
    }
</style>

<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="appointment.generaldisplay-list.pagetitle.lbl"></h4>
    <div class="col-sm-6">
        <button class="btn bt-color3 btn-xs pull-right btn-filter" ng-click="" uib-tooltip="{{ '  clinicalmaster.serviceitem-list.filter-tooltip.lbl' | translate}}"
            tooltip-placement="bottom"><i class="fa fa-filter" aria-hidden="true"></i>&nbsp;&nbsp;<span translate="clinicalmaster.serviceitem-list.filter.lbl"></span></button>
            <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addNew()" uib-tooltip="{{ 'appointment.generaldisplay-list.addnew-tooltip.lbl' | translate
}}" tooltip-placement="bottom"><i class="fa fa-plus" aria-hidden="true"></i><span translate="clinicalmaster.serviceitem-list.addnew.lbl"></span></button>
    </div>
</div>
<div class="row filter-area">
    <div class="">
        <div class="col-sm-3">
            <label class="col-sm-5 col-md-4 control-label filter-lbl" translate="appointment.generaldisplay-list.filter_date.lbl"></label>
            <div class="col-sm-7 col-md-8">
                <input type="text" class="form-control" name="date" ng-change="getList()" datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}" ng-click="dateofbirthPopup = { opened: true }"
                    is-open="dateofbirthPopup.opened" ng-model="currentfilter.Displaydate">
             <!--<input type="text" class="form-control" name="registereddate" ng-change="getList()" datepicker-options="datePickerOptions"
                    show-button-bar="{{datePickerOptions.showButtonBar}}" uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="registereddatePopup = { opened: true }" is-open="registereddatePopup.opened"
                    ng-model="item.Displaydate">-->
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-6 col-md-5 control-label filter-lbl" translate="appointment.generaldisplay-list.filter_location.lbl"></label>
            <div class="col-sm-3">
                <ui-select ng-model="currentfilter.LOCATIONId" ng-change="getList()" class="filter-combo" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.LOCATION | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>

        <div class="col-sm-3">
            <label class="col-sm-6 col-md-5 control-label filter-lbl" translate="appointment.generaldisplay-list.filter_displayid.lbl"></label>
            <div class="col-sm-3">
                <ui-select ng-model="currentfilter.DisplayNoId" ng-change="getList()" class="filter-combo" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.DisplayNo | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-6 col-md-5 control-label filter-lbl" translate="appointment.generaldisplay-list.filter_status.lbl"></label>
            <div class="col-sm-3">
                <ui-select ng-model="currentfilter.GeneralDisplayStatusId" ng-change="getList()" class="filter-combo" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.GeneralDisplayStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>

    </div>
</div>
<div class="container-fluid single-filter">
    <div ui-grid="vm.gridConfig" class="table-uigrid"></div>
    <div class="site-footer">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
