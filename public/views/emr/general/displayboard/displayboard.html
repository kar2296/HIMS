<script src="app/js/bootstrap.min.js"></script>
<div id="myCarousel" class="carousel slide" data-ride="carousel">
    <!-- Wrapper for slides -->
    <div class="carousel-inner" role="listbox">
        <div class="item active">
            <table class="table table-hover table-responsive table-bordered">
                <thead class="bg-subhead">
                    <tr> 
                        <th class="roomno"><span translate="appointment.displayboards.roomno.lbl"></span></th>
                        <th class="drname"><span translate="appointment.displayboards.Doctorname.lbl"></span></th>
                        <th class="contime"><span translate="appointment.displayboards.consultationtime.lbl"></span>
                            <button id="btnCancelForm" class="btn pull-right btn-xs btn-danger fa fa-close" ng-click="backToList()"></button>
                        </th>
                    </tr>
                </thead>
                <tbody class="view_disp">
                    <tr ng-repeat="item in DoctorDisplay | filter:{Status:1}">
                        <td class="roomno">
                            <span><b>{{item.RoomNo}}</b></span>
                        </td>
                        <td class="drname">
                            <span><b>{{item.User.Title.Description}} {{item.User.FirstName}} {{item.User.LastName}}</b></span>
                            <div class="dept" ng-if="item.Department.DepartmentName">({{item.Department.DepartmentName}})</div>
                        </td>
                        <td class="contime">
                            <b><span ng-if="item.Availablefrom">{{item.Availablefrom}} - {{item.Availableto}}</b></span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>
