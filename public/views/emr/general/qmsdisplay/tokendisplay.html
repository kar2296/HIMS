<style>
    table {

    }

    table>tbody>tr>td {

    }
    .table-hover>tbody>tr:hover {

    }
   @media screen and (min-width: 1366px) {

    }

    }

    }

    }

    }
    b,
    strong {

    }
    @media screen and (min-width: 1360px) {
        .view_disp tr {
           height:5.4em !important;
        }}
    @media (device-width: 100vw) and (device-height: 100vh) {
        .modal-open .modal {
            overflow: hidden !important;}
        .carousel-inner {
            height: 745px !important;
        }
        .modal-dialog .modal-full {

        }}
    table {
        height: 100%;
        width: 100%;
    }
    table tr {
        width: 100%;
        height: 11.11%;

        width: 20%;
       color:#ffffff !important;
        }

        width: 60%;

        }
    td.cust_name div {
     color:#ffd700;
    font-weight: 500;
    font-family:serif;
    }
    th.cust_no {

    }
    td.cust_no {
        width: 20%;
      /* color:#00ff2a !important; */

      color:#b4ff00 !important;
        }
    .left {
        text-align: left !important;
    }
    .cust_name b strong,.cust_no b strong{
        font-size:24px;
        color: #ffffff;
    }
    td.cust_name span{

        text-overflow: ellipsis;
        overflow: hidden;
        white-space: nowrap;
        text-align: left;
    }
    tbody.view_disp{
        /* background: #6a5acd; */
        background: #3706f9f7;
        /* background: #063af9; */
    }
    .table>thead>tr>th, .table>tbody>tr>th, .table>tfoot>tr>th, .table>thead>tr>td, .table>tbody>tr>td, .table>tfoot>tr>td{
        border:2px solid #daa520;
    }
    
    table.table.table-hover.table-responsive.table-bordered>tbody>tr:nth-child(odd) {
    background: white;
}
table.table.table-hover.table-responsive.table-bordered>tbody>tr:nth-child(even) {
    background: whitesmoke;
    border: 1px solid white !IMPORTANT;
}
table.table.table-hover.table-responsive.table-bordered>tbody>tr>td {
    border: unset !IMPORTANT;
    border-bottom: 1px solid gainsboro !important;
    color: black !important;
}
.table-hover>tbody>tr:hover {
    background-color: #ffe186 !important;
}
.table>thead>tr>th {
    padding: 5px 8px !important;
    color: #888;
    text-align: center !important;
}   
</style>
<script src="app/js/bootstrap.min.js"></script>
<div id="myCarousel" class="carousel slide" data-ride="carousel">
    <!-- Wrapper for slides -->
    <div class="carousel-inner" role="listbox">
        <div class="item active" id="bg_color">
            <table class="table table-hover table-responsive table-bordered">
                <thead class="bg-subhead">
                    <tr>
                        <th class="cust_token"><span translate="ordermanagement.token.token.lbl"></span>
                        </th>
                        <th class="cust_name"><span translate="ordermanagement.token.name.lbl"></span>
                        </th>
                        <th class="cust_no"><span translate="ordermanagement.token.room.lbl"></span>
                            <button type="button" class=" btn btn-xs btn-danger float-right" ng-click="cancelCallback()" aria-label="Close">
                                <span aria-hidden="true">X</span>
                            </button>
                        </th>
                    </tr>
                </thead>
                <tbody class="view_disp">
                    <tr ng-repeat="item in TokenDisplay | filter:{Status:1,TokenStatusId:2}">
                        <td class="cust_token">
                            <span><b>{{item.TokenNo}}</b></span>
                        </td>
                        <td class="cust_name">
                            <span><b>{{item.Patient.Title.Description}} {{item.Patient.FirstName}} {{item.Patient.LastName}}</b></span>
                            <div class="age" ng-if="item.Patient.Age">({{item.Patient.Gender.Description}} - {{item.Patient.Age}} Years)</div>
                        </td>
                        <td class="cust_no">
                            <span><b>{{item.RoomNo}}</b></span>
                        </td>
                    </tr>
                </tbody>
            </table>
            <table class="table table-hover table-responsive table-bordered">
                    <div style="font-size: 30px;color:#8c018c;">Missed Tokens:</div>
                    <tbody class="view_disp">
                        <tr>
                            <td class="left">
                                <span><b>{{MissedDisplay}}</b></span>
                            </td>
                        </tr>
                    </tbody>
            </table>

        </div>
    </div>
</div>
