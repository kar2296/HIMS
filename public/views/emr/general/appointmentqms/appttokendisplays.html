<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-4">
            <label class="col-sm-12 control-label" for="locationId"
                translate="appointment.doctordisplay-form.locationId.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="currentfilter.LocationId" name="locationId">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.QmsLocation | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>

        <!-- <div class="col-sm-10">
