
<style>
 .modal-lg {
    width: 500px;
}
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-12 ">
        <h3 class="panel-title" translate="appointment.doctordisplay-form.pnlallergy.lbl"></h3>
    </div>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div>
                <div class="">
                    <div class="panel-body form-panel">
                        <div class="well  ">
                            <!-- leftpanel -->
                                <div class="form-group">
                                    <label class="col-sm-4 control-label text-right filter-lbl" for="Doctorname" translate="appointment.doctordisplay-list.Doctorname.lbl"></label>
                                    <div class=" col-sm-7">
                                        <autosearch itemid="item.DoctorId" iteminfo="" rowdata="" config="vm.doctorcontrolconfig" itemchange="doctorChange()"></autosearch>
                                    <!-- <span ng-if="$select.selected.Text.length>8">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Doctor | filter: { Text: $select.search }">
                                                <span ng-bind-html="lookupitem.Title.Description | highlight: $select.search"></span>
                                                <span ng-bind-html="lookupitem.Text | highlight: $select.search"></span>
                                            </ui-select-choices>
                                        </ui-select> -->
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label text-right filter-lbl" for="departmentId" translate="appointment.doctordisplay-list.departmentId.lbl"></label>
                                    <div class="col-sm-7">
                                        <ui-select ng-model="item.DepartmentId" name="department" required ng-change="departmentChange()" ng-disabled="canDisableDepartment()">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-8 col-md-4 control-label" for="from" translate="appointment.doctordisplay-form.from.lbl"></label>
                                    <div class="col-sm-12 col-md-7">
                                        <uib-timepicker name="from" ng-model="item.Availablefrom" ng-time-object required></uib-timepicker>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-8 col-md-4 control-label" for="to" translate="appointment.doctordisplay-form.to.lbl"></label>
                                    <div class="col-sm-12 col-md-7">
                                        <uib-timepicker name="to" ng-model="item.Availableto" ng-time-object required></uib-timepicker>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="roomno" translate="appointment.doctordisplay-form.roomno.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="text" class="form-control" name="roomno" ng-model="item.RoomNo" placeholder="" ng-minlength="1" ng-pattern="/^\d+$/"
                                            required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="location" translate="appointment.doctordisplay-form.locationId.lbl"></label>
                                    <div class="col-sm-7">
                                        <ui-select ng-model="item.LocationId" name="location">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.LOCATION | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="displayno" translate="appointment.doctordisplay-form.displaynoId.lbl"></label>
                                    <div class="col-sm-7">
                                        <ui-select ng-model="item.DisplayNoId" name="displayno" required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.DisplayNo | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="panel-footer formactionbar">
                <div class="pull-right">
                    <button id="btnSave" type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
