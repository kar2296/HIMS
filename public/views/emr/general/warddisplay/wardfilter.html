<style>
    .modal-lg {
        width: 500px;
    }

    .formRoot {
        overflow: inherit;
    }

    .modal-content .panel-body {
        overflow: inherit;
    }
    
</style>
<div class="modal-header custom-modal-header">
    <h4 class=" col-sm-6 mt0" translate="appointment.wardboard.addnew.lbl"></h4>
    <div class=" col-sm-6 ">
        <button type="button" class=" btn btn-xs btn-danger float-right" ng-click="cancelCallback()" aria-label="Close">
        <span aria-hidden="true">X</span>
    </button>
    </div>
</div>
<form id="item_form" name="item_form" class="form-horizontal" role="form">
    <div class="panel-body form-panel">
        <div class="col-sm-12 well  ">
            <div class="col-sm-10">
                <label class="col-sm-4 control-label filter-lbl" translate="admissions.filter_ward.lbl"></label>
                <div class="col-sm-8">
                    <ui-select ng-model="currentfilter.WardId" ng-change="getList()" class="filter-combo">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 8 : 0}}
                            <span ng-if="$select.selected.Text.length>8">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Ward | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="col-sm-2">
                <button class="btn btn-info btn-xs pull-right btn-filter" ng-click="addNew()" uib-tooltip="{{ 'appointment.displayboards.display.lbl' | translate }}"
                    tooltip-placement="top">
                                <img class="drhms-edit-button" src="assets/svg/edit.svg" alt=""></button>
            </div>
        </div>
    </div>
</form>
