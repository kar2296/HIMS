<style>
    .pager-div {
        float: right;
        right: 0;
        box-sizing: border-box;
        position: fixed;
        box-sizing: border-box;
    }
</style>
<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="appointment.wardboard.pagetitle.lbl"></h4>
    <div class="col-sm-6">
        <!-- <button class="btn bt-color1 btn-xs pull-right btn-filter" ng-click="addNew()" uib-tooltip="{{ 'appointment.displayboards.addnew-tooltip.lbl' | translate }}"
            tooltip-placement="bottom">
            <i class="fa fa-bars" aria-hidden="true"></i>&nbsp;&nbsp;<span translate="appointment.wardboard.addnew.lbl"></span></button> -->
    </div>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-4">
            <label class="col-sm-12 control-label filter-lbl" translate="admissions.filter_ward.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="currentfilter.WardId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 40 : 0}}
                        <span ng-if="$select.selected.Text.length>40">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Ward | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </form>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="pull-right">
            <button class="draftbutton" ng-click="addNew()"
                uib-tooltip="{{ 'appointment.displayboards.display.lbl' | translate }}" tooltip-placement="top">
                Show QMS
            </button>
            <!-- <button class="btn btn-info btn-xs pull-right btn-filter" ng-click="addNew()" uib-tooltip="{{ 'appointment.displayboards.display.lbl' | translate }}"
            tooltip-placement="top">
                        <img class="drhms-edit-button" src="assets/svg/edit.svg" alt=""></button>
                        </div>   -->
        </div>
    </div>
</div>
