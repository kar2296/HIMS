<style>
    .pager-div {
        float: right;
        right: 0;
        box-sizing: border-box;
        position: fixed;
        box-sizing: border-box;
    }
</style>
<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="appointment.generalboards.pagetitle.lbl"></h4>
    <div class="col-sm-6">
        <span ng-click="opd_dashboard()">
            <img src="app/img/main/download.png" class="img-responsive icon_home" alt="home" uib-tooltip=" OPD Dashboard " tooltip-placement="bottom">
        </span>
        <button class="btn bt-color1 btn-xs pull-right btn-filter" ng-click="addNew()" uib-tooltip="{{ 'appointment.displayboards.addnew-tooltip.lbl' | translate }}"
            tooltip-placement="bottom">
            <i class="fa fa-bars" aria-hidden="true"></i>&nbsp;&nbsp;
            <span translate="appointment.displayboards.addnew.lbl"></span>
        </button>
    </div>
</div>
