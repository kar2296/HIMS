<style>
    .modal-title {
        font-size: 13px !important;
    }

    .pull-right-save {
        margin: 20px auto;
    }

    /* .modal-dialog {
        width: 600px;
        margin: 30px auto;
    } */
    .form-horizontal .form-group {
    height: 62px;
}
</style>
<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="patientemr.patientdocument-form.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="backToList()">
        </div>
    </div>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form0" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
            <div class="col-sm-12">
                <div class="form-group col-sm-6">
                    <label class="col-sm-12 control-label" for="documenttype"
                        translate="patientemr.patientdocument-form.documenttype.lbl"></label>
                    <div class="col-sm-12">
                        <ui-select ng-model="item.DocumentTypeId" name="documenttype">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.DocumentType | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>
                <div class="form-group col-sm-6">
                    <label class="col-sm-12 control-label" for="createddate"
                        translate="patientemr.patientdocument-form.createddate.lbl"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="startdateandtime" ng-date-object
                            datetime-picker="{{datePickerOptions.dateTimeFormat}}"
                            placeholder="{{datePickerOptions.placeholder}}"
                            ng-click="createddatePopup = { opened: true }" is-open="createddatePopup.opened"
                            ng-model="item.CreatedDate">
                    </div>
                </div>
                <div class="form-group col-sm-6">
                    <label class="col-sm-12 control-label" for="comments" translate="Comments"></label>
                    <div class="col-sm-12">
                        <div class="serach">
                            <input name="name" class="form-control" ng-model="currentcontext.file" name="file"
                                placeholder="Upload Your file here">
                            <button class="btnupload" type="submit" type="submit" ngf-select
                                ng-model="currentcontext.file" name="file" ngf-max-size="200MB"
                                ngf-change="fileSelected()" class="btn-upload">
                                <i class="lni lni-upload" ng-model="currentcontext.file" name="file"
                                    ngf-max-size="200MB" ngf-change="fileSelected()"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="form-group col-sm-6">
                    <label class="col-sm-12 control-label" for="comments"
                        translate="patientemr.patientdocument-form.comments.lbl"></label>
                    <div class="col-sm-12">
                        <textarea name="textarea" ng-model="item.comments" ng-disabled="cvm.candisable"></textarea>
                    </div>
                </div>
            </div>
            <div class="">
                <div class="pull-right">
                    <button type="submit" ng-if="canUpdatePatientEMR()" class="pull-right-save draftbutton"
                        translate="common.saveaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
