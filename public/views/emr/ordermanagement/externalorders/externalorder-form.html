</style> -->
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="External Assignment">
        </h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>
<div class="row">
    <patientbanner patientid="currentcontext.pid"></patientbanner>
</div>
<div class="col-sm-12">
    <span>Test Name : </span>
    <span>{{OrdDetails.TestName}}</span>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-12">
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="externalprovider"
                    translate="ordermanagement.orderassignment-form.externalprovider.lbl"></label>
                <div class="col-sm-12">
                    <ui-select ng-model="item.ExternalProviderId" on-select="SelectedProvider($select.selected)">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.ExternalProvider | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                            </div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for=""
                    translate="ordermanagement.orderassignment-form.assignedby.lbl"></label>
                <div class="col-sm-12">
                    <autosearch itemid="item.UserId" iteminfo="" rowdata="" name="'assignby'"
                        config="vm.usercontrolconfig"></autosearch>
                </div>
            </div>
            <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for=""
                    translate="ordermanagement.orderassignment-form.assignedon.lbl"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="assigndate" ng-date-object
                        datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="assigndatePopup = { opened: true }"
                        is-open="assigndatePopup.opened" ng-model="item.Assigndate" disabled>
                </div>
            </div>
        </div>
        <div class="" style="margin-top: 10px;">
            <div class="pull-right">
                <button type="button" class="draftbutton text-white btn-sm" ng-show="CanshowAssign"
                    translate="ordermanagement.orderassignment-form.assignaction.lbl" ng-click="Assign()"></button>
                <button type="button" class="draftbutton text-white btn-sm" ng-show="CanshowComplete"
                    translate="Complete" ng-click="complete()"></button>
            </div>
        </div>
    </form>
</div>
