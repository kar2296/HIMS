<link href="app/css/regbilling.css" rel="stylesheet">

<div class="row">
    <div class="col-sm-6">
        <h4 class="mt0" translate="External Lab Orders"></h4>
    </div>
    <div class="col-sm-6">
        <div class="filters">
            <div class="search">
                <input type="text" id="pid" class="form-control bill" name="filter_billnumber" on-enter="getList()"
                    ng-model="currentfilter.PatWoNum" translate placeholder="Name/UHID/WorkOrder#">
                <div class="drhms-search-icon"><i class="fas fa-search" aria-hidden="true"></i></div>
            </div>
            <div class="search">
                <input type="text" id="pid" class="form-control bill" name="filter_billnumber" on-enter="getList()"
                    ng-model="currentfilter.OrderBillNo" translate placeholder="Order#/Bill#">
                <div class="drhms-search-icon"><i class="fas fa-search" aria-hidden="true"></i></div>
            </div>
            <button class="default-color" ng-click="backtoList()" uib-tooltip="Dashboard" tooltip-placement="bottom">
                <i class="fa fa-home">
                </i>
            </button>
        </div>
    </div>
</div>
<div class="row">
    <div class="drhms-list-filters">
        <div class="col-sm-4">
            <label class="col-sm-4" translate="Date"></label>
            <div class="col-sm-8">
                <div class="datepicker">
                    <input type="text" class="form-control" name="filter_fromdate" ng-change="getList()" ng-date-object
                        datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}"
                        ng-click="filter_fromdatePopup = { opened: true }" is-open="filter_fromdatePopup.opened"
                        ng-model="currentfilter.Ordereddate"><i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-4" translate="ordermanagement.myorderprocess-list.filter_status.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.WorkOrderStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.WorkOrderStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-4" translate="External Provider"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.ExternalProviderId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ExternalProvider | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <!-- <div class="col-sm-4">
            <label class="col-sm-4" translate="patientemr.patientorder-form.orderedby.lbl"></label>
            <div class="col-sm-8">
              <ui-select ng-model="currentfilter.DoctorId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 8 : 0}}
                    <span ng-if="$select.selected.Text.length>8">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.Doctor | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
            </div>
        </div> -->
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
