<link href="app/css/regbilling.css" rel="stylesheet">
<div class="row">
    <div class="col-sm-6">
        <h4 class="mt0" translate="ordermanagement.resultentry-form.myresultapproval.lbl"></h4>
    </div>
    <div class="col-sm-6">
        <div class="filters">
            <div class="search">
                <input type="text" id="SampleId" class="form-control bill" name="SampleId" on-enter="getList()"
                    ng-model="currentfilter.SampleIdentifier" translate placeholder="SampleId">
                <div class="drhms-search-icon">
                    <i class="fas fa-search" aria-hidden="true"></i>
                </div>
            </div>
            <div class="search">
                <input type="text" id="pid" class="form-control bill" name="filter_billnumber" on-enter="getList()"
                    ng-model="currentfilter.PatWoNum" translate placeholder="Name/UHID/WorkOrder#">
                <div class="drhms-search-icon"><i class="fas fa-search" aria-hidden="true"></i></div>
            </div>
            <div class="search">
                <input type="text" id="pid" class="form-control bill" name="filter_billnumber" on-enter="getList()"
                    ng-model="currentfilter.OrderBillNo" translate placeholder="Order#/Bill#">
                <div class="drhms-search-icon"><i class="fas fa-search" aria-hidden="true"></i></div>
            </div>
            <button class="default-color" style="margin-left: 10px;">
                <i class="fa fa-home" ng-click="backtoList()" uib-tooltip="Dashboard" tooltip-placement="bottom">
                </i>
            </button>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-sm-2">
        <label class="col-sm-12" translate="ordermanagement.orderassignment-list.filter_fromdate.lbl"></label>
        <div class="col-sm-12">
            <input type="text" class="form-control" name="filter_fromdate" ng-date-object
                datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="filter_fromdatePopup = { opened: true }" is-open="filter_fromdatePopup.opened"
                ng-model="currentfilter.FromDate">
        </div>
    </div>
    <div class="col-sm-2">
        <label class="col-sm-12" translate="To Date"></label>
        <div class="col-sm-12">
            <input type="text" class="form-control" name="todate" ng-date-object datepicker-options="datePickerOptions"
                show-button-bar="{{datePickerOptions.showButtonBar}}"
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="todatePopup = { opened: true }" is-open="todatePopup.opened" ng-model="currentfilter.ToDate">
        </div>
    </div>
    <div class="col-sm-2">
        <label class="col-sm-12" translate="ordermanagement.orderassignment-list.filter_ordernumber.lbl"></label>
        <div class="col-sm-12">
            <input type="text" class="form-control" name="filter_ordernumber" ng-model="currentfilter.WorkOrderdid"
                translate translate-attr-placeholder="ordermanagement.orderassignment-list.filter_ordernumber.lbl">
        </div>
    </div>
    <div class="col-sm-2">
        <label class="col-sm-12" translate="ordermanagement.myorderprocess-list.filter_status.lbl"></label>
        <div class="col-sm-12">
            <ui-select ng-model="currentfilter.WorkOrderStatusId" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.WorkOrderStatus | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="col-sm-2">
        <label class="col-sm-12" translate="Sub Department"></label>
        <div class="col-sm-12">
            <ui-select ng-model="currentfilter.SubDepartmentId" class="filter-combo" ng-disabled="SubdeptDisable">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-2" style="margin-top: 30px;">
        <button class="draftbutton" ng-click="getList()">
            <!-- <i class="fas fa-search" aria-hidden="true"></i> -->
            <span translate="Fetch"></span>
        </button>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
