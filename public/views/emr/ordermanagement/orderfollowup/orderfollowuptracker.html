<link rel="stylesheet" href="app/css/drhms.css">
<style>
    .modal-dialog {
        width: 600px;
        margin: 30px auto;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Investigation FollowUp Tracker"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>
<div class="row">
    <!-- <div class="col-sm-12"> -->
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-12">
            <label class="col-sm-12 control-label" translate="Followup Notes"></label>
            <div class="col-sm-12">
                <textarea class="form-control" ng-model="item.FollowupNotes"></textarea>
            </div>
        </div>
        <div class="form-group col-sm-12">
            <label class="col-sm-12 control-label" translate="Followup By"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.FollowupBy" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.User | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
                <!-- <input type="text" class="form-control" ng-model="item.FollowupBy"></textarea> -->
            </div>
        </div>
        <div class="form-group col-sm-12">
            <label class="col-sm-12 control-label" translate="registration.patienttracker.followupappointments.lbl"></label>
            <div class="col-sm-12" style="width: 100%;">
                <div class="datepicker" id="datepicker">
                    <input type="text" class="form-control" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}" ng-click="flwdatePopup = { opened: true }" is-open="flwdatePopup.opened" ng-model="item.FollowupAppointmentOn">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </div>
        </div>
        <!-- <div class="form-group col-sm-12">
            <label class="col-sm-12 control-label" translate="registration.patienttracker.followupappointments.lbl"></label>
            <div class="col-sm-12" style="width: 100%;">
                <div class="datepicker" id="datepicker">
                    <input type="text" class="form-control" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}" ng-click="nextflwdatePopup = { opened: true }" is-open="nextflwdatePopup.opened" ng-model="item.NextFollowupDate">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </div>
        </div> -->
    </form>
</div>
<div class="fooder-bgs" style="margin-top: 73px !important;">
    <div class="pull-right">
        <button type="button" ng-click="complete()" ng-show="item.FollowupStatusId==1" class="draftbutton" style="margin-right: 7px !important;" translate="Complete"></button>
        <!-- <button type="button" ng-click="saveItem(3)"ng-show="item.FollowupStatusId==1" class="draftbutton" style="margin-right: 7px !important;" translate="Cancel"></button>
        <button type="button" ng-click="saveItem(4)" ng-show="item.FollowupStatusId==1"class="draftbutton" style="margin-right: 7px !important;" translate="Book Appointment"></button> -->
    </div>
</div>
