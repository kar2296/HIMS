<div class="row page-header">
    <div class="col-sm-5">
        <h4 class="page-header mt0 mg0" translate="ordermanagement.orderassignment-list.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-7">
        <div class="filters">
            <div class="search">
                <input type="text" id="pid" class="form-control bill" name="filter_patient" on-enter="getList()"
                    ng-model="currentfilter.PatientMRN" name="filter_ordernumber" on-enter="getList()"
                    ng-model="currentfilter.WorkOrderdid" ng-model="currentfilter.BillNumber" translate
                    placeholder="Name/or#/priority/bill#/Wo#"> <i class="fas fa-search" aria-hidden="true"></i>
            </div>
            <button type="button" tabindex="-1" class="btn-add" ng-click="addNew()"
                uib-tooltip="{{ 'clinicalmaster.serviceitem-list.pagetitle.lbl' | translate}}"
                tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
                <!-- <span translate="clinicalmaster.serviceitem-list.addnew.lbl " class="text-white"></span> -->
            </button>
        </div>
    </div>
</div>

    <div class="col-sm-3">
        <label class="col-sm-4 control-label filter-lbl" translate="From Date"></label>
        <div class="col-sm-8">
            <div class="datepicker">
                <input type="text" class="form-control" name="filter_fromdate" ng-change="getList()" ng-date-object
                    datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="filter_fromdatePopup = { opened: true }"
                    is-open="filter_fromdatePopup.opened" ng-model="currentfilter.Ordereddate"><i class="fa fa-calendar"
                    aria-hidden="true"></i>
            </div>
        </div>
    </div>

    </div>
