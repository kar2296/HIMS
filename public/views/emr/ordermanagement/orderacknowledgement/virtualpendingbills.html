<link href="app/css/regbilling.css" rel="stylesheet">
<div class="row">
    <div class="col-sm-6">
        <h4 class="mt0" translate="Virtual Pending Bills"></h4>
    </div>
    <div class="col-sm-6">
        <div class="filters">
            <div class="search">
                <input type="text" id="pid" class="form-control bill" name="filter_billnumber" on-enter="getList()"
                    ng-model="currentfilter.Patient" translate placeholder="Name/UHID">
                <div class="drhms-search-icon"><i class="fas fa-search" aria-hidden="true"></i></div>
            </div>
            <div class="search">
                <input type="text" id="pid" class="form-control bill" name="filter_billnumber" on-enter="getList()"
                    ng-model="currentfilter.BillOrderNumber" translate placeholder="Order#/Bill#">
                <div class="drhms-search-icon"><i class="fas fa-search" aria-hidden="true"></i></div>
            </div>
            <button class="default-color" style="margin-left: 10px;">
                <i class="fa fa-home" ng-click="addNew()" uib-tooltip="Dashboard" tooltip-placement="bottom">
                </i>
            </button>
        </div>
    </div>
</div>
<div class="row">
    <div class="drhms-list-filters">
        <div class="col-sm-3">
            <label class="col-sm-4" translate="ordermanagement.orderacknowledgement-list.filter_fromdate.lbl"></label>
            <div class="col-sm-8">
                <div class="datepicker">
                    <input type="text" class="form-control" name="Orderassignment" ng-change="getList()" ng-date-object
                        datepicker-options="datePickerOptions" uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                        is-open="fromdatePopup.opened" ng-model="currentfilter.FromDate"><i class="fa fa-calendar"
                        aria-hidden="true"></i>
                </div>
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-4" translate="To Date"></label>
            <div class="col-sm-8">
                <div class="datepicker">
                    <input type="text" class="form-control" name="Orderassignment" ng-change="getList()" ng-date-object
                        datepicker-options="datePickerOptions" uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="ToDatePopup = { opened: true }"
                        is-open="ToDatePopup.opened" ng-model="currentfilter.ToDate"><i class="fa fa-calendar"
                        aria-hidden="true"></i>
                </div>
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-4" translate="Schedule Date"></label>
            <div class="col-sm-8">
                <div class="datepicker">
                    <input type="text" class="form-control" name="Orderassignment" ng-change="getList()" ng-date-object
                        datepicker-options="datePickerOptions" uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="ScheduleDatePopup = { opened: true }"
                        is-open="ScheduleDatePopup.opened" ng-model="currentfilter.OrderScheduleDate"><i
                        class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-4" translate="Status"></label>
            <div class="col-sm-8">
                <multiselectchk list="lookup.OrderStatus" selected="currentfilter.OrderStatusId" change="getList()">
                </multiselectchk>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
