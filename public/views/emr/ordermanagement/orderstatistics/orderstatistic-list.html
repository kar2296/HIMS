<div class="row page-header">
    <div class="col-sm-12">
        <h4 class="page-header mt0" translate="ordermanagement.orderstatistics.pagetitle.lbl"></h4>
    </div>
</div>
<div class="row filter-area">
    <div class="col-sm-12">
        <div class="col-sm-3">
            <label class="col-sm-5 control-label filter-lbl" translate="ordermanagement.orderstatistics.From.lbl"></label>
            <div class="col-sm-7">
                <input type="text" class="form-control" name="registereddate" ng-change="getList()" datepicker-options="datePickerOptions"
                    show-button-bar="{{datePickerOptions.showButtonBar}}" uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="registereddatePopup = { opened: true }" is-open="registereddatePopup.opened"
                    ng-model="currentfilter.orderedon">
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-4 control-label filter-lbl" translate="ordermanagement.orderstatistics.To.lbl"></label>
            <div class="col-sm-8">
                <input type="text" class="form-control" name="dobdate" ng-change="getList()" datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}" ng-click="dobdatePopup = { opened: true }"
                    is-open="dobdatePopup.opened" ng-model="currentfilter.acceptedon">
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-6 control-label filter-lbl pdl0" translate="appmanager.user.subdepartment.lbl"></label>
            <div class="col-sm-6">
                <ui-select ng-model="currentfilter.SubDepartmentId" ng-change="getList()" class="filter-combo" ng-disabled="">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.SubDepartment | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </div>
</div>
<div class="custom_table">
    <div class="table_topic col-md-12"></div>
    <table class="table table-bordered">
        <thead>
            <tr ng-repeat="headerR in headerRow">
                <th ng-repeat="col in headerRow.cols" class="header">{{col.text}}</th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="row in rows">
                <td ng-repeat="col in row.cols" scope="row">{{col.text}}</td>
                <!-- <td scope="row">Action</td> -->
            </tr>
            <tr>
                <td ng-repeat="col in total.cols" scope="total">{{col.text}}</td>
                <!-- <td>
                    <button class="btn btn-success btn-xs" tabindex="-1" ng-click="editDetail(item)">
                        <i class="fa fa-pencil" aria-hidden="true"></i>
                    </button>
                </td> -->
            </tr>
        </tbody>
    </table>
</div>

<div class="fooder-bg custom_stock_footer">
    <div class=" col-sm-12">
    </div>
</div>
