<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Order History"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div id="dash-board">
                <div class=" page-header">
                    <div class="col-sm-12">
                        <b>
                            <span translate="Test Name"></span>:</b>
                        <span class="testname">{{ordertat[0].TestName}}</span>
                    </div>
                </div>
                <div class="col-sm-12 info_table2">
                    <table class="table table-responsive table-bordered custom-table">
                        <thead>
                            <th class="cus-col tbl-header">
                                <span translate="Status"></span>
                            </th>
                            <th class="cus-col tbl-header">
                                <span translate="Date"></span>
                            </th>
                            <!-- <th class="cus-col tbl-header">
                                <span translate="User Name"></span>
                            </th> -->
                        </thead>
                        <tbody>
                            <tr>
                                <td class="cus-col tbl-header">
                                    <span translate="Ordered On"></span>
                                </td>
                                <td>
                                    <span>
                                        <displaydate datetime-val="ordertat[0].OrderedOn"></displaydate>
                                    </span>
                                </td>
                                <!-- <td>
                                    <span>
                                        {{ordertat[0].PatientOrder.DoctorName}}
                                    </span>
                                </td> -->
                            </tr>
                            <tr>
                                <td class="cus-col tbl-header">
                                    <span translate="AcceptedOn"></span>
                                </td>
                                <td>
                                    <span>
                                        <displaydate datetime-val="ordertat[0].AcceptedOn"></displaydate>
                                    </span>
                                </td>
                                <!-- <td>
                                    <span>
                                        {{ordertat[0].PatientOrder.DoctorName}}
                                    </span>
                                </td> -->
                            </tr>
                            <tr>
                                <td class="cus-col tbl-header">
                                    <span translate="SampleCollectedOn"></span>
                                </td>
                                <td>
                                    <span>
                                        <displaydate datetime-val="ordertat[0].SampleCollectedOn"></displaydate>
                                    </span>
                                </td>
                                <!-- <td>
                                    <span>
                                        {{ordertat[0].PatientOrder.DoctorName}}
                                    </span>
                                </td> -->
                            </tr>
                            <tr>
                                <td class="cus-col tbl-header">
                                    <span translate="SampleReceivedOn"></span>
                                </td>
                                <td>
                                    <span>
                                        <displaydate datetime-val="ordertat[0].SampleReceivedOn"></displaydate>
                                    </span>
                                </td>
                                <!-- <td>
                                    <span>
                                        {{ordertat[0].PatientOrder.DoctorName}}
                                    </span>
                                </td> -->
                            </tr>
                            <tr>
                                <td class="cus-col tbl-header">
                                    <span translate="AssignedOn"></span>
                                </td>
                                <td>
                                    <span>
                                        <displaydate datetime-val="ordertat[0].AssignedOn"></displaydate>
                                    </span>
                                </td>
                                <!-- <td>
                                    <span>
                                        {{ordertat[0].PatientOrder.DoctorName}}
                                    </span>
                                </td> -->
                            </tr>
                            <tr>
                                <td class="cus-col tbl-header">
                                    <span translate="TechValidationOn"></span>
                                </td>
                                <td>
                                    <span>
                                        <displaydate datetime-val="ordertat[0].TechValidationOn"></displaydate>
                                    </span>
                                </td>
                                <!-- <td>
                                    <span>
                                        {{ordertat[0].PatientOrder.DoctorName}}
                                    </span>
                                </td> -->
                            </tr>
                            <tr>
                                <td class="cus-col tbl-header">
                                    <span translate="MedValidationOn"></span>
                                </td>
                                <td>
                                    <span>
                                        <displaydate datetime-val="ordertat[0].MedValidationOn"></displaydate>
                                    </span>
                                </td>
                                <!-- <td>
                                    <span>
                                        {{ordertat[0].PatientOrder.DoctorName}}
                                    </span>
                                </td> -->
                            </tr>
                            <tr>
                                <td class="cus-col tbl-header">
                                    <span translate="ReleasedOn"></span>
                                </td>
                                <td>
                                    <span>
                                        <displaydate datetime-val="ordertat[0].ReleasedOn"></displaydate>
                                    </span>
                                </td>
                                <!-- <td>
                                    <span>
                                        {{ordertat[0].PatientOrder.DoctorName}}
                                    </span>
                                </td> -->
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </form>
    </div>
</div>
