<link href="app/css/regbilling.css" rel="stylesheet">
<div class="row">
    <div class="col-sm-9">
        <h4 class="mt0" translate="ordermanagement.samplecollection.sample_collectionss.lbl"></h4>
    </div>
    <div class="col-sm-3">
        <div class="filters">
            <div class="search">
                <input type="text" id="pid" class="form-control bill" name="filter_billnumber" on-enter="getList()"
                    ng-model="currentfilter.PatOrdNo" translate placeholder="Name/UHID/Order#/Bill#">
                <div class="drhms-search-icon"><i class="fas fa-search" aria-hidden="true"></i></div>
            </div>
            <button type="button" tabindex="-1" class="btn-add" ng-click="backtoList()"
                uib-tooltip="{{ 'Home' | translate}}" tooltip-placement="bottom">
                <i class="fa fa-home" uib-tooltip="Dashboard" tooltip-placement="bottom"> </i>
                <!-- <span translate="clinicalmaster.serviceitem-list.addnew.lbl " class="text-white"></span> -->
            </button>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-sm-12">
        <div class="col-sm-4 form-group">
            <label class="col-sm-4" translate="ordermanagement.samplecollection.samplestatuse.lbl"></label>
            <div class="col-sm-8">
                <multiselectchk list="lookup.SampleStatus" selected="currentfilter.samplestatusid">
                </multiselectchk>
                <!-- <ui-select ng-model="currentfilter.samplestatusid" ng-change="getList()">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.SampleStatus | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select> -->
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-4" translate="ordermanagement.samplecollection.reqdate.lbl"></label>
            <div class="col-sm-8">
                <div class="datepicker">
                    <input type="text" class="form-control" name="OrderReqDate" ng-date-object
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="activefromPopup = { opened: true }"
                        is-open="activefromPopup.opened" ng-model="currentfilter.FromDate"> <i class="fa fa-calendar"
                        aria-hidden="true"></i>
                </div>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-4" translate="To Date"></label>
            <div class="col-sm-8">
                <div class="datepicker">
                    <input type="text" class="form-control" name="todate" ng-date-object
                        datepicker-options="datePickerOptions" uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
                        is-open="todatePopup.opened" ng-model="currentfilter.ToDate">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col-sm-12">
        <div class="col-sm-4 form-group">
            <label class="col-sm-4" translate="ordermanagement.samplecollection.orderstatuse.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.orderstatusid">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.OrderStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-3">
            <button class="draftbutton" ng-click="getList()">
                <!-- <i class="fas fa-search" aria-hidden="true"></i> -->
                <span translate="Fetch"></span>
            </button>
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>

    </div>
</div>
>
