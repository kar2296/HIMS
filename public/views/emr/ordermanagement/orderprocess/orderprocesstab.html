<div class="row page-header" id="assets">
    <h4 class="col-sm-6 mt0" translate="Result Entry"></h4>
    <div class="col-sm-6">
            <i class="fa fa-home" ng-click="backtoList()" uib-tooltip="Dashboard"
        tooltip-placement="bottom"></i>

        <button class="custom_dbutton btn-xs pull-right text-white btn prv-color12 btn-sm " ng-click="dashboard()">
            <i class="fa fa-tachometer"></i>&nbsp;&nbsp; Dashboard
        </button>
      
    </div>
</div>
<div class="row tablebox" id="tablebox">
    <div class="col-sm-12">
        <uib-tabset active="active" id="assettabs">
            <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)"
                disable="tab.canDisable">
            </uib-tab>
        </uib-tabset>
        <div ui-view></div>
    </div>
</div>
