<div class="row page-header">
    <div class="col-sm-12 order_head" style="height:30px">
        <h4 class="page-header mt0" translate="{{FileName}}"></h4>
    </div>
    <div ng-if="URL" class="col-sm-12 order_head">
        <img style="width:90%;height:90%" ng-src="{{URL}}" />
    </div>
    <div ng-if="!URL" style="width:90%;height:90%;" class="col-sm-12 order_head">
        No Image Loaded....
    </div>
    <button id="btnCancelForm" type="button" class="pull-right btn btn-danger btn-sm"
        ng-click="backToList()" translate="common.cancelaction.lbl">
    </button>
</div>
