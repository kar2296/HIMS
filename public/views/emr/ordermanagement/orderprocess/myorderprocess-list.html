<style>
    .form-group {
        height: 42px;
    }
</style>
<div class="row">
    <div class="col-sm-6">
        <h4 class="mt0" translate="Order Process"></h4>
    </div>
    <div class="col-sm-6">
        <div class="filters">
            <div class="search">
                <input type="text" id="SampleId" class="form-control bill" name="SampleId" on-enter="getList()" ng-model="currentfilter.SampleIdentifier" translate placeholder="SampleId">
                <div class="drhms-search-icon">
                    <i class="fas fa-search" aria-hidden="true"></i>
                </div>
            </div>
            <div class="search">
                <input type="text" id="pid" class="form-control bill" name="filter_billnumber" on-enter="getList()" ng-model="currentfilter.PatWoNum" translate placeholder="Name/UHID">
                <div class="drhms-search-icon">
                    <i class="fas fa-search" aria-hidden="true"></i>
                </div>
            </div>
            <button class="drhms-billing-btn drhms-home-btn">
                <i class="fa fa-home" ng-click="backtoList()" uib-tooltip="Dashboard" tooltip-placement="bottom">
                </i>
            </button>
        </div>
    </div>
</div>

<div class="row">
    <div class="form-group col-sm-4">
        <label class="col-sm-4 control-label" translate="From Date"></label>
        <div class="col-sm-8">
            <div class="datepicker">
                <input type="text" class="form-control" name="filter_fromdate" ng-date-object datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}" uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                    ng-click="filter_fromdatePopup = { opened: true }" is-open="filter_fromdatePopup.opened" ng-model="currentfilter.FromDate">
                <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
        </div>
    </div>
    <div class="form-group col-sm-4">
        <label class="col-sm-4 control-label" translate="To Date"></label>
        <div class="col-sm-8">
            <div class="datepicker">
                <input type="text" class="form-control" name="filter_todate" ng-date-object datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}" uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                    ng-click="filter_todatePopup = { opened: true }" is-open="filter_todatePopup.opened" ng-model="currentfilter.ToDate">
                <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
        </div>
    </div>
    <div class="form-group col-sm-4">
        <label class="col-sm-4 control-label" translate="ordermanagement.orderassignment-list.wostatus.lbl"></label>
        <div class="col-sm-8">
            <multiselectchk list="lookup.WorkOrderStatus" selected="currentfilter.WorkOrderStatusId" change="getList()">
            </multiselectchk>
        </div>
    </div>
    <div class="form-group col-sm-4">
        <label class="col-sm-4 control-label" translate="Patient Type"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.EncounterTypeId" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.EncounterType | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-4">
        <label class="col-sm-4 control-label " translate="Sub Department"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.SubDepartmentId" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-4">
        <label class="col-sm-4 control-label " translate="patientemr.patientorder-form.orderedby.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.DoctorId" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Doctor | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-4">
        <label class="col-sm-4 control-label " translate="Order#/Bill#"></label>
        <div class="col-sm-8">
            <div class="search">
                <input type="text" id="pid" class="form-control bill" ng-model="currentfilter.OrderBillNo" translate placeholder="Order#/Bill#">
                <div class="drhms-search-icon">
                    <i class="fas fa-search" aria-hidden="true"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="form-group col-sm-3">
        <button class="draftbutton" ng-click="getDateDiff()">
            <!-- <i class="fas fa-search" aria-hidden="true"></i> -->
            <span translate="Fetch"></span>
        </button>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex" ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
