<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Redo Reason"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-12 form-group">
            <!-- <div class="form-group"> -->
            <label class="col-sm-12 control-label" for="" translate="ordermanagement.resultentry-form.redo.lbl">
                <div class="col-sm-12">
                    <textarea rows="3" name="reason" ng-model="item.Reason" maxlength="4000" style="width:100%;"
                        class="notes-textarea"></textarea>
                </div>
                <!-- </div> -->
        </div>
    </form>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="pull-right">
            <button type="button" class="draftbutton" ng-click="savereason()"
                translate="common.saveaction.lbl"></button>
        </div>
    </div>
</div>
