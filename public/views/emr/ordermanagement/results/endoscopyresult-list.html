<div class="row page-header">
    <div class="col-sm-6">
        <h4 class="page-header mt0" translate="Endoscopy Result"></h4>
    </div>
    <div class="col-sm-6 ">
        <span class="drhms-billing-btn drhms-home-btn"><i class="fas fa-home" ng-click="doctor_dashboard()"
                uib-tooltip="Doctor Dashboard" tooltip-placement="bottom"></i></span>
        <span class="drhms-billing-btn drhms-home-btn">
            <i class="fas fa-user-injured" ng-click="patient_dashboard()" uib-tooltip="Patient Dashboard"
                tooltip-placement="bottom"></i>
        </span>
        <i class="fa fa-line-chart btn btn-warning btn-rounded pull-right" aria-hidden="true"
            ng-click="resultview()"></i>
    </div>
</div>
<div class="row">
    <div class="col-sm-12">
        <div class="col-sm-4 col-md-4 col-lg-3">
            <label class="col-sm-4 col-md-4 col-lg-4 control-label filter-lbl"
                translate="ordermanagement.labresult-list.filter_orderno.lbl"></label>
            <div class="col-sm-8 col-md-8 col-lg-8">
                <input type="text" id="order" class="form-control" name="order" on-enter="getList()"
                    ng-model="currentfilter.orderno" placeholder="Order No.">
            </div>
        </div>
        <!-- <div class="col-sm-3 col-md-3 col-lg-3 lgdnone">
                <label class="col-sm-4 col-md-7 col-lg-5 control-label filter-lbl" translate="ordermanagement.labresult-list.filter_testname.lbl"></label>
                <div class="col-sm-8 col-md-7 col-lg-7">
                    <input type="text" class="form-control" name="order" on-enter="getList()" ng-model="currentfilter.TestName" placeholder="Test Name">
                </div>
            </div> -->
        <div class="col-sm-4 col-md-4 col-lg-2">
            <label class="col-sm-4 col-md-4 col-lg-4 control-label filter-lbl"
                translate="ordermanagement.labresult-list.filter_from.lbl"></label>
            <div class="col-sm-8 col-md-8 col-lg-8">
                <input type="text" class="form-control" name="startdateandtime" ng-change="getList()" ng-date-object
                    datetime-picker="{{datePickerOptions.dateTimeFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="fromPopup = { opened: true }"
                    is-open="fromPopup.opened" ng-model="currentfilter.fromdate">
                <!--<input type="text" class="form-control" name="startdateandtime" ng-change="getList()" ng-date-object datetime-picker="{{datePickerOptions.dateTimeFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="activetoPopup = { opened: true }" is-open="activetoPopup.opened"
                        ng-model="currentfilter.fromdate">-->
            </div>
        </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <label class="col-sm-4 col-md-4 col-lg-4 control-label filter-lbl"
                translate="ordermanagement.labresult-list.filter_to.lbl"></label>
            <div class="col-sm-8 col-md-8 col-lg-8 calender_align">
                <input type="text" class="form-control" name="startdateandtime" ng-change="getList()" ng-date-object
                    datetime-picker="{{datePickerOptions.dateTimeFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="toPopup = { opened: true }"
                    is-open="toPopup.opened" ng-model="currentfilter.todate">
                <!--<input type="text" class="form-control" name="to" ng-change="getList()" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="toPopup = { opened: true }" is-open="toPopup.opened"
                        ng-model="currentfilter.todate">-->
            </div>
        </div>

    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
