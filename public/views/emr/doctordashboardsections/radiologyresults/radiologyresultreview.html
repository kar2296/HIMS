<style>
    .page-header {
        margin: 0px 0px 2px 0px !important;
        padding-bottom: 11px !important;
    }

    .fontctrl {
        color: #ffffff;
        text-shadow: 0 1px 1px #194B7E;
    }

    .wobanner {
        background-color: #597A9A
    }

    
    @media only screen and (max-width:414px){.profile-header .col-sm-1{display: none;}
    .profile-header .col-sm-6{padding:0px;}
   
    .row.page-header h4{float:left;}
}

</style>

<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-6">
            <h4 class="page-header mt0" translate="Radiology Result Reviews"></h4>
        </div>
        <div class="col-sm-6">
                <span ng-click="doctor_dashboard()">   
                                       
                        <img src="app/img/main/download.png" class="img-responsive icon_home"  alt="home" uib-tooltip=" Doctor Dashboard " tooltip-placement="bottom">
                   
                    </span>      
                <span ng-click="bed_management()">
                
                <img src="app/img/main/235797.png" class="img-responsive icon_bed" alt="bed"uib-tooltip=" Bed Management " tooltip-placement="bottom">
                
                </span> 
        </div>
    </div>
</div>
<div id="patientlabresult" class="emr_radiologyreview"> 
    <div class="col-sm-12 lresult_view">
        <lispatientbanner patientid="currentcontext.pid"></lispatientbanner>
    </div>
    <div id="mainresponsivetablecontrol" class="lisdrpctrl">
        <div ng-repeat="order in vm.orders">
            <div id='workorder' ng-repeat="wo in order.PatientWorkorders">
                <div>
                    <div class="col-sm-12 fontctrl wobanner">
                        <span ng-if="wo.Orderedby.FirstName">
                            <strong>{{ wo.Orderedby.Title.Description }} {{ wo.Orderedby.FirstName }}</strong> |</span>

                        <span ng-if="wo.Department.DepartmentName">
                            <strong class="mrn-highlight">{{wo.Department.DepartmentName}}</strong> |</span>

                        <span ng-if="wo.ApprovalSubmisdate">
                            <displaydate datetime-val='wo.ApprovalSubmisdate'></displaydate> |</span>

                        <span ng-if="wo.ApprovedUser.FirstName">
                            <strong>{{ wo.ApprovedUser.Title.Description }} {{ wo.ApprovedUser.FirstName }}</strong> |</span>

                        <span ng-if="wo.WorkOrderdid"> {{wo.WorkOrderdid}} </span>

                        <div class="pull-right">
                            <button class="btn btn-primary btn-xs" tabindex="-1" style="vertical-align: super;" ng-click="openWOAttachments(wo)">
                                <i class="fa fa-file-text-o" aria-hidden="true"></i>
                            </button>
                        </div>

                    </div>
                </div>
                <table class="table table-hover table-responsive table-bordered">
                    <thead class="bg-subhead">
                        <tr>
                            <th class="col-sm-2">
                                <span translate="ordermanagement.resultentry-form.observation.lbl"></span>
                            </th>
                            <th class="col-sm-6">
                                <span translate="ordermanagement.resultentry-form.result.lbl"></span>
                                <span class="mandatory-asterix">*</span>
                            </th>
                            <th>
                                <span translate="ordermanagement.resultentry-form.phr.lbl"></span>
                            </th>
                            <th>
                                <span translate="common.actions_col.lbl"></span>
                            </th>
                        </tr>
                    </thead>
                    <tbody ng-repeat="test in wo.woDetails">
                        <tr ng-if="test.ProfileName">
                            <td colspan="9">
                                <span class="lbl-profile">{{test.ProfileName}}</span>
                            </td>
                        </tr>
                        <tr ng-hide="test.details.length == 1 && test.Testname.toLowerCase() == test.details[0].Analytename.toLowerCase()">
                            <td colspan="9">
                                <span class=" btn btn-primary btn-xs" ng-show="test.details.length>0"> {{test.Testname}}</span>
                            </td>
                        </tr>
                        <tr ng-repeat="item in test.details | filter:{Status:1}">
                            <td>
                                <span style="margin-left:24px;  vertical-align: super; color: #0dbef1; font-weight: 700; white-space: nowrap; text-overflow: ellipsis; overflow: auto;">{{item.Analytename}}</span>
                            </td>
                            <td>
                                <span ng-bind-html="item.Resultvalue"> </span>
                            </td>
                            <td>
                                <displayyesno input-val='item.IsReleasedToPatient'></displayyesno>
                            </td>
                            <td>
                                <button class="btn btn-primary btn-xs" tabindex="-1" style="vertical-align: super;" ng-click="openAttachments(item)">
                                    <i class="fa fa-file-text-o" aria-hidden="true"></i>
                                </button>
                                <button class="btn btn-danger btn-xs" tabindex="-1" style="vertical-align: super;" ng-click="openObservations(item)">
                                    <i class="fa fa-comment" aria-hidden="true"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<div class="fooder-bgs">
        <div class="row">
            <div class="col-sm-12">
                <div class="col-sm-2" style="margin-left: -45px;">
                    <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()">
                        <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                        <span class="btn-fontsize" translate="common.backaction.lbl"></span>
                    </button>
                </div>
                <div class="col-sm-10 pull-right" style="margin-right: -390px;">
                    <button type="button" class="text-white btn btn-success btn-sm" ng-click="reviewlist()" translate="Review"></button>
                    <button type="button"  class="draftbutton" ng-click="print()" translate="common.printaction.lbl"></button>
                    <!-- <button style="margin-right:40px" id="btnCancelForm" type="button" class="draftbutton" ng-click="cancelCallback()" translate="common.cancelaction.lbl"></button> -->
                </div>
            </div>
        </div>
    </div>
