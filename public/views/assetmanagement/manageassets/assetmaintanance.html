<style>
    button.addbutton {
    margin-bottom: 9px !important;
    margin-top: 4px !important;
    position: relative;
    right: 7px;
}
ul.uib-datepicker-popup.dropdown-menu.ng-scope {
    width: 14%;
}
#lidatepicker table th {
    min-width: 10px;
    background-color: #ffffff !important;
    /* background-color: #01748b !important; */
    color: #ffffff !important;
    font-size: 14px;
    text-align: center !important;
    border: 1px solid #ffffff !important;
}
#lidatepicker button.btn.btn-default.btn-sm.uib-title {
    margin-left: 0%;
    width: 100% !important;
    background: white;
}
</style>
<div class="">
    <!--<button class="btn bt-color3 btn-xs pull-right btn-filter" ng-click="" uib-tooltip="{{ 'appmanager.users.advancefilter-tooltip.lbl' | translate  }}"
                tooltip-placement="bottom"><i class="fa fa-filter" aria-hidden="true"></i>&nbsp;&nbsp;<span translate="common.searchaction.lbl"></span></button>-->
    <button class="btn-add" ng-click="addNew()"
        uib-tooltip="{{ 'assetmanagement.assetmaintanance.tooltip.lbl' | translate}}" tooltip-placement="bottom">
        <i class="fa fa-plus" aria-hidden="true"></i></button>
</div>
<div id="">
    <!-- <div class="row filter-area"> -->
        <div class="formRoot bg-pattern">
            <div class="col-sm-12">
                <table class="table table-hover table-responsive table-bordered">
                    <thead class="bg-subhead">
                        <tr>
                            <th class="col-sm-2"><span translate="assetmanagement.assetmaintanance.eventdate.lbl"></th>
                            <th class="col-sm-2">
                                <span translate="assetmanagement.assetmaintanance.description.lbl"></span>
                                <span class="mandatory-asterix">*</span>
                            </th>
                            <th class="col-sm-2">
                                <span translate="assetmanagement.assetmaintanance.maintanancedate.lbl"></span>
                                <span class="mandatory-asterix">*</span>
                            </th>
                            <th class="col-sm-1"><span
                                    translate="assetmanagement.assetmaintanance.maintanancedescription.lbl"></th>
                            <th class="col-sm-1"><span
                                    translate="assetmanagement.assetmaintanance.performedby.lbl"></span>
                            </th>
                            <th class="col-sm-2">
                                <span translate="assetmanagement.assetmaintanance.cost.lbl"></span>
                                <span class="mandatory-asterix">*</span></th>
                            <th class="col-sm-1"><span translate="common.actions_col.lbl"></span></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="item in vm.items | filter:{Status:1}">
                            <td>
                                <input type="text" class="form-control" name="eventdate" ng-date-object
                                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                    placeholder="{{datePickerOptions.placeholder}}"
                                    ng-click="eventdatePopup = { opened: true }" is-open="eventdatePopup.opened"
                                    ng-model="item.EventDate">
                            </td>
                            <td align="center">

                                <input type="text" class="form-control" name="eventdescription"
                                    ng-model="item.EventDescription" placeholder="" required>
                            </td>
                            <td>
                                <input type="text" class="form-control" name="maintanancedate" ng-date-object
                                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                    placeholder="{{datePickerOptions.placeholder}}"
                                    ng-click="maintanancedatePopup = { opened: true }"
                                    is-open="maintanancedatePopup.opened" ng-model="item.MaintananceDate" required>

                            </td>
                            <td align="center">

                                <input type="text" class="form-control" name="maintanancedescription"
                                    ng-model="item.MaintananceDescription" placeholder="" required>
                            </td>
                            <td align="center">

                                <input type="text" class="form-control" name="performedby" ng-model="item.PerformedBy"
                                    placeholder="">
                            </td>
                            <td align="center">

                                <input type="text" class="form-control" name="cost" ng-model="item.Cost" placeholder=""
                                    ng-pattern="/^\d+$/" ng-keypress="numberonly($event)" required>
                            </td>
                            <td>
                                <button class="btn btn-danger btn-xs" style="margin-left:3px;"
                                    ng-click="deleteItem($index,item)">
                                    <img class="drhms-edit-button" src="assets/svg/delete.svg" alt="">
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    <!-- </div> -->
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row ">
        <div class="col-sm-12">
            <div class="pull-left">
                <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()">
                    <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                    <span class="btn-fontsize" translate="common.backaction.lbl"></span>
                </button>

            </div>
            <div class="pull-right">

                <!-- <button type="button" id="btnsubmit" class="draftbutton"
                    translate="common.saveaction.lbl" ng-if="!item.isRequested" ng-click="save()"></button> -->
                <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                    ng-click="saveItem()"></button>

                <!-- <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()"
                    translate="common.clearaction.lbl"></button>
                <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()"
                    translate="common.cancelaction.lbl"></button> -->
            </div>
        </div>
    </div>
</div>
