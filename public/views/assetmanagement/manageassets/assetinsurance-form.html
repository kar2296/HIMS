<style>
    .modal-dialog.modal-full {
        width: 50%;
    }

    .ui-select-match.ng-scope {
        margin-left: 0px !important;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-6">
        <h4 class=" col-sm-6 modal-title custom-modal-title" translate="assetmanagement.warranty-form.pagetitle1.lbl">
        </h4>
    </div>
    <div class="col-sm-6">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="formRoot">
            <table id="bannerdetails" style="margin: 3px;">
                <tr>
                    <td>
                        <span translate="assetmanagement.warranty-list.assetcode.lbl"></span>
                    </td>
                    <td>
                        <span>{{item.AssetCode}}</span>
                    </td>
                    <td>
                        <span translate="assetmanagement.warranty-list.assetname.lbl"></span>
                    </td>
                    <td>
                        <span>{{item.AssetName}}</span>
                    </td>

                </tr>
            </table>
            <div class="panel-default">
                <div class="panel-body form-panel">
                    <div class="col-sm-12">
                        <div class="form-group col-sm-6">
                            <label class="col-sm-12 control-label" for="insurancename"
                                translate="assetmanagement.warranty-list.insurancename.lbl"></label>
                            <div class="col-sm-12">
                                <input type="text" class="form-control" name="insurancename"
                                    ng-model="item.InsuranceName" placeholder="" required>
                                <!-- <ui-select ng-model="item.InsuranceId" name="insurancename" required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices
                                                repeat="lookupitem.Id as lookupitem in lookup.INSURANCE | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select> -->
                            </div>
                        </div>
                        <div class="form-group col-sm-6">
                            <label class="col-sm-12 control-label" for="idvvalue"
                                translate="assetmanagement.warranty-list.idvvalue.lbl"></label>
                            <div class="col-sm-12">
                                <input type="text" class="form-control" name="idvvalue"
                                    onChange="numberwithDeconly($event)" onKeyUp="numberwithDeconly($event)"
                                    ng-keypress="numberwithDeconly($event)" ng-model="item.IDVValue" placeholder=""
                                    required>
                            </div>
                        </div>
                        <div class="form-group col-sm-6">
                            <label class="col-sm-12 control-label" for="premiumamount"
                                translate="assetmanagement.warranty-list.premimumamount.lbl"></label>
                            <div class="col-sm-12">
                                <input type="text" class="form-control" name="premiumamount"
                                    onChange="numberwithDeconly($event)" onKeyUp="numberwithDeconly($event)"
                                    ng-keypress="numberwithDeconly($event)" ng-model="item.PremimumAmount"
                                    placeholder="" required>
                            </div>
                        </div>
                        <div class="form-group col-sm-6">
                            <label class="col-sm-12 control-label" for="periodstart"
                                translate="assetmanagement.warranty-list.periodstart.lbl"></label>
                            <div class="col-sm-12">
                                <input type="text" class="form-control" name="periodstart" ng-date-object
                                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                    placeholder="{{datePickerOptions.placeholder}}"
                                    ng-click="fromdatePopup = { opened: true }" is-open="fromdatePopup.opened"
                                    ng-model="item.PeriodStart">
                            </div>
                        </div>

                        <div class="form-group col-sm-6">
                            <label class="col-sm-12 control-label"
                                translate="assetmanagement.warranty-list.periodend.lbl" for="date"></label>
                            <div class="col-sm-12">
                                <input type="text" class="form-control" name="date" ng-date-object
                                    datepicker-options="datePickerOptions"
                                    show-button-bar="{{datePickerOptions.showButtonBar}}"
                                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                    placeholder="{{datePickerOptions.placeholder}}"
                                    ng-click="activetoPopup = { opened: true }" is-open="activetoPopup.opened"
                                    ng-model="item.PeriodEnd" ng-change="SetChangePeriodEnd(item)">
                            </div>
                        </div>
                        <div class="form-group col-sm-6">
                            <label class="col-sm-12 control-label" for="policytype"
                                translate="assetmanagement.warranty-list.policytype.lbl"></label>
                            <div class="col-sm-12">
                                <ui-select ng-model="item.PolicyTypeId" name="policytype" required>
                                    <ui-select-match>
                                        {{$select.selected.Text | limitTo : 20 : 0}}
                                        <span ng-if="$select.selected.Text.length>20">...</span>
                                    </ui-select-match>
                                    <ui-select-choices
                                        repeat="lookupitem.Id as lookupitem in lookup.PolicyType | filter: { Text: $select.search }">
                                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                    </ui-select-choices>
                                </ui-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-12">
                        <div class="form-group col-sm-6">
                            <label class="col-sm-12 control-label" for="comments"
                                translate="assetmanagement.warranty-list.comments.lbl"></label>
                            <div class="col-sm-12">
                                <commentscontrol comments="item.Comments"></commentscontrol>
                            </div>
                        </div>
                        <div class="form-group col-sm-6">
                            <label class="col-sm-12 control-label" for="comments" translate="Is Active"></label>
                            <div class="col-sm-12">
                                <input type="checkbox" class="custom-checkbox" name="ispoison" ng-model="item.IsActive">
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<div class="">
    <div class="row">
        <div class="pull-right">
            <button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl"
                ng-click="Save()"></button>

            <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                ng-click="saveAndApprove()"></button>
            <!-- <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()"
                    translate="common.clearaction.lbl"></button>
                <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()"
                    translate="common.cancelaction.lbl"></button> -->
        </div>
    </div>
</div>
