 <style>
     .pager-div {
         float: right;
         right: 0;
         box-sizing: border-box;
         position: fixed;
         box-sizing: border-box;
     }
    .tablebox.ng-scope {
    background: white !important;
    padding: 15px;
    border-radius: 15px;
    margin: -27px;
    margin-top: -99px !important;
}
#tdsearch input[type=search], input[type=text] {
    height: 40px !important;
    margin-bottom: 0px !important;
    width: 96% !important;
}
#tdsearch span.btn.btn-default.form-control.ui-select-toggle {
    width: 105% !important;
}
button.addbutton {
    margin-top: 5px !important;
    position: relative;
    right: 14px;
}
ul.uib-datepicker-popup.dropdown-menu.ng-scope {
    width: 21%;
}
 </style>
 
 <div class="">
     <div style="">
        <button class="btn-add" ng-click="addNew()" style="margin-bottom: 13px !important;"
        uib-tooltip="{{ 'assetmanagement.warranty-list.tooltip.lbl' | translate}}" tooltip-placement="bottom">
        <i class="fa fa-plus" aria-hidden="true"></i>
        
        <!-- <span translate="common.addaction.lbl"></span> -->
       </button>
 </div>
 </div>
 <table id="bannerdetails">
    <tr>
        <td translate="assetmanagement.warranty-list.warrantytype.lbl"></td>
        <td id="tdsearch"><ui-select ng-model="currentfilter.WarrantyTypeId" ng-change="getList()" class="filter-combo">
                     <ui-select-match>
                         {{$select.selected.Text | limitTo : 20 : 0}}
                         <span ng-if="$select.selected.Text.length>8">...</span>
                     </ui-select-match>
                     <ui-select-choices
                         repeat="lookupitem.Id as lookupitem in lookup.WarrantyType | filter: { Text: $select.search }">
                         <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                     </ui-select-choices>
                 </ui-select></td>
        <td translate="assetmanagement.warranty-list.fromdate.lbl"></td>
        <td id="tdsearch"> <input type="text" class="form-control" name="date" ng-change="getList()"
                     datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                     uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                     placeholder="{{datePickerOptions.placeholder}}" ng-click="dateofbirthPopup = { opened: true }"
                     is-open="dateofbirthPopup.opened" ng-model="currentfilter.FromDate"></td>
        <td translate="assetmanagement.warranty-list.todate.lbl"></td>
        <td id="tdsearch"><input type="text" class="form-control" name="dweate" ng-change="getList()"
                     datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                     uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                     placeholder="{{datePickerOptions.placeholder}}" ng-click="activetoPopup = { opened: true }"
                     is-open="activetoPopup.opened" ng-model="currentfilter.ToDate"></td>
        <td translate="assetmanagement.warranty-list.status.lbl"></td>
        <td id="tdsearch">  <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                     <ui-select-match>
                         {{$select.selected.Text | limitTo : 20 : 0}}
                         <span ng-if="$select.selected.Text.length>8">...</span>
                     </ui-select-match>
                     <ui-select-choices
                         repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                         <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                     </ui-select-choices>
                 </ui-select></td>
    </tr>
</table>
