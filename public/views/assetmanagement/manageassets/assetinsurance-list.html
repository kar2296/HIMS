<style>
    .pager-div {
        float: right;
        right: 0;
        box-sizing: border-box;
        position: fixed;
        box-sizing: border-box;
    }
    .ui-select-match.ng-scope {
    margin-left: 20px;
}
.tablebox.ng-scope .row.filter-area span.btn.btn-default.form-control.ui-select-toggle {
    padding: 8px;
    height: 32px !important;
    border-radius: 0px;
    margin-bottom: 10px;
    width: 220px !important;
}
button.addbutton {
    margin-bottom: 9px !important;
    margin-top: 4px !important;
    position: relative;
    right: 7px;
}
</style>
<div class="">
    <div class="col-sm-12">
        <div class="col-sm-6"></div>
        <div class="col-sm-5">
            <label class="col-sm-4 control-label filter-lbl" translate="assetmanagement.warranty-list.status.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <button class="addbutton col-sm-1" style="width: 4%" ng-click="addNew()" uib-tooltip="{{ 'Asset Insurance' | translate}}"
        tooltip-placement="bottom">
        <i class="fa fa-plus" aria-hidden="true"></i>
        
    </button>
    </div>
</div>
<custom-table config="vm.gridConfig"></custom-table>
<div class="fooder-bgs" style="margin-bottom: 10px;">
   <div class="row ">
       <div class="col-sm-12">
           <div class="pull-left">
               <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()">
                   <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                   <span class="btn-fontsize" translate="common.backaction.lbl"></span>
               </button>

           </div>
           <div class="pull-right">
              
               <button type="button" id="btnsubmit" class="draftbutton"
                   translate="common.saveaction.lbl" ng-if="!item.isRequested" ng-click="save()"></button>
               <button type="button" class="draftbutton"
                   translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>

               <!-- <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()"
                   translate="common.clearaction.lbl"></button>
               <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()"
                   translate="common.cancelaction.lbl"></button> -->
           </div>
       </div>
   </div>
</div>
