<style>
    button {
        margin: 2px 3px;
    }
    .ui-grid-render-container-left .ui-grid-viewport {
        height: 340px !important;
    }
    .formactionbar {
    margin-bottom: 5px;
    padding: 5px 15px;
    height: 40px;
    background-color: #ccecf5;
    position: fixed;
    bottom: 0px;
}
.table-uigrid { height: 374px !important;
}
 .ui-grid-render-container-body .ui-grid-viewport { height: 340px !important;
}
.ui-grid-canvas, .ui-grid-viewport {
    width: 102%!important;
}
</style>
<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="assetmanagement.findasset.pagetitle.lbl"></h4>
</div>
<div class="bg-pattern" style="height: 571px">
    <div class="row filter-area panel-favorite">
        <div class="dynamicform-content">
            <dynamicform modeldata="modeldata" schema="schema"></dynamicform>
            <div class="form-group col-sm-3">
                <button type="button" class="draftbutton {{action.cls}}" ng-repeat="action in schema.actions" ng-click="actionClick(action.type)"
                    translate="{{action.translate}}"></button>
            </div>
        </div>
    </div>
    <div class="col-sm-12 grid-div">
        <div ui-grid="vm.gridConfig" class="table-uigrid"  ui-grid-selection></div>
    </div>
    <div class="col-sm-12 panel-footer formactionbar">
        <div class="col-sm-11">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
        <div class=" col-sm-1">
            <button type="button" class="btn btn-danger btn-sm pull-right" ng-click="cancelCallback()" translate="common.cancelaction.lbl"></button>
        </div>
    </div>
</div>
