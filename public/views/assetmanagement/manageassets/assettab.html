<div class="row page-header">
    <h4 class="active col-sm-5 mt0" translate="assetmanagement.asset.pagetitle.lbl"></h4>
    <label class="col-sm-1 status" ng-hide="Status==''">{{Status}}</label>
    <div class="col-sm-2 pull-right mt0 active">
        <button class="btn-add" ng-click="addNew()"
            uib-tooltip="{{ 'assetmanagement.asset.pagetitle.lbl' | translate }}" tooltip-placement="bottom">
            <i class="fa fa-plus" aria-hidden="true"></i>
            <!-- &nbsp;&nbsp;
            <span translate="common.addaction.lbl"></span> -->
        </button>
    </div>
</div>
<div class="row tablebox" id="tablebox">
    <div class="col-sm-12">
        <uib-tabset active="active" id="assettabs">
            <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)"
                disable="tab.canDisable">
            </uib-tab>
        </uib-tabset>
        <div ui-view class="tabview"></div>
    </div>
</div>
