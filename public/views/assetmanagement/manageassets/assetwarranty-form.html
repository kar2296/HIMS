<style>
    .modal-lg {
        width: 500px;
    }

    .panel-body {
        padding: 15px;
        margin-left: 0px;
        margin-top: -53px;
        margin-right: 0px;
        margin-bottom: 0px;
        background-repeat: repeat;
        overflow: auto;
        /* background: #cccccc57 ; */
    }

    .modal-content .panel-body {
        overflow: inherit;
    }

    .well {
        min-height: 20px;
        padding: 19px;
        margin-bottom: 0px;
        border: 1px solid #ededed;
        border-radius: 4px;
        background: rgb(233, 246, 253);
        /* Old browsers */
        background: -moz-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* FF3.6-15 */
        background: -webkit-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, rgb(250, 250, 250) 0%, rgb(247, 252, 253) 100%);
        /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid: DXImageTransform.Microsoft.gradient(startColorstr='#e9f6fd', endColorstr='#d3eefb', GradientType=0);
        /* IE6-9 */
        box-shadow: 4px 2px 13px -7px rgba(0, 0, 0, 0.75);
    }

    .formactionbar {
        padding: 5px 15px;
        height: 40px;
        background-color: #ccecf5;
    }

    .modal-content {
        -webkit-box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        box-shadow: -1px 3px 20px 7px rgba(249, 244, 244, 0.5);
        width: 766px;
        margin-left: -8%;
    }

    .modal-header {
        padding: 4px 10px;
        border-bottom: 1px solid #e5e5e5;
    }
    .form-horizontal .form-group {
    margin-left: -15px;
    margin-right: -15px;
    margin: 0px !important;
}
.pull-right.btn{
    padding: 6px;
}

    font-weight: 800;
    height: 40px !important;
    margin-bottom: 10px;
    border: 1px solid gray !important;
    border-radius: 0px;
    width: 276px !important;
} */
.ui-select-container.ui-select-bootstrap.dropdown.ng-pristine.ng-untouched.ng-valid.ng-scope.ng-empty {
    width: 276px;
    /* margin: 0 9px; */
    border-radius: 8px !important;
}
.table td {
    text-align: left;
    overflow: hidden;
    white-space: nowrap;
    background: #f5f7fa;
    border: 1px solid #0c0a0a !important;
    text-overflow: ellipsis;
    /* padding: .75em; */
}
.ui-select-bootstrap > .ui-select-match {
    text-align: left;
    width: 273px !important;
}

</style>
<div class="modal-header custom-modal-header">
    <h4 class=" col-sm-6 modal-title custom-modal-title" translate="assetmanagement.warranty-form.pagetitle.lbl"></h4>
    <div class="col-sm-6">
            <div class="filters">
                <img src="../../../../../assets/svg/close.svg"  ng-click="cancelCallback()">
            </div>
        </div>

</div>

<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
                <div class="formRoot">
                        <div class="panel panel-default">
                        <div class="panel-body form-panel bg-pattern">
                        <div class="col-sm-12">
                            <div class="form-group col-sm-6">
                                    <label class="col-sm-12 control-label0" for="warrantytype"
                                    translate="assetmanagement.warranty-list.warrantytype.lbl"></label>
                                <div class="col-sm-12">
                                  <ui-select ng-model="item.WarrantyTypeId" name="warrantytype" required>
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                        </ui-select-match>
                                        <ui-select-choices
                                            repeat="lookupitem.Id as lookupitem in lookup.WarrantyType | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                            </div>
                            <div class="form-group col-sm-6">
                                 <label class="col-sm-12 control-label0" for="fromdate"
                                    translate="assetmanagement.warranty-list.fromdate.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="text" class="form-control" name="fromdate" required 
                                    ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                        placeholder="{{datePickerOptions.placeholder}}"
                                        ng-click="fromdatePopup = { opened: true }" is-open="fromdatePopup.opened"
                                        ng-model="item.FromDate">
                                </div>
                            </div>
                            </div>
                            <div class="col-sm-12">
                            <div class="form-group col-sm-6">
                                 <label class="col-sm-12 control-label0" for="nooffreeservices"
                                    translate="assetmanagement.warranty-list.freeservice.lbl"></label>
                                <div class="col-sm-12">
 <input type="text" class="form-control" name="nooffreeservices" required
                                        ng-model="item.NoOfFreeServices" placeholder="" ng-pattern="/^\d+$/">
                                </div>
                            </div>
                            <div class="form-group col-sm-6">
                                <label class="col-sm-12 control-label0"
                                   translate="assetmanagement.warranty-list.todate.lbl" for="date"></label>
                               <div class="col-sm-12">
                                   <input type="text" class="form-control" name="date" ng-date-object
                                       datepicker-options="datePickerOptions"
                                       show-button-bar="{{datePickerOptions.showButtonBar}}"
                                       uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                       placeholder="{{datePickerOptions.placeholder}}"
                                       ng-click="activetoPopup = { opened: true }" is-open="activetoPopup.opened"
                                       ng-model="item.ToDate">
                               </div>
                           </div>
                            <div class="form-group col-sm-6">
                                 <label class="col-sm-12 control-label0" for="otherinformations"
                                    translate="assetmanagement.warranty-list.pendingservice.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="text" class="form-control" name="otherinformations"
                                        ng-model="item. NoOfPendingServices" placeholder="" ng-pattern="/^\d+$/"
                                    >
                                </div>
                            </div>
                            <div class="form-group col-sm-6">
                                 <label class="col-sm-12 control-label0"
                                    translate="assetmanagement.warranty-form.costvalue.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="text" class="form-control" name="costvalue" ng-model="item. CostValue"
                                        placeholder="" ng-pattern="/^\d+$/">
                                </div>
                            </div>
                            <div class="form-group col-sm-6">
                                 <label class="col-sm-12 control-label0"
                                    translate="assetmanagement.warranty-form.refnumber.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="text" class="form-control" name="refnumber"
                                        ng-model="item. ReferenceNumber" placeholder="" ng-pattern="/^\d+$/">
                                </div>
                            </div>
                            <div class="form-group col-sm-6">
                                 <label class="col-sm-12 control-label0"
                                    translate="assetmanagement.asset.isactive.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="checkbox" name="isactive" class="custom-checkbox"
                                        ng-model="item.IsActive">
                                </div>
                            </div>
                            </div>
                            <div class="col-sm-12">
                            <div class="form-group col-sm-6">
                                <label class="col-sm-12 control-label0" for="comments"
                                   translate="assetmanagement.warranty-list.comments.lbl"></label>
                               <div class="col-sm-12">
                                   <commentscontrol comments="item.Comments"></commentscontrol>
                               </div>
                        </div>
                    </div>
                    </div>
  </div>
            </div>
        </div>   
                    <div class="footer-bg">

                        <div class="pull-right btn">
                            <button type="button" class="draftbutton"
                                translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                            <!-- <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()"
                                translate="common.clearaction.lbl"></button>
                            <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()"
                                translate="common.cancelaction.lbl"></button> -->
                        </div>
        
                    </div>
        </form>
                </div>
             </div>
