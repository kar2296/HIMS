<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="assetmanagement.assets.labequipmenttitle.lbl"></h4>
    <div class="col-sm-6">   <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addNew()" uib-tooltip="{{ 'assetmanagement.assets.labequipemnttooltip.lbl' | translate }}"
        tooltip-placement="bottom">
        <i class="fa fa-plus" aria-hidden="true"></i><span translate="common.addaction.lbl"></span></button>
    </div>
</div>

<div class="row filter-area">
    <div class="col-sm-12">
        <div class="col-sm-3">
            <label class="col-sm-4 control-label filter-lbl" translate="assetmanagement.assets.filter_assettype.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.AssetTypeId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.AssetType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-4 control-label filter-lbl" translate="assetmanagement.assets.filter_assetcetegory.lbl"></label>
            <div class="col-sm-8">
                 <ui-select ng-model="currentfilter.AssetCategoryId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.AssetCategory | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-4 control-label filter-lbl" translate="assetmanagement.assets.filter_installeddepartment.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.DepartmentId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>

        <div class="col-sm-3">
            <label class="col-sm-4 control-label filter-lbl" translate="assetmanagement.assets.filter_status.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>

    </div>
</div>
<custom-table config="vm.gridConfig"></custom-table>
<div class="container-fluid" id="usersheight">
 

    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
