<div class="row page-header">
    <h4 class="col-sm-6 mg0" translate="assetmanagement.asset.labequipmenttitle.lbl"></h4>
    <span class="col-sm-6 pull-right"></span>
</div>

<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="">
                <div class="panel-body form-panel">
                    <div class="col-sm-12 well">
                        <div class="col-sm-10">
                            <div class="form-group col-sm-12">
                                <label class="col-sm-3 control-label0" for="facility"
                                    translate="assetmanagement.assets.company.lbl"></label>
                                <div class="col-sm-6">
                                    <ui-select ng-model="item.FacilityId">
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 60 : 0}}
                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                        </ui-select-match>
                                        <ui-select-choices
                                            repeat="lookupitem.Id as lookupitem in lookup.Company | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                                <div class="col-sm-3">
                                </div>
                            </div>
                            <div class="form-group col-sm-6">
                                <label class="col-sm-12 control-label0" for="assetcode"
                                    translate="assetmanagement.asset.assetcode.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="text" class="form-control" name="assetcode" ng-model="item.AssetCode"
                                        placeholder="" ng-disabled="currentcontext.id>0" uppercase required>
                                </div>
                            </div>
                            <div class="form-group col-sm-6">
                                <label class="col-sm-12 control-label0" for="assetname"
                                    translate="assetmanagement.asset.assetname.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="text" class="form-control" name="assetname" ng-model="item.AssetName"
                                        placeholder="" uppercase required>
                                </div>
                            </div>
                            <div class="form-group col-sm-6">
                                <label class="col-sm-12 control-label0" for="description"
                                    translate="assetmanagement.assets.description.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="text" class="form-control" name="description"
                                        ng-model="item.Description" placeholder="" uppercase required>
                                </div>
                            </div>
                            <div class="form-group col-sm-6">
                                <label class="col-sm-12 control-label0"
                                    translate="assetmanagement.asset.islab.lbl"></label>
                                <div class="col-sm-12">
                                    <input type="checkbox" class="custom-checkbox" ng-model="item.IsLabInterface"
                                        ng-checked="item.IsLabInterface == 1">
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <div class="fooder-bgs">
                    <div class="row ">
                        <div class="col-sm-12">
                            <div class="pull-left">
                                <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()">
                                    <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                                    <span class="btn-fontsize" translate="common.backaction.lbl"></span>
                                </button>

                            </div>
                            <div class="pull-right">
                                <button type="button" id="btnsubmit" class="draftbutton"
                                    translate="common.saveaction.lbl" ng-if="!item.isRequested"
                                    ng-click="save()"></button>
                                <button type="button" class="btn dem-color4 text-white btn-sm"
                                    translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>

                                <button id="btnClearForm" type="button" class="btn btn-warning btn-sm"
                                    ng-click="clear()" translate="common.clearaction.lbl"></button>
                                <button id="btnCancelForm" type="button" class="draftbutton"
                                    ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
