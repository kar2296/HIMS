<style>
    .panel-heading {
        padding: 4px 15px;
    }
    
    .well {
        min-height: 20px;
        padding: 19px;
        margin-bottom: 0px;
        border: 1px solid #ededed;
        border-radius: 4px;
        background: rgb(233, 246, 253);
        /* Old browsers */
        background: -moz-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* FF3.6-15 */
        background: -webkit-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, rgb(250, 250, 250) 0%, rgb(247, 252, 253) 100%);
        /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid: DXImageTransform.Microsoft.gradient( startColorstr='#e9f6fd', endColorstr='#d3eefb', GradientType=0);
        /* IE6-9 */
        box-shadow: 4px 2px 13px -7px rgba(0, 0, 0, 0.75);
    }
    
    .panel-body {
        padding: 15px;
        margin-left: 0px;
        margin-top: 0px;
        margin-right: 0px;
        margin-bottom: 0px;
        background-image: url(app/img/bg-body.jpg);
        background-repeat: repeat;
        overflow: auto;
    }
    
    .wrapper > section {
        height: 595px;
    }
    
    .panel {
        margin-bottom: 0px;
    }
    
    .formRoot {
        overflow: auto;
        height: 515px;
    }
    
    .panel-footer {
        padding: 4px 15px;
        background-color: #ccecf5;
        border-top: 1px solid #eeeeee;
        border-bottom-right-radius: 3px;
        border-bottom-left-radius: 3px;
    }
    
    .page-header {
        margin: 0px 0px 0px 0px !important;
    }
    
    address {
        margin-bottom: 6px !important;
    }
    
    #housekeeprequest-height .well {
        min-height: 350px;
    }
    
    #housekeeprequest-height .panel-body {
        height: 453px;
    }
    
    .profile-header img {
        border-radius: 4px;
        height: 46px !important;
        width: 55px;
        margin-top: 6px;
    }
    
    .profile-header {
        /*height: 71px;*/
        color: white;
        font-size: 12px;
        line-height: 20px;
    }
    
    legend a {
        color: inherit;
    }
    
    legend.legendStyle {
        padding-left: 5px;
        padding-right: 5px;
    }
    
    div.fsStyle {
        border: 1px solid lightgray !important;
        padding: 4px;
        margin: 3px;
    }
    
    legend.legendStyle {
        font-size: 90%;
        color: #fff;
        background-color: #1ea9d0;
        font-weight: 700;
        box-shadow: 1px 3px 5px -1px #756f6f;
        border-radius: 2px;
    }
    
    legend {
        width: auto;
        border-bottom: 0px !important;
        margin-bottom: 0px !important;
    }
    
    div .form-group col-sm-4 {
        margin-bottom: 4px;
    }
    
    .padding {
        padding: 15px !important;
    }
    
    .page-header {
        padding-top: 3px;
        /* padding-bottom: 2px; */
        /* padding-left: 0; */
    }
    
    .page-header h4 {
        padding-top: 2px;
        height: 12px;
    }
    
    .specific-text {
        color: #f7f7f7;
        background-color: #b94a48;
        padding: 1px 9px;
    }
    
    .table-uigrid.ui-grid .ui-grid-row.ui-grid-row-selected > [ui-grid-row] > .ui-grid-cell {
        background-color: lightgreen;
    }
    .form-group.col-sm-4 {
    margin-bottom: 13px;
}
.col-sm-12 {
    padding: 0px 7px;
}
legend.legendStyles {
    color: #116fb9;
    margin-bottom: 14px !IMPORTANT;
}
</style>
<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="assetmanagement.assetreconcile.pagetitle2.lbl"></h4>
</div>

<div class="">

    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <!--<div class="">-->
            <!--<div class="panel panel-default">-->

            <div class="">


                <!--leftpanel-->
                <div class="col-sm-12">
                    <div class="col-sm-12">
                        <div class="content">
                            <legend class="legendStyles">
                                <span translate="assetmanagement.assetaudit.assetdetails.lbl"></span>
                            </legend>
                            <div class="form-group col-sm-4" style="margin-bottom: -11px !important;">
                                <label class="col-sm-4 control-label filter-lbl" translate="assetmanagement.assetaudit.auditwindowname.lbl"></label>
                                <div class="col-sm-8 input-group">
                                    <ui-select ng-model="item.AuditNameId">
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                        </ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.User | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                            </div>
                            <div class="form-group col-sm-4" style="margin-bottom: -11px !important;">
                                <label class="col-sm-4 control-label filter-lbl" translate="assetmanagement.assetaudit.fundingname.lbl"></label>
                                <div class="col-sm-8 input-group">
                                    <div class="search">
                                    <input type="text" class="form-control" translate translate-attr-placeholder="assetmanagement.assetaudit.fundingname.lbl"
                                        ng-model="item.FundingName" placeholder="">
                                        <i class="fas fa-search" aria-hidden="true"></i>
                                        </div>

                                </div>
                            </div>
                            <div class="form-group col-sm-4">
                                <label class="col-sm-4 control-label" for="department" translate="assetmanagement.assetaudit.department.lbl"></label>
                                <div class="col-sm-8 input-group">
                                    <ui-select ng-model="item.DepartmentId" name="department" required>
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                        </ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                            </div>
                            <div class="form-group col-sm-4">
                                <label class="col-sm-4 control-label filter-lbl" translate="assetmanagement.assetaudit.location.lbl"></label>
                                <div class="col-sm-8 input-group">
                                    <ui-select ng-model="item.LOCATIONId">
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                        </ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.LOCATION | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>

                            </div>
                        </div>



                    </div>
                </div>
                <!--<div class="form-group col-sm-4">
                            <label class="col-sm-4 control-label" translate="assetmanagement.assettransfer.search.lbl"></label>
                            <div class="col-sm-8 input-group">
                                <autosearch itemid="item.AssetId" iteminfo="item.selecteditem" rowdata="" config="vm.assettransfercontrolconfig" itemchange="getList()"></autosearch>

                            </div>
                        </div>-->
                <!--rightpanel-->
                <div class="col-sm-12">
                    <div class="col-sm-12">
                        <div class="content">
                            <legend class="legendStyles">
                                <span translate="assetmanagement.assetaudit.auditdetails.lbl"></span>
                            </legend>
                            <div class="form-group col-sm-4">
                                <label class="col-sm-4 control-label" translate="assetmanagement.assetreconcile.auditon.lbl"></label>
                                <div class="col-sm-8 input-group">
                                    <input type="text" class="form-control" name="startdate" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                        placeholder="{{datePickerOptions.placeholder}}" ng-click="startdatePopup = { opened: true }"
                                        is-open="startdatePopup.opened" ng-model="item.StartDate">
                                </div>
                            </div>
                            <div class="form-group col-sm-4">
                                <label class="col-sm-4 control-label" translate="assetmanagement.assetreconcile.startdate.lbl"></label>
                                <div class="col-sm-8 input-group">
                                    <input type="text" class="form-control" name="reconcilestartdate" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                        placeholder="{{datePickerOptions.placeholder}}" ng-click="reconcilestartdatePopup = { opened: true }"
                                        is-open="reconcilestartdatePopup.opened" ng-model="item.ReconcileStartDate">
                                </div>
                            </div>
                            <div class="form-group col-sm-4">
                                <label class="col-sm-4 control-label" translate="assetmanagement.assetreconcile.enddate.lbl"></label>
                                <div class="col-sm-8 input-group">
                                    <input type="text" class="form-control" name="enddate" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                        placeholder="{{datePickerOptions.placeholder}}" ng-click="enddatePopup = { opened: true }"
                                        is-open="enddatePopup.opened" ng-model="item.EndDate">
                                </div>
                            </div>
                            <div class="form-group col-sm-4">
                                <label class="col-sm-4 control-label filter-lbl" translate="assetmanagement.assetaudit.auditstatus.lbl"></label>
                                <div class="col-sm-8 input-group">
                                    <ui-select ng-model="item.AuditStatusId">
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                        </ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.AuditStatus | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                            </div>
                        </div>


                    </div>
                </div>
                <div class="pull-right">
                    <!--<button type="button"  class="draftbutton" translate="Fetch Assets" ng-click="saveAndFetch()"></button>-->
                </div>
            </div>
            <div class="container-fluid onerow-filter">
                <custom-table config="vm.gridConfig"></custom-table>
                <div class="fooder-bgs">
                    <button type="button" class="btn btn-sm pyr-color10" ng-click="backToList()"><i class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button>

                    <div class="footer-right">
                        <button type="button" class="draftbutton" ng-click="saveAndReconcile()" translate="Reconcile"></button>
                        <button type="button"  class="draftbutton" ng-click="print()" hotkey="{'alt+t': print}" translate="common.printaction.lbl"></button>

                    </div>
                </div>


        </form>
        </div>
    </div>
</div>
