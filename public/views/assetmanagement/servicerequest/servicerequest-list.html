        <div class="col-sm-2 form-group">
            <label class="col-sm-12" for="from" translate="From Date"></label>
            <div class="col-sm-12">
                <input type="text" class="text-box form-control" name="from" ng-date-object datepicker-options="datePickerOptions"
                    show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="targetfrom = { opened: true }"
                    is-open="targetfrom.opened"  ng-model="currentfilter.From"
                    ng-change="getList()" tabindex="tabindexmap.patienttabindex">
            </div>
        </div>
        <div class="col-sm-2 form-group">
            <label class="col-sm-12" for="to" translate="To Date"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="to" ng-change="getList()"
                    datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
                    is-open="todatePopup.opened" ng-model="currentfilter.To">
            </div>
        </div>

        <div class="col-sm-2 form-group">
            <div class="form-group">
                <label class="col-sm-12control-label" translate="assetmanagement.servicerequest.request#.lbl"></label>
                <div class="col-sm-12">
                    <div class="search">
                        <input type="text" id="pid" class="form-control" on-enter="getList()"
                            ng-model="currentfilter.TicketNumberIdentifier" placeholder="">
                        <div class="drhms-search-icon"><i class="fas fa-search" aria-hidden="true"></i></div>
                    </div>
                </div>
            </div>
        </div>
        <!-- <div class="col-sm-2 form-group">

        <div class="col-sm-2 form-group">
            <label class="col-sm-12 control-label" translate="assetmanagement.assignment-list.department.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="currentfilter.DepartmentId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 25 : 0}}
                        <span ng-if="$select.selected.Text.length>25">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-2 form-group">
            <label class="col-sm-12 control-label" translate="assetmanagement.assets.filter_status.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="currentfilter.AssetTicketStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 25 : 0}}

                    <ui-select-choices

                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>

<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
