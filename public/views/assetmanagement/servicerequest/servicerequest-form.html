<style>
    .border-left-profiles {
        background: #0598f6;
        display: flex;
        align-items: center;
        margin: 0px 15px;
    }

    .text-primary {
        color: #ffffff;
    }

    legend.legendStyle {
        margin-bottom: 0 !important;
        position: absolute;
        top: 0;
    }

    .form-horizontal input,
    input[type=text] {
        border-radius: 0;
    }
    b, strong {
    font-weight: 700;
    color: #F44336;
}
</style>
<div class="row page-header">
    <div class="col-sm-12">
        <h4 translate="assetmanagement.servicerequest.managepagetitle.lbl"></h4>
    </div>
</div>
<div class="row border-left-profiles">
    <div class="col-sm-4">
        <span>
            <em class="text-primary">
                <span translate="assetmanagement.servicerequest.requestedon.lbl"></span>
            </em>
            <strong>&nbsp; {{item.CreatedAt | date : 'dd-MMM-yyyy'}} &nbsp; {{item.CreatedAt | date :
                'HH:mm'}}</strong>
        </span>
    </div>
    <!-- <div class="col-sm-3">
        <span>
            <em class="text-primary">
                <span translate="assetmanagement.assignment-form.assetname.lbl"></span>
            </em>
            <strong>&nbsp;
                <label>{{item.AssetName}}</strong>
        </span>
    </div> -->
    <div class="col-sm-4">
        <span>
            <em class="text-primary">
                <span translate="assetmanagement.servicerequest.requestedby.lbl"></span>
            </em>
            <strong>&nbsp;
                <label>{{CreatedUser.CreatedUser.Title.Description}}&nbsp;{{CreatedUser.CreatedUser.FirstName}}&nbsp;{{CreatedUser.CreatedUser.LastName}}</strong>
        </span>
    </div>
    <div class="col-sm-4">
        <span>
            <em class="text-primary">
                <span translate="assetmanagement.servicerequest.status.lbl"></span>
            </em>
            <strong>&nbsp; {{item.AssetTicketStatus}}</strong>
        </span>
    </div>
</div>
