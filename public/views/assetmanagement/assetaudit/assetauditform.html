<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="assetmanagement.assetaudit.pagetitle2.lbl"></h4>
    <div class="col-sm-6">
        <button type="button" tabindex="-1" class="btn-add" ng-click="Asset_dashboard()" uib-tooltip="Dashboard" tooltip-placement="bottom">
            <i class="fa fa-home" aria-hidden="true"> </i>
        </button>

        <!-- <i class="fa fa-home" align="right" style="float: right;" ng-click="Asset_dashboard()" uib-tooltip="Dashboard"
            tooltip-placement="bottom" aria-hidden="true"></i> -->
    </div>
</div>
<div class="tablebox">
    <div class="row filter-area">

        <div class="pd0">
            <form id="item_form" name="item_form" class="form-horizontal" role="form">
                <!--<div class="">-->
                <!--<div class="panel panel-default">-->

                <div class="">


                    <!--leftpanel-->
                    <div class="col-sm-6">
                        <div class="" style="border-right: 1px solid gainsboro;">
                            <div class="pagedetails">
                                <!-- <legend class="legendStyle">
                                    <span translate="assetmanagement.assetaudit.assetdetails.lbl"></span>
                            </legend> -->
                                <h3> <span translate="assetmanagement.assetaudit.assetdetails.lbl"></span></h3>

                                <!-- left pannel-->
                                <div class="col-sm-6 left" style="padding:0">
                                    <div class="form-group">
                                        <label class="col-sm-12 control-label0 filter-lbl"
                                            translate="assetmanagement.assetaudit.auditwindowname.lbl"></label>
                                        <div class="col-sm-8">
                                            <ui-select ng-model="item.AuditNameId">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices
                                                    repeat="lookupitem.Id as lookupitem in lookup.User | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                                                    </div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-12 control-label0" for="department"
                                            translate="assetmanagement.assetaudit.department.lbl"></label>
                                        <div class="col-sm-8 ">
                                            <ui-select ng-model="item.DepartmentId" name="department" required>
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices
                                                    repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                                                    </div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group ">

                                        <label class="col-sm-12 control-label0"
                                            translate="assetmanagement.assettransfer.search.lbl"></label>
                                        <div class="col-sm-8">
                                            <autosearch itemid="item.AssetId" iteminfo="item.selecteditem" rowdata=""
                                                config="vm.assetauditdetailscontrolconfig" itemchange="getList()">
                                            </autosearch>

                                        </div>
                                    </div>
                                </div>
                                <!--right pannel-->
                                <div class="col-sm-6 right" style="padding:0">
                                    <div class="form-group ">
                                        <label class="col-sm-12 control-label0 filter-lbl"
                                            translate="assetmanagement.assetaudit.fundingname.lbl"></label>
                                        <div class="col-sm-8 selectitem">
                                            <input type="text" class="form-control" translate
                                                translate-attr-placeholder="assetmanagement.assetaudit.fundingname.lbl"
                                                ng-model="item.FundingName" placeholder="">
                                        </div>
                                    </div>

                                    <div class="form-group ">
                                        <label class="col-sm-12 control-label0 filter-lbl"
                                            translate="assetmanagement.assetaudit.location.lbl"></label>
                                        <div class="col-sm-8 ">
                                            <ui-select ng-model="item.LOCATIONId">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices
                                                    repeat="lookupitem.Id as lookupitem in lookup.LOCATION | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                                                    </div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-12 control-label0 filter-lbl"
                                            translate="assetmanagement.assetaudit.quantity.lbl"></label>
                                        <div class="col-sm-8 selectitem">
                                            <input type="number" class="form-control" translate
                                                translate-attr-placeholder="assetmanagement.assetaudit.quantity.lbl"
                                                ng-model="item.Quantity" placeholder="" ng-pattern="/^\d+$/">
                                        </div>
                                    </div>
                                </div>
                            </div>



                        </div>
                    </div>
                    <!--<div class="form-group">
                            <label class="col-sm-4 control-label" translate="assetmanagement.assettransfer.search.lbl"></label>
                            <div class="col-sm-8 input-group">
                                <autosearch itemid="item.AssetId" iteminfo="item.selecteditem" rowdata="" config="vm.assettransfercontrolconfig" itemchange="getList()"></autosearch>

                            </div>
                        </div>-->
                    <!--rightpanel-->
                    <div class="col-sm-6">
                        <div class="">
                            <div class="pagedetails rightcont">
                                <!-- <legend class="legendStyle">
                                <span translate="assetmanagement.assetaudit.auditdetails.lbl"></span>
                            </legend> -->
                                <h3> <span translate="assetmanagement.assetaudit.auditdetails.lbl"></span></h3>


                                <div class="form-group">
                                    <div class="col-sm-6" style="padding:0">
                                        <label class="col-sm-12"
                                            translate="assetmanagement.assetaudit.startdate.lbl"></label>
                                        <div class="col-sm-12">
                                            <input type="text" class="form-control" name="startdateandtime"
                                                ng-date-object datetime-picker="{{datePickerOptions.dateTimeFormat}}"
                                                placeholder="{{datePickerOptions.placeholder}}"
                                                ng-click="startdateandtimePopup = { opened: true }"
                                                is-open="startdateandtimePopup.opened" ng-model="item.StartDate">
                                        </div>
                                    </div>
                                    <div class="col-sm-6" style="padding:0">
                                        <label class="col-sm-12"
                                            translate="assetmanagement.assetaudit.auditstatus.lbl"></label>
                                        <div class="col-sm-12">
                                            <ui-select ng-model="item.AuditStatusId">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices
                                                    repeat="lookupitem.Id as lookupitem in lookup.AuditStatus | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                                                    </div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-8 form-group" style="padding:0">

                                    <label class="col-sm-12 control-label0 filter-lbl"
                                        translate="assetmanagement.assetaudit.notes.lbl"></label>
                                    <div class="col-sm-12">

                                        <textarea type="text" class="form-control" translate
                                            translate-attr-placeholder="assetmanagement.assetaudit.notes.lbl"
                                            ng-model="item.Notes" placeholder="Message"
                                            style="height: 100px !important;"></textarea>
                                    </div>
                                </div>
                                <div class="col-sm-4 pull-right">
                                    <button type="button" class="btn btn-info text-white btn-sm"
                                        translate="Fetch Assets" ng-click="saveAndFetch()"></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-12">
                    <custom-table config="vm.gridConfig"></custom-table>
                </div>
                <div class="container-fluid onerow-filter" id="patientsearchheight">
                    <div class="footer-bg">
                        <!--<button class="btn btn-sm pyr-color10"  ng-click="backToList()"><i class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button>-->
                        <!-- <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()">
                        <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                        <span class="btn-fontsize" translate="common.backaction.lbl"></span>
                    </button> -->
                        <div class="footer-right">
                            <button type="button" id="btnsubmit" class="draftbutton"
                                translate="common.saveaction.lbl" ng-click="save()"></button>

                            <button type="button" class="btn dem-color4 text-white btn-sm" ng-click="saveAndAudit()"
                                translate="Complete Audit"></button>
                            <!-- <button type="button"  class="draftbutton" ng-click="print()" hotkey="{'alt+t': print}" translate="common.printaction.lbl"></button> -->

                        </div>
                    </div>
                </div>

            </form>
        </div>
    </div>
</div>
