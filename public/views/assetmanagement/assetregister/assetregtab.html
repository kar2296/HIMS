<div class="row page-header">
    <h4 class="active col-sm-6 mt0" translate="assetmanagement.asset.pagetitle1.lbl"></h4>
    <label class="col-sm-3 mt0 active" translate=" {{$state.params.AssetName}}"></label>
    <!--<label class="col-sm-3 mt0 active" translate=" {{$state.params.ItemCode}}"></label>-->
    <span ng-click="Asset_dashboard()" class="text-right" style="float:right;">
            <i  class="fa fa-home" ></i>
        </span>
</div>
<div class="row tablebox"  id="tablebox">
    <div class="col-sm-12">
         <uib-tabset active="active" id="assettabs">
            <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)" disable="tab.canDisable">
            </uib-tab>
        </uib-tabset>
		<div ui-view class="tabview"></div>
    </div>
</div>
