<style>
    .primary {
        color: white;
        background: #23B7E5;
        border-radius: 3px
    }

    .patientprofile-img {
        width: 70px !important;
        height: 70px !important;
    }

    .panel-body .well {
        height: 586px;
        width: 869px;
    }

    /* .col-sm-6 {
        width: 30%;
    } */

    .fullreg-profiles2 {
        min-height: 22px;
        color: #fff;
        background: -moz-linear-gradient(top, #fff 0, #f3f3f3 50%, #ededed 100%, #fff 100%);
        -moz-box-shadow: 7px 5px 15px -9px rgba(0, 0, 0, .75);
        box-shadow: 7px 5px 15px -9px rgba(0, 0, 0, .75);
        background: url(app/img/header-bg.jpg) repeat-x left top;
    }

    /* .cus-col {
        width: 120px !important;
        padding-left: 3px !important;
    } */

    .popup_content .col-sm-12 {
        padding: 6px;


    }

    .outer_border {
        border: 1px solid;
        box-shadow: 2px 11px 19px #888888;
    }

    /* .col-sm-4{border-right:1px solid;} */

    .outer_border .col-sm-12 {
        border-bottom: 1px solid lightgray;
    }
</style>

<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <h4 class="modal-title custom-modal-title">{{item.AssetName}}-({{item.AssetCode}})</h4>
</div>


<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="panel-body form-panel outer_border">
                <div class="panel panel-default">
                    <div class="col-sm-12 popup_content">
                        <div class="col-sm-12">
                            <div class="col-sm-6">
                                <b>
                                    <span translate="AssetName"></span>
                                </b>:</div>
                            <div class="col-sm-6">{{item.AssetName}}</div>
                        </div>
                        <div class="col-sm-12">
                            <div class="col-sm-6">
                                <b>
                                    <span translate="AssetCode"></span>
                                </b>:</div>
                            <div class="col-sm-6">{{item.AssetCode}}</div>
                        </div>
                        <div class="col-sm-12">
                            <div class="col-sm-6">
                                <b>
                                    <span translate="SerialNo"></span>
                                </b>:</div>
                            <div class="col-sm-6">{{item.Serial}}</div>
                        </div>
                        <div class="col-sm-12">
                            <div class="col-sm-6">
                                <b>
                                    <span translate="ModelNumber"></span>
                                </b>:</div>
                            <div class="col-sm-6">{{item.ModelNum}}</div>
                        </div>
                    </div>
                    <div class="col-sm-3 text-highlight12 plain-text">
                        <b>
                            <span translate='Warranty Details'></span>
                        </b>
                    </div>
                    <div class="col-sm-12 popup_content">
                        <table class="table table-hover table-responsive table-bordered">
                            <thead class="bg-subhead">
                                <tr>
                                    <th class="col-sm-4">
                                        <span translate="assetmanagement.warranty-list.warrantytype.lbl"></span>
                                    </th>
                                    <th class="col-sm-2">
                                        <span translate="assetmanagement.warranty-list.fromdate.lbl"></span>
                                    </th>
                                    <th class="col-sm-4">
                                        <span translate="assetmanagement.warranty-list.todate.lbl"></span>
                                    </th>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="item in warrantydetails | filter:{Status:1}">
                                    <td>
                                        {{item.WarrantyType.Description}}
                                    </td>
                                    <td>
                                        <displaydate date-val="item.FromDate"></displaydate>
                                    </td>
                                    <td>
                                        <displaydate date-val="item.ToDate"></displaydate>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="panel-footer formactionbar">
                <div class="pull-right">
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
