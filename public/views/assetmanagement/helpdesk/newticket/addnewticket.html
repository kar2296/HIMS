<style>
        .panel-body {
           overflow: inherit;
       }
   
       set-tab-form-height {
           height: 501px !important;
       }
   
       #fullregistrationheight .well {
           min-height: 210px;
   
       }
   
       .custom-modal-header {
           padding: 0px 11px !important;
       }
   
       .layout-fixed .wrapper>section {
           height: 87vh;
           overflow: scroll;
           overflow-x: hidden;
       }
   
       #fullregistrationheight .formRoot {
           overflow: hidden;
           height: auto;
       }
   
       .panel {
           margin-bottom: 0px;
       }
   
       .panel-body {
           padding: 0px;
       }
   
       .form-group {
           margin-bottom: 1rem !important;
   
       }
   
       .uneditable-input,
       input[type=color],
       input[type=date],
       input[type=datetime-local],
       input[type=datetime],
       input[type=email],
       input[type=month],
       input[type=number],
       input[type=password],
       input[type=search],
       input[type=tel],
       input[type=text],
       input[type=time],
       input[type=url],
       input[type=week],
       span.btn.btn-default.form-control.ui-select-toggle {
           height: 32px;
       }
   
       .inputfile-1+label {
           color: #f1e5e6;
           width: 30%;
           border-radius: 3px;
           margin: 1px 2px;
           cursor: pointer;
           background-color: #d3394c;
       }
   
       .box1 .inputfile {
           width: 0.1px;
           height: 0.1px;
           opacity: 0;
           overflow: hidden;
           position: absolute;
           z-index: -1;
       }
   
       .logoimgg {
           height: 150px;
           width: 150px;
           background: #fff;
           border: 1px solid #ccc;
       }
   
       .refresh {
           background-color: rgba(115, 153, 216, 0.77);
           border-color: #e6a151;
           color: #fff;
           width: 33%;
       }
   
       #fullregistrationheight .image-height-control {
           height: 93px;
           width: 100%;
           background: #fff;
       }
   
       .item-logo-img {
           width: 150px !important;
           height: 150px !important;
           border: 1px solid #ccc;
       }
   
       .actionicon {
           margin-top: 23px;
       }
   
       .panel-default {
           border: none;
       }
   
       /* .form-group label {
           font-family: initial;
       } */
   
       /*dinesh css*/
       .actionicon {
           margin-top: 0px;
       }
   
       .inputfile-1+label {
           background: #d4e4e7;
           padding: 8px;
           color: #54667a;
           border-radius: 50%;
           resize: both;
           border: 3px solid #ffffff;
           position: relative;
           bottom: 35px;
           box-shadow: 0px 0px 0px 4px #039de5;
           width: 44px;
       }
   
       div#fullregistrationheight input {
           height: 40px;
           border: 1px solid gray !important;
           border-radius: 0px;
       }
   
       span.btn.btn-default.form-control.ui-select-toggle {
           height: 32px !important;
           border: 1px solid gray !important;
           /* border-radius: 8px; */
       }
   
       span.ui-select-match-text.pull-left {
           /* padding: 8px; */
       }
   
       .btn {
           border-radius: 0px;
           font-size: 16px;
       }
   
       .fooder-bg .row {
           margin: 0 !important;
           background: #d1e3e6 !important;
       }
   
       .aside-collapsed .fooder-bg {
           width: 95.8% !important;
           left: 2% !important;
           background: #d1e3e6 !important;
   
       }
   
       div#fullregistrationheight {
           margin-bottom: 70px !important;
       }
   
       .aside-collapsed .fooder-bg {
           width: 100% !important;
           left: 0% !important;
           margin-top: 30px;
           background: #d1e3e6 !important;
       }
   
       .fooder-bg {
           padding: 14px !important;
   
           padding-bottom: 50px !important;
       }
   
       .fooder-bgs {
           margin-top: 20px;
       }
       @media only screen and (min-width: 993px)
       {
   .uneditable-input, input[type=color], input[type=date], input[type=datetime-local], input[type=datetime], input[type=email], input[type=month], input[type=number], input[type=password], input[type=search], input[type=tel], input[type=text], input[type=time], input[type=url], input[type=week] 
   {
       width: 100%;
       height: 32px;
   }
       }
       .col-sm-12.btn {
       width: 387px;
       float: right;
   }
   .modal-header {
           padding: 4px 10px;
           border-bottom: 1px solid #e5e5e5;
       }
       input.form-control.ng-pristine.ng-untouched.ng-valid.ng-not-empty {
       color: grey;
       font-size: 14px;
   }
   .custom-modal-title {
    line-height: 1 !important;
    height: 0px !important;
    padding: 7px;
    color: white;
}
.row.head {
    /* margin-left: -15px; */
    /* margin-right: -15px; */
    margin-top: 54px;
}
.autosearch-div input.autosearch-input.ng-pristine.ng-empty.ng-valid.ng-valid-required.ng-touched {
    box-shadow: none !important;
   width: 243px !important;
}

.col-xs-1, .col-sm-1, .col-md-1, .col-lg-1, .col-xs-2, .col-sm-2, .col-md-2, .col-lg-2, .col-xs-3, .col-sm-3, .col-md-3, .col-lg-3, .col-xs-4, .col-sm-4, .col-md-4, .col-lg-4, .col-xs-5, .col-sm-5, .col-md-5, .col-lg-5, .col-xs-6, .col-sm-6, .col-md-6, .col-lg-6, .col-xs-7, .col-sm-7, .col-md-7, .col-lg-7, .col-xs-8, .col-sm-8, .col-md-8, .col-lg-8, .col-xs-9, .col-sm-9, .col-md-9, .col-lg-9, .col-xs-10, .col-sm-10, .col-md-10, .col-lg-10, .col-xs-11, .col-sm-11, .col-md-11, .col-lg-11, .col-xs-12, .col-sm-12, .col-md-12, .col-lg-12 
{
    min-height: 0px !important;
}

   </style>
   <div class="modal-header custom-modal-header">
       <h4 class="modal-title custom-modal-title" translate="assetmanagement.helpdesk.raisetickets.lbl"></h4>
       <span class="pull-right">
            <button type="button" class="btn btn-xs btn-danger float-right" ng-click="cancelCallback()" aria-label="Close">
                <span aria-hidden="true">X</span>
            </button>
        </span>
   </div>
   <div class="col-sm-12 fullreg-profiles mgt4">
        <div class="col-sm-3 border-left-profile">
            <span>
                <em class="text-white">
                    <span translate="assetmanagement.assignment-form.date.lbl"></span>
                </em>
                <strong>&nbsp; {{item.CreatedAt | date : 'dd-MMM-yyyy'}} &nbsp; {{item.CreatedAt | date : 'HH:mm'}}</strong>
            </span>
        </div>
        <div class="col-sm-3 border-left-profile">
            <span>
                <em class="text-white">
                    <span translate="assetmanagement.assignment-list.ticket.lbl"></span>
                </em>
                <strong>&nbsp;
                    <label>{{item.TicketNumberIdentifier}}</strong>
            </span>
        </div>
        <div class="col-sm-6 border-left-profile">
            <span>
                <em class="text-white">
                    <span translate="assetmanagement.servicerequest.requestedby.lbl"></span>
                </em>
                <strong>&nbsp;
                    <label>{{item.requestedName}}</strong>
            </span>
        </div>
    </div>
   <div class="row head">
       <div class="col-sm-12">
           <form id="item_form" name="item_form" class="form-horizontal" role="form">
               <div class=" panel panel-body panel-default tablebox">
   <!--left-->
                    <div class="col-sm-6">
                     <div class="form-group col-sm-12">
                            <label class="col-sm-12 control-label0 filter-lbl" for="instselect"
                                translate="assetmanagement.assettransfer.institutename.lbl"></label>
                            <div class="col-sm-8">
                                <autosearch itemid="item.FacilityId" iteminfo="item.SelectedItem"
                                    name="'instselect'" rowdata="item" itemchange="OnFacilitySelected(item)"
                                    config="vm.facilitycontrolconfig" class="inputsearchlogo" isrequired="true"
                                    candisable="IsDisbled"></autosearch>
                            </div>
                        </div>
  <div class="form-group col-sm-12">
                         <label class="col-sm-12 control-label0 filter-lbl" for="phoneno"
                             translate="assetmanagement.helpdesk.phoneno.lbl"></label>
                         <div class="col-sm-8">
                             <input type="text" class="form-control" name="phoneno" MINLENGTH="10"
                                 MAXLENGTH="10" size="10" ng-model="item.PhoneNo" placeholder=""
                                 onChange="numberonly($event)" onKeyUp="numberonly($event)"
                                 ng-keypress="numberonly($event)" required ng-disabled="IsDisbled">
                         </div>
                     </div>
                     <div class="form-group col-sm-12">
                         <label class="col-sm-12 control-label0 filter-lbl"
                             translate="assetmanagement.assets.filter_assetcetegory.lbl"></label>
                         <div class="col-sm-8">
                             <ui-select ng-model="item.CategoryId" name="servicetype"
                                 ng-disabled="IsDisbled">
                                 <ui-select-match>
                                     {{$select.selected.Text | limitTo : 20 : 0}}
                                     <span ng-if="$select.selected.Text.length>20">...</span>
                                 </ui-select-match>
                                 <ui-select-choices
                                     repeat="lookupitem.Id as lookupitem in lookup.TicketCategory | filter: { Text: $select.search }">
                                     <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                 </ui-select-choices>
                             </ui-select>
                         </div>
                        </div>
  <div class="form-group col-sm-12">
                             <label class="col-sm-12 control-label0 filter-lbl"
                                 translate="assetmanagement.servicerequest.servicetype.lbl"></label>
                             <div class="col-sm-8">
                                 <ui-select ng-model="item.ServiceTypeId" name="servicetype"
                                     ng-change="wardLookUp()" ng-disabled="IsDisbled">
                                     <ui-select-match>
                                         {{$select.selected.Text | limitTo : 20 : 0}}
                                         <span ng-if="$select.selected.Text.length>20">...</span>
                                     </ui-select-match>
                                     <ui-select-choices
                                         repeat="lookupitem.Id as lookupitem in lookup.AssetServiceType | filter: { Text: $select.search }">
                                         <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                     </ui-select-choices>
                                 </ui-select>
                             </div>
                         </div>
                    
                     <div class="form-group col-sm-12">
                         <label class="col-sm-12 control-label0 filter-lbl" for="subject"
                             translate="assetmanagement.helpdesk.subject.lbl"></label>
                         <div class="col-sm-8">
                             <input type="text" class="form-control" name="subject" ng-model="item.Subject"
                                 placeholder="" required ng-disabled="IsDisbled">
                         </div>
                     </div>
                     <div class="form-group col-sm-12">
                         <label class="col-sm-12 control-label0 filter-lbl" for="details">Details
                             <span style="color:red">*</span>
                         </label>
                         <div class="col-sm-8">
                             <textarea rows="3" name="otherinformation" name="'details'"
                                 ng-model="item.SubjectDetail" maxlength="4000" style="width:100%;"
                                 placeholder="Write Detailed Description Here" ng-disabled="IsDisbled"
                                 required></textarea>
                            </div>
                        </div>
                    </div>
             <!--right-->
   
             <div class="col-sm-6">
                     <div class="form-group col-sm-12">
                             <label class="col-sm-12 control-label0 filter-lbl"
                                 translate="assetmanagement.servicerequest.priority.lbl" for="priority"></label>
                             <div class="col-sm-8">
                                 <ui-select ng-model="item.PriorityId" name="priority" ng-disabled="IsDisbled"
                                     required>
                                     <ui-select-match>
                                         {{$select.selected.Text | limitTo : 20 : 0}}
                                         <span ng-if="$select.selected.Text.length>20">...</span>
                                     </ui-select-match>
                                     <ui-select-choices
                                         repeat="lookupitem.Id as lookupitem in lookup.PRIORITY | filter: { Text: $select.search }">
                                         <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                     </ui-select-choices>
                                 </ui-select>
                             </div>
                         </div>
                         <div class="form-group col-sm-12">
                                 <label class="col-sm-12 control-label0 filter-lbl"
                                     translate="assetmanagement.assettransfer.assetname.lbl"></label>
                                 <div class="col-sm-7">
                                     <autosearch itemid="item.AssetId" iteminfo="item.selecteditem" rowdata=""
                                         config="vm.assetcontrolconfig" itemchange="getAsset()" placeholder="'Asset'"
                                         candisable="IsDisbled"></autosearch>
                                 </div>
                                 <div class="col-sm-1" ng-if="item.AssetId>0">
                                     <a ng-click="assetdetails(item.AssetId)"
                                         uib-tooltip="{{ 'Asset Details' | translate }}" tooltip-placement="bottom">
                                         <i class="icon-info-sign" aria-hidden="true"></i>
                                     </a>
                                 </div>
  </div>
                             <div class="form-group col-sm-12">
                                     <label class="col-sm-12 control-label0 filter-lbl"
                                         translate="assetmanagement.servicerequest.expecteddate.lbl" for="date"></label>
                                     <div class="col-sm-8">
                                         <input type="text" id="dispexpDate" class="form-control" name="dddate"
                                             ng-date-object datepicker-options="datePickerOptions"
                                             show-button-bar="{{datePickerOptions.showButtonBar}}"
                                             uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                             placeholder="{{datePickerOptions.placeholder}}"
                                             ng-click="activetoPopup = { opened: true }" is-open="activetoPopup.opened"
                                             ng-model="item.ExpectedDate" ng-disabled="IsDisbled"
                                             ng-change="SetDispExpDate(item)">
                                     </div>
                                 </div>
                                 <div class="form-group col-sm-12" ng-if="item.OnBehalfofUser==false">
                                         <label class="col-sm-12 control-label0 filter-lbl" for="reportby"
                                             translate="assetmanagement.helpdesk.reportby.lbl"></label>
                                         <div class="col-sm-8">
                                             <autosearch itemid="item.ReportedById" iteminfo="" name="username" rowdata=""
                                                 config="vm.usercontrolconfig" candisable="true">
                                             </autosearch>
                                         </div>
        </div>
                                     <div class="form-group col-sm-12">
                                             <label class="col-sm-12 control-label0 filter-lbl"
                                                 translate="assetmanagement.servicerequest.otherinformation.lbl"></label>
                                             <div class="col-sm-8">
                                                 <textarea rows="3" name="otherinformation" ng-model="item.OtherInformation"
                                                     maxlength="4000" style="width:100%;" class="notes-textarea"
                                                     ng-disabled="IsDisbled"></textarea>
                                             </div>
                                         </div>
                                         <div class="form-group col-sm-12" ng-if="currentcontext.id==0">
                                                 <label class="col-sm-12 control-label0 filter-lbl" for="file"
                                                     translate="assetmanagement.servicerequest.attachments.lbl"></label>
                                                 <div class="col-sm-8">
                                                     <input type="file" ngf-select ng-model="currentcontext.file" name="file"
                                                         ngf-max-size="200MB" ngf-change="fileSelected()" />
                                                 </div>
                                             </div>
                                             <div class="form-group col-sm-12" ng-if="currentcontext.id>0&&item.FilePath!=null">
                                                 <label class="col-sm-12 control-label0 filter-lbl" for="file"
                                                     translate="assetmanagement.servicerequest.attachments.lbl"></label>
                                                 <div class="col-sm-8">
                                                     {{item.Name}}
                                                     <a ng-click="download(item)">
                                                         <i>View</i>
                                                     </a>
                                                 </div>
                                             </div>
                                             <div class="form-group col-sm-12" ng-if="currentcontext.id>0&&item.FilePath==null">
                                                 <label class="col-sm-12 control-label0 filter-lbl" for="file"
                                                     translate="assetmanagement.servicerequest.attachments.lbl"></label>
                                                 <div class="col-sm-8">
                                                     No File Attached
                                                 </div>
                                             </div>
             </div>
                    
                    <div class="footer-bg">

                            <div class="pull-right btn">
                                <button type="button" class="btn dem-color4 text-white btn-sm"
                                    translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                                <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()"
                                    translate="common.clearaction.lbl"></button>
                                <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()"
                                    translate="common.cancelaction.lbl"></button>
                            </div>
            
                        </div>
               </div>
                     
                       
           </form>
       </div>
       </div>
