<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="assetmanagement.assets.escalationmanagement.lbl"></h4>
    <div class="col-sm-6">
        <!-- <button class="btn bt-color3 btn-xs pull-right btn-filter" ng-click="" uib-tooltip="{{'clinicalmaster.serviceitem-list.filter-tooltip.lbl' | translate }}" tooltip-placement="bottom"><i class="fa fa-filter" aria-hidden="true"></i>&nbsp;&nbsp;<span translate="common.searchaction.lbl"></span></button> -->
        <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addNew()"
            uib-tooltip="{{ 'assetmanagement.assets.addnew-tooltip.lbl' | translate }}" tooltip-placement="bottom">
            <i class="fa fa-plus" aria-hidden="true"></i>
            <span translate="common.addaction.lbl"></span>
        </button>
        <span ng-click="Asset_dashboard()" class="text-right" style="float:right;">
            <em class="fa fa-home fa-lg dashboardicon"></em>
        </span>
    </div>
</div>
<div class="tablebox">
    <div id="doublepage-editor">
        <!--<div class="col-sm-12" set-grid-height reduce-height="-50">!-->
        <table class="table table-hover table-responsive table-bordered">
            <thead class="bg-subhead">
                <tr>
                    <th class="">
                        <span translate="assetmanagement.assets.level.lbl"></span>
                    </th>
                    <th class="col-sm-1">
                        <span translate="assetmanagement.assets.offset.lbl"></span>
                    </th>
                    <th class="col-sm-2">
                        <span translate="assetmanagement.assets.unit.lbl"></span>
                    </th>
                    <th class="col-sm-2">
                        <span translate="assetmanagement.assets.anchor.lbl"></span>
                    </th>
                    <th class="col-sm-2">
                        <span translate="assetmanagement.assets.status.lbl"></span>
                    </th>
                    <th class="col-sm-2">
                        <span translate="assetmanagement.assets.notificationtype.lbl"></span>
                    </th>
                    <th class="col-sm-2">
                        <span translate="assetmanagement.assets.sendnotificationto.lbl"></span>
                    </th>
                    <th class="">
                        <span translate="common.actions_col.lbl"></span>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="item in vm.items | filter:{Status:1}">
                    <td class="text-right">
                        <span> {{ item.Level }}</span>
                    </td>
                    <td>
                        <input type="text" class="form-control" ng-model="item.OffSet" placeholder="">
                    </td>
                    <td>
                        <ui-select ng-model="item.UnitId" class="ui-select-grid">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.EscalationMatrixUnit | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </td>
                    <td>
                        <ui-select ng-model="item.AnchorId" class="ui-select-grid">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.EscalationMatrixAnchor | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </td>
                    <td>
                        <ui-select ng-model="item.HelpdeskStatusId" class="ui-select-grid">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.AssetTicketStatus | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </td>
                    <td>
                        <radiogroupcontrol itemid="item.NotificationTypeId" tabindex="-1"
                            items="lookup.EscalationMatrixNotificationType"></radiogroupcontrol>
                    </td>
                    <td>
                        <autosearch itemid="item.NotificationToId" iteminfo="" rowdata="" config="vm.usercontrolconfig"
                            itemchange=""></autosearch>
                    </td>
                    <td align="center">
                        <button class="drhms-edit-button" ng-click="deleteItem($index,item)" uib-tooltip="Delete"
                            tooltip-placement="bottom">
                            <img src="assets/svg/delete.svg" alt="">
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="container-fluid">
    <div class="site-footer panel-footer">
        <div class="footer-right">
            <button type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="saveItem()"></button>
            <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()"
                translate="common.clearaction.lbl"></button>
        </div>
    </div>
</div>
