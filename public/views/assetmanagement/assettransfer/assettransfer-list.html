<style>
    .nameinfo {
        font-size: 13px;
        font-weight: 700;
        color: #337ab7;
    }

    .nameinfo.mrninfo {
        color: black
    }

    .contactinfo {
        font-size: 10px;
        color: #808080
    }

    }

        width: 100%;

    }

        margin-left: 10px;
        margin-right: 10px;
        height: 488px !important;
    }

    .linkstyle {
        font-weight: 700;

    }

        font-size: 13px;
    }

        margin-bottom: 7px !important;

        height: 50px;

        background-color: #d6e2e8 !important;

    label {
        height: 40px !important;
        padding: 7px 0px !important;
    }

    .col-sm-5 {
        padding-left: 5px !important;
    }

    .input-group-addon {
        background: none !important;
        border: none !important;
    }

    table#bannerdetails {
        WIDTH: 98%;
        margin-left: 7px;
    }

    .search i {
        top: 4px;
    }

    .filters {
        margin-right: -8px;
    }
</style>

<table id="bannerdetails">
    <tr>
        <td translate="assetmanagement.assets.filter_installeddepartment.lbl"></td>
        <td>
            <ui-select ng-model="currentfilter.FromDepartmentId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 25 : 0}}
                    <span ng-if="$select.selected.Text.length>25">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </td>
        <td translate="assetmanagement.assets.filter_status.lbl"></td>
        <td>
            <ui-select ng-model="currentfilter.AssetTransferStatusId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 25 : 0}}
                    <span ng-if="$select.selected.Text.length>25">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.AssetTransferStatus | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </td>
    </tr>
</table>
