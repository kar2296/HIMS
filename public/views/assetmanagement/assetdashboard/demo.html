<div class="panel-body form-panel">
    <h4 class="col-sm-12 header">Company</h4>
    <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
        <autosearch itemid="item.FacilityId" iteminfo="item.SelectedItem" config="vm.facilityitemcontrolconfig"
            itemchange="FacilityItemChanged($index, pharmacyitem)" controlid="pharmacyitem.itemidxdesc"
            ng-keyup="moveFocus('dept','facility')" tabindex="1" placeholder="'CompanyName'"></autosearch>
    </div>
    <div class="col-sm-12 footer">
        <button type="button" id="btnCancel" tabindex="-1" class="btn btn-danger text-white"
            ng-click="cancelCallback()">Cancel</button>
        <button type="button" id="btnsubmit" class="draftbutton" translate="Submit"
            ng-click="saveAndApprove()"></button>
        <!-- <button type="button" id="btnSaveApprove" tabindex="-1" class="btn btn-submit text-white"
            ng-click="saveAndApprove()">Submit</button> -->
    </div>
</div>
