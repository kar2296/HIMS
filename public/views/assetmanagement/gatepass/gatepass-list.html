<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="assetmanagement.asset.gatepass.lbl"></h4>
    <div class="col-sm-6">
        <div class="filters">
            <div class="search">
                <autosearch itemid="currentfilter.AssetId" iteminfo="item.selecteditem" rowdata="" config="vm.assettransfercontrolconfig" itemchange="getList()"></autosearch>

            </div>
        <button class="btn-add" ng-click="addNew()" uib-tooltip="{{ 'assetmanagement.asset.gatepass.lbl' | translate }}"
            tooltip-placement="bottom">
            <i class="fa fa-plus" aria-hidden="true"></i>
        </button>
        <!-- <span ng-click="Asset_dashboard()" class="text-right" style="float:right;">
            <img src="app/img/assetimgs/asset.png" class="img-responsive emr-patienticon" alt="home" uib-tooltip="Asset Dashboard" tooltip-placement="bottom">
        </span> -->        
        <button type="button" tabindex="-1" class="btn-add" ng-click="Asset_dashboard()" uib-tooltip="Dashboard" tooltip-placement="bottom">
            <i class="fa fa-home" aria-hidden="true"> </i>
        </button>
        <!-- <i class="fa fa-home" align="right" style="float: right;"  ng-click="Asset_dashboard()" 
            uib-tooltip="Dashboard" tooltip-placement="bottom" aria-hidden="true"></i> -->
    </div>
    </div> 
</div>
<table id="bannerdetails">
    <tr>
        <td translate="assetmanagement.asset.gatepassno.lbl"></td>
        <td> <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.GatePassNo" placeholder="Gate Pass No"></td>
        <td translate="assetmanagement.asset.type.lbl"></td>
        <td>  <ui-select ng-model="currentfilter.GatePassTypeId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 25 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.GatePassType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select></td>
        <td translate="assetmanagement.asset.status.lbl"></td>
        <td> <ui-select ng-model="currentfilter.GatePassStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 25 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.GatePassStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select></td>
    </tr>
</table>
<div class="tablebox">
<custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="container-fluid" id="usersheight">
    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
