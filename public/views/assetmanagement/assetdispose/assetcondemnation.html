<div class="row">
    <div class="col-sm-12">
        <div class="col-sm-5">
            <label class="col-sm-4 control-label filter-lbl"
                translate="assetmanagement.assets.assetcodename.lbl"></label>
            <div class="col-sm-8">
                <input type="text" class="form-control" name="filter_assetname" on-enter="getList()"
                    ng-model="currentfilter.AssetName">
            </div>
        </div>

        <div class="col-sm-5">
            <label class="col-sm-4 control-label filter-lbl"
                translate="assetmanagement.assets.filter_status.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.DisposeStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 25 : 0}}
                        <span ng-if="$select.selected.Text.length>25">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.DisposeStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </div>
</div>
<custom-table config="vm.gridConfig"></custom-table>
<div class="container-fluid" id="usersheight">
    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
                items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
