<style>
    .nameinfo {
        font-size: 13px;
        font-weight: 700;
        color: #337ab7;
    }

    .nameinfo.mrninfo {
        color: black
    }

    .contactinfo {
        font-size: 10px;
        color: #808080
    }

    .block {
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
    }

    #usersheight .ui-grid-viewport {
        width: 100%;
        height: 460px !important;
    }

    .table-uigrid {
        margin-left: 0px;
        margin-right: 0px;
        height: 488px !important;
    }

    .linkstyle {
        font-weight: 700;
        text-align: right;
    }

    .statusinfo {
        font-size: 13px;
    }

    .form-group {
        margin-bottom: 7px !important;
    }

    .sr-only {
        height: 22px !important;
    }

    .col-sm-5 {
        padding-left: 5px !important;
    }

    .grid1531371424717 .ui-grid-coluiGrid-00UD {
        min-width: 93px !important;
        max-width: 104px !important;
        width: 50px !important
    }

    .ui-grid:last-child {
        min-width: 93px !important;
        max-width: 104px !important;
    }

    .btn-success {
        color: #000000 !important;
        width: 105px;
    }

    /* button.btn.btn-disposereq.btn-sm.ng-scope {
        background-color: #24b145;
    } */
    .form-horizontal .form-group {
        margin-left: -15px;
        margin-right: -15px;
        margin: 0px !important;
    }
</style>

<div class="tablebox">
    <div class="row">
        <div class="col-sm-12">
            <div class="col-sm-5">
                <label class="col-sm-4 control-label filter-lbl"
                    translate="assetmanagement.assets.assetcodename.lbl"></label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" name="filter_assetname" on-enter="getList()"
                        ng-model="currentfilter.AssetId">
                </div>
            </div>

            <div class="col-sm-5">
                <label class="col-sm-4 control-label filter-lbl"
                    translate="assetmanagement.assets.filter_status.lbl"></label>
                <div class="col-sm-8">
                    <ui-select ng-model="currentfilter.DisposeStatusId" ng-change="getList()" class="filter-combo">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 25 : 0}}
                            <span ng-if="$select.selected.Text.length>25">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.DisposeStatus | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="col-sm-2 pull-right">
                <button type="submit" class="draftbutton" ng-click="DisposeRequest()"
                    translate="Direct Dispose"></button>
            </div>
        </div>
    </div>
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="container-fluid" id="usersheight">
    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
                items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
