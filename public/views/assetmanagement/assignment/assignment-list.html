<div class="row page-header">
            <h4 class="col-sm-6 mt0" translate="assetmanagement.assignment-list.pagetitle.lbl"></h4>
</div>



<div class="row filter-area">
    <div class="col-sm-12">
        <div class="col-sm-4">
            <label class="col-sm-4 control-label filter-lbl" translate="assetmanagement.assignment-list.filter-ticketno.lbl"></label>
            <div class="col-sm-8">
                <input type="text" class="form-control" name="filter_patient" on-enter="getList()" ng-model="currentfilter.TicketNumberIdentifier"
                    translate translate-attr-placeholder="assetmanagement.assignment-list.filter-order/bill.lbl">
            </div>
        </div>

        <div class="col-sm-4">
            <label class="col-sm-4 control-label filter-lbl" translate="assetmanagement.assignment-list.filter-assigntype.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.AssignTypeId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.AssignType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-4 control-label filter-lbl" translate="assetmanagement.assignment-list.filter-status.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.AssetTicketStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.AssetTicketStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>

    <div class="col-sm-4">
        <label class="col-sm-4 control-label filter-lbl" translate="assetmanagement.assignment-list.department.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.FromDepartmentId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 8 : 0}}
                    <span ng-if="$select.selected.Text.length>8">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>

</div>
<div class="col-sm-4">
    <label class="col-sm-4 control-label filter-lbl" translate="assetmanagement.assignment-list.date.lbl"></label>
    <div class="col-md-8">
        <input type="text" class="form-control" name="filter_fromdate" ng-change="getList()" ng-date-object datepicker-options="datePickerOptions"
            show-button-bar="{{datePickerOptions.showButtonBar}}" uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
            ng-click="filter_fromdatePopup = { opened: true }" is-open="filter_fromdatePopup.opened" ng-model="currentfilter.ExpectedDate">
    </div>
</div>

<div class="col-sm-4">
    <label class="col-sm-4 control-label filter-lbl" translate="assetmanagement.assignment-list.priority.lbl"></label>
    <div class="col-sm-8">
        <ui-select ng-model="currentfilter.PriorityId" ng-change="getList()" class="filter-combo">
            <ui-select-match>
                {{$select.selected.Text | limitTo : 8 : 0}}
                <span ng-if="$select.selected.Text.length>8">...</span>
            </ui-select-match>
            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Priority | filter: { Text: $select.search }">
                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
            </ui-select-choices>
        </ui-select>
    </div>
</div>

</div>
</div>

<custom-table config="vm.gridConfig"></custom-table>
<div class="container-fluid onerow-filter">
    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
