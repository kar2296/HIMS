                            <div class="col-sm-10">

                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6" style="width: 41%">

                            <div class="form-group col-sm-12">

                                    <span class="fontbold">Nirmal</span>
                                </div>
                            </div>

                            <div class="form-group col-sm-12">
                                <label class="col-sm-7 control-label0" translate="dashboard.staff.lbl"></label>

                            </div>
                            <div class="form-group col-sm-12">
                                <label class="col-sm-7 control-label0" for="description"
                                    translate="dashboard.phno.lbl"></label>
                                <div class="col-sm-5">
                                    <span class="fontbold">+91 9839356726</span>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6" style="width: 45%">
                            <div class="form-group col-sm-12">
                                <label class="col-sm-7 control-label0" translate="dashboard.remark.lbl"></label>
                                <div class="col-sm-5">
                                    <input type="text" class="form-control" name="displayorder" style="width: 290px;"
                                        ng-model="item.DisplayOrder" placeholder="">
                                </div>
                            </div>
                            <div class="form-group col-sm-12">
                                <label class="col-sm-7 control-label0" style="position: relative; top: 15px;"
                                    translate="dashboard.voice.lbl"></label>
                                <div class="col-sm-5">
                                    <audio controls>
                                        <!-- <source src="horse.ogg" type="audio/ogg"> -->
                                        <source src="app/audio/contents.mp3" type="audio/mpeg">
                                    </audio>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script>
        // Add active class to the current button (highlight it)
        var header = document.getElementById("myDIV");
        var btns = header.getElementsByClassName("btn");
        for (var i = 0; i < btns.length; i++) {
            btns[i].addEventListener("click", function () {
                var current = document.getElementsByClassName("active");
                current[0].className = current[0].className.replace(" active", "");
                this.className += " active";
            });
        }
    </script>
    <style>
        /* Style the buttons */
        button.radio.btn {
            border: none;
            outline: none;
            padding: 2px 20px;
            background-color: #1b6da0;
            cursor: pointer;
            font-size: 16px;
            color: white !important;
        }

        .form-group label {
            color: #756c6c;
        }

        .fontbold {
            color: black;
            font-weight: 700;
            font-size: 14px;
        }

        .form-group.col-sm-12 {
            margin-bottom: 21px !important;
        }

        /* Style the active class, and buttons on mouse-over */
        .active,
        button.radio.btn:hover {
            background-color: #666;
            color: white;
        }

        button.radio.btn.ng-scope.active {
            background: #656060ad;
        }
    </style>
