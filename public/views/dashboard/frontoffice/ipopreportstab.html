<style>
    .nav-tabs>li>a {
        padding: 7px 13px !important;
    }
</style>
<div class="row page-header" id="assets">
    <h3 class="col-sm-6 mt0 active" translate="reports.pagetitle4.lbl"></h3>
    <div class="col-sm-6">
        <button type="button" tabindex="-1" class="btn-add" ng-click="backtoList()" uib-tooltip="Dashboard" tooltip-placement="bottom">
            <i class="fa fa-home" aria-hidden="true"> </i>
        </button>
    </div>
</div>
<div class="row tablebox" id="tablebox">
    <div class="col-sm-12">
        <uib-tabset active="active" id="assettabs">
            <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)"
                disable="tab.canDisable">
            </uib-tab>
        </uib-tabset>
        <div ui-view class="tabview"></div>
    </div>
</div>
