<div class="page-header">
    <div class="col-sm-12">
        <h4 translate="appointment.doctordashboard.inventorydashboard.lbl"></h4>
    </div>
</div>
<div class="col-sm-12" style="margin-top: 20px;">
    <div class="card-flex-box-appointment">
        <div class="card-box-item box-bg-color1" ng-click="producttype()" ng-if="HasAccess('InventoryMastersDashboard', 'ProductType')">
            <div class="card-box-header">
                <i class="fa fa-product-hunt" aria-hidden="true"></i>
                <div translate="appointment.doctordashboard.producttype.lbl"></div>
            </div>
            <div>{{Items.registraion}}</div>
        </div>
        <div class="card-box-item box-bg-color2" ng-click="unitofmeasurement()" ng-if="HasAccess('InventoryMastersDashboard', 'UnitofMeasurements')">
            <div class="card-box-header">
                <i class="fa fa-percent" aria-hidden="true"></i>
                <div translate="appointment.doctordashboard.unitofmeasurement.lbl"></div>
            </div>
            <div>{{Items.appoinmentCount}}</div>
        </div>
        <div class="card-box-item box-bg-color3" ng-click="taxmaster()" ng-if="HasAccess('InventoryMastersDashboard', 'TaxMasters')">
            <div class="card-box-header">
                <i class="fa fa-list" aria-hidden="true"></i>
                <div translate="appointment.doctordashboard.taxmaster.lbl"></div>
            </div>
            <div>{{Items.opbillings}}</div>
        </div>
        <div class="card-box-item box-bg-color4" ng-click="store()" ng-if="HasAccess('InventoryMastersDashboard', 'Stores')">
            <div class="card-box-header">
                <i class="fa fa-file-text-o" aria-hidden="true"></i>
                <div translate="appointment.doctordashboard.store.lbl"></div>
            </div>
            <div>{{Items.directbilling}}</div>
        </div>
        <div class="card-box-item box-bg-color5" ng-click="itemmaster()" ng-if="HasAccess('InventoryMastersDashboard', 'InventoryItems')">
            <div class="card-box-header">
                <i class="fa fa-scribd" aria-hidden="true"></i>
                <div translate="appointment.doctordashboard.itemmaster.lbl"></div>
            </div>
            <div>{{Items.labbilling}}</div>
        </div>
        <div class="card-box-item box-bg-color6" ng-click="suppliers()" ng-if="HasAccess('InventoryMastersDashboard', 'Suplliers')">
            <div class="card-box-header">
                <i class="fa fa-money" aria-hidden="true"></i>
                <div translate="appointment.doctordashboard.suppliers.lbl"></div>
            </div>
            <div>{{Items.admissions}}</div>
        </div>
        <div class="card-box-item box-bg-color9" ng-click="generic()">
            <div class="card-box-header">
                <i class="fa fa-bars" aria-hidden="true"></i>
                <div translate="Generic Master"></div>
            </div>
            <div>{{Items.reports}}</div>
        </div>
        <div class="card-box-item box-bg-color3" ng-click="category()">
            <div class="card-box-header">
                <i class="fa fa-bars" aria-hidden="true"></i>
                <div translate="Category"></div>
            </div>
            <div>{{Items.reports}}</div>
        </div>
        <div class="card-box-item box-bg-color4" ng-click="subcategory()">
            <div class="card-box-header">
                <i class="fa fa-bars" aria-hidden="true"></i>
                <div translate="Sub Category"></div>
            </div>
            <div>{{Items.reports}}</div>
        </div>

        <div class="card-box-item box-bg-color7" ng-click="itemsupplierprices()" ng-if="HasAccess('InventoryMastersDashboard', 'ItemSupplierPrices')">
            <div class="card-box-header">
                <i class="fa fa-registered" aria-hidden="true"></i>
                <div translate="appointment.doctordashboard.itemsupplierprices.lbl"></div>
            </div>
            <div>{{Items.bedtransfer}}</div>
        </div>
        <div class="card-box-item box-bg-color8" ng-click="rack()" ng-if="HasAccess('InventoryMastersDashboard', 'Rack/Self/Tray')">
            <div class="card-box-header">
                <i class="fa fa-briefcase" aria-hidden="true"></i>
                <div translate="appointment.doctordashboard.rack.lbl"></div>
            </div>
            <div>{{Items.ippatient}}</div>
        </div>
        <div class="card-box-item box-bg-color9" ng-click="reordersetup()" ng-if="HasAccess('InventoryMastersDashboard', 'ReorderSetup')">
            <div class="card-box-header">
                <i class="fa fa-bars" aria-hidden="true"></i>
                <div translate="appointment.doctordashboard.reordersetup.lbl"></div>
            </div>
            <div>{{Items.reports}}</div>
        </div>

    </div>
</div>
