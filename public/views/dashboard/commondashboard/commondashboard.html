<div class="row page-header">
    <h4 translate="appointment.doctordashboard.commondashboard.lbl"></h4>
</div>

    <div class="card-flex-box-doctor">

            <div class="card-box-header"><i class="fa fa-registered" aria-hidden="true"></i>
                <div translate="appointment.doctordashboard.generalremarks.lbl"></div>
            </div>
            <div>{{Items.registration}}</div>
        </div>
        <div class="card-box-item box-bg-color2" ng-click="cities()"

                <div translate="appointment.doctordashboard.cities.lbl"></div>
            </div>
            <div>{{Items.opbilling}}</div>
        </div>
        <div class="card-box-item box-bg-color3" ng-click="states()"

                <div translate="appointment.doctordashboard.states.lbl"></div>
            </div>
            <div>{{Items.directbilling}}</div>
        </div>
        <div class="card-box-item box-bg-color4" ng-click="postcodes()"
            ng-if="HasAccess('CommonMastersDashboard', 'PostCodes')">
            <div class="card-box-header">
                <div> <i class="fa fa-usd" aria-hidden="true"></i></div>
                <div translate="appointment.doctordashboard.postcodes.lbl"></div>
            </div>
            <div>{{Items.labbilling}}</div>
        </div>
        <div class="card-box-item box-bg-color5" ng-click="managereferrals()"

                <div><i class="fa fa-money" aria-hidden="true"></i></div>
                <div translate="appointment.doctordashboard.managereferrals.lbl"></div>
            </div>
            <div>{{Items.ipbilling}}</div>

                <div><i class="fa fa-briefcase" aria-hidden="true"></i></div>
                <div translate="appointment.doctordashboard.occupations.lbl"></div>
            </div>
            <div>{{Items.dischargesipbilling}}</div>

        <div class="card-box-item box-bg-color1" ng-click="locationmaster()">
