<style>
    .modal-content .panel-body {
        overflow: inherit;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-12 ">

        <h3 class="panel-title" translate="cssd.cssdpacking.pagetitle.lbl"></h3>
    </div>

</div>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div>
                <div class="">
                    <div class="panel-body form-panel">

                        <div class="col-sm-12  ">

                            <!-- leftpanel -->
                            <div class="col-sm-8">
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for ="packingtype" translate="cssd.cssdpacking.packingtype.lbl"></label>
                                    <div class="col-sm-8">
                                        <ui-select ng-model="item.PackedTypeId" name ="packingtype" required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.PackingType | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="instructions" translate="cssd.cssdpacking.instructions.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="instructions" ng-model="item.PackedInstruction" placeholder="" required>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for ="packingmachine" translate="cssd.cssdpacking.packingmachine.lbl"></label>
                                    <div class="col-sm-8">
                                        <ui-select ng-model="item.TrayId" name ="packingmachine" required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Tray | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for ="packedby" translate="cssd.cssdpacking.packedby.lbl"></label>
                                    <div class="col-sm-8">
                                        <ui-select ng-model="item.PackedById" name ="packedby" required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.User | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" translate="cssd.cssdpacking.date.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="activeto" ng-date-object datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                                            ng-click="activetoPopup = { opened: true }" is-open="activetoPopup.opened" ng-model="item.PackedAt">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="panel-footer formactionbar">
                <div class="pull-right">
                    <button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>

                    <button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                    <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
