<style>
    .modal-content .panel-body {
        overflow: inherit;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-12 ">

        <h3 class="panel-title" translate="cssd.cssdsterile.pagetitle.lbl"></h3>
    </div>

</div>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div>
                <div class="">
                    <div class="panel-body form-panel">

                        <div class="col-sm-12  ">

                            <!-- leftpanel -->
                            <div class="col-sm-8">
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for ="type" translate="cssd.cssdsterile.type.lbl"></label>
                                    <div class="col-sm-8">
                                        <radiogroupcontrol itemid="item.TempTypeId" name ="type" items="lookup.TempType" required></radiogroupcontrol>

                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for="temperaturemethod" translate="cssd.cssdsterile.temperaturemethod.lbl"></label>
                                    <div class="col-sm-8">
                                        <a href="">High</a>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div class="col-sm-4">
                                    </div>
                                    <div class="col-sm-8">
                                        <radiogroupcontrol itemid="item.HighTempMethodTypeId" name ="temperaturemethod" items="lookup.HighTemperature" required></radiogroupcontrol>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div class="col-sm-4">
                                    </div>
                                    <div class="col-sm-8">
                                        <a href="">Low</a>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div class="col-sm-4">
                                    </div>
                                    <div class="col-sm-8">
                                        <radiogroupcontrol itemid="item.LowTempMethodTypeId" name ="temperaturemethod" items="lookup.LowTemperature" required></radiogroupcontrol>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for ="temperature" translate="cssd.cssdsterile.temperature.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="temperature" ng-model="item.Temperature" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for ="comments" translate="cssd.cssdsterile.comments.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control"   name ="comments" ng-model="item.Comments">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" translate="cssd.cssdsterile.starttime.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="activeto" ng-date-object datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                                            ng-click="activePopup = { opened: true }" is-open="activePopup.opened" ng-model="item.StartedAt">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" translate="cssd.cssdsterile.endtime.lbl"></label>
                                    <div class="col-sm-8">
                                        <input type="text" class="form-control" name="activeto" ng-date-object datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                                            ng-click="activetoPopup = { opened: true }" is-open="activetoPopup.opened" ng-model="item.EndedAt">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-4 control-label" for ="Sterisedby" translate="cssd.cssdsterile.Sterisedby.lbl"></label>
                                    <div class="col-sm-8">
                                        <ui-select ng-model="item.SterilledById" name ="Sterisedby" required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.User | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>


                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="panel-footer formactionbar">
                <div class="pull-right">
                    <button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>

                    <button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                    <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
