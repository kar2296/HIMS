<link rel="stylesheet" href="app/css/drhms.css">
<div class="row page-header">
    <h4 class="mt0 col-sm-9" translate="lis.lisinterface.pagetitle.lbl"></h4>
    <div class="col-sm-3">
        <div class="filters">
            <div class="search">
                <input type="text" id="pid" class="form-control" on-enter="getList()" ng-model="currentfilter.PatientName"
                    translate translate-attr-placeholder="Name">
                    <div class="drhms-search-icon">
                        <i class="fas fa-search" style="left: 9px;" aria-hidden="true"></i>
                    </div>
                </div>
        </div>
    </div>
</div>
<div class="row">
    <div class="drhms-table-top-header">
        <div class="drhms-table-head-border">
            <div class="col-sm-12">
                <label class="col-sm-4" translate="lis.analyzer.equipmentname.lbl"></label>
                <div class="col-sm-8">
                    <ui-select ng-model="currentfilter.AssetId" ng-change="getList()">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.AssetName  | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="col-sm-12">
                <label class="col-sm-4" name="filter_fromdate"
                    translate="ordermanagement.orderassignment-list.filter_fromdate.lbl"></label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" name="filter_fromdate" ng-change="getList()" ng-date-object
                        datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}"
                        ng-click="filter_fromdatePopup = { opened: true }" is-open="filter_fromdatePopup.opened"
                        ng-model="currentfilter.
                        FromDate">
                </div>
            </div>
            <div class="col-sm-12">
                <label class="col-sm-4" name="filter_todate"
                    translate="To Date"></label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" name="filter_todate" ng-change="getList()" ng-date-object
                        datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}"
                        ng-click="filter_todatePopup = { opened: true }" is-open="filter_todatePopup.opened"
                        ng-model="currentfilter.ToDate">
                </div>
            </div>
            <div class="col-sm-12">
                <label class="col-sm-4" translate="ordermanagement.orderassignment-list.sampleid.lbl"></label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" name="filter_patient" on-enter="getList()"
                        ng-model="currentfilter.Sampleid">
                </div>
            </div>
        </div>
        <div class="drhms-table-head-border">
            <div class="col-sm-12">
                <label class="col-sm-4" translate="lis.lisinterface.visitidentifier.lbl"></label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" name="filter_patient" on-enter="getList()"
                        ng-model="currentfilter.VisitIdentifier">
                </div>
            </div>
            <div class="col-sm-12">
                <label class="col-sm-4" translate="lis.lisinterface.patientmrn.lbl"></label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" name="filter_patient" on-enter="getList()"
                        ng-model="currentfilter.MRNNo">
                </div>
            </div>
            <div class="col-sm-12">
                <label class="col-sm-4" translate="appointment.appointment-form.visittype.lbl"></label>
                <div class="col-sm-8">
                    <ui-select ng-model="currentfilter.EncounterTypeId" ng-change="getList()" class="filter-combo">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 8 : 0}}
                            <span ng-if="$select.selected.Text.length>8">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.EncounterType | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
        </div>
        <div class="drhms-table-head-border">
            <div class="col-sm-12">
                <label class="col-sm-4" for="testtype" translate="lis.analyzer.status.lbl"></label>
                <div class="col-sm-8">
                    <ui-select ng-model="currentfilter.StatusId" ng-change="getList()">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.Status  | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="col-sm-12">
                <label class="col-sm-4" for="testtype" translate="lis.analyzer.patientinfo.lbl"></label>
                <div class="col-sm-8">
                    <input type="checkbox" ng-model="currentfilter.withpatientid" ng-click="WithPatientInfo()" />
                </div>
            </div>
            <div class="col-sm-12">
                <label class="col-sm-4" for="testtype" translate="Facility"></label>
                <div class="col-sm-8">
                    <ui-select ng-model="currentfilter.FacilityId" ng-change="getList()" ng-disabled="true">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.Facility  | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
