<h4 class="page-header mt0" translate="lis.ticksheetmasters.pagetitle.lbl"></h4>

 
  <div class="row filter-area">
        <div class="col-sm-12"> 
                 
                
               <div class="col-sm-4">
                    <label class="col-sm-5 control-label filter-lbl" translate="lis.ticksheetmasters.searchtitle.lbl"></label>
                    <div class="col-sm-7">
                        <input type="text" class="form-control" autofocus on-enter="getList()" ng-model="currentfilter.codemnemonicsnamedesc" translate translate-attr-placeholder="lis.ticksheetmasters.searchtitle.lbl">
                    </div>                    
                </div>  
                 <div class="col-sm-2">
                    <label class="col-sm-6 control-label filter-lbl" translate="lis.ticksheetmasters.status.lbl"></label> 
                    <div class="col-sm-6"> 
                      <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 8 : 0}}
                                <span ng-if="$select.selected.Text.length>8">...</span>
                            </ui-select-match>
                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select> 
                    </div>                    
                </div>
                <div class="col-sm-2"></div>

                <div class="col-sm-2">
                    <button class="btn btn-default btn-sm pull-right" ng-click="addNew()" uib-tooltip="Add New Container Type" tooltip-placement="left">
                        <i class="fa fa-plus" aria-hidden="true"></i>
                    </button>
                    <!--
                    <button class="btn btn-default btn-sm pull-right btn-filter">
                        <i class="fa fa-filter" aria-hidden="true"></i>
                    </button>
                    -->
                </div> 
        </div>
</div>

<div class="container-fluid">    
    <div ui-grid="vm.gridConfig" class="table-uigrid"></div>
     <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
        ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
</div>
