<!-- <link href="app/css/regbilling.css" rel="stylesheet"> -->
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="lis.externalprovidermaster.pnlform.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="backToList()">
        </div>
    </div>
</div>

<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="row">
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" for="testtype"
                        translate="lis.externalprovidermaster.testtype.lbl"></label>
                    <div class="col-sm-12">
                        <ui-select ng-model="item.TESTMASTERTYPId" name="testtype" required>
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 30 : 0}}
                                <span ng-if="$select.selected.Text.length>30">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.TESTMASTERTYP  | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" translate="lis.externalprovidermaster.testname.lbl"
                        for="testid"></label>
                    <div class="col-sm-12">
                        <autosearch itemid="item.TestId" iteminfo="item.selectedItem" rowdata="item" name="'testid'"
                            config="vm.testcontrolconfig" itemchange="getTest()" isrequired="true"></autosearch>
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" for="externalprovidersid"
                        translate="lis.externalprovidermaster.aliascode.lbl"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="code" ng-model="item.AliasCode" placeholder="">
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label"
                        translate="lis.externalprovidermaster.providername.lbl"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="name" ng-model="item.ProviderName" placeholder=""
                            disabled>
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" for="name"
                        translate="lis.externalprovidermaster.aliasname.lbl"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="name" ng-model="item.AliasName" placeholder="">
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" for="cost"
                        translate="lis.externalprovidermaster.price.lbl"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="cost" ng-model="item.Price" placeholder=""
                            required>
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label"
                        translate="lis.externalprovidermaster.resultrelease.lbl"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="dateacquired" ng-date-object
                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                            placeholder="{{datePickerOptions.placeholder}}"
                            ng-click="dateacquiredPopup = { opened: true }" is-open="dateacquiredPopup.opened"
                            ng-model="item. ResultReleaseDate">
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" for="ucp"
                        translate="lis.externalprovidermaster.comments.lbl"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="ucp" ng-model="item.Comments" placeholder="">
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" translate="lis.externalprovidermaster.othercost.lbl"></label>
                    <div class="col-sm-12">

                        <input type="text" class="form-control" name="cost" ng-model="item.OtherCost" placeholder="">
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label"
                        translate="lis.externalprovidermaster.attachmentreq.lbl"></label>
                    <div class="col-sm-12">
                        <input type="checkbox" name="isactive" class="custom-checkbox"
                            ng-model="item.IsAttachementRequired">
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label" translate="lis.externalprovidermaster.isactive.lbl"></label>
                    <div class="col-sm-12">
                        <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="">
        <div class="pull-right">
            <button type="button"   class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"
                ng-if="!item.isRequested"></button>

            <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                ng-click="saveAndApprove()"></button>
            <button id="btnClearForm" type="button" class="draftbutton" ng-click="clear()"
                translate="common.clearaction.lbl"></button>
        </div>
    </div>
</div>
