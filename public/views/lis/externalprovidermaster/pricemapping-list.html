<div class="row">
    <div class="drhms-list-filters">
        <div class="col-sm-4">
            <label class="col-sm-3" translate="lis.externalprovidermaster.type.lbl"></label>
            <div class="col-sm-9">
                <ui-select ng-model="currentfilter.TESTMASTERTYPId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 25 : 0}}
                        <span ng-if="$select.selected.Text.length>25">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.TESTMASTERTYP | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-3" translate="lis.externalprovidermaster.name.lbl"></label>
            <div class="col-sm-9">
                <div class="search">
                    <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.TestName"
                        translate translate-attr-placeholder="lis.externalprovidermaster.testname.lbl" placeholder="">
                    <i class="fas fa-search" aria-hidden="true"></i>
                </div>
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-3" translate="generalmaster.referral-list.filter_status.lbl"></label>
            <div class="col-sm-9">
                <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 25 : 0}}
                        <span ng-if="$select.selected.Text.length>25">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-1">
            <button class="btn-add" ng-click="addNew()" uib-tooltip="{{ 'Test Price Mapping' | translate}}"
                tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
                <!-- <span translate="clinicalmaster.serviceitem-list.addnew.lbl"></span> -->
            </button>
        </div>
    </div>
</div>

<div class="container-fluid">
    <div class="fooder-bgs">
        <div class="row">
            <custom-table config="vm.gridConfig"></custom-table>
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
                items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
        <div class="row">
            <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()"><i class="fa fa-angle-left"
                    aria-hidden="true"></i>&nbsp;&nbsp;<span class="btn-fontsize"
                    translate="common.backaction.lbl"></span></button>
        </div>
    </div>
</div>
