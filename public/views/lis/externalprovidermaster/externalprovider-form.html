<!-- <link href="app/css/regbilling.css" rel="stylesheet"> -->
<style>
    .form-horizontal .form-group {
        height: 62px;
    }
</style>
<div class="row">
    <div class="col-lg-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="row">
                <div class="form-group col-lg-4">
                    <label class="col-lg-12 control-label" for="testtype"
                        translate="lis.externalprovidermaster.testtype.lbl"></label>
                    <div class="col-lg-12">
                        <ui-select ng-model="item.TESTMASTERTYPId" name="testtype" autofocus required>
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.TESTMASTERTYP  | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>

                <div class="form-group col-lg-4">
                    <label class="col-lg-12 control-label" for="code"
                        translate="lis.externalprovidermaster.code.lbl"></label>
                    <div class="col-lg-12">
                        <input type="text" class="form-control" on-enter="getList()" ng-model="item.Code" name="code"
                            placeholder="" requireds>
                    </div>
                </div>


                <div class="form-group col-lg-4">
                    <label class="col-lg-12 control-label" for="name"
                        translate="lis.externalprovidermaster.externalprovider.lbl"></label>
                    <div class="col-lg-12">
                        <input type="text" class="form-control" name="name" ng-model="item.ProviderName" placeholder=""
                            required>
                    </div>
                </div>
                <div class="form-group col-lg-4">
                    <label class="col-lg-12 control-label" for="contactperson"
                        translate="lis.externalprovidermaster.contactperson.lbl"></label>
                    <div class="col-lg-12">
                        <input type="text" class="form-control" on-enter="getList()" ng-model="item.ContactPerson"
                            placeholder="">
                    </div>
                </div>
                <div class="form-group col-lg-4">
                    <label class="col-lg-12 control-label" for="mobile"
                        translate="lis.externalprovidermaster.mobilenumber.lbl"></label>
                    <div class="col-lg-12">
                        <input type="text" class="form-control" ng-model="item.MobileNumber" placeholder=""
                            ng-minlength="10" ng-pattern="/^\d+$/" ng-required="false">
                    </div>
                </div>
                <div class="form-group col-lg-4">
                    <label class="col-lg-12 control-label" for="phonenumber"
                        translate="lis.externalprovidermaster.phonenumber.lbl"></label>
                    <div class="col-lg-12">
                        <input type="text" class="form-control" ng-model="item.PhoneNumber" placeholder=""
                            ng-minlength="10" ng-pattern="/^\d+$/" ng-required="false">
                    </div>
                </div>
                <div class="form-group col-lg-4">
                    <label class="col-lg-12 control-label" for="address"
                        translate="appmanager.org.address2.lbl"></label>
                    <div class="col-lg-12">
                        <input type="text" id="Manualadd" class="form-control" name="address"
                            ng-model="item.AddressLine1" ng-disabled="item.candisable" placeholder="Address">
                    </div>
                </div>
                <div class="form-group col-lg-4">
                    <label class="col-lg-12 control-label" for="area" translate="appmanager.org.area.lbl"></label>
                    <div class="col-lg-12">
                        <input type="text" id="Manualadd" class="form-control" name="area" ng-model="item.Email"
                            ng-disabled="item.candisable" placeholder="">
                    </div>
                </div>
                <div class="form-group col-lg-4 ">
                    <label class="col-lg-12 control-label" for="city" translate="appmanager.org.city.lbl"></label>
                    <div class="col-lg-12">
                        <ui-select ng-model="vm.item.CityId">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 50 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.Nationality | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>

                <div class="form-group col-lg-4">
                    <label class="col-lg-12 control-label" for="state" translate="appmanager.org.state.lbl"></label>
                    <div class="col-lg-12">
                        <ui-select ng-model="item.StateId" name="type">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.State | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>
                <div class="form-group col-lg-4">
                    <label class="col-lg-12 control-label" for="country" translate="appmanager.org.country.lbl"></label>
                    <div class="col-lg-12">
                        <ui-select ng-model="item.CountryId" name="type">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.State | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>
                <div class="form-group col-lg-4">
                    <label class="col-lg-12 control-label" for="pincode"
                        translate="appmanager.org.postcode.lbl"></label>
                    <div class="col-lg-12">
                        <input type="text" id="vm.item.Pincode" class="form-control" name="address"
                            ng-model="vm.item.PinCodeId" ng-disabled="item.candisable" placeholder="">
                    </div>
                </div>
                <div class="form-group col-lg-4">
                    <label class="col-lg-12 control-label" for="email"
                        translate="lis.externalprovidermaster.email.lbl"></label>
                    <div class="col-lg-12">
                        <input type="email" class="form-control" name="ucp" ng-model="item.EmailAddress" placeholder=""
                            ng-required="false">
                    </div>
                </div>
                <div class="form-group col-lg-4">
                    <label class="col-lg-12 control-label" translate="lis.externalprovidermaster.comments.lbl"></label>
                    <div class="col-lg-12">
                        <input type="text" class="form-control" name="ucp" ng-model="item.Comments" placeholder="">
                    </div>
                </div>
                <div class="form-group col-lg-4">
                    <label class="col-lg-12 control-label" for="isactive"
                        translate="clinicalmaster.allergy-form.isactive.lbl"></label>
                    <div class="col-lg-12">
                        <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="">
        <div class="pull-left">
            <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()"><i
                    class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button>
        </div>
        <div class="pull-right">
            <button type="submit" class="draftbutton" ng-click="save()" ng-if="!item.isRequested"
                translate="common.saveaction.lbl"></button>
            <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                ng-click="saveAndApprove()"></button>
            <!--<button type="button" class="btn btn-primary btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>-->
            <button id="btnClearForm" type="button" class="draftbutton" ng-click="clear()"
                translate="common.clearaction.lbl"></button>
            <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()"
                translate="common.cancelaction.lbl"></button>
        </div>
    </div>
</div>
