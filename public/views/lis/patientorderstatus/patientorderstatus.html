  <h4 class="page-header mt0" translate="lis.patientorderstatus.pagetitle.lbl"></h4>
 


<div class="row filter-area">
  <div class="col-sm-12"> 
        <div class="pull-right">
            <button id="btnCancelForm" type="button" class="btn btn-danger btn-sm pull-rig" ng-click="cancelCallback()" translate="common.cancelaction.lbl"></button>
        </div> 
   </div>
   <div class="col-sm-12">
        <div class="col-sm-6" style="color:#000000; background-color:#e8cfc5" >
            <label class="col-sm-4 hdtxtalgin">MRN </label>  
            <label class="col-sm-3 hdtxtalgin">{{currentcontext.patmrn}}</label>  
        </div> 
        <div class="col-sm-6" style="color:#000000; background-color:#e8cfc5" >
            <label class="col-sm-4 hdtxtalgin">Order #</label>  
            <label class="col-sm-3 hdtxtalgin">{{currentcontext.ordnr}}</label>  
        </div>
   </div>
   <div class="col-sm-12">
       <div class="col-sm-6" style="color:#000000; background-color:#e8cfc5" >
            <label class="col-sm-4 hdtxtalgin">Patient Name</label> 
            <label class="col-sm-4 hdtxtalgin">{{currentcontext.patname}}</label>  
        </div>
        <div class="col-sm-6" style="color:#000000; background-color:#e8cfc5" >
            <label class="col-sm-4 hdtxtalgin">Order Date</label>  
            <label class="col-sm-6 hdtxtalgin"> {{currentcontext.orddt | date : 'dd/MM/yyyy HH:mm:ss' }} </label>  
        </div>
   </div>  
</div>

<div class="container-fluid">    
    <div ui-grid="vm.gridConfig" class="table-uigrid"></div>
     <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
        ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
</div>
