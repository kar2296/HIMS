    .tab button {
        display: block;
        background-color: inherit;
        color: black;
        padding: 6px 16px;
        width: 100%;
        border: none;
        outline: none;
        text-align: left;
        cursor: pointer;
        transition: 0.3s;
        font-size: 13px;

    .tab button:hover {
        background-color: #1d6090;

    }

<script language="javascript">
    function openCity(evt, cityName) {
        var i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("tabcontent");
        for (i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = "none";
        }
        tablinks = document.getElementsByClassName("tablinks");
        for (i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(" active", "");
        }
        document.getElementById(cityName).style.display = "block";
        evt.currentTarget.className += " active";
    }

    // Get the element with id="defaultOpen" and click on it
    document.getElementById("defaultOpen").click();
</script>

                            <img class="img-responsive"
                                data-ng-src="data:image/png;base64,{{AttachementImg.ImgEncData}}" />
                            <button type="button" class="btn btn-primary odrprocess_view0 img_name"
                                ng-click="downloadAttachment(AttachementImg.filepath,AttachementImg.filename, AttachementImg.Id)">
                                <i class="fa fa-eye" style="font-size:14px;color:#fff;"
                                    aria-hidden="true"></i>&nbsp;&nbsp;
                                <strong class="btn-fontsize ng-scope ">{{AttachementImg.filename}}
                                </strong>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
            </div>
        </div>

    </div>
</div>
