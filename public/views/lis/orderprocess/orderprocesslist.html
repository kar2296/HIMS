 <style>
     .filter-area {
    padding-top: 6px!important;
    padding-bottom: 3px;}
 </style>
 <div class="row page-header">
    <div class="col-sm-12">
       <div ng-switch="$state.params.parentdeptid">
  <div ng-switch-when="1">
    <h4 class="page-header mt0" translate="lis.orderprocess.labpagetitle.lbl"></h4>
  </div>
  <div ng-switch-when="2">
    <h4 class="page-header mt0" translate="lis.orderprocess.radiopagetitle.lbl"></h4>
  </div> 
  <div ng-switch-default>
     <h4 class="page-header mt0" translate="lis.orderprocess.otherpagetitle.lbl"></h4>
  </div>
      </div> 
    </div>
</div>


<div class="row filter-area"> 
       <div class="col-sm-12"> 
           <div class="col-sm-3"> 
                <label class="col-sm-4 control-label filter-lbl" translate="lis.orderprocess.reqdate.lbl"></label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" name="OrderReqDate" ng-date-object 
                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}" 
                            placeholder="{{datePickerOptions.placeholder}}" 
                            ng-click="activefromPopup = { opened: true }" 
                            is-open="activefromPopup.opened" ng-model="currentfilter.OrderReqDate" 
                            ng-change="getList()" >
                </div>
            </div>

            <div class="col-sm-3">
                <label class="col-sm-4 control-label filter-lbl" translate="lis.orderprocess.ordernr.lbl"></label>
                <div class="col-sm-8">
                   <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.ordernr" translate translate-attr-placeholder="lis.orderprocess.ordernr.lbl">
                </div>
            </div>

            <div class="col-sm-3">
                <label class="col-sm-6 control-label filter-lbl" translate="lis.orderprocess.mrn.lbl"></label>
                <div class="col-sm-6">
                   <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.mrn" translate translate-attr-placeholder="lis.orderprocess.mrn.lbl">
                </div>
            </div>
   
            <div class="col-sm-3">
                <label class="col-sm-4 control-label filter-lbl" translate="lis.orderprocess.orderstatuse.lbl"></label>
                <div class="col-sm-8">
                    <ui-select ng-model="currentfilter.Orderstatuse" ng-change="getList()">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 8 : 0}}
                            <span ng-if="$select.selected.Text.length>8">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.OrderStatus | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div> 
            <div class="col-sm-3"></div> 
    </div> 
</div>

 <div class="container-fluid onerow-filter">
     <div ui-grid="vm.gridConfig" class="table-uigrid"></div>
    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
