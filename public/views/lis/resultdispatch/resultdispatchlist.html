<div ng-switch="$state.params.parentdeptid">
    <div ng-switch-when="1">
        <h4 class="page-header mt0" translate="lis.resultdispatch.labpagetitle.lbl"></h4>
    </div>
    <div ng-switch-when="2">
        <h4 class="page-header mt0" translate="lis.resultdispatch.radiopagetitle.lbl"></h4>
    </div>
    <div ng-switch-default>
        <h4 class="page-header mt0" translate="lis.resultdispatch.otherpagetitle.lbl"></h4>
    </div>
</div>

<div class="row filter-area">
    <div class="col-sm-12">
        <div class="col-sm-3">
            <label class="col-sm-4 control-label filter-lbl" translate="lis.resultdispatch.reqdate.lbl"></label>
            <div class="col-sm-8">
                <input type="text" class="form-control" name="OrderReqDate" ng-date-object
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="activefromPopup = { opened: true }"
                    is-open="activefromPopup.opened" ng-model="currentfilter.OrderReqDate" ng-change="getList()">
            </div>
        </div>

        <div class="col-sm-3">
            <label class="col-sm-4 control-label filter-lbl" translate="lis.resultdispatch.ordernr.lbl"></label>
            <div class="col-sm-8">
                <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.ordernr" translate
                    translate-attr-placeholder="lis.resultdispatch.ordernr.lbl">
            </div>
        </div>

        <div class="col-sm-4">
            <label class="col-sm-4 control-label filter-lbl" translate="lis.resultdispatch.mrn.lbl"></label>
            <div class="col-sm-8">
                <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.mrn" translate
                    translate-attr-placeholder="lis.resultdispatch.mrn.lbl">
            </div>
        </div>

        <div class="col-sm-2">
            <label class="col-sm-4 control-label filter-lbl" translate="lis.resultdispatch.orderstatuse.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.Orderstatus" ng-change="getList()">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.OrderStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-3"></div>
    </div>
</div>

<div class="container-fluid">
    <div ui-grid="vm.gridConfig" class="table-uigrid" set-grid-height></div>
</div>
