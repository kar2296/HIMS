<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-3">
            <label class="col-sm-12" for="testanalyte" translate="lis.testbom.items.lbl"></label>
            <div class="col-sm-12">
                <autosearch itemid="item.ItemId" iteminfo="item.SelectedItem" rowdata="item"
                    config="vm.purchaseitemcontrolconfig" itemchange="ItemMasterChanged(item.SelectedItem)">
                </autosearch>
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-12" for="qty" translate="lis.testbom.qty.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="qty" ng-model="item.Quantity" placeholder="">
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-12" translate="lis.testbom.wastage.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="wastage" ng-model="item.Wastage" placeholder="">
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-12" translate="lis.testbom.ucp.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="ucp" ng-model="item.CostPrice" placeholder="">
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-12" translate="lis.testbom.othercost.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="othercost" ng-model="item.OtherCost" placeholder="">
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-12" translate="lis.testbom.qc.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="qc" ng-model="item.QC" placeholder="">
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-12" translate="lis.testbom.tests.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="display" ng-model="item.NoOfTests" placeholder="">
            </div>
        </div>
        <div class="col-sm-3">
            <button class="btn-add" ng-click="saveItem()" style="margin-top: 20px;"
                uib-tooltip="{{ 'lis.testmasters.addnew-tooltip.lbl' | translate }}" tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
                <!-- <span translate="lis.containertypes.addnew.lbl"></span> -->
            </button>
        </div>
    </form>
</div>

<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
