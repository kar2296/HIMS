<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">	
            
                <div class="panel panel-default bg-pattern">
                   <!-- <div class="panel-heading"><h3 class="panel-title" translate="lis.testmasterfacilitymap.pnlgeneral.lbl"></h3></div>!-->
                    <div class="panel-body form-panel">	
                        <div id="clinical-tab">
                        <div class="col-sm-12 well">		
                            <!-- leftpanel -->	
                            <div class="col-sm-12">
                                <div class="form-group">
                                    <label class="col-sm-2 control-label" translate="lis.testmasterfacilitymap.facilities.lbl"></label>
                                    <div class="col-sm-8">
                                         <ui-select multiple ng-model="item.map" class="ui-select-multiple"
                                            ng-map-control pivot-prop="TestmasterId" map-prop="FacilityId" 
                                            pivot-prop-val="{{currentcontext.id}}">
                                            <ui-select-match>{{$item.Text }}</ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                            </div>
                            

                            <!-- rightpanel -->
                           </div>
                    </div>
                </div>
            </div>
            <div class="site-footer panel-footer">
                <button id="btnCancelForm" type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()"><i class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button>
                <div class="footer-right">
                    <button type="button" class="draftbutton" ng-click="saveItem()" translate="common.saveaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>						
                </div>
            </div>
        </form>		
    </div>
</div>
