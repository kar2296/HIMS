<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="lis.testdiagnosismapping.pnltestdiagnosismapping.lbl"></h4>

</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
            <div class="panel panel-default bg-pattern">
                <!--<div class="panel-heading"><h3 class="panel-title" translate="hrmaster.trainingsetuptab.pnlcontainertype.lbl"></h3></div>!-->
                <div class="panel-body form-panel " style="height: 200px;">
                    <!-- leftpanel -->
                    <div class="col-sm-6 well">
                        <div class="col-sm-12">
                            <div class="form-group">
                                <label class="col-sm-7 col-md-5 control-label" for="type" translate="lis.testdiagnosismapping.type.lbl"></label>
                                <div class="col-sm-5 col-md-7">
                                     <ui-select ng-model="item.DiagnosisCodeSchemeId" on-select="onDiagnosisSelected($select.selected)">
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                        </ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.DiagnosisCodeScheme | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-7 col-md-5 control-label" for="type" translate="lis.testdiagnosismapping.diagnosisname.lbl"></label>
                                <div class="col-sm-5 col-md-7">
                                        <autosearch itemid="item.DiagnosisId" iteminfo="" rowdata="" config="vm.diagnosiscontrolconfig" itemchange="getDiagnosis()"
                                        tabindex="-1"></autosearch>
                                    <!-- <ui-select ng-model="item.DiagnosisId" name="diagnosis">
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 20 : 0}}
                                            <span ng-if="$select.selected.Text.length>20">...</span>
                                        </ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Diagnosis | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select> -->
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-7 col-md-5 control-label" for="comments" translate="lis.testdiagnosismapping.comments.lbl"></label>
                                <div class="col-sm-5 col-md-7">
                                    <commentscontrol comments="item.Comments"></commentscontrol>
                                   <!-- <input type="text" class="form-control" name="comments" ng-model="item.Comments" placeholder="" > -->
                                </div>
                            </div>
                         


                            
                        </div>
                    </div>


                    <!-- rightpanel -->
                    <div class="col-sm-6 well"style="height: 167px;">
                        <div class="col-sm-12">



                            <div class="form-group">
                                <label class="col-sm-7 col-md-5 control-label" for="activefrom" translate="lis.testdiagnosismapping.activefrom.lbl"></label>
                                <div class="col-sm-5 col-md-7">
                                    <input type="text" class="form-control" name="activefrom" ng-date-object 
                                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}" 
                                            placeholder="{{datePickerOptions.placeholder}}" 
                                            ng-click="activefromPopup = { opened: true }" 
                                            is-open="activefromPopup.opened" ng-model="item.Activefrom" >
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-7 col-md-5 control-label" for="activeto" translate="lis.testdiagnosismapping.activeto.lbl"></label>
                                <div class="col-sm-5 col-md-7">
                                    <input type="text" class="form-control" name="activeto" ng-date-object 
                                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}" 
                                            placeholder="{{datePickerOptions.placeholder}}" 
                                            ng-click="activetoPopup = { opened: true }" 
                                            is-open="activetoPopup.opened" ng-model="item.Activeto" >
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-7 col-md-5 control-label" for="isactive" translate="clinicalmaster.allergy-form.isactive.lbl"></label>
                                <div class="col-sm-5 col-md-7">
                                    <input type="checkbox" name="isactive" class="custom-checkbox"
                                        ng-model="item.IsActive">
                                </div>
                            </div>
                            
                          


                        </div>
                    </div>


                </div>
            </div>

            <div class="fooder-bgs">
                <div class="col-sm-12">


                    <div class="footer-right">
                        <button type="button" class="draftbutton" ng-click="save()" translate="common.saveaction.lbl"></button>
                        <button type="button" class="draftbutton text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                        <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                        <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>						
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
