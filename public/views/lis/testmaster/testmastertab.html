<div class="row">
    <div class="col-sm-4">
        <h4 class="mt0" translate="lis.testmaster.pnltestmaster.lbl"></h4>
    </div>
    <div class="col-sm-4">
        <label class="col-sm-9 mt0 active" translate=" {{$state.params.TestName}}"></label>
    </div>
    <div class="col-sm-4">
        <button class="btn-add" ng-click="addNew()" uib-tooltip="{{ 'lis.testmasters.addnew-tooltip.lbl' | translate }}"
            tooltip-placement="bottom">
            <i class="fa fa-plus" aria-hidden="true"></i>
            <!-- <span translate="lis.containertypes.addnew.lbl"></span> -->
        </button>
    </div>

</div>
<div class="row">
    <div class="col-sm-12">
        <uib-tabset active="active" id="assettabs">
            <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)"
                disable="tab.canDisable">
            </uib-tab>
        </uib-tabset>
        <div ui-view class="tabview"></div>
    </div>
</div>
