<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">	
            <div class="formRoot">
                <div class="panel panel-default">
                    <div class="panel-heading"><h3 class="panel-title" translate="lis.testdiagnosismapping.pnltestdiagnosismapping.lbl"></h3></div>
                    <div class="panel-body form-panel">	
                        <div class="col-sm-12 well">	 
                            <!-- leftpanel -->
                            <div class="col-sm-12">
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" translate="lis.containertype.Instruction.lbl"></label>
                                    <div class="col-sm-7">
                                        <textarea rows="9" ng-model="item.Instructions" maxlength="4000" style="width:100%;" class="notes-textarea"></textarea>
                                    </div>
                                </div>                                
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="site-footer panel-footer">
              <button id="btnCancelForm" type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()"><i class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button>  
                <div class="footer-right">
                    <button type="button" class="draftbutton" ng-click="saveItem()" translate="common.saveaction.lbl"></button>
                    <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="back()" translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </form>		
    </div>
</div>
