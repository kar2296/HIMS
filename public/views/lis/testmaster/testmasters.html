<link href="app/css/regbilling.css" rel="stylesheet">
<div class="row ">
    <div class="col-sm-12">
        <div class="col-sm-9">
            <h4 class="mt0" translate="lis.testmasters.pagetitle.lbl"></h4>
        </div>
        <div class="col-sm-3">
            <div class="filters">
                <div class="search">
                    <input type="text" id="pid" class="form-control" on-enter="getList()"
                        ng-model="currentfilter.codemnemonicsnamedesc" translate
                        translate-attr-placeholder="Name/Code Search">
                    <div class="drhms-search-icon"><i class="fas fa-search" aria-hidden="true"></i></div>
                </div>
                <button type="button" tabindex="-1" class="btn-add" ng-click="addNew()"
                    uib-tooltip="{{ 'lis.testmasters.pagetitle.lbl' | translate}}" tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i></button>
                <button class="default-color" style="margin-left: 10px;">
                    <i class="fa fa-home" ng-click="backtoList()" uib-tooltip="Dashboard" tooltip-placement="bottom">
                    </i>
                </button>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <div class="drhms-list-filters">
        <div class="col-sm-3">
            <label class="col-sm-12" translate="lis.testmasters.dept.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="currentfilter.dept" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 25 : 0}}
                        <span ng-if="$select.selected.Text.length>25">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-12" translate="lis.testmasters.subdept.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="currentfilter.subdept" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 25 : 0}}
                        <span ng-if="$select.selected.Text.length>25">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.SubDepartment | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-12" translate="Facility Name"></label>
            <div class="col-sm-12">
                <ui-select ng-model="currentfilter.FacilityId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 25 : 0}}
                        <span ng-if="$select.selected.Text.length>25">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-12" translate="lis.testmasters.status.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 25 : 0}}
                        <span ng-if="$select.selected.Text.length>25">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </div>
</div>
<custom-table config="vm.gridConfig"></custom-table>
<div class="container-fluid onerow-filter">
    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
                items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
