<style>
.pager-div{float:right; right:0; box-sizing: border-box;position: fixed;box-sizing: border-box;}
</style>
<div class="row filter-area margin-top">
    <div class="col-sm-12">
        <div class="form-group">
         <div class="col-sm-3 col-md-3">
            <label class="col-sm-6 col-md-5 control-label text-right filter-lbl" translate="lis.testmasters.searchtitle.lbl"></label>
            <div class="col-sm-6 col-md-6 input-group"><div class="input-group-addon"><i class="fas fa-search" aria-hidden="true"></i></div>
                <input type="text" class="form-control" autofocus on-enter="getList()" ng-model="currentfilter.codemnemonicsnamedesc" translate
                    translate-attr-placeholder="lis.testmasters.searchtitle.lbl">
            </div>
        </div>
        <div class="col-sm-3 col-md-3">
            <label class="col-sm-6 col-md-5 control-label text-right filter-lbl" translate="lis.testmasters.type.lbl"></label>
            <div class="col-sm-6 col-md-6 input-group">
                <ui-select ng-model="currentfilter.type" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.TESTMASTERTYP | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
   <div class="col-sm-3 col-md-3">
            <label class="col-sm-6 col-md-4 col-lg-5 control-label filter-lbl" translate="lis.testmasters.status.lbl"></label>
            <div class="input-group col-sm-7 col-md-9 col-lg-6">
                <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
         <div class="col-sm-3 col-md-3">
              <!-- <button class="btn bt-color3 btn-xs pull-right btn-filter" uib-tooltip="{{ 'lis.containertypes.filter-tooltip.lbl' | translate }}" tooltip-placement="left">
                        <i class="fa fa-filter" aria-hidden="true"></i>&nbsp;<span translate="lis.containertypes.filter.lbl"></span></button> -->
            <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addNew()" uib-tooltip="{{ 'lis.testmasters.addnew-tooltip.lbl' | translate }}" tooltip-placement="left">
                        <i class="fa fa-plus" aria-hidden="true"></i>&nbsp;<span translate="lis.containertypes.addnew.lbl"></span></button>
         </div>
    </div>
    </div>
</div>
<custom-table config="vm.gridConfig"></custom-table>
<div class="container-fluid single-filter">

    <div class="site-footer">
    <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
        ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
