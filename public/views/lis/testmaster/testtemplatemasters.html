<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot" set-tab-form-height>
                <div class="panel panel-default">
                    <div class="panel-heading"><h3 class="panel-title" translate="lis.testtemplatemasters.pagetitle.lbl"></h3></div>
                    <div class="panel-body form-panel">
                        <div class="col-sm-12">
                            <div class="form-group">
                                <label class="col-sm-2 control-label" translate="lis.testtemplatemasters.male.lbl"></label>
                                <div class="col-sm-10">
                                     <richtexteditor richtext="item.MaleDataTemplate"></richtexteditor>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-2 control-label" translate="lis.testtemplatemasters.female.lbl"></label>
                                <div class="col-sm-10">
                                     <richtexteditor richtext="item.FemaleDataTemplate"></richtexteditor>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="site-footer panel-footer">
               <button id="btnCancelForm" type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()"><i class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button>
                <div class="footer-right">
                    <button type="button" class="draftbutton" ng-click="saveItem()" translate="common.saveaction.lbl"></button>
                   <button id="btnCancelForm" type="button" class="draftbutton" ng-click="back()" translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
