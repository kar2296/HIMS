<!--
  MediFlow Enterprise Design System - Diagnostic Investigation Tracking Tabs Shell
  Rendered inside the AngularJS shell with modern navigation tabs
-->
<div style="padding: 16px 24px 0 24px; background: #ffffff; border-bottom: 1px solid #e2e8f0; font-family: 'Inter', -apple-system, sans-serif;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <div style="width: 32px; height: 32px; border-radius: 6px; background-color: #0284c7; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 15px;">
                <i class="fa fa-line-chart"></i>
            </div>
            <div>
                <h3 style="margin: 0; font-size: 16px; font-weight: 700; color: #0f172a;" translate="Order Tracking">Diagnostic Investigation Tracking</h3>
                <span style="font-size: 12px; color: #64748b;">Specimen status, work order lifecycle, and follow-up tracking</span>
            </div>
        </div>
    </div>

    <!-- Modern MediFlow Navigation Tabs -->
    <div style="display: flex; gap: 8px;">
        <button type="button" ng-repeat="tab in tabs" ng-click="switchTab(tab)" ng-disabled="tab.canDisable"
            style="padding: 8px 18px; border-radius: 6px 6px 0 0; font-size: 13px; font-weight: 600; cursor: pointer; border: none; border-bottom: 2px solid transparent; background: transparent; transition: all 0.15s ease;"
            ng-style="tab.active ? { 'color': '#0284c7', 'border-bottom': '2px solid #0284c7', 'background': '#f0f9ff' } : { 'color': '#64748b' }">
            {{tab.title}}
        </button>
    </div>
</div>

<div ui-view></div>
