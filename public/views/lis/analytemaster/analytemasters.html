<link href="app/css/regbilling.css" rel="stylesheet">

<div class="row ">
    <div class="col-sm-12">
        <div class="col-sm-9">
            <h4 class="mt0" translate="lis.analytemaster.pnlanalytemaster.lbl"></h4>
        </div>
        <div class="col-sm-3">
            <div class="filters">
                <div class="search">
                    <input type="text" id="pid" class="form-control" on-enter="getList()"
                        ng-model="currentfilter.codemnemonicsnamedesc" translate
                        translate-attr-placeholder="Name/Code search">
                    <div class="drhms-search-icon"><i class="fas fa-search" aria-hidden="true"></i></div>
                </div>
                <button type="button" tabindex="-1" class="btn-add" ng-click="addNew()"
                    uib-tooltip="{{ 'lis.analytemaster.pnlanalytemaster.lbl' | translate}}" tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                    <!-- <span translate="clinicalmaster.serviceitem-list.addnew.lbl " class="text-white"></span> -->
                </button>
                <button type="button" tabindex="-1" class="btn-add" ng-click="backtoList()" uib-tooltip="Dashboard"
                    tooltip-placement="bottom">
                    <i class="fa fa-home" uib-tooltip="Dashboard" tooltip-placement="bottom"> </i>
                    <!-- <span translate="clinicalmaster.serviceitem-list.addnew.lbl " class="text-white"></span> -->
                </button>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-sm-4">
        <label class="col-sm-3" translate="lis.analytemasters.type.lbl""></label>
            <div class=" col-sm-9">
            <ui-select ng-model="currentfilter.type" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 8 : 0}}
                    <span ng-if="$select.selected.Text.length>8">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.ANALYTETYPE | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
    </div>
</div>
<div class="col-sm-4">
    <label class="col-sm-3" translate="lis.analytemasters.vtype.lbl"></label>
    <div class="col-sm-9">
        <ui-select ng-model="currentfilter.vtype" ng-change="getList()" class="filter-combo">
            <ui-select-match>
                {{$select.selected.Text | limitTo : 8 : 0}}
                <span ng-if="$select.selected.Text.length>8">...</span>
            </ui-select-match>
            <ui-select-choices
                repeat="lookupitem.Id as lookupitem in lookup.ANALYTEVALUETYPE | filter: { Text: $select.search }">
                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
            </ui-select-choices>
        </ui-select>
    </div>
</div>
<div class="col-sm-4">
    <label class="col-sm-3" translate="lis.containertypes.status.lbl"></label>
    <div class="col-sm-9">
        <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
            <ui-select-match>
                {{$select.selected.Text | limitTo : 8 : 0}}
                <span ng-if="$select.selected.Text.length>8">...</span>
            </ui-select-match>
            <ui-select-choices
                repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
            </ui-select-choices>
        </ui-select>
    </div>
</div>
</div>

<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
