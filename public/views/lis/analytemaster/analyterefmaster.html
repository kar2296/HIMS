<div class="modal-header custom-modal-header">
    <div class="col-sm-2">
        <h4 class="modal-title custom-modal-title" translate="lis.analyterefmaster.pnlanalyterefmaster.lbl"></h4>
    </div>
    <div class="col-sm-8 mt0" style="color: #fff;" translate=" {{$state.params.AnalyteName}}"></div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="gender_e"
                translate="lis.analyterefmaster.gender_e.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.GenderId" name="gender_e" autofocus required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Gender | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                        </div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="analytereftype_e"
                translate="lis.analyterefmaster.analytereftype_e.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.AnalyteRefTypeId" name="analytereftype_e" autofocus required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ANALYTEREFTYPE | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                        </div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="agefrom" translate="lis.analyterefmaster.agefrom.lbl"></label>
            <div class="col-sm-12">
                <input type="number" class="form-control" name="agefrom" ng-model="item.Agefrom" autofocus required />
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="ageto" translate="lis.analyterefmaster.ageto.lbl"></label>
            <div class="col-sm-12">
                <input type="number" class="form-control" name="ageto" ng-model="item.Ageto" autofocus required />
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" translate="lis.analyterefmaster.excludefromprint.lbl"></label>
            <div class="col-sm-12">
                <input type="checkbox" name="Excludefromprint" class="custom-checkbox" ng-model="item.Excludefrmprt">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="refvalue"
                translate="lis.analyterefmaster.refvalue.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="refvalue" ng-model="item.Refvalue" placeholder=""
                    autofocus required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="minvalue"
                translate="lis.analyterefmaster.minvalue.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="minvalue" ng-model="item.Minvalue" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="maxvalue"
                translate="lis.analyterefmaster.maxvalue.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="maxvalue" ng-model="item.Maxvalue" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="isactive"
                translate="clinicalmaster.allergy-form.isactive.lbl"></label>
            <div class="col-sm-12">
                <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
            </div>
        </div>
    </form>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="pull-right">
            <button type="button" class="draftbutton text-white btn-sm" translate="common.saveapprove-action.lbl"
                ng-click="saveAndApprove()"></button>
        </div>
    </div>
</div>
