<div class="row page-header" id="assets">
    <div class="col-sm-12">
        <div class="col-sm-8">
            <h4 class="col-sm-5 mt0 active" translate="lis.analytemaster.pagetitle.lbl"></h4>
            <label class="col-sm-7 mt0 active" translate=" {{$state.params.AnalyteName}}"></label>
        </div>
    </div>
</div>
<div class="row tablebox" id="tablebox">
    <div class="col-sm-12">
        <uib-tabset active="active" id="assettabs">
            <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)"
                disable="tab.canDisable">
            </uib-tab>
        </uib-tabset>
        <div ui-view></div>
    </div>
</div>
