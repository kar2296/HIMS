<style>
    .modal-dialog {
        width: 800px;
        margin: 30px auto;
    }

    .form-horizontal .control-label {
        height: 50px;
        padding-top: 0;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="lis.analyzer.pagetitle2.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="backToList()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <!-- leftpanel -->

        <div class="col-sm-6">
            <div class="col-sm-12">
                <div class="form-group">
                    <label class="col-sm-7 col-md-5 control-label" for="testtype"
                        translate="lis.analyzer.facility.lbl"></label>
                    <div class="col-sm-5 col-md-7">
                        <ui-select ng-model="item.FacilityId">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.Facility  | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-7 col-md-5 control-label" for="name"
                        translate="lis.analyzer.equipmentname.lbl"></label>
                    <div class="col-sm-5 col-md-7">
                        <ui-select ng-model="item.AssetId" ng-change="getAssestChanges()">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.AssetName  | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                        <!-- <autosearch itemid="item.AssetId" iteminfo="item.selecteditem" rowdata="" name="'name'"config="vm.assettransfercontrolconfig" itemchange="getList()" isrequired="true"></autosearch> -->
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-7 col-md-5 control-label" for="externalprovidersid"
                        translate="lis.analyzer.equipmentcode.lbl"></label>
                    <div class="col-sm-5 col-md-7">
                        <input type="text" class="form-control" name="code" ng-model="item.Barcode" placeholder=""
                            disabled>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-7 col-md-5 control-label" translate="lis.analyzer.equipmenttype.lbl"></label>
                    <div class="col-sm-5 col-md-7">
                        <ui-select ng-disabled="true" ng-model="item.AssetTypeId">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.AssetType  | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>
            </div>
        </div>
        <!-- rightpanel -->
        <div class="col-sm-6">
            <div class="col-sm-12">

                <div class="form-group">
                    <label class="col-sm-7 col-md-5 control-label" for="code" translate="lis.analyzer.code.lbl"></label>
                    <div class="col-sm-5 col-md-7">
                        <input type="text" name="code" class="custom-checkbox" ng-model="item.Code" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-7 col-md-5 control-label" for="ucp" translate="lis.analyzer.name.lbl"></label>
                    <div class="col-sm-5 col-md-7">
                        <input type="text" class="form-control" name="ucp" ng-model="item.Name" placeholder="" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-7 col-md-5 control-label" translate="lis.analyzer.description.lbl"></label>
                    <div class="col-sm-5 col-md-7">

                        <input type="text" class="form-control" name="cost" ng-model="item.Description" placeholder="">
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-7 col-md-5 control-label" translate="lis.analyzer.isactive.lbl"></label>
                    <div class="col-sm-5 col-md-7">
                        <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-7 col-md-5 control-label" translate="lis.analyzer.displayno.lbl"></label>
                    <div class="col-sm-5 col-md-7">
                        <input type="text" class="custom-checkbox" ng-model="item.DisplayNo">
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<div class="">
    <div class="row">
        <div class="pull-right">
            <button type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"
                ng-if="!item.isRequested"></button>
            <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                ng-click="saveAndApprove()"></button>
            <!-- <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()"
                translate="common.clearaction.lbl"></button>
            <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()"
                translate="common.cancelaction.lbl"></button> -->
        </div>
    </div>
</div>
