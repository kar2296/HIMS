<div class="row">
    <div class="col-sm-3 form-group">
        <label class="col-sm-12 control-label" translate="lis.analyzer.code.lbl"></label>
        <div class="col-sm-12">
            <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.Code" placeholder="">
        </div>
    </div>
    <div class="col-sm-3 form-group">
        <label class="col-sm-12 control-label"
            translate="lis.analyzer.equipmentname.lbl"></label>
        <div class="col-sm-12">
            <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.AssetName"
                placeholder="">
        </div>
    </div>
    <div class="col-sm-3 form-group">
        <label class="col-sm-12 control-label" translate="lis.analyzer.name.lbl"></label>
        <div class="col-sm-12">
            <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.Name" placeholder="">
        </div>
    </div>
    <div class="col-sm-3 form-group">
        <label class="col-sm-12 control-label" translate="lis.analyzer.status.lbl"></label>
        <div class="col-sm-12">
            <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
</div>

<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
