    <div class="col-sm-4">
            <label class="col-sm-7 col-md-4 col-lg-4 control-label text-right filter-lbl" translate="lis.containertypes.status.lbl"></label> 
            <div class="col-sm-8"> 
              <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select> 
            </div>                    
        </div>
    <div class="col-sm-5">
            <div class="filters">
                <div class="search">
                    <input type="text" id="pid" class="form-control" autofocus on-enter="getList()" 
                    ng-model="currentfilter.codemnemonicsnamedesc" 
                    translate translate-attr-placeholder="lis.sampletypes.code.lbl">
                        <i class="fas fa-search" aria-hidden="true"></i>
                </div>
                <button type="button" tabindex="-1" class="btn-add"
                    ng-click="addNew()" uib-tooltip="Add{{ 'lis.sampletypes.pagetitle.lbl' | translate}}"
                    tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                    <!-- <span translate="clinicalmaster.serviceitem-list.addnew.lbl " class="text-white"></span> -->
                </button>
            </div>
        </div>
</div>
