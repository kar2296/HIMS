<style>
    .form-horizontal .form-group {
        height: 72px;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Manage Antibiotics"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <!-- <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()"
            translate="common.cancelaction.lbl"></button> -->
            <img src="../../../../../assets/svg/close.svg" ng-click="backToList()">
        </div>
    </div>
</div>

<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <!-- <div class="panel panel-default  bg-pattern">
                <div class="panel-body form-panel"> -->
            <!-- <div id="clinical-tab"> -->
            <div class="col-sm-12 ">
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label0" for="testtype"
                        translate="lis.analyzer.facility.lbl"></label>
                    <div class="col-sm-12">
                        <ui-select ng-model="item.FacilityId">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 35 : 0}}
                                <span ng-if="$select.selected.Text.length>35">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.Facility  | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label0" for="code" translate="lis.analyzer.code.lbl"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="code" ng-model="item.Code" placeholder="" required
                            uppercase>
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label0" for="name" translate="lis.analyzer.name.lbl"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="name" ng-model="item.AntibioticName"
                            placeholder="" required uppercase>
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label0" for="mnemonic"
                        translate="lis.testmaster.Mnemonics.lbl"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="mnemonic" ng-model="item.Mnemonic" placeholder="">
                    </div>
                </div>
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label0" for="display"
                        translate="lis.testmaster.DisplayOrder.lbl"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="display" ng-model="item.DisplayOrder"
                            placeholder="">
                    </div>
                </div>
                <!-- <div class="form-group col-sm-4">
                                        <label class="col-sm-12 control-label0" translate="lis.antiobiotics.organism.lbl"></label>
                                          <div class="col-sm-12">	
                                            <ui-select ng-model="item.OrganismId">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.OrgIsolation  | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div> -->
                <div class="form-group col-sm-4">
                    <label class="col-sm-12 control-label0" for="isactive"
                        translate="clinicalmaster.allergy-form.isactive.lbl"></label>
                    <div class="col-sm-12">
                        <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
                    </div>
                </div>
                <!-- </div> -->
            </div>
            <!-- </div> -->
            <!-- </div>
            </div> -->
            <!-- <div class="fooder-bgs">
                <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()">
                    <i class="fa fa-angle-left" aria-hidden="true"></i>
                    <span class="btn-fontsize"> &nbsp; Back</span>
                </button>
                <div class="pull-right">
                    <button type="button" class="draftbutton" ng-click="save()" translate="common.saveaction.lbl"></button>
                    <button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                    <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                </div>
            </div> -->
            <div class="fooder-bgS">
                <div class="row ">
                    <div class="col-sm-12">
                        <div class="pull-left">
                            <button class="btn pyr-color10 btn-sm" type="button" ng-click="backToList()">
                                <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                                <span class="btn-fontsize" translate="common.backaction.lbl"></span>
                            </button>
                        </div>
                        <div class="pull-right">
                            <button type="button" class="draftbutton" translate="common.saveaction.lbl"
                                ng-click="save()"></button>
                            <button id="btnSaveApprove" type="button" class="draftbutton"
                                translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                            <!-- <button id="btnClearForm" type="button" class="draftbutton" ng-click="clear()"
                                translate="common.clearaction.lbl"></button> -->
                            <!-- <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()"
                                translate="common.cancelaction.lbl"></button> -->
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
