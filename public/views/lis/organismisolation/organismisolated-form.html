<style>
    .modal-dialog {
        width: 900px;
        margin: 30px auto;
    }
    
    .form-horizontal .form-group {
        height: 72px;
    }
</style>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="testtype" translate="lis.analyzer.facility.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.FacilityId">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 25 : 0}}
                        <span ng-if="$select.selected.Text.length>25">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility  | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="code" translate="lis.analyzer.code.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="code" ng-model="item.Code" placeholder="" required uppercase>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="name" translate="lis.analyzer.name.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="name" ng-model="item.OrgIsolationName" placeholder="" required uppercase>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="mnemonic" translate="lis.testmaster.Mnemonics.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="mnemonic" ng-model="item.Mnemonic" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label0" for="isactive" translate="clinicalmaster.allergy-form.isactive.lbl"></label>
            <div class="col-sm-12">
                <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
            </div>
        </div>
    </form>
</div>


<div class="fooder-bgS">
    <div class="row ">
        <div class="col-sm-12">
            <div class="pull-left">
                <button class="btn pyr-color10 btn-sm" type="button" ng-click="backToList()">
                    <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
                    <span class="btn-fontsize" translate="common.backaction.lbl"></span>
                </button>
            </div>
            <div class="pull-right">
                <button type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()" ng-if="!item.isRequested"></button>
                <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
            </div>
        </div>
    </div>
</div>
