
<div ng-switch="$stateParams.parentdeptid">
  <div ng-switch-when="1">
    <h4 class="page-header mt0" translate="lis.orderacknowledges.labpagetitle.lbl"></h4>
  </div>
  <div ng-switch-when="2">
    <h4 class="page-header mt0" translate="lis.orderacknowledges.radiopagetitle.lbl"></h4>
  </div>
  <div ng-switch-default>
     <h4 class="page-header mt0" translate="lis.orderacknowledges.otherpagetitle.lbl"></h4>
  </div>
</div>

<div class="tablebox">
<div class="row filter-area">
       <div class="col-sm-12">
           <div class="col-sm-3">
                <label class="col-sm-4 control-label filter-lbl" translate="lis.orderacknowledges.reqdate.lbl"></label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" name="OrderReqDate" ng-date-object
                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                            placeholder="{{datePickerOptions.placeholder}}"
                            ng-click="activefromPopup = { opened: true }"
                            is-open="activefromPopup.opened" ng-model="currentfilter.OrderReqDate"
                            ng-change="getList()" >
                </div>
            </div>

            <div class="col-sm-3">
                <label class="col-sm-4 control-label filter-lbl" translate="lis.orderacknowledges.ordernr.lbl"></label>
                <div class="col-sm-8">
                   <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.ordernumber" translate translate-attr-placeholder="lis.orderacknowledges.ordernr.lbl">
                </div>
            </div>

            <div class="col-sm-4">
                <label class="col-sm-4 control-label filter-lbl" translate="lis.orderacknowledges.mrnsearch.lbl"></label>
                <div class="col-sm-8">
                   <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.mrn" translate translate-attr-placeholder="lis.orderacknowledges.mrn.lbl">
                </div>
            </div>
            <div class="col-sm-2"></div>
    </div>
    <div class="col-sm-12">
        <div class="col-sm-3">
            <label class="col-sm-4 control-label filter-lbl" translate="lis.orderacknowledges.orderstatuse.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.orderstatusid" ng-change="getList()">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.OrderStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>

        <div class="col-sm-3">
            <label class="col-sm-4 control-label filter-lbl" translate="lis.orderacknowledges.prioritystatuse.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.prioritystatusid" ng-change="getList()">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.OrderPriority | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>

    </div>

</div>
    <custom-table config="vm.gridConfig"></custom-table>
    </div>
<div class="container-fluid">
     <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
        ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
</div>
