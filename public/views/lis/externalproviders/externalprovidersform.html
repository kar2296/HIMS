<div class="row page-header">
    <!--<li><a ng-click="backToList()" translate="lis.externalprovider.parentpagetitle.lbl"></a></li>!-->
    <h4 class="active mt0 col-sm-6" translate="lis.externalprovider.pagetitle.lbl"></h4>
<div class="col-sm-6">
<button class="btn-add" ng-click="addNew()"uib-tooltip="{{ 'lis.externalprovider.addnew-tooltip.lbl' | translate }}" tooltip-placement="left">
                        <i class="fa fa-plus" aria-hidden="true"></i>&nbsp;<span translate="lis.containertypes.addnew.lbl"></span></button>
</div>
</div>	

<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">	
                <div class="panel panel-default bg-pattern">
                   <!-- <div class="panel-heading"><h3 class="panel-title" translate="lis.externalprovider.pnlexternalprovider.lbl"></h3></div>!-->
                    <div class="panel-body form-panel">
                        <div id="clinical">	
                        <div class="col-sm-12 well">			
                            
                            <!-- leftpanel -->
                            <div class="col-sm-6">
                                <div class="col-sm-12">
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="organizationId" translate="lis.externalprovider.organizationId.lbl"></label>
                                    <div class="col-sm-7">
                                        <ui-select ng-model="item.OrganizationId" name="organizationId" autofocus required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Organization | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="facilityId" translate="lis.externalprovider.facilityId.lbl"></label>
                                    <div class="col-sm-7">
                                        <ui-select ng-model="item.FacilityId" name="facilityId" autofocus required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="testname" translate="lis.externalprovider.testname.lbl"></label>
                                    <div class="col-sm-7">
                                        <ui-select ng-model="item.TestmasterId" name="testname" autofocus required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.TestMaster | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="externalprovidersid" translate="lis.externalprovider.externalprovidersid.lbl"></label>
                                    <div class="col-sm-7">
                                        <ui-select ng-model="item.ExternalprovidersId" name="externalprovidersid"autofocus required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="aliascode" translate="lis.externalprovider.aliascode.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="text" class="form-control" name="aliascode" ng-model="item.AliasCode" placeholder="" >
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="aliasname" translate="lis.externalprovider.aliasname.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="text" class="form-control" name="aliasname" ng-model="item.AliasName" placeholder="" >
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="ucp" translate="lis.externalprovider.ucp.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="text" class="form-control" name="ucp" ng-model="item.UCP" placeholder="" >
                                    </div>
                                </div>
                                </div>
                            </div>
                            
                            <!-- rightpanel -->
                            <div class="col-sm-6">
                                <div class="col-sm-12">
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="resrelsdt" translate="lis.externalprovider.resrelsdt.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="text" class="form-control" name="resrelsdt" ng-date-object 
                                                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" 
                                                placeholder="{{datePickerOptions.placeholder}}" 
                                                ng-click="resrelsdtPopup = { opened: true }" 
                                                is-open="resrelsdtPopup.opened" ng-model="item.ResultReleaseDate" >
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="isattachementrequired" translate="lis.externalprovider.isattachementrequired.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="checkbox" name="isattachementrequired" class="custom-checkbox"
                                            ng-model="item.IsAttachementRequired">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="comments" translate="lis.externalprovider.comments.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="text" class="form-control" name="comments" ng-model="item.Comments" placeholder="" >
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="othercost" translate="lis.externalprovider.othercost.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="text" class="form-control" name="othercost" ng-model="item.OtherCost" placeholder="" >
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="activefrom" translate="lis.externalprovider.activefrom.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="text" class="form-control" name="activefrom" ng-date-object autofocus required
                                                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" 
                                                placeholder="{{datePickerOptions.placeholder}}" 
                                                ng-click="activefromPopup = { opened: true }" 
                                                is-open="activefromPopup.opened" ng-model="item.Activefrom" >
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="activeto" translate="lis.externalprovider.activeto.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="text" class="form-control" name="activeto" ng-date-object 
                                                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" 
                                                placeholder="{{datePickerOptions.placeholder}}" 
                                                ng-click="activetoPopup = { opened: true }" 
                                                is-open="activetoPopup.opened" ng-model="item.Activeto" >
                                    </div>
                                </div>
                               </div>
                            </div>
                         </div>
                  </div>
            </div>
            </div>
            <div class="fooder-bgs">
                <button type="button" class="btn pyr-color10 btn-sm" ng-click="backToList()"><i class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button>
                <div class="pull-right">
                    <button type="submit" class="draftbutton" translate="common.saveaction.lbl"></button>
                    <button type="button" class="btn btn-primary btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                    <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>						
                </div>
            </div>
        </form>		
    </div>
</div>
