<style>
    .modal-lg {
        width: 1000px;
    }
    
    .panel-body {
        padding: 15px;
        margin-left: 0px;
        margin-top: 40px;
        margin-right: 0px;
        margin-bottom: 0px;
        background-image: url(app/img/bg-body.jpg);
        background-repeat: repeat;
        overflow: auto;
    }
    
    .well {
        min-height: 20px;
        padding: 19px;
        margin-bottom: 0px;
        border: 1px solid #ededed;
        border-radius: 4px;
        background: rgb(233, 246, 253);
        /* Old browsers */
        background: -moz-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* FF3.6-15 */
        background: -webkit-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, rgb(250, 250, 250) 0%, rgb(247, 252, 253) 100%);
        /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid: DXImageTransform.Microsoft.gradient( startColorstr='#e9f6fd', endColorstr='#d3eefb', GradientType=0);
        /* IE6-9 */
        box-shadow: 4px 2px 13px -7px rgba(0, 0, 0, 0.75);
    }
    
    .formactionbar {
        padding: 5px 15px;
        height: 40px;
        background-color: #ccecf5;
    }
    
    .custom-modal-header {
        margin-bottom: 10px;
        background-color: #597a9a;
        color: #fff;
    }
    
    .modal-content {
        -webkit-box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        box-shadow: -1px 3px 20px 7px rgba(249, 244, 244, 0.5);
    }
    
    .modal-header {
        padding: 12px;
        border-bottom: 1px solid #e5e5e5;
    }
	 .formRoot { overflow: inherit;}
    .modal-content .panel-body { overflow: inherit;}
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-12 ">

        <h3 class="panel-title" translate="lis.externalprovidermaster.pnlform.lbl"></h3>
    </div>

</div>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div>
                <div class="">
                    <div class="panel-body form-panel">

                        <div class="col-sm-12  ">

                            <!-- leftpanel -->

                            <div class="col-sm-6 ">
                                <div class="col-sm-12 well">
                                    <div class="form-group">
                                        <label class="col-sm-7 col-md-5 control-label" for="testtype" translate="lis.externalprovidermaster.testtype.lbl"></label>
                                        <div class="col-sm-5 col-md-7">
                                            <ui-select ng-model="item.TESTMASTERTYPId" name="testtype" required>
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 20 : 0}}
                                                    <span ng-if="$select.selected.Text.length>20">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.TESTMASTERTYP  | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-7 col-md-5 control-label" translate="lis.externalprovidermaster.testname.lbl" for="testid"></label>
                                        <div class="col-sm-5 col-md-7">
                                            <autosearch itemid="item.TestId" iteminfo="item.selectedItem" rowdata="item" name="'testid'" config="vm.testcontrolconfig"
                                                itemchange="getTest()" isrequired="true"></autosearch>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-7 col-md-5 control-label" for="externalprovidersid" translate="lis.externalprovidermaster.aliascode.lbl"></label>
                                        <div class="col-sm-5 col-md-7">
                                            <input type="text" class="form-control" name="code" ng-model="item.AliasCode" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-7 col-md-5 control-label" translate="lis.externalprovidermaster.providername.lbl"></label>
                                        <div class="col-sm-5 col-md-7">
                                            <input type="text" class="form-control" name="name" ng-model="item.ProviderName" placeholder="" disabled>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-7 col-md-5 control-label" for="name" translate="lis.externalprovidermaster.aliasname.lbl"></label>
                                        <div class="col-sm-5 col-md-7">
                                            <input type="text" class="form-control" name="name" ng-model="item.AliasName" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-7 col-md-5 control-label" for="cost" translate="lis.externalprovidermaster.price.lbl"></label>
                                        <div class="col-sm-5 col-md-7">
                                            <input type="text" class="form-control" name="cost"  ng-model="item.Price"  placeholder="" required>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-7 col-md-5 control-label" translate="lis.externalprovidermaster.isactive.lbl"></label>
                                        <div class="col-sm-5 col-md-7">
                                            <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- rightpanel -->
                            <div class="col-sm-6">
                                <div class="col-sm-12 well">
                                    <div class="form-group">
                                        <label class="col-sm-7 col-md-5 control-label" translate="lis.externalprovidermaster.resultrelease.lbl"></label>
                                        <div class="col-sm-5 col-md-7">
                                            <input type="text" class="form-control" name="dateacquired" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                                placeholder="{{datePickerOptions.placeholder}}" ng-click="dateacquiredPopup = { opened: true }"
                                                is-open="dateacquiredPopup.opened" ng-model="item. ResultReleaseDate">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-7 col-md-5 control-label" translate="lis.externalprovidermaster.attachmentreq.lbl"></label>
                                        <div class="col-sm-5 col-md-7">
                                            <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsAttachementRequired">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-7 col-md-5 control-label" for="ucp" translate="lis.externalprovidermaster.comments.lbl"></label>
                                        <div class="col-sm-5 col-md-7">
                                            <input type="text" class="form-control" name="ucp" ng-model="item.Comments" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-7 col-md-5 control-label"  translate="lis.externalprovidermaster.othercost.lbl"></label>
                                        <div class="col-sm-5 col-md-7">
                                              
                                            <input type="text" class="form-control" name="cost" ng-model="item.OtherCost" placeholder="">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-7 col-md-5 control-label" for="activefrom" translate="lis.externalprovidermaster.activefrom.lbl"></label>
                                        <div class="col-sm-5 col-md-7">
                                            <input type="text" class="form-control" name="activefrom" ng-date-object autofocus required uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                                placeholder="{{datePickerOptions.placeholder}}" ng-click="activefromPopup = { opened: true }"
                                                is-open="activefromPopup.opened" ng-model="item.Activefrom">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-7 col-md-5 control-label" for="activeto" translate="lis.externalprovidermaster.activeto.lbl"></label>
                                        <div class="col-sm-5 col-md-7">
                                            <input type="text" class="form-control" name="activeto" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                                placeholder="{{datePickerOptions.placeholder}}" ng-click="activetoPopup = { opened: true }"
                                                is-open="activetoPopup.opened" ng-model="item.Activeto">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>


            <div class="fooder-bgs">
                <div class="pull-right">
                    <button type="button"   class="draftbutton" translate="common.saveaction.lbl" ng-click="save()" ng-if="!item.isRequested"></button>

                    <button type="button" class="draftbutton text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                    <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
