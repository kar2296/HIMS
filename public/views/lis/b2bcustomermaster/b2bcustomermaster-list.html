<link href="app/css/regbilling.css" rel="stylesheet">

<div class="row ">
    <div class="col-sm-12">
        <div class="col-sm-9">
            <h4 class="mt0" translate="lis.externalprovidermaster.pagetitle1.lbl"></h4>
        </div>
        <div class="col-sm-3">
            <div class="filters">
                <button type="button" tabindex="-1" class="btn-add" ng-click="addNew()"
                    uib-tooltip="{{ 'lis.externalprovidermaster.pagetitle1.lbl' | translate}}"
                    tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <div class="drhms-list-filters">
        <div class="col-sm-4">
            <label class="col-sm-3" translate="lis.externalprovidermaster.type.lbl"></label>
            <div class="col-sm-9">
                <ui-select ng-model="currentfilter.TESTMASTERTYPId" ng-change="getList()" class="filter-combo" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.TESTMASTERTYP | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-3" translate="lis.externalprovidermaster.b2bname.lbl"></label>
            <div class="col-sm-9">
                <div class="search">
                    <input type="text" class="form-control" on-enter="getList()"
                        ng-model="currentfilter.B2BCustomerName" translate
                        translate-attr-placeholder="lis.externalprovidermaster.b2bcustomername.lbl" placeholder="">
                    <div class="drhms-search-icon"><i class="fas fa-search" aria-hidden="true"></i></div>
                </div>
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-3" translate="lis.externalprovidermaster.status.lbl"></label>
            <div class="col-sm-9">
                <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </div>
</div>
<custom-table config="vm.gridConfig"></custom-table>
<div class="container-fluid single-filter">
    <div class="fooder-bgs">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
