.radio-container input {

.radio-container input:checked ~ .checkmark {

}

.checkmark {
    position: absolute;
    top: 50%;
    -webkit-transform: translateY(-50%);
    -moz-transform: translateY(-50%);
    -ms-transform: translateY(-50%);
    -o-transform: translateY(-50%);
    transform: translateY(-50%);
    left: 0;
    height: 20px;
    width: 20px;
    background-color: #ffffff;
    -webkit-border-radius: 50%;
    -moz-border-radius: 50%;
    border-radius: 17%;
    -webkit-box-shadow: inset 0px 1px 3px 0px rgb(0 0 0 / 8%);
    -moz-box-shadow: inset 0px 1px 3px 0px rgba(0, 0, 0, 0.08);
    box-shadow: inset 0px 1px 3px 0px rgb(0 0 0 / 8%);
    border: 1px solid #042e71;
}
.radio-container input:checked ~ .checkmark:after {
    display: block;
}

.radio-container .checkmark:after {
    top: 50%;
    left: 50%;
    -webkit-transform: translate(-50%, -50%);
    -moz-transform: translate(-50%, -50%);
    -ms-transform: translate(-50%, -50%);
    -o-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
    width: 12px;
    height: 12px;
    -webkit-border-radius: 50%;
    -moz-border-radius: 50%;
    border-radius: 50%;
    background: #4ab6ea;
}
.checkmark:after {
    content: "";
    position: absolute;
    display: none;
}

                <div class="signup" align="center">
    <h2>Let's Get Started!</h2>
   <div class="login card">
       <div class="row">
        <form id="item_form" name="item_form" class="form-horizontal" role="form"> 
            <h2 class="sub-font">Sign Up</h2>
            <div class="col-sm-12">
                <div class="col-sm-12">
                    <ui-select ng-model="item.CountryId" on-select="SelectedCountry($select.selected)">
                        <ui-select-match>
                            {{$select.selected.Code | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Code.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.Country | filter: { Code: $select.search }">
                            <div ng-bind-html="lookupitem.Code | highlight: $select.search">
                            </div>
                        </ui-select-choices>
                    </ui-select>
                    <input type="text" tabindex="14" ng-keyup="keyPress($event, 0, 'contactnr', 'aadharnr')"
                    class="login-ip" id="contactnr" MINLENGTH="10" MAXLENGTH="10" size="10" value="" name="mobile" onChange="numberonly($event)"
                    onKeyUp="numberonly($event)" ng-keypress="numberonly($event)" ng-model="item.Mobile"
                    required placeholder="Mobile Number">
                </div>
                <br>
            </div>
            <div class="form-group">
                <button class="draftbutton" ng-click="sendotp()" ng-hide="CanShowVerifyOtp">Send OTP</button>
            </div>
        </form>
        
	<div class="container__overlay">
		<div class="overlay">
			<div class="overlay__panel overlay--left">
				<!-- <button class="btn" id="signIn">Sign In</button> -->
                
            <div class="col-sm-12 col-xs-12" ng-show="CanShowVerifyOtp">

			</div>

    <script>
        function mypassword() {
            var x = document.getElementById("showpassword");
            if (x.type === "password") {
                x.type = "text";
            } else {
                x.type = "password";
            }
        }
    </script>
    <script>
        /* When the user clicks on the button, 
        toggle between hiding and showing the dropdown content */
        function myFunction() {
          document.getElementById("myDropdown").classList.toggle("show");
        }
        
        // Close the dropdown if the user clicks outside of it
        window.onclick = function(event) {
          if (!event.target.matches('.dropbtn')) {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            var i;
            for (i = 0; i < dropdowns.length; i++) {
              var openDropdown = dropdowns[i];
              if (openDropdown.classList.contains('show')) {
                openDropdown.classList.remove('show');
              }
            }
          }
        }
        </script>
