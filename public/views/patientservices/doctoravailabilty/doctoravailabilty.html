<!DOCTYPE html>
<html lang="en">

<head>
    <title>Patient Services</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="app/css/patientservices.css">
</head>
<style>
    header .navbar {
        margin-bottom: 2%;
    }
  
</style>
<header>
    <nav class="navbar navbar-default0">
        <div class="header">
            <div class="navbar-header col-sm-4 col-md-3">
                <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar1">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" href="http://www.gloomsofttech.com/">
                    <img src="app/img/patientservices/logo.png" alt="logo">
                </a>
                <!-- <h2>Patient Services</h2> -->
            </div>
            <div class="head col-sm-7 col-md-6">
                <h2 class="bold text-center">PATIENT SERVICES</h2>
            </div>
            <div class="col-sm-1 col-md-3">
                <button type="button" class="btn btn-primary btn-md pull-right logout" ng-click="logout()">
                    <i class="fa fa-sign-out" aria-hidden="true"></i>Logout</button>
            </div>
            <!--/.nav-collapse -->
        </div>
        <!--/.container-fluid -->
    </nav>
</header>
<div class="container-fluid pd0">
    <div class="col-sm-12 pd0 search ps_dravailablity">
        <section class="col-sm-6">
            <form class="example">
                <!-- <h3>Search MRN</h3> -->
                <input type="text" placeholder="Search Doctors" name="search" on-enter="getList()" ng-model="currentfilter.doctorname">
                <button type="submit">
                    <i class="fas fa-search"></i>
                </button>
            </form>
        </section>
        <section class="col-sm-6">
            <form class="example">
                <!-- <h3>Search MRN</h3> -->
                <input type="text" placeholder="Search Speciality" name="search" on-enter="getList()" ng-model="currentfilter.speciality">
                <button type="submit">
                    <i class="fas fa-search"></i>
                </button>
            </form>
        </section>
    </div>
</div>

<body class="patientservices_bg">
    <table class="table table-hover table-responsive table-bordered ps_doctfilter">
        <thead class="bg-subhead ps_docthead">
            <tr>
                <th>
                    <span translate="appointment.displayboards.roomno.lbl"></span>
                </th>
                <th >
                    <span translate="appointment.displayboards.Doctorname.lbl"></span>
                </th>
                <th>
                    <span translate="appointment.displayboards.consultationtime.lbl"></span>
                    <!-- <button id="btnCancelForm" class="btn pull-right btn-xs btn-danger fa fa-close" ng-click="backToList()"></button> -->
                </th>
            </tr>
        </thead>
        <tbody class="view_disp psdrbody">
            <tr ng-repeat="item in DoctorDisplay">
                <td>
                    <span>
                        <b>{{item.RoomNo}}</b>
                    </span>
                </td>
                <td class="drfilter_name">
                    <span>
                        <b>{{item.User.Title.Description}} {{item.User.FirstName}} {{item.User.LastName}}</b>
                    </span>
                    <div class="dept" ng-if="item.Department.DepartmentName">({{item.Department.DepartmentName}})</div>
                </td>
                <td class="drfilter_time">
                    <b>
                        <span ng-if="item.Availablefrom">{{item.Availablefrom}} - {{item.Availableto}}</b>
                    </span>
                </td>
            </tr>
        </tbody>
    </table>
</body>
<div class="back clearfix">
    <img class="img-responsive" ng-click="home()" src="app/img/patientservices/redo.png">
    <img class="img-responsive ps_home" ng-click="pshome()" src="app/img/patientservices/home.png">
</div>
<div class="footer">
    <footer class="container-fluid bg-4 text-center">
        <p>&copy &nbsp
            <a href="http://www.gloomsoft.com/">Gloomsoft Technologies</a>
        </p>
    </footer>
</div>

</html>
