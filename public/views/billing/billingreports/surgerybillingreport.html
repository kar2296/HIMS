<link href="app/css/report.css" rel="stylesheet">
<style>
    #dynamic-tab button.w3-bar-item.w3-button.tablink {
        background: #e4e3e3;
        text-align: center;
        border: unset;
        border-radius: 4px;
        border-radius: 4px;
        position: relative;
        bottom: 5px;
        width: 204px;
        padding: 5px;
        color: gray;
        font-weight: 700;
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
    }
</style>
<div id="dynamic-tab">
    <div class="tabs">
        <div class="">
            <div id="Japan" class="w3-container w3-border city">
                <div class="col-sm-12 clearfix tablebox function-btn mgt10 mgb10 ">
                    <table id="reportdetails">
                        <tbody>
                            <tr ng-if="HasAccess('Surgeryreports', 'otschedulereport')">
                                <td class=""><a ng-click="otschedulereport()"><i class="lni lni-checkmark"></i></a></td>
                                </td>
                                <td class="cus-col tbl-header" ng-click="otschedulereport()"
                                    translate="reports.schedulereport.lbl"></td>


                            </tr>
                            <tr ng-if="HasAccess('Surgeryreports', 'surgeryentry')">
                                <td class=""><a ng-click="surgeryentry()"><i class="lni lni-checkmark"></i></a></td>
                                </td>
                                <td class="cus-col tbl-header" ng-click="surgeryentry()"
                                    translate="reports.surgeryentry.lbl"></td>

                            </tr>
                            <tr ng-if="HasAccess('Surgeryreports', 'surgerysummarybyprocedure')">

                                <td class=""><a ng-click="surgerysummarybyprocedure()"><i
                                            class="lni lni-checkmark"></i></a></td>
                                </td>
                                <td class="cus-col tbl-header" ng-click="surgerysummarybyprocedure()"
                                    translate="reports.surgeryprocedure.lbl"></td>

                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
