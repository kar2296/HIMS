<div class="row page-header" id="assets">
    <h4 class="col-sm-6 mt0" translate="reports.pagetitle1.lbl"></h4>
    <div class="col-sm-6">
        <button type="button" tabindex="-1" class="btn-add" ng-click="addNew()"  uib-tooltip="Dashboard" tooltip-placement="bottom">
            <i class="fa fa-home" aria-hidden="true"> </i>
        </button>

        <!-- <i class="fa fa-home" align="right" style="float: right;" ng-click="addNew()" uib-tooltip="Dashboard"
            tooltip-placement="bottom" aria-hidden="true"></i> -->
    </div>
</div>
<div class="row tablebox"  id="tablebox">
<div class="col-sm-12">
   <uib-tabset active="active" id="assettabs">
      <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)" disable="tab.canDisable">
      </uib-tab>
  </uib-tabset>
  <div ui-view class="tabview"></div>
</div>
</div>
