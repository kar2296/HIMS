<link href="app/css/report.css" rel="stylesheet">
<style>
    #dynamic-tab button.w3-bar-item.w3-button.tablink {
    background: #e4e3e3;
    text-align: center;
    border: unset;
    border-radius: 4px;
    border-radius: 4px;
    position: relative;
    bottom: 5px;
    width: 204px;
    padding: 5px;
    color: gray;
    font-weight: 700;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
}
</style>
<div id="dynamic-tab">
    <div class="tabs">
        <div class="">
            <div id="Usa" class="w3-container w3-border city">
                <div class="col-sm-12 clearfix tablebox function-btn mgt10 mgb10 ">
                    <table id="reportdetails">
                        <tbody class="">
                            <tr ng-if="HasAccess('Masterreports', 'billingservice')">
                                <td class=""><a ng-click="billingservice()"><i class="lni lni-checkmark"></i></a></td>
                                </td>
                                <td class="cus-col tbl-header" ng-click="billingservice()" 
                                    translate="reports.billingservice.lbl"></td>

                            </tr>
                            <tr ng-if="HasAccess('Masterreports', 'billingGroup')">
                                <td class=""><a ng-click="billingGroup()"><i class="lni lni-checkmark"></i></a></td>
                                </td>
                                <td class="cus-col tbl-header" ng-click="billingGroup()" translate="reports.billingGroup.lbl"></td>


                            </tr>
                            <tr ng-if="HasAccess('Masterreports', 'billingpackage')">
                                <td class=""><a ng-click="billingpackage()"><i class="lni lni-checkmark"></i></a></td>
                                <td class="cus-col tbl-header" ng-click="billingpackage()" translate="reports.billingpackage.lbl"></td>


                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
