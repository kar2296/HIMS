<link rel="stylesheet" href="app/css/drhms.css">
<style>
    button.draftbutton {
        margin-top: 27px;
    }

    div#mainresponsivetablecontrol {
        overflow: auto !important;
    }
</style>
<!--
  React bridge migration (hybrid). This screen (Billing Approval
  Request list) keeps ONE native widget: the <patientsearch> field in
  the filter row (bound to currentfilter.PatientId / selectedPatient).
  It is confirmed LIVE markup (not commented out) but has no actual
  effect on getPaymentDetailList()'s Params -- PatientId/selectedPatient
  are never read there -- a dead-but-rendered quirk preserved as-is,
  not removed. Per this migration's HYBRID rule (any live native
  widget disqualifies single-mount), it stays untouched between two
  IpBillingRequestFilterScreen mounts (part="dates" before it,
  part="actions" after it), preserving the original field order.
  A third mount, IpBillingRequestListScreen, renders the results table.

  Preserved real API calls: billing/BillingRequest/GetBillingRequests,
  billing/patientpaymentdetails/GetSystemDatetime, General/Options/getoptions.
  EditBillingRequest still opens the (still-native) app.editipbillingrequest
  modal via utl.Modal.open, dispatched here by matching PaymentDetails
  by Id rather than array index.

  Confirmed pre-existing quirk, not fixed: the getList() "From/To Date
  difference must be <= 168 hours (7 days)" guard shows a *success*
  alert (utl.Alert.showSuccessMsg) for what is actually a validation
  failure message.

  Dropped cosmetic-only behavior: the two ui-selects' ng-keyup="moveHeaderFocus('doctorid')"
  (a shared keyboard-navigation helper that jumps focus between grid
  header controls, duplicated across many pharmacy/billing screens) has
  no equivalent in the plain <select> elements used here -- it carried no
  business logic or data effect, only arrow-key focus cycling.
-->
<div class="row">
    <div class="drhms-filters">
        <div class="col-sm-12">
            <h4 translate="Billing Approval Request"></h4>
        </div>
    </div>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <react-component name="IpBillingRequestFilterScreen" props="{ reactProps: reactProps, onAction: handleReactAction, part: 'dates' }"></react-component>
        <div class="form-group col-sm-3">
            <label class="col-sm-12" translate="billing.opbilling-list.patientsearch.lbl"></label>
            <div class="col-sm-12">
                <patientsearch controlid="'pid'" patientid="currentfilter.PatientId" name="txtpatientsearch"
                    patientinfo="selectedPatient" isdisabled="" filterconfig="patientfilterconfig"></patientsearch>
            </div>
        </div>
        <react-component name="IpBillingRequestFilterScreen" props="{ reactProps: reactProps, onAction: handleReactAction, part: 'actions' }"></react-component>
    </form>
</div>
<react-component name="IpBillingRequestListScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
