<style>
    .modal.in .modal-dialog {
        width: 600px;
        margin: 30px auto;
    }

    .pull-right {
        margin-top: 20px;
    }
</style>
<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Cancel Reason"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="panel-body form-panel outer_border">
                <div class="panel panel-default">
                    <div class="table-responsive hm_dashboard top_logo">
                        <div id="dash-board">
                            <label class="col-sm-5 control-label" for="">
                                <span translate="Cancel Reason" style="padding-right:10px;"></span>:</label>
                            <div class="col-sm-5">
                                <textarea rows="3" name="remark" ng-model="item.CancelReason" maxlength="4000"
                                    style="width:100%;" class="notes-textarea" required></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- </div> -->
        </div>
        <div class="row">
            <div class="pull-right">
                <button type="button" class="draftbutton" ng-click="saveItem()"
                    translate="OK"></button>
            </div>
        </div>
    </form>
</div>
