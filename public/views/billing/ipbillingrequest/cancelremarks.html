<style>
    .modal.in .modal-dialog {
        width: 600px;
        margin: 30px auto;
    }

    .pull-right {
        margin-top: 20px;
    }
</style>
<!--
  React bridge migration (single mount): CancelRemarksController is a
  small $uibModalInstance dialog with no API calls, no lookups, no
  native-only widgets, and no utl.Validator.validate call -- a single
  <react-component> mount (CancelRemarksScreen) covers both the modal
  header (shown only when opened as a modal, matching the original
  ng-if="currentcontext.ismodal") and the textarea + OK button form.
  saveItem()'s no-op-if-empty guard is preserved unchanged.
-->
<react-component name="CancelRemarksScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
