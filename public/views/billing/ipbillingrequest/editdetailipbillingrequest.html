<link rel="stylesheet" href="app/css/drhms.css">
<style>
    .drhms-receipt span {
        font-size: 12px;
    }
</style>
<!--
  React bridge migration (hybrid, 2 mounts). The <ippatientbanner>
  directive below is a live native-only widget (not commented out), so
  per this migration's HYBRID rule it stays untouched native markup,
  sandwiched between EditDetailIpBillingRequestHeaderScreen (this mount)
  and EditDetailIpBillingRequestListScreen (results table + Approved/
  Rejected buttons, mounted below the banner).

  Preserved real API calls: billing/BillingRequest/GetBillingRequests,
  registration/patient/GetPatientById,
  Billing/BillingRequest/UpdateBillingRequest,
  Billing/PatientBills/AddPatientBills|UpdatePatientBillsFromCancel.

  Confirmed pre-existing quirks, reproduced as-is (not fixed):
  - ServiceName/Quantity/Comments inputs are always disabled in current
    usage (bill.isEditable/IsDisabled are never set); Quantity's
    ng-change="calcItem(...)" calls a function that does not exist
    anywhere in this controller -- dead, unreachable code.
  - CancelRejected() reads $scope.currentcontextedit.billrequestid,
    which is never assigned anywhere (only
    $scope.currentcontext.billrequestid is set) -- items.Id is always
    undefined on reject. This looks like a genuine pre-existing typo
    bug, left unfixed per migration policy (document, don't fix,
    unless it's a verified migration defect).
  - The row checkbox dispatches by bill.Id (natural key), not array
    index, because the original ng-repeat iterates a FILTERED array
    (BillDetails | filter:{Status:1}) over the unfiltered
    $scope.BillDetails.
-->
<react-component name="EditDetailIpBillingRequestHeaderScreen" props="{ onAction: handleReactAction }"></react-component>
<div class="row">
    <ippatientbanner patientid="currentfilter.PatientId" encounterid="currentfilter.EncounterId">
    </ippatientbanner>
</div>
<react-component name="EditDetailIpBillingRequestListScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
