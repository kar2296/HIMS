<link rel="stylesheet" href="app/css/drhms.css">
<style>
    .drhms-receipt span {
        font-size: 12px;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Bill Info"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>
<div class="col-sm-12">
    <div class="drhms-refund-table">
        <table>
            <tr>
                <td>
                    <span translate="billing.opbilling-list.billnumber.lbl"></span> :
                </td>
                <td>{{item.BillNumber}}</td>
                <td>Bill Date</td>
                <td>
                    <span>{{item.BillDateTime | date : 'dd-MMM-yyyy'}}&nbsp;
                        {{item.BillDateTime | date : 'HH:mm'}}</span>
                </td>
                <td>
                    <span translate="Bill Amount"></span>:
                </td>
                <td>{{item.BillAmount}}</td>

            </tr>
        </table>
    </div>
</div>
<div class="row">
    <div class="pull-right">
        <span>
            <button type="button" class="draftbutton" ng-click="CancelApproved()" translate="Approved">
                <!-- <span><i class="fa fa-print" aria-hidden="true"></i></span> -->
            </button>
        </span>
        <span>
            <button type="button" class="draftbutton" ng-click="CancelRejected()" translate="Rejected">
                <!-- <span><i class="fa fa-print" aria-hidden="true"></i></span> -->
            </button>
        </span>
    </div>
</div>
