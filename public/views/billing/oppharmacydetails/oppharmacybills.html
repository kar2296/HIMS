<!--
  UI-MODERNIZATION RETROFIT (Billing / "OP Pharmacy Bills" detail-summary
  modal). This fragment mounts the real modal's UI as a React component
  (OpPharmacyBillsScreen). AngularJS (oppharmacybills.js) is hollowed to a
  thin dispatcher: it still owns modalConfig/$uibModalInstance, the real
  billing/PatientBills/GetPatientBills and billing/patientreturns/
  GetPatientReturns calls, the real billing/patientbills/
  PrintOPPharmacyBillsforIP download, and cancelCallback -- React only
  renders $scope.reactProps and dispatches action names back via
  handleReactAction.

  The original template embedded <patientbanner patientid="currentcontext.pid"
  delegatefn="setBannerDelegate(cmp)">, an AngularJS component that cannot
  render inside a React tree (it independently fetches
  registration/patient/GetPatientById and renders rich patient/encounter/
  guarantor info). Following the precedent established for
  PatientKinFormScreen, the bridge now issues the same real GetPatientById
  call itself and React renders a simplified Name/MRN/Age/Gender summary
  instead. See oppharmacybills.js for the full disclosure of confirmed
  pre-existing behavior preserved as-is: the currentfilter object with no
  UI binding (dead code), the doctor_dashboard/patient_dashboard functions
  (dead code, no template reference), the summaryview flag that genuinely
  toggles the detail columns per real caller-supplied param, and the
  nested per-row detail tables (PatientBillDetails / PatientReturnDetails)
  reproduced exactly rather than flattened.
-->
<div style="width: 100%;">
    <react-component name="OpPharmacyBillsScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
</div>
