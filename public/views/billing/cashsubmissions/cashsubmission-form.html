<!--
    UI-MODERNIZATION RETROFIT (Billing / Cash Submissions Form,
    app.cashsubmission-form, CashSubmissionFormController) -- single
    <react-component> mount replacing the entire AngularJS template body
    below (everything after the shared <style> block). This screen has no
    native-only widgets (patientsearch/autosearch/etc.) and never calls
    utl.Validator.validate($scope), so it qualifies for a single-mount
    bridge like billingcounter-form and bankstatementform. AngularJS
    ui-router remains authoritative for routing/session/privilege; every
    real API call below is preserved exactly as-is via
    utl.Http.doAction/doDownload (billing/userbillingcounters/
    GetUserBillingCounters, AddUserBillingCounters,
    UpdateUserBillingCounters, PrintUpdateUserBillingCounters;
    Billing/PatientPaymentDetails/GetPatientPaymentDetails [used by BOTH
    getOPDGSalesList AND getOPDGAdvanceAdjustmentList, distinguished only
    by their Params]; Billing/PatientRefund/GetPatientRefund;
    billing/patientbills/GetPatientBills; billing/GeneralExpenses/
    GetGeneralExpensess; General/Options/getoptions).

    Confirmed pre-existing quirks/bugs, preserved exactly (documented, not
    fixed):
    - Dead vestigial Start/Close/Revert buttons: the original markup has
      #startbtnsubmit (ng-show="canShowStartBtn" ng-click="Start()"),
      #closebtnsubmit (ng-show="canShowCloseBtn" ng-click="Close()") and
      #revertbtnsubmit (ng-show="canShowRevertBtn" ng-click="Revert()"),
      copy-pasted from the genuine, fully-wired billingcounter-form.js --
      but canShowStartBtn/canShowCloseBtn/canShowRevertBtn/Start/Close/
      Revert are never declared anywhere in this controller, so these
      buttons can never render (ng-show of an undefined expression is
      always falsy) and are permanently unreachable dead UI. Omitted from
      the React markup below (they would never have been visible), noted
      here for the record.
    - Print button always visible regardless of status: canShowPrintBtn is
      hardcoded to true at controller init and is never reassigned
      anywhere in the 1663-line controller (unlike canShowApproveBtn/
      canShowAuthorizeBtn, which are genuinely status-driven in
      getCounterInfoCallback) -- so the Print button shows unconditionally,
      even before a counter record has ever loaded. Reproduced faithfully
      (always rendered, not gated on any computed condition).
    - Duplicate-fetch-on-load: loadData() calls getCounterInfoById() (when
      id>0) AND unconditionally, immediately, ALSO calls all 6 detail-list
      fetches (getOPDGSalesList/getOPDGAdvanceAdjustmentList/
      getOPDGCancelsList/getOPDGRefundsList/getOPDGOutstandingList/
      getExpenseList) using default/stale filter values from controller
      init; getCounterInfoCallback (the async response handler for
      getCounterInfoById) ALSO calls the same 6 functions again once the
      correct item.* values have loaded -- so each of the 6 lists fetches
      twice on every load. Preserved as-is (both call sites still call the
      real, unmodified fetch functions).
    - Expenses list fetched but never rendered as rows: getExpenseListCallback
      computes all TotalExp* running totals correctly, but the code that
      would push individual expense rows into $scope.Expenses is entirely
      commented out in the original, so $scope.Expenses stays [] forever.
      This is moot for the UI itself: none of PaymentOPDGSales/
      PaymentOPDGAdvance/PaymentOPDGOutstanding/PaymentOPDGCancels/
      PaymentOPDGRefunds/Expenses/DoctorPayments (the raw per-row arrays
      populated by the 6 list callbacks) are bound to any table anywhere in
      this template -- only the aggregate Total*/Net* figures they compute
      are ever displayed, in the #bannerdetails summary below. DoctorPayments
      is declared at controller init but has no fetch function at all and
      is likewise never referenced here -- a fully dead, unpopulated array.
    - Literal-English-as-translate-key quirk (angular-translate falls back
      to displaying the key text itself for a non-existent key): in the
      summary table below, NetBanking/UPI/Afford columns for Sales, all six
      Advance Adj columns, NetBanking/UPI/Afford for Refunds and Cancels,
      all six Expense columns, NetBanking/UPI/Afford for the Net row, and
      the "Shortage Amount" cell all use literal English text as their
      translate attribute instead of a real i18n key. The Cash/Card/
      Cheque-Other columns for Sales/Refunds/Cancels and the Net
      Cash/Card/Others/Submission cells correctly use real
      billing.billingcollections.* keys. Both are reproduced verbatim,
      unreconciled.
    - Borrowed-namespace quirk: the Cancelled Bills table's column headers
      use billing.billingcounter.* (singular, borrowed from the sibling
      billingcounter-form/-list screens) rather than any
      billing.cashsubmission.* equivalent -- reproduced verbatim.
    - Hardcoded literal status text: item.CounterStatus is set to the bare
      strings 'Running'/'Closed'/'Submitted'/'Approved'/'Authorized' in
      getCounterInfoCallback (not translated) -- reproduced verbatim.
    - Denominations are read-only here (every field, including the count
      input, is ng-disabled="true"), unlike the editable version on
      billingcounter-form -- this screen is a review/closing screen, not an
      entry screen. CalculateTotal()'s ng-change on the denomination count
      input is consequently unreachable in practice; CalculateNetTotal()
      (which drives item.DifferenceAmount) only ever runs once, right after
      denominations are populated from the loaded record.
    - OpeningBalance/OpeningRemarks/the Counter select are conditionally
      disabled via item.OpenedStatus, and ClosingRemarks via
      item.ClosedStatus -- both become true once an existing counter record
      loads (this form has no "add new" entry point; the list screen's grid
      only offers "edit"), so in practice these end up disabled after data
      loads, matching original behavior faithfully (not hardcoded disabled).
    - A separate, never-rendered $scope.UserName (distinct from
      item.UserName, which the header actually shows) is repeatedly
      reassigned inside the Sales/AdvanceAdj list-callback loops for no
      referenced purpose -- write-only dead state, not reproduced.
-->
<react-component name="BillingCashSubmissionFormScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
