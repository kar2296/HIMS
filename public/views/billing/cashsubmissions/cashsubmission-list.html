<style>
    .form-group {
        height: 40px;
    }
</style>
<div class="row">
    <h4 class="col-sm-5 mt0" translate="billing.cashsubmissions.pagetitle.lbl"></h4>
    <div class="col-sm-7">
        <div class="filters">
            <button class="drhms-billing-btn drhms-previousbill-btn" ng-click="openAdvancedFilter()"
                uib-tooltip="{{ '  clinicalmaster.serviceitem-list.filter-tooltip.lbl' | translate }}"
                tooltip-placement="bottom">
                <i class="fas fa-search" aria-hidden="true"></i>
                <!-- <span translate="clinicalmaster.serviceitem-list.filter.lbl"></span> -->
            </button>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-sm-4 form-group">
        <label class="col-sm-4" for="username" translate="billing.cashsubmissions.username.lbl"></label>
        <div class="col-sm-8">
            <autosearch itemid="currentfilter.UserId" iteminfo="" rowdata="" config="vm.usercontrolconfig"
                onenter="onEnter(data)" itemchange="getList()"></autosearch>
        </div>
    </div>
    <div class="col-sm-4 form-group">
        <label class="col-sm-4" for="billingcounter" translate="billing.cashsubmissions.billingcounters.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.BillingCounterId" name="billingcounter" ng-change="getList()">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.BillingCounter | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="col-sm-4 form-group">
        <label class="col-sm-4" translate="billing.cashsubmissions.documentnumber.lbl"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.DocumentNumber"
                placeholder="Document No#">
        </div>
    </div>
    <div class="col-sm-4 form-group">
        <label class="col-sm-4" for="documentdate" translate="billing.cashsubmissions.documentdate.lbl"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" name="documentdate" ng-change="getList()"
                datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="documentdatePopup = { opened: true }" is-open="documentdatePopup.opened"
                ng-model="currentfilter.DocumentDate">
        </div>
    </div>
    <div class="col-sm-4 form-group">
        <label class="col-sm-4" for="department" translate="billing.cashsubmissions.departments.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.DepartmentId" ng-change="getList()" name="department" required>
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="col-sm-4 form-group">
        <label class="col-sm-4" for="billingcounterstatus"
            translate="billing.cashsubmissions.documentstatus.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.BillingCounterStatusId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 8 : 0}}
                    <span ng-if="$select.selected.Text.length>8">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.BillingCounterStatus | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
