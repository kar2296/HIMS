<style>
    .form-group {
        height: 40px;
    }
</style>

<!--
UI-MODERNIZATION RETROFIT (Billing / Cash Submissions List,
app.cashsubmission-list, CashSubmissionListController). HYBRID bridge:
full investigation of this 262-line controller and 100-line template
confirmed no utl.Validator.validate($scope) call, but the User filter
field uses the real, native <autosearch> directive (a native-only
shared widget backed by vm.usercontrolconfig's live
SystemSettings/User/GetUsers search) which cannot run inside a React
subtree -- so per the established single-mount criterion this screen
does NOT qualify for a single mount. The <autosearch> element and its
wrapping markup are kept exactly as-is, native AngularJS; TWO
<react-component> mounts replace everything else: the page header +
advance-filter button (BillingCashSubmissionHeaderScreen), and the
remaining filter fields + results table + pagination
(BillingCashSubmissionListScreen). AngularJS remains authoritative for
the real billing/userbillingcounters/GetBillingCounters list API call,
General/Options/getoptions lookup call, the genuinely-live
openAdvancedFilter() modal (utl.Modal.openDynamicForm, untouched --
not reimplemented here), and handleEvents() state transitions to
app.cashsubmission-form. The native <autosearch itemid="currentfilter.UserId">
continues to two-way-bind $scope.currentfilter.UserId and call the
real itemchange="getList()" exactly as before; React never touches
UserId. React only renders reactProps and dispatches action names via
handleReactAction; no business logic is reimplemented in React.

Confirmed pre-existing quirks/dead-code, preserved exactly (not
"fixed"):
- The advance-filter button's tooltip binds
  "{{ '  clinicalmaster.serviceitem-list.filter-tooltip.lbl' | translate }}"
  -- note the two leading spaces INSIDE the string literal, making
  this an already-malformed translation key that cannot match any
  real i18n entry (unlike the same borrowed-key quirk seen elsewhere,
  which at least matched a real, if wrong, key). Reproduced verbatim
  as a literal tooltip string, including the leading spaces. The
  button's label <span translate="clinicalmaster.serviceitem-list.filter.lbl">
  was already HTML-commented out in the original -- the button has
  never shown visible text, icon only.
- <autosearch>'s onenter="onEnter(data)" references an $scope.onEnter
  that does not exist anywhere in this controller -- dead/broken
  wiring, left exactly as-is since the native element is untouched.
- The grid's only action is "edit" (pencil icon, unconditional --
  unlike the sibling billingcounter-list, there is no status-based
  show/hide gating here); there is no view or delete affordance.
- vm.usercontrolconfig's formatselecteduser() references
  $scope.item.UserTypeId, but this controller has no $scope.item
  anywhere -- a latent dead-code path inside the (genuinely used)
  autosearch config, reachable only if a result is ever selected via
  that specific branch; left untouched since it lives entirely inside
  the native autosearch directive's own config object.
-->
<react-component name="BillingCashSubmissionHeaderScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
<div class="row">
    <div class="col-sm-4 form-group">
        <label class="col-sm-4" for="username" translate="billing.cashsubmissions.username.lbl"></label>
        <div class="col-sm-8">
            <autosearch itemid="currentfilter.UserId" iteminfo="" rowdata="" config="vm.usercontrolconfig"
                onenter="onEnter(data)" itemchange="getList()"></autosearch>
        </div>
    </div>
<react-component name="BillingCashSubmissionListScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
</div>
