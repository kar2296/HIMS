<!--
  React bridge migration (hybrid). Native <patientsearch> stays
  untouched (no patientchange callback attribute in the original --
  selecting a patient alone does not auto-refetch; only the Fetch
  button calls getList()). No utl.Validator.validate call in this
  controller.

  Migrated via 3 <react-component> mounts:
    1. PhysioTreatmentPlanFilterScreen (part: 'dates') - From/To Bill
       Date, BEFORE the native <patientsearch> in the same row.
    2. PhysioTreatmentPlanFilterScreen (part: 'actions') - Status
       select + Fetch button, AFTER the native <patientsearch>.
    3. PhysioTreatmentPlanListScreen - both plain ng-repeat results
       tables (no custom-table/ui-grid, no column sort). Table 1
       (TreatmentPlan) edit icon dispatches viewDetails -> loads that
       plan's detail rows into Table 2. Table 2
       (TreatmentPlanDetails) edit icon dispatches execute -> opens
       the app.treatmentplanexecution modal (validator-gated,
       deferred to the high-risk queue, untouched).

  Preserved real API calls (unchanged):
  emr/TreatmentPlan/GetTreatmentPlans, emr/TreatmentPlanDetail/GetTreatmentPlanDetails,
  General/Options/getoptions.
-->
<link rel="stylesheet" href="app/css/drhms.css">
<style>
    button.draftbutton {
        margin-top: 27px;
    }
    
    div#mainresponsivetablecontrol {
        overflow: auto !important;
    }
</style>
<div class="row">
    <div class="drhms-filters">
        <div class="col-sm-12">
            <h4 translate="Treatment Plan Execution"></h4>
        </div>
    </div>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <react-component name="PhysioTreatmentPlanFilterScreen" props="{ part: 'dates', reactProps: reactProps, onAction: handleReactAction }"></react-component>
        <div class="form-group col-sm-3">
            <label class="col-sm-12" translate="billing.opbilling-list.patientsearch.lbl"></label>
            <div class="col-sm-12">
                <patientsearch controlid="'pid'" patientid="currentfilter.PatientId" name="txtpatientsearch" patientinfo="selectedPatient" isdisabled="" filterconfig="patientfilterconfig"></patientsearch>
            </div>
        </div>
        <react-component name="PhysioTreatmentPlanFilterScreen" props="{ part: 'actions', reactProps: reactProps, onAction: handleReactAction }"></react-component>
    </form>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <react-component name="PhysioTreatmentPlanListScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
    </form>
</div>
