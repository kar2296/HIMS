<!--
  React bridge migration (hybrid). Native <patientsearch> stays
  untouched (no patientchange callback attribute -- no auto-refetch;
  only the Fetch button calls getList()). No utl.Validator.validate
  call in this controller.

  Migrated via 3 <react-component> mounts:
    1. TreatmentPlanBillingFilterScreen (part: 'dates') - From/To
       Bill Date, BEFORE the native <patientsearch>.
    2. TreatmentPlanBillingFilterScreen (part: 'actions') - Status
       select + Fetch button, AFTER the native <patientsearch>.
    3. TreatmentPlanBillingListScreen - both plain ng-repeat results
       tables. Table 1 (TreatmentPlan) has 2 edit icons per row
       (viewDetails -> loads plan details into Table 2; updateBills ->
       opens the app.updatetreatmentplanbilling modal if unpaid, or
       shows "Partially Paid" -- both branches of getDetailsCallback
       preserved). The "Treatment Name" column is commented out/dead
       in the original (both header and cell) -- not rendered here
       either. Table 2 (TreatmentPlanDetails) edit icon dispatches
       detailbills -> opens the same modal for that session if
       unpaid, or shows "Already Paid...". The
       app.updatetreatmentplanbilling modal (4971+690 lines,
       validator-gated) is deferred to the high-risk queue, untouched.

  Preserved real API calls (unchanged):
  emr/TreatmentPlan/GetTreatmentPlans, emr/TreatmentPlanDetail/GetTreatmentPlanDetails,
  General/Options/getoptions.
-->
<link rel="stylesheet" href="app/css/drhms.css">
<style>
    button.draftbutton {
        margin-top: 30px;
    }
    
    div#mainresponsivetablecontrol {
        overflow: auto !important;
    }
    
    div#mainresponsivetablecontrol {
        min-height: 34vh;
        margin-bottom: 10px;
    }
</style>
<div class="row">
    <div class="drhms-filters">
        <div class="col-sm-12">
            <h4 translate="Treatment Plan Billing"></h4>
        </div>
    </div>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <react-component name="TreatmentPlanBillingFilterScreen" props="{ part: 'dates', reactProps: reactProps, onAction: handleReactAction }"></react-component>
        <div class="form-group col-sm-3">
            <label class="col-sm-12" translate="billing.opbilling-list.patientsearch.lbl"></label>
            <div class="col-sm-12">
                <patientsearch controlid="'pid'" patientid="currentfilter.PatientId" name="txtpatientsearch" patientinfo="selectedPatient" isdisabled="" filterconfig="patientfilterconfig"></patientsearch>
            </div>
        </div>
        <react-component name="TreatmentPlanBillingFilterScreen" props="{ part: 'actions', reactProps: reactProps, onAction: handleReactAction }"></react-component>
    </form>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <react-component name="TreatmentPlanBillingListScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
    </form>
</div>
