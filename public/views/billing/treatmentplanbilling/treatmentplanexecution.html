<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Manage Treatment Plan"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="backToList()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">

        <div class="form-group col-sm-12">
            <div class="col-sm-6">
                <label class="col-sm-12 control-label" for="fromdate" translate="Date"></label>
                <div class="col-sm-12">
                    <input type="text" class="form-control" name="fromdate" ng-date-object datetime-picker="{{datePickerOptions.dateTimeFormat}}" placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }" is-open="fromdatePopup.opened" ng-model="item.PlanScheduleDate">
                </div>
            </div>
            <div class="col-sm-6">
                <label class="col-sm-12 control-label" translate="Amount"></label>
                <div class="col-sm-12">
                    {{item.ServicePrice}}
                </div>
            </div>
        </div>
        <div class="form-group col-sm-12">
            <div class="col-sm-6">
                <label class="col-sm-12 control-label" for="notetype" translate="Treatment Name"></label>
                <div class="col-sm-12">
                    <autosearch itemid="item.ServiceItemId" iteminfo="item.SelectedItem" rowdata="item" config="vm.serviceitemcontrolconfig" itemchange="serviceChanged($index,item)" class="inputsearchlogo" isrequired="true">
                    </autosearch>
                </div>
            </div>
            <div class="col-sm-6">
                <label class="col-sm-12 control-label" translate="Payment Status"></label>
                <div class="col-sm-12">
                    <span ng-if="!item.IsPaid">Pending</span>
                    <span ng-if="item.IsPaid">Completed</span>
                </div>
            </div>
        </div>
        <div class="form-group col-sm-12">
            <label class="col-sm-12 control-label" for="starttime" translate="Start Time"></label>
            <div class="col-sm-12">
                <uib-timepicker name="starttime" ng-model="item.PlanStartTime" ng-time-object required>
                </uib-timepicker>
            </div>
        </div>
        <div class="form-group col-sm-12 ">
            <label class="col-sm-12 control-label " for="endtime" translate="End Time "></label>
            <div class="col-sm-12 ">
                <uib-timepicker name="endtime" ng-model="item.PlanEndTime " ng-time-object required>
                </uib-timepicker>
            </div>
        </div>
        <div class="form-group col-sm-12">
            <label class="col-sm-12 control-label" for="comments" translate="Treatment Comments"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" ng-model="item.TreatmentInstructions" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-12">
            <label class="col-sm-12 control-label" for="comments" translate="Additional Comments"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" ng-model="item.AdditionalComments" placeholder="">
            </div>
        </div>
    </form>
</div>
<div class="row">
    <div class="pull-right">
        <button type="button" id="btnsubmit" class="draftbutton" translate="Complete" ng-click="complete()"></button>
    </div>
</div>
