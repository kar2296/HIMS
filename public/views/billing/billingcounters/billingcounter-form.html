<!--
UI-MODERNIZATION RETROFIT (Billing / Billing Counter Form (cash counter
start/close/revert/save/submit), app.billingcounter-form,
BillingCounterFormController). Single-mount React replacement: full
investigation of this 949-line controller and this 601-line template
confirmed no native-only widgets and no utl.Validator.validate($scope) call
anywhere -- the real <form id="item_form"> name is never referenced for
validation -- so per the established single-mount criterion this screen is
rebuilt as ONE <react-component>, not a hybrid split. AngularJS remains
authoritative for every real API call
(billing/userbillingcounters/GetUserBillingCounters,
billing/userbillingcounters/GetBillingCounters,
billing/userbillingcounters/AddUserBillingCounters|UpdateUserBillingCounters,
billing/userbillingcounters/PrintUpdateUserBillingCounters,
billing/patientpaymentdetails/GetPatientPaymentDetails,
billing/patientrefund/GetPatientRefund,
billing/GeneralExpenses/GetGeneralExpensess,
billing/LHRCVoucher/GetLHRCVouchers, General/Options/getoptions), the real
Start/Close/Revert/Submit confirm-dialog chains
(utl.Dialog.confirmMessage -> onStartConfirmed/onCloseConfirmed/
onRevertConfirmed/onSubmitConfirmed -> saveItem), the Close-button's
receipts/LHRC/vouchers/refunds aggregation chain that computes
ClosingBalance/Cash/Card/Cheque before saving, and every denomination
total calculation (CalculateTotal/CalculateNetTotal). React only renders
reactProps and dispatches action names via handleReactAction; no business
logic is reimplemented in React. This is the real, fully-wired sibling of
billing/bankstatement/bankstatementform.js's dead canShowStartBtn /
canShowCloseBtn / canShowRevertBtn / canShowSaveBtn / canShowSubmitBtn /
canShowPrintBtn / CounterRunning flags (bankstatementform.js appears to
have been copy-pasted from this controller, leaving those flags declared
but never wired there) -- here they are genuinely live and drive real
button visibility via applyVisibilityRules()/getCounterInfoCallback()/
checkCounterStatusCallback().

Confirmed pre-existing quirks, preserved exactly (not "fixed"):
- The Start/Close/Revert buttons have no translate attribute at all --
  "Start"/"Close"/"Revert" are hardcoded literal English text in the
  original markup, not i18n-driven. Reproduced verbatim as literals.
- The Print button uses translate="Print" -- a literal English string used
  as a non-existent i18n key, which angular-translate's missing-key
  fallback rendered as the literal key text (same quirk confirmed on
  bankstatementform.js's Print button). Reproduced verbatim.
- The Back button carries a real angular-hotkeys "alt+b" shortcut
  (hotkey="{'alt+b': backToList}") in the original markup. An Angular
  directive attribute cannot run on a React-rendered button, so the
  shortcut is reproduced with an equivalent global keydown listener
  (Alt+B, case-insensitive) dispatching the same 'back' action -- a
  faithful behavioral reproduction, not a reimplementation of business
  logic.
- The Department <ui-select> and the Opening/Closing Date fields all carry
  a literal ng-disabled="true" -- always read-only display fields,
  regardless of counter state. Reproduced as always-disabled.
- getCounterInfoById()'s else-branch call to applyVisibilityRules() is
  confirmed unreachable in practice: its only caller, loadData(), only
  invokes getCounterInfoById() when currentcontext.id > 0, which always
  takes the if-branch (the real HTTP call), never the else. Not a
  functional issue -- noted for completeness, not reproduced as a
  no-op path.
-->
<react-component name="BillingCounterFormScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
