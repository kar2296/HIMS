<!--
UI-MODERNIZATION RETROFIT (Billing / Bank Statement Form, app.bankstatementform,
bankstatementFormController). Single-mount React replacement: full investigation
of this 906-line controller and this 346-line template confirmed no native-only
widgets (<patientsearch>, <autosearch>, etc.) and no utl.Validator.validate($scope)
call anywhere -- the real <form id="item_form"> name is never referenced for
validation ($scope.item_form is never read) -- so per the established
single-mount criterion this screen is rebuilt as ONE <react-component>, not a
hybrid split. AngularJS remains authoritative for every real API call
(billing/patientpaymentdetails/GetPatientPaymentDetails,
billing/patientrefund/GetPatientRefund, billing/GeneralExpenses/GetGeneralExpensess,
billing/LHRCVoucher/GetLHRCVouchers, billing/bankstatements/DatesAlreadyExist,
billing/bankstatements/AddBankStatements|UpdateBankStatements,
billing/bankstatements/GetBankStatements,
billing/bankstatements/PrintUpdateBankStatements via utl.Http.doDownload,
General/Options/getoptions, SystemSettings/User/GetUsers), the real
Submit() -> checkDatesAlreadyExist() -> utl.Dialog.confirmMessage() ->
onSubmitConfirmed() -> saveItem() confirmation-and-save chain, and every
totals/aggregation calculation (StatementAmt, CalculateTotal,
CalculateNetTotal, CalculateLoadedData). React only renders reactProps and
dispatches action names via handleReactAction; no business logic is
reimplemented in React.

Confirmed pre-existing quirks, preserved exactly (not "fixed"):
- The Print button uses translate="Print" -- a literal English string used
  directly as the translate key, not a dotted i18n key -- and no "Print" key
  exists anywhere in public/i18n. angular-translate's missing-key fallback
  displays the key itself, so the button coincidentally still reads "Print".
  Reproduced verbatim as a hardcoded literal, not looked up via i18n.
- The From/To Bill Date inputs each carry TWO ng-disabled attributes in the
  original markup (ng-disabled="currentfilter.DisableFromBillDate" followed
  later by a duplicate ng-disabled="currentcontext.id" on the same element).
  Per HTML's duplicate-attribute parsing rule the first attribute wins, so
  the real disable condition is currentfilter.DisableFromBillDate /
  DisableToBillDate, not currentcontext.id -- those two flags are only ever
  set true together when loading an existing statement (LoadOldData), so in
  practice they agree for the view case, but after a fresh Submit() succeeds
  (currentcontext.id becomes truthy from the save response while
  DisableFromBillDate/DisableToBillDate remain false) the date fields stay
  enabled even though the screen has moved to its "submitted" state. This
  latent quirk is reproduced verbatim: date-field disabled state below is
  bound to currentfilter.DisableFromBillDate / DisableToBillDate, exactly as
  the original DOM (post duplicate-attribute resolution) actually behaves.
- $scope.canShowStartBtn / canShowCloseBtn / canShowRevertBtn /
  canShowSaveBtn / canShowSubmitBtn / canShowPrintBtn / CounterRunning are
  declared in the controller but never read anywhere (controller or
  template) -- confirmed dead flags, not wired to any button. Not
  reproduced in React since nothing in the live UI ever consumed them.
- getListCallback's cancelled-receipt branch (ReceiptStatusId == 3)
  references an undefined variable `usercounterreceipt` (almost certainly
  meant to be `patientpaymentdetail`) and pushes onto
  $scope.UserCounterCancelledReceipts, which is never initialized for a NEW
  statement (only ever assigned when loading an existing one via
  getLoadOldDataCallback) -- a genuine pre-existing ReferenceError/
  TypeError class of bug on that rarely-hit code path. Left untouched, not
  fixed, per the migration's rule against correcting unverified business
  logic; this bug is independent of the migration and reproduces exactly
  as before since that function is not reimplemented in React.
- common.applyaction.lbl (the "Fetch" button shown only when creating a new
  statement) resolves to "Fetch", not "Apply" -- reproduced verbatim, not
  renamed.
-->
<react-component name="BillingBankStatementFormScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
