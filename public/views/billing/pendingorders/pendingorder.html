<!--
  UI-MODERNIZATION RETROFIT (Billing / "Pending Order" picker modal).
  This fragment mounts the real modal's UI as a React component
  (PendingOrderPickerScreen). AngularJS (pendingorder.js) is hollowed to a
  thin dispatcher: it still owns modalConfig/$uibModalInstance, the real
  emr/patientorder/GetPatientOrders call, and every real function
  (IsOrderSelected, toggleCanShowDetails, loadorders, cancelCallback) --
  React only renders $scope.reactProps and dispatches action names back
  via handleReactAction. See pendingorder.js for the full disclosure of
  confirmed pre-existing behavior preserved as-is (the Priority/Status
  filter that is populated but has no UI control to change it, the
  two-loop summary/detail layout, and the "select can never be unchecked"
  IsOrderSelected bug). The original markup also carried an unreferenced
  <script type="text/ng-template" id="patientaddress.html"> block --
  confirmed unused by reading the controller in full -- dropped here with
  no visible effect.
-->
<div style="width: 100%;">
    <react-component name="PendingOrderPickerScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
</div>
