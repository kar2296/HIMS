<!--
  UI-MODERNIZATION RETROFIT (Billing / OP Billing Collections,
  app.opbillingcollections, billingcollectionsController). Mounts the
  real screen's UI as a single React component (BillingBillingCollectionsScreen).
  AngularJS is hollowed to a thin dispatcher -- it still owns the real
  billing/patientbills/GetPatientBills and Billing/PatientRefund/
  GetPatientRefund calls, the 3-day date-range validation in getList(),
  and every Sales/Cancels/Refunds row + total computation. React only
  renders reactProps and dispatches action names via handleReactAction.

  REACHABILITY: app.opbillingcollections has no static $state.go/ui-sref
  reference anywhere in the codebase (confirmed via search); Billing has
  no static sidebar-menu JSON like other modules, so navigation here is
  presumed DB-driven via SystemSettings/Control/GetControls, consistent
  with the policy already applied to LHRC Voucher and other Billing
  screens with the same profile.

  Confirmed pre-existing markup oddity, NOT reproduced structurally: the
  original template wrapped its content in a stray, invalid nested
  <!DOCTYPE html><html><head>...</head><body>...</body> structure (with
  a mismatched extra </div> after </body> and no closing </html>) inside
  this AngularJS partial. Browsers silently tolerate/flatten this: it
  renders correctly today purely because HTML parsers are lenient, not
  by design. JSX requires valid structure anyway, so this fragment is
  not reproduced -- see BillingBillingCollectionsScreen for the full
  disclosure of every other confirmed pre-existing quirk (the "Other
  Cancelled" total binding bug, the header/cancellation-flag stickiness
  bug, the dead Payment Type filter, and the hardcoded page title).
-->
<react-component name="BillingBillingCollectionsScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
