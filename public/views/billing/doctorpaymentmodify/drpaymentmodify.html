<style>
    .custom-popup-wrapper {
        max-height: 250px;
        overflow: auto;
        position: absolute;
        margin-left: -186px;
        z-index: 9999;
        max-width: 600px;
    }

    .custom-popup-wrapper {
        right: 0;
    }
</style>
<link rel="stylesheet" href="app/css/drhms.css">
<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="billing.drpaymentmodify.pagetitle.lbl"></h4>
    <div class="col-sm-6">
        <div class="filters">
            <div class="search">
                <autosearch controlid="'DoctorId'" itemid="item.DoctorId" iteminfo="" rowdata="" name="'doctor'"
                    config="vm.doctorcontrolconfig" placeholder="'Doctor'" candisable="SaveCompleted"
                    isrequired="false"></autosearch>
                <i class="fas fa-search" aria-hidden="true"></i>
            </div>
            <div class="search">
                <patientsearch id="pid" patientid="currentfilter.PatientId" patientinfo="selectedPatient"
                    filterconfig="patientfilterconfig" tabindex="-1" patientchange="patientChange()"
                    candisable="canDisablePatientSearch()"></patientsearch>
                <i class="fas fa-search" aria-hidden="true"></i>
            </div>

        </div>
    </div>
</div>

<div class="">
    <div class="drhms-table-top-header">
        <div class="drhms-table-head-border">
            <div class="col-sm-12">
                <label class="col-sm-4" translate="billing.drpaymentmodify.servicename.lbl"></label>
                <div class="col-sm-8">
                    <autosearch controlid="'ServiceId'" itemid="item.ServiceId" iteminfo="" rowdata="" name="'doctor'"
                        config="vm.servicecontrolconfig" placeholder="'Service'" candisable="SaveCompleted"
                        isrequired="false">
                    </autosearch>
                </div>
            </div>
            <div class="col-sm-12">
                <label class="col-sm-4" translate="billing.drpaymentmodify.billno.lbl"></label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" name="filter_code" on-enter="getList()"
                        ng-model="currentfilter.BillNumber" translate
                        translate-attr-placeholder="billing.drpaymentmodify.billno.lbl">
                </div>
            </div>
        </div>
        <div class="drhms-table-head-border">
            <div class="col-sm-12">
                <label class="col-sm-4" translate="billing.claimsubmission-list.fromdate.lbl"></label>
                <div class="col-sm-8">
                    <div class="datepicker">
                        <input type="text" class="form-control" tabindex="-1" name="fromdate" ng-date-object
                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                            placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                            is-open="fromdatePopup.opened" ng-model="currentfilter.FromBillDate" ng-change="getList()"
                            id="disabledInput">
                        <i class="fa fa-calendar" aria-hidden="true"></i>
                    </div>
                    <!-- <input type="text" class="form-control" name="FromBillDate" ng-date-object
                        date-picker="{{datePickerOptions.dateFormat}}" datepicker-append-to-body="true"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="FromBillDatePopup = { opened: true }"
                        is-open="FromBillDatePopup.opened" ng-model="currentfilter.FromBillDate"> -->
                </div>
            </div>
            <div class="col-sm-12">
                <label class="col-sm-4" translate="billing.claimsubmission-list.todate.lbl"></label>
                <div class="col-sm-8">
                    <div class="datepicker">
                        <input type="text" class="form-control" tabindex="-1" name="ToDate" ng-date-object
                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                            placeholder="{{datePickerOptions.placeholder}}" ng-click="ToDatePopup = { opened: true }"
                            is-open="ToDatePopup.opened" ng-model="currentfilter.ToBillDate" ng-change="getList()"
                            id="disabledInput">
                        <i class="fa fa-calendar" aria-hidden="true"></i>
                    </div>
                    <!-- <input type="text" class="form-control" name="ToBillDate" ng-date-object
                        date-picker="{{datePickerOptions.dateFormat}}" datepicker-append-to-body="true"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="ToBillDatePopup = { opened: true }"
                        is-open="ToBillDatePopup.opened" ng-model="currentfilter.ToBillDate"> -->
                </div>
            </div>
        </div>
        <div class="drhms-table-head-border">
            <div class="col-sm-12">
                <label class="col-sm-4" translate="billing.drpaymentmodify.billingtype.lbl"></label>
                <div class="col-sm-8">
                    <ui-select ng-model="currentfilter.BillTypeId" name="BillTypeId">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.BillType | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="col-sm-12">
                <a ng-click="clearfilter()">
                    <i class="fa fa-refresh" style="font-size:25px;color:#0066ff;margin: 0px 25px;"
                        uib-tooltip="{{ 'common.resetaction.lbl' | translate}}" tooltip-placement="bottom"></i>
                </a>
                <button id="btnCancelForm" type="button" class="draftbutton" ng-click="getList()"
                    translate="common.applyaction.lbl">
                </button>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
