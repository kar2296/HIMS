<!--
  React bridge migration (hybrid): this screen keeps THREE native AngularJS
  widgets untouched because they cannot be safely reproduced in React --
  the DoctorId <autosearch> and <patientsearch> in the page-header row, and
  the ServiceId <autosearch> in the first filter box below. Everything else
  is mounted as React via <react-component> siblings of those natives:
    - DrPaymentModifyBillNoScreen: the Bill No input, sibling of the native
      ServiceId autosearch inside the same .drhms-table-head-border box.
    - DrPaymentModifyFilterScreen: renders BOTH the Dates box and the
      Billing Type/Reset/Fetch box (neither has a native dependency),
      preserving the original 3-box grid layout as two sibling divs.
    - DrPaymentModifyListScreen: the results table. vm.gridConfig/
      <custom-table> was confirmed to be plain presentational data (no
      native ui-grid dependency -- cross-checked against app.js's
      customTableController and the billingcounter-list.html precedent).

  Preserved real API calls (unchanged): billing/patientbilldetails/
  GetPatientBillDetails, registration/patient/GetPatientById,
  SystemSettings/User/GetUsers (native doctor autosearch),
  ClinicalMaster/ServiceItem/GetServiceItems (native service autosearch),
  General/Options/getoptions (BillType lookup).

  Confirmed pre-existing quirks/bugs, reproduced as-is (not fixed):
    - $scope.DrShareTotal is computed in getListCallback but never
      rendered anywhere -- dead state, left uncomputed-for in React.
    - The uib-pagination footer was dead: vm.gridConfig.pagerObj is never
      assigned by this controller or by customTableController, and
      getList() always requests PageContext.PageSize: -1 (the full
      result set every time) -- there was never a working pager. Omitted
      here rather than rendering a non-functional control.
    - currentfilter.ServiceId/ServiceName (set by formatselectedserviceitem)
      are dead duplicate state -- the real value flows through
      item.ServiceId via the native ServiceId autosearch's own binding,
      which getList() actually reads.
    - clearfilter() still manipulates the native DoctorId autosearch's DOM
      input directly via jQuery ($("#DoctorId")) -- untouched, since it
      targets the native widget that remains in AngularJS.
    - canDisablePatientSearch() and patientfilterconfig, referenced on the
      native <patientsearch> tag's attributes, are not defined anywhere in
      the controller -- pre-existing dead references inside the untouched
      native widget, left as-is.
    - The Bill No field and From/To Date fields auto-fetch on change
      (matching the original's on-enter/ng-change="getList()"), but the
      Billing Type select does NOT auto-fetch -- it has no ng-change in
      the original and requires the explicit Fetch button, reproduced
      verbatim as an inconsistency.
    - The grid's Doctor Name column borrows the translate key
      registration.checkedinpatients.drname.lbl instead of its own
      (commented-out) billing.drpaymentmodify.drname.lbl key -- both
      happen to resolve to "Doctor Name", reproduced verbatim.
    - The button labelled "Fetch" uses translate key
      common.applyaction.lbl (a naming mismatch: "apply" resolves to
      "Fetch") -- reproduced verbatim.
-->
<style>
    .custom-popup-wrapper {
        max-height: 250px;
        overflow: auto;
        position: absolute;
        margin-left: -186px;
        z-index: 9999;
        max-width: 600px;
    }

    .custom-popup-wrapper {
        right: 0;
    }
</style>
<link rel="stylesheet" href="app/css/drhms.css">
<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="billing.drpaymentmodify.pagetitle.lbl"></h4>
    <div class="col-sm-6">
        <div class="filters">
            <div class="search">
                <autosearch controlid="'DoctorId'" itemid="item.DoctorId" iteminfo="" rowdata="" name="'doctor'"
                    config="vm.doctorcontrolconfig" placeholder="'Doctor'" candisable="SaveCompleted"
                    isrequired="false"></autosearch>
                <i class="fas fa-search" aria-hidden="true"></i>
            </div>
            <div class="search">
                <patientsearch id="pid" patientid="currentfilter.PatientId" patientinfo="selectedPatient"
                    filterconfig="patientfilterconfig" tabindex="-1" patientchange="patientChange()"
                    candisable="canDisablePatientSearch()"></patientsearch>
                <i class="fas fa-search" aria-hidden="true"></i>
            </div>

        </div>
    </div>
</div>

<div class="">
    <div class="drhms-table-top-header">
        <div class="drhms-table-head-border">
            <div class="col-sm-12">
                <label class="col-sm-4" translate="billing.drpaymentmodify.servicename.lbl"></label>
                <div class="col-sm-8">
                    <autosearch controlid="'ServiceId'" itemid="item.ServiceId" iteminfo="" rowdata="" name="'doctor'"
                        config="vm.servicecontrolconfig" placeholder="'Service'" candisable="SaveCompleted"
                        isrequired="false">
                    </autosearch>
                </div>
            </div>
            <react-component name="DrPaymentModifyBillNoScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
        </div>
        <react-component name="DrPaymentModifyFilterScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
    </div>
</div>
<div class="row">
    <react-component name="DrPaymentModifyListScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
</div>
