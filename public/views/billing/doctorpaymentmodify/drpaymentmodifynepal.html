<!--
  React bridge migration (hybrid): the page-header row's native DoctorId
  <autosearch> and the banner table's native <patientsearch> (row 1, col 2)
  remain untouched, live, native AngularJS widgets -- this screen does not
  qualify for a single-mount migration.

  Table-safe mount technique: a bare <react-component> cannot safely sit as
  a direct <tr> child (the HTML5 parser's "in table" insertion mode would
  foster-parent an unrecognized element out of the table structure), so
  every native <td> wrapper below is kept untouched and a <react-component>
  is nested INSIDE it, replacing only the input/control content. One shared
  component (DrPaymentModifyNepalFilterFieldScreen), keyed by a `field`
  prop, is mounted six times rather than shipping six near-identical files.

  Preserved real API calls (unchanged): Visit/Visit/GetEncounters (getList,
  Key15=1/Key17=FrmDate/Key18=ToDate/Key5=DoctorId/Key4=PatientId/
  Key32=BillTypeId), General/Options/getoptions (BillType lookup).

  Confirmed pre-existing quirks, reproduced as-is (not fixed):
    - PatientMrn and EncounterTypeId are bound in currentfilter but are
      never sent as params to GetEncounters -- both filters are dead.
    - lookup.EncounterType is never populated (initLookup only requests
      the "BillType" key) -- the EncounterType select is always empty.
    - This screen has no BillType selector in its UI at all; currentfilter
      .BillTypeId stays at its initial -1 for every request.
    - Unlike the non-Nepal drpaymentmodify screen, none of FromBillDate /
      ToBillDate / PatientMrn / EncounterTypeId trigger getList() on
      change (no ng-change in the original) -- only the Fetch button and
      the Reset action call getList()/clearfilter().
    - The uib-pagination footer is dead: vm.gridConfig.pagerObj is never
      assigned and getList() always requests PageContext.PageSize: -1
      (the full result set) -- there was never a working pager. Omitted.
    - Row edit action navigates via $state.go('app.doctorpaymentmodifylistnepal',
      {id, DoctorName, isViewMode:false}) -- a full state transition, not a
      modal (unlike the non-Nepal screen's drpaymentmodify-form modal).
-->

<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="billing.drpaymentmodify.pagetitle.lbl"></h4>
    <div class="col-sm-6">
        <div class="filters">
            <div class="search">
                <autosearch controlid="'DoctorId'" itemid="item.DoctorId" iteminfo="" rowdata="" name="'doctor'"
                    config="vm.doctorcontrolconfig" placeholder="'Doctor'" candisable="SaveCompleted"
                    isrequired="false"></autosearch>
            </div>
            <!-- <div class="search">
                <patientsearch id="pid" patientid="currentfilter.PatientId" patientinfo="selectedPatient"
                    filterconfig="patientfilterconfig" tabindex="-1" patientchange="patientChange()"
                    candisable="canDisablePatientSearch()"></patientsearch>
            </div> -->

        </div>
    </div>
</div>
<div class="row">
    <table id="bannerdetails">
        <tr>
            <td translate="billing.drpaymentmodify.patientsearch.lbl"></td>
            <td class="service">
                <!-- <autosearch controlid="'ServiceId'" itemid="item.ServiceId" iteminfo="" rowdata="" name="'doctor'"
                        config="vm.servicecontrolconfig" placeholder="'Service'" candisable="SaveCompleted"
                        isrequired="false"></autosearch> -->
                <patientsearch id="pid" patientid="currentfilter.PatientId" patientinfo="selectedPatient"
                    filterconfig="patientfilterconfig" tabindex="-1" patientchange="patientChange()"
                    candisable="canDisablePatientSearch()"></patientsearch>
            </td>
            <td translate="billing.claimsubmission-list.fromdate.lbl"></td>
            <td>
                <react-component name="DrPaymentModifyNepalFilterFieldScreen"
                    props="{ reactProps: reactProps, onAction: handleReactAction, field: 'fromDate' }"></react-component>
            </td>
            <td translate="billing.claimsubmission-list.todate.lbl"></td>
            <td>
                <react-component name="DrPaymentModifyNepalFilterFieldScreen"
                    props="{ reactProps: reactProps, onAction: handleReactAction, field: 'toDate' }"></react-component>
            </td>
        </tr>
        <tr>
            <td translate="billing.drpaymentmodify.mrnno.lbl"></td>
            <td>
                <react-component name="DrPaymentModifyNepalFilterFieldScreen"
                    props="{ reactProps: reactProps, onAction: handleReactAction, field: 'patientMrn' }"></react-component>
            </td>
            <td translate="billing.drpaymentmodify.encountertype.lbl"></td>
            <td>
                <react-component name="DrPaymentModifyNepalFilterFieldScreen"
                    props="{ reactProps: reactProps, onAction: handleReactAction, field: 'encounterType' }"></react-component>
            </td>
            <td align="center">
                <react-component name="DrPaymentModifyNepalFilterFieldScreen"
                    props="{ reactProps: reactProps, onAction: handleReactAction, field: 'reset' }"></react-component>
            </td>
            <td>
                <react-component name="DrPaymentModifyNepalFilterFieldScreen"
                    props="{ reactProps: reactProps, onAction: handleReactAction, field: 'fetch' }"></react-component>
            </td>
        </tr>
    </table>
</div>
<react-component name="DrPaymentModifyNepalListScreen"
    props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
