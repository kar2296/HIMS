<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="billing.drpaymentmodify.pagetitle.lbl"></h4>

        <div class="filters">
            <div class="search">
                <autosearch controlid="'DoctorId'" itemid="item.DoctorId" iteminfo="" rowdata="" name="'doctor'"
                    config="vm.doctorcontrolconfig" placeholder="'Doctor'" candisable="SaveCompleted"
                    isrequired="false"></autosearch>
            </div>
            <div class="search">
                <patientsearch id="pid" patientid="currentfilter.PatientId" patientinfo="selectedPatient"
                    filterconfig="patientfilterconfig" tabindex="-1" patientchange="patientChange()"
                    candisable="canDisablePatientSearch()"></patientsearch>
            </div>

        </div>
    </div> -->
</div>
<div class="row">
    <table id="bannerdetails">
        <tr>
            <td translate="billing.drpaymentmodify.patientname.lbl"></td>
            <td class="service">
                {{item.PatientName}}
            </td>
            <td translate="billing.drpaymentmodify.agesex.lbl"></td>
            <td>
                {{item.Age}}/ {{item.Gender}}
            </td>
            <td translate="billing.drpaymentmodify.patientid.lbl"></td>
            <td>
                {{item.PatientMrn}}
            </td>
            <td translate="billing.drpaymentmodify.status.lbl"></td>
            <td>
                {{item.Age}}/ {{item.Gender}}
            </td>
        </tr>
    </table>
</div>
<div class="row">
    <h4 translate="billing.drpaymentmodify.visitinfo.lbl"></h4>
    <div class="form-group col-sm-2">
        <label class="col-sm-12 control-label" translate="billing.drpaymentmodify.visitdoctor.lbl"></label>
    </div>
    <div class="form-group col-sm-4">
        <div class="col-sm-12">
            <ui-select id='doctorid' ng-keyup="moveHeaderFocus('doctorid')" ng-model="item.DoctorId" tabindex="-1"
                ng-change="onDoctorSelected($select.selected)" name="doctorid" ng-disabled="RdoDoctorId" required>
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.Doctor | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-2">
        <label class="col-sm-12 control-label" translate="billing.drpaymentmodify.referaldoctor.lbl"></label>
    </div>
    <div class="form-group col-sm-4">
        <div class="col-sm-12">
            <ui-select id='doctorid' ng-keyup="moveHeaderFocus('doctorid')" ng-model="item.ReferralId" tabindex="-1"
                ng-change="onReferralDoctorSelected($select.selected)" name="doctorid" ng-disabled="RdoDoctorId"
                required>
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.Referral | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="pull-right">
            <button id="btnCancelForm" type="button" class="draftbutton" ng-click="saveitem()"
                translate="Update"></button>
        </div>
    </div>
</div>
<div class="col-sm-12">
    <h4 translate="billing.drpaymentmodify.services.lbl"></h4>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>

<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
