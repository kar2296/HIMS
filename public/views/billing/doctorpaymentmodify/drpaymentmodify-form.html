<!--
  React bridge migration (hybrid modal): the native DoctorId <autosearch>
  stays in AngularJS (unchanged, own SystemSettings/User/GetUsers-backed
  config) between two React mounts:
    - DrPaymentModifyFormHeaderScreen: modal header (title + close) and the
      disabled old-Dr-name field, sibling BEFORE the native autosearch.
    - DrPaymentModifyFormDetailsScreen: Amount/Dr. Share/Remarks fields +
      the Approve/Save button, sibling AFTER the native autosearch.

  Preserved real API call (unchanged): billing/patientbilldetails/
  UpdatePatientBillDetails. saveitem() validates Id, DoctorId, DoctorName
  (set by the native autosearch's own formatselecteddoctor(), not by
  React) and DoctorShare >= 0 before saving -- untouched.

  Confirmed pre-existing quirks/bugs, reproduced as-is (not fixed):
    - DrShareValidation() reverts $scope.item.DoctorShare to the original
      value when the new value exceeds NetAmount ('Dr. Share Amount
      should not greater than Amount') or fails to parse as a number
      ('Dr. Share Amount should not correct format' -- a pre-existing
      grammatically-broken message, reproduced verbatim, not corrected).
    - $scope.numberonly (reproduced in React as drShareNumberOnlyKeyDown)
      uses a DIFFERENT keyCode allow-list than the standard numberonly
      helper used elsewhere in this migration -- the same distinct
      variant already confirmed on cashsubmission-form, reproduced as-is.
    - getSelectionStart(o), a dead IE-era text-selection helper, is
      defined in the controller but never called anywhere -- left
      unremoved/unmigrated since it has no call site to preserve.
-->
<style>
    .form-horizontal .form-group {
    height: 80px;
}
</style>
<react-component name="DrPaymentModifyFormHeaderScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>

<form id="item_form" name="item_form" class="form-horizontal" role="form">

    <div class="bg-pattern">
        <div class="row">
            <div class="col-sm-12">

                <div class="col-sm-4 form-group">
                    <div class="col-sm-12">
                        <label class="col-sm-12 control-label" translate="billing.drpaymentmodifyform.changedrname.lbl"></label>
                        <div class="col-sm-12">
                            <autosearch controlid="'DoctorId'" itemid="item.DoctorId" iteminfo="" rowdata="" name="'doctor'"
                                config="vm.doctorcontrolconfig" candisable="SaveCompleted" isrequired="false"></autosearch>
                        </div>
                    </div>
                </div>

                <react-component name="DrPaymentModifyFormDetailsScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>

            </div>


        </div>
    </div>

</form>
