    <div class="">
        <div class="" id="">
            <table class="table table-hover table-responsive table-bordered">
                <thead class="bg-subhead">
                    <tr>
                        <th class="col-sm-4">
                            <span translate="Bill Number"></span>
                        </th>
                        <th class="col-sm-2">
                            <span translate="Service Name"></span>
                        </th>
                        <!-- <th class="col-sm-2">
                            <span translate="Order"></span>
                        </th> -->
                        <th class="col-sm-2">
                            <span translate="Amt"></span>
                        </th>
                        <th class="col-sm-2">
                            <span translate="Doctor"></span>
                        </th>
                        <th class="col-sm-2">
                            <span translate="Share Amount"></span>
                        </th>
                        <!-- <th class="col-sm-2">
                            <span translate="common.isReqAllFacility.lbl"></span>
                        </th> -->
                        <th class="col-sm-1">
                            <span translate="common.actions_col.lbl"></span>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="item in PatientDoctorShareDetails | filter:{Status:1}">
                        <td align="center">
                            {{item.PatientBill.BillNumber}}
                            <!-- <input type="text" class="form-control" ng-model="item.PatientBill.BillNumber"> -->
                        </td>
                        <td align="center">
                            {{item.ServiceName}}
                            <!-- <input type="text" class="form-control" ng-model="item.ServiceName"> -->
                        </td>
                       
                        <td align="center">
                            {{item.ServiceAmount}}
                        </td>
                        <td align="center">
                            <ui-select id='doctorid' ng-keyup="moveHeaderFocus('doctorid')" ng-model="item.DoctorId" tabindex="-1"
                            ng-change="onDoctorSelected($index,item)" name="doctorid" ng-disabled="RdoDoctorId" required>
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices
                                repeat="lookupitem.Id as lookupitem in lookup.Doctor | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                        </td>
                        <td align="center">
                            <input type="text" class="form-control" ng-model="item.DoctorShareAmount"
                            ng-keyup="DrShareValidation()">
                        </td>
    
                        <td>
                            <!-- <button class="btn btn-danger btn-xs" ng-click="deleteItem($index,item)"> -->
                            <img src="/app/img/svg/noun_Delete.svg" ng-click="deleteItem($index,item)" />
                            <!-- </button> -->
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="fooder-bgs">
                <div class="pull-right">
                    <div class="col-sm-12">
                        <button id="btnCancelForm" type="button" class="draftbutton" ng-click="saveitem()"
                            translate="common.saveapprove-action.lbl"></button>
                       </div>
                </div>
            </div>
        </div>
    </div>

</form>
