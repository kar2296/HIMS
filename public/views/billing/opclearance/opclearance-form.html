<link rel="stylesheet" href="app/css/drhms.css">
<style>
    .drhms-receipt span {
        font-size: 12px;
    }

    .drhms-table-control {
        margin-bottom: 20px;
    }

    patientsearch.logo .custom-popup-wrapper {
        margin-left: -200px;
    }
</style>
<div class="row">
    <div class="drhms-filters">
        <div class="col-sm-10">
            <h4 translate="OP Consolidated Clearance"></h4>
        </div>
        <div class="col-sm-4">
            <patientsearch class="logo" ng-keyup="moveHeaderFocus('pid')" patientid="currentfilter.PatientId"
                name="txtpatientsearch" patientinfo="selectedPatient" patientchange="getPatient()"
                tabindex="tabindexmap.patienttabindex">
            </patientsearch>
        </div>
    </div>
</div>
<div class="col-sm-12">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <react-component name="OpClearancePatientInfoScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
    </form>
</div>
<react-component name="OpClearanceBillsTablesScreen" props="{ part: 'patientbills', reactProps: reactProps, onAction: handleReactAction }"></react-component>
<react-component name="OpClearanceBillsTablesScreen" props="{ part: 'pharmacybills', reactProps: reactProps, onAction: handleReactAction }"></react-component>
<react-component name="OpClearanceBillsTablesScreen" props="{ part: 'returns', reactProps: reactProps, onAction: handleReactAction }"></react-component>

<div class="col-sm-12">
    <div class="col-sm-9">
        <react-component name="OpClearancePaymentScreen" props="{ part: 'discount', reactProps: reactProps, onAction: handleReactAction }"></react-component>
        <react-component name="OpClearancePaymentScreen" props="{ part: 'paymenttype', reactProps: reactProps, onAction: handleReactAction }"></react-component>
        <react-component name="OpClearancePaymentScreen" props="{ part: 'paymentdetails', reactProps: reactProps, onAction: handleReactAction }"></react-component>
    </div>
    <react-component name="OpClearancePaymentScreen" props="{ part: 'summary', reactProps: reactProps, onAction: handleReactAction }"></react-component>
</div>
<react-component name="OpClearancePaymentScreen" props="{ part: 'footer', reactProps: reactProps, onAction: handleReactAction }"></react-component>
