<!--
  UI-MODERNIZATION RETROFIT (Billing / "Find Receipt" picker modal).
  This fragment mounts the real modal's UI as a React component
  (ReceiptPickerScreen). AngularJS (receiptpicker.js) is hollowed to a thin
  dispatcher: it still owns modalConfig/$uibModalInstance, the real
  Billing/PatientPaymentDetails/GetPatientPaymentDetails call, and every
  real function (actionClick, getList, cancelCallback) -- React only
  renders $scope.reactProps and dispatches action names back via
  handleReactAction. See receiptpicker.js for the full disclosure of
  confirmed pre-existing behavior preserved as-is, including the
  MR Number/Facility/Type filters that have always had zero options, the
  OP/DG/IP column that always literally shows "OP", and the row-selection
  bug that means picking a receipt from this screen has never actually
  worked. The original markup also carried an unreferenced
  <script type="text/ng-template" id="patientaddress.html"> block -- no
  cellTemplate/templateUrl anywhere in receiptpicker.js ever pointed at it,
  confirmed by reading the controller in full, so dropping it here has no
  visible effect.
-->
<div style="width: 100%;">
    <react-component name="ReceiptPickerScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
</div>
