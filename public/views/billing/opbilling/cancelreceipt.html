<style>
    button {
        margin: 2px 3px;
    }

    .ui-grid-render-container-left .ui-grid-viewport {
        height: 173px !important;
    }

    .footerbar .well {
        padding: 5px !important;
    }

    .bg-pattern {
        height: 300px;
        overflow: auto;
        overflow-x: hidden;
    }

    .table-uigrid.ui-grid .ui-grid-viewport {
        height: 220px !important;
    }

    .table-uigrid {
        height: 206px !important;
    }

    .col-sm-12.grid-div {
        padding: 0px;
    }

    .col-sm-12.grid-div {
        height: 341px;
        overflow: auto;
    }

    .fooder-bgs {
        margin-top: 20px;
        margin-left: 24px;
    }
</style>

<div class="modal-header custom-modal-header">
    <div class="col-sm-6">
        <h4 class="modal-title custom-modal-title" translate="billing.receipt-list.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-6">
        <button class="btn btn-xs btn-danger pull-right fa fa-remove" ng-click="cancelCallback()"></button>
    </div>

</div>
<div class="">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">

        <div class=" col-sm-12 footerbar" style="    margin-bottom: 34px;">
            <div class="col-sm-12 ">

                <div class="col-sm-3 "> </div>
                <div class="col-sm-6 ">

                    <label class="col-sm-6 control-label" for="reason"
                        translate="billing.receipt-list.cancelreason.lbl"></label>

                    <div class="col-sm-6">
                        <input type="text" class="form-control" name="reason" ng-model="currentcontext.CancelReason"
                            ng-disabled="IsCancelled" placeholder="" required>
                    </div>
                </div>
                <div class=" col-sm-3">
                    <button type="button" class="btn btn-danger btn-xs pull-right" ng-if="Cancelbtn"
                        ng-click="cancelReceipt()" translate="billing.receipt-list.cancelreceipt.lbl"></button>
                </div>
            </div>
        </div>
    </form>
    <div class="row">
        <custom-table config="vm.gridConfig"></custom-table>
    </div>
    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
                items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
