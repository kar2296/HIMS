<style>
    .profileinput {
        height: 19px !important;
        padding-bottom: 1px !important;
    }

    .fullreg-profiles label {
        margin-bottom: -2px;
    }

    .ui-grid-viewport {
        height: 212px !important;
    }

    .table-uigrid {
        height: 260px!important;
    }

    .custom-modal-header {
        margin-bottom: -1px;
    }

    .panel-body {
        overflow: visible !important
    }

    .autosearch-div .custom-popup-wrapper {
        position: absolute;
        width: 600px !important;
    }
    .modal-dialog.modal-md .panel-body.form-panel.bg-pattern{
        height:100%;
    }
</style>

<div class="modal-header custom-modal-header">
    <div class="modal-title custom-modal-title">
        <div class="event-name b-greensea" ng-module="currentcontext.patinfo" ng-if="selectedPatient.MRN.length > 0">
            <span class="forpadd" uib-tooltip="{{ selectedPatient.Title.Description }} &nbsp; {{selectedPatient.FirstName}} &nbsp;|&nbsp; {{selectedPatient.MRN}} &nbsp;|&nbsp; {{selectedPatient.Gender.Description}} &nbsp;|&nbsp; {{selectedPatient.Age}} &nbsp; Years &nbsp;|&nbsp; {{selectedPatient.DOB | date : 'dd/MMM/yyyy' }}"
                tooltip-placement="bottom"> 
<span>{{selectedPatient.Title.Description}} {{selectedPatient.FirstName}}</span> <span ng-click="patientprofiledetails()"><i class="icon-info-sign"></i></span>            | <span>{{selectedPatient.MRN}} </span>|<span> {{selectedPatient.Gender.Description}}</span> |<span> {{selectedPatient.Age}}  Years </span>|
            <span>{{selectedPatient.DOB | date : 'dd/MMM/yyyy' }}</span>
            </span>
        </div>
    </div>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-12">
            <div class="panel-body form-panel bg-pattern">
                <div class="well">
                    <div class="form-group">
                        <label class="col-sm-4 control-label" translate="billing.manualbill.billno.lbl"></label>
                        <div class="col-sm-8">
                            <input ng-model="item.ManualBillNumber" type="text" ng-disabled="!IsEditable" class="form-control">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-4 control-label" translate="billing.manualbill.billdate.lbl"></label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" name="startdate" ng-date-object datetime-picker="{{datePickerOptions.dateTimeFormat}}"
                            placeholder="{{datePickerOptions.placeholder}}" ng-click="billldatePopup = { opened: true }"
                            is-open="billldatePopup.opened" ng-model="item.ManualBillDate" ng-disabled="!IsEditable">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-4 control-label" translate="billing.manualbill.ismanualbill.lbl"></label>
                        <div class="col-sm-8">
                            <input ng-model="item.IsManualBill" type="checkbox" ng-disabled="!IsEditable" class="custom-checkbox">
                        </div>
                    </div>
                    <div class="form-group">
                <label class="col-sm-4 control-label" translate="billing.manualbill.comments.lbl"></label>
                        <div class="col-sm-8">
                            <commentscontrol comments="item.ManualBillComments" ng-disabled="!IsEditable"></commentscontrol>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
<div class="fooder-bg ">
    <div class="pull-right">
        <div class="col-sm-12">
            <button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl" ng-click="Save()"></button>
            <button id="btnCancelForm" type="button" class="draftbutton" ng-click="cancelCallback()" translate="common.cancelaction.lbl"></button>
        </div>
    </div>
</div>
