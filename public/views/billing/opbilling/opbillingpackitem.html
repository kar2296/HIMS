<style>
    .modal-title {
        font-size: 13px !important;
    }

    .pull-right {
        margin: 6px auto;
    }

    /* .modal-dialog {
        width: 600px;
        margin: 30px auto;
    } */
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" ng-module="currentcontext.patinfo"
            ng-if="selectedPatient.MRN.length > 0"><span class="forpadd"
                uib-tooltip="{{ selectedPatient.Title.Description }} &nbsp; {{selectedPatient.FirstName}} &nbsp;|&nbsp; {{selectedPatient.MRN}} &nbsp;|&nbsp; {{selectedPatient.Gender.Description}} &nbsp;|&nbsp; {{selectedPatient.Age}} &nbsp; Years &nbsp;|&nbsp; {{selectedPatient.DOB | date : 'dd/MMM/yyyy' }}"
                tooltip-placement="bottom">
                <span>{{selectedPatient.Title.Description}} {{selectedPatient.FirstName}}</span> <span
                    ng-click="patientprofiledetails()"><i class="icon-info-sign"></i></span> |
                <span>{{selectedPatient.MRN}} </span>|<span>
                    {{selectedPatient.Gender.Description}}</span> |<span> {{selectedPatient.Age}} Years </span>|
                <span>{{selectedPatient.DOB | date : 'dd/MMM/yyyy' }}</span>
            </span></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group">
            <div class="col-sm-12">
                <strong>{{PackageName}}</strong>
            </div>
        </div>
        <div class="col-sm-12">
            <table class="table table-hover table-responsive table-bordered">
                <thead class="bg-subhead">
                    <tr>
                        <th class="col-sm-3"><span translate="billing.opbilling-list.servicecode.lbl"></span>
                        </th>
                        <!-- <th class="col-sm-1"><span translate="billing.opbilling-list.amount.lbl"></span></th>
                                    <th class="col-sm-1"><span translate="billing.opbilling-list.discount.lbl"></span></th>
                                    <th class="col-sm-2"><span translate="billing.opbilling-list.netamount.lbl"></span></th>
                                    <th class="col-sm-2"><span translate="billing.opbilling-list.doctorshare.lbl"></span></th> -->
                        <th class="col-sm-3"><span translate="billing.opbilling-list.doctorname.lbl"></span>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="item in items | filter:{Status:1}">
                        <td>
                            <input type="text" class="form-control" ng-disabled="true" ng-model="item.ServiceName"
                                placeholder="">
                        </td>
                        <!-- <td>
                                        <input type="text" class="form-control"  ng-disabled="true" ng-model="item.Amount" placeholder="">
                                    </td>
                                    <td>
                                        <input type="text" tabindex="-1" class="form-control" ng-disabled="true"  ng-model="item.DiscountAmount"
                                            ng-change="calcAmt($index,item)">
                                    </td>
                                    <td>
                                        <span disabled>{{item.NetAmount | displaycurrency}}</span>
                                    </td>
                                    <td>
                                        <input type="text" class="form-control"  ng-model="item.DoctorShare" placeholder="">
                                    </td> -->
                        <td>
                            <ui-select ng-model="item.ServPerformDoctorId"
                                on-select="SelectedDoctor(item,$select.selected)" ng-disabled="!IsEditable">
                                <ui-select-match>
                                    {{$select.selected.DoctorName | limitTo : 20 : 0}}
                                    <span ng-if="$select.selected.DoctorName.length>20">...</span>
                                </ui-select-match>
                                <ui-select-choices
                                    repeat="lookupitem.Id as lookupitem in item.DrLookup | filter: { DoctorName: $select.search }">
                                    <div ng-bind-html="lookupitem.DoctorName | highlight: $select.search"></div>
                                </ui-select-choices>
                            </ui-select>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </form>
    <div class="">
        <div class="pull-right">
            <button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl"
                ng-click="Save()"></button>
            <!-- <button id="btnCancelForm" type="button" class="cancelbutton" ng-click="cancelCallback()"
                translate="common.cancelaction.lbl"></button> -->
        </div>
    </div>
</div>
