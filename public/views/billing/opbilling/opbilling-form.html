<style>
    .profileinput {
        height: 19px !important;
        padding-bottom: 1px !important;
    }
    
    .fullreg-profiles label {
        margin-bottom: -2px;
    }
    
    .ui-grid-viewport {
        height: 212px !important;
    }
    
    .table-uigrid {
        height: 260px!important;
    }
    
    .custom-modal-header {
        margin-bottom: -1px;
    }
</style>

<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="billing.opbilling-form.pagetitle.lbl"></h4>
</div>
<div class="bg-pattern">
    <div class=" fullreg-profiles form-group"></div>
    <div class="row container-fluid filter-area ">
            <form id="item_form" name="item_form" class="form-horizontal" role="form">

        <div class="row form-group">
            <div class="col-sm-4" >
                <div class="form-group">
                    <label class="col-sm-4 control-label" for="Receipttype" translate="billing.receipt-form.type.lbl"></label>
                    <div class="col-sm-8">
                        <react-component name="OpBillingFormSelectScreen" props="{ part: 'receipttype', reactProps: reactProps, onAction: handleReactAction }"></react-component>
                    </div>
                </div>
            </div>
            <div class="col-sm-4">
                <div class="form-group">
                    <label class="col-sm-4 control-label" for="receiptamount" translate="billing.opbilling-form.recamount.lbl"></label>
                    <div class="col-sm-5">
                        <input type="text" class="form-control" name="receiptamount" ng-model="item.AmountPaid" ng-disabled="item.isDisabled" placeholder=""
                            required>
                    </div>
                    <div class="col-sm-3">
                        <react-component name="OpBillingFormSelectScreen" props="{ part: 'currencytype', reactProps: reactProps, onAction: handleReactAction }"></react-component>
                    </div>
                </div>

            </div>
            <div class="col-sm-4">
                <div class="form-group" ng-if="item.PaymentTypeId != 1">
                    <label class="col-sm-4 control-label" translate="billing.opbilling-form.collectedon.lbl"></label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" name="Collected On" ng-date-object datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                            ng-click="activefromPopup = { opened: true }" is-open="activefromPopup.opened" ng-model="item.CollectedOn"
                            ng-disabled="item.isDisabled">
                    </div>
                </div>
            </div>

        </div>

        <div class="row form-group">

            <div class="col-sm-4">
                <div class="form-group">
                    <label class="col-sm-4 control-label" for="payments" translate="billing.opbilling-form.paymentmode.lbl"></label>
                    <div class="col-sm-8">
                        <react-component name="OpBillingFormSelectScreen" props="{ part: 'paymenttype', reactProps: reactProps, onAction: handleReactAction }"></react-component>
                    </div>
                </div>
            </div>
            <div class="col-sm-4">
                <div class="form-group" ng-if="item.PaymentTypeId != 1">
                    <label class="col-sm-4 control-label" for="bankname" translate="billing.opbilling-form.bankname.lbl"></label>
                    <div class="col-sm-8">
                        <react-component name="OpBillingFormSelectScreen" props="{ part: 'bank', reactProps: reactProps, onAction: handleReactAction }"></react-component>
                    </div>
                </div>
            </div>

            <div class="col-sm-4">
                <div class="form-group" ng-if="item.PaymentTypeId==2">
                    <label class="col-sm-4 control-label" translate="billing.opbilling-form.Chequedate.lbl"></label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" name="Chequedate" ng-date-object datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                            ng-click="activefromPopup = { opened: true }" is-open="activefromPopup.opened" ng-model="item.ChequeDate"
                            ng-disabled="item.isCompleted">
                    </div>
                </div>
                <div class="form-group" ng-if="item.PaymentTypeId==3">
                    <label class="col-sm-4 control-label" translate="billing.receipt-form.dddate.lbl"></label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" name="dddate" ng-date-object datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                            ng-click="activetoPopup = { opened: true }" is-open="activetoPopup.opened" ng-model="item.DDDate"
                            ng-disabled="item.isCompleted">
                    </div>
                </div>
                <div class="form-group" ng-if="item.PaymentTypeId==5">
                    <label class="col-sm-4 control-label" for="cardtype" translate="billing.opbilling-form.cardtype.lbl"></label>
                    <div class="col-sm-8">
                        <react-component name="OpBillingFormSelectScreen" props="{ part: 'cardtype', reactProps: reactProps, onAction: handleReactAction }"></react-component>
                    </div>
                </div>
                 <div class="form-group" ng-if="item.PaymentTypeId==4">
                    <label class="col-sm-4 control-label" translate="billing.opbilling-form.transferredon.lbl"></label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" name="transferredon" ng-date-object datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                            ng-click="transationfromPopup = { opened: true }" is-open="transationfromPopup.opened" ng-model="item.WireTransferDate"
                            ng-disabled="item.isCompleted">
                    </div>
                </div>
            </div>
        </div>
        <div class="row form-group">
            <div class="col-sm-4">

                <div class="form-group" ng-if="item.PaymentTypeId==3">
                    <label class="col-sm-4 control-label" for="ddno" translate="billing.receipt-form.ddno.lbl"></label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" name="ddno" ng-model="item.DDNumber" placeholder="" ng-disabled="item.isDisabled"
                            required>
                    </div>
                </div>

                <div class="form-group" ng-if="item.PaymentTypeId==4">
                    <label class="col-sm-4 control-label" for="transationno" translate="billing.opbilling-form.transationno.lbl"></label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" name="transationno" ng-model="item.WireTransferId" placeholder="" ng-disabled="item.isDisabled"
                            required>
                    </div>
                </div>
                <div class="form-group" ng-if="item.PaymentTypeId==2">
                    <label class="col-sm-4 control-label" for="chequeno" translate="billing.opbilling-form.chequeno.lbl"></label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" name="chequeno" ng-model="item.ChequeNo" placeholder="" ng-disabled="item.isDisabled"
                            required>
                    </div>
                </div>
                 <div class="form-group" ng-if="item.PaymentTypeId==5">
                    <label class="col-sm-4 control-label" for="terminalno" translate="billing.opbilling-form.terminalno.lbl"></label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" name="terminalno" ng-model="item.TerminalNoId" placeholder="" ng-disabled="item.isDisabled"
                            required>
                    </div>
                </div>
               
            </div>
            <div class="col-sm-4">
                 <div class="form-group" ng-if="item.PaymentTypeId != 1 && item.PaymentTypeId != 5" >
                    <label class="col-sm-4 control-label" for="comments" translate="admissionrequest.comments.lbl"></label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" ng-model="item.Comments" placeholder="">
                    </div>
                </div>
                <div class="form-group" ng-if="item.PaymentTypeId==5">
                    <label class="col-sm-4 control-label"  translate="billing.opbilling-form.cardholder.lbl"></label>
                    <div class="col-sm-8">
                        <react-component name="OpBillingFormSelectScreen" props="{ part: 'cardholder', reactProps: reactProps, onAction: handleReactAction }"></react-component>
                    </div>
                </div>
            </div>
            <div class="col-sm-4">
                <div class="form-group" ng-if="item.PaymentTypeId==5">
                    <label class="col-sm-4 control-label" for="authorisedcode" translate="billing.opbilling-form.authcode.lbl"></label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" name="authorisedcode" ng-model="item.AuthorizeNumber" placeholder="" ng-disabled="item.isDisabled"
                            required>
                    </div>
                </div>
            </div>
        </div>
        <div class="row form-group">
            <div class="col-sm-4">
                <div class="form-group">
                    <label class="col-sm-4 control-label" translate="billing.opbilling-form.gurantor.lbl"></label>
                    <div class="col-sm-8">
                        <input type="text" maxlength="60" class="form-control" ng-model="item.GurantorName" ng-disabled="item.isCompleted" placeholder="">

                    </div>
                </div>
            </div>
            <div class="col-sm-4">

                <div class="form-group " ng-if="item.PaymentTypeId==5">
                    <label class="col-sm-4 control-label" for="comments" translate="admissionrequest.comments.lbl"></label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" ng-model="item.Comments" placeholder="">
                    </div>
                </div>
            </div>
              <div class="col-sm-4">
                        <button  class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="saveItem()" uib-tooltip="{{ 'generalmaster.researchprojectmember-form.addnewtooltip.lbl' | translate }}"
                            tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i><span translate="common.addaction.lbl"></span></button>
                 
                   </div>
        </div>

    </div>
</form>
    <div class="table-uigrid table-uigrid-tab">
        <react-component name="BridgeGridScreen" props="{ reactProps: reactPropsPaymentGridContainer.reactProps, onAction: reactPropsPaymentGridContainer.onAction }"></react-component>
        <div class="fullreg-profiles">
            <span class="form-group ">
            <div class="  pull-left col-sm-12">
                <label class="col-sm-1" >Total </label>
                   <div class="col-sm-3">
                <input type="text" class="form-control profileinput col-sm-10" disabled>
                   </div>
            </div>
        </span>
        </div>
    </div>

    <div class="fooder-bg ">
        <div class="pull-right">
            <div class="col-sm-12">
                <button type="button"   class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
                <button id="btnCancelForm" type="button" class="cancelbutton" ng-click="cancelCallback()" translate="common.cancelaction.lbl"></button>
            </div>
        </div>
    </div>
</div>
