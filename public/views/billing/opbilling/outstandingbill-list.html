<style>
    button.btn.btn-xs.fetch {
        margin-top: 20px;
    }

    .ftr_span {
        text-align: right;
        color: #f44336;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-6">
        <h4 class="modal-title custom-modal-title" translate="billing.outstandingbill-list.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-6">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>
<div class="row" ng-if="IsPicker">
    <div class="dynamicform-content" id="dynamicform">
        <dynamicform modeldata="modeldata" schema="schema"></dynamicform>
        <div class="form-group col-sm-3">
            <button type="button" class="draftbutton  {{action.cls}}" ng-repeat="action in schema.actions"
                ng-click="actionClick(action.type)" translate="{{action.translate}}"></button>
        </div>
    </div>
    <div class="col-sm-12" style="margin-top: 10px;">
        <react-component name="OutstandingBillListTableScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
        <div class="">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
                items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
        <div class="col-sm-12">
            <p class="ftr_span" ng-hide="IsPicker">Out Standing Amount :
                {{currentcontext.totalOutStandingAmount | displaycurrency}}</p>
        </div>
    </div>
</div>
