
<style>
    button{ margin: 2px 3px;}
    .ui-grid-render-container-left .ui-grid-viewport {height: 173px !important;}
</style>
<script type="text/ng-template" id="patientaddress.html">
    	<div class="contactinfo" ng-if='row.entity.AddressLine1 || row.entity.AddressLine2'>
                    {{row.entity.AddressLine1 + ',' }} 
                    {{row.entity.AddressLine2 ? row.entity.AddressLine2 + ',' : ""}} 
                    {{row.entity.Area ? row.entity.Area + ',' : ""}}
                    {{row.entity.City ? row.entity.City + ',' : ""}} 
                    {{row.entity.State ? row.entity.State + ',' : ""}}
                    {{row.entity.Country ? row.entity.Country : ""}}
        </div>  
</script>

<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="billing.receiptpicker.pagetitle.lbl"></h4>

</div>
<div class="bg-pattern">
<div class="row filter-area panel-favorite">
    <div class="dynamicform-content">
        <dynamicform modeldata="modeldata" schema="schema"></dynamicform>
        <div class="form-group col-sm-3">
        <button type="button" class="draftbutton  {{action.cls}}" ng-repeat="action in schema.actions"
                ng-click="actionClick(action.type)" translate="{{action.translate}}"></button>
        </div>
    </div>
</div>
<div class="col-sm-12 grid-div">
    <react-component name="BridgeGridScreen" props="{ reactProps: reactPropsGridContainer.reactProps, onAction: reactPropsGridContainer.onAction }"></react-component>
</div>
 <div class="col-sm-12 panel-footer formactionbar">
     <div class="col-sm-11">
          <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
     </div>
                <div class=" col-sm-1">
                    <button  type="button" class="btn btn-danger btn-sm pull-right" ng-click="cancelCallback()" translate="common.cancelaction.lbl"></button>						
                </div>
</div>
</div>
