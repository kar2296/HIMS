  ActiveStatus lookups). Add New and row Edit both navigate via
  $state.go to app.drfeemappingform ({id: 0} / {id: row.Id}), not a
  modal.

  Confirmed pre-existing quirk, reproduced as-is: the filter label for
  DoctorClassId reads "Doctor Share Class" (billing.doctorshare.
  drshareclass.lbl) while the grid column header for the same
  underlying field reads "Doctor Class" (billing.doctorshare.drclass
  .lbl) -- the two labels genuinely differ in the original template;
  not unified here.
-->

    props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
