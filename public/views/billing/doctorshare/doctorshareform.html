<div class="modal-header custom-modal-header">
    <h4 class="col-sm-6 mt0" translate="billing.doctorshare.pnltitle.lbl"></h4>
</div>

<!--
  React bridge migration (hybrid). This screen (Manage Doctor Fee Master,
  reached from doctorsharelist's Add New / Edit actions) is classified
  HYBRID because the Items tab contains one genuinely live native widget:
  <autosearch> bound to vm.serviceitemcontrolconfig, searching
  ClinicalMaster/ServiceItem/GetServiceItems (confirmed via jQuery DOM
  manipulation in addItemDetails(): $('#ServiceId').focus()/.val('')).
  That entry row (autosearch + Eligible%/Share%/Amount inputs + Add
  button) is left untouched, live AngularJS markup below.

  Everything else is migrated via 4 separate <react-component> mounts,
  all reading/writing the same $scope.reactProps / $scope.handleReactAction
  bridge added to doctorshareform.js:
    1. DrShareHeaderScreen   - the two header filter-area rows (editable
       form + read-only summary) AND the Category/Items/PayoutRange tab
       switcher buttons. Mounted unconditionally; the component itself
       conditions the summary+tabswitcher parts on DoctorShareClass==1.
    2. DrShareCategoryTabScreen - entire Category tab (entry row, table,
       Save button). No native widgets, no utl.Validator.validate call.
    3. DrShareItemsListScreen  - ONLY the Items tab's results table +
       Save button. The entry row above it (native <autosearch> + inputs
       + Add button) stays untouched native markup in the same
       ng-if="currentcontext.SelectedOption == 2" wrapper.
    4. DrShareRangeTabScreen   - entire Payout Range tab (entry row,
       table, Save button). No native widgets.

  Preserved real API calls (unchanged): billing/doctorshare/GetDoctorShare,
  billing/doctorshare/AddDoctorShare, billing/doctorshare/UpdateDoctorShare,
  ClinicalMaster/ServiceItem/GetServiceItems, General/Options/getoptions.

  Confirmed pre-existing quirks, reproduced as-is (not "fixed"):
  - The editable header form is NEVER hidden (no ng-if on it in the
    original). Clicking "Add" sets DoctorShareClass=1 and reveals a
    SECOND, read-only summary block UNDERNEATH the still-editable form --
    both are shown at once, not toggled.
  - The Category tab's ServiceCategory select and its results-table
    column header both read "Billing Type"
    (billing.doctorshare.category.lbl), even though the field is
    ServiceCategoryId -- a mislabeling left uncorrected.
  - editCategoryReqst/deleteCategoryReqst/editItemDetailReqst/
    deleteItemDetailReqst/editRangeReqst/deleteRangeReqst in
    doctorshareform.js all declare an unused "index" parameter and
    mutate the passed object reference directly. The React->AngularJS
    dispatch below matches by natural/business key (ServiceCategoryId,
    ServiceId, or the MinRange/MaxRange pair) instead of array index,
    mirroring that original semantics rather than "fixing" it.
  - numberwithdecimal($event)'s keypress validation is reproduced
    verbatim in the React entry-row inputs via a local
    numberWithDecimalKeyDown() helper in each component.
-->

<react-component name="DrShareHeaderScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>

<div ng-if="DoctorShareClass == 1" class="row">

    <!-- Category wise  -->

    <div ng-if="currentcontext.SelectedOption == 1" class="col-sm-12">
        <react-component name="DrShareCategoryTabScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
    </div>



    <!-- Item wise  -->

    <div ng-if="currentcontext.SelectedOption == 2" class="col-sm-12">
        <br />
        <div class="col-sm-12">
            <div class="col-sm-3">
                <label class="col-sm-5 control-label filter-lbl" translate="billing.doctorshare.itemname.lbl"></label>
                <div class="col-sm-7">
                    <autosearch controlid="'ServiceId'"
                    itemid="currentfilter.ServiceId" iteminfo="currentfilter.SelectedServiceItem" name="'service'"
                    rowdata="bi" config="vm.serviceitemcontrolconfig" itemchange="ServiceItemChanged()"
                    class="inputsearchlogo" ></autosearch>
                </div>
            </div>
            <div class="col-sm-3">
                <label class="col-sm-7 control-label" translate="billing.doctorshare.eligiblepercentage.lbl"></label>
                <div class="col-sm-5">
                    <input type="text" maxlength="3" class="form-control" ng-model="currentfilter.EligiblePercentage"
                         ng-keypress="numberwithdecimal($event)" />
                </div>
            </div>
            <div class="col-sm-3">
                <label class="col-sm-7 control-label" translate="billing.doctorshare.sharepercentage.lbl"></label>
                <div class="col-sm-5">
                    <input type="text" maxlength="3" class="form-control" ng-model="currentfilter.SharePercentage"
                         ng-keypress="numberwithdecimal($event)" />
                </div>
            </div>
            <div class="col-sm-3">
                <label class="col-sm-7 control-label" translate="billing.doctorshare.shareamount.lbl"></label>
                <div class="col-sm-5">
                    <input type="text" maxlength="6" class="form-control" ng-model="currentfilter.ShareAmount"
                         ng-keypress="numberwithdecimal($event)" />
                </div>
            </div>
            <div class="col-sm-2">
                <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addItemDetails()"
                    tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                    <span translate="billing.doctorshare.add.lbl"></span>
                </button>
            </div>
        </div>

        <react-component name="DrShareItemsListScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>


    </div>

    <!-- Range wise  -->

    <div ng-if="currentcontext.SelectedOption == 3" class="col-sm-12">
        <br />
        <div class="col-sm-12">
            <div class="col-sm-3">
                <label class="col-sm-5 control-label filter-lbl" translate="billing.doctorshare.description.lbl"></label>
                <div class="col-sm-7">
                    <input type="text" class="form-control" ng-model="currentfilter.RangeDescription" />
                </div>
            </div>
            <div class="col-sm-3">
                <label class="col-sm-7 control-label" translate="billing.doctorshare.minrange.lbl"></label>
                <div class="col-sm-5">
                    <input type="text" maxlength="10" class="form-control" ng-model="currentfilter.MinRange"
                     ng-keypress="numberwithdecimal($event)"  />
                </div>
            </div>
            <div class="col-sm-3">
                <label class="col-sm-7 control-label" translate="billing.doctorshare.maxrange.lbl"></label>
                <div class="col-sm-5">
                    <input type="text" maxlength="15" class="form-control" ng-model="currentfilter.MaxRange"
                     ng-keypress="numberwithdecimal($event)" />
                </div>
            </div>
            <div class="col-sm-3">
                <label class="col-sm-7 control-label" translate="billing.doctorshare.sharepercentage.lbl"></label>
                <div class="col-sm-5">
                    <input type="text" maxlength="3" class="form-control" ng-model="currentfilter.SharePerRange"
                     ng-keypress="numberwithdecimal($event)"  />
                </div>
            </div>
            <div class="col-sm-2">
                <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addRangeDetails()"
                    tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                    <span translate="billing.doctorshare.add.lbl"></span>
                </button>
            </div>
        </div>

        <react-component name="DrShareRangeTabScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>

    </div>

</div>
