<!--
  React bridge migration (single mount). Replaces privilegecardListController's
  header/search, From/To/Scheme-Type filter row, and <custom-table> grid
  with PrivilegeCardListScreen (see PromotionalSchemesListScreen.tsx for
  the shared custom-table background and its sort/action-icon behavior).
  Pagination footer (uib-pagination) is kept native below the mount.

  Preserved real API calls (unchanged): billing/PrivilegeCard/
  GetPrivilegeCards, billing/PrivilegeCard/DeletePrivilegeCard,
  General/Options/getoptions.

  Confirmed pre-existing quirk, reproduced as-is: the MembershipNumber
  search field (top-right) is dead-but-rendered -- its value is never
  sent in getList()'s Params.
-->
<react-component name="PrivilegeCardListScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
