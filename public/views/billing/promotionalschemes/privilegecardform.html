<div class="row">
    <h4 class="title" translate="Manage Promotional Scheme"></h4>
</div>
<div class="row">
    <patientbanner patientid="item.PatientId"></patientbanner>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="scheme"
                translate="billing.promotionalscheme.scheme.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.CardTypeId" name="scheme" autofocus required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.PromotionSchemeType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <!-- <div class="form-group col-sm-4">
                <label class="col-sm-12 control-label" for="scheme"
                    translate="billing.promotionalscheme.scheme.lbl"></label>
                <div class="col-sm-12">
                    <ui-select ng-model="item.PromotionSchemeId" name="scheme" autofocus required>
                        <ui-select-match>

        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="scheme" translate="Scheme Type"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.CardTypeId" name="scheme" autofocus required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.PromotionSchemeType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="issuedate" translate="Eligibile Date"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="issuedate" ng-change="getExpiryDate()" ng-date-object
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="issuedatePopup = { opened: true }"
                    is-open="issuedatePopup.opened" ng-model="item.ValidTo" required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="Card #"></label>
            <div class="col-sm-12">
                <input type="text" id="Manualadd" class="form-control" name="cardno" tabindex="19"
                    ng-model="item.CardNo" ng-disabled="item.candisable" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="Phone#"></label>
            <div class="col-sm-12">
                <input type="text" id="Manualadd" class="form-control" name="Phoneno" tabindex="19"
                    ng-model="item.MobileNo" ng-disabled="item.candisable" placeholder="">
            </div>
        </div>
    </form>
</div>
<div class="fooder-bgs"></div>
