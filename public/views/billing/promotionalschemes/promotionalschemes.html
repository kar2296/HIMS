<link rel="stylesheet" href="app/css/drhms.css">

<!--
  React bridge migration (hybrid). List screen for
  promotionalSchemeListController. Classified HYBRID solely because the
  pagination footer uses the shared uib-pagination widget (Angular UI
  Bootstrap, not a custom business directive) bound to
  vm.gridConfig.pagerObj -- left untouched/native below the React mount
  rather than reimplemented, since AngularJS ui-router/uib-pagination
  stays authoritative and this avoids re-deriving its page-button logic.
  PromotionalSchemesListScreen replaces the <custom-table> grid
  (public/js/custom-table.html, a shared app-wide component), reproducing
  its column-header-click sort (reOrder()) and edit/delete icon
  visibility rules exactly.

  Preserved real API calls (unchanged): billing/PromotionalScheme/
  GetPromotionalSchemesWithoutDetails, generalmaster/
  GuarantorPromotionalScheme/DeleteGuarantorPromotionalScheme,
  General/Options/getoptions.
-->
<react-component name="PromotionalSchemesListScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
