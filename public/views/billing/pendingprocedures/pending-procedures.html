<script type="text/ng-template" id="patientaddress.html">
    <div class="contactinfo" ng-if='row.entity.AddressLine1 || row.entity.AddressLine2'>
        {{row.entity.AddressLine1 + ',' }} {{row.entity.AddressLine2 ? row.entity.AddressLine2 + ',' : ""}} {{row.entity.Area ? row.entity.Area + ',' : ""}} {{row.entity.City ? row.entity.City + ',' : ""}} {{row.entity.State ? row.entity.State + ',' : ""}} {{row.entity.Country
        ? row.entity.Country : ""}}
    </div>
</script>

<div class="modal-header custom-modal-header">
    <div class="col-sm-6">
        <h4 class="modal-title custom-modal-title" translate="Pending Procedures"></h4>
    </div>
    <div class="col-sm-6">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>
<div class="row" aria-multiselectable="true">
    <div class="panel" ng-repeat="item in items">
        <div class="panel-heading">
            <div class="col-sm-12">
                <div class="col-sm-1">
                    <displaydate datetime-val="item.OrderRequestDate"> </displaydate>
                </div>
                <div class="col-sm-1">
                    {{item.OrderNumber}}
                </div>
                <div class="col-sm-1">
                    {{item.OrderPriority.Description}}
                </div>
                <div class="col-sm-3 hidecontent">
                    {{item.DoctorName}}
                </div>
                <div class="col-sm-2 hidecontent">
                    {{item.OrderFrom.DepartmentName}}
                </div>
                <div class="col-sm-1">
                    {{item.OrderTo.DepartmentName}}
                </div>
                <div class="col-sm-1">
                    <input type="checkbox" ng-model="item.IsSelected" ng-click="IsOrderSelected(item)" ng-hide="item.PatientBillId>0" />
                </div>
                <div class="col-sm-1">
                    <button type="button" style="float: right;" class="btn btn-default btn-xs" ng-click="toggleCanShowDetails(item)">
                        <i class="fa fa-angle-down" aria-hidden="true" ng-show="!item.CanShowDetails"></i>
                        <i class="fa fa-angle-up" aria-hidden="true" ng-show="item.CanShowDetails"></i>
                    </button>
                </div>
            </div>
        </div>
        <div class="panel" ng-show="item.CanShowDetails">
            <div class="panel-body">
                <div class="">
                    <div class="row">
                        <table style="width: 100%;">
                            <tr ng-repeat="detail in item.ProcedureOrderDetails">
                                <td class="col-sm-3">
                                    <span><b class="fontbold">{{detail.ProcedureCode}}({{detail.ProcedureName}})</b>
                                    </span>
                                </td>
                                <td class="col-sm-1">
                                    <span>&nbsp;{{detail.ProcedureOrder.OrderNumber}}
                                </td>
                                <td class="col-sm-1">
                                    <span>&nbsp;<b></b>{{detail.Quantity}}</span>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div style="float: right;">
        <button type="button" class="draftbutton" ng-click="loadorders()" translate="Load"></button>
    </div>
</div>
