<!--
  UI-MODERNIZATION RETROFIT (Billing / "Pending Procedures" picker modal).
  This fragment mounts the real modal's UI as a React component
  (PendingProceduresPickerScreen). AngularJS (pending-procedures.js) is
  hollowed to a thin dispatcher: it still owns modalConfig/$uibModalInstance,
  the real emr/procedureorder/GetProcedureOrders call, and every real
  function (IsOrderSelected, toggleCanShowDetails, loadorders,
  cancelCallback) -- React only renders $scope.reactProps and dispatches
  action names back via handleReactAction. See pending-procedures.js for the
  full disclosure of confirmed pre-existing behavior preserved as-is
  (the dead Priority/Status filter block, and the "select can never be
  unchecked" IsOrderSelected bug).
-->
<div style="width: 100%;">
    <react-component name="PendingProceduresPickerScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
</div>
