<link rel="stylesheet" href="app/css/drhms.css">
<style>
    .drhms-receipt span {
        font-size: 12px;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Visit Info"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>
<div class="col-sm-12">
    <div class="drhms-refund-table">
        <table>
            <tr>
                <td>
                    <span translate="Visit Identifier"></span> :
                </td>
                <td>{{item.VisitIdentifier}}</td>
                <td>
                    <span translate="Patient Name"></span> :
                </td>
                <td class="text-left">
                    <span> {{ item.Patient.MRN }} /
                        {{ item.Patient.FirstName }} /</span>
                    <span ng-if="item.EncounterTypeId == 2"> IP </span>
                    <span ng-if="item.EncounterTypeId != 2"> OP </span>
                </td>

                <td>Admission Date</td>
                <td>
                    <span>{{item.AdmissionDate | date : 'dd-MMM-yyyy'}}&nbsp;
                        {{item.AdmissionDate | date : 'HH:mm'}}</span>
                </td>
                <td>
                    <span translate="Credit"></span>:
                </td>
                <td>{{item.Credit}}</td>
                <td>
                    <span translate="Debit"></span>:
                </td>
                <td>{{item.Debit}}</td>
                <td>
                    <span translate="Balance"></span>:
                </td>
                <td>{{item.Balance}}</td>
            </tr>
        </table>
    </div>
</div>
<div class="row">
    <div class="pull-right">
        <span>
            <button type="button" class="draftbutton" ng-click="UnlockApproved()" translate="Approved" ng-disabled="item.BillUnlockRequestStatusId > 1">
                <!-- <span><i class="fa fa-print" aria-hidden="true"></i></span> -->
            </button>
        </span>
        <span>
            <button type="button" class="draftbutton" ng-click="UnlockRejected()" translate="Rejected" ng-disabled="item.BillUnlockRequestStatusId > 1">
                <!-- <span><i class="fa fa-print" aria-hidden="true"></i></span> -->
            </button>
        </span>
    </div>
</div>
