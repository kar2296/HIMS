<link rel="stylesheet" href="app/css/drhms.css">
<style>
    button.draftbutton {
        margin-top: 27px;
    }

    div#mainresponsivetablecontrol {
        overflow: auto !important;
    }
</style>
<!--
  React bridge migration (hybrid). Same pattern as the sibling
  ipbillingrequestlist.html: the <patientsearch> field (bound to
  currentfilter.PatientId / selectedPatient) is live markup but has no
  effect on getPaymentDetailList()'s Params -- a dead-but-rendered
  quirk preserved as-is. It stays untouched native between three
  DetailIpBillingRequestFilterScreen mounts (part="dates" before it;
  part="requesttype" and part="statusfetch" after it, preserving the
  original field order and the Status+Fetch nested wrapper div). A
  fourth mount, DetailIpBillingRequestListScreen, renders the results
  table (S.No, Patient, MRN, Ward, Insurance, Requested By/At, edit).

  Preserved real API calls: billing/BillingRequest/GetBillingRequestsbygroup,
  billing/patientpaymentdetails/GetSystemDatetime, General/Options/getoptions.
  EditBillingRequest still opens the (still-native)
  app.editdetailipbillingrequest modal via utl.Modal.open, dispatched here
  by matching PaymentDetails by Id rather than array index.

  Confirmed pre-existing quirk, not fixed: same success-alert-for-a-
  validation-failure quirk in getList() as the sibling screen. Several
  columns (BillNumber, ReceiptNumber, Doctor, BillAmount, PaidAmount,
  CancelReason) are commented out in the original template -- left
  commented out / omitted here too, not restored.

  Dropped cosmetic-only behavior: ng-keyup="moveHeaderFocus('doctorid')"
  keyboard-navigation helper, same as the sibling screen -- no business
  logic or data effect.
-->
<div class="row">
    <div class="drhms-filters">
        <div class="col-sm-12">
            <h4 translate="Billing Approval Request"></h4>
        </div>
    </div>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <react-component name="DetailIpBillingRequestFilterScreen" props="{ reactProps: reactProps, onAction: handleReactAction, part: 'dates' }"></react-component>
        <div class="form-group col-sm-3">
            <label class="col-sm-12" translate="billing.opbilling-list.patientsearch.lbl"></label>
            <div class="col-sm-12">
                <patientsearch controlid="'pid'" patientid="currentfilter.PatientId" name="txtpatientsearch"
                    patientinfo="selectedPatient" isdisabled="" filterconfig="patientfilterconfig"></patientsearch>
            </div>
        </div>
        <!-- Bill Number field commented out in the original -- dead, left as-is. -->
        <react-component name="DetailIpBillingRequestFilterScreen" props="{ reactProps: reactProps, onAction: handleReactAction, part: 'requesttype' }"></react-component>
        <react-component name="DetailIpBillingRequestFilterScreen" props="{ reactProps: reactProps, onAction: handleReactAction, part: 'statusfetch' }"></react-component>
    </form>
</div>
<react-component name="DetailIpBillingRequestListScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
