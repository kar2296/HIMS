<link rel="stylesheet" href="app/css/drhms.css">
<style>
    button.draftbutton {
        margin-top: 27px;
    }

    div#mainresponsivetablecontrol {
        overflow: auto !important;
    }
</style>

<!--
  React bridge migration (hybrid). This screen (Billing UnLock Approval
  Request list, billunlockrequestlistController, state
  app.billunlockapproval) is classified HYBRID because its filter row
  contains one genuinely live native widget: <patientsearch> bound to
  currentfilter.PatientId, whose value IS read by getbillUnlockList()
  (Params Key 4). That widget is left untouched, live AngularJS markup
  below, and the filter row is split into two React mounts sandwiching it:
    1. UnlockBillingFilterScreen (part="dates")   - From/To bill-date pickers,
       each auto-refetching on change like the original.
    2. <patientsearch>                             - untouched native widget.
    3. UnlockBillingFilterScreen (part="actions")  - IP Number input, Request
       Type select (always disabled, display-only), Status select, Fetch
       button. None of these auto-refetch; only Fetch/date-change do.
  Results table (UnlockBillingListScreen) replaces the whole table below,
  reusing the same Debit/Credit/Balance calculation approach as
  billing/opclearance's getListCallback (both operate on
  Visit/Visit/Get*PatientsBills-shaped rows).

  Preserved real API calls (unchanged): Visit/Visit/GetMINIPPatientsBills,
  billing/patientpaymentdetails/GetSystemDatetime, General/Options/getoptions,
  Billing/BillingRequest/AddBillingRequest, Billing/BillingRequest/
  UpdateBillingRequest (the latter two via the edit modal).

  Confirmed pre-existing quirks, reproduced as-is (not "fixed"):
  - The Request Type select is permanently ng-disabled="true" in the
    original -- it always shows BillingRequestTypeId's fixed value (3) and
    can never be changed by the user. Reproduced as a disabled select.
  - The Status select's ng-disabled="RdoDoctorId" references a $scope
    variable that is never assigned anywhere in the controller (always
    undefined/falsy) -- effectively always-enabled dead-code condition,
    left unreproduced since it never actually disables anything.
  - moveHeaderFocus('doctorid') on both selects is a copy-pasted shared
    keyboard-navigation helper not defined in this controller -- dropped,
    no business/data effect (same pattern documented in the ipbillingrequest
    migration).
  - tabindex="-1" on the IP Number input and both selects is cosmetic,
    dropped.
  - EditBillingRequest(bill) is only invoked from the edit icon; it passes
    the whole row as modalConfig.params.data and bill.EncounterId as the
    modal's id param, reproduced verbatim via the 'edit' action below.
-->
<div class="row">
    <div class="drhms-filters">
        <div class="col-sm-12">
            <h4>Billing UnLock Approval Request</h4>
        </div>
    </div>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <react-component name="UnlockBillingFilterScreen" props="{ part: 'dates', reactProps: reactProps, onAction: handleReactAction }"></react-component>
        <div class="form-group col-sm-3">
            <label class="col-sm-12" translate="billing.opbilling-list.patientsearch.lbl"></label>
            <div class="col-sm-12">
                <patientsearch controlid="'pid'" patientid="currentfilter.PatientId" name="txtpatientsearch"
                    patientinfo="selectedPatient" isdisabled="" filterconfig="patientfilterconfig"></patientsearch>
            </div>
        </div>
        <react-component name="UnlockBillingFilterScreen" props="{ part: 'actions', reactProps: reactProps, onAction: handleReactAction }"></react-component>
    </form>
</div>
<div class="row">
    <react-component name="UnlockBillingListScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
</div>
