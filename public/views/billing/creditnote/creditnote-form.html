<link href="app/css/billing-pharmacy-customs.css" rel="stylesheet">

<!---Header-->
<!-- UI-MODERNIZATION RETROFIT (Billing / Credit Note form, app.creditnote,
     creditnoteFormController). This div's content (header patient/bill
     summary, CN Date/No/Facility fields, the credit note line-items
     table, and the footer CN Type/Amount/Approved By/Comments fieldset)
     is now rendered by the BillingCreditNoteFormScreen React component via
     the existing AngularJS<->React bridge directive. AngularJS remains
     authoritative for all data/business logic -- see creditnote-form.js's
     refreshReactProps/handleReactAction bridge and the disclosure comment
     at the top of BillingCreditNoteFormScreen.tsx for the full rationale
     and every preserved pre-existing quirk/bug.

     DELIBERATE PARTIAL MIGRATION: the bottom action bar below (Back / CN
     Status badge / Refund / <printcontrol> / Save & Approve / Clear) is
     left completely untouched as native AngularJS markup -- <printcontrol>
     is itself already backed by its own independently-migrated React
     component (PrintControl) via a separate nested bridge
     (vendor/components/printcontrol.js), so re-implementing it here would
     duplicate that existing migration. -->
<div id="opbillingcontrol">
<react-component name="BillingCreditNoteFormScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
</div>

<div class="fooder-bgs">
    <div class="col-sm-12">
        <div class="col-sm-4">
            <button type="button" class="btn pyr-color10 btn-sm pull-left" ng-click="backToList()" ss> <i class="fa fa-angle-left" aria-hidden="true"></i><span class="btn-fontsize"> &nbsp; Back</span></button>
        </div>
        <div class="col-sm-4">

            <label class="control-label">CN Status</label>&nbsp; : &nbsp;
            <span class="countbg" ng-if="UpdatedStatus==1">&nbsp; Draft &nbsp;</span>
            <span class="countbg" ng-if="UpdatedStatus==2">&nbsp; Completed &nbsp;</span>
            <span class="countbg" ng-if="UpdatedStatus==3">&nbsp; Cancelled &nbsp;</span>

        </div>
        <div class="pull-right">
            <button type="button" class="draftbutton" ng-show="item.isCompleted" ng-click="Refund()" translate="billing.creditnote.refundbtn.lbl"></button>
            <!--<button type="button"  class="draftbutton" ng-click="print()" translate="common.printaction.lbl" ng-if="item.isCompleted"></button>-->
            <printcontrol ng-if="item.isCompleted" printclick="print()"
                                 originalprintclick="originalprint()" hotkey="{'alt+p': print}" reason="currentcontext.printreason"></printcontrol>
            <!--<button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl" ng-click="saveDraft()"
                ng-if="!item.isCompleted"></button>-->
            <button type="button" class="btn btn-info btn-sm" translate="billing.opbilling-list.saveandapprove.lbl" ng-click="saveAndApprove()"
                ng-if="!item.isCompleted"></button>
            <button type="button" class="btn btn-warning btn-sm hidden-sm " ng-click="clear()" ng-if="!item.isCompleted" translate="common.clearaction.lbl"></button>
        </div>
    </div>
</div>

</div>
