<!--
  UI-MODERNIZATION RETROFIT (Billing / Credit Note list, app.creditnotes).
  This fragment mounts the real screen's UI as a React component
  (BillingCreditNoteListScreen). AngularJS (creditnote-list.js) is
  hollowed to a thin dispatcher: it still owns vm.gridConfig, the real
  Billing/PatientCreditNote/GetPatientCreditNotes call, the real
  add/edit/view navigation to app.creditnote, and the real "Fetch"
  advanced-filter popover (utl.Modal.openDynamicForm, a generic
  AngularJS-rendered mechanism used across many screens in this
  codebase) -- React only renders $scope.reactProps and dispatches
  action names back via handleReactAction. The original inline <style>
  block (ui-grid viewport height/media-query rules for .table-uigrid/
  .single-filter, plus .icon_home) governed the ui-grid layout this
  replaces and is no longer referenced by the React component --
  dropped here with no visible effect. See creditnote-list.js and
  BillingCreditNoteListScreen for the full disclosure of the confirmed
  pre-existing Patient Name column quirk (MRN gated behind Title
  existing) preserved as-is.
-->
<div style="width: 100%;">
    <react-component name="BillingCreditNoteListScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
</div>
