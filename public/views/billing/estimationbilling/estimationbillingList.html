<link href="app/css/regbilling.css" rel="stylesheet">

<div class="row">
    <div class="col-sm-9">
        <h4 class="mt0" translate="Estimation Billing"></h4>
    </div>
    <div class="col-sm-3">
        <div class="filters">
            <button type="button" tabindex="-1" class="btn-add" ng-click="addNew()" tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</div>
<div class="row">
    <div class="drhms-list-filters">
        <div class="col-sm-4">
            <label class="col-sm-3" translate="From Date"></label>
            <div class="col-sm-9">
                <div class="datepicker">
                    <input type="text" class="form-control" name="filter_fromdate" ng-date-object  ng-change="getList()"
                        datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}"
                        ng-click="filter_fromdatePopup = { opened: true }" is-open="filter_fromdatePopup.opened"
                        ng-model="currentfilter.FromDate">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-3" translate="To Date"></label>
            <div class="col-sm-9">
                <div class="datepicker">
                    <input type="text" class="form-control" name="filter_fromdate" ng-date-object  ng-change="getList()"
                        datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}"
                        ng-click="filter_todatePopup = { opened: true }" is-open="filter_todatePopup.opened"
                        ng-model="currentfilter.ToDate">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-3" translate="Status"></label>
            <div class="col-sm-9">
                <ui-select ng-model="currentfilter.SaveTypeId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length > 20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.SaveType | filter:  $select.search">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
