<!--
  React bridge migration (hybrid -> effectively full mount). The
  original <patientsearch> filter was ALREADY commented out/dead in
  this screen -- no live native widget remains, so this is migrated as
  2 <react-component> mounts with no native business widgets left in
  between. No utl.Validator.validate call.

    1. CreditApprovalFilterScreen - From/To Bill Date, Bill Number,
       Bill Type select, Status select (permanently disabled in the
       original), Fetch button.
    2. CreditApprovalListScreen - the plain ng-repeat results table
       (no custom-table/ui-grid, no column sort); edit icon opens the
       app.editcreditapproval modal (migrated separately, see
       EditCreditApprovalScreen.tsx / credit_approval.js).

  Preserved real API calls (unchanged):
  billing/PatientBills/GetPatientBillswithoutdetails (getPatientBillList),
  billing/patientpaymentdetails/GetSystemDatetime (getSystemDBDate),
  General/Options/getoptions (initLookup).

  Confirmed pre-existing quirks, reproduced as-is (not "fixed"):
  - The "Bill Number" input binds currentfilter.BillNo, which is never
    read anywhere in the controller -- typing here has always had no
    effect on the fetched results.
  - Bill Type change calls getPatientBillList() DIRECTLY (bypassing the
    Fetch button's getList() date-range validation and DBDate
    refresh) -- reproduced exactly (billTypeChange dispatches straight
    to getPatientBillList(), not getList()).
  - The Status select is permanently disabled (ui-select ... disabled
    in the original) -- its ng-change is therefore unreachable dead
    code; reproduced as a disabled <select> for visual/DOM parity.
  - Fetch validates the From/To date span is between 0 and 72 hours,
    resetting both dates to "today" and showing an alert if not --
    unchanged, still enforced by the untouched $scope.getList().
-->
