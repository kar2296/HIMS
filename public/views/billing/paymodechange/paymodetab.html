<link rel="stylesheet" href="app/css/drhms.css">
<div class="page-header-list">
    <h4 translate="billing.paymodetab.pagetitle.lbl"></h4>
</div>

<!--
  React bridge migration (single mount, header only). This tab-switcher
  shell (paymodeTabController) only handles ui-router navigation between
  the three payment-mode-change child states -- app.paymodechange.tabadvrept
  / .tabop / .tabpharmacy, each separately migrated. Per the standing rule
  that ui-router stays authoritative for routing, <div ui-view> is left
  untouched; only the uib-tabset header is replaced with a React mount.
-->
<div id="receipt_tab">
    <div class="row">
        <div class="col-sm-12">
            <react-component name="PaymodeTabScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
            <div ui-view class="tabview"></div>

        </div>
    </div>
</div>
