<style>
    button.draftbutton {
        margin-top: 30px;
    }
</style>
<!--
  React bridge migration (hybrid, shared design across the three
  payment-mode-change list screens -- oppaymodechange, pharpaymodechange,
  advreptpaymodechange -- which are copy-pasted OP/Pharmacy/Advance-receipt
  variants of the same controller/template pair, differing only in the
  filter-field name (BillNo vs ReceiptNumber), whether that field
  auto-refetches, and whether a Bill Number results column applies.
  Classified HYBRID because of the live <patientsearch> widget in the
  filter row, whose value IS read by getPaymentDetailList() (Params Key
  2) -- left untouched, native AngularJS markup below, sandwiched between
  the three React mounts: PaymodeChangeFilterScreen (part="dates"),
  PaymodeChangeFilterScreen (part="filterfield"), then the widget, then
  PaymodeChangeFilterScreen (part="fetch"). Results table replaced with
  PaymodeChangeListScreen.

  Preserved real API calls (unchanged): billing/patientpaymentdetails/
  GetPatientPaymentDetails, billing/patientpaymentdetails/
  GetSystemDatetime, General/Options/getoptions, billing/patientbills/
  Print*Bills (via paymodechangeprint).

  DELIBERATELY NOT MIGRATED: showPaymentChanger()/paymodechange() open the
  "app.paychanger" modal (paychangerController), a payment-method-change
  form gated by utl.Validator.validate($scope) across nearly all of its
  fields (Bank/Cheque/DD/UPI/CardType/Terminal/CardNumber/AuthCode) and
  mutating billing/PatientPaymentDetails/ManagePaymodeChange. Per the
  strict hybrid-classification rule, any utl.Validator.validate($scope)
  screen keeps its native AngularJS form fields; here that is effectively
  the whole form, so paychanger.js/.html is left as pure AngularJS,
  called exactly as before -- classified AngularJS-fallback, not
  React-bridged, given its financial/validation-heavy risk profile.

  Confirmed pre-existing quirk, reproduced as-is: the last results-table
  header column is labelled "Status" (billing.paymodechange.status.lbl)
  in all three original templates, but its data cell actually renders
  the edit/print action buttons, never a status value.
-->
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <react-component name="PaymodeChangeFilterScreen" props="{ part: 'dates', reactProps: reactProps, onAction: handleReactAction }"></react-component>
        <react-component name="PaymodeChangeFilterScreen" props="{ part: 'filterfield', filterFieldKey: 'BillNo', filterFieldLabel: 'Bill Number', autoRefetch: false, reactProps: reactProps, onAction: handleReactAction }"></react-component>
        <div class="col-sm-2">
            <label class="col-sm-12" translate="billing.opbilling-list.patientsearch.lbl"></label>
            <div class="col-sm-12">
                <patientsearch controlid="'pid'" patientid="currentfilter.PatientId" name="txtpatientsearch"
                    patientinfo="selectedPatient" isdisabled="" filterconfig="patientfilterconfig"></patientsearch>
            </div>
        </div>

        <react-component name="PaymodeChangeFilterScreen" props="{ part: 'fetch', reactProps: reactProps, onAction: handleReactAction }"></react-component>
    </form>
</div>
<div class="row">
    <react-component name="PaymodeChangeListScreen" props="{ showBillNoColumn: true, reactProps: reactProps, onAction: handleReactAction }"></react-component>
</div>
<div class="fooder-bgs">
</div>
