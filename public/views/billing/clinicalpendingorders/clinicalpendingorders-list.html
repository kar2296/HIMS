<!--
  UI-MODERNIZATION RETROFIT (Billing / Clinical Orders "Pending Orders"
  list, app.pendingorders). This fragment mounts the real screen's UI as
  a React component (ClinicalPendingOrdersListScreen). AngularJS
  (clinicalpendingorders-list.js) is hollowed to a thin dispatcher: it
  still owns vm.gridConfig, the real emr/patientorder/GetPatientOrders
  call, PageContext-based pagination, and the real $state.go navigation
  for the B2B/OPB/DGB actions -- React only renders $scope.reactProps
  and dispatches action names back via handleReactAction. See
  clinicalpendingorders-list.js for the full disclosure of confirmed
  dead code (the commented-out Filter/Add New Orders buttons and the
  functions only reachable from them) and confirmed pre-existing quirks
  preserved as-is (the "Referred By" column duplicating the "Patient"
  column's data, and two column headers whose translate keys are missing
  from i18n and so literally render as raw key strings on the real
  screen today).

  The original inline <style> block (ui-grid viewport height media
  queries, .priority/.icon_emrboard/.icon_home/.opb-color8 helper
  classes) belonged to the ui-grid markup this replaces. Confirmed dead
  even in the original: none of these four class selectors were applied
  to any element in this file's own body (verified by reading the full
  original template) -- only defined, never used on this screen.
  Dropped here with no visible effect.
-->
<div style="width: 100%;">
    <react-component name="ClinicalPendingOrdersListScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
</div>
