<!--
  React bridge migration (single mount). Daily Collection list
  (DailyCollectionListController). No native widgets, no live
  utl.Validator.validate($scope) call (both references in the original
  controller are commented out -- dead code).

  Preserved real API calls (unchanged): billing/CollectionReport/
  GetCollectionReports, billing/CollectionReport/ManageCollectionReportUpdate,
  General/Options/getoptions.

  Confirmed pre-existing quirks, reproduced as-is (not fixed):
  - The row checkbox's ng-click handler in the original,
    ShaSelectionChange(item), does not exist anywhere in the controller
    (only an unused SelectionChange() is defined) -- a silent no-op; the
    checkbox still works because ng-model drives IsSelected directly.
    Reproduced by wiring the checkbox to toggle IsSelected only.
  - $scope.currentcontext was never initialized in the original controller
    (selectAllItems() reads currentcontext.selectall, and the header
    checkbox's own ng-model="currentcontext.selectall" would auto-vivify
    it via AngularJS two-way binding). A defensive
    "$scope.currentcontext = {};" was added at controller startup so the
    React bridge cannot throw depending on click/change event ordering --
    pure crash-prevention, not a business-behavior change.
  - The footer's Print button (ng-show="item.DoctorInvoiceStatusId == 3")
    can never actually appear: $scope.item is only ever assigned as an
    ARRAY (getSelectionRows()'s return value) inside saveItem(), so
    item.DoctorInvoiceStatusId is always undefined, and $scope.print is
    never even defined. Omitted from the React mount as genuinely
    unreachable, not silently dropped -- documented here instead.
-->
<react-component name="DailyCollectionListScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
