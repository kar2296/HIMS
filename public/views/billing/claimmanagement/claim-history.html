<!--
  React bridge migration (single mount). Read-only $uibModalInstance
  dialog (claimhistoryController) opened from other claimmanagement
  screens to show a claim's Created/Submitted/Dispatched by/on
  history. All fields come from modalConfig.params.history. No API
  calls, no native widgets, no utl.Validator.validate call. The
  original's angular.extend(this, utl.Ctrl.getBaseCtrl(...)) mixin is
  confirmed unused by this read-only template -- not reproduced.
  There is also no close (X) button in the original modal-header --
  $scope.cancelCallback is defined but never wired to any element;
  reproduced as-is (no close button added here either).
-->
<style>
    .patientprofile-img {
        width: 70px !important;
        height: 70px !important;
    }

    .panel-body .well {
        height: 300px;
    }

    .fullreg-profiles2 {
        min-height: 22px;
        color: #fff;
        background: -moz-linear-gradient(top, #fff 0, #f3f3f3 50%, #ededed 100%, #fff 100%);
        -moz-box-shadow: 7px 5px 15px -9px rgba(0, 0, 0, .75);
        box-shadow: 7px 5px 15px -9px rgba(0, 0, 0, .75);
        background: url(app/img/header-bg.jpg) repeat-x left top;
    }

    .custom-modal-header {
        padding: 0px 7px !important;
    }

    .custom-modal-header {
        padding: 0px 11px;
    }

    .custom-modal-header h4 {
        margin: 4px 0px;
        font-size: 14px;
    }

    .panel-body .well {
        padding: 0px 19px !important;
    }

    .panel {
        margin-bottom: 0;
    }

    .top {
        margin: 4px !important;
    }
</style>
<react-component name="ClaimHistoryScreen" props="{ reactProps: reactProps }"></react-component>
