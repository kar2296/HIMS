<!--
  React bridge migration (HYBRID). Native <h4> title retained. The
  header search input (Batch No.) and the filter row (Facility/
  From Date/To Date/Payer Name) are now ClaimProcessFilterScreen
  mounts (part='search' / part='filters'); the Status filter stays a
  native, untouched <multiselectchk> -- a generic ng-dropdown-multiselect-
  based library widget (see public/vendor/components/multiselectchk.js),
  classified alongside real ui-grid/<dynamicform> as too complex/risky
  to safely reimplement in React. The results grid is now a
  ClaimProcessListScreen mount, replacing <custom-table>; the
  pagination <ul uib-pagination> below it stays native/untouched.

  Confirmed pre-existing column-label mismatches in
  claimprocessController's vm.gridConfig.columnDefs, reproduced exactly
  (not corrected, per "document, don't fix"):
    - "Claim No" header actually renders the SubmittedOn date/time
    - "UHID" header actually renders ClaimNumber
    - "Patient Name" header actually renders Guarantor.GuarantorName
    - "Claim Date" header actually renders ClaimAmount (currency)
    - "Payer Name" header actually renders the Createdy/CreatedUser name
-->
<style>
    .form-group {
        height: 62px;
    }
</style>
<div class="row">
    <div class="col-sm-9">
        <h4 translate="billing.claimprocess.pagetitle.lbl"></h4>
    </div>
    <react-component name="ClaimProcessFilterScreen" props="{ part: 'search', reactProps: reactProps, onAction: handleReactAction }"></react-component>
</div>
<div class="row">
    <react-component name="ClaimProcessFilterScreen" props="{ part: 'filters', reactProps: reactProps, onAction: handleReactAction }"></react-component>

    <div class="form-group col-sm-2">
        <label class="col-sm-12 control-lable" translate="billing.claimsubmission-list.status.lbl"></label>
        <div class="col-sm-12">
            <multiselectchk list="lookup.ClaimSubmissionStatus" selected="currentfilter.ClaimSubmissionStatusId"
                change="getList()"></multiselectchk>
        </div>
    </div>
</div>
<div class="row">
    <react-component name="ClaimProcessListScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
