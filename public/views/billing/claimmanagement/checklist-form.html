<!--
  React bridge migration (HYBRID). ChecklistFormScreen mounts cover
  'header' (title + patient-alerts badge), 'patientinfo' (Patient
  Info/Age/DOB panel), 'summary' (checklist-banner stat row), and
  'footer' (Back/Attachments/Print/Save&Approve). ChecklistFormDetailsScreen
  covers the document-checklist table, reimplementing the small
  in-house <radiogroupcontrol> component (not a 3rd-party framework
  widget, so unlike <multiselectchk>/ui-grid it is safely rebuilt here).

  Confirmed pre-existing bugs, reproduced exactly (not "fixed") -- see
  ChecklistFormScreen.tsx for detail: the 'summary' row's four stats
  are bound in the original to a `Data` scope property the controller
  never defines (always blank in production); the Print button calls
  `$scope.print3()`, which is also never defined (throws when clicked).
-->
<link rel="stylesheet" href="app/css/drhms.css">
<style>
    .checklist-banner .span {
        color: #f05050;
    }
</style>
<react-component name="ChecklistFormScreen" props="{ part: 'header', reactProps: reactProps, onAction: handleReactAction }"></react-component>
<react-component name="ChecklistFormScreen" props="{ part: 'patientinfo', reactProps: reactProps, onAction: handleReactAction }"></react-component>
<div class="col-sm-12">
    <react-component name="ChecklistFormScreen" props="{ part: 'summary', reactProps: reactProps, onAction: handleReactAction }"></react-component>
    <react-component name="ChecklistFormDetailsScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
</div>
<react-component name="ChecklistFormScreen" props="{ part: 'footer', reactProps: reactProps, onAction: handleReactAction }"></react-component>
