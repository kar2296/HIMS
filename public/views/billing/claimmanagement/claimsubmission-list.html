<!--
  React bridge migration (HYBRID). Native <h4> title kept. 'search'
  mount covers the Batch No. header search + Add button; 'filters'
  covers From/To Date, Facility (disabled), and Bill #.; the native
  <autosearch> (Guarantor) and <multiselectchk> (Status) widgets stay
  untouched, same as elsewhere in this migration. Results grid becomes
  ClaimSubmissionListScreen, replacing <custom-table>; native
  pagination footer untouched.

  Confirmed pre-existing dead-input quirk, reproduced exactly (not
  "fixed"): the "Bill #." field binds currentfilter.BillNo, never
  read anywhere by getList() -- fully interactive but has zero effect
  on the fetched results.
-->
<div class="row">
    <div class="col-sm-9">
        <h4 translate="billing.claimsubmission-list.pagetitle.lbl"></h4>
    </div>
    <react-component name="ClaimSubmissionFilterScreen" props="{ part: 'search', reactProps: reactProps, onAction: handleReactAction }"></react-component>
</div>

<div class="row">
    <react-component name="ClaimSubmissionFilterScreen" props="{ part: 'filters', reactProps: reactProps, onAction: handleReactAction }"></react-component>

    <div class="form-group col-sm-2">
        <label class="col-sm-12 control-lable" translate="billing.claimsubmission-list.guarantorname.lbl"></label>
        <div class="col-sm-12">
            <autosearch itemid="currentfilter.GuarantorId" tabindex="tabindexmap.patienttabindex" iteminfo=""
            on-enter="getList()" rowdata="" config="vm.guarantorcontrolconfig" itemchange="getList()">
            </autosearch>
        </div>
    </div>
    <div class="form-group col-sm-2">
        <label class="col-sm-12 control-lable" translate="billing.claimsubmission-list.status.lbl"></label>
        <div class="col-sm-12">
            <multiselectchk list="lookup.ClaimSubmissionStatus" selected="currentfilter.ClaimSubmissionStatusId"
                change="getList()"></multiselectchk>
        </div>
    </div>
</div>
<div class="row">
    <react-component name="ClaimSubmissionListScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
