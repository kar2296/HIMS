<!--
  React bridge migration (HYBRID). ClaimSubmissionFormScreen mounts
  cover 'header' (title + Batch No./Created date, or From/To Bill
  Date when creating a new batch), 'infocol1'/'infocol2'/'infocol3'
  (the 3-column read-only info panel), 'loadbutton' (Load Bills), and
  'footer' (Back/History/Print/Create/Submission/Dispatch).
  ClaimSubmissionFormBillsScreen covers the Load-Bills table. The
  native <patientsearch> (shown only when creating a new batch) and
  <autosearch> (Payer, in infocol1) widgets stay untouched -- same
  business-search directives kept native throughout this migration.

  Confirmed pre-existing dead code, NOT reproduced: the controller's
  extensive vm.gridConfig (real ui-grid columnDefs, row-selection,
  gridApi) is never bound to any element in this template -- see
  ClaimSubmissionFormBillsScreen.tsx for detail. Also not reproduced:
  the Print-Preview button's `hotkey="{'alt+p' : print}"` binding, a
  shared AngularJS keyboard-shortcut directive independent of this
  React mount -- note it calls a DIFFERENT function ($scope.print,
  which needs a ClaimSubmissionDetailId argument it never receives via
  the hotkey) than the button's own click handler (printclaim()), a
  pre-existing inconsistency left as an observation only.
-->
<link rel="stylesheet" href="app/css/drhms.css">
<style>
    patientsearch#drhms-patinet-search-box .custom-popup-wrapper {
        margin-left: -400px;
    }

    .custom-popup-wrapper {
        margin-left: -200px;
    }

    .fa-regular,
    .fa-solid {
        font-family: 'FontAwesome';
    }
</style>
<react-component name="ClaimSubmissionFormScreen" props="{ part: 'header', reactProps: reactProps, onAction: handleReactAction }"></react-component>
<div class="row">
    <div class="drhms-filters">
        <div class="col-sm-6" ng-if="currentcontext.id==0">
            <patientsearch id="drhms-patinet-search-box" ng-keyup="moveHeaderFocus('pid')" patientid="item.PatientId"
                class="col-sm-8 logo" name="txtpatientsearch" patientinfo="selectedPatient"
                tabindex="tabindexmap.patienttabindex" filterconfig="patientfilterconfig">
            </patientsearch>
        </div>
    </div>
</div>
<div class="col-sm-12">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="drhms-table-top-header">
            <div class="drhms-table-head-border">
                <react-component name="ClaimSubmissionFormScreen" props="{ part: 'infocol1', reactProps: reactProps, onAction: handleReactAction }"></react-component>
                <div class="col-sm-12">
                    <label class="col-sm-4" translate="Payer"></label>
                    <div class="col-sm-8">
                        <autosearch itemid="item.GuarantorId" ttabindex="tabindexmap.patienttabindex" iteminfo=""
                            name="'referredby'" rowdata="" config="vm.guarantorcontrolconfig" candisable="IsDisabled"
                            itemchange="" isrequired="true">
                        </autosearch>
                    </div>
                </div>
            </div>
            <react-component name="ClaimSubmissionFormScreen" props="{ part: 'infocol2', reactProps: reactProps, onAction: handleReactAction }"></react-component>
            <react-component name="ClaimSubmissionFormScreen" props="{ part: 'infocol3', reactProps: reactProps, onAction: handleReactAction }"></react-component>
        </div>
    </form>
</div>
<react-component name="ClaimSubmissionFormScreen" props="{ part: 'loadbutton', reactProps: reactProps, onAction: handleReactAction }"></react-component>
<react-component name="ClaimSubmissionFormBillsScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
<react-component name="ClaimSubmissionFormScreen" props="{ part: 'footer', reactProps: reactProps, onAction: handleReactAction }"></react-component>
