<!--
  React bridge migration (HYBRID). Title row + Advanced-Filter button
  and the main filter row become ChecklistFilterScreen mounts
  (part='title'/'filters'); the results grid becomes
  ChecklistListScreen, replacing <custom-table>; the native
  <ul uib-pagination> footer stays untouched.

  The Advanced-Filter button dispatches straight through to the real,
  unmodified $scope.openAdvancedFilter(), which still opens the native
  AngularJS schema-driven dynamic-form popover (utl.Modal.
  openDynamicForm) exactly as before -- that generic popover renderer
  is shared infrastructure and not reimplemented here.

  Confirmed pre-existing dead-input quirks, reproduced exactly (not
  "fixed"): the "Receipt Date" field (currentfilter.PaymentDate) and
  the "From Date" field (currentfilter.billdate) are both fully
  interactive but never read by getList() -- which instead reads
  currentfilter.BillDate / currentfilter.AdmissionDate, neither of
  which is ever bound to any UI element. See ChecklistFilterScreen.tsx
  for detail.
-->
<react-component name="ChecklistFilterScreen" props="{ part: 'title', reactProps: reactProps, onAction: handleReactAction }"></react-component>
<div class="row">
    <react-component name="ChecklistFilterScreen" props="{ part: 'filters', reactProps: reactProps, onAction: handleReactAction }"></react-component>
</div>
<div class="row">
    <react-component name="ChecklistListScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
