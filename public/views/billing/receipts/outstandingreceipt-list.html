<style>
    button {
        margin: 2px 3px;
    }
    
    .ui-grid-render-container-left .ui-grid-viewport {
        height: 173px !important;
    }
    #datepicker .uib-datepicker {
    width: 273px !important;
    font-size: 14px !important;
}
ul.uib-datepicker-popup.dropdown-menu.ng-scope {
    width: 100%;
}
#lidatepicker table {
    margin: unset;
    margin-bottom: unset !important;
    table-layout: fixed;
    width: 96%;
    max-width: 87%;
    padding: 15px !important;
}
.custom-table.table-striped.table-bordered {
    height: 66vh;
}
</style>

<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="billing.outstandingbill-list.pagetitle.lbl"></h4>
</div>
<div class="bg-pattern">
    <div class="row filter-area panel-favorite">
        <div class="dynamicform-content">
            <dynamicform modeldata="modeldata" schema="schema"></dynamicform>
            <div class="form-group col-sm-3">
                <button type="button" class="draftbutton  {{action.cls}}" ng-repeat="action in schema.actions" ng-click="actionClick(action.type)"
                    translate="{{action.translate}}"></button>
            </div>
        </div>
    </div>
    <div class="col-sm-12 grid-div">
        <div ui-grid="vm.gridConfig" class="table-uigrid" set-grid-height reduce-height="200" ui-grid-selection></div>
    </div>
    <div class="col-sm-12 panel-footer formactionbar">
        <div class="col-sm-11">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
        <div class=" col-sm-1">
            <button type="button" class="btn btn-danger btn-sm pull-right" ng-click="cancelCallback()" translate="common.cancelaction.lbl"></button>
        </div>
    </div>
</div>
