<style>
    button {
        margin: 2px 3px;
    }
    
    .ui-grid-render-container-left .ui-grid-viewport {
        height: 173px !important;
    }
    #datepicker .uib-datepicker {
    width: 273px !important;
    font-size: 14px !important;
}
ul.uib-datepicker-popup.dropdown-menu.ng-scope {
    width: 100%;
}
#lidatepicker table {
    margin: unset;
    margin-bottom: unset !important;
    table-layout: fixed;
    width: 96%;
    max-width: 87%;
    padding: 15px !important;
}
.custom-table.table-striped.table-bordered {
    height: 66vh;
}
</style>

<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="billing.outstandingbill-list.pagetitle.lbl"></h4>
</div>
<div class="bg-pattern">
    <div class="row filter-area panel-favorite">
        <div class="dynamicform-content">
            <dynamicform modeldata="modeldata" schema="schema"></dynamicform>
            <div class="form-group col-sm-3">
                <button type="button" class="draftbutton  {{action.cls}}" ng-repeat="action in schema.actions" ng-click="actionClick(action.type)"
                    translate="{{action.translate}}"></button>
            </div>
        </div>
    </div>
    <!-- UI-MODERNIZATION RETROFIT (Billing / Receipts "Outstanding Bills"
     picker modal, app.outstandingreceipt-list,
     outstandingreceiptListController). The results grid, pagination, and
     Cancel button below are now rendered by the
     BillingOutstandingBillPickerScreen React component via the existing
     AngularJS<->React bridge directive. AngularJS remains authoritative
     for all data/business logic -- see
     outstandingreceipt-list.js's refreshReactProps/handleReactAction
     bridge and the disclosure comment at the top of
     BillingOutstandingBillPickerScreen.tsx for the full rationale.

     DELIBERATE PARTIAL MIGRATION: the filter area above (<dynamicform>
     plus its Apply/Reset action buttons) and the modal header are left
     completely untouched as native AngularJS markup, matching the same
     hybrid-migration precedent already used for creditnote-list.js's
     "Fetch" popover and the cnpicker modal. -->
    <react-component name="BillingOutstandingBillPickerScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>

</div>
