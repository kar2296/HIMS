<!--
  UI-MODERNIZATION RETROFIT (Billing / Receipts list, app.receipt-list).
  This fragment mounts the real screen's UI as a React component
  (BillingReceiptListScreen). AngularJS (receipt-list.js) is hollowed to
  a thin dispatcher: it still owns vm.gridConfig, the real
  Billing/PatientPaymentDetails/GetPatientPaymentDetails call, the real
  add/edit/view navigation to app.receipt-form, the real "Previous
  Bills" flow that opens the already-migrated ReceiptPickerScreen modal
  (utl.Modal.open('app.receiptpicker', ...)), the real refund modal
  flow (utl.Modal.open('app.refund-form', ...)), and the real delete
  flow (security-PIN check / confirm dialog, then
  Billing/PatientPaymentDetails/DeletePatientPaymentDetails) -- React
  only renders $scope.reactProps and dispatches action names back via
  handleReactAction. See receipt-list.js and BillingReceiptListScreen
  for the full disclosure of confirmed pre-existing quirks preserved
  as-is: both date filters sharing the identical "Date" label, the
  duplicate view/edit icons shown together for ReceiptStatusId===2 rows,
  and the literal (non-translated) "NAME/MRN" placeholder.
-->
<div style="width: 100%;">
    <react-component name="BillingReceiptListScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
</div>
