<style>
    .profileinput {
        height: 19px !important;
        padding-bottom: 1px !important;
    }
    
    .fullreg-profiles label {
        margin-bottom: -2px;
    }
    
    .ui-grid-viewport {
        height: 212px !important;
    }
    
    .table-uigrid {
        height: 238px!important;
    }
    
    .custom-modal-header {
        margin-bottom: -1px;
    }
</style>

<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="billing.receipt-form.findreceipt.lbl"></h4>
</div>
<div class="bg-pattern  padding-top5">
    <div class="row  container-fluid filter-area">

        <div class="col-sm-12 form-group">
            <div class="col-sm-4">
                <div class="form-group">
                    <label class="col-sm-5 control-label" for="fromdate" translate="billing.findbill-list.fromdate.lbl"></label>
                    <div class="col-sm-7">
                        <input type="text" class="form-control col-sm-4" name="fromdate" ng-date-object datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                            ng-click="fromdateonPopup = { opened: true }" is-open="fromdateonPopup.opened" ng-model="item.FromDate">
                    </div>
                </div>
            </div>


            <div class="col-sm-4">
                <div class="form-group">
                    <label class="col-sm-5 control-label" for="todate" translate="billing.findbill-list.todate.lbl"></label>
                    <div class="col-sm-7">
                        <input type="text" class="form-control col-sm-4" name="todate" ng-date-object datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                            ng-click="todatePopup = { opened: true }" is-open="todatePopup.opened" ng-model="item.ToDate">
                    </div>
                </div>
            </div>




            <div class="col-sm-4">
                <div class="form-group">
                    <label class="col-sm-5 control-label" for="billtype" translate="billing.findbill-list.billtype.lbl"></label>
                    <div class="col-sm-7">
                        <input type="text" class="form-control" name="billtype" ng-model="item.BillType" placeholder="">
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-12 form-group">
            <div class="col-sm-4">
                <div class="form-group">
                    <label class="col-sm-5 control-label" for="patientname" translate="billing.findbill-list.patientname.lbl"></label>
                    <div class="col-sm-7">
                        <input type="text" class="form-control" name="patientname" ng-model="item.PatientName" placeholder="">
                    </div>
                </div>
            </div>
            <div class="col-sm-4">
                <div class="form-group">
                    <label class="col-sm-5 control-label" for="billnumebr" translate="billing.findbill-list.billnumber.lbl"></label>
                    <div class="col-sm-7">
                        <input type="text" class="form-control" name="billnumber" ng-model="item.BillNumber" placeholder="">
                    </div>
                </div>
            </div>
            <div class="col-sm-4">
                <div class="form-group">
                    <label class="col-sm-5 control-label" for="facility" translate="billing.findbill-list.facility.lbl"></label>
                    <div class="col-sm-7">
                        <ui-select ng-model="item.FacilityId" name="facility">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-12 form-group">
            <div class="col-sm-4">
                <div class="form-group">
                    <label class="col-sm-5 control-label" for="ipnumber" translate="billing.findbill-list.ipnumber.lbl"></label>
                    <div class="col-sm-7">
                        <input type="text" class="form-control" name="ipnumber" ng-model="item.MRN" placeholder="">
                    </div>
                </div>
            </div>
            <div class="col-sm-5 col-md-7">
                <span>
                        <button class="btn btn-small btn-xs " ng-click="">
        <i class="fas fa-search" aria-hidden="true"></i><strong class="btn-fontsize"> &nbsp; Search</strong>
    </span>
            </div>
        </div>
    </div>
</div>

<div ui-grid="vm.gridConfig" class="table-uigrid table-uigrid-tab"></div>
<div class="fooder-bg ">
    <div class="pull-right">
        <div class="col-sm-12">
            <button type="button" id="btnsubmit" class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
            <button id="btnCancelForm" type="button" class="draftbutton" ng-click="cancelCallback()" translate="common.cancelaction.lbl"></button>
        </div>
    </div>
</div>
</div>
