<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Edit Discharge Date"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-3">
            <label class="col-sm-12 control-label" for="discdate" translate="Date of Discharge"></label>
            <div class="col-sm-12">
                <div class="datepicker" id="datepicker">
                    <input type="text" class="form-control" name="doddate" ng-date-object datetime-picker="{{dateTimePickerOptions.dateTimeFormat}}" placeholder="{{datePickerOptions.placeholder}}" ng-click="doddatePopup = { opened: true }" is-open="doddatePopup.opened" ng-model="item.DischargeDate">
                    <i class="fa fa-calendar"></i>
                </div>
            </div>
        </div>
    </form>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="pull-right">
            <button type="button" class="draftbutton" ng-click="saveDate()" translate="common.saveaction.lbl"></button>
        </div>
    </div>
</div>
