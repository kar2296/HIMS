<div class="row page-header">
    <h4 class="mt0" translate="MRD File Receive"></h4>
</div>
<div class="row">
    <div class="col-sm-3 form-group">
        <label class="col-sm-4" translate="Name"></label>
        <div class="col-sm-8">
            <div class="search">
                <input type="text" id="pid" class="form-control" on-enter="getList()"
                    ng-model="currentfilter.PatientName" placeholder="NAME/MRN">
                <i class="fas fa-search" aria-hidden="true"></i>
            </div>
        </div>
    </div>
    <div class="col-sm-3 form-group">
        <label class="col-sm-4" translate="VisitNo"></label>
        <div class="col-sm-8">
            <div class="search">
                <input type="text" id="pid" class="form-control" on-enter="getList()" ng-model="currentfilter.VisitNo"
                    placeholder="VisitNo">
                <i class="fas fa-search" aria-hidden="true"></i>
            </div>
        </div>
    </div>
    <div class="col-sm-3 form-group">
        <label class="col-sm-4" translate="Return Date"></label>
        <div class="col-sm-8">
            <div id="datepicker">
                <input type="text" class="form-control" name="dateofbirth" ng-change="getList()"
                    datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="dateofbirthPopup = { opened: true }"
                    is-open="dateofbirthPopup.opened" ng-model="currentfilter.ReturnDate">
            </div>
        </div>
    </div>
    <div class="col-sm-3 form-group">
        <label class="col-sm-4" translate="Status"></label>
        <div class="col-sm-8">
            <react-component name="BridgeLookupSelectScreen" props="{ reactProps: reactPropsFilterContainer.reactProps, onAction: reactPropsFilterContainer.onAction }"></react-component>
        </div>
    </div>
</div>
<div class="row">
    <react-component name="BridgeGridScreen" props="{ reactProps: reactPropsGridContainer.reactProps, onAction: reactPropsGridContainer.onAction }"></react-component>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
