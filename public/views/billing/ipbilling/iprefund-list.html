<div class="summary-bill-lock">
    <button type="button" class="drhms-common-btn" ng-click="addRefund()"
        ng-if="HasAccess('IPBILLING_REFUND','IPREF_REFUND')"><i class="fa fa-plus"></i> Refund
    </button>
    <button type="button" class="drhms-common-btn" ng-click="addPartialRefund()"
        ng-if="HasAccess('IPBILLING_REFUND','IPREF_PARTIAL_REFUND')">
        Partial Refund
    </button>
</div>

<div class="">
    <react-component name="BridgeGridScreen" props="{ reactProps: reactPropsGridContainer.reactProps, onAction: reactPropsGridContainer.onAction }"></react-component>
    <div style="float: right;width: 30%;">
        <table id="bannerdetails">
            <tr>
                <td class="drhms-special-count"><span> Total :</span></td>
                <td class="drhms-currency-align drhms-special-count"> <span>{{TotalAmt | displaycurrency}}</span></td>
            </tr>
        </table>
    </div>
</div>
<div class="fooder-bgs">
    <div class="pull-left">
        <button type="button" class="drhms-common-back-btn" ng-click="backToList()">
            <i class="fa fa-angle-left" aria-hidden="true"></i>&nbsp;&nbsp;
            <span class="btn-fontsize" translate="common.backaction.lbl"></span>
        </button>
    </div>
</div>
