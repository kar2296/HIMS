<div class="summary-bill-lock">
    <button type="button" class="drhms-common-btn" ng-click="AdjustAgainstFund()" translate='billing.opbilling-list.adjustments.lbl'>
    </button>
    <button type="button" class="drhms-common-btn" ng-click="addReceipt()" ng-if="HasAccess('IPRECEIPT_DETAILS','IPRECEIPT_ADVANCE')">
        Advance
    </button>
</div>
<div class="">
    <react-component name="BridgeGridScreen" props="{ reactProps: reactPropsGridContainer.reactProps, onAction: reactPropsGridContainer.onAction }"></react-component>
    <div style="float: right;width: 30%;">
        <table id="bannerdetails">
            <tr>
                <td class="drhms-special-count"><span> Total :</span></td>
                <td class="drhms-currency-align drhms-special-count"> <span>{{TotalAmt | displaycurrency}}</span></td>
            </tr>
        </table>
    </div>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex" ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
