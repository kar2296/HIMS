<style>
    
</style>

<link href="app/css/billing-pharmacy-customs.css" rel="stylesheet">
<div class="row">
    <div class="col-sm-3">
        <label class="col-sm-5 control-label filter-lbl" translate="billing.ipbillingtab.ipnumber.lbl"></label>
        <div class="input-group col-sm-7">
            <div class="input-group-addon"><i class="fas fa-search" aria-hidden="true"></i></div>
            <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.VisitIdentifier"
                placeholder="IP Number">
        </div>
    </div>
    <div class="col-sm-3">
        <label class="col-sm-5 control-label" translate="billing.ipbillingtab.name.lbl"></label>
        <div class="input-group col-sm-7">
            <div class="input-group-addon"><i class="fas fa-search" aria-hidden="true"></i></div>
            <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.PatientMRN"
                placeholder="NAME/MRN">
        </div>
    </div>

    <div class="col-sm-3">
        <label class="col-sm-5 control-label filter-lbl" translate="billing.ipbillingtab.billnumber.lbl"></label>
        <div class="input-group col-sm-7">
            <div class="input-group-addon"><i class="fas fa-search" aria-hidden="true"></i></div>
            <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.BillNumber"
                placeholder="Bill Number">
        </div>
    </div>

    <div class="col-sm-2">
        <label class="col-sm-5 control-label filter-lbl" translate="billing.ipbillingtab.dischargeddod.lbl"></label>
        <div class="col-sm-7">
            <input type="text" class="form-control" name="" ng-change="getList()" datepicker-options="datePickerOptions"
                show-button-bar="{{datePickerOptions.showButtonBar}}"
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="doddatePopup = { opened: true }" is-open="doddatePopup.opened"
                ng-model="currentfilter.doddate">

        </div>
    </div>
    <div class="col-sm-1">
        <button style="padding:1px 5px;" class="btn bt-color3 btn-xs pull-right" uib-tooltip="Advance Search"
            tooltip-placement="bottom" ng-click="openAdvancedFilter()"> <i class="fa fa-filter fa-xs "
                aria-hidden="true"></i>&nbsp;&nbsp;Search
        </button>
    </div>
</div>

<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
