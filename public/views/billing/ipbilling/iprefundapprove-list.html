<style>
    button.drhms-common-btn {
        color: #fff;
        border: 0px;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        float: right;
        margin: 2px;
        display: flex;
        justify-content: center;
        align-items: center;
        align-content: center;
        flex-wrap: nowrap;
        flex-direction: row;
        background: #ff1981;
    }
</style>
<div class="row">
    <h4 class="header-name-litle col-sm-11" translate="IP Refund Approval"></h4>
    <!-- <div class="col-sm-1">
        <button type="button" class="drhms-common-btn" ng-click="addRefund()" uib-tooltip="Refund"
            tooltip-placement="bottom"><i class="fas fa-exchange-alt"></i>
        </button>
    </div> -->
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-3">
            <label class="col-sm-12" translate="billing.pharmacy-billdetails.fromdate.lbl"></label>
            <div class="col-sm-12">
                <!-- <input type="text" class="form-control" name="FromBillDate" ng-date-object
                    datetime-picker="{{datePickerOptions.dateTimeFormat}}" datepicker-append-to-body="true"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="FromBillDatePopup = { opened: true }"
                    is-open="FromBillDatePopup.opened" ng-model="currentfilter.FromBillDate"> -->
                    <div class="datepicker">
                        <input type="text" class="form-control" name="fromdate" ng-change="getList()"
                            datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                            placeholder="{{datePickerOptions.placeholder}}"
                            ng-click="fromdatePopup = { opened: true }" is-open="fromdatePopup.opened"
                            ng-model="currentfilter.FromBillDate">
                        <i class="fa fa-calendar" aria-hidden="true"></i>
                    </div>
            </div>
        </div>
        <div class="form-group col-sm-3">
            <label class="col-sm-12" translate="billing.pharmacy-billdetails.todate.lbl"></label>
            <div class="col-sm-12">
                <!-- <input type="text" class="form-control" name="ToBillDate" ng-date-object
                    datetime-picker="{{datePickerOptions.dateTimeFormat}}" datepicker-append-to-body="true"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="ToBillDatePopup = { opened: true }"
                    is-open="ToBillDatePopup.opened" ng-model="currentfilter.ToBillDate"> -->
                    <div class="datepicker">
                    <input type="text" class="form-control" name="todate" ng-change="getList()"
                        datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}"
                        ng-click="todatePopup = { opened: true }" is-open="todatePopup.opened"
                        ng-model="currentfilter.ToBillDate">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </div>
        </div>
        <div class="form-group col-sm-3">
            <label class="col-sm-12" translate="billing.opbilling-list.patientsearch.lbl"></label>
            <div class="col-sm-12">
                <patientsearch controlid="'pid'" patientid="currentfilter.PatientId" name="txtpatientsearch"
                    patientinfo="selectedPatient" isdisabled="" filterconfig="patientfilterconfig"></patientsearch>
            </div>
        </div>

        <div class="form-group col-sm-3">
            <label class="col-sm-12" translate="Status"></label>
            <div class="col-sm-12">
                <ui-select ng-model="currentfilter.RefundApprovalStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.RefundApprovalStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </form>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
