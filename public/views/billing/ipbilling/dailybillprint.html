<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Daily Print"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>
<div class="row">
    <div class="col-sm-4 form-group">
        <label class="col-sm-12" translate="patientemr.previousorder.fromdate.lbl"></label>
        <div class="col-sm-12">
            <div class="datepicker">
                <input type="text" class="form-control" name="fromdate" ng-date-object
                    datetime-picker="{{dateTimePickerOptions.dateTimeFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                    ng-change="Checkfromdate(item)" is-open="fromdatePopup.opened" ng-model="currentcontext.fromdate">
                <i class="fa fa-calendar"></i>
            </div>
        </div>
    </div>
    <div class="col-sm-4 form-group">
        <label class="col-sm-12" translate="patientemr.previousorder.todate.lbl"></label>
        <div class="col-sm-12">
            <div class="datepicker">
                <input type="text" class="form-control" name="todate" ng-date-object
                    datetime-picker="{{dateTimePickerOptions.dateTimeFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
                    ng-change="Checktodate(item)" is-open="todatePopup.opened" ng-model="currentcontext.todate">
                <i class="fa fa-calendar"></i>
            </div>
        </div>
    </div>
    <div class="col-sm-4 form-group">
        <button type="button" class="draftbutton" ng-click="print()" translate="common.printaction.lbl"></button>
    </div>
</div>
