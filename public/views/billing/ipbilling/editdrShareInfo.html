<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Doctor Share Update"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">

    </form>
</div>
<div class="fooder-bgs">
    <div class="pull-right">
        <button type="button" id="btnsubmit" class="draftbutton" translate="Update" ng-click="Save()"
            ng-show="CanShowUpdate"></button>
    </div>
</div>
