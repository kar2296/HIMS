<style>
    textarea.notes-textarea {
        margin-top: 0;
    }

    button.draftbutton {
        margin-top: 20px;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="billing.billlock.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="col-sm-4 form-group">
                <label class="col-sm-12" for="locktype" translate="billing.billlock.locktype.lbl"></label>
                <div class="col-sm-12">
                    <ui-select ng-model="item.LockTypeId" name="locktype" required ng-disabled="IsLocked">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.Text.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.LockType | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="col-sm-4 form-group">
                <label class="col-sm-12" translate="billing.billlock.comments.lbl"></label>
                <div class="col-sm-12">
                    <textarea rows="3" name="" ng-model="item.Comments" maxlength="4000" class="notes-textarea"
                        ng-hide="IsLocked" ng-disabled="IsLocked"></textarea>
                    <textarea rows="3" name="" ng-model="item.UnLockComments" maxlength="4000" class="notes-textarea"
                        ng-show="IsLocked" ng-disabled!="IsLocked"></textarea>
                </div>
            </div>
            <div class="col-sm-4 form-group">
                <button type="button" class="draftbutton" ng-if="!IsLocked" translate="billing.billlock.lock.lbl"
                    ng-click="checkmandatory()"></button>
                <button type="button" class="draftbutton" ng-if="IsLocked" translate="billing.billlock.unlock.lbl"
                    ng-click="doLock()"></button>
            </div>
        </form>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
