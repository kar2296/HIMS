<style>
    .modal-dialog {
        width: 900px;
        margin: 30px auto;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-6">
        <h4 class="modal-title custom-modal-title" translate="Edit Package"></h4>
    </div>
    <div class="col-sm-6">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label filter-lbl" for="ippackagename" translate="billing.packageassignment.packagename.lbl"></label>
            <div class="col-sm-12">
                {{item.IPPackageName}}
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" translate="Package Description"></label>
            <div class="col-sm-12">
                <textarea  class="form-control" rows="4" ng-model="item.IPPackageDescription"></textarea>
                <!-- <input type="text" class="form-control" ng-model="item.IPPackageDescription" placeholder=""> -->
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="packagamount" translate="clinicalmaster.package-form.packageamount.lbl"></label>
            <div class="col-sm-12">
                <input type="number" class="form-control" ng-model="item.PackageAmount" name="packagamount" placeholder="">
            </div>
        </div>
    </form>
</div>
<div class="">
    <div class="row">
        <div class="pull-right">
            <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()" ng-disabled="isFinalBill"></button>
        </div>
    </div>
</div>
