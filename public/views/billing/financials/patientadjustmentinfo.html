<!--
  React bridge migration (hybrid). Native <patientsearch> stays
  untouched (genuinely feeds patientChange() -> fnencounter() ->
  getVisitIndentifier() -> getList() chain). No utl.Validator.validate
  call.

  Migrated via 2 <react-component> mounts:
    1. PatientFinanceFilterScreen - From/To Date inputs (shared with
       patientrevenueinfo.html -- identical markup/behavior in both
       originals), mounted AFTER the native <patientsearch> in the
       same row.
    2. PatientAdjustmentInfoListScreen - replaces the <custom-table>
       grid (column-sort emulated client-side) + the Total/
       PaidAmount/Adjusted/UnAdjusted/Due totals banner. The real
       native <ul uib-pagination> stays untouched below (its pagerObj
       is genuinely used by getList()'s PageContext).

  Preserved real API calls (unchanged):
  registration/patient/GetPatientById, Visit/Visit/GetEncounters,
  Billing/PatientAccounts/GetPatientAccounts, General/Options/getoptions.

  Confirmed pre-existing quirks, reproduced as-is (not "fixed"):
  - The "Bill / Receipt No#" column's link dispatches to
    grid.appScope.handleEvents('transaction', row) in the original --
    handleEvents is never defined anywhere in this controller, so
    clicking it has always done nothing. No handler wired up here
    either (same no-op).
  - $scope.currentcontext.Total* fields are only reset to 0 once, at
    controller init -- NOT inside getListCallback -- so every
    subsequent search ADDS to the previous totals rather than
    replacing them. This is a genuine pre-existing bug, left unfixed;
    the banner just displays whatever currentcontext currently holds.
-->
<style>
    .pull-right-table {
        display: flex;
        justify-content: flex-end;
    }
</style>
<div class="row">
    <div class="col-sm-4">
        <label class="col-sm-4" translate="billing.patientadjustmentinfo.patientsearch.lbl"></label>
        <div class="col-sm-8">
            <patientsearch controlid="'pid'" ng-keyup="moveHeaderFocus('pid')" patientid="currentfilter.PatientId"
                name="txtpatientsearch" patientinfo="selectedPatient" patientchange="patientChange()"
                tabindex="tabindexmap.patienttabindex" isdisabled="" filterconfig="patientfilterconfig">
            </patientsearch>
        </div>
    </div>
    <react-component name="PatientFinanceFilterScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
</div>
<react-component name="PatientAdjustmentInfoListScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
