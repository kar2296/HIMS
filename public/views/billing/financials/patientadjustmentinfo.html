<!--
  MediFlow Enterprise Design System - Patient Payment Adjustment Info
  Search & filter card with patient search, demographic badge, From/To date filters, and financial metrics table
-->
<div class="pf-filter-card">
    <div class="pf-filter-header">
        <h3 class="pf-filter-header-title">
            <i class="fa-solid fa-sliders" aria-hidden="true"></i>
            <span>Search & Filter Financial Accounts</span>
        </h3>
        <span class="pf-filter-header-badge">Ledger Reconciliations</span>
    </div>

    <!-- Patient Search Row with Clearfix -->
    <div class="pf-patient-search-row">
        <label class="pf-field-label">
            <i class="fa-solid fa-user-plus" aria-hidden="true"></i>
            <span translate="billing.patientadjustmentinfo.patientsearch.lbl">Search & Select Patient</span>
        </label>
        <div class="pf-patient-search-input-wrap">
            <patientsearch controlid="'pid'" ng-keyup="moveHeaderFocus('pid')" patientid="currentfilter.PatientId"
                name="txtpatientsearch" patientinfo="selectedPatient" patientchange="patientChange()"
                tabindex="tabindexmap.patienttabindex" isdisabled="" filterconfig="patientfilterconfig">
            </patientsearch>
        </div>

        <!-- Quick Patient Summary Badge (Visible once a patient is selected) -->
        <div class="pf-selected-patient-badge" ng-if="selectedPatient && selectedPatient.Id">
            <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
            <span>
                <strong>Selected:</strong> {{selectedPatient.Title.Description}} {{selectedPatient.FirstName}} {{selectedPatient.LastName}}
                <span class="pf-meta-sep">|</span> UHID: <strong>{{selectedPatient.MRN}}</strong>
                <span class="pf-meta-sep" ng-if="selectedPatient.Mobile">|</span> Phone: <strong>{{selectedPatient.Mobile}}</strong>
                <span class="pf-meta-sep" ng-if="selectedPatient.Age">|</span> Age: <strong>{{selectedPatient.Age}} Y</strong>
            </span>
            <button type="button" class="pf-clear-patient-btn" ng-click="clearPatient()" title="Clear Patient Selection">
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
        </div>
    </div>

    <!-- Filter Controls Row (From/To Date + Refresh Button) -->
    <div class="pf-filters-grid">
        <react-component name="PatientFinanceFilterScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
    </div>
</div>

<!-- Financial KPI Cards & Adjustment Ledger Table -->
<react-component name="PatientAdjustmentInfoListScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>

<!-- Modernized Pagination Bar -->
<div class="pf-pagination-card" ng-show="vm.gridConfig.pagerObj.totalItems > 0">
    <div class="pf-pagination-wrapper">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
