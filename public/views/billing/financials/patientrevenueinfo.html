<!--
  React bridge migration (hybrid). Native <patientsearch> stays
  untouched (genuinely feeds patientChange() -> fnencounter() ->
  getVisitIndentifier() -> getList() chain). No utl.Validator.validate
  call.

  Migrated via 2 <react-component> mounts:
    1. PatientFinanceFilterScreen - From/To Date inputs (shared with
       patientadjustmentinfo.html -- identical markup/behavior).
    2. PatientRevenueInfoListScreen - results table + Total/Debit
       banner. This screen's vm.gridConfig (real ui-grid columnDefs)
       is entirely commented-out dead code in the original -- results
       actually render via plain ng-repeat over
       "ServiceCategories | filter:{Status:1}" (confirmed: no ui-grid/
       custom-table element anywhere in the original template).
       Reproduced as a plain table, filtering to Status===1
       client-side to match exactly. No pagination in the original
       (PageSize:1000 fetched in one shot) -- none added here either.

  Preserved real API calls (unchanged):
  registration/patient/GetPatientById, Visit/Visit/GetEncounters,
  Billing/PatientBills/GetPatientBills, General/Options/getoptions.
-->
<style>
    .pull-right-table {
        display: flex;
        justify-content: flex-end;
    }
</style>
<div class="row">
    <div class="col-sm-4">
        <label class="col-sm-4" translate="billing.patientadjustmentinfo.patientsearch.lbl"></label>
        <div class="col-sm-8">
            <patientsearch controlid="'pid'" ng-keyup="moveHeaderFocus('pid')" patientid="currentfilter.PatientId"
                name="txtpatientsearch" patientinfo="selectedPatient" patientchange="patientChange()"
                tabindex="tabindexmap.patienttabindex" isdisabled="" filterconfig="patientfilterconfig"></patientsearch>
        </div>
    </div>
    <react-component name="PatientFinanceFilterScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
</div>
<react-component name="PatientRevenueInfoListScreen" props="{ reactProps: reactProps }"></react-component>
