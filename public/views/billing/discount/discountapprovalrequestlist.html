<!--
    UI-MODERNIZATION RETROFIT (Billing / Discount Approval Request List,
    app.discountapproval, discountapprequestlistController) -- single
    <react-component> mount replacing the entire AngularJS template body
    below (everything after the shared <style> block). No native-only
    widgets are active (the <patientsearch> block is commented out in the
    original) and the controller never calls utl.Validator.validate($scope),
    so this qualifies for a single-mount bridge like the other list screens
    in this migration. AngularJS ui-router remains authoritative; every real
    API call is preserved exactly via utl.Http.doAction
    (billing/PatientBills/GetPatientBillswithoutdetails,
    billing/patientpaymentdetails/GetSystemDatetime,
    General/Options/getoptions), and EditBillingRequest(PatientBill) still
    opens the real app.editdiscountapproval modal via utl.Modal.open exactly
    as before.

    Confirmed pre-existing quirks, preserved exactly (documented, not
    fixed):
    - currentfilter.BillNo is bound to a real input in the original markup
      but is never referenced by getPatientBillList()'s filter Params (Key
      75/33/17/18/8/55 only) or anywhere else in the controller -- a
      pre-existing dead/no-op filter field. Reproduced as a controlled input
      that updates state but never affects the fetched list.
    - The Bill Type and Status <ui-select> controls both call
      getPatientBillList() directly on ng-change, bypassing the 15-day
      date-range validation that getList() (bound to the Fetch button)
      performs before every fetch -- an inconsistency between the two entry
      points, reproduced verbatim (billTypeChange/statusChange call
      getPatientBillList() directly; only the Fetch button dispatches
      'fetch' -> getList()).
    - The Status <ui-select> in the original carries id="doctorid" (a
      copy-paste leftover, presumably borrowed from a doctor-related
      screen) despite being bound to currentfilter.DiscountApprovalStatusId
      -- the id is not referenced anywhere else in the file, so this is
      cosmetic-only and not reproduced (React renders its own ids).
    - The IP/OP encounter-type tag next to the patient name is literal,
      untranslated text (no translate key), reproduced verbatim.
    - PatientBill.DiscountApprovedUser.FirstName || ...LastName: shows
      LastName only when FirstName is falsy, never both together --
      pre-existing quirk, reproduced verbatim (not "FirstName + LastName").
    - getList()'s date-range validation error uses
      utl.Alert.showSuccessMsg(...) to display a validation failure message
      (not an error-styled alert) -- left entirely in the unmodified
      AngularJS getList()/getSystemDBDate()/getPatientBillList() chain,
      which the 'fetch' action dispatches to unchanged.
-->
<react-component name="BillingDiscountApprovalListScreen" props="{ reactProps: reactProps, onAction: handleReactAction }"></react-component>
