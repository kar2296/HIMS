    utl.Http.doAction, unchanged.

    patientChange() are both fully defined in editdiscount.js but never
    invoked anywhere (the only two call sites,
    "$scope.getBillInfoByBillId();" and "$scope.patientChange();", are
    commented out at the very end of the controller) -- item is populated
    entirely, synchronously, from modalConfig.params.item plus
    billnumber/patientbillid/pid passed in from the parent list screen's row
    data. Because there is no async load, refreshReactProps() is called
    once directly after that synchronous setup (see editdiscount.js)
    instead of from a wrapped HTTP callback, the one deviation from this
    migration's usual bridge-callback pattern.
-->
