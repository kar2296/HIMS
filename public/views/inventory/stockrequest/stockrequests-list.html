<link rel="stylesheet" href="app/css/drhms.css">
<div class="row">
    <div class="drhms-filters">
        <div class="col-sm-6">
            <h4 translate="inventory.stockrequests.pagetitle2.lbl"></h4>
        </div>
        <div class="col-sm-2">
            <button class="loadbtn" ng-click="stockUpload()">
                <i class="fas fa-sync loading-icon" aria-hidden="true" uib-tooltip="Excel Upload" tooltip-placement="bottom"></i>
                <span>Upload</span>
            </button>
        </div>
        <div class="col-sm-3">
            <input type="text" class="form-control textbox-search" on-enter="getList()" ng-model="currentfilter.RequestNumber" translate
                translate-attr-placeholder="inventory.stockrequests.indentno.lbl">
        </div>
        <div class="col-sm-1">
            <button class="btn-add" ng-click="addNew()" uib-tooltip="{{ 'inventory.stockrequests.addnew-tooltip.lbl' | translate }}"
                tooltip-placement="bottom">
                <i class="fas fa-plus" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</div>
<div class="row">
    <div class="form-group col-sm-2">
        <label class="col-sm-12" for="fromdate" translate="From Date"></label>
        <div class="col-sm-12">
            <input type="text" class="form-control" name="fromdate" ng-change="getList()" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }" is-open="fromdatePopup.opened"
                ng-model="currentfilter.FromDate">
        </div>
    </div>
    <div class="form-group col-sm-2">
        <label class="col-sm-12" for="todate" translate="To Date"></label>
        <div class="col-sm-12">
            <input type="text" class="form-control" name="todate" ng-change="getList()" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }" is-open="todatePopup.opened"
                ng-model="currentfilter.ToDate">
        </div>
    </div>
    <div class="form-group col-sm-2">
        <label class="col-sm-12" for="fromstore" translate="inventory.stockrequests.mystore.lbl"></label>
        <div class="col-sm-12">
            <ui-select ng-model="currentfilter.StoreMasterId" name="fromstore" ng-change="getList()" required>
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.UserStores | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-2">
        <label class="col-sm-12" for="requeststatus" translate="inventory.stockrequests.requeststatus.lbl"></label>
        <div class="col-sm-12">
            <multiselectchk list="lookup.RequestStatus" selected="currentfilter.RequestStatusId" change="getList()">
            </multiselectchk>
        </div>
    </div>
    <div class="form-group col-sm-2">
        <label class="col-sm-12" for="tostore" translate="inventory.stockrequests.tostore.lbl"></label>
        <div class="col-sm-12">
            <ui-select ng-model="currentfilter.ToStoreMasterId" name="tostore" ng-change="getList()" ng-disabled="item.isDisabled" required>
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ToStore | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-2">
        <label class="col-sm-12" for="facility" translate="Facility"></label>
        <div class="col-sm-12">
            <ui-select ng-model="currentfilter.FacilityId" name="facility" ng-change="getList()" >
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
