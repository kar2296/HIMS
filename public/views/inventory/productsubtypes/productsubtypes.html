<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-5">
            <h4 class="col-sm-6 mt0" translate="inventory.productsubtypes.pagetitle.lbl"></h4>
        </div>
        <div class="col-sm-5">
            <div class="filters">
                <div class="search">
                    <input type="text" id="pid" class="form-control" on-enter="getList()" ng-model="currentfilter.subproducttypecode"
                     translate translate-attr-placeholder="inventory.productsubtypes.name1.lbl"> <i class="fas fa-search" aria-hidden="true"></i>

                </div>
                <button type="button" tabindex="-1" class="btn-add"
                    ng-click="addNew()" uib-tooltip="Product Sub Type"
                    tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                    <!-- <span translate="clinicalmaster.serviceitem-list.addnew.lbl " class="text-white"></span> -->
                </button>
            </div>
        </div>
    </div>
</div>

        <div class="col-sm-4">

            <label class="col-sm-4 control-label filter-lbl" translate="inventory.productsubtypes.filter_name.lbl"></label>
             <div class="col-sm-8">
                <ui-select ng-model="currentfilter.ProductTypeId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ProductType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>

        </div>

        <div class="col-sm-4">
            <label class="col-sm-4 control-label filter-lbl" translate="inventory.productsubtypes.filter_status.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">

                    </ui-select-choices>
                </ui-select>
            </div>
        </div>

    </div>
