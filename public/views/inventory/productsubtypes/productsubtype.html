<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-6">
            <h3 class="panel-title" translate="inventory.productsubtype.pagetitle.lbl"></h3>
        </div>
        <div class="col-sm-6">
            <button class="btn-add" ng-click="addNew()"
                uib-tooltip="Product Sub Type" tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
                <!-- <span
                    translate="clinicalmaster.serviceitem-list.addnew.lbl"></span> -->
                </button>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="panel panel-default bg-pattern">
                <div class="panel-body form-panel">
                    <div id="clinical">
                        <div class="col-sm-12 ">
                                <div class="form-group col-sm-6">
                                    <label class="col-sm-12 control-label" for="facility"
                                        translate="inventory.productsubtype.facilityId.lbl"></label>
                                    <div class="col-sm-12">
                                        <ui-select ng-model="item.FacilityId" name="facility" required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices
                                                repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group col-sm-6">
                                    <label class="col-sm-12 control-label" for="category"
                                        translate="inventory.itemcategory.name.lbl"></label>
                                    <div class="col-sm-12">
                                        <ui-select ng-model="item.CategoryId" name="category" theme="bootstrap"
                                            ng-change="getSubCategory()" required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices
                                                repeat="lookupitem.Id as lookupitem in lookup.ItemCategory | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                                                </div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group col-sm-6">
                                    <label class="col-sm-12 control-label" for="subcategory"
                                        translate="inventory.itemsubcategorys.filter_subcategoryname.lbl"></label>
                                    <div class="col-sm-12">
                                        <ui-select ng-model="item.SubCategoryId" name="subcategory" theme="bootstrap"
                                            ng-change="getProductType()" required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices
                                                repeat="lookupitem.Id as lookupitem in lookup.ItemSubCategory | filter: {Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                                                </div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group col-sm-6">
                                    <label class="col-sm-12 control-label" for="producttype"
                                        translate="inventory.producttype.name.lbl"></label>
                                    <div class="col-sm-12">
                                        <ui-select ng-model="item.ProductTypeId" name="producttype" theme="bootstrap"
                                            required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices
                                                repeat="lookupitem.Id as lookupitem in lookup.ProductType | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                                                </div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group col-sm-6">
                                    <label class="col-sm-12 control-label" for="code"
                                        translate="inventory.productsubtype.code.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="code"
                                            ng-model="item.SubProductTypeCode" placeholder="" required>
                                    </div>
                                </div>
                                <div class="form-group col-sm-6">
                                    <label class="col-sm-12 control-label" for="name"
                                        translate="inventory.productsubtype.name.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="name"
                                            ng-model="item.SubProductTypeName" placeholder="" required>
                                    </div>
                                </div>
                                <div class="form-group col-sm-6">
                                    <label class="col-sm-12 control-label"
                                        translate="inventory.productsubtype.description.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="description"
                                            ng-model="item.SubProductTypeDescription" placeholder="">
                                    </div>
                                </div>
                                <div class="form-group col-sm-6">
                                    <label class="col-sm-12 control-label"
                                        translate="inventory.productsubtype.isactive.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="checkbox" class="custom-checkbox" name="isactive"
                                            ng-model="item.IsActive" ng-checked="item.IsActive == 1">
                                    </div>
                                </div>
                            </div>
                            <div class="fooder-bgs">
                                <!-- <button type="button" class="btn btn-sm pyr-color10" ng-click="backToList()"><i
                                        class="fa fa-angle-left"></i>&nbsp;&nbsp;<span
                                        translate="common.backaction.lbl"></span></button> -->
                                <div class="pull-right">
                                    <button type="button" class="draftbutton" ng-click="save()"
                                        translate="common.saveaction.lbl"></button>
                                    <button type="button" class="draftbutton"
                                        translate="common.saveapprove-action.lbl" ng-click="saveandApprove()"></button>
                                    <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()"
                                        translate="common.clearaction.lbl"></button>
                                    <button id="btnCancelForm" type="button" class="cancelbutton" ng-click="backToList()"
                                        translate="common.cancelaction.lbl"></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
          
        </form>
    </div>
</div>
