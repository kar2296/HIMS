<style>
    /* .modal-lg{width:500px;} */
    .panel-body {
        padding: 15px;
        margin-left: 0px;
        margin-top: -53px;
        margin-right: 0px;
        margin-bottom: 0px;
        /* background-image: url(app/img/bg-body.jpg); */
        background-repeat: repeat;
        overflow: auto;
    }
    .bg-pattern { overflow: inherit;}
    .well {
        min-height: 20px;
        padding: 19px;
        margin-bottom: 0px;
        border: 1px solid #ededed;
        border-radius: 4px;
        background: rgb(233, 246, 253);
        /* Old browsers */
        background: -moz-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 2312, 251, 1) 100%);
        /* FF3.6-15 */
        background: -webkit-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 2312, 251, 1) 100%);
        /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, rgb(250, 250, 250) 0%, rgb(247, 252, 253) 100%);
        /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid: DXImageTransform.Microsoft.gradient( startColorstr='#e9f6fd', endColorstr='#d3eefb', GradientType=0);
        /* IE6-9 */
        box-shadow: 4px 2px 13px -7px rgba(0, 0, 0, 0.75);
    }

    .formactionbar {
        padding: 5px 15px;
        height: 40px;
        background-color: #ccecf5;
    }

    .custom-modal-header {
        margin-bottom: 10px;
        /* background-color: #597a9a; */
        color: #fff;
    }

    .modal-content {
        -webkit-box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        box-shadow: -1px 3px 20px 7px rgba(249, 244, 244, 0.5);
    }

    .modal-header {
        padding: 4px 10px;
        border-bottom: 1px solid #e5e5e5;
    }
	 .panel-body.form-panel{
        overflow-x: hidden;
    }
    ul.ui-select-choices.ui-select-choices-content.ui-select-dropdown.dropdown-menu.ng-scope{
        max-height:113px !important;
    }
</style>
<div class="modal-header custom-modal-header">
      <div class="col-sm-6">
            <h4 class="modal-title custom-modal-title" translate="inventory.indication.pagetitle.lbl"></h4>
                </div>
            <div class="col-sm-6">
                    <button type="button" class="btn btn-danger btn-sm pull-right" translate="x"
                    ng-click="cancelCallback()"></button>
                    </div>
        </div>
</div>

<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div>
                <div class="">
                    <div class="panel-body form-panel">
                        <div class="col-sm-12">
                                <div class="form-group col-sm-6 ">
                                    <label class="col-sm-12 control-label" for="facility" translate="inventory.indication.type.lbl"></label>
                                    <div class="col-sm-12">
                                        <ui-select ng-model="item.IndicationTypeId" name="facility" required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.IndicationType | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>


                                <div class="form-group col-sm-6 ">
                                    <label class="col-sm-12 control-label" for="code" translate="inventory.indication.code.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="code" ng-model="item.Code" placeholder="" required>
                                    </div>
                                </div>
                                <div class="form-group col-sm-6 ">
                                    <label class="col-sm-12 control-label" translate="inventory.indication.shortcode.lbl"></label>
                                    <div class="col-sm-12" >
                                        <input type="text" class="form-control" ng-model="item.ShortCode" placeholder="" >
                                    </div>
                                </div>
                                <div class="form-group col-sm-6 ">
                                    <label class="col-sm-12 control-label" for="occupations" translate="inventory.indication.indications.lbl"></label>
                                    <div class="col-sm-12" >
                                        <input type="text" class="form-control" name="occupations" ng-model="item.Indications" placeholder="" required>
                                    </div>
                                </div>
                                <div class="form-group col-sm-6 ">
                                    <label class="col-sm-12 control-label" translate="generalmaster.remark-form.isactive.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="checkbox" name="isactive" class="custom-checkbox"
                                            ng-model="item.IsActive">
                                    </div>
                                </div>
                                <!--<div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" translate="generalmaster.remark-form.facility.lbl"></label>
                                    <div class="col-sm-12">
                                        <radiogroupcontrol itemid="item.FacilityId" items="lookup.Facility"></radiogroupcontrol>
                                    </div>
                                </div>-->
                        </div>
                    </div>
                    <div class="fooder-bgs" style="margin-bottom: 46px;">
                        <div class="pull-right">
                            <button type="button"   class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
                            <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>
                            <button id="btnCancelForm" type="button" class="cancelbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                        </div>
                    </div>
                </div>
            </div>
            
        </form>
    </div>
</div>
