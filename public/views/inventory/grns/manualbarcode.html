<style>
    .modal-dialog {
        width: 600px;
        margin: 30px auto;
    }
</style>
<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Barcode"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>


<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="panel-body form-panel outer_border">
                <div class="panel panel-default">
                    <div class="table-responsive hm_dashboard top_logo">
                        <div id="dash-board">
                            <!-- <div class="form-group"> -->
                            <label class="col-sm-5 control-label" for="">
                                <span translate="BarCode" style="padding-right:10px;"></span>:</label>
                            <div class="col-sm-5">
                                <input type="text" class="form-control" ng-model="item.BarCodeId" placeholder="">
                            </div>
                            <!-- </div> -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="pull-right">
                    <button type="button" class="draftbutton" ng-hide="ShowSavebarcode" ng-click="saveCode()" translate="common.saveaction.lbl"></button>
                    <button type="button" class="draftbutton" ng-show="ShowSavebarcode" ng-click="savebarcode()" translate="common.saveaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
