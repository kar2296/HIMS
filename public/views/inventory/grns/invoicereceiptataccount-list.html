<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-6">
            <h4 class="mt0" translate="Invoice Receipt"></h4>
        </div>
        <div class="col-sm-6">
            <div class="filters">
                <div class="search">
                    <input type="text" class="form-control textbox-search" on-enter="getList()" name="ponumber"
                        ng-model="currentfilter.GrnNumber" translate
                        translate-attr-placeholder="Search PO # / Invoice / GRN #">
                    <i class="fas fa-search" aria-hidden="true"></i>
                </div>
                <span class="drhms-billing-btn drhms-home-btn" nng-if="Context =='store'"><i class="fas fa-home"
                        ng-click="backtoList()" uib-tooltip="Dashboard" tooltip-placement="bottom"></i></span>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-lg-3">
        <label class="col-lg-12 control-label" for="date" translate="inventory.grns.date.lbl"></label>
        <div class="col-lg-12">
            <div class="datepicker">
                <input type="text" class="form-control" name="grndate" ng-change="getList()"
                    datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="grndatePopup = { opened: true }"
                    is-open="grndatePopup.opened" ng-model="currentfilter.GrnDate">
                <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
        </div>
    </div>
    <div class="col-lg-3">
        <label class="col-lg-12 control-label" for="vendor" translate="inventory.grns.vendorname1.lbl"></label>
        <div class="col-lg-12">
            <autosearch itemid="currentfilter.VendorMasterId" iteminfo="" rowdata="" config="vm.vendorcontrolconfig"
                itemchange="getList()" onenter="getList()" placeholder="'Supplier'"></autosearch>
        </div>
    </div>
    <div class="col-lg-3">
        <label class="col-lg-12 control-label" for="fstore" translate="inventory.grns.store.lbl"></label>
        <div class="col-lg-12">
            <ui-select ng-model="currentfilter.StoreMasterId" name="fstore" ng-change="getList()" required>
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.StoreMaster | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="col-lg-3">
        <label class="col-lg-12 control-label" for="status" translate="Submission Status"></label>
        <div class="col-lg-12">
            <ui-select ng-model="currentfilter.SubmissionStatusId" name="status" ng-change="getList()" required>
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.ClaimSubmissionStatus | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
