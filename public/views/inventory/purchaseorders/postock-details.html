<style>
    .profileinput {
        height: 19px !important;
        padding-bottom: 1px !important;
    }

    .fullreg-profiles label {
        margin-bottom: -2px;
    }

    .ui-grid-viewport {
        height: 212px !important;
    }

    .table-uigrid {
        height: 260px !important;
    }

    .custom-modal-header {
        margin-bottom: -1px;
    }
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title"> {{currentfilter.title}} {{currentfilter.itemname}} {{'['}}
            {{currentfilter.itemcode}} {{']'}} </h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>
<div class="row">
    <div class="col-sm-4">
        <label class="col-sm-4" for="fromstore" translate="inventory.purchaseorder.store.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.storemasterid" ng-change="getList()" name="fromstore"
                ng-disabled="item.isDisabled" required>
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.StoreMaster | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="row">
    <div style="text-align: right"><label class="text-white">Total Quantity:</label><strong
            class="text-white">{{item.TotalQuantity}}</strong></div>
</div>
