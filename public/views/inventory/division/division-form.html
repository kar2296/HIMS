<style>
    .form-group {
        height: 72px;
    }
</style>
<div class="row page-header">
    <h4 class="col-sm-6" translate="Manage Division"></h4>
    <div class="col-sm-6">
        <button class="btn-add" ng-click="addNew()" uib-tooltip="Division" tooltip-placement="bottom">
            <i class="fa fa-plus" aria-hidden="true"></i>
        </button> &nbsp;
        <span class="drhms-billing-btn drhms-home-btn" ng-if="Context =='inventory'" ng-click="backtoList()"
            uib-tooltip="Dashboard" tooltip-placement="bottom"><i class="fas fa-home"></i></span>
    </div>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="code" translate="Code"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="code" uppercase ng-model="item.DivisionCode"
                    placeholder="" required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="name" translate="Name"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="name" uppercase ng-model="item.DivisionName"
                    placeholder="" required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="inventory.producttype.isactive.lbl"></label>
            <div class="col-sm-12">
                <input type="checkbox" class="custom-checkbox" name="isactive" ng-model="item.IsActive"
                    ng-checked="item.IsActive == 1">
            </div>
        </div>
    </form>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="pull-left">
            <button type="button" class="btn btn-sm pyr-color10" ng-click="backToList()">
                <i class="fa fa-angle-left"></i>&nbsp;&nbsp;
                <span translate="common.backaction.lbl"></span>
            </button>
        </div>
        <div class="pull-right">
            <button type="button" class="draftbutton" ng-click="save()" translate="common.saveaction.lbl"></button>
            <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                ng-click="saveandApprove()"></button>
        </div>
    </div>
</div>
