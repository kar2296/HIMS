<div class="row" id="inventorytab">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="row">
                <!-- leftpanel -->
                <div class="col-sm-3">
                    <div class="form-group">
                        <label class="col-sm-12 control-label"
                            translate="inventory.itemmasterstoremapping.isallstoreassosiation.lbl"></label>
                        <div class="col-sm-12">
                            <input type="checkbox" class="custom-checkbox" name="isallstoreassosiation"
                                ng-model="item.IsAllStoreAssosiation" ng-checked="item.IsAllStoreAssosiation == 1"
                                ng-click="allStoreClick(item)">
                        </div>
                    </div>
                </div>
                <!-- rightpanel -->
                <div class="col-sm-9 inv_store">
                    <div class="form-group">
                        <label class="col-sm-1 control-label"
                            translate="inventory.itemmasterstoremapping.stores.lbl"></label>
                        <div class="col-sm-8">
                            <ui-select multiple ng-model="item.map" class="ui-select-multiple" ng-map-control
                                pivot-prop="ItemMasterId" map-prop="StoreMasterId"
                                pivot-prop-val="{{currentcontext.id}}">
                                <ui-select-match>{{$item.StoreName }}</ui-select-match>
                                <ui-select-choices
                                    repeat="lookupitem.Id as lookupitem in lookup.StoreMaster | filter: { StoreName: $select.search }">
                                    <div ng-bind-html="lookupitem.StoreName | highlight: $select.search"></div>
                                </ui-select-choices>
                            </ui-select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="fooder-bgs">
                <!-- <button type="button" class="btn btn-sm pyr-color10 pull-left"
                    style="padding-left:10px !important;margin-left:5%;" ng-click="backToList()">
                    <i class="fa fa-angle-left"></i>&nbsp;&nbsp;
                    <span translate="common.backaction.lbl"></span>
                </button> -->
                <div class="pull-right">
                    <button type="submit" class="draftbutton" ng-click="saveItem()"
                        translate="common.saveaction.lbl"></button>
                    <!-- <button id="btnCancelForm" type="button" class="cancelbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button> -->
                </div>
            </div>
        </form>
    </div>
</div>
