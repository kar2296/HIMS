<style>
    .panel-heading {
        padding: 4px 15px;
    }

    .well {
        min-height: 460px;
        margin-bottom: 0px;
        padding: 19px;
        border: 1px solid #ededed;
        border-radius: 4px;
        background: rgb(233, 246, 253);
        /* Old browsers */
        background: -moz-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* FF3.6-15 */
        background: -webkit-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, rgb(250, 250, 250) 0%, rgb(247, 252, 253) 100%);
        /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid: DXImageTransform.Microsoft.gradient( startColorstr='#e9f6fd', endColorstr='#d3eefb', GradientType=0);
        /* IE6-9 */
        box-shadow: 4px 2px 13px -7px rgba(0, 0, 0, 0.75);
    }

    .panel-body {
        padding: 15px;
        margin-left: 0px;
        margin-top: 0px;
        margin-right: 0px;
        margin-bottom: 0px;
        background-image: url(app/img/bg-body.jpg);
        background-repeat: repeat;
        overflow: auto;
    }

    .wrapper>section {
        height: 595px;
    }

    .panel {
        margin-bottom: 0px;
    }

    .formRoot {
        overflow: auto;
        height: 495px;
    }

    .panel-footer {
        padding: 4px 15px;
        background-color: #ccecf5;
        border-top: 1px solid #eeeeee;
        border-bottom-right-radius: 3px;
        border-bottom-left-radius: 3px;
    }

    .page-header {
        margin: 0px 0px 0px 0px !important;
    }

    @media(max-width:992px) {
        .well {
            min-height: 443px;
        }
    }
    .ui-select-container.ui-select-bootstrap.dropdown {
    width: 100%;
    height: auto !important;
}
</style>
<div class="row" id="inventorytab">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot">
                <div class="panel panel-default">
                    <div class="panel-body form-panel" style="height:505px">
                        <div class="col-sm-12 well">
                            <!-- leftpanel -->
                            <div class="form-group">
                                <label class="col-sm-3 control-label" translate="inventory.itemmasterfacilitymapping.facilities.lbl"></label>
                                <div class="col-sm-8">
                                    <ui-select multiple ng-model="item.map" class="ui-select-multiple" ng-map-control pivot-prop="CustomerMasterId" map-prop="FacilityId"
                                        pivot-prop-val="{{currentcontext.id}}">
                                        <ui-select-match>{{$item.Text }}</ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                            </div>
                            <!-- rightpanel -->

                        </div>
                    </div>
                </div>
            </div>

            <div class="fooder-bgs">
                <button type="button" class="btn btn-sm pyr-color10 pull-left" style="padding-left:10px !important;margin-left:5%;" ng-click="backToList()">
                    <i class="fa fa-angle-left"></i>&nbsp;&nbsp;
                    <span translate="common.backaction.lbl"></span>
                </button>
                <div class="pull-right">
                    <button type="submit" class="draftbutton" ng-click="saveItem()" translate="common.saveaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
