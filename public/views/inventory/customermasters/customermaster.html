<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot">
                <div class="panel panel-default" id="inventorytab">
                    <div class="panel-body form-panel">
                        <div class="col-sm-12">
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" for="customertype" translate="inventory.customermaster.type.lbl"></label>
                                    <div class="col-sm-12">
                                        <ui-select ng-model="item.CustomerTypeId" theme="bootstrap" name="customertype"
                                            autofocus required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length > 20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.CustomerType | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" for="code" translate="inventory.customermaster.code.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="code" ng-model="item.CustomerCode"
                                            placeholder="Customer Code" required autofocus>
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" for="name" translate="inventory.customermaster.name.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="name" ng-model="item.CustomerName"
                                            placeholder="Customer Name" required autofocus>
                                    </div>
                                </div>
                        </div>
                                <div class="col-sm-12">
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" for="contactperson" translate="inventory.customermaster.contactperson.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="contactperson" ng-model="item.ContactPerson"
                                            placeholder="Contact Person">
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" for="mobilenumber" translate="inventory.customermaster.mobilenumber.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="mobilenumber" ng-model="item.MobileNumber"
                                            placeholder="Mobile Number" ng-minlength="10" ng-pattern="/^\d+$/" required
                                            autofocus>
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" for="phonenumber" translate="inventory.customermaster.phonenumber.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="phonenumber" ng-model="item.PhoneNumber"
                                            placeholder="Phone Number" ng-minlength="10" ng-pattern="/^\d+$/" required
                                            autofocus>
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" for="emailaddress" translate="inventory.customermaster.emailaddress.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="email" class="form-control" name="emailaddress" ng-model="item.EmailAddress"
                                            placeholder="Email Address"> </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" for="licencecode" translate="inventory.customermaster.licencecode.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="licencecode" ng-model="item.LicenceCode"
                                            placeholder="Licence Code">
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" for="profit" translate="inventory.customermaster.profit.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="number" min="0" class="form-control" name="profit" ng-model="item.ProfitPercentage"
                                            placeholder="Profit In (%)">
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" for="gstnumber" translate="inventory.customermaster.gstnumber.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="gstnumber" ng-model="item.GSTNumber"
                                            placeholder="GST Number" required autofocus>
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" for="paymentterms" translate="inventory.customermaster.paymentterms.lbl"></label>
                                    <div class="col-sm-12">
                                        <ui-select ng-model="item.PaymentTermsId" theme="bootstrap">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length > 20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.PaymentTerms | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <!-- <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" for="customerurl" translate="inventory.customermaster.customerurl.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="customerurl" ng-model="item.CustomerUrl"
                                            placeholder="Customer Url">
                                    </div>
                                </div> -->
                                <!-- <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" for="currencycode" translate="inventory.customermaster.currencycode.lbl"></label>
                                    <div class="col-sm-12">
                                        <ui-select ng-model="item.CurrencyCodeId" theme="bootstrap">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length > 20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.CurrencyCode | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div> -->
                                <!-- <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" for="activefrom" translate="inventory.customermaster.activefrom.lbl"></label>
                                    <div class="col-sm-12 ">
                                        <input type="text" class="form-control" name="activefrom" ng-date-object
                                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                                            ng-click="activefromPopup = { opened: true }" is-open="activefromPopup.opened"
                                            ng-model="item.ActiveFrom">
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" translate="inventory.customermaster.activeto.lbl"></label>
                                    <div class="col-sm-12 topright">
                                        <input type="text" class="form-control" name="activeto" ng-date-object
                                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                                            ng-click="activetoPopup = { opened: true }" is-open="activetoPopup.opened"
                                            ng-model="item.ActiveTo" ng-disabled="item.isDisabled">
                                    </div>
                                </div> -->
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" for="comments" translate="inventory.customermaster.comments.lbl"></label>
                                    <div class="col-sm-12">
                                        <textarea name="comments" maxlength="4000" style="width:100%;" class="notes-textarea"
                                            ng-disabled="item.isl" tabindex="-1"></textarea>
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" for="isactive" translate="inventory.customermaster.isactive.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="checkbox" class="custom-checkbox" name="isactive" ng-model="item.IsActive"
                                            ng-checked="item.IsActive == 1">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="fooder-bgs">
                            <button type="button" class="btn pyr-color10 btn-sm pull-left" ng-click="backToList()">
                                <i class="fa fa-angle-left"></i>&nbsp;&nbsp;
                                <span translate="common.backaction.lbl"></span>
                            </button>
                            <div class="pull-right">
                                <button type="button"   class="draftbutton" translate="common.saveaction.lbl"
                                    ng-click="save()"></button>
                                <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                                    ng-click="saveandApprove()"></button>
                                <!-- <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button> -->
                                <!-- <button id="btnCancelForm" type="button" class="cancelbutton" ng-click="backToList()"
                                    translate="common.cancelaction.lbl"></button> -->
                            </div>
                        </div>
                    </div>
            </div>
          
        </form>
    </div>
</div>
