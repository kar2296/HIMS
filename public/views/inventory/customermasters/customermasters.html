<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-3">
            <h4 class="mt0 col-sm-9" translate="inventory.customermastertab.parentpagetitle.lbl"></h4>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-5 text-right filter-lbl" style="color: black" translate="inventory.customermasters.filter_status.lbl"></label>
            <div class="col-sm-7">
                <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-6">
            <div class="filters">
                <div class="search">
                    <input type="text" id="pid" class="form-control" on-enter="getList()"  ng-model="currentfilter.CustomerName" 
                    translate translate-attr-placeholder="inventory.customermasters.filter_customername.lbl"> <i class="fas fa-search" aria-hidden="true"></i>

                </div>
                <button type="button" tabindex="-1" class="btn-add"
                    ng-click="addNew()"uib-tooltip="{{ 'inventory.customermastertab.parentpagetitle.lbl' | translate }}"
                    tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                    <!-- <span translate="clinicalmaster.serviceitem-list.addnew.lbl " class="text-white"></span> -->
                </button>
            </div>
        </div>
    </div>
</div>
