<style>
    .pl-3 {
        padding-left: 3%;
    }
</style>
<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="inventory.threewaymatching-list.pagetitle.lbl"></h4>
    <!--<div class="col-sm-6"><button class="btn bt-color3 btn-xs pull-right btn-filter" ng-click="openAdvancedFilter()" uib-tooltip="{{ '  clinicalmaster.serviceitem-list.filter-tooltip.lbl' | translate }}"
            tooltip-placement="bottom"><i class="fa fa-filter" aria-hidden="true"></i>&nbsp;&nbsp;<span translate="clinicalmaster.serviceitem-list.filter.lbl"></span></button>-->
    <button class="btn bt-color2 btn-xs pull-right btn-filter" ng-click="addNew()"
        tooltip-placement="bottom"><i class="fa fa-plus" aria-hidden="true"></i><span translate="clinicalmaster.serviceitem-list.addnew.lbl"></span></button>
</div>
</div>
<div class="row filter-area">
    <div class="col-sm-12">
        <div class="col-sm-4">
            <label class="col-sm-4 control-label" for="invoiceno" translate="inventory.threewaymatching-list.filter_invoiceno.lbl"></label>
            <div class="input-group col-sm-8">
                <div class="input-group-addon"><i class="fas fa-search" aria-hidden="true"></i></div>
                <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.DoctorInvoiceNo" name="invoiceno" translate translate-attr-placeholder="patientrequests.number.lbl">
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-4 control-label" for="type" translate="inventory.threewaymatching-list.filter_type.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.PrTypeId" ng-change="getList()" name="type" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.PrType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-4 control-label" for="vendor" translate="inventory.threewaymatching-list.filter_vendor.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="item.VendorId" name="vendor" ng-change="getList()" class="filter-combo" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.VendorMaster | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </div>
    <div class="col-sm-12">
        <div class="col-sm-4">
            <label class="col-sm-4 control-label filter-lbl" translate="inventory.threewaymatching-list.filter_date.lbl"></label>
            <div class="col-sm-8 input-group">
                <input type="text" class="form-control" name="date" ng-change="getList()" datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}" ng-click="appointmentdatePopup = { opened: true }"
                    is-open="appointmentdatePopup.opened" ng-model="currentfilter.date">
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-4 control-label" translate="inventory.threewaymatching-list.filter_status.lbl"></label>
            <div class="col-sm-8 ">
                <ui-select ng-model="currentfilter.AdjustmentStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.AdjustmentStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </div>
</div>
<div id="im_3wymathg">
<div class="container-fluid onerow-filter" id="patientsearchheight">
    <div ui-grid="vm.gridConfig" class="table-uigrid height-control"></div>
    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage"></ul>
        </div>
    </div>
</div>
</div>
