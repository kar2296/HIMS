<style>
    .form-horizontal .form-group {
        height: 62px;
    }
</style>
<div class="row" id="inventorytab">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="row">
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" for="code" translate="inventory.storemaster.code.lbl"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="code" ng-model="item.StoreCode" placeholder="" required uppercase>
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" for="name" translate="inventory.storemaster.name.lbl"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="name" ng-model="item.StoreName" placeholder="" required uppercase>
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" for="storetype" translate="inventory.storemaster.storetype.lbl"></label>
                    <div class="col-sm-12">
                        <ui-select ng-model="item.StoreTypeId" name="storetype" required>
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.StoreType | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" for="storesubtype" translate="inventory.storemaster.storesubtype.lbl"></label>
                    <div class="col-sm-12">
                        <ui-select ng-model="item.StoreSubTypeId" name="storesubtype" required>
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.StoreSubType | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" for="department" translate="inventory.storemaster.department.lbl"></label>
                    <div class="col-sm-12">
                        <ui-select ng-model="item.DepartmentId" name="department" required>
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" for="storepolicy" translate="inventory.storemaster.storepolicy.lbl"></label>
                    <div class="col-sm-12">
                        <ui-select ng-model="item.StorePolicyId" name="storepolicy" required>
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.StorePolicy | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" for="addressline1" translate="Address Line 1"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="addressline1" ng-model="item.AddressLine1" placeholder="" required>
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" for="addressline2" translate="Address Line 2"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="addressline2" ng-model="item.AddressLine2" placeholder="" required>
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" for="licenseno" translate="inventory.storemaster.licenseno.lbl"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="licenseno" ng-model="item.LicenseNo" placeholder="" required>
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" for="licenseno1" translate="License No 1"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="licenseno1" ng-model="item.LicenseNo1" placeholder="">
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" for="tinno" translate="inventory.storemaster.tinno.lbl"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="tinno" ng-model="item.TinNo" placeholder="" required>
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" for="expirywarningdays" translate="inventory.storemaster.expirywarningdays.lbl"></label>
                    <div class="col-sm-12">
                        <input type="number" min="0" class="form-control" name="expirywarningdays" ng-model="item.ExpiryWarningDays" placeholder=""
                            required>
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" for="expirypriorstopdays" translate="inventory.storemaster.expirypriorstopdays.lbl"></label>
                    <div class="col-sm-12">
                        <input type="number" min="0" class="form-control" name="expirypriorstopdays" ng-model="item.ExpiryPriorStopDays" placeholder=""
                            required>
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" for="leadtimeforpo" translate="inventory.storemaster.leadtimeforpo.lbl"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="leadtimeforpo" ng-model="item.LeadTimeForPO" placeholder="">
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" for="email" translate="inventory.storemaster.email.lbl"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="email" ng-model="item.Email" placeholder="">
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" for="password" translate="inventory.storemaster.password.lbl"></label>

                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="password" ng-model="item.Password" placeholder="">
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" for="wholesalelicensenumber1" translate="Whole Sale License Number1"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="wholesalelicensenumber1" ng-model="item.WholeSaleLicenseNumber1" placeholder="">
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" for="wholesalelicensenumber2" translate="Whole Sale License Number2"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="wholesalelicensenumber2" ng-model="item.WholeSaleLicenseNumber2" placeholder="">
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" for="schedulexdlno" translate="Schedule X DL No"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="schedulexdlno" ng-model="item.ScheduleXDLNo" placeholder="">
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" for="cstnumber" translate="CST Number"></label>
                    <div class="col-sm-12">
                        <input type="text" class="form-control" name="cstnumber" ng-model="item.CSTNumber" placeholder="">
                    </div>
                </div>
                <!-- <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" translate="inventory.storemaster.isactive.lbl"></label>
                    <div class="col-sm-12">
                        <input type="checkbox" class="custom-checkbox" name="isactive" ng-model="item.IsActive" ng-change="isactivechange(item)"
                            ng-checked="item.IsActive == 1">
                    </div>
                </div> -->
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" translate="inventory.storemaster.isactive.lbl"></label>
                    <div class="col-sm-12">
                        <input type="checkbox" class="custom-checkbox" name="isactive" ng-model="item.IsActive" ng-change="isactivechange(item)"
                            ng-checked="item.IsActive == 1">
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" translate="inventory.storemaster.purchasereturntorespectivevendor.lbl"></label>
                    <div class="col-sm-1">
                        <input type="checkbox" class="custom-checkbox" name="purchasereturntorespectivevendor" ng-model="item.PurchaseReturnToRespectiveVendor"
                            ng-checked="item.PurchaseReturnToRespectiveVendor == 1">
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" translate="inventory.storemaster.isopticalstore.lbl"></label>
                    <div class="col-sm-12">
                        <input type="checkbox" class="custom-checkbox" name="isopticalstore" ng-model="item.IsOpticalStore" ng-checked="item.IsOpticalStore == 1">
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" translate="Is Default Ward Indent Store"></label>
                    <div class="col-sm-12">
                        <input type="checkbox" class="custom-checkbox" name="IsDefaultWardindentStore" ng-model="item.IsDefaultWardindentStore">
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" translate="Is Indent Store"></label>
                    <div class="col-sm-12">
                        <input type="checkbox" class="custom-checkbox" name="IsIndentStore" ng-model="item.IsIndentStore">
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" translate="Can Allow Open PO"></label>
                    <div class="col-sm-12">
                        <input type="checkbox" class="custom-checkbox" name="CanAllowOpenPO" ng-model="item.CanAllowOpenPO">
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" translate="Can Allow Open GRN"></label>
                    <div class="col-sm-12">
                        <input type="checkbox" class="custom-checkbox" name="canallowopengrn" ng-model="item.CanAllowOpenGRN">
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" translate="inventory.storemaster.isdefaultprescriptionstore.lbl"></label>
                    <div class="col-sm-12">
                        <input type="checkbox" class="custom-checkbox" name="isdefaultprescriptionstore" ng-model="item.IsDefaultPrescriptionStore"
                            ng-checked="item.IsDefaultPrescriptionStore == 1">
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" translate="inventory.storemaster.canseetostoreqty.lbl"></label>
                    <div class="col-sm-12">
                        <input type="checkbox" class="custom-checkbox" name="canseetostoreqty" ng-model="item.CanSeeToStoreQty" ng-checked="item.CanSeeToStoreQty == 1">
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" for="IsGstEditablePo" translate="GST Editable PO/Grn"></label>
                    <div class="col-sm-12">
                        <input type="checkbox" class="custom-checkbox" name="IsGstEditablePo" ng-model="item.IsGstEditablePo">
                    </div>
                </div>
                <div class="form-group col-sm-3" ng-show="pharseqbasedonstore==1">
                    <label class="col-sm-12 control-label" for="IsSeqbasedStore" translate="Sequence Based Store"></label>
                    <div class="col-sm-12">
                        <input type="checkbox" class="custom-checkbox" name="IsSeqbasedStore" ng-model="item.IsSeqbasedStore">
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" for="" translate="Print Type"></label>
                    <div class="col-sm-12">
                        <ui-select ng-model="item.PrinterOptionId" name="">
                            <ui-select-match>
                                {{$select.selected.Text | limitTo : 20 : 0}}
                                <span ng-if="$select.selected.Text.length>20">...</span>
                            </ui-select-match>
                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.PrinterOption | filter: { Text: $select.search }">
                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                            </ui-select-choices>
                        </ui-select>
                    </div>
                </div>
                <div class="form-group col-sm-3">
                    <label class="col-sm-12 control-label" translate="Is Whatsapp"></label>
                    <div class="col-sm-12">
                        <input type="checkbox" class="custom-checkbox" name="iswhatsapp" ng-model="item.IsWhatsapp">
                    </div>
                </div>
            </div>

            <div class="fooder-bgs">
                <button type="button" class="btn btn-sm pyr-color10" ng-click="backToList()">
                    <i class="fa fa-angle-left"></i>&nbsp;&nbsp;
                    <span translate="common.backaction.lbl"></span>
                </button>
                <div class="pull-right">
                    <!--<button type="button"    class="draftbutton" translate="common.printaction.lbl" ng-if="item.ActiveStatusId==1 || item.ActiveStatusId==2" ng-click="print()"></button>-->
                    <button type="button" class="draftbutton" ng-if="HasAccess('storemaster', 'storemasterSave')" ng-click="save()" ng-hide="item.ActiveStatusId==1 || item.ActiveStatusId==2"
                        translate="common.saveaction.lbl"></button>
                    <button type="button" class="draftbutton" ng-if="HasAccess('storemaster', 'storemasterSaveandApprove')" translate="common.saveapprove-action.lbl"
                        ng-click="SaveandApprove()"></button>
                    <!-- <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-hide="item.ActiveStatusId==1 || item.ActiveStatusId==2"
                            ng-click="clear()" translate="common.clearaction.lbl"></button> -->
                    <!-- <button id="btnCancelForm" type="button" class="cancelbutton" ng-click="backToList()"
                                translate="common.cancelaction.lbl"></button> -->
                </div>
            </div>

        </form>
    </div>
</div>
