<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="inventory.storeusermap.pagetitle1.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>


<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot">
                <div class=" panel-default">
                    <div class="panel-body form-panel">
                        <div class="col-sm-12">
                            <div class="form-group col-sm-4">
                                <label class="col-sm-12 control-label" for="usertype"
                                    translate="inventory.storeusermap.filter_usertype.lbl"></label>
                                <div class="col-sm-12">
                                    <ui-select ng-model="item.UserTypeId" name="usertype" class="filter-combo">
                                        <ui-select-match>
                                            {{$select.selected.Text | limitTo : 25 : 0}}
                                            <span ng-if="$select.selected.Text.length > 25">...</span>
                                        </ui-select-match>
                                        <ui-select-choices
                                            repeat="lookupitem.Id as lookupitem in lookup.UserType | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                            </div>
                            <div class="form-group col-sm-4">
                                <label class="col-sm-12 control-label" for="username"
                                    translate="inventory.storeusermap.filter_username.lbl"></label>
                                <div class="col-sm-12">
                                    <autosearch itemid="item.UserId" iteminfo=""
                                        on-enter="onUserSelected($select.selected)" name="username" rowdata=""
                                        config="vm.usercontrolconfig" itemchange="onUserSelected($select.selected)"
                                        candisable="item.RdoUser"></autosearch>
                                </div>
                            </div>
                            <div class="form-group col-sm-4">
                                <label class="col-sm-12 control-label" for="isactive"
                                    translate="inventory.itemmastervendormapping.isactive.lbl"></label>
                                <div class="col-sm-1 col-md-1">
                                    <input type="checkbox" class="custom-checkbox" name="isactive"
                                        ng-model="item.IsActive" autofocus>
                                </div>
                                <!-- <label class="col-sm-9 col-md-2 control-label" for="isdefault" translate="inventory.itemmastervendormapping.isdefault.lbl"></label>
                                        <div class="col-sm-3 col-md-1">
                                            <input type="checkbox" class="custom-checkbox" name="isdefault" ng-model="item.IsDefault"
                                                autofocus>
                                        </div> -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-sm-12">
                    <div class="pull-right">
                        <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                            ng-click="saveandApprove()"></button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
