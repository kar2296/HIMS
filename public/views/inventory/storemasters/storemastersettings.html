<div class="row page-header">
</div>
<div class="row" id="inventorytab">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot" style="height:428px !important">
                <fieldset class="fsStyle well">
                    <legend class="legendStyle">
                        <span translate="inventory.storemastersettings.pnlstocktransactions.lbl"></span>
                    </legend>
                    <div class="col-sm-12 well">


                        <div class="col-sm-6">
                            <div class="form-group">
                                <label class="col-sm-4 control-label" for="canstocktransferto" translate="inventory.storemastersettings.stocktransfer.lbl"></label>
                                <div class="col-sm-8">
                                    <ui-select multiple ng-model="item.CanStockTransferTo" name="canstocktransferto" class="ui-select-multiple" ng-multi-tag>
                                        <ui-select-match>{{$item.Text }}</ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.StoreMaster | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                            </div>
                        </div>


                        <div class="col-sm-6">
                            <div class="form-group">
                                <label class="col-sm-4 control-label" for="canstockreturnto" translate="inventory.storemastersettings.stockreturn.lbl"></label>
                                <div class="col-sm-8">
                                    <ui-select multiple ng-model="item.CanStockReturnTo" name="canstockreturnto" class="ui-select-multiple" ng-multi-tag>
                                        <ui-select-match>{{$item.Text }}</ui-select-match>
                                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.StoreMaster | filter: { Text: $select.search }">
                                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                        </ui-select-choices>
                                    </ui-select>
                                </div>
                            </div>
                        </div>

                    </div>
                </fieldset>

                <fieldset class="fsStyle well">
                    <legend class="legendStyle">
                        <span translate="inventory.storemastersettings.pnldispensesettings.lbl"></span>
                    </legend>
                    <div class="col-sm-12 well">


                        <div class="col-sm-6">
                            <div class="form-group">
                                <label class="col-sm-8 control-label" for="register" translate="inventory.storemastersettings.register.lbl"></label>
                                <div class="col-sm-4">
                                    <input type="checkbox" class="custom-checkbox" name="register" ng-model="item.Register" ng-checked="item.Register == 1">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-8 control-label" for="pick" translate="inventory.storemastersettings.pick.lbl"></label>
                                <div class="col-sm-4">
                                    <input type="checkbox" class="custom-checkbox" name="pick" ng-model="item.Pick" ng-checked="item.Pick == 1">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-8 control-label" for="allocate" translate="inventory.storemastersettings.allocate.lbl"></label>
                                <div class="col-sm-4">
                                    <input type="checkbox" class="custom-checkbox" name="allocate" ng-model="item.Allocate" ng-checked="item.Allocate == 1">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-8 control-label" for="dispense" translate="inventory.storemastersettings.dispense.lbl"></label>
                                <div class="col-sm-4">
                                    <input type="checkbox" class="custom-checkbox" name="dispense" ng-model="item.Dispense" ng-checked="item.Dispense == 1">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-8 control-label" for="allocateanddispense" translate="inventory.storemastersettings.allocateanddispense.lbl"></label>
                                <div class="col-sm-4">
                                    <input type="checkbox" class="custom-checkbox" name="allocateanddispense" ng-model="item.AllocateANDDispense" ng-checked="item.AllocateANDDispense == 1">
                                </div>
                            </div>
                        </div>


                        <div class="col-sm-6">

                        </div>

                    </div>
                </fieldset>

            </div>
            <div class="fooder-bgs">
                <!-- <button type="button" class="btn btn-sm pyr-color10" ng-click="backToList()"><i class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button> -->
                <div class="pull-right">
                    <button type="button" class="draftbutton" ng-click="saveItem()" translate="common.saveaction.lbl"></button>
                    <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl" ng-click="saveItem()"></button>
                    <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="cancelbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
