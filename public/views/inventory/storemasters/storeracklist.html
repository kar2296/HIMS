<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-5">
            <h4 class="col-sm-6 mt0" translate="inventory.storeracks.pagetitle.lbl"></h4>
        </div>
        <div class="col-sm-7">
            <div class="filters">              
                <button type="button" tabindex="-1" class="btn-add"
                    ng-click="addNew()" uib-tooltip="Store Rack" tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                    <!-- <span translate="clinicalmaster.serviceitem-list.addnew.lbl " class="text-white"></span> -->
                </button>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-sm-12">
        <div class="col-sm-4">
            <label class="col-sm-4 control-label" translate="inventory.storeracks.rackcode.lbl"></label>
            <div class="col-sm-8">
                <div class="search">
                    <input type="text" id="pid" class="form-control" on-enter="getList()"
                        ng-model="currentfilter.RackCode" translate
                        translate-attr-placeholder="inventory.storeracks.rackcode.lbl">
                        <div class="drhms-search-icon"><i class="fas fa-search" aria-hidden="true"></i></div>

                </div>
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-4 control-label" translate="inventory.storeracks.facility.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.FacilityId" ng-change="getList()" ng-disabled="true"
                    class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4">
            <label class="col-sm-4 control-label" translate="inventory.storeracks.status.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </div>
</div>
<custom-table config="vm.gridConfig"></custom-table>
<div class="container-fluid single-filter">
    <!-- <div ui-grid="vm.gridConfig" class="table-uigrid"></div> -->
    <div class="fooder-bgs" style="margin-top: 16px;">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
