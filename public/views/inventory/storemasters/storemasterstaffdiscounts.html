                <label class="col-sm-4 control-label filter-lbl" for="storemaster" translate="inventory.storeusermap.filter_storemaster.lbl"></label>
                <div class="col-sm-8">
                    <ui-select ng-model="item.StoreMasterId" name="storemaster" class="filter-combo" required>

                            {{$select.selected.Text | limitTo : 8 : 0}}

            <div class="col-sm-5">
                <label class="col-sm-4 control-label filter-lbl" for="username" translate="inventory.storeusermap.filter_username.lbl"></label>

                    <autosearch itemid="item.UserId" iteminfo="" rowdata="" rowdata="" config="vm.usercontrolconfig" itemchange="getList()"></autosearch>

            </div>
            <div class="col-sm-5">
                <label class="col-sm-4 control-label filter-lbl" for="status" translate="inventory.purchaseorders.status.lbl"></label>
                <div class="col-sm-8">
                    <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 8 : 0}}
                            <span ng-if="$select.selected.Text.length>8">...</span>
                        </ui-select-match>

<custom-table config="vm.gridConfig"></custom-table>	
<div class="container-fluid usermap">
    <!-- <div ui-grid="vm.gridConfig" class="table-uigrid"></div> -->
    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
