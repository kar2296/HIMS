<style>
    table#bannerdetails .autosearch-div table.table.table-bordered.table-condensed.dropdown-menu {
        margin-left: -405px !important;
    }
</style>
<div class="row page-header">
    <div class="col-sm-10">
        <h4 class="mt0" translate="Item Master Excel Upload"></h4>
    </div>
    <div class="col-sm-2">
        <button class="loadbtn" ng-click="itemUpload()">
            <i class="fas fa-sync loading-icon" aria-hidden="true" uib-tooltip="Upload" tooltip-placement="bottom"></i>
            <span>Upload</span>
        </button>
    </div>
</div>

<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
