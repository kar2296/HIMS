<style>
    .panel-body{
        overflow:visible !important;
        
    }
.panel-footer {
    padding: 4px 15px;
    background-color: #ccecf5;
    border-top: 1px solid #eeeeee;
    border-bottom-right-radius: 3px;
    border-bottom-left-radius: 3px;
    margin:0px -5px;
}
</style>
<div class="row page-header"><h4 class="mt0 col-sm-12" translate="inventory.vendormastererpmapping.pagetitle.lbl"></h4></div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">	
            <div class="">
                <div class="panel panel-default">
                    <!--<div class="panel-heading"><h3 class="panel-title" translate="inventory.itemmastervendormapping.pagetitle.lbl"></h3></div>!-->
                    <div class="panel-body form-panel">	
                        <div class="col-sm-12">			
                            
                            <!-- leftpanel -->
                            <div class="col-sm-6">
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="vendorcode" translate="inventory.vendormastererpmapping.vendorcode.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="vendorcode" ng-model="item.VendorCode" placeholder="" disabled  required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" translate="inventory.vendormastererpmapping.erpaccounttype.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <ui-select ng-model="item.ErpAccountTypeId" theme="bootstrap">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ErpAccountType | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" translate="inventory.vendormastererpmapping.erpsubaccounttype.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <ui-select ng-model="item.ErpSubAccountTypeId" theme="bootstrap">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ErpSubAccountType | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" translate="inventory.vendormastererpmapping.erpglclasstype.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <ui-select ng-model="item.ErpGLClassTypeId" theme="bootstrap">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ErpGLClassType | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" translate="inventory.vendormastererpmapping.erpglclassname.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="ErpGLClassName" ng-model="item.ErpGLClassName" placeholder="">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" translate="inventory.itemmastervendormapping.activefrom.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="activefrom" ng-date-object 
                                                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" 
                                                placeholder="{{datePickerOptions.placeholder}}" 
                                                ng-click="activefromPopup = { opened: true }" 
                                                is-open="activefromPopup.opened" ng-model="item.Activefrom" >
                                    </div>
                                </div>                                                                        
                            </div>
                            
                            <!-- rightpanel -->
                            <div class="col-sm-6">                                
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="vendorname" translate="inventory.vendormastererpmapping.vendorname.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="vendorname" ng-model="item.VendorName" placeholder="" autofocus required disabled>
                                    </div>
                                </div>                            
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" translate="inventory.vendormastererpmapping.erpcreditaccountno.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                          <input type="text" class="form-control" name="ErpCreditAccountNo" ng-model="item.ErpCreditAccountNo" placeholder="">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" translate="inventory.vendormastererpmapping.erpdebitaccountno.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                          <input type="text" class="form-control" name="ErpDebitAccountNo" ng-model="item.ErpDebitAccountNo" placeholder="">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" translate="inventory.vendormastererpmapping.bankname.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <ui-select ng-model="item.BankId" theme="bootstrap">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Bank | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="BankAccountNo" translate="inventory.vendormastererpmapping.bankaccountno.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                          <input type="text" class="form-control" name="BankAccountNo" ng-model="item.BankAccountNo" placeholder="" autofocus required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" translate="inventory.vendormastererpmapping.activeto.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="activeto" ng-date-object 
                                                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" 
                                                placeholder="{{datePickerOptions.placeholder}}" 
                                                ng-click="activetoPopup = { opened: true }" 
                                                is-open="activetoPopup.opened" ng-model="item.ActiveTo" >
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
           <div class="panel-footer formactionbar">
                <div class="pull-right">
                    <button type="button"   class="draftbutton" translate="common.saveaction.lbl" ng-click="saveItem()"></button>
                    <!--<button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>-->
                    <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>						
                </div>
            </div>
        </form>		
    </div>
</div>
