<style>
    .item-code {
        color: #F44336;
    }
</style>
<div class="row page-header" id="assets">
    <h3 class="panel-title active col-sm-6 mt0" translate="Manage Supplier(General)"></h3>
    <label class="col-sm-6 active">
        <strong class="active" translate="{{$state.params.VendorName}} -">
        </strong>
        <strong class="active"><span class="item-code" translate="{{$state.params.VendorCode}}"></span></strong></label>
</div>
<div id="receipt_tab">
    <div class="row tablebox" id="tablebox">
        <div class="col-sm-12">
            <uib-tabset active="active" id="assettabs">
                <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)"
                    disable="tab.canDisable">
                </uib-tab>
            </uib-tabset>
            <div ui-view></div>
        </div>
    </div>
</div>
