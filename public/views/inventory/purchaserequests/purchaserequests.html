<link rel="stylesheet" href="app/css/drhms.css">
<div class="row">
    <div class="drhms-filters">
        <div class="col-sm-10">
            <h4 translate="inventory.purchaserequest.pagetitle.lbl"></h4>
        </div>
        <div class="col-sm-4">
            <div class="search">
                <input type="text" class="form-control textbox-search" name="prnumber" on-enter="getList()"
                    ng-model="currentfilter.PrNumber" placeholder="PR No#">
                <i class="fas fa-search" aria-hidden="true"></i>
            </div>
        </div>
        <div class="col-sm-1">
            <button type="button" class="drhms-billing-btn drhms-add-btn" ng-click="addNew()"
                uib-tooltip="{{ 'inventory.purchaserequests.addnew-tooltip.lbl' | translate }}"
                tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</div>
<div class="row">
    <div class="form-group col-sm-3" style="width: 18%;">
        <label class="col-sm-4" translate="inventory.purchaserequests.filter_type.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.PrTypeId" name="prtype" ng-change="getList()">
                <ui-select-match style="padding: 0% !important;">
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.PrType | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-3" style="width: 20%;">
        <label class="col-sm-4" translate="inventory.purchaserequests.filter_department.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.DepartmentId" name="department" ng-change="getList()">
                <ui-select-match style="padding: 0% !important;">
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-3" style="width: 18%;">
        <label class="col-sm-4" translate="inventory.purchaserequests.filter_store.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.StoreMasterId" name="userstores" ng-change="getList()"
                class="filter-combo" style="padding: 0px !important;">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.UserStores | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-3" style="width: 18%;">
        <label class="col-sm-4" for="requesteddate" translate="inventory.purchaserequest.prdate.lbl"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" name="requesteddate" ng-change="getList()"
                datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="requesteddatePopup = { opened: true }" is-open="requesteddatePopup.opened"
                ng-model="currentfilter.RequestedDate">
        </div>
    </div>
    <div class="form-group col-sm-3" style="width: 18%;">
        <label class="col-sm-4" translate="inventory.purchaserequests.filter_status.lbl"></label>
        <div class="col-sm-8">
            <multiselectchk list="lookup.PrStatus" selected="currentfilter.PrStatusId" ng-change="getList()">
            </multiselectchk>
        </div>
    </div>
</div>

<div class="fooder-bgs">
    <div class="row">
        <custom-table config="vm.gridConfig"></custom-table>
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
