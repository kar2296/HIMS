<style>
    #mainresponsivetablecontrol>.table>tbody>tr:nth-child(1)>td>autosearch>.autosearch-div>.custom-popup-wrapper>.dropdown-menu {
        background-color: rgba(245, 249, 238, 0) !important;
        border: 0px solid #ccc !important;
    }
    
    .custom-popup-wrapper>.table>thead>tr>td:nth-child(3) {
        width: 30% !important;
    }
    
    .custom-popup-wrapper>.table>tbody>tr>td:nth-child(3)>span {
        width: 25%!important;
    }
    
    .screenheight {
        height: 250px!important;
        /* border-bottom: 1px solid #2787a2; */
        border: 1px solid #3569b7;
        /* padding: 1px; */
        margin: 1px;
    }
    
    .page-title {
        margin: 0px 0px 1px 0px !important;
        border: none !important;
        /* background: #009ea1 !important; */
        /* background: url(../img/header-bg.jpg) repeat-x left top; */
        border-bottom: 1px solid #2787a2;
        color: rgb(19, 17, 18) !important;
        padding-left: 10px;
        padding-top: 3px;
        padding-bottom: 0px;
    }
</style>

<div class=" screenheight">
    <div class="row page-title">
        <h4 class="mt0 col-sm-6" translate="inventory.itemmastertab.parentpagetitle1.lbl"></h4>

    </div>
    <div class=" bg-pattern">
        <!--<div style="height: 490px;">-->
        <div class="table-height formRoot drpdwnctrl " id="mainresponsivetablecontrol">
            <table class="table table-hover table-responsive table-bordered">
                <thead class="bg-subhead">
                    <tr>
                        <th class="col-sm-3"><span translate="inventory.itemmaster.name.lbl"></span></th>
                        <th class="col-sm-1"><span translate="inventory.itemmaster.code.lbl"></span></th>
                        <th class="col-sm-1"><span translate="inventory.itemmaster.uom.lbl"></span></th>
                        <th class="col-sm-1"><span translate="inventory.itemmaster.qty.lbl"></span></th>
                        <th class="col-sm-1"><span translate="common.actions_col.lbl"></span></th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="item in vm.items | filter:{Status:1}">
                        <td>
                           
                                 <autosearch itemid="item.ItemMasterId" iteminfo="item.SelectedItem" rowdata="item" config="vm.initialstockitemcontrolconfig" itemchange="onItemSelected($index, item)" ></autosearch>
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.ItemCode" placeholder="" ng-change="computeNetAmount(item)">
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.UOM" placeholder="" ng-change="computeNetAmount(item)">
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.Quantity" placeholder="">
                        </td>

                        <td align="center">
                            <button class="btn btn-danger btn-xs" ng-click="deleteItem($index,item)">
                        <img class="drhms-edit-button" src="assets/svg/delete.svg" alt=""></button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <!--</div>-->
    </div>
</div>
<div class=" screenheight">
    <div class="row page-title">
        <h4 class="mt0 col-sm-6" translate="inventory.itemmastertab.parentpagetitle2.lbl"></h4>

    </div>
    <div class=" bg-pattern">
        <!--<div style="height: 490px;">-->
        <div class="table-height formRoot drpdwnctrl" id="mainresponsivetablecontrol">
            <table class="table table-hover table-responsive table-bordered">
                <thead class="bg-subhead">
                    <tr>
                        <th class="col-sm-3"><span translate="inventory.itemmaster.name.lbl"></span></th>
                        <th class="col-sm-1"><span translate="inventory.itemmaster.code.lbl"></span></th>
                        <th class="col-sm-1"><span translate="inventory.itemmaster.uom.lbl"></span></th>
                        <th class="col-sm-1"><span translate="inventory.itemmaster.qty.lbl"></span></th>
                        <th class="col-sm-1"><span translate="common.actions_col.lbl"></span></th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="item in vm.items | filter:{Status:1}">
                        <td>
                            <autosearch itemid="item.ItemMasterId" iteminfo="item.ItemMaster" rowdata="item" config="vm.itemmasterconfig" itemchange="ItemChanged($index,item)"
                                class="inputsearchlogo"></autosearch>
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.ItemCode" placeholder="" ng-change="computeNetAmount(item)">
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.UOM" placeholder="" ng-change="computeNetAmount(item)">
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.Quantity" placeholder="">
                        </td>

                        <td align="center">
                            <button class="btn btn-danger btn-xs" ng-click="deleteItem($index,item)">
                        <img class="drhms-edit-button" src="assets/svg/delete.svg" alt=""></button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <!--</div>-->
    </div>
</div>
<div class="fooder-bgs">
    <button type="button" class="pull-left btn btn-sm pyr-color10" ng-click="backToList()"><i class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button>
    <div class="pull-right">
        <button id="btnSaveForm" type="button" class="draftbutton" translate="common.saveaction.lbl" ng-click="saveItem()"></button>
        <!--<button type="button" class="btn btn-primary btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>-->
        <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
        <button id="btnCancelForm" type="button" class="draftbutton" ng-click="back()" translate="common.cancelaction.lbl"></button>
    </div>
</div>
