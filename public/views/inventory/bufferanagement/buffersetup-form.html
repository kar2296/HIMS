<style>
    .modal-lg {
        width: 500px;
    }
    
    .panel-body {
        padding: 15px;
        margin-left: 0px;
        margin-top: -53px;
        margin-right: 0px;
        margin-bottom: 0px;
        background-image: url(app/img/bg-body.jpg);
        background-repeat: repeat;
        overflow: auto;
    }
    
    .bg-pattern {
        overflow: inherit;
    }
    
    .well {
        min-height: 20px;
        padding: 19px;
        margin-bottom: 0px;
        border: 1px solid #ededed;
        border-radius: 4px;
        background: rgb(233, 246, 253);
        /* Old browsers */
        background: -moz-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* FF3.6-15 */
        background: -webkit-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, rgb(250, 250, 250) 0%, rgb(247, 252, 253) 100%);
        /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid: DXImageTransform.Microsoft.gradient( startColorstr='#e9f6fd', endColorstr='#d3eefb', GradientType=0);
        /* IE6-9 */
        box-shadow: 4px 2px 13px -7px rgba(0, 0, 0, 0.75);
    }
    
    .formactionbar {
        padding: 5px 15px;
        height: 40px;
        background-color: #ccecf5;
    }
    
    .custom-modal-header {
        margin-bottom: 10px;
        background-color: #597a9a;
        color: #fff;
    }
    
    .modal-content {
        -webkit-box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        box-shadow: -1px 3px 20px 7px rgba(249, 244, 244, 0.5);
        width: 650px;
    }
    
    .modal-header {
        padding: 4px 10px;
        border-bottom: 1px solid #e5e5e5;
    }
</style>
<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="inventory.itemrackmapping.pagetitle5.lbl"></h4>
</div>

<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div>
                <div class="">
                    <div class="panel-body form-panel">
                        <div class="col-sm-12">

                            <!-- leftpanel -->
                            <div class="col-sm-12">
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="facility" translate="inventory.itemrackmapping.facility.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="text" class="form-control" ng-model="item.FacilityName" disabled>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="store" translate="inventory.itemrackmapping.store.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="text" class="form-control" ng-model="item.StoreName" disabled>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="itemcode" translate="inventory.itemrackmapping.itemcode.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="text" class="form-control" ng-model="item.ItemCode" disabled>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="itemname" translate="inventory.itemrackmapping.itemname.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="text" class="form-control" ng-model="item.ItemName" disabled>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="maxforecast" translate="inventory.itemrackmapping.maxforecast.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="number" min="0" class="form-control" ng-model="item.MaxForeCast" placeholder="" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="factoronunreliable" translate="inventory.itemrackmapping.factoronunreliable.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="number" min="0" class="form-control" ng-model="item.FactorOnUnReliable" placeholder="" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="targetinventory" translate="inventory.itemrackmapping.targetinventory.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="number" min="0" class="form-control" ng-model="item.TargetInventory" placeholder="" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="bret" translate="inventory.itemrackmapping.bret.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="number" min="0" class="form-control" ng-model="item.BReT" placeholder="" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="olt" translate="inventory.itemrackmapping.olt.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="number" min="0" class="form-control" ng-model="item.OLT" placeholder="" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="plt" translate="inventory.itemrackmapping.plt.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="number" min="0" class="form-control" ng-model="item.PLT" placeholder="" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-5 control-label" for="tlt" translate="inventory.itemrackmapping.tlt.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="number" min="0" class="form-control" ng-model="item.TLT" placeholder="" required>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="col-sm-5 control-label" translate="inventory.itemrackmapping.active.lbl"></label>
                                    <div class="col-sm-7">
                                        <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
                                    </div>
                                </div>

                            </div>

                            <!-- rightpanel -->
                            <div class="col-sm-6">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="panel-footer formactionbar">
                <div class="pull-right">
                    <button type="button"   class="draftbutton" translate="common.saveaction.lbl" ng-click="Save()"></button>
                    <button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="SaveandApprove()"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
