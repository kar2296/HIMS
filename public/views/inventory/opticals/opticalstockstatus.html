<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-10">
            <h4 class="mt0 col-sm-6" translate="Optical Stock Status"></h4>
        </div>
        <div class="col-sm-2 " style="display: flex;">
            <i ng-if=" Context =='store'|| Context =='pharmacy'" class="fa fa-home" align="right"
                ng-click="backtoList()" uib-tooltip="Dashboard" tooltip-placement="bottom"></i>
            <!-- <button type="button"   class="pull-right btn btn-inverse btn-sm"
                translate="common.printaction.lbl" ng-click="print()"></button> -->

        </div>

    </div>
</div>
<div class="row">
    <table id="bannerdetails">
        <tr>
            <td> <label class="col-sm-5 control-label filter-lbl"
                    translate="inventory.stockstatus.producttype.lbl"></label></td>
            <td>
                <ui-select ng-model="currentfilter.OpticalProductTypeId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.OpticalProductType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </td>
            <td> <label class="col-sm-5 control-label filter-lbl"
                    translate="inventory.stockstatus.itemsearch.lbl"></label>
            </td>
            <td>
                <autosearch itemid="currentfilter.ItemMasterId" iteminfo="" placeholder="'Item Code/Name/Generic'"
                    rowdata="" config="vm.stockitemcontrolconfig" itemchange="getList()"></autosearch>

            </td>
            <td> <label class="col-sm-4 control-label filter-lbl" translate="inventory.stockstatus.store.lbl"></label>
            </td>
            <td>
                <ui-select ng-model="currentfilter.StoreMasterId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.StoreMaster | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </td>

        </tr>
    </table>

<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="row">
    <div class="col-sm-6"></div>
    <div class="col-sm-6">
        <div class="col-sm-5 text-right">
            <label class="control-label ">Total Quantity:</label>
        </div>
        <div class="col-sm-6">
            <!--
                            <input type="text" class="form-control" name="totalquantity" ng-model="TotalNetamount" placeholder="0.00" id="disabledInput" disabled>

<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
