<style>
    .nameinfo {
        font-size: 13px;
        font-weight: 700;
        color: #337ab7;
    }

    .nameinfo.mrninfo {
        color: black
    }

    .contactinfo {
        font-size: 10px;
        color: #808080
    }

    .block {
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
    }

    #facilitysheight .ui-grid-viewport {
        width: 100%;
        /* height: 460px!important; */
        height: 72vh;
        min-height: 70vh;
    }

    @media (device-width:100vw) and (device-height:100vh) {
        #facilitysheight .ui-grid-viewport {
            height: 76vh;
            min-height: 74vh;
        }
    }

    .table-uigrid {
        margin-left: 10px;
        margin-right: 10px;
        height: 488px !important;
    }

    .linkstyle {
        font-weight: 700;
        text-align: right;
    }

    .statusinfo {
        font-size: 13px;
    }

    .form-group {
        margin-bottom: 7px !important;
    }

    .sr-only {
        height: 22px !important;
    }

    /* button#btnsubmit {
        margin-right: 212px !important;
    } */
</style>

<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-8">
            <h4 class="col-sm-6 mt0" translate="Optical Item Details Report"></h4>
        </div>
        <div class="col-sm-4">
            <div class="filters">

                <i class="icofont-filter" uib-tooltip="Filter" tooltip-placement="bottom"
                    ng-click="openFilterTab()"></i>
                <i class="icofont-file-excel" uib-tooltip="Excel" tooltip-placement="bottom"
                    ng-click="excelDownload()"></i>
                <!-- <i class="icofont-file-excel"  uib-tooltip="Excel" tooltip-placement="bottom" onclick="exportTableToExcel('tblData', 'members-data')"></i> -->
                <i class="icofont-print" ng-click="print()" uib-tooltip="Print" tooltip-placement="bottom"></i>
                <i class="icofont-home" ng-click="backtoReport()" uib-tooltip="Report" tooltip-placement="bottom"></i>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <table id="bannerdetails">
        <tr>
            <td translate="Product Type"></td>
            <td>
                <ui-select ng-model="currentfilter.OpticalProductTypeId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.OpticalProductType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </td>
            <td translate="Item Name"></td>
            <td>
                <input type="text" id="pid" class="form-control" on-enter="getList()" ng-model="currentfilter.ItemCode"
                    translate translate-attr-placeholder="Item Code/Name">
                <!-- <i class="fas fa-search" aria-hidden="true"></i> -->
            </td>
        </tr>
    </table>
</div>
