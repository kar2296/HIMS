<link href="app/css/report.css" rel="stylesheet">
<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="Optical Reports"></h4>
    <div class="col-sm-6">
        <button type="button" tabindex="-1" class="btn-add" ng-click="backtoList()" uib-tooltip="Dashboard" tooltip-placement="bottom">
            <i class="fa fa-home" aria-hidden="true"> </i>
        </button>

        <!-- <i class="fa fa-home" align="right" style="float: right;" ng-click="backtoList()" uib-tooltip="Dashboard"
            tooltip-placement="bottom" aria-hidden="true"></i> -->
    </div>
</div>
<div class="col-sm-12 clearfix tablebox function-btn mgt10 mgb10 ">
    <div class="col-sm-6 clearfix tablebox function-btn mgt10 mgb10 ">
        <table id="reportdetails">
            <tbody class="">
                <tr>
                    <td class=""> <a ng-click="dailybilldetails()"><i class="lni lni-checkmark"></i></a> </td>
                    <td class="cus-col tbl-header" ng-click="dailybilldetails()"
                        translate="Daily Bill Details"></td>

                </tr>
                <tr>
                    <td class=""> <a ng-click="dailycollect()"><i class="lni lni-checkmark"></i></a> </td>
                    <td class="cus-col tbl-header" ng-click="dailycollect()"
                        translate="Daily Collections"></td>
                </tr>
                <tr>
                    <td class=""> <a ng-click="currentstock()"><i class="lni lni-checkmark"></i></a> </td>
                    <td class="cus-col tbl-header" ng-click="currentstock()"
                        translate="Optical Current Stocks"></td>
                </tr>
                <tr>
                    <td class=""> <a ng-click="purchasedetails()"><i class="lni lni-checkmark"></i></a> </td>
                    <td class="cus-col tbl-header" ng-click="purchasedetails()"
                        translate="Optical Purchase Details"></td>
                </tr>
                <tr>
                    <td class=""> <a ng-click="optitems()"><i class="lni lni-checkmark"></i></a> </td>
                    <td class="cus-col tbl-header" ng-click="optitems()" translate="Optical Items">
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>


<div class="fooder-bgs"></div>
