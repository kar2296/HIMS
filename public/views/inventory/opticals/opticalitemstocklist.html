<style>
    .usermap .ui-grid-viewport {
        height: 432px !important;
    }

    .table-uigrid {
        height: 458px !important;
    }

    .autosearch-div .custom-popup-wrapper>.dropdown-menu {
        width: 50% !important;
    }

    i.btn.btn-danger.btn-rounded.fa.fa-times {
        border-radius: 5px !important;

    }
</style>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-12">
            <!-- <div class="col-sm-4">
                <label class="col-sm-3 control-label filter-lbl" for="facility"
                    translate="inventory.opticalitemmaster.filter_facility.lbl"></label>
                <div class="col-sm-9">
                    <ui-select ng-model="item.FacilityId" ng-change="getFacilityUsers()" name="facility"
                        class="filter-combo">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 30 : 0}}
                            <span ng-if="$select.selected.Text.length>30">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div> -->
            <div class="col-sm-4">
                <label class="col-sm-12 control-label filter-lbl" for="storemaster"
                    translate="inventory.opticalitemmaster.store.lbl"></label>
                <div class="col-sm-12">
                    <ui-select ng-model="currentfilter.StoreMasterId" name="storemaster" class="filter-combo">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 30 : 0}}
                            <span ng-if="$select.selected.Text.length>30">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.StoreMaster | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="col-sm-4">
                <label class="col-sm-12 control-label filter-lbl" for="status"
                    translate="inventory.opticalitemmaster.status.lbl"></label>
                <div class="col-sm-12">
                    <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 8 : 0}}
                            <span ng-if="$select.selected.Text.length>8">...</span>
                        </ui-select-match>
                        <ui-select-choices
                            repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </div>
            </div>
            <div class="col-sm-2" style="top: 25px;float: right;">
                <button type="button" tabindex="-1" class="btn-add"
                    ng-click="addNew()" uib-tooltip="{{ 'inventory.opticalitemmaster.addstock.lbl' | translate }}"
                    tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </form>
</div>
<div class="container-fluid usermap">
    <!-- <div ui-grid="vm.gridConfig" class="table-uigrid"></div> -->
    <custom-table config="vm.gridConfig"></custom-table>
    <div class="fooder-bgs">
        <div class="row">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
                items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
    </div>
</div>
