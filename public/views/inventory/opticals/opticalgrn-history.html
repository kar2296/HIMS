<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title">{{currentfilter.title}} - {{currentfilter.itemname}} {{'['}}
            {{currentfilter.itemcode}} {{']'}} </h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <div class="col-sm-5">
        <div class="form-group">
            <label class="col-sm-5 control-label" for="fromdate" translate="inventory.grn-history.fromdate.lbl"></label>
            <div class="col-sm-7">
                <input type="text" class="form-control" name="fromdate" ng-date-object
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                    is-open="fromdatePopup.opened" ng-model="currentfilter.FromDate">
            </div>
        </div>
    </div>
    <div class="col-sm-5">
        <div class="form-group">
            <label class="col-sm-5 control-label" for="todate" translate="inventory.grn-history.todate.lbl"></label>
            <div class="col-sm-7">
                <input type="text" class="form-control" name="todate" ng-date-object
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
                    is-open="todatePopup.opened" ng-model="currentfilter.ToDate">
            </div>
        </div>
    </div>
    <div class="col-sm-2">
        <button type="button" class="draftbutton" translate="inventory.grn-history.apply.lbl"
            ng-click="actionSearch()"></button>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="col-sm-6">
        <div class="drhms-special-count">Total PO Quantity: {{' '}}{{item.TotalPoQuantity}}
        </div>
    </div>
    <div class="col-sm-6">
        <div class="drhms-special-count">Total GRN Quantity: {{' '}}{{item.TotalGrnQuantity}}
        </div>
    </div>
</div>
