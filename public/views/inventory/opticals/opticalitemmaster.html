<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="facility"
                translate="inventory.opticalitemmaster.filter_facility.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.FacilityId" name="facility" ng-disabled="item.isDisabled" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 40 : 0}}
                        <span ng-if="$select.selected.Text.length>40">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="ItemCode"
                translate="inventory.opticalitemmaster.filter_itemcode.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="ItemCode" ng-model="item.ItemCode" placeholder=""
                    required>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="ItemName"
                translate="inventory.opticalitemmaster.filter_itemname.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="ItemName" ng-model="item.ItemName" placeholder=""
                    required>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="OpticalProductType"
                translate="inventory.opticalitemmaster.filter_producttype.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.OpticalProductTypeId" name="OpticalProductType" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 40 : 0}}
                        <span ng-if="$select.selected.Text.length>40">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.OpticalProductType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="Rate" translate="inventory.opticalitemmaster.rate.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="Rate" ng-model="item.Rate" placeholder="" required>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="GSTPercentage"
                translate="inventory.opticalitemmaster.gst.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="GSTPercentage" ng-model="item.GSTPercentage"
                    placeholder="" required>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="HikePercentage"
                translate="inventory.opticalitemmaster.hike.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="HikePercentage" ng-model="item.HikePercentage"
                    placeholder="" required>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="SalesPrice"
                translate="inventory.opticalitemmaster.salesprice.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="SalesPrice" ng-model="item.SalesPrice" placeholder=""
                    required>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" translate="inventory.opticalitemmaster.isactive.lbl"></label>
            <div class="col-sm-12">
                <input type="checkbox" class="custom-checkbox" name="isactive" ng-model="item.IsActive"
                    ng-checked="item.IsActive == 1">
            </div>
        </div>
    </form>
</div>

<div class="fooder-bgs">
    <button type="button" class="btn btn-sm pyr-color10" ng-click="backToList()"><i
            class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button>
    <div class="pull-right">
        <button type="button" class="draftbutton" ng-click="save()" translate="common.saveaction.lbl"></button>
        <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
            ng-click="saveandApprove()"></button>
    </div>
</div>
