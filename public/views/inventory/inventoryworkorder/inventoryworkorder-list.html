<link rel="stylesheet" href="app/css/drhms.css">
<div class="row">
    <div class="drhms-filters">
        <div class="col-sm-8">
            <h4 translate="inventory.inventoryworkorder.pagetitle.lbl"></h4>
        </div>
        <div class="col-sm-3">
            <div class="search">
                <input type="text" class="form-control" on-enter="getList()" ng-model="currentfilter.InvWorkorderNumber"
                    translate translate-attr-placeholder="inventory.inventoryworkorder.workorderno.lbl">
                <i class="fas fa-search" aria-hidden="true"></i>
            </div>
        </div>
        <div class="col-sm-1">
            <button type="button" class="drhms-billing-btn drhms-add-btn" ng-click="addNew()"
                uib-tooltip="{{ 'inventory.inventoryworkorder.pagetitle.lbl' | translate }}" tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-sm-12 ">
        <div class="form-group col-sm-3">
            <div class="col-sm-4">
                <label class="control-label" for="stockingpoint"
                    translate="inventory.inventoryworkorder.department.lbl"></label>
            </div>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.DepartmentId" ng-change="getList()" name="stockingpoint">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-3">
            <div class="col-sm-4">
                <label class="control-label" for="diposeddate" translate="From Date"></label>
            </div>
            <div class="col-sm-8">
                <input type="text" class="form-control" name="diposeddate" ng-date-object
                    datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                    is-open="fromdatePopup.opened" ng-model="currentfilter.FromDate" ng-change="getList()">
            </div>
        </div>
        <div class="form-group col-sm-3">
            <div class="col-sm-4">
                <label class="control-label" for="diposeddate" translate="To Date"></label>
            </div>
            <div class="col-sm-8">
                <input type="text" class="form-control" name="diposeddate" ng-date-object
                    datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
                    is-open="todatePopup.opened" ng-model="currentfilter.ToDate" ng-change="getList()">
            </div>
        </div>
        <div class="form-group col-sm-3">
            <div class="col-sm-4">
                <label class="control-label" for="status" translate="Supplier"></label>
            </div>
            <div class="col-sm-8">
                <autosearch itemid="currentfilter.VendorMasterId" iteminfo="" rowdata="" config="vm.vendorcontrolconfig"
                    itemchange="getList()" onenter="getList()" placeholder="'Supplier'"></autosearch>
                <!-- <ui-select ng-model="currentfilter.InvWorkorderTypeId" ng-change="getList()" name="status">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.InvWorkorderType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select> -->
            </div>
        </div>
        <div class="form-group col-sm-3">
            <div class="col-sm-4">
                <label class="control-label" for="status" translate="inventory.inventoryworkorder.status.lbl"></label>
            </div>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.InvWorkorderStatusId" ng-change="getList()" name="status">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.InvWorkorderStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
    <customreport-table config="vm.gridConfig"></customreport-table>
    <customreport-table config="vm.gridConfig"></customreport-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
