<style>
    .panel-footer {
        padding: 4px 15px;
        background-color: #ccecf5;
        border-top: 1px solid #eeeeee;
        border-bottom-right-radius: 3px;
        border-bottom-left-radius: 3px;
        margin: 0px -5px;
    }

    .formRoot2 {

        height: 300px;
    }

    element.style {
        height: 338px;
    }
</style>
<div class="row page-header">
    <h4 class="mt0 col-sm-12" translate="inventory.returninformation-form.pagetitle.lbl"></h4>
</div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot2">
                <div class="panel panel-default">
                    <!--<div class="panel-heading"><h3 class="panel-title" translate="inventory.returninformation-form.pagetitle.lbl"></h3></div>!-->
                    <div class="panel-body form-panel">
                        <div class="col-sm-12">

                            <!-- leftpanel -->
                            <div class="col-sm-6">
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="facility"
                                        translate="inventory.returninformation-form.facility.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="facility" ng-model="item.facility"
                                            placeholder="">
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="vendor"
                                        translate="inventory.returninformation-form.vendor.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="vendor" ng-model="item.vendor"
                                            placeholder="">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="grndate"
                                        translate="inventory.returninformation-form.grndate.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="grndate" ng-model="item.grndate"
                                            placeholder="">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="grn"
                                        translate="inventory.returninformation-form.grn.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="grn" ng-model="item.grn"
                                            placeholder="">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="address"
                                        translate="inventory.returninformation-form.address.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <textarea rows="3" name="address" ng-model="item.address" maxlength="4000"
                                            style="width:100%;" class="notes-textarea"></textarea>

                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="comments"
                                        translate="inventory.returninformation-form.comments.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <textarea rows="3" name="comments" ng-model="item.comments" maxlength="4000"
                                            style="width:100%;" class="notes-textarea"></textarea>
                                    </div>
                                </div>
                            </div>

                            <!-- rightpanel -->
                            <div class="col-sm-6">
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="invoicedate"
                                        translate="inventory.returninformation-form.invoicedate.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="invoicedate"
                                            ng-model="item.invoicedate" placeholder="">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="invoice"
                                        translate="inventory.returninformation-form.invoice.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="invoice" ng-model="item.invoice"
                                            placeholder="">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="podate"
                                        translate="inventory.returninformation-form.podate.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="podate" ng-model="item.podate"
                                            placeholder="">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="po"
                                        translate="inventory.returninformation-form.po.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="po" ng-model="item.po"
                                            placeholder="">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-7 col-md-5 control-label" for="contactno"
                                        translate="inventory.returninformation-form.contactno.lbl"></label>
                                    <div class="col-sm-5 col-md-7">
                                        <input type="text" class="form-control" name="contactno"
                                            ng-model="item.contactno" placeholder="">
                                    </div>
                                </div>



                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="panel-footer formactionbar">
                <div class="pull-right">
                    <button type="submit" class="btn btn-primary btn-sm" ng-click="saveItem()"
                        translate="common.saveaction.lbl"></button>
                    <button id="btnCancelForm" type="button" class="draftbutton" ng-click="cancel()"
                        translate="common.cancelaction.lbl"></button>
                </div>
            </div>
        </form>
    </div>
</div>
