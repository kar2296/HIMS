<style>
    button {
        margin: 2px 3px;
    }
    
    .ui-grid-render-container-left .ui-grid-viewport {
        height: 190px !important;
    }
     .modal-lg {
    width: 1000px !important;
}
input[type=search], input[type=text]{min-height:24px;}
.modal-dialog.modal-lg .ui-grid-viewport{
    height:150px !important;
    min-height: 150px;
}.col-sm-12.panel-footer.formactionbar {
    margin-top: 6px;
    margin-bottom: 0px;
}
.modal-dialog.modal-lg .ui-grid-viewport {
    height: 100% !important;
    min-height: 120px !important;
}button.btn.btn-xs.btn-danger{
padding: 5px 21px;
}
</style>

<div class="modal-header custom-modal-header">
    <h4 class="modal-title custom-modal-title" translate="inventory.findreturn.pagetitle.lbl"></h4>
</div>
<div class="bg-pattern">
    <div class="row filter-area panel-favorite">
        <div class="dynamicform-content">
            <dynamicform modeldata="modeldata" schema="schema"></dynamicform>
            <div class="form-group col-sm-3">
                <button type="button" class="draftbutton {{action.cls}}" ng-repeat="action in schema.actions" ng-click="actionClick(action.type)"
                    translate="{{action.translate}}"></button>
            </div>
        </div>
    </div>
    <div class="col-sm-12 grid-div">
        <div ui-grid="vm.gridConfig" class="table-uigrid" set-grid-height reduce-height="200" ui-grid-selection></div>
    </div>
    <div class="col-sm-12 panel-footer formactionbar">
        <div class="col-sm-12">
            <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
        </div>
        <div class=" col-sm-1">
            <!--<button type="button" class="btn btn-danger btn-sm pull-right" ng-click="cancelCallback()" translate="common.cancelaction.lbl"></button>-->
        </div>
    </div>
</div>
