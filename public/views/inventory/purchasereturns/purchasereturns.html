<link rel="stylesheet" href="app/css/drhms.css">
<div class="row">
    <div class="drhms-filters">
        <div class="col-sm-10">
            <h4 translate="inventory.purchasereturn.pagetitle.lbl"></h4>
        </div>
        <div class="col-sm-3">
            <div class="search">
                <input type="text" class="form-control textbox-search" style="width:250px;" on-enter="getList()"
                    name="ponumber" ng-model="currentfilter.PrnNumber" translate translate-attr-placeholder="Return #">
                <i class="fas fa-search" aria-hidden="true"></i>
            </div>
        </div>
        <div class="col-sm-1">
            <button type="button" class="drhms-billing-btn drhms-add-btn" ng-click="addNew()"
                uib-tooltip="{{ 'inventory.purchasereturn.addnew-tooltip.lbl' | translate }}"
                tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
            </button>
            <span class="drhms-billing-btn drhms-home-btn" ng-if=" Context =='store'"><i class="fas fa-home"
                    ng-click="backtoList()" uib-tooltip="Dashboard" tooltip-placement="bottom"></i></span>
        </div>
    </div>
</div>
<div class="row">
    <div class="form-group col-sm-2">
        <label class="col-sm-12" for="fromdate" translate="From Date"></label>
        <div class="col-sm-12">
            <div class="datepicker">
                <input type="text" class="form-control" name="fromdate" ng-change="getList()"
                    datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                    is-open="fromdatePopup.opened" ng-model="currentfilter.FromDate">
                <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
        </div>
    </div>
    <div class="form-group col-sm-2">
        <label class="col-sm-12" for="todate" translate="inventory.purchasereturns.todate.lbl"></label>
        <div class="col-sm-12">
            <div class="datepicker">
                <input type="text" class="form-control" name="todate" ng-change="getList()"
                    datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
                    is-open="todatePopup.opened" ng-model="currentfilter.ToDate">
                <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
        </div>
    </div>
    <!-- <div class="form-group col-sm-2">
        <label class="col-sm-12" for="prndate" translate="inventory.purchasereturns.prndate.lbl"></label>
        <div class="col-sm-12">
            <div class="datepicker">
                <input type="text" class="form-control" name="prndate" ng-change="getList()"
                    datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="prndatePopup = { opened: true }"
                    is-open="prndatePopup.opened" ng-model="currentfilter.PrnDate">
                <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
        </div>
    </div> -->
    <div class="form-group col-sm-2">
        <label class="col-sm-12" for="vendor" translate="inventory.purchasereturns.vendor.lbl"></label>
        <div class="col-sm-12">
            <autosearch itemid="currentfilter.VendorMasterId" iteminfo="" rowdata="" config="vm.vendorcontrolconfig"
                itemchange="getList()" candisable="item.IsGrnReturn">
            </autosearch>
        </div>
    </div>
    <div class="form-group col-sm-2">
        <label class="col-sm-12" for="returnstore" translate="inventory.purchasereturns.returnstore.lbl"></label>
        <div class="col-sm-12">
            <ui-select ng-model="currentfilter.StoreMasterId" name="returnstore" ng-change="getList()" required>
                <ui-select-match>
                    {{$select.selected.StoreName | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.StoreName.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.UserStores | filter: { StoreName: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-2">
        <label class="col-sm-12" for="status" translate="inventory.purchasereturns.status.lbl"></label>
        <div class="col-sm-12">
            <multiselectchk list="lookup.PrnStatus" selected="currentfilter.PrnStatusId" change="getList()">
            </multiselectchk>
        </div>
    </div>
</div>

<div class="fooder-bgs">
    <div class="row">
        <custom-table config="vm.gridConfig"></custom-table>
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
