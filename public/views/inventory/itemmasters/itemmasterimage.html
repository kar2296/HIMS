<style>
    .panel-heading {
        padding: 4px 15px;
    }
    
    .well {
        min-height: 460px;
        margin-bottom: 0px;
        padding: 19px;
        border: 1px solid #ededed;
        border-radius: 4px;
        background: rgb(233, 246, 253);
        /* Old browsers */
        background: -moz-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* FF3.6-15 */
        background: -webkit-linear-gradient(top, rgba(233, 246, 253, 1) 0%, rgba(211, 238, 251, 1) 100%);
        /* Chrome10-25,Safari5.1-6 */
        background: linear-gradient(to bottom, rgb(250, 250, 250) 0%, rgb(247, 252, 253) 100%);
        /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        filter: progid: DXImageTransform.Microsoft.gradient( startColorstr='#e9f6fd', endColorstr='#d3eefb', GradientType=0);
        /* IE6-9 */
        box-shadow: 4px 2px 13px -7px rgba(0, 0, 0, 0.75);
    }
    
    .panel-body {
        padding: 15px;
        margin-left: 0px;
        margin-top: 0px;
        margin-right: 0px;
        margin-bottom: 0px;
        background-image: url(app/img/bg-body.jpg);
        background-repeat: repeat;
        overflow: auto;
    }
    
    .wrapper>section {
        height: 595px;
    }
    
    .panel {
        margin-bottom: 0px;
    }
    
    .formRoot {
        overflow: auto;
        height: 495px;
    }
    
    .panel-footer {
        padding: 4px 15px;
        background-color: #ccecf5;
        border-top: 1px solid #eeeeee;
        border-bottom-right-radius: 3px;
        border-bottom-left-radius: 3px;
    }
    
    .page-header {
        margin: 0px 0px 0px 0px !important;
    }
    
    @media(max-width:992px) {
        .well {
            min-height: 443px;
        }
    }
</style>
<div class="row" id="inventorytab">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot">
                <div class="panel panel-default">
                    <div class="col-sm-12">
                        <div class="col-sm-4"></div>
                        <div class="col-sm-8">
                            <img class="item-logo-img" ng-show="!!currentcontext.file" ngf-thumbnail="currentcontext.file" />
                            <img class="item-logo-img" ng-show="!currentcontext.file && item.ImagePath" data-ng-src="data:image/png;base64,{{currentcontext.Photo}}"
                            />
                        </div>
                        <div class="form-group">
                            <label class="col-sm-4 control-label" translate="appmanager.user.imageupload.lbl"></label>
                            <div class="col-sm-8">
                                <input type="file" ngf-select ng-model="currentcontext.file" name="file" ngf-max-size="200MB" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="fooder-bgs">
                  <button type="button" class="btn btn-sm pyr-color10" ng-click="backToList()"><i class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button>
                <div class="pull-right">
                    <button type="button"   class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
                    <!-- <button id="btnSaveApprove" type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveactivate-action.lbl"
                                ng-click="saveAndApprove()"></button>-->
                    <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                    <!-- <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button> -->
                </div>
            </div>
        </form>
    </div>
</div>
