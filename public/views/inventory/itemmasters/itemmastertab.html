<style>
    .item-code {
        color: #F44336;
    }
</style>
<div class="row page-header">
    <div class="col-sm-3">
        <h4 class="active col-sm-12 mt0" translate="Manage Inventory Master"></h4>
    </div>
    <div class="col-sm-7">
        <strong class="active" translate="{{$state.params.ItemName}}-">
        </strong>
        <strong class="active"><span class="item-code" translate="{{$state.params.ItemCode}}"></span></strong>
        &nbsp;&nbsp;
        <strong class="active" translate="Last Item Created: {{PrevItem.ItemName}}"></strong>

        <!-- <strong class="active" translate=" {{$state.params.ItemName}}-{{$state.params.ItemCode}}"></strong> &nbsp;
        &nbsp; <strong class="active" translate="Last Item Created: {{PrevItem.ItemName}}"></strong> -->
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <!-- <div class="search" style=" width: 100%;">
                                <input type="text" id="pid" class="form-control" on-enter="getList()" ng-model="currentfilter.Code"
                                    translate translate-attr-placeholder="Name/Order#/UHID/bill#/"> <i class="fas fa-search" aria-hidden="true"></i>

                            </div> -->
            <button type="button" tabindex="-1" class="btn-add" ng-click="addNew()"
                uib-tooltip="{{ 'Add Inventory Master' | translate}}" tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
                <!-- <span translate="clinicalmaster.serviceitem-list.addnew.lbl " class="text-white"></span> -->
            </button>
            <span class="drhms-billing-btn drhms-home-btn"><i class="fas fa-home" ng-click="backtoList()"
                    uib-tooltip="Dashboard" tooltip-placement="bottom"></i></span>
        </div>
    </div>
</div>
<div id="receipt_tab">
    <div class="row">
        <div class="col-sm-12">
            <uib-tabset active="active" id="assettabs">
                <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)"
                    disable="tab.canDisable">
                </uib-tab>
            </uib-tabset>
            <div ui-view class="tabview"></div>
        </div>
    </div>
</div>
