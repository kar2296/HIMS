    <div class="row page-header">
            <div class="col-sm-12">
                <!-- <div class="col-sm-4">
                        <h4 class="mt0 col-sm-12" translate="inventory.itemrackmapping.pagetitle1.lbl"></h4>
                </div> -->
                <div class="col-sm-6">
                        <label class="col-sm-5 control-label filter-lbl" style="color: black;" translate="inventory.itemrackmapping.producttype.lbl"></label>
                        <div class="col-sm-6">
                            <ui-select ng-model="currentfilter.ProductTypeId" ng-change="getList()" class="filter-combo">
                                <ui-select-match>
                                    {{$select.selected.Text | limitTo : 8 : 0}}
                                    <span ng-if="$select.selected.Text.length>8">...</span>
                                </ui-select-match>
                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ProductType | filter: { Text: $select.search }">
                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                </ui-select-choices>
                            </ui-select>
                        </div>
                    </div>
                <div class="col-sm-4">
                    <div class="filters">
                        <div class="search">
                                <autosearch itemid="currentfilter.ItemMasterId" iteminfo="" rowdata="" config="vm.itemcontrolconfig"
                                itemchange="getList()" onenter="getList()"></autosearch>
                        </div>
                        <button type="button" tabindex="-1" class="btn-add"
                            ng-click="addNew()" uib-tooltip="{{ 'inventory.itemmasters.addnew-tooltip.lbl' | translate }}"
                            tooltip-placement="bottom">
                            <i class="fa fa-plus" aria-hidden="true"></i>
                            <!-- <span translate="clinicalmaster.serviceitem-list.addnew.lbl " class="text-white"></span> -->
                        </button>
                    </div>
                </div>
            </div>
        </div>
