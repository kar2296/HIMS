<link rel="stylesheet" href="app/css/drhms.css">
<div class="row">
    <div class="drhms-filters">
        <div class="col-sm-10">
            <h4 translate="Consignment GRN"></h4>
        </div>
        <div class="col-sm-4">
            <input type="text" class="form-control textbox-search" on-enter="getList()" name="ponumber"
                ng-model="currentfilter.GrnNumber" translate translate-attr-placeholder="Search PO # / Invoice / GRN #">
        </div>
        <div class="col-sm-2">
            <button type="button" tabindex="-1" class="drhms-billing-btn drhms-add-btn" ng-click="addNew()"
                uib-tooltip="{{ 'inventory.grns.pagetitle.lbl' | translate }}" tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
            </button>
            <span class="drhms-billing-btn drhms-home-btn" ng-if="Context =='store'"><i class="fas fa-home"
                    ng-click="backtoList()" uib-tooltip="Dashboard" tooltip-placement="bottom"></i></span>
        </div>
    </div>
</div>
<div class="row">
    <div class="form-group col-sm-3">
        <label class="col-sm-4" for="date" translate="inventory.grns.date.lbl"></label>
        <div class="col-sm-8">
            <div class="datepicker">
                <!-- <input type="text" class="form-control" name="grndate" ng-change="getList()"
                    datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="grndatePopup = { opened: true }"
                    is-open="grndatePopup.opened" ng-model="currentfilter.GrnDate"> -->
                    <!-- <i class="fa fa-calendar" aria-hidden="true"></i> -->
                    <input type="text" class="form-control" name="fromdate" ng-change="getList()"
                            datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                            placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                            is-open="fromdatePopup.opened" ng-model="currentfilter.FromDate">

            </div>
        </div>
    </div>
    <div class="form-group col-sm-3">
        <label class="col-sm-4" for="date" translate="inventory.grns.date.lbl"></label>
        <div class="col-sm-8">
            <div class="datepicker">
                <input type="text" class="form-control" name="todate" ng-change="getList()"
                            datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                            placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
                            is-open="todatePopup.opened" ng-model="currentfilter.ToDate">
            </div>
        </div>
    </div>
    <div class="form-group col-sm-3">
        <label class="col-sm-4" for="vendor" translate="inventory.grns.vendorname1.lbl"></label>
        <div class="col-sm-8">
            <autosearch itemid="currentfilter.VendorMasterId" iteminfo="" rowdata="" config="vm.vendorcontrolconfig"
                itemchange="getList()" onenter="getList()" placeholder="'Supplier'"></autosearch>
        </div>
    </div>
    <div class="form-group col-sm-3">
        <label class="col-sm-4" for="fstore" translate="inventory.grns.store.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.StoreMasterId" name="fstore" ng-change="getList()" required>
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.UserStores | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-3">
        <label class="col-sm-4" for="DcNumber" translate="DC Number"></label>
        <div class="col-sm-8">
            <input type="text" on-enter="getList()" name="DcNumber" ng-model="currentfilter.DcNumber"
                translate translate-attr-placeholder="Search DC #">
        </div>
    </div>
    <div class="form-group col-sm-3">
        <label class="col-sm-4" for="status" translate="inventory.grns.status1.lbl"></label>
        <div class="col-sm-8">
            <multiselectchk list="lookup.GrnStatus" selected="currentfilter.GrnStatusId" change="getList()">
            </multiselectchk>
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="row">
    <div class="pull-right">
        <div class="col-sm-12">
            <span translate="Total Net Amount">: {{(TotalNetamount|displaycurrency)}}</span>
        </div>
    </div>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
