<style>
    .form-group {
        margin: 0px !important;
        height: 70px;
    }
</style>
<div class="row page-header">
    <div class="col-sm-6">
        <h3 class="mt0" translate="inventory.producttype.pagetitle.lbl"></h3>
    </div>
    <div class="col-sm-6">
        <!-- <button class="btn-add" ng-click="addNew()" uib-tooltip="Product Type" tooltip-placement="bottom">
            <i class="fa fa-plus" aria-hidden="true"></i> -->
        <!-- <span translate="clinicalmaster.serviceitem-list.addnew.lbl"></span> -->
        </button>
        <span class="drhms-billing-btn drhms-home-btn" ng-if="Context =='inventory'" ng-click="backtoList()"
            uib-tooltip="Dashboard" tooltip-placement="bottom"><i class="fas fa-home"></i></span>
    </div>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <!-- <div class="form-group col-sm-6">
                                    <label class="col-sm-12 control-label" for="facility" translate="inventory.producttype.facilityId.lbl"></label>
                                    <div class="col-sm-12">
                                        <ui-select ng-model="item.FacilityId" name="facility" required>
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div> -->
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="category" translate="inventory.itemcategory.name.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.CategoryId" name="category" ng-change="fillMasterInfo($select.selected)"
                    theme="bootstrap" required>
                    <ui-select-match>
                        {{$select.selected.CategoryName | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.CategoryName.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ItemCategory | filter: { CategoryName: $select.search }">
                        <div ng-bind-html="lookupitem.CategoryName | highlight: $select.search">
                        </div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="subcategory"
                translate="inventory.itemsubcategorys.filter_subcategoryname.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.SubCategoryId" name="subcategory" theme="bootstrap" ng-change="getSubType()" required>
                    <ui-select-match>
                        {{$select.selected.SubCategoryName | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.SubCategoryName.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ItemSubCategory | filter: {SubCategoryName: $select.search }">
                        <div ng-bind-html="lookupitem.SubCategoryName | highlight: $select.search">
                        </div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="subtype"
                translate="Sub Type"></label>
            <div class="col-sm-12">
                <ui-select id="categoryid" ng-keyup="moveHeaderFocus('categoryid')" ng-change="getProductType()"
                    ng-model="item.SubTypeId" ng-change="" theme="bootstrap" name="scategoryId" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length > 20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ItemSubType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="code" translate="inventory.producttype.code.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="code" ng-model="item.ProductTypeCode" placeholder=""
                    required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="name" translate="inventory.producttype.name.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="name" ng-model="item.ProductTypeName" placeholder=""
                    required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="inventory.producttype.isactive.lbl"></label>
            <div class="col-sm-12">
                <input type="checkbox" class="custom-checkbox" name="isactive" ng-model="item.IsActive"
                    ng-checked="item.IsActive == 1">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="Is All Branch"></label>
            <div class="col-sm-12">
                <input type="checkbox" class="custom-checkbox" name="IsAllFacility" ng-model="item.IsAllFacility">
            </div>
        </div>
    </form>
</div>
<div class="fooder-bgs">
    <div class="pull-left">
        <button type="button" class="btn btn-sm pyr-color10" ng-click="backToList()"><i
                class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button>
    </div>
    <div class="pull-right">
        <button type="button" class="draftbutton" ng-click="save()" translate="common.saveaction.lbl"></button>
        <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
            ng-click="saveandApprove()"></button>
    </div>
</div>
