    </div>
    <div class="col-sm-7">
        <div class="filters">
            <div class="search">
                <input type="text" id="pid" class="form-control" on-enter="getList()" ng-model="currentfilter.producttypename" translate
                    translate-attr-placeholder="inventory.producttypes.filter_producttypename.lbl">
                <i class="fas fa-search" aria-hidden="true"></i>

            </div>
            <button type="button" tabindex="-1" class="btn-add" ng-click="addNew()" uib-tooltip="Product Type"

            </button>

        <table id="bannerdetails" style="width:101%;">
            <tr>
                <td>
                    <label class="col-sm-4 control-label" for="category" translate="inventory.producttypes.filter_category.lbl"></label>
                </td>
                <td>
                    <ui-select ng-model="currentfilter.CategoryId" name="category" ng-change="getList()" theme="bootstrap" required>
                        <ui-select-match>
                            {{$select.selected.CategoryName | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.CategoryName.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ItemCategory | filter: { CategoryName: $select.search }">
                            <div ng-bind-html="lookupitem.CategoryName | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </td>
                <td>
                    <label class="col-sm-4 control-label" for="subcategory" translate="inventory.producttypes.filter_subcategory.lbl"></label>
                </td>
                <td>
                    <ui-select ng-model="currentfilter.SubCategoryId" ng-change="getList()" name="subcategory" theme="bootstrap" required>
                        <ui-select-match>
                            {{$select.selected.SubCategoryName | limitTo : 20 : 0}}
                            <span ng-if="$select.selected.SubCategoryName.length>20">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ItemSubCategory | filter: {SubCategoryName: $select.search }">
                            <div ng-bind-html="lookupitem.SubCategoryName | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </td>
                <td>
                    <label class="col-sm-4 control-label filter-lbl" translate="Facility"></label>
                </td>
                <td>
                    <ui-select ng-model="currentfilter.FacilityId" ng-change="getList()" class="filter-combo">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 8 : 0}}
                            <span ng-if="$select.selected.Text.length>8">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </td>
                <td>
                    <label class="col-sm-4 control-label filter-lbl" translate="inventory.producttypes.filter_status.lbl"></label>
                </td>
                <td>
                    <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                        <ui-select-match>
                            {{$select.selected.Text | limitTo : 8 : 0}}
                            <span ng-if="$select.selected.Text.length>8">...</span>
                        </ui-select-match>
                        <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                            <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                </td>

            </tr>
        </table>
