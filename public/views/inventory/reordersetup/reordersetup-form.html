<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="Reorder Setup"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="Store" translate="Store Name"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.StoreMasterId" name="Store" autofocus required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.UserStores | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="minqty" translate="Min Qty"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="minqty" ng-model="item.MinQty" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="maxqty" translate="Max Qty"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="maxqty" ng-model="item.MaxQty" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="Lead" translate="Lead Time"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="Lead" ng-model="item.LeadTime" placeholder="">
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class="col-sm-12 control-label" for="Reorder" translate="Reorder Qty"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="Reorder" ng-model="item.ROLQty" placeholder="">
            </div>
        </div>
    </form>
</div>
<div class="row">
    <div class="pull-right">
        <!-- <button type="button"   class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button> -->
        <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
            ng-click="saveandApprove()"></button>
        <!-- <button id="btnClearForm" type="reset" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button> -->
        <!-- <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button> -->
        <!-- <button id="btnCancelForm" type="button" class="btn btn-danger btn-sm ng-scope" ng-click="cancelCallback()" translate="common.cancelaction.lbl"><span class="ng-scope">Cancel</span></button> -->
    </div>
</div>
