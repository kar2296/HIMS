<style>
    .form-group {
        height: 72px;
    }
</style>
<div class="row">
    <div class="col-sm-6">
        <h4 translate="inventory.uommaster.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-6">
        <button class="btn-add" ng-click="addNew()" uib-tooltip="UOM" tooltip-placement="bottom">
            <i class="fa fa-plus" aria-hidden="true"></i>
            <!-- <span translate="clinicalmaster.serviceitem-list.addnew.lbl"></span> -->
        </button>

    </div>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="code" translate="inventory.uommaster.code.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="code" ng-model="item.UomCode"
                    ng-disabled="item.isDisabled" placeholder="" required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="name" translate="inventory.uommaster.name.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="name" ng-model="item.UomName"
                    ng-disabled="item.isDisabled" placeholder="" required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="inventory.uommaster.uomtypeId.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.UomTypeId" ng-disabled="item.isDisabled">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.UomType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="inventory.uommaster.ismulti.lbl"></label>
            <div class="col-sm-12">
                <input type="checkbox" class="custom-checkbox" name="ismulti" ng-model="item.IsMultiUse">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="inventory.uommaster.isactive.lbl"></label>
            <div class="col-sm-12">
                <input type="checkbox" class="custom-checkbox" name="isactive" ng-model="item.IsActive"
                    ng-checked="item.IsActive == 1">
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="Is All Branch"></label>
            <div class="col-sm-12">
                <input type="checkbox" class="custom-checkbox" name="IsAllFacility" ng-model="item.IsAllFacility">
            </div>
        </div>
    </form>
</div>
<div class="fooder-bgs">
    <button type="button" class="btn btn-sm pyr-color10" ng-click="backToList()">
        <i class="fa fa-angle-left"></i>&nbsp;&nbsp;
        <span translate="common.backaction.lbl"></span>
    </button>
    <div class="pull-right">
        <button type="button" class="draftbutton" ng-click="save()"
            translate="common.saveaction.lbl"></button>
        <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
            ng-click="saveandApprove()"></button>
        <!-- <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()"
            translate="common.clearaction.lbl"></button> -->
        <!-- <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button> -->
    </div>
</div>
