<div class="modal-header custom-modal-header">
    <div class="col-sm-10">
        <h4 class="modal-title custom-modal-title" translate="inventory.itemrackmapping.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <img src="../../../../../assets/svg/close.svg" ng-click="cancelCallback()">
        </div>
    </div>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="store" translate="inventory.itemrackmapping.store.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" ng-model="item.StoreName" disabled>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="category"
                translate="inventory.itemrackmapping.category.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" ng-model="item.SubCategory" disabled>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="producttype"
                translate="inventory.itemrackmapping.producttype.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" ng-model="item.ProductType" disabled>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="itemname"
                translate="inventory.itemrackmapping.itemname.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" ng-model="item.ItemName" disabled>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="rack" translate="inventory.itemrackmapping.rack.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.RackId" name="rack" on-select="SelectedRack($select.selected)" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Rack | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="self" translate="inventory.itemrackmapping.self.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="self" ng-model="item.Self" translate
                    translate-attr-placeholder="inventory.itemrackmapping.self.lbl" required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" for="tray" translate="inventory.itemrackmapping.tray.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="tray" ng-model="item.Tray" translate
                    translate-attr-placeholder="inventory.itemrackmapping.tray.lbl" required>
            </div>
        </div>
        <div class="form-group col-sm-4">
            <label class="col-sm-12 control-label" translate="inventory.itemrackmapping.active.lbl"></label>
            <div class="col-sm-12">
                <input type="checkbox" name="isactive" class="custom-checkbox" ng-model="item.IsActive">
            </div>
        </div>
    </form>
</div>
<div class="row">
    <div class="pull-right">
        <!-- <button type="button"   class="draftbutton" translate="common.saveaction.lbl" ng-click="Save()"></button> -->
        <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
            ng-click="SaveandApprove()"></button>
        <!-- <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button> -->
    </div>
</div>
