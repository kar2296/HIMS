<link rel="stylesheet" href="app/css/drhms.css">

<div class="row">
    <div class="form-group col-sm-3">
        <label class="col-sm-4" for="toFacility" translate="My Facility"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.ToFacilityId" name="toFacility" ng-change="getList()">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-3">
        <label class="col-sm-4" for="mystore" translate="inventory.stocktransfers.mystore.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.StoreMasterId" ng-change="getList()" name="mystore" required>
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 15 : 0}}
                    <span ng-if="$select.selected.Text.length>15">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.UserStores | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-3">
            <label class="col-sm-4" for="FromFacility" translate="From Facility"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.FacilityId" name="FromFacility"  ng-change="getstore()">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    <div class="form-group col-sm-3">
        <label class="col-sm-4" for="tostore" translate="inventory.stocktransfers.tostore.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.ToStoreMasterId" ng-change="getList()" name="tostore" required>
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 15 : 0}}
                    <span ng-if="$select.selected.Text.length>15">...</span>
                </ui-select-match>
                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ToStore | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-3">
        <label class="col-sm-4" for="transferdate" translate="inventory.stocktransfers.transferdate.lbl"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" name="transferdate" ng-change="getList()" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                placeholder="{{datePickerOptions.placeholder}}" ng-click="transferdatePopup = { opened: true }" is-open="transferdatePopup.opened"
                ng-model="currentfilter.TransferDate">
        </div>
    </div>
    <div class="form-group col-sm-3">
        <label class="col-sm-4" for="transferstatus" translate="inventory.stocktransfers.transferstatus.lbl"></label>
        <div class="col-sm-8">
            <multiselectchk list="lookup.TransferStatus" selected="currentfilter.TransferStatusId" change="getList()">
            </multiselectchk>
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
