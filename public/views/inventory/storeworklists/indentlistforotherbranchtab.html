<link rel="stylesheet" href="app/css/drhms.css">
<div class="page-header-list">
    <h4 class="header-name-litle" translate="Indent List For Other Branch"></h4>
    <div class="search-list-right">
        <span class="drhms-billing-btn drhms-home-btn" ng-if="Context =='store'"><i class="fas fa-home"
                ng-click="backtoList()" uib-tooltip="Dashboard" tooltip-placement="bottom"></i></span>
    </div>
</div>

<div id="receipt_tab">
    <!-- <div class="row tablebox" id="tablebox"> -->
    <div class="row">
        <div class="col-sm-12">
            <uib-tabset active="active">
                <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)"
                    disable="tab.canDisable">
                </uib-tab>
            </uib-tabset>
            <div ui-view></div>
        </div>
    </div>
</div>
