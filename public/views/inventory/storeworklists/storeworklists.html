<link rel="stylesheet" href="app/css/drhms.css">

<div class="row">
    <div class="form-group col-sm-3">
        <label class="col-sm-4" for="mystore" translate="inventory.stockrequests.mystore.lbl"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.StoreMasterId" name="mystore" ng-change="getList()">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.UserStores | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-3">
        <label class="col-sm-4" for="fromstore" translate="From Store"></label>
        <div class="col-sm-8">
            <ui-select ng-model="currentfilter.ToStoreMasterId" name="fromstore" ng-change="getList()">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.ToStore | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-3">
        <label class="col-sm-4" for="workliststatus" translate="inventory.stockrequests.requeststatus.lbl"></label>
        <div class="col-sm-8">
            <multiselectchk list="lookup.RequestStatus" selected="currentfilter.RequestStatusId" change="getList()">
            </multiselectchk>
        </div>
    </div>
    <div class="form-group col-sm-3">
        <label class="col-sm-4" for="fromdate" translate="From Date"></label>
        <div class="col-sm-8">
            <div class="datepicker">
                <input type="text" class="form-control" name="fromdate" ng-change="getList()"
                    datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                    is-open="fromdatePopup.opened" ng-model="currentfilter.FromDate">
                <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
        </div>
    </div>
    <div class="form-group col-sm-3">
        <label class="col-sm-4" for="todate" translate="To Date"></label>
        <div class="col-sm-8">
            <div class="datepicker">
                <input type="text" class="form-control" name="todate" ng-change="getList()"
                    datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                    uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                    placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
                    is-open="todatePopup.opened" ng-model="currentfilter.ToDate">
                <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
        </div>
    </div>
    <!-- <div class="form-group col-sm-3">
        <label class="col-sm-4" for="requesteddate" translate="inventory.stockrequests.requestdate.lbl"></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" name="requesteddate" ng-change="getList()" ng-date-object
                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}"
                ng-click="requestdatePopup = { opened: true }" is-open="requestdatePopup.opened"
                ng-model="currentfilter.RequestedDate">
        </div>
    </div> -->
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
