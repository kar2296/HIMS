<div class="row page-header">
    <div class="col-sm-10">
        <h4 class="mt0" translate="inventory.itemsubcategory.pagetitle.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <!-- <button type="button" tabindex="-1" class="drhms-billing-btn drhms-add-btn" ng-click="addNew()"
                uib-tooltip="Item Sub Category" tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
            </button> -->
        </div>
    </div>
</div>
<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="facility"
                translate="inventory.itemsubcategory.facilityId.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.FacilityId" name="facility" ng-disabled="item.isDisabled" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="category" translate="inventory.itemcategory.name.lbl"></label>
            <div class="col-sm-12">
                <ui-select ng-model="item.CategoryId" name="category" theme="bootstrap" ng-disabled="item.isDisabled"
                    required>
                    <ui-select-match>
                        {{$select.selected.CategoryName | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.CategoryName.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ItemCategory | filter: { CategoryName: $select.search }">
                        <div ng-bind-html="lookupitem.CategoryName | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="code" translate="inventory.itemsubcategory.code.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="code" ng-model="item.SubCategoryCode" placeholder=""
                    ng-disabled="item.isDisabled" required>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" for="name" translate="inventory.itemsubcategory.name.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="name" ng-model="item.SubCategoryName" placeholder=""
                    ng-disabled="item.isDisabled" required>
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" translate="inventory.itemsubcategory.description.lbl"></label>
            <div class="col-sm-12">
                <input type="text" class="form-control" name="description" ng-model="item.SubCategoryDescription"
                    ng-disabled="item.isDisabled" placeholder="">
            </div>
        </div>
        <div class="col-sm-4 form-group">
            <label class="col-sm-12 control-label" translate="inventory.itemsubcategory.isactive.lbl"></label>
            <div class="col-sm-12">
                <input type="checkbox" class="custom-checkbox" name="isactive" ng-model="item.IsActive"
                    ng-checked="item.IsActive == 1">
            </div>
        </div>
    </form>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="pull-left">
            <button type="button" class="btn btn-sm pyr-color10" ng-click="backToList()"><i
                    class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button>
        </div>
        <div class="pull-right">
            <button type="button" class="draftbutton" ng-click="saveandApprove()" translate="common.saveaction.lbl"></button>
            <!-- <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                ng-click="saveandApprove()"></button>
            <button id="btnClearForm" type="button" class="draftbutton" ng-click="clear()"
                translate="common.clearaction.lbl"></button>
            <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()"
                translate="common.cancelaction.lbl"></button> -->
        </div>
    </div>
</div>
