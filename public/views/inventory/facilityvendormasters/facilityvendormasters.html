<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-5">
            <h4 class="mt0 col-sm-12" translate="inventory.facilityvendormastertab.parentpagetitle.lbl"></h4>
        </div>
        <div class="col-sm-7">
            <div class="filters">
                <div class="search">
                    <input type="text" id="pid" class="form-control"on-enter="getList()" ng-model="currentfilter.VendorCode"
                     translate translate-attr-placeholder="inventory.vendormasters.filter_vendorname.lbl"> <i class="fas fa-search" aria-hidden="true"></i>

                </div>
                <button type="button" tabindex="-1" class="btn-add"
                    ng-click="addNew()" uib-tooltip="{{ 'inventory.facilityvendormastertab.parentpagetitle.lbl' | translate }}"
                    tooltip-placement="bottom">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                    <!-- <span translate="clinicalmaster.serviceitem-list.addnew.lbl " class="text-white"></span> -->
                </button>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-sm-12">
        <div class="panel panel-default header-panel">
            <div class="panel-body form-panel header-panel-body">
                    <table id="bannerdetails" style="width:101%;">
                            <tr>
                                <td> <label class="col-md-4 control-label filter-lbl" for="type" translate="inventory.facilityvendormasters.filter_vendortype.lbl"></label>
                                </td>
                                <td> <ui-select ng-model="currentfilter.VendorTypeId" ng-disabled="item.isDisabled" ng-change="getList()" theme="bootstrap" name="type"
                                    autofocus required>
                                    <ui-select-match>
                                        {{$select.selected.Text | limitTo : 20 : 0}}
                                        <span ng-if="$select.selected.Text.length>20">...</span>
                                    </ui-select-match>
                                    <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.VendorType | filter: { Text: $select.search }">
                                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                    </ui-select-choices>
                                </ui-select></td>
                                <td> <label class="col-sm-5 text-right filter-lbl" translate="inventory.facilityvendormasters.filter_status.lbl"></label>
                                </td>
                                <td>
                                        <ui-select ng-model="currentfilter.ActiveStatusId" ng-change="getList()" class="filter-combo">
                                                <ui-select-match>
                                                    {{$select.selected.Text | limitTo : 8 : 0}}
                                                    <span ng-if="$select.selected.Text.length>8">...</span>
                                                </ui-select-match>
                                                <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                                                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                                </ui-select-choices>
                                            </ui-select>
                                </td>
                    
                            </tr>
                    </table>
