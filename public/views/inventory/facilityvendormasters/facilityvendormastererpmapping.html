<style>
    .panel-body{
        overflow:visible !important;
        
    }
.panel-footer {
    padding: 4px 15px;
    background-color: #ccecf5;
    border-top: 1px solid #eeeeee;
    border-bottom-right-radius: 3px;
    border-bottom-left-radius: 3px;
    margin:0px -5px;
}
</style>
<div class="modal-header custom-modal-header">
    <div class="col-sm-6">
            <h4 class="mt0 col-sm-12" translate="inventory.facilityvendormastererpmapping.pagetitle.lbl"></h4>
                </div>
            <div class="col-sm-6">
                    <button type="button" class="btn btn-danger btn-sm pull-right" translate="x"
                    ng-click="backToList()"></button>
                    </div>
        </div></div>
<div class="row">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">	
            <div class="">
                <div class="panel panel-default">
                    <!--<div class="panel-heading"><h3 class="panel-title" translate="inventory.facilityitemmastervendormapping.pagetitle.lbl"></h3></div>!-->
                    <div class="panel-body form-panel">	
                        <div class="col-sm-12">		
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" for="vendorcode" translate="inventory.facilityvendormastererpmapping.vendorcode.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="vendorcode" ng-model="item.VendorCode" placeholder="" disabled  required>
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" translate="inventory.facilityvendormastererpmapping.erpaccounttype.lbl"></label>
                                    <div class="col-sm-12">
                                        <ui-select ng-model="item.ErpAccountTypeId" theme="bootstrap">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ErpAccountType | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" translate="inventory.facilityvendormastererpmapping.erpsubaccounttype.lbl"></label>
                                    <div class="col-sm-12">
                                        <ui-select ng-model="item.ErpSubAccountTypeId" theme="bootstrap">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ErpSubAccountType | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                        </div>
                                <div class="col-sm-12">
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" translate="inventory.facilityvendormastererpmapping.erpglclasstype.lbl"></label>
                                    <div class="col-sm-12">
                                        <ui-select ng-model="item.ErpGLClassTypeId" theme="bootstrap">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.ErpGLClassType | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" translate="inventory.facilityvendormastererpmapping.erpglclassname.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="ErpGLClassName" ng-model="item.ErpGLClassName" placeholder="">
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" translate="inventory.facilityitemmastervendormapping.activefrom.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="activefrom" ng-date-object 
                                                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" 
                                                placeholder="{{datePickerOptions.placeholder}}" 
                                                ng-click="activefromPopup = { opened: true }" 
                                                is-open="activefromPopup.opened" ng-model="item.Activefrom" >
                                    </div>
                                </div>                                          
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" for="vendorname" translate="inventory.facilityvendormastererpmapping.vendorname.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="vendorname" ng-model="item.VendorName" placeholder="" autofocus required disabled>
                                    </div>
                                </div>                            
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" translate="inventory.facilityvendormastererpmapping.erpcreditaccountno.lbl"></label>
                                    <div class="col-sm-12">
                                          <input type="text" class="form-control" name="ErpCreditAccountNo" ng-model="item.ErpCreditAccountNo" placeholder="">
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" translate="inventory.facilityvendormastererpmapping.erpdebitaccountno.lbl"></label>
                                    <div class="col-sm-12">
                                          <input type="text" class="form-control" name="ErpDebitAccountNo" ng-model="item.ErpDebitAccountNo" placeholder="">
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" translate="inventory.facilityvendormastererpmapping.bankname.lbl"></label>
                                    <div class="col-sm-12">
                                        <ui-select ng-model="item.BankId" theme="bootstrap">
                                            <ui-select-match>
                                                {{$select.selected.Text | limitTo : 20 : 0}}
                                                <span ng-if="$select.selected.Text.length>20">...</span>
                                            </ui-select-match>
                                            <ui-select-choices repeat="lookupitem.Id as lookupitem in lookup.Bank | filter: { Text: $select.search }">
                                                <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" for="BankAccountNo" translate="inventory.facilityvendormastererpmapping.bankaccountno.lbl"></label>
                                    <div class="col-sm-12">
                                          <input type="text" class="form-control" name="BankAccountNo" ng-model="item.BankAccountNo" placeholder="" autofocus required>
                                    </div>
                                </div>
                                <div class="form-group col-sm-4">
                                    <label class="col-sm-12 control-label" translate="inventory.facilityvendormastererpmapping.activeto.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="activeto" ng-date-object 
                                                uib-datepicker-popup="{{datePickerOptions.dateFormat}}" 
                                                placeholder="{{datePickerOptions.placeholder}}" 
                                                ng-click="activetoPopup = { opened: true }" 
                                                is-open="activetoPopup.opened" ng-model="item.ActiveTo" >
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="fooder-bgs" style="margin-bottom: 60px;">
                                <div class="pull-right">
                                    <button type="button"   class="draftbutton" translate="common.saveaction.lbl" ng-click="saveItem()"></button>
                                    <!--<button type="button" class="btn dem-color4 text-white btn-sm" translate="common.saveapprove-action.lbl" ng-click="saveAndApprove()"></button>-->
                                    <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                                    <!-- <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>						 -->
                                </div>
                            </div>
                </div>
            </div>
          
        </form>		
    </div>
</div>
