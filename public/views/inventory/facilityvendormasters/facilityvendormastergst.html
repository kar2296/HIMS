<style>
    .user-img {
        width: 80px !important;
        height: 80px !important;
    }
    
    /* #depheight .well {
        min-height: 440px;
    } */
    
    #depheight .well1 {
        min-height: 184px;
    }
    
    /* #depheight .formRoot {
        overflow: auto;
        height: 459px !important;
    } */
    
    .panel-body .well1 {
        min-height: 20px;
        padding: 19px;
        margin-bottom: 0;
        border: 1px solid #ededed;
        border-radius: 4px;
        background: #e9f6fd;
        background: -moz-linear-gradient(top, rgba(233, 246, 253, 1) 0, rgba(211, 238, 251, 1) 100%);
        background: -webkit-linear-gradient(top, rgba(233, 246, 253, 1) 0, rgba(211, 238, 251, 1) 100%);
        background: linear-gradient(to bottom, #fafafa 0, #f7fcfd 100%);
        filter: progid: DXImageTransform.Microsoft.gradient( startColorstr='#e9f6fd', endColorstr='#d3eefb', GradientType=0);
        box-shadow: 4px 2px 13px -7px rgba(0, 0, 0, .75);
    }
</style>

<div class="row">
    <div class="col-sm-12" id="depheight">
        <form id="item_form" name="item_form" class="form-horizontal" role="form" ng-submit="saveItem()">
            <div class="formRoot">
                <div class="panel panel-default">
                    <div class="panel-body form-panel bg-pattern">
                        <div class="col-sm-12 ">
                                <div class="form-group col-sm-6">
                                    <label class="col-sm-12 control-label" for="isgstregistered" translate="inventory.facilityvendormastergst-form.isgstregistered.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="checkbox" name="isgstregistered" class="custom-checkbox" ng-model="item.IsGSTRegistered">
                                    </div>
                                </div>
                                <div class="form-group col-sm-6">
                                    <label class="col-sm-12 control-label" for="gstid" translate="inventory.facilityvendormastergst-form.gstid.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="gstid" ng-model="item.GSTId" placeholder="" ng-disabled="!item.IsGSTRegistered">
                                    </div>
                                </div>
                                <div class="form-group col-sm-6">
                                    <label class="col-sm-12 control-label" for="businessregno" translate="inventory.facilityvendormastergst-form.businessregno.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="businessregno" ng-model="item.BusinessRegNo" placeholder="" ng-disabled="!item.IsGSTRegistered">
                                    </div>
                                </div>
                                <div class="form-group col-sm-6">
                                    <label class="col-sm-12 control-label" for="businessname" translate="inventory.facilityvendormastergst-form.businessname.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="businessname" ng-model="item.BusinessName" placeholder="" ng-disabled="!item.IsGSTRegistered">
                                    </div>
                                </div>
                                <div class="form-group col-sm-6">
                                    <label class="col-sm-12 control-label" for="businessaddress" translate="inventory.facilityvendormastergst-form.businessaddress.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="businessaddress" ng-model="item.BusinessAddress" placeholder="" ng-disabled="!item.IsGSTRegistered">
                                    </div>
                                </div>
                                <div class="form-group col-sm-6">
                                    <label class="col-sm-12 control-label" for="taxcode" translate="inventory.facilityvendormastergst-form.taxcode.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="taxcode" ng-model="item.TaxCode" placeholder="" ng-disabled="!item.IsGSTRegistered">
                                    </div>
                                </div>
                                <div class="form-group col-sm-6">
                                    <label class="col-sm-12 control-label" for="activefrom" translate="inventory.facilityvendormastergst-form.activefrom.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="activefrom" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                            placeholder="{{datePickerOptions.placeholder}}" ng-click="activefromPopup = { opened: true }"
                                            is-open="activefromPopup.opened" ng-model="item.ActiveFrom" ng-disabled="!item.IsGSTRegistered">
                                    </div>
                                </div>
                                <div class="form-group col-sm-6">
                                    <label class="col-sm-12 control-label" for="activeto" translate="inventory.facilityvendormastergst-form.activeto.lbl"></label>
                                    <div class="col-sm-12">
                                        <input type="text" class="form-control" name="activeto" ng-date-object uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                                            placeholder="{{datePickerOptions.placeholder}}" ng-click="activetoPopup = { opened: true }"
                                            is-open="activetoPopup.opened" ng-model="item.ActiveTo" ng-disabled="!item.IsGSTRegistered">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- rightpanel -->
                        <div class="col-sm-6">
                        </div>
                    </div>
                    <div class="fooder-bgs">
                        <div class="pull-left">
                            <!-- <button type="button" class="btn pyr-color10 btn-sm pull-left" ng-click="backToList()"><i class="fa fa-angle-left"></i>&nbsp;&nbsp;<span translate="common.backaction.lbl"></span></button> -->
                        </div>
                            <div class="pull-right">
                                <button type="button"   class="draftbutton" translate="common.saveaction.lbl" ng-click="save()"></button>
                                <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl" ng-click="saveandApprove()"></button>
                                <button id="btnClearForm" type="button" class="btn btn-warning btn-sm" ng-click="clear()" translate="common.clearaction.lbl"></button>
                                <button id="btnCancelForm" type="button" class="cancelbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>
                            </div>
                        </div>
                </div>
            </div>
    </div>
   
    </form>
</div>
</div>
