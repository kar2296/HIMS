<link href="app/css/regbilling.css" rel="stylesheet">

<div class="row">
    <div class="col-sm-9">
        <h4 class="mt0" translate="Incident Reporting"></h4>
    </div>
    <div class="col-sm-3">
        <div class="filters">
            <div class="search">
                <input type="text" id="pid" class="form-control" on-enter="getList()"
                    ng-model="currentfilter.ReportedBy" translate translate-attr-placeholder="code/Name">
                <div class="drhms-search-icon">
                    <i class="fas fa-search" style="left: 9px;" aria-hidden="true"></i>
                </div>
            </div>
            <button type="button" tabindex="-1" class="btn-add" ng-click="addNew()"
                uib-tooltip="{{ 'appmanager.orgs.addnew-tooltip.lbl' | translate}}" tooltip-placement="bottom">
                <i class="fa fa-plus" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</div>
<div class="row">
    <div class="drhms-list-filters">
        <div class="col-sm-3">
            <label class="col-sm-4" for="fromdate" translate="From Date"></label>
            <div class="col-sm-8">
                <div class="datepicker">
                    <!-- <input type="text" class="form-control" name="fromdate" ng-change="getList()" datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                            uib-datepicker-popup="{{datePickerOptions.dateFormat}}" placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                            is-open="fromdatePopup.opened" ng-model="currentfilter.FromDate">
                        <i class="fa fa-calendar" aria-hidden="true"></i> -->
                    <input type="text" class="text-box form-control" ng-date-object
                        datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                        is-open="fromdatePopup.opened" ng-change="getList()" ng-model="currentfilter.FromDate">

                </div>
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-4" for="todate" translate="To Date"></label>
            <div class="col-sm-8">
                <div class="datepicker">
                    <input type="text" class="form-control" name="todate" ng-change="getList()"
                        datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
                        is-open="todatePopup.opened" ng-model="currentfilter.ToDate">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-4 control-label" for="type"
                translate="admissionrequests.filter_admissionrequesttype.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.IncidentReportingTypeId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.IncidentReportingType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
        <div class="col-sm-3">
            <label class="col-sm-4 control-label" for="status" translate="admissionrequests.filter_status.lbl"></label>
            <div class="col-sm-8">
                <ui-select ng-model="currentfilter.incidentstatusid" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.IncidentReportingStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
