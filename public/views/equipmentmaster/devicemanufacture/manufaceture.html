<div class="modal-header custom-modal-header">
    <div class="col-sm-12 ">

        <div class="col-sm-6">
            <h3 class="panel-title" translate="Device Manufacturer"></h3>
        </div>
        <div class="col-sm-6">
            <button type="button" class="btn btn-danger btn-sm pull-right" translate="x" ng-click="cancelCallback()"></button>
        </div>
    </div>
</div>

<div class="row" id="depheight">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot">
                <div class="panel panel-default">
                    <div class="col-sm-12">
                        <div class="form-group col-sm-4">
                            <label class="col-sm-12 control-label" for="devicecode" translate="Device Code"></label>
                            <div class="col-sm-12">
                                <input type="text" class="form-control" name="devicecode" ng-model="item.DeviceManufacturerCode" tabindex="tabindexmap.patienttabindex"
                                    placeholder="" required uppercase>
                            </div>
                        </div>
                        <div class="form-group col-sm-4">
                            <label class="col-sm-12 control-label" for="devicename" translate="Device Name"></label>
                            <div class="col-sm-12">
                                <input type="text" class="form-control" name="devicename" ng-model="item.DeviceManufacturerName" tabindex="tabindexmap.patienttabindex"
                                    placeholder="" required uppercase>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-12">
                        <div class="form-group col-sm-4">
                            <label class="col-sm-12 control-label" translate="Version Name"></label>
                            <div class="col-sm-12">
                                <input type="text" class="form-control" ng-model="item.VersionName" tabindex="tabindexmap.patienttabindex" placeholder=""
                                    uppercase>
                            </div>
                        </div>

                        <div class="form-group col-sm-4">
                            <label class="col-sm-12 control-label" for="IsActive" translate="IsActive"></label>
                            <div class="col-sm-12">
                                <input type="checkbox" class="custom-checkbox" name="isactive" ng-model="item.IsActive">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="col-sm-12 btn">
            <div class="pull-right">
                <button id="btnSaveApprove" type="button" class="draftbutton text-white btn-sm" translate="Save" ng-click="saveandApprove()"></button>
            </div>
        </div>
    </div>
</div>
