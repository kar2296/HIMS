<div class="modal-header custom-modal-header">
    <div class="col-sm-12 ">

        <div class="col-sm-6">
            <h3 class="panel-title" translate="Manage Device Parameters"></h3>
        </div>
        <div class="col-sm-6">
            <button type="button" class="btn btn-danger btn-sm pull-right" translate="x"
                ng-click="cancelCallback()"></button>
        </div>
    </div>
</div>

<div class="row" id="depheight">
    <div class="col-sm-12">
        <form id="item_form" name="item_form" class="form-horizontal" role="form">
            <div class="formRoot">
                <div class="panel panel-default">
                    <div class="col-sm-12">
                        <div class="form-group col-sm-4">
                            <label class="col-sm-12 control-label" for="code" translate="Code"></label>
                            <div class="col-sm-12">
                                <input type="text" class="form-control" name="devicename" ng-model="item.Code"
                                    tabindex="tabindexmap.patienttabindex" placeholder="" required uppercase>
                            </div>
                        </div>
                        <div class="form-group col-sm-4">
                            <label class="col-sm-12 control-label" for="name" translate="Name"></label>
                            <div class="col-sm-12">
                                <input type="text" class="form-control" name="name" ng-model="item.Name"
                                    tabindex="tabindexmap.patienttabindex" placeholder="" required uppercase>
                            </div>
                        </div>

                        <div class="form-group col-sm-4">
                            <label class="col-sm-12 control-label" translate="Description"></label>
                            <div class="col-sm-12">
                                <input type="text" class="form-control" ng-model="item.Description"
                                    tabindex="tabindexmap.patienttabindex" placeholder="" uppercase>
                            </div>
                        </div>
                        <div class="form-group col-sm-4">
                            <label class="col-sm-12 control-label" translate="UOM"></label>
                            <div class="col-sm-12">
                                <input type="text" class="form-control" ng-model="item.UOM"
                                    tabindex="tabindexmap.patienttabindex" placeholder="">
                            </div>
                        </div>
                        <div class="form-group col-sm-4">
                            <label class="col-sm-12 control-label" translate="Mnemonic"></label>
                            <div class="col-sm-12">
                                <input type="text" class="form-control" ng-model="item.Mnemonic"
                                    tabindex="tabindexmap.patienttabindex" placeholder="" uppercase>
                            </div>
                        </div>
                        <div class="form-group col-sm-4">
                            <label class="col-sm-12 control-label" translate="Display Order"></label>
                            <div class="col-sm-12">
                                <input type="text" class="form-control" ng-model="item.DisplayOrder"
                                    tabindex="tabindexmap.patienttabindex" placeholder="">
                            </div>
                        </div>
                        <div class="form-group col-sm-4">
                            <label class="col-sm-12 control-label" for="sex" translate="Type"></label>
                            <div class="col-sm-12">
                                <ui-select ng-model="item.DeviceParameterTypeId" name="sex" tabindex="tabindexmap.patienttabindex"
                                    required>
                                    <ui-select-match>
                                        {{$select.selected.Text | limitTo : 20 : 0}}
                                        <span ng-if="$select.selected.Text.length>20">...</span>
                                    </ui-select-match>
                                    <ui-select-choices
                                        repeat="lookupitem.Id as lookupitem in lookup.DeviceParameterType | filter: { Text: $select.search }">
                                        <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                                        </div>
                                    </ui-select-choices>
                                </ui-select>
                            </div>
                        </div>

                        <div class="form-group col-sm-4">
                            <label class="col-sm-12 control-label" for="sex" translate="Status"></label>
                            <div class="col-sm-12">
                                <input type="checkbox" ng-model="item.IsActive">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div class="fooder-bgs">
    <div class="row">
        <div class="col-sm-12 btn">
            <div class="pull-right">
                <button id="btnSaveApprove" type="button" class="draftbutton text-white btn-sm" translate="Save"
                    ng-click="saveAndApprove()"></button>
            </div>
        </div>
    </div>
</div>
