<style>
    .ban {
        margin-top: 20px;
    }

    .img {
        margin-bottom: 10px;
    }
</style>
<div class="row page-header">
    <h4 class="col-sm-12" translate="virtualhealth.successstory.pagetitle1.lbl"></h4>
</div>
<div class="row">
    <div class="form-group col-sm-4">
        <label class="col-sm-12 control-label" for="name" translate="virtualhealth.successstory.category.lbl"></label>
        <div class="col-sm-12">
            <ui-select ng-model="item.CategoryId" ng-change="getList()" class="filter-combo">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.VirtualCategory | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
    <div class="form-group col-sm-4">
        <label class="col-sm-12 control-label" for="name" translate="IsActive"></label>
        <div class="col-sm-12">
            <input type="checkbox" ng-model="item.IsActive">
        </div>
    </div>
    <div class="form-group col-sm-4">
        <label class="col-sm-12 control-label" for="name"
            translate="virtualhealth.successstory.updateddate.lbl"></label>
        <div class="col-sm-12">
            {{item.CreatedDate}}
        </div>
    </div>
    <div class="form-group col-sm-4">
        <label class="col-sm-12 control-label" for="name" translate="virtualhealth.successstory.updatedby.lbl"></label>
        <div class="col-sm-12">
            {{item.CreatedUser.Title.description}} {{item.CreatedUser.FirstName}} {{item.CreatedUser.LastName}}
        </div>
    </div>
    <div class="form-group col-sm-4">
        <label class="col-sm-12 control-label" for="name" translate="virtualhealth.successstory.status.lbl"></label>
        <div class="col-sm-12">
            {{item.ActiveStatus.description}}
        </div>
    </div>
    <div class="form-group col-sm-4">
        <label class="col-sm-12 control-label" for="name"
            translate="virtualhealth.successstory.description.lbl"></label>
        <div class="col-sm-12">
            <textarea class="text-comment" ng-model="item.SuccessStory"></textarea>
        </div>
    </div>
    <div class="form-group col-sm-4">
        <label class="col-sm-12 control-label" for="name" translate="virtualhealth.successstory.title.lbl"></label>
        <div class="col-sm-12">
            <textarea class="text-comment" ng-model="item.Title"></textarea>
        </div>
    </div>
</div>
<div class="col-sm-12 ban">
    <div class="col-sm-4 img">
        <img class="item-logo-img" ng-show="!!currentcontext.file" ngf-thumbnail="currentcontext.file" />
        <img class="item-logo-img" ng-show="!currentcontext.file && item.Attachment"
            data-ng-src="data:image/png;base64,{{currentcontext.Image}}" />
    </div>
    <!-- <div class="col-sm-4">
        <button type="button" ng-disabled="SaveCompleted" style="    padding: 5px;" class="cnlbutton" tabindex="-1" ng-click="clearimage()"
            uib-tooltip="Clear" tooltip-placement="bottom">
            <img class="drhms-edit-button" src="assets/svg/delete.svg" alt="">
        </button>
    </div> -->

    <div class="form-group col-sm-12">
        <!-- <label class="col-sm-12 control-label" translate="appmanager.dept.logo.lbl"></label> -->
        <input type="file" ngf-select ng-model="currentcontext.file" name="file" ngf-max-size="200MB" />
    </div>
</div>

<div class="fooder-bgs">
    <div class="row">
        <div class="pull-left">
            <button type="button" class="btn btn-sm pyr-color10" ng-click="backToList()">
                <i class="fa fa-angle-left"></i>&nbsp;&nbsp;
                <span translate="common.backaction.lbl"></span>
            </button>
        </div>
        <div class="pull-right">
            <button type="button" class="draftbutton" ng-click="saveandApprove()"
                translate="common.saveaction.lbl"></button>
            <!-- <button type="button" class="draftbutton" translate="common.saveapprove-action.lbl"
                        ng-click="saveandApprove()"></button> -->
        </div>
    </div>
</div>
