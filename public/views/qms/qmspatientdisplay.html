<!DOCTYPE html>
<html lang="en">

<head>
    <title>Patient Services</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- <link src="//maxcdn.bootstrapcdn.com/bootstrap/3.3.6/fonts/glyphicons-halflings-regular.woff2"> -->
    <link rel="stylesheet" href="app/css/patientservices.css">
</head>
<style>
    header .navbar {
        margin-bottom: 0px;
    }

    table {
        border: 1px solid #b5b2b2 !important;
        color: #ffffff;
        width: 100%;
        margin-bottom: 1px !important
    }

    table>thead>tr>th>span {
        color: #ffffff !important;
        font-size: 28px;
    }

    table>thead>tr {
        height: 30px;
        display: run-in;
        color: #ffffff;
        width: 100%;
        text-shadow: 0 2px 2px #000000b3;
        margin: 0 auto;
        font-size: 15px;
        padding: 0;
        background: #1e5799;
        background: -moz-linear-gradient(top, #1e5799 0, #2788d7 44%, #207cca 46%, #7db9e8 100%);
        background: -webkit-linear-gradient(top, #1e5799 0, #2989d8 44%, #207cca 46%, #7db9e8 100%);
        /* background: linear-gradient(to bottom, rgba(30, 87, 153, 1) 0, rgba(41, 137, 216, 1) 44%, rgba(32, 124, 202, 1) 46%, rgba(125, 185, 232, 1) 100%); */
        filter: progid: DXImageTransform.Microsoft.gradient(startColorstr='#1e5799', endColorstr='#7db9e8', GradientType=0);
        background: #FF9800;
    }

    /**table>tbody>tr:nth-child(odd) {
        background-color: #ffd8a2;
    }**/

    table>tbody>tr:nth-child(even) {
        background-color: #ffffff;
    }

    .table>thead>tr>th {
        padding: 5px 8px !important;
        color: #888888;
    }

    table>tbody>tr>td {
        padding-left: 20px;
        color: #888383 !important;
    }

    table>tbody>tr>td {
        font-size: 21px;
        font-weight: 600;
    }

    .table-hover>tbody>tr:hover {
        background-color: #d9f9f6 !important;
    }

    @media (device-width: 100vw) and (device-height: 100vh) {
        body {
            background-color: #000000;
        }

        /* table>tbody>tr {
            background-color: #577f92;
            height: 70px!important
        } */
        table {
            border: 1px solid #ffffff;
            color: #ffffff;
            width: 100%;
            margin-bottom: 1px !important;
            height: 745px
        }

        .modal-full {
            width: 100% !important
        }

        .modal-dialog {
            margin: 0 auto !important
        }

        table>tbody>tr>td {
            font-size: 35px !important;
            vertical-align: middle !important;
        }
    }

    .carousel-inner>.item>a>img,
    .carousel-inner>.item>img {
        width: 70%;
        margin: auto
    }

    .modal.in .modal-dialog {
        border: 9px solid #26C6DA;
    }

    table>thead>tr>th>span {
        font-size: 28px;
    }

    .bg-subhead th {
        width: 17%;
    }

    td {
        text-align: center;
        margin: 0 auto;
    }

    table>tbody>tr>td {
        background-color: #5f3ab7;
        border: 3px solid #fdbe0b !important;
        /* font-size: 35px; */
    }

    th {
        text-align: center !important;
    }

    @media screen and (min-width: 1366px) {
        table>tbody>tr>td {
            /* font-size: 24px !important; */
            font-size: 22px;
            color: #ffffff !important;
        }
    }

    .reason {
        color: #f34242;
        font-size: 17px;
    }

    .mrn {
        color: #cc4cbf;
        font-size: 17px;
    }

    .age {
        color: #7aa087;
        font-size: 18px;
    }

    .dept {
        color: #5f9ea0;
        font-size: 17px;
    }

    @media screen and (min-width: 1360px) {
        .view_disp tr {
            /* height: 90px !important; */
            height: 10.2em !important;
        }
    }

    @media (device-width: 100vw) and (device-height: 100vh) {
        .modal-open .modal {
            overflow: hidden !important;
        }

        .carousel-inner {
            height: 745px !important;
        }

        .modal-dialog .modal-full {
            width: 100% !important;
        }
    }

    table {
        height: 100%;
        width: 100%;
    }

    table tr {
        width: 100%;
        height: 5%;
    }

    .left {
        text-align: left;
    }

    .view_disp tr {
        height: 4.0em !important;
    }

    table>thead>tr>th {
        border: 3px solid #fdbe0b !important;
    }

    .content-wrapper {
        overflow: auto;
    }
</style>
<header>
    <nav class="navbar navbar-default0">
        <div class="header">
            <div class="navbar-header col-sm-4 col-md-3">
                <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar1">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" href="http://www.pkv.com/">
                    <img src="app/img/patientservices/logo.png" alt="logo">
                </a>
                <!-- <h2>Patient Services</h2> -->
            </div>
            <div class="head col-sm-7 col-md-6">
                <h2 class="bold text-center" translate="registration.qms.pagetitle.lbl"></h2>
            </div>
            <div class="col-sm-1 col-md-3">
                <button type="button" class="btn btn-primary btn-md pull-right logout" ng-click="logout()">
                    <i class="fa fa-sign-out" aria-hidden="true"></i>Logout</button>

            </div>
            <!--/.nav-collapse -->
        </div>
        <!--/.container-fluid -->
    </nav>
</header>

<body class="patientservices_bg">
    <div class="col-sm-12 col-md-12 container pd0">
        <div id="myCarousel" class="carousel slide" data-ride="carousel">
            <!-- Wrapper for slides -->
            <div class="carousel-inner" role="listbox">
                <div class="item active" id="bg_color">
                    <table class="table table-hover table-responsive table-bordered">
                        <thead class="bg-subhead">
                            <tr>
                                <th>
                                    <span translate="registration.qms.tokenno.lbl"></span>
                                </th>
                                <th>
                                    <span translate="registration.qms.patient.lbl"></span>
                                </th>
                                <th>
                                    <span translate="registration.qms.ageandgender.lbl"></span>
                                </th>
                                <th>
                                    <span translate="registration.qms.type.lbl"></span>
                                </th>
                            </tr>
                        </thead>
                        <tbody class="view_disp">
                            <tr ng-repeat="item in TokenDisplay | filter:{Status:1,QMSStatusId:1}">
                                <td>
                                    <span>
                                        <b>{{item.TokenNo}}</b>
                                    </span>
                                </td>
                                <td>
                                    <span>
                                        <b>{{item.FirstName}} {{item.LastName}}</b>
                                    </span>
                                </td>
                                <td>
                                    <span>
                                        <b>{{item.Age}} Years / {{item.Gender.Description}}</b>
                                    </span>
                                </td>
                                <td>
                                    <span>
                                        <b>{{item.QMSReason.Description}}</b>
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>


    </div>


</body>

<div class="footer">
    <footer class="container-fluid bg-4 text-center">
        <p>&copy &nbsp
            <a href="http://www.pkv.com/">pkv Technologies</a>
        </p>
    </footer>
</div>

</html>
