<!-- Inline template with sidebar items markup and ng-directives-->
<link href="//db.onlinewebfonts.com/c/1e7e97d0da36ea1b00a66348a43dfb26?family=Proxima+Nova+Th" rel="stylesheet"
    type="text/css" />
<script type="text/ng-template" id="sidebar-renderer.html">
    <span ng-if="item.heading" style="font-weight: bold; letter-spacing: 0.5px; opacity: 0.7;">{{(item.translate | translate) || item.text}}</span>
    <a ng-if="!item.heading" ng-href="{{$state.href(item.sref, item.params)}}" title="{{item.text}}">
        <div class="selected-opt">
            <div ng-if="item.alert" ng-class="item.label || 'label label-success'" class="pull-right">{{item.alert}}</div>
            <em class="{{item.icon || 'fa fa-folder-o fa-lg'}}"></em>
            <span style="margin-left: 14px;">{{(item.translate | translate) || item.text}}</span>
            <i ng-if="item.sref && item.sref !== '#'" 
               class="fa fa-star pull-right fav-star-btn" 
               ng-class="{'text-warning': isFavorite(item), 'text-muted': !isFavorite(item)}" 
               ng-click="toggleFavorite($event, item)" 
               style="cursor: pointer; font-size: 13px; margin-top: 3px; z-index: 10; position: relative;" 
               title="{{isFavorite(item) ? 'Remove from Favorites' : 'Add to Favorites'}}"></i>
        </div>
     </a>
     <ul ng-if="item.submenu" uib-collapse="isCollapse(pIndex)" ng-init="addCollapse(pIndex, item)" class="nav sidebar-subnav">
         <li ng-repeat="item in item.submenu" ng-include="'sidebar-renderer.html'" ng-class="getMenuItemPropClasses(item)" ng-init="pIndex=(pIndex+'-'+$index); inSubmenu = true" ng-click="toggleCollapse(pIndex)"></li>
     </ul>
</script>
<!-- START Sidebar (left)-->
<div class="aside-inner">
    <nav sidebar="" sidebar-anyclick-close="" ng-class="{'show-scrollbar': app.layout.asideScrollbar}" class="sidebar">
        <!-- START sidebar nav-->
        <ul class="nav">
            <!-- Iterates over all sidebar items-->
            <li ng-class="getMenuItemPropClasses(item)" ng-repeat="item in menuItems" ng-init="pIndex = $index"
                ng-include="'sidebar-renderer.html'" ng-click="toggleCollapse(pIndex, true)">
                <span class="caret">x</span>
            </li>

        </ul>

    </nav>
</div>
