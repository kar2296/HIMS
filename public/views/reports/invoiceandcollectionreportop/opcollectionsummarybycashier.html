<div class="row">
    <div id="reportsdetail">
        <table id="tblData">
            <thead>
                <tr>
                    <th class="cus-col tbl-header cust_Particulars" style="font-weight: 700;">
                        <span translate="User Name"></span>
                    </th>
                    <th class="cus-col tbl-header" style="font-weight: 700;">
                        <span translate="Net Cash(Rec-Ref)"></span>
                    </th>
                    <th class="cus-col tbl-header" style="font-weight: 700;">
                        <span translate="Net Card(Rec-Ref)"></span>
                    </th>
                    <th class="cus-col tbl-header" style="font-weight: 700;">
                        <span translate="Net Other(Rec-Ref)"></span>
                    </th>
                    <th class="cus-col tbl-header" style="font-weight: 700;">
                        <span translate="Net Collection((NCash+NCard+NOther)"></span>
                    </th>
                </tr>
            </thead>
            <tr ng-repeat="item in NetUserCollection">
                <td class=""><span class="">{{item.Key}}</span></td>
                <td class="currency-align">{{ item.NetCash }}</td>
                <td class="currency-align">{{ item.NetCard }}</td>
                <td class="currency-align">{{ item.NetOther }}</td>
                <td class="currency-align">{{ item.NetCollection }}</td>
            </tr>
            <tr class="highlite">
                <td class=""><span class="">Total</span></td>
                <td class="currency-align">{{ TotCash }}</td>
                <td class="currency-align">{{TotCard }}</td>
                <td class="currency-align">{{ TotOther }}</td>
                <td class="currency-align">{{ TotalCollection }}</td>
            </tr>
        </table>
    </div>
</div>
<div class="fooder-bgs"></div>
<script>
    function exportTableToExcel(tableID, filename = '') {
        var downloadLink;
        var dataType = 'application/vnd.ms-excel';
        var tableSelect = document.getElementById(tableID);
        var tableHTML = tableSelect.outerHTML.replace(/ /g, '%20');

        // Specify file name
        filename = filename ? filename + '.xls' : 'excel_data.xls';

        // Create download link element
        downloadLink = document.createElement("a");

        document.body.appendChild(downloadLink);

        if (navigator.msSaveOrOpenBlob) {
            var blob = new Blob(['\ufeff', tableHTML], {
                type: dataType
            });
            navigator.msSaveOrOpenBlob(blob, filename);
        } else {
            // Create a link to the file
            downloadLink.href = 'data:' + dataType + ', ' + tableHTML;

            // Setting the file name
            downloadLink.download = filename;

            //triggering the function
            downloadLink.click();
        }
    }
</script>
