<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="row">
    <div class="col-sm-6"></div>
    <div class="col-sm-6">
        <table id="bannerdetails">
            <tr>
                <td><label class="control-label drhms-special-count" for="totalquantity">TotalDueAmt:</label></td>
                <td class="currency-align drhms-special-count">{{(TotalDueAmt|displaycurrency)}}</td>
            </tr>
        </table>
    </div>
</div>
<div class="">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
