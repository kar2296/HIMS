<div class="row page-header">
    <div class="col-sm-6">
        <h4 ng-hide="Context=='surgery'" class="col-sm-6 mt0" translate="Cath Entry Report"></h4>
        <h4 ng-if="Context=='surgery'" class="col-sm-6 mt0" translate="Surgery Entries"></h4>
    </div>
    <div class="col-sm-6" ng-if="Context=='surgery'">
        <span class="drhms-billing-btn drhms-outstandingbill-btn" ng-click="surgerydashboard()"
            uib-tooltip="{{'Surgery Dashboard' | translate}}" tooltip-placement="bottom">
            <i class="fas fa-th-large" aria-hidden="true"></i>
        </span>

    </div>
    <div class="col-sm-6" ng-hide="Context=='surgery'">
        <div class="filters">
            <i class="icofont-filter" uib-tooltip="Filter" tooltip-placement="bottom" ng-click="openFilterTab()"></i>
            <i class="icofont-file-excel" uib-tooltip="Excel" tooltip-placement="bottom" ng-click="excelDownload()"></i>
            <!-- <i class="icofont-file-excel" uib-tooltip="Excel" tooltip-placement="bottom"
                    onclick="exportTableToExcel('tblData', 'members-data')"></i> -->
            <i class="icofont-print" ng-click="print()"></i>
            <i class="icofont-home" ng-click="backtoReport()" uib-tooltip="Report" tooltip-placement="bottom"></i>
        </div>
    </div>
</div>
<div class="row">
    <ippatientbanner ng-if="Context=='surgery'" patientid="currentcontext.pid" encounterid="currentcontext.eid">
    </ippatientbanner>
</div>
<div class="row">
    <table id="bannerdetails">
        <tr>
            <td translate="reports.fromdate.lbl"></td>
            <td>
                <div class="datepicker">
                    <input type="text" class="form-control" name="from" datepicker-options="datePickerOptions"
                        show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                        is-open="fromdatePopup.opened" ng-model="currentfilter.FromDate">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </td>
            <td translate="reports.todate.lbl"></td>
            <td>
                <div class="datepicker">
                    <input type="text" class="form-control" name="from" datepicker-options="datePickerOptions"
                        show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
                        is-open="todatePopup.opened" ng-model="currentfilter.ToDate">
            </td>
            <td translate="reports.surgeon.lbl"></td>
            <td>
                <ui-select ng-model="currentfilter.DoctorId" class="filer-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo: 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Doctor | filter: {Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                    </ui-select-choices>
                </ui-select>
            </td>
            <td translate="reports.filter_procedure.lbl"></td>
            <td>
                <ui-select ng-model="currentfilter.ProcedureId">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Procedure | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                        </div>
                    </ui-select-choices>
                </ui-select>
            </td>
            <td style="text-align: center;">
                <button class="loadbtn" ng-click="getList()">
                    <i class="fas fa-sync loading-icon" aria-hidden="true" uib-tooltip="Search"
                        tooltip-placement="bottom"></i> <span>Load</span>
                </button>
            </td>
        </tr>
    </table>
</div>

<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>


<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
