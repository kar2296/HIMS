<div class="row page-header">
    <div class="col-sm-6">
        <h4 class="mt0" translate="Doctor Referral Fee Reports"></h4>
    </div>
    <div class="col-sm-6">
        <!-- <div class="filters" style="margin-left: 100%;">
                <button type="button"   class="printbutton" translate="common.printaction.lbl"
                    ng-click="print()" ng-show="CanShowPrint"></button>
                <button type="button" tabindex="-1" class="" style="border: 1px;background: white;" ng-click="backtoReport()"
                    uib-tooltip="{{ 'Report'}}" tooltip-placement="bottom">
                    <i class="fa fa-home" aria-hidden="true"></i>&nbsp;&nbsp;
                </button>
            </div> -->
        <div class="filters">
            <i class="icofont-filter" uib-tooltip="Filter" tooltip-placement="bottom" ng-click="openFilterTab()"></i>
            <i class="icofont-file-excel" uib-tooltip="Excel" tooltip-placement="bottom" ng-click="excelDownload()"></i>
            <!-- <i class="icofont-file-excel"  uib-tooltip="Excel" tooltip-placement="bottom" onclick="exportTableToExcel('tblData', 'members-data')"></i> -->
            <i class="icofont-print" ng-click="print()"></i>
            <i class="icofont-home" ng-click="backtoReport()" uib-tooltip="Report" tooltip-placement="bottom"></i>
        </div>
    </div>
</div>
<div class="row">
    <table id="bannerdetails">
        <tr>
            <td>
                <label class="col-sm-4 control-label filter-lbl"
                    translate="doctorinvoice-list.filter_fromdate.lbl"></label>
            </td>
            <td>
                <div class="datepicker">

                    <input type="text" class="form-control" name="fromdate" datepicker-options="datePickerOptions"
                        show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}"
                        ng-click="FrmDateToDatedatePopup = { opened: true }" is-open="FrmDateToDatedatePopup.opened"
                        ng-model="currentfilter.FrmDate">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>

            </td>
            <td>
                <label class="col-sm-4 control-label filter-lbl"
                    translate="doctorinvoice-list.filter_todate.lbl"></label>
            </td>
            <td>
                <div class="datepicker">
                    <input type="text" class="form-control" name="invoicedate" datepicker-options="datePickerOptions"
                        show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="ToDatedatePopup = { opened: true }"
                        is-open="ToDatedatePopup.opened" ng-model="currentfilter.ToDate">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </td>
            <td>
                <label class="col-sm-4 control-label filter-lbl"
                    translate="doctorinvoice-list.filter_doctorname.lbl"></label>
            </td>
            <td>
                <ui-select ng-model="currentfilter.DoctorId" class="filer-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo: 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Doctor | filter: {Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                    </ui-select-choices>
                </ui-select>
            </td>
            <td style="text-align: center;">
                <button class="loadbtn" ng-click="getList()">
                    <i class="fas fa-sync loading-icon" aria-hidden="true" uib-tooltip="Search"
                        tooltip-placement="bottom"></i> <span>Load</span>
                </button>
            </td>
        </tr>
    </table>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="col-sm-5" style="float: right;">
    <table id="bannerdetails">
        <tr>
            <td><label class="control-label text-white" for="totalquantity">TotalTDSAmt:</label></td>
            <td class="currency-align"><span class="countbg text-white">{{(TotalTDSAmount|displaycurrency)}}</span></td>
        </tr>
    </table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" style="margin-top: 0px !important;"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
