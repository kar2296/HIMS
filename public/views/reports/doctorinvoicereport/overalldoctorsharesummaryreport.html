<style>
    table.table.table-bordered.table-condensed.dropdown-menu.align {
        left: -270px !important;
    }
</style>
<div class="row page-header">
    <div class="col-sm-10">
        <h4 class="mt0" translate="Doctor Share Summary Report"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <i class="icofont-filter" uib-tooltip="Filter" tooltip-placement="bottom" ng-click="openFilterTab()"></i>
            <i class="icofont-file-excel" uib-tooltip="Excel" tooltip-placement="bottom" ng-click="excelDownload()"></i>
            <!-- <i class="icofont-file-excel" uib-tooltip="Excel" tooltip-placement="bottom" onclick="exportTableToExcel('tblData', 'Master-data')"></i> -->
            <i class="icofont-print" uib-tooltip="Print" tooltip-placement="bottom" ng-click="print()"></i>
            <i class="icofont-home" ng-click="backtoReport()" tabindex="-1" uib-tooltip="Report"
                tooltip-placement="bottom"></i>
        </div>
    </div>
</div>
<div class="row">
    <table id="bannerdetails">
        <tr>
            <td translate="reports.fromdate.lbl"></td>
            <td>
                <div class="datepicker">
                    <input type="text" class="form-control" name="from" datepicker-options="datePickerOptions"
                        show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                        is-open="fromdatePopup.opened" ng-model="currentfilter.FromDate">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </td>
            <td translate="reports.todate.lbl"></td>
            <td>
                <div class="datepicker">
                    <input type="text" class="form-control" name="from" datepicker-options="datePickerOptions"
                        show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
                        is-open="todatePopup.opened" ng-model="currentfilter.ToDate">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
            </td>

            <td translate="Doctor Name"></td>
            <td>
                <autosearch itemid="currentfilter.ShareDoctorId" iteminfo="item.SelectedItem" rowdata="item"
                    config="vm.usercontrolconfig" class="inputsearchlogo" isrequired="true">
                </autosearch>
            </td>
            <td style="text-align: center;">
                <button class="loadbtn" ng-click="loadDrShareInfo()">
                    <i class="fas fa-sync loading-icon" aria-hidden="true" uib-tooltip="Search"
                        tooltip-placement="bottom"></i> <span>Load</span>
                </button>
            </td>
        </tr>
    </table>
</div>

<div class="row">
    <form id="item_form" name="item_form" class="form-horizontal" role="form">
        <div id="reportsdetail">
            <table id="tblData">
                <thead class="bg-subhead">
                    <tr>
                        <th>
                            <span translate="Doctor Name"></span>
                        </th>
                        <th>
                            <span translate="Ext Amount"></span>
                        </th>
                        <th>
                            <span translate="Int Amount"></span>
                        </th>
                        <th>
                            <span translate="Dr Share"></span>
                        </th>
                        <th>
                            <span translate="TDS"></span>
                        </th>
                        <th>
                            <span translate="Net Dr."></span>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="item in DrShareSummary">

                        <td>
                            {{item.DoctorName}}
                        </td>
                        <td>{{ item.OpdIncome}}</td>
                        <td>{{ item.IpdIncome}}</td>
                        <td>{{ item.DoctorShareAmt}}</td>
                        <td>{{ item.Tds}}</td>
                        <td>{{ item.DrNetAmt}}</td>
                    </tr>

                </tbody>
                <tbody>
                    <tr style="font-weight: bold ;font-weight: bold;
                                background-color: #afacac;">
                        <td class="text-left">
                            <span class=""> Total </span>
                        </td>

                        <td class="text-left">
                            <span> {{TotalOPDAmt}}</span>
                        </td>
                        <td class="text-left">
                            <span> {{TotalIPDAmt}}</span>
                        </td>
                        <td class="text-left">
                            <span> {{TotalDrShareAmount}}</span>
                        </td>
                        <td class="text-left">
                            <span> {{TotalTdsAmount}}</span>
                        </td>
                        <td class="text-left">
                            <span> {{TotalNetAmount}}</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </form>
</div>
<div class="fooder-bgs"></div>
