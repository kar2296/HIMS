<div class="row page-header">
    <div class="col-sm-6">
        <h4 class="mt0" translate="reports.revenuesummary.lbl"></h4>
    </div>
    <div class="col-sm-6">
        <div class="filters">
            <i class="icofont-filter" uib-tooltip="Filter" tooltip-placement="bottom" ng-click="openFilterTab()"></i>
            <i class="icofont-file-excel" uib-tooltip="Excel" tooltip-placement="bottom"
                onclick="exportTableToExcel('tblData', 'members-data')"></i>
            <i class="icofont-print" uib-tooltip="Print" tooltip-placement="bottom" ng-click="print()"></i>
            <i class="icofont-home" ng-click="backtoReport()" tabindex="-1" uib-tooltip="Report"
                tooltip-placement="bottom"></i>
        </div>
    </div>
</div>
<div class="row">
    <table id="bannerdetails">
        <tr>
            <td translate="reports.fromdate.lbl"></td>
            <td>
                <div class="datepicker" id="datepicker">
                    <input type="text" class="form-control" name="from" datepicker-options="datePickerOptions"
                        show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                        is-open="fromdatePopup.opened" ng-model="currentfilter.From">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </td>
            <td translate="reports.todate.lbl"></td>
            <td>
                <div class="datepicker" id="datepicker">
                    <input type="text" class="form-control" name="from" datepicker-options="datePickerOptions"
                        show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
                        is-open="todatePopup.opened" ng-model="currentfilter.To">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </td>
            <td translate="reports.clinics.lbl">
                <i class="fa fa-calendar" aria-hidden="true"></i>
            </td>
            <td>
                <ui-select ng-model="currentcontext.FacilityId" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </td>
            <td translate="reports.bgrp.lbl"></td>
            <td>
                <ui-select ng-model="currentfilter.ServiceCategoryId" on-select="SelectedCategory($select.selected)"
                    class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 15 : 0}}
                        <span ng-if="$select.selected.Text.length>15">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ServiceCategory | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </td>
            <td style="text-align: center;">
                <button class="loadbtn" ng-click="GetFacilityDashboardOptions()">
                    <i class="fas fa-sync loading-icon" aria-hidden="true" uib-tooltip="Search"
                        tooltip-placement="bottom"></i>
                    <span>Load</span>
                </button>
            </td>
        </tr>
    </table>
</div>
<!-- <div>
    <i class="icofont-filter" uib-tooltip="Search" tooltip-placement="bottom"
        ng-click="GetFacilityDashboardOptions()"></i>
</div> -->
<div class="row">
    <div id="reportsdetail">
        <table id="tblData">
            <thead>
                <th class="cus-col tbl-header cust_Particulars" style="font-weight: 700;">
                    <span translate="Revenue"></span>
                </th>
                <th class="cus-col tbl-header" style="font-weight: 700;">
                    <span translate="OP "></span>
                </th>
                <th class="cus-col tbl-header" style="font-weight: 700;">
                    <span translate="IP "></span>
                </th>
                <th class="cus-col tbl-header" style="font-weight: 700;">
                    <span translate="Total"></span>
                </th>
            </thead>
            <tr ng-repeat="item in FacilityInfo.category">
                <td class="">
                    <span class="">{{item.Key}}</span>
                </td>
                <td class="currency-align">{{ item.Value.OP }}</td>
                <td class="currency-align">{{ item.Value.IP }}</td>
                <td class="currency-align">{{ (item.Value.OP + item.Value.IP) | displaycurrency }}</td>
            </tr>
        </table>
    </div>
</div>


<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>

<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
