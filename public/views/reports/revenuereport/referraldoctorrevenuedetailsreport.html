<style>
    table#bannerdetails .autosearch-div table.table.table-bordered.table-condensed.dropdown-menu {
        /* margin-left: -430px !important; */
        position: absolute;
        /* right: 132px !important; */
        left: -234px;
    }
</style>


<div class="row page-header">
    <div class="col-sm-6">
        <h4 class="mt0" translate="Referral Doctor Revenue Details Report"></h4>
    </div>
    <div class="col-sm-6">
        <div class="filters">
            <i class="icofont-filter" uib-tooltip="Filter" tooltip-placement="bottom" ng-click="openFilterTab()"></i>
            <i class="icofont-file-excel" uib-tooltip="Excel" tooltip-placement="bottom" ng-click="excelDownload()"></i>
            <i class="icofont-print" uib-tooltip="Print" tooltip-placement="bottom" ng-click="print()"></i>
            <!-- <i class="icofont-home" ng-click="excelDownload()" tabindex="-1" uib-tooltip="Report"
                    tooltip-placement="bottom"></i> -->
            <i class="icofont-home" ng-click="backtoReport()" uib-tooltip="Report" tooltip-placement="bottom"></i>
        </div>
    </div>
</div>
<div class="row">
    <table id="bannerdetails">
        <tr>
            <td translate="reports.fromdate.lbl"></td>
            <td>
                <div class="datepicker">

                    <input type="text" class="form-control" name="from" datepicker-options="datePickerOptions"
                        show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                        is-open="fromdatePopup.opened" ng-model="currentfilter.FromDate">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </td>
            <td translate="reports.todate.lbl">
            </td>
            <td>
                <div class="datepicker">

                    <input type="text" class="form-control" name="from" datepicker-options="datePickerOptions"
                        show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
                        is-open="todatePopup.opened" ng-model="currentfilter.ToDate">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </td>

            <td translate="reports.doctorname.lbl"></td>
            <td>
                <ui-select ng-model="currentfilter.DoctorId" class="filer-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo: 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Doctor | filter: {Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                    </ui-select-choices>
                </ui-select>
            </td>

            <td style="text-align: center;">
                <button class="loadbtn" ng-click="getList()">
                    <i class="fas fa-sync loading-icon" aria-hidden="true" uib-tooltip="Search"
                        tooltip-placement="bottom"></i> <span>Load</span>
                </button>
            </td>
        </tr>
    </table>
</div>
<!-- <div>
    <i class="icofont-filter" uib-tooltip="Search" tooltip-placement="bottom" ng-click="getList()"></i>
</div> -->
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="col-sm-5" style="float: right;">
    <table id="bannerdetails">
        <tr>
            <td><label class="control-label text-white" for="totalquantity">TotalAmount:</label></td>
            <td class="currency-align"><span class="countbg text-white">{{(TotalAmount|displaycurrency)}}</span></td>
            <td><label class="control-label text-white" for="totalquantity">TotalDisAmount:</label></td>
            <td class="currency-align"><span class="countbg text-white">{{(TotalDisAmount|displaycurrency)}}</span></td>
        </tr>
        <tr>
            <td><label class="control-label text-white" for="totalquantity">TotalNetAmount:</label></td>
            <td class="currency-align"><span class="countbg text-white">{{(TotalNetAmount|displaycurrency)}}</span></td>
            <td><label class="control-label text-white" for="totalquantity">TotalPaidAmount:</label></td>
            <td class="currency-align"><span class="countbg text-white">{{(TotalPaidAmount|displaycurrency)}}</span>
            </td>
        </tr>
    </table>
</div>


<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
