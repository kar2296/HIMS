<style>
    .nameinfo {
        font-size: 13px;
        font-weight: 700;
        color: #337ab7;
    }

        color: black
    }

    .contactinfo {
        font-size: 10px;
        color: #808080
    }

    .block {
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
    }

    #facilitysheight .ui-grid-viewport {
        width: 100%;
        /* height: 460px!important; */
        height: 72vh;
        min-height: 70vh;
    }

        #facilitysheight .ui-grid-viewport {
            height: 76vh;
            min-height: 74vh;
        }

    .table-uigrid {
        margin-left: 10px;
        margin-right: 10px;
        height: 488px !important;
    }

    .linkstyle {
        font-weight: 700;
        text-align: right;
    }

    .statusinfo {
        font-size: 13px;
    }

    .form-group {
        margin-bottom: 7px !important;
    }

    .sr-only {
        height: 22px !important;
    }

    button#btnsubmit {
        margin-right: 212px !important;
    }
</style>

<div class="row">
<table id="bannerdetails">
    <tr>
        <td translate="clinicalmaster.serviceitem-list.category.lbl"></td>
        <td> <ui-select ng-model="currentfilter.CategoryId" ng-change="getList()" class="filter-combo">

                    {{$select.selected.Text | limitTo : 15 : 0}}
                    <span ng-if="$select.selected.Text.length>15">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in lookup.ServiceCategory | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select></td>
        <td translate="reports.testname.lbl"></td>
        <td>
            <autosearch itemid="currentfilter.TestId" config="vm.serviceitemcontrolconfig" itemchange="getList()"
                onenter="onenter(data)">
            </autosearch>
        </td>
    </tr>
</table>

    </div>
</div>
