        <div class="col-sm-6">

                <button type="button"   class="printbutton" translate="common.printaction.lbl"
                  ng-show="CanShowPrint"  ng-click="print()"></button>

            <div class="filters">

</div>
<div class="row">

    <table id="bannerdetails">
        <tr>
            <td translate="reports.fromdate.lbl"></td>
            <td>
                <div class="datepicker">

                    <input type="text" class="form-control" name="from" ng-change="getList()"
                        datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                        is-open="fromdatePopup.opened" ng-model="currentfilter.FromDate">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </td>
            <td translate="reports.todate.lbl">
            </td>
            <td>
                <div class="datepicker">

                    <input type="text" class="form-control" name="from" ng-change="getList()"
                        datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
                        is-open="todatePopup.opened" ng-model="currentfilter.ToDate">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </td>
            <td translate="reports.clinics.lbl">
            </td>
            <td>
                <ui-select ng-model="currentfilter.FacilityId" ng-change="getList()" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Facility | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </td>
            <td translate="reports.doctorname.lbl"></td>
            <td>
                <ui-select ng-model="currentfilter.DoctorId" ng-change="getList()" class="filer-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo: 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Doctor | filter: {Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search">
                    </ui-select-choices>
                </ui-select>
            </td>
        </tr>
    </table>

</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="col-sm-5" style="float: right;margin-bottom: 24px !important;">
    <table id="bannerdetails">
        <tr>
            <td><label class="control-label text-white" for="totalquantity">TotalAmount:</label></td>
            <td><span class="countbg text-white">{{(TotalAmount|displaycurrency)}}</span></td>
            <!-- <td><label class="control-label text-white" for="totalquantity"></label></td>
            <td><span class="countbg text-white"></span></td> -->
        </tr>
    </table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
