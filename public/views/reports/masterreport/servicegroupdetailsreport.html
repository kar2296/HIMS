<style>
    .table>thead>tr>th {
        padding: 5px 8px !important;
        color: #000000 !important;
    }

    .btn-danger {
        width: 33px !important;
    }

    .content-wrapper.ng-scope.ng-fadeInUp {
        margin-bottom: 14px !important;
    }

    .table>tbody>tr>td {
        border: 1px solid #ccc !important;
    }

    .table>tbody {
        box-shadow: 1px 1px 16px -3px rgba(0, 0, 0, 0.75);
    }

    .col-sm-6.save {
        top: -31px;
    }

    th.col-sm-1 {
        background: #65c4ca !important;
    }

    th.col-sm-2 {
        background: #65c4ca !important;
    }

</style>
<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-10">
            <h4 class="col-sm-12 mt0" translate="reports.billingGroup.lbl"></h4>
        </div>
        <div class="col-sm-2">
            <div class="filters">
                <i class="icofont-file-excel" uib-tooltip="Excel" tooltip-placement="bottom"
                    ng-click="excelDownload()"></i>
                <!-- <i class="icofont-file-excel"  uib-tooltip="Excel" tooltip-placement="bottom" onclick="exportTableToExcel('tblData', 'members-data')"></i> -->
                <i class="icofont-print" uib-tooltip="Print" tooltip-placement="bottom" ng-click="print()"></i>
                <i class="icofont-home" ng-click="backtoReport()" tabindex="-1" uib-tooltip="Report"
                    tooltip-placement="bottom"></i>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
