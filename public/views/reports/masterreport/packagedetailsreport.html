<div class="row page-header">
    <div class="col-sm-6">
        <h4 class="mt0" translate="reports.billingpackage.lbl"></h4>
    </div>
    <div class="col-sm-6">
        <div class="filters">
            <i class="icofont-file-excel" uib-tooltip="Excel" tooltip-placement="bottom" ng-click="excelDownload()"></i>
            <!-- <i class="icofont-file-excel"  uib-tooltip="Excel" tooltip-placement="bottom" onclick="exportTableToExcel('tblData', 'members-data')"></i> -->
            <i class="icofont-print" uib-tooltip="Print" tooltip-placement="bottom" ng-click="print()"></i>
            <i class="icofont-home" ng-click="backtoReport()" tabindex="-1" uib-tooltip="Report"
                tooltip-placement="bottom"></i>
        </div>
    </div>
</div>
<div class="row">
    <table id="bannerdetails">
        <tr>
            <td translate="clinicalmaster.serviceitem-list.filter_department.lbl"></td>
            <td>
                <ui-select ng-model="currentfilter.DepartmentId" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 15 : 0}}
                        <span ng-if="$select.selected.Text.length>15">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </td>
            <td translate="clinicalmaster.serviceitem-list.category.lbl"></td>
            <td>
                <ui-select ng-model="currentfilter.CategoryId" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 15 : 0}}
                        <span ng-if="$select.selected.Text.length>15">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ServiceCategory | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </td>
            <td translate="clinicalmaster.serviceitem-list.filter_status.lbl"></td>
            <td>
                <ui-select ng-model="currentfilter.ActiveStatusId" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 15 : 0}}
                        <span ng-if="$select.selected.Text.length>15">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ActiveStatus | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </td>
            <td style="text-align: center;">
                <button class="loadbtn" ng-click="getList()">
                    <i class="fas fa-sync loading-icon" aria-hidden="true" uib-tooltip="Search"
                        tooltip-placement="bottom"></i> <span>Load</span>
                </button>
            </td>
        </tr>
    </table>
</div>
<!-- <div>
    <i class="icofont-filter" uib-tooltip="Search" tooltip-placement="bottom" ng-click="getList()"></i>
</div> -->
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
