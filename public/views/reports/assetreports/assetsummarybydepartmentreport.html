<div class="row page-header">
    <div class="col-sm-6">
        <h4 class="mt0" translate="Asset Summary By Department Report"></h4>
    </div>
    <div class="col-sm-6">
        <div class="filters">
            <i class="icofont-filter" uib-tooltip="Filter" tooltip-placement="bottom" ng-click="openFilterTab()"></i>
            <i class="icofont-file-excel" uib-tooltip="Excel" tooltip-placement="bottom" ng-click="excelDownload()"></i>
            <i class="icofont-print" uib-tooltip="Print" tooltip-placement="bottom" ng-click="print()"></i>
            <i class="icofont-home" ng-click="backtoReport()" tabindex="-1" uib-tooltip="Report"
                tooltip-placement="bottom"></i>
        </div>
    </div>
</div>
<div class="row">
    <table id="bannerdetails">
        <tr>
            <td translate="assetmanagement.assets.filter_assettype.lbl"></td>
            <td>
                <ui-select ng-model="currentfilter.AssetTypeId" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 10 : 0}}
                        <span ng-if="$select.selected.Text.length>10">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.AssetType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </td>
            <td translate="assetmanagement.assets.filter_assetcetegory.lbl"></td>
            <td>
                <ui-select ng-model="currentfilter.AssetCategoryId" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 10 : 0}}
                        <span ng-if="$select.selected.Text.length>10">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.AssetCategory | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </td>
            <td translate="assetmanagement.assets.filter_installeddepartment.lbl">
            </td>
            <td>
                <ui-select ng-model="currentfilter.DepartmentId" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 10 : 0}}
                        <span ng-if="$select.selected.Text.length>10">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.Department | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </td>

            <td style="text-align: center;">
                <button class="loadbtn" ng-click="getList()">
                    <i class="fas fa-sync loading-icon" aria-hidden="true" uib-tooltip="Search"
                        tooltip-placement="bottom"></i> <span>Load</span>
                </button>
            </td>
        </tr>
    </table>
</div>
<div class="row">
    <div id="reportsdetail">
        <table id="tblData">
            <thead>
                <th class="cus-col tbl-header cust_Particulars" style="font-weight: bold;">
                    <span translate="Department"></span>
                </th>
                <th class="cus-col tbl-header" style="font-weight: bold;">
                    <span translate="Asset Name"></span>
                </th>
                <th class="cus-col tbl-header" style="font-weight: bold;">
                    <span translate="Count"></span>
                </th>
            </thead>
            <tr ng-repeat="item in AssetsummarybyDep">
                <td class=""><span class="">{{item.Department}}</span></td>
                <td id="total_clr">{{ item.AssetName }}</td>
                <td id="total_clr">{{ item.Count }}</td>
            </tr>
            <tr class="highlite">
                <td class=""><span class="">Total</span></td>
                <td id="total_clr"></td>
                <td id="total_clr">{{ TotCount }}</td>
            </tr>
        </table>
    </div>
</div>
<div class="fooder-bgs"></div>
