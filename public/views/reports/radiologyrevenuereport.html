<style>
    .nameinfo {
        font-size: 13px;
        font-weight: 700;
        color: #337ab7;
    }

    .nameinfo.mrninfo {
        color: black
    }

    .contactinfo {
        font-size: 10px;
        color: #808080
    }

    .block {
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
    }

    #facilitysheight .ui-grid-viewport {
        width: 100%;
        /* height: 460px!important; */
        height: 72vh;
        min-height: 70vh;
    }

    @media (device-width:100vw) and (device-height:100vh) {
        #facilitysheight .ui-grid-viewport {
            height: 76vh;
            min-height: 74vh;
        }
    }

    .table-uigrid {
        margin-left: 10px;
        margin-right: 10px;
        height: 488px !important;
    }

    .linkstyle {
        font-weight: 700;
        text-align: right;
    }

    .statusinfo {
        font-size: 13px;
    }

    .form-group {
        margin-bottom: 7px !important;
    }

    .sr-only {
        height: 22px !important;
    }
</style>
<div class="row page-header">
    <div class="col-sm-12">
        <div class="col-sm-10">
            <h4 class="col-sm-6 mt0" translate="Radiology Revenue Report"></h4>
        </div>
        <div class="col-sm-2">
            <div class="filters">

                <i class="icofont-filter" uib-tooltip="Filter" tooltip-placement="bottom"
                    ng-click="openFilterTab()"></i>
                <i class="icofont-file-excel" uib-tooltip="Excel" tooltip-placement="bottom"
                    ng-click="excelDownload()"></i>
                <!-- <i class="icofont-file-excel"  uib-tooltip="Excel" tooltip-placement="bottom" onclick="exportTableToExcel('tblData', 'members-data')"></i> -->
                <i class="icofont-print" uib-tooltip="Print" tooltip-placement="bottom" ng-show="CanShowPrint"
                    ng-click="print()"></i>
                <i class="icofont-home" ng-click="backtoReport()" uib-tooltip="Report" tooltip-placement="bottom"></i>
            </div>
        </div>
    </div>
</div>

                </div>
            </td>

            <td>

        </tr>
    </table>
</div>

<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>

<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
