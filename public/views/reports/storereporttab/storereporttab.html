<div class="row page-header">
    <h4 class="col-sm-6 mt0" translate="reports.pagetitle.lbl"></h4>
    <div class="col-sm-6">
        <span class="drhms-billing-btn drhms-home-btn"><i class="fas fa-home" ng-click="backtoReport()"
                uib-tooltip="Dashboard" tooltip-placement="bottom"></i></span>
        <!-- <i class="fa fa-home" align="right" style="float: right;" ng-click="backtoReport()" uib-tooltip="Dashboard"
            tooltip-placement="bottom"></i> -->
    </div>
</div>
<div class="row tablebox" id="tablebox">
    <div class="col-sm-12">
        <uib-tabset active="active" id="assettabs">
            <uib-tab index="$index" ng-repeat="tab in tabs" heading="{{tab.title}}" ng-click="switchTab(tab)"
                disable="tab.canDisable">
            </uib-tab>
        </uib-tabset>
        <div ui-view class="tabview"></div>
    </div>
</div>
