<style>
    table#bannerdetails .autosearch-div table.table.table-bordered.table-condensed.dropdown-menu {
        margin-left: -80% !important;
    }
</style>
<div class="row page-header">
    <div class="col-sm-6">
        <h4 class="mt0" translate="reports.pharmschedule.lbl"></h4>
    </div>
    <div class="col-sm-6">
        <div class="filters">
            <i class="icofont-filter" uib-tooltip="Filter" tooltip-placement="bottom" ng-click="openFilterTab()"></i>
            <i class="icofont-file-excel" uib-tooltip="Excel" tooltip-placement="bottom" ng-click="excelDownload()"></i>
            <!-- <i class="icofont-file-excel"  uib-tooltip="Excel" tooltip-placement="bottom" onclick="exportTableToExcel('tblData', 'members-data')"></i> -->
            <i class="icofont-print" uib-tooltip="Print" tooltip-placement="bottom" ng-click="print()"></i>
            <i class="icofont-home" ng-click="backtoReport()" tabindex="-1" uib-tooltip="Report"
                tooltip-placement="bottom"></i>
        </div>
    </div>
</div>
<div class="row">
    <table id="bannerdetails">
        <tr>
            <td translate="reports.fromdate.lbl"></td>
            <td>
                <div class="datepicker"> <input type="text" class="form-control" name="from"
                        datepicker-options="datePickerOptions" show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                        is-open="fromdatePopup.opened" ng-model="currentfilter.FromDate">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </td>
            <td translate="reports.todate.lbl"></td>
            <td>
                <div class="datepicker">
                    <input type="text" class="form-control" name="from" datepicker-options="datePickerOptions"
                        show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
                        is-open="todatePopup.opened" ng-model="currentfilter.ToDate">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </td>
            <td translate="reports.scheduletype.lbl"></td>
            <td>
                <multiselectchk list="ScheduleTypelookup" selected="currentfilter.ScheduleTypeId"
                    change="selectedScheduletype($select.selected)">
                </multiselectchk>
                <!-- <ui-select ng-model="currentfilter.ScheduleTypeId" theme="bootstrap">
                <ui-select-match>
                    {{$select.selected.Text | limitTo : 20 : 0}}
                    <span ng-if="$select.selected.Text.length>20">...</span>
                </ui-select-match>
                <ui-select-choices
                    repeat="lookupitem.Id as lookupitem in ScheduleTypelookup | filter: { Text: $select.search }">
                    <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                </ui-select-choices>
            </ui-select> -->
            </td>
            <td translate="inventory.purchaseorders.store.lbl"></td>
            <td>
                <ui-select ng-model="currentfilter.StoreMasterId" name="fromstore" required>
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 4 : 0}}
                        <span ng-if="$select.selected.Text.length>4">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.UserStores | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </td>
            <td translate="reports.itemname.lbl"></td>
            <td>
                <div class="filters">
                    <autosearch itemid="currentfilter.ServiceId" iteminfo="" rowdata="" config="vm.itemcontrolconfig"
                        placeholder="'Item Code/Name'" onenter="onenter()"></autosearch>
                </div>
            </td>
            <td style="text-align: center;">
                <button class="loadbtn" ng-click="getList()">
                    <i class="fas fa-sync loading-icon" aria-hidden="true" uib-tooltip="Search"
                        tooltip-placement="bottom"></i> <span>Load</span>
                </button>
            </td>
        </tr>
    </table>
</div>
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
