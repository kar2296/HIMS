<div class="row page-header">
    <div class="col-sm-10">
        <h4 class="mt0" translate="reports.admissioninsurancesummary.lbl"></h4>
    </div>
    <div class="col-sm-2">
        <div class="filters">
            <i class="icofont-file-excel" uib-tooltip="Excel" tooltip-placement="bottom"
                onclick="exportTableToExcel('tblData', 'members-data')"></i>
            <i class="icofont-print" uib-tooltip="Print" tooltip-placement="bottom" ng-click="print()"></i>
            <i class="icofont-home" ng-click="backtoReport()" tabindex="-1" uib-tooltip="Report"
                tooltip-placement="bottom"></i>
        </div>
    </div>
</div>
<div class="row">
    <table id="bannerdetails">
        <tr>
            <td translate="reports.fromdate.lbl"></td>
            <td>
                <div class="datepicker">
                    <input type="text" class="form-control" name="from" datepicker-options="datePickerOptions"
                        show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="fromdatePopup = { opened: true }"
                        is-open="fromdatePopup.opened" ng-model="currentfilter.From">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </td>
            <td translate="reports.todate.lbl"></td>
            <td>
                <div class="datepicker">
                    <input type="text" class="form-control" name="from" datepicker-options="datePickerOptions"
                        show-button-bar="{{datePickerOptions.showButtonBar}}"
                        uib-datepicker-popup="{{datePickerOptions.dateFormat}}"
                        placeholder="{{datePickerOptions.placeholder}}" ng-click="todatePopup = { opened: true }"
                        is-open="todatePopup.opened" ng-model="currentfilter.To">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
            </td>
            <td style="text-align: center;">
                <button class="loadbtn" ng-click="GetListOptions()">
                    <i class="fas fa-sync loading-icon" aria-hidden="true" uib-tooltip="Search"
                        tooltip-placement="bottom"></i> <span>Load</span>
                </button>
            </td>
        </tr>
    </table>
</div>

    <i class="icofont-filter" uib-tooltip="Search" tooltip-placement="bottom" ng-click="GetListOptions()"></i>

<div class="row">
    <div id="reportsdetail">
        <table id="tblData">
            <thead>
                <tr>
                    <th class="cus-col tbl-header cust_Particulars" style="font-weight: 700;">
                        <span translate="Payer Name"></span>
                    </th>
                    <th class="cus-col tbl-header" style="font-weight: 700;">
                        <span translate="Payer Type"></span>
                    </th>
                    <th class="cus-col tbl-header" style="font-weight: 700;">
                        <span translate="Count"></span>
                    </th>
                </tr>
            </thead>
            <tr ng-repeat="item in NetGurantorSummary">
                <td class=""><span class="">{{item.Key}}</span></td>
                <td class="currency-align">{{ item.GuarantorType }}</td>
                <td class="currency-align">{{ item.GuarantorCount}}</td>
            </tr>
            <tr>
                <td class=""><span class=""></span></td>
                <td class="td-highlight" style="width: 42.8%;"> <span>Total</span></td>
                <td class="td-highlight currency-align">{{TotGuarantorCount}}</td>
            </tr>
        </table>
    </div>
</div>
<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>

<script>
    function exportTableToExcel(tableID, filename = '') {
        var downloadLink;
        var dataType = 'application/vnd.ms-excel';
        var tableSelect = document.getElementById(tableID);
        var tableHTML = tableSelect.outerHTML.replace(/ /g, '%20');

        // Specify file name
        filename = filename ? filename + '.xls' : 'excel_data.xls';

        // Create download link element
        downloadLink = document.createElement("a");

        document.body.appendChild(downloadLink);

        if (navigator.msSaveOrOpenBlob) {
            var blob = new Blob(['\ufeff', tableHTML], {
                type: dataType
            });
            navigator.msSaveOrOpenBlob(blob, filename);
        } else {
            // Create a link to the file
            downloadLink.href = 'data:' + dataType + ', ' + tableHTML;

            // Setting the file name
            downloadLink.download = filename;

            //triggering the function
            downloadLink.click();
        }
    }
</script>
