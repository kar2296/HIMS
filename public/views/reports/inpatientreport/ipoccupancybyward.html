            <td>{{ward.OccupiedBeds}}</td>
            <td>{{ward.AvailableBeds}}</td>
            <td>{{ward.OtherBeds}}</td>
        </tr> -->

                    </td>

                    </td>
                    <td class="cus-col tbl-header cust_total0 currency-align" style="background: #f6abd3 !important;">
                        <strong>{{wardtotal.OtherBeds}}</strong>
                    </td>

                    </td>
                    <!-- <td class="cus-col tbl-header cust_total0 "style="background: #f6abd3 !important;"><strong>{{wardtotal.OtherBeds}}</strong></td> -->

<div class="fooder-bgs">
    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>

<script>
    function exportTableToExcel(tableID, filename = '') {
        var downloadLink;
        var dataType = 'application/vnd.ms-excel';
        var tableSelect = document.getElementById(tableID);
        var tableHTML = tableSelect.outerHTML.replace(/ /g, '%20');

        // Specify file name
        filename = filename ? filename + '.xls' : 'excel_data.xls';

        // Create download link element
        downloadLink = document.createElement("a");

        document.body.appendChild(downloadLink);

        if (navigator.msSaveOrOpenBlob) {
            var blob = new Blob(['\ufeff', tableHTML], {
                type: dataType
            });
            navigator.msSaveOrOpenBlob(blob, filename);
        } else {
            // Create a link to the file
            downloadLink.href = 'data:' + dataType + ', ' + tableHTML;

            // Setting the file name
            downloadLink.download = filename;

            //triggering the function
            downloadLink.click();
        }
    }
</script>
