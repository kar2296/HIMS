<style>
    table#bannerdetails .autosearch-div table.table.table-bordered.table-condensed.dropdown-menu {
        margin-left: -405px !important;
    }
</style>
<div class="row page-header">
    <div class="col-sm-6">
        <h4 class="mt0" translate="reports.stockstatus.lbl"></h4>
    </div>
    <div class="col-sm-6">
        <div class="filters">
            <i class="icofont-filter" uib-tooltip="Filter" tooltip-placement="bottom" ng-click="openFilterTab()"></i>
            <i class="icofont-file-excel" uib-tooltip="Excel" tooltip-placement="bottom" ng-click="excelDownload()"></i>
            <!-- <i class="icofont-file-excel"  uib-tooltip="Excel" tooltip-placement="bottom" onclick="exportTableToExcel('tblData', 'members-data')"></i> -->
            <i class="icofont-print" uib-tooltip="Print" tooltip-placement="bottom" ng-click="print()"></i>
            <i class="icofont-home" ng-click="backtoReport()" tabindex="-1" uib-tooltip="Report"
                tooltip-placement="bottom"></i>
        </div>
    </div>
</div>
<div class="row">
    <table id="bannerdetails">
        <tr>

            <td translate="inventory.purchaseorders.store.lbl"></td>
            <td>
                <ui-select ng-model="currentfilter.StoreMasterId" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 8 : 0}}
                        <span ng-if="$select.selected.Text.length>8">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.UserStores | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </td>
            <td translate="reports.product.lbl"></td>
            <td>
                <ui-select ng-model="currentfilter.ProductTypeId" class="filter-combo">
                    <ui-select-match>
                        {{$select.selected.Text | limitTo : 20 : 0}}
                        <span ng-if="$select.selected.Text.length>20">...</span>
                    </ui-select-match>
                    <ui-select-choices
                        repeat="lookupitem.Id as lookupitem in lookup.ProductType | filter: { Text: $select.search }">
                        <div ng-bind-html="lookupitem.Text | highlight: $select.search"></div>
                    </ui-select-choices>
                </ui-select>
            </td>
            <td translate="reports.itemname.lbl"></td>
            <td>
                <autosearch itemid="currentfilter.ItemMasterId" iteminfo="" rowdata=""
                    config="vm.movementitemcontrolconfig" placeholder="'Item Code/Name/Generic'" onenter="onenter()">
                </autosearch>
            </td>
            <td style="text-align: center;">
                <button class="loadbtn" ng-click="getList()">
                    <i class="fas fa-sync loading-icon" aria-hidden="true" uib-tooltip="Search"
                        tooltip-placement="bottom"></i> <span>Load</span>
                </button>
            </td>
        </tr>
    </table>
</div>
<!-- <div>
    <i class="icofont-filter" uib-tooltip="Search" tooltip-placement="bottom" ng-click="getList()"></i>
</div> -->
<div class="row">
    <custom-table config="vm.gridConfig"></custom-table>
</div>
<div class="col-sm-5" style="float: right;">
    <table id="bannerdetails">
        <tr>
            <td><label class="control-label text-white" for="totalquantity">TotalFooterQty:</label></td>
            <td><span class="countbg text-white">{{(TotalFooterQty)}}</span></td>
            <td><label class="control-label text-white" for="totalquantity">TotalFooterUcp:</label></td>
            <td class="currency-align"><span class="countbg text-white">{{(TotalNetUcp|displaycurrency)}}</span></td>
        </tr>
        <tr>
            <td><label class="control-label text-white" for="totalquantity">TotalFooterMrp:</label> </td>
            <td class="currency-align"><span class="countbg text-white">{{(TotalNetMrp|displaycurrency)}}</span></td>
        </tr>
    </table>
</div>

<div class="fooder-bgs">

    <div class="row">
        <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems"
            items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
            ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
    </div>
</div>
