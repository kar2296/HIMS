<link rel="stylesheet" href="css/login_access.css" data-ng-if="!app.layout.isRTL">


<style>
    body {
        background-color: #fafafa !important;
    }

    .card-id {
        background: #fff;
        border-radius: 0px;
        padding: 50px 18px;
        position: absolute;
        text-align: center;
        width: 340px;
        left: 70%;
        top: 50%;
        transform: translate(-50%, -50%);
        box-shadow: rgba(0, 0, 0, 10%) 0px 5px 15px;
    }

    .login-form-1 h3 {
        text-align: center;
        color: #333;
        width: 26%;
    }

    .login-form-2 {
        width: 74%;
    }

    /* .login-form-2 {
        padding: 5%;
    } */

    .login-form-2 h3 {
        text-align: center;
        color: #fff;
    }

    /* .login-container form {
        padding: 16% 8%;
    } */

    img.bg-image {
        width: 100%;
    }



    .login-form-1 {
        padding: 0;
    }

    h1 {
        font-size: 18px;
    }

    .card-id img.logo {
        /* margin: 0 -10px; */
        width: 62%;
        /* margin-bottom: 24px; */
    }

    .input-group img {
        width: 16px;
    }

    .login-form .input-group {
        margin: 10px;
    }

    .login-form {
        /* background: #fff; */
        /* display: table; */
        padding: 8px 0px;
    }

    .form-group {
        float: left;
        width: 100%;
        margin: 0 0 15px;
        position: relative;
    }

    .login-form input {
        padding: 5px;
        text-align: center;
        border-radius: 74px;
        border: 1px solid #ccc;
        background: #eee;
        box-sizing: border-box;
        font-size: 12px;
    }

    .login-form .form-group .input-icon {
        display: -webkit-box;
        display: -webkit-flex;
        display: -moz-box;
        display: -ms-flexbox;
        display: flex;
        align-items: center;
        position: absolute;
        bottom: 0;
        height: 100%;
        padding-left: 15px;
    }

    .login-btn {
        background: #50e675;
        color: #fff;
        border: 1px solid #9fe0af;
        border-radius: 44px;
        width: 100px;
        height: 33px;
        cursor: pointer;
        margin: 10px auto;
        font-size: 14px;
    }

    .input-icon img {
        width: 16px;
    }

    .card-id p {
        font-size: 13px;
        margin-bottom: 0;
        color: #0d3b6d;
    }

    .text-field img {
        width: 16px;
        margin-right: 4px;
    }

    select.selectpicker {
        border: 0;
    }

    .text-field span {
        color: #27c24c;
        /* font-weight: 600; */
        font-size: 14px;
        /* margin-right: 10px; */
    }

    .text-field span a {
        color: #27c24c;
    }

    .text-field span.lan {
        color: #333;
        /* font-weight: 700; */
    }

    select:focus-visible {
        outline: unset;
    }

    .provider {
        color: #999;
    }

    /* .text-field {
        display: flex;
    align-items: flex-end;
    } */

    h1 {
        font-size: 30px !important;
        color: #0d3b6d;
        font-weight: bold !important;
    }

    .bottom {
        position: absolute;
        bottom: 0px;
        margin: 12px;
        color: white;
        font-size: 12px;
        line-height: 2;
        font-weight: 400;
    }

    p.provider {
        position: absolute;
        font-size: 13px;
        left: 70%;
        top: 96%;
        transform: translate(-50%, -50%);
    }

    .login-container {
        display: flex;
    }

    .client-logo {
        display: flex;
        justify-content: space-between;
        padding: 10px;
    }

    .client-logo img {
        height: 40px;
    }

    @media only screen and (max-width: 640px) {
        .login-form-1 {
            display: none;
        }

        .login-form-2 {
            width: 100%;
        }

        .card-id img.logo {
            width: 50%;
        }

        .login-form input {
            width: 100%;
        }

        p.provider {
            position: absolute;
            font-size: 13px;
            left: 63%;
            width: 100%;
            top: 96%;
            transform: translate(-50%, -50%);
        }

        .card-id {
            left: 50%;
            top: 46%;
            transform: translate(-50%, -50%);
        }
    }

    @media only screen and (max-width: 768px) {
        .login-form-1 {
            display: none;
        }

        .login-form-2 {
            width: 100%;
        }

        .card-id img.logo {
            width: 50%;
        }

        .login-form input {
            width: 100%;
        }

        p.provider {
            position: absolute;
            font-size: 13px;
            left: 63%;
            width: 100%;
            top: 96%;
            transform: translate(-50%, -50%);
        }

        .card-id {
            left: 50%;
            top: 46%;
            transform: translate(-50%, -50%);
        }
    }

    @media only screen and (max-width: 1024px) {
        .login-form-1 {
            display: none;
        }

        .login-form-2 {
            width: 100%;
        }

        .card-id img.logo {
            width: 50%;
        }

        .login-form input {
            width: 100%;
        }

        p.provider {
            position: absolute;
            font-size: 13px;
            left: 63%;
            width: 100%;
            top: 96%;
            transform: translate(-50%, -50%);
        }

        .card-id {
            left: 50%;
            top: 46%;
            transform: translate(-50%, -50%);
        }
    }
</style>
<div class="login-container">
    <div class="login-form-1">
        <div class="bottom">
            <p>For Support:</p>
            <i class="fas fa-envelope"></i>&nbsp; support@genericsofthms.com
            <br>
            <i class="fas fa-phone"></i> &nbsp; +91 994 059 65 61
        </div>
        <img class="bg-image" src="assets/images/back-bg.png" alt="">
    </div>
    <div class="login-form-2">
        <div class="client-logo">
            <img src="img/logo-horizontal.png" alt="">
            <img src="img/bewell-newLOGO.png" alt="">
        </div>
        <div class="card-id">
            <div ng-controller="LoginFormController as login">
                <form role="form" ng-submit="login.login()" name="login.loginForm" novalidate="">
                    <!-- <img class="logo" src="img/drhmslogo.png" alt=""> -->
                    <h1>WELCOME!</h1>
                    <P>Please enter your details to log in to DrHMS</P>
                    <div class="login-form">
                        <div class="form-group">
                            <input type="text" placeholder="Username" name="account_user" autocomplete="off"
                                ng-model="login.account.username" autofocus>
                            <span class="input-icon"><img src="img/user-icon.png" alt=""></span>
                        </div>
                        <div class="form-group">
                            <input type="password" placeholder="Password" name="account_password"
                                ng-model="login.account.password">
                            <span class="input-icon"><img src="img/password-icon.png" alt=""></span>
                        </div>
                    </div>
                    <div class="text-field">
                        <span> <img src="img/language-icon.png" alt=""> <span class="lan">Language</span>
                            &nbsp;&nbsp;<span><select class="selectpicker" data-width="fit">
                                    <option>English</option>
                                    <option>Nepali</option>
                                </select></span></span> <span><a ng-click="login.otpverify(false)"> Forgot
                                Password</a> </span>
                    </div>

                    <button class="login-btn" type="submit" value="SignIn">LOGIN</button>
                </form>
            </div>
        </div>
        <p class="provider">© Copyright DrHMS | 2023 &nbsp;&nbsp;&nbsp; Powered by pkv</p>
    </div>
</div>
