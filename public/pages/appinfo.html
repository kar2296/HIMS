<h4 class="page-header mt0" ng-if="!currentcontext.ismodal">App Info</h4>

<div class="modal-header custom-modal-header" ng-if="currentcontext.ismodal">
    <h4 class="modal-title custom-modal-title">App Info</h4>
</div>
    
<div class="container-fluid">    
    <div ui-grid="vm.gridConfig" class="table-uigrid" set-grid-height reduce-height='-180px'></div>
    <ul uib-pagination total-items="vm.gridConfig.pagerObj.totalItems" items-per-page="vm.gridConfig.pagerObj.pageSize" start-index="vm.gridConfig.pagerObj.startIndex"
                ng-model="vm.gridConfig.pagerObj.currentPage" ng-change="getList()"></ul>
</div>

<div class="panel-footer formactionbar" ng-if="currentcontext.ismodal">
    <div class="pull-right">
        <button id="btnCancelForm" type="button" class="draftbutton" ng-click="backToList()" translate="common.cancelaction.lbl"></button>						
    </div>
</div>
