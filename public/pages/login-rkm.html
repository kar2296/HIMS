<link rel="stylesheet" href="css/login_access.css" data-ng-if="!app.layout.isRTL">
<style>
    img.footer-icons {
        width: 25px;
        height: 25px;
        position: relative;
        right: 0px;
        bottom: 2px;
    }
    .footer-content {
    height: 68px;
    position: fixed;
    bottom: 0;
    background: #128c89;
    width: 100%;
}
.img-logo img {
    width: 36%;
    top: 16px;
    position: relative;
    left: 11px;
}
input.draftbutton {
    width: 82%;
    background: #128C89 !important;
    border: 0px;
    height: 36px;
    box-shadow: 0px 0px 9px 0px #d4d4d4;
}
.signup h2, h3, .h3 {
    color: #2E4385;
}
</style>
<section class="login-content" ng-controller="LoginFormController as login">   
    <div class="show-content" ng-controller="LoginFormController as login">
        <header>
            <div class="row">
                <div class="col-sm-4 col-xs-4 col-lg-4 col-md-4">
                    <div class="img-logo" id="open">
                        <img src="img/logo/rkm.png">
                    </div>
                </div>
                <div class="col-sm-6 col-xs-6 col-lg-6 col-md-6">
                    <h3>Hospital Information Management System</h3>
                    </div>
                <div class="col-sm-2 col-xs-2 col-lg-2 col-md-2 webview">
                    <div class="img-logo" id="open" >
                       <!-- <img src="img/idea.jpg" style="width: 100%;margin-top: -17px;">-->
                    </div>
                </div>
            </div>
        </header>
        <div class="row con1" ng-controller="LoginFormController as login">
            <div class="col-sm-12 col-xs-12 col-lg-12 col-md-12 banner">
                <img src="img/icon/banner@2x.png">
                <div class="col-sm-8 col-xs-8 col-lg-8 col-md-8"></div>
                <div class="col-sm-4 col-xs-12 col-lg-4 col-md-4">
                    <div class="col-sm-12 col-xs-12 col-lg-12 col-md-12">
                        <div class="signup" align="center">
                            <h2>WELCOME !</h2>
                            <div class="login card">
                                <h3>LOG IN</h3>
                                <div class="row">
                                    <form role="form" ng-submit="login.login()" name="login.loginForm" novalidate="">
                                        <div class="col-sm-12">
                                            <div class="col-sm-12">
                                                <img class="ip-icons" src="img/icon/user.png">
                                                <input type="text" placeholder="Username" name="account_user"
                                                    placeholder="Login" autocomplete="off"
                                                    ng-model="login.account.username" required="" class="login-ip"
                                                    autofocus />
                                            </div>
                                            <br>
                                            <div class="col-sm-12">
                                                <img class="ip-icons" src="img/icon/pass.png">
                                                <input type="password" id="showpassword" placeholder="Password"
                                                    name="account_password" placeholder="Password"
                                                    ng-model="login.account.password" required="" class="login-ip" />
                                                <i class="far fa-eye" onclick="mypassword()"></i>
                                            </div>
                                        </div>
                                        <div class="padding-top-8 font-12">
                                            <div class="col-sm-12" style="padding: 0;">
                                                <div class="col-sm-12" style="padding: 0;">
                                                    <label class="col-xs-10 col-sm-10 radio-container m-r-45">Remember
                                                        me (30 days)
                                                        <input type="checkbox" checked="checked" name="gender">
                                                        <span class="checkmark"></span>
                                                    </label>

                                                    <div class="col-xs-2 col-sm-2 forget-pasword">
                                                        <a ng-click="login.otpverify(false)">Forgot?</a>
                                                    </div>
                                                </div>
                                            </div>

                                            <div style="clear:both"></div>
                                        </div>
                                        <div class="form-group">
                                            <input type="submit" class="draftbutton" value="SignIn">
                                        </div>
                                    </form>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
                <div class="footer-content">
                    <div class="col-sm-12 col-xs-9">
                        <div class="col-sm-4 col-xs-12 col-lg-4 col-md-4">
                            <img class="footer-icons" src="img/icon/globe.png">&nbsp;&nbsp;<span>Web:
                                https://genericsofthms.com/</span>
                        </div>
                        <div class="col-sm-4 col-xs-12 col-lg-4 col-md-4 no-pad">
                            <img class="footer-icons" src="img/svg/mail.svg">&nbsp;&nbsp;<span>Email:
                                support@genericsofthms.com</span>
                        </div>
                        <div class="col-sm-4 col-xs-12 col-lg-4 col-md-4">
                            <img class="footer-icons" src="img/svg/telephone.svg">&nbsp;&nbsp;<span>Phone: +91
                                9940596561</span>
                        </div>
                    </div>
                    <div class="col-xs-3 col-sm-12 copy" align="center">&copy; DrHms 2021</div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    function mypassword() {
        var x = document.getElementById("showpassword");
        if (x.type === "password") {
            x.type = "text";
        } else {
            x.type = "password";
        }
    }
</script>
<script>
    /* When the user clicks on the button, 
        toggle between hiding and showing the dropdown content */
    function myFunction() {
        document.getElementById("myDropdown").classList.toggle("show");
    }

    // Close the dropdown if the user clicks outside of it
    window.onclick = function (event) {
        if (!event.target.matches('.dropbtn')) {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            var i;
            for (i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];
                if (openDropdown.classList.contains('show')) {
                    openDropdown.classList.remove('show');
                }
            }
        }
    }
</script>
<script>
    /* When the user clicks on the button,
          toggle between hiding and showing the dropdown content */
    function drops() {
        document.getElementById("myDropdowns").classList.toggle("show");
    }

    // Close the dropdown if the user clicks outside of it
    window.onclick = function (event) {
        if (!event.target.matches('.dropbtns')) {
            var dropdowns = document.getElementsByClassName("dropdown-contents");
            var i;
            for (i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];
                if (openDropdown.classList.contains('show')) {
                    openDropdown.classList.remove('show');
                }
            }
        }
    }
</script>
