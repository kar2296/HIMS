apps:
  - name : gloomsoft
    cwd : .
    script : ./dist/dev/index.js
    watch : false
    ignore_watch : [node_modules, .git, logs, tmp, src, typings, .vscode]
    instances : 2
    exec_mode : cluster
    out_file : ./logs/api.log
    error_file : ./logs/error.log
    combine_logs : true
    restart_delay: 3000
    env    :
      NODE_ENV : development
    env_production:
      NODE_ENV: production