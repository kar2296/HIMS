<html>

<head>
  <style>
    .table1 {
      border: 1px solid black;
      font-size: 10px;
    }
    
    .table2 {
      border: 1px solid black;
      border-top: 0px solid black;
      font-size: 10px;
    } 
    
    {{include '/Templates/assets/css/core.css'}}
  </style>
</head>

<body>
  <div id="pageHeader">
    {{{include '/Templates/nkhospital/common/header.tpl.html' 'tpl'}}}
  </div>

  <body>
    <div style="text-align:center;font-size: 8px;"><b>Lab Test Master Price List</b></div>

    <table class="table1" style="width:100%;">
      <tr>
        <td style="width:10%;"><b>S.No</b></td>
        <td style="width:15%"><b>Test Code</b></td>
        <td style="width:40%"><b>Test Name</b></td>
        <td style="width:20%"><b>Category</b></td>
        <td style="width:15%"><b>Basic Price(OP Tariif)</b></td>
      </tr>
    </table>
    <table class="table2" style="width:100%;">
      {{#each data.ServiceItem}}
      <tr>
        <td style="width:10%;">{{inc @index}}</td>
        <td style="width:15%">{{ItemCode}}</td>
        <td style="width:40%">{{Name}}</td>
        <td style="width:20%">{{ParentCategory.ServiceCategoryName}}</td>
        <td style="width:15%">{{Price}}</td>
       </tr>{{/each}}
    </table>

  </body>
  <div style="width:100%; font-size:8px;">Printed On: {{now}}</div>

</html>
