
            <div>{{#if data.SectionValues.Allergy.Data}}
                <div class="left"style="background-color: lightgrey;"><b>Allergy</b></div> 
                <table class="size" style="width:90%">
                    <tr>
                        <th style="width:33%" align="left">Name</th>
                        <th style="width:33%" align="left">Type</th>
                        <th style="width:33%" align="left">Date</th>
                    </tr>                
                    {{#each data.SectionValues.Allergy.Data}}
                    <tr>
                        <td style="width:33%">{{AllergyName}}</td>
                        <td style="width:33%">{{AllergyType.Description}}</td>
                        <td style="width:33%">{{datetimeformat StartDate}}</td>
                    </tr>
                    {{/each}}
                </table>
                {{/if}}
            </div>
