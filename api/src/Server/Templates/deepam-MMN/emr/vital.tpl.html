
<div>{{#if data.SectionValues.Vital.Data}}
    <div class="left"style="background-color: lightgrey;"><b>Vital</b></div> 
    <table class="size" style="width:90%">
        <tr>
            <th style="width:30%" align="left">Vital</th>
            <th style="width:40%" align="left">Value</th>
        </tr>                
        {{#each data.SectionValues.Vital.Data}}
            <tr>
                <td style="width:30%">{{VitalName}}</td>
                <td style="width:40%">{{VitalValue}}{{UOM}}</td>
            </tr>
        {{/each}}
    </table>
    {{/if}}
</div>
